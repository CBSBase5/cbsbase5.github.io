<script>
(function(){
"use strict";

/* ---------- figure: the twelve months ---------- */
var MONTHS = (function(){
  var m = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var s = '<svg viewBox="0 0 380 176" role="img" aria-label="The twelve months in order: January, February, March, April, May, June, July, August, September, October, November, December.">';
  m.forEach(function(t, k){
    var col = k % 3, row = Math.floor(k / 3);
    var x = 4 + col * 125, y = 4 + row * 43;
    var hot = t === "February";
    s += '<rect x="' + x + '" y="' + y + '" width="121" height="37" rx="5" fill="' + (hot ? "#fff1a8" : "#ffffff") + '" stroke="#141a33" stroke-width="2"/>' +
         '<text x="' + (x + 8) + '" y="' + (y + 25) + '" font-family="Space Grotesk,Arial" font-size="13" fill="#6b6785">' + (k + 1) + '</text>' +
         '<text x="' + (x + 66) + '" y="' + (y + 25) + '" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="16" font-weight="700" fill="#141a33">' + t + '</text>';
  });
  return s + '</svg>';
})();

/* ---------- Look, cover, build widget ---------- */
var LCB_WORDS = [
  { w: "said", extra: "e", tip: "Said has <b>ai</b> in the middle. Say it in your head as s, a, i, d." },
  { w: "could", extra: "w", tip: "Could ends in <b>ould</b>. Oh you lucky duck: o, u, l, d." },
  { w: "friend", extra: "a", tip: "There is an <b>end</b> in friend. A friend to the end." },
  { w: "because", extra: "o", tip: "Big elephants can always understand small elephants." },
  { w: "people", extra: "e", tip: "Say it in chunks: peo, ple. There is an <b>o</b> hiding in the middle." }
];
var LCB_MISS = [
  "Not that one yet. Say the word slowly. What comes next?",
  "Nearly. Have another look at the tiles.",
  "Not that one. You could tap Peek for a quick look."
];
var LCB_GOOD = ["Spelt it.", "Yes, that is it.", "Nailed it.", "Lovely."];

function lcbShuffle(word, extra){
  var t = (word + extra).split(""), tries = 0;
  do{
    for(var k = t.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var x = t[k]; t[k] = t[j]; t[j] = x; }
    tries++;
  }while(t.join("").indexOf(word) === 0 && tries < 20);
  return t;
}

function lookCoverBuild(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.phase) d.phase = "look";
  if(!d.used) d.used = [];
  if(!d.tiles) d.tiles = lcbShuffle(LCB_WORDS[0].w, LCB_WORDS[0].extra);
  if(d.miss === undefined) d.miss = 0;
  var msg = "", shake = -1, peek = false, peekTimer = null;

  function W(){ return LCB_WORDS[d.r]; }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }

  function draw(){
    if(d.finished){ drawEnd(); return; }
    var w = W().w, got = d.used.length, html = "";
    var bar = '<div class="lcbbar"><span>Word ' + (d.r + 1) + ' of ' + LCB_WORDS.length + '</span><span>Misses ' + d.miss + '</span></div>';
    if(d.phase === "look"){
      html = '<p class="lcbtip"><b>Look.</b> Say the word. Spot the tricky bit. Then cover it and build it.</p>' +
        '<div class="lcbword">' + w + '</div>' +
        '<div class="lcbrow"><button class="btn" type="button" id="lcbCover">Cover it and build</button></div>';
    }else{
      var slots = "";
      for(var k = 0; k < w.length; k++){
        slots += '<div class="lcbslot' + (k < got ? ' on' : k === got && d.phase === "build" ? ' next' : '') + '">' + (k < got ? w.charAt(k) : '') + '</div>';
      }
      var tiles = "";
      if(d.phase === "build") d.tiles.forEach(function(c, k){
        if(d.used.indexOf(k) >= 0) return;
        tiles += '<button type="button" class="lcbtile" data-k="' + k + '" aria-label="Letter ' + c + '">' + c + '</button>';
      });
      var btns = d.phase === "done" ?
        '<button class="btn" type="button" id="lcbNext">' + (d.r < LCB_WORDS.length - 1 ? "Next word" : "See how you did") + '</button>' :
        '<button class="btn btn-quiet" type="button" id="lcbPeek">Peek</button>' +
        (d.miss > 0 ? '<button class="btn btn-quiet" type="button" id="lcbShow">Show me the next letter</button>' : '');
      html = '<p class="lcbtip">' + (d.phase === "done" ? '<b>Done.</b> ' + W().tip : '<b>Build it.</b> Tap the letters in order. One tile is spare.') + '</p>' +
        (d.phase === "done" || peek ? '<div class="lcbword">' + w + '</div>' : '<div class="lcbword cov">Covered up</div>') +
        '<div class="lcbslots">' + slots + '</div>' +
        '<div class="lcbtiles">' + tiles + '</div>' +
        '<div class="lcbrow">' + btns + '</div>';
    }
    el.innerHTML = '<div class="lcb">' + bar + html +
      '<div class="lcbmsg" aria-live="polite">' + (msg || (d.phase === "look" ? "Take as long as you like." : "Say each sound as you tap it.")) + '</div></div>';
    wire();
  }

  function wire(){
    var cv = el.querySelector("#lcbCover");
    if(cv) cv.onclick = function(){ d.phase = "build"; msg = ""; api.save(); draw(); };
    [].forEach.call(el.querySelectorAll(".lcbtile"), function(b){
      b.onclick = function(){ tap(+b.dataset.k); };
    });
    var pk = el.querySelector("#lcbPeek");
    if(pk) pk.onclick = function(){
      peek = true; msg = "Have a quick look. It covers up again in a moment."; draw();
      clearTimeout(peekTimer);
      peekTimer = setTimeout(function(){ peek = false; msg = ""; if(el.isConnected) draw(); }, 2500);
    };
    var sh = el.querySelector("#lcbShow");
    if(sh) sh.onclick = showNext;
    var nx = el.querySelector("#lcbNext");
    if(nx) nx.onclick = function(){
      msg = "";
      if(d.r < LCB_WORDS.length - 1){
        d.r++; d.phase = "look"; d.used = []; d.tiles = lcbShuffle(W().w, W().extra);
      }else d.finished = true;
      api.save(); draw();
    };
    if(shake >= 0){
      var s = el.querySelector('.lcbtile[data-k="' + shake + '"]');
      if(s) s.classList.add("shake");
      shake = -1;
    }
  }

  function placed(k){
    d.used.push(k);
    if(d.used.length === W().w.length){
      d.phase = "done";
      msg = "<b>" + LCB_GOOD[d.r % LCB_GOOD.length] + "</b> " + W().w + ".";
    }
  }

  function tap(k){
    var want = W().w.charAt(d.used.length);
    if(d.tiles[k] === want){ placed(k); if(d.phase !== "done") msg = ""; }
    else{ d.miss++; shake = k; msg = "<b>Hmm.</b> " + LCB_MISS[d.miss % LCB_MISS.length]; }
    api.save(); draw();
  }

  function showNext(){
    var want = W().w.charAt(d.used.length);
    for(var k = 0; k < d.tiles.length; k++){
      if(d.used.indexOf(k) < 0 && d.tiles[k] === want){
        d.shown = true; placed(k);
        if(d.phase !== "done") msg = "<b>The next letter is " + want + ".</b> Keep going.";
        api.save(); draw(); return;
      }
    }
  }

  function drawEnd(){
    var rank = d.miss === 0 ? "Spelling star" : d.miss <= 2 ? "Word builder" : "Getting there";
    el.innerHTML = '<div class="lcb"><div class="lcbend">' +
      '<p class="lcbtip" style="margin:0">All five words built. Your title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>' + d.miss + ' miss' + (d.miss === 1 ? '' : 'es') + (d.shown ? ', with a little help' : '') + '.</p>' +
      '<p class="lcbtip">said, could, friend, because, people. Look, say, cover, build works for any word.</p>' +
      '<button class="btn btn-quiet" type="button" id="lcbAgain">Play again</button></div></div>';
    el.querySelector("#lcbAgain").onclick = function(){
      d.r = 0; d.phase = "look"; d.used = []; d.tiles = lcbShuffle(LCB_WORDS[0].w, LCB_WORDS[0].extra);
      d.miss = 0; d.shown = false; d.finished = false; msg = "";
      api.save(); draw();
    };
    api.done(result());
  }

  draw();
}

EGW.run({
  id: "spelling",
  title: "Spelling",
  subject: "English",
  blurb: "Days and months, words that trick everyone, adding s or es, long words in chunks, and to, too and two.",
  mins: 35,
  steps: [

  /* ---------- 1. DAYS AND MONTHS ---------- */
  { type: "learn", topic: "Days and months",
    title: "Days and months",
    fig: MONTHS,
    html: "<p>There are 7 days in a week. They all end in <b>day</b>.</p>" +
          "<p>There are 12 months in a year.</p>" +
          "<p>Days and months always start with a capital letter.</p>" +
          '<p>Say <b>Wednesday</b> in chunks: <span class="chunks"><span>Wed</span><span>nes</span><span>day</span></span></p>' +
          '<p>Say <b>February</b> in chunks: <span class="chunks"><span>Feb</span><span>ru</span><span>ary</span></span></p>' +
          '<div class="keep"><b>Keep this</b>Wednesday has a quiet d. February has a quiet r.</div>' },

  { type: "order", topic: "Days and months",
    q: "Put the days of the week in order, starting with Monday.",
    items: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    hint: "Monday is first. The weekend days come last.",
    why: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Saturday and Sunday are the weekend." },

  { type: "mc", topic: "Days and months",
    q: "Which one is spelt right?",
    options: ["Wednesday", "Wensday", "Wendsday", "Wednsday"],
    answer: 0,
    hint: "Say it in chunks: Wed, nes, day.",
    why: "<b>Wednesday.</b> Wed, nes, day. There is a d after the We. You do not hear it." },

  { type: "text", exact: true, topic: "Days and months",
    q: "Type the month that comes after January.",
    need: [["february"]],
    model: "February",
    hint: "It has a quiet r. Say it in chunks: Feb, ru, ary.",
    why: "<b>February.</b> Feb, ru, ary. Lots of people forget the r after the b." },

  { type: "order", topic: "Days and months",
    q: "Put these months in order.",
    items: ["March", "June", "September", "December"],
    hint: "Look back at the months picture if you like. Which is nearest the start of the year?",
    why: "March is month 3. June is 6. September is 9. December is 12." },

  /* ---------- 2. TRICKY WORDS ---------- */
  { type: "learn", topic: "Tricky words",
    title: "Words that trick everyone",
    html: "<p>Some words do not look how they sound. A little trick helps.</p>" +
          '<table class="datatable wordtable">' +
          "<tr><td>because</td><td>Big elephants can always understand small elephants.</td></tr>" +
          "<tr><td>said</td><td>It has ai in the middle.</td></tr>" +
          "<tr><td>friend</td><td>A friend to the end.</td></tr>" +
          "<tr><td>people</td><td>Say it in chunks: peo, ple.</td></tr>" +
          "<tr><td>could, would</td><td>Oh you lucky duck: o, u, l, d.</td></tr></table>" +
          '<div class="keep"><b>Keep this</b>Look at the word. Say it. Cover it. Write it. Check it.</div>' },

  { type: "mc", topic: "Tricky words",
    q: "Which one is spelt right?",
    options: ["because", "becuase", "becos", "beacuse"],
    answer: 0,
    hint: "Big elephants can always understand small elephants.",
    why: "<b>because.</b> Take the first letter of each word in the trick: b, e, c, a, u, s, e." },

  { type: "mc", topic: "Tricky words",
    q: "Which one is spelt right?",
    options: ["friend", "freind", "frend", "frined"],
    answer: 0,
    hint: "A friend to the end.",
    why: "<b>friend.</b> It has the word end at the end. The i comes before the e." },

  { type: "widget", topic: "Tricky words",
    title: "Look, cover, build",
    html: "<p>Look at the word. Cover it up. Then build it from the letter tiles.</p>",
    mount: lookCoverBuild,
    report: function(d){ return d && d.finished ? "Look, cover, build: five words, " + (d.miss || 0) + " misses" + (d.shown ? ", used Show me" : "") : "Look, cover, build: not finished"; } },

  { type: "multi", topic: "Tricky words",
    q: "Tap <b>all</b> the words that are spelt right.",
    options: ["people", "peeple", "could", "cud", "said", "sed"],
    answers: [0, 2, 4],
    hint: "There are three. Use the tricks from the table.",
    why: "<b>people</b>, <b>could</b> and <b>said</b> are right. People has an o in the middle. Could ends in ould. Said has ai in the middle." },

  /* ---------- 3. ADDING S OR ES ---------- */
  { type: "learn", topic: "Adding s or es",
    title: "One, or more than one",
    html: "<p>Most words add <b>s</b> for more than one.</p>" +
          '<p class="eg">one ghost, two ghost<b>s</b></p>' +
          "<p>Words that end in s, x, ch or sh add <b>es</b>.</p>" +
          '<p class="eg">one bus, two bus<b>es</b><br>one torch, two torch<b>es</b></p>' +
          '<div class="keep"><b>Keep this</b>Say it out loud. Can you hear an extra beat? Then add es.</div>' },

  { type: "sort", topic: "Adding s or es",
    q: "To make more than one, do you add s or es?",
    buckets: ["Add s", "Add es"],
    cards: [
      ["cake", 0], ["ghost", 0], ["door", 0], ["light", 0],
      ["box", 1], ["dish", 1], ["torch", 1], ["bus", 1]
    ],
    hint: "Look at the last letters. Do they end in s, x, ch or sh?",
    why: "Cakes, ghosts, doors, lights just add s. Box, dish, torch and bus end in x, sh, ch and s. So they add es: boxes, dishes, torches, buses." },

  { type: "text", exact: true, topic: "Adding s or es",
    q: "One torch, two ___. Type the missing word.",
    need: [["torches"]],
    model: "torches",
    hint: "Torch ends in ch. Say torches out loud. Can you hear the extra beat?",
    why: "<b>torches.</b> Torch ends in ch, so it adds es." },

  { type: "mc", topic: "Adding s or es",
    q: "One fox, three ___",
    options: ["foxes", "foxs", "foxies"],
    answer: 0,
    hint: "Fox ends in x.",
    why: "<b>foxes.</b> Words ending in x add es: box, boxes. Fox, foxes." },

  { type: "text", exact: true, topic: "Adding s or es",
    q: "One cupcake, six ___. Type the missing word.",
    need: [["cupcakes"]],
    model: "cupcakes",
    hint: "Cupcake ends in e. Does it need es, or just s?",
    why: "<b>cupcakes.</b> Cupcake does not end in s, x, ch or sh. So it just adds s." },

  /* ---------- 4. SOUND IT OUT ---------- */
  { type: "learn", topic: "Sound it out",
    title: "Long words in chunks",
    html: "<p>Long words are easier in small chunks.</p>" +
          "<p>Say the word slowly. Clap each beat.</p>" +
          '<p><span class="chunks"><span>hos</span><span>pi</span><span>tal</span></span> has 3 beats.</p>' +
          '<p><span class="chunks"><span>re</span><span>mem</span><span>ber</span></span> has 3 beats.</p>' +
          "<p>Spell one chunk at a time. Then put them together.</p>" +
          '<div class="keep"><b>Keep this</b>Stuck on a long word? Say it slowly, one chunk at a time.</div>' },

  { type: "num", topic: "Sound it out",
    q: "Clap it out. How many beats are in <b>pudding</b>?",
    boxes: [{ label: "Beats", a: 2 }],
    hint: "Say it slowly: pud, and then?",
    why: "pud, ding. That is <b>2</b> beats." },

  { type: "order", topic: "Sound it out",
    q: "Put the chunks in order to make <b>corridor</b>.",
    items: ["cor", "ri", "dor"],
    hint: "Say corridor slowly. What sound do you hear first?",
    why: "cor, ri, dor. Corridor has a double r in the middle." },

  { type: "num", topic: "Sound it out",
    q: "How many beats are in <b>September</b>?",
    boxes: [{ label: "Beats", a: 3 }],
    hint: "Say it slowly and clap: Sep, and then?",
    why: "Sep, tem, ber. That is <b>3</b> beats." },

  { type: "mc", topic: "Sound it out", stretch: true,
    q: "Which one splits <b>Saturday</b> into its beats?",
    options: ["Sat ur day", "S atur day", "Satu rd ay"],
    answer: 0,
    hint: "Say it slowly and clap. Each chunk should sound like part of the word.",
    why: "Sat, ur, day. Each chunk is one beat you can hear." },

  /* ---------- 5. SOUND ALIKES ---------- */
  { type: "learn", topic: "Sound alikes",
    title: "Same sound, different word",
    html: '<table class="datatable wordtable">' +
          "<tr><td>to</td><td>Going somewhere. I went to the shop.</td></tr>" +
          "<tr><td>too</td><td>Too much, or also. It is too dark.</td></tr>" +
          "<tr><td>two</td><td>The number 2. I ate two cakes.</td></tr></table>" +
          '<table class="datatable wordtable">' +
          "<tr><td>there</td><td>A place. Look over there.</td></tr>" +
          "<tr><td>their</td><td>It belongs to them. Their torch.</td></tr></table>" +
          '<div class="keep"><b>Keep this</b>Two has a w, like twins. There has here inside it.</div>' },

  { type: "mc", topic: "Sound alikes",
    q: "<i>I ate ___ cupcakes.</i>",
    options: ["two", "too", "to"],
    answer: 0,
    fixed: true,
    hint: "How many cupcakes?",
    why: "It is the number 2, so it is <b>two</b>." },

  { type: "mc", topic: "Sound alikes",
    q: "<i>It is ___ cold in here.</i>",
    options: ["two", "too", "to"],
    answer: 1,
    fixed: true,
    hint: "It is more cold than you want. Which word means too much?",
    why: "<b>too</b> cold means more cold than you want." },

  { type: "mc", topic: "Sound alikes",
    q: "<i>We walked ___ the car park.</i>",
    options: ["two", "too", "to"],
    answer: 2,
