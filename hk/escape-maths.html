/* the lost property clock, drawn by angle */
function clock(hr, mn){
  var cx = 120, cy = 120, r = 100, s = '';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="6"/>';
  for(var k = 0; k < 60; k++){
    var a = k * 6 * Math.PI / 180, big = k % 5 === 0;
    var r1 = big ? r - 14 : r - 7;
    s += '<line x1="' + (cx + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (cy - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (cx + (r - 3) * Math.sin(a)).toFixed(1) + '" y2="' + (cy - (r - 3) * Math.cos(a)).toFixed(1) + '" stroke="' + INK + '" stroke-width="' + (big ? 3 : 1.2) + '"/>';
  }
  for(var n = 1; n <= 12; n++){
    var b = n * 30 * Math.PI / 180;
    s += '<text x="' + (cx + (r - 30) * Math.sin(b)).toFixed(1) + '" y="' + (cy - (r - 30) * Math.cos(b) + 7).toFixed(1) + '" text-anchor="middle" ' + LAB + ' font-size="20" font-weight="700" fill="' + INK + '">' + n + '</text>';
  }
  var ha = ((hr % 12) + mn / 60) * 30 * Math.PI / 180, ma = mn * 6 * Math.PI / 180;
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + 50 * Math.sin(ha)).toFixed(1) + '" y2="' + (cy - 50 * Math.cos(ha)).toFixed(1) + '" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>';
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + 80 * Math.sin(ma)).toFixed(1) + '" y2="' + (cy - 80 * Math.cos(ma)).toFixed(1) + '" stroke="' + CORAL + '" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + INK + '"/>';
  return svg(240, 240, "A clock face. The short hour hand is nearly at 12, three quarters of the way from 11. The long minute hand points at 9.", s, "small");
}
var CLOCK = clock(11, 45);

/* measuring jug: 0 to 1000 ml, numbers every 200, a mark every 100, oil up to 700 */
var JUG = (function(){
  var x0 = 120, w = 140, yb = 280, px = 0.24, s = '';
  s += '<rect width="380" height="310" rx="12" fill="' + PAPER + '"/>';
  var top = yb - 1000 * px;
  s += '<rect x="' + x0 + '" y="' + (yb - 700 * px) + '" width="' + w + '" height="' + (700 * px) + '" fill="#c8a032" opacity="0.85"/>';
  s += '<path d="M' + x0 + ' ' + (top - 14) + ' L' + x0 + ' ' + yb + ' L' + (x0 + w) + ' ' + yb + ' L' + (x0 + w) + ' ' + (top - 14) + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
  s += '<path d="M' + (x0 + w) + ' ' + (top + 10) + ' Q' + (x0 + w + 50) + ' ' + (top + 20) + ' ' + (x0 + w + 40) + ' ' + (top + 90) + ' Q' + (x0 + w + 34) + ' ' + (top + 130) + ' ' + (x0 + w) + ' ' + (top + 140) + '" fill="none" stroke="' + INK + '" stroke-width="4"/>';
  for(var v = 0; v <= 1000; v += 100){
    var y = yb - v * px, lab = v % 200 === 0;
    s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0 + (lab ? 34 : 20)) + '" y2="' + y + '" stroke="' + INK + '" stroke-width="' + (lab ? 3 : 2) + '"/>';
    if(lab) s += '<text x="' + (x0 - 8) + '" y="' + (y + 6) + '" text-anchor="end" ' + LAB + ' font-size="17" font-weight="700" fill="' + INK + '">' + v + '</text>';
  }
  s += '<text x="' + (x0 - 8) + '" y="' + (top - 22) + '" text-anchor="end" ' + BODY + ' font-size="15" fill="' + INK + '">ml</text>';
  return svg(380, 310, "A measuring jug. The scale has numbers 0, 200, 400, 600, 800 and 1000 ml, with one small mark between each pair of numbers. The oil comes up to the small mark between 600 and 800.", s, "small");
})();

/* bar chart: buses fixed this week */
var CHART = (function(){
  var days = [["Mon", 4], ["Tue", 6], ["Wed", 3], ["Thu", 7], ["Fri", 5]];
  var x0 = 56, yb = 250, py = 26, bw = 40, gap = 22, s = '';

EGW.run({
  id: "escape-maths",
  title: "Escape the night bus",
  subject: "Maths",
  mins: 25,
  blurb: "Asleep on the last bus, awake in an empty depot. Four rooms of maths, one digit in each.",

    digits: ["8", "1", "5", "3"],
    intro: "<p>You fall asleep on the last bus. When you wake up, the bus is parked in the depot. The engine is off.</p>" +

  { type: "mc", topic: "The bus",
    q: "The bus is number 347. What is the 4 worth?",
    fig: PV,
    options: ["40", "4", "400", "47"],
    answer: 0,
    hint: "Which column is the 4 in?",
    why: "The 4 is in the tens column. So it is worth 4 tens. That is <b>40</b>." },

  { type: "mc", topic: "The bus",
    q: "Four buses are parked. Which bus number is the biggest?",
    options: ["490", "409", "449", "94"],
    answer: 0,
    hint: "Look at the hundreds first. If they are the same, look at the tens.",
    why: "94 has no hundreds, so it is the smallest. 409, 449 and 490 all have 4 hundreds. Now look at the tens: 0, 4 and 9. 9 tens is the most. So <b>490</b> is the biggest." },

  { type: "num", topic: "The bus",
    q: "There are 23 seats downstairs. There are 38 seats upstairs. How many seats are there in all?",
    boxes: [ { label: "Seats", a: 61 } ],

    why: "Ones: 3 + 8 = 11. Write 1 and carry 1 ten.<br>Tens: 2 + 3 + 1 = 6.<br>So there are <b>61</b> seats. Forgetting the carried ten gives 51." },

  { type: "num", topic: "The bus",
    q: "There were 52 people on the bus. 18 got off at the hospital. How many were left?",

    hint: "You could count up from 18 to 52. Go to 20 first.",
    why: "Count up from 18. To get to 20 is 2. From 20 to 52 is 32. 2 + 32 = <b>34</b>.<br>Or use columns. You cannot take 8 from 2. So swap a ten for 10 ones. 12 take away 8 is 4. 4 tens take away 1 ten is 3 tens. So 34." },

  /* ---------- ROOM 2: TICKET MACHINE ---------- */
  { type: "learn", topic: "Ticket machine",
    title: "Room 2: the ticket machine",
    fig: BAN_TICKET,
    html: "<p>By the depot door is an old ticket machine. Its screen glows green.</p>" +
          "<p>It beeps once. Then it shows the prices.</p>" +

          '<div class="keep"><b>Keep this</b>&pound;1 is 100p. To find change, count up from the price to the money you paid.</div>' },

  { type: "num", topic: "Ticket machine",
    q: "How much do 2 single tickets cost?",

  { type: "num", topic: "Ticket machine",
    q: "How many pence is &pound;1.50?",

    why: "&pound;1 is 100p. Add the 50p. 100 + 50 = <b>150p</b>." },

  { type: "num", topic: "Ticket machine",
    q: "You buy a return ticket. You pay with a &pound;5 note. How much change do you get?",
    fig: PRICES,
