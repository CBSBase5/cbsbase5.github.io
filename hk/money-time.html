/* ---------- coins and notes ---------- */
/* real diameters in mm; drawn at 0.8 units per mm as a radius */

  "5p":  { d: 18.0, col: "#d9dbe0", lab: "5p" },

  "50p": { d: 27.3, col: "#d9dbe0", lab: "50p", sides: 7 },

  "2":   { d: 28.4, col: "#e3c35a", inner: "#d9dbe0", lab: "&pound;2" }
};
function rad(k){ return COIN[k].d * 0.8; }
function poly(cx, cy, r, n, curved){
  var p = "", k, a, b;
  for(k = 0; k < n; k++){
    a = (k / n) * 2 * Math.PI - Math.PI / 2;
    var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if(k === 0){ p += "M" + f1(x) + " " + f1(y); continue; }
    if(curved){
      b = ((k - 0.5) / n) * 2 * Math.PI - Math.PI / 2;

    }else p += " L" + f1(x) + " " + f1(y);
  }
  if(curved){
    b = ((n - 0.5) / n) * 2 * Math.PI - Math.PI / 2;
    a = -Math.PI / 2;
    p += " Q" + f1(cx + r * 1.12 * Math.cos(b)) + " " + f1(cy + r * 1.12 * Math.sin(b)) + " " + f1(cx + r * Math.cos(a)) + " " + f1(cy + r * Math.sin(a));
  }
  return p + " Z";
}
function coin(cx, cy, k){
  var c = COIN[k], r = rad(k), s = "";
  if(c.sides === 7) s += '<path d="' + poly(cx, cy, r * 0.95, 7, true) + '" fill="' + c.col + '" stroke="' + INK + '" stroke-width="2.5"/>';
  else if(c.sides === 12) s += '<path d="' + poly(cx, cy, r, 12, false) + '" fill="' + c.col + '" stroke="' + INK + '" stroke-width="2.5"/>';
  else s += '<circle cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(r) + '" fill="' + c.col + '" stroke="' + INK + '" stroke-width="2.5"/>';
  if(c.inner) s += '<circle cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(r * 0.68) + '" fill="' + c.inner + '" stroke="' + INK + '" stroke-width="1.5"/>';
  s += t(cx, cy + 5, c.lab, 14, INK, LAB + ' font-weight="800" text-anchor="middle"');

}

function coinRow(keys, y, gap){
  var w = 0, k;
  for(k = 0; k < keys.length; k++) w += 2 * rad(keys[k]);
  w += gap * (keys.length - 1);
  var x = 200 - w / 2, s = "";
  for(k = 0; k < keys.length; k++){ var r = rad(keys[k]); s += coin(x + r, y, keys[k]); x += 2 * r + gap; }
  return s;
}

var CHANGE = (function(){

/* ---------- clocks ---------- */
/* tm = minutes after 12:00 */
function face(cx, cy, r, tm){
  var big = r > 80, s = "";
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="' + (big ? 5 : 3.5) + '"/>';
  for(var m = 0; m < 60; m++){
    var b = m * 6 * Math.PI / 180, r1 = m % 5 ? r * 0.93 : r * 0.87;
    s += ln(cx + r1 * Math.sin(b), cy - r1 * Math.cos(b), cx + (r - 2) * Math.sin(b), cy - (r - 2) * Math.cos(b), INK, m % 5 ? 1 : 2.5);
  }
  var nr = r * 0.72, ns = Math.max(14, Math.min(24, Math.round(r * 0.2)));
  for(var k = 1; k <= 12; k++){
    var a = k * 30 * Math.PI / 180;
    s += t(cx + nr * Math.sin(a), cy - nr * Math.cos(a) + ns * 0.36, String(k), ns, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  var ha = ((tm % 720) / 60) * 30 * Math.PI / 180, ma = (tm % 60) * 6 * Math.PI / 180;
  s += ln(cx, cy, cx + r * 0.38 * Math.sin(ha), cy - r * 0.38 * Math.cos(ha), INK, big ? 9 : 6, ' stroke-linecap="round"');
  s += ln(cx, cy, cx + r * 0.58 * Math.sin(ma), cy - r * 0.58 * Math.cos(ma), BLUE, big ? 6 : 4, ' stroke-linecap="round"');
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (big ? 8 : 5) + '" fill="' + INK + '"/>';
  return s;
}
function tmOf(h, m){ return (h % 12) * 60 + m; }
function clock(h, m, aria){

}

}

var FOUR = (function(){
  var s = '<svg viewBox="0 0 400 420" role="img" aria-label="Four clocks. 3 o&#39;clock. Quarter past 3, with the long hand on 3. Half past 3, with the long hand on 6. Quarter to 4, with the long hand on 9.">';
  var c = [[100, 92, 3, 0, "3 o&#39;clock"], [300, 92, 3, 15, "Quarter past 3"], [100, 302, 3, 30, "Half past 3"], [300, 302, 3, 45, "Quarter to 4"]];
  c.forEach(function(k){
    s += face(k[0], k[1], 76, tmOf(k[2], k[3]));
    s += t(k[0], k[1] + 104, k[4], 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  });
  s += '</svg>';

})();

var PAIRS = (function(){
  var s = '<svg viewBox="0 0 400 386" role="img" aria-label="Three clocks with their digital times. Quarter past 7 is 7:15. Half past 7 is 7:30. Quarter to 8 is 7:45.">';
  var c = [[7, 15, "7:15", "Quarter past 7"], [7, 30, "7:30", "Half past 7"], [7, 45, "7:45", "Quarter to 8"]];

})();

/* Time line: half past 2 to 3 to 4, drawn to scale (100 units an hour) */
var HOWLONG = (function(){
  var s = '<svg viewBox="0 0 400 170" role="img" aria-label="A time line. From half past 2 to 3 o&#39;clock is half an hour. From 3 o&#39;clock to 4 o&#39;clock is 1 hour. Total 1 and a half hours.">';

  s += arc(160, 360, 100, 96, BLUE) + t(260, 40, "1 hour", 17, BLUE, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(200, 168, "Total: 1 and a half hours", 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';

})();

var HOURS = '<table class="mt-menu mt-hours"><caption>Midnight Caf&eacute; opening times</caption>' +
  '<tr><th>Day</th><th>Open</th></tr>' +
  '<tr><td>Monday</td><td>Closed</td></tr>' +

/* ---------- Set the clock widget ---------- */
function hr(h){ h = h % 12; return String(h === 0 ? 12 : h); }
function say(tm){
  tm = ((tm % 720) + 720) % 720;
  var h = Math.floor(tm / 60), m = tm % 60;
  if(m === 0) return hr(h) + " o'clock";
  if(m === 15) return "quarter past " + hr(h);
  if(m === 30) return "half past " + hr(h);
  if(m === 45) return "quarter to " + hr(h + 1);
  return hr(h) + ":" + (m < 10 ? "0" : "") + m;
}
function dig(tm){
  tm = ((tm % 720) + 720) % 720;
  var m = tm % 60;
  return hr(Math.floor(tm / 60)) + ":" + (m < 10 ? "0" : "") + m;
}
var SC = [
  { tm: tmOf(7, 30), note: "The night bus comes at <b>half past 7</b>.",
    how: "Half past: the long hand points to 6. The short hand sits half way between 7 and 8." },
  { tm: tmOf(2, 15), note: "The lights flicker at <b>quarter past 2</b>.",
    how: "Quarter past: the long hand points to 3. The short hand is just past 2." },
  { tm: tmOf(8, 45), note: "Jay says: lock up at <b>quarter to 9</b>.",
    how: "Quarter to 9 is 15 minutes before 9 o'clock. The long hand points to 9. The short hand is nearly at 9, but not there yet." }
];

function mountClock(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  if(typeof d.tm !== "number") d.tm = 0;
  var view = Math.min(d.c, 2), landed = false, dragging = false;

  el.innerHTML =
    '<div class="wpanel sc-task" data-r="task"></div>' +
    '<div class="fig sc-fig" data-r="svg"></div>' +
    '<div class="wrow sc-turn">' +
      '<button class="btn btn-quiet" type="button" data-act="mb">Back 15 min</button>' +
      '<button class="btn btn-quiet" type="button" data-act="mf">On 15 min</button>' +
      '<button class="btn btn-quiet" type="button" data-act="hb">Back 1 hour</button>' +
      '<button class="btn btn-quiet" type="button" data-act="hf">On 1 hour</button>' +
    '</div>' +
    '<div class="wrow">' +
      '<button class="btn" type="button" data-act="check">Start the clock</button>' +
      '<button class="btn btn-quiet hidden" type="button" data-act="show">Show me</button>' +
    '</div>' +
    '<div class="fb sc-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  function act(a){ return el.querySelector('[data-act="' + a + '"]'); }

  function paint(){
    var s = '<svg viewBox="0 0 300 372" role="img" aria-label="A clock with its hands set. Drag the long blue hand round, or use the buttons.">';
    s += '<rect x="6" y="6" width="288" height="288" rx="30" fill="#5a4632" stroke="' + INK + '" stroke-width="3"/>';
    s += face(150, 150, 132, d.tm);
    s += digi(150, 336, landed || d.c >= 3 ? dig(d.tm) : "?:??");
    s += '</svg>';
    q("svg").innerHTML = s;
  }
  function draw(){
    var dots = '<div class="sc-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && d.c < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    q("task").innerHTML = dots + (d.c >= 3 ?
      '<p><b>Free play.</b> The clock is fixed. Turn the hands and watch the digital time.</p>' :
      '<p class="tiny" style="margin:0 0 6px">Clock ' + (view + 1) + ' of 3. The big clock in the empty hall has stopped. A note says:</p><p class="sc-note">' + SC[view].note + '</p>');
    paint();
    var wait = landed || d.c >= 3;
    act("check").classList.toggle("hidden", d.c >= 3);
    act("check").disabled = wait;
    act("show").classList.toggle("hidden", wait || !d.miss[view]);
    ["mb", "mf", "hb", "hf"].forEach(function(a){ act(a).disabled = landed; });
  }
  function setT(v){ d.tm = ((v % 720) + 720) % 720; api.save(); paint(); }
  function fb(cls, html){
    var f = q("fb");
    if(!cls){ f.className = "fb sc-fb hidden"; f.innerHTML = ""; return; }
    f.className = "fb sc-fb " + cls; f.innerHTML = html;
  }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function win(viaShow){
    var k = view;
    landed = true;
    if(viaShow) d.shown[k] = true;
    d.c = k + 1;
    if(d.c >= 3) d.result = result();
    api.save();
    var head = viaShow ? "<b>Here is how this one works.</b> " : "<b>" + ["Tick tock. The clock is going again.", "The hall clock chimes. Spot on.", "Locked up on time. Nice."][k] + "</b> ";
    var more = k < 2 ? '<br><button class="btn" type="button" data-act="next">Next clock</button>' :
      '<p style="margin:8px 0 0">All three clocks set. Long hand for minutes, short hand for hours.</p><button class="btn" type="button" data-act="next">Free play</button>';
    fb(viaShow ? "show" : "good", head + SC[k].how + " On a digital clock it is " + dig(SC[k].tm) + "." + more);
    draw();
    if(k === 2) api.done(d.result);
  }
  function check(){
    if(landed || d.c >= 3) return;
    var want = SC[view].tm;
    if(d.tm === want){ win(false); return; }
    d.miss[view]++; api.save();
    var mOk = d.tm % 60 === want % 60;
    var msg = "Your clock says <b>" + say(d.tm) + "</b>. ";
    if(mOk) msg += "The long hand is right. Now move the hour.";
    else msg += "Look at the long hand first. Where should it point?";
    fb("nudge", "<b>Not quite yet.</b> " + msg + (d.miss[view] > 1 ? " Show me is there if you want it." : ""));
    draw();
  }

  el.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b || !el.contains(b)) return;
    var a = b.getAttribute("data-act");
    if(!landed){
      if(a === "mf") setT(d.tm + 15);
      else if(a === "mb") setT(d.tm - 15);
      else if(a === "hf") setT(d.tm + 60);
      else if(a === "hb") setT(d.tm - 60);
    }
    if(a === "check") check();
    else if(a === "show"){
      if(landed || d.c >= 3) return;
      d.tm = SC[view].tm; win(true);
    }else if(a === "next"){
      landed = false; fb(null);
      view = Math.min(d.c, 2); d.tm = 0; api.save(); draw();
    }
  });

  /* drag the long hand: it clicks round in quarters, and the short hand follows */
  function fromPointer(e){
    var sv = q("svg").querySelector("svg");
    if(!sv) return;
    var r = sv.getBoundingClientRect();
    var x = (e.clientX - r.left) * 300 / r.width - 150, y = (e.clientY - r.top) * 372 / r.height - 150;
    var deg = Math.atan2(x, -y) * 180 / Math.PI;
    if(deg < 0) deg += 360;
    var nm = (Math.round(deg / 90) * 15) % 60, cm = d.tm % 60;
    var diff = nm - cm;
    if(diff > 30) diff -= 60;
    if(diff <= -30) diff += 60;
    if(diff) setT(d.tm + diff);
  }
  q("svg").addEventListener("pointerdown", function(e){
    if(landed) return;
    dragging = true;
    try{ q("svg").setPointerCapture(e.pointerId); }catch(err){}
    fromPointer(e); e.preventDefault();
  });
  q("svg").addEventListener("pointermove", function(e){ if(dragging && !landed) fromPointer(e); });
  function stop(){ dragging = false; }
  q("svg").addEventListener("pointerup", stop);
  q("svg").addEventListener("pointercancel", stop);

  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three clocks set.</b> Free play is open. Turn the hands and watch the digital time.");
    api.done(d.result);
  }
}
