/* ---------- Torch hunt ---------- */
var TH_W = 360, TH_H = 460, TH_R = 80;
var TH_ITEMS = [

];
var TH_ROUNDS = [
  { q: "Find the day.", a: "day", hint: "A day is a word like Monday or Friday.",

];

function thPosterSVG(){

    '<circle cx="55" cy="291" r="6"/><circle cx="105" cy="296" r="6" fill="#ff5d5d"/><circle cx="155" cy="288" r="6" fill="#19c39a"/>' +
    '<circle cx="205" cy="288" r="6"/><circle cx="255" cy="296" r="6" fill="#8a5cf6"/><circle cx="305" cy="291" r="6" fill="#22b8e6"/></g>' +
    '<g id="thItems" font-family="Space Grotesk,Arial" fill="#141a33" text-anchor="middle"></g>' +

function torchHunt(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.res) d.res = [];
  if(d.t === undefined) d.t = 0;
  if(d.miss === undefined) d.miss = 0;
  if(d.x === undefined){ d.x = 180; d.y = 230; }
  var msg = "", boxes = {}, outers = {}, svg, stage, dragging = false, start = null, prev = null, moved = 0;

  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }
  function firstGo(){ return d.res.filter(function(x){ return x === "1"; }).length; }
  function solved(){ return d.res.length > d.r; }
  function item(id){ for(var k = 0; k < TH_ITEMS.length; k++) if(TH_ITEMS[k].id === id) return TH_ITEMS[k]; return null; }
  function plain(t){ var x = document.createElement("div"); x.innerHTML = t; return x.textContent; }

  function draw(){
    var done = d.r >= TH_ROUNDS.length;
    var R = TH_ROUNDS[Math.min(d.r, TH_ROUNDS.length - 1)];
    var row = "";
    if(done) row = '<button class="btn btn-quiet" type="button" id="thAgain">Play again</button>';
    else if(solved()) row = '<button class="btn" type="button" id="thNext">' + (d.r === TH_ROUNDS.length - 1 ? "Lights on" : "Next find") + '</button>';
    else if(d.t >= 2) row = '<button class="btn btn-quiet" type="button" id="thShow">Show me</button>';
    if(!msg){
      if(done) msg = "";
      else if(solved()) msg = "<b>Found it.</b> " + R.got;
      else if(d.r === 0 && d.t === 0) msg = "Drag the torch, or tap where you want it to go. When you see the answer, tap it.";
      else msg = "Move the torch. Tap the answer when you see it.";
    }
    var top;
    if(done){
      var dots = d.res.map(function(x){
        var col = x === "1" ? "#19c39a" : x === "2" ? "#22b8e6" : "#ffd23f";
        return '<i style="background:' + col + '">' + (x === "s" ? "S" : x) + '</i>';
      }).join("");
      top = '<div class="thfind thend"><small>Lights on</small><div class="big">All 5 found!</div>' +
        '<p class="thmsg">' + firstGo() + ' of 5 found first go' + (d.shown ? ', with a bit of help from Show me' : '') + '. You hunted for the shape of each answer. That is how good readers do it.</p>' +
        '<div class="thdots" aria-label="How each find went">' + dots + '</div><div class="throw">' + row + '</div></div>';
    }else{
      top = '<div class="thfind"><small>Find this</small><p class="thq">' + R.q + '</p>' +
        '<div class="thmsg" aria-live="polite">' + msg + '</div><div class="throw">' + row + '</div></div>';
    }
    el.innerHTML = '<div class="th"><div class="thbar"><span>Find ' + Math.min(d.r + 1, TH_ROUNDS.length) + ' of ' + TH_ROUNDS.length + '</span><span>First go: ' + firstGo() + '</span></div>' +
      top + '<div class="thstage' + (done ? ' lit' : '') + '" tabindex="0" aria-label="The dark poster. Arrow keys move the torch. Enter picks the words under it.">' + thPosterSVG() + '</div>' +
      (done ? '' : '<p class="thtip">Keyboard: arrow keys move the torch. Enter picks.</p>') + '</div>';
    svg = el.querySelector("svg");
    stage = el.querySelector(".thstage");
    var g = svg.querySelector("#thItems");
    var NS = "http://www.w3.org/2000/svg";
    TH_ITEMS.forEach(function(it){
      var outer = document.createElementNS(NS, "g");
      var inner = document.createElementNS(NS, "g");
      if(it.rot) inner.setAttribute("transform", "rotate(" + it.rot + " " + it.x + " " + it.y + ")");
      var t = document.createElementNS(NS, "text");
      t.setAttribute("x", it.x); t.setAttribute("y", it.y);
      t.setAttribute("font-size", it.size);
      if(it.bold) t.setAttribute("font-weight", "700");
      if(it.fill) t.setAttribute("fill", it.fill);
      t.textContent = plain(it.t);
      inner.appendChild(t); outer.appendChild(inner); g.appendChild(outer);
      outers[it.id] = outer;
    });
    measure();
    placeTorch();
    var nx = el.querySelector("#thNext");
    if(nx) nx.onclick = function(){ d.r++; d.t = 0; msg = ""; api.save(); draw(); if(d.r >= TH_ROUNDS.length) finish(); };
    var sh = el.querySelector("#thShow");
    if(sh) sh.onclick = showMe;
    var ag = el.querySelector("#thAgain");
    if(ag) ag.onclick = function(){ d.r = 0; d.res = []; d.t = 0; d.miss = 0; d.shown = false; d.finished = false; d.x = 180; d.y = 230; msg = ""; api.save(); draw(); };
    if(solved() && !done) markItem(R.a, d.res[d.r] === "s" ? "#e0a800" : "#19c39a");
    if(!done){
      svg.addEventListener("pointerdown", down);
      svg.addEventListener("pointermove", move);
      svg.addEventListener("pointerup", up);
      svg.addEventListener("pointercancel", function(){ dragging = false; });
      stage.addEventListener("keydown", key);
    }
  }

  /* measured again on each touch, in case the font loads late */
  function measure(){
    TH_ITEMS.forEach(function(it){
      var b = outers[it.id].getBBox();
      boxes[it.id] = { x: b.x, y: b.y, w: b.width, h: b.height };
    });
  }
  function placeTorch(){
    var c = svg.querySelector("#thHole"), ring = svg.querySelector("#thRing");
    c.setAttribute("cx", d.x); c.setAttribute("cy", d.y);
    ring.setAttribute("cx", d.x); ring.setAttribute("cy", d.y);
  }
  function markItem(id, col){
    var b = boxes[id], m = svg.querySelector("#thMark");
    m.setAttribute("x", b.x - 6); m.setAttribute("y", b.y - 4);
    m.setAttribute("width", b.w + 12); m.setAttribute("height", b.h + 8);
    m.setAttribute("stroke", col); m.setAttribute("visibility", "visible");
  }
  function pt(e){
    var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    var q = p.matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.max(0, Math.min(TH_W, q.x)), y: Math.max(0, Math.min(TH_H, q.y)) };
  }
  function inBox(id, x, y, pad){
    var b = boxes[id];
    return x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad;
  }
  function itemAt(x, y, pad){
    for(var k = 0; k < TH_ITEMS.length; k++) if(inBox(TH_ITEMS[k].id, x, y, pad)) return TH_ITEMS[k];
    return null;
  }
  function lit(id, tx, ty){
    /* lit when the bright middle of the torch touches the words */
    var b = boxes[id];
    var cx = Math.max(b.x, Math.min(tx, b.x + b.w)), cy = Math.max(b.y, Math.min(ty, b.y + b.h));
    var dx = tx - cx, dy = ty - cy;
    return Math.sqrt(dx * dx + dy * dy) <= TH_R * 0.6;
  }
  function setMsg(m){
    msg = m;
    var box = el.querySelector(".thmsg");
    if(box) box.innerHTML = m;
  }

  function down(e){
    if(solved()) return;
    e.preventDefault();
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    if(document.activeElement !== stage){ try{ stage.focus({ preventScroll: true }); }catch(err){} }
    dragging = true; moved = 0; measure();
    start = pt(e); prev = { x: d.x, y: d.y };
    d.x = start.x; d.y = start.y; placeTorch();
  }
  function move(e){
    if(!dragging) return;
    var p = pt(e);
    moved += Math.abs(p.x - d.x) + Math.abs(p.y - d.y);
    d.x = p.x; d.y = p.y; placeTorch();
  }
  function up(e){
    if(!dragging) return;
    dragging = false;
    api.save();
    if(moved < 10){
      var it = itemAt(start.x, start.y, 6);
      if(it && lit(it.id, prev.x, prev.y)){ pick(it); return; }
      if(it) setMsg("Is that the answer? If it is, tap it again.");
    }
  }
  function key(e){
    if(solved()) return;
    var step = 20, k = e.key;
    measure();
    if(k === "ArrowLeft") d.x = Math.max(0, d.x - step);
    else if(k === "ArrowRight") d.x = Math.min(TH_W, d.x + step);
    else if(k === "ArrowUp") d.y = Math.max(0, d.y - step);
    else if(k === "ArrowDown") d.y = Math.min(TH_H, d.y + step);
    else if(k === "Enter" || k === " "){
      e.preventDefault();
      var best = null, bd = 1e9;
      TH_ITEMS.forEach(function(it){
        if(!lit(it.id, d.x, d.y)) return;
        var b = boxes[it.id], dx = d.x - (b.x + b.w / 2), dy = d.y - (b.y + b.h / 2), dd = dx * dx + dy * dy;
        if(dd < bd){ bd = dd; best = it; }
      });
      if(best) pick(best); else setMsg("Move the torch onto some words first.");
      return;
    }
    else return;
    e.preventDefault();
    placeTorch(); api.save();
  }

  function pick(it){
    var R = TH_ROUNDS[d.r];
    if(it.id === R.a){
      d.res.push(d.t ? "2" : "1");

  }

    if(solved()) return;
    var b = boxes[R.a];

}
