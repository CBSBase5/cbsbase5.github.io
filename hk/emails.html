/* an email */
.mail{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;margin:10px auto;max-width:460px;text-align:left;overflow:hidden;font-size:1.04rem;line-height:1.5}
.mail .mh{background:#eef0f7;padding:8px 12px;border-bottom:2px solid var(--line)}
.mail .mh div{display:flex;gap:8px;padding:2px 0}
.mail .mh b{flex:0 0 76px;color:#4b5275;font-family:var(--display);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}

/* phone texts */
.phone{background:#141a33;border-radius:22px;padding:12px 12px 14px;max-width:340px;margin:10px auto;text-align:left}
.phone .who{color:#fbf8e4;text-align:center;font-family:var(--display);font-weight:700;font-size:.9rem;margin:0 0 8px}

.bub.them{background:#e9e8f3;border-bottom-left-radius:4px}

/* a sticky note */

.sticky p{margin:0 0 6px}
.sticky p:last-child{margin:0}

<script>
(function(){
"use strict";

/* All emails and messages are original, written for this page.
   People and places are made up. */

/* An email: head is [[label, text]], body is a list of lines.
   tags (optional) labels lines for the learn card. */
function mail(head, body, tags){
  tags = tags || {};
  var out = '<div class="mail"><div class="mh">';
  head.forEach(function(r){
    out += '<div><b>' + r[0] + '</b><span>' + r[1] + (tags[r[0]] ? ' <span class="tag">' + tags[r[0]] + '</span>' : '') + '</span></div>';
  });
  out += '</div><div class="mb">';
  body.forEach(function(l, k){
    out += '<p>' + l + (tags[k] ? '<span class="tag">' + tags[k] + '</span>' : '') + '</p>';
  });
  return out + '</div></div>';
}

var RAY_HEAD = [["From", "Ray, night guard"], ["To", "Mo, morning guard"], ["Subject", "Night shift handover"]];
var RAY_BODY = [
  "Hi Mo,",
  "It was a quiet night at the shopping centre.",
  "The light in the car park lift keeps flickering. Can you call the electrician?",
  "Pat the cleaner found a red scarf by the fountain. It is in the office.",
  "See you tonight,",
  "Ray"
];
var EMAIL_RAY = mail(RAY_HEAD, RAY_BODY);
var EMAIL_RAY_TAGS = mail(RAY_HEAD, RAY_BODY, { From: "who wrote it", To: "who it is for", Subject: "what it is about", 0: "greeting", 4: "sign off" });

var EMAIL_DEE = mail(
  [["From", "Dee, cafe manager"], ["To", "All cafe staff"], ["Subject", "New pudding"]],
  [
    "Hello everyone,",
    "From Friday, we will sell a new pudding. It is called Midnight Mess.",
    "It costs &pound;4.50.",
    "Please try it before Friday. Then you can tell customers about it.",
    "There is one for each of you in the big fridge.",
    "Thanks,",
    "Dee"
  ]);

var EMAIL_SAM = mail(
  [["From", "Sam, caretaker"], ["To", "Night team"], ["Subject", "Back gate"]],
  [
    "Hi team,",
    "The lock on the back gate is stiff.",
    "Please lift the handle before you turn the key.",
    "Could you also leave the yard light on?",
    "Thanks,",
    "Sam"
  ]);

var EMAIL_LOU = mail(
  [["From", "Lou, night porter"], ["To", "Ward 4 team"], ["Subject", "That strange noise"]],
  [
    "Hi all,",
    "At 2am I heard a strange scratching noise.",
    "It came from the store cupboard on the second floor.",
    "I was a bit scared, so I asked Ali to come with me.",
    "We opened the door very slowly.",
    "It was a cat! It had come in through an open window.",
    "We gave it some water and took it outside.",
    "Please keep the cupboard window shut.",
    "Lou"
  ]);

var EMAIL_ASK = mail(
  [["From", "Dee, cafe manager"], ["To", "HK"], ["Subject", "Can you help on Friday?"]],
  [
    "Hi HK,",
    "Could you help at the cafe on Friday at 6pm?",
    "Thanks,",
    "Dee"
  ]);

var PHONE =
'<div class="phone"><p class="who">Kit</p>' +
'<div class="bub them"><small>Kit</small>Do you want to see a film tonight?</div>' +
'<div class="bub me"><small>You</small>Yes! Which one?</div>' +
'<div class="bub them"><small>Kit</small>Lights Out at the Shopping Centre. It starts at 8pm.</div>' +
'<div class="bub them"><small>Kit</small>Meet me outside the cinema at 7:45.</div>' +
'<div class="bub them"><small>Kit</small>Bring a jumper, because it is cold in there!</div>' +
'</div>';

var NOTE =
'<div class="sticky"><p>Mo,</p>' +
'<p>The clicking in the walls at night is just the heating pipes.</p>' +
'<p>Nothing spooky!</p>' +
'<p>Ray</p></div>';

EGW.run({
  id: "emails",
  title: "Emails and messages",
  subject: "English",
  mins: 30,
  blurb: "A night guard's handover, a cafe manager, a strange noise in a hospital and some texts. Find who, what, when, where and why.",
  steps: [

  /* ---------- 1 PARTS OF AN EMAIL ---------- */
  { type: "learn", topic: "Parts of an email",
    title: "The parts of an email",
    html: '<p>An email has the same parts every time.</p>' +
          '<ul><li><b>From</b> says who wrote it.</li><li><b>To</b> says who it is for.</li>' +
          '<li><b>Subject</b> says what it is about.</li><li>The <b>greeting</b> says hello.</li>' +
          '<li>The <b>sign off</b> says goodbye.</li></ul>' +
          '<div class="keep"><b>Keep this</b>Look at the top first. From, To and Subject tell you a lot.</div>' +
          '<p>Here is an email from a night guard at a shopping centre.</p>' + EMAIL_RAY_TAGS },

  { type: "match", topic: "Parts of an email",
    q: "Match each part of an email to its job.",
    pairs: [
      ["From", "Who wrote it"],
      ["To", "Who it is for"],
      ["Subject", "What it is about"],
      ["Greeting", "Says hello"],
      ["Sign off", "Says goodbye"]
    ],
    hint: "From is where it came from. To is where it is going.",
    why: "From, To and Subject sit at the top. The greeting starts the message. The sign off ends it." },

  { type: "mc", topic: "Parts of an email",
    q: "Who wrote this email?",
    fig: EMAIL_RAY,
    options: ["Ray", "Mo", "Pat", "The electrician"],
    answer: 0,
    hint: "Look at the From line.",
    why: "The From line says <b>Ray</b>. His name is at the bottom too. Mo is the person it is for." },

  { type: "mc", topic: "Parts of an email",
    q: "Which line is the greeting?",
    fig: EMAIL_RAY,
    options: ["Hi Mo,", "See you tonight,", "Night shift handover", "It was a quiet night"],
    answer: 0,
    hint: "A greeting says hello. It comes first.",
    why: "<b>Hi Mo,</b> is the greeting. It says hello to the person reading." },

  { type: "mc", topic: "Parts of an email",
    q: "Which line is the sign off?",
    fig: EMAIL_RAY,
    options: ["See you tonight,", "Hi Mo,", "Night shift handover", "Can you call the electrician?"],
    answer: 0,
    hint: "A sign off says goodbye. It comes just before the name.",
    why: "<b>See you tonight,</b> is the sign off. Ray writes his name under it." },

  /* ---------- 2 WHO AND WHAT ---------- */
  { type: "learn", topic: "Who and what",
    title: "Who is it for? What is it about?",
    html: '<p>The <b>To</b> line tells you who will read it.</p>' +
          '<p>The <b>Subject</b> line is like a title. It tells you what the email is about.</p>' +
          '<div class="keep"><b>Keep this</b>To find what an email is about, read the subject. Then read the first line.</div>' +
          '<p>Here is an email from the manager of a late night cafe.</p>' + EMAIL_DEE },

  { type: "mc", topic: "Who and what",
    q: "Who is the email for?",
    fig: EMAIL_DEE,
    options: ["All the cafe staff", "Dee", "The customers", "Ray"],
    answer: 0,
    hint: "Look at the To line.",
    why: "The To line says <b>All cafe staff</b>. Dee wrote it. The customers will hear about the pudding later." },

  { type: "mc", topic: "Who and what",
    q: "What is the email about?",
    fig: EMAIL_DEE,
    options: ["A new pudding", "A broken fridge", "A staff party", "Opening times"],
    answer: 0,
    hint: "Read the Subject line.",
    why: "The subject is <b>New pudding</b>. The first line says it too. The fridge is only where the puddings are kept." },

  { type: "num", topic: "Who and what",
    q: "How much will Midnight Mess cost?",
    fig: EMAIL_DEE,
    boxes: [ { label: "Price", a: 4.5, pre: "&pound;" } ],
    hint: "Look for the pound sign.",
    why: "It costs <b>&pound;4.50</b>. That is 4 pounds and 50 pence." },

  { type: "mc", topic: "Who and what",
    q: "Mo gets a new email. The subject is <b>Car park lift</b>. What is it about?",
    options: ["The lift in the car park", "A new car", "A lost scarf", "Lunch"],
    answer: 0,
    hint: "The subject is like a title. What does it name?",
    why: "The subject names the <b>lift in the car park</b>. You can tell what an email is about before you open it." },

  /* ---------- 3 WHAT THEY WANT ---------- */
  { type: "learn", topic: "What they want",
    title: "What does the writer want?",
    html: '<p>Lots of emails ask you to do something.</p>' +
          '<p>Look for asking words:</p>' +
          '<ul><li><b>Please</b></li><li><b>Can you</b></li><li><b>Could you</b></li></ul>' +
          '<p>Read what comes next. That is what they want.</p>' +
          '<div class="keep"><b>Keep this</b>Find please or can you. The job comes straight after.</div>' },

  { type: "mc", topic: "What they want",
    q: "Which words show the writer is asking you to do something?",
    options: ["Can you", "It was", "See you", "From Friday"],
    answer: 0,
    hint: "Which one starts a question that asks for help?",
    why: "<b>Can you</b> asks someone to do something. Can you call the electrician?" },

  { type: "mc", topic: "What they want",
    q: "What does Ray want Mo to do?",
    fig: EMAIL_RAY,
    options: ["Call the electrician", "Find the cleaner", "Lock the office", "Fix the fountain"],
    answer: 0,
    hint: "Find the words Can you.",
    why: "Ray writes: Can you <b>call the electrician</b>? The light in the lift keeps flickering." },

  { type: "mc", topic: "What they want",
    q: "What does Dee want the staff to do before Friday?",
    fig: EMAIL_DEE,
    options: ["Try the new pudding", "Clean the fridge", "Make a pudding", "Come in early"],
    answer: 0,
    hint: "Find the word Please.",
    why: "Dee writes: Please <b>try it</b> before Friday. Then the staff can tell customers about it." },

  { type: "multi", topic: "What they want",
    q: "Sam asks for two things. Pick two.",
    fig: EMAIL_SAM,
    options: ["Lift the handle before you turn the key", "Leave the yard light on", "Buy a new lock", "Leave the gate open"],
    answers: [0, 1],
    hint: "Find Please and Could you.",
    why: "Please <b>lift the handle</b> before you turn the key. Could you also <b>leave the yard light on</b>? Sam does not ask for a new lock." },

  /* ---------- 4 FINDING DETAILS ---------- */
  { type: "learn", topic: "Finding details",
    title: "Times, places and reasons",
    html: '<p>Messages are full of small details.</p>' +
          '<ul><li>A <b>time</b> has am or pm.</li><li>A <b>place</b> tells you where.</li>' +
          '<li>A <b>reason</b> tells you why. It often comes after <b>because</b>, or before <b>so</b>.</li></ul>' +
          '<div class="keep"><b>Keep this</b>Know what you are hunting for. Then look for it.</div>' +
          '<p>Here is an email from a hospital, late at night.</p>' + EMAIL_LOU },

  { type: "num", topic: "Finding details",
    q: "What time did Lou hear the noise?",
    fig: EMAIL_LOU,
    boxes: [ { label: "Time", a: 2, post: "am" } ],
    hint: "Look for am or pm.",
    why: "Lou heard it at <b>2am</b>. That is the middle of the night." },

  { type: "mc", topic: "Finding details",
    q: "Where did the noise come from?",
    fig: EMAIL_LOU,
    options: ["The store cupboard", "The car park", "The lift", "The front door"],
    answer: 0,
    hint: "Find the words It came from.",
    why: "It came from <b>the store cupboard</b> on the second floor." },

  { type: "mc", topic: "Finding details",
    q: "Why did Lou ask Ali to come too?",
    fig: EMAIL_LOU,
    options: ["Lou was a bit scared", "Ali had the key", "The cat was big", "It was home time"],
    answer: 0,
    hint: "Find the word so. The reason comes just before it.",
    why: "I was a bit scared, <b>so</b> I asked Ali to come with me. The reason is <b>Lou was a bit scared</b>." },

  { type: "mc", topic: "Finding details",
    q: "What was making the noise?",
    fig: EMAIL_LOU,
    options: ["A cat", "A ghost", "The cleaner", "The wind"],
    answer: 0,
    hint: "Read what happened when they opened the door.",
    why: "It was <b>a cat</b>! Spooky noises often have a simple answer." },

  { type: "mc", topic: "Finding details",
    q: "How did the cat get in?",
    fig: EMAIL_LOU,
    options: ["Through an open window", "Through the front door", "In the lift", "With Ali"],
    answer: 0,
    hint: "Find the word in, near the word cat.",
    why: "It had come in <b>through an open window</b>. That is why Lou asks everyone to keep the window shut." },

  /* ---------- 5 TEXTS AND NOTES ---------- */
  { type: "learn", topic: "Texts and notes",
    title: "Texts and notes",
    html: '<p>Texts and notes are short messages.</p>' +
          '<p>They often have no subject line.</p>' +
          '<p>On a phone, the name at the top is who sent it.</p>' +
          '<p>On a note, the name at the bottom is who wrote it.</p>' +
          '<div class="keep"><b>Keep this</b>Short messages have the same clues. Who, what, when, where and why.</div>' +
          '<p>Here are some texts from a friend called Kit.</p>' + PHONE },

  { type: "mc", topic: "Texts and notes",
    q: "What time does the film start?",
    fig: PHONE,
    options: ["8pm", "7:45pm", "8am", "7pm"],
    answer: 0,
    hint: "Find the word starts.",
    why: "It starts at <b>8pm</b>. 7:45 is when Kit wants to meet, a bit before the film." },

  { type: "mc", topic: "Texts and notes",
    q: "Where will you meet Kit?",
    fig: PHONE,
    options: ["Outside the cinema", "At the shopping centre", "At Kit&rsquo;s house", "At the bus stop"],
    answer: 0,
    hint: "Find the words Meet me.",
    why: "Kit says meet me <b>outside the cinema</b>. The shopping centre is only in the name of the film." },

  { type: "mc", topic: "Texts and notes",
    q: "Why should you bring a jumper?",
    fig: PHONE,
    options: ["It is cold in the cinema", "It might rain", "The film is long", "Kit wants to borrow it"],
    answer: 0,
    hint: "Find the word because.",
    why: "Bring a jumper, <b>because it is cold in there</b>. The reason comes after because." },

  { type: "mc", topic: "Texts and notes",
    q: "This note is stuck on the office door. Who is it for?",
    fig: NOTE,
    options: ["Mo", "Ray", "The cleaner", "Kit"],
    answer: 0,
    hint: "Look at the name at the top.",
    why: "It starts with <b>Mo</b>, so it is for Mo. Ray wrote it. His name is at the bottom." },

  { type: "mc", topic: "Texts and notes",
    q: "What makes the clicking noise?",
    fig: NOTE,
    options: ["The heating pipes", "A ghost", "A cat", "The lift"],
    answer: 0,
    hint: "Find the word clicking. Read to the end of that line.",
    why: "It is just <b>the heating pipes</b>. Nothing spooky!" },

  /* ---------- 6 WRITE A REPLY ---------- */
  { type: "learn", topic: "Write a reply",
    title: "Writing a short reply",
    html: '<p>A reply can be short.</p>' +
          '<ol><li>Say hello.</li><li>Answer the question.</li><li>Sign off, then write your name.</li></ol>' +
          '<div class="keep"><b>Keep this</b>Hello, answer, sign off. Three parts. Done.</div>' +
          '<p>Dee has sent you an email.</p>' + EMAIL_ASK },

  { type: "order", topic: "Write a reply",
    q: "Here is a reply to Dee. Put it in order.",
    items: ["Hi Dee,", "Yes, I can help on Friday.", "See you soon,", "HK"],
    hint: "Hello comes first. Your name comes last.",
    why: "Greeting, answer, sign off, name. That is the shape of a short reply." },

  { type: "mc", topic: "Write a reply",
    q: "Which is a good way to start an email to Dee?",
    options: ["Hi Dee,", "See you soon,", "Thanks,", "From HK"],
    answer: 0,
    hint: "You start by saying hello.",
    why: "<b>Hi Dee,</b> is a greeting. See you soon and Thanks go at the end." },

  { type: "write", topic: "Write a reply",
    q: "<p><b>If you like,</b> write your own reply to Dee. Say yes or no. It goes to Jay only if you choose to send it.</p>",
    fig: EMAIL_ASK,
    starters: ["Hi Dee,", "Yes, I can help.", "Sorry, I cannot help.", "See you soon,", "Thanks,", "HK"],
    checklist: ["I said hello", "I answered the question", "I signed off with my name"],
    minWords: 8 }

  ]
});
})();
