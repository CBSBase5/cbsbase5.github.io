<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Base 5 timetable - Chilton Bridge School</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/parents.svg" type="image/svg+xml">
<!--
  The source of /parents/timetable.pdf (A4 landscape), the twin of
  lunch-menu.html. It draws itself from /data/term.js (the timetable and
  the weeks) and /data/parents.js (contact and helps), so it always matches
  the website. To rebuild: open /parents/_build/timetable.html in Chrome,
  Print, Save as PDF, Landscape, Margins: None, Background graphics on,
  and upload it to the parents folder as timetable.pdf. Or ask Claude.
  Public: general information only. Trips show as out, with no place or
  times. Plain ASCII only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#1d2327;background:#fbf8f1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm;height:210mm;padding:8mm 10mm 7mm;display:grid;grid-template-columns:1fr 64mm;grid-template-rows:auto 1fr auto;gap:4mm 6mm;overflow:hidden}
header{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:8mm;border-bottom:2px solid #1d2327;padding-bottom:3mm}
header .k{margin:0 0 1mm;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:8.5pt;color:#00697f}
header h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:23pt;line-height:1}
header p{margin:1mm 0 0;font-size:9pt;color:#5b6670}
.clock{width:16mm;height:16mm;flex:none}

/* the week, drawn to time: 9:30 at the top, 2:30 at the bottom */
.tt{display:grid;grid-template-columns:10mm repeat(5,minmax(0,1fr));grid-template-rows:7mm 1fr;gap:0 2mm;min-height:0}
.dh{background:#00697f;color:#fff;border-radius:2.5mm 2.5mm 0 0;font-weight:700;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
.axis{position:relative}
.axis span{position:absolute;right:1mm;transform:translateY(-50%);font-size:6.8pt;color:#5b6670;font-variant-numeric:tabular-nums}
.col{position:relative;background:#fff;border:1.4px solid #d9d2c3;border-top:0;border-radius:0 0 2.5mm 2.5mm;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(10% - .3px),#efe9dc calc(10% - .3px),#efe9dc 10%)}
.s{position:absolute;left:1mm;right:1mm;border-radius:1.6mm;padding:.5mm 1.8mm;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  background:var(--c);color:var(--i,#fff);font-size:7.4pt;line-height:1.12}
.s b{font-weight:700}
.s small{font-size:6.3pt;opacity:.92;margin-top:.3mm;font-variant-numeric:tabular-nums}
.s.short{flex-direction:row;align-items:center;justify-content:space-between;gap:1mm}
.s.short small{margin:0}
.s.quiet{background:#f3efe6;color:#1d2327;border:1px solid #e2dccd}
.s.trip{background:#0a2f38;color:#ffc247;align-items:flex-start;justify-content:center;text-align:left}
.s.trip b{font-family:Fraunces,Georgia,serif;font-size:11pt;font-weight:600;margin-bottom:1mm}
.s.trip small{color:#fff;font-size:7pt;line-height:1.3}
.s.split{background:linear-gradient(120deg,#1f6fb8 0%,#1f6fb8 49%,#7b3d93 51%,#7b3d93 100%)}

aside{display:flex;flex-direction:column;gap:3mm;min-height:0}
.box{background:#fff;border:1.4px solid #d9d2c3;border-radius:4mm;padding:3mm 3.5mm}
.box h2{margin:0 0 1.5mm;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:11.5pt}
.box ul{margin:0;padding:0;list-style:none}
.box li{font-size:8pt;line-height:1.3;margin:0 0 1.1mm;padding-left:3.2mm;position:relative}
.box li::before{content:"";position:absolute;left:0;top:1.3mm;width:1.5mm;height:1.5mm;border-radius:50%;background:#00697f}
.cal li{padding-left:0;display:grid;grid-template-columns:13mm 1fr;gap:2mm;align-items:baseline}
.cal li::before{display:none}
.chip{display:inline-block;text-align:center;padding:.4mm 1mm;border-radius:2mm;background:#00697f;color:#fff;font-weight:700;font-size:6.8pt;letter-spacing:.03em;white-space:nowrap}
.cal small{color:#5b6670;font-size:7pt}
.note{background:#00697f;color:#fff;border-color:#00697f}
.note p{margin:0 0 1.2mm;font-size:8pt;line-height:1.35}
.note p:last-child{margin:0}
.note b{font-size:9pt}
footer{grid-column:1/-1;display:flex;justify-content:space-between;font-size:7.5pt;color:#5b6670}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <p class="k">Chilton Bridge School &middot; Base 5</p>
      <h1>Base 5 timetable</h1>
      <p id="sub"></p>
    </div>
    <svg class="clock" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="34" r="25" fill="#fffdf8" stroke="#1d2327" stroke-width="3.5"/>
      <path d="M32 34V19M32 34l10 6" stroke="#e07a12" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="34" r="3" fill="#1d2327"/>
      <path d="M14 9l-6 6M50 9l6 6" stroke="#00697f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="24" cy="30" r="2" fill="#1d2327"/><circle cx="40" cy="30" r="2" fill="#1d2327"/>
    </svg>
  </header>
  <div class="tt" id="tt"></div>
  <aside>
    <div class="box cal">
      <h2>The weeks</h2>
      <ul id="cal"></ul>
    </div>
    <div class="box">
      <h2>Good to know</h2>
      <ul id="know"></ul>
    </div>
    <div class="box note" id="note"></div>
  </aside>
  <footer><span>Chilton Bridge School &middot; Base 5 timetable</span><span id="stamp"></span></footer>
</div>
<script src="/data/term.js"></script>
<script src="/data/parents.js"></script>
<script>
(function(){
var T = window.B5TERM, P = window.B5PARENTS || {};
function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
var M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var LONGM = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function d(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function longDate(iso){ var x = d(iso); return T.dayNames[T.dayKeys[(x.getDay() + 6) % 7]] + " " + x.getDate() + " " + LONGM[x.getMonth()]; }
function mins(t){ var p = t.split(":"), h = +p[0]; if(h < 8) h += 12; return h * 60 + (+p[1]); }

/* plain names for families, the same as the parents page */
var NAME = { breathein: "Breathe in", brain: "Brain games", cc: "Cultural calendar", phse: "PHSE", maths: "Maths", english: "English",
  forest: "Forest school with Vernon", lunch: "Lunch", project: "Project or GCSE", aesthetic: "Aesthetic and creative",
  digital: "Digital media with Andy", core: "Maths or English", physical: "Physical world", hort: "Horticulture with Kara",
  pe: "PE", pfa: "Preparation for adulthood", breatheout: "Breathe out" };
var COL = { brain: ["#007291"], cc: ["#e0a01f", "#1d2327"], phse: ["#6a5acd"], maths: ["#1f6fb8"], english: ["#7b3d93"], science: ["#1e9e5a"],
  project: ["#ef7724", "#1d2327"], ac: ["#d64d72"], dm: ["#00a6c9", "#06323c"], pw: ["#6f741a"], pe: ["#d63b2f"], pfa: ["#4b5d6b"], hs: ["#8d6e3f"] };
var QUIET = { breathein: 1, breatheout: 1, lunch: 1 };

var START = mins("9:30"), SPAN = mins("2:30") - START;
var h = '<div></div>' + T.dayKeys.map(function(k){ return '<div class="dh">' + T.dayNames[k] + '</div>'; }).join("");
var ax = "";
for(var m = START; m <= START + SPAN; m += 30){
  var hh = Math.floor(m / 60), mm = m % 60;
  ax += '<span style="top:' + ((m - START) / SPAN * 100) + '%">' + (hh > 12 ? hh - 12 : hh) + ":" + (mm < 10 ? "0" : "") + mm + '</span>';
}
h += '<div class="axis">' + ax + '</div>';
h += T.dayKeys.map(function(k){
  return '<div class="col">' + T.timetable[k].map(function(s){
    var a = mins(s[0]), b = mins(s[1]), top = (a - START) / SPAN * 100, ht = (b - a) / SPAN * 100;
    var pos = 'top:calc(' + top + '% + .35mm);height:calc(' + ht + '% - .7mm)';
    if(s[2] === "trip") return '<div class="s trip" style="' + pos + '"><b>Out on a trip</b><small>With a packed lunch from the school kitchen. The details come to you from school.</small></div>';
    var sub = T.subjectOf ? T.subjectOf(s[2]) : "", c = COL[sub] || ["#4b5d6b"];
    var name = NAME[s[2]] || T.session(s[2]).title, time = s[0] + " to " + s[1], short = b - a <= 15;
    var cls = "s" + (short ? " short" : "") + (QUIET[s[2]] ? " quiet" : "") + (sub === "core" ? " split" : "");
    return '<div class="' + cls + '" style="' + pos + ';--c:' + c[0] + (c[1] ? ';--i:' + c[1] : "") + '"><b>' + esc(name) + '</b><small>' + (short ? s[0] : time) + '</small></div>';
  }).join("") + '</div>';
}).join("");
document.getElementById("tt").innerHTML = h;

/* the usual shape starts with the first week that does not have its own timetable */
var usual = T.weeks.filter(function(w){ return !w.timetable; })[0], from = usual && usual.start > T.firstDay ? usual.start : T.firstDay;
document.getElementById("sub").textContent = T.name + ", 2026. The same shape every week, from " + longDate(from) + " to " + longDate(T.lastDay) + ".";

/* the weeks, with what the whole school is marking */
document.getElementById("cal").innerHTML = T.weeks.map(function(w){
  var mon = T.dateOf ? T.dateOf(w, "mon") : d(w.start), extra = [];
  Object.keys(w.days || {}).forEach(function(k){
    var x = w.days[k];
    if(x.off) extra.push(T.dayNames[k] + " " + (/INSET/i.test(x.line || "") ? "is an INSET day" : "is a day off"));
  });
  if(w.end === T.lastDay) extra.push("last day " + longDate(T.lastDay));
  if(w.start === T.firstDay && !extra.length) extra.push("first day " + longDate(T.firstDay));
  return '<li><span class="chip">Week ' + w.n + '</span><span>w/c ' + mon.getDate() + " " + M[mon.getMonth()] +
    (w.cc ? ' &middot; ' + esc(w.cc) : "") + (extra.length ? '<br><small>' + esc(extra.join(", ")) + '</small>' : "") + '</span></li>';
}).join("");

/* good to know */
var know = ["Days run from 9:30 to 2:30. The times are a guide, and we adapt sessions whenever a student needs it."];
var lunch = {};
T.dayKeys.forEach(function(k){ var s = T.timetable[k].filter(function(x){ return x[2] === "lunch"; })[0]; if(s) lunch[s[0]] = 1; });
var lt = Object.keys(lunch);
if(lt.length === 1) know.push("Lunch is at " + lt[0] + " every day in school, ordered for each student from the school kitchen.");
var out = (P.helps || []).filter(function(x){ return /outdoor/i.test(x[0]); })[0];
if(out) know.push(out[1]);
(T.alongside || []).forEach(function(a){
  var ses = T.session(a.key), days = a.days.map(function(k){ return T.dayNames[k] + "s"; });
  know.push("Some students also have " + (ses.heading ? ses.heading.replace(/^Horizon: /, "Horizon ") : ses.title) + " sessions from " + a.start + " to " + a.end +
    " on " + (days.length < 2 ? days[0] : days.slice(0, -1).join(", ") + " and " + days[days.length - 1]) + ".");
});
know.push("The website's home page shows what is on now and next, every day.");
document.getElementById("know").innerHTML = know.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("");

var C = P.contact || {}, mail = C.email || "jay.raine@chiltonbridgeschool.co.uk";
document.getElementById("note").innerHTML = "<p><b>Questions about the week?</b></p><p>Email me at " + esc(mail) + ", or speak to Holly or the school office.</p><p>The latest version is always on the parents page of the Base 5 website.</p>";
document.getElementById("stamp").textContent = T.name + " 2026. Made by Jay for families.";
})();
</script>
</body>
</html>
