<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Talk it through</h2>
    <span>English speaking and listening. Joining a discussion and giving a short talk, practised at your own pace.</span>
  </div>

<footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=13"></script>
<script>
(function(){
"use strict";

var CAFE_TALK =
'<div class="said"><span class="who">Someone in a discussion says</span>' +
'<p>"So, the caf&eacute; has been losing money for a while. We have tried cheaper prices, and we have tried a new menu, but fewer people are coming in each month. The main thing is, if nothing changes by the summer, it may have to close. I would really like ideas from all of you."</p></div>';

EGW.run({
  id: "speaking",
  title: "Talk it through",
  subject: "English",
  mins: 25,
  blurb: "Listening, asking, joining in, and planning a short talk. No clock, no pressure, just a few useful moves to have in your pocket.",
  steps: [

  /* ---------- 1. LISTENING FOR THE POINT ---------- */
  { type: "learn", topic: "Listening for the point",
    title: "What it is, and listening well",
    html: "<p><b>Speaking, Listening and Communicating</b> is not a written paper. It is assessed in person by your centre: you take part in a <b>discussion</b>, and you give a <b>short talk</b>.</p>" +
          "<p>This page is just practice, at your own pace. Nothing here is timed.</p>" +
          "<p>Good listening means catching the <b>main point</b>, not every word. You could listen for:</p>" +
          "<ul><li>the idea the person keeps coming back to</li>" +
          "<li>signal phrases such as <i>the main thing is</i> or <i>most importantly</i></li>" +
          "<li>who, what, when and where</li></ul>" +
          '<div class="keep"><b>Keep this</b>When someone finishes speaking, try summing it up in one sentence in your head. That is usually the main point.</div>' },

  { type: "mc", topic: "Listening for the point",
    q: "What is the main point here?",
    fig: CAFE_TALK,
    options: [
      "The caf&eacute; may close by the summer unless something changes.",
      "The caf&eacute; has a new menu.",
      "The prices at the caf&eacute; are cheaper now.",
      "The speaker is looking forward to the summer."
    ],
    answer: 0,
    hint: "Which idea would you pass on if a friend asked what the discussion was about?",
    why: "The menu and the prices are details: things that have already been tried. The point everything builds up to is that the caf&eacute; may close. The speaker even flags it with \"The main thing is\"." },

  { type: "mc", topic: "Listening for the point",
    q: "Which phrase signals that the main point is coming?",
    fig: CAFE_TALK,
    options: ["\"The main thing is\"", "\"for a while\"", "\"a new menu\"", "\"each month\""],
    answer: 0,
    hint: "Look for words that say: listen, this bit matters.",
    why: "\"The main thing is\" is a signpost. Speakers use phrases like this, and \"most importantly\" or \"what I really mean is\", just before the bit they most want you to hear." },

  /* ---------- 2. ASKING QUESTIONS ---------- */
  { type: "learn", topic: "Asking questions",
    title: "Questions that find out more",
    html: "<p><b>Closed questions</b> get a short answer, often yes or no: <i>Is the caf&eacute; closing?</i></p>" +
          "<p><b>Open questions</b> get people talking. They often start with <i>what, why, how</i>, or <i>could you tell me more about</i>:</p>" +
          "<ul><li><i>Why do you think fewer people are coming?</i></li>" +
          "<li><i>How could we let more people know about it?</i></li></ul>" +
          "<p>A good question picks up on something the other person said. It shows you were listening.</p>" +
          '<div class="keep"><b>Keep this</b>Not sure what to say in a discussion? A question counts as joining in. \"What do you mean by...?\" is always fair.</div>' },

  { type: "sort", topic: "Asking questions",
    q: "Open or closed?",
    buckets: ["Open (gets people talking)", "Closed (short answer)"],
    cards: [
      ["What would make you visit more often?", 0],
      ["How do other caf&eacute;s get more customers?", 0],
      ["Why did the prices change?", 0],
      ["Do you like the new menu?", 1],
      ["Is it open on Sundays?", 1],
      ["Did you go last week?", 1]
    ],
    hint: "Could someone answer it with just yes, no, or one word?",
    why: "Closed questions are useful for checking a fact. Open questions (what, how, why) invite ideas and reasons, which is what keeps a discussion going." },

  { type: "mc", topic: "Asking questions",
    q: "Someone says: <i>\"I stopped going because it is always so noisy at lunchtime.\"</i> Which question builds on that best?",
    options: [
      "What would make it feel calmer for you?",
      "Do you prefer tea or coffee?",
      "Is the caf&eacute; closing?",
      "Why don't you just go somewhere else?"
    ],
    answer: 0,
    hint: "Which one picks up on the noise, and is kind about it?",
    why: "It picks up on exactly what they said and invites an idea. Tea or coffee wanders off topic, the closing question ignores what they just said, and the last one sounds like a brush off." },

  /* ---------- 3. IN A DISCUSSION ---------- */
  { type: "learn", topic: "In a discussion",
    title: "Joining in",
    html: "<p>Four useful moves, each with words you could borrow:</p>" +
          "<ul><li><b>Give your view with a reason</b>: <i>I think ... because ...</i></li>" +
          "<li><b>Build on what someone said</b>: <i>Adding to what Sam said, ...</i></li>" +
          "<li><b>Disagree politely</b>: <i>I see your point, but ...</i></li>" +
          "<li><b>Take turns</b>: wait for a pause, keep it fairly short, and bring others in: <i>What do you think?</i></li></ul>" +
          '<div class="keep"><b>Keep this</b>You do not need to talk the most. A few clear points, a question, and picking up on what others said goes a long way.</div>' },

  { type: "match", topic: "In a discussion",
    q: "Match each phrase to the job it does.",
    pairs: [
      ["I think we should ... because ...", "Giving a view with a reason"],
      ["Adding to what Priya said ...", "Building on someone else"],
      ["I see your point, but ...", "Disagreeing politely"],
      ["What do you think, Sam?", "Bringing someone else in"],
      ["Could you explain what you mean?", "Asking to find out more"]
    ],
    hint: "Read each phrase out loud and think about what it does to the conversation.",
    why: "Having a few of these ready means you never have to think of how to start. They also show the listener exactly what you are doing: agreeing, adding, disagreeing or asking." },

  { type: "sort", topic: "In a discussion",
    q: "Does each one help the discussion, or get in the way?",
    buckets: ["Helps", "Gets in the way"],
    cards: [
      ["Nodding and looking at the speaker", 0],
      ["Saying \"Sorry, can I just add something?\"", 0],
      ["Saying \"I'm not sure, because it might cost a lot\"", 0],
      ["Talking over someone mid sentence", 1],
      ["Saying \"That's a stupid idea\"", 1],
      ["Checking your phone while they speak", 1]
    ],
    hint: "Would it make the other person feel listened to?",
    why: "You can disagree and still help the discussion, as long as you give a reason and stay polite. Talking over people, insults and phones all tell the speaker you are not listening." },

  { type: "mc", topic: "In a discussion",
    q: "Which one gives an opinion <b>and</b> a reason?",
    options: [
      "I think the caf&eacute; should do a student deal, because lots of students walk past at lunchtime.",
      "The caf&eacute; should do a student deal.",
      "Students.",
      "I like caf&eacute;s."
    ],
    answer: 0,
    hint: "Look for a little word that introduces the reason.",
    why: "\"I think\" gives the view and \"because\" brings in the reason. A reason makes your view easier to agree with, and easier for others to build on." },

  /* ---------- 4. PLANNING A TALK ---------- */
  { type: "learn", topic: "Planning a talk",
    title: "A short talk in three parts",
    html: "<ul><li><b>Opening</b>: say what your talk is about. You could add a hook: a question or a surprising fact.</li>" +
          "<li><b>Three points</b>: three things to say, each with an example or a reason.</li>" +
          "<li><b>Ending</b>: sum up in one sentence and thank your listeners. You could invite questions.</li></ul>" +
          "<p>Signpost words help people follow: <i>firstly, my second point is, finally, to sum up</i>.</p>" +
          '<div class="keep"><b>Keep this</b>Write prompts, not a script: a few key words on a small card. Glance down, then look up and talk.</div>' },

  { type: "order", topic: "Planning a talk",
    q: "Put this short talk in order.",
    items: [
      "Hello. I am going to talk about why musicals are worth seeing.",
      "Firstly, the songs tell the story, so you are never bored.",
      "My second point is that live shows have amazing sets and lighting.",
      "Finally, tickets for local shows can be cheap, sometimes under ten pounds.",
      "To sum up, give a musical a go. Thank you for listening."
    ],
    hint: "The signpost words give it away: firstly, second, finally, to sum up.",
    why: "Opening, three points, ending. The signposts do the work of holding it together, so your listeners always know where they are." },

  { type: "mc", topic: "Planning a talk",
    q: "Which is the most helpful way to use notes in a short talk?",
    options: [
      "A few key words on a card, to glance at",
      "A full script, read word for word without looking up",
      "No notes, and try to remember every word",
      "Notes on lots of sheets of paper to shuffle through"
    ],
    answer: 0,
    hint: "Which one lets you look at your listeners most of the time?",
    why: "Key words remind you of each point but leave you free to talk naturally and look up. Reading a script word for word is hard to follow, and trying to memorise everything adds pressure you do not need." },

  /* ---------- 5. YOUR TALK ---------- */
  { type: "learn", topic: "Your talk",
    title: "Nerves and pace",
    html: "<p>Almost everyone feels nervous before a talk. A fast heartbeat just means your body is getting ready.</p>" +
          "<ul><li>Breathe out slowly before you start.</li>" +
          "<li>Speak a little slower than feels natural. Nerves speed us up.</li>" +
          "<li>Pauses are fine. They give people time to think, and you time to check your card.</li>" +
          "<li>Lost your place? Look at your card, say \"So, my next point is...\", and carry on.</li>" +
          "<li>Practise once or twice out loud, to Jay, a mirror, or Bonnie, who is a very patient audience.</li></ul>" +
          '<div class="keep"><b>Keep this</b>Nobody expects a perfect speech. Clear, steady and on topic is the aim.</div>' },

  { type: "mc", topic: "Your talk",
    q: "You lose your place halfway through your talk. What could you do?",
    options: [
      "Glance at your card, say \"So, my next point is...\" and carry on",
      "Start again from the very beginning",
      "Speak much faster to catch up",
      "Stop and say nothing until someone helps"
    ],
    answer: 0,
    hint: "Which one keeps things moving calmly?",
    why: "A quick look at your card and a signpost phrase gets you back on track, and most listeners will not even notice. Losing your place happens to everyone; how you carry on is what counts." },

  { type: "write", topic: "Your talk",
    q: "<p><b>If you fancy it,</b> plan a short talk on any topic you like: a game, a team, a hobby, a place, an animal, your musical, anything you know about or care about. Notes are fine: it does not need full sentences. It goes to Jay only if you choose to send it.</p>",
    starters: ["My topic is", "Hello, I am going to talk about", "Did you know", "Firstly,", "My second point is", "Finally,", "To sum up,", "Thank you for listening."],
    checklist: [
      "I picked a topic I know or care about",
      "My opening says what the talk is about",
      "I have three points, each with an example or a reason",
      "My ending sums up in one sentence",
      "I used signpost words such as firstly and finally",
      "Stretch: I added a hook, like a question or a surprising fact"
    ],
    minWords: 50 }
  ]
});
})();
</script>
</body>
</html>
