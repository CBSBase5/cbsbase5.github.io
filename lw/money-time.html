<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function ln(x1, y1, x2, y2, col, w, extra){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
}
function arc(x1, x2, y, lift, col){
  var mx = (x1 + x2) / 2;
  return '<path d="M' + x1 + ' ' + y + ' Q' + mx + ' ' + (y - lift) + ' ' + x2 + ' ' + y + '" fill="none" stroke="' + col + '" stroke-width="3"/>' +
    '<path d="M' + (x2 - 9) + ' ' + (y - 9) + ' L' + x2 + ' ' + y + ' L' + (x2 - 12) + ' ' + (y + 1) + '" fill="none" stroke="' + col + '" stroke-width="3"/>';
}

/* ---------- figures ---------- */

/* Counting up for change: 13.65 to 14 to 20 */
var CHANGE = (function(){
  var s = '<svg viewBox="0 0 400 176" role="img" aria-label="Counting up from 13 pounds 65 to 14 pounds is 35p, then from 14 pounds to 20 pounds is 6 pounds. Change is 6 pounds 35.">';
  s += ln(18, 112, 386, 112, INK, 3);
  var xs = [42, 112, 356], labs = ["&pound;13.65", "&pound;14.00", "&pound;20.00"];
  for(var k = 0; k < 3; k++){
    s += ln(xs[k], 102, xs[k], 122, INK, 3);
    s += t(xs[k], 145, labs[k], 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += arc(42, 112, 102, 58, CORAL) + t(77, 58, "+35p", 18, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
  s += arc(112, 356, 102, 100, BLUE) + t(234, 36, "+&pound;6", 18, BLUE, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(392, 16, "not to scale", 14, "#4b5275", BODY + ' text-anchor="end"');
  s += t(200, 172, "Change: 35p + &pound;6 = &pound;6.35", 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Cereal best buy */
function box(x, w, h, col, name){
  var y = 150 - h;
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + col + '" stroke="' + INK + '" stroke-width="3"/>' +
    t(x + w / 2, y + h / 2 + 7, name, 20, INK, LAB + ' font-weight="800" text-anchor="middle"');
}
var CEREAL =
'<svg viewBox="0 0 400 232" role="img" aria-label="Cereal: 500 grams for 2 pounds 10 is 42p per 100 grams. 750 grams for 2 pounds 85 is 38p per 100 grams, which is better value.">' +
box(50, 90, 80, SUN, "500 g") + box(240, 100, 120, SUN, "750 g") +
t(95, 178, "500 g for &pound;2.10", 17, INK, BODY + ' text-anchor="middle" font-weight="700"') +
t(290, 178, "750 g for &pound;2.85", 17, INK, BODY + ' text-anchor="middle" font-weight="700"') +
t(95, 204, "2.10 &divide; 5 = 42p", 17, INK, BODY + ' text-anchor="middle"') +
t(290, 204, "2.85 &divide; 7.5 = 38p", 17, BLUE, BODY + ' text-anchor="middle" font-weight="700"') +
t(95, 226, "per 100 g", 15, INK, BODY + ' text-anchor="middle"') +
t(290, 226, "per 100 g: better value", 15, BLUE, BODY + ' text-anchor="middle" font-weight="700"') +
'</svg>';

/* Clock at 4:30 */
var CLOCK = (function(){
  var cx = 100, cy = 100, r = 84;
  var s = '<svg viewBox="0 0 400 200" role="img" aria-label="A clock showing half past four. In the afternoon that is 4:30 pm, which is 16:30 on the 24 hour clock.">';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="4"/>';
  for(var k = 1; k <= 12; k++){
    var a = k * 30 * Math.PI / 180;
    s += t((cx + 66 * Math.sin(a)).toFixed(1), (cy - 66 * Math.cos(a) + 6).toFixed(1), String(k), 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  for(var m = 0; m < 60; m++){
    var b = m * 6 * Math.PI / 180, r1 = m % 5 ? 78 : 74;
    s += ln((cx + r1 * Math.sin(b)).toFixed(1), (cy - r1 * Math.cos(b)).toFixed(1), (cx + 83 * Math.sin(b)).toFixed(1), (cy - 83 * Math.cos(b)).toFixed(1), INK, m % 5 ? 1 : 2.5);
  }
  var ha = 135 * Math.PI / 180, ma = 180 * Math.PI / 180;
  s += ln(cx, cy, (cx + 42 * Math.sin(ha)).toFixed(1), (cy - 42 * Math.cos(ha)).toFixed(1), INK, 7, ' stroke-linecap="round"');
  s += ln(cx, cy, (cx + 62 * Math.sin(ma)).toFixed(1), (cy - 62 * Math.cos(ma)).toFixed(1), BLUE, 4, ' stroke-linecap="round"');
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="' + INK + '"/>';
  s += t(205, 62, "In the afternoon:", 17, INK, BODY);
  s += t(205, 98, "4:30 pm", 30, INK, LAB + ' font-weight="800"');
  s += t(205, 128, "4 + 12 = 16", 17, CORAL, BODY + ' font-weight="700"');
  s += t(205, 166, "16:30", 30, BLUE, LAB + ' font-weight="800"');
  s += '</svg>';
  return s;
})();

/* Time line, 09:45 to 11:20, drawn to scale: 3 units per minute */
var TIMELINE = (function(){
  var x0 = 50, k = 3;
  var xs = [x0, x0 + 15 * k, x0 + 75 * k, x0 + 95 * k];
  var labs = ["09:45", "10:00", "11:00", "11:20"];
  var anc = ["end", "start", "middle", "middle"], dx = [6, -6, 0, 0];
  var s = '<svg viewBox="0 0 400 176" role="img" aria-label="A time line from 09:45 to 11:20 drawn to scale. 15 minutes to 10:00, 1 hour to 11:00, 20 minutes to 11:20. Total 1 hour 35 minutes.">';
  s += ln(20, 110, 385, 110, INK, 3);
  for(var j = 0; j < 4; j++){
    s += ln(xs[j], 100, xs[j], 120, INK, 3);
    s += t(xs[j] + dx[j], 142, labs[j], 17, INK, LAB + ' font-weight="700" text-anchor="' + anc[j] + '"');
  }
  s += arc(xs[0], xs[1], 100, 44, CORAL) + t((xs[0] + xs[1]) / 2, 64, "15 min", 16, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
  s += arc(xs[1], xs[2], 100, 100, BLUE) + t((xs[1] + xs[2]) / 2, 38, "1 hour", 17, BLUE, LAB + ' font-weight="800" text-anchor="middle"');
  s += arc(xs[2], xs[3], 100, 50, VIOLET) + t((xs[2] + xs[3]) / 2, 62, "20 min", 16, VIOLET, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(200, 172, "Total: 1 hour 35 minutes", 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Measuring jug: top value, label step, small mark step, liquid level */
function jug(top, labStep, minor, level, unit, label){
  var bot = 270, scale = 220 / top;     // top of scale sits at y = 50
  function y(v){ return (bot - v * scale).toFixed(1); }
  var s = '<svg viewBox="0 0 420 300" role="img" aria-label="' + label + '">';
  s += '<path d="M150 ' + (bot) + ' V30 H310 V' + bot + ' Z" fill="' + WHITE + '"/>';
  s += '<rect x="150" y="' + y(level) + '" width="160" height="' + (level * scale).toFixed(1) + '" fill="' + CYAN + '" opacity=".55"/>';
  s += ln(150, y(level), 310, y(level), BLUE, 3);
  s += '<path d="M150 22 V' + bot + ' H310 V22" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
  s += '<path d="M310 70 H350 Q366 70 366 86 V180 Q366 196 350 196 H310" fill="none" stroke="' + INK + '" stroke-width="4"/>';
  var n = Math.round(top / minor);
  for(var k = 0; k <= n; k++){
    var v = k * minor, major = Math.abs(v / labStep - Math.round(v / labStep)) < 1e-9;
    s += ln(150, y(v), major ? 186 : 170, y(v), INK, major ? 3 : 2);
    if(major) s += t(140, (+y(v) + 6).toFixed(1), String(v), 17, INK, LAB + ' font-weight="700" text-anchor="end"');
  }
  s += t(140, 18, unit, 16, INK, LAB + ' font-weight="700" text-anchor="end"');
  s += '</svg>';
  return s;
}
var JUG1 = jug(1000, 200, 50, 650, "ml", "A measuring jug labelled every 200 millilitres with small marks every 50 millilitres. The water is at 650 millilitres.");
var JUG2 = jug(500, 100, 25, 275, "ml", "A measuring jug labelled 0 to 500 millilitres, labelled every 100, with three small marks between each label. The water level is between 200 and 300.");

/* ---------- tables ---------- */
var BUS7 =
'<table class="mt-tt"><tr><th>Bus 7</th><th>A</th><th>B</th><th>C</th></tr>' +
'<tr><td>Bus Station</td><td>08:10</td><td>08:40</td><td>09:10</td></tr>' +
'<tr><td>Park Lane</td><td>08:22</td><td>08:52</td><td>09:22</td></tr>' +
'<tr><td>College</td><td>08:35</td><td>09:05</td><td>09:35</td></tr></table>';

var TRAIN =
'<table class="mt-tt"><tr><th>Station</th><th colspan="3">Train times</th></tr>' +
'<tr><td>Chilton Bridge</td><td>07:48</td><td>08:18</td><td>08:48</td></tr>' +
'<tr><td>Halford</td><td>08:05</td><td>08:35</td><td>09:05</td></tr>' +
'<tr><td>Kingsport</td><td>08:31</td><td>09:01</td><td>09:31</td></tr></table>';

var ROTA =
'<table class="mt-tt"><tr><th>Day</th><th>Start</th><th>Finish</th></tr>' +
'<tr><td>Monday</td><td>09:00</td><td>13:00</td></tr>' +
'<tr><td>Wednesday</td><td>12:30</td><td>17:00</td></tr>' +
'<tr><td>Saturday</td><td>08:00</td><td>14:30</td></tr></table>';

var UNITS =
'<table class="datatable"><tr><th>Length</th><td>10 mm = 1 cm<br>100 cm = 1 m<br>1000 m = 1 km</td></tr>' +
'<tr><th>Weight</th><td>1000 g = 1 kg</td></tr>' +
'<tr><th>Capacity</th><td>1000 ml = 1 litre (l)</td></tr>' +
'<tr><th>Money</th><td>100p = &pound;1</td></tr></table>';

/* ---------- journey planner widget ---------- */
var STOPS = ["Westgate", "Chilton Road", "Market Square", "Leisure Centre", "Hospital"];
var BUSES = [
  { id: "A", times: ["16:50", "16:59", "17:11", "17:20", "17:33"] },
  { id: "B", times: ["17:20", "17:31", "17:47", "17:58", "18:14"] },
  { id: "C", times: ["17:45", "17:56", "18:08", null, "18:22"] },
  { id: "D", times: ["18:15", "18:24", "18:36", "18:45", "18:58"] },
  { id: "E", times: ["18:45", "18:54", "19:06", "19:15", "19:28"] }
];
var JP = [
  { from: 1, to: 3, ans: 1, by: "18:00",
    task: "You want to be at the <b>Leisure Centre by 18:00</b> for a swim. Which is the <b>latest</b> bus you could catch from Chilton Road and still get there in time?",
    why: "Bus B reaches the Leisure Centre at 17:58, just before 18:00. Bus C has a dash there: it does not stop. Bus D gets there at 18:45, which is too late. So catch <b>Bus B at 17:31</b>." },
  { from: 1, to: 2, ans: 3, arrive: "18:00",
    task: "You get to the <b>Chilton Road</b> stop at <b>18:00</b>. Which is the <b>first</b> bus you can catch to Market Square?",
    why: "Bus C left Chilton Road at 17:56, four minutes before you got there. The next one is <b>Bus D at 18:24</b>, so you wait 24 minutes and reach Market Square at 18:36." },
  { from: 1, to: 4, ans: 2, quick: true,
    task: "You are going from <b>Chilton Road</b> to the <b>Hospital</b>. Which bus has the <b>quickest</b> journey?",
    why: "Count on for each bus. A: 16:59 to 17:33 is 34 minutes. B: 17:31 to 18:14 is 43 minutes (rush hour). <b>C: 17:56 to 18:22 is 26 minutes</b>, because it skips the Leisure Centre. D and E both take 34 minutes." }
];
function mins(s){ var p = s.split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function hhmm(m){ var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm; }
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
function countOn(a, b){
  var ma = mins(a), mb = mins(b), d = mb - ma;
  var nextHour = Math.ceil(ma / 60) * 60;
  if(ma % 60 !== 0 && mb > nextHour){
    return a + " to " + hhmm(nextHour) + " is " + plural(nextHour - ma, "minute") + ", then " + hhmm(nextHour) + " to " + b + " is " + plural(mb - nextHour, "minute") + ". Journey: <b>" + plural(d, "minute") + "</b>.";
  }
  return a + " to " + b + " is <b>" + plural(d, "minute") + "</b>.";
}

function mountPlanner(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(typeof d.sel !== "number") d.sel = -1;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  var view = d.c;

  el.innerHTML =
    '<div class="wpanel jp-task" data-r="task"></div>' +
    '<div class="jp-wrap"><table class="jp-table" data-r="tt"></table></div>' +
    '<div class="wpanel">' +
      '<p class="wnote jp-read" data-r="read" aria-live="polite"></p>' +
      '<div class="wrow">' +
        '<button class="btn" type="button" data-r="go">Catch this bus</button>' +
        '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
      '</div>' +
    '</div>' +
    '<div class="fb jp-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

  function table(){
    var c = view < 3 ? JP[view] : null;
    var s = '<tr><th class="jp-stop">Bus</th>';
    BUSES.forEach(function(b, k){
      s += '<th class="jp-col' + (k === d.sel ? " jp-on" : "") + '"><button type="button" data-bus="' + k + '" aria-label="Choose bus ' + b.id + '" aria-pressed="' + (k === d.sel) + '">' + b.id + '</button></th>';
    });
    s += '</tr>';
    STOPS.forEach(function(st, r){
      var hi = c && (r === c.from || r === c.to);
      s += '<tr' + (hi ? ' class="jp-row"' : '') + '><td class="jp-stop">' + st + '</td>';
      BUSES.forEach(function(b, k){
        s += '<td class="jp-col' + (k === d.sel ? " jp-on" : "") + '" data-bus="' + k + '">' + (b.times[r] || "&ndash;") + '</td>';
      });
      s += '</tr>';
    });
    return s;
  }

  function reading(){
    if(d.sel < 0) return "Tap a bus letter (or any time in its column) to follow that bus.";
    var c = view < 3 ? JP[view] : JP[2];
    var b = BUSES[d.sel], a = b.times[c.from], z = b.times[c.to];
    var s = "<b>Bus " + b.id + "</b>: " + STOPS[c.from] + " " + a + ", ";
    if(!z) return "<b>Bus " + b.id + "</b>: " + STOPS[c.from] + " " + a + ". It <b>does not stop</b> at the " + STOPS[c.to] + " (that is what the dash means).";
    s += STOPS[c.to] + " " + z + ". " + countOn(a, z);
    if(c.arrive){
      var w = mins(a) - mins(c.arrive);
      s += w < 0 ? " You get to the stop at " + c.arrive + ", so this one has already gone." : " You get to the stop at " + c.arrive + ", so you wait " + plural(w, "minute") + ".";
    }
    return s;
  }

  function task(){
    var dots = '<div class="jp-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 3) return dots + '<p><b>Free play.</b> All three journeys planned. Tap any bus to see its journey from Chilton Road to the Hospital.</p>';
    return dots + '<p class="tiny" style="margin:0 0 4px">Journey ' + (view + 1) + ' of 3. The two stops you need are shaded.</p><p>' + JP[view].task + '</p>';
  }

  function draw(){
    q("task").innerHTML = task();
    q("tt").innerHTML = table();
    q("read").innerHTML = reading();
    var waiting = view !== d.c || d.c >= 3;
    q("go").disabled = waiting || d.sel < 0;
    q("go").classList.toggle("hidden", d.c >= 3);
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }

  function fb(cls, html){ var f = q("fb"); f.className = "fb jp-fb " + cls; f.innerHTML = html; }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function nudge(k){
    var c = JP[view], b = BUSES[k], z = b.times[c.to], a = b.times[c.from];
    if(view === 0){
      if(!z) return "Bus " + b.id + " has a dash at the Leisure Centre, so it does not stop there.";
      if(mins(z) > mins(c.by)) return "Bus " + b.id + " gets there at " + z + ", which is after 18:00.";
      return "Bus " + b.id + " gets you there in time, but a later bus still makes it. Look along the Leisure Centre row.";
    }
    if(view === 1){
      if(mins(a) < mins(c.arrive)) return "Bus " + b.id + " left Chilton Road at " + a + ", before you got there at 18:00.";
      return "Bus " + b.id + " works, but there is an earlier one that leaves after 18:00.";
    }
    var dd = mins(z) - mins(a);
    return "Bus " + b.id + " takes " + dd + " minutes. Tap each bus and compare: is any of them quicker?";
  }
  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here is how this one works.</b> " : "<b>Yes, that is the one.</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All three journeys planned. The trick every time: follow <b>one column</b> down, and count on through the o&#39;clock.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next journey</button>';
    fb(how === "shown" ? "show" : "good", head + JP[k].why + more);
    q("next").onclick = function(){
      view = d.c; d.sel = -1; api.save();
      q("fb").className = "fb jp-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }

  q("tt").addEventListener("click", function(e){
    var cell = e.target.closest("[data-bus]");
    if(!cell) return;
    d.sel = parseInt(cell.getAttribute("data-bus"), 10);
    api.save(); draw();
  });
  q("go").onclick = function(){
    if(view !== d.c || d.c >= 3 || d.sel < 0) return;
    if(d.sel === JP[view].ans){ solved(view, "right"); return; }
    d.miss[view]++; api.save();
    fb("nudge", "<b>Not quite yet.</b> " + nudge(d.sel) + (d.miss[view] === 1 ? "" : " Show me is there if you want it."));
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    d.shown[view] = true;
    d.sel = JP[view].ans;
    solved(view, "shown");
  };

  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three journeys planned.</b> Follow one column down, and count on through the o&#39;clock.");
    api.done(d.result);
  }
}
