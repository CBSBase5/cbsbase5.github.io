/* Source A: the advert */
.ad{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:14px 16px;margin:12px 0;text-align:left;line-height:1.5;font-size:1rem}

.ad .adinfo ul{margin:4px 0 6px;padding-left:20px}
.ad .adinfo li{margin:0 0 3px}

.news{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;text-align:left;line-height:1.55;font-family:Georgia,"Times New Roman",serif}

.news h4{font-size:1.35rem;line-height:1.2;margin:0 0 8px}
.news p{margin:0 0 9px}
.snip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;text-align:left}
.ptab{width:100%}
.ptab td,.ptab th{text-align:left;font-size:.95rem}
.ptab td:first-child{font-weight:700;white-space:nowrap}

/* Highlighter pens */
.hp{background:var(--ink);color:#fff;border-radius:16px;padding:12px;margin:6px 0}
.hpbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;margin-bottom:10px}
.hpbar span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.88rem}
.hppens{position:sticky;top:6px;z-index:3;background:#26203f;border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:8px;box-shadow:0 6px 16px rgba(0,0,0,.35);margin-bottom:10px}
.hppens .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hppens button{font-family:var(--display);font-weight:700;font-size:.82rem;line-height:1.15;color:var(--ink);border:3px solid transparent;border-radius:10px;padding:6px 4px;cursor:pointer;min-height:44px}
.hppens button.sel{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 0 0 5px #fff;transform:translateY(-1px)}
.hppens button .pc{display:block;font-size:.72rem;font-weight:500;opacity:.8}
.hpmsg{font-size:.95rem;line-height:1.45;margin:8px 2px 0;color:#e6e3f5;min-height:1.3em}
.hpmsg b{color:var(--sun)}
.hprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hprow:empty{display:none}
.hp .ad{margin:0;border-color:#fff}
.hp .ph{font:inherit;color:inherit;text-align:left;background:transparent;border:0;border-bottom:2px dotted #b9b7cc;border-radius:4px;padding:0 2px;margin:0;cursor:pointer;line-height:inherit;display:inline}
.hp .ph:hover{background:#f2f1ec}

.hp .ph.shake{animation:nudge .35s;background:#ffe9e9;border-bottom-color:#ff5d5d}
.hp .ph .tl{display:inline-block;font-family:var(--display);font-style:normal;font-weight:700;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:2px;line-height:1.6}
.hp .adinfo{opacity:.75}
.hpend{text-align:center;padding:6px 2px}

.hpend p{margin:6px 0}
.hpsum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.hpsum span{color:var(--ink);font-family:var(--display);font-weight:700;font-size:.82rem;border-radius:8px;padding:4px 8px}
@media (max-width:420px){

  .hppens button{font-size:.76rem;padding:5px 3px}
  .ad,.news{padding:12px}
}

<script>

var PIC =
'<svg viewBox="0 0 380 230" role="img" aria-label="Picture from the advert: indoor climbing wall. A smiling climber in a harness near the top, held on a rope by an instructor on the ground. A smiling parent and a waving child watch. A sign on the wall says Beginners welcome.">' +

'<circle cx="300" cy="146" r="10" fill="#ffffff" stroke="#141a33" stroke-width="3"/><path d="M295 148 Q300 153 305 148" stroke="#141a33" stroke-width="2" fill="none"/>' +
'<circle cx="332" cy="172" r="8" fill="#ffffff" stroke="#141a33" stroke-width="3"/><path d="M328 173 Q332 177 336 173" stroke="#141a33" stroke-width="2" fill="none"/>' +
'<rect x="262" y="34" width="110" height="56" rx="8" fill="#ffd23f" stroke="#141a33" stroke-width="3"/>' +
'<g font-family="Space Grotesk,Arial" font-weight="700" font-size="15" fill="#141a33" text-anchor="middle"><text x="317" y="58">BEGINNERS</text><text x="317" y="78">WELCOME</text></g>' +
'<rect x="0" y="212" width="380" height="18" fill="#19c39a" opacity=".5"/>' +
'</svg>';

/* ---------- Source A: the advert. Each {n} is a phrase the highlighter game can tag. ---------- */
var PEN = {
  da: { name: "Direct address", col: "#7fdcf5" },
  rq: { name: "Rhetorical question", col: "#c7b2ff" },
  sup: { name: "Superlative", col: "#ffe27a" },
  ex: { name: "Exclamation", col: "#ffa3a3" },
  num: { name: "Numbers and statistics", short: "Numbers", col: "#8fe6c9" },
  test: { name: "Testimonial", col: "#ffc48a" }
};
var PEN_ORDER = ["da", "rq", "sup", "ex", "num", "test"];
var PH = [
  { t: "Climbing has arrived in Brackenford!", tags: ["ex"],
    why: "The exclamation mark makes the opening sound like exciting news.", clue: "Look at how the sentence ends." },
  { t: "Fancy trying something new this weekend?", tags: ["rq", "da"],
    why: "A question the reader answers in their head: it gets them imagining having a go.", clue: "Look at how it ends: is it really waiting for an answer?" },
  { t: "Summit has the tallest indoor climbing wall in the county.", tags: ["sup"],
    why: "Tallest is a superlative: it says nothing beats it, so it sounds special.", clue: "Find the word that ends in est." },
  { t: "It is built inside the old mill on Canal Street.", tags: [] },
  { t: "You do not need any experience.", tags: ["da"],
    why: "Talking straight to the reader as you makes it personal and reassuring.", clue: "Who is this sentence talking to?" },
  { t: "The walls have routes for every level.", tags: [] },
  { t: "\"I was terrified of heights. Now I climb every week.\" Kai, Brackenford", tags: ["test"],
    why: "A real sounding customer backs the advert up, and Kai's fear makes nervous readers feel they could do it too.", clue: "Who is speaking here: the advert, or someone else?" },
  { t: "Our instructors are the friendliest in the business.", tags: ["sup"],
    why: "Friendliest is a superlative, and an opinion dressed up to sound like a fact.", clue: "Find the word that ends in est." },
  { t: "9 out of 10 first timers come back for more.", tags: ["num"],
    why: "A statistic sounds like proof, so the claim feels hard to argue with.", clue: "There is a figure in it." },
  { t: "Lockers and a cafe are on site.", tags: [] },
  { t: "\"My kids have not stopped talking about it.\" Priya, parent", tags: ["test"],
    why: "A parent's voice reassures other parents that it is a good day out for the family.", clue: "Who is speaking here: the advert, or someone else?" },
  { t: "Why sit on the sofa when there is a wall to conquer?", tags: ["rq"],
    why: "Nobody answers this out loud: it makes staying in sound boring and climbing sound like an adventure.", clue: "Look at how it ends: is it really waiting for an answer?" },
  { t: "Your first climb could be the start of something big.", tags: ["da"],
    why: "Your speaks straight to the reader and puts them in the picture.", clue: "Who is this sentence talking to?" }
];
var TARGETS = PH.filter(function(p){ return p.tags.length; }).length;

function adHTML(ph){
  function f(n){ return ph ? ph(n) : PH[n].t; }
  return '<div class="ad">' +
    '<div class="adtop"><span class="adlogo">SUMMIT</span><span class="adsub">climbing centre &middot; Brackenford</span></div>' +
    '<h4 class="adh">' + f(0) + '</h4>' +
    '<p class="adq">' + f(1) + '</p>' +
    '<div class="pic">' + PIC + '</div><p class="cap">Our beginners\' wall, Saturday family session</p>' +
    '<p>' + f(2) + ' ' + f(3) + ' ' + f(4) + ' ' + f(5) + '</p>' +
    '<div class="adquote">' + f(6) + '</div>' +
    '<p>' + f(7) + ' ' + f(8) + ' ' + f(9) + '</p>' +
    '<div class="adquote">' + f(10) + '</div>' +
    '<p class="adbig">' + f(11) + ' ' + f(12) + '</p>' +
    '<div class="adinfo"><b>THE SMALL PRINT</b><ul>' +
    '<li>Taster sessions every day, 10am to 8pm</li>' +
    '<li>&pound;12 for one hour, all kit included</li>' +
    '<li>Under 16s climb with an adult</li>' +
    '<li>Book at the front desk or online</li>' +
    '</ul></div></div>';
}
var SRC_A = '<p class="tiny" style="margin:10px 0 0"><b>Source A</b> A leaflet handed out in Brackenford town centre.</p>' + adHTML();

/* ---------- Source B: the news report ---------- */
var SRC_B = '<p class="tiny" style="margin:10px 0 0"><b>Source B</b> A report from the local paper.</p>' +
'<div class="news">' +
'<p class="npaper">Brackenford Weekly &middot; Local news</p>' +
'<h4>Old mill reopens as climbing centre</h4>' +
'<p>A climbing centre has opened in the old mill on Canal Street, which had stood empty for twelve years.</p>' +
'<p>Summit cost &pound;1.4 million to build. It has 26 climbing walls, and the tallest is 15 metres high. The centre employs 18 staff, including six qualified instructors.</p>' +
'<p>A one hour taster session costs &pound;12, and under 16s must climb with an adult. The centre is open every day from 10am to 8pm.</p>' +
'<p>The manager said: "We want everyone in Brackenford to give climbing a try."</p>' +
'<p>However, some neighbours have raised concerns about parking. The centre has 30 spaces, and the council has advised visitors to use the bus where possible. A council spokesperson said the situation would be reviewed in the spring.</p>' +
'</div>';

function fold(label, src){ return '<details class="working"><summary>' + label + ' (tap to open)</summary>' + src + '</details>'; }
var FOLD_A = fold("Source A, the advert", SRC_A);
var FOLD_B = fold("Source B, the news report", SRC_B);
var FOLD_AB = FOLD_A + FOLD_B;

/* ---------- Highlighter pens ---------- */
var RANKS = [[1, "Head of Advertising"], [4, "Ace copywriter"], [8, "Copywriter"], [999, "Work experience star, with promise"]];
var DECOY_MSG = [
  "<b>Plain information.</b> Useful, but not one of the six features. Nothing to tag there.",
  "<b>Nothing to tag.</b> That one just tells you a fact about the place.",
  "<b>Not a feature.</b> No you, no question, no est word, no figure, no exclamation mark, no customer quote."
];

function highlighter(el, api){
  var d = api.data;
  if(!d.tag) d.tag = {};
  if(d.miss === undefined) d.miss = 0;
  var pen = null, msg = "", tries = {};

  function done(){ return Object.keys(d.tag).length; }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }

  function phrase(n){
    var t = d.tag[n];
    if(t){
      var P = PEN[t.p];
      return '<button type="button" class="ph tag" data-n="' + n + '" style="background:' + P.col + '" aria-label="' + PH[n].t.replace(/"/g, "") + ', tagged ' + P.name + '">' + PH[n].t + '<span class="tl">' + (P.short || P.name) + '</span></button>';
    }
    return '<button type="button" class="ph" data-n="' + n + '">' + PH[n].t + '</button>';
  }

  function draw(){
    if(done() >= TARGETS){ drawEnd(); return; }
    var pens = PEN_ORDER.map(function(k){
      return '<button type="button" data-p="' + k + '" class="' + (pen === k ? "sel" : "") + '" style="background:' + PEN[k].col + '" aria-pressed="' + (pen === k ? "true" : "false") + '">' + PEN[k].name + '</button>';
    }).join("");
    var row = d.miss > 0 ? '<button class="btn btn-quiet" type="button" id="hpShow">Show me one</button>' : "";
    el.innerHTML = '<div class="hp">' +
      '<div class="hpbar"><span>Tagged ' + done() + ' / ' + TARGETS + '</span><span>Misses ' + d.miss + '</span></div>' +
      '<div class="hppens"><div class="pgrid">' + pens + '</div>' +
      '<div class="hpmsg" aria-live="polite">' + (msg || (pen ? "Now tap a line in the advert that uses <b>" + PEN[pen].name.toLowerCase() + "</b>." : "Pick a pen, then tap a line in the advert that uses that feature. Some lines are just plain information.")) + '</div>' +
      '<div class="hprow">' + row + '</div></div>' +
      adHTML(phrase) + '</div>';
    [].forEach.call(el.querySelectorAll(".hppens button[data-p]"), function(b){
      b.onclick = function(){ pen = pen === b.dataset.p ? null : b.dataset.p; msg = ""; draw(); };
    });
    [].forEach.call(el.querySelectorAll(".ph"), function(b){
      b.onclick = function(){ tap(+b.dataset.n); };
    });
    var sh = el.querySelector("#hpShow");
    if(sh) sh.onclick = showOne;
  }

  function shake(n){
    var b = el.querySelector('.ph[data-n="' + n + '"]');
    if(b) b.classList.add("shake");
  }

  function tap(n){
    var P = PH[n];
    if(d.tag[n]){ msg = "<b>Already tagged.</b> " + P.why; draw(); return; }
    if(!pen){ msg = "<b>Pick a pen first.</b> Which feature do you think that line uses?"; draw(); shake(n); return; }
    if(!P.tags.length){
      d.miss++; api.save();
      msg = DECOY_MSG[d.miss % DECOY_MSG.length];
      draw(); shake(n); return;
    }
    if(P.tags.indexOf(pen) >= 0){
      d.tag[n] = { p: pen };
      api.save();
      var also = P.tags.length > 1 ? " (It works as " + P.tags.map(function(k){ return PEN[k].name.toLowerCase(); }).join(" and ") + ": either pen counts.)" : "";
      msg = "<b>" + PEN[pen].name + ".</b> " + P.why + also;
      draw(); return;
    }
    d.miss++; tries[n] = (tries[n] || 0) + 1; api.save();
    msg = "<b>That line is persuasive, but not with that pen.</b> Clue: " + P.clue;
    draw(); shake(n);
  }

  function showOne(){
    for(var n = 0; n < PH.length; n++){
      if(PH[n].tags.length && !d.tag[n]){
        d.tag[n] = { p: PH[n].tags[0], shown: true }; d.shown = true; api.save();
        msg = "<b>Here is one: " + PEN[PH[n].tags[0]].name.toLowerCase() + ".</b> " + PH[n].why;
        draw();
        var b = el.querySelector('.ph[data-n="' + n + '"]');
        if(b && b.scrollIntoView) b.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
    }
  }

  function drawEnd(){
    var rank = RANKS[RANKS.length - 1][1];
    for(var k = 0; k < RANKS.length; k++) if(d.miss <= RANKS[k][0]){ rank = RANKS[k][1]; break; }
    var count = {};
    Object.keys(d.tag).forEach(function(n){ var p = d.tag[n].p; count[p] = (count[p] || 0) + 1; });
    var sum = PEN_ORDER.map(function(p){ return count[p] ? '<span style="background:' + PEN[p].col + '">' + PEN[p].name + ' &times; ' + count[p] + '</span>' : ""; }).join("");
    el.innerHTML = '<div class="hp"><div class="hpend">' +
      '<p style="margin:0;color:#c9cdf0">All ' + TARGETS + ' features tagged. Your job title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>' + d.miss + ' miss' + (d.miss === 1 ? '' : 'es') + (d.shown ? ', with a little help from Show me' : '') + '.</p>' +
