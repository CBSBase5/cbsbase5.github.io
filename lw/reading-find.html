.src{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;text-align:left;font-size:1rem;line-height:1.55}

.src h5{font-family:var(--display);font-size:.98rem;margin:14px 0 6px;padding:3px 10px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:0 8px 8px 0}

.src li{margin:0 0 4px}
.src .stitle{font-size:1.45rem;margin:2px 0 6px}

.src .photo{margin:6px 0 0}
.src .photo svg{width:100%;height:auto;display:block;border-radius:10px}
.src table.stab{border-collapse:collapse;width:100%;margin:0 0 8px;font-size:.95rem}
.src table.stab td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.src table.stab td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.src.web{border-top:10px solid #22b8e6}
.src.notice{border:3px dashed #ff5d5d;background:#fffdf6}
.src.notice .nban{display:inline-block;background:#ff5d5d;color:#fff;font-family:var(--display);font-weight:700;letter-spacing:.12em;padding:3px 10px;border-radius:6px;margin:0 0 8px;font-size:.85rem}
.src.notice .sign{font-size:.9rem;color:var(--body-tint);margin:8px 0 0}
.src.box{border-top:10px solid #8a5cf6}
.hb{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;text-align:left}
.hb .src{flex:1 1 220px;max-width:330px;margin:0}
.hb table.stab td:last-child{font-weight:400}

.sr{background:var(--ink);color:#fff;border-radius:16px;padding:12px;margin:6px 0}
.srbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;margin-bottom:10px}
.srbar span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.88rem}
.srbar button{font-family:var(--display);font-weight:700;font-size:.85rem;color:#fff;background:transparent;border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 12px;cursor:pointer;min-height:34px}
.srbar button.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.srfind{position:sticky;top:6px;z-index:3;background:#26203f;border:2px solid var(--sun);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.srfind small{display:block;font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;color:var(--sun)}
.srfind .srq{font-size:1.08rem;line-height:1.35;font-weight:700;margin:2px 0 0}
.srmsg{font-size:.95rem;line-height:1.45;margin:8px 0 0;color:#e6e3f5;min-height:1.3em}
.srmsg b{color:var(--sun)}
.srrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.srrow:empty{display:none}
.srsrc{background:#fff;color:var(--ink);border-radius:12px;padding:8px}
.srname{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--body-tint);padding:2px 4px 6px}
.srsrc button{display:flex;justify-content:space-between;gap:10px;width:100%;font-family:inherit;font-size:.95rem;line-height:1.35;text-align:left;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:9px;padding:6px 8px;margin:1px 0;cursor:pointer;min-height:38px}
.srsrc button:hover{background:var(--paper)}
.srsrc button.k-h1{font-family:var(--display);font-weight:700;font-size:1.1rem}
.srsrc button.k-title{font-family:var(--display);font-weight:700;font-size:1.2rem}
.srsrc button.k-h2{font-family:var(--display);font-weight:700;background:var(--accent-soft);margin-top:8px}
.srsrc button.k-li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--ink);margin-top:7px;order:-1}
.srsrc button.k-li{justify-content:flex-start}
.srsrc button.k-note{font-size:.86rem;color:var(--body-tint)}
.srsrc button .rv{font-weight:700;white-space:nowrap}
.srsrc button.hit{background:#d8f6ec;border-color:var(--mint)}
.srsrc button.showd{background:#fff3c4;border-color:var(--sun)}
.srsrc button.shake{animation:nudge .35s;border-color:var(--coral);background:#ffe9e9}
.srend{text-align:center;padding:6px 2px}
.srend .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--sun);line-height:1.1;margin:6px 0}

@media (max-width:420px){

function srcHTML(lines, cls){
  var out = '<div class="src ' + cls + '">', i = 0;
  while(i < lines.length){
    var L = lines[i], k = L[0];
    if(k === "row"){
      out += '<table class="stab">';

      out += '</table>'; continue;
    }
    if(k === "li"){
      out += '<ul>';
      while(i < lines.length && lines[i][0] === "li"){ out += '<li>' + lines[i][1] + '</li>'; i++; }
      out += '</ul>'; continue;
    }
    if(k === "h1") out += '<h4>' + L[1] + '</h4>';
    else if(k === "title") out += '<h4 class="stitle">' + L[1] + '</h4>';
    else if(k === "small") out += '<p class="ssmall">' + L[1] + '</p>';
    else if(k === "h2") out += '<h5>' + L[1] + '</h5>';
    else if(k === "note") out += '<p class="snote">' + L[1] + '</p>';
    else if(k === "photo") out += '<div class="photo">' + L[1] + '</div><p class="cap">' + L[2] + '</p>';
    else out += '<p>' + L[1] + '</p>';
    i++;
  }
  return out + '</div>';

function scanRace(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.res) d.res = [];
  if(!d.times) d.times = [];
  if(d.miss === undefined) d.miss = 0;
  if(d.t === undefined) d.t = 0;
  var t0 = Date.now(), tick = null, msg = "";

  function firstGo(){ return d.res.filter(function(x){ return x === "1"; }).length; }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }
  function secs(){ return Math.round((Date.now() - t0) / 1000); }
  function fmt(s){ var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
  function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
  function startTick(){
    stopTick();
    if(!d.clock) return;
    tick = setInterval(function(){
      var c = el.querySelector("#srClockTime");
      if(!c || !el.isConnected){ stopTick(); return; }
      c.textContent = fmt(secs());
    }, 250);
  }

  function bar(){
    return '<div class="srbar"><span>Fact ' + Math.min(d.r + 1, ROUNDS.length) + ' of ' + ROUNDS.length + '</span>' +
      '<span>First go: ' + firstGo() + '</span>' +
      '<button type="button" id="srClock" class="' + (d.clock ? "on" : "") + '" aria-pressed="' + (d.clock ? "true" : "false") + '">' +
      (d.clock ? 'Clock on <span id="srClockTime">' + fmt(secs()) + '</span>' : "Clock: off") + '</button></div>';
  }

  function draw(){
    if(d.r >= ROUNDS.length){ drawEnd(); return; }
    var R = ROUNDS[d.r], S = RACE_SRC[R.s];
    var solved = d.res.length > d.r;
    var row = "";
    if(solved) row = '<button class="btn" type="button" id="srNext">' + (d.r === ROUNDS.length - 1 ? "See how you did" : "Next fact") + '</button>';
    else if(d.t > 0) row = '<button class="btn btn-quiet" type="button" id="srShow">Show me</button>';
    if(!msg) msg = solved ? "<b>Found it:</b> " + R.ans + ". " + R.tip : (d.r === 0 ? "Tap the line that holds the answer. No rush: the clock is off unless you want it." : "Tap the line that holds the answer.");
    el.innerHTML = '<div class="sr">' + bar() +
      '<div class="srfind"><small>Find this</small><p class="srq">' + R.q + '</p>' +
      '<div class="srmsg" aria-live="polite">' + msg + '</div><div class="srrow">' + row + '</div></div>' +
      '<div class="srsrc"><div class="srname">' + S.name + '</div><div id="srLines"></div></div></div>';
    var box = el.querySelector("#srLines");
    S.lines.forEach(function(L, k){
      if(L[0] === "photo") return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "k-" + L[0];
      b.innerHTML = L[0] === "row" ? '<span>' + L[1] + '</span><span class="rv">' + L[2] + '</span>' : '<span>' + L[1] + '</span>';
      if(solved && k === R.line) b.classList.add(d.res[d.r] === "s" ? "showd" : "hit");
      b.onclick = function(){ tap(k, b); };
      box.appendChild(b);
    });
    var c = el.querySelector("#srClock");
    c.onclick = function(){ d.clock = !d.clock; t0 = Date.now(); api.save(); draw(); };
    var nx = el.querySelector("#srNext");
    if(nx) nx.onclick = function(){
      d.r++; d.t = 0; msg = ""; t0 = Date.now(); api.save(); draw();
      var top = el.querySelector(".sr"); if(top && top.scrollIntoView) top.scrollIntoView({ block: "start", behavior: "smooth" });
    };
    var sh = el.querySelector("#srShow");
    if(sh) sh.onclick = showMe;
    if(!solved) startTick(); else stopTick();
  }

  function tap(k, btn){
    var R = ROUNDS[d.r];
    if(d.res.length > d.r) return;
    if(k === R.line){
      d.res.push(d.t ? "2" : "1");
      if(d.clock) d.times[d.r] = secs();
      msg = "<b>" + (d.t ? "Got it." : "First go!") + "</b> " + R.ans + ". " + R.tip + (d.clock ? " (" + fmt(secs()) + ")" : "");
      api.save(); draw();
      return;
    }
    d.t++; d.miss++;
    msg = d.t === 1 ? "<b>Not that line.</b> Scan for: <b>" + R.key + "</b>." : "<b>Still not it.</b> Have another look, or tap Show me.";
    api.save(); draw();
    /* buttons skip the photo line, so map the line index to its button */
    var drawn = RACE_SRC[R.s].lines.map(function(L, n){ return L[0] === "photo" ? -1 : n; }).filter(function(n){ return n >= 0; });
    var again = el.querySelectorAll("#srLines button")[drawn.indexOf(k)];
    if(again) again.classList.add("shake");
  }

  function showMe(){
    var R = ROUNDS[d.r];
    if(d.res.length > d.r) return;
    d.res.push("s"); d.shown = true;
    msg = "<b>Here it is.</b> " + R.ans + ". " + R.tip;
    api.save(); draw();
    var h = el.querySelector("#srLines .showd"); if(h && h.scrollIntoView) h.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function drawEnd(){
    stopTick();
    var n = firstGo(), rank = RANKS[RANKS.length - 1][1];
    for(var k = 0; k < RANKS.length; k++) if(n >= RANKS[k][0]){ rank = RANKS[k][1]; break; }
    var total = 0, timed = 0;
    d.times.forEach(function(t){ if(t !== null && t !== undefined){ total += t; timed++; } });
    if(timed === ROUNDS.length && (!d.best || total < d.best)) d.best = total;
    var dots = d.res.map(function(x){
      var col = x === "1" ? "#19c39a" : x === "2" ? "#22b8e6" : "#ffd23f";
      return '<i style="background:' + col + '">' + (x === "1" ? "1" : x === "2" ? "2" : "S") + '</i>';
    }).join("");
    el.innerHTML = '<div class="sr"><div class="srend">' +
      '<p style="margin:0;color:#c9cdf0">All eight facts found. Your title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>' + n + ' of ' + ROUNDS.length + ' found first go' + (d.shown ? ', with a little help from Show me' : '') + '.</p>' +
      '<div class="srdots" aria-label="How each fact went">' + dots + '</div>' +
      (timed === ROUNDS.length ? '<p>Time with the clock on: <b>' + fmt(total) + '</b>' + (d.best ? ' (your best: ' + fmt(d.best) + ')' : '') + '</p>' : '') +
      '<p style="color:#c9cdf0;font-size:.95rem">That is the reading paper in miniature: key word, headings, answer shape, then read the line properly.</p>' +
      '<button class="btn btn-quiet" type="button" id="srAgain">Play again' + (d.clock ? '' : ', maybe with the clock on') + '</button></div></div>';
    el.querySelector("#srAgain").onclick = function(){
      d.r = 0; d.res = []; d.times = []; d.miss = 0; d.t = 0; d.shown = false; d.finished = false; msg = ""; t0 = Date.now(); api.save(); draw();
    };
    d.finished = true; api.save();
    api.done(result());
  }

  draw();
}
