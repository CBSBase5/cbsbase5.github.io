<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function M(v){ return v < 0 ? "&minus;" + Math.abs(v) : String(v); }

/* ---------- figures ---------- */

/* Place value columns for 305,040 */
var PV = (function(){
  var heads = ["100,000", "10,000", "1000", "100", "10", "1"];
  var digs = ["3", "0", "5", "0", "4", "0"];
  var s = '<svg viewBox="0 0 380 170" role="img" aria-label="Place value columns: 3 hundred thousands, 0 ten thousands, 5 thousands, 0 hundreds, 4 tens, 0 ones. 305,040 is three hundred and five thousand and forty.">';
  s += '<path d="M14 20 V14 H186 V20" fill="none" stroke="' + BLUE + '" stroke-width="2.5"/>';
  s += t(100, 10, "the thousands", 14, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<path d="M194 20 V14 H366 V20" fill="none" stroke="' + VIOLET + '" stroke-width="2.5"/>';
  s += t(280, 10, "the rest", 14, VIOLET, LAB + ' font-weight="700" text-anchor="middle"');
  for(var k = 0; k < 6; k++){
    var x = 10 + k * 60;
    s += '<rect x="' + x + '" y="26" width="60" height="28" fill="' + (k < 3 ? "#e6eaff" : "#efe8ff") + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t(x + 30, 46, heads[k], 14, INK, LAB + ' font-weight="700" text-anchor="middle"');
    s += '<rect x="' + x + '" y="54" width="60" height="50" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t(x + 30, 90, digs[k], 30, digs[k] === "0" ? "#8a8fa8" : INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += t(190, 134, "305,040", 22, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(190, 160, "three hundred and five thousand and forty", 15, INK, BODY + ' text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Number line: 4 falls 7 to -3 */
var NLINE = (function(){
  function X(v){ return 190 + v * 27; }
  var s = '<svg viewBox="0 0 380 140" role="img" aria-label="Number line from minus 6 to 6. A jump of 4 from 4 down to 0, then 3 more from 0 down to minus 3. 4 falls by 7 to minus 3.">';
  s += '<line x1="18" y1="96" x2="362" y2="96" stroke="' + INK + '" stroke-width="2.5"/>';
  for(var v = -6; v <= 6; v++){
    s += '<line x1="' + X(v) + '" y1="89" x2="' + X(v) + '" y2="103" stroke="' + INK + '" stroke-width="2"/>';
    s += t(X(v), 124, M(v), 15, v === 0 ? BLUE : INK, LAB + ' text-anchor="middle"' + (v === 0 || v === 4 || v === -3 ? ' font-weight="700"' : ""));
  }
  s += '<path d="M' + X(4) + ' 86 Q' + ((X(4) + X(0)) / 2) + ' 40 ' + X(0) + ' 86" fill="none" stroke="' + VIOLET + '" stroke-width="3"/>';
  s += '<path d="M' + (X(0) + 3) + ' 74 L' + X(0) + ' 86 L' + (X(0) + 12) + ' 80" fill="none" stroke="' + VIOLET + '" stroke-width="3"/>';
  s += t((X(4) + X(0)) / 2, 54, "down 4", 15, VIOLET, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<path d="M' + X(0) + ' 86 Q' + ((X(0) + X(-3)) / 2) + ' 50 ' + X(-3) + ' 86" fill="none" stroke="' + CORAL + '" stroke-width="3"/>';
  s += '<path d="M' + (X(-3) + 3) + ' 74 L' + X(-3) + ' 86 L' + (X(-3) + 12) + ' 80" fill="none" stroke="' + CORAL + '" stroke-width="3"/>';
  s += t((X(0) + X(-3)) / 2, 62, "down 3", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(190, 22, "4&deg;C falls 7 degrees: 4 then 3 more", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Digits shift two places for x 100 */
var SHIFT = (function(){
  var heads = ["H", "T", "O", "t", "h"];
  var s = '<svg viewBox="0 0 380 214" role="img" aria-label="3.75 times 100. Each digit moves two places to the left: 3 ones becomes 3 hundreds, 7 tenths becomes 7 tens, 5 hundredths becomes 5 ones. The answer is 375.">';
  function cx(k){ return 70 + k * 60 + (k > 2 ? 20 : 0); }
  for(var k = 0; k < 5; k++) s += t(cx(k), 22, heads[k], 16, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(2, 68, "3.75", 15, INK, LAB + ' font-weight="700"');
  s += t(4, 158, "375", 15, BLUE, LAB + ' font-weight="700"');
  var top = { 2: "3", 3: "7", 4: "5" }, bot = { 0: "3", 1: "7", 2: "5" };
  for(k = 0; k < 5; k++){
    s += '<rect x="' + (cx(k) - 22) + '" y="40" width="44" height="44" rx="8" fill="' + (top[k] ? WHITE : PAPER) + '" stroke="' + INK + '" stroke-width="2"/>';
    if(top[k]) s += t(cx(k), 71, top[k], 24, INK, LAB + ' font-weight="700" text-anchor="middle"');
    s += '<rect x="' + (cx(k) - 22) + '" y="130" width="44" height="44" rx="8" fill="' + (bot[k] ? "#e6eaff" : PAPER) + '" stroke="' + INK + '" stroke-width="2"/>';
    if(bot[k]) s += t(cx(k), 161, bot[k], 24, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += '<circle cx="' + (cx(2) + 40) + '" cy="78" r="4" fill="' + INK + '"/>';
  for(k = 2; k < 5; k++){
    s += '<path d="M' + cx(k) + ' 88 L' + (cx(k - 2) + 6) + ' 124" stroke="' + VIOLET + '" stroke-width="2.5"/>';
    s += '<path d="M' + (cx(k - 2) + 4) + ' 112 L' + (cx(k - 2) + 6) + ' 124 L' + (cx(k - 2) + 17) + ' 119" fill="none" stroke="' + VIOLET + '" stroke-width="2.5"/>';
  }
  s += t(190, 204, "&times; 100: every digit moves 2 places left", 16, VIOLET, BODY + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Column addition and subtraction */
var COLS = (function(){
  var s = '<svg viewBox="0 0 380 200" role="img" aria-label="Column addition: 2475 plus 1386 equals 3861, with carries of 1 into the tens and the hundreds. Column subtraction: 724 minus 358 equals 366: the 4 becomes 14, the 2 tens become 11, the 7 hundreds become 6.">';
  function col(x0, digs, y, fill){
    for(var k = 0; k < digs.length; k++) if(digs[k] !== " ") s += t(x0 + k * 26, y, digs[k], 24, fill || INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  /* addition */
  s += t(80, 16, "Add", 16, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  col(50, "2475", 60);
  s += t(16, 96, "+", 24, INK, LAB + ' font-weight="700"');
  col(50, "1386", 96);
  s += '<line x1="30" y1="108" x2="140" y2="108" stroke="' + INK + '" stroke-width="2.5"/>';
  col(50, "3861", 142);
  s += '<line x1="30" y1="152" x2="140" y2="152" stroke="' + INK + '" stroke-width="2.5"/>';
  s += t(76, 172, "1", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(102, 172, "1", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(80, 194, "carries", 14, CORAL, BODY + ' text-anchor="middle"');
  /* subtraction */
  s += t(290, 16, "Subtract", 16, VIOLET, LAB + ' font-weight="700" text-anchor="middle"');
  col(264, "724", 62);
  s += '<line x1="256" y1="58" x2="272" y2="40" stroke="' + CORAL + '" stroke-width="2.5"/>';
  s += t(264, 36, "6", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<line x1="282" y1="58" x2="298" y2="40" stroke="' + CORAL + '" stroke-width="2.5"/>';
  s += t(290, 36, "11", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(307, 46, "1", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(230, 96, "&minus;", 24, INK, LAB + ' font-weight="700"');
  col(264, "358", 96);
  s += '<line x1="244" y1="108" x2="340" y2="108" stroke="' + INK + '" stroke-width="2.5"/>';
  col(264, "366", 142);
  s += '<line x1="244" y1="152" x2="340" y2="152" stroke="' + INK + '" stroke-width="2.5"/>';
  s += t(290, 178, "exchanges", 14, CORAL, BODY + ' text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Bus stop division 852 / 6 */
var BUS = (function(){
  var s = '<svg viewBox="0 0 380 130" role="img" aria-label="Short division: 852 divided by 6. 8 divided by 6 is 1 remainder 2. 25 divided by 6 is 4 remainder 1. 12 divided by 6 is 2. The answer is 142.">';
  s += t(84, 52, "1", 26, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(124, 52, "4", 26, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(164, 52, "2", 26, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<path d="M60 64 H190 M60 64 V112" fill="none" stroke="' + INK + '" stroke-width="3"/>';
  s += t(40, 98, "6", 26, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(84, 98, "8", 26, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(124, 98, "5", 26, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(164, 98, "2", 26, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(112, 86, "2", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(152, 86, "1", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(214, 44, "8 &divide; 6 = 1 r 2", 16, INK, BODY);
  s += t(214, 70, "25 &divide; 6 = 4 r 1", 16, INK, BODY);
  s += t(214, 96, "12 &divide; 6 = 2", 16, INK, BODY);
  s += t(214, 122, "so 852 &divide; 6 = 142", 16, BLUE, BODY + ' font-weight="700"');
  s += '</svg>';
  return s;
})();

/* Squares as grids */
var SQ = (function(){
  var s = '<svg viewBox="0 0 380 130" role="img" aria-label="Square numbers drawn as grids: 3 by 3 makes 9, 4 by 4 makes 16, 5 by 5 makes 25.">';
  var sizes = [3, 4, 5], x0 = [20, 130, 250], cell = 18;
  for(var n = 0; n < 3; n++){
    var k = sizes[n];
    for(var r = 0; r < k; r++) for(var c = 0; c < k; c++){
      s += '<rect x="' + (x0[n] + c * cell) + '" y="' + (8 + r * cell) + '" width="' + cell + '" height="' + cell + '" fill="' + [CYAN, MINT, SUN][n] + '" stroke="' + INK + '" stroke-width="1.5"/>';
    }
    s += t(x0[n] + k * cell / 2, 122, k + "&sup2; = " + (k * k), 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += '</svg>';
  return s;
})();

/* Formula machine */
var FLOW =
'<svg viewBox="0 0 380 130" role="img" aria-label="Formula as a flow: hours, times 28, plus 35, gives the cost. 3 hours: times 28 is 84, plus 35 is 119 pounds.">' +
'<rect x="4" y="22" width="70" height="44" rx="10" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(39, 50, "hours", 15, INK, LAB + ' font-weight="700" text-anchor="middle"') +
'<path d="M76 44 H98" stroke="' + INK + '" stroke-width="2.5"/><path d="M92 38 L99 44 L92 50" fill="none" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="102" y="18" width="84" height="52" rx="12" fill="' + BLUE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(144, 51, "&times; 28", 20, WHITE, LAB + ' font-weight="700" text-anchor="middle"') +
'<path d="M188 44 H210" stroke="' + INK + '" stroke-width="2.5"/><path d="M204 38 L211 44 L204 50" fill="none" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="214" y="18" width="84" height="52" rx="12" fill="' + VIOLET + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(256, 51, "+ 35", 20, WHITE, LAB + ' font-weight="700" text-anchor="middle"') +
'<path d="M300 44 H322" stroke="' + INK + '" stroke-width="2.5"/><path d="M316 38 L323 44 L316 50" fill="none" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="326" y="22" width="50" height="44" rx="10" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(351, 50, "cost", 15, INK, LAB + ' font-weight="700" text-anchor="middle"') +
t(39, 100, "3", 18, INK, LAB + ' font-weight="700" text-anchor="middle"') +
t(144, 100, "84", 18, BLUE, LAB + ' font-weight="700" text-anchor="middle"') +
t(256, 100, "119", 18, VIOLET, LAB + ' font-weight="700" text-anchor="middle"') +
t(351, 100, "&pound;119", 18, INK, LAB + ' font-weight="700" text-anchor="middle"') +
t(190, 124, "3 hours: 3 &times; 28 = 84, then 84 + 35 = 119", 15, INK, BODY + ' text-anchor="middle"') +
'</svg>';

/* Rounding number line */
var ROUND = (function(){
  function X(v){ return 30 + (v - 3400) * 3.2; }
  var s = '<svg viewBox="0 0 380 120" role="img" aria-label="Number line from 3400 to 3500. 3478 is past the halfway mark of 3450, so it rounds up to 3500.">';
  s += '<line x1="' + X(3400) + '" y1="70" x2="' + X(3500) + '" y2="70" stroke="' + INK + '" stroke-width="2.5"/>';
  for(var v = 3400; v <= 3500; v += 10){
    var big = v === 3400 || v === 3500;
    s += '<line x1="' + X(v) + '" y1="' + (big ? 58 : 64) + '" x2="' + X(v) + '" y2="' + (big ? 82 : 76) + '" stroke="' + INK + '" stroke-width="2"/>';
  }
  s += t(X(3400), 104, "3400", 16, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(X(3500), 104, "3500", 16, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<line x1="' + X(3450) + '" y1="40" x2="' + X(3450) + '" y2="88" stroke="' + VIOLET + '" stroke-width="2" stroke-dasharray="5 4"/>';
  s += t(X(3450), 104, "3450 halfway", 14, VIOLET, BODY + ' text-anchor="middle"');
  s += '<circle cx="' + X(3478) + '" cy="70" r="7" fill="' + CORAL + '" stroke="' + INK + '" stroke-width="2"/>';
  s += t(X(3478), 40, "3478", 17, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
  s += '<path d="M' + (X(3478) + 10) + ' 60 Q' + ((X(3478) + X(3500)) / 2) + ' 40 ' + (X(3500) - 2) + ' 60" fill="none" stroke="' + BLUE + '" stroke-width="2.5"/>';
  s += t(190, 20, "3478 is nearer 3500 than 3400", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* ---------- Frost watch widget ---------- */
var FW = [
  { start: 4, target: -3, sl: "6pm",
    ctx: "At 6pm the thermometer at the garden centre reads <b>4&deg;C</b>. Overnight the temperature <b>falls by 7 degrees</b>.",
    ask: "Set the thermometer to the overnight low.",
    hint: "Count down 4 degrees to reach 0, then keep going for the rest of the 7.",
    why: "From 4 down to 0 is 4 degrees. That leaves 3 more to fall, so it lands on <b>&minus;3&deg;C</b>. As a sum: 4 &minus; 7 = &minus;3." },
  { start: -3, target: 6, sl: "dawn",
    ctx: "From that low of <b>&minus;3&deg;C</b>, the sun comes out and it <b>warms up by 9 degrees</b> by midday.",
    ask: "Set the midday temperature.",
    hint: "Count up 3 degrees to reach 0 first. How many of the 9 are left after that?",
    why: "From &minus;3 up to 0 is 3 degrees. 9 &minus; 3 = 6 more, so it reaches <b>6&deg;C</b>. As a sum: &minus;3 + 9 = 6." },
  { start: -5, target: -8, sl: "Tue",
    ctx: "On Tuesday night it was <b>&minus;5&deg;C</b>. Wednesday night was <b>3 degrees colder</b>.",
    ask: "Set Wednesday night's temperature.",
    hint: "Colder means further down the thermometer, further below zero.",
    why: "Colder means down. 3 down from &minus;5 is <b>&minus;8&deg;C</b>. It can feel odd because 8 is bigger than 5, but &minus;8 is further below zero, so it is colder." },
  { start: -4, target: 7, sl: "outside",
    ctx: "Outside it is <b>&minus;4&deg;C</b>. The heated greenhouse is <b>11 degrees warmer</b> than outside.",
    ask: "Set the greenhouse temperature.",
    hint: "Warmer means up. 4 of the 11 degrees get you to 0. Where do the rest take you?",
    why: "From &minus;4 up to 0 uses 4 degrees, leaving 11 &minus; 4 = 7, so the greenhouse is <b>7&deg;C</b>. Going the other way, the difference between 7 and &minus;4 is 7 + 4 = 11 degrees." }
];
var FWN = FW.length, FWMIN = -10, FWMAX = 10;
function fwY(v){ return 175 - v * 15; }

function mountFrost(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(!d.miss) d.miss = [0, 0, 0, 0];
  if(!d.shown) d.shown = [false, false, false, false];
  if(typeof d.v !== "number") d.v = d.c < FWN ? FW[d.c].start : 0;
  var view = d.c;

  el.innerHTML =
    '<div class="wpanel fw-task" data-r="task"></div>' +
    '<div class="fw-grid"><div class="fw-svg" data-r="svg" title="Tap the scale to set the temperature"></div><div>' +
    '<div class="wpanel">' +
      '<div class="wrow fw-read"><span>Thermometer reads</span><span class="wbig" data-r="read"></span></div>' +
      '<p class="wnote" data-r="note"></p>' +
      '<div class="wrow fw-btns">' +
        '<button class="btn btn-quiet" type="button" data-r="down">&#9660; Colder</button>' +
        '<button class="btn btn-quiet" type="button" data-r="up">&#9650; Warmer</button>' +
        '<button class="btn" type="button" data-r="lock">Lock it in</button>' +
        '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
      '</div>' +
    '</div>' +
    '<div class="fb fw-fb hidden" data-r="fb" aria-live="polite"></div></div></div>';

  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

  function start(){ return view < FWN ? FW[view].start : 0; }

  function svg(){
    var v = d.v, st = start(), y = fwY(v), ys = fwY(st);
    var s = '<svg viewBox="0 0 280 380" role="img" aria-label="Thermometer from minus 10 to 10 degrees, reading ' + v + ' degrees' + (view < FWN ? ", start mark at " + st : "") + '">';
    s += '<rect x="50" y="175" width="226" height="' + (fwY(FWMIN) + 8 - 175) + '" fill="' + CYAN + '" opacity=".12"/>';
    s += '<line x1="50" y1="175" x2="80" y2="175" stroke="' + CYAN + '" stroke-width="2.5" stroke-dasharray="7 5"/>';
    s += '<line x1="158" y1="175" x2="276" y2="175" stroke="' + CYAN + '" stroke-width="2.5" stroke-dasharray="7 5"/>';
    s += '<rect x="80" y="8" width="36" height="340" rx="18" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<circle cx="98" cy="352" r="20" fill="' + CORAL + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<rect x="89" y="' + y + '" width="18" height="' + (342 - y) + '" fill="' + CORAL + '"/>';
    for(var k = FWMIN; k <= FWMAX; k++){
      var yy = fwY(k), even = k % 2 === 0;
      s += '<line x1="116" y1="' + yy + '" x2="' + (even ? 130 : 124) + '" y2="' + yy + '" stroke="' + INK + '" stroke-width="' + (even ? 2 : 1.5) + '"/>';
      if(even) s += t(134, yy + 5, M(k), 15, k === 0 ? BLUE : INK, LAB + (k === 0 ? ' font-weight="700"' : ""));
    }
    s += t(128, 374, "shaded: below 0&deg;C", 14, BLUE, LAB + ' font-weight="700"');
    if(view < FWN){
      s += '<path d="M60 ' + (ys - 8) + ' L76 ' + ys + ' L60 ' + (ys + 8) + ' Z" fill="' + VIOLET + '"/>';
      s += t(56, ys + 5, FW[view].sl, 14, VIOLET, LAB + ' font-weight="700" text-anchor="end"');
    }
    /* current level pointer */
    s += '<path d="M158 ' + y + ' L168 ' + (y - 6) + ' L168 ' + (y + 6) + ' Z" fill="' + INK + '"/>';
    s += '<line x1="166" y1="' + y + '" x2="196" y2="' + y + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(202, y + 6, M(v) + "&deg;C", 18, INK, LAB + ' font-weight="700"');
    /* jump arrow from start to now */
    if(view < FWN && Math.abs(v - st) > 1){
      var down = v < st, col = down ? VIOLET : CORAL;
      s += '<line x1="182" y1="' + ys + '" x2="182" y2="' + (down ? y - 8 : y + 8) + '" stroke="' + col + '" stroke-width="3"/>';
      s += down ? '<path d="M175 ' + (y - 12) + ' L182 ' + (y - 2) + ' L189 ' + (y - 12) + '" fill="none" stroke="' + col + '" stroke-width="3"/>' :
                  '<path d="M175 ' + (y + 12) + ' L182 ' + (y + 2) + ' L189 ' + (y + 12) + '" fill="none" stroke="' + col + '" stroke-width="3"/>';
      s += '<line x1="146" y1="' + ys + '" x2="182" y2="' + ys + '" stroke="' + VIOLET + '" stroke-width="2" stroke-dasharray="4 3"/>';
    }
    s += '</svg>';
    return s;
  }

  function task(){
    var dots = '<div class="fw-dots" aria-hidden="true">';
    for(var k = 0; k < FWN; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < FWN ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= FWN) return dots + '<p><b>Free play.</b> All four done. Move the temperature around if you like and watch it cross zero.</p>';
    var c = FW[view];
    return dots + '<p class="tiny" style="margin:0 0 4px">Night ' + (view + 1) + ' of ' + FWN + '</p><p>' + c.ctx + '</p><p><b>' + c.ask + '</b> Use the buttons or tap the scale, then Lock it in.</p>';
  }

  function draw(){
    q("task").innerHTML = task();
    q("svg").innerHTML = svg();
    q("read").innerHTML = M(d.v) + "&deg;C";
    var st = start(), diff = d.v - st;
    q("note").innerHTML = view >= FWN ? "Free play: no right or wrong here." :
      (d.miss[view] || d.shown[view] ? "From " + M(st) + "&deg;C that is <b>" + (diff === 0 ? "no change" : (diff < 0 ? "down " : "up ") + Math.abs(diff) + (Math.abs(diff) === 1 ? " degree" : " degrees")) + "</b>." :
       "The purple arrow marks where you start. Count the steps as you go.");
    var waiting = view !== d.c || d.c >= FWN;
    q("lock").disabled = waiting;
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }

  function set(v){
    d.v = Math.max(FWMIN, Math.min(FWMAX, v));
    draw(); api.save();
  }

  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }

  function fb(cls, html){ var f = q("fb"); f.className = "fb fw-fb " + cls; f.innerHTML = html; }

  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= FWN;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here is how this one goes.</b> " : "<b>" + ["Spot on.", "Yes, that is it.", "Nailed it.", "Exactly right."][k % 4] + "</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All four nights done. The trick every time: <b>stop at zero, then count on</b>.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next night</button>';
    fb(how === "shown" ? "show" : "good", head + FW[k].why + more);
    q("next").onclick = function(){
      view = d.c;
      d.v = view < FWN ? FW[view].start : d.v;
      api.save();
      q("fb").className = "fb fw-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }

  q("svg").addEventListener("click", function(e){
    var sv = q("svg").querySelector("svg");
    if(!sv) return;
    var r = sv.getBoundingClientRect();
    var yy = (e.clientY - r.top) * 380 / r.height;
    set(Math.round((175 - yy) / 15));
  });
  q("down").onclick = function(){ set(d.v - 1); };
  q("up").onclick = function(){ set(d.v + 1); };
  q("lock").onclick = function(){
    if(view !== d.c || d.c >= FWN) return;
    var c = FW[view];
    if(d.v === c.target){ solved(view, "right"); return; }
    d.miss[view]++;
    api.save();
    var diff = d.v - c.start;
    fb("nudge", "<b>Not quite yet.</b> That reads " + M(d.v) + "&deg;C, which is " +
      (diff === 0 ? "no change" : (diff < 0 ? "down " : "up ") + Math.abs(diff) + (Math.abs(diff) === 1 ? " degree" : " degrees")) + " from " + M(c.start) + "&deg;C. " + c.hint +
      '<br><span class="tiny">The size of your jump now shows under the reading.</span>');
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= FWN) return;
    d.shown[view] = true;
    d.v = FW[view].target;
    solved(view, "shown");
  };

  draw();
  if(d.c >= FWN && d.result){
    fb("good", "<b>All four nights done.</b> Stop at zero, then count on.");
    api.done(d.result);
  }
}
