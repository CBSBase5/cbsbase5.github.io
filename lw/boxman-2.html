<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box-man 2: pre-production - LW Skills HQ</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/boxman-2.svg" type="image/svg+xml">
<script src="/lw/conf.js?v=1"></script>
<script src="/data/b5site.js?v=8"></script>
<!--
  Box-man 2: pre-production. LW's planning office for his second film.
  Six reels: the pitch, the returning cast, new characters (in the same
  character file format as his first film), the story, a storyboard
  (backdrops, stickers, drawing, shot types, camera moves, sound) and the
  premiere (poster, call sheet, filming order, print, send to Jay).

  Saves under b5.lw. so it follows LW between devices (see /data/b5site.js):
    b5.lw.bm2.v1          the plan
    b5.lw.bm2.d.<shotid>  the drawing on each storyboard shot (vector strokes)
  Pictures of the first film's cast are the game's own sprites in
  /games/boxman/img/. Everything else is drawn in code. ASCII only.
-->
<style>
@font-face{font-family:Bangers;src:url(/games/boxman/fonts/bangers-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:'Pixelify Sans';font-weight:400 500;src:url(/games/boxman/fonts/pixelify-sans-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:'Pixelify Sans';font-weight:600 700;src:url(/games/boxman/fonts/pixelify-sans-latin-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;src:url(/games/boxman/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;src:url(/games/boxman/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-display:swap}
:root{
 --night:#12101f;--night2:#1c1838;--panel:#221d40;
 --card:#c99a63;--card-hi:#e6c08a;--card-lo:#8a6238;--card-ink:#3a2614;
 --tape:#e6cf8e;--red:#e2402f;--gold:#d8b45c;--gold-hi:#f6dc94;
 --paper:#f4ead4;--text:#f1e9d6;--muted:#b9b1cf;--ink:#1b1520;--cyan:#20adca;--teal:#007291;--orange:#ef7724;
 --pix:'Pixelify Sans','Courier New',monospace;--comic:Bangers,Impact,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle at 18% -10%,rgba(246,220,148,.16),transparent 42%),radial-gradient(circle at 92% 8%,rgba(226,64,47,.14),transparent 38%),var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:min(1200px,100% - 28px);margin:0 auto;padding-bottom:90px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;font-family:var(--pix);font-weight:600;letter-spacing:.06em;font-size:.86rem;color:var(--muted)}
.top a{text-decoration:none;padding:6px 10px;border-radius:10px;border:2px solid rgba(185,177,207,.25)}
.top a:hover{border-color:var(--gold-hi);color:var(--gold-hi)}
.top .mid{display:flex;gap:10px;align-items:center}
#saved{opacity:0;transition:opacity .3s;color:var(--gold-hi)}
#saved.on{opacity:1}

/* the logo, in cardboard */
.kick{font-family:var(--pix);font-weight:700;letter-spacing:.18em;font-size:.82rem;color:var(--gold-hi);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.kick::before{content:'';width:26px;height:3px;background:var(--gold)}
.logo{margin:14px 0 4px;line-height:.86;display:inline-flex;align-items:flex-end;gap:14px;cursor:default;user-select:none}
.logo .bm,.logo .two{font-family:var(--comic);color:var(--card-hi);-webkit-text-stroke:3px var(--card-ink);paint-order:stroke fill;
 text-shadow:1px 1px 0 var(--card-lo),2px 2px 0 var(--card-lo),3px 3px 0 var(--card-lo),4px 4px 0 var(--card-lo),5px 5px 0 var(--card-lo),6px 6px 0 var(--card-lo),7px 7px 0 var(--card-lo),12px 14px 0 rgba(0,0,0,.5)}
.logo .bm{font-size:clamp(3.6rem,11vw,8rem);letter-spacing:.015em}
.logo .two{font-size:clamp(4.6rem,14vw,10.4rem);color:var(--red);-webkit-text-stroke:3px var(--ink);text-shadow:1px 1px 0 #8f1f16,2px 2px 0 #8f1f16,3px 3px 0 #8f1f16,4px 4px 0 #8f1f16,5px 5px 0 #8f1f16,6px 6px 0 #8f1f16,7px 7px 0 #8f1f16,12px 14px 0 rgba(0,0,0,.5);transform:rotate(-7deg)}
.subt{font-family:var(--comic);font-size:clamp(1.6rem,4.4vw,2.6rem);letter-spacing:.05em;color:var(--text);margin:6px 0 0}
.subt.none{color:var(--muted);opacity:.7}
.dir{font-family:var(--pix);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;margin-top:8px}

/* the reel path */
.hero{padding:16px 0 4px;position:relative}
.reels{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:28px 0 10px}
.reels::before{content:'';position:absolute;left:6%;right:6%;top:52px;border-top:4px dashed rgba(230,207,142,.35);z-index:0}
.stop{position:relative;z-index:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text)}
.stop svg{width:104px;height:104px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45));transition:transform .2s}
.stop:hover svg,.stop:focus-visible svg{transform:scale(1.07) rotate(-8deg)}
.stop .nm{font-family:var(--comic);font-size:1.35rem;letter-spacing:.05em;line-height:1}
.stop .sm{font-family:var(--pix);font-size:.74rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stop.next svg{animation:spin 6s linear infinite}
.stop.next .nm{color:var(--gold-hi)}
.stop .tick{position:absolute;top:0;right:calc(50% - 56px);width:34px;height:34px;border-radius:50%;background:#1e9e5a;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.gorow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:18px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
.stat{background:rgba(255,255,255,.05);border:2px solid rgba(185,177,207,.2);border-radius:14px 18px 12px 16px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-family:var(--comic);font-size:2rem;letter-spacing:.04em;line-height:1;color:#fff}
.stat span{font-family:var(--pix);font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* buttons, chips, inputs */
.big{font-family:var(--comic);font-size:1.7rem;letter-spacing:.05em;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px 12px 18px 14px;padding:12px 30px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.gold{background:var(--gold-hi);color:var(--ink)}
.big.quiet{background:transparent;color:var(--text);border-color:rgba(185,177,207,.45);box-shadow:none;font-size:1.3rem;padding:10px 20px}
.btn{font-family:var(--body);font-weight:700;background:var(--card-hi);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 16px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.dark{background:var(--panel);color:var(--text);border-color:#4a4272;box-shadow:0 4px 0 #0a0814}
.btn.red{background:var(--red);color:#fff}
.btn-orange{font-weight:700;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 16px;box-shadow:0 4px 0 var(--ink)}
.btn-quiet{font-weight:700;background:transparent;color:var(--ink);border:2px solid rgba(27,21,32,.4);border-radius:12px;padding:8px 14px}
.chip{background:#fff;color:var(--ink);border:2px solid rgba(27,21,32,.35);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.95rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--gold-hi);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.t{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:#fffdf8;border:3px solid rgba(27,21,32,.25);border-radius:12px;padding:10px 12px}
.t:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(239,119,36,.25)}
textarea.t{min-height:84px;resize:vertical}
.field{display:flex;gap:8px;align-items:stretch}
.field .t{flex:1}
.dice{flex:none;width:52px;border:3px solid var(--ink);border-radius:12px;background:var(--gold-hi);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.dice svg{width:30px;height:30px}
.dice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dice.roll svg{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
label.l{display:block;font-family:var(--pix);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--card-ink);margin:0 0 6px}

/* reel pages */
.reelhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0 10px}
.reelhead h1{font-family:var(--comic);font-size:clamp(2.6rem,7vw,4.4rem);letter-spacing:.04em;line-height:.9;margin:6px 0 0;color:#fff}
.reelhead p{margin:8px 0 0;color:var(--muted);font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(12,1fr);gap:22px;margin-top:20px}
.card{grid-column:span 12;background:var(--paper);color:var(--ink);border-radius:16px 22px 14px 20px;padding:22px 20px 20px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.card::before{content:'';position:absolute;top:-11px;left:50%;width:96px;height:22px;background:rgba(230,207,142,.88);transform:translateX(-50%) rotate(-3deg);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card h2{font-family:var(--comic);font-size:1.9rem;letter-spacing:.04em;margin:0 0 12px;line-height:1}
.card.s6{grid-column:span 6}.card.s4{grid-column:span 4}.card.s8{grid-column:span 8}
.card.tl{transform:rotate(-.5deg)}.card.tr{transform:rotate(.5deg)}
.card.dark{background:var(--panel);color:var(--text)}
.card.dark .t{background:#2c2652;color:var(--text);border-color:#4a4272}
.card.dark label.l{color:var(--gold-hi)}
.endrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:30px}
@media (max-width:860px){.card.s6,.card.s4,.card.s8{grid-column:span 12}.reels{grid-template-columns:repeat(3,1fr);row-gap:20px}.reels::before{display:none}}

/* title machine */
.titlebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.titlebox .pre{font-family:var(--comic);font-size:2.4rem;letter-spacing:.04em;color:var(--red);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.titlebox .field{flex:1;min-width:240px}
.titlebox .t{font-family:var(--comic);font-size:1.7rem;letter-spacing:.04em}
.sentence{display:grid;gap:10px}
.sentence .w{font-family:var(--comic);font-size:1.45rem;letter-spacing:.04em;color:var(--card-ink)}

/* cast */
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:20px}
.who{background:var(--paper);color:var(--ink);border-radius:16px 20px 14px 18px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;position:relative}
.who:nth-child(odd){transform:rotate(-.6deg)}.who:nth-child(even){transform:rotate(.5deg)}
.who .pic{height:150px;display:grid;place-items:center;background:linear-gradient(180deg,#2a2450,#1c1838);border-radius:12px;position:relative;overflow:hidden}
.who .pic img,.who .pic svg{max-height:136px;max-width:90%;image-rendering:pixelated}
.who .pic svg{height:136px;width:auto}
.who h3{font-family:var(--comic);font-size:1.5rem;letter-spacing:.04em;margin:0;line-height:1}
.who .file{font-size:.92rem;color:#5a4a3a;margin:2px 0 0}
.who .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.who .st button{border:2px solid rgba(27,21,32,.3);background:#fff;border-radius:10px;padding:7px 4px;font-weight:700;font-size:.9rem}
.who .st button[aria-pressed=true]{background:var(--ink);color:var(--gold-hi);border-color:var(--ink)}
.who .st button.out[aria-pressed=true]{background:#8a8f98;color:#fff;border-color:#8a8f98}
.who.out{opacity:.6}
.who .stamp{position:absolute;top:22px;right:10px;font-family:var(--comic);font-size:1.3rem;letter-spacing:.06em;padding:2px 10px;border:3px solid;border-radius:8px;transform:rotate(9deg);background:rgba(244,234,212,.9)}
.who .stamp.back{color:#1e9e5a}.who .stamp.cameo{color:var(--orange)}
.who .more{display:grid;gap:6px}
.who .more .t{font-size:.95rem;padding:7px 10px}

/* new characters */
.ncgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:20px}
.ncadd{border:4px dashed rgba(230,207,142,.5);border-radius:18px;background:rgba(255,255,255,.03);color:var(--gold-hi);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--comic);font-size:1.7rem;letter-spacing:.05em}
.ncadd svg{width:90px;height:90px}
.maker{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:24px;margin-top:18px;align-items:start}
@media (max-width:860px){.maker{grid-template-columns:1fr}}
.stagebox{background:linear-gradient(180deg,#2a2450,#12101f);border-radius:18px;padding:14px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.stagebox .spot{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(246,220,148,.28),transparent 60%);border-radius:18px;pointer-events:none}
.stagebox .me{display:block;width:100%;height:340px}
.stagebox .me svg{width:100%;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.tabs button{background:var(--panel);color:var(--text);border:2px solid #4a4272;border-radius:10px;padding:6px 12px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--gold-hi);color:var(--ink);border-color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.picks button{background:#2c2652;border:3px solid #4a4272;border-radius:12px;padding:4px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text);font-size:.72rem;font-weight:700}
.picks button svg{height:70px;width:auto}
.picks button[aria-pressed=true]{border-color:var(--gold-hi);background:#3a3270}
.picks .sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink)}
.filecard{background:#403c48;color:#f1ece4;border-left:6px solid #e8975a;border-radius:6px 14px 14px 6px;padding:16px 18px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.filecard .ff{font-family:var(--pix);font-weight:600;letter-spacing:.2em;color:#e8975a;font-size:.8rem}
.filecard .row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-top:10px}
.filecard .row > span{font-style:italic;color:#cfc6ba}
.filecard .t{background:#2e2b35;color:#fff;border-color:#5a5462;font-size:1rem}
.filecard .namein{font-family:var(--comic);font-size:1.8rem;letter-spacing:.04em}
.filecard .chip{background:#2e2b35;color:#f1ece4;border-color:#5a5462;padding:5px 11px;font-size:.88rem}
.filecard .chip[aria-pressed=true]{background:#e8975a;color:var(--ink);border-color:#e8975a}
.rank{display:flex;gap:10px;align-items:center}
.rank input{flex:1;accent-color:#e8975a}
.rank b{font-family:var(--comic);font-size:1.5rem;letter-spacing:.04em;min-width:110px}
@media (max-width:560px){.filecard .row{grid-template-columns:1fr}}

/* story */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
@media (max-width:980px){.acts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.acts{grid-template-columns:1fr}}
.act{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:6px;padding:14px;box-shadow:8px 8px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.act .n{font-family:var(--comic);font-size:1rem;letter-spacing:.1em;background:var(--ink);color:var(--gold-hi);align-self:flex-start;padding:2px 10px;border-radius:4px}
.act h3{font-family:var(--comic);font-size:1.7rem;letter-spacing:.04em;margin:0;line-height:1}
.act svg.ic{width:100%;height:84px}
.act textarea{min-height:110px;flex:1}
.twist{margin-top:22px;background:linear-gradient(135deg,#3a1d5a,#7b4b8f);border:4px solid var(--ink);border-radius:8px;padding:16px;box-shadow:8px 8px 0 rgba(0,0,0,.4)}
.twist h3{font-family:var(--comic);font-size:2rem;letter-spacing:.05em;margin:0 0 8px;color:var(--gold-hi)}

/* storyboard */
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 14px;margin-top:14px;scrollbar-color:#4a4272 transparent}
.thumb{flex:none;width:168px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;padding:4px 4px 2px;color:var(--ink);position:relative}
.thumb canvas{display:block;width:100%;height:auto;border-radius:4px;background:#ddd}
.thumb .no{font-family:var(--comic);letter-spacing:.06em;font-size:1rem;display:flex;justify-content:space-between;padding:2px 2px 0}
.thumb[aria-current=true]{outline:4px solid var(--gold-hi);outline-offset:2px;transform:translateY(-3px)}
.thumb.add{display:grid;place-items:center;background:transparent;border:3px dashed rgba(230,207,142,.6);color:var(--gold-hi);font-family:var(--comic);font-size:1.3rem;letter-spacing:.05em;min-height:108px}
.boardgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1060px){.boardgrid{grid-template-columns:1fr}}
.stage{background:var(--ink);border:4px solid #000;border-radius:10px;padding:8px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.stage .lbl{position:absolute;top:-16px;left:16px;font-family:var(--comic);letter-spacing:.08em;background:var(--gold-hi);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:2px 12px;font-size:1.15rem;z-index:2}
#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:4px;touch-action:none;background:#f4ead4;cursor:grab}
#cv.draw{cursor:crosshair}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.seg button{border:0;background:var(--card-hi);color:var(--ink);padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold-hi)}
.seg svg{width:20px;height:20px}
.pens{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pens .pc{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);padding:0}
.pens .pc[aria-pressed=true]{outline:3px solid var(--gold-hi);outline-offset:2px}
.pens .ps{background:#fff;border:2px solid var(--ink);border-radius:8px;width:38px;height:34px;display:grid;place-items:center;padding:0}
.pens .ps[aria-pressed=true]{background:var(--gold-hi)}
.selbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;background:var(--panel);border:2px solid #4a4272;border-radius:12px;padding:8px}
.selbar[hidden]{display:none}
.selbar .t{max-width:260px;padding:6px 10px;font-size:.95rem}
.traybox{margin-top:14px;background:var(--panel);border:2px solid #4a4272;border-radius:14px;padding:10px}
.traytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.traytabs button{background:transparent;border:2px solid #4a4272;border-radius:10px;padding:6px 14px;font-family:var(--comic);letter-spacing:.06em;font-size:1.15rem;color:var(--text)}
.traytabs button[aria-pressed=true]{background:var(--gold-hi);color:var(--ink);border-color:var(--ink)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:300px;overflow:auto;padding:2px}
.tray button{background:#2c2652;border:2px solid #4a4272;border-radius:10px;padding:6px 4px 4px;color:var(--text);font-size:.74rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.tray button img{height:58px;width:auto;max-width:86px;object-fit:contain;image-rendering:pixelated}
.tray button canvas{width:100%;height:auto;border-radius:6px}

.notes{display:flex;flex-direction:column;gap:14px}

.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.why{font-size:.92rem;color:#5a4a3a;margin:8px 0 0;min-height:1.3em}

.prem{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:24px;align-items:start;margin-top:18px}

   ===================================================================== */
var gbT = null;
function gbSay(line){
  var g = $("#gb"); $(".say", g).textContent = line || pick(GB_LINES);
  g.classList.add("on"); clearTimeout(gbT); gbT = setTimeout(function(){ g.classList.remove("on"); }, 4200);
}
$("#gb img").addEventListener("click", function(){ gbSay(); });
var toastT = null;
function toast(msg, btn, fn){
  var t = $("#toast"); t.innerHTML = "<span>" + esc(msg) + "</span>" + (btn ? '<button type="button">' + esc(btn) + "</button>" : "");
  if(btn) $("button", t).onclick = function(){ t.classList.remove("on"); fn(); };
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, btn ? 8000 : 3200);
}
function parcel(title, text){
  var p = $("#parcel"); $("b", p).textContent = title; $("span", p).textContent = text;
  p.classList.add("on"); setTimeout(function(){ p.classList.remove("on"); }, 5200);
}
function clap(label, then){
  if(reduced()){ then(); return; }
  var c = $("#clap"); $(".slate b", c).textContent = label;
  c.classList.remove("snap"); c.classList.add("on"); void c.offsetWidth; c.classList.add("snap");
  setTimeout(function(){ then(); }, 380);
  setTimeout(function(){ c.classList.remove("on", "snap"); }, 620);
}

function setPath(path, v){ var ks = path.split("."), o = S; ks.slice(0, -1).forEach(function(k){ if(o[k] == null) o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = v; }

function go(view, noClap){
  var idx = -1; REELS.forEach(function(r, i){ if(r[0] === view) idx = i; });
  var show = function(){ VIEW = view; sel = -1; render(); window.scrollTo(0, 0); };
  if(idx >= 0 && !noClap) clap("REEL " + (idx + 1), show); else show();
}

  ({ map: renderMap, pitch: renderPitch, cast: renderCast, faces: renderFaces, story: renderStory, board: renderBoard, premiere: renderPremiere })[VIEW]();
}

  return '<div class="reelhead"><div><div class="kick">Reel ' + (i + 1) + ' of 6</div><h1>' + title + '</h1><p>' + line + '</p></div>' +
    '<button class="big quiet" data-go="map" type="button">Back to the office</button></div>';

function totalSecs(){ return S.panels.reduce(function(a, p){ return a + (+p.sec || 0); }, 0); }
function mmss(s){ return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

function planText(){
  var P = S.pitch, St = S.story, L = [];
  L.push(filmTitle().toUpperCase());
  if(P.tag) L.push("Tagline: " + P.tag);
  if(P.when || P.must || P.before) L.push("In one line: When " + (P.when || "...") + ", Box-man has to " + (P.must || "...") + " before " + (P.before || "...") + ".");
  if(P.tones.length) L.push("Kind of film: " + P.tones.join(", "));
  if(P.len) L.push("Length: " + P.len);
  L.push("");
  L.push("THE CAST");
  CAST.forEach(function(c){ var s = S.cast[c.k]; if(s && (s.st === "back" || s.st === "cameo")) L.push("- " + c.name + " (" + (s.st === "back" ? "back" : "cameo") + ")" + (s.now ? ": " + s.now : "") + (s.by ? " [played by " + s.by + "]" : "")); });
  S.nc.forEach(function(n){ L.push("- NEW: " + (n.name || "Nameless") + ". " + (n.occ || "Unknown") + ". " + (n.rank ? "Rank " + n.rank : "Unranked") + "." + (n.ability ? " Ability: " + n.ability + "." : "") + (n.pers ? " Personality: " + n.pers + "." : "") + (n.by ? " [played by " + n.by + "]" : "")); });
  L.push("");
  L.push("THE STORY");
  ACTS.forEach(function(a){ if(St[a[0]]) L.push(a[1] + ": " + St[a[0]]); });
  if(St.twist) L.push("The twist: " + St.twist);
  L.push("");
  L.push("STORYBOARD (" + S.panels.length + " shots, about " + mmss(totalSecs()) + ")");
  S.panels.forEach(function(p, i){
    var bits = ["Shot " + (i + 1), BGNAME[p.bg] || "", p.shot && SHOTMAP[p.shot] ? SHOTMAP[p.shot][1] : "", p.move && MOVEMAP[p.move] ? MOVEMAP[p.move][1] : "", (p.sec || 0) + " secs"].filter(Boolean).join(" | ");
    L.push(bits);
    if(p.what) L.push("  What happens: " + p.what);
    if(p.say) L.push("  Someone says: " + p.say);
    if(p.sound.length) L.push("  Sound: " + p.sound.join(", "));
  });
  var cs = callSheet();
  L.push("");
  L.push("CALL SHEET");
  L.push("Who is needed: " + (cs.people.join(", ") || "-"));
  L.push("Props: " + (cs.props.join(", ") || "-"));
  L.push("Filming order: " + cs.order.map(function(o){ return o.place + " (shots " + o.shots.join(", ") + ")"; }).join("; "));
  return L.join("\n");
}
function printBoard(){
  var area = $("#printArea"), P = S.pitch, St = S.story, cs = callSheet();
  var oc = document.createElement("canvas"); oc.width = 960; oc.height = 540; var ox = oc.getContext("2d");
  var keys = usedKeys().filter(function(k){ return k.slice(0, 2) !== "d:"; });
  toast("Getting the storyboard ready...");
  whenImgs(keys).then(function(){
    var shots = S.panels.map(function(p, i){
      renderPanel(ox, p, 1, -1);
      var src = oc.toDataURL("image/jpeg", 0.85);
      return '<div class="pshot"><img src="' + src + '" alt=""><b>SHOT ' + (i + 1) + '</b> &middot; ' + esc(BGNAME[p.bg] || "") + ' &middot; ' + (p.sec || 0) + ' secs' +
        '<p>' + esc([p.shot && SHOTMAP[p.shot] ? SHOTMAP[p.shot][1] : "", p.move && MOVEMAP[p.move] ? MOVEMAP[p.move][1] : ""].filter(Boolean).join(", ")) + '</p>' +
        (p.what ? '<p><b style="font-size:9pt">Happens:</b> ' + esc(p.what) + '</p>' : "") + (p.say ? '<p><b style="font-size:9pt">Says:</b> ' + esc(p.say) + '</p>' : "") +
        (p.sound.length ? '<p><b style="font-size:9pt">Sound:</b> ' + esc(p.sound.join(", ")) + '</p>' : "") + '</div>';
    });
    var pages = [];
    var cover = '<div class="pg"><div class="ph"><h1>' + esc(filmTitle().toUpperCase()) + '</h1><span>A FILM BY LW &middot; BASE 5</span></div><table class="pcover">' +
      (P.tag ? '<tr><td>Tagline</td><td>' + esc(P.tag) + '</td></tr>' : "") +
      ((P.when || P.must) ? '<tr><td>In one line</td><td>When ' + esc(P.when || "...") + ', Box-man has to ' + esc(P.must || "...") + ' before ' + esc(P.before || "...") + '.</td></tr>' : "") +
      ACTS.map(function(a){ return St[a[0]] ? '<tr><td>' + a[1] + '</td><td>' + esc(St[a[0]]) + '</td></tr>' : ""; }).join("") +
      (St.twist ? '<tr><td>The twist</td><td>' + esc(St.twist) + '</td></tr>' : "") +
      '<tr><td>Who is needed</td><td>' + esc(cs.people.join(", ") || "-") + '</td></tr>' +
      '<tr><td>Props to make</td><td>' + esc(cs.props.join(", ") || "-") + '</td></tr>' +
      '<tr><td>Filming order</td><td>' + esc(cs.order.map(function(o){ return o.place + ": shots " + o.shots.join(", "); }).join("  /  ") || "-") + '</td></tr>' +
      '<tr><td>Running time</td><td>' + S.panels.length + ' shots, about ' + mmss(totalSecs()) + '</td></tr></table></div>';
    pages.push(cover);
    for(var i = 0; i < shots.length; i += 6){
      pages.push('<div class="pg"><div class="ph"><h1>STORYBOARD</h1><span>' + esc(filmTitle()) + ' &middot; page ' + (i / 6 + 1) + '</span></div><div class="pgrid">' + shots.slice(i, i + 6).join("") + '</div></div>');
    }
    area.innerHTML = pages.join("");
    var imgs = $$("img", area);
    Promise.all(imgs.map(function(im){ return im.decode ? im.decode().catch(function(){}) : Promise.resolve(); })).then(function(){ window.print(); });
  });
}

    s.st = s.st === d.cast ? "" : d.cast; save(); renderCast();
    if(s.st === "back" && k === "gingerbeard") gbSay("Back by popular demand. Mine.");
    if(s.st === "out" && k === "gingerbeard") gbSay("Outrageous.");

  }

  if(d.edit){ editNC = d.edit; makerTab = "b"; renderFaces(); window.scrollTo(0, 0); return; }
  if(d.tab){ makerTab = d.tab; renderMaker(); return; }

  if(d.mode){ mode = d.mode; sel = -1; $$("[data-mode]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.mode === mode); }); $("#pens").hidden = mode !== "draw"; cv.classList.toggle("draw", mode === "draw"); drawEditor(); renderSelBar(); return; }

  if(d.size != null){ penSize = +d.size; $$("[data-size]").forEach(function(x){ x.setAttribute("aria-pressed", +x.dataset.size === penSize); }); return; }
  if(d.undo){ var sp = getStrokes(curP().id); if(sp.length){ sp.pop(); saveStrokes(curP().id); drawEditor(); touchThumb(); } return; }

  if(d.sb){
    var p = curP(), it = p.st[sel]; if(!it) return;

document.addEventListener("keydown", function(e){
  if(VIEW !== "board" || sel < 0 || mode !== "move") return;
  if(/INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;

});
