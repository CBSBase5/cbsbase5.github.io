<style>
/* sample tasks and answers */
.task{background:#fff8e6;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin:6px 0 10px;text-align:left}
.task p{margin:0 0 8px}
.task ul{margin:0 0 4px;padding-left:20px}
.task .tlab{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}
.draft{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;text-align:left}
.draft p{margin:0 0 8px}
.pairtable{width:100%}
.pairtable td,.pairtable th{text-align:left;font-size:.95rem}

/* Letter builder */
.lb{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin:6px 0}
.lbbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;margin-bottom:10px}
.lbbar span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.88rem}
.lbtask{font-size:.95rem;line-height:1.45;margin:0 0 10px;color:#efe6f0}
.lbtask b{color:var(--sun)}
.lbtray{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.lbchip{font-family:inherit;font-size:.92rem;line-height:1.25;text-align:left;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:10px;padding:8px 10px;min-height:44px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.lbchip:hover{border-color:var(--sun)}
.lbchip.sel{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun);background:#fff6dc}
.lbchip.binned{opacity:.4;text-decoration:line-through;cursor:default;border-color:transparent;box-shadow:none}
.lbchip.lift{opacity:.35}
.lbghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-60%);box-shadow:0 8px 20px rgba(0,0,0,.35);border-color:var(--sun)}
.lbpaper{background:#fffdf7;color:var(--ink);border-radius:12px;padding:14px;margin-top:12px;font-size:.95rem;line-height:1.4;text-align:left}
.lbslot{display:flex;align-items:center;width:100%;font-family:inherit;font-size:.9rem;line-height:1.3;text-align:left;border:2px dashed #b9b4cc;border-radius:10px;background:transparent;min-height:46px;padding:7px 10px;margin:6px 0;color:#8a86a0;cursor:pointer}
.lbslot.r{margin-left:auto;width:62%;justify-content:flex-end;text-align:right}
.lbslot.l{width:66%}
.lbslot.hot{border-color:#e0a612;background:#fff6dc;color:var(--ink)}
.lbslot.done{border-style:solid;border-color:#1f9d63;background:#e8f7ef;color:var(--ink);cursor:default}
.lbslot.shake{animation:nudge .35s;border-color:var(--coral)}
.lbbody{color:#4a4660;margin:8px 0;font-size:.92rem}
.lbmailtop{background:#ece9f3;border-radius:8px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:.85rem;margin-bottom:8px}
.lbrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:2px 0 4px;margin-bottom:6px}
.lbrow > span{font-family:var(--display);font-weight:700;font-size:.85rem;min-width:56px}
.lbrow .lbslot{flex:1;margin:4px 0}
.lbmsg{min-height:1.4em;margin:10px 0 0;font-size:.96rem;line-height:1.45;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px}
.lbmsg b{color:var(--sun)}
.lbrowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lbend{text-align:center;padding:4px 0}
.lbend .big{font-family:var(--marquee,var(--display));font-size:2rem;color:var(--sun);line-height:1.1;margin:6px 0;letter-spacing:.03em}
@media (max-width:420px){
  .lb{padding:10px}
  .lbpaper{padding:10px}
  .lbchip{font-size:.86rem;padding:7px 8px}
  .lbslot.r{width:74%}
  .lbslot.l{width:80%}
}

<script>
(function(){
"use strict";

/* ---------- a sample task, used in the Reading the task chunk ---------- */
var CAFE_TASK =
'<div class="task"><span class="tlab">Sample task</span>' +
'<p>Your local leisure centre is planning to close its caf&eacute;. Write an email to the centre manager, Mr Hughes.</p>' +
'<p>In your email you should:</p>' +
'<ul><li>say why you are writing</li>' +
'<li>explain who uses the caf&eacute; and why it matters to them</li>' +
'<li>suggest another way the centre could save money.</li></ul></div>';

var CAFE_DRAFT =
'<div class="draft">' +
'<p>Dear Mr Hughes,</p>' +
'<p>I am writing because I have heard that the caf&eacute; at the leisure centre is going to close. I think this would be a big mistake.</p>' +
'<p>Lots of people use the caf&eacute;. Parents wait there while their children have swimming lessons, and older people meet there for a cup of tea after their exercise class. For some of them, it is the only time they see their friends all week.</p>' +
'<p>Yours sincerely,<br>Sam Carter</p></div>';

/* ---------- figure: layout of a formal letter (380 wide for phones) ---------- */
var LETTER =
'<svg viewBox="0 0 380 372" role="img" aria-label="Layout of a formal letter. Your address goes top right with the date under it. Their address goes on the left, a little lower. Then Dear Sir or Madam, the paragraphs, Yours faithfully, and your name.">' +
'<rect x="8" y="4" width="364" height="364" rx="12" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<g font-family="Outfit,Space Grotesk,Arial" fill="#141a33">' +
'<rect x="196" y="18" width="162" height="60" rx="10" fill="#fff1c9" stroke="#141a33" stroke-width="2"/>' +
'<text x="277" y="44" text-anchor="middle" font-size="16" font-weight="700">Your address</text>' +
'<text x="277" y="66" text-anchor="middle" font-size="14">top right</text>' +
'<rect x="196" y="86" width="162" height="34" rx="10" fill="#d6f6f2" stroke="#141a33" stroke-width="2"/>' +
'<text x="277" y="109" text-anchor="middle" font-size="16" font-weight="700">Date</text>' +
'<rect x="22" y="132" width="172" height="60" rx="10" fill="#ffe1de" stroke="#141a33" stroke-width="2"/>' +
'<text x="108" y="158" text-anchor="middle" font-size="16" font-weight="700">Their address</text>' +
'<text x="108" y="180" text-anchor="middle" font-size="14">on the left</text>' +
'<text x="22" y="222" font-size="16" font-weight="700">Dear Sir or Madam,</text>' +
'<g fill="#d9d8e6"><rect x="22" y="234" width="336" height="9" rx="4"/><rect x="22" y="249" width="300" height="9" rx="4"/>' +
'<rect x="22" y="270" width="336" height="9" rx="4"/><rect x="22" y="285" width="250" height="9" rx="4"/></g>' +
'<text x="280" y="294" font-size="14" fill="#6b6785">paragraphs</text>' +
'<text x="22" y="326" font-size="16" font-weight="700">Yours faithfully,</text>' +
'<text x="22" y="352" font-size="16" font-style="italic">Your name</text>' +
'</g></svg>';

/* ---------- Letter builder widget ---------- */
var LB_ROUNDS = [
  { kind: "letter",
    task: "<b>Round 1: a formal letter.</b> You are complaining to a bus company about a late bus. You do not know the manager's name.",
    body: "<p>I am writing to complain about the number 12 bus, which was 40 minutes late on Monday 2 March. As a result, I missed a hospital appointment.</p><p>I would like to know what you will do to stop this happening again.</p>",
    slots: ["addr", "date", "their", "greet", "BODY", "close", "name"],
    chips: [
      { id: "close", t: "Yours faithfully," },
      { id: null, t: "Yours sincerely,", why: "<b>Not with this one.</b> Yours sincerely is for when you know their name. This letter opens Dear Sir or Madam, so it ends Yours faithfully. (Sir and Sincerely never go together.)" },
      { id: "their", t: "The Manager, Brightway Buses, Station Road, Chilton, CB4 1AA", p: "The Manager<br>Brightway Buses<br>Station Road<br>Chilton<br>CB4 1AA" },
      { id: "greet", t: "Dear Sir or Madam," },
      { id: null, t: "Hiya mate,", why: "<b>Far too chatty.</b> This is a complaint to a company, so it needs a formal greeting." },
      { id: "date", t: "4 March 2026" },
      { id: "name", t: "Sam Carter" },
      { id: null, t: "Love from,", why: "<b>Lovely for your nan, not for a bus company.</b> A formal letter ends Yours faithfully or Yours sincerely." },
      { id: "addr", t: "14 Mill Lane, Chilton, CB4 2RT", p: "14 Mill Lane<br>Chilton<br>CB4 2RT" }
    ] },
  { kind: "email",
    task: "<b>Round 2: a formal email.</b> You are emailing Ms Patel, the events manager at a theatre, to ask about tickets for a group.",
    body: "<p>I am writing to ask about booking twelve tickets for the evening show on 16 May. Could you tell me if you offer a discount for groups?</p><p>Thank you for your help. I look forward to hearing from you.</p>",
    slots: ["subj", "greet", "BODY", "close", "name"],
    chips: [
      { id: "name", t: "Sam Carter" },
      { id: null, t: "Dear Sir or Madam,", why: "<b>You know her name</b>, so use it: Dear Ms Patel." },
      { id: "subj", t: "Group booking for 16 May" },
      { id: null, t: "14 Mill Lane, Chilton, CB4 2RT", why: "<b>Emails do not need a postal address.</b> That is one of the big differences from a letter." },
      { id: "close", t: "Yours sincerely," },
      { id: null, t: "hi", why: "<b>Too vague.</b> A subject line should tell the reader what the email is about before they open it." },
      { id: "greet", t: "Dear Ms Patel," },
      { id: null, t: "Yours faithfully,", why: "<b>Not with a name.</b> Dear Ms Patel goes with Yours sincerely. Faithfully is for Dear Sir or Madam." }
    ] }
];
var LB_WHERE = {
  addr: "Your own address goes in a top corner. Which one?",
  date: "The date sits just under your address.",
  their: "Their address goes on the other side from yours, a little lower down.",
  greet: "The greeting comes just before the first paragraph.",
  close: "The sign off comes after the last paragraph.",
  name: "Your name goes at the very bottom, under the sign off.",
  subj: "The subject line has its own row at the top of the email."
};
var LB_SHOW = {
  addr: "Your address goes top right.",
  date: "The date goes under your address, on the right.",
  their: "Their address goes on the left, below the date.",
  greet: "The greeting goes just before the first paragraph.",
  close: "The sign off goes after the last paragraph.",
  name: "Your name goes under the sign off.",
  subj: "The subject line goes in the Subject row."
};
var LB_GOOD = ["Yes.", "That is the spot.", "Sorted.", "Spot on.", "Nice."];

function letterBuilder(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.placed) d.placed = [[], []];
  if(!d.binned) d.binned = [[], []];
  if(d.miss === undefined) d.miss = 0;
  var sel = null, msg = "", shakeSlot = null, drag = null;

  function R(){ return LB_ROUNDS[d.r]; }
  function chipFor(slot){
    var r = R();
    for(var k = 0; k < d.placed[d.r].length; k++){
      var c = r.chips[d.placed[d.r][k]];
      if(c.id === slot) return c;
    }
    return null;
  }
  function roundDone(){
    var r = R();
    return r.slots.every(function(s){ return s === "BODY" || chipFor(s); });
  }
  function result(){ return d.shown ? "shown" : d.miss <= 1 ? "right1" : "right2"; }

  function slotHtml(s, cls){
    var c = chipFor(s);
    if(c) return '<div class="lbslot done ' + cls + '" data-slot="' + s + '">' + (c.p || c.t) + '</div>';
    return '<button type="button" class="lbslot ' + cls + (sel !== null ? ' hot' : '') + '" data-slot="' + s + '" aria-label="Empty space on the ' + (R().kind) + '">?</button>';
  }

  function paper(){
    var r = R(), h = "";
    if(r.kind === "letter"){
      h += slotHtml("addr", "r") + slotHtml("date", "r") + slotHtml("their", "l") + slotHtml("greet", "") +
           '<div class="lbbody">' + r.body + '</div>' + slotHtml("close", "") + slotHtml("name", "");
    }else{
      h += '<div class="lbmailtop">New message</div>' +
           '<div class="lbrow"><span>To:</span> Ms Patel, Events Manager</div>' +
           '<div class="lbrow"><span>Subject:</span>' + slotHtml("subj", "") + '</div>' +
           slotHtml("greet", "") + '<div class="lbbody">' + r.body + '</div>' + slotHtml("close", "") + slotHtml("name", "");
    }
    return '<div class="lbpaper">' + h + '</div>';
  }

  function draw(){
    if(d.finished){ drawEnd(); return; }
    var r = R(), done = roundDone();
    var tray = "";
    if(!done) r.chips.forEach(function(c, k){
      if(d.placed[d.r].indexOf(k) >= 0) return;
      var binned = d.binned[d.r].indexOf(k) >= 0;
      tray += '<button type="button" class="lbchip' + (binned ? ' binned' : '') + (sel === k ? ' sel' : '') + '" data-k="' + k + '"' + (binned ? ' disabled' : '') + '>' + c.t + '</button>';
    });
    var btns = "";
    if(done) btns = '<button class="btn" type="button" id="lbNext">' + (d.r === 0 ? "On to round 2: an email" : "See how you did") + '</button>';
    else if(d.miss > 0) btns = '<button class="btn btn-quiet" type="button" id="lbShow">Show me one</button>';
    el.innerHTML = '<div class="lb">' +
      '<div class="lbbar"><span>Round ' + (d.r + 1) + ' of 2</span><span>Misses ' + d.miss + '</span></div>' +
      '<p class="lbtask">' + r.task + '</p>' +
      (done ? '' : '<p class="lbtask" style="margin-bottom:8px">Drag a part onto the ' + r.kind + ', or tap a part and then tap where it goes. Some parts do not belong at all.</p>') +
      '<div class="lbtray">' + tray + '</div>' +
      paper() +
      '<div class="lbmsg" aria-live="polite">' + (msg || (done ? "" : "Pick a part to start.")) + '</div>' +
      '<div class="lbrowbtn">' + btns + '</div></div>';
    wire();
    if(shakeSlot){
      var sl = el.querySelector('.lbslot[data-slot="' + shakeSlot + '"]');
      if(sl) sl.classList.add("shake");
      shakeSlot = null;
    }
  }

  function wire(){
    [].forEach.call(el.querySelectorAll(".lbchip"), function(b){
      if(b.disabled) return;
      var k = +b.dataset.k;
      b.addEventListener("pointerdown", function(e){
        if(e.button !== undefined && e.button > 0) return;
        drag = { k: k, x: e.clientX, y: e.clientY, ghost: null, src: b, id: e.pointerId };
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
      });
      b.addEventListener("pointermove", function(e){
        if(!drag || drag.k !== k) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if(!drag.ghost && dx * dx + dy * dy > 64){
          drag.ghost = b.cloneNode(true);
          drag.ghost.classList.add("lbghost");
          drag.ghost.classList.remove("sel");
          drag.ghost.style.width = b.offsetWidth + "px";
          document.body.appendChild(drag.ghost);
          b.classList.add("lift");
          sel = null;
          [].forEach.call(el.querySelectorAll("button.lbslot"), function(s){ s.classList.add("hot"); });
        }
        if(drag.ghost){
          drag.ghost.style.left = e.clientX + "px";
          drag.ghost.style.top = e.clientY + "px";
          e.preventDefault();
        }
      });
      function end(e, cancelled){
        if(!drag || drag.k !== k) return;
        var g = drag.ghost;
        drag = null;
        if(g){
          g.parentNode && g.parentNode.removeChild(g);
          var under = cancelled ? null : document.elementFromPoint(e.clientX, e.clientY);
          var slot = under && under.closest ? under.closest("button.lbslot") : null;
          if(slot && el.contains(slot)) place(k, slot.dataset.slot);
          else { msg = "Drop it on one of the dashed spaces, or tap it and then tap a space."; draw(); }
        }else if(!cancelled){
          sel = sel === k ? null : k;
          msg = sel !== null ? "Now tap where it goes on the " + R().kind + "." : "";
          draw();
        }
      }
      b.addEventListener("pointerup", function(e){ end(e, false); });
      b.addEventListener("pointercancel", function(e){ end(e, true); });
      b.addEventListener("click", function(e){
        if(e.detail === 0){ sel = sel === k ? null : k; msg = sel !== null ? "Now choose where it goes on the " + R().kind + "." : ""; draw(); }
      });
    });
    [].forEach.call(el.querySelectorAll("button.lbslot"), function(s){
      s.onclick = function(){
        if(sel === null){ msg = "Pick a part first, then tap here."; draw(); return; }
        var k = sel; sel = null;
        place(k, s.dataset.slot);
      };
    });
    var nx = el.querySelector("#lbNext");
    if(nx) nx.onclick = function(){
      msg = "";
      if(d.r === 0){ d.r = 1; api.save(); draw(); }
      else { d.finished = true; api.save(); draw(); }
    };
    var sh = el.querySelector("#lbShow");
    if(sh) sh.onclick = showOne;
  }

  function place(k, slot){
    var c = R().chips[k];
    if(c.id === slot){
      d.placed[d.r].push(k);
      msg = "<b>" + LB_GOOD[d.placed[d.r].length % LB_GOOD.length] + "</b> " + LB_SHOW[slot];
      if(roundDone()) msg = d.r === 0 ?
        "<b>Letter done.</b> Addresses, date, Dear Sir or Madam with Yours faithfully. That is the whole layout." :
        "<b>Email done.</b> Subject line, Dear Ms Patel with Yours sincerely, and no postal address needed.";
    }else{
      d.miss++;
      if(c.id === null){ d.binned[d.r].push(k); msg = c.why; }
      else msg = "<b>Right part, wrong place.</b> " + LB_WHERE[c.id];
      shakeSlot = slot;
    }
    api.save();
    draw();
  }

  function showOne(){
    var r = R();
    for(var s = 0; s < r.slots.length; s++){
      var slot = r.slots[s];
      if(slot === "BODY" || chipFor(slot)) continue;
      for(var k = 0; k < r.chips.length; k++){
        if(r.chips[k].id === slot){
          d.placed[d.r].push(k); d.shown = true; sel = null;
          msg = "<b>Here is one.</b> " + LB_SHOW[slot];
          if(roundDone()) msg += " That finishes this " + r.kind + ".";
          api.save(); draw(); return;
        }
      }
    }
  }

  function drawEnd(){
    var rank = d.miss === 0 ? "Head of the office" : d.miss <= 2 ? "Properly professional" : "Getting the hang of it";
    el.innerHTML = '<div class="lb"><div class="lbend">' +
      '<p class="lbtask" style="margin:0">Both done. Your title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>' + d.miss + ' miss' + (d.miss === 1 ? '' : 'es') + (d.shown ? ', with a little help from Show me' : '') + '.</p>' +
      '<p class="lbtask">Faithfully with Sir or Madam, sincerely with a name. Emails swap the addresses for a subject line.</p>' +
      '<button class="btn btn-quiet" type="button" id="lbAgain">Play again</button></div></div>';
    el.querySelector("#lbAgain").onclick = function(){
      d.r = 0; d.placed = [[], []]; d.binned = [[], []]; d.miss = 0; d.shown = false; d.finished = false;
      sel = null; msg = ""; api.save(); draw();
    };
    api.done(result());
  }

  draw();
}

EGW.run({
  id: "writing-format",
  title: "Get the format right",
  subject: "English",
  mins: 50,
  blurb: "How the writing paper works, what each kind of writing should look like, and a full Level 1 task to finish, if you fancy it.",
  steps: [

  /* ---------- 1. THE WRITING PAPER ---------- */
  { type: "learn", topic: "The writing paper",
    title: "How the writing paper works",
    html: "<p>The writing paper has <b>two tasks</b>. Each task is worth <b>27 marks</b>. You get <b>1 hour 20 minutes</b> for both.</p>" +
          "<p>In each task, the 27 marks split roughly like this:</p>" +
          '<table class="datatable pairtable"><tr><th>About</th><th>For</th></tr>' +
          "<tr><td>15 marks</td><td>Content, format, suiting your reader, and paragraphs</td></tr>" +
          "<tr><td>12 marks</td><td>Spelling, punctuation and grammar (SPaG)</td></tr></table>" +
          "<p>There is <b>no dictionary or spell checker</b>, so it helps to know your tricky words. The SPaG page has those.</p>" +
          '<div class="keep"><b>Keep this</b>Nearly half of each task is SPaG. Keep a few minutes at the end to read it back slowly.</div>' },

  { type: "num", topic: "The writing paper",
    q: "You have 1 hour 20 minutes for the two tasks. If you split the time evenly, how many minutes is that for each task?",
    boxes: [{ label: "Minutes per task", a: 40, post: "minutes" }],
    hint: "Change 1 hour 20 minutes into minutes first, then share it between two tasks.",
    why: "1 hour 20 minutes is 60 + 20 = 80 minutes, and 80 &divide; 2 = 40. So about 40 minutes a task: a couple of minutes planning, most of it writing, and a few minutes checking at the end." },

  { type: "sort", topic: "The writing paper",
    q: "Which part of the mark does each of these help with?",
    buckets: ["Content, format and reader", "Spelling, punctuation and grammar"],
    cards: [
      ["Covering every bullet point in the task", 0],
      ["Using a subject line in an email", 0],
      ["Starting a new paragraph for each new point", 0],
      ["Choosing a polite tone for a manager", 0],
      ["Writing their, there and they're correctly", 1],
      ["Starting every sentence with a capital letter", 1],
      ["Writing we were, not we was", 1]
    ],
    hint: "If it is about what you say or how it is laid out, it is content and format. If it is about getting words and punctuation right, it is SPaG.",
    why: "Content and format covers what you say, how it is set out, and whether it suits the reader, paragraphs included. SPaG is the accuracy of the words and punctuation themselves. You need both, which is why this page covers layout and the SPaG page covers accuracy." },

  { type: "mc", topic: "The writing paper",
    q: "You have five minutes left on a task, and you have covered every bullet point. What is the most useful thing to do with those five minutes?",
    options: [
      "Read it back slowly and fix spelling, capitals and punctuation",
      "Start a new paragraph on a brand new idea",
      "Copy the whole thing out again more neatly",
      "Count every word"
    ],
    answer: 0,
    hint: "Which one could pick up the most marks in five minutes?",
    why: "With no spell checker, the read back is where you catch the easy slips: a missing capital, its for it's, there for their. A rushed new paragraph or a neat copy can add new mistakes rather than fix old ones." },

  /* ---------- 2. READING THE TASK ---------- */
  { type: "learn", topic: "Reading the task",
    title: "Read the task like a detective",
    html: "<p>Every task tells you three things. Find them before you write a word.</p>" +
          "<ul><li><b>Who</b> it is for (the audience): a manager, a friend, the public?</li>" +
          "<li><b>Why</b> you are writing (the purpose): to complain, to ask, to inform, to persuade?</li>" +
          "<li><b>What</b> it should be (the format): a letter, email, report, article?</li></ul>" +
          "<p>Then look at the <b>bullet points</b>. They tell you what to include, and each one is part of the content mark.</p>" +
          '<div class="keep"><b>Keep this</b>Cover every bullet. Number them in your plan, then tick each one off as it goes into your writing.</div>' },

  { type: "mc", topic: "Reading the task",
    q: "Here is a sample task and a draft answer. The draft is well written, but which bullet point has it missed?",
    fig: CAFE_TASK + CAFE_DRAFT,
    options: [
      "Suggest another way the centre could save money",
      "Say why you are writing",
      "Explain who uses the caf&eacute; and why it matters to them",
      "None: it covers them all"
    ],
    answer: 0,
    hint: "Go through the bullets one at a time and point at the sentence in the draft that covers each one.",
    why: "The opening covers why they are writing, and the second paragraph covers who uses the caf&eacute; and why it matters. Nothing suggests another way to save money, so a whole bullet's worth of content marks is lost. One more paragraph would fix it: perhaps longer opening hours, or renting the room out in the evenings." },

  { type: "match", topic: "Reading the task",
    q: "Match each task to its main purpose.",
    pairs: [
      ["Write to the council about the broken streetlights on your road.", "To complain"],
      ["Email a holiday park to find out if they allow dogs.", "To ask for information"],
      ["Write an article for a newsletter about a new youth club.", "To inform"],
      ["Make a leaflet encouraging people to give blood.", "To persuade"]
    ],
    hint: "Look for the clue words: broken, find out, about, encouraging.",
    why: "The purpose shapes everything: a complaint explains the problem and says what you want done, a request asks clear questions, an article informs and keeps readers interested, and a leaflet that persuades gives reasons and tells people what to do next." },

  /* ---------- 3. FORMAL OR INFORMAL ---------- */
  { type: "learn", topic: "Formal or informal",
    title: "Choosing how you sound",
    html: "<p>How formal your writing sounds is called its <b>register</b>. Match it to your reader.</p>" +
          "<ul><li><b>Formal</b>: for people you do not know, or people in charge, such as a manager, the council or a newspaper. Polite, full words, no slang.</li>" +
          "<li><b>Informal</b>: for friends and family. Chatty, but still in proper sentences.</li></ul>" +
          "<p>Most Level 1 tasks want formal writing. Even an article for young people should not slip into text speak.</p>" +
          '<table class="datatable pairtable"><tr><th>Informal</th><th>Formal</th></tr>' +
          "<tr><td>I'm, don't</td><td>I am, do not</td></tr>" +
          "<tr><td>loads of</td><td>many, a lot of</td></tr>" +
          "<tr><td>gonna</td><td>going to</td></tr></table>" +
          '<div class="keep"><b>Keep this</b>In formal writing, write words out in full: I am, do not, cannot. It sounds more polite, and there are fewer apostrophes to get wrong.</div>' },

  { type: "sort", topic: "Formal or informal",
    q: "Formal or informal? Sort these sentences.",
    buckets: ["Formal", "Informal"],
    cards: [
      ["I am writing to ask about your opening hours.", 0],
      ["I would be grateful if you could reply soon.", 0],
      ["Thank you for your time.", 0],
      ["Hiya, how's it going?", 1],
      ["That bus was well dodgy!", 1],
      ["Can't wait to see ya!", 1]
    ],
    hint: "Would you say it to a manager you have never met? Look out for slang and shortened words.",
    why: "Formal sentences use full words and polite phrases such as \"I would be grateful\". Informal ones use slang (dodgy, ya), short forms (can't, how's) and a chatty tone. Both are fine in the right place: the trick is matching the reader." },

  { type: "match", topic: "Formal or informal",
    q: "Turn each informal phrase into a formal one.",
    pairs: [
      ["It was rubbish.", "It was very disappointing."],
      ["Get back to me ASAP.", "I look forward to your reply."],
      ["The staff were dead rude.", "The staff were very impolite."],
      ["Loads of people use it.", "Many people use it."],
      ["I wanna know why.", "I would like to know why."]
    ],
    hint: "Each formal version keeps the same meaning but drops the slang.",
    why: "Formal does not mean using long words for the sake of it. It means polite, clear and slang free. \"I look forward to your reply\" is a handy ending for almost any formal letter or email." },

  /* ---------- 4. LETTERS AND EMAILS ---------- */
  { type: "learn", topic: "Letters and emails",
    title: "Formal letters and emails",
    fig: LETTER,
    html: "<p>A formal letter has its parts in set places. <b>Your address</b> goes top right, with the <b>date</b> under it. <b>Their address</b> goes on the left, a little lower.</p>" +
          "<p>The greeting and the sign off go in pairs:</p>" +
          '<table class="datatable pairtable"><tr><th>Start</th><th>End</th></tr>' +
          "<tr><td>Dear Sir or Madam, (no name)</td><td>Yours faithfully,</td></tr>" +
          "<tr><td>Dear Ms Patel, (you know the name)</td><td>Yours sincerely,</td></tr></table>" +
          "<p>A formal <b>email</b> needs no addresses, but it does need a clear <b>subject line</b> that says what it is about. Then the same greeting and sign off. (Kind regards also works in an email to someone you have named.)</p>" +
          '<div class="keep"><b>Keep this</b>Sir and Sincerely never go together. Dear Sir or Madam always ends Yours faithfully.</div>' },

  { type: "widget", topic: "Letters and emails",
    title: "Letter builder",
    html: "Two rounds: a letter, then an email. Put each part where it belongs, and leave out the parts that do not belong. One miss or fewer earns full sparks.",
    mount: letterBuilder,
    report: function(d){
      if(d.finished) return "Letter builder: both rounds done, " + (d.miss || 0) + " misses" + (d.shown ? " (used Show me)" : "");
      return "Letter builder: on round " + ((d.r || 0) + 1) + " of 2, " + (d.miss || 0) + " misses so far";
    } },

  { type: "mc", topic: "Letters and emails",
    q: "You are writing to \"The Manager, Brightway Buses\". You do not know the manager's name. How should the letter end?",
    options: ["Yours faithfully,", "Yours sincerely,", "Love from,", "Cheers,"],
    answer: 0,
    hint: "No name means the letter opens with Dear Sir or Madam. What goes with that?",
    why: "No name, so Dear Sir or Madam, so Yours faithfully. Yours sincerely is only for when you have used their name, such as Dear Mr Okafor." },

  { type: "mc", topic: "Letters and emails",
    q: "You are emailing a shop about a refund for a kettle that broke. Which is the best subject line?",
    options: [
      "Refund request: broken kettle, order 4471",
      "Hello",
      "URGENT!!! READ THIS NOW",
      "kettle"
    ],
    answer: 0,
    hint: "Which one tells the reader exactly what the email is about before they open it?",
    why: "A good subject line is short and specific: what you want and what it is about. Shouting in capitals sounds rude, and \"Hello\" or \"kettle\" tells the reader almost nothing." },

  /* ---------- 5. REPORTS AND ARTICLES ---------- */
  { type: "learn", topic: "Reports and articles",
    title: "Reports and articles",
    html: "<p>A <b>report</b> gives facts to someone who has to make a decision.</p>" +
          "<ul><li>A clear <b>title</b>, and a first line saying what the report is about and who it is for.</li>" +
          "<li><b>Subheadings</b> to split it into sections.</li>" +
          "<li>Formal, factual language.</li>" +
          "<li>A <b>recommendation</b> at the end: what you think should happen.</li></ul>" +
          "<p>An <b>article</b> is for a magazine, newsletter or website.</p>" +
          "<ul><li>A <b>headline</b> that grabs attention.</li>" +
          "<li>An <b>engaging opening</b>: a question, a surprising fact, or a tiny story.</li>" +
          "<li>Paragraphs, a tone that suits the readers, and an ending that sums up.</li></ul>" +
          '<div class="keep"><b>Keep this</b>Report: title, subheadings, facts, recommendation. Article: headline, hook, personality.</div>' },

  { type: "sort", topic: "Reports and articles",
    q: "Report, article, or both?",
    buckets: ["Report", "Article", "Both"],
    cards: [
      ["A recommendation at the end", 0],
      ["A first line saying who it is for", 0],
      ["A catchy headline", 1],
      ["Opening with a question to hook the reader", 1],
      ["Clear paragraphs", 2],
      ["Correct spelling and punctuation", 2]
    ],
    hint: "Reports are for someone making a decision. Articles are for readers who could stop reading at any moment.",
    why: "A report is practical: it says who it is for and ends by recommending what should happen. An article has to win its readers, so it needs a headline and a hook. Paragraphs and accurate SPaG matter in every kind of writing." },

  { type: "mc", topic: "Reports and articles",
    q: "Which is the most engaging opening for an article about a new youth drama club?",
    options: [
      "Have you ever wanted to stand in a spotlight while a whole room holds its breath?",
      "This article is about a drama club.",
      "The drama club is on Tuesdays.",
      "I am writing to inform you of a club."
    ],
    answer: 0,
    hint: "Which one would make you want to read the next line?",
    why: "A question that puts the reader in the picture pulls them in. \"This article is about\" is flat, the Tuesday fact belongs later on, and \"I am writing to inform you\" is how a letter starts, not an article." },

  /* ---------- 6. REVIEWS, LEAFLETS, NOTICES ---------- */
  { type: "learn", topic: "Reviews, leaflets, notices",
    title: "Reviews, leaflets and notices",
    html: "<ul><li><b>Review</b>: say what you are reviewing (a film, a caf&eacute;, a game), describe it briefly, give your opinion with reasons, and finish with a recommendation or a star rating.</li>" +
          "<li><b>Leaflet</b>: a title, subheadings, short sections or bullet points, and contact details or what to do next.</li>" +
          "<li><b>Notice</b>: short and clear. A bold heading, then the key facts: what, when, where, and who to contact.</li></ul>" +
          '<div class="keep"><b>Keep this</b>Ask yourself: what does a real one look like? Copy that shape. Using the right layout features is part of the format mark.</div>' },

  { type: "match", topic: "Reviews, leaflets, notices",
    q: "Match each kind of writing to a feature it should have.",
    pairs: [
      ["Review", "Your opinion, with reasons and a star rating"],
      ["Leaflet", "Subheadings, bullet points and contact details"],
      ["Notice", "A bold heading, then what, when and where"],
      ["Report", "A recommendation at the end"],
      ["Article", "A headline and a hook"]
    ],
    hint: "Think about where you would see each one: a review site, a rack of leaflets, a noticeboard.",
    why: "Each form has its own toolkit. Using the right features shows the examiner you know the format, and it makes the writing easier for a real reader to use." },

  { type: "multi", topic: "Reviews, leaflets, notices",
    q: "This notice is on a board in reception. Which <b>two</b> important things is it missing?",
    fig: '<div class="task" style="text-align:center"><p style="font-family:var(--display);font-weight:700;font-size:1.3rem;margin-bottom:6px">FOUND</p>' +
         "<p>A set of keys on a red keyring, with a tiny torch attached.</p><p>Found by the bike racks at the front of the building.</p></div>",
    options: [
      "When the keys were found",
      "Who to contact, or where to collect them",
      "A clear heading",
      "What was found",
      "Where they were found"
    ],
    answers: [0, 1],
    hint: "A notice should cover what, when, where, and who to contact. Tick off the ones it has.",
    why: "It has a heading (FOUND), what (the keys), and where (the bike racks). But the owner cannot get their keys back without knowing who to contact, and \"when\" helps them work out if they are theirs. A notice is only useful if someone can act on it." },

  /* ---------- 7. PARAGRAPHS AND LINKS ---------- */
  { type: "learn", topic: "Paragraphs and links",
    title: "Paragraphs and linking words",
    html: "<p>Start a new <b>paragraph</b> for each new point. A simple shape works for most tasks:</p>" +
          "<ul><li><b>Opening</b>: who you are and why you are writing.</li>" +
          "<li><b>Middle</b>: one paragraph for each bullet point.</li>" +
          "<li><b>Ending</b>: what you would like to happen next.</li></ul>" +
          "<p><b>Linking words</b> join your ideas and guide the reader:</p>" +
          '<table class="datatable pairtable">' +
          "<tr><td>Adding</td><td>also, in addition, as well as</td></tr>" +
          "<tr><td>Contrasting</td><td>however, but, although</td></tr>" +
          "<tr><td>Reasons and results</td><td>because, so, as a result</td></tr>" +
          "<tr><td>Examples</td><td>for example, such as</td></tr>" +
          "<tr><td>Order</td><td>firstly, next, finally</td></tr></table>" +
          '<div class="keep"><b>Keep this</b>Leave a line between paragraphs, so the examiner can see them at a glance.</div>' },

  { type: "sort", topic: "Paragraphs and links",
    q: "What job does each linking word do?",
    buckets: ["Adding", "Contrasting", "Reason or result"],
    cards: [
      ["In addition", 0],
      ["Also", 0],
      ["However", 1],
      ["Although", 1],
      ["Because", 2],
      ["As a result", 2]
    ],
    hint: "Try each one in a sentence: \"The bus was late. ___ ...\"",
    why: "Adding words pile up more of the same kind of point. Contrasting words turn the other way. Reason and result words show cause and effect. Using a mix makes your writing flow and shows clear thinking." },

  { type: "order", topic: "Paragraphs and links",
    q: "Here are the four paragraphs of a complaint email, jumbled up. Put them in a sensible order.",
    items: [
      "I am writing to complain about the number 12 bus, which has been late every morning this week.",
      "On Monday it arrived 25 minutes late, and on Wednesday it did not come at all. As a result, I missed the start of my course twice.",
      "In addition, when I phoned your helpline to ask what was happening, nobody answered.",
      "I would like you to explain what is causing the delays and how you will fix them. I look forward to hearing from you."
    ],
    hint: "Opening: why you are writing. Middle: the details, with \"In addition\" bringing in a second problem. Ending: what you want to happen.",
    why: "Opening, details, an extra point, then what you want. The linking words help: \"As a result\" shows the effect of the late bus, and \"In addition\" signals a new paragraph with a fresh complaint." },

  /* ---------- 8. YOUR TURN TO WRITE ---------- */
  { type: "learn", topic: "Your turn to write",
    title: "Plan in two minutes",
    html: "<p>Two minutes of planning saves ten minutes of muddle. You could try this:</p>" +
          "<ol><li>Circle who it is for, why you are writing, and the format.</li>" +
          "<li>Number the bullet points. Each one becomes a paragraph.</li>" +
          "<li>Jot two or three words of ideas next to each one.</li>" +
          "<li>Choose your greeting and sign off (or your headline, or title).</li></ol>" +
          "<p>Then write it, tick off each bullet, and keep a few minutes to read it back.</p>" +
          '<div class="keep"><b>Keep this</b>A plan is notes for you, not for the examiner. Single words are fine.</div>' },

  { type: "order", topic: "Your turn to write",
    q: "Put these steps for tackling a writing task in order.",
    items: [
      "Circle who it is for, why, and the format",
      "Number the bullet points",
      "Jot a few words of ideas for each bullet",
      "Write it, one paragraph for each bullet",
      "Read it back slowly to fix spelling and punctuation"
    ],
    hint: "Read and plan first, write in the middle, check at the end.",
    why: "Understand the task, plan, write, check. Two minutes at the start and a few at the end are the best value minutes in the whole paper." },

  { type: "write", topic: "Your turn to write",
    q: '<p><b>Your turn.</b> Here is a full Level 1 style task. In the exam you would have about 40 minutes, but here you can take as long as you like, and you could do it in more than one sitting. It goes to Jay, unmarked, only if you choose to send it.</p>' +
       '<div class="task"><span class="tlab">Task</span>' +
       "<p>You bought a pair of headphones online from a company called SoundBox. After one week, they stopped working.</p>" +
       "<p>Write an email to SoundBox's customer services team. You do not know the name of the person who will read it.</p>" +
       "<p>In your email you should:</p>" +
       "<ul><li>explain what you bought and when</li><li>describe what is wrong with the headphones</li><li>say what you would like the company to do.</li></ul></div>",
    starters: ["Subject:", "Dear Sir or Madam,", "I am writing to complain about", "On", "Unfortunately,", "In addition,", "As a result,", "I would like you to", "I look forward to hearing from you.", "Yours faithfully,"],
    checklist: [
      "I wrote a clear subject line",
      "I used Dear Sir or Madam and Yours faithfully",
      "I covered all three bullet points, each in its own paragraph",
      "I kept it formal: no slang, words written out in full",
      "I used linking words such as in addition, however, as a result",
      "I read it back and checked capitals, full stops and apostrophes"
    ],
    minWords: 150 }
  ]
});
})();
