<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6", TINT = "#4b5275";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function ln(x1, y1, x2, y2, col, w, extra){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
}
function poly(pts, fill, extra){
  return '<polygon points="' + pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"' + (extra || "") + '/>';
}
function rect(x, y, w, h, fill, extra){
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="3"' + (extra || "") + '/>';
}

/* ---------- figures (drawn to scale unless marked) ---------- */

/* L shape from points in metres; labels: [x, y, text, anchor] in metres */
function lshape(pts, k, ox, oy, W, H, labs, extra, aria){
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">';
  s += poly(pts.map(function(p){ return [ox + p[0] * k, oy + p[1] * k]; }), "#e7f8f6");
  s += extra ? extra(function(x){ return ox + x * k; }, function(y){ return oy + y * k; }) : "";
  labs.forEach(function(l){
    s += t((ox + l[0] * k).toFixed(1), (oy + l[1] * k).toFixed(1), l[2], 18, l[4] || INK, LAB + ' font-weight="700" text-anchor="' + (l[3] || "middle") + '"');
  });
  s += '</svg>';
  return s;
}
/* Learn L: top 5, inner drop 4, step 3, right 2, bottom 8, left 6. 30 units per metre. */
var L1PTS = [[0, 0], [5, 0], [5, 4], [8, 4], [8, 6], [0, 6]];
var PERIM_FIG = lshape(L1PTS, 30, 70, 34, 400, 262, [
  [2.5, -0.35, "5 m"], [-0.3, 3.15, "6 m", "end"], [4, 6.85, "8 m"], [8.3, 5.15, "2 m", "start"],
  [5.3, 2.15, "?", "start", CORAL], [6.5, 3.75, "?", "middle", CORAL]
], null, "An L shaped room drawn to scale. Top 5 metres, left side 6 metres, bottom 8 metres, right side 2 metres. Two inside edges are marked with question marks.");
var AREA_FIG = lshape(L1PTS, 30, 70, 34, 400, 262, [
  [2.5, -0.35, "5 m"], [-0.3, 3.15, "6 m", "end"], [4, 6.85, "8 m"], [8.3, 5.15, "2 m", "start"],
  [5.3, 2.15, "4 m", "start"], [6.5, 3.75, "3 m"]
], function(X, Y){
  return ln(X(0), Y(4), X(5), Y(4), BLUE, 3, ' stroke-dasharray="8 6"') +
    t(X(2.5), Y(2.15), "5 &times; 4 = 20", 17, BLUE, LAB + ' font-weight="800" text-anchor="middle"') +
    t(X(4), Y(5.2), "8 &times; 2 = 16", 17, BLUE, LAB + ' font-weight="800" text-anchor="middle"');
}, "The same L shaped room split by a dashed line into a 5 by 4 rectangle, area 20 square metres, and an 8 by 2 strip, area 16 square metres.");

/* Question room: top 4, left 5, bottom 6, right 2; inside edges 3 down and 2 across. 36 units per metre. */
var L2PTS = [[0, 0], [4, 0], [4, 3], [6, 3], [6, 5], [0, 5]];
var ROOM_FIG = lshape(L2PTS, 36, 86, 34, 400, 246, [
  [2, -0.3, "4 m"], [-0.25, 2.65, "5 m", "end"], [3, 5.75, "6 m"], [6.25, 4.15, "2 m", "start"]
], null, "An L shaped room drawn to scale. Top 4 metres, left side 5 metres, bottom 6 metres, right side 2 metres. The two inside edges are not labelled.");

/* Cuboid, oblique drawing */
function cuboid(ox, oy, L, H, D, k, labs, aria, W, Hh){
  var d = D * k * 0.5 * 0.7071;
  var x1 = ox + L * k, y1 = oy - H * k;
  var s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + aria + '">';
  s += poly([[ox, y1], [ox + d, y1 - d], [x1 + d, y1 - d], [x1, y1]], "#c9f1ec");
  s += poly([[x1, y1], [x1 + d, y1 - d], [x1 + d, oy - d], [x1, oy]], "#9fe5dd");
  s += poly([[ox, oy], [ox, y1], [x1, y1], [x1, oy]], "#e7f8f6");
  s += t((ox + x1) / 2, oy + 26, labs[0], 18, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(ox - 8, (oy + y1) / 2 + 6, labs[1], 18, INK, LAB + ' font-weight="700" text-anchor="end"');
  s += t((x1 + d / 2 + 10).toFixed(1), (oy - d / 2 + 14).toFixed(1), labs[2], 18, INK, LAB + ' font-weight="700" text-anchor="start"');
  return s;
}
var CUBOID_FIG = cuboid(70, 170, 30, 10, 20, 7, ["30 cm", "10 cm", "20 cm"],
  "A cuboid box 30 centimetres long, 20 centimetres wide and 10 centimetres high. Not to scale.", 400, 210) +
  '</svg>';
CUBOID_FIG = CUBOID_FIG.replace('</svg>', t(396, 20, "not to scale", 14, TINT, BODY + ' text-anchor="end"') + '</svg>');

/* Net of a 4 by 2 by 1 cuboid, 30 units per cm */
var NET_FIG = (function(){
  var u = 32, ox = 10, oy = 14;
  var faces = [[1, 0, 4, 1, "side"], [1, 1, 4, 2, "top"], [1, 3, 4, 1, "side"], [1, 4, 4, 2, "bottom"], [0, 1, 1, 2, "end"], [5, 1, 1, 2, "end"]];
  var s = '<svg viewBox="0 0 400 214" role="img" aria-label="A net of a cuboid 4 centimetres by 2 centimetres by 1 centimetre: six rectangles in three matching pairs, beside the folded box.">';
  faces.forEach(function(f){
    s += rect(ox + f[0] * u, oy + f[1] * u, f[2] * u, f[3] * u, f[4] === "end" ? "#fff3c4" : f[4] === "side" ? "#e7f8f6" : "#c9f1ec");
    s += t(ox + (f[0] + f[2] / 2) * u, oy + (f[1] + f[3] / 2) * u + 5, f[4], 15, INK, BODY + ' text-anchor="middle"');
  });
  s += t(300, 96, "folds up to make", 16, TINT, BODY + ' text-anchor="middle"');
  var c = cuboid(240, 166, 4, 1, 2, 24, ["4 cm", "1 cm", "2 cm"], "", 1, 1);
  s += c.replace(/^<svg[^>]*>/, "");
  s += '</svg>';
  return s;
})();

/* Four cube object, oblique: three in a row, one on top of the left cube */
function cubeAt(ox, oy, c, r, a){
  var x = ox + c * a, y = oy - r * a, d = a / 2;
  return poly([[x, y - a], [x + d, y - a - d], [x + a + d, y - a - d], [x + a, y - a]], "#c9f1ec") +
    poly([[x + a, y - a], [x + a + d, y - a - d], [x + a + d, y - d], [x + a, y]], "#9fe5dd") +
    poly([[x, y], [x, y - a], [x + a, y - a], [x + a, y]], "#e7f8f6");
}
var BLOCKS_FIG = '<svg viewBox="0 0 400 200" role="img" aria-label="A shape made of four cubes: three cubes in a row from left to right, with a fourth cube on top of the left hand cube. An arrow shows the front.">' +
  cubeAt(110, 170, 0, 0, 50) + cubeAt(110, 170, 1, 0, 50) + cubeAt(110, 170, 2, 0, 50) + cubeAt(110, 170, 0, 1, 50) +
  t(185, 196, "front", 15, TINT, BODY + ' text-anchor="middle"') +
  '</svg>';
/* small square drawings for answer options: cells [[c, r]] with r = 0 at the top */
function view(cells, aria){
  var a = 30, maxc = 0, maxr = 0;
  cells.forEach(function(p){ maxc = Math.max(maxc, p[0]); maxr = Math.max(maxr, p[1]); });
  var W = (maxc + 1) * a + 8, H = (maxr + 1) * a + 8;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + aria + '">';
  cells.forEach(function(p){ s += rect(4 + p[0] * a, 4 + p[1] * a, a, a, "#e7f8f6"); });
  return s + '</svg>';
}
function net(cells, aria){
  var a = 22, maxc = 0, maxr = 0;
  cells.forEach(function(p){ maxc = Math.max(maxc, p[0]); maxr = Math.max(maxr, p[1]); });
  var W = (maxc + 1) * a + 6, H = (maxr + 1) * a + 6;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + aria + '">';
  cells.forEach(function(p){ s += '<rect x="' + (3 + p[0] * a) + '" y="' + (3 + p[1] * a) + '" width="' + a + '" height="' + a + '" fill="#fff3c4" stroke="' + INK + '" stroke-width="2.5"/>'; });
  return s + '</svg>';
}

/* Map scale bar 1 : 50 000, 1 cm drawn as 70 units */
var SCALEBAR = (function(){
  var s = '<svg viewBox="0 0 400 122" role="img" aria-label="Scale bar for 1 to 50 000: each centimetre on the map is 500 metres, so 2 centimetres is 1 kilometre.">';
  s += t(200, 22, "Map scale 1 : 50 000", 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  for(var k = 0; k < 4; k++){
    s += '<rect x="' + (60 + k * 70) + '" y="40" width="70" height="16" fill="' + (k % 2 ? WHITE : INK) + '" stroke="' + INK + '" stroke-width="2"/>';
  }
  var labs = ["0", "500 m", "1 km", "1.5 km", "2 km"];
  for(var j = 0; j <= 4; j++) s += t(60 + j * 70, 80, labs[j], 15, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(95, 112, "1 cm on the map", 16, BLUE, BODY + ' text-anchor="middle"');
  s += ln(62, 94, 128, 94, BLUE, 3);
  s += t(310, 112, "2 cm = 1 km", 16, BLUE, BODY + ' text-anchor="middle" font-weight="700"');
  s += '</svg>';
  return s;
})();

/* Garden plan on a 1 cm grid: 6 squares by 4 squares */
var PLAN_FIG = (function(){
  var a = 36, ox = 56, oy = 14, cols = 8, rows = 6;
  var s = '<svg viewBox="0 0 400 268" role="img" aria-label="A plan on a grid of 1 centimetre squares. The garden is a rectangle 6 squares long and 4 squares wide. Scale 1 centimetre to 2 metres.">';
  for(var c = 0; c <= cols; c++) s += ln(ox + c * a, oy, ox + c * a, oy + rows * a, LINE, 1.5);
  for(var r = 0; r <= rows; r++) s += ln(ox, oy + r * a, ox + cols * a, oy + r * a, LINE, 1.5);
  s += '<rect x="' + (ox + a) + '" y="' + (oy + a) + '" width="' + (6 * a) + '" height="' + (4 * a) + '" fill="rgba(25,195,154,.25)" stroke="' + INK + '" stroke-width="3"/>';
  s += t(ox + 4 * a, oy + 3 * a + 6, "garden", 18, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(200, 258, "Each square is 1 cm.  Scale: 1 cm to 2 m", 16, INK, BODY + ' text-anchor="middle" font-weight="700" xml:space="preserve"');
  s += '</svg>';
  return s;
})();

/* Three angles */
var ANGLES = (function(){
  var s = '<svg viewBox="0 0 400 170" role="img" aria-label="Three angles: an acute angle of 40 degrees, a right angle of 90 degrees marked with a small square, and an obtuse angle of 130 degrees.">';
  function ang(vx, vy, deg, col, name, sub){
    var r = 80, rad = deg * Math.PI / 180;
    var ex = vx + r * Math.cos(rad), ey = vy - r * Math.sin(rad);
    var o = ln(vx, vy, vx + r, vy, INK, 4, ' stroke-linecap="round"') + ln(vx, vy, ex.toFixed(1), ey.toFixed(1), INK, 4, ' stroke-linecap="round"');
    if(deg === 90){
      o += '<path d="M' + (vx + 18) + ' ' + vy + ' V' + (vy - 18) + ' H' + vx + '" fill="none" stroke="' + col + '" stroke-width="3"/>';
    } else {
      var ar = 26, ax = vx + ar * Math.cos(rad), ay = vy - ar * Math.sin(rad);
      o += '<path d="M' + (vx + ar) + ' ' + vy + ' A' + ar + ' ' + ar + ' 0 0 0 ' + ax.toFixed(1) + ' ' + ay.toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="3"/>';
    }
    return o;
  }
  s += ang(20, 112, 40, BLUE) + ang(155, 112, 90, MINT) + ang(305, 112, 130, CORAL);
  s += t(60, 140, "acute", 18, BLUE, LAB + ' font-weight="800" text-anchor="middle"') + t(60, 162, "less than 90&deg;", 16, INK, BODY + ' text-anchor="middle"');
  s += t(195, 140, "right angle", 18, MINT, LAB + ' font-weight="800" text-anchor="middle"') + t(195, 162, "exactly 90&deg;", 16, INK, BODY + ' text-anchor="middle"');
  s += t(330, 140, "obtuse", 18, CORAL, LAB + ' font-weight="800" text-anchor="middle"') + t(330, 162, "90&deg; to 180&deg;", 16, INK, BODY + ' text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Six shapes for the symmetry match */
var SHAPES = (function(){
  var s = '<svg viewBox="0 0 420 290" role="img" aria-label="Six shapes: a square, a rectangle, an equilateral triangle, an isosceles triangle, a regular hexagon and a parallelogram.">';
  var F = "#e7f8f6";
  function nm(x, y, a, b){ return t(x, y, a, 15, INK, LAB + ' font-weight="700" text-anchor="middle"') + (b ? t(x, y + 18, b, 15, INK, LAB + ' font-weight="700" text-anchor="middle"') : ""); }
  // row 1 centres x = 70, 210, 350, shapes sit above y = 105
  s += rect(40, 40, 60, 60, F) + nm(70, 126, "square");
  s += rect(165, 50, 90, 50, F) + nm(210, 126, "rectangle");
  var h = 70 * Math.sqrt(3) / 2;
  s += poly([[315, 100], [385, 100], [350, 100 - h]], F) + nm(350, 126, "equilateral", "triangle");
  // row 2
  s += poly([[45, 245], [95, 245], [70, 170]], F) + nm(70, 268, "isosceles", "triangle");
  var hx = [];
  for(var k = 0; k < 6; k++){ var a = k * Math.PI / 3; hx.push([210 + 38 * Math.cos(a), 210 + 38 * Math.sin(a)]); }
  s += poly(hx, F) + nm(210, 268, "regular", "hexagon");
  s += poly([[305, 245], [375, 245], [400, 200], [330, 200]], F) + nm(350, 268, "parallelogram");
  s += '</svg>';
  return s;
})();

/* Compass rose */
var ROSE = (function(){
  var cx = 200, cy = 112, s = '<svg viewBox="0 0 400 226" role="img" aria-label="A compass rose with the eight points: North, North East, East, South East, South, South West, West and North West, going clockwise.">';
  var names = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  for(var k = 0; k < 8; k++){
    var a = k * 45 * Math.PI / 180, r = k % 2 ? 62 : 80;
    var x = cx + r * Math.sin(a), y = cy - r * Math.cos(a);
    s += ln(cx, cy, x.toFixed(1), y.toFixed(1), k % 2 ? TINT : INK, k % 2 ? 3 : 5, ' stroke-linecap="round"');
    var lr = k % 2 ? 82 : 100;
    s += t((cx + lr * Math.sin(a)).toFixed(1), (cy - lr * Math.cos(a) + 6).toFixed(1), names[k], k % 2 ? 16 : 20, k === 0 ? CORAL : INK, LAB + ' font-weight="800" text-anchor="middle"');
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + INK + '"/>';
  var a1 = 35 * Math.PI / 180, a2 = 75 * Math.PI / 180, R = 112;
  var sx = cx + R * Math.sin(a1), sy = cy - R * Math.cos(a1), ex = cx + R * Math.sin(a2), ey = cy - R * Math.cos(a2);
  s += '<path d="M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' A' + R + ' ' + R + ' 0 0 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '" fill="none" stroke="' + BLUE + '" stroke-width="3"/>';
  var tx = Math.cos(a2), ty = Math.sin(a2);   /* direction of travel at the end of the arc */
  function hd(sgn){ var bx = ex - 12 * tx + sgn * 7 * ty, by = ey - 12 * ty - sgn * 7 * tx; return bx.toFixed(1) + ' ' + by.toFixed(1); }
  s += '<path d="M' + hd(1) + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' L' + hd(-1) + '" fill="none" stroke="' + BLUE + '" stroke-width="3"/>';
  s += t(396, 40, "clockwise", 16, BLUE, BODY + ' text-anchor="end" font-weight="700"');
  s += '</svg>';
  return s;
})();

/* Town map on a grid, North up */
var TOWN = (function(){
  var a = 52, ox = 30, oy = 20, cols = 6, rows = 5;
  var s = '<svg viewBox="0 0 400 300" role="img" aria-label="A map on a grid of squares, 6 across and 5 down, with North at the top. Counting from the top left: Library column 2 row 5, Park column 2 row 3, Cafe column 5 row 3, Station column 5 row 5, School column 3 row 2.">';
  for(var c = 0; c <= cols; c++) s += ln(ox + c * a, oy, ox + c * a, oy + rows * a, LINE, 1.5);
  for(var r = 0; r <= rows; r++) s += ln(ox, oy + r * a, ox + cols * a, oy + r * a, LINE, 1.5);
  function place(c, r, name, col){
    var x = ox + c * a + a / 2, y = oy + r * a + a / 2;
    return '<circle cx="' + x + '" cy="' + (y - 8) + '" r="8" fill="' + col + '" stroke="' + INK + '" stroke-width="2"/>' +
      t(x, y + 18, name, 14, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += place(1, 4, "Library", BLUE) + place(1, 2, "Park", MINT) + place(4, 2, "Cafe", SUN) + place(4, 4, "Station", CORAL) + place(2, 1, "School", VIOLET);
  s += '<path d="M370 120 V40" stroke="' + INK + '" stroke-width="4"/><path d="M360 56 L370 38 L380 56 Z" fill="' + INK + '"/>';
  s += t(370, 34, "N", 20, INK, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Wall and tins */
var WALL = (function(){
  var k = 60, ox = 60, oy = 30;           // wall 4 m by 2.5 m; each tin covers 4 m2, a strip 1.6 m wide
  var s = '<svg viewBox="0 0 400 250" role="img" aria-label="A wall 4 metres wide and 2.5 metres high, area 10 square metres, split into strips: tin 1 covers 4 square metres, tin 2 covers 4 square metres, and half a tin covers the last 2 square metres.">';
  var cols = ["#c9f1ec", "#9fe5dd", "#fff3c4"];
  var xs = [0, 1.6, 3.2, 4], labs = ["tin 1", "tin 2", "&frac12; tin"];
  for(var j = 0; j < 3; j++){
    s += '<rect x="' + (ox + xs[j] * k) + '" y="' + oy + '" width="' + ((xs[j + 1] - xs[j]) * k).toFixed(1) + '" height="' + (2.5 * k) + '" fill="' + cols[j] + '" stroke="' + INK + '" stroke-width="2" stroke-dasharray="' + (j ? "6 4" : "0") + '"/>';
    s += t((ox + (xs[j] + xs[j + 1]) / 2 * k).toFixed(1), oy + 1.25 * k + 6, labs[j], 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  }
  s += '<rect x="' + ox + '" y="' + oy + '" width="' + (4 * k) + '" height="' + (2.5 * k) + '" fill="none" stroke="' + INK + '" stroke-width="3"/>';
  s += t(ox + 2 * k, oy + 2.5 * k + 26, "4 m", 18, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += t(ox - 8, oy + 1.25 * k + 6, "2.5 m", 18, INK, LAB + ' font-weight="700" text-anchor="end"');
  s += t(200, 240, "Area 10 m&sup2;. 10 &divide; 4 = 2.5, so buy 3 tins", 17, BLUE, BODY + ' text-anchor="middle" font-weight="700"');
  s += '</svg>';
  return s;
})();

/* ---------- room builder widget ---------- */
var RC = 8, RR = 6, CELL = 40, PAD = 20;
var RB = [
  { area: 12, per: 14, rect: true,
    task: "Make a <b>rectangular</b> room with an area of <b>12 m&sup2;</b> and a perimeter of <b>14 m</b>.",
    sol: [[1, 1, 4, 3]],
    why: "A 4 by 3 rectangle: area 4 &times; 3 = 12 m&sup2;, perimeter 4 + 3 + 4 + 3 = 14 m. A 6 by 2 rectangle also has area 12 but its perimeter is 16 m." },
  { area: 12, per: 16,
    task: "Same area, <b>12 m&sup2;</b>, but this time a perimeter of <b>16 m</b>. Any shape you like, as long as the squares join edge to edge.",
    sol: [[1, 2, 6, 2]],
    why: "A 6 by 2 rectangle works: 6 + 2 + 6 + 2 = 16 m. Lots of other shapes work too. Same area, different perimeter: a long thin room needs more skirting board than a squarer one." },
  { area: 15, per: 16, notRect: true,
    task: "Now an <b>L shaped</b> room (not a rectangle) with an area of <b>15 m&sup2;</b> and a perimeter of <b>16 m</b>.",
    sol: [[1, 1, 4, 3], [1, 4, 3, 1]],
    why: "A 4 by 4 square with one corner square taken out: area 16 &minus; 1 = 15 m&sup2;. Taking out a corner does not change the perimeter: it is still 16 m, because the two edges you lose are replaced by two new ones." }
];
function rbStats(cells){
  var area = 0, per = 0, minc = 99, maxc = -1, minr = 99, maxr = -1;
  function on(c, r){ return c >= 0 && r >= 0 && c < RC && r < RR && cells[r * RC + c] === 1; }
  for(var r = 0; r < RR; r++) for(var c = 0; c < RC; c++){
    if(!on(c, r)) continue;
    area++;
    minc = Math.min(minc, c); maxc = Math.max(maxc, c); minr = Math.min(minr, r); maxr = Math.max(maxr, r);
    if(!on(c - 1, r)) per++; if(!on(c + 1, r)) per++; if(!on(c, r - 1)) per++; if(!on(c, r + 1)) per++;
  }
  var isRect = area > 0 && area === (maxc - minc + 1) * (maxr - minr + 1);
  /* joined: flood fill from the first filled square */
  var seen = {}, stack = [], joined = true, holes = false;
  for(var i = 0; i < cells.length; i++) if(cells[i] === 1){ stack.push(i); seen[i] = 1; break; }
  var count = 0;
  while(stack.length){
    var p = stack.pop(), pc = p % RC, pr = Math.floor(p / RC); count++;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function(dv){
      var nc = pc + dv[0], nr = pr + dv[1], ni = nr * RC + nc;
      if(on(nc, nr) && !seen[ni]){ seen[ni] = 1; stack.push(ni); }
    });
  }
  if(area && count !== area) joined = false;
  /* holes: flood the empty squares from outside the grid */
  var out = {}, st = [];
  for(var rr = -1; rr <= RR; rr++) for(var cc = -1; cc <= RC; cc++){
    if(rr === -1 || cc === -1 || rr === RR || cc === RC){ out[rr + "," + cc] = 1; st.push([cc, rr]); }
  }
  while(st.length){
    var q = st.pop();
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function(dv){
      var nc = q[0] + dv[0], nr = q[1] + dv[1], key = nr + "," + nc;
      if(nc < -1 || nr < -1 || nc > RC || nr > RR || out[key]) return;
      if(on(nc, nr)) return;
      out[key] = 1; st.push([nc, nr]);
    });
  }
  for(var r2 = 0; r2 < RR; r2++) for(var c2 = 0; c2 < RC; c2++) if(!on(c2, r2) && !out[r2 + "," + c2]) holes = true;
  return { area: area, per: per, isRect: isRect, joined: joined, holes: holes };
}

function mountRooms(el, api){
  var d = api.data;
  if(!d.cells || d.cells.length !== RC * RR){ d.cells = []; for(var i = 0; i < RC * RR; i++) d.cells.push(0); }
  if(typeof d.c !== "number") d.c = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  var view = d.c;

  el.innerHTML =
    '<div class="wpanel rb-task" data-r="task"></div>' +
    '<div class="rb-svg" data-r="svg"></div>' +
    '<div class="rb-read"><div><small>Area</small><span class="wbig" data-r="area"></span></div><div><small>Perimeter (red edges)</small><span class="wbig rb-per" data-r="per"></span></div></div>' +
    '<div class="wrow">' +
      '<button class="btn" type="button" data-r="check">Check my room</button>' +
      '<button class="btn btn-quiet" type="button" data-r="clear">Clear</button>' +
      '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
    '</div>' +
    '<div class="fb rb-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

  function svg(){
    var W = RC * CELL + PAD * 2, H = RR * CELL + PAD * 2;
    var st = rbStats(d.cells);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Room builder grid, 8 squares by 6. ' + st.area + ' squares filled, perimeter ' + st.per + ' metres.">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="12" fill="' + PAPER + '"/>';
    for(var r = 0; r < RR; r++) for(var c = 0; c < RC; c++){
      var i = r * RC + c, f = d.cells[i] === 1;
      s += '<rect class="rb-cell" data-i="' + i + '" x="' + (PAD + c * CELL) + '" y="' + (PAD + r * CELL) + '" width="' + CELL + '" height="' + CELL + '" fill="' + (f ? "#9fe5dd" : WHITE) + '" stroke="' + LINE + '" stroke-width="1.5"/>';
    }
    function on(c, r){ return c >= 0 && r >= 0 && c < RC && r < RR && d.cells[r * RC + c] === 1; }
    for(var r1 = 0; r1 < RR; r1++) for(var c1 = 0; c1 < RC; c1++){
      if(!on(c1, r1)) continue;
      var x = PAD + c1 * CELL, y = PAD + r1 * CELL, e = ' stroke-linecap="round" pointer-events="none"';
      if(!on(c1, r1 - 1)) s += ln(x, y, x + CELL, y, "#e03a3a", 5, e);
      if(!on(c1, r1 + 1)) s += ln(x, y + CELL, x + CELL, y + CELL, "#e03a3a", 5, e);
      if(!on(c1 - 1, r1)) s += ln(x, y, x, y + CELL, "#e03a3a", 5, e);
      if(!on(c1 + 1, r1)) s += ln(x + CELL, y, x + CELL, y + CELL, "#e03a3a", 5, e);
    }
    s += '</svg>';
    return s;
  }
  function task(){
    var dots = '<div class="rb-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 3) return dots + '<p><b>Free play.</b> All three rooms built. Build anything you like and watch the area and perimeter change.</p>';
    return dots + '<p class="tiny" style="margin:0 0 4px">Room ' + (view + 1) + ' of 3. Each square is 1 m by 1 m. Tap squares to fill or empty them.</p><p>' + RB[view].task + '</p>';
  }
  function draw(){
    var st = rbStats(d.cells);
    q("task").innerHTML = task();
    q("svg").innerHTML = svg();
    q("area").innerHTML = st.area + " m&sup2;";
    q("per").innerHTML = st.per + " m";
    var waiting = view !== d.c || d.c >= 3;
    q("check").classList.toggle("hidden", d.c >= 3);
    q("check").disabled = waiting;
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }
  function fb(cls, html){ var f = q("fb"); f.className = "fb rb-fb " + cls; f.innerHTML = html; }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function setSol(k){
    for(var i = 0; i < d.cells.length; i++) d.cells[i] = 0;
    RB[k].sol.forEach(function(b){
      for(var r = b[1]; r < b[1] + b[3]; r++) for(var c = b[0]; c < b[0] + b[2]; c++) d.cells[r * RC + c] = 1;
    });
  }
  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here is one that works.</b> " : "<b>Yes, that room works.</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All three rooms built. Area counts the squares inside; perimeter counts the edges all the way round.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next room</button>';
    fb(how === "shown" ? "show" : "good", head + RB[k].why + more);
    q("next").onclick = function(){
      view = d.c;
      for(var i = 0; i < d.cells.length; i++) d.cells[i] = 0;
      api.save();
      q("fb").className = "fb rb-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }
  function problem(){
    var c = RB[view], st = rbStats(d.cells);
    if(!st.area) return "There are no squares yet. Tap some to fill them.";
    if(!st.joined) return "Some squares are not joined edge to edge. A room needs to be one piece.";
    if(st.holes) return "There is an empty square in the middle. Fill it in or move it to the edge.";
    if(st.area !== c.area) return "The area is " + st.area + " m&sup2;, and it needs to be " + c.area + " m&sup2;. " + (st.area < c.area ? "Add" : "Take away") + " " + Math.abs(st.area - c.area) + " square" + (Math.abs(st.area - c.area) === 1 ? "" : "s") + ".";
    if(c.rect && !st.isRect) return "Area 12 m&sup2;, good. This room needs to be a rectangle.";
    if(c.notRect && st.isRect) return "That is a rectangle. This one needs to be L shaped.";
    if(st.per !== c.per) return "The area is right. The perimeter is " + st.per + " m and it needs to be " + c.per + " m. " +
      (st.per > c.per ? "Try a more compact, squarer shape." : "Try a longer, thinner shape.");
    return "";
  }
  q("svg").addEventListener("click", function(e){
    var cell = e.target.closest("[data-i]");
    if(!cell || d.c >= 3 && view < 3) return;
    if(view !== d.c && d.c < 3) return;
    var i = parseInt(cell.getAttribute("data-i"), 10);
    d.cells[i] = d.cells[i] ? 0 : 1;
    api.save(); draw();
  });
  q("clear").onclick = function(){
    if(view !== d.c && d.c < 3) return;
    for(var i = 0; i < d.cells.length; i++) d.cells[i] = 0;
    api.save(); draw();
  };
  q("check").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    var p = problem();
    if(!p){ solved(view, "right"); return; }
    d.miss[view]++; api.save();
    fb("nudge", "<b>Not quite yet.</b> " + p);
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    d.shown[view] = true;
    setSol(view);
    solved(view, "shown");
  };
  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three rooms built.</b> Area counts the squares inside; perimeter counts the edges all the way round.");
    api.done(d.result);
  }
}
