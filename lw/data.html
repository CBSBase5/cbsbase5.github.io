<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6", TINT = "#4b5275";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function ln(x1, y1, x2, y2, col, w, extra){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
}
function fmt(v){ return String(Math.round(v * 100) / 100); }

/* ---------- tally marks ---------- */
function tallyMarks(n, x, y, h){
  var s = "", gx = x;
  for(var g = 0; g < Math.floor(n / 5); g++){
    for(var k = 0; k < 4; k++) s += ln(gx + k * 7, y, gx + k * 7, y + h, INK, 2.5, ' stroke-linecap="round"');
    s += ln(gx - 4, y + h - 3, gx + 25, y + 3, INK, 2.5, ' stroke-linecap="round"');
    gx += 38;
  }
  for(var j = 0; j < n % 5; j++) s += ln(gx + j * 7, y, gx + j * 7, y + h, INK, 2.5, ' stroke-linecap="round"');
  return s;
}
/* rows: [[name, n]], freq: show the frequency column */
function tallyTable(title, head, rows, freq, aria, total){
  var rh = 36, top = 62, W = 400;
  var H = top + rh * (rows.length + (total ? 1 : 0)) + 10;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">';
  s += t(W / 2, 20, title, 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  var cols = freq ? [10, 130, 280, 390] : [10, 150, 390];
  s += '<rect x="10" y="' + (top - 30) + '" width="380" height="30" fill="#d6f6f3"/>';
  s += t(cols[0] + 8, top - 9, head, 16, INK, LAB + ' font-weight="800"');
  s += t(cols[1] + 8, top - 9, "Tally", 16, INK, LAB + ' font-weight="800"');
  if(freq) s += t(cols[2] + 8, top - 9, "Frequency", 16, INK, LAB + ' font-weight="800"');
  rows.forEach(function(r, i){
    var y = top + i * rh;
    s += t(cols[0] + 8, y + 24, r[0], 17, INK, BODY);
    s += tallyMarks(r[1], cols[1] + 14, y + 7, 22);
    if(freq) s += t((cols[2] + cols[3]) / 2, y + 24, String(r[1]), 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
  });
  var nrows = rows.length + (total ? 1 : 0);
  if(total){
    var y2 = top + rows.length * rh, sum = 0;
    rows.forEach(function(r){ sum += r[1]; });
    s += t(cols[0] + 8, y2 + 24, "Total", 16, INK, LAB + ' font-weight="800"');
    s += t((cols[2] + cols[3]) / 2, y2 + 24, String(sum), 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  }
  for(var r2 = 0; r2 <= nrows; r2++) s += ln(10, top + r2 * rh, 390, top + r2 * rh, INK, r2 === 0 ? 2.5 : 1.5);
  s += ln(10, top - 30, 390, top - 30, INK, 2.5);
  cols.forEach(function(x){ s += ln(x, top - 30, x, top + nrows * rh, INK, 2); });
  s += '</svg>';
  return s;
}

var TALLY_LEARN = tallyTable("How people got to college", "Way", [["Walk", 7], ["Bus", 12], ["Car", 4], ["Bike", 3]], true,
  "Tally chart. Walk 7, Bus 12, Car 4, Bike 3. Total 26.", true);
var TALLY_Q = tallyTable("Favourite takeaway", "Takeaway", [["Pizza", 13], ["Chinese", 9], ["Curry", 11], ["Fish and chips", 6]], false,
  "Tally chart of favourite takeaways: pizza, Chinese, curry, and fish and chips.", false);

/* ---------- pictograms ---------- */
function circleSym(x, y, r, frac, col){
  if(frac >= 1) return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" stroke="' + INK + '" stroke-width="2"/>';
  if(frac === 0.5) return '<path d="M' + x + ' ' + (y - r) + ' A' + r + ' ' + r + ' 0 0 0 ' + x + ' ' + (y + r) + ' Z" fill="' + col + '" stroke="' + INK + '" stroke-width="2"/>';
  /* quarter: top left wedge */
  return '<path d="M' + x + ' ' + y + ' L' + x + ' ' + (y - r) + ' A' + r + ' ' + r + ' 0 0 0 ' + (x - r) + ' ' + y + ' Z" fill="' + col + '" stroke="' + INK + '" stroke-width="2"/>';
}
function bookSym(x, y, frac, col){
  var w = 22, h = 30;
  return '<rect x="' + x + '" y="' + y + '" width="' + (w * frac) + '" height="' + h + '" rx="2" fill="' + col + '" stroke="' + INK + '" stroke-width="2"/>' +
    (frac >= 1 ? ln(x + 5, y + 2, x + 5, y + h - 2, INK, 1.5) : "");
}
function pictogram(title, rows, keyHtml, keyDraw, sym, step, aria){
  var rh = 42, top = 34, W = 400;
  var H = top + rh * rows.length + 54;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">';
  s += t(W / 2, 20, title, 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  rows.forEach(function(r, i){
    var y = top + i * rh;
    s += '<rect x="10" y="' + y + '" width="380" height="' + rh + '" fill="' + (i % 2 ? WHITE : PAPER) + '"/>';
    s += t(20, y + 27, r[0], 16, INK, LAB + ' font-weight="700"');
    var n = r[1], k = 0;
    while(n > 0){
      var f = n >= 1 ? 1 : n;
      s += sym(110 + k * step, y + rh / 2, f);
      n = Math.round((n - f) * 100) / 100; k++;
    }
  });
  s += ln(100, top, 100, top + rh * rows.length, INK, 2);
  s += '<rect x="10" y="' + top + '" width="380" height="' + (rh * rows.length) + '" fill="none" stroke="' + INK + '" stroke-width="2"/>';
  var ky = top + rh * rows.length + 30;
  s += t(20, ky + 6, "Key:", 16, INK, LAB + ' font-weight="800"');
  s += keyDraw(70, ky);
  s += t(100, ky + 6, keyHtml, 16, INK, BODY + ' font-weight="700"');
  s += '</svg>';
  return s;
}
var PICTO_LEARN = pictogram("Ice creams sold", [["Mon", 3.5], ["Tue", 2], ["Wed", 4.25]],
  "stands for 4 ice creams", function(x, y){ return circleSym(x + 8, y, 13, 1, SUN); },
  function(x, y, f){ return circleSym(x + 14, y, 15, f, SUN); }, 38,
  "Pictogram of ice creams sold. Key: one circle stands for 4 ice creams. Monday 3 and a half circles, Tuesday 2 circles, Wednesday 4 and a quarter circles.");
var PICTO_Q = pictogram("Books borrowed from the library", [["Mon", 2.5], ["Tue", 4], ["Wed", 1.5], ["Thu", 3], ["Fri", 5]],
  "stands for 10 books", function(x, y){ return bookSym(x, y - 15, 1, CYAN); },
  function(x, y, f){ return bookSym(x, y - 15, f, CYAN); }, 34,
  "Pictogram of books borrowed. Key: one book stands for 10 books. Monday 2 and a half books, Tuesday 4, Wednesday 1 and a half, Thursday 3, Friday 5.");

/* ---------- bar charts ---------- */
/* series: [{name, col, vals}] ; one series = simple bar chart */
function barChart(o){
  var W = o.W || 400, H = o.H || 290, x0 = 56, y0 = H - (o.series.length > 1 ? 66 : 40), yT = 34, x1 = W - 10;
  var ph = y0 - yT, n = o.cats.length, cw = (x1 - x0) / n;
  function Y(v){ return (y0 - v / o.max * ph).toFixed(1); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + o.aria + '">';
  s += t(W / 2, 20, o.title, 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  for(var v = 0; v <= o.max + 1e-9; v += o.grid){
    var lab = Math.abs(v / o.lab - Math.round(v / o.lab)) < 1e-9;
    s += ln(x0, Y(v), x1, Y(v), lab ? "#b9b8cc" : LINE, 1.2);
    if(lab) s += t(x0 - 8, (+Y(v) + 5).toFixed(1), fmt(v), 14, INK, LAB + ' font-weight="700" text-anchor="end"');
  }
  var m = o.series.length, bw = m > 1 ? Math.min(30, cw * 0.36) : Math.min(46, cw * 0.6);
  o.cats.forEach(function(c, i){
    var cx = x0 + cw * (i + 0.5);
    o.series.forEach(function(se, j){
      var bx = m > 1 ? cx - bw + j * bw : cx - bw / 2;
      var val = se.vals[i];
      s += '<rect x="' + bx.toFixed(1) + '" y="' + Y(val) + '" width="' + bw.toFixed(1) + '" height="' + (val / o.max * ph).toFixed(1) + '" fill="' + se.col + '" stroke="' + INK + '" stroke-width="2"/>';
    });
    s += t(cx.toFixed(1), y0 + 20, c, 14, INK, LAB + ' font-weight="700" text-anchor="middle"');
  });
  s += ln(x0, yT - 6, x0, y0, INK, 2.5) + ln(x0, y0, x1, y0, INK, 2.5);
  s += t(14, (yT + y0) / 2, o.ylab, 14, INK, LAB + ' font-weight="700" text-anchor="middle" transform="rotate(-90 14 ' + ((yT + y0) / 2) + ')"');
  if(m > 1){
    var ky = H - 16, kx = W / 2 - 110;
    o.series.forEach(function(se, j){
      var x = kx + j * 120;
      s += '<rect x="' + x + '" y="' + (ky - 13) + '" width="18" height="16" fill="' + se.col + '" stroke="' + INK + '" stroke-width="2"/>';
      s += t(x + 26, ky, se.name, 15, INK, BODY + ' font-weight="700"');
    });
  }
  s += '</svg>';
  return s;
}
var DUAL_LEARN = barChart({ title: "Hot drinks sold at a caf&eacute;", cats: ["Mon", "Tue", "Wed", "Thu"], max: 20, grid: 2, lab: 4, ylab: "Cups sold",
  series: [{ name: "Tea", col: CYAN, vals: [12, 18, 10, 14] }, { name: "Coffee", col: SUN, vals: [16, 14, 8, 20] }],
  aria: "Dual bar chart of cups sold. Tea: Monday 12, Tuesday 18, Wednesday 10, Thursday 14. Coffee: Monday 16, Tuesday 14, Wednesday 8, Thursday 20." });
var DUAL_Q = barChart({ title: "Books sold by a bookshop", cats: ["Jan", "Feb", "Mar", "Apr"], max: 50, grid: 5, lab: 10, ylab: "Books sold",
  series: [{ name: "In the shop", col: VIOLET, vals: [30, 45, 25, 40] }, { name: "Online", col: MINT, vals: [35, 30, 50, 45] }],
  aria: "Dual bar chart of books sold in the shop and online, January to April. The scale goes up in 10s with a line every 5." });

/* ---------- line graphs ---------- */
function lineGraph(o){
  var W = 400, H = 290, x0 = 56, y0 = 240, yT = 34, x1 = 386;
  var ph = y0 - yT, n = o.xs.length, dx = (x1 - x0 - 20) / (n - 1);
  function Y(v){ return (y0 - (v - o.min) / (o.max - o.min) * ph).toFixed(1); }
  function X(i){ return (x0 + 10 + i * dx).toFixed(1); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + o.aria + '">';
  s += t(W / 2, 20, o.title, 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  for(var v = o.min; v <= o.max + 1e-9; v += o.grid){
    var lab = Math.abs(v / o.lab - Math.round(v / o.lab)) < 1e-9;
    s += ln(x0, Y(v), x1, Y(v), lab ? "#b9b8cc" : LINE, 1.2);
    if(lab) s += t(x0 - 8, (+Y(v) + 5).toFixed(1), fmt(v), 14, INK, LAB + ' font-weight="700" text-anchor="end"');
  }
  for(var i = 0; i < n; i++){
    s += ln(X(i), y0, X(i), +y0 + 6, INK, 2);
    s += t(X(i), y0 + 22, o.xs[i], 13, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += ln(x0, yT - 6, x0, y0, INK, 2.5) + ln(x0, y0, x1, y0, INK, 2.5);
  var pts = o.ys.map(function(y, i){ return X(i) + "," + Y(y); }).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="' + o.col + '" stroke-width="3.5" stroke-linejoin="round"/>';
  o.ys.forEach(function(y, i){ s += '<circle cx="' + X(i) + '" cy="' + Y(y) + '" r="4.5" fill="' + o.col + '" stroke="' + INK + '" stroke-width="1.5"/>'; });
  s += t(14, (yT + y0) / 2, o.ylab, 14, INK, LAB + ' font-weight="700" text-anchor="middle" transform="rotate(-90 14 ' + ((yT + y0) / 2) + ')"');
  s += t((x0 + x1) / 2, H - 6, o.xlab, 14, INK, LAB + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
}
var LINE_LEARN = lineGraph({ title: "Temperature in a greenhouse", xs: ["06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00"], ys: [8, 12, 16, 20, 22, 18, 14],
  min: 0, max: 24, grid: 2, lab: 4, col: CORAL, ylab: "Temperature (&deg;C)", xlab: "Time",
  aria: "Line graph of greenhouse temperature: 06:00 8 degrees, 08:00 12, 10:00 16, 12:00 20, 14:00 22, 16:00 18, 18:00 14." });
var LINE_Q = lineGraph({ title: "Monthly gas bill", xs: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"], ys: [95, 90, 75, 55, 45, 35],
  min: 0, max: 100, grid: 5, lab: 10, col: BLUE, ylab: "Bill (&pound;)", xlab: "Month",
  aria: "Line graph of a monthly gas bill from January to June. The scale goes up in 10s with a line every 5." });

/* ---------- mean levelling ---------- */
var MEAN_FIG = (function(){
  var vals = [6, 9, 4, 8, 8], a = 18, y0 = 200, x0 = 60, gap = 64;
  var s = '<svg viewBox="0 0 400 250" role="img" aria-label="Five towers of squares: 6, 9, 4, 8 and 8. A dashed line at 7 shows the mean: if the squares were shared out evenly every tower would be 7 high. The range is 9 take away 4, which is 5.">';
  vals.forEach(function(v, i){
    var x = x0 + i * gap;
    for(var k = 0; k < v; k++){
      s += '<rect x="' + x + '" y="' + (y0 - (k + 1) * a) + '" width="' + (a * 2) + '" height="' + a + '" fill="' + (k >= 7 ? SUN : "#9fe5dd") + '" stroke="' + INK + '" stroke-width="1.5"/>';
    }
    s += t(x + a, y0 + 22, String(v), 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  });
  s += ln(x0 - 14, y0 - 7 * a, x0 + 4 * gap + 2 * a + 14, y0 - 7 * a, CORAL, 3, ' stroke-dasharray="8 5"');
  s += t(x0 - 18, y0 - 7 * a + 5, "7", 17, CORAL, LAB + ' font-weight="800" text-anchor="end"');
  s += t(200, 22, "Mean: 35 &divide; 5 = 7", 17, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(200, 246, "Range: 9 &minus; 4 = 5", 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* ---------- probability scale ---------- */
var PSCALE = (function(){
  var x0 = 30, x1 = 370, y = 110;
  function X(p){ return x0 + p * (x1 - x0); }
  var s = '<svg viewBox="0 0 400 190" role="img" aria-label="Probability scale from 0, impossible, through unlikely, even chance at one half, likely, to 1, certain. An arrow at 0.3 shows the chance of picking a red counter from 3 red and 7 blue.">';
  s += '<rect x="' + x0 + '" y="' + (y - 6) + '" width="' + (x1 - x0) + '" height="12" rx="6" fill="#e7f8f6" stroke="' + INK + '" stroke-width="2"/>';
  [[0, "0"], [0.5, "&frac12;"], [1, "1"]].forEach(function(p){
    s += ln(X(p[0]), y - 14, X(p[0]), y + 14, INK, 3);
    s += t(X(p[0]), y + 36, p[1], 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  });
  s += t(X(0) - 6, y - 22, "impossible", 16, INK, BODY + ' font-weight="700" text-anchor="start"');
  s += t(X(0.25), y - 52, "unlikely", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(X(0.5), y - 22, "even chance", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(X(0.75), y - 52, "likely", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(X(1) + 6, y - 22, "certain", 16, INK, BODY + ' font-weight="700" text-anchor="end"');
  s += '<path d="M' + (X(0) + 4) + ' ' + (y - 40) + ' H' + (X(0.5) - 4) + '" stroke="' + TINT + '" stroke-width="1.5" stroke-dasharray="4 4"/>';
  s += '<path d="M' + (X(0.5) + 4) + ' ' + (y - 40) + ' H' + (X(1) - 4) + '" stroke="' + TINT + '" stroke-width="1.5" stroke-dasharray="4 4"/>';
  s += '<path d="M' + X(0.3) + ' ' + (y + 52) + ' V' + (y + 12) + '" stroke="' + CORAL + '" stroke-width="3"/><path d="M' + (X(0.3) - 7) + ' ' + (y + 22) + ' L' + X(0.3) + ' ' + (y + 11) + ' L' + (X(0.3) + 7) + ' ' + (y + 22) + '" fill="none" stroke="' + CORAL + '" stroke-width="3"/>';
  s += t(X(0.3), y + 72, "P(red) = 3/10", 16, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* ---------- spinner: 8 equal parts ---------- */
var SPINNER = (function(){
  var cx = 200, cy = 112, r = 96;
  var cols = [["G", MINT], ["Y", SUN], ["G", MINT], ["R", CORAL], ["B", CYAN], ["G", MINT], ["Y", SUN], ["B", CYAN]];
  var s = '<svg viewBox="0 0 400 226" role="img" aria-label="A spinner with 8 equal sections: 3 green, 2 yellow, 1 red and 2 blue.">';
  for(var k = 0; k < 8; k++){
    var a1 = k * 45 * Math.PI / 180, a2 = (k + 1) * 45 * Math.PI / 180, am = (a1 + a2) / 2;
    var p1 = [cx + r * Math.sin(a1), cy - r * Math.cos(a1)], p2 = [cx + r * Math.sin(a2), cy - r * Math.cos(a2)];
    s += '<path d="M' + cx + ' ' + cy + ' L' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 0 1 ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' Z" fill="' + cols[k][1] + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t((cx + 64 * Math.sin(am)).toFixed(1), (cy - 64 * Math.cos(am) + 6).toFixed(1), cols[k][0], 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
  }
  s += '<path d="M' + cx + ' ' + cy + ' L' + (cx + 10) + ' ' + (cy - 44) + '" stroke="' + INK + '" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + INK + '"/>';
  s += t(392, 200, "G green", 14, INK, BODY + ' text-anchor="end"') + t(392, 218, "Y yellow  R red  B blue", 14, INK, BODY + ' text-anchor="end" xml:space="preserve"');
  s += '</svg>';
  return s;
})();

/* ---------- tables ---------- */
var GYM =
'<table class="datatable"><tr><th>Gym prices</th><th>Monthly</th><th>Yearly</th></tr>' +
'<tr><td>Adult</td><td>&pound;28.50</td><td>&pound;300</td></tr>' +
'<tr><td>Student</td><td>&pound;19.00</td><td>&pound;200</td></tr>' +
'<tr><td>Junior</td><td>&pound;12.00</td><td>&pound;120</td></tr></table>';

/* ---------- bar chart builder widget ---------- */
var BB = [
  { title: "Snacks sold at the interval", cats: ["Crisps", "Popcorn", "Ice cream", "Sweets"], vals: [7, 11, 5, 9],
    max: 12, grid: 1, lab: 2, step: 1, tally: true,

function mountBuilder(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  if(!d.vals || d.vals.length !== 4) d.vals = [0, 0, 0, 0];
  if(typeof d.sel !== "number") d.sel = 0;
  var view = d.c;
  var G = { W: 360, H: 270, x0: 50, y0: 230, yT: 20, x1: 350 };

  el.innerHTML =
    '<div class="wpanel bb-task" data-r="task"></div>' +
    '<div class="bb-src" data-r="src"></div>' +
    '<div class="bb-chart" data-r="chart"></div>' +
    '<div class="wrow bb-adj">' +
      '<button class="btn btn-quiet" type="button" data-r="down" aria-label="Make the chosen bar lower">&minus;</button>' +
      '<span class="bb-sel" data-r="sel"></span>' +
      '<button class="btn btn-quiet" type="button" data-r="up" aria-label="Make the chosen bar higher">+</button>' +
    '</div>' +
    '<div class="wrow">' +
      '<button class="btn" type="button" data-r="check">Check my chart</button>' +
      '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
    '</div>' +
    '<div class="fb bb-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  function R(){ return BB[Math.min(view, 2)]; }

  function source(){
    var c = R();
    if(c.tally) return tallyTable(c.title, "Item", c.cats.map(function(n, i){ return [n, c.vals[i]]; }), false, "Tally chart: " + c.title + ".", false);
    var s = '<table class="datatable"><tr><th>Day</th>' + c.cats.map(function(n){ return "<th>" + n + "</th>"; }).join("") + '</tr>' +
      '<tr><th>Swimmers</th>' + c.vals.map(function(v){ return "<td>" + v + "</td>"; }).join("") + '</tr></table>';
    return s;
  }
  function Y(v, c){ return G.y0 - v / c.max * (G.y0 - G.yT); }
  function chart(){
    var c = R(), n = 4, cw = (G.x1 - G.x0) / n, bw = 46;
    var s = '<svg viewBox="0 0 ' + G.W + ' ' + G.H + '" role="img" aria-label="Your bar chart. Tap in a column to set the height of that bar.">';
    s += '<rect x="0" y="0" width="' + G.W + '" height="' + G.H + '" fill="' + WHITE + '"/>';
    for(var v = 0; v <= c.max + 1e-9; v += c.grid){
      var lab = Math.abs(v / c.lab - Math.round(v / c.lab)) < 1e-9;
      s += ln(G.x0, Y(v, c).toFixed(1), G.x1, Y(v, c).toFixed(1), lab ? "#b9b8cc" : LINE, 1.2);
      if(lab) s += t(G.x0 - 8, (Y(v, c) + 5).toFixed(1), String(v), 14, INK, LAB + ' font-weight="700" text-anchor="end"');
    }
    for(var i = 0; i < n; i++){
      var cx = G.x0 + cw * (i + 0.5), val = d.vals[i], sel = i === d.sel;
      if(sel) s += '<rect x="' + (G.x0 + cw * i + 2).toFixed(1) + '" y="' + G.yT + '" width="' + (cw - 4).toFixed(1) + '" height="' + (G.y0 - G.yT) + '" fill="rgba(255,210,63,.18)"/>';
      if(val > 0) s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + Y(val, c).toFixed(1) + '" width="' + bw + '" height="' + (G.y0 - Y(val, c)).toFixed(1) + '" fill="' + (sel ? BLUE : CYAN) + '" stroke="' + INK + '" stroke-width="2.5"/>';
      s += t(cx.toFixed(1), G.y0 + 22, c.cats[i], 14, INK, LAB + ' font-weight="' + (sel ? 800 : 600) + '" text-anchor="middle"');
    }
    s += ln(G.x0, G.yT - 4, G.x0, G.y0, INK, 2.5) + ln(G.x0, G.y0, G.x1, G.y0, INK, 2.5);
    var my = (G.yT + G.y0) / 2;
    s += t(12, my, "Frequency", 14, INK, LAB + ' font-weight="700" text-anchor="middle" transform="rotate(-90 12 ' + my + ')"');
    s += '</svg>';
    return s;
  }
  function task(){
    var dots = '<div class="bb-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 3) return dots + '<p><b>Free play.</b> All three charts built. Move the bars around if you like: the last chart stays here.</p>';
    return dots + '<p class="tiny" style="margin:0 0 4px">Chart ' + (view + 1) + ' of 3</p><p>' + BB[view].task + '</p>';
  }
  function draw(){
    q("task").innerHTML = task();
    q("src").innerHTML = source();
    q("chart").innerHTML = chart();
    q("sel").innerHTML = R().cats[d.sel];
    var waiting = view !== d.c || d.c >= 3;
    q("check").classList.toggle("hidden", d.c >= 3);
    q("check").disabled = waiting;
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }
  function fb(cls, html){ var f = q("fb"); f.className = "fb bb-fb " + cls; f.innerHTML = html; }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function locked(){ return view !== d.c && d.c < 3; }
  function setVal(i, v){
    var c = R();
    d.vals[i] = Math.max(0, Math.min(c.max, Math.round(v / c.step) * c.step));
  }
  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here is the finished chart.</b> " : "<b>Yes, every bar is right.</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All three charts built. Check the scale before you draw or read any bar: 1s, 2s, 5s or 10s.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next chart</button>';
    fb(how === "shown" ? "show" : "good", head + BB[k].why + more);
    q("next").onclick = function(){
      view = d.c;
      if(d.c < 3) d.vals = [0, 0, 0, 0];
      d.sel = 0; api.save();
      q("fb").className = "fb bb-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }

  q("chart").addEventListener("click", function(e){
    if(locked()) return;
    var svg = q("chart").querySelector("svg");
    var m = svg.getScreenCTM();
    if(!m) return;
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(m.inverse());
    if(p.x < G.x0 || p.x > G.x1) return;
    var i = Math.min(3, Math.floor((p.x - G.x0) / ((G.x1 - G.x0) / 4)));
    var c = R();
    d.sel = i;
    var v = (G.y0 - Math.min(G.y0, Math.max(G.yT, p.y))) / (G.y0 - G.yT) * c.max;
    setVal(i, v);
    api.save(); draw();
  });
  q("down").onclick = function(){ if(locked()) return; setVal(d.sel, d.vals[d.sel] - R().step); api.save(); draw(); };
  q("up").onclick = function(){ if(locked()) return; setVal(d.sel, d.vals[d.sel] + R().step); api.save(); draw(); };
  q("check").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    var c = BB[view], wrong = [];
    c.vals.forEach(function(v, i){ if(d.vals[i] !== v) wrong.push(c.cats[i]); });
    if(!wrong.length){ solved(view, "right"); return; }
    d.miss[view]++; api.save();
    var names = wrong.length === 1 ? wrong[0] : wrong.slice(0, -1).join(", ") + " and " + wrong[wrong.length - 1];
    fb("nudge", "<b>Not quite yet.</b> " + (4 - wrong.length) + " of 4 bars are right. Have another look at " + names + ". " + c.tip);
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    d.shown[view] = true;
    d.vals = BB[view].vals.slice();
    solved(view, "shown");
  };
  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three charts built.</b> Check the scale before you draw or read any bar.");
    api.done(d.result);
  }
}
