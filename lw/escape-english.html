<style>
/* Things found around the theatre: a poster, an email, a leaflet, a draft */
.doc{border-radius:8px;padding:12px 16px;margin:0 0 12px;text-align:left;font-size:1rem;line-height:1.6;border:2px solid var(--line);box-shadow:0 3px 0 rgba(20,26,51,.12);color:var(--ink)}
.doc p{margin:0 0 8px}
.doc ul{margin:0 0 8px;padding-left:20px}
.doc li{margin-bottom:4px}
.doc .who{display:block;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#6b6450;margin-bottom:8px}
.doc h4{margin:2px 0 6px;font-size:1.35rem;line-height:1.15}
.doc.poster{background:#fff3d6;border-color:#e0a612;text-align:center}
.doc.poster ul{text-align:left;display:inline-block;margin:6px auto 10px}
.doc.poster h4{font-family:var(--marquee);font-weight:400;letter-spacing:.04em;font-size:2rem;color:#7a1f3d}
.doc.poster .small{font-size:.9rem}
.doc.email{background:#ffffff;font-family:"Atkinson Hyperlegible",Verdana,sans-serif}
.doc.email .head{border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:10px;font-size:.92rem}
.doc.email .head div{margin:0 0 2px}
.doc.leaflet{background:#e9f9f6;border-color:#2ed3c6}
.doc.leaflet h4{color:#0f5f58}
.doc.leaflet .quote{font-style:italic;border-left:4px solid #2ed3c6;padding-left:10px}
.doc.draft{background:#ffffff;font-family:"Courier New",Courier,monospace;font-size:.95rem;transform:rotate(.4deg)}
.scene{font-size:1.06rem;line-height:1.75}
</style>

<body class="subj-eng">

<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Escape the theatre</h2>
    <span>English. An escape room: read posters, emails and leaflets, fix some writing, and find your way out of a dark theatre after the last rehearsal.</span>
  </div>
  <div id="egwApp"></div>
</div>

<footer>
  <div class="wrap">
    <span>LW's Skills HQ &middot; part of Base 5, Chilton Bridge School</span>

  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=14"></script>
<script>
(function(){
"use strict";

/* Every text on this page is original, written for it. */

var POSTER =
'<div class="doc poster">' +
'<span class="who">Poster in the box office window</span>' +
'<p class="small">The Lantern Theatre presents</p>' +
'<h4>Moonlight on the Pier</h4>' +
'<p class="small">A brand new musical by the Harbour Youth Company</p>' +
'<ul>' +
'<li><b>When:</b> Thursday 19 to Saturday 21 November</li>' +
'<li><b>Times:</b> evenings at 7.30pm, plus a Saturday matinee at 2pm</li>' +
'<li><b>Tickets:</b> adults &pound;12, under 16s &pound;8, family ticket (2 adults and 2 children) &pound;35</li>' +
'<li><b>Running time:</b> about 2 hours, including a 20 minute interval</li>' +
'</ul>' +
'<p>Doors open 30 minutes before every show.</p>' +
'<p>Book at the box office (10am to 6pm, Monday to Saturday) or by phone.</p>' +
'<p class="small">Wheelchair spaces are available. Please tell us when you book.</p>' +
'</div>';

var EMAIL =
'<div class="doc email">' +
'<span class="who">Email, printed and stuck to the mirror</span>' +
'<div class="head"><div><b>From:</b> Priya Shah (Director)</div><div><b>To:</b> All cast</div><div><b>Subject:</b> Notes for Thursday</div></div>' +
'<p>Hi everyone,</p>' +
'<p>What a rehearsal! The pier scene was the best it has ever been.</p>' +
'<p>A few things before Thursday:</p>' +
'<ul><li>Please arrive by 6pm for hair and make up.</li><li>Costumes stay in the dressing room. Please do not take them home.</li><li>Phones go in the box by the stage door during the show.</li></ul>' +
'<p>The theatre has sold 340 tickets so far, so expect a big crowd. I think this is the best show we have ever done, and it is going to be a fantastic night.</p>' +
'<p>Get some rest and drink plenty of water. See you on Thursday!</p>' +
'<p>Priya</p>' +
'</div>';

var LEAFLET =
'<div class="doc leaflet">' +
'<span class="who">Leaflet pinned to the costume rail</span>' +
'<h4>Can you sew on a button? We need YOU!</h4>' +
'<p>Our costume team makes every outfit you see on stage, from pirate hats to ball gowns. Our wardrobe is bursting at the seams, and we need more helpers before the spring show.</p>' +
'<ul><li>No experience needed: we will teach you</li><li>Free tea, biscuits and theatre tickets</li><li>Just two hours a week</li></ul>' +
'<p>Last year, 18 volunteers made over 200 costumes. Imagine seeing your work under the spotlight!</p>' +
'<p class="quote">"I joined to fix one hem. Three years later I am still here, and I love it." (Dot, volunteer)</p>' +
'<p><b>Drop in on Tuesdays, 6pm to 8pm, at the stage door.</b></p>' +
'</div>';

var DRAFT =
'<div class="doc draft">' +
'<span class="who">Sticky note on the lighting desk</span>' +
'<p>email ms okafor!! their are to many cables on the floor and the spotlight dont work. ask for new one</p>' +
'<p>Sam</p>' +
'</div>';

EGW.run({
  id: "escape-english",
  title: "Escape the theatre",
  subject: "English",
  mins: 35,
  blurb: "An escape room in a dark theatre after the last rehearsal: four rooms of Level 1 reading and writing, one digit in each.",
  escape: {
    digits: ["4", "7", "2", "9"],
    intro: '<p>The last rehearsal of <i>Moonlight on the Pier</i> runs late. You nip back for your hoodie, and when you come out the theatre is dark and very quiet. The caretaker has gone home. The stage door has a padlock with four dials. Oops.</p>' +
           '<p>Taped to the door is a note: <i>Whoever finds this: each room hides one digit. Read carefully and you will be out in no time. There are biscuits in the box office.</i></p>',
    outro: '<p>The last dial turns, the padlock clicks, and the stage door swings open onto the cool night air. Across the road, the lights on the pier are twinkling like they are taking a bow.</p>' +
           '<p>You found information fast, worked out purpose and audience, told fact from opinion, spotted persuasive tricks and fixed a formal email. That is a big slice of the Level 1 reading and writing papers, done in one evening.</p>'
  },
  steps: [

  /* ---------- ROOM 1: BOX OFFICE ---------- */
  { type: "learn", topic: "Box office",
    title: "Room 1: the box office",
    html: '<div class="extract scene" style="max-height:none"><p>The box office is a little glass booth by the front doors. There is a ticket machine, a tin of biscuits (as promised) and a bright poster in the window.</p></div>' +
          '<p>The first lock has a sign on it: <i>Know the show.</i></p>' +
          '<div class="keep"><b>Keep this</b><b>Scan</b> for one detail: run your eyes down the text looking for a key word, like a time or a price. Headings, bold labels and bullet points are there to help you find things fast.</div>' },

  { type: "mc", topic: "Box office",
    q: "You want to see the Saturday matinee. What time do the doors open for it?",
    fig: POSTER,
    options: ["1.30pm", "2pm", "2.30pm", "7pm"],
    answer: 0, fixed: true,
    hint: "Find the matinee time first. Then look for a line about the doors.",
    why: "The matinee starts at 2pm, and the poster says \"Doors open 30 minutes before every show\". 30 minutes before 2pm is <b>1.30pm</b>. This question needs two details put together: 2pm on its own is the start time, not the doors time." },

  { type: "multi", topic: "Box office",
    q: "Choose the <b>three</b> things that are true, according to the poster.",
    fig: POSTER,
    options: [
      "An under 16 ticket costs &pound;8.",
      "The show lasts about two hours.",
      "You can book tickets by phone.",
      "The box office is open on Sundays.",
      "The interval is 30 minutes long.",
      "A family ticket is for 2 adults and 3 children."
    ],
    answers: [0, 1, 2],
    hint: "For each one, put your finger on the exact words in the poster. If you cannot find them, leave it out.",
    why: "The poster gives under 16s at &pound;8, a running time of about 2 hours, and \"Book at the box office ... or by phone\". The box office opens Monday to Saturday, so not Sundays. The interval is 20 minutes (the 30 minutes is the doors). The family ticket covers 2 adults and 2 children. Mixing up two numbers that sit close together is the classic trap." },

  { type: "mc", topic: "Box office",
    q: "Who is the poster mainly written for?",
    fig: POSTER,
    options: [
      "People who might come to watch the show",
      "The actors, so they know when to arrive",
      "The caretaker, so he knows when to lock up",
      "People who want to join the youth company"
    ],
    answer: 0,
    hint: "Think about what the poster tells you: prices, times, how to book. Who needs those?",
    why: "Ticket prices, show times, how to book and wheelchair spaces are all things an <b>audience</b> needs. The actors would need different details, like when to arrive for make up. Working out who a text is for is a question you will almost certainly meet in the reading paper." },

  { type: "mc", topic: "Box office",
    q: "Why does the poster put the main details in a bullet point list with bold labels (When, Times, Tickets)?",
    fig: POSTER,
    options: [
      "So readers can find the key details quickly",
      "To make the poster look longer",
      "Because posters always have to be written as lists",
      "To show which details are opinions"
    ],
    answer: 0,
    hint: "Imagine glancing at this poster as you walk past. What do the bold labels let you do?",
    why: "Bullet points break the information into small pieces, and the bold labels work like mini headings, so a reader can <b>scan</b> straight to the price or the time. In the exam, say what the feature is <i>and</i> how it helps the reader: \"The bold labels help readers find the times quickly.\"" },

  /* ---------- ROOM 2: DRESSING ROOM ---------- */
  { type: "learn", topic: "Dressing room",
    title: "Room 2: the dressing room",
    html: '<div class="extract scene" style="max-height:none"><p>A long mirror ringed with round bulbs. A rail of costumes. Someone has left a sparkly hat on a chair and a half eaten sandwich on the shelf. Stuck to the mirror is a printed email from the director.</p></div>' +
          '<p>The lock on the costume cupboard asks: <i>What is it for, and is it true?</i></p>' +
          '<div class="keep"><b>Keep this</b>A <b>fact</b> can be checked and proved. An <b>opinion</b> is what someone thinks or feels; words like <i>best</i>, <i>fantastic</i> and <i>I think</i> are clues. The <b>purpose</b> is the job a text does: to inform, persuade, instruct or describe.</div>' },

  { type: "mc", topic: "Dressing room",
    q: "What is the main purpose of Priya's email?",
    fig: EMAIL,
    options: [
      "To give the cast information and instructions before the first show",
      "To persuade people to buy tickets for the show",
      "To complain about how the rehearsal went",
      "To describe what the theatre looks like"
    ],
    answer: 0,
    hint: "Look at the middle of the email. What does Priya want the cast to know or do?",
    why: "Most of the email is instructions (arrive by 6pm, leave costumes, phones in the box) plus information (340 tickets sold). It is sent to the cast, who are already in the show, so it is not selling tickets. And Priya is pleased with the rehearsal, not complaining." },

  { type: "sort", topic: "Dressing room",
    q: "Sort these lines from the email: <b>fact</b> or <b>opinion</b>?",
    fig: EMAIL,
    buckets: ["Fact", "Opinion"],
    cards: [
      ["The theatre has sold 340 tickets so far.", 0],
      ["The box for phones is by the stage door.", 0],
      ["The email was sent to all of the cast.", 0],
      ["The pier scene was the best it has ever been.", 1],
      ["This is the best show we have ever done.", 1],
      ["It is going to be a fantastic night.", 1]
    ],
    hint: "Ask: could someone check this and prove it? If two people could argue about it, it is an opinion.",
    why: "You could count the tickets, look by the stage door, or check who the email went to, so those are facts. \"Best\" and \"fantastic\" are Priya's views: another person might disagree, so they are opinions. Watch out for opinions that sound very confident; being sure of something does not make it a fact." },

  { type: "mc", topic: "Dressing room",
    q: "Which describes the <b>tone</b> of the email best?",
    fig: EMAIL,
    options: [
      "Friendly and encouraging, but clear about what the cast need to do",
      "Angry and strict, like a telling off",
      "Very formal, like a letter to a bank",
      "Sad and worried about the show"
    ],
    answer: 0,
    hint: "Look at how Priya starts and ends, and at the exclamation marks.",
    why: "\"Hi everyone\", \"What a rehearsal!\" and \"See you on Thursday!\" are warm and informal, which suits a team who know each other. The bullet points still make the rules clear. A formal letter would start \"Dear\" and avoid exclamation marks. Matching the tone to the audience is called <b>register</b>." },

  /* ---------- ROOM 3: COSTUME STORE ---------- */
  { type: "learn", topic: "Costume store",
    title: "Room 3: the costume store",
    html: '<div class="extract scene" style="max-height:none"><p>Rails and rails of costumes: pirate coats, a mermaid tail, a whole row of identical sailor hats. A sewing machine sits under a lamp, and a leaflet is pinned to the nearest rail.</p></div>' +
          '<p>The lock here is a little velvet bag with a label: <i>Spot the tricks.</i></p>' +
          '<div class="keep"><b>Keep this</b>Persuasive texts use tricks to win you over: questions to the reader, lists of three, facts with numbers, commands like <i>Imagine</i> or <i>Join</i>, and quotes from real people.</div>' },

  { type: "match", topic: "Costume store",
    q: "Match each part of the leaflet to the persuasive feature it uses.",
    fig: LEAFLET,
    pairs: [
      ["\"Can you sew on a button?\"", "A question to the reader"],
      ["\"Free tea, biscuits and theatre tickets\"", "A list of three"],
      ["\"18 volunteers made over 200 costumes\"", "A fact with numbers"],
      ["\"Imagine seeing your work under the spotlight!\"", "A command"],
      ["\"I joined to fix one hem...\"", "A quote from a real person"]
    ],
    hint: "Look for the question mark, the three things in a row, the numbers, and the line that tells you to do something.",
    why: "\"Imagine\" tells the reader to do something, so it is a command (an imperative). The numbers make the team sound successful, the question pulls the reader in, and the list of three makes the offer sound generous. Naming a feature is a start; the marks come from saying how it persuades." },

  { type: "mc", topic: "Costume store",
    q: "The leaflet says: \"Our wardrobe is <b>bursting at the seams</b>.\" What does this mean here?",
    fig: LEAFLET,
    options: [
      "The costume store is very full",
      "The wardrobe cupboard is broken",
      "All the costumes are torn",
      "The costume team is very angry"
    ],
    answer: 0,
    hint: "In a theatre, the wardrobe means the costume department. What would make a store burst?",
    why: "\"Bursting at the seams\" is a saying that means <b>very full</b>, like clothes so stuffed they might split. It is a clever choice here because seams are part of sewing too. When you meet a phrase you do not know, use the words around it: the very next part says they need more helpers." },

  { type: "mc", topic: "Costume store",
    q: "Why does the writer include what Dot says?",
    fig: LEAFLET,
    options: [
      "To show that a real volunteer enjoys it, so readers trust the leaflet",
      "To give instructions on how to sew a hem",
      "To tell readers what time to drop in",
      "To make the leaflet sound more formal"
    ],
    answer: 0,
    hint: "Who is Dot, and why might a reader believe her more than the writer?",
    why: "Dot is a real volunteer who has stayed three years, so her words act as <b>evidence</b> that people enjoy it. Readers often trust someone like them more than the organisation asking for help. That is why adverts love a happy customer quote." },

  /* ---------- ROOM 4: LIGHTING BOX ---------- */
  { type: "learn", topic: "Lighting box",
    title: "Room 4: the lighting box",
    html: '<div class="extract scene" style="max-height:none"><p>Up a narrow ladder, the lighting box looks down over the empty stage. A desk full of sliders and buttons glows faintly. Stuck to it is a scribbled note from Sam, the lighting technician.</p></div>' +
          DRAFT +
          '<p>Sam never sent the email. The last lock says: <i>Write it properly.</i></p>' +
          '<div class="keep"><b>Keep this</b>A formal email has a greeting (<i>Dear Ms Okafor</i>), a clear reason for writing, paragraphs, a polite request and a sign off. Check capitals, full stops and homophones: <i>there/their/they&rsquo;re</i>, <i>to/too/two</i>, <i>your/you&rsquo;re</i>.</div>' },

  { type: "mc", topic: "Lighting box",
    q: "Sam's note says: <i>their are to many cables on the floor and the spotlight dont work</i>. Which version is written correctly?",
    options: [
      "There are too many cables on the floor, and the spotlight doesn't work.",
      "Their are too many cables on the floor, and the spotlight doesn't work.",
      "There are to many cables on the floor, and the spotlight doesn't work.",
      "There are too many cables on the floor, and the spotlight dont work."
    ],
    answer: 0,
    hint: "Check three things in each: there or their, to or too, and dont or doesn't.",
    why: "<b>There</b> is for places and \"there are\"; <b>their</b> means belonging to them. <b>Too</b> means more than enough; <b>to</b> is for direction or before a verb. And \"the spotlight\" is one thing, so it <b>doesn't</b> (does not) work, with an apostrophe where the o is missing. Each wrong version has just one slip, which is why it pays to check one thing at a time." },

  { type: "sort", topic: "Lighting box",
    q: "Sam has more lines for the email. Which are <b>correct</b>, and which <b>need fixing</b>?",
    buckets: ["Correct", "Needs fixing"],
    cards: [
      ["The director&rsquo;s notes are on the desk.", 0],
      ["We need bulbs, cables, tape and batteries.", 0],
      ["You&rsquo;re welcome to come and see the problem.", 0],
      ["The lights was too bright in the last scene.", 1],
      ["Your going to love the new spotlight.", 1],
      ["The show start&rsquo;s at 7.30pm.", 1]
    ],
    hint: "Read each one aloud. Does the verb match? Is each apostrophe showing belonging or a missing letter?",
    why: "The notes belong to the director, so <b>director's</b> is right. Commas separate the items in a list. <b>You're</b> means you are. \"The lights <b>were</b>\" (more than one light). \"<b>You're</b> going to love\" means you are. And \"starts\" is just a verb, so it has no apostrophe. Small slips (outrageous ones, Jay would say), but they add up in the 12 marks for spelling, punctuation and grammar." },

  { type: "mc", topic: "Lighting box",
    q: "Sam is writing to the theatre manager, Ms Okafor. Which opening suits a <b>formal</b> email best?",
    options: [
      "Dear Ms Okafor, I am writing to ask whether the theatre could buy a new spotlight.",
      "Hiya!! The spotlight is totally busted lol, can u sort it?",
      "Hey Okafor, we need a new light. Get one.",
      "To whoever reads this, the light is broke."
    ],
    answer: 0,
    hint: "Think about who Ms Okafor is. How would you write to a manager you want a yes from?",
    why: "It uses a proper greeting, full sentences, no slang and a polite reason for writing. The others use text speak, sound rude or bossy, or have grammar slips (\"is broke\" should be \"is broken\"). In the writing paper, a big chunk of the marks is for getting the format and register right for the reader." },

  { type: "order", topic: "Lighting box", stretch: true,
    q: "Put Sam's finished email in a sensible order.",
    items: [
      "Dear Ms Okafor,",
      "I am writing to ask whether the theatre could buy a new spotlight for the main stage.",
      "During the final rehearsal, the main spotlight flickered and then stopped working.",
      "A new spotlight would cost about &pound;150, and it would light the actors safely for every show.",
      "I would be grateful if you could reply by Friday.",
      "Yours sincerely, Sam Reed"
    ],
    hint: "Greeting first and sign off last. In between: why you are writing, what happened, why it matters, then what you would like.",
    why: "Greeting, reason for writing, the problem, why the fix is worth it, a polite request, then the sign off. When you start with a name (Dear Ms Okafor), end with <b>Yours sincerely</b>. This shape works for most formal emails and letters: complaints, requests and applications." },

  /* ---------- THE FINAL DOOR ---------- */
  { type: "unlock", topic: "The final door",
    q: "<p>Back at the stage door, there is a label on the padlock in neat capitals: <i>STAGE MANAGER'S RULE: EVERYTHING IS FILED FROM A TO Z.</i></p>" +
       "<p>Underneath, in smaller writing: <i>That means the rooms too.</i></p>" +
       "<p>Here are the rooms you have been through, with their digits.</p>",
    code: "4279",
    hint: "Put the room names in alphabetical order, like words in a dictionary. The first letter of each name is all you need.",
    why: "From A to Z: <b>B</b>ox office (4), <b>C</b>ostume store (2), <b>D</b>ressing room (7), <b>L</b>ighting box (9). So the code is <b>4279</b>. Alphabetical order is a real reading skill too: it is how dictionaries, indexes and contact lists are organised." }
  ]
});
})();
</script>
