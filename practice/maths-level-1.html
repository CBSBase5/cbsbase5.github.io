var QS = ITEMS.filter(function(x){return !x.learn;});
var TOTAL = QS.reduce(function(a,q){return a+q.marks;},0);
var JAYMARKS = QS.filter(function(q){return q.forJay;}).reduce(function(a,q){return a+q.marks;},0);

/* ---------- state ---------- */
var S;
function fresh(){return {v:1, ini:"", mode:"practice", started:false, done:false, idx:0, a:{}, t0:0, t1:0};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1)return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
S = load() || fresh();
function st(q){if(!S.a[q.n])S.a[q.n]={val:null,work:"",marks:0,checked:false,locked:false,revealed:false,tries:0,help:{},box:null};return S.a[q.n];}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cleanNum(s){
  s=String(s==null?"":s).replace(/[\u00a3,\s]/g,"").replace(/[a-zA-Z%]/g,"");
  if(s==="")return null;
  var v=parseFloat(s);
  return isNaN(v)?null:v;
}
function near(v,target,tol){return v!==null&&Math.abs(v-target)<=(tol||0.0005);}
function boxRight(b,raw){
  var v=cleanNum(raw);
  if(v===null)return false;
  var list=(b.accept||[]).concat(b.alt||[]);
  for(var i=0;i<list.length;i++){if(near(v,list[i],b.tol))return true;}
  return false;
}
function answered(q){
  var s=S.a[q.n];if(!s||s.val==null)return false;
  if(q.type==="pick")return s.val>-1;
  if(q.type==="net")return s.val.length>0;
  if(q.type==="lines")return s.val.length>0;
  if(q.type==="chart")return s.val.bars.some(function(b){return b>0;});
  if(q.type==="decide")return s.val.choice>-1||s.val.boxes.some(function(x){return String(x).trim()!=="";});
  if(q.type==="text")return String(s.val).trim()!=="";
  if(q.type==="fraction")return String(s.val[0]).trim()!==""||String(s.val[1]).trim()!=="";
  if(q.type==="pair")return s.val.some(function(x){return String(x).trim()!=="";});
  return String(s.val).trim()!=="";
}

/* ---------- marking ---------- */
function markQ(q,val){
  var m=0, box=null;
  if(q.type==="num"){ m = boxRight({accept:q.accept, alt:q.alt, tol:q.tol}, val) ? q.marks : 0; }
  else if(q.type==="text"){ m = q.re.test(String(val||"").replace(/[.,]/g," ")) ? q.marks : 0; }
  else if(q.type==="pick"){ m = (val===q.ans) ? q.marks : 0; }
  else if(q.type==="pair"||q.type==="fraction"){
    if(q.type==="fraction"){
      var n=cleanNum(val[0]), d=cleanNum(val[1]);
      var ok = (n!==null&&d!==null&&d!==0&&Math.abs(n/d - q.ansNum/q.ansDen)<0.0005);
      box=[ok,ok]; m = ok ? q.marks : 0;
    } else {
      box=q.boxes.map(function(b,i){return boxRight(b,val[i]);});
      m = box.every(Boolean) ? q.marks : 0;
    }
  }
  else if(q.type==="decide"){
    var cOK = val.choice===q.ans;
    box=q.boxes.map(function(b,i){return boxRight(b,val.boxes[i]);});
    if(cOK&&box.every(Boolean)) m=q.marks;
    else if(cOK||box.some(Boolean)) m=1;
    else m=0;
  }
  else if(q.type==="lines"){
    var good=val.filter(function(i){return i<3;}).length, bad=val.filter(function(i){return i>=3;}).length;
    m = (good>0&&bad===0) ? q.marks : 0;
  }
  else if(q.type==="chart"){
    var want=[10,64,18,8], sc=val.scale, pts=0;
    if(sc===5||sc===10)pts++;
    var lab=(String(val.ylab||"").toLowerCase().indexOf("people")>-1) && (/time|exercise|week/.test(String(val.xlab||"").toLowerCase()));
    if(lab)pts++;
    var bars=val.bars.every(function(b,i){return Math.abs(b-want[i])<=sc/2+0.01;});
    if(bars)pts++;
    m=pts; box={scale:(sc===5||sc===10), labels:lab, bars:bars};
  }
  else if(q.type==="net"){
    m=0; box={cells:val.length, connected:netConnected(val)};
  }
  return {m:m, box:box};
}

/* net grid is 16 wide by 14 tall */
var NW=16, NH=14;
function netConnected(cells){
  if(!cells.length)return false;
  var set={}; cells.forEach(function(c){set[c]=1;});
  var seen={}, stack=[cells[0]], n=0;
  while(stack.length){
    var c=stack.pop();
    if(seen[c])continue;
    seen[c]=1;n++;
    var x=c%NW, y=Math.floor(c/NW);
    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(function(p){
      if(p[0]<0||p[0]>=NW||p[1]<0||p[1]>=NH)return;
      var id=p[1]*NW+p[0];
      if(set[id]&&!seen[id])stack.push(id);
    });
  }
  return n===cells.length;
}

/* ---------- render ---------- */
var pane=document.getElementById("pane");

function render(){
  if(!S.started){renderStart();return;}
  if(S.done){renderReport();return;}
  var it=ITEMS[S.idx];
  if(S.mode==="test"&&it.learn){step(1,true);return;}
  if(it.learn)renderLearn(it);else renderQ(it);
}

function progressHTML(q){
  var done=QS.filter(answered).length;
  var h='<div class="prog" aria-hidden="true"><i style="width:'+Math.round(done/QS.length*100)+'%"></i></div>'+
    '<p class="progtxt"><span>'+done+' of '+QS.length+' questions answered</span>';
  if(S.mode==="test")h+='<span class="timer" id="timer"></span>';
  h+='</p>';
  return h;
}

function renderStart(){
  var resume = S.idx>0 || Object.keys(S.a).length>0;
  var h='<div class="mcard"><h2>Before you start</h2>'+
    '<p>The whole of Set 9: four questions without a calculator, then eleven with one. You can stop after Section A and come back another day.</p>'+
    '<p>Who is having a go? Optional, and it only goes on what gets sent to Jay.</p><div class="chips" id="inis">';
  STUDENTS.forEach(function(s){h+='<button type="button" class="chipbtn" aria-pressed="'+(S.ini===s)+'" data-ini="'+s+'">'+s+'</button>';});
  h+='<button type="button" class="chipbtn" aria-pressed="'+(S.ini==="")+'" data-ini="">Rather not say</button></div>';
  h+='<p>How do you want to do it?</p><div class="modes">'+
    '<button type="button" class="mode" data-mode="practice" aria-pressed="'+(S.mode==="practice")+'"><b>Practice with help</b>Check each answer as you go. A nudge and a method if you want them, and an explanation every time.</button>'+
    '<button type="button" class="mode" data-mode="test" aria-pressed="'+(S.mode==="test")+'"><b>Test run</b>Closer to the real thing. No help buttons, and you see how it went at the end. The real paper allows 25 minutes then an hour and a half.</button>'+
    '</div>';
  h+='<div class="actions"><div class="l">'+
    (resume?'<button type="button" class="mbtn main" id="go">Carry on where you left off</button><button type="button" class="mbtn" id="restart">Start fresh</button>'
           :'<button type="button" class="mbtn main" id="go">Start</button>')+
    '</div></div><p class="small">Answers and working save on this device as you go.</p></div>';
  pane.innerHTML=h;
  Array.prototype.forEach.call(pane.querySelectorAll("[data-ini]"),function(b){b.onclick=function(){S.ini=b.getAttribute("data-ini");save();renderStart();};});
  Array.prototype.forEach.call(pane.querySelectorAll("[data-mode]"),function(b){b.onclick=function(){S.mode=b.getAttribute("data-mode");save();renderStart();};});
  pane.querySelector("#go").onclick=function(){S.started=true;if(!S.t0)S.t0=Date.now();save();render();window.scrollTo(0,0);};
  var r=pane.querySelector("#restart");
  if(r)r.onclick=function(){if(!confirm("Start fresh? The answers saved on this device will go."))return;var ini=S.ini,m=S.mode;S=fresh();S.ini=ini;S.mode=m;save();renderStart();};
}

function renderLearn(it){
  pane.innerHTML=progressHTML()+'<div class="mcard learn"><div class="qhead"><span class="pill y">Learn a bit</span></div>'+
    '<h2>'+it.title+'</h2><div class="learnvis">'+it.vis+'</div>'+it.body+
    '<div class="actions"><div class="l">'+(S.idx>0?'<button type="button" class="mbtn" id="back">Back</button>':'')+
    '</div><div class="r"><button type="button" class="mbtn main" id="next">Got it, next</button></div></div></div>';
  var b=pane.querySelector("#back");if(b)b.onclick=function(){step(-1);};
  pane.querySelector("#next").onclick=function(){step(1);};
  pane.querySelector("#next").focus({preventScroll:true});
}

function step(d,silent){
  var i=S.idx+d;
  if(S.mode==="test"){while(i>=0&&i<ITEMS.length&&ITEMS[i].learn)i+=d;}
  if(i<0)i=0;
  if(i>=ITEMS.length){finish();return;}
  S.idx=i;save();render();
  if(!silent)window.scrollTo(0,0);
}

function renderQ(q){
  var s=st(q), test=S.mode==="test";
  var h=progressHTML(q)+'<div class="mcard"><div class="qhead"><span class="pill">Question '+q.n+'</span>'+
    '<span class="pill o">'+q.marks+' mark'+(q.marks>1?'s':'')+'</span>'+
    '<span class="pill t">Section '+q.sec+(q.sec==="A"?": no calculator":": calculator")+'</span></div>'+
    '<p class="qtext">'+q.q+'</p>'+
    (q.stim?'<div class="stim">'+q.stim+'</div>':'')+
    '<div id="ansArea"></div>'+
    '<details class="work"'+(s.work?' open':'')+'><summary>Working (Jay reads this, nothing marks it here)</summary>'+
    '<textarea id="work" spellcheck="false" placeholder="Your steps. Numbers on their own are fine.">'+esc(s.work)+'</textarea></details>';
  if(!test){
    h+='<div class="helprow">'+
      '<button type="button" class="mbtn help'+(s.help.hint?' used':'')+'" id="hHint">Give me a nudge</button>'+
      '<button type="button" class="mbtn help'+(s.help.method?' used':'')+'" id="hMethod">Show me the method</button>'+
      '</div><div id="helpout">'+
      (s.help.hint?'<div class="helpbox">'+q.hint+'</div>':'')+
      (s.help.method?'<div class="helpbox"><b>One way through it</b>'+q.method+'</div>':'')+'</div>';
  }
  h+='<div id="fb"></div><div class="actions"><div class="l"><button type="button" class="mbtn" id="back">Back</button>'+
     '<button type="button" class="mbtn" id="skip">Skip for now</button></div><div class="r">'+
     (test?'<button type="button" class="mbtn main" id="save2">'+(q===QS[QS.length-1]?'Finish':'Save and next')+'</button>'
          :'<button type="button" class="mbtn main" id="check">Check</button>')+'</div></div></div>';
  pane.innerHTML=h;
  buildAnswer(q);
  var w=pane.querySelector("#work");
  w.oninput=function(){s.work=w.value;save();};
  if(!test){
    pane.querySelector("#hHint").onclick=function(){s.help.hint=1;save();this.classList.add("used");renderHelp(q);};
    pane.querySelector("#hMethod").onclick=function(){s.help.method=1;save();this.classList.add("used");renderHelp(q);};
    pane.querySelector("#check").onclick=function(){doCheck(q);};
    if(s.checked)showFeedback(q);
  } else {
    pane.querySelector("#save2").onclick=function(){step(1);};
    tick();
  }
  pane.querySelector("#back").onclick=function(){step(-1);};
  pane.querySelector("#skip").onclick=function(){step(1);};
}

function renderHelp(q){
  var s=st(q), h="";
  if(s.help.hint)h+='<div class="helpbox">'+q.hint+'</div>';
  if(s.help.method)h+='<div class="helpbox"><b>One way through it</b>'+q.method+'</div>';
  document.getElementById("helpout").innerHTML=h;
}

function numField(id,label,unit,value,cls,disabled){
  return '<div class="boxrow'+(cls||"")+'"><label for="'+id+'">'+label+'</label><div class="inline">'+
    (unit===P?'<span class="unit">'+P+'</span>':'')+
    '<input type="text" id="'+id+'" inputmode="decimal" autocomplete="off" value="'+esc(value)+'"'+(disabled?' disabled':'')+'>'+
    (unit&&unit!==P?'<span class="unit">'+unit+'</span>':'')+'</div></div>';
}

function buildAnswer(q){
  var s=st(q), area=document.getElementById("ansArea"), h="";
  var lock=s.locked;

  if(q.type==="num"){
    if(s.val==null)s.val="";
    var cls=s.checked?(s.marks?" right":" wrong"):"";
    area.innerHTML='<div class="boxes">'+numField("b0","Your answer",q.unit,s.val,cls,lock)+'</div>';
    wireText(area,function(i,v){s.val=v;});
  }
  else if(q.type==="text"){
    if(s.val==null)s.val="";
    area.innerHTML='<div class="boxes"><div class="boxrow'+(s.checked?(s.marks?" right":" wrong"):"")+'"><label for="b0">Your answer</label>'+
      '<input class="wide" type="text" id="b0" autocomplete="off" value="'+esc(s.val)+'"'+(lock?' disabled':'')+'></div></div>';
    wireText(area,function(i,v){s.val=v;});
  }
  else if(q.type==="pair"||q.type==="fraction"){
    if(!s.val)s.val=["",""];
    var labs = q.type==="fraction" ? ["Top number","Bottom number"] : [q.boxes[0].label,q.boxes[1].label];
    h='<div class="boxes">';
    for(var i=0;i<2;i++){
      var c=(s.checked&&s.box)?(s.box[i]?" right":" wrong"):"";
      h+=numField("b"+i,labs[i],q.boxes?(q.boxes[i].unit||""):"",s.val[i],c,lock);
    }
    area.innerHTML=h+'</div>';
    wireText(area,function(i,v){s.val[i]=v;});
  }
  else if(q.type==="decide"){
    if(!s.val)s.val={choice:-1,boxes:q.boxes.map(function(){return "";})};
    h='<div class="opts">';
    q.choices.forEach(function(o,i){
      var cls="";
      if(s.locked){if(i===q.ans)cls=" right";else if(i===s.val.choice)cls=" wrong";}
      h+='<button type="button" class="opt'+cls+'" data-c="'+i+'" aria-pressed="'+(s.val.choice===i)+'"'+(lock?' disabled':'')+'><span class="let">'+"abcd"[i]+'</span>'+esc(o)+'</button>';
    });
    h+='</div><div class="boxes">';
    q.boxes.forEach(function(b,i){
      var c=(s.checked&&s.box)?(s.box[i]?" right":" wrong"):"";
      h+=numField("b"+i,b.label,b.unit||"",s.val.boxes[i],c,lock);
    });
    area.innerHTML=h+'</div>';
    Array.prototype.forEach.call(area.querySelectorAll(".opt"),function(b){
      b.onclick=function(){s.val.choice=+b.getAttribute("data-c");save();
        Array.prototype.forEach.call(area.querySelectorAll(".opt"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});};
    });
    wireText(area,function(i,v){s.val.boxes[i]=v;});
  }
  else if(q.type==="pick"){
    if(s.val==null)s.val=-1;
    h='<div class="opts">';
    q.options.forEach(function(o,i){
      var cls="";
      if(s.locked){if(i===q.ans)cls=" right";else if(i===s.val)cls=" wrong";}
      h+='<button type="button" class="opt'+cls+'" data-c="'+i+'" aria-pressed="'+(s.val===i)+'"'+(lock?' disabled':'')+'><span class="let">'+"abcde"[i]+'</span>'+esc(o)+'</button>';
    });
    area.innerHTML=h+'</div>';
    Array.prototype.forEach.call(area.querySelectorAll(".opt"),function(b){
      b.onclick=function(){s.val=+b.getAttribute("data-c");save();
        Array.prototype.forEach.call(area.querySelectorAll(".opt"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});};
    });
  }
  else if(q.type==="lines"){
    if(!s.val)s.val=[];
    var LINES=[
      {a:[130,20], b:[130,160], ok:true},{a:[230,160], b:[80,90], ok:true},{a:[30,160], b:[180,90], ok:true},
      {a:[30,90], b:[230,90], ok:false},{a:[30,160], b:[230,20], ok:false}
    ];
    function hitPoly(A,B,w){
      var dx=B[0]-A[0], dy=B[1]-A[1], len=Math.sqrt(dx*dx+dy*dy)||1;
      var ox=-dy/len*w, oy=dx/len*w;
      return [[A[0]+ox,A[1]+oy],[B[0]+ox,B[1]+oy],[B[0]-ox,B[1]-oy],[A[0]-ox,A[1]-oy]]
        .map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
    }
    h='<div class="stim"><svg viewBox="0 0 260 180" role="group" aria-label="Equilateral triangle with five lines you can tap">'+
      '<polygon points="130,20 230,160 30,160" fill="#fff" stroke="#0a2f38" stroke-width="2.5"/>';
    LINES.forEach(function(L,i){
      var on=s.val.indexOf(i)>-1;
      var col = s.locked ? (on ? (L.ok?"#1f7a4d":"#c0392b") : "#cfdde1") : (on?"#ef7724":"#9dbac2");
      h+='<line x1="'+L.a[0]+'" y1="'+L.a[1]+'" x2="'+L.b[0]+'" y2="'+L.b[1]+'" stroke="'+col+'" stroke-opacity="'+(on?1:0.5)+'" stroke-width="'+(on?5:3)+'" stroke-linecap="round" stroke-dasharray="'+(on?"":"2 8")+'"/>'+
         '<polygon points="'+hitPoly(L.a,L.b,8)+'" fill="#000" fill-opacity="0.001" data-line="'+i+'" style="cursor:pointer"/>';
    });
    area.innerHTML=h+'</svg><p class="small">Tap a line to draw it. Tap again to rub it out.</p></div>';
    if(!lock)Array.prototype.forEach.call(area.querySelectorAll("[data-line]"),function(p){
      p.onclick=function(){
        var i=+p.getAttribute("data-line"), at=s.val.indexOf(i);
        if(at>-1)s.val.splice(at,1);else s.val.push(i);
        save();buildAnswer(q);
      };
    });
  }
  else if(q.type==="net"){
    if(!s.val)s.val=[];
    h='<div class="gridwrap"><table class="netgrid"><tbody>';
    for(var y=0;y<NH;y++){
      h+='<tr>';
      for(var x=0;x<NW;x++){
        var id=y*NW+x, on=s.val.indexOf(id)>-1;
        h+='<td><button type="button" class="gridcell'+(on?" on":"")+'" data-cell="'+id+'" aria-label="square '+(x+1)+', '+(y+1)+'" aria-pressed="'+on+'"'+(lock?' disabled':'')+'></button></td>';
      }
      h+='</tr>';
    }
    h+='</tbody></table></div><p class="small" id="netcount">Squares shaded: '+s.val.length+'. A net of this cuboid needs 90.</p>'+
       '<div class="helprow"><button type="button" class="mbtn" id="clearnet"'+(lock?' disabled':'')+'>Clear the grid</button></div>';
    area.innerHTML=h;
    if(!lock){
      Array.prototype.forEach.call(area.querySelectorAll("[data-cell]"),function(c){
        c.onclick=function(){
          var id=+c.getAttribute("data-cell"), at=s.val.indexOf(id);
          if(at>-1){s.val.splice(at,1);c.classList.remove("on");c.setAttribute("aria-pressed","false");}
          else {s.val.push(id);c.classList.add("on");c.setAttribute("aria-pressed","true");}
          save();
          document.getElementById("netcount").textContent="Squares shaded: "+s.val.length+". A net of this cuboid needs 90.";
        };
      });
      area.querySelector("#clearnet").onclick=function(){s.val=[];save();buildAnswer(q);};
    }
  }
  else if(q.type==="chart"){
    if(!s.val)s.val={scale:10,ylab:"",xlab:"",bars:[0,0,0,0]};
    var CH=14, labs=["0 to 1","2 to 3","4 to 5","6 to 7"];
    h='<div class="boxes"><div class="boxrow"><label for="scale">How many people does one square stand for?</label>'+
      '<select id="scale"'+(lock?' disabled':'')+'>';
    [1,2,5,10,20].forEach(function(v){h+='<option value="'+v+'"'+(s.val.scale===v?' selected':'')+'>'+v+'</option>';});
    h+='</select></div>'+
      '<div class="boxrow"><label for="ylab">Label for the side axis</label><input class="wide" type="text" id="ylab" value="'+esc(s.val.ylab)+'"'+(lock?' disabled':'')+'></div>'+
      '<div class="boxrow"><label for="xlab">Label for the bottom axis</label><input class="wide" type="text" id="xlab" value="'+esc(s.val.xlab)+'"'+(lock?' disabled':'')+'></div></div>';
    h+='<div class="gridwrap"><table class="chartgrid"><tbody>';
    for(var r=CH;r>=1;r--){
      h+='<tr><td class="axis">'+(r*s.val.scale)+'</td>';
      for(var c2=0;c2<4;c2++){
        var filled = s.val.bars[c2] >= r*s.val.scale - s.val.scale/2;
        h+='<td class="'+(filled?"bar":"")+'"><button type="button" class="chartcell" data-col="'+c2+'" data-row="'+r+'" aria-label="'+labs[c2]+' up to '+(r*s.val.scale)+'"'+(lock?' disabled':'')+'></button></td>';
      }
      h+='</tr>';
    }
    h+='<tr><td class="axis">0</td>';
    labs.forEach(function(l){h+='<td class="xlab">'+l+'</td>';});
    h+='</tr></tbody></table></div><p class="small">Tap a column at the height you want. Tapping the same square again clears that bar.</p>';
    area.innerHTML=h;
    if(!lock){
      area.querySelector("#scale").onchange=function(){s.val.scale=+this.value;save();buildAnswer(q);};
      area.querySelector("#ylab").oninput=function(){s.val.ylab=this.value;save();};
      area.querySelector("#xlab").oninput=function(){s.val.xlab=this.value;save();};
      Array.prototype.forEach.call(area.querySelectorAll("[data-col]"),function(b){
        b.onclick=function(){
          var col=+b.getAttribute("data-col"), row=+b.getAttribute("data-row"), v=row*s.val.scale;
          s.val.bars[col] = (Math.abs(s.val.bars[col]-v)<0.01) ? 0 : v;
          save();buildAnswer(q);
        };
      });
    }
  }
}

function wireText(area,setter){
  Array.prototype.forEach.call(area.querySelectorAll('input[type=text]'),function(el,i){
    el.oninput=function(){setter(i,el.value);save();};
    el.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var c=document.getElementById("check");if(c&&!c.disabled)c.click();}};
  });
}

function doCheck(q){
  var s=st(q);
  if(!answered(q)){document.getElementById("fb").innerHTML='<div class="fb part">Put something in first, or tap <b>Skip for now</b> and come back to it.</div>';return;}
  var r=markQ(q,s.val);
  s.marks=r.m;s.box=r.box;s.checked=true;s.tries++;
  if(q.forJay){s.locked=true;}
  else if(r.m===q.marks)s.locked=true;
  save();renderQ(q);
}

function showFeedback(q){
  var s=st(q), fb=document.getElementById("fb"), h;
  var full=s.marks===q.marks;

  if(q.forJay){
    var b=s.box||{};
    var msg = (b.cells===90&&b.connected) ? "90 squares, all joined up. That is the right amount of card for this cuboid."
            : (b.cells===90 ? "90 squares, which is the right amount, but they are not all joined together."
            : b.cells+" squares shaded. A net of this cuboid needs 90.");
    h='<div class="fb show"><b class="big">'+msg+'</b><div class="why">'+q.why+'</div>'+
      '<div class="why small">These 3 marks are not counted in your score on this page. Your grid goes to Jay as a list of squares.</div></div>';
    fb.innerHTML=h;
    var c0=document.getElementById("check");
    c0.textContent = (q===QS[QS.length-1]?"Finish":"Next question");
    c0.onclick=function(){step(1);};
    return;
  }

  if(full){
    h='<div class="fb good"><b class="big">Yes. '+s.marks+' out of '+q.marks+'.</b><div class="why">'+q.why+'</div></div>';
  } else if(s.revealed){
    h='<div class="fb show"><b class="big">'+s.marks+' out of '+q.marks+' on this page.</b><div class="why">'+q.why+'</div>'+
      '<div class="why small">If your method was sound, Jay can still give method marks for what is in your working box.</div></div>';
  } else {
    var partmsg;
    if(q.type==="decide"&&s.marks>0)partmsg="Part of that landed. "+s.marks+" out of "+q.marks+" so far.";
    else if(q.type==="chart")partmsg=s.marks+" out of 3 so far: "+chartNotes(s.box)+".";
    else partmsg="Not quite yet.";
    h='<div class="fb part"><b class="big">'+partmsg+'</b>'+
      '<div class="why">Another go, or see how it is done.</div>'+
      '<div class="sendrow2"><button type="button" class="mbtn warm" id="again">Have another go</button><button type="button" class="mbtn" id="reveal">Show me the answer</button></div></div>';
  }
  fb.innerHTML=h;
  var c=document.getElementById("check");
  if(full||s.revealed){
    c.textContent=(q===QS[QS.length-1]?"Finish":"Next question");
    c.onclick=function(){step(1);};
    c.focus({preventScroll:true});
  } else {
    c.disabled=true;
    document.getElementById("again").onclick=function(){s.checked=false;save();renderQ(q);};
    document.getElementById("reveal").onclick=function(){s.revealed=true;s.locked=true;save();renderQ(q);};
  }
}

function chartNotes(b){
  if(!b)return "";
  var a=[];
  a.push(b.scale?"scale works":"the scale does not fit 64 well");
  a.push(b.labels?"axes labelled":"the axis labels need the words");
  a.push(b.bars?"bars accurate":"at least one bar is at the wrong height");
  return a.join(", ");
}

/* timer */
var timerId=null;
function tick(){
  if(timerId)clearInterval(timerId);
  var el=document.getElementById("timer");if(!el)return;
  var f=function(){var m=Math.floor((Date.now()-S.t0)/60000);el.textContent=m+" min so far";};
  f();timerId=setInterval(f,20000);
}

function finish(){
  QS.forEach(function(q){
    var s=st(q);
    if(!s.checked&&answered(q)){var r=markQ(q,s.val);s.marks=r.m;s.box=r.box;}
    if(!answered(q))s.marks=0;
  });
  S.done=true;S.t1=Date.now();save();if(timerId)clearInterval(timerId);render();window.scrollTo(0,0);
}

function totals(){
  var t={score:0, of:0, sk:{}};
  Object.keys(SKILLS).forEach(function(k){t.sk[k]={got:0,of:0};});
  QS.forEach(function(q){
    var s=st(q);
    if(q.forJay)return;
    t.score+=s.marks;t.of+=q.marks;
    t.sk[q.skill].got+=s.marks;t.sk[q.skill].of+=q.marks;
  });
  return t;
}
function helpList(s){var a=[];if(s.help.hint)a.push("nudge");if(s.help.method)a.push("method");if(s.tries>1)a.push("second go");if(s.revealed)a.push("saw answer");return a;}
function ansText(q){
  var s=S.a[q.n];
  if(!s||!answered(q))return "(skipped)";
  if(q.type==="pick")return q.options[s.val];
  if(q.type==="decide")return (s.val.choice>-1?q.choices[s.val.choice]:"no choice")+", "+q.boxes.map(function(b,i){return b.label+": "+(s.val.boxes[i]||"-");}).join(", ");
  if(q.type==="fraction")return s.val[0]+"/"+s.val[1];
  if(q.type==="pair")return q.boxes[0].label+" "+s.val[0]+", "+q.boxes[1].label+" "+s.val[1];
  if(q.type==="lines")return s.val.length+" line"+(s.val.length>1?"s":"")+" drawn";
  if(q.type==="net")return s.val.length+" squares shaded"+(netConnected(s.val)?", all joined":", not all joined");
  if(q.type==="chart")return "scale "+s.val.scale+" per square, bars "+s.val.bars.join(", ")+", labels: "+(s.val.ylab||"-")+" / "+(s.val.xlab||"-");
  return String(s.val);
}

function renderReport(){
  var t=totals(), mins=S.t1&&S.t0?Math.max(1,Math.round((S.t1-S.t0)/60000)):null;
  var h='<div class="mcard"><h2>How it went</h2>'+
    '<div class="score"><span class="n">'+t.score+'</span><span class="of">out of '+t.of+' marked here</span></div>'+
    '<p>The paper is '+TOTAL+' marks altogether. The '+JAYMARKS+' marks for the net are not in that score, because whether a net folds up is not something this page can tell.'+
    (mins?' You were at it for about '+mins+' minute'+(mins>1?'s':'')+'.':'')+'</p>'+
    '<p class="small">Method marks are not in it either. Jay reads your working, so a sound method with a slipped number can still earn marks on top of this.</p>';
  Object.keys(SKILLS).forEach(function(k){
    var x=t.sk[k], pc=x.of?Math.round(x.got/x.of*100):0;
    h+='<div class="skill"><div class="lab"><span>'+SKILLS[k].name+'</span><span>'+x.got+' of '+x.of+'</span></div><div class="bar"><i style="width:'+pc+'%;background:'+SKILLS[k].col+'"></i></div></div>';
  });
  h+='<h3 style="font-family:Archivo,sans-serif;margin:18px 0 6px">Every question</h3>';
  QS.forEach(function(q){
    var s=st(q), cls=q.forJay?"jay":(s.marks===q.marks?"full":s.marks>0?"some":"none"), hl=helpList(s);
    h+='<details class="rev"><summary><span>'+q.n+'. '+esc(q.q).slice(0,64)+(q.q.length>64?'...':'')+'</span>'+
       '<span class="mk '+cls+'">'+(q.forJay?"for Jay":s.marks+"/"+q.marks)+'</span></summary><div class="in">'+
       '<p><b>Your answer:</b> '+esc(ansText(q))+'</p>'+
       (s.work?'<p><b>Your working:</b> '+esc(s.work)+'</p>':'')+
       '<p>'+q.why+'</p>'+
       (hl.length?'<p class="small">Help used: '+hl.join(", ")+'</p>':'')+'</div></details>';
  });
  h+='<h3 style="font-family:Archivo,sans-serif;margin:18px 0 6px">Send it to Jay</h3>'+
    '<p class="small">Answers and working go together, with '+(S.ini?'your initials ('+S.ini+')':'no name on it')+' and today\'s date.</p>'+
    '<div class="sendrow2"><button type="button" class="mbtn main" id="sGmail">Gmail</button><button type="button" class="mbtn" id="sMail">Email app</button>'+
    '<button type="button" class="mbtn" id="sCopy">Copy</button><button type="button" class="mbtn" id="sSave">Save as a file</button></div><p class="small" id="sMsg"></p>'+
    '<div class="actions"><div class="l"><button type="button" class="mbtn" id="again2">'+(S.mode==="practice"?'Try it as a test run':'Try it in practice mode')+'</button>'+
    '<button type="button" class="mbtn" id="restart2">Start again</button></div></div></div>';
  pane.innerHTML=h;
  var subj="Level 1 maths practice"+(S.ini?" from "+S.ini:"");
  var body=report(t,mins);
  pane.querySelector("#sGmail").onclick=function(){window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(EMAIL)+"&su="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body),"_blank");};
  pane.querySelector("#sMail").onclick=function(){location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);};
  pane.querySelector("#sCopy").onclick=function(){var m=document.getElementById("sMsg");
    if(navigator.clipboard){navigator.clipboard.writeText(body).then(function(){m.textContent="Copied. Paste it into a message to Jay.";},function(){m.textContent="Copy did not work here. Try Save as a file.";});}
    else m.textContent="Copy is not available here. Try Save as a file.";};
  pane.querySelector("#sSave").onclick=function(){var b=new Blob([body],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="maths-level-1-"+(S.ini||"practice")+".txt";document.body.appendChild(a);a.click();a.remove();};
  pane.querySelector("#again2").onclick=function(){var ini=S.ini,m=S.mode==="practice"?"test":"practice";S=fresh();S.ini=ini;S.mode=m;save();render();window.scrollTo(0,0);};
  pane.querySelector("#restart2").onclick=function(){if(!confirm("Start again? This clears the answers saved on this device."))return;var ini=S.ini,m=S.mode;S=fresh();S.ini=ini;S.mode=m;save();render();window.scrollTo(0,0);};
}

function report(t,mins){
  var d=new Date(), L=[];
  L.push("Functional Skills Maths Level 1, Set 9 (Pearson Edexcel) practice");
  L.push("Student: "+(S.ini||"not given"));
  L.push("Date: "+d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  L.push("Mode: "+(S.mode==="practice"?"practice with help":"test run"));
  L.push("Marked on the page: "+t.score+" / "+t.of+"  (paper total "+TOTAL+", net question left for Jay)");
  if(mins)L.push("Time: about "+mins+" min");
  L.push("");
  Object.keys(SKILLS).forEach(function(k){L.push(SKILLS[k].name+": "+t.sk[k].got+" / "+t.sk[k].of);});
  L.push("");
  QS.forEach(function(q){
    var s=st(q), hl=helpList(s);
    L.push("== "+q.n+" ("+(q.forJay?"for Jay, "+q.marks+" marks":s.marks+"/"+q.marks)+") ==");
    L.push("Answer: "+ansText(q));
    if(s.work)L.push("Working: "+s.work.replace(/\n/g," / "));
    if(hl.length)L.push("Help: "+hl.join(", "));
    L.push("");
  });
  return L.join("\n");
}

render();
})();
</script>
