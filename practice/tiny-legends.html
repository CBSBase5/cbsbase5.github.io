<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#16101d;--ink:#2a1f33;--ink2:#3a2c47;--paper:#f3e5c8;--paper2:#e8d4ad;--card:#fffaf0;
  --text:#2a1f33;--muted:#6d5a4a;--gold:#f0a534;--rose:#e2556b;--teal:#3dbdb0;--plum:#6d4583;--leaf:#4f9e5c;
  --r-C:#8e7f6d;--r-U:#3f9a58;--r-R:#3777c9;--r-L:#d07f0c;
  --pix:'Silkscreen',ui-monospace,'Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;background:var(--night)}
body{margin:0;overflow:hidden;font-family:var(--body);color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;background:var(--night)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
button{font:inherit}
[hidden]{display:none!important}

/* ---------- overlays: photo album pages ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));background:rgba(14,9,20,.74);z-index:20;box-sizing:border-box}
.ov.clear{background:rgba(14,9,20,.35)}
.ov > *{margin:auto 0}
.sheet{position:relative;box-sizing:border-box;width:100%;max-width:880px;background:var(--paper);color:var(--text);
  background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.2px),radial-gradient(rgba(120,90,50,.05) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  border-radius:3px 7px 4px 6px;box-shadow:0 12px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.25);padding:28px clamp(16px,4vw,40px) 28px}
.sheet::before,.sheet::after{content:"";position:absolute;width:92px;height:24px;background:rgba(240,165,52,.55);top:-10px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.sheet::before{left:22px;transform:rotate(-4deg)}
.sheet::after{right:26px;transform:rotate(3deg);background-color:rgba(61,189,176,.5)}
.sheet.narrow{max-width:560px}
.sheet h2{font-family:var(--pix);font-weight:700;font-size:clamp(22px,4vw,32px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:.02em}
.sheet h3{font-family:var(--pix);font-size:15px;margin:18px 0 8px;letter-spacing:.04em}
.sheet p{font-size:17px;line-height:1.5;margin:0 0 12px;max-width:62ch}
.kick{font-family:var(--pix);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.btn{font-family:var(--pix);font-size:15px;letter-spacing:.04em;text-transform:uppercase;min-height:46px;padding:10px 18px;border:3px solid var(--ink);
  background:var(--ink);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.45);cursor:pointer;border-radius:2px;transition:transform .08s,background .12s}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn:hover{background:var(--plum);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:rgba(42,31,51,.08)}
.btn.gold{background:var(--gold);border-color:var(--ink);color:var(--ink)}
.btn.gold:hover{background:#ffbe55}
.btn:focus-visible,.card:focus-visible,.tog:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:12px 0;max-width:720px;width:100%}
.logo{font-family:var(--pix);font-weight:700;font-size:clamp(44px,11vw,108px);line-height:.9;color:var(--gold);margin:0;letter-spacing:.02em;
  text-shadow:4px 4px 0 #8a2f45,8px 8px 0 #2a1f33;transform:rotate(-2deg)}
.logo small{display:block;font-size:.34em;color:var(--paper);text-shadow:3px 3px 0 #2a1f33;letter-spacing:.2em;margin-top:.5em}
.tag{font-size:18px;line-height:1.5;max-width:46ch;color:#f3e5c8;margin:0;padding:10px 16px;background:rgba(22,16,29,.82);border:2px solid #3a2c47}
.menu{display:grid;gap:10px;width:min(480px,100%);grid-template-columns:1fr 1fr}
.menu .wide{grid-column:1/-1}
@media (max-width:440px){.menu{grid-template-columns:1fr}}
.savings{font-family:var(--pix);font-size:15px;margin:4px 0 12px}.savings b{font-size:26px;color:#8a2f45;margin-right:6px}
.heirs{display:grid;gap:10px}
.heir{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--card);border:2px solid var(--ink);padding:10px 12px}
.heir .nm{font-family:var(--pix);font-size:15px;font-weight:700}.heir .ds{font-size:15px;line-height:1.35}
.heir .lv{display:flex;gap:3px;margin-top:6px}.heir .lv s{width:14px;height:8px;background:rgba(42,31,51,.15);display:block}.heir .lv s.on{background:var(--gold)}
.heir .done{font-family:var(--pix);font-size:12px;color:var(--leaf)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.wcell{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--ink);padding:6px 8px}
.wcell img{width:36px;height:36px;image-rendering:pixelated;flex:none}.wcell .q{width:36px;height:36px;display:grid;place-items:center;background:#2a1f33;color:#8e7f6d;font-family:var(--pix);flex:none}
.wcell b{font-family:var(--pix);font-size:12px;display:block}.wcell small{font-size:13px;color:var(--muted);line-height:1.3}
.wcell.locked{border-style:dashed;background:transparent}
.card.locked .nm,.card.locked .rl{color:var(--muted)}
.menu .btn{width:100%}
.backlink{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:21;font-family:var(--pix);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:9px 12px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.backlink:hover{background:var(--gold)}.backlink:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@media (max-height:800px){.logo{font-size:clamp(40px,9vh,84px)}.title{gap:12px}}
.foot{font-size:14px;color:#d9cbb0;max-width:52ch;background:rgba(22,16,29,.82);padding:6px 12px}

/* hero select */
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin:14px 0}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 5px 0 rgba(42,31,51,.25);transition:transform .12s;position:relative;color:var(--text)}
.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(.8deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.card[aria-pressed="true"]{outline:4px solid var(--gold);outline-offset:0;transform:rotate(0) scale(1.03)}
.card img{width:100%;aspect-ratio:1/1;image-rendering:pixelated;background:#8d5a6e;display:block}
.card .nm{font-family:var(--pix);font-size:15px;font-weight:700}
.card .rl{font-size:13px;color:var(--muted);line-height:1.25}
.detail{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start;background:rgba(255,250,240,.7);border:2px dashed rgba(42,31,51,.35);padding:14px}
.detail img{width:120px;height:120px;image-rendering:pixelated;background:#8d5a6e}
.detail .q{font-size:16px;line-height:1.45;font-style:italic;margin:4px 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;line-height:1.35}
.facts b{font-family:var(--pix);font-size:12px;letter-spacing:.06em;padding-top:2px}
.bars{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.bar{font-family:var(--pix);font-size:11px;display:flex;align-items:center;gap:6px}
.bar i{display:inline-flex;gap:2px}
.bar i s{width:8px;height:10px;background:rgba(42,31,51,.18);display:block}
.bar i s.on{background:var(--ink)}
@media (max-width:520px){.detail{grid-template-columns:1fr}.detail img{width:96px;height:96px}}

/* upgrade + choice cards */
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:14px}
.up{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;color:var(--text);
  box-shadow:0 5px 0 rgba(42,31,51,.25);transition:transform .12s}
.up:hover,.up:focus-visible{transform:translateY(-4px) rotate(-.6deg)}
.up .k{position:absolute;top:8px;right:10px;font-family:var(--pix);font-size:12px;color:var(--muted)}
.up .nm{font-family:var(--pix);font-size:16px;font-weight:700;line-height:1.15;padding-right:22px}
.up .ds{font-size:16px;line-height:1.4}
.stamp{align-self:flex-start;font-family:var(--pix);font-size:10px;letter-spacing:.14em;padding:2px 6px;border:2px solid currentColor;transform:rotate(-3deg)}
.r-C{color:var(--r-C)}.r-U{color:var(--r-U)}.r-R{color:var(--r-R)}.r-L{color:var(--r-L)}
.up .st{font-size:13px;color:var(--muted)}

/* story */
.story{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:start}
.story img{width:130px;height:146px;image-rendering:pixelated;background:#6b4a5c;border:3px solid #fffaf0;box-shadow:0 4px 0 rgba(0,0,0,.25);transform:rotate(-2deg)}
.story .who{font-family:var(--pix);font-size:22px;font-weight:700}
.story .role{font-size:15px;color:var(--muted);margin-bottom:12px}
.lines p{opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.lines p.in{opacity:1;transform:none}
.gift{margin-top:14px;padding:12px 14px;background:rgba(255,250,240,.8);border:2px dashed var(--plum)}
.gift .nm{font-family:var(--pix);font-size:15px}
@media (max-width:520px){.story{grid-template-columns:1fr}.story img{width:96px;height:108px}}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.slot{background:var(--card);border:2px solid var(--ink);padding:10px 12px;font-size:14px;line-height:1.4;min-height:88px}
.slot.no{background:transparent;border-style:dashed;color:var(--muted)}
.slot b{font-family:var(--pix);font-size:13px;display:block;margin-bottom:4px}

/* toggles */
.togs{display:grid;gap:10px;margin:10px 0 16px}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:2px solid var(--ink);color:var(--text)}
.tog span{font-size:16px;line-height:1.35}.tog small{display:block;color:var(--muted);font-size:13px}
.tog em{font-style:normal;font-family:var(--pix);font-size:12px;padding:4px 8px;border:2px solid var(--ink);min-width:34px;text-align:center}
.tog[aria-checked="true"] em{background:var(--teal);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;line-height:1.4}
.keys kbd{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:2px;white-space:nowrap}
.doorkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;font-size:15px;line-height:1.35}
.doorkey div{display:flex;gap:8px;align-items:flex-start}
.doorkey span:first-child{font-size:20px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0 16px}
.stats div{background:var(--card);border:2px solid var(--ink);padding:8px 10px}
.stats b{display:block;font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:13px;color:var(--muted)}
.build{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.build span{font-size:13px;background:var(--card);border:1.5px solid rgba(42,31,51,.4);padding:3px 8px}
.build span b{font-family:var(--pix);font-size:11px;margin-left:4px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--pix)}
.hud-tl{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:5px}
.hp{position:relative;width:clamp(150px,24vw,230px);height:20px;background:#0e0a12;border:2px solid #0e0a12;box-shadow:0 0 0 2px #5b4466}
.hp i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);box-shadow:inset 0 3px 0 rgba(255,255,255,.25);transition:width .15s}
.hp u{position:absolute;left:0;top:0;bottom:0;background:#f7d38a;opacity:.55;transition:width .6s .2s}
.hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;align-items:center;font-size:11px;color:#cdbfa6;min-height:12px}
.pips s{width:10px;height:10px;display:block;background:#3a2c47;border:1px solid #0e0a12}
.pips s.on{background:var(--teal)}
.pips s.arm{background:#b9c3cf;clip-path:polygon(50% 0,100% 20%,90% 70%,50% 100%,10% 70%,0 20%)}
.hud-tr{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));text-align:right;display:grid;gap:4px;justify-items:end}
.coins{font-size:18px;color:var(--gold);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
.floorl{font-size:12px;color:#e9dcc2;text-shadow:1px 1px 0 #000;letter-spacing:.06em}
.rooms{display:flex;gap:4px}
.rooms s{width:9px;height:9px;background:#3a2c47;border:1px solid #0e0a12;display:block}
.rooms s.done{background:var(--gold)}.rooms s.now{background:#fff}.rooms s.boss{border-radius:50%}
.wcard{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:rgba(14,10,18,.78);padding:5px 10px 5px 5px;border:2px solid #3a2c47}
.wcard canvas{width:30px;height:30px;image-rendering:pixelated}
.wcard b{font-size:13px;display:block}.wcard small{font-size:10px;opacity:.85}
.xp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(420px,56vw);height:8px;background:#0e0a12;border:2px solid #3a2c47}
.xp i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .2s}
.xp span{position:absolute;right:calc(100% + 8px);top:-6px;font-size:12px;color:var(--gold);white-space:nowrap;text-shadow:1px 1px 0 #000}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(460px,52vw);text-align:center}
#bossBar .bn{font-size:13px;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.08em;margin-bottom:3px}
#bossBar .bb{height:10px;background:#0e0a12;border:2px solid #0e0a12;box-shadow:0 0 0 2px #8a2f45;position:relative}
#bossBar .bb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff8a78,#c93a52);transition:width .12s}
#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:rgba(14,10,18,.82);border:2px solid #f0a534;color:#f3e5c8;padding:5px 12px;font-size:13px;letter-spacing:.06em;white-space:nowrap}
#objective i{display:inline-block;height:8px;background:#f0a534;vertical-align:middle;margin-left:8px}
.xp span.ready{color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{color:#f0a534}}
body.bigtext .hud-tl,body.bigtext .hud-tr,body.bigtext .wcard,body.bigtext #prompt,body.bigtext #objective,body.bigtext #bossBar,body.bigtext .xp span{zoom:1.25}
body.bigtext .sheet p,body.bigtext .up .ds,body.bigtext .tog span{font-size:20px}
body.bigtext .card .rl{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:7px 12px;font-family:var(--pix);font-size:13px;color:var(--text);box-shadow:0 3px 0 rgba(42,31,51,.25)}
.chip[aria-pressed="true"]{background:var(--gold)}
.chip:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hint{font-size:15px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.picks{display:grid;gap:14px;margin-top:14px}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:min(480px,80vw);background:rgba(243,229,200,.96);color:var(--ink);border:2px solid var(--ink);padding:7px 12px;font-family:var(--body);font-size:16px;line-height:1.35;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.4)}
#prompt b{font-family:var(--pix);font-size:13px}
#prompt .up{color:#2f7d45}#prompt .down{color:#b0304a}
#prompt kbd{font-family:var(--pix);font-size:11px;background:var(--ink);color:var(--paper);padding:1px 5px}
#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;pointer-events:none;display:grid;gap:6px;justify-items:center;width:max-content;max-width:90vw}
#toast div{background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 12px;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.4);animation:tIn .25s ease-out}
#toast div b{font-family:var(--pix);font-size:12px}
@keyframes tIn{from{transform:translateY(-8px);opacity:0}}
#pauseBtn{pointer-events:auto;position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:40px;height:40px;background:rgba(14,10,18,.78);color:var(--paper);border:2px solid #3a2c47;font-family:var(--pix);font-size:13px;cursor:pointer}
#tc{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:14px;z-index:11}
#tc button{width:70px;height:70px;border-radius:50%;border:3px solid rgba(243,229,200,.6);background:rgba(42,31,51,.55);color:var(--paper);font-family:var(--pix);font-size:12px;touch-action:none}
#tc button.hot{background:rgba(240,165,52,.8);color:var(--ink);border-color:var(--ink)}
#endSkip{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;font-family:var(--pix);font-size:13px;padding:10px 16px;min-height:44px;background:rgba(14,10,18,.8);color:var(--paper);border:2px solid #3a2c47;cursor:pointer}
#endSkip:focus-visible{outline:3px solid var(--teal)}
.houseWrap{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:20px;align-items:start;margin:10px 0 12px}
#houseCv{width:100%;max-width:240px;aspect-ratio:120/150;image-rendering:pixelated;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);background:#1d1628}
@media (max-width:560px){.houseWrap{grid-template-columns:1fr}#houseCv{max-width:200px}}
.postslot{margin:12px 0 6px}
.postslot img{display:block;width:100%;max-width:760px;height:auto;border:2px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.25);image-rendering:auto}
#turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--night);z-index:50;font-size:18px;line-height:1.5}
@media (hover:none) and (orientation:portrait){#turn.need{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Tiny Legends game area"></canvas>
  <div id="hud" hidden>

  lines:['I worked the number 12 for thirty two years. Ding ding, hold tight, fares please.','One morning a mother duck walked her whole family across the high street. I stopped the bus, and not one person on board complained.','Six minutes late. Best six minutes of my career.']},
 {id:'harold',name:'Harold',age:77,role:'Television repair man',keep:'radio',mem:"the smell of a valve telly",
  look:{skin:'#e0a684',hair:'#b8b2a8',style:'bald',glasses:1,top:'#6b5a3e',legs:'#3b3a48',tache:'#b8b2a8'},
  lines:['People brought me tellies with valves inside. When one went, you could smell it. I could tell you which valve by the smell alone.','Now if something breaks, you buy a new one. I understand why.','But fixing something with your own two hands? That feeling never goes out of date.']},
 {id:'nasreen',name:'Nasreen',age:74,role:'Cook and street party organiser',keep:'spice',mem:"forty people fed off one folding table",
  look:{skin:'#a8704c',hair:'#e7e2dc',style:'scarf',hatc:'#d36b2a',top:'#2f7a6a',legs:'#3d3350'},
  lines:['When I first moved to this street I knew nobody. So I cooked. Too much, on purpose.','By the street party in 1977 I was feeding forty people off one folding table.','Food is how you tell people they belong here. Remember that one.']},
 {id:'frank',name:'Frank',age:88,role:'Ballroom dancer',keep:'shoes',mem:"a first dance at the Palais",
  look:{skin:'#e8b793',hair:'#e8e6e0',style:'slick',top:'#2b2b36',legs:'#2b2b36',bow:'#c7313d'},
  lines:['Saturday nights at the Palais. You walked across the whole dance floor to ask someone to dance, and everyone watched you do it.','I asked Jean four Saturdays running. On the fifth, she said yes.','We were married fifty two years. I still practise the quickstep in the kitchen.']},
 {id:'beryl',name:'Beryl',age:79,role:'Punk, 1977 to present',keep:'jacket',mem:"green hair and safety pins",
  look:{skin:'#f0c4a4',hair:'#6fd08c',style:'spiky',top:'#1f1f26',legs:'#8a2436',studs:1},
  lines:['In 1977 I had green hair, safety pins and a leather jacket my mum absolutely hated.','I saw bands in rooms so small the singer stood on your feet.','I still have the jacket. It still fits. Mostly.']},
 {id:'clement',name:'Clement',age:83,role:'Letter writer',keep:'airmail',mem:"two shoe boxes full of letters",
  look:{skin:'#5a3620',hair:'#e0e0e0',style:'short',hat:'trilby',hatc:'#4a3b2c',top:'#8a7a5a',legs:'#3b3a48',tache:'#e0e0e0'},
  lines:['When I came to England, a letter to my brother took three weeks to arrive, and three weeks for his reply.','So you thought hard about every word. You did not waste good paper on nonsense.','I kept every letter he ever sent me. Two shoe boxes full. They are the best thing I own.']},
 {id:'sheila',name:'Sheila',age:90,role:'Radio engineer',keep:'headset',mem:"wiring radios faster than the lads",
  look:{skin:'#f2ccb0',hair:'#f4f2ee',style:'bob',glasses:1,top:'#3f63a8',legs:'#2f4a80',straps:1},
  lines:['At sixteen I learned to wire radios. The foreman said girls could not do it.','I did it faster than the lads, and I made sure the foreman noticed.','Listen carefully and a machine will tell you what is wrong with it. People too, usually.']},
 {id:'ken',name:'Ken',age:72,role:'Allotment holder for fifty years',keep:'seeds',mem:"potatoes planted every spring",
  look:{skin:'#dca07c',hair:'#a9a39a',style:'short',hat:'cap',hatc:'#4f6b3a',top:'#6b7a4a',legs:'#4a3b2c'},
  lines:['My dad said to plant potatoes on Good Friday. I have never missed a year.','Fifty years on the same plot. I have grown things that won prizes, and things that should be arrested.','Kids from the school come down now. They are better at it than I was at their age.']},
 {id:'margaret',name:'Margaret',age:85,role:'Lived on Station Road all her life',keep:'pennies',mem:"the red phone box on the corner",
  look:{skin:'#efc6a6',hair:'#e9e4f0',style:'curly',top:'#c9a0d6',legs:'#5a4050',pearls:1},
  lines:['There was one telephone for our whole street. A red box on the corner.','You queued with your pennies, and everyone in the queue heard your business.','Big news came through that box. Babies, jobs, engagements. We would all cheer on the pavement.']},
 {id:'tony',name:'Tony',age:76,role:'Ran a record shop for forty years',keep:'headphones',mem:"three minutes in the listening booth",
  look:{skin:'#c78d63',hair:'#dcdcdc',style:'long',top:'#e2556b',legs:'#2f4a80',glasses:1},
  lines:['In the old record shops you took a single into a little booth and listened before you bought it.','Three minutes to decide if a song was worth a week of paper round money.','Choosing carefully made you love it more. I still think that.']},
 {id:'pat',name:'Pat',age:80,role:'Open water swimmer',keep:'swimcap',mem:"a four hour swim across the lake",
  look:{skin:'#efbf9c',hair:'#f2f0ea',style:'short',hat:'swimcap',hatc:'#3dbdb0',top:'#3d62a8',legs:'#3d62a8'},
  lines:['I learned to swim at sixty. Everyone said I had left it late.','At sixty five I swam across the lake for charity. Four hours. My grandson rowed next to me and ate all my sandwiches.','It is never too late to be new at something.']},
 {id:'iris',name:'Iris',age:84,role:'Cinema usher',keep:'torch',mem:"Saturday morning pictures",
  look:{skin:'#8a5a3c',hair:'#dedbe3',style:'bun',top:'#8a2436',legs:'#2b2b36',band:'#e0b040'},
  lines:['Saturday morning pictures. Sixpence to get in, and three hundred kids shouting at the screen.','I walked the aisles with my torch, keeping order. Mostly I was laughing.','When the hero was in trouble the whole room yelled LOOK BEHIND YOU. Best sound in the world.']},
 {id:'des',name:'Des',age:79,role:'Milkman',keep:'bell',mem:"the clink of the milk float at dawn",
  look:{skin:'#eab08e',hair:'#c9c3bd',style:'short',hat:'cap',hatc:'#f3f1ea',top:'#f3f1ea',legs:'#2f4a80'},
  lines:['Up at four every morning, rain or shine. The milk float was so quiet you only heard the bottles.','I knew every dog on my round by name. The dogs knew me by the clink.','If a bottle was not taken in, you knocked on the door. Sometimes that knock mattered a lot.']},
 {id:'gwen',name:'Gwen',age:86,role:'Typist',keep:'ribbon',mem:"ninety words a minute, ding",
  look:{skin:'#f1c9ad',hair:'#bfb8c8',style:'bob',glasses:1,top:'#4f9e5c',legs:'#3b3a48',pearls:1},
  lines:['Ninety words a minute on a typewriter that went ding at the end of every line.','One mistake near the bottom and you started the whole page again. So you learned not to make it.','Your keyboards have a delete button. Lucky you. Use it kindly.']},
 {id:'samuel',name:'Samuel',age:78,role:'Taught a whole estate to fix bikes',keep:'repair',mem:"a bowl of water and the bubbles from a puncture",
  look:{skin:'#4e2f1c',hair:'#d8d8d8',style:'short',top:'#d36b2a',legs:'#2b2b36',beard:'#d8d8d8'},
  lines:['I taught half the kids on our estate to fix a puncture. Bowl of water, find the bubbles, patch it.','Some of them are grandparents now. They still stop me in the street to tell me they can do it.','Teach someone something useful and it keeps going long after you.']},
 {id:'rita',name:'Rita',age:82,role:'Street games champion',keep:'glow',mem:"playing out until the streetlights came on",
  look:{skin:'#e9b48f',hair:'#e0dce6',style:'curly',top:'#f0a534',legs:'#5a4050'},
  lines:['We played out until the streetlights came on. That was the only rule.','Hopscotch, skipping, knock and run. Well. Maybe not that last one.','When the lights flickered on, you went home. You knew the way without looking.']}

function hitEnemy(e,base,o){o=o||{};if(e.dead||e.spawnT>0||e.invuln)return;var p=G.P,st=p.st,dmg=base;

  dmg=Math.max(1,Math.round(dmg));e.hp-=dmg;e.flash=0.08;G.run.dealt+=dmg;
  if(o.kb&&o.a!==undefined){var k=o.kb*st.kb*(e.boss?0:e.elite?0.45:1);e.kx+=Math.cos(o.a)*k;e.ky+=Math.sin(o.a)*k;}
  if(o.stun&&!e.boss)e.stun=Math.max(e.stun,o.stun);
  if(st.burn&&Math.random()<st.burn){e.burn=3;e.burnTick=0.5;}
  if(!o.quiet||crit||Math.random()<0.25)floatText(e.x,e.y-e.r-3,dmg,crit?'crit':'dmg');

  if(crit){G.hitstop=Math.max(G.hitstop,0.03);shake(1.2);if(st.critHeal)healP(st.critHeal,true);if(p.ks.torch&&!e.boss)e.stun=Math.max(e.stun,0.6);
    if(p.hero.id==='pearl'&&!o.chain){var o2=nearestEnemy(e.x,e.y,70,e);if(o2){G.fx.push({k:'zap',x:e.x,y:e.y,x2:o2.x,y2:o2.y,t:0,dur:0.15});sfx('zap');hitEnemy(o2,dmg*0.6,{chain:true,noCrit:true,quiet:true});}}}
  p.hitCount++;if(p.ks.headphones&&p.hitCount%12===0){G.fx.push({k:'ringfx',x:e.x,y:e.y,r:4,R:52,t:0,dur:0.3,col:'#e2556b'});for(var i=0;i<G.enemies.length;i++){var q=G.enemies[i];if(q!==e&&!q.dead&&q.spawnT<=0&&dist(q,e)<52+q.r)hitEnemy(q,14*dmgMult(),{kb:80,a:ang(e,q),chain:true,quiet:true});}}

function onKeyPress(k,e){audioInit();
  if(G.state==='play'){if(k===' ')queued.dodge=true;else if(k==='e')queued.use=true;else if(k==='escape'||k==='p')openPause();else if(k==='m'){settings.sound=!settings.sound;settings.music=settings.sound;saveSettings();if(settings.music)musicStart(G.musicWanted||G.floor);else musicStop();toast(settings.sound?'Sound on':'Sound off');}}
  else if(G.state==='paused'&&(k==='escape'||k==='p'))resume();

  else if(G.state==='ending'&&(k==='e'||k==='enter'||k===' '||k==='escape')){if(e&&e.preventDefault)e.preventDefault();skipEnding();}
  else if(G.state==='story'&&k==='e'){var g=$('gift');if(g&&g.hidden)finishStory();}}

function setH(id,v){if(hudCache['h'+id]!==v){hudCache['h'+id]=v;$(id).innerHTML=v;}}
function setW(id,v){if(hudCache['w'+id]!==v){hudCache['w'+id]=v;$(id).style.width=v;}}
function updateHUD(){var p=G.P;if(!p||$('hud').hidden)return;G.hpLag=lerp(G.hpLag===undefined?p.hp:G.hpLag,p.hp,0.05);
  setW('hpFill',(clamp(p.hp/p.maxHp,0,1)*100).toFixed(1)+'%');setW('hpLag',(clamp(G.hpLag/p.maxHp,0,1)*100).toFixed(1)+'%');setT('hpText',Math.ceil(p.hp)+' / '+p.maxHp);

  if(ob){$('objective').hidden=false;setT('objective',ob);}else $('objective').hidden=true;
  var w=WEAP[p.weapon.id],key=p.weapon.id+p.weapon.tunes;if(hudCache.wk!==key){hudCache.wk=key;weaponIcon(w,$('wIcon'));$('wName').textContent=w.name+(p.weapon.tunes?' +'+p.weapon.tunes:'');$('wRar').textContent=RAR[w.r].name;$('wRar').style.color=RAR[w.r].col;$('wName').style.color=RAR[w.r].col;}

/* ================= UPDATE ================= */
function update(dt){G.time+=dt;var p=G.P,i;G.barkT=(G.barkT||0)-dt;if(G.bossCard){G.bossCard.t+=dt;if(G.bossCard.t>G.bossCard.dur)G.bossCard=null;}
  for(i=G.timers.length-1;i>=0;i--){var tm=G.timers[i];tm.t-=dt;if(tm.t<=0){G.timers.splice(i,1);tm.fn();if(G.state!=='play'&&G.state!=='trans')return;}}
  updatePlayer(dt);if(G.state!=='play')return;
  updateEnemies(dt);if(G.newE.length){G.enemies=G.enemies.concat(G.newE);G.newE=[];}
  updatePB(dt);updateEB(dt);updateHaz(dt);
  for(i=G.warns.length-1;i>=0;i--){G.warns[i].t+=dt;if(G.warns[i].t>=G.warns[i].dur)G.warns.splice(i,1);}
  updatePick(dt);
  for(i=G.pick.length-1;i>=0;i--){var o=G.pick[i];if(o.k==='star'&&o.t>0.4&&Math.hypot(p.x-o.x,p.y-o.y)<10){G.pick.splice(i,1);p.giftQ++;sfx('level');}}
  if(G.state!=='play')return;
  tickFx(dt);
  for(i=G.say.length-1;i>=0;i--){G.say[i].t-=dt;if(G.say[i].t<=0)G.say.splice(i,1);}
  if(G.roomType==='combat'&&!G.cleared){var alive=liveEnemies();
    if(G.waveDelay>0){G.waveDelay-=dt;if(G.waveDelay<=0)spawnWave();}
    else{G.waveT+=dt;if(alive===0||(alive<=1&&G.waveT>7&&G.waveIdx<G.waves.length)){if(G.waveIdx<G.waves.length)G.waveDelay=0.6;else if(!G.event||G.event.k!=='radio'||G.event.done)onClear();}}
    updateEvent(dt);}
  G.focus=findFocus();if(queued.use){queued.use=false;useFocus();}
  G.lvlCool=(G.lvlCool||0)-dt;if(G.state==='play'&&(p.levelQ>0||p.giftQ>0)&&!G.trans&&G.lvlCool<=0&&G.cleared&&liveEnemies()===0)openLevel(p.levelQ<=0);
  G.enemies=G.enemies.filter(function(e){return !e.dead;});
  G.shakeA=Math.max(0,G.shakeA-dt*14);G.hurtT-=dt;G.flashT-=dt;if(G.caption){G.caption.t-=dt;if(G.caption.t<=0)G.caption=null;}}
function tickFx(dt){var i;for(i=G.fx.length-1;i>=0;i--){var f=G.fx[i];f.t+=dt;if(f.k==='debris'){f.vy+=260*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y>f.floorY){f.y=f.floorY;f.vy*=-0.35;f.vx*=0.6;}}if(f.t>=f.dur)G.fx.splice(i,1);}
  for(i=G.parts.length-1;i>=0;i--){var q=G.parts[i];q.t+=dt;q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.96;if(q.t>=q.life)G.parts.splice(i,1);}
  for(i=G.texts.length-1;i>=0;i--){var t=G.texts[i];t.t+=dt;t.y-=dt*(t.kind==='mem'?6:18);if(t.t>=t.dur)G.texts.splice(i,1);}
  for(i=0;i<G.decor.length;i++)G.decor[i].t+=dt;}
function updateEnemies(dt){var p=G.P,i,j,e;for(i=0;i<G.enemies.length;i++){e=G.enemies[i];if(e.dead)continue;e.anim+=dt;
  if(e.spawnT>0){e.spawnT-=dt;continue;}
  e.flash-=dt;
  if(e.burn>0){e.burn-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=0.5;burnTick(e);if(e.dead)continue;}}
  if(e.stun>0){e.stun-=dt;e.windup=false;e.dashing=false;if(e.boss)e.stun=0;}else EN[e.type].ai(e,dt);
  if(e.dead||G.state!=='play')continue;
  var mvx=(e.stun>0?0:e.vx)+e.kx,mvy=(e.stun>0?0:e.vy)+e.ky;
  if(e.boss){e.x=clamp(e.x+mvx*dt,AX+e.r,AX2-e.r);e.y=clamp(e.y+mvy*dt,AY+e.r,AY2-e.r);e.hitWall=(e.x<=AX+e.r+0.5||e.x>=AX2-e.r-0.5||e.y<=AY+e.r+0.5||e.y>=AY2-e.r-0.5);}
  else moveCirc(e,mvx*dt,mvy*dt,EN[e.type].fly);
  var kd=Math.max(0,1-dt*9);e.kx*=kd;e.ky*=kd;
  if(!e.invuln&&!(e.boss&&e.bossIntro>0)&&Math.hypot(p.x-e.x,p.y-3-e.y)<e.r+p.r-1)hurtPlayer(e.dmg,e);}
  for(i=0;i<G.enemies.length;i++){var a=G.enemies[i];if(a.dead||a.boss||a.spawnT>0)continue;for(j=i+1;j<G.enemies.length;j++){var c=G.enemies[j];if(c.dead||c.boss||c.spawnT>0)continue;var dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),m=a.r+c.r;if(d<m&&d>0.01){var pu=(m-d)/2;a.x-=dx/d*pu;a.y-=dy/d*pu;c.x+=dx/d*pu;c.y+=dy/d*pu;}}}}
function bossDefeated(e){G.run.bosses++;houseAdd('boss',G.floor);onBossMeta(G.floor);G.timers.push({t:0.9,fn:function(){bark('bossWin',true);}});sfx('boom');sfx('open');shake(7);G.slowT=1;G.hitstop=0.2;var i;
  for(i=0;i<6;i++)G.timers.push({t:i*0.16,fn:function(){burst(e.x+rnd(-24,24),e.y+rnd(-24,24),22,pick(['#f0c24a','#fff','#e2556b','#3dbdb0']));sfx('boom');}});
  G.ebul.length=0;G.haz.length=0;G.warns.length=0;G.windPush=null;G.say=[];G.caption=null;
  G.enemies.forEach(function(q){if(q!==e&&!q.dead){q.dead=true;burst(q.x,q.y,6,'#fff');}});
  $('bossBar').hidden=true;G.boss=null;
  if(G.floor===5){G.sat=1;for(i=0;i<8;i++)returnMemory(e);floatText(CX,CY-30,'THE MEMORY HOUSE REMEMBERS','big');G.timers.push({t:3.4,fn:function(){startEnding();}});return;}
  floatText(CX,CY-30,FLOORS[G.floor].name.toUpperCase()+' RESTORED','big');
  G.timers.push({t:1.1,fn:function(){dropP('feast',CX-18,CY+18,1,{vx:0,vy:0});G.pick.push({k:'chest',x:CX+18,y:CY+18,rar:rollRar(3),vx:0,vy:0,t:0});G.cleared=true;spawnDoors();musicStart(G.floor);}});}

function drawFood(c,k,x,y){x=Math.round(x);y=Math.round(y);switch(k){
  case 'sandwich':R(c,'#e8bb72',x-4,y-2,8,5);R(c,'#6fd08c',x-4,y,8,1);R(c,'#f3e5c8',x-3,y-2,6,1);break;

  case 'tart':R(c,'#c78d45',x-3,y-1,6,3);R(c,'#e2556b',x-2,y-2,4,2);break;
  case 'tea':R(c,'#f3f1ea',x-3,y-2,5,5);R(c,'#8a5a2b',x-2,y-2,3,1);R(c,'#f3f1ea',x+2,y-1,1,2);R(c,'#fff',x-1,y-5,1,2);break;
  default:pcirc(c,'#c78d45',x,y,3);R(c,'#8a5a2b',x-1,y-1,1,1);R(c,'#8a5a2b',x+1,y+1,1,1);}}
function drawPickups(c){var i,o;for(i=0;i<G.pick.length;i++){o=G.pick[i];var x=Math.round(o.x),y=Math.round(o.y),bob=Math.round(Math.sin(G.time*4+i)*1.5);
  switch(o.k){
   case 'xp':R(c,'#f0a534',x-1,y-2,2,4);R(c,'#fff4c2',x-2,y-1,4,2);break;
   case 'coin':var w=Math.max(1,Math.round(Math.abs(Math.cos(G.time*6+i))*4));R(c,'#b3831c',x-w/2,y-2,w,4);R(c,'#f7d26a',x-w/2,y-2,Math.max(1,w-1),1);break;
   case 'food':shadow(c,x,y+2,3);drawFood(c,o.food,x,y+bob);break;
   case 'flower':R(c,'#4f9e5c',x,y-1,1,4);R(c,'#ea9ad0',x-2,y-4+bob,5,3);R(c,'#f0c24a',x,y-3+bob,1,1);break;
