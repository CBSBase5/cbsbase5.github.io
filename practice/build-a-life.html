<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Build a Life: a pixel life sim for Base 5. Source is ASCII only. */
:root{
  --night:#1c1730; --paper:#fbf3e4; --paper2:#f3e6cc; --ink:#2a2233; --soft:#6b5f73;
  --teal:#007291; --orange:#ef7724; --good:#2f8f5b;
  --shell:#5b4b96; --shell2:#46397a; --shellhi:#8475c8; --bez:#1b1424;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;background-color:var(--night);background-image:
  linear-gradient(45deg,#231c3d 25%,transparent 25%,transparent 75%,#231c3d 75%),
  linear-gradient(45deg,#231c3d 25%,transparent 25%,transparent 75%,#231c3d 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
a{color:inherit}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;color:var(--paper);max-width:1260px;margin:0 auto;flex-wrap:wrap}
.top .sp{flex:1}
.tbtn{color:var(--paper);text-decoration:none;font-size:14px;border:2px solid #ffffff44;padding:4px 10px;border-radius:6px;background:none}
.tbtn:hover{border-color:#fff}
.tbtn[aria-pressed=false]{opacity:.6;text-decoration:line-through}
/* the console */
.console{max-width:1260px;margin:0 auto 40px;background:linear-gradient(180deg,var(--shell),var(--shell2));border-radius:34px;padding:16px 22px 26px;
  box-shadow:inset 0 4px 0 var(--shellhi),inset 0 -8px 0 #33295e,inset 4px 0 0 #6d5db0,inset -4px 0 0 #3d3270,0 14px 0 #120d24,0 24px 50px #000a}
.cbar{display:flex;align-items:center;gap:12px;color:#d9d0ff;margin:2px 6px 12px}
.led{width:12px;height:12px;border-radius:50%;background:#7dff9a;box-shadow:0 0 8px #7dff9a;animation:blink 3s infinite}
@keyframes blink{90%{opacity:1}95%{opacity:.3}}
.brand{font:700 20px "Silkscreen",monospace;color:#ffd98a;text-shadow:0 2px 0 #2a1f4f,0 -1px 0 #a597e0;letter-spacing:1px}
.brand small{font-size:11px;color:#c9bff5;margin-left:8px;text-shadow:none}
.grille{margin-left:auto;display:grid;grid-template-columns:repeat(6,6px);gap:4px}
.grille i{width:6px;height:6px;border-radius:50%;background:#2b2250;box-shadow:inset 0 1px 0 #000}
.wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:sticky;top:8px}
@media (max-width:900px){.stage{position:relative;top:0}}
.bezel{background:var(--bez);border-radius:16px 16px 40px 16px;padding:14px 14px 10px;box-shadow:inset 0 3px 0 #000,0 2px 0 #7d6dc0}
.blabel{display:flex;justify-content:space-between;font:10px "Silkscreen",monospace;color:#8f84c0;margin-top:6px}
.screen{position:relative;border:3px solid #000;background:#000;border-radius:4px;overflow:hidden}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}
#scene{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.hotspots{position:absolute;inset:0;z-index:2}
.hot{position:absolute;border:3px dashed #fff;background:#ffffff18;border-radius:4px;color:#fff;font:700 13px "Atkinson Hyperlegible";display:flex;align-items:flex-end;justify-content:center;padding:2px;text-shadow:1px 1px 0 #000;line-height:1.1;text-align:center}
.hot:hover,.hot:focus{background:#ffffff33;outline:none;border-style:solid}
.hot.done{border-color:#7dff9a;background:#7dff9a22}
.hot.bad{border-color:#ff8a7a;background:#ff8a7a33}
.pad{display:flex;align-items:center;justify-content:space-between;margin:14px 6px 0;gap:10px}
.dpad{position:relative;width:78px;height:78px}
.dpad i{position:absolute;background:#2b2250;box-shadow:inset 0 -3px 0 #120d24,0 2px 0 #7d6dc0;border-radius:4px}
.dpad .h{left:0;top:26px;width:78px;height:26px}.dpad .v{left:26px;top:0;width:26px;height:78px}
.pills{display:flex;gap:10px}
.pill{background:#2b2250;color:#c9bff5;border:none;border-radius:20px;padding:5px 14px;font:700 11px "Silkscreen",monospace;box-shadow:inset 0 -3px 0 #120d24,0 2px 0 #7d6dc0;transform:rotate(-12deg)}
.ab{display:flex;gap:14px;transform:rotate(-14deg)}
.round{width:52px;height:52px;border-radius:50%;border:none;font:700 18px "Silkscreen",monospace;color:#1b1024;box-shadow:inset 0 -5px 0 #0004,0 3px 0 #1b1424}
.round.a{background:#ef7724}.round.b{background:#4fc1d6;margin-top:20px}
.round:active,.pill:active{transform:translateY(2px)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.meter{display:flex;gap:6px;align-items:center;background:var(--paper);border:3px solid #000;padding:5px 7px;border-radius:4px;box-shadow:0 3px 0 #000}
.meter img{width:22px;height:22px;image-rendering:pixelated;flex:none}
.meter .mw{flex:1;min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:4px}
.meter .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .bar{height:12px;background:#d9ccb3;border:2px solid #000;margin-top:2px;position:relative;overflow:hidden}
.meter .bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.25) 8px 10px)}
.meter .fill{height:100%;transition:width .6s}
.meter.low{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 #000,0 0 0 4px #ff8a7a}}
.statline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--paper);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#00000033;border:2px solid #ffffff33;padding:3px 10px;border-radius:999px;color:var(--paper)}
.chip img{width:14px;height:14px;image-rendering:pixelated}
.pbezel{background:var(--bez);border-radius:16px;padding:12px;box-shadow:inset 0 3px 0 #000,0 2px 0 #7d6dc0}
.panel{background:var(--paper);border:3px solid #000;padding:18px;border-radius:6px;min-height:300px;box-shadow:inset 0 0 0 3px #fff7e8}
.panel h2{font-family:"Silkscreen",monospace;font-size:20px;margin:0 0 6px}
.panel h3{margin:14px 0 6px;font-size:18px;font-family:"Silkscreen",monospace;font-size:15px}
.kicker{font-family:"Silkscreen",monospace;font-size:13px;color:var(--teal);text-transform:uppercase}
.muted{color:var(--soft)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#1b1020;border:3px solid #000;box-shadow:0 4px 0 #000;padding:10px 16px;font-weight:700;border-radius:4px;margin:4px 6px 4px 0;text-align:left;min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.alt{background:#fff}
.btn.teal{background:#4fc1d6}
.btn.green{background:#8fdc9b}
.btn.big{font-size:20px;padding:14px 22px;font-family:"Silkscreen",monospace}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.wide{display:flex;width:100%;justify-content:flex-start}
.btn .sub{display:block;font-weight:400;font-size:14px;font-family:"Atkinson Hyperlegible",sans-serif}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.box{border:3px solid #000;background:#fff;padding:12px;border-radius:4px;margin:8px 0}
.box.tint{background:var(--paper2)}
.note{border-left:6px solid var(--teal);background:#e6f4f7;padding:8px 12px;margin:8px 0}
.note.warm{border-color:var(--orange);background:#fdebdc}
.note.good{border-color:var(--good);background:#e2f4e8}
.note.jay{border-color:#007291;background:#dff1f6}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t td,table.t th{border-bottom:2px solid #e2d4b8;padding:5px 6px;text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{border-top:3px solid #000;font-weight:700}
table.t tr.minus td.n{color:#9b2c24}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border:2px solid #000;border-radius:999px;background:#fff;margin:2px 4px 2px 0}
.tag.money{background:#ffe7a3}.tag.health{background:#c9f0d4}.tag.happy{background:#ffd9b3}.tag.rel{background:#f7c9e1}
.tag.minus{background:#ffd0c9}
input[type=text],textarea,select,input[type=number]{font:inherit;border:3px solid #000;padding:8px 10px;border-radius:4px;background:#fff;width:100%}
textarea{min-height:80px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sw{width:36px;height:36px;border:3px solid #000;border-radius:4px;box-shadow:0 3px 0 #000}
.sw[aria-pressed=true]{outline:4px solid var(--orange);outline-offset:2px}
.fade{animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* cards */
#cardwrap{position:fixed;inset:0;background:#120e20cc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#cardwrap.on{display:flex}
.card{position:relative;background:var(--paper);border:4px solid #000;box-shadow:0 0 0 4px #ffd98a,8px 10px 0 4px #000;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;border-radius:8px}
.card.flipin{animation:flipin .55s cubic-bezier(.2,.8,.3,1.1)}
@keyframes flipin{0%{transform:perspective(1000px) rotateY(180deg) scale(.85)}100%{transform:perspective(1000px) rotateY(0) scale(1)}}
.cback{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0;
  background:repeating-linear-gradient(45deg,#ef7724 0 14px,#d9651a 14px 28px);animation:backfade .55s}
.cback span{font:700 64px "Silkscreen",monospace;color:#ffd98a;text-shadow:4px 4px 0 #1b1424;background:#5b4b96;border:4px solid #1b1424;border-radius:50%;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
@keyframes backfade{0%,48%{opacity:1}52%,100%{opacity:0}}
.cscene{display:block;width:100%;image-rendering:pixelated;border:3px solid #000;border-radius:4px;margin-bottom:8px;background:#bfe8ff}
.card h2{font-family:"Silkscreen",monospace;font-size:20px;text-align:center;margin:4px 0 8px}
.card .fx{margin-top:8px}
.card.swapin{animation:swapin .22s ease-out}
@keyframes swapin{0%{opacity:.2;transform:translateY(6px)}100%{opacity:1;transform:none}}
.ysub{font:700 15px "Silkscreen",monospace;margin:14px 0 6px}
.whylist{display:grid;gap:8px}
.whylist .why{background:#fff;border:2px solid #000;border-radius:6px;padding:6px 8px}
.whylist .why img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-2px;margin-right:6px}
.whylist .rs{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:14px}
.whylist .rs .up{color:#2a7a4a}.whylist .rs .dn{color:#9b2c24}
.tk{display:inline-block;width:16px;height:16px;border:3px solid #000;background:#fff;border-radius:3px;margin-right:8px;vertical-align:-3px;flex:none;position:relative}
.tk.on{background:#3fa66b}
.tk.on::after{content:"";position:absolute;left:3px;top:-1px;width:4px;height:8px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lenopts{display:grid;gap:8px;margin-top:8px}
.newtag{display:inline-block;background:#ffd34d;border:2px solid #000;border-radius:4px;font:700 11px "Silkscreen",monospace;padding:1px 6px;margin-left:6px;vertical-align:2px}
.afford{border:3px solid #000;border-radius:6px;padding:6px 10px;margin:8px 0;background:#e8f6ec}
.afford.short{background:#fde8e4}
.readbtn{position:absolute;top:8px;right:8px;z-index:2;font:700 12px "Silkscreen",monospace;background:#fff;border:3px solid #000;border-radius:4px;box-shadow:0 2px 0 #000;padding:3px 8px;cursor:pointer}
/* wheel */
.wheelbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#wheel{width:190px;height:190px}
/* drag and drop */
.dz{min-height:52px;border:3px dashed #8a7c6a;padding:6px;border-radius:4px;background:#fffdf7}
.dz.over{border-color:var(--orange);background:#fff1e3}
.dchip{display:inline-block;background:#fff;border:3px solid #000;padding:6px 10px;margin:3px;border-radius:4px;cursor:grab;user-select:none;font-size:15px;box-shadow:0 3px 0 #000}
.dchip.q{background:#d9f1f7}.dchip.e{background:#ffe7a3}.dchip.s{background:#c9f0d4}.dchip.i{background:#f7c9e1}
.dchip.match{outline:3px solid var(--orange)}
.dchip.wig{animation:wig .3s}
@keyframes wig{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cvpaper{background:#fff;border:3px solid #000;padding:12px;box-shadow:4px 4px 0 #000}
.cvpaper h4{margin:10px 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--teal)}
/* activity */
.act .scenario{background:#fff;border:3px solid #000;padding:12px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid #000;padding:10px 12px;margin:6px 0;border-radius:4px;font-weight:700;box-shadow:0 3px 0 #000}
.opt:hover{background:#fff4e6}
.opt.right{background:#c9f0d4}.opt.wrong{background:#ffd0c9}
.word{display:inline-block;padding:2px 4px;margin:1px;border:2px solid transparent;border-radius:3px;background:none;font-size:18px}
.word:hover{border-color:#000;background:#fff4e6}
.word.right{background:#c9f0d4;border-color:#000}.word.wrong{background:#ffd0c9;border-color:#000}
.tt{border-collapse:collapse;margin:6px 0;font-size:15px}
.tt td,.tt th{border:2px solid #000;padding:4px 10px;text-align:center;background:#fff}
.tt th{background:#ffe7a3}
.goals label{display:flex;gap:10px;align-items:flex-start;border:3px solid #000;background:#fff;padding:8px 10px;margin:6px 0;border-radius:4px;cursor:pointer}
.goals input{width:22px;height:22px;margin-top:2px}
.dl{display:flex;justify-content:space-between;gap:10px;align-items:center;border:3px solid #000;background:#fff7e0;padding:8px 10px;margin:6px 0;border-radius:4px}
.dl .turns{font-family:"Silkscreen",monospace;font-size:13px;background:#000;color:#ffd98a;padding:3px 8px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tabs button{border:3px solid #000;background:#fff;padding:6px 12px;font:700 13px "Silkscreen",monospace;border-radius:4px;box-shadow:0 3px 0 #000}
.tabs button[aria-selected=true]{background:#ffd98a;transform:translateY(2px);box-shadow:0 1px 0 #000}
.listing{border:3px solid #000;background:#fff;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:6px;border-radius:4px}
.listing .price{font:700 20px "Silkscreen",monospace;text-align:right}
/* money chart */
.mchart{border:3px solid #000;background:#fff;border-radius:4px;padding:10px;margin:8px 0}
.mbar{display:flex;height:34px;border:3px solid #000;border-radius:3px;overflow:hidden;background:#eee}
.mbar div{height:100%;border-right:2px solid #000;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 8px)}
.mbar div:last-child{border-right:none}
.mleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:8px;font-size:14px}
.mleg span{display:flex;align-items:center;gap:6px}
.mleg i{width:14px;height:14px;border:2px solid #000;flex:none}
.mrow{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.mrow .lbl{width:92px;flex:none;font-weight:700}
.mrow .trk{flex:1;height:18px;border:3px solid #000;background:#eee}
.mrow .trk div{height:100%}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
#banner{position:fixed;left:50%;top:16%;transform:translate(-50%,-60px) scale(.6);opacity:0;visibility:hidden;z-index:81;pointer-events:none;text-align:center;transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s,visibility .3s}
#banner.on{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible}
#banner .bt{font:700 40px "Silkscreen",monospace;color:#ffd98a;background:#5b4b96;border:5px solid #1b1424;padding:10px 26px;border-radius:8px;text-shadow:3px 3px 0 #1b1424;box-shadow:0 6px 0 #1b1424;white-space:nowrap;animation:wobble .6s infinite alternate}
#banner .bs{display:inline-block;margin-top:8px;font:700 16px "Atkinson Hyperlegible";background:#fff;border:3px solid #1b1424;padding:4px 12px;border-radius:6px}
@keyframes wobble{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.floatnum{position:fixed;z-index:90;transform:translate(-50%,0);font:700 20px "Silkscreen",monospace;text-shadow:2px 2px 0 #1b1424,-1px -1px 0 #1b1424;pointer-events:none;animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000;color:#ffd98a;padding:8px 16px;border:3px solid #ffd98a;font:700 14px "Silkscreen",monospace;z-index:85;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.title-hero{text-align:center}
.title-hero .madeby{font:700 14px "Silkscreen",monospace;color:#007291;margin:0 0 6px}
#splash{position:fixed;inset:0;z-index:300;background:#0b0d2a;cursor:pointer;display:none}
#splash canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#splash.out{animation:splashOut .9s forwards}
@keyframes splashOut{0%{opacity:1;transform:scale(1);filter:brightness(1)}20%{filter:brightness(2.2)}100%{opacity:0;transform:scale(1.25);filter:brightness(1)}}
.title-hero .big{font:700 34px "Silkscreen",monospace;color:#ef7724;text-shadow:3px 3px 0 #1b1424;margin:4px 0}
.jayline{display:flex;gap:10px;align-items:center;background:#dff1f6;border:3px solid #000;border-radius:6px;padding:6px 10px;margin:8px 0}
.jayline canvas{width:42px;height:66px;image-rendering:pixelated;flex:none}
/* maths pictures and help */
.mvis{margin:10px 0 2px;padding:10px;border:2px dashed #c9b99a;border-radius:6px;background:#fffdf7}
.mrowv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.coin{display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:3px solid #1b1424;border-radius:50%;width:46px;height:46px;font-size:14px;box-shadow:0 2px 0 #1b1424}
.coin.note{border-radius:4px;width:62px;height:36px}
.ptag{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:3px solid #1b1424;border-radius:6px 14px 14px 6px;padding:4px 12px 4px 10px;min-width:62px;box-shadow:2px 2px 0 #1b1424}
.ptag span{font-size:12px;color:#6b5f73}.ptag b{font:700 18px "Silkscreen",monospace}
.itm{font-size:28px;line-height:1}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;width:34px;justify-content:center}.dots i{width:9px;height:9px;border-radius:50%;border:1px solid #1b1424}
.cup{display:inline-flex;align-items:flex-start;justify-content:center;width:44px;height:52px;border:3px solid #1b1424;border-top:none;border-radius:0 0 12px 12px;background:#f7d9a8;padding-top:6px}
.hblk{display:inline-flex;flex-direction:column;align-items:center;border:3px solid #1b1424;background:#c9f0d4;border-radius:4px;padding:3px 8px}
.hblk small{font-size:11px}.hblk b{font-size:15px}
.halfbar{margin-top:8px}.halfbar span{font-size:13px}.halfbar div{display:flex;width:240px;height:36px;border:3px solid #1b1424;margin-top:3px}
.halfbar i{flex:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;background:#ffd34d}.halfbar i.off{background:#eee;border-left:3px dashed #1b1424;color:#6b5f73;font-size:13px}

      if (t > 4200 && Math.floor(now / 550) % 2) pixText("TAP OR PRESS ANY KEY", W / 2, ly + 7 * ls + 14, H > 420 ? 2 : 1, "#ffffff", "#1b1424");
    }
    /* boot fade */
    if (t < 900) { CX.fillStyle = "rgba(11,13,42," + clamp(1 - (t - 400) / 500, 0, 1) + ")"; CX.fillRect(0, 0, W, H); if (t < 700) pixText("B5 POCKET", W / 2, H / 2 - 4, 1, "#c9bff5"); }
    WORLD.season = oldSeason; WORLD.base = oldBase; WORLD.wUntil = oldW;
  } catch (e) { if (!splashLoop.err) { splashLoop.err = 1; console.error(e); } }
  tod = savedTod; CX = saved;

}

  function (n) { if (!hasTrait("Kind")) return false; return card("Kindness comes back", "heart", "Someone you helped years ago gets in touch to say thank you.", { rel: 5, happy: 4 }, n); }
];
function randomAdultEvent(next) {
  var order = shuffle(ADULT_EVENTS);
  for (var i = 0; i < order.length; i++) { if (order[i](next) !== false) return; }
  next();
}

/* =========================================================
   LIFE REPORT
   ========================================================= */
function endLife() {
  closeCard(); S.phase = "report"; pushHistory(); save(); showReport(); setTimeout(function () { celebrate("LIFE COMPLETE!", S.name + ", age " + S.age); }, 300);
}
function balanceVerdict() {
  var ks = ["money", "health", "happy", "rel"];
  var low = ks.filter(function (k) { return S.meters[k] < 40; }).map(function (k) { return MLAB[k]; });
  var high = ks.filter(function (k) { return S.meters[k] >= 60; }).map(function (k) { return MLAB[k]; });
  function and(l) { return l.length > 1 ? l.slice(0, -1).join(", ") + " and " + l[l.length - 1] : l[0]; }
  if (!low.length) return "A balanced, sustainable life: all four parts of life ended up in a good place" + (high.length ? ", with " + and(high) + " doing really well." : ".");
  if (low.length === 1) return "A mostly balanced life. " + low[0] + " could do with some attention" + (high.length ? ", but " + and(high) + " went really well." : ".");
  return "A life with some hard parts: " + and(low) + " ended up low." + (high.length ? " " + and(high) + " went well." : "") + " That is real too, and every choice taught you something.";
}
var LOGICON = { qual: "grad", grad: "grad", school: "book", book: "book", maths: "book", work: "case", home: "house", house: "house", owned: "key", landlord: "house", money: "coin", coin: "coin", car: "car", family: "people", life: "smile", goal: "star", star: "star", trait: "star", setback: "warn", letter: "letter", start: "star" };
function reportText() {
  var t = "BUILD A LIFE: life report\n" + S.name + (S.initials ? " (" + S.initials + ")" : "") + ", lived to " + S.age + " (" + lenInfo().name.toLowerCase() + " game)\n\n";
  t += balanceVerdict() + "\nMoney " + S.meters.money + ", Health " + S.meters.health + ", Happiness " + S.meters.happy + ", Relationships " + S.meters.rel + "\n\n";
  t += "Goals:\n" + S.goals.map(function (g) { return "- " + goalName(g.id) + ": " + (g.done ? "reached" : "not yet"); }).join("\n") + (S.customGoal ? "\n- " + S.customGoal + ": " + (S.customAnswer || "not answered") : "") + "\n\n";
  t += "Qualifications:\n" + qualList().map(function (q) { return "- " + q; }).join("\n") + "\n\n";
  t += "Work: " + workList().join("; ") + "\nHomes: " + S.homes.map(function (h) { return h.title + " (from " + h.age + ")"; }).join("; ") + "\n\n";
  t += "Savings " + money(S.cash, 0) + (S.debt ? ", owed " + money(S.debt, 0) : "") + (S.studentLoan ? ", student loan " + money(S.studentLoan, 0) : "") + "\n\n";
  t += "Proudest choices:\n" + S.proud.map(function (p) { return "- " + p; }).join("\n") + "\n\nNext time I would: " + (S.reflection || "") + "\n";
  return t;
}
function qualList() {
  var q = [], g = S.quals.gcse;
  if (g) { q.push("GCSE Maths " + g.maths + ", English " + g.eng + ", Science " + g.sci); g.opts.forEach(function (o) { q.push("GCSE " + o.name + " " + o.grade); }); }
  if (S.quals.fsMaths) q.push("Functional Skills Maths Level 2");
  if (S.quals.fsEng) q.push("Functional Skills English Level 2");
  if (S.quals.post16) q.push(S.quals.post16.name);
  if (S.quals.degree) q.push("Degree: " + S.quals.degree.subject + " (" + S.quals.degree.cls + ")");
  (S.quals.extra || []).forEach(function (x) { q.push(x.name); });
  if (S.licence) q.push("Driving licence");
  return q;
}
function workList() { var w = S.jobHistory.map(function (j) { return j.title + " (" + (j.years >= 1 ? plural(Math.round(j.years), "year") : "under a year") + ")"; }); if (S.job) w.push(S.job.title + " (now)"); return w.length ? w : ["No jobs yet"]; }
function showReport() {
  document.querySelector(".console").style.display = "none"; $("cardwrap").classList.remove("on");
  var r = $("report"); r.style.display = "block"; setMusic("report");
  var picks = S.log.filter(function (l) { return ["start", "setback", "money"].indexOf(l.kind) < 0 && l.text.indexOf("Was offered") !== 0 && l.text.indexOf("Set goals") !== 0 && l.text.indexOf("Started adult life") !== 0; });
  var h = '<div class="rep"><div class="noprint row" style="justify-content:space-between;margin-bottom:10px"><button class="btn" id="rpPrint">Print</button><button class="btn teal" id="rpSend">Send to Jay</button><button class="btn alt" id="rpMail">Email app</button><button class="btn alt" id="rpCopy">Copy</button><button class="btn alt" id="rpNew">Start a new life</button></div>' +
    '<div class="rephead"><canvas id="repMe" width="28" height="44" aria-hidden="true"></canvas><div><h1>Life report</h1><p><b>' + esc(S.name) + "</b>" + (S.initials ? " (" + esc(S.initials) + ")" : "") + ", lived to " + S.age + ". Grew up in a " + esc(AREAS[S.bg.area].name.toLowerCase()) + ".</p><p class=\"small muted\">" + lenInfo().name + " game</p></div></div>" +
    '<p style="font-size:18px"><b>' + esc(balanceVerdict()) + "</b></p>" +
    '<div class="row">' + ["money", "health", "happy", "rel"].map(function (k) { return '<span class="tag ' + k + '" style="font-size:14px">' + MLAB[k] + " " + S.meters[k] + "</span>"; }).join("") + "</div>" +
    "<h2>Your life in four lines</h2><canvas id=\"repChart\" width=\"760\" height=\"260\"></canvas>" +
    '<div class="cols"><div><h2>Goals</h2><ul>' + (S.goals.length ? S.goals.map(function (g) { return "<li>" + (g.done ? "<b>Reached:</b> " : "Not yet: ") + esc(goalName(g.id)) + "</li>"; }).join("") : "<li>No goals picked</li>") + "</ul>" +
    (S.customGoal ? '<p><b>Your own goal:</b> ' + esc(S.customGoal) + '</p><div class="row noprint">' + ["Yes", "Partly", "Not this time"].map(function (a) { return '<button class="btn ' + (S.customAnswer === a ? "green" : "alt") + '" data-cga="' + a + '">' + a + "</button>"; }).join("") + '</div><p class="small">Did you get there? <b>' + esc(S.customAnswer || "") + "</b></p>" : "") +
    "<h2>Qualifications</h2><ul>" + qualList().map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul></div>" +
    "<div><h2>Work</h2><ul>" + workList().map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul><h2>Homes</h2><ul>" + S.homes.map(function (x) { return "<li>" + esc(x.title) + " (from age " + x.age + ")</li>"; }).join("") + "</ul>" +
    "<h2>Money at the end</h2><ul><li>Savings: " + money(S.cash, 0) + "</li>" + (S.mm ? "<li>Money moments done: " + S.mm + "</li>" : "") + (S.debt ? "<li>Owed: " + money(S.debt, 0) + "</li>" : "") + (S.studentLoan ? "<li>Student loan: " + money(S.studentLoan, 0) + "</li>" : "") + "</ul></div></div>" +
    "<h2>Three choices I am proud of</h2><p class='small noprint'>Tap up to three moments from your life. The ones marked with a star might be a good place to start.</p><div id=\"proudList\"></div>" +
    "<h2>Something I would do differently next time</h2><textarea id=\"refl\" class=\"noprint\" placeholder=\"Totally optional\">" + esc(S.reflection) + '</textarea><p id="reflPrint">' + esc(S.reflection) + "</p>" +
    '<h2>Key moments</h2><ul class="small timeline">' + S.log.filter(function (l) { return l.text.indexOf("Was offered") !== 0; }).slice(-30).map(function (l) { return '<li><img loading="lazy" decoding="async" src="' + iconSrc(LOGICON[l.kind] || "smile") + '" alt="">Age ' + l.age + ": " + esc(l.text) + "</li>"; }).join("") + "</ul></div>";
  r.innerHTML = h;
  var sugW = { qual: 5, grad: 5, goal: 5, owned: 4, home: 3, work: 3, trait: 2, life: 2, family: 2 };
  var sug = picks.map(function (l, i) { return [sugW[l.kind] || 0, i]; }).filter(function (x) { return x[0]; }).sort(function (a2, b2) { return b2[0] - a2[0] || b2[1] - a2[1]; });
  var sugKinds = [], sugIx = [];
  sug.forEach(function (x) { var k = picks[x[1]].kind; if (sugIx.length < 3 && sugKinds.indexOf(k) < 0) { sugKinds.push(k); sugIx.push(x[1]); } });
  sug.forEach(function (x) { if (sugIx.length < 3 && sugIx.indexOf(x[1]) < 0) sugIx.push(x[1]); });
  function drawProud() {
    $("proudList").innerHTML = picks.map(function (l, i) { var on = S.proud.indexOf(l.text) >= 0; return '<button class="btn ' + (on ? "green" : "alt") + (on ? "" : " noprint") + '" style="font-size:14px;min-height:34px;padding:4px 10px" data-pr="' + i + '">' + tick(on) + (sugIx.indexOf(i) >= 0 && !on ? '<span class="sr">Suggested: </span><span aria-hidden="true" style="color:#d9a21b">&#9733; </span>' : "") + "Age " + l.age + ": " + esc(l.text) + "</button>"; }).join("");
    onAll("[data-pr]", function () { var t = picks[+this.getAttribute("data-pr")].text, at = S.proud.indexOf(t); if (at >= 0) S.proud.splice(at, 1); else { if (S.proud.length >= 3) S.proud.shift(); S.proud.push(t); } save(); drawProud(); });
  }
  S.proud = (S.proud || []).filter(function (p) { return typeof p === "string"; });
  drawProud(); drawChart();
  (function () { var c = $("repMe"); if (!c) return; var x = c.getContext("2d"); x.imageSmoothingEnabled = false; var ok = ["money", "health", "happy", "rel"].filter(function (k) { return S.meters[k] >= 40; }).length; x.drawImage(heroSprite(myLook(), "adult", ok >= 3 ? "happy" : "neutral", "stand", 0), 0, 0); })();
  $("refl").oninput = function () { S.reflection = this.value; $("reflPrint").textContent = this.value; save(); };
  onAll("[data-cga]", function () { S.customAnswer = this.getAttribute("data-cga"); save(); showReport(); });
  on("rpPrint", function () { window.print(); });
  on("rpSend", function () { window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(EMAIL) + "&su=" + encodeURIComponent("Build a Life report" + (S.initials ? ": " + S.initials : "")) + "&body=" + encodeURIComponent(reportText()), "_blank"); });
  on("rpMail", function () { location.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent("Build a Life report" + (S.initials ? ": " + S.initials : "")) + "&body=" + encodeURIComponent(reportText()); });
  on("rpCopy", function () { var t = reportText(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { toast("Copied"); }, function () { toast("Could not copy"); }); });
  on("rpNew", function () { S.ended = true; save(); r.style.display = "none"; document.querySelector(".console").style.display = ""; startCreate(); });
}
function drawChart() {
  var c = $("repChart"), x = c.getContext("2d"), W = c.width, H = c.height, pad = 34;
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  var hs = S.history.slice().sort(function (a, b) { return a.age - b.age; });
  if (hs.length < 2) return;
  var a0 = hs[0].age, a1 = hs[hs.length - 1].age;
  function X(a) { return pad + (a - a0) / Math.max(1, a1 - a0) * (W - pad * 2); }
  function Y(v) { return H - pad - v / 100 * (H - pad * 2); }
  x.strokeStyle = "#ddd"; x.lineWidth = 1; x.font = "12px Atkinson Hyperlegible, sans-serif"; x.fillStyle = "#555";
  [0, 50, 100].forEach(function (v) { x.beginPath(); x.moveTo(pad, Y(v)); x.lineTo(W - pad, Y(v)); x.stroke(); x.fillText(String(v), 4, Y(v) + 4); });
  for (var a = a0; a <= a1; a += 5) x.fillText(String(a), X(a) - 6, H - 10);
  x.fillText("Age", W - pad + 4, H - 10);
  var cols = { money: "#d9a21b", health: "#3fa66b", happy: "#f08a24", rel: "#d65a9a" };
  Object.keys(cols).forEach(function (k, i) {
    x.strokeStyle = cols[k]; x.lineWidth = 3; x.beginPath();
    hs.forEach(function (h, j) { if (j) x.lineTo(X(h.age), Y(h[k])); else x.moveTo(X(h.age), Y(h[k])); }); x.stroke();
    var last = hs[hs.length - 1]; x.fillStyle = cols[k]; x.fillText(MLAB[k] + " " + last[k], W - pad - 130, 22 + i * 15);
  });
}

$("menuBtn").onclick = function () {
  var ch = [{ label: "Carry on", fn: function () {} }];
  if (S && S.phase === "adult") ch.push({ label: "Finish this life and see my life report", fn: function () { showCard({ title: "Finish this life?", icon: "star", text: "You will see your life report.", choices: [{ label: "Yes", fn: endLife }, { label: "Keep living", cls: "alt", fn: function () {} }] }); } });
  if (S && (S.phase === "adult" || S.phase === "board")) ch.push({ label: "Game length: " + lenInfo().name, sub: "Change how fast the game moves", fn: function () {
    showCard({ title: "Game length", icon: "clock", text: "You will still live to 35 with the same big moments. This changes how far you move on the board and how many years each adult turn covers.", html: '<div class="lenopts">' + lengthButtons(lenKey()) + "</div>", choices: [{ label: "Keep it as it is", cls: "alt" }], onShow: function (c) {
      [].forEach.call(c.querySelectorAll("[data-len]"), function (b) { b.onclick = function () { S.len = b.getAttribute("data-len"); try { localStorage.setItem("b5.practice.buildalife.len", S.len); } catch (e) {} save(); closeCard(); toast("Game length: " + lenInfo().name); if (S.phase === "board") boardPanel(); else toHub("year"); }; });
    } });
  } });
  if (S && (S.phase === "adult" || S.phase === "board")) ch.push({ label: "Wardrobe", fn: function () { openWardrobe(function () { if (S.phase === "board") boardPanel(); else toHub(); }); } });
  ch.push({ label: "How to play", fn: function () { showCard({ title: "How to play", icon: "book", html: "<p><b>On the board</b>, spin to move. Choices shape your traits; learning moments earn qualifications.</p><p><b>As an adult</b>, each turn you can do up to " + lenInfo().actions + " things, check your money, apply for jobs and look for homes. In a " + lenInfo().name.toLowerCase() + " game each turn is " + (lenInfo().span > 1 ? lenInfo().span + " years" : "one year") + ".</p><p>Try to keep all four meters out of the red. Nothing ends the game: setbacks always come with a way forward.</p><p class='small'>Your life saves on this device automatically.</p>", choices: [{ label: "Got it" }] }); } });
  ch.push({ label: "Back to the title screen", cls: "alt", fn: function () { save(); $("report").style.display = "none"; document.querySelector(".console").style.display = ""; startTitle(); } });
  showCard({ title: "Menu", icon: "star", choices: ch });
};
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && cardOpen) { /* cards need a choice; do nothing */ } });
(function boot() {
  var sv = loadSave();
  if (sv && sv.phase === "report") { S = sv; }
  startTitle();
  showSplash();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { boardCache = {}; });
  renderAudioBtns();
  $("musBtn").onclick = toggleMusic; $("sndBtn").onclick = toggleSound;
  $("startBtn").onclick = function () { $("menuBtn").click(); };
  $("selBtn").onclick = function () { if (S && (S.phase === "adult" || S.phase === "board") && !cardOpen) openWardrobe(function () { if (S.phase === "board") boardPanel(); else toHub(); }); else toast("SELECT opens your wardrobe"); };
  $("aBtn").onclick = function () {

  };
