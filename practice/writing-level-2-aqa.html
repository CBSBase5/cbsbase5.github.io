/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] }) }
function words(t){ t = String(t || "").trim(); return t ? t.split(/\s+/).length : 0 }
function sentences(t){ return String(t || "").split(/[.!?]+/).map(function(s){ return s.trim() }).filter(function(s){ return s.length > 0 }) }
function paras(t){ return String(t || "").split(/\n\s*\n/).map(function(s){ return s.trim() }).filter(function(s){ return s.length > 0 }) }
function emailText(E){
  var out = [];
  if(E.subject) out.push("Subject: " + E.subject);
  if(E.greet) out.push(E.greet);
  if(E.body) out.push(E.body);
  if(E.sign) out.push(E.sign);
  if(E.name) out.push(E.name);
  return out.join("\n\n");
}
function articleText(A){ return (A.head ? A.head + "\n\n" : "") + (A.body || "") }
function insertAt(el, txt){
  if(!el) return;
  var s = el.selectionStart || 0, e = el.selectionEnd || 0, v = el.value;
  var before = v.slice(0, s), after = v.slice(e);
  var pad = before && !/\s$/.test(before) ? " " : "";
  el.value = before + pad + txt + after;
  var pos = (before + pad + txt).length;
  el.focus(); el.setSelectionRange(pos, pos);
  el.dispatchEvent(new Event("input"));
}
function ladder(bands){
  return '<div class="ladder">' + bands.map(function(b){
    return '<div class="band' + (b.top ? " top" : "") + '"><div class="bh"><span class="bm">' + esc(b.m) + '</span><span class="bt">' + esc(b.t) + '</span></div><ul>' +
      b.li.map(function(l){ return "<li>" + esc(l) + "</li>" }).join("") + "</ul></div>";
  }).join("") + "</div>";
}

  else if(longOnes) out.push([false, longOnes + " sentence" + (longOnes > 1 ? "s are" : " is") + " over 35 words. That is usually where a full stop went missing."]);
  else out.push([true, ss.length + " sentences, none of them runaway."]);
  if(ss.length > 3) out.push(shortOnes && !longOnes && ss.some(function(s){ return words(s) > 18 }) ?
    [true, "A mix of shorter and longer sentences, which is what a range of sentence structures means."] :
    [null, "Sentence lengths look similar. One short punchy sentence among the longer ones shows range."]);

  var noCap = ss.filter(function(s){ return /^[a-z]/.test(s) }).length;
  out.push(noCap ? [false, noCap + " sentence" + (noCap > 1 ? "s start" : " starts") + " with a small letter."] : [true, "Every sentence starts with a capital letter."]);
  out.push(/\bi\b/.test(t) ? [false, "There is a lower case i on its own somewhere. It is always I."] : [true, "No stray lower case i."]);

  var inf = INFORMAL.filter(function(p){ return low.indexOf(p[0]) > -1 });
  out.push(inf.length ? [false, "Chatty words spotted: " + inf.map(function(p){ return p[0].trim() }).join(", ") + ". Swap them for something more formal."] : [true, "No text speak or chatty words found."]);
  if(/!!/.test(t)) out.push([false, "More than one exclamation mark in a row. One is plenty."]);

  var mods = MODALS.filter(function(m){ return low.indexOf(m) > -1 });
  out.push(mods.length ? [true, "Modality words used: " + mods.join(", ") + ". AQA names these in the SPaG marks."] :
    [null, "No modality words yet (would, could, might, should). One or two would tick a box the mark scheme names."]);

  var punct = [];
  if(/:/.test(t)) punct.push("a colon");
  if(/;/.test(t)) punct.push("a semicolon");
  if(/\(/.test(t)) punct.push("brackets");
  if(/'/.test(t)) punct.push("an apostrophe");
  if(/"/.test(t)) punct.push("speech marks");
  if(/,/.test(t)) punct.push("commas");
  out.push(punct.length > 1 ? [true, "Punctuation range: " + punct.join(", ") + "."] :
    [null, "Only basic punctuation so far. A range is asked for: a colon, a pair of brackets or a quotation would show it."]);

  (o.cover || []).forEach(function(c){
    var hit = c.k.some(function(k){ return low.indexOf(k) > -1 });
    out.push(hit ? [true, "Looks like you covered " + c.name + "."] : [null, "I cannot see anything about " + c.name + " yet."]);
  });
  return out;
}

var COVER1 = [
  {name:"a greeting to Ashraf", k:["dear ashraf","hello ashraf","hi ashraf"]},
  {name:"reasons (because, so that, this would)", k:["because","so that","this would","it would","reason"]},
  {name:"a sign off", k:["yours sincerely","yours faithfully","kind regards","best wishes"]}
];
var COVER2 = [
  {name:"strengths", k:["staff","classes","pool","steam","safe","friendly","equipment","membership"]},
  {name:"weaknesses", k:["however","drawback","although","but ","weakness","disappoint","older","clean","busy","waiting","limited"]},
  {name:"the prices", k:["5","20","180","15","price","cost","membership"]},
  {name:"a quotation", k:["\"","said","told me"]}
];

/* ============================================================
   RENDER
   ============================================================ */

var grid = document.getElementById("grid"), pane = document.getElementById("pane"), briefEl = document.getElementById("brief");

function briefFor(task){
  if(task === 1){
    return '<span class="tag">Question 1: the leaflet</span>' +
      '<div class="leaflet"><h3>Bringing people in our community together</h3>' +
      '<p>We have received funding from the National Lottery to support local events.</p>' +
      '<p>We are looking for ideas for local events which would help to bring the community together. So anything that would get people out of their houses, talking to each other and enjoying themselves together.</p>' +
      '<p>Send us ideas about what you think might work. Ideas could include food, music, dance, competitions, stalls: anything at all can be considered. Give us good reasons for your suggestions, to help us to decide.</p>' +
      '<p>To contribute, send an email to Ashraf at: livelylocal@email.com</p></div>' +
      '<h2>The task</h2><p>Write an email to Ashraf responding to the council request. Approximately 150 to 200 words.</p>' +
      '<ul><li>6 marks for the writing</li><li>3 marks for spelling, punctuation and grammar</li><li>About 20 minutes</li></ul>';
  }
  if(task === 2){
    return '<span class="tag">Question 2: your notes</span>' +
      '<div class="notepad"><h3>Carroll\'s Fitness Centre and Gym</h3>' +
      '<p>6 Colwyn Park Terrace, Wickby<br>Manager: Gina Carroll (gina@Fitness.co.uk)</p>' +
      '<ul><li>Safe environment</li><li>Trained staff</li><li>Classes</li><li>Latest equipment</li><li>Swimming pools</li><li>Steam room</li></ul>' +
      '<p>Prices: single visit ' + P + '5<br>Monthly membership: ' + P + '20 per month<br>Annual membership: ' + P + '180 (so ' + P + '15 per month)</p></div>' +
      '<h2>The task</h2><p>You are a reporter from the Wickby Post. Write an article about the new Fitness Centre and Gym, including any strengths and weaknesses you found.</p>' +
      '<ul><li>12 marks for the writing</li><li>9 marks for spelling, punctuation and grammar</li><li>About 40 minutes</li></ul>';
  }
  return "";
}

function stepDone(st){
  if(st.kind === "quiz") return st.items.every(function(q){ return S.quiz[q.id] != null });
  if(st.kind === "sort") return st.items.every(function(x, i){ return S.sort[st.id + i] != null });
  if(st.kind === "write1") return words(S.email.body) > 0;
  if(st.kind === "write2") return words(S.article.body) > 0;
  if(st.kind === "check") return st.which === 1 ? S.checked1 : S.checked2;
  if(st.kind === "plan") return (st.task === 1 ? S.plan1 : S.plan2).some(function(t){ return words(t) > 0 });
  return false;
}

function progress(){
  var step = STEPS[S.idx];
  document.getElementById("progBar").style.width = Math.round((S.idx + 1) / STEPS.length * 100) + "%";
  document.getElementById("progTxt").textContent = "Step " + (S.idx + 1) + " of " + STEPS.length;
  document.getElementById("progSide").textContent = step.task === 1 ? "Question 1: the email" : (step.task === 2 ? "Question 2: the article" : "");
  var h = "";
  STEPS.forEach(function(st, i){
    h += '<button class="sdot' + (i === S.idx ? " on" : (stepDone(st) ? " did" : "")) + '" data-i="' + i + '" aria-label="Step ' + (i + 1) + '">' + (i + 1) + "</button>";
  });
  var dots = document.getElementById("dots");
  dots.innerHTML = h;
  dots.querySelectorAll(".sdot").forEach(function(b){ b.addEventListener("click", function(){ go(+b.dataset.i) }) });
}

function go(i){
  S.idx = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function actions(extraLeft){
  return '<div class="actions"><div class="l">' + (S.idx > 0 ? '<button class="wbtn" id="back">Back</button>' : "") + (extraLeft || "") + '</div>' +
    '<div class="r">' + (S.idx < STEPS.length - 1 ? '<button class="wbtn main" id="next">Next</button>' : "") + "</div></div>";
}
function wireActions(){
  var b = document.getElementById("back"), n = document.getElementById("next");
  if(b) b.addEventListener("click", function(){ go(S.idx - 1) });
  if(n) n.addEventListener("click", function(){ go(S.idx + 1) });
}

function render(){
  var st = STEPS[S.idx];
  grid.className = "w-grid" + (st.task ? "" : " solo");
  briefEl.innerHTML = briefFor(st.task);
  var head = '<div class="whead"><span class="pill' + (st.task === 1 ? " t" : (st.task === 2 ? " o" : " p")) + '">' +
    (st.task === 1 ? "Question 1" : (st.task === 2 ? "Question 2" : "The paper")) + '</span>' +
    (st.kind === "learn" ? '<span class="pill y">Read</span>' : "") +
    ((st.kind === "quiz" || st.kind === "sort") ? '<span class="pill y">Have a go</span>' : "") +
    (st.kind === "model" ? '<span class="pill y">Model answer</span>' : "") + "</div>" +
    "<h2>" + esc(st.title) + "</h2>" + (st.sub ? '<p class="small">' + esc(st.sub) + "</p>" : "");

  if(st.kind === "learn") renderLearn(st, head);
  else if(st.kind === "quiz") renderQuiz(st, head);
  else if(st.kind === "sort") renderSort(st, head);
  else if(st.kind === "plan") renderPlan(st, head);
  else if(st.kind === "write1") renderEmail(st, head);
  else if(st.kind === "write2") renderArticle(st, head);
  else if(st.kind === "check") renderCheck(st, head);
  else if(st.kind === "model") renderModel(st, head);
  else if(st.kind === "finish") renderFinish(st, head);
  progress();
  wireActions();
}

function renderLearn(st, head){
  pane.className = "wcard learn";
  pane.innerHTML = head + st.body() + actions();
}

function renderQuiz(st, head){
  pane.className = "wcard";
  var h = head;
  st.items.forEach(function(q){
    var picked = S.quiz[q.id];
    h += '<hr class="hr"><p><span class="pill y">' + esc(q.tag) + '</span></p><p><b>' + esc(q.q) + "</b></p>" +
      '<div class="opts2">' + q.opts.map(function(o, i){
        return '<button class="optb' + (picked != null ? (i === q.ans ? " right" : (i === picked ? " wrong" : "")) : "") + '" data-q="' + q.id + '" data-i="' + i + '"' + (picked != null ? " disabled" : "") + '>' + esc(o) + "</button>";
      }).join("") + "</div>";
    if(picked != null) h += '<div class="fb"><b>' + (picked === q.ans ? "Yes." : "Not this one.") + "</b> " + esc(q.why) + "</div>";
  });
  pane.innerHTML = h + actions();
  pane.querySelectorAll(".optb").forEach(function(b){
    b.addEventListener("click", function(){ S.quiz[b.dataset.q] = +b.dataset.i; save(); render() });
  });
}

function renderSort(st, head){
  pane.className = "wcard";
  var h = head + '<p class="small">Strength, weakness, or both? Tap one. The note explains what a reporter would do with it.</p>';
  st.items.forEach(function(x, i){
    var key = st.id + i, got = S.sort[key];
    h += '<div class="sortrow' + (got != null ? " ok" : "") + '"><span class="nm">' + esc(x.n) + "</span>" +
      ["s","w","b"].map(function(v){
        var lab = v === "s" ? "Strength" : (v === "w" ? "Weakness" : "Both");
        return '<button class="sortb" data-k="' + key + '" data-v="' + v + '" aria-pressed="' + (got === v) + '">' + lab + "</button>";
      }).join("") +
      (got != null ? '<p class="sortnote">' + esc(x.note) + "</p>" : "") + "</div>";
  });
  h += '<div class="fb"><b>The point of this.</b> The notes are bones. Marks come from what you put on them: a number, something you saw, something someone said. And the task asks for both sides, so a paragraph of weaknesses is not being negative, it is doing what was asked.</div>';
  pane.innerHTML = h + actions();
  pane.querySelectorAll(".sortb").forEach(function(b){
    b.addEventListener("click", function(){ S.sort[b.dataset.k] = b.dataset.v; save(); render() });
  });
}

function renderPlan(st, head){
  pane.className = "wcard";
  var vals = st.task === 1 ? S.plan1 : S.plan2;
  var h = head + st.boxes.map(function(b, i){
    return '<label class="lab" for="p' + i + '">' + esc(b) + '</label><textarea class="small" id="p' + i + '" data-i="' + i + '">' + esc(vals[i] || "") + "</textarea>";
  }).join("");
  h += '<div class="helprow"><button class="wbtn help" id="ideas">' + esc(st.ideaLabel) + '</button>' +
    (st.ideas2 ? '<button class="wbtn help" id="ideas2">' + esc(st.ideaLabel2) + "</button>" : "") + '</div><div id="ideabox"></div>';
  pane.innerHTML = h + actions();
  var last = null;
  pane.querySelectorAll("textarea").forEach(function(t){
    t.addEventListener("input", function(){ vals[+t.dataset.i] = t.value; save() });
    t.addEventListener("focus", function(){ last = t });
  });
  function showIdeas(list){
    var box = document.getElementById("ideabox");
    box.innerHTML = '<p class="small">Tap one to drop it into the box you were last typing in, or just read them for a nudge.</p><div class="chips2">' +
      list.map(function(x){ return '<button class="chip2">' + esc(x) + "</button>" }).join("") + "</div>";
    box.querySelectorAll(".chip2").forEach(function(c){
      c.addEventListener("click", function(){ insertAt(last || pane.querySelector("textarea"), c.textContent) });
    });
  }
  document.getElementById("ideas").addEventListener("click", function(){ showIdeas(st.ideas) });
  if(st.ideas2) document.getElementById("ideas2").addEventListener("click", function(){ showIdeas(st.ideas2) });
}

function countRow(id, n, target){
  var pct = Math.min(100, Math.round(n / target[1] * 100));
  return '<div class="count"><span>Words: <b id="' + id + 'n">' + n + '</b></span>' +
    '<span class="bar"><i id="' + id + 'b" class="' + (n > target[1] ? "over" : "") + '" style="width:' + pct + '%"></i></span>' +
    '<span class="small">target ' + target[0] + " to " + target[1] + "</span></div>";
}

function wireCount(body, st, idn, idb, setter){
  body.addEventListener("input", function(){
    setter(body.value); save();
    var n = words(body.value);
    document.getElementById(idn).textContent = n;
    var bar = document.getElementById(idb);
    bar.style.width = Math.min(100, Math.round(n / st.target[1] * 100)) + "%";
    bar.className = n > st.target[1] ? "over" : "";
  });
}

function starterBlock(list, getBox){
  return {
    html: '<div class="helprow"><button class="wbtn help" id="startbtn">Sentence starters</button></div><div id="startbox"></div>',
    wire: function(){
      document.getElementById("startbtn").addEventListener("click", function(){
        var box = document.getElementById("startbox");
        box.innerHTML = '<p class="small">Tap one to drop it in where your cursor is, then finish the sentence in your own words.</p><div class="chips2">' +
          list.map(function(x){ return '<button class="chip2">' + esc(x) + "</button>" }).join("") + "</div>";
        box.querySelectorAll(".chip2").forEach(function(c){
          c.addEventListener("click", function(){ insertAt(getBox(), c.textContent) });
        });
      });
    }
  };
}

function renderEmail(st, head){
  pane.className = "wcard";
  var E = S.email;
  var plan = S.plan1.filter(function(x){ return words(x) > 0 });
  var sb = starterBlock(STARTERS1, function(){ return document.getElementById("ebody") });
  pane.innerHTML = head +
    (plan.length ? '<div class="fb"><b>Your plan.</b> ' + plan.map(esc).join(" &middot; ") + "</div>" : "") +
    countRow("e", words(E.body), st.target) +
    '<label class="lab" for="esub">Subject line</label><input type="text" id="esub" value="' + esc(E.subject) + '" placeholder="Idea for a local event">' +
    '<label class="lab" for="egreet">Greeting</label><input type="text" id="egreet" value="' + esc(E.greet) + '">' +
    '<label class="lab" for="ebody">The email</label>' + sb.html +
    '<textarea class="big" id="ebody" placeholder="Leave a blank line between paragraphs. It saves as you type.">' + esc(E.body) + "</textarea>" +
    '<label class="lab" for="esign">Sign off</label><input type="text" id="esign" value="' + esc(E.sign) + '">' +
    '<label class="lab" for="ename">Your name</label><input type="text" id="ename" value="' + esc(E.name) + '" placeholder="Initials are fine">' +
    actions();
  wireCount(document.getElementById("ebody"), st, "en", "eb", function(v){ E.body = v });
  [["esub","subject"],["egreet","greet"],["esign","sign"],["ename","name"]].forEach(function(p){
    document.getElementById(p[0]).addEventListener("input", function(e){ E[p[1]] = e.target.value; save() });
  });
  sb.wire();
}

function renderArticle(st, head){
  pane.className = "wcard";
  var A = S.article;
  var plan = S.plan2.filter(function(x){ return words(x) > 0 });
  var sb = starterBlock(STARTERS2, function(){ return document.getElementById("abody") });
  pane.innerHTML = head +
    (plan.length ? '<div class="fb"><b>Your plan.</b> ' + plan.map(esc).join(" &middot; ") + "</div>" : "") +
    countRow("a", words(A.body), st.target) +
    '<label class="lab" for="ahead">Headline</label><input type="text" id="ahead" value="' + esc(A.head) + '" placeholder="New gym opens on Colwyn Park Terrace: worth the money?">' +
    '<label class="lab" for="abody">The article</label>' + sb.html +
    '<div class="helprow"><button class="wbtn help" id="headbtn">Subheadings</button></div><div id="headbox"></div>' +
    '<textarea class="big" id="abody" placeholder="Opening paragraph first. Leave a blank line between paragraphs, and put a subheading on its own line if you want one.">' + esc(A.body) + "</textarea>" +
    actions();
  var body = document.getElementById("abody");
  wireCount(body, st, "an", "ab", function(v){ A.body = v });
  document.getElementById("ahead").addEventListener("input", function(e){ A.head = e.target.value; save() });

  document.getElementById("headbtn").addEventListener("click", function(){

    box.innerHTML = '<p class="small">Subheadings go on their own line, with a blank line before them.</p><div class="chips2">' +
      st.heads.map(function(x){ return '<button class="chip2">' + esc(x) + "</button>" }).join("") + "</div>";
    box.querySelectorAll(".chip2").forEach(function(c){
      c.addEventListener("click", function(){ insertAt(body, "\n\n" + c.textContent + "\n") });
    });
  });
}

function renderCheck(st, head){
  pane.className = "wcard";
  var one = st.which === 1;
  var txt = one ? emailText(S.email) : articleText(S.article);
  var target = one ? [150, 200] : [230, 300];
  var selfMap = one ? S.self1 : S.self2;
  var h = head;
  if(!words(txt)){
    h += '<div class="fb">Nothing written yet. That is fine: go back a step whenever you are ready, or carry on and come back to this.</div>';
  } else {
    var res = checkText(txt, {target: target, cover: one ? COVER1 : COVER2});
    h += '<h3>What a machine can see</h3><ul class="checks">' + res.map(function(r){
      var cls = r[0] === true ? "y" : (r[0] === false ? "n" : "m");
      var mk = r[0] === true ? TICK : (r[0] === false ? "!" : "?");
      return '<li class="' + cls + '"><i>' + mk + "</i><span>" + esc(r[1]) + "</span></li>";
    }).join("") + "</ul>" +
    '<p class="small">Spelling, ideas and whether it actually reads well are for you and Jay. A machine cannot see those.</p>';
  }
  h += '<hr class="hr"><h3>Your own read through</h3><p class="small">These come straight from the band wording. Tick what is true. The unticked ones are the useful ones.</p>';
  st.self.forEach(function(s, i){
    h += '<button class="tick" data-i="' + i + '" aria-pressed="' + (!!selfMap[i]) + '"><span class="bx">' + (selfMap[i] ? TICK : "") + "</span><span>" + esc(s) + "</span></button>";
  });
  var ticked = st.self.filter(function(s, i){ return selfMap[i] }).length;
  if(ticked === st.self.length) h += '<div class="fb"><b>All ticked.</b> Worth one last read out loud in your head. Missing full stops turn up when you hear the sentence run on.</div>';
  else if(ticked) h += '<div class="fb"><b>' + ticked + " of " + st.self.length + '.</b> Anything left unticked is a small job, and small jobs near the end of a piece are usually worth more marks than more writing.</div>';
  pane.innerHTML = h + actions('<button class="wbtn warm" id="mark">I have checked it</button>');
  pane.querySelectorAll(".tick").forEach(function(b){
    b.addEventListener("click", function(){ selfMap[b.dataset.i] = !selfMap[b.dataset.i]; save(); render() });
  });
  document.getElementById("mark").addEventListener("click", function(){
    if(one) S.checked1 = true; else S.checked2 = true;
    save(); go(S.idx + 1);
  });
}

function renderModel(st, head){
  pane.className = "wcard";
  var written = st.gate === 1 ? words(S.email.body) > 0 : words(S.article.body) > 0;
  var key = "peek" + st.gate;
  if(!written && !S.help[key]){
    pane.innerHTML = head +
      '<div class="fb"><b>Worth writing yours first.</b> Once you have read a model it is hard to unsee it, and your own version is the one Jay wants. It will still be here afterwards.</div>' +
      '<div class="helprow"><button class="wbtn main" id="backw">Take me back to the writing</button><button class="wbtn help" id="peek">I would rather read the model first</button></div>' +
      actions();
    document.getElementById("backw").addEventListener("click", function(){ go(S.idx - 2) });
    document.getElementById("peek").addEventListener("click", function(){ S.help[key] = 1; save(); render() });
    wireActions();
    return;
  }
  pane.innerHTML = head + "<p>" + esc(st.intro) + "</p>" +
    '<div class="model"><div class="mhead"><span>The answer</span><span>Why it earns marks</span></div>' +
    st.model.map(function(m){
      return '<div class="mrow"><div class="mtext">' + esc(m.t) + '</div><div class="mnote"><b>What this is doing</b>' + esc(m.n) + "</div></div>";
    }).join("") + "</div>" +
    "<h3>Where the marks came from</h3><ul>" + st.marks.map(function(x){ return "<li>" + esc(x) + "</li>" }).join("") + "</ul>" +
    '<div class="fb"><b>One way, not the way.</b> A completely different idea, or a different set of strengths, can reach the same band. What travels is the shape: do the job, keep the tone, develop the points, check the accuracy.</div>' +
    actions();
}

function renderFinish(st, head){
  pane.className = "wcard";
  var e = words(S.email.body), a = words(S.article.body);
  var qdone = 0, qtot = 0;
  STEPS.forEach(function(x){ if(x.kind === "quiz"){ qtot += x.items.length; x.items.forEach(function(q){ if(S.quiz[q.id] === q.ans) qdone++ }) } });
  pane.innerHTML = head +
    "<ul><li>Email: " + (e ? e + " words written" : "not written yet") + "</li>" +
    "<li>Article: " + (a ? a + " words written" : "not written yet") + "</li>" +
    "<li>Practice questions right first time: " + qdone + " of " + qtot + "</li></ul>" +
    "<p>Sending puts both pieces into a message, with what you ticked on the check screens. Jay marks them against the real bands and tells you where they landed.</p>" +
    '<div id="sendHost"></div>' +
    '<hr class="hr"><h3>If you want to go again</h3><p class="small">Starting fresh clears both pieces on this device. Send them first if you want to keep them.</p>' +
    '<div class="helprow"><button class="wbtn help" id="reset">Start the paper again</button></div>' +
    actions();
  document.getElementById("reset").addEventListener("click", function(){
    if(window.confirm("Clear both pieces and start again?")){ S = fresh(); save(); go(0) }
  });
  if(window.Base5Send) Base5Send.mount(document.getElementById("sendHost"), {tool: "Level 2 writing: email and article", getText: buildText, filename: "writing-level-2"});
}

/* ---------- send ---------- */

function buildText(){
  var L = ["AQA FUNCTIONAL SKILLS ENGLISH LEVEL 2 - WRITING (practice)", "Specimen paper 8725W: email to the council, article for the Wickby Post", ""];
  L.push("QUESTION 1: EMAIL (6 marks + 3 SPaG)");
  L.push("Words: " + words(S.email.body));
  L.push("");
  L.push(emailText(S.email) || "  (not written)");
  L.push("");
  L.push("Self check ticked:");
  var t1 = SELF1.filter(function(s, i){ return S.self1[i] });
  L.push(t1.length ? "  " + t1.join("\n  ") : "  none ticked");
  var u1 = SELF1.filter(function(s, i){ return !S.self1[i] });
  if(u1.length) L.push("Left unticked:\n  " + u1.join("\n  "));
  L.push("");
  L.push("----------");
  L.push("");
  L.push("QUESTION 2: ARTICLE (12 marks + 9 SPaG)");
  L.push("Words: " + words(S.article.body));
  L.push("");
  L.push(articleText(S.article) || "  (not written)");
  L.push("");
  L.push("Self check ticked:");
  var t2 = SELF2.filter(function(s, i){ return S.self2[i] });
  L.push(t2.length ? "  " + t2.join("\n  ") : "  none ticked");
  var u2 = SELF2.filter(function(s, i){ return !S.self2[i] });
  if(u2.length) L.push("Left unticked:\n  " + u2.join("\n  "));
  L.push("");
  L.push("----------");
  L.push("");
  L.push("PRACTICE QUESTIONS (first answer given)");
  STEPS.forEach(function(st){
    if(st.kind !== "quiz") return;
    st.items.forEach(function(q){
      var p = S.quiz[q.id];
      if(p == null) return;
      L.push("  [" + q.tag + "] " + q.q);
      L.push("     picked: " + q.opts[p] + (p === q.ans ? "  (right)" : "  | answer: " + q.opts[q.ans]));
    });
  });
  L.push("");
  L.push("Strengths and weaknesses sorter: " + Object.keys(S.sort).length + " of " + SORT.length + " sorted");
  return L.join("\n");
}

/* ---------- start ---------- */
render();

})();
</script>
