label.lab{display:block;font:700 15px "Atkinson Hyperlegible",sans-serif;color:#355;margin:10px 0 4px}

var S;
function fresh(){return {v:1, ini:"", mode:"practice", started:false, done:false, idx:0, t0:0, t1:0,
  plan1:["","","",""], txt1:"", self1:{}, checked1:false,
  plan2:["","","",""], letter:{from:"",date:"",to:"",greet:"Dear Mr Jeffries,",body:"",sign:"Yours sincerely,",name:""}, self2:{}, checked2:false,
  help:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1)return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function words(t){t=String(t||"").trim();return t?t.split(/\s+/).length:0;}
function sentences(t){return String(t||"").split(/[.!?]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});}
function paras(t){return String(t||"").split(/\n\s*\n/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});}
function insertAt(el,txt){
  var s=el.selectionStart||0, e=el.selectionEnd||0, v=el.value;
  var before=v.slice(0,s), after=v.slice(e);
  var pad = before && !/\s$/.test(before) ? " " : "";
  el.value = before + pad + txt + after;
  var pos=(before+pad+txt).length;
  el.focus(); el.setSelectionRange(pos,pos);
  el.dispatchEvent(new Event("input"));
}
function letterText(L){
  var out=[];
  if(L.from)out.push(L.from);
  if(L.date)out.push(L.date);
  if(L.to)out.push(L.to);
  if(L.greet)out.push(L.greet);
  if(L.body)out.push(L.body);
  if(L.sign)out.push(L.sign);
  if(L.name)out.push(L.name);
  return out.join("\n\n");
}
function taskDone(n){return n===1?words(S.txt1)>0:words(S.letter.body)>0;}

/* ---------- machine checks ---------- */
var INFORMAL = [["gonna","going to"],["wanna","want to"],["kinda","kind of"],["cos ","because"],["coz","because"],["innit",""],["u ","you"],["ur ","your"],["yeah",""],["stuff",""],["rubbish",""],["loads of","a lot of"],["gotta","have to"]];
var SHORTFORMS = ["don't","doesn't","didn't","can't","won't","it's","i'm","i've","they're","wasn't","haven't","isn't"];

function checkText(t, opts){
  var out=[], w=words(t), ss=sentences(t), ps=paras(t), low=t.toLowerCase();
  if(opts.target){
    var lo=opts.target[0], hi=opts.target[1];
    if(w>=lo&&w<=hi)out.push([true, w+" words, which is inside the "+lo+" to "+hi+" the question suggests."]);
    else if(w<lo)out.push([false, w+" words. The bands for length need roughly "+lo+", so another paragraph would help."]);
    else out.push([true, w+" words, a bit over "+hi+". Longer is allowed, as long as it stays on the point."]);
  }
  out.push(ps.length>1 ? [true, ps.length+" paragraphs. Leave a blank line between them so the shape is obvious."]
                       : [false, "This is one block of text. Paragraphs are worth marks, so split it where the subject changes."]);
  var longOnes = ss.filter(function(s){return words(s)>35;}).length;
  if(ss.length===0)out.push([false,"No full stops found yet."]);
  else if(longOnes)out.push([false, longOnes+" sentence"+(longOnes>1?"s are":" is")+" over 35 words. Long ones are where full stops go missing."]);
  else out.push([true, ss.length+" sentences, none of them runaway."]);
  var noCap = ss.filter(function(s){return /^[a-z]/.test(s);}).length;
  out.push(noCap ? [false, noCap+" sentence"+(noCap>1?"s start":" starts")+" with a small letter."]
                 : [true, "Every sentence starts with a capital letter."]);
  out.push(/\bi\b/.test(t) ? [false, "There is a lower case i on its own somewhere. It is always I."]
                           : [true, "No stray lower case i."]);
  var inf = INFORMAL.filter(function(p){return low.indexOf(p[0])>-1;});
  out.push(inf.length ? [false, "Chatty words spotted: "+inf.map(function(p){return p[0].trim();}).join(", ")+". Swap them for something more formal."]
                      : [true, "No text speak or chatty words found."]);
  var sf = SHORTFORMS.filter(function(p){return low.indexOf(p)>-1;});
  if(opts.formal)out.push(sf.length ? [false, "Shortened forms found: "+sf.join(", ")+". In a formal letter, write them out in full."]
                                    : [true, "No shortened forms like don't or it's."]);
  if(/!!/.test(t))out.push([false,"More than one exclamation mark in a row. One is plenty, none is safer."]);
  if(opts.cover){
    opts.cover.forEach(function(c){
      var hit=c.k.some(function(k){return low.indexOf(k)>-1;});
      out.push(hit ? [true, "Looks like you covered "+c.name+"."] : [null, "I cannot see anything about "+c.name+". That is fine if you chose to leave it out."]);
    });
  }
  return out;
}

function setBrief(task){
  if(!task){grid.classList.add("solo");return;}

  var h = task===1?BRIEF1:BRIEF2;
  var plan = task===1?S.plan1:S.plan2;
  var boxes = task===1?STEPS[2].boxes:STEPS[8].boxes;
  var any = plan.some(function(p){return p.trim();});
  if(any){
    h+='<div class="planback"><p><b>Your plan</b></p><ul>';
    plan.forEach(function(p,i){if(p.trim())h+='<li><b>'+esc(boxes[i])+':</b> '+esc(p)+'</li>';});
    h+='</ul></div>';
  }
  briefEl.innerHTML=h;
}

function render(){
  if(!S.started){setBrief(0);renderStart();return;}
  if(S.done){setBrief(0);renderFinish();return;}
  var st=STEPS[S.idx];
  if(S.mode==="test"&&st.learn){move(1,true);return;}
  setBrief(st.task);
  if(st.learn)renderLearn(st);
  else if(st.kind==="plan")renderPlan(st);
  else if(st.kind==="write")renderWrite(st);
  else if(st.kind==="letter")renderLetter(st);
  else renderCheck(st);
}

function progressHTML(){
  var n=STEPS.filter(function(s){return !s.learn;}).length;

    '<p class="progtxt"><span>Step '+(S.idx+1)+' of '+STEPS.length+'</span>';

}

function navHTML(nextLabel,extra,noBack){

  var opts = task===1 ? {target:[200,250], cover:COVER1} : {target:[180,260], cover:COVER2, formal:true};
  var res = words(txt) ? checkText(txt,opts) : null;
  var selfList = st.self, selfState = task===1?S.self1:S.self2;
  var h=progressHTML()+'<div class="wcard"><div class="whead"><span class="pill t">Task '+task+'</span><span class="pill o">Checking</span></div>'+
    '<h2>'+st.title+'</h2><p>'+st.sub+'</p>';
  if(!res){
    h+='<p>Nothing written for this one yet. Going back is fine, and so is leaving it for today.</p>';
  } else {
    h+='<p>These are only the things a machine can see. Spelling, ideas and whether it actually reads well are for you and Jay.</p><ul class="checks">';
    res.forEach(function(r){
      var cls=r[0]===true?"ok":r[0]===false?"note":"", ic=r[0]===true?"y":r[0]===false?"!":"?";
      h+='<li class="'+cls+'"><span class="ic">'+ic+'</span><span>'+r[1]+'</span></li>';
    });
    h+='</ul>';
    if(task===2){
      var L=S.letter, miss=[];
      if(!L.from.trim())miss.push("your address");
      if(!L.date.trim())miss.push("the date");
      if(!L.to.trim())miss.push("their address");
      if(!L.greet.trim())miss.push("a greeting");
      if(!L.sign.trim())miss.push("a sign off");
      if(!L.name.trim())miss.push("your name");
      var pair = /dear\s+(mr|mrs|miss|ms|dr)/i.test(L.greet) ? /sincerely/i.test(L.sign) : true;
      h+='<ul class="checks">';
      h+= miss.length ? '<li class="note"><span class="ic">!</span><span>Still empty: '+miss.join(", ")+'. Layout carries marks of its own.</span></li>'
                      : '<li class="ok"><span class="ic">y</span><span>Every part of the layout has something in it.</span></li>';
      h+= pair ? '<li class="ok"><span class="ic">y</span><span>Your greeting and sign off go together.</span></li>'
               : '<li class="note"><span class="ic">!</span><span>You used his name in the greeting, so the sign off wants to be Yours sincerely.</span></li>';
      h+='</ul>';
    }
    h+='<p><b>Your own read through.</b> Tick what you have done. Untickable ones are just jobs left.</p>';
    selfList.forEach(function(s,i){
      h+='<button type="button" class="tick" data-s="'+i+'" aria-pressed="'+(selfState[i]?"true":"false")+'"><span class="box">'+(selfState[i]?"y":"")+'</span><span>'+esc(s)+'</span></button>';
    });
    h+='<details class="rev"><summary>What I wrote</summary><div class="in"><div class="preview">'+esc(task===1?S.txt1:letterText(S.letter))+'</div></div></details>';
  }
  h+=navHTML(task===1?"On to the letter":"Finish", '<button type="button" class="wbtn warm" id="edit">Go back and change it</button>', true);
  pane.innerHTML=h+'</div>';
  Array.prototype.forEach.call(pane.querySelectorAll(".tick"),function(b){
    b.onclick=function(){var i=+b.getAttribute("data-s");selfState[i]=!selfState[i];save();renderCheck(st);};
  });
  pane.querySelector("#edit").onclick=function(){move(-1);};
  wireNav();
  if(S.mode==="test")tick();
}

/* timer */
var timerId=null;
function tick(){
  if(timerId)clearInterval(timerId);
  var el=document.getElementById("timer");if(!el)return;
  var f=function(){var m=Math.floor((Date.now()-S.t0)/60000);el.textContent=m+" min of the 80 used";};
  f();timerId=setInterval(f,20000);
}

function renderFinish(){
  if(timerId)clearInterval(timerId);
  var mins = S.t1&&S.t0?Math.max(1,Math.round((S.t1-S.t0)/60000)):null;
  var w1=words(S.txt1), w2=words(S.letter.body);
  var h='<div class="wcard"><h2>Both pieces, done</h2>'+
    '<p>The report came to '+w1+' words and the letter to '+w2+'.'+(mins?' You were at it for about '+mins+' minute'+(mins>1?'s':'')+'.':'')+
    ' Neither of them has a mark on it, because this bit is Jay\'s job.</p>'+
    '<div class="learnvis">'+V.check+'</div>'+
    '<p>One last thing worth doing before you send: read each one out loud in your head. Missing full stops turn up when you hear the sentence run on.</p>'+
    '<details class="rev"><summary>The report</summary><div class="in"><div class="preview">'+esc(S.txt1||"(nothing written)")+'</div></div></details>'+
    '<details class="rev"><summary>The letter</summary><div class="in"><div class="preview">'+esc(letterText(S.letter)||"(nothing written)")+'</div></div></details>'+
    '<h3 style="font-family:Archivo,sans-serif;margin:18px 0 6px">Send it to Jay</h3>'+
    '<p class="small">Both pieces go together, with '+(S.ini?'your initials ('+S.ini+')':'no name on it')+' and today\'s date.</p>'+
    '<div class="sendrow2"><button type="button" class="wbtn main" id="sGmail">Gmail</button><button type="button" class="wbtn" id="sMail">Email app</button>'+
    '<button type="button" class="wbtn" id="sCopy">Copy</button><button type="button" class="wbtn" id="sSave">Save as a file</button></div><p class="small" id="sMsg"></p>'+
    '<div class="actions"><div class="l"><button type="button" class="wbtn" id="backIn">Go back and change something</button>'+
    '<button type="button" class="wbtn" id="again">Start fresh</button></div></div></div>';
  pane.innerHTML=h;
  var subj="Level 1 writing practice"+(S.ini?" from "+S.ini:"");
  var body=report(mins);
  pane.querySelector("#sGmail").onclick=function(){window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(EMAIL)+"&su="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body),"_blank");};
  pane.querySelector("#sMail").onclick=function(){location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);};
  pane.querySelector("#sCopy").onclick=function(){var m=document.getElementById("sMsg");
    if(navigator.clipboard){navigator.clipboard.writeText(body).then(function(){m.textContent="Copied. Paste it into a message to Jay.";},function(){m.textContent="Copy did not work here. Try Save as a file.";});}
    else m.textContent="Copy is not available here. Try Save as a file.";};
  pane.querySelector("#sSave").onclick=function(){var b=new Blob([body],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="writing-level-1-"+(S.ini||"practice")+".txt";document.body.appendChild(a);a.click();a.remove();};
  pane.querySelector("#backIn").onclick=function(){S.done=false;S.idx=STEPS.length-1;save();render();window.scrollTo(0,0);};
  pane.querySelector("#again").onclick=function(){if(!confirm("Start fresh? Both pieces of writing saved on this device will go."))return;var ini=S.ini,m=S.mode;S=fresh();S.ini=ini;S.mode=m;save();render();window.scrollTo(0,0);};
}

function report(mins){
  var d=new Date(), L=[];
  L.push("Level 1 Writing practice (City and Guilds sample paper 1)");
  L.push("Student: "+(S.ini||"not given"));
  L.push("Date: "+d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  L.push("Mode: "+(S.mode==="practice"?"with help":"test run")+(mins?"  |  about "+mins+" min":""));
  var used=[];
  if(S.help.ideas1||S.help.ideas2)used.push("idea lists");
  if(S.help.start1||S.help.start2)used.push("sentence starters");
  if(S.help.head1)used.push("headings");
  if(S.help.addr)used.push("address filled in");
  L.push("Support used: "+(used.length?used.join(", "):"none"));
  L.push("");
  L.push("== TASK 1: REPORT ON TECHNOLOGY ("+words(S.txt1)+" words) ==");
  L.push("Plan:");
  STEPS[2].boxes.forEach(function(b,i){L.push("  - "+b+": "+(S.plan1[i]||"-"));});
  L.push("");
  L.push(S.txt1||"(nothing written)");
  L.push("");
  L.push("== TASK 2: LETTER OF COMPLAINT ("+words(S.letter.body)+" words in the body) ==");
  L.push("Plan:");
  STEPS[8].boxes.forEach(function(b,i){L.push("  - "+b+": "+(S.plan2[i]||"-"));});
  L.push("");
  L.push(letterText(S.letter)||"(nothing written)");
  L.push("");
  L.push("Self check, report: "+STEPS[5].self.filter(function(s,i){return S.self1[i];}).length+" of "+STEPS[5].self.length+" ticked");
  L.push("Self check, letter: "+STEPS[10].self.filter(function(s,i){return S.self2[i];}).length+" of "+STEPS[10].self.length+" ticked");
  return L.join("\n");
}

render();
})();
</script>
