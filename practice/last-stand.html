<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Legends: Last Stand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#120d19;--ink:#2a1f33;--ink2:#3a2c47;--paper:#f3e5c8;--paper2:#e8d4ad;--card:#fffaf0;
  --text:#2a1f33;--muted:#6d5a4a;--gold:#f0a534;--rose:#e2556b;--teal:#3dbdb0;--plum:#6d4583;--leaf:#4f9e5c;--bingo:#d8344a;
  --pix:'Silkscreen',ui-monospace,'Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;background:var(--night)}
body{margin:0;overflow:hidden;font-family:var(--body);color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;background:var(--night)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
button{font:inherit}
[hidden]{display:none!important}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));background:rgba(12,8,18,.78);z-index:20;box-sizing:border-box}
.ov.clear{background:rgba(12,8,18,.4)}
.ov > *{margin:auto 0}
.sheet{position:relative;box-sizing:border-box;width:100%;max-width:900px;background:var(--paper);color:var(--text);
  background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.2px),radial-gradient(rgba(120,90,50,.05) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  border-radius:3px 7px 4px 6px;box-shadow:0 12px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.25);padding:28px clamp(16px,4vw,40px)}
.sheet::before,.sheet::after{content:"";position:absolute;width:92px;height:24px;background:rgba(216,52,74,.5);top:-10px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.sheet::before{left:22px;transform:rotate(-4deg)}
.sheet::after{right:26px;transform:rotate(3deg);background-color:rgba(61,189,176,.5)}
.sheet.narrow{max-width:580px}
.sheet h2{font-family:var(--pix);font-weight:700;font-size:24px;line-height:1.1;margin:0 0 8px;text-wrap:balance;letter-spacing:.02em}
.sheet h3{font-family:var(--pix);font-size:16px;margin:20px 0 8px;letter-spacing:.04em}
.sheet p{font-size:17px;line-height:1.5;margin:0 0 12px;max-width:64ch}
.kick{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.btn{font-family:var(--pix);font-size:16px;letter-spacing:.04em;text-transform:uppercase;min-height:46px;padding:10px 18px;border:3px solid var(--ink);
  background:var(--ink);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.45);cursor:pointer;border-radius:2px;transition:transform .08s,background .12s}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn:hover{background:var(--plum);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:rgba(42,31,51,.08)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#ffbe55}
.btn.red{background:var(--bingo);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;font-family:var(--body);font-weight:700}
.btn:focus-visible,.card:focus-visible,.tog:focus-visible,.slot:focus-visible,.patch:focus-visible,.fc:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:12px 0;max-width:740px;width:100%}
.logo{font-family:var(--pix);font-weight:700;font-size:clamp(40px,10vw,96px);line-height:.9;color:var(--gold);margin:0;letter-spacing:.02em;
  text-shadow:4px 4px 0 #8a2f45,8px 8px 0 #2a1f33;transform:rotate(-2deg)}
.logo small{display:block;font-size:.5em;color:#f3e5c8;text-shadow:3px 3px 0 #8a2f45,6px 6px 0 #2a1f33;letter-spacing:.14em;margin-top:.25em}
.tag{font-size:18px;line-height:1.5;max-width:48ch;color:#f3e5c8;margin:0;padding:10px 16px;background:rgba(18,13,25,.84);border:2px solid #3a2c47}
.menu{display:grid;gap:10px;width:min(500px,100%);grid-template-columns:1fr 1fr}
.menu .wide{grid-column:1/-1}
.menu .btn{width:100%}
@media (max-width:440px){.menu{grid-template-columns:1fr}}
.foot{font-size:14px;color:#d9cbb0;max-width:54ch;background:rgba(18,13,25,.84);padding:6px 12px;margin:0}
.backlink{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:21;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:9px 12px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.backlink:hover{background:var(--gold)}
.notice{width:min(560px,100%);background:#fbf1d8;color:var(--text);border:2px solid var(--ink);padding:12px 14px;text-align:left;transform:rotate(.6deg);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.notice b{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.06em}
.notice p{margin:4px 0 0;font-size:15px;line-height:1.4}
.notice .big{font-family:var(--pix);font-size:24px;color:var(--bingo)}

/* hero select */
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:12px;margin:12px 0}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 5px 0 rgba(42,31,51,.25);transition:transform .12s;position:relative;color:var(--text)}
.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(.8deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.card[aria-pressed="true"]{outline:4px solid var(--gold);transform:rotate(0) scale(1.03)}
.card img{width:100%;aspect-ratio:1/1;image-rendering:pixelated;background:#5a3f6b;display:block;max-width:100%}
.card .nm{font-family:var(--pix);font-size:16px;font-weight:700}
.card .rl{font-size:13px;color:var(--muted);line-height:1.25}
.card.locked .nm,.card.locked .rl{color:var(--muted)}
.detail{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start;background:rgba(255,250,240,.7);border:2px dashed rgba(42,31,51,.35);padding:14px}
.detail img{width:110px;height:110px;image-rendering:pixelated;background:#5a3f6b;max-width:100%}
.detail .q{font-size:16px;line-height:1.45;font-style:italic;margin:4px 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15px;line-height:1.35}
.facts b{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.06em;padding-top:2px}
@media (max-width:520px){.detail{grid-template-columns:1fr}.detail img{width:90px;height:90px}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{flex:1 1 140px}
.seg .btn[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.hint{font-size:15px;color:var(--muted);line-height:1.4;margin:6px 0 0}

/* forecast cards */
.fcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
.fc{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--text);
  box-shadow:0 5px 0 rgba(42,31,51,.25);transition:transform .12s;position:relative}
.fc:hover{transform:translateY(-4px) rotate(-.6deg)}
.fc .nm{font-family:var(--pix);font-size:16px;font-weight:700;line-height:1.15}
.fc .ds{font-size:16px;line-height:1.4}
.fc .th{font-family:var(--body);font-weight:700;font-size:12px;color:var(--plum)}
.fc .ic{font-size:26px;line-height:1}

/* satchel */
.bagwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.bagwrap{grid-template-columns:1fr}}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin:6px 0 12px}
.slot{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1;background:rgba(255,250,240,.9);border:2px solid var(--ink);display:grid;place-items:center;position:relative;color:var(--text);max-width:100%}
.slot.empty{border-style:dashed;background:transparent;cursor:default}
.slot.sel{outline:4px solid var(--gold);outline-offset:0}
.slot img{width:62%;image-rendering:pixelated}
.slot .n{position:absolute;left:4px;top:2px;font-family:var(--body);font-weight:700;font-size:11px;color:var(--muted)}
.slot .q{position:absolute;right:4px;bottom:2px;font-family:var(--body);font-weight:700;font-size:12px;font-weight:700}
.slot .tg{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%}
.info{background:rgba(255,250,240,.75);border:2px dashed rgba(42,31,51,.35);padding:14px;min-height:160px}
.info .nm{font-family:var(--pix);font-size:16px;font-weight:700;margin-bottom:4px}
.info .ty{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.info p{font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* quilt */
.quilt{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.patch{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px dashed var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:4px;color:var(--text);position:relative;min-height:110px}
.patch .nm{font-family:var(--body);font-weight:700;font-size:13px;font-weight:700;line-height:1.2}
.patch .ds{font-size:14px;line-height:1.35}
.patch .cs{font-family:var(--body);font-weight:700;font-size:12px;margin-top:auto;color:var(--plum)}
.patch.own{border-style:solid;background-image:repeating-linear-gradient(45deg,rgba(216,52,74,.12) 0 8px,transparent 8px 16px)}
.patch.own .cs{color:var(--leaf)}
.patch.lock{opacity:.5;cursor:not-allowed}
.patch.can{box-shadow:0 0 0 3px var(--gold)}
.tier{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--muted);margin:16px 0 0;text-transform:uppercase}
.threads{font-family:var(--pix);font-size:16px}.threads b{font-size:32px;color:var(--bingo);margin-right:6px}

/* album + stats */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.aslot{background:var(--card);border:2px solid var(--ink);padding:10px 12px;font-size:15px;line-height:1.45;display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.aslot img{width:56px;height:56px;image-rendering:pixelated;background:#5a3f6b}
.aslot.no{background:transparent;border-style:dashed;color:var(--muted)}
.aslot b{font-family:var(--body);font-weight:700;font-size:13px;display:block;margin-bottom:2px}
.aslot.wide{grid-template-columns:1fr}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:12px 0 16px}
.stats div{background:var(--card);border:2px solid var(--ink);padding:8px 10px}
.stats b{display:block;font-family:var(--pix);font-size:24px;font-variant-numeric:tabular-nums}
.stats small{font-size:13px;color:var(--muted)}
.earn{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:16px;max-width:420px;margin:6px 0 12px}
.earn b{font-family:var(--pix);text-align:right;font-variant-numeric:tabular-nums}
.earn .tot{border-top:2px solid var(--ink);padding-top:4px;font-weight:700}

/* bingo card */
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:460px;margin:8px 0 12px}
.bingo div{background:#fff;border:2px solid var(--ink);min-height:74px;padding:6px 8px;font-size:14px;line-height:1.25;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bingo div.free{background:var(--bingo);color:#fff;font-family:var(--body);font-weight:700;font-size:13px}
.bingo div.done::after{content:"";position:absolute;inset:10%;border-radius:50%;background:rgba(216,52,74,.45);mix-blend-mode:multiply}
.bingo small{display:block;font-family:var(--body);font-weight:700;font-size:11px;color:var(--muted);margin-top:3px}

/* toggles */
.togs{display:grid;gap:10px;margin:10px 0 16px}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:2px solid var(--ink);color:var(--text)}
.tog span{font-size:16px;line-height:1.35}.tog small{display:block;color:var(--muted);font-size:13px}
.tog em{font-style:normal;font-family:var(--body);font-weight:700;font-size:12px;padding:4px 8px;border:2px solid var(--ink);min-width:34px;text-align:center}
.tog[aria-checked="true"] em{background:var(--teal);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;line-height:1.4}
.keys kbd{font-family:var(--body);font-weight:700;font-size:12px;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:2px;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}

/* story */
.story{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:start}
.story img{width:120px;height:120px;image-rendering:pixelated;background:#5a3f6b;border:3px solid #fffaf0;box-shadow:0 4px 0 rgba(0,0,0,.25);transform:rotate(-2deg);max-width:100%}
.story .who{font-family:var(--pix);font-size:24px;font-weight:700}
.story .role{font-size:15px;color:var(--muted);margin-bottom:10px}
.gift{margin-top:12px;padding:12px 14px;background:rgba(255,250,240,.8);border:2px dashed var(--plum)}
.gift b{font-family:var(--body);font-weight:700;font-size:13px}
@media (max-width:520px){.story{grid-template-columns:1fr}.story img{width:90px;height:90px}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--body);font-weight:700}
.round,.pts,.toast{font-family:var(--pix)}
.hud-tl{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:6px;max-width:44vw}
.hp{position:relative;width:clamp(150px,22vw,220px);height:20px;background:#0e0a12;border:2px solid #0e0a12;box-shadow:0 0 0 2px #5b4466}
.hp i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);box-shadow:inset 0 3px 0 rgba(255,255,255,.25);transition:width .15s}
.hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.perks{display:flex;gap:4px;min-height:18px}
.perks s{width:18px;height:18px;display:block;border:2px solid #0e0a12;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.crew{display:grid;gap:4px}
.crew div{display:flex;align-items:center;gap:6px;font-size:11px;color:#f3e5c8;text-shadow:1px 1px 0 #000;background:rgba(14,10,18,.6);padding:2px 6px 2px 2px}
.crew canvas{width:20px;height:20px;image-rendering:pixelated;background:#3a2c47}
.crew i{display:block;width:44px;height:5px;background:#3a2c47;position:relative}
.crew i u{position:absolute;left:0;top:0;bottom:0;background:var(--leaf)}
.crew em{font-style:normal;color:var(--gold)}
.hud-tc{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:calc(8px + env(safe-area-inset-top,0px));text-align:center;display:flex;flex-direction:column;align-items:center}
.round{font-size:40px;color:#e8403f;text-shadow:3px 3px 0 #2a0c14;letter-spacing:.06em;font-weight:700;font-variant-numeric:tabular-nums;transition:color .6s}
.round.rest{color:#f3e5c8}
.roundlab{font-size:11px;color:#e9dcc2;text-shadow:1px 1px 0 #000;letter-spacing:.14em}
.bstack .hint{margin-top:8px;font-family:var(--body);font-size:14px;color:#fbf1d8;background:rgba(14,10,18,.72);border:1px solid #5b4466;padding:4px 10px;max-width:min(420px,60vw);line-height:1.35}
.bstack .hint b{font-family:var(--body);font-weight:700;font-size:11px;color:#8fd0c6;letter-spacing:.1em;margin-right:6px}
.bossbar{margin-top:6px;display:grid;gap:3px;justify-items:center}.bossbar b{font-size:11px;color:#c8a2ff;letter-spacing:.12em;text-shadow:1px 1px 0 #000}
.bossbar i{display:block;width:min(320px,50vw);height:10px;background:#0e0a12;border:2px solid #0e0a12;box-shadow:0 0 0 2px #6d4583}.bossbar u{display:block;height:100%;background:#b07bd0;text-decoration:none;transition:width .2s}
.hud-tr{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:6px;justify-items:end}
.pts{font-size:24px;color:var(--gold);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
.pts small{display:block;font-family:var(--body);font-size:11px;color:#e9dcc2;text-align:right}
#mini{width:clamp(120px,15vw,168px);image-rendering:pixelated;border:2px solid #0e0a12;box-shadow:0 0 0 2px #5b4466;background:#0e0a12;display:block}
.minib{display:grid;grid-template-columns:repeat(3,11px);gap:2px;pointer-events:auto}
.minib s{width:11px;height:11px;display:block;background:#fff;opacity:.85;border:1px solid #0e0a12}
.minib s.on{background:var(--bingo)}
.minib s.fr{background:var(--bingo);opacity:1}
.minirow{display:flex;gap:8px;align-items:center}
.minirow span{font-size:10px;color:#e9dcc2;text-shadow:1px 1px 0 #000}
.hands{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:flex-end}
.hand{display:flex;gap:8px;align-items:center;background:rgba(14,10,18,.8);padding:5px 10px 5px 5px;border:2px solid #3a2c47;opacity:.6}
.hand.on{opacity:1;border-color:#f0a534}
.hand.up{box-shadow:0 0 0 1px #7a5a12,0 0 10px rgba(240,194,74,.5)}
.hand canvas,.hand img{width:32px;height:32px;image-rendering:pixelated}
.hands.right{left:auto;right:calc(12px + env(safe-area-inset-right,0px));flex-direction:row-reverse}
.hands .abil{align-self:stretch}
.plist{display:grid;gap:5px}.prow{display:grid;gap:3px}.pnm{font-size:10px;letter-spacing:.1em;text-shadow:1px 1px 0 #000;color:#f0a534}
.questline{font-size:9px;color:#e9dcc2;text-shadow:1px 1px 0 #000;letter-spacing:.06em;max-width:170px;text-align:right;line-height:1.5}
.hotbar .trkc{width:26px;height:26px;image-rendering:pixelated;align-self:center;background:rgba(14,10,18,.8);border:2px solid #6d4583;margin-left:2px}
.card .who{font-size:10px;padding:1px 4px;margin-left:4px;border:2px solid currentColor}.card .wP1{color:#b0701a}.card .wP2{color:#2f8f7f}
.hand b{display:block;font-size:11px;color:#f3e5c8;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hand small{display:block;font-size:18px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.hand small.low{color:#ff8a8a}
.hotbar{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px}
.hb{width:38px;height:38px;background:rgba(14,10,18,.8);border:2px solid #3a2c47;position:relative;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.hb canvas{width:26px;height:26px;image-rendering:pixelated}

<script>

/* ================= AUDIO ================= */

function setupPuzzle(){var type=pick(Object.keys(PUZZLES)),others=shuffle(M.rooms.slice(1)),pieces=[],Z={type:type,pieces:pieces,step:0,solved:false};
  function spot(i,margin){var r=others[i%others.length];var p=randFloorIn(r,margin||2);return {x:p.x,y:p.y,room:r.i};}
  if(type==='balls'){var nums=[];while(nums.length<5){var n=rndi(1,90);if(nums.indexOf(n)<0)nums.push(n);}nums.forEach(function(n,i){var s=spot(i);pieces.push({k:'ball',n:n,lit:false,x:s.x,y:s.y,room:s.room});});Z.order=nums.slice().sort(function(a,b){return a-b;});}
  if(type==='bells'){var bp=randFloorIn(M.rooms[0],3);pieces.push({k:'bellboard',x:bp.x,y:bp.y,room:0});for(var i=0;i<4;i++){var s2=spot(i);pieces.push({k:'bell',c:i,x:s2.x,y:s2.y,room:s2.room,ring:0});}Z.seq=shuffle([0,1,2,3]);}
  if(type==='portraits'){var yrs=shuffle([1897,1912,1926,1938,1953,1966,1979,1988,1996]).slice(0,4);var cols=['#6a8ab0','#b07a8a','#8ab07a','#b0a06a'];yrs.forEach(function(y,i){var s3=spot(i);pieces.push({k:'portrait',year:y,col:cols[i],tilt:(rnd()<0.5?-1:1)*rnd(0.25,0.45),straight:false,x:s3.x,y:s3.y,room:s3.room});});Z.order=yrs.slice().sort(function(a,b){return a-b;});}
  if(type==='radio'){for(var j=0;j<3;j++){var s4=spot(j),g0=rnd(0.15,0.6);pieces.push({k:'radio',done:false,tuning:false,needle:0,dir:1,g0:g0,g1:g0+0.28,x:s4.x,y:s4.y,room:s4.room});}}
  G.puzzle=Z;}
function puzzleSolved(){var Z=G.puzzle;if(Z.solved)return;Z.solved=true;G.quest.puzzle=true;addPts(1000);sfx('bingo');jingle('special');toast(PUZZLES[Z.type].name+': solved!','1,000 points. One less thing standing between you and the morning.');chat('puzzle',null,true);
  G.meta.puzzles[Z.type]=true;metaSet(G.meta);checkQuest();}
function puzzleFail(msg){sfx('deny');toast('Not quite',msg);}
function checkQuest(){var Q=G.quest;if(Q.won||Q.boss||Q.bossNext)return;if(Q.returned>=Q.need&&Q.puzzle&&G.power){Q.bossNext=true;toast('Something big is coming','The '+boardName()+' is glowing. Get ready for the next round.');}}
function questLeft(){var Q=G.quest,a=[];if(Q.returned<Q.need)a.push((Q.need-Q.returned)+' keepsake'+(Q.need-Q.returned>1?'s':''));if(!Q.puzzle)a.push('the puzzle');if(!G.power)a.push('the power');return a;}
function shootPuzzle(b){var Z=G.puzzle;if(!Z||Z.solved||Z.type!=='balls')return false;for(var i=0;i<Z.pieces.length;i++){var p=Z.pieces[i];if(p.lit)continue;if(d2(b.x,b.y,p.x,p.y-5)<7*7){hitBall(p);return true;}}return false;}
function hitBall(p){var Z=G.puzzle,lowest=Z.pieces.filter(function(q){return !q.lit;}).map(function(q){return q.n;}).sort(function(a,b){return a-b;})[0];
  if(p.n===lowest){p.lit=true;sfx('coin');ftext(p.x,p.y-14,'Number '+p.n+'!','#6fd06d');if(Z.pieces.every(function(q){return q.lit;}))puzzleSolved();}
  else{Z.pieces.forEach(function(q){q.lit=false;});part(p.x,p.y-5,'#d8344a',8,40,0.4);puzzleFail('Number '+p.n+' is not the lowest one left. All the balls have reset. Find the lowest and start again.');}}
function usePuzzle(p){var Z=G.puzzle;if(Z.solved)return;
  if(p.k==='bellboard'){Z.play={i:0,t:0.2};Z.step=0;sfx('pick');return;}
  if(p.k==='bell'){p.ring=0.6;blip(BELL_NOTES[p.c],0.4,'triangle',0.08);if(Z.seq[Z.step]===p.c){Z.step++;ftext(p.x,p.y-22,BELL_NAMES[p.c],BELL_COLS[p.c]);if(Z.step>=4)puzzleSolved();}else{Z.step=0;puzzleFail('That was not the next bell. Ring the bell board in the '+M.rooms[0].def.name+' to hear the tune again.');}return;}
  if(p.k==='portrait'){var next=Z.order.filter(function(y){return !Z.pieces.some(function(q){return q.year===y&&q.straight;});})[0];
    if(p.year===next){p.straight=true;sfx('plank');if(Z.pieces.every(function(q){return q.straight;}))puzzleSolved();else ftext(p.x,p.y-26,'Straightened','#6fd06d');}
    else{Z.pieces.forEach(function(q){q.straight=false;});puzzleFail(p.year+' is not the oldest one left. All the pictures have gone crooked again.');}return;}
  if(p.k==='radio'){if(p.done)return;if(!p.tuning){p.tuning=true;p.needle=0;p.dir=1;p.by=G.P;sfx('pick');return;}
    if(p.needle>=p.g0&&p.needle<=p.g1){p.done=true;p.tuning=false;sfx('coin');blip(880,0.3,'sine',0.06);ftext(p.x,p.y-24,'Tuned in!','#6fd06d');if(Z.pieces.every(function(q){return q.done;}))puzzleSolved();}
    else{sfx('deny');ftext(p.x,p.y-24,'Static. Try again','#ff9b9b');}}}
function updatePuzzle(dt){var Z=G.puzzle;if(!Z)return;
  if(Z.play){Z.play.t-=dt;if(Z.play.t<=0){if(Z.play.i<4){var c=Z.seq[Z.play.i];Z.flash=c;blip(BELL_NOTES[c],0.35,'triangle',0.08);Z.play.i++;Z.play.t=0.6;}else{Z.flash=-1;Z.play=null;}}if(Z.play&&Z.play.t<0.25)Z.flash=-1;}
  Z.pieces.forEach(function(p){if(p.ring>0)p.ring-=dt;if(p.k==='radio'&&p.tuning){p.needle+=p.dir*dt*0.85;if(p.needle>1){p.needle=1;p.dir=-1;}if(p.needle<0){p.needle=0;p.dir=1;}if(!p.by||dist(p.by,p)>30||p.by.down)p.tuning=false;}});}

/* ================= ROUNDS ================= */
function zCount(r){var n=5+r*2.6+(r>8?(r-8)*1.4:0);n*=G.diff.count;if(fcIs('quiet'))n*=0.75;if(G.two)n*=1.35;return Math.max(4,Math.round(n));}
function zHp(r){var h=r<10?40+22*(r-1):238*Math.pow(1.1,r-10);h*=G.diff.zhp;if(fcIs('bank'))h*=1.25;return h;}
function nextRound(){G.round++;G.st.round=G.round;G.dropsRound=0;G.plankPts=0;G.regLift=false;G.special=null;
  G.players.forEach(function(p){if(p.out){var mate=upPlayers()[0]||p;p.out=false;p.down=false;p.x=mate.x+8;p.y=mate.y;p.hp=Math.round(maxHp(p)*0.6);p.invuln=2;toast(p.hero.name+' is back','Ready for round '+G.round+'.');}});
  if(G.quest.bossNext&&!G.quest.boss&&!G.quest.won){G.special='boss';}
  else if(G.round>=G.nextSpecial){G.special=fcIs('pigeons')?'pigeons':(Math.random()<0.5?'gnomes':'pigeons');G.nextSpecial=G.round+(fcIs('moon')?rndi(3,4):rndi(4,6));}
  var n=zCount(G.round);
  if(G.special==='gnomes')n=Math.round(n*1.1)+4;
  if(G.special==='pigeons'){n=Math.round(n*1.2)+6;if(hasN('eddie'))n=Math.round(n*0.5);}
  if(G.special==='boss')n=Math.round(n*0.6);
  G.toSpawn=n;G.spawnT=1.2;G.rstate='active';
  if(hasN('doreen')){if(bagAdd({k:'item',id:'sandwich'}))ftext(G.P.x,G.P.y-26,'Doreen: seconds!','#f3e5c8');}
  if(hasN('tunde')){G.players.forEach(function(p){p.hands.forEach(function(h){var s=wst(h);if(s.res)h.res=Math.min(s.res,h.res+Math.ceil(s.res*0.3));});});G.bag.forEach(function(it){if(it&&it.k==='weapon'){var s=wst(it);if(s.res)it.res=Math.min(s.res,it.res+Math.ceil(s.res*0.3));}});ftext(G.P.x,G.P.y-34,'Special delivery: ammo','#c9a36a');}
  if(hasN('hilda')){var intr=Math.min(300,Math.floor(G.points*0.05));if(intr>0){G.points+=intr;ftext(G.P.x,G.P.y-42,'Interest +'+intr,'#f0c24a');}}
  G.players.forEach(function(p){if(p.hero.id==='joan'&&!p.out){var fp=randFloorNear(p.x,p.y,40);G.pickups.push({x:fp.x,y:fp.y,heal:30,kind:'flower',t:0});}});
  var title='ROUND '+G.round,sub='';
  if(G.special==='gnomes'){sub='Gnomes! Lots of small, fast gnomes. They squeeze through windows.';jingle('special');chat('gnomes',null,true);}
  else if(G.special==='pigeons'){sub=hasN('eddie')?'Pigeons! Eddie\'s birds are on your side for this one.':'Pigeons! They fly straight over the walls.';jingle('special');chat('pigeons',null,true);}
  else if(G.special==='boss'){title='FINAL ROUND';sub=BOSSES[G.quest.bossId].name+' is coming.';sfx('boss');}
  else{jingle('start');if(rnd()<0.35)chat('roundStart');}
  toast(title,sub);
  if(G.round>1&&Math.random()<0.3){var sp=upPlayers();if(sp.length)say(pick(sp),pick(sp[0].hero.lines),2.6);}}
function endRound(){G.rstate='rest';G.restT=9;jingle('end');
  if(G.special==='gnomes'||G.special==='pigeons'){G.st.special++;var p=upPlayers()[0]||G.P;spawnDrop('ammo',p.x+rnd(-20,20),p.y+rnd(-20,20));}
  if(upN('pat')&&G.round+1>=G.nextSpecial&&!G.quest.bossNext){say(hasN('pat'),'Something odd on the airwaves. Next round will be different.',4);}
  else if(rnd()<0.3)banter();else if(rnd()<0.5)chat('rest');
  if(G.quest.bossNext&&!G.quest.boss)toast('The '+boardName()+' is glowing','Something big is coming next round.');}
function randFloorNear(x,y,r){for(var k=0;k<20;k++){var a=rnd(TAU),d=rnd(8,r),px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(walkable(px,py))return {x:px,y:py};}return {x:x,y:y};}

function pickWindow(){var ups=upPlayers(),ref=ups.length?pick(ups):G.players[0],pr=roomIdxAt(ref.x,ref.y),list=[],ws=[];
  M.windows.forEach(function(w){var r=M.rooms[w.room];if(!r.open)return;var wt=1;if(w.room===pr)wt=4;else if(pr>=0&&Math.abs(r.cx-M.rooms[pr].cx)+Math.abs(r.cy-M.rooms[pr].cy)===1)wt=2.5;list.push(w);ws.push(wt);});
  if(!list.length)return M.windows[0];var tot=ws.reduce(function(a,b){return a+b;},0),x=rnd(tot);for(var i=0;i<list.length;i++){x-=ws[i];if(x<=0)return list[i];}return list[0];}

  else if(kind==='pigeon'){z.hp*=0.25;z.spd=52*G.diff.zsp;z.dmg*=0.4;z.state='fly';var ref=pick(upPlayers().length?upPlayers():G.players),a=rnd(TAU),dd=rnd(190,230);z.x=ref.x+Math.cos(a)*dd;z.y=ref.y+Math.sin(a)*dd;z.alt=10;z.max=z.hp;G.zs.push(z);return z;}
  else if(kind!=='boss'){var roll=rnd();if(r>=8&&roll<0.08){z.type='bruiser';z.hp*=4;z.spd=18;z.dmg*=1.5;z.scale=1.45;}else{var pr=r<3?0:r<6?0.3:r<10?0.6:0.85;if(rnd()<pr)z.spd=rnd()<(r<6?0.3:0.6)?42:29;}
    if(rnd()<0.5)z.spd*=rnd(0.9,1.1);}
  z.spd*=G.diff.zsp;if(fcIs('heat'))z.spd*=1.12;if(fcIs('street'))z.spd*=1.06;
  z.max=z.hp;if(!z.look)z.look=zombieLookFor(G.map);

  z.x=w.ox+w.nx*off+(w.ny!==0?tan:0);z.y=w.oy+w.ny*off+(w.nx!==0?tan:0);z.state='out';G.zs.push(z);return z;}

function updateBullets(dt){for(var i=G.bullets.length-1;i>=0;i--){var b=G.bullets[i],steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/5)),dead=false;

      if(b.roll){b.vx*=Math.pow(0.6,dt/steps);b.vy*=Math.pow(0.6,dt/steps);}
      if(b.life<=0){dead=true;if(b.kind==='lob')explode(b);break;}
      if(!shotPass(b.x,b.y)){if(b.bounce>0){b.bounce--;b.x-=sx;b.y-=sy;if(!shotPass(b.x+sx,b.y))b.vx=-b.vx;else b.vy=-b.vy;}else{dead=true;if(b.kind==='lob')explode(b);part(b.x,b.y,b.col,2,30,0.25);}break;}
      if(b.from==='p'&&b.kind!=='lob'&&shootPuzzle(b)){dead=true;break;}
      for(var k=0;k<G.zs.length;k++){var z=G.zs[k];if(z.hp<=0||b.hit.indexOf(z)>=0)continue;var zr=(z.type==='pigeon'||z.boss==='pigeon'?5:6)*z.scale+b.r,zy=z.y-(z.alt!==undefined?z.alt:7*z.scale);
        if(d2(b.x,b.y,z.x,zy)<zr*zr){if(b.kind==='lob'){dead=true;explode(b);break;}
          b.hit.push(z);var a=Math.atan2(b.vy,b.vx);hurtZ(z,b.dmg,{a:a,knock:b.knock});
          if(b.fx==='burn'){z.burn=3;z.burnD=b.dmg*0.3;}if(b.fx==='slow')z.slow=2.2;if(b.fx==='splash'){G.zs.forEach(function(o){if(o!==z&&o.hp>0&&d2(o.x,o.y,z.x,z.y)<22*22)hurtZ(o,b.dmg*0.5,null,{silent:true});});part(z.x,zy,b.col,5,50,0.3);}
          if(b.fx==='bounce'){var n=b.bounceN!==undefined?b.bounceN:2;if(n>0){var nx=null,nd=95*95;G.zs.forEach(function(o){if(o.hp<=0||b.hit.indexOf(o)>=0)return;var q=d2(o.x,o.y,z.x,z.y);if(q<nd){nd=q;nx=o;}});if(nx){b.bounceN=n-1;var na=Math.atan2(nx.y-7-zy,nx.x-z.x),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;b.life=Math.max(b.life,120);continue;}}}
          if(b.pierce>0){b.pierce--;}else{dead=true;break;}}}}
    if(dead)G.bullets.splice(i,1);}}

function flowFromMany(pts,out){out.fill(32767);var h=0,t=0;pts.forEach(function(p){var tx=clamp(Math.floor(p.x/T),0,MW-1),ty=clamp(Math.floor(p.y/T),0,MH-1),s=ty*MW+tx;if(out[s]!==0){out[s]=0;BFSQ[t++]=s;}});
  while(h<t){var u=BFSQ[h++],ux=u%MW,uy=(u-ux)/MW,du=out[u]+1,v;
    if(ux>0){v=u-1;if(out[v]>du&&walkT(v)){out[v]=du;BFSQ[t++]=v;}}
    if(ux<MW-1){v=u+1;if(out[v]>du&&walkT(v)){out[v]=du;BFSQ[t++]=v;}}
    if(uy>0){v=u-MW;if(out[v]>du&&walkT(v)){out[v]=du;BFSQ[t++]=v;}}
    if(uy<MH-1){v=u+MW;if(out[v]>du&&walkT(v)){out[v]=du;BFSQ[t++]=v;}}}}

function update(dt){G.time+=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt*20);if(G.flashT>0)G.flashT-=dt;
  if(G.state==='dawn'){G.dawnT-=dt;updateParts(dt);if(G.dawnT<=0){G.state='dawnchoice';showDawn();}return;}
  if(G.state==='bag'){if(G.diff.bagPause)return;dt*=0.25;}
  else if(G.state!=='play')return;
  if(G.dbl>0)G.dbl-=dt;if(G.insta>0)G.insta-=dt;if(G.teaT>0)G.teaT-=dt;
  /* flow fields towards whoever is still up */

  if(G.flowT<=0||sig!==G.fsig){G.flowT=0.35;G.fsig=sig;flowFromMany(refs,M.dist);G.flowP=M.dist;var lure=G.fx.filter(function(f){return f.k==='lure';})[0];if(lure){flowFrom(lure.x,lure.y,M.dist2);G.flowL=M.dist2;}}
  for(var pi=0;pi<G.players.length;pi++){updatePlayer(G.players[pi],dt,readInput(pi));if(G.state==='over')return;}
  G.P=G.players[0];
  for(var i=G.pickups.length-1;i>=0;i--){var pk=G.pickups[i];pk.t+=dt;if(pk.cool>0)pk.cool-=dt;if(pk.life!==undefined){pk.life-=dt;if(pk.life<=0)G.pickups.splice(i,1);}}
  for(i=G.drops.length-1;i>=0;i--){var dr=G.drops[i];dr.t+=dt;dr.life-=dt;if(dr.life<=0)G.drops.splice(i,1);}
  M.windows.forEach(function(w){if(w.shake>0)w.shake-=dt;if(w.climbing>0)w.climbing-=dt;if(w.planks>winMax())w.planks=winMax();});

  else if(G.rstate==='active'){if(G.toSpawn>0){G.spawnT-=dt;var alive=G.zs.length,cap=18+Math.min(8,G.round)+(G.two?6:0);

  G.bingoT=(G.bingoT||0)-dt;if(G.bingoT<=0){G.bingoT=0.5;checkBingo();}

  var firsts=G.nbrs.filter(function(n){return n.joined&&n.first;}).length;if(firsts)rows.push(['Meeting someone new',firsts*2]);
  if(st.keep)rows.push(['Keepsakes returned ('+st.keep+')',st.keep*2]);if(G.quest.puzzle)rows.push(['Puzzle solved',5]);
  var lc=lineCount();if(lc)rows.push(['Bingo lines ('+lc+')',lc*4*(m.own.gold_card?2:1)]);
  if(G.bingo.full)rows.push(['Full house',12]);if(won)rows.push(['Held on until dawn',12]);
  var base=rows.reduce(function(a,r){return a+r[1];},0),mult=G.diff.thr*(FORECASTS[G.fc]?FORECASTS[G.fc].thr:1),earned=Math.max(1,Math.round(base*mult));
  m.threads+=earned;m.total+=earned;m.runs++;if(won)m.wins++;m.kills+=st.kills;m.rounds+=rounds;if(G.round>(m.best[G.diffId]||0))m.best[G.diffId]=G.round;
  var jayNew=false;if(won&&!m.jay){m.jay=true;jayNew=true;}
  G.nbrs.forEach(function(n){if(n.joined)m.helped[n.def.id]=true;});metaSet(m);G.meta=m;
  G.result={won:won,rows:rows,mult:mult,earned:earned,jayNew:jayNew,rounds:rounds};
  postNight();showHUD(false);showResults();}

function infoHTML(it,sel){var P=G.P,name,ty,d,acts=[];var near=G.nbrs.filter(function(n){return n.joined&&n.state!=='down'&&n.state!=='gone'&&dist(n,P)<70;});

    if(act==='use'){if(it.k==='trinket'&&G.trinkets.length>=trinkCap()){var old=G.trinkets.shift();G.trinkets.push(it.id);G.bag[sel.i]={k:'trinket',id:old};G.st.worn=Math.max(G.st.worn,G.trinkets.length);sfx('use');}else useSlot(sel.i,true);}

    else if(act==='givew'&&N){if(N.gun){var back=Object.assign({k:'weapon'},N.gun);G.bag[sel.i]=back;}else G.bag[sel.i]=null;N.gun={id:it.id,up:it.up};say(N,'Ooh, how exciting!',2);sfx('pick');G.st.given++;}
    else if(act==='givef'&&N){it.n--;if(it.n<=0)G.bag[sel.i]=null;N.hp=N.max;say(N,'Lovely, thank you.',2);sfx('use');G.st.given++;}}
  else if(sel.w==='hand'){var h=P.hands[sel.i];if(!h){G.P=G.players[0];return;}
    if(act==='stow'){var ow=Object.assign({k:'weapon'},h);if(P.hands.length>1){if(bagAdd(ow)){P.hands.splice(sel.i,1);P.cur=0;}}else if(bagAdd(ow)){P.hands.splice(sel.i,1);P.hands.push(mkW(P.hero.id==='jay'?'stars':'pea'));P.hands[0].res=0;P.hands[0].mag=wst(P.hands[0]).mag;P.cur=0;}}

  else if(sel.w==='trink'){if(act==='untrink'){var tid=G.trinkets[sel.i];if(bagAdd({k:'trinket',id:tid})){G.trinkets.splice(sel.i,1);G.players.forEach(function(p){if(p.hp>maxHp(p))p.hp=maxHp(p);});}else toast('No room in the satchel','Leave something behind first.');}}

  if(m.threads<q.cost){sfx('deny');return;}if(quiltAsk!==v){quiltAsk=v;showQuilt();return;}m.threads-=q.cost;m.own[v]=true;metaSet(m);quiltAsk=null;sfx('join');showQuilt();};

/* album */

  NEIGHBOURS.forEach(function(d){var met=m.helped[d.id],locked=d.lock&&!m.own[d.lock];
    n+=met?'<div class="aslot">'+portraitImg(d.look,56,'#5a3f6b')+'<div><b>'+d.name+'</b><span style="color:var(--muted);font-size:13px">'+d.role+'</span><p style="margin:6px 0 0;font-size:14px">'+esc(d.story)+'</p></div></div>':
      '<div class="aslot no">'+portraitImg(d.look,56,'#3a2c47',true)+'<div><b>'+(locked?'Not moved in yet':'Not met yet')+'</b>'+(locked?'Sew their patch on the Community Quilt.':'Help them on a night to hear their story.')+'</div></div>';});
  Object.keys(KEEPSAKES).forEach(function(id){var K=KEEPSAKES[id];k+=m.keeps[id]?'<div class="aslot wide"><div><b>'+K.name+'</b>'+esc(K.m)+'</div></div>':'<div class="aslot no wide"><div><b>A missing keepsake</b>Find it on a night and bring it home.</div></div>';});
  Object.keys(BOSSES).forEach(function(id){var B=BOSSES[id];b+=m.bosses[id]?'<div class="aslot wide"><div><b>'+B.name+': beaten</b>'+esc(B.d)+'</div></div>':'<div class="aslot no wide"><div><b>'+B.name+'</b>Not beaten yet.</div></div>';});
  var pz=Object.keys(PUZZLES).map(function(id){return (m.puzzles[id]?'Solved: ':'Not solved yet: ')+PUZZLES[id].name;}).join('. ');
  var cnt=Object.keys(m.helped).length,kc=Object.keys(m.keeps).length;
  showOv('<div class="sheet"><div class="kick">Neighbours, keepsakes and bosses</div><h2>The people of Chilton Bridge</h2><p>'+cnt+' of '+NEIGHBOURS.length+' neighbours met. '+kc+' of '+Object.keys(KEEPSAKES).length+' keepsakes found.</p><div class="album">'+n+'</div><h3>Keepsakes</h3><div class="album">'+k+'</div><h3>Bosses</h3><div class="album">'+b+'</div><h3>Puzzles</h3><p style="font-size:15px">'+esc(pz)+'.</p>'+
   '<div class="row end" style="margin-top:16px"><button class="btn gold" data-act="title" autofocus>Done</button></div></div>');}
ovHandlers.album=function(){showAlbum();};

/* how to play */
var howView=1;
var KB_ROWS=[['Esc','1','2','3','4','5','6','7','8','9','0'],['Tab','Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L',';',"'"],['ShiftL','Z','X','C','V','B','N','M',',','.','/','ShiftR'],['Space','Enter']];
var KB_1={W:'Move',A:'Move',S:'Move',D:'Move',E:'Use, buy, talk. Hold at windows',R:'Reload',Q:'Swap weapon',V:'Shove',F:'Shove',C:'Call neighbours',M:'Big map',Space:'Special ability',ShiftL:'Hurry',Tab:'Satchel',Esc:'Pause','1':'Items 1 to 8','2':'Items 1 to 8','3':'Items 1 to 8','4':'Items 1 to 8','5':'Items 1 to 8','6':'Items 1 to 8','7':'Items 1 to 8','8':'Items 1 to 8'};
var KB_2a={W:'Move',A:'Move',S:'Move',D:'Move',E:'Use',Q:'Swap',R:'Reload',F:'Shove',V:'Shove',Space:'Ability',ShiftL:'Hurry','1':'Items 1 to 4','2':'Items 1 to 4','3':'Items 1 to 4','4':'Items 1 to 4'};
var KB_2b={Enter:'Use',',':'Swap',';':'Reload','.':'Shove','/':'Ability',ShiftR:'Hurry','7':'Items 1 to 4','8':'Items 1 to 4','9':'Items 1 to 4','0':'Items 1 to 4',Up:'Move',Down:'Move',Left:'Move',Right:'Move'};
var KB_SH={C:'Call neighbours',M:'Big map',Tab:'Satchel',Esc:'Pause'};
function keyboardHTML(two){function lab(k){return {ShiftL:'Shift',ShiftR:'Shift',Space:'Space',Enter:'Enter',Tab:'Tab',Esc:'Esc',Up:'&#9650;',Down:'&#9660;',Left:'&#9664;',Right:'&#9654;'}[k]||esc(k);}
  function cls(k){if(!two)return k in KB_1?' k1':'';var a=k in KB_2a,b=k in KB_2b,c=k in KB_SH;return a?' k1':b?' k2':c?' ks':'';}
  function key(k){var w={Space:' kspace',ShiftL:' kwide',ShiftR:' kwide',Enter:' kwide',Tab:' kwide',Esc:''}[k]||'';return '<span class="key'+w+cls(k)+'">'+lab(k)+'</span>';}
  var rows=KB_ROWS.map(function(r,i){return '<div class="krow r'+i+'">'+r.map(key).join('')+'</div>';}).join('');
  var arrows='<div class="karrows"><div class="krow">'+key('Up')+'</div><div class="krow">'+key('Left')+key('Down')+key('Right')+'</div></div>';
  function list(map,c){var seen={},out=[];Object.keys(map).forEach(function(k){if(!map[k]||seen[map[k]])return;seen[map[k]]=1;var ks=Object.keys(map).filter(function(q){return map[q]===map[k]||(map[q]===''&&false);});out.push('<li><span class="key mini'+c+'">'+ks.map(lab).join(' ')+'</span>'+esc(map[k])+'</li>');});return '<ul class="klist">'+out.join('')+'</ul>';}
  var legend=two?'<div class="klegs"><div><b class="t1">Player 1</b>'+list(KB_2a,' k1')+'</div><div><b class="t2">Player 2</b>'+list(KB_2b,' k2')+'</div><div><b class="t3">Both</b>'+list(KB_SH,' ks')+'<p class="hint">Auto aim and auto fire are on for both players.</p></div></div>':
    '<div class="klegs one">'+list(KB_1,' k1')+'<p class="hint">Aim with the mouse and click to fire, or leave auto aim on in Settings. Right click shoves.</p></div>';
  return '<div class="kbd"><div class="kmain">'+rows+'</div>'+(two?arrows:'')+'</div>'+legend;}
function showHow(fromPause){var two=howView===2;showOv('<div class="sheet"><div class="kick">How to play</div><h2>Hold on until morning</h2>'+
  '<div class="seg tight" style="margin:6px 0 12px"><button class="btn sm" data-act="howview" data-v="1" aria-pressed="'+(!two)+'">One player</button><button class="btn sm" data-act="howview" data-v="2" aria-pressed="'+two+'">Two players, one keyboard</button></div>'+
  keyboardHTML(two)+
  '<div class="cols2" style="margin-top:14px"><div><h3>The idea</h3><p>Zombies climb in through the windows every round. Hitting them earns <strong>points</strong> to spend on doors, weapons, perk machines and the jumble box.</p>'+
  '<p><strong>Neighbours</strong> are hiding in the rooms. Help them and they join you.</p></div>'+
  '<div><h3>Reaching the morning</h3><p>Bring home three <strong>keepsakes</strong>, solve tonight\'s <strong>puzzle</strong> and turn on the <strong>power</strong>. The chips under the map show what is left. Then beat the boss to see the dawn.</p>'+
  '<p>If someone goes down, a partner or a neighbour can stand next to them and hold use to help them up.</p></div></div>'+
  '<div class="row end" style="margin-top:14px"><button class="btn gold" data-act="'+(fromPause?'backpause':'title')+'" autofocus>'+(fromPause?'Back':'Done')+'</button></div></div>');G.howFromPause=fromPause;}
ovHandlers.howview=function(v){howView=+v;showHow(G.howFromPause);};
ovHandlers.how=function(){showHow(false);};

/* settings */
var SET_LIST=[['sound','Sound effects',''],['music','Music','A quiet drone and music box'],['autoAim','Auto aim','Aims at the nearest zombie you can see. Always on with two players.'],['autoFire','Auto fire','Fires on its own when auto aim has a target'],['hints','Ideas','A short tip under the round number when you might be stuck'],['shake','Screen shake',''],['flash','Flashes','Red flash when hurt, and white flashes for big moments and lightning']];
function showSettings(fromPause){showOv('<div class="sheet narrow"><div class="kick">Settings</div><h2>Make it yours</h2><div class="togs">'+SET_LIST.map(function(s){return '<button class="tog" role="switch" aria-checked="'+(!!settings[s[0]])+'" data-act="tog" data-v="'+s[0]+'"><span>'+s[1]+(s[2]?'<small>'+s[2]+'</small>':'')+'</span><em>'+(settings[s[0]]?'ON':'OFF')+'</em></button>';}).join('')+
  '</div><div class="row end"><button class="btn gold" data-act="'+(fromPause?'backpause':'title')+'" autofocus>Done</button></div></div>');G.setFromPause=fromPause;}
ovHandlers.settings=function(){showSettings(false);};
ovHandlers.tog=function(v){settings[v]=!settings[v];saveSettings();if(v==='music')setMusic(settings.music);showSettings(G.setFromPause);};

/* class noticeboard (artifact only) */
G.classInfo=null;
function initClass(){if(!window.claude||typeof window.claude.use!=='function')return;window.claude.use('db').then(function(db){if(!db)return;G.db=db;
  try{db.collection('nights').orderBy('at','desc').limit(300).onSnapshot(function(snap){var n=0,rounds=0,helped=0,dawns=0,recent=[];snap.docs.forEach(function(d){var x=d.data()||{};n++;rounds+=+x.round||0;helped+=+x.helped||0;if(x.won)dawns++;if(recent.length<3)recent.push(x);});
    G.classInfo={n:n,rounds:rounds,helped:helped,dawns:dawns,recent:recent};renderNotice();},function(){});}catch(e){}}).catch(function(){});}
function renderNotice(){var el=$('notice');if(!el||!G.classInfo)return;var c=G.classInfo;el.hidden=false;
  el.innerHTML='<b>BASE 5 NOTICEBOARD</b><p>Together: <span class="big">'+fmt(c.rounds)+'</span> rounds survived, '+c.helped+' neighbours helped and '+c.dawns+' dawns seen, across '+c.n+' nights.</p>'+
   (c.recent.length?'<p style="color:var(--muted)">'+c.recent.map(function(x){var names=String(x.hero||'mavis').split('+').map(function(h){return heroById(h).name;}).join(' and ');return esc(names)+(x.won?' saw the dawn':' reached round '+(+x.round||0));}).join('. ')+'.</p>':'');}
function postNight(){if(!G.db)return;try{G.db.collection('nights').add({hero:G.players.map(function(p){return p.hero.id;}).join('+'),round:G.round,helped:G.st.helped,won:!!G.won,diff:G.diffId,fc:G.fc,map:G.map,at:Date.now()}).catch(function(){});}catch(e){}}

/* ================= INPUT ================= */
var keys=Object.create(null),codes=Object.create(null),mouse={bx:192,by:108,down:false},touch={move:null,fire:false,use:false,sprint:false};
function mouseWorld(){return {x:(G.cx||0)+mouse.bx,y:(G.cy||0)+mouse.by};}
function readInput(pi){var auto=G.two||settings.autoAim||!!G.touch;
  if(!G.two){var mx=0,my=0;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(touch.move){mx=touch.move.x;my=touch.move.y;}
    return {mx:mx,my:my,sprint:!!(keys.shift||touch.sprint),use:!!(keys.e||keys.enter||touch.use),fire:!!(mouse.down||touch.fire),auto:auto,autoFire:settings.autoFire&&auto};}
  if(pi===0)return {mx:(codes.KeyD?1:0)-(codes.KeyA?1:0),my:(codes.KeyS?1:0)-(codes.KeyW?1:0),sprint:!!codes.ShiftLeft,use:!!codes.KeyE,fire:false,auto:true,autoFire:true};
  return {mx:(codes.ArrowRight?1:0)-(codes.ArrowLeft?1:0),my:(codes.ArrowDown?1:0)-(codes.ArrowUp?1:0),sprint:!!codes.ShiftRight,use:!!(codes.Enter||codes.NumpadEnter),fire:false,auto:true,autoFire:true};}
window.addEventListener('keydown',function(e){var k=e.key.toLowerCase(),c=e.code;if(k==='tab'&&(G.state==='play'||G.state==='bag'))e.preventDefault();
  if((G.state==='play')&&([' ','arrowup','arrowdown','arrowleft','arrowright','/',"'"].indexOf(k)>=0||c==='Slash'||c==='Quote'))e.preventDefault();
  var fresh=!codes[c];codes[c]=true;if(!keys[k]&&fresh)onKeyPress(k,e,c);keys[k]=true;});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;codes[e.code]=false;if(e.key.toLowerCase()==='m'&&!G.mapPinned)openMap(false);});
window.addEventListener('blur',function(){keys=Object.create(null);codes=Object.create(null);mouse.down=false;if(G.state==='play')showPause();});
function act(P,a,arg){if(!P||P.out)return;withP(P,function(){
  if(a==='use'){var pr=P.prompt;if(ovEl.hidden&&pr&&pr.p&&!pr.p.hold&&!pr.p.no)doInteract(pr.it);else if(pr&&pr.p&&pr.p.no)sfx('deny');}
  else if(a==='reload')startReload();
  else if(a==='swap'){if(P.hands.length>1){P.cur=(P.cur+1)%P.hands.length;P.relT=0;sfx('reload');}}
  else if(a==='abil')useAbility();
  else if(a==='shove')shove();
  else if(a==='item'){if(arg<G.bag.length)useSlot(arg,false);}});}
function onKeyPress(k,e,c){audioInit();
  if(G.state==='bag'){if(k==='tab'||k==='escape'||k==='i'||k==='b'){closeBag();}return;}
  if(G.state==='pause'&&(k==='escape'||k==='p')){closeOv();G.state='play';return;}
  if(G.state==='dialog'&&k==='escape'){var b2=ovEl.querySelector('[data-act="meetno"],[data-act="resume"]');if(b2)b2.click();return;}
  if(G.state!=='play')return;var P1=G.players[0],P2=G.players[1];
  if(k==='m'){openMap(true);return;}
  if(k==='c'){callAll();G.calledOnce=true;return;}
  if(k==='tab'||(!G.two&&(k==='i'||k==='b'))){openBag();return;}
  if(k==='escape'||(!G.two&&k==='p')){showPause();return;}
  if(!G.two){
    if(k==='e'||k==='enter')act(P1,'use');else if(k==='r')act(P1,'reload');else if(k==='q')act(P1,'swap');else if(k===' ')act(P1,'abil');else if(k==='v'||k==='f')act(P1,'shove');
    else if(/^[1-8]$/.test(k))act(P1,'item',+k-1);return;}
  var map1={KeyE:'use',KeyR:'reload',KeyQ:'swap',Space:'abil',KeyF:'shove',KeyV:'shove',Digit1:0,Digit2:1,Digit3:2,Digit4:3};
  var map2={Enter:'use',NumpadEnter:'use',Semicolon:'reload',Comma:'swap',Slash:'abil',Period:'shove',Digit7:0,Digit8:1,Digit9:2,Digit0:3};
  if(c in map1){var a1=map1[c];if(typeof a1==='number')act(P1,'item',a1);else act(P1,a1);}
  else if(P2&&(c in map2)){var a2=map2[c];if(typeof a2==='number')act(P2,'item',a2);else act(P2,a2);}}
cv.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*view.dpr,py=(e.clientY-r.top)*view.dpr;mouse.bx=(px-view.ox)/view.s;mouse.by=(py-view.oy)/view.s;});
cv.addEventListener('mousedown',function(e){audioInit();if(e.button===2){if(G.state==='play'&&!G.two)act(G.players[0],'shove');return;}mouse.down=true;});
window.addEventListener('mouseup',function(){mouse.down=false;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){if(G.state!=='play'||G.two)return;var P=G.players[0];if(P.hands.length>1){P.cur=(P.cur+(e.deltaY>0?1:-1)+P.hands.length)%P.hands.length;P.relT=0;}},{passive:true});
$('hotbar').addEventListener('click',function(e){var el=e.target.closest('.hb');if(!el||G.state!=='play')return;var i=+el.getAttribute('data-i');if(G.bag[i])act(G.players[0],'item',i);else openBag();});
$('bagBtn').addEventListener('click',function(){if(G.state==='play')openBag();else if(G.state==='bag')closeBag();});
$('pauseBtn').addEventListener('click',function(){showPause();});
$('mapBtn').addEventListener('click',function(){G.mapPinned=$('bigmap').hidden;openMap($('bigmap').hidden);});
/* touch */
function setupTouch(){if(G.touchSetup)return;G.touchSetup=true;var tl=$('touch');
  var btns=[['USE','use',84,90],['ABIL','abil',16,160],['SHOVE','shove',84,160],['SWAP','swap',152,160],['RELOAD','reload',16,90],['RUN','sprint',152,90]];
  btns.forEach(function(bn){var el=document.createElement('div');el.className='tb';el.textContent=bn[0];el.style.right=(bn[2])+'px';el.style.bottom=(bn[3]+10)+'px';tl.appendChild(el);
    el.addEventListener('touchstart',function(e){e.preventDefault();audioInit();var a=bn[1],P=G.players[0];if(a==='use'){touch.use=true;act(P,'use');}else if(a==='sprint')touch.sprint=!touch.sprint;else act(P,a);},{passive:false});
    el.addEventListener('touchend',function(e){e.preventDefault();if(bn[1]==='use')touch.use=false;},{passive:false});});}
var stickId=null,stickO=null;
cv.addEventListener('touchstart',function(e){audioInit();if(!G.touch){G.touch=true;setupTouch();if(G.state==='play'&&!G.two)$('touch').hidden=false;}
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.clientX<window.innerWidth*0.5&&stickId===null){stickId=t.identifier;stickO={x:t.clientX,y:t.clientY};var s=$('stick');s.style.display='block';s.style.left=(t.clientX-55)+'px';s.style.top=(t.clientY-55)+'px';}}
  e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===stickId){var dx=t.clientX-stickO.x,dy=t.clientY-stickO.y,l=Math.hypot(dx,dy),m=Math.min(1,l/45);touch.move=l>6?{x:dx/l*m,y:dy/l*m}:null;var k=$('stick').firstChild;k.style.transform='translate('+(clamp(dx,-40,40))+'px,'+(clamp(dy,-40,40))+'px)';}}e.preventDefault();},{passive:false});
cv.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===stickId){stickId=null;touch.move=null;$('stick').style.display='none';}}},{passive:false});

/* ================= LOOP ================= */
var last=performance.now();
function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;try{update(dt);render();musicTick();if(!hudEl.hidden)hudTick(dt);placeBubbles();if(!$('bigmap').hidden)drawBigMap();}catch(err){if(!frame.err){frame.err=true;console.error(err);}}requestAnimationFrame(frame);}
function boot(){showTitle();initClass();requestAnimationFrame(function(n){last=n;frame(n);});}
window.__LS={G:G,touch:touch,keys:function(){return keys;},codes:function(){return codes;},start:startNight,update:update,render:render,spawn:spawnZombie,spawnBoss:spawnBoss,M:function(){return M;},interact:function(it,p){return withP(p||G.players[0],function(){return doInteract(it);});},find:function(p){return withP(p||G.players[0],findInteract);},prompt:function(it,p){return withP(p||G.players[0],function(){return promptFor(it);});},bagAdd:bagAdd,finish:finishNight,nextRound:nextRound,showTitle:showTitle,settings:settings,openDoor:openDoor,useAbility:function(p){withP(p||G.players[0],useAbility);},useSlot:function(i,p){return withP(p||G.players[0],function(){return useSlot(i,false);});},giveWeapon:function(w,p){withP(p||G.players[0],function(){giveWeapon(w);});},mkW:mkW,joinN:joinN,usePuzzle:usePuzzle,hitBall:hitBall,act:act};
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot();
})();
