<head>

<title>Edexcel English Language Paper 1 - Base 5</title>

<style>
:root{--ink:#231f20;--grey:#8c8c8c;--line:#9a9a9a;--teal:#007291;--orange:#ef7724;--hint:#e3f3f6;--desk:#e9e6e3;--hl:#fff1b8;
  --sans:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button{font-family:inherit;cursor:pointer}

/* smart bar */
.sbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d6d2ce;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.sbar .home{width:38px;height:38px;border:1px solid #d6d2ce;border-radius:10px;background:#fff;display:grid;place-items:center;text-decoration:none}
.sbar .home svg{width:22px;height:22px}
.sbar .ttl{font-weight:700;flex:1;min-width:120px;font-size:15px}
.sbar .ttl small{display:block;font-weight:400;color:#666;font-size:13px}
.sbar .clock{font-variant-numeric:tabular-nums;color:#555;font-size:14px;white-space:nowrap}
.sbar .saved{font-size:13px;color:var(--teal);min-width:46px}
.sbar .btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px}
.sbar .ins{background:#f1eeeb;color:var(--ink)}
.sbar .hand{background:var(--teal);color:#fff}

/* layout */
.wrap{display:grid;grid-template-columns:1fr;gap:22px;max-width:1500px;margin:0 auto;padding:22px 14px 120px}
@media (min-width:1080px){
  .wrap{grid-template-columns:minmax(380px,44%) 1fr;align-items:start}
  .insert{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
  .sbar .ins{display:none}
}
@media (max-width:1079px){
  .insert{position:fixed;inset:57px 0 0 0;z-index:15;overflow:auto;background:var(--desk);padding:14px;transform:translateX(-102%);transition:transform .25s}
  .insert.open{transform:none}
}

/* paper pages */
.page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);margin:0 auto 22px;max-width:800px;position:relative;padding:34px 58px 30px}
.page.margins::before,.page.margins::after{content:'DO NOT WRITE IN THIS AREA   DO NOT WRITE IN THIS AREA   DO NOT WRITE IN THIS AREA';position:absolute;top:0;bottom:0;width:30px;writing-mode:vertical-rl;text-align:center;font-size:11px;font-weight:700;color:#b3b3b3;letter-spacing:.6px;white-space:pre;overflow:hidden;
  background:repeating-linear-gradient(45deg,#efefef 0 2px,#fff 2px 5px);pointer-events:none}
.page.margins::before{left:6px;transform:rotate(180deg)}
.page.margins::after{right:6px}
.frame{border:2px solid #a6a6a6;border-radius:14px;padding:18px 20px}
.pnum{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:13px;font-weight:700}
.pnum i{font-style:italic}

/* cover */
.cover .check{font-size:12px;font-weight:700;text-align:center;margin:-6px 0 6px}
.cand{display:grid;grid-template-columns:1fr 160px;border:2px solid #a6a6a6;border-radius:12px;overflow:hidden;margin-bottom:10px}
.cand div{padding:4px 10px;font-size:13px;min-height:44px}
.cand div+div{border-left:2px solid #a6a6a6}
.cand b{display:block;font-size:20px;font-weight:700;letter-spacing:2px;margin-top:2px}
.nums{display:flex;gap:26px;margin:2px 0 14px;font-size:13px}
.nums .boxes{display:flex;margin-top:3px}
.nums .boxes i{width:30px;height:38px;border:2px solid #a6a6a6;display:block;margin-left:-2px}
.nums .boxes i:first-child{border-radius:8px 0 0 8px;margin-left:0}
.nums .boxes i:last-child{border-radius:0 8px 8px 0}
.qual{font-size:26px;font-weight:700;margin:6px 0 10px}
.date{border:2px solid #a6a6a6;border-radius:12px;padding:6px 12px;font-size:30px;font-weight:700;margin-bottom:12px}
.refrow{display:flex;align-items:stretch;gap:0;margin-bottom:0}
.refrow .tm{flex:1;font-size:14px;padding:8px 0}
.refrow .pr{font-size:12px;font-weight:700;border:2px solid #a6a6a6;border-bottom:0;border-radius:10px 0 0 0;padding:4px 8px;line-height:1.2}
.refrow .code{background:#595959;color:#fff;font-size:34px;font-weight:700;padding:4px 18px;border-radius:0 12px 0 0}
.subj{border:2px solid #a6a6a6;border-radius:12px 0 12px 12px;padding:10px 16px 26px;margin-bottom:12px}
.subj h1{font-size:34px;margin:0}
.subj h2{font-size:20px;margin:2px 0 0}
.musthave{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:16px}
.musthave div{border:2px solid #a6a6a6;border-radius:12px;padding:8px 12px;font-size:14px;min-height:64px}
.musthave b{display:block}
.cover h3{font-size:16px;margin:16px 0 4px}
.cover ul{margin:0;padding-left:20px;font-size:14.5px}
.cover li{margin:2px 0}
.cover li::marker{content:'\25CF  ';font-size:11px}

/* questions */
.sect{text-align:center;font-weight:700;margin:0 0 12px}
.sect span{display:block;margin:4px 0}
.q{position:relative;margin:18px 0 6px}
.q .qn{display:grid;grid-template-columns:34px 1fr;gap:0;padding-right:40px}
.q .qn>b{font-size:16px}
.q .qt p{margin:0 0 8px}
.q .qt ul{margin:4px 0 8px;padding-left:18px}
.q .mk{text-align:right;color:var(--grey);font-weight:700;margin:-4px 0 2px}
.q .tot{text-align:right;font-weight:700;margin:8px 0 0;padding-bottom:10px;border-bottom:1.5px solid #8c8c8c}
.extract-box{border:1.5px solid #a6a6a6;border-radius:12px;padding:10px 14px;margin:6px 0 12px;font-size:15px}
.q.focus .qn>b{color:var(--teal)}
.lref{color:inherit;text-decoration:underline dotted var(--teal);text-underline-offset:3px;cursor:pointer}
.hintbtn{position:absolute;right:0;top:-2px;width:30px;height:30px;border-radius:50%;border:1.5px solid #c9c3be;background:#fff;color:#777;font-weight:700;font-size:15px}
.hintbtn:hover{border-color:var(--teal);color:var(--teal)}
.hinttext{background:var(--hint);border-radius:10px;padding:8px 12px;margin:0 0 8px 34px;font-size:15px}
@media (max-width:640px){
  .sbar{gap:6px;padding:6px 10px;flex-wrap:nowrap}.sbar .ttl{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sbar .clock{display:none}.sbar .ttl small,.sbar .saved{display:none}.sbar .ttl{font-size:14px}.sbar .btn{padding:8px 10px;font-size:14px}
  .itext{font-size:15px}
  .page{padding:22px 16px 22px}
  .page.margins::before,.page.margins::after{display:none}
  .q .qn{grid-template-columns:26px 1fr}
  .hinttext{margin-left:0}
  .date{font-size:22px}.subj h1{font-size:26px}.refrow .code{font-size:24px}.qual{font-size:19px}
}

/* answer lines */
.lined{background-image:radial-gradient(circle at 2px 32px,#8c8c8c 0.9px,transparent 1.2px);background-size:5px 34px;background-repeat:repeat;min-height:34px}
.ans{display:block;width:100%;border:0;outline:0;resize:none;overflow:hidden;background:transparent;font:17px/34px var(--sans);color:#16365c;padding:0 2px;margin:0;height:34px}
textarea.ans{min-height:68px}
.lined:focus-within{background-color:rgba(32,173,202,.05)}
.numbered{display:grid;grid-template-columns:26px 1fr;align-items:end}
.numbered span{font-size:16px;line-height:34px}
.wc{text-align:right;font-size:12px;color:#999;margin-top:2px;min-height:16px}

/* section B */
.choose{font-weight:700;font-size:15px;margin:10px 0}
.choose .row{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:8px;font-weight:400}
.xbox{display:inline-flex;align-items:center;gap:8px;border:0;background:none;font-size:16px;font-weight:700;padding:4px 0}
.xbox i{width:20px;height:20px;border:1.5px solid #8c8c8c;display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1;color:var(--ink)}
.planbox{border:1.5px solid #a6a6a6;border-radius:14px;padding:6px 12px;margin:8px 0 16px}
.planbox textarea{min-height:170px}
.imgph{border:1.5px dashed #a6a6a6;border-radius:10px;padding:10px 12px;color:#555;font-size:14px;margin:6px 0}

/* insert */
.insert .page{padding:24px 20px}
.insert .ins-cover{border:2px solid #a6a6a6;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.insert .ins-cover b{display:block}
.itext{font-size:14px;line-height:1.6;letter-spacing:-.1px}
.iln>span:first-child{padding-left:14px;text-indent:-14px}
.iln{display:grid;grid-template-columns:1fr 30px;gap:6px;border-radius:4px;transition:background .3s}
.iln .n{color:#8c8c8c;font-size:12px;text-align:right;padding-top:3px}
.iln.gap{margin-bottom:9px}
.iln.hl{background:var(--hl)}
.iintro{font-style:italic;margin:0 0 10px}
.ihead{font-weight:700;font-style:italic;margin:0 0 10px}
.booknote{background:#f6f3f0;border-radius:10px;padding:12px 14px;font-size:15px}
.bookframe{width:100%;height:calc(100vh - 220px);min-height:520px;border:1px solid #ccc;border-radius:8px}

/* hand in */
.handin{max-width:800px;margin:0 auto;background:#fff;border-radius:14px;padding:22px 26px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.handin h2{margin:0 0 6px;font-size:22px}
.handin .big{border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:19px;padding:14px 26px}
.handin .big[disabled]{opacity:.5}
.handin .soft{border:1px solid #cfd8db;border-radius:10px;background:#fff;color:var(--teal);font-weight:700;padding:10px 16px;margin-right:8px}
.res{margin-top:14px;display:grid;gap:6px}
.res div{display:flex;justify-content:space-between;gap:10px;border-radius:8px;padding:8px 12px;background:#f6f3f0;font-size:15px}
.res div.got{background:#e3f3f6}
.res div b{white-space:nowrap}
.status{margin-top:12px;font-size:15px}
.status p{margin:4px 0}
.ok{color:var(--teal);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231f20;color:#fff;border-radius:10px;padding:10px 16px;z-index:40;font-size:15px}
.toast[hidden]{display:none}

</style>

      var n = i+1;
      var txt = esc(t).replace(/\*([a-z]+)\*/g,'<i>$1</i>');
      var row = h('div',{class:'iln'+(I.gaps.indexOf(n)>=0?' gap':''),html:'<span>'+txt+'</span><span class="n">'+(n%5===0?n:'')+'</span>'});
      lineEls[n] = row; box.appendChild(row);
    });
    pg.appendChild(box);
    pg.appendChild(h('p',{style:'margin-top:14px;font-size:14px',html:I.glossary}));
  } else {
    if(I.drive){
      pg.appendChild(h('iframe',{class:'bookframe',src:'https://drive.google.com/file/d/'+I.drive+'/preview',title:'Source booklet',allow:'autoplay'}));
    } else {
      pg.appendChild(h('div',{class:'booknote',html:I.note}));
    }
    I.texts.forEach(function(t){ pg.appendChild(h('p',{style:'margin:14px 0 2px',html:'<b>'+t.name+'</b>'})); pg.appendChild(h('p',{class:'iintro',html:t.about})); });
  }
  insertEl.appendChild(pg);
}
var hlTimer = null;
function light(a, b){
  if(!P.insert.lines) return;
  Object.keys(lineEls).forEach(function(k){ lineEls[k].classList.remove('hl'); });
  if(!a) return;
  for(var n=a;n<=b;n++) if(lineEls[n]) lineEls[n].classList.add('hl');
  var first = lineEls[a];
  if(first){
    var wide = window.matchMedia('(min-width:1080px)').matches;
    if(wide){ var top = first.offsetTop - 80; insertEl.scrollTo({top:Math.max(0,top), behavior:'smooth'}); }
  }
}
function openInsert(a, b){
  insertEl.classList.add('open'); light(a, b);
  if(a && lineEls[a]) setTimeout(function(){ lineEls[a].scrollIntoView({block:'center', behavior:'smooth'}); }, 260);
}

/* ---------- answer areas ---------- */
var areas = [];
function grow(ta){ ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, (+ta.getAttribute('data-rows')||2)*34) + 'px'; }
function answerBox(id, rows, wc){
  var wrap = h('div',{class:'lined'});
  var el;
  if(rows === 1){
    el = h('input',{class:'ans',type:'text','aria-label':'Answer',autocomplete:'off'});
  } else {
    el = h('textarea',{class:'ans','data-rows':rows,'aria-label':'Answer',spellcheck:'true'});
    areas.push(el);
  }
  el.value = S.a[id] || '';
  var wcEl = wc ? h('div',{class:'wc'}) : null;
  function upd(){ if(wcEl){ var n = words(el.value); wcEl.textContent = n ? n+' words' : ''; } }
  el.addEventListener('input', function(){ S.a[id] = el.value; save(); if(rows !== 1) grow(el); upd(); });
  wrap.appendChild(el); upd();
  var out = h('div',{},[wrap]); if(wcEl) out.appendChild(wcEl);
  out._el = el;
  return out;
}

/* ---------- questions ---------- */
function linkRefs(html, q){
  if(!q.lines) return html;
  return html.replace(/(lines? \d+(?:&ndash;|-| to )\d+)/i, '<span class="lref" data-a="'+q.lines[0]+'" data-b="'+q.lines[1]+'">$1</span>');
}
function question(q){
  var box = h('div',{class:'q','data-q':q.n});
  var body = h('div',{class:'qt'});
  body.innerHTML = linkRefs(q.q, q);
  if(q.extract && P.insert.lines){
    var ex = h('div',{class:'extract-box'});
    for(var n=q.extract[0];n<=q.extract[1];n++){ var t = P.insert.lines[n-1]; ex.appendChild(h('span',{html:esc(t).replace(/\*([a-z]+)\*/g,'<i>$1</i>')+' '})); if(P.insert.gaps.indexOf(n)>=0) ex.appendChild(h('div',{style:'height:8px'})); }
    var after = body.querySelector('.after-extract');
    if(after) body.insertBefore(ex, after); else body.appendChild(ex);
  }
  if(q.extractNote){ var en = h('div',{class:'extract-box',html:q.extractNote}); var af = body.querySelector('.after-extract'); if(af) body.insertBefore(en, af); else body.appendChild(en); }
  box.appendChild(h('div',{class:'qn'},[h('b',{text:q.n}), body]));
  if(q.hint){
    var hb = h('button',{class:'hintbtn',type:'button','aria-label':'A hint',text:'?'}), ht = h('div',{class:'hinttext',html:q.hint,hidden:'hidden'});
    hb.onclick = function(){ ht.hidden = !ht.hidden; };
    box.appendChild(hb); box.appendChild(ht);
  }
  if(q.marks && q.showMarks !== false && q.rows > 2) box.appendChild(h('div',{class:'mk',text:'('+q.marks+')'}));
  if(q.boxes){
    for(var i=0;i<q.boxes;i++){ var r = answerBox(q.id+'_'+i, 1); box.appendChild(h('div',{class:'numbered'},[h('span',{text:String(i+1)}), r])); }
  } else {
    box.appendChild(answerBox(q.id, q.rows || 1, (q.rows||1) > 4));
  }
  if(q.tot !== false) box.appendChild(h('div',{class:'tot',text:typeof q.tot === 'string' ? q.tot : '(Total for Question '+q.n+' = '+q.marks+' mark'+(q.marks>1?'s':'')+')'}));
  else box.appendChild(h('div',{style:'height:14px'}));
  function focus(){
    Array.prototype.forEach.call(document.querySelectorAll('.q.focus'), function(x){ x.classList.remove('focus'); });
    box.classList.add('focus');
    if(q.lines) light(q.lines[0], q.lines[1]); else if(q.extract) light(q.extract[0], q.extract[1]); else light(0);
  }
  box.addEventListener('focusin', focus);
  box.addEventListener('click', function(e){
    var r = e.target.closest && e.target.closest('.lref');
    if(r){ var a = +r.getAttribute('data-a'), b = +r.getAttribute('data-b');
      if(window.matchMedia('(min-width:1080px)').matches) light(a,b); else if(P.insert.lines) openInsert(a,b); else openInsert(); }
  });
  return box;
}

/* ---------- pages ---------- */
function cover(){
  var pg = h('div',{class:'page cover'}), f = h('div',{class:'frame'});
  f.appendChild(h('div',{class:'check',text:'Please check the examination details below before entering your candidate information'}));
  f.appendChild(h('div',{class:'cand',html:'<div>Candidate surname<b>'+WHO+'</b></div><div>Other names</div>'}));
  f.appendChild(h('div',{class:'nums',html:'<div>Centre Number<div class="boxes"><i></i><i></i><i></i><i></i><i></i></div></div><div>Candidate Number<div class="boxes"><i></i><i></i><i></i><i></i></div></div>'}));
  f.appendChild(h('div',{class:'qual',html:P.qual}));
  f.appendChild(h('div',{class:'date',text:P.date}));
  f.appendChild(h('div',{class:'refrow',html:'<div class="tm">'+P.time+'</div><div class="pr">Paper<br>reference</div><div class="code">'+P.ref+'</div>'}));
  f.appendChild(h('div',{class:'subj',html:'<h1>English Language</h1><h2>'+P.paper+'</h2>'}));
  f.appendChild(h('div',{class:'musthave',html:'<div><b>You must have:</b>'+P.mustHave+'</div><div>Total Marks</div>'}));
  pg.appendChild(f);
  ['Instructions','Information','Advice'].forEach(function(k){ pg.appendChild(h('h3',{text:k})); var ul = h('ul'); P[k.toLowerCase()].forEach(function(t){ ul.appendChild(h('li',{html:t})); }); pg.appendChild(ul); });
  pg.appendChild(h('div',{class:'pnum',html:'<span></span><i>Turn over &#9656;</i>'}));
  return pg;
}
function sectionPage(sec){
  var pg = h('div',{class:'page margins'});
  pg.appendChild(h('div',{class:'sect',html:sec.lead.map(function(l){ return '<span>'+l+'</span>'; }).join('')}));
  sec.items.forEach(function(it){
    if(it.lead){ pg.appendChild(h('div',{class:'sect',style:'margin-top:22px',html:it.lead.map(function(l){ return '<span>'+l+'</span>'; }).join('')})); return; }
    pg.appendChild(question(it));
  });
  if(sec.total) pg.appendChild(h('div',{class:'tot',style:'text-align:right;border:0',text:sec.total}));
  return pg;
}
function sectionB(sec){
  var pg = h('div',{class:'page margins'});
  pg.appendChild(h('div',{class:'sect',html:sec.lead.map(function(l){ return '<span>'+l+'</span>'; }).join('')}));
  sec.opts.forEach(function(o, i){
    if(i === 0) pg.appendChild(h('p',{html:'<b>EITHER</b>'})); else pg.appendChild(h('p',{style:'border-top:1.5px solid #8c8c8c;padding-top:10px',html:'<b>OR</b>'}));
    var q = h('div',{class:'q'});
    q.appendChild(h('div',{class:'qn'},[h('b',{text:'*'+o.n}), h('div',{class:'qt',html:o.q})]));
    if(o.hint){ var hb = h('button',{class:'hintbtn',type:'button','aria-label':'A hint',text:'?'}), ht = h('div',{class:'hinttext',html:o.hint,hidden:'hidden'}); hb.onclick = function(){ ht.hidden = !ht.hidden; }; q.appendChild(hb); q.appendChild(ht); }
    q.appendChild(h('div',{class:'tot',style:'border:0',text:'(Total for Question '+o.n+' = 40 marks)'}));
    q.addEventListener('focusin', function(){ light(0); });
    pg.appendChild(q);
  });
  pg.appendChild(h('div',{class:'tot',style:'margin-bottom:16px',text:''}));
  var ch = h('div',{class:'choose',html:'Indicate which question you are answering by marking a cross in the box &#9746;. If you change your mind, put a line through the box and then indicate your new question with a cross &#9746;.'});
  var row = h('div',{class:'row',html:'<span>Chosen question number:</span>'});
  var boxes = [];
  sec.opts.forEach(function(o){
    var b = h('button',{class:'xbox',type:'button',html:'Question '+o.n+' <i>'+(S.x===o.n?'&#10007;':'')+'</i>'});
    b.onclick = function(){ S.x = o.n; save(); boxes.forEach(function(x){ x.b.querySelector('i').innerHTML = x.n === o.n ? '&#10007;' : ''; }); };
    boxes.push({b:b,n:o.n}); row.appendChild(b);
  });
  ch.appendChild(row); pg.appendChild(ch);
  pg.appendChild(h('p',{style:'font-weight:700;margin:10px 0 4px',text:'Plan your answer to Section B here:'}));
  var plan = h('div',{class:'planbox'}); plan.appendChild(answerBox(sec.id+'_plan', 5)); pg.appendChild(plan);
  pg.appendChild(h('p',{style:'font-weight:700;margin:10px 0 4px',text:'Write your answer to Section B here:'}));
  pg.appendChild(answerBox(sec.id, 40, true));
  pg.appendChild(h('div',{class:'tot',style:'border:0;line-height:1.5',html:'TOTAL FOR SECTION B = 40 MARKS<br>TOTAL FOR PAPER = '+P.total+' MARKS'}));
  return pg;
}

/* ---------- marking the short ones ---------- */
function markShort(q){
  if(!q.groups) return null;
  var got = 0, used = {}, n = q.boxes || 1, vals = [];
  for(var i=0;i<n;i++) vals.push(q.boxes ? (S.a[q.id+'_'+i]||'') : (S.a[q.id]||''));
  vals.forEach(function(v){
    if(!v.trim()) return; var t = norm(v);
    for(var g=0; g<q.groups.length; g++){ if(used[g]) continue;
      if(q.groups[g].some(function(k){ return t.indexOf(' '+k) >= 0; })){ used[g] = 1; got++; break; } }
  });
  return Math.min(got, q.marks);
}
function allQs(){ var out = []; P.sections.forEach(function(s){ (s.items||[]).forEach(function(it){ if(it.n) out.push(it); }); }); return out; }
function answered(q){ if(q.boxes){ for(var i=0;i<q.boxes;i++) if((S.a[q.id+'_'+i]||'').trim()) return true; return false; } return !!(S.a[q.id]||'').trim(); }
var secB = function(){ return P.sections.filter(function(s){ return s.opts; })[0]; };

/* ---------- the report, the script picture, and hand in ---------- */
function report(){
  var L = [P.short+' ('+P.ref+') mock practice, '+P.when, 'Student: '+WHO+'   Handed in: '+new Date().toLocaleString('en-GB')+'   Time on the paper: '+Math.round(S.secs/60)+' minutes', ''];
  allQs().forEach(function(q){
    var m = markShort(q);
    L.push('Question '+q.n+' ('+q.marks+' mark'+(q.marks>1?'s':'')+')'+(m!==null?'  auto marked: '+m+'/'+q.marks:''));
    if(q.boxes){ for(var i=0;i<q.boxes;i++) L.push('  '+(i+1)+'. '+(S.a[q.id+'_'+i]||'').trim()); }
    else L.push((S.a[q.id]||'').trim() || '  (left blank)');
    L.push('');
  });
  var B = secB();
  L.push('Section B: Question '+(S.x||'not ticked')+' (40 marks), '+words(S.a[B.id])+' words');
  if((S.a[B.id+'_plan']||'').trim()) L.push('Plan:\n'+S.a[B.id+'_plan'].trim());
  L.push(''); L.push((S.a[B.id]||'').trim() || '(left blank)');
  return L.join('\n');
}
function summaryLine(){
  var qs = allQs(), done = qs.filter(answered).length, quick = 0, quickMax = 0;
  qs.forEach(function(q){ var m = markShort(q); if(m !== null){ quick += m; quickMax += q.marks; } });
  var B = secB(), w = words(S.a[B.id]);
  return P.short+' mock practice: answered '+done+' of '+qs.length+' reading questions'+(quickMax?' ('+quick+'/'+quickMax+' on the short ones)':'')+(w?', Section B question '+(S.x||'?')+' '+w+' words':'')+'.';
}
function drawScript(){
  var W = 1000, pad = 50, cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  var blocks = [];
  blocks.push({t:plain(P.qual)+'  '+P.ref, f:'bold 22px Arial', c:'#231f20'});
  blocks.push({t:'English Language: '+plain(P.paper)+'. Mock practice, '+P.when+'.', f:'18px Arial', c:'#231f20'});
  blocks.push({t:'Candidate: '+WHO+'.   Handed in '+new Date().toLocaleString('en-GB')+'.   Time on the paper: '+Math.round(S.secs/60)+' minutes.', f:'16px Arial', c:'#555', gap:18});
  allQs().forEach(function(q){
    var m = markShort(q);
    blocks.push({t:q.n+'   '+plain(q.q), f:'bold 16px Arial', c:'#231f20', gap:6});
    var a = q.boxes ? Array.apply(null,{length:q.boxes}).map(function(_,i){ return (i+1)+'. '+(S.a[q.id+'_'+i]||''); }).join('\n') : (S.a[q.id]||'(left blank)');
    blocks.push({t:a, f:'18px Arial', c:'#16365c', lined:true});
    blocks.push({t:'(Total for Question '+q.n+' = '+q.marks+' mark'+(q.marks>1?'s':'')+')'+(m!==null?'   Auto marked: '+m:''), f:'bold 14px Arial', c:'#555', right:true, gap:16});
  });
  var B = secB();
  blocks.push({t:'Section B. Chosen question: '+(S.x||'not ticked'), f:'bold 16px Arial', c:'#231f20', gap:6});
  if((S.a[B.id+'_plan']||'').trim()) blocks.push({t:'Plan: '+S.a[B.id+'_plan'], f:'italic 16px Arial', c:'#555'});
  blocks.push({t:S.a[B.id]||'(left blank)', f:'18px Arial', c:'#16365c', lined:true, gap:10});
  function wrapLines(t, font){
    ctx.font = font; var out = [];
    String(t).split('\n').forEach(function(par){
      var ws = par.split(' '), line = '';
      ws.forEach(function(w){ var test = line ? line+' '+w : w; if(ctx.measureText(test).width > W-2*pad && line){ out.push(line); line = w; } else line = test; });
      out.push(line);
    });
    return out;
  }
  var y = pad, plan = [];
  blocks.forEach(function(b){ var ls = wrapLines(b.t, b.f), lh = b.lined ? 34 : 24; plan.push({b:b, ls:ls, lh:lh}); y += ls.length*lh + (b.gap||8); });
  cv.width = W; cv.height = Math.min(30000, y + pad);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,cv.height);
  y = pad;
  plan.forEach(function(p){
    ctx.font = p.b.f; ctx.fillStyle = p.b.c;
    p.ls.forEach(function(l){
      if(p.b.lined){ ctx.fillStyle = '#9a9a9a'; for(var x=pad;x<W-pad;x+=5) ctx.fillRect(x, y+30, 1.4, 1.4); ctx.fillStyle = p.b.c; }
      var tx = p.b.right ? W - pad - ctx.measureText(l).width : pad;
      ctx.fillText(l, tx, y + (p.b.lined ? 24 : 18));
      y += p.lh;
    });
    y += p.b.gap||8;
  });
  var q = 0.85, data = cv.toDataURL('image/jpeg', q);
  while(data.length > 2500000 && q > 0.4){ q -= 0.15; data = cv.toDataURL('image/jpeg', q); }
  return data;
}
function canSync(){ return !!(window.B5Site && window.B5Site.call && window.B5Site.syncUrl && !window.B5Site.guest); }
function handIn(btn, status){
  var text = report(), line = summaryLine();
  status.innerHTML = ''; btn.disabled = true;
  var say = function(html){ status.appendChild(h('p',{html:html})); };
  if(!canSync()){ btn.disabled = false; offline(status, text); return; }
  var done = 0, fails = 0, driveUrl = '';
  say('Sending...');
  var B = window.B5Site;
  var p1 = B.call('send', {who:WHO, tool:P.short+' mock practice ('+P.ref+')', page:location.pathname, text:text}).then(function(r){ if(!r || r.ok === false) throw 0; done++; }, function(){ fails++; });
  var p2 = Promise.resolve().then(function(){ return B.call('made', {who:WHO, slug:'practice-'+P.slug, title:P.short+' answer script', name:WHO.toLowerCase()+'-'+P.slug+'.jpg', png:drawScript(), text:line}); })
    .then(function(r){ if(!r || !r.ok) throw 0; driveUrl = r.url || ''; done++; }, function(){ fails++; });
  Promise.all([p1, p2]).then(function(){
    return B.call('activity', {slug:'practice-'+P.slug, title:P.short+' mock practice', subject:'English', kind:'practice', secs:Math.max(S.secs, 180), line:line, made:'Handed in the '+P.short+' answer script'+(driveUrl?' ('+driveUrl+')':'')}).then(function(r){ if(!r || !r.ok) throw 0; done++; }, function(){ fails++; });
  }).then(function(){
    status.innerHTML = '';
    S.handed = Date.now(); save();
    if(!fails){ say('<span class="ok">Handed in.</span> Jay has your answers.'); }
    else if(done){ say('<span class="ok">Handed in.</span> Jay has your answers. (One part did not go through; it will be fine.)'); }
    else { btn.disabled = false; offline(status, text); return; }
    showResults();
  });
}
function offline(status, text){
  status.innerHTML = '';
  status.appendChild(h('p',{text:'The quick hand in only works when you are signed in to your school account on the Base 5 site. Copy it or save it for Jay instead.'}));
  var cp = h('button',{class:'soft',type:'button',text:'Copy'}), dl = h('button',{class:'soft',type:'button',text:'Save a copy'});
  cp.onclick = function(){ try{ navigator.clipboard.writeText(text).then(function(){ toast('Copied.'); }); }catch(e){} };
  dl.onclick = function(){ var a = document.createElement('a'); a.href = 'data:text/plain;charset=utf-8,'+encodeURIComponent(text); a.download = P.slug+'-'+WHO.toLowerCase()+'.txt'; document.body.appendChild(a); a.click(); a.remove(); };
  status.appendChild(h('div',{},[cp, dl]));
  showResults();
}
var resEl = null;
function showResults(){
  if(!resEl) return; resEl.innerHTML = '';
  allQs().forEach(function(q){
    var m = markShort(q);
    if(m !== null) resEl.appendChild(h('div',{class:m===q.marks?'got':'',html:'<span>Question '+q.n+'</span><b>'+(m ? m+' of '+q.marks : (answered(q) ? 'not yet' : 'not tried'))+'</b>'}));
    else resEl.appendChild(h('div',{html:'<span>Question '+q.n+'</span><b>'+(answered(q)?'with Jay':'not tried')+'</b>'}));
  });
  resEl.appendChild(h('div',{html:'<span>Section B</span><b>'+(words(S.a[secB().id])?'with Jay':'not tried')+'</b>'}));
}

/* ---------- build ---------- */
function bar(){
  var b = h('div',{class:'sbar'});
  b.appendChild(h('a',{class:'home',href:P.back||'/egw/','aria-label':'Back to the HQ',html:'<svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 M6 9 V20 H18 V9" fill="none" stroke="#007291" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}));
  b.appendChild(h('div',{class:'ttl',html:P.short+', '+P.ref+'<small>'+P.timeShort+'</small>'}));
  var clock = h('span',{class:'clock',title:'Time on this paper so far'});
  savedEl = h('span',{class:'saved'});
  var ins = h('button',{class:'btn ins',type:'button',text:P.insert.short});
  ins.onclick = function(){ if(insertEl.classList.contains('open')){ insertEl.classList.remove('open'); ins.textContent = P.insert.short; } else { openInsert(); ins.textContent = 'Paper'; } };
  var hand = h('button',{class:'btn hand',type:'button',text:'Hand in'});
  hand.onclick = function(){ document.getElementById('handin').scrollIntoView({behavior:'smooth'}); };
  b.appendChild(savedEl); b.appendChild(clock); b.appendChild(ins); b.appendChild(hand);
  var last = Date.now();
  function tick(){ var m = Math.floor(S.secs/60); clock.textContent = (m<60 ? m+' min' : Math.floor(m/60)+' h '+(m%60)+' min'); }
  ['pointerdown','keydown','scroll'].forEach(function(ev){ document.addEventListener(ev, function(){ last = Date.now(); }, {passive:true, capture:true}); });
  setInterval(function(){ if(!document.hidden && Date.now()-last < 120000){ S.secs += 5; if(S.secs % 30 === 0) save(); } tick(); }, 5000);
  tick();
  return b;
}
function build(){
  var root = document.getElementById('app');
  root.appendChild(bar());
  var wrap = h('div',{class:'wrap'});
  buildInsert(); wrap.appendChild(insertEl);
  var paper = h('main',{class:'paper'});
  paper.appendChild(cover());
  P.sections.forEach(function(s){ paper.appendChild(s.opts ? sectionB(s) : sectionPage(s)); });
  var hi = h('div',{class:'handin',id:'handin'});
  hi.appendChild(h('h2',{text:'Hand in'}));
  hi.appendChild(h('p',{text:'Your answers go to Jay, a copy of your script is saved to the Base 5 Drive, and Jay gets a note. You can keep working and hand in again later.'}));
  var btn = h('button',{class:'big',type:'button',text:'Hand in to Jay'}), status = h('div',{class:'status'});
  btn.onclick = function(){ handIn(btn, status); };
  hi.appendChild(btn); hi.appendChild(status);
  resEl = h('div',{class:'res'}); hi.appendChild(resEl);
  if(S.handed){ status.appendChild(h('p',{class:'ok',text:'Last handed in '+new Date(S.handed).toLocaleString('en-GB')+'.'})); showResults(); }
  paper.appendChild(hi);
  wrap.appendChild(paper);
  root.appendChild(wrap);
  areas.forEach(grow);
  window.addEventListener('resize', function(){ areas.forEach(grow); });
  /* evidence: time on task and one line, through the site's own helper */
  try{ if(window.B5Evidence && canSync()) window.B5Evidence.start({slug:'practice-'+P.slug, title:P.short+' mock practice', subject:'English', kind:'practice', line:summaryLine}); }catch(e){}
  /* hidden surprise: tap the paper reference five times */
  var n = 0, code = document.querySelector('.refrow .code');
  if(code) code.addEventListener('click', function(){ n++; if(n === 5){ n = 0; toast(P.surprise); } });
}
window.B5EXAM = {report:report, summary:summaryLine, script:drawScript, state:function(){ return S; }};
build();
})();
