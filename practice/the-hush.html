<style>

/* big icon and number summary drawn from the card sentence */
function fxChips(t){
  var found = [];
  function add(re, fn){ var m, r = new RegExp(re.source, 'g'); while ((m = r.exec(t))){ var v = fn(m); if (v) found.push([m.index, v]); } }
  add(/Make (\d+) noise( twice| three times| for each card)?/, function(m){ return ['megaphone', m[1] + (m[2] === ' twice' ? ' x2' : m[2] === ' three times' ? ' x3' : m[2] ? ' each' : '')]; });
  add(/Gain (\d+) backup(, plus)?/, function(m){ return ['shield', m[1] + (m[2] ? '+' : '')]; });
  add(/Draw (\d+)/, function(m){ return ['draw', m[1]]; });
  add(/Heal (\d+)/, function(m){ return ['heart', m[1]]; });
  add(/Gain (\d+) breath|\+1 breath/, function(m){ return ['breath', '+' + (m[1] || 1)]; });
  add(/Gain (\d+) loud/, function(m){ return ['loud', '+' + m[1]]; });
  add(/Gain (\d+) calm/, function(m){ return ['calm', '+' + m[1]]; });
  add(/loses (\d+|all) grow/, function(m){ return ['grow', m[1] === 'all' ? 'x' : '-' + m[1]]; });
  add(/skips its next move/, function(){ return ['sleep', '']; });
  add(/next drain does nothing/, function(){ return ['earmuffs', '']; });
  add(/next drain is halved/, function(){ return ['drain', '/2']; });
  add(/Clear/, function(){ return ['junk', '-']; });
  add(/Fetch/, function(){ return ['draw', '<']; });
  add(/next card costs 0/, function(){ return ['breath', '0']; });
  add(/Unmute/, function(){ return ['mute', '-']; });
  add(/loses its fog/, function(){ return ['fog', '-']; });
  add(/Blocks the Hush/, function(){ return ['mute', '-']; });
  add(/Comes back/, function(){ return ['draw', '1UP']; });
  add(/Can't be played/, function(){ return ['junk', '']; });
  add(/feel heard/, function(){ return ['ear', '']; });
  found.sort(function(a,b){ return a[0]-b[0]; });
  return found.slice(0,3).map(function(f){ return f[1]; });
}

/* ---------- map ---------- */
function genMap(level){
  /* 10 rows. The first three are almost all fights so you earn socks before you can spend them.
     Rest at rows 4 and 9. Shops only from row 3, never two in a row on a path. */
  var R = seeded(Date.now() & 0xffffff), ROWS = 10, COLS = 5, nodes = {}, edges = [];
  function key(r,c){ return r+'_'+c; }
  var starts = [0,2,4]; if (R() < 0.5) starts = [1,2,3];
  starts.forEach(function(c0, pi){
    var c = c0;
    for (var r=0;r<ROWS;r++){
      nodes[key(r,c)] = nodes[key(r,c)] || { r:r, c:c };
      if (r < ROWS-1){ var nc = c + (R()<0.33?-1:(R()<0.5?0:1)); nc = Math.max(0,Math.min(COLS-1,nc)); edges.push([key(r,c), key(r+1,nc)]); c = nc; }
    }
  });
  var dedup = {}; edges = edges.filter(function(e){ var s = e[0]+'>'+e[1]; if (dedup[s]) return false; dedup[s] = 1; return true; });
  var guardChance = level >= 3 ? 0.24 : 0.14;
  Object.keys(nodes).forEach(function(k){
    var n = nodes[k], t, x = R();
    if (n.r <= 1) t = 'fight';
    else if (n.r === 4 || n.r === 9) t = 'rest';
    else if (n.r === 2) t = x < 0.75 ? 'fight' : 'mystery';
    else if (n.r === 3) t = x < 0.6 ? 'fight' : x < 0.82 ? 'mystery' : 'shop';
    else { t = x < 0.58 ? 'fight' : x < 0.78 ? 'mystery' : x < 0.9 ? 'shop' : 'fight'; if (n.r >= 5 && R() < guardChance) t = 'guard'; }
    n.t = t; n.place = PLACE_IDS[Math.floor(R()*PLACE_IDS.length)];
  });
  /* no shop straight after a shop */
  edges.forEach(function(e){ if (nodes[e[0]].t === 'shop' && nodes[e[1]].t === 'shop') nodes[e[1]].t = 'fight'; });
  /* at most one shop on row 3 */
  var r3 = Object.keys(nodes).filter(function(k){ return nodes[k].r === 3 && nodes[k].t === 'shop'; }); r3.slice(1).forEach(function(k){ nodes[k].t = 'fight'; });
  var hasShop = Object.keys(nodes).some(function(k){ return nodes[k].t === 'shop' && nodes[k].r >= 5; });
  if (!hasShop){ var cand = Object.keys(nodes).filter(function(k){ var n = nodes[k]; return n.r >= 5 && n.r <= 8 && n.t !== 'guard'; }); if (cand.length) nodes[cand[Math.floor(R()*cand.length)]].t = 'shop'; }
  return { nodes:nodes, edges:edges, rows:ROWS, cols:COLS, done:{} };
}
function nextNodes(){
  var m = Run.map, out = [];
  if (Run.row < 0){ Object.keys(m.nodes).forEach(function(k){ if (m.nodes[k].r === 0) out.push(k); }); return out; }
  if (Run.row >= m.rows-1) return ['boss'];
  var here = Run.row+'_'+Run.col; m.edges.forEach(function(e){ if (e[0] === here) out.push(e[1]); }); return out;
}

    o.insertBefore(el('p','psub', n+' of '+ALLY_ORDER.length+' found. Pairs glow when they are in your hand together.'), box);
    ALLY_ORDER.forEach(function(id){ var a = ALLIES[id], has = Meta.unlocked[id]; var p = el('button','pocket '+(a.rarity !== 'common' ? a.rarity : '')+(has?'':' locked')+(binderSel===id?' sel':'')); p.appendChild(PX.img('cast', a.cast)); p.appendChild(el('span','', has ? esc(a.name) : (a.minLevel ? 'Level '+a.minLevel+'+' : a.kind === 'cameo' ? 'A secret' : '?'))); p.onclick = function(){ if (!has) return; binderSel = id; openBinder(); }; grid.appendChild(p); });

  }

/* ---------- card maker ---------- */
var MK_SKIN = ['#f5d6b8','#f2c8a0','#d9a07a','#a86b48','#6e4430'];
var MK_HS = ['short','bob','long','bun','curly','messy','buzz','puffs'];
var MK_HAIR = ['#1b1b1b','#4a3020','#8a5a3b','#e2b44a','#b0473b','#d7dbe0','#7e57c2','#20adca'];
var MK_TOP = ['#007291','#ef7724','#7e57c2','#2e8b57','#c0392b','#f3d36b','#1b2630','#e84a9f'];
var MK_STYLE = ['plain','hoodie','cardigan','tracksuit','apron','lanyard'];
var MK_CRE = ['pigeon','lunchbox','toaster','bookworm','mopghost','emoji','modbot','slime','duck','trainer','tinyhush'];
var MK_POW = {
  speak:[['Make 8 noise.',1],['Make 4 noise three times.',2],['Make 6 noise. Draw 1.',1]],
  listen:[['Draw 3 cards.',1],['Heal 6. Draw 1.',1],['Gain 2 loud. Draw 1.',1]],
  stand:[['Gain 10 backup.',2],['Gain 6 backup. Make 4 noise.',1],['Gain 5 backup. Clear a Shh card.',1]]
};
var MK_ADJ = ['Brave','Loud','Kind','Chatty','Sparkly','Bold','Gentle','Fizzy','Mighty','Cosy','Speedy','Honest'];
var MK_NOUN = ['Biscuit','Lamp Post','Pigeon','Toaster','Wellie','Teapot','Lunchbox','Beanie','Trumpet','Pickle','Crumpet','Kettle'];
var MK = null;
function mkDefault(){ return { t:'p', s:1, hs:0, h:1, tp:0, st:1, k:'pigeon', name:'', f:'speak', p:0, i:'', b:'' }; }
function mkSprite(m){ if (m.t === 'c') return PX.creature(m.k).c; return PX.person({ skin:MK_SKIN[m.s], hairStyle:MK_HS[m.hs], hair:MK_HAIR[m.h], top:MK_TOP[m.tp], style:MK_STYLE[m.st] }).c; }
function cleanName(s){ return String(s||'').replace(/[^A-Za-z0-9 '!?.,-]/g,'').slice(0,22); }
function wrapText(g, text, x, y, maxW, lh){ var words = text.split(' '), line = '', lines = []; words.forEach(function(w){ var test = line ? line+' '+w : w; if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }); if (line) lines.push(line); lines.forEach(function(l, i){ g.fillText(l, x, y + i*lh); }); return lines.length; }
function renderMade(m, cv){
  cv = cv || document.createElement('canvas'); cv.width = 500; cv.height = 700; var g = cv.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  var fc = FAM[m.f].col, ink = '#0a2f38';
  g.fillStyle = ink; roundRect(g, 0, 0, 500, 700, 34); g.fill();
  g.fillStyle = '#fef8f4'; roundRect(g, 12, 12, 476, 676, 26); g.fill();
  g.save(); roundRect(g, 12, 12, 476, 676, 26); g.clip(); var hg = g.createLinearGradient(0, 12, 0, 122); hg.addColorStop(0, PX.shade(fc, 0.22)); hg.addColorStop(1, PX.shade(fc, -0.12)); g.fillStyle = hg; g.fillRect(12, 12, 476, 110); g.restore();
  g.fillStyle = ink; roundRect(g, 136, 66, 228, 228, 26); g.fill(); var wg = g.createRadialGradient(250, 190, 10, 250, 180, 150); wg.addColorStop(0, '#ffffff'); wg.addColorStop(1, PX.mix(fc, '#ffffff', 0.7)); g.fillStyle = wg; roundRect(g, 146, 76, 208, 208, 20); g.fill();
  var sp = mkSprite(m); var sc = 196/Math.max(sp.width, sp.height); g.drawImage(sp, 250 - sp.width*sc/2, 182 - sp.height*sc/2, sp.width*sc, sp.height*sc);
  var cost = MK_POW[m.f][m.p][1];
  g.fillStyle = ink; g.beginPath(); g.arc(62, 62, 46, 0, 7); g.fill(); g.fillStyle = '#7fd0f0'; g.beginPath(); g.arc(62, 62, 38, 0, 7); g.fill();
  g.fillStyle = ink; g.font = '700 50px Fredoka, "Arial Black", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(cost), 62, 64);
  g.fillStyle = ink; g.font = '700 36px Fredoka, "Arial Black", sans-serif'; g.textBaseline = 'alphabetic';
  var nm = m.name || 'Your card'; var nl = wrapText(g, nm, 250, 340, 420, 38);
  g.font = '28px "Atkinson Hyperlegible", Verdana, sans-serif'; g.fillStyle = '#24323a'; wrapText(g, MK_POW[m.f][m.p][0], 250, 350 + nl*38 + 20, 400, 34);
  g.fillStyle = ink; roundRect(g, 160, 610, 180, 46, 23); g.fill(); g.fillStyle = fc; roundRect(g, 164, 614, 172, 38, 19); g.fill();
  g.fillStyle = '#ffffff'; g.font = '700 22px Fredoka, sans-serif'; g.textBaseline = 'middle'; g.fillText(FAM[m.f].name.toUpperCase(), 250, 634);
  if (m.i || m.b){ g.fillStyle = '#5d6b7a'; g.font = '18px "Atkinson Hyperlegible", sans-serif'; g.fillText('Made by '+[m.i, m.b].filter(Boolean).join(', '), 250, 585); }
  g.fillStyle = '#8e98a4'; g.font = '600 16px Fredoka, sans-serif'; g.fillText('THE HUSH', 250, 676);
  return cv;
}
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function mkCode(m){ var art = m.t === 'c' ? 'c-'+m.k : ['p',m.s,m.hs,m.h,m.tp,m.st].join('-'); return ['HUSH1', cleanName(m.name), m.f, m.p, art, cleanName(m.i).slice(0,4), cleanName(m.b).slice(0,12)].join('|'); }
function mkParse(code){ var p = String(code).split('|'); if (p[0] !== 'HUSH1' || p.length < 5) return null; var m = mkDefault(); m.name = p[1]; m.f = FAM[p[2]] && p[2] !== 'junk' ? p[2] : 'speak'; m.p = Math.min(2, parseInt(p[3],10)||0); var a = p[4].split('-'); if (a[0] === 'c'){ m.t = 'c'; m.k = MK_CRE.indexOf(a[1]) >= 0 ? a[1] : 'pigeon'; } else { m.t = 'p'; m.s = (+a[1]||0)%MK_SKIN.length; m.hs = (+a[2]||0)%MK_HS.length; m.h = (+a[3]||0)%MK_HAIR.length; m.tp = (+a[4]||0)%MK_TOP.length; m.st = (+a[5]||0)%MK_STYLE.length; } m.i = p[5]||''; m.b = p[6]||''; return m; }
function showMaker(){
  if (!MK) MK = mkDefault();
  var s = $('ovMaker'); s.innerHTML = ''; overlay('ovMaker');
  var wrap = el('div','makerwrap'); s.appendChild(wrap);
  wrap.appendChild(el('h2','ptitle','Make a card'));
  var mk = el('div','maker'); wrap.appendChild(mk);
  var pv = el('div','mk-preview'); var cv = document.createElement('canvas'); pv.appendChild(cv); mk.appendChild(pv);
  var ctl = el('div','mk-ctrl'); mk.appendChild(ctl);
  function redraw(){ renderMade(MK, cv); }
  function row(label){ var r = el('div','mk-row'); r.appendChild(el('label','', esc(label))); ctl.appendChild(r); return r; }
  function build(){
    ctl.innerHTML = '';
    var r0 = row('1. Who is on it?'); [['p','A person'],['c','A creature']].forEach(function(o){ var b = el('button','opt'+(MK.t===o[0]?' on':''), o[1]); b.onclick = function(){ MK.t = o[0]; build(); redraw(); }; r0.appendChild(b); });
    if (MK.t === 'p'){
      swatches('Skin', MK_SKIN, 's'); opts('Hair', MK_HS, 'hs'); swatches('Hair colour', MK_HAIR, 'h'); swatches('Top', MK_TOP, 'tp'); opts('Style', MK_STYLE, 'st');
    } else { var rc = row('Pick a creature'); MK_CRE.forEach(function(k){ var b = el('button','opt'+(MK.k===k?' on':'')); b.appendChild(PX.img('cast', k)); b.onclick = function(){ MK.k = k; build(); redraw(); }; rc.appendChild(b); }); }
    var rn = row('2. Name it'); var inp = el('input','txt'); inp.maxLength = 22; inp.placeholder = 'e.g. Brave Biscuit'; inp.value = MK.name; inp.oninput = function(){ MK.name = cleanName(inp.value); redraw(); }; rn.appendChild(inp); var sur = el('button','opt','Surprise me'); sur.onclick = function(){ MK.name = pick(MK_ADJ)+' '+pick(MK_NOUN); inp.value = MK.name; redraw(); }; rn.appendChild(sur);
    var rf = row('3. What kind?'); ['speak','listen','stand'].forEach(function(f){ var b = el('button','opt'+(MK.f===f?' on':''), FAM[f].name); b.onclick = function(){ MK.f = f; MK.p = 0; build(); redraw(); }; rf.appendChild(b); });
    var rp = row('4. Its power'); MK_POW[MK.f].forEach(function(p, i){ var b = el('button','opt'+(MK.p===i?' on':''), esc(p[0])); b.onclick = function(){ MK.p = i; build(); redraw(); }; rp.appendChild(b); });
    var ri = row('5. Your initials and base (if you like)'); var ii = el('input','txt'); ii.style.maxWidth = '120px'; ii.maxLength = 4; ii.placeholder = 'AB'; ii.value = MK.i; ii.oninput = function(){ MK.i = cleanName(ii.value).toUpperCase().slice(0,4); redraw(); }; var bi = el('input','txt'); bi.style.maxWidth = '180px'; bi.maxLength = 12; bi.placeholder = 'Base'; bi.value = MK.b; bi.oninput = function(){ MK.b = cleanName(bi.value).slice(0,12); redraw(); }; ri.appendChild(ii); ri.appendChild(bi);
    var ra = row('6. Keep it');
    var dl = el('button','pbtn small','Save picture'); dl.onclick = function(){ keepMade(); downloadCard(cv); }; ra.appendChild(dl);
    var pr = el('button','pbtn small teal','Print'); pr.onclick = function(){ keepMade(); printCard(cv); }; ra.appendChild(pr);
    var se = el('button','pbtn small teal','Send to your teacher'); se.onclick = function(){ keepMade(); sendCard(cv); }; ra.appendChild(se);
    var wl = el('button','pbtn small ghost','Put it on the card wall'); wl.onclick = function(){ keepMade(); postCard(wl); }; ra.appendChild(wl);
    ctl.appendChild(el('p','note','The card wall shows cards once a teacher has had a look.'));
    var back = el('button','pbtn ghost','Back'); back.onclick = function(){ overlay('ovMaker', false); }; ctl.appendChild(back);
  }
  function swatches(label, list, key){ var r = row(label); list.forEach(function(c, i){ var b = el('button','sw'+(MK[key]===i?' on':'')); b.style.background = c; b.onclick = function(){ MK[key] = i; build(); redraw(); }; r.appendChild(b); }); }
  function opts(label, list, key){ var r = row(label); list.forEach(function(v, i){ var b = el('button','opt'+(MK[key]===i?' on':''), esc(v)); b.onclick = function(){ MK[key] = i; build(); redraw(); }; r.appendChild(b); }); }
  build(); redraw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
}
function keepMade(){ var code = mkCode(MK); Meta.made = (Meta.made||[]).filter(function(c){ return c !== code; }); Meta.made.unshift(code); Meta.made = Meta.made.slice(0,12); saveMeta(); }
function downloadCard(cv){ try { var a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'my-hush-card.png'; document.body.appendChild(a); a.click(); a.remove(); toast('Picture saved'); } catch(e){ toast('Could not save here, try Print'); } }
function printCard(cv){ var p = $('printArea'); p.innerHTML = ''; var src = cv.toDataURL('image/png'); for (var i=0;i<2;i++){ var im = el('img'); im.src = src; p.appendChild(im); } setTimeout(function(){ window.print(); }, 200); }
function sendCard(cv){
  downloadCard(cv);
  var m = MK, body = 'Hi,\n\nHere is the card I made in The Hush. The picture just saved, so I have attached it.\n\nName: '+(m.name||'(no name)')+'\nKind: '+FAM[m.f].name+'\nPower: '+MK_POW[m.f][m.p][0]+(m.i||m.b ? '\nFrom: '+[m.i,m.b].filter(Boolean).join(', ') : '')+'\n\nCard code: '+mkCode(m)+'\n';
  var url = 'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(HUSH_SEND_TO)+'&su='+encodeURIComponent('The Hush: my card')+'&body='+encodeURIComponent(body);
  window.open(url, '_blank');
}

/* ---------- card wall: posts go through the Base 5 shared memory, a teacher approves first ---------- */
var HUSH_SEND_TO = 'jay.raine@chiltonbridgeschool.co.uk';
/* switch on once the post and wall actions are matched to the Base 5 sheet script */
var HUSH_WALL_READY = false;
var Wall = {
  ready:function(){ return HUSH_WALL_READY && !!(window.B5Site && typeof window.B5Site.call === 'function'); },
  timeout:function(p){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej('timeout'); }, 7000); })]); },
  post:function(code){ if (!this.ready()) return Promise.reject('offline'); return this.timeout(window.B5Site.call('post', { board:'hush', page:'the-hush', text:code })); },
  load:function(){ if (!this.ready()) return Promise.reject('offline'); return this.timeout(window.B5Site.call('wall', { board:'hush' })); }
};
function postCard(btn){
  btn.disabled = true; btn.textContent = 'Sending...';
  Wall.post(mkCode(MK)).then(function(){ btn.textContent = 'Sent for a look!'; toast('Sent! It shows on the wall once a teacher has had a look.'); }).catch(function(){ btn.disabled = false; btn.textContent = 'Put it on the card wall'; toast(HUSH_WALL_READY ? 'The wall only opens when you are signed in at school. Your card is saved here.' : 'The card wall opens soon. Your card is saved here, and you can send it to your teacher.'); });
}
function wallCodes(res){ var out = []; (function walk(x){ if (!x) return; if (typeof x === 'string'){ if (x.indexOf('HUSH1|') === 0) out.push(x); return; } if (Array.isArray(x)){ x.forEach(walk); return; } if (typeof x === 'object') Object.keys(x).forEach(function(k){ walk(x[k]); }); })(res); return out.filter(function(v,i,a){ return a.indexOf(v) === i; }); }
function openWall(){
  var o = $('ovWall'); o.innerHTML = ''; o.appendChild(el('h2','ptitle','Card wall'));
  var status = el('p','psub','Loading the wall...'); o.appendChild(status);
  var grid = el('div','deckgrid'); o.appendChild(grid);
  function addCode(code, where){ var m = mkParse(code); if (!m) return; var c = renderMade(m); c.style.width = '180px'; c.style.borderRadius = '10px'; where.appendChild(c); }
  Wall.load().then(function(res){ var codes = wallCodes(res); status.textContent = codes.length ? 'Cards made around school:' : 'No cards on the wall yet. Be the first!'; codes.slice(0,60).forEach(function(c){ addCode(c, grid); }); }).catch(function(){ status.textContent = HUSH_WALL_READY ? 'The wall opens when you are signed in at school.' : 'The card wall opens soon.'; });
  if (Meta.made && Meta.made.length){ o.appendChild(el('p','psub','Cards you made on this device:')); var mine = el('div','deckgrid'); Meta.made.forEach(function(c){ addCode(c, mine); }); o.appendChild(mine); }
  var b = el('button','pbtn teal','Back'); b.onclick = function(){ overlay('ovWall', false); }; o.appendChild(b);
  overlay('ovWall');
}
