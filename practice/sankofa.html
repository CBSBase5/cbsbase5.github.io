<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sankofa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: a full screen pixel canvas; menus are stamped adinkra cloth sheets edged with a kente band. Single dark look by design. */
:root{
  color-scheme:dark;
  --night:#17132b;--indigo:#241d47;--cloth:#f3e3bf;--cloth2:#e8d3a6;--ink:#21170f;--muted:#6b5537;
  --gold:#f2b134;--clay:#c4532d;--leaf:#2e8b57;--sky:#5fc3d6;
  --pix:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;background:var(--night);margin:0}
body{overflow:hidden;font-family:var(--body);color:var(--cloth);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;background:var(--night)}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit}
[hidden]{display:none!important}
.pixel{image-rendering:pixelated;image-rendering:crisp-edges}

/* overlays */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));background:rgba(15,10,30,.72);z-index:20;box-sizing:border-box}
.ov.clear{background:linear-gradient(180deg,rgba(15,10,30,.15),rgba(15,10,30,.55))}
.ov > *{margin:auto 0}
.sheet{position:relative;box-sizing:border-box;width:100%;max-width:760px;background:var(--cloth);color:var(--ink);
  background-image:radial-gradient(circle at 50% 50%,rgba(120,80,30,.09) 1.5px,transparent 2px),radial-gradient(circle at 50% 50%,rgba(120,80,30,.06) 1px,transparent 1.5px);
  background-size:22px 22px,11px 11px;background-position:0 0,5px 5px;
  border-radius:4px;box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 0 2px rgba(0,0,0,.25);padding:30px clamp(16px,4vw,36px) 26px;overflow:hidden}
.sheet.narrow{max-width:520px}
.memory canvas{display:block;width:min(100%,420px);height:auto;aspect-ratio:200/110;margin:10px auto;image-rendering:pixelated;border:4px solid #7a5230;border-radius:6px;background:#000}
.memory .kick{margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.memory details{margin:6px 0 10px}
/* creatures page */
.crs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cr{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto;column-gap:10px;align-items:start;background:rgba(255,255,255,.5);border-radius:3px;padding:8px}
.cr img{grid-row:1 / span 3;width:64px;height:auto}
.cr b{font-family:var(--pix);font-size:15px}.cr b small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px}
.cr span{font-size:13px;line-height:1.35}.cr .bm{color:#1f6b3f;font-weight:700}
.cr.half img{filter:grayscale(1)}
.cr.locked{display:flex;flex-direction:column;opacity:.7;border:2px dashed rgba(33,23,15,.25);background:transparent}
.cr .q{font-family:var(--pix);font-size:22px;color:var(--muted)}
/* wardrobe */
.wprev{display:flex;align-items:center;gap:14px;margin:6px 0}.wprev img{width:120px;height:auto}.wprev b{font-family:var(--pix);font-size:18px;color:var(--clay)}
.wgrid{display:flex;flex-wrap:wrap;gap:8px}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:88px;min-height:44px;padding:6px 8px;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;cursor:pointer;font-family:var(--pix);font-size:13px;color:var(--ink)}
.wbtn img{width:72px;height:auto}.wbtn.on{background:var(--gold);box-shadow:0 0 0 3px var(--leaf)}.wbtn.locked{border-style:dashed;opacity:.6;cursor:default}
.wbtn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.flog{margin:10px 0;font-size:14px}.flog summary{cursor:pointer;font-family:var(--pix);font-weight:700}.flog ul{max-height:220px;overflow-y:auto;margin:6px 0;padding-left:18px;line-height:1.45}
.ptitle{font-family:var(--pix);color:var(--clay);font-size:16px;margin:0 0 6px}
/* the Feather Pass: deliberately too much */
.passs{background:#1d1438;color:#fff6e0;background-image:radial-gradient(circle at 20% 10%,rgba(255,79,162,.35),transparent 40%),radial-gradient(circle at 80% 30%,rgba(63,224,208,.3),transparent 45%),radial-gradient(circle at 50% 100%,rgba(255,210,63,.25),transparent 50%)}
.passs .small{color:#d8cce8}
.phead{text-align:center;position:relative}
.phype{display:inline-block;font-family:var(--pix);font-size:16px;color:#1d1438;background:#ffd23f;padding:3px 12px;transform:rotate(-3deg);box-shadow:3px 3px 0 #ff4fa2;animation:hype 0.6s ease-in-out infinite alternate}
@keyframes hype{to{transform:rotate(3deg) scale(1.08)}}
.passs h2{font-size:clamp(30px,7vw,54px);margin:10px 0 0;color:#fff;letter-spacing:.06em;text-shadow:3px 3px 0 #ff4fa2,-3px -3px 0 #3fe0d0,0 0 18px rgba(255,210,63,.6);background:linear-gradient(90deg,#ffd23f,#ff4fa2,#3fe0d0,#ffd23f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.pseason{font-family:var(--pix);font-size:18px;letter-spacing:.3em;color:#ffd23f}
.pclock{margin:8px auto 0;font-family:var(--pix);font-size:15px;color:#ff9ac0}.pclock b{color:#fff}.pclock small{display:block;font-family:var(--body);font-size:11px;color:#b8a8cc}
.pbar{height:14px;background:rgba(255,255,255,.15);border:2px solid #fff6e0;border-radius:8px;overflow:hidden;margin:14px 0 4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3fe0d0,#ffd23f,#ff4fa2);transition:width .6s}
.pbar.sm{height:10px;margin:6px 0;border-color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.pbuy{animation:glow .6s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 4px 0 var(--ink),0 0 22px #ffd23f,0 0 6px #ff4fa2}}.pprem{font-family:var(--pix);color:#ffd23f;font-size:18px;padding:8px}
.ptrack{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x proximity}
.pcol{flex:none;width:118px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.pnum{font-family:var(--pix);text-align:center;font-size:15px;color:#b8a8cc}.pcol.reached .pnum{color:#ffd23f}.pcol.next .pnum{color:#fff;text-decoration:underline}
.pcard2{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:20px 6px 8px;min-height:128px;border:3px solid var(--rc,#888);border-radius:6px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 18px var(--rc,#888)}
.pcard2 img{width:76px;height:auto}.pcard2 b{font-size:12px;line-height:1.2}.pcard2 small{font-size:10px;color:var(--rc,#ccc);font-family:var(--pix)}
.pcard2[data-rainbow]{border-image:linear-gradient(90deg,#ff4f6d,#ffd23f,#5fd66b,#5fc3ff,#b98cff) 1;animation:rb 2s linear infinite}
@keyframes rb{50%{filter:hue-rotate(90deg)}}
.pcard2.locked{opacity:.45;filter:saturate(.4)}.pcard2.locked.prem::after{content:'PREMIUM';position:absolute;bottom:4px;font-family:var(--pix);font-size:9px;color:#ffd23f}
.pcard2.ready{animation:ready 1s ease-in-out infinite alternate}@keyframes ready{to{box-shadow:inset 0 0 30px var(--rc,#888),0 0 12px var(--rc,#888)}}
.pcard2.got{opacity:.8}.pcard2 .tick{position:absolute;top:2px;right:6px;color:#5fd66b;font-size:18px}
.pcard2.empty{border:2px dashed rgba(255,255,255,.12);box-shadow:none;background:transparent;min-height:60px}
.ptag{position:absolute;top:3px;left:5px;font-family:var(--pix);font-size:9px;color:#b8a8cc}.ptag.prem{color:#ffd23f}
.pcheck .pline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(33,23,15,.3)}.pcheck .pline.tot{font-size:18px;font-weight:700}
.pspin{width:42px;height:42px;margin:16px auto;border:6px solid rgba(33,23,15,.2);border-top-color:var(--clay);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.preveal{text-align:center;background:#1d1438;color:#fff6e0}.preveal .kick{font-family:var(--pix);color:#b8a8cc;margin:0}
.pbox{width:150px;height:150px;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;border:4px solid var(--rc,#888);border-radius:10px;background:rgba(255,255,255,.08);animation:shake .12s linear infinite}
.pbox.open{animation:pop .5s ease-out;box-shadow:0 0 40px var(--rc,#888)}.pbox img{width:120px;height:auto}.pboxq{font-family:var(--pix);font-size:64px;color:var(--rc,#fff)}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}
.prar{color:var(--rc,#fff)!important;font-size:clamp(28px,6vw,44px)!important;text-shadow:3px 3px 0 #000;animation:pop .5s ease-out}
.preveal[data-rainbow] .prar,.preveal .prar{background:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10px;width:7px;height:11px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.psum{background:rgba(29,20,56,.08);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;margin:12px 0}.psum b{font-family:var(--pix)}
.badge.hype{background:#ff4fa2;animation:hype .6s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.phype,.pbuy,.badge.hype,.pbox,.pcard2.ready,.passs h2{animation:none}.confetti{display:none}}
.sheet.wide{max-width:960px}
.kente{position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,#f2c12e 0 16px,#1a1410 16px 19px,#2e8b57 19px 31px,#c4532d 31px 45px,#1a1410 45px 48px)}
.sheet h2{font-family:var(--pix);font-weight:700;font-size:clamp(22px,4vw,30px);margin:6px 0 10px;line-height:1.15;text-wrap:balance;color:var(--ink)}
.sheet h3{font-family:var(--pix);font-weight:700;font-size:18px;margin:18px 0 8px}
.sheet p{line-height:1.5;margin:8px 0}
.lead{font-size:17px}
.small,.hint{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;padding:8px 18px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:var(--ink);
  font-family:var(--pix);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tab:focus-visible,.pcard:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn.gold{background:var(--gold)}
.btn.alt{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}
.badge{display:inline-block;background:var(--clay);color:#fff;font-family:var(--pix);font-size:12px;padding:1px 7px;border-radius:9px;vertical-align:middle}
.chip{display:inline-block;font-family:var(--pix);font-size:12px;padding:2px 8px;border-radius:2px;background:var(--c);color:#14101e;margin:2px 4px 2px 0}

/* title */
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:620px;width:100%;padding-block:8px}
.logo{font-family:var(--pix);font-weight:700;font-size:clamp(44px,11vw,92px);letter-spacing:.06em;margin:0;line-height:1;color:var(--gold);
  text-shadow:4px 4px 0 #1a1410,-2px -2px 0 #1a1410,2px -2px 0 #1a1410,-2px 2px 0 #1a1410,0 8px 0 var(--clay)}
.logo small{display:block;font-size:clamp(14px,3vw,20px);letter-spacing:.24em;color:var(--cloth);text-shadow:2px 2px 0 #1a1410;margin-top:14px;text-transform:uppercase}
.tag{font-size:17px;line-height:1.5;max-width:52ch;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);background:rgba(23,19,43,.6);padding:10px 14px;border-radius:3px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin-top:6px}
.menu .btn{width:100%}
.foot{font-size:13px;color:#f3e3bf;opacity:.9;text-shadow:0 1px 0 #000}
.backlink{align-self:flex-start;color:var(--cloth);font-family:var(--pix);font-size:14px;text-decoration:none;background:rgba(23,19,43,.7);padding:6px 10px;border-radius:3px}
.backlink:hover{text-decoration:underline}

/* how to play */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.how div{background:rgba(255,255,255,.45);padding:10px 12px;border-radius:3px;min-width:0}
.how h3{margin:0 0 4px;font-size:16px}.how p{margin:0;font-size:15px}

/* settings */
.tog{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(33,23,15,.25);cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--leaf);flex:none;margin-top:2px}
.tog span{display:flex;flex-direction:column;gap:2px}.tog small{color:var(--muted)}
.tog.sel{justify-content:space-between;align-items:center}
.tog select{font:inherit;padding:6px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:var(--ink)}
.danger{margin-top:14px;font-size:14px}.danger summary{cursor:pointer;color:var(--muted)}

/* power choice */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 12px 14px;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 var(--ink);font-family:var(--body);min-width:0}
.pcard:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.pcard img{width:84px;height:84px}
.pcard .num{position:absolute;left:8px;top:6px;font-family:var(--pix);font-size:13px;color:var(--muted)}
.pname{font-family:var(--pix);font-size:19px}.lit{font-size:14px;color:var(--muted)}.mean{font-size:14px}
.what{font-size:15px;line-height:1.4;margin-top:4px}.what em{font-style:normal;font-weight:700}
.kin{font-family:var(--pix);font-size:13px;background:var(--gold);padding:2px 8px;border-radius:2px}
.minis{display:grid;gap:8px}.mini{display:flex;gap:10px;align-items:center}.mini img{width:40px;height:40px;flex:none}.mini .lvl{color:var(--muted);font-size:13px}

.roads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.road{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 16px;border:2px solid var(--ink);border-radius:3px;cursor:pointer;color:var(--ink);font-family:var(--body);font-size:16px;box-shadow:0 5px 0 var(--ink);min-width:0}
.road b{font-family:var(--pix);font-size:21px}.road .num{position:absolute;right:10px;top:8px;font-family:var(--pix);font-size:13px;color:var(--muted)}
.road.quiet{background:#e3f1e6}.road.lively{background:#ffe9c7}
.road:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}.road:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.pcard{animation:cardIn .35s ease-out both;animation-delay:var(--d,0s)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.pcard .ribbon{position:absolute;right:8px;top:6px;font-family:var(--pix);font-size:12px;padding:1px 8px;border-radius:2px;color:#fff}
.pcard.rar-rare{border-color:#3777c9;box-shadow:0 5px 0 #3777c9}.pcard.rar-rare .ribbon{background:#3777c9}
.pcard.rar-legend{border-color:#c48a1e;background:linear-gradient(160deg,#fff7dc,#ffe7a8 45%,#fff7dc);box-shadow:0 5px 0 #c48a1e,0 0 18px rgba(242,193,46,.6)}.pcard.rar-legend .ribbon{background:#c48a1e}
.pcard.rar-legend img{animation:shine 1.6s ease-in-out infinite}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 0 rgba(242,177,52,0))}50%{filter:drop-shadow(0 0 8px rgba(242,177,52,.9))}}
.pcard .evo{font-family:var(--pix);font-size:13px;background:#2e8b57;color:#fff;padding:2px 8px;border-radius:2px}
.feathers{display:grid;gap:10px;margin:8px 0}
.fth{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.5);border:2px dashed rgba(33,23,15,.3);border-radius:3px;padding:10px 12px;animation:cardIn .4s ease-out both;animation-delay:var(--d)}
.fth.on{border-style:solid;border-color:var(--ink);background:#fff7dc}
.fth span{display:flex;flex-direction:column;gap:2px}.fth small{color:var(--muted)}
.fic{flex:none;width:22px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(90deg,#c9c0b0 48%,#8a7a60 50%,#c9c0b0 52%);opacity:.5;transform:rotate(18deg)}
.fth.on .fic{opacity:1;background:linear-gradient(90deg,#f2c12e 48%,#c4532d 50%,#2e8b57 52%)}
@media (prefers-reduced-motion:reduce){.pcard,.fth{animation:none}.pcard.rar-legend img{animation:none}}
.tb.song{background:rgba(95,195,255,.35)}
/* market */
.keeper{display:flex;gap:16px;align-items:center}.keeper img{width:70px;height:120px;flex:none}
.keeper h2{margin:0}
.seeds{font-size:16px}
.mitems{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.mitem{display:flex;flex-direction:column;gap:6px;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:12px;min-width:0}
.mitem b{font-family:var(--pix);font-size:17px}.mitem span{font-size:14px;flex:1}
.mitem.jay{background:#fff2c0}

/* summary and cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.stats div{background:rgba(255,255,255,.5);padding:10px;border-radius:3px;text-align:center}
.stats b{display:block;font-family:var(--pix);font-size:26px;font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--muted)}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.hcard{background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:8px 10px;min-width:0}
.hcard summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none}
.hcard summary::-webkit-details-marker{display:none}
.hcard summary img{width:20px;height:24px;image-rendering:pixelated}
.hcard summary small{font-weight:400;color:var(--muted)}
.hcard p{font-size:15px;margin:8px 0 2px}
.hcard.new{border-color:var(--clay);box-shadow:0 0 0 2px rgba(196,83,45,.3)}
.hcard.locked{border-style:dashed;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.hcard .q{font-family:var(--pix);font-size:18px;width:20px;text-align:center}
.erah{border-left:6px solid var(--c);padding-left:8px}.erah small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:14px}

/* nest */
.nest canvas{display:block;width:100%;max-width:640px;height:auto;margin:6px auto 0;image-rendering:pixelated;border:2px solid var(--ink);border-radius:3px}
.nesthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.twigs{font-family:var(--pix);font-size:16px;display:flex;align-items:center;gap:6px}.twigs img{width:22px;height:22px;image-rendering:pixelated}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--ink);margin:6px 0 10px}
.tab{background:transparent;border:2px solid var(--ink);border-bottom:none;border-radius:3px 3px 0 0;padding:8px 12px;font-family:var(--pix);font-size:15px;cursor:pointer;color:var(--ink);min-height:40px}
.tab.on{background:var(--gold)}
.ups{display:grid;gap:8px}
.up{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:10px 12px}
.up > div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.up b{font-family:var(--pix);font-size:16px}.up span{font-size:14px}
.up img{width:40px;height:40px;flex:none}
.up.done{opacity:.75}
.have{font-family:var(--pix);font-size:13px;color:var(--leaf)}
.need{color:var(--clay);font-size:13px}
.cws{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cw{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:10px;text-align:center}
.cw.on{background:#fff2c0}.cw img{width:60px;height:54px}.cw b{font-family:var(--pix);font-size:14px}
.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sym{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:10px;min-width:0}
.sym img{width:64px;height:64px}.sym b{font-family:var(--pix);font-size:16px}.sym i{font-size:13px;color:var(--muted)}.sym span{font-size:13px}
.sym.unseen img{opacity:.5}
.sets{display:grid;gap:8px}.sets div{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}.sets span{font-size:14px}
.kins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kinc{background:#fffaf0;border:2px solid var(--ink);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:4px}
.kinc .pair{display:flex;align-items:center;gap:6px}.kinc img{width:36px;height:36px}.kinc b{font-family:var(--pix)}.kinc span{font-size:14px}
.kinc.unseen{border-style:dashed}.kinc.unseen img{opacity:.55}

@media (prefers-reduced-motion:reduce){.btn,.pcard{transition:none}}

function rint(a,b){return Math.floor(rnd(a,b+1));}
function choice(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dist(a,b,c,d){return Math.hypot(c-a,d-b);}

var CARDS={
 voices:[
  {id:'v1',title:'The first Black History Month',year:'1987',text:'In October 1987, London held the first Black History Month in the UK. It was started by Akyaaba Addai-Sebo, who was born in Ghana and worked for the London Strategic Policy Unit, which carried on some of the work of the Greater London Council. Now it happens every October, all over the country.'},
  {id:'v2',title:'New voices in Parliament',year:'1987',text:'In the 1987 general election, Diane Abbott, Bernie Grant and Paul Boateng were elected as MPs. Diane Abbott became the first Black woman MP in Britain.'},
  {id:'v3',title:'Bernie Grant',year:'1987 to 2000',text:'Bernie Grant was MP for Tottenham in north London from 1987 until he died in 2000. He spoke up for his community all his life. The Bernie Grant Arts Centre in Tottenham opened in his name in 2007.'},
  {id:'v4',title:'Benjamin Zephaniah',year:'1958 to 2023',text:'Benjamin Zephaniah grew up in Handsworth, Birmingham. He was dyslexic and left school at 13, and went on to become one of the best loved poets in Britain, with poems for children like Talking Turkeys and novels like Refugee Boy. He died in 2023.'},
  {id:'v5',title:'Malorie Blackman',year:'2013 to 2015',text:'Malorie Blackman writes books for young people, including the Noughts and Crosses series. From 2013 to 2015 she was Children\'s Laureate, the first Black writer to do the job.'},
  {id:'v6',title:'Andrea Levy',year:'2004',text:'Andrea Levy wrote Small Island, a novel about people arriving from Jamaica in London in 1948. It won the Orange Prize and Whitbread Book of the Year, and was made into a TV drama and a play. She died in 2019.'}

 roots:[
  {id:'r1',title:'Lovers rock',year:'1970s',text:'Lovers rock is a gentle, romantic style of reggae that grew up in London in the mid 1970s. In 1979 Janet Kay\'s song Silly Games reached number 2 in the UK charts.'},
  {id:'r2',title:'Sound systems',year:'1970s',text:'A sound system is a crew with a huge stack of home built speakers. Sound systems played reggae and dub at parties and dances, and became a big part of Notting Hill Carnival.'},
  {id:'r3',title:'Olive Morris',year:'1952 to 1979',text:'Olive Morris was a community campaigner in Brixton, south London. She helped set up the Brixton Black Women\'s Group in 1973 and stood up for people\'s right to fair treatment and a decent home. She died in 1979, aged just 27.'},
  {id:'r4',title:'Laurie Cunningham',year:'1977 and 1979',text:'In 1977 Laurie Cunningham became the first Black player to play for the England Under 21s. In 1979 he was the first Black player in a competitive England senior match, and he joined Real Madrid in Spain. He died in 1989.'},
  {id:'r5',title:'Cyrille Regis',year:'1977 to 1984',text:'Cyrille Regis was a powerful striker for West Bromwich Albion. With Laurie Cunningham and Brendon Batson, he proved that Black players belonged at the top of English football, even when some crowds shouted racist abuse. He played for England from 1982 and died in 2018.'},
  {id:'r6',title:'Floella Benjamin',year:'1976',text:'Floella Benjamin started presenting Play School on BBC television in 1976 and became a smiling, familiar face for millions of children. In 2010 she joined the House of Lords.'}
 ],
 doors:[
  {id:'d1',title:'The Bristol Bus Boycott',year:'1963',text:'In 1963 the bus company in Bristol refused to give jobs on its buses to Black and Asian people. When a young man called Guy Bailey had his job interview cancelled, people decided to stop using the buses until things changed. The boycott began in April 1963.'},
  {id:'d2',title:'Paul Stephenson',year:'1963',text:'Paul Stephenson was the spokesperson for the Bristol Bus Boycott, speaking to newspapers and TV so the whole country heard about it. He spent his life working for fairness and died in 2024.'},
  {id:'d3',title:'Roy Hackett',year:'1963 and 1968',text:'Roy Hackett was one of the organisers of the boycott. In 1968 his group helped start the St Pauls Carnival in Bristol, which became a much loved Bristol tradition. He died in 2022.'},
  {id:'d4',title:'The colour bar ends',year:'28 August 1963',text:'On 28 August 1963 the bus company said it would end its colour bar. It was the same day Martin Luther King gave his famous speech in Washington. In September, Raghbir Singh, a Sikh man, became the first bus conductor in Bristol who was not white.'},
  {id:'d5',title:'Fairer laws',year:'1965 and 1968',text:'The boycott helped lead to the Race Relations Act 1965, the first law in Britain against racial discrimination in public places. The 1968 Act went further and covered jobs and housing too.'},
  {id:'d6',title:'Millie Small',year:'1964',text:'Millie Small was a singer from Jamaica. In 1964 her ska song My Boy Lollipop reached number 2 in the UK and was a hit around the world. She died in 2020.'}
 ],
 lights:[
  {id:'l1',title:'The steel pan',year:'1930s and 1940s',text:'The steel pan was invented in Trinidad and Tobago in the 1930s and 1940s. Players hammered old oil drums into shapes that could play whole tunes, turning scrap into music.'},
  {id:'l2',title:'TASPO',year:'1951',text:'In 1951 the Trinidad All Steel Percussion Orchestra, known as TASPO, played at the Festival of Britain in London. For many people it was the first time they had heard a steel band.'},
  {id:'l3',title:'Winifred Atwell',year:'1954',text:'Winifred Atwell was a pianist from Trinidad. In 1954 her record Let\'s Have Another Party went to number one, making her the first Black artist to top the UK singles chart. She died in 1983.'},
  {id:'l4',title:'Claudia Jones',year:'1958',text:'Claudia Jones was born in Trinidad. In 1958 she started the West Indian Gazette, a newspaper for Caribbean people in Britain, and she worked all her life for fairness. She died in 1964.'},
  {id:'l5',title:'The Caribbean Carnival',year:'1959',text:'In January 1959 Claudia Jones organised a Caribbean Carnival at St Pancras Town Hall in London, and it was shown on BBC television. It brought music, costume and joy at a hard time, and is seen as a forerunner of Notting Hill Carnival.'},
  {id:'l6',title:'Notting Hill Carnival',year:'1966',text:'In 1966 a street festival began in Notting Hill. With steel bands, costumes and later sound systems, it grew into Notting Hill Carnival, one of the biggest street festivals in Europe.'}

  {id:'w2',title:'Sam King',year:'1948 and 1983',text:'Sam King served in the RAF during the Second World War, then sailed on the Windrush in 1948. In 1983 he became the first Black Mayor of Southwark in London, and later helped found the Windrush Foundation. He died in 2016.'},
  {id:'w3',title:'Lord Kitchener',year:'1948',text:'Lord Kitchener was a calypso singer from Trinidad. When the Windrush arrived, he sang a calypso for the newsreel cameras about London being the place for him. He died in 2000.'},
  {id:'w4',title:'Mona Baptiste',year:'1948',text:'Mona Baptiste was a singer from Trinidad who sailed on the Windrush, one of about 300 women on board. She went on to build a singing career in Britain and across Europe. She died in 1993.'},

/* ================= ART ================= */
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
/* Draw with smooth shapes, then snap alpha so the result is crisp pixel art. */
function pix(w,h,fn,soft){var c=mkCanvas(w,h),x=c.getContext('2d');fn(x,w,h);
  if(!soft){try{var d=x.getImageData(0,0,w,h),a=d.data;for(var i=3;i<a.length;i+=4){a[i]=a[i]>110?255:0;}x.putImageData(d,0,0);}catch(e){}}
  return c;}
function ell(x,cx,cy,rx,ry,col,rot){x.fillStyle=col;x.beginPath();x.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);x.fill();}
function rect(x,a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h);}
function tri(x,a,b,c,d,e,f,col){x.fillStyle=col;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.lineTo(e,f);x.closePath();x.fill();}
function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  if(amt<0){r=r*(1+amt);g=g*(1+amt);b=b*(1+amt);}else{r=r+(255-r)*amt;g=g+(255-g)*amt;b=b+(255-b)*amt;}
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';}

/* ---------- the Sankofa bird ---------- */
var BIRD={};
function buildBird(cw){
  var poses=['idle','look','run1','run2','up','down','dash','hurt','glide'];
  var out={};
  poses.forEach(function(p){
    out[p]=pix(20,18,function(x){
      var bob=(p==='run2')?1:0,dy=(p==='up')?-1:0;
      var hurt=p==='hurt';
      var body=hurt?'#ffffff':cw.body,wing=hurt?'#ffd0d0':cw.wing;
      /* tail */
      tri(x,1,7+dy,7,8+dy,7,12+dy,wing);rect(x,2,8+dy,3,1,cw.stripe);
      /* legs */
      if(p==='run1'){rect(x,8,14,1,3,cw.beak);rect(x,11,15,2,1,cw.beak);rect(x,11,14,1,2,cw.beak);}
      else if(p==='run2'){rect(x,9,14,1,3,cw.beak);rect(x,10,14,1,3,cw.beak);}
      else if(p==='up'||p==='down'||p==='dash'||p==='glide'){rect(x,8,14,3,1,cw.beak);}
      else{rect(x,8,14,1,3,cw.beak);rect(x,11,14,1,3,cw.beak);rect(x,7,16,2,1,cw.beak);rect(x,11,16,2,1,cw.beak);}
      /* body */
      var stretch=p==='dash'?1.5:0;
      ell(x,10-stretch*.3,10+dy+bob*.3,5.6+stretch,4.3,body);
      ell(x,11,11.6+dy,3.4,2.4,cw.belly);
      /* wing */
      if(p==='up'){ell(x,8,5+dy,4,2.2,wing,-0.6);rect(x,6,5+dy,4,1,cw.stripe);}
      else if(p==='down'){ell(x,8,13,4,2,wing,0.5);}
      else if(p==='glide'){ell(x,7,7,6,1.8,wing,-0.15);rect(x,3,7,7,1,cw.stripe);}
      else{ell(x,8.5,10+dy,3.8,2.4,wing,0.15);rect(x,7,10+dy,4,1,cw.stripe);}
      /* head */
      if(p==='look'){
        ell(x,13,5,3.4,3.2,body);
        /* head turned back towards the tail, with a small egg on the back */
        tri(x,10.5,4,7,5,10.5,6.3,cw.beak);
        rect(x,12,4,1,1,'#1a1410');
        ell(x,6,7.2,1.6,2,'#fff6e0');
      }else{
        ell(x,14,5+dy,3.4,3.2,body);
        tri(x,16.6,4+dy,20,5.3+dy,16.6,6.6+dy,cw.beak);
        rect(x,15,4+dy,1,1,hurt?'#c00':'#1a1410');
      }
      /* crest */
      rect(x,13,1+dy,1,1,cw.stripe);rect(x,14,0+dy,1,2,cw.beak);rect(x,15,1+dy,1,1,cw.stripe);
    });
  });
  return out;
}

/* ---------- people (cameos, keepers, Jay) ---------- */
function buildPerson(L,frame){
  return pix(14,24,function(x){
    var skin=typeof L.skin==='number'?SKINS[L.skin]:L.skin;

function drawSymbol(x,id,cx,cy,s,col,lw){
  x.save();x.translate(cx,cy);x.scale(s,s);x.strokeStyle=col;x.fillStyle=col;x.lineWidth=(lw||0.16);x.lineCap='round';x.lineJoin='round';
  function P(){x.beginPath();}
  function S(){x.stroke();}
  function circ(a,b,r){P();x.arc(a,b,r,0,TAU);S();}
  function fcirc(a,b,r){P();x.arc(a,b,r,0,TAU);x.fill();}
  function line(a,b,c,d){P();x.moveTo(a,b);x.lineTo(c,d);S();}
  function spiral(a,b,r,dir,turn){P();var n=24;for(var i=0;i<=n;i++){var t=i/n,ang=dir*(t*TAU*(turn||1.1)),rr=r*(1-t*.8);var px=a+Math.cos(ang+(dir<0?Math.PI:0))*rr,py=b+Math.sin(ang+(dir<0?Math.PI:0))*rr;if(i)x.lineTo(px,py);else x.moveTo(px,py);}S();}
  function heart(a,b,r,fill){P();x.moveTo(a,b+r*.9);x.bezierCurveTo(a-r*1.3,b+r*.1,a-r*.9,b-r*1.1,a,b-r*.35);x.bezierCurveTo(a+r*.9,b-r*1.1,a+r*1.3,b+r*.1,a,b+r*.9);if(fill)x.fill();else S();}
  switch(id){
  case 'sankofa':
    heart(0,0.05,0.85);spiral(-0.32,-0.3,0.28,1,1.2);spiral(0.32,-0.3,0.28,-1,1.2);
    P();x.moveTo(0,0.78);x.lineTo(0,0.95);S();fcirc(-0.18,0.98,0.07);fcirc(0.18,0.98,0.07);break;
  case 'matemasie':
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){P();var a=q[0]*0.42,b=q[1]*0.42,st=Math.atan2(-q[1],-q[0]);x.arc(a,b,0.36,st+0.7,st+TAU-0.7);S();});break;
  case 'nyansapo':
    P();x.ellipse(0,-0.42,0.28,0.42,0,0,TAU);S();P();x.ellipse(0,0.42,0.28,0.42,0,0,TAU);S();
    P();x.ellipse(-0.42,0,0.42,0.28,0,0,TAU);S();P();x.ellipse(0.42,0,0.42,0.28,0,0,TAU);S();break;
  case 'adinkrahene':circ(0,0,0.86);circ(0,0,0.56);circ(0,0,0.26);break;
  case 'damedame':
    P();x.rect(-0.3,-0.3,0.6,0.6);S();[[0,-0.66],[0,0.66],[-0.66,0],[0.66,0]].forEach(function(q){P();x.rect(q[0]-0.2,q[1]-0.2,0.4,0.4);S();});fcirc(0,0,0.1);break;
  case 'anansentontan':
    for(var r=0.3;r<=0.9;r+=0.3){P();for(var i=0;i<=6;i++){var a=i/6*TAU-Math.PI/2;if(i)x.lineTo(Math.cos(a)*r,Math.sin(a)*r);else x.moveTo(Math.cos(a)*r,Math.sin(a)*r);}S();}
    for(i=0;i<6;i++){a=i/6*TAU-Math.PI/2;line(0,0,Math.cos(a)*0.9,Math.sin(a)*0.9);}break;
  case 'nkyinkyim':
    P();x.moveTo(-0.15,-0.9);var zz=[[0.35,-0.6],[-0.35,-0.2],[0.35,0.2],[-0.35,0.6],[0.15,0.9]];zz.forEach(function(q){x.lineTo(q[0],q[1]);});S();
    x.globalAlpha*=.6;P();x.moveTo(-0.45,-0.9);zz.forEach(function(q){x.lineTo(q[0]-0.3,q[1]);});S();break;
  case 'dwennimmen':
    line(0,-0.85,0,0.85);spiral(-0.42,-0.42,0.36,1,1.0);spiral(0.42,-0.42,0.36,-1,1.0);spiral(-0.42,0.42,0.36,1,1.0);spiral(0.42,0.42,0.36,-1,1.0);break;
  case 'mframadan':
    P();x.moveTo(-0.85,-0.2);x.lineTo(0,-0.9);x.lineTo(0.85,-0.2);x.lineTo(0.85,0.85);x.lineTo(-0.85,0.85);x.closePath();S();
    line(-0.5,0,0.5,0.6);line(0.5,0,-0.5,0.6);P();x.rect(-0.18,0.1,0.36,0.36);S();break;
  case 'sesawosuban':
    circ(0,0,0.86);P();for(i=0;i<8;i++){a=i/8*TAU;var rr=i%2?0.28:0.62;if(i)x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);else x.moveTo(rr,0);}x.closePath();S();break;
  case 'okodeemmowere':
    for(i=-1;i<=1;i++){P();x.moveTo(i*0.35,-0.85);x.quadraticCurveTo(i*0.55,0.1,i*0.2+ (i===0?0:i*0.4),0.75);S();}
    P();x.moveTo(-0.6,-0.85);x.lineTo(0.6,-0.85);S();break;

  case 'akomantoso':
    circ(0,0,0.22);for(i=0;i<4;i++){x.save();x.rotate(i*Math.PI/2);heart(0,-0.6,0.28);line(0,-0.22,0,-0.36);x.restore();}break;
  case 'mpatapo':
    P();x.rect(-0.45,-0.45,0.9,0.9);S();[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){circ(q[0]*0.62,q[1]*0.62,0.22);});line(-0.45,0,0.45,0);line(0,-0.45,0,0.45);break;
  case 'wawaaba':
    line(0,-0.9,0,0.9);P();x.arc(0,-0.55,0.45,0.15*Math.PI,0.85*Math.PI);S();P();x.arc(0,0.55,0.45,1.15*Math.PI,1.85*Math.PI);S();
    P();x.moveTo(0,-0.25);x.lineTo(0.22,0);x.lineTo(0,0.25);x.lineTo(-0.22,0);x.closePath();x.fill();break;
  case 'pempamsie':
    P();x.arc(0,-0.35,0.42,Math.PI*0.15,Math.PI*0.85,true);S();P();x.arc(0,0.35,0.42,Math.PI*1.15,Math.PI*1.85,true);S();line(-0.42,-0.35,-0.42,0.35);line(0.42,-0.35,0.42,0.35);line(-0.2,0,0.2,0);break;
  case 'nkyimu':
    P();x.rect(-0.85,-0.85,1.7,1.7);S();line(-0.28,-0.85,-0.28,0.85);line(0.28,-0.85,0.28,0.85);line(-0.85,-0.28,0.85,-0.28);line(-0.85,0.28,0.85,0.28);break;
  case 'nsoromma':
    P();for(i=0;i<16;i++){a=i/16*TAU-Math.PI/2;rr=i%2?0.38:0.92;if(i)x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);else x.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}x.closePath();S();circ(0,0,0.18);break;
  case 'osramnensoromma':
    P();x.arc(0,0,0.85,0.35*Math.PI,1.65*Math.PI);x.arc(0.35,0,0.62,1.55*Math.PI,0.45*Math.PI,true);x.closePath();S();
    P();for(i=0;i<10;i++){a=i/10*TAU-Math.PI/2;rr=i%2?0.12:0.28;if(i)x.lineTo(0.3+Math.cos(a)*rr,Math.sin(a)*rr);else x.moveTo(0.3+Math.cos(a)*rr,Math.sin(a)*rr);}x.closePath();x.fill();break;
  case 'mmeredane':
    P();x.moveTo(-0.7,-0.85);x.lineTo(0.7,-0.85);x.lineTo(0,0);x.closePath();S();P();x.moveTo(-0.7,0.85);x.lineTo(0.7,0.85);x.lineTo(0,0);x.closePath();S();fcirc(0,0,0.1);line(-0.85,-0.85,0.85,-0.85);line(-0.85,0.85,0.85,0.85);break;
  case 'duafe':
    P();x.ellipse(0,-0.5,0.55,0.38,0,0,TAU);S();P();x.rect(-0.7,-0.1,1.4,0.2);S();for(i=0;i<6;i++){var xx=-0.6+i*0.24;line(xx,0.1,xx,0.85);}break;

    P();x.ellipse(0,-0.55,0.26,0.36,0,0,TAU);S();P();x.ellipse(0,0.55,0.26,0.36,0,0,TAU);S();break;

    x.save();x.rotate(-Math.PI/4);P();x.rect(-0.55,-0.18,1.1,0.36);S();x.restore();break;

var AC=null,master,musicBus,sfxBus,noiseBuf;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=settings.music?0.32:0;musicBus.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=settings.sound?0.5:0;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function audioResume(){audioInit();if(AC&&AC.state==='suspended')AC.resume();}
function applyAudioSettings(){if(!AC)return;musicBus.gain.value=settings.music?0.32:0;sfxBus.gain.value=settings.sound?0.5:0;}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}

function env(g,t,a,peak,dec,sus,rel){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(0.0001,sus),t+a+dec);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec+rel);}
function tone(bus,type,freq,t,dur,vol,opts){
  opts=opts||{};var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(opts.slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,opts.slide),t+dur);
  var node=o;
  if(opts.lp){var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=opts.lp;f.Q.value=opts.q||0.7;o.connect(f);node=f;}
  node.connect(g);g.connect(bus);
  env(g,t,opts.a||0.005,vol,opts.d||dur*0.6,opts.s||vol*0.3,opts.r||dur*0.5);
  o.start(t);o.stop(t+(opts.a||0.005)+(opts.d||dur*0.6)+(opts.r||dur*0.5)+0.05);
}
function noise(bus,t,dur,vol,type,freq,q){
  var s=AC.createBufferSource();s.buffer=noiseBuf;var f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||5000;f.Q.value=q||0.8;
  var g=AC.createGain();s.connect(f);f.connect(g);g.connect(bus);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}

  soft:function(t,m,dur,v){tone(musicBus,'triangle',mtof(m),t,dur,v||0.16,{a:0.01,d:dur*0.6,s:0.06,r:dur*0.5});},

var SONGS={
  menu:{bpm:118,chords:[[48,'M'],[53,'M'],[48,'M'],[55,'M']],style:'highlife'},
  voices:{bpm:164,chords:[[45,'m'],[41,'M'],[48,'M'],[43,'M']],style:'jungle'},

function triad(r,q){return [r,r+(q==='m'?3:4),r+7];}
/* deterministic motif per song */
function melodyFor(name,song){
  if(song.mel)return song.mel;var R=mulberry(name.length*131+song.bpm),mel=[];
  var rhythm=[0,3,6,8,10,12,14];
  for(var b=0;b<4;b++){var bar=[];var c=song.chords[b],tones=triad(c[0]+24,c[1]).concat([c[0]+36]);
    for(var s=0;s<16;s++){bar[s]=0;}
    var pick=Math.floor(R()*4);rhythm.forEach(function(st,i){if(R()<0.78){pick=clamp(pick+(R()<.5?-1:1)*(R()<.7?1:2),0,3);bar[st]=tones[pick];}});
    mel.push(bar);}
  /* A A B A shape */
  song.mel=[mel[0],mel[1],mel[2],mel[3]];return song.mel;
}
var MUS={name:null,step:0,next:0,timer:null,boss:false,gen:0,int:3,sd:0.1};
function playMusic(name,boss){
  audioInit();if(!AC)return;
  if(MUS.name===name&&MUS.boss===!!boss)return;
  MUS.name=name;MUS.boss=!!boss;MUS.step=0;MUS.next=AC.currentTime+0.08;MUS.gen++;
  if(!MUS.timer)MUS.timer=setInterval(musicTick,25);
}
function stopMusic(){MUS.name=null;}
function musicTick(){
  if(!AC||!MUS.name)return;var song=SONGS[MUS.name];if(!song)return;
  var bpm=song.bpm*(MUS.boss?1.08:1),stepDur=60/bpm/4;MUS.sd=stepDur;
  if(MUS.next<AC.currentTime-0.2)MUS.next=AC.currentTime+0.02;
  while(MUS.next<AC.currentTime+0.12){schedStep(song,MUS.step,MUS.next,stepDur);MUS.step=(MUS.step+1)%(64*2);MUS.next+=stepDur;}
}
function schedStep(song,step,t,sd){
  var bar=Math.floor(step/16)%4,s=step%16,c=song.chords[bar],ch=triad(c[0]+12,c[1]),root=c[0];
  var mel=melodyFor(MUS.name,song)[bar],m=mel[s],boss=MUS.boss,sec=Math.floor(step/64);
  /* layers: 0 drums and bass, 1 chords, 2 melody, 3 extra drive */
  var lv=(boss||typeof G==='undefined'||G.state!=='play')?3:MUS.int;if(lv<2)m=0;
  if(MUS.kazoo){var km=mel[s];if(km){tone(musicBus,'sawtooth',mtof(km+12),t,sd*2,0.06,{lp:1500,q:5,a:0.012,d:sd,s:0.045,r:sd});tone(musicBus,'square',mtof(km+12.15),t,sd*2,0.025,{lp:900});}m=0;}
  if(lv>=3&&s%2===1&&!boss)INST.hat(t,0.035);
  switch(song.style){
  case 'jungle':
    if(s===0||s===10)INST.kick(t,0.8);if(s===4||s===12)INST.snare(t,0.45);if(s===7||s===15)INST.ghost(t);if(s%2===0)INST.hat(t,0.1);if(boss&&s%2===1)INST.hat(t,0.06);
    if(s===0)INST.sub(t,root,sd*10);if(s===10)INST.sub(t,root+7,sd*5);
    if(s===0&&lv>=1)INST.pad(t,ch.map(function(n){return n+12;}),sd*15);
    if(m&&(sec===1||boss))INST.lead(t,m+12,sd*1.8,0.05);
    if(s%4===2&&lv>=1)INST.soft(t,ch[(s/4|0)%3]+24,sd*1.5,0.06);
    break;
  case 'lovers':
    if(s===8){INST.kick(t,0.8);INST.rim(t);}if(s%4===2)INST.hat(t,0.08);if(boss&&s===0)INST.kick(t,0.6);
    if((s===4||s===12)&&lv>=1)INST.stab(t,ch.map(function(n){return n+12;}),0.06);
    if(s===0)INST.bass(t,root,sd*3);if(s===3)INST.bass(t,root+7,sd*2);if(s===6)INST.bass(t,root+12,sd*2);if(s===10)INST.bass(t,root+5,sd*3);
    if(m)INST.soft(t,m,sd*3,0.12);
    break;

    if(s===0||s===8)INST.kick(t,0.75);if(s===4||s===12)INST.snare(t,0.35);if(s%2===0)INST.hat(t,0.08);
    if(s%4===2&&lv>=1)INST.stab(t,ch.map(function(n){return n+12;}),0.06);
    if(s%4===0){var walk=[0,4,7,9][s/4];INST.bass(t,root+walk,sd*3,0.45);}
    if(m)INST.lead(t,m,sd*1.6,boss?0.08:0.06);
    break;
  case 'calypso':
    if(s===0||s===6||s===8||s===14)INST.kick(t,0.55);if(s===4||s===12)INST.rim(t);if(s%2===0)INST.hat(t,0.07);if(boss&&(s===10))INST.snare(t,0.3);
    if([0,3,6,8,11,14].indexOf(s)>=0)INST.bass(t,root+([0,3,6,8,11,14].indexOf(s)%2?7:0),sd*2,0.42);
    if((s===2||s===10)&&lv>=1)INST.stab(t,ch.map(function(n){return n+12;}),0.04);
    if(m)INST.pan(t,m+12,sd*2,0.16);

function pickChunks(era,count){

  pool=pool.concat(pool.filter(function(c){return c.era===era;}));
  var out=[],last=null;
  var used=new Map();
  for(var i=0;i<count;i++){var c,tries=0;do{c=choice(pool);tries++;}while((c===last||(used.get(c)||0)>=1&&tries<8||(c.d===3&&era<3&&Math.random()<0.5))&&tries<14);out.push(c);last=c;used.set(c,(used.get(c)||0)+1);}
  return out;
}
function genLevel(era,idx){
  if(idx===0)return genLevel2(era);

  if(wantSpot&&!mids.some(function(m){return m.g;})){var gs=CHUNKS.filter(function(c){return c.g&&(c.era===undefined?c.d<=(era===0?1:3):c.era===era);});var gc=choice(gs);mids[rint(1,mids.length-1)]={t:gc.t,g:1};}
  var wantSecret=(plan.level===idx&&plan.where==='secret'&&!run.eraEgg[era])||Math.random()<0.7;
  if(wantSecret){var sc=choice(CHUNK_SECRETS.filter(function(c){return c.d<=Math.max(1,era+1);}));mids.splice(rint(1,mids.length-1),0,{t:sc.t,secret:1});}
  if(run.cameoLevel[era]===idx)mids.splice(rint(1,mids.length-1),0,{t:CHUNK_CAMEO,cameo:1});
  var seq=[{t:CHUNK_START,fixed:1}].concat(mids).concat([{t:CHUNK_END,fixed:1}]);
  seq.forEach(function(c){if(!c.fixed&&!c.cameo&&Math.random()<0.5){c.t=c.t.map(flipRow);c.flip=true;}});
  var wt=seq.length*16,L={era:era,idx:idx,boss:false,w:wt,h:14,tiles:new Uint8Array(wt*14),wind:new Uint8Array(wt*14),crackHp:{},spawns:[],goal:null,colour:0.45,calmed:0,total:0,eggPlaced:false};
  seq.forEach(function(c,ci){
    for(var r=0;r<14;r++){var row=c.t[r];for(var col=0;col<16;col++){var ch=row[col],tx=ci*16+col,i=r*wt+tx;
      switch(ch){
      case '#':L.tiles[i]=T_SOLID;break;case '=':L.tiles[i]=T_PLAT;break;case 'C':L.tiles[i]=T_CRACK;L.crackHp[i]=3;break;case 'B':L.tiles[i]=T_DRUM;break;case 'L':L.tiles[i]=T_NEON;break;case 'K':L.tiles[i]=T_SPEAKER;break;
      case '^':L.tiles[i]=(r>0&&c.t[r-1][col]==='#')?T_THORND:T_THORN;break;
      case 'w':L.wind[i]=1;break;
      case 'M':if(col===0||row[col-1]!=='M')L.spawns.push({k:'M',x:tx*16,y:r*16,flip:!!c.flip});break;
      case '.':break;

      }}}
  });
  var giftEgg=plan.level===idx&&plan.where==='back'&&!run.eraEgg[era];

}
function genArena(era){

  if(G.boss&&!G.boss.dead){G.boss.targets().forEach(function(t){var d=dist(x,y,t.x+t.w/2,t.y+t.h/2);if(d<bd+10){bd=d;best=t;}});}
  return best;
}
function onScreen(x,y,m){m=m||0;var cy=G.camY||0;return x>G.camX-m&&x<G.camX+W+m&&y>cy-m&&y<cy+H+m;}
function playerSing(dt){

  if(tgt){p.face=Math.cos(ang)>=0?1:-1;}
  p.noteCount++;p.singCd=0.3;p.singFlash=0.12;

  var fans=S.chorus?[-0.22,0,0.22]:[0];
  fans.forEach(function(off){fireNote(cx,cy,ang+off,S.noteDmg,{pierce:S.pierce});});
  sfx('sing',p.noteCount);
  if(S.buddy&&G.buddy){G.buddy.cd-=1;}
}
function fireNote(x,y,ang,dmg,o){o=o||{};

/* ================= ENEMIES ================= */
function updateEnemies(dt){
  var p=P,pcx=p.x+p.w/2,pcy=p.y+p.h/2;
  var timeless=hasKin('timeless')&&p.ghostT>0;
  for(var i=ents.length-1;i>=0;i--){var e=ents[i];
    if(e.dead){ents.splice(i,1);continue;}
    if(!e.uid)e.uid=UID++;
    if(!e.active){if(Math.abs(e.x-p.x)<W*0.75)e.active=true;else continue;}
    var sl=1;if(e.slowT>0){e.slowT-=dt;sl=0.35;}
    for(var w=0;w<webs.length;w++){if(dist(webs[w].x,webs[w].y,e.x+e.w/2,e.y+e.h/2)<webs[w].r+4){sl=Math.min(sl,0.4);if(webs[w].dmg&&Math.random()<dt*1.5)damageEnemy(e,1,'web');}}
    if(timeless)sl*=0.4;
    var edt=dt*sl*creatureTimeMul(e,dt);e.t+=edt;if(e.flash>0)e.flash-=dt;
    if(!funOverride(e,edt)&&!enemyBrain(e,edt,pcx,pcy))switch(e.type){
    case 'smudge':case 'gloom':
      e.vy+=900*edt;if(e.vy>300)e.vy=300;
      e.vx=e.dir*e.spd;
      var h=moveBody(e,e.vx*edt,e.vy*edt);
      if(h.d)e.vy=0;
      if(h.l||h.r)e.dir*=-1;
      if(h.d){var ahead=Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/16),below=Math.floor((e.y+e.h+4)/16),tb=tileAt(ahead,below);if(!isSolid(tb)&&tb!==T_PLAT)e.dir*=-1;
        var tt=tileAt(ahead,below-1);if(tt===T_THORN)e.dir*=-1;}
      if(e.y>G.lvl.h*16+30)e.dead=true;
      break;
    case 'static':
      e.x+=e.dir*e.spd*edt;if(Math.abs(e.x-e.homeX)>56)e.dir=e.x>e.homeX?-1:1;
      e.y=e.homeY+Math.sin(e.t*2.4)*12;
      break;
    case 'fog':
      var d=dist(pcx,pcy,e.x+e.w/2,e.y+e.h/2);
      if(d<230){var a=Math.atan2(pcy-e.y-e.h/2,pcx-e.x-e.w/2);e.x+=Math.cos(a)*e.spd*edt;e.y+=Math.sin(a)*e.spd*edt;}
      break;
    case 'hush':
      e.y=e.homeY+Math.sin(e.t*1.5)*4;
      e.cd-=edt;
      if(e.cd<=0&&dist(pcx,pcy,e.x,e.y)<210){e.cd=rnd(2.2,3)/(0.7+0.3*meta.ad);var a2=Math.atan2(pcy-e.y-6,pcx-e.x-9);eshots.push({x:e.x+9,y:e.y+6,vx:Math.cos(a2)*70,vy:Math.sin(a2)*70,life:4,r:4,k:'ring'});sfx('shot');}
      break;
    case 'drip':
      e.cd-=edt;
      if(e.cd<=0&&Math.abs(pcx-(e.x+e.w/2))<46&&pcy>e.y){e.cd=rnd(1.8,2.6);eshots.push({x:e.x+e.w/2,y:e.y+e.h,vx:0,vy:20,g:500,life:3,r:3,k:'drop'});}
      break;
    }
    /* touching the player */
    if(e.shielded>0)e.shielded-=dt;
    if(!e.dead&&overlap(p,e)){
      var stomping=p.vy>40&&(p.y+p.h-p.vy*dt)<=e.y+6&&e.type!=='drip';
      if(p.slam&&!e.dead){damageEnemy(e,S.poundDmg+4,'slam');}
      else if(stomping){var sd=4*S.stompMul;damageEnemy(e,sd,'stomp');meterAdd(3);p.vy=S.stompBounce;p.flaps=Math.max(p.flaps,S.flaps-0);sfx('stomp');p.jumpedFromGround=false;
        if(S.shock)shockwave(e.x+e.w/2,e.y+e.h/2,S.shock,S.shockDmg,'#5fd66b');}
      else if(p.dashT>0&&(S.ram||CREATURES[e.type]||e.type==='gull')){if(!p.dashHit[e.uid]){p.dashHit[e.uid]=1;damageEnemy(e,S.ram||3,S.ram?'ram':'dash');if(lv('dwennimmen')>=3&&!e.dead){e.vy=-200;var ox2=e.x;e.x+=p.face*20;if(rectHitsSolid(e.x,e.y,e.w,e.h))e.x=ox2;}if(hasKin('ramzigzag'))p.dashes=Math.min(S.dashes,p.dashes+1);}}
      else if(p.ghostT<=0&&!creatureTouch(e))hurtPlayer(1,'enemy');
    }
  }
  /* enemy shots */
  for(i=eshots.length-1;i>=0;i--){var s=eshots[i];if(!s)continue;s.life-=dt;var ssl=timeless?0.4:1;
    if(s.g)s.vy+=s.g*dt*ssl;s.x+=s.vx*dt*ssl;s.y+=s.vy*dt*ssl;
    if(isSolid(tileAt(Math.floor(s.x/16),Math.floor(s.y/16)))&&!s.through){s.life=0;if(s.k==='drop')splashFx(s.x,s.y);}
    if(S.moon&&G.moonPos&&dist(s.x,s.y,G.moonPos.x,G.moonPos.y)<G.moonPos.r+s.r){s.life=0;sparkFx(s.x,s.y,'#e8e0ff');}
    if(s.life>0&&s.x>p.x-s.r&&s.x<p.x+p.w+s.r&&s.y>p.y-s.r&&s.y<p.y+p.h+s.r){if(p.ghostT<=0&&p.dashT<=0){if(s.slow){p.tapeT=1.6;floatText(p.x,p.y-6,'Tangled!','#e8e8f0');sfx('hit');}else hurtPlayer(1,'shot');s.life=0;}}

}

/* ================= PICKUPS ================= */
function updatePickups(dt){
  var p=P,cx=p.x+p.w/2,cy=p.y+p.h/2;
  for(var i=pickups.length-1;i>=0;i--){var k=pickups[i];
    var d=dist(cx,cy,k.x,k.y);k.age=(k.age||0)+dt;
    if(k.k==='gold'&&k.age>1){var ga=Math.atan2(cy-k.y,cx-k.x);k.vx=Math.cos(ga)*170;k.vy=Math.sin(ga)*170;k.mag=true;k.still=false;}
    if(k.k==='gold'){}else if(k.k==='egg'?d<28:(d<S.magnet||d<30)){var a=Math.atan2(cy-k.y,cx-k.x),sp=lerp(260,90,d/Math.max(1,S.magnet));k.vx=Math.cos(a)*sp;k.vy=Math.sin(a)*sp;k.still=false;k.mag=true;}
    else if(!k.still){k.vy+=500*dt;if(k.vy>220)k.vy=220;}
    if(!k.still||k.mag){var nx=k.x+k.vx*dt,ny=k.y+k.vy*dt;
      if(!k.mag&&isSolid(tileAt(Math.floor(nx/16),Math.floor(ny/16)))){if(k.vy>0){k.vy=0;k.vx*=0.5;k.still=true;k.y=Math.floor(ny/16)*16-3;}else{k.vx=0;}}else{k.x=nx;k.y=ny;}}
    if(k.y>G.lvl.h*16+20){pickups.splice(i,1);continue;}
    if(d<12){
      pickups.splice(i,1);
      if(k.k==='seed'){var v=S.seedValue>1&&Math.random()<S.seedValue-1?2:1;run.seeds+=v;run.seedsTotal+=v;G.lvl.seeds=(G.lvl.seeds||0)+v;meterAdd(0.6);meta.stats.seeds=(meta.stats.seeds||0)+v;sfx('seed');}
      else if(k.k==='heartSeed'){if(!healPlayer(1)){run.seeds+=5;run.seedsTotal+=5;floatText(cx,cy-10,'+5','#ffd23f');}}
      else if(k.k==='egg'||k.k==='gold'){collectEgg(k.k==='gold');}
    }
  }
}
function collectEgg(gold){
  var era=G.lvl.era,E=ERAS[era];
  var remaining=CARDS[E.id].filter(function(c){return !meta.eggs[c.id]&&run.eggsFound.indexOf(c.id)<0;});
  sfx('egg');ringFx(P.x+5,P.y+6,36,'#ffe08a');passXP(30,'egg');birdChirp('Ooh!',true);
  if(!gold){run.eraEgg[era]=true;G.lvl.treasure=true;}meterAdd(40);
  if(remaining.length){var c=choice(remaining);run.eggsFound.push(c.id);meta.eggs[c.id]=1;meta.newCards.push(c.id);meta.stats.eggs=(meta.stats.eggs||0)+1;saveMeta();
    G.lvl.colour=Math.min(1,G.lvl.colour+0.15);(G.memQueue=G.memQueue||[]).push(c);
    toast('Egg found: '+c.title+'. Read it in the nest any time.');}
  else{run.seeds+=12;run.seedsTotal+=12;toast('An egg full of seeds. You already have every story from this era.');}
  saveRunSnapshot();
}

function sparkFx(x,y,col){for(var i=0;i<4;i++)parts.push({x:x,y:y,vx:rnd(-60,60),vy:rnd(-60,60),life:0.2,col:col,s:1});}
function splashFx(x,y){for(var i=0;i<5;i++)parts.push({x:x,y:y,vx:rnd(-50,50),vy:rnd(-80,-20),life:0.3,col:'#8a8a98',s:2,grav:400});}

function toast(msg){G.toasts.push({msg:msg,t:4.2});if(G.toasts.length>3)G.toasts.shift();}
function updateFx(dt){
  for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.life-=dt;if(q.ring){q.r=lerp(q.R,4,q.life/q.max);}else{if(q.grav)q.vy+=q.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}if(q.life<=0)parts.splice(i,1);}
  for(i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y+=(floaters[i].vy||-20)*dt;if(floaters[i].life<=0)floaters.splice(i,1);}
  for(i=sparks.length-1;i>=0;i--){sparks[i].life-=dt;if(sparks[i].life<=0)sparks.splice(i,1);}
  updateMovers(dt);
}

  return {era:era,name:name,hp:hp,maxhp:hp,dead:false,t:0,slowT:0,flash:0,intro:1.6,warn:[],
    hit:function(t,d){if(this.dead||this.intro>0)return;var m=this.dmgMul?this.dmgMul(t):1;d=Math.max(1,Math.round(d*m));
      if(t.lock){if(t.broken)return;d=Math.min(d,t.hp);t.hp-=d;if(t.hp<=0&&!t.broken){t.broken=true;sfx('crack');ringFx(t.x+t.w/2,t.y+t.h/2,30,'#ffe08a');}}
      this.hp-=d;this.flash=0.1;sfx('bosshit');if(this.hp<=0){this.hp=0;bossDefeated();}},
    contact:function(rects){var p=P;var self=this;rects.forEach(function(r){if(!overlap(p,r))return;
      var stomping=p.vy>40&&(p.y+p.h-p.vy*0.016)<=r.y+8&&r.stompable!==false;
      if(stomping){var big=p.boostT>0;self.hit(r.target||r,4*S.stompMul*(big?2.5:1));if(big){p.boostT=0;bigBop();}p.vy=S.stompBounce;p.flaps=S.flaps;sfx('stomp');p.jumpedFromGround=false;}

      else if(p.ghostT<=0)hurtPlayer(1,'boss');});}};
}

    hudImg(symbolPix(id,col),px,H-16);for(var k=0;k<run.powers[id];k++){ctx.fillStyle='#fff';ctx.fillRect(hx(px+1+k*4),hy(H-3),Math.ceil(2*view.s),Math.ceil(1.5*view.s));}px+=15;});
  drawGiftArrow();

  if(G.boss&&!G.boss.dead){var B=G.boss,bw=180;ctx.fillStyle='rgba(10,6,20,.7)';ctx.fillRect(hx(W/2-bw/2-2),hy(24),bw*view.s+4*view.s,8*view.s);

    ctx.fillStyle='rgba(243,227,191,.96)';ctx.fillRect(hx(bx),hy(by),190*view.s,ph*view.s);ctx.fillStyle='#c4532d';ctx.fillRect(hx(bx),hy(by),190*view.s,2*view.s);

/* ================= POWER OFFERS ================= */
function offerPowers(n,pool){
  pool=pool||POWERS.filter(function(p){return powerUnlocked(p)&&(run.powers[p.id]||0)<3;});
  var owned=tagCounts(),list=[];
  var cand=pool.map(function(p){var w=1;p.tags.forEach(function(t){if(owned[t])w+=0.6*Math.min(2,owned[t]);});
    if(run.powers[p.id])w+=0.3;
    KINSHIPS.forEach(function(k){if((k.a===p.id&&run.powers[k.b])||(k.b===p.id&&run.powers[k.a]))w+=1.2;});
    return {p:p,w:w*(RAR_W[p.rar]||1)};});
  while(list.length<n&&cand.length){var tot=0;cand.forEach(function(c){tot+=c.w;});var r=Math.random()*tot,i=0;for(;i<cand.length;i++){r-=cand[i].w;if(r<=0)break;}i=Math.min(i,cand.length-1);list.push(cand[i].p);cand.splice(i,1);}
  return list;
}
function takePower(id){
  var before=activeSets();
  run.powers[id]=(run.powers[id]||0)+1;if(run.order.indexOf(id)<0)run.order.push(id);
  meta.seen[id]=1;
  if(run.powers[id]===3){var P3=PMAP[id];softBanner({top:'Evolution',title:P3.evo+' evolved',sub:P3.lv[2],t:2.6,max:2.6,kind:'key'});softBig({text:'Evolved!',col:TAGS[P3.tags[0]].col,t:1.2});sfx('win');}
  var oldMax=run.maxHearts;recalc();
  if(id==='akoma'){if(run.powers[id]>=3)run.hearts=run.maxHearts;else run.hearts=Math.min(run.maxHearts,run.hearts+1+(run.maxHearts-oldMax>1?1:0));}
  else if(run.maxHearts>oldMax)run.hearts+=run.maxHearts-oldMax;
  if(id==='mframadan'&&P)P.flaps=S.flaps;
  if(id==='eban'&&P)P.shield=Math.max(P.shield,S.shieldMax);
  var after=activeSets();
  for(var t in after)if(!before[t])toast(TAGS[t].set+' is active! '+TAGS[t].setText);
  KINSHIPS.forEach(function(k){if(run.powers[k.a]&&run.powers[k.b]&&run.kinFound.indexOf(k.id)<0){run.kinFound.push(k.id);var first=!meta.kin[k.id];meta.kin[k.id]=1;toast((first?'New kinship found: ':'Kinship: ')+k.name+'. '+k.text);}});
  saveMeta();sfx('power');
}

function showConfirm(q,yes,no){showOv('<div class="sheet narrow">'+kente()+'<h2>'+esc(q)+'</h2><div class="row">'+btn('Yes',yes,'gold')+btn('No, go back',no,'alt','autofocus')+'</div></div>');}

/* ---------- how to play ---------- */
function howHTML(){return '<div class="sheet">'+kente()+'<h2>How to play</h2>'+
  '<div class="how"><div><h3>Moving</h3><p><b>Arrow keys</b> or <b>WASD</b> to walk. <b>Space</b>, <b>Z</b> or <b>Up</b> to jump. Press jump again in the air to <b>flap</b>. Flaps come back when you land.</p></div>'+
  '<div><h3>Dash</h3><p><b>C</b>, <b>K</b> or <b>Shift</b> to dash. Dashing keeps you safe for a moment and can break cracked walls.</p></div>'+
  '<div><h3>Singing</h3><p>Sankofa sings notes at the grey creatures by itself. You can turn that off in Settings and use <b>X</b> or <b>J</b> instead. Land on creatures from above to bop them.</p></div>'+
  '<div><h3>Eggs</h3><p>Each era hides an egg of knowledge, sometimes behind a cracked wall. Guardians give a golden egg. Every egg opens a history card in the nest, and you keep eggs even if your flight ends.</p></div>'+
  '<div><h3>Adinkra powers</h3><p>After each level, pick a power. Each one is an Adinkra symbol from Ghana with a real meaning. Collect three of the same colour for a bonus, and look for pairs that work together.</p></div>'+
  '<div><h3>Two routes</h3><p>Every level has a high road and a low road. Climb up with platforms, wind and wall jumps: slide down a wall, then press jump to spring off it. The high road is harder, with more to find.</p></div>'+
  '<div><h3>Your song special</h3><p>Calming creatures fills the song meter. When it is full, press <b>V</b> (or tap Song) for a big special move. It changes with the powers you hold.</p></div>'+
  '<div><h3>Songbirds and feathers</h3><p>Free caged songbirds to grow your flock; they sing with you, and a bigger flock earns new powers. Each level gives up to three feathers: reaching the nest, the level goal, and finding a treasure.</p></div>'+
  '<div><h3>Every era is different</h3><p>Neon platforms blink on and off. Speakers bounce you on the beat. Buses give you a lift. Festoon ropes swing: hold left or right, then press jump to let go. Crane crates sway over the docks.</p></div>'+
  '<div><h3>Going back</h3><p>Halfway through some levels, something glints behind you. Sankofa means go back and fetch it, so it is worth a look.</p></div>'+
  '<div><h3>Creatures</h3><p>Each era has its own six creatures, and they each have a tell before they act: a flash, a sound or a pose. Your song calms any of them, slowly. Each one also has a <b>best move</b> (a bop, a dash, singing at its back or from above) that calms it fast for bonus seeds. Snatchers steal seeds, your song or your flaps: catch them to get it all back. The nest shows every creature you have met.</p></div>'+
  '<div><h3>The Fade</h3><p>Do not linger too long. After two and a half minutes in a level, the colour starts to drain and a warning appears. Thirty seconds later the Fade arrives. It cannot be calmed, and if it reaches you the flight ends. Head for the nest!</p></div>'+
  '<div><h3>Random events</h3><p>Anything can happen: pigeons, a tea break, the British weather, a bus that will not stop, and someone with binoculars.</p></div>'+
  '<div><h3>The Feather Pass</h3><p>Every flight earns Feather Pass XP. Climb 50 tiers of hats, feathers, trails and titles, then keep going with prestige levels. It is all earned by playing. There is no real money anywhere.</p></div>'+
  '<div><h3>Golden creatures</h3><p>Now and then a creature shines gold. It is quick and it runs from you, but calming it showers you with seeds and fills your song meter.</p></div>'+
  '<div><h3>Challenge doors</h3><p>Look for a kente door on the low road. Press <b>Down</b> to step inside for a short skill room. Reach the golden feather for a treasure, seeds and a song boost. Nothing in there can hurt you.</p></div>'+
  '<div><h3>Big bops</h3><p>Each guardian\'s arena uses its era. Bounce off a speaker or drum, leap from a bus, neon or crate, or let go of a rope to get a <b>boost</b>. Bop the guardian while boosted for a big bop.</p></div>'+
  '<div><h3>Practice and memories</h3><p>Your first flight starts with a short practice at the nest, and you can replay it from here any time. When you find an egg, a short memory picture plays. You can turn the pictures off in Settings.</p></div>'+
  '<div><h3>Take your time</h3><p>Press <b>P</b> or <b>Esc</b> to pause. Your flight saves at the start of every level. The game quietly adjusts to how you are getting on.</p></div></div>'+
  '<div class="row">'+btn('Got it','back','gold','autofocus')+(run?'':btn('Replay the practice flight','practicereplay'))+'</div></div>';}
ACTIONS.how=function(){var from=G.state;showOv(howHTML());ACTIONS.back=function(){if(from==='play'||from==='paused')showPause();else showTitle();};};

/* ---------- settings ---------- */

  function tg(k,label,hint){return '<label class="tog"><input type="checkbox" id="set-'+k+'" data-set="'+k+'"'+(settings[k]?' checked':'')+'><span><b>'+label+'</b>'+(hint?'<small>'+hint+'</small>':'')+'</span></label>';}

    '<label class="tog sel"><span><b>Touch buttons</b></span><select id="set-touch" data-set="touch"><option value="auto"'+(settings.touch==='auto'?' selected':'')+'>Automatic</option><option value="on"'+(settings.touch==='on'?' selected':'')+'>Always show</option><option value="off"'+(settings.touch==='off'?' selected':'')+'>Hide</option></select></label>'+

ACTIONS.settings=function(){var from=G.state;showOv(settingsHTML());ACTIONS.back=function(){if(from==='play'||from==='paused')showPause();else showTitle();};};

ACTIONS.wipe=function(){showConfirm('Clear all your eggs, twigs and nest on this device?','wipeyes','settings');};
ACTIONS.wipeyes=function(){meta=freshMeta();saveMeta();store.del('run');BIRD=buildBird(cwNow(),meta.hat);showTitle();};

/* ---------- pause ---------- */
function pauseGame(){if(G.state!=='play'||ui.open)return;G.state='paused';showPause();}
function showPause(){G.state='paused';
  var sets=activeSets(),setsHTML=Object.keys(sets).map(function(t){return '<span class="chip" style="--c:'+TAGS[t].col+'">'+TAGS[t].set+'</span>';}).join(' ');
  var pw=run.order.map(function(id){var p=PMAP[id];return '<div class="mini"><img src="'+symbolURL(id,48,'#21170f')+'" alt=""><div><b>'+p.name+'</b> <span class="lvl">level '+run.powers[id]+'</span><br><small>'+p.lv[run.powers[id]-1]+'</small></div></div>';}).join('');
  showOv('<div class="sheet narrow">'+kente()+'<h2>Paused</h2><p class="lead">Take your time. '+ERAS[run.era].name+', '+ERAS[run.era].years+'.</p>'+(G.lvl&&!G.lvl.boss&&G.lvl.goalId?'<p><b>Level goal:</b> '+esc(goalLine(G.lvl))+'</p>':'')+'<p><b>Your song special:</b> '+SPECIALS[dominantTag()].name+'. '+SPECIALS[dominantTag()].text+'</p>'+
    (pw?'<div class="minis">'+pw+'</div>':'<p>No powers yet. You pick one after each level.</p>')+(setsHTML?'<p>Bonuses: '+setsHTML+'</p>':'')+logHTML()+
    '<div class="row">'+btn('Carry on','resumeplay','gold','autofocus')+btn('How to play','how')+btn('Settings','settings')+(run.tutorial?btn(run.tutReplay?'Leave the practice':'Skip the practice','skippractice','alt'):btn('End this flight','quit','alt'))+(ON_SITE?'<a class="btn alt" href="'+SITE_BACK+'">Back to Base 5</a>':'')+'</div>'+
    '<p class="hint">Your flight saves at the start of every level, so you can come back and carry on.</p></div>',function(e){if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();ACTIONS.resumeplay();}});}
ACTIONS.resumeplay=function(){G.state='play';closeUI();};
ACTIONS.quit=function(){showConfirm('End this flight now? You keep any eggs you found.','quityes','resumepause');};
ACTIONS.resumepause=function(){showPause();};
ACTIONS.quityes=function(){closeUI();G.state='play';endRun(false);};

/* ---------- power choice ---------- */
var choiceState=null;
function showChoice(kind,done,pool,n){
  var free=upLevel('thoughts')?1:0;
  n=n||(windOn('sparse')?2:3);
  choiceState={kind:kind,done:done,offers:offerPowers(n,pool),rerolls:free,pool:pool,n:n};
  renderChoice();
}
function renderChoice(){
  var c=choiceState;
  var title=c.kind==='head'?'Choose a power to start with':c.kind==='shrine'?'A hidden shrine':c.kind==='market'?'Choose your new power':c.kind==='flock'?'Your flock has grown! Choose a power':c.kind==='mini'?'Mini guardian calmed! Choose a power':'Level complete! Choose a power';
  var cards=c.offers.map(function(p,i){var cur=run.powers[p.id]||0;
    var kin=KINSHIPS.filter(function(k){return (k.a===p.id&&run.powers[k.b])||(k.b===p.id&&run.powers[k.a]);})[0];
    var tc=tagCounts(),setHint=p.tags.filter(function(t){return (tc[t]||0)===2&&!cur;}).map(function(t){return TAGS[t].set;})[0];
    return '<button class="pcard rar-'+p.rar+'" style="--d:'+(i*0.12)+'s" data-act="pick" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+(RAR_NAME[p.rar]?'<span class="ribbon">'+RAR_NAME[p.rar]+'</span>':'')+'<img src="'+symbolURL(p.id,96,'#21170f')+'" alt="">'+(cur===2?'<span class="evo">Evolves into '+esc(p.evo)+'</span>':'')+
      '<b class="pname">'+p.name+'</b><i class="lit">'+p.lit+'</i><span class="mean">'+p.mean+'</span><span class="chips">'+tagChips(p)+'</span>'+
      '<span class="what">'+(cur?'<em>Level '+(cur+1)+':</em> ':'<em>New:</em> ')+p.lv[cur]+'</span>'+
      (kin?'<span class="kin">Kinship: '+kin.name+'</span>':'')+(setHint?'<span class="kin">Completes '+setHint+'</span>':'')+'</button>';}).join('');
  var empty=!c.offers.length;
  showOv('<div class="sheet wide">'+kente()+'<h2>'+title+'</h2>'+(empty?'<p>You have every power at full strength. Have some seeds instead.</p>':'<div class="pcards">'+cards+'</div>')+
    '<div class="row">'+(c.rerolls>0&&!empty?btn('Show me different ones ('+c.rerolls+' free)','reroll'):(!empty&&run.seeds>=6&&c.kind!=='shrine'?btn('Show me different ones (6 seeds)','reroll'):''))+
    (c.kind==='shrine'?btn('Leave it','skipchoice','alt'):btn(empty?'Take 20 seeds':'Skip and take 15 seeds','skipchoice','alt'))+'</div>'+
    '<p class="hint">Press 1, 2 or 3 to choose. You have '+run.seeds+' seeds.</p></div>',
    function(e){var k=e.key;if(k>='1'&&k<='3'){var b2=$('ov').querySelector('[data-i="'+(+k-1)+'"]');if(b2)b2.click();}});
}
ACTIONS.pick=function(t){var c=choiceState,p=c.offers[+t.getAttribute('data-i')];if(!p)return;takePower(p.id);choiceState=null;c.done();};
ACTIONS.reroll=function(){var c=choiceState;if(c.rerolls>0)c.rerolls--;else if(run.seeds>=6)run.seeds-=6;else return;c.offers=offerPowers(c.n,c.pool);renderChoice();};
ACTIONS.skipchoice=function(){var c=choiceState;if(c.kind!=='shrine'){var g=c.offers.length?15:20;run.seeds+=g;run.seedsTotal+=g;}choiceState=null;c.done();};

/* ---------- market ---------- */
var market=null;
function showMarket(){
  var jay=!run.jayMet&&(meta.runs>=2||meta.bonnie>0)&&Math.random()<0.2;
  var keeper=jay?{name:'Jay',line:choice(JAY_LINES),look:JAY_LOOK,jay:true}:choice(MARKET_KEEPERS);
  var all=[{id:'mend',name:'Mend a heart',desc:'Heal 1 heart.',cost:function(){return 10+run.buys*3;}},
    {id:'feast',name:'Full feast',desc:'Heal all your hearts.',cost:function(){return 28;}},
    {id:'power',name:'A new power',desc:'Choose from three Adinkra powers.',cost:function(){return 40;}},
    {id:'fence',name:'Fence charm',desc:'A shield for the guardian fight.',cost:function(){return 16;}},
    {id:'heart',name:'A bigger heart',desc:'One more heart for the rest of this flight.',cost:function(){return 55;},once:'marketHeart'}];
  var n=3+upLevel('stall');var pick=[all[0]].concat(shuffle(all.slice(1)).slice(0,n-1));
  if(windOn('purse'))pick.forEach(function(it){var f=it.cost;it.cost=function(){return Math.ceil(f()*1.3);};});
  if(jay)pick.unshift({id:'goldstar',name:'Gold star',desc:'Jay is very proud of you. One more heart and a full heal.',cost:function(){return 0;},jay:1});
  market={keeper:keeper,items:pick,bought:{}};
  if(jay){run.jayMet=true;meta.jay=(meta.jay||0)+1;saveMeta();}
  renderMarket();
}
function personURL(look,scale){try{var c=buildPerson(look,0),s=mkCanvas(c.width*scale,c.height*scale),x=s.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(c,0,0,s.width,s.height);return s.toDataURL();}catch(e){return '';}}
function renderMarket(focusSel){
  var m=market;
  var items=m.items.map(function(it,i){var cost=it.cost(),sold=m.bought[it.id]&&it.id!=='mend',full=(it.id==='mend'||it.id==='feast')&&run.hearts>=run.maxHearts,none=it.id==='power'&&!offerPowers(1).length,can=run.seeds>=cost&&!sold&&!(it.once&&run[it.once])&&!full&&!none;
    return '<div class="mitem'+(it.jay?' jay':'')+'"><b>'+it.name+'</b><span>'+it.desc+'</span>'+btn(sold?'Bought':full?'Hearts full':none?'Nothing left':(cost?cost+' seeds':'Free'),'buy','gold','data-i="'+i+'"'+(can?'':' disabled'))+'</div>';}).join('');
  showOv('<div class="sheet wide">'+kente()+'<div class="keeper"><img class="pixel" src="'+personURL(m.keeper.look,5)+'" alt=""><div><h2>'+esc(m.keeper.name)+'\'s market</h2><p class="lead">'+(m.keeper.jay?'&quot;'+esc(m.keeper.line)+'&quot; Jay spots Sankofa and lowers his binoculars. He really does love birds.':esc(m.keeper.line))+'</p></div></div>'+
    '<p class="seeds">You have <b>'+run.seeds+'</b> seeds and <b>'+run.hearts+' of '+run.maxHearts+'</b> hearts.</p><div class="mitems">'+items+'</div>'+
    '<div class="row">'+btn('Fly on to meet the guardian','leavemarket','gold','autofocus')+'</div></div>',null,null,focusSel);
}
ACTIONS.buy=function(t){var m=market,it=m.items[+t.getAttribute('data-i')];var cost=it.cost();if(run.seeds<cost)return;
  run.seeds-=cost;run.buys++;m.bought[it.id]=1;
  if(it.id==='mend')healPlayer(1);
  else if(it.id==='feast')healPlayer(99);
  else if(it.id==='fence')run.bonusShield=(run.bonusShield||0)+1;
  else if(it.id==='heart'){run.marketHeart=true;run.bonusHearts++;recalc();run.hearts++;}
  else if(it.id==='goldstar'){run.bonusHearts++;recalc();run.hearts=run.maxHearts;sfx('heal');}
  else if(it.id==='power'){showChoice('market',function(){renderMarket();});return;}
  sfx('seed');renderMarket(['[data-act=buy][data-i="'+t.getAttribute('data-i')+'"]:not([disabled])','[data-act=buy]:not([disabled])','[data-act=leavemarket]']);};
ACTIONS.leavemarket=function(){market=null;startLevel();};

/* ---------- shrine ---------- */
function useShrine(s){if(!s||s.used)return;G.lvl.treasure=true;s.used=true;G.state='between';sfx('power');
  showChoice('shrine',function(){G.state='play';closeUI();},null,2);}

/* ---------- summary ---------- */
function showSummary(win,tw){G.lastSummary={win:win,tw:tw};
  var era=ERAS[Math.min(run.era,4)];
  var cards=run.eggsFound.map(function(id){var c=cardById(id);return '<details class="hcard"><summary><img src="'+itemURL('egg')+'" alt=""> '+esc(c.title)+' <small>'+esc(c.year)+'</small></summary><p>'+esc(c.text)+'</p></details>';}).join('');
  var kin=run.kinFound.map(function(k){var K=KINSHIPS.filter(function(q){return q.id===k;})[0];return '<span class="chip" style="--c:#ffd23f">'+K.name+'</span>';}).join(' ');
  var mins=Math.round((Date.now()-run.startT)/60000);
  showOv('<div class="sheet">'+kente()+'<h2>'+(win?'You brought the colour home':run.endReason==='fade'?'The Fade caught up':'Your flight is over')+'</h2>'+(meta.title?'<p class="ptitle">'+esc(meta.title)+'</p>':'')+
    '<p class="lead">'+(win?'Every guardian has faded and the stories are safe. Sankofa: go back and fetch it, so we can move forward together.':'You reached '+era.name+' ('+era.years+'). Every egg you found is safe in the nest.')+'</p>'+
    '<div class="stats"><div><b>'+run.eggsFound.length+'</b><span>eggs found</span></div><div><b>'+run.calmed+'</b><span>creatures calmed</span></div><div><b>'+run.order.length+'</b><span>powers</span></div><div><b>'+mins+'</b><span>minutes</span></div>'+(run.goldens?'<div><b>'+run.goldens+'</b><span>golden creatures</span></div>':'')+(run.challenges?'<div><b>'+run.challenges+'</b><span>challenge rooms</span></div>':'')+'</div>'+
    (cards?'<h3>New history cards</h3><div class="hcards">'+cards+'</div>':'')+(kin?'<p>Kinships this flight: '+kin+'</p>':'')+
    (run.newFeather?'<p class="lead">New feathers earned: <b>'+esc(run.newFeather)+'</b>. Wear them in the nest.</p>':'')+passSummaryHTML()+'<h3>Twigs for the nest: '+tw.total+'</h3><p class="small">Levels '+tw.levels+' &middot; guardians '+tw.bosses+' &middot; seeds '+tw.seeds+' &middot; eggs '+tw.eggs+' &middot; calming '+tw.calm+(tw.sankofa?' &middot; going back '+tw.sankofa:'')+(tw.feathers?' &middot; feathers '+tw.feathers:'')+(tw.win?' &middot; bringing the colour home '+tw.win:'')+(tw.windBonus?' &middot; '+tw.winds+' winds '+tw.windBonus:'')+'</p>'+
    '<div class="row">'+btn('Fly again','newrun','gold','autofocus')+btn('Go to the nest','nest')+btn('Title','title','alt')+(ON_SITE?'<a class="btn alt" href="'+SITE_BACK+'">Back to Base 5</a>':'')+'</div></div>');
}
var ITEMURL={};function itemURL(k){if(ITEMURL[k])return ITEMURL[k];var c=ITEM[k],s=mkCanvas(c.width*3,c.height*3),x=s.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(c,0,0,s.width,s.height);ITEMURL[k]=s.toDataURL();return ITEMURL[k];}

/* ---------- the nest ---------- */
var nestTab='eggs';
ACTIONS.nest=function(){G.state='nest';showNest();};
ACTIONS.ntab=function(t){nestTab=t.getAttribute('data-tab');showNest('[data-act=ntab][data-tab='+nestTab+']');};
function showNest(focusSel){
  var tabs=[['eggs','History eggs'],['weave','Weave the nest'],['wardrobe','Wardrobe'],['creatures','Creatures'],['symbols','Symbols'],['kin','Kinships'],['about','About']];
  var head='<div class="nesthead"><h2>The nest</h2><p class="twigs"><img src="'+itemURL('twig')+'" alt=""> <b>'+meta.twigs+'</b> twigs &middot; <b>'+eggCount()+'</b> of 30 eggs</p></div>'+
    '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab'+(nestTab===t[0]?' on':'')+'" role="tab" aria-selected="'+(nestTab===t[0])+'" data-act="ntab" data-tab="'+t[0]+'">'+t[1]+(t[0]==='eggs'&&meta.newCards.length?' <span class="badge">'+meta.newCards.length+'</span>':'')+'</button>';}).join('')+'</div>';
  var body='';
  if(nestTab==='eggs'){
    body='<p class="small">Every egg holds a true story. Eggs hide in each era, and each guardian gives a golden one.</p>'+ERAS.map(function(E){
      var row=CARDS[E.id].map(function(c){var have=meta.eggs[c.id],isNew=meta.newCards.indexOf(c.id)>=0;
        return have?'<details class="hcard'+(isNew?' new':'')+'" data-card="'+c.id+'"><summary><img src="'+itemURL('egg')+'" alt=""> '+esc(c.title)+' <small>'+esc(c.year)+'</small>'+(isNew?' <span class="badge">new</span>':'')+'</summary><p>'+esc(c.text)+'</p></details>':
          '<div class="hcard locked"><span class="q">?</span> An egg still hidden in '+esc(E.name)+'</div>';}).join('');
      return '<h3 class="erah" style="--c:'+E.accent+'">'+esc(E.name)+' <small>'+esc(E.years)+'</small></h3><div class="hcards">'+row+'</div>';}).join('');
  }else if(nestTab==='weave'){
    var ups=UPGRADES.map(function(u){var l=upLevel(u.id),max=u.costs.length,cost=u.costs[l],need=u.eggs[l]||0;var done=l>=max,lockedE=!done&&eggCount()<need;
      return '<div class="up'+(done?' done':'')+'"><div><b>'+u.name+(max>1?' <small>'+l+'/'+max+'</small>':'')+'</b><span>'+u.desc+'</span>'+(lockedE?'<small class="need">Find '+need+' eggs to unlock</small>':'')+'</div>'+
        (done?'<span class="have">Woven</span>':btn(cost+' twigs','buyup','gold','data-id="'+u.id+'"'+(meta.twigs>=cost&&!lockedE?'':' disabled')))+'</div>';}).join('');
    var pw=POWERS.filter(function(p){return p.lock;}).map(function(p){var have=meta.unlocked[p.id],lockedE=eggCount()<p.lock.eggs;
      return '<div class="up'+(have?' done':'')+'"><img src="'+symbolURL(p.id,48,'#21170f')+'" alt=""><div><b>'+p.name+'</b><span>'+p.lv[0]+'</span>'+(lockedE&&!have?'<small class="need">Find '+p.lock.eggs+' eggs to unlock</small>':'')+'</div>'+
        (have?'<span class="have">In your pool</span>':btn(p.lock.cost+' twigs','buypow','gold','data-id="'+p.id+'"'+(meta.twigs>=p.lock.cost&&!lockedE?'':' disabled')))+'</div>';}).join('');

function spawnFeature(s){
  if(s.k==='U'){var bx0=s.flip?s.x-160:s.x;movers.push({kind:'bus',x:s.flip?bx0+112:bx0,y:s.y,w:64,h:6,x0:bx0,range:112,dir:s.flip?-1:1,spd:34,wait:0,dx:0,dy:0});return true;}
  if(s.k==='Q'){var cr={kind:'crate',ax:s.x+8,ay:s.y+8,len:CRATE_LEN,ph:Math.random()*TAU,per:rnd(3.8,4.6),w:32,h:6,x:0,y:0,dx:0,dy:0};placeCrate(cr,G.t);movers.push(cr);return true;}
  if(s.k==='R'){G.ropes.push({ax:s.x+8,ay:s.y+8,len:ROPE_LEN,ang:rnd(-0.3,0.3),av:0,held:false});return true;}
  return false;
}
function placeCrate(m,t){var a=CRATE_AMP*Math.sin(t*TAU/m.per+m.ph);m.a=a;m.x=m.ax+Math.sin(a)*m.len-m.w/2;m.y=m.ay+Math.cos(a)*m.len;}

/* moving platforms of every kind, carrying the bird when it stands on one */
function updateMovers(dt){
  movers.forEach(function(m){var ox=m.x,oy=m.y;
    if(m.kind==='crate'){placeCrate(m,G.t);}
    else if(m.kind==='bus'){if(m.wait>0){m.wait-=dt;}else{m.x+=m.dir*m.spd*dt;if(m.x>m.x0+m.range){m.x=m.x0+m.range;m.dir=-1;m.wait=0.9;}if(m.x<m.x0){m.x=m.x0;m.dir=1;m.wait=0.9;}}}
    else{m.x+=m.dir*m.spd*dt;if(m.x>m.x0+m.range){m.x=m.x0+m.range;m.dir=-1;}if(m.x<m.x0){m.x=m.x0;m.dir=1;}}
    m.dx=m.x-ox;m.dy=m.y-oy;
    if(P&&P.onMover===m&&P.onGround){var px=P.x;P.x+=m.dx;if(rectHitsSolid(P.x,P.y,P.w,P.h))P.x=px;P.y=m.y-P.h;}
  });
}

/* ---------- festoon ropes (Carnival Lights) ---------- */
function updateRopes(dt){
  G.ropes.forEach(function(r){if(r.held)return;r.av+=-(900/r.len)*Math.sin(r.ang)*dt;r.av*=(1-0.6*dt);r.ang+=r.av*dt;
    if(Math.abs(r.av)<0.05&&Math.abs(r.ang)<0.05){r.av+=rnd(-0.3,0.3);}});
}
function ropeTry(p,dt){
  if(p.ropeCd>0)p.ropeCd-=dt;
  if(p.rope)return ropeSwing(p,dt);
  if(p.onGround||p.dashT>0||p.ropeCd>0||!G.ropes.length)return false;
  var cx=p.x+p.w/2,cy=p.y+p.h/2;
  for(var i=0;i<G.ropes.length;i++){var r=G.ropes[i];
    var ex=r.ax+Math.sin(r.ang)*r.len,ey=r.ay+Math.cos(r.ang)*r.len;
    /* distance to the lower part of the rope */
    var sx=r.ax+(ex-r.ax)*0.35,sy=r.ay+(ey-r.ay)*0.35;
    var dxs=ex-sx,dys=ey-sy,l2=dxs*dxs+dys*dys,tt=clamp(((cx-sx)*dxs+(cy-sy)*dys)/l2,0,1),qx=sx+dxs*tt,qy=sy+dys*tt;
    if(dist(cx,cy,qx,qy)<10){
      var l=clamp(dist(r.ax,r.ay,cx,cy),30,r.len);r.ang=Math.atan2(cx-r.ax,cy-r.ay);
      r.av=clamp((p.vx*Math.cos(r.ang)-p.vy*Math.sin(r.ang))/l,-4,4);r.held=true;p.rope=r;p.ropeL=l;p.flaps=S.flaps;p.slam=false;sfx('flap');
      if(!meta.tipRope){meta.tipRope=1;saveMeta();toast('Hold left or right to swing. Press jump to let go and fly off.');}
      return ropeSwing(p,dt);
    }
  }
  return false;
}
function ropeSwing(p,dt){
  var r=p.rope,l=p.ropeL;
  var dir=((keys.right||touchState.right)?1:0)-((keys.left||touchState.left)?1:0);
  r.av+=dir*3.2*dt*Math.cos(r.ang);
  r.av+=-(900/l)*Math.sin(r.ang)*dt;r.av*=(1-0.12*dt);r.ang+=r.av*dt;
  if(r.ang>1.35){r.ang=1.35;r.av=Math.min(r.av,0);}if(r.ang<-1.35){r.ang=-1.35;r.av=Math.max(r.av,0);}
  var cx=r.ax+Math.sin(r.ang)*l,cy=r.ay+Math.cos(r.ang)*l;
  p.vx=Math.cos(r.ang)*r.av*l;p.vy=-Math.sin(r.ang)*r.av*l;
  p.x=cx-p.w/2;p.y=cy-p.h/2+3;if(Math.abs(p.vx)>8)p.face=p.vx>0?1:-1;
  p.anim+=dt*4;p.onGround=false;
  var jp=pressed.jump||pressed.jumpUp;
  if(jp||pressed.dash||pressed.down){
    r.held=false;p.rope=null;p.ropeCd=0.35;
    if(jp){giveBoost();p.vy=Math.min(p.vy,0)-190;p.vx*=1.1;sfx('jump');p.jumpedFromGround=false;featherPuff(cx,cy);}
    return false;
  }
  return true;
}
