/* ---------- touching: snatchers steal, closed shells and stunned creatures are harmless ---------- */
function creatureTouch(e){
  if(e.frozenT>0||e.teaT>0||e.stunT>0||G.kazooT>0||e.sneezeT>0||e.congaWait)return true;
  var C=CREATURES[e.type];if(!C)return e.type==='gull';
  if(e.type==='n_barnacle'&&e.st!=='act')return true;
  if(C.snatch){if(!e.carry&&!(e.snatchCd>0))snatch(e,C);return true;}
  return false;
}
function snatch(e,C){
  e.snatchCd=1.5;
  if(C.snatch==='seeds'||C.snatch==='eat'){var n=Math.min(run.seeds,C.snatch==='eat'?3:5);if(!n){floatText(e.x,e.y-6,'Hee hee!','#ffffff');return;}run.seeds-=n;
    if(C.snatch==='eat'){e.eaten=(e.eaten||0)+n;fluffGrow(e,0.25);floatText(P.x,P.y-8,'-'+n+' seeds','#ffd23f');sfx('giggle');return;}
    e.carry=n;floatText(P.x,P.y-8,'-'+n+' seeds!','#ffd23f');}
  else if(C.snatch==='meter'){var m=Math.min(run.meter||0,30);if(m<5){floatText(e.x,e.y-6,'Hee hee!','#ffffff');return;}run.meter-=m;e.carry=m;floatText(P.x,P.y-8,'Song drained!','#5fc3ff');}
  else if(C.snatch==='flaps'){if(P.flapDebt>=1){floatText(e.x,e.y-6,'Whee!','#ffffff');return;}P.flapDebt=1;P.flaps=0;e.carry=1;floatText(P.x,P.y-8,'Flap snatched!','#ffe08a');}
  sfx('giggle');G.lvl.snatched=(G.lvl.snatched||0)+1;if(typeof onSnatch==='function')onSnatch(e);
}

  var C=CREATURES[e.type];if(!e.carry&&!e.eaten)return;
  if(e.type==='gull'||(C&&(C.snatch==='seeds'||C.snatch==='eat'))){var n=Math.round(((e.carry||0)+(e.eaten||0))*1.5)+2;
    for(var i=0;i<n;i++)pickups.push({k:'seed',x:e.x+e.w/2,y:e.y,vx:rnd(-120,120),vy:rnd(-220,-80)});floatText(e.x,e.y-12,'Got them back!','#ffd23f');}
  else if(C.snatch==='meter'){meterAdd(e.carry+10);floatText(e.x,e.y-12,'Song back!','#5fc3ff');}
  else if(C.snatch==='flaps'){P.flapDebt=0;P.flaps=S.flaps;floatText(e.x,e.y-12,'Flap back!','#ffe08a');}
  e.carry=0;e.eaten=0;
}

var FLAVOUR=/stopped being confused|rain has stopped|conga line waves|seagull got away|Feather Pass tier|PRESTIGE|under Creatures|colour burst drifted|songbird joins/i;
function toast(msg,kind){
  if(!G.toasts)G.toasts=[];
  if(run){(run.log=run.log||[]).push({m:msg,era:G.lvl?G.lvl.era:0});if(run.log.length>80)run.log.shift();}
  kind=kind||(FLAVOUR.test(msg)?'flavour':'key');
  if(kind==='flavour'&&!helpMode())return;
  if(G.toasts.length&&G.toasts[G.toasts.length-1].msg===msg)return;
  G.toasts.push({msg:msg,t:3.2,max:3.2,kind:kind});if(G.toasts.length>4)G.toasts.splice(1,1);
}

function allCardIds(){var out=[];ERAS.forEach(function(E){CARDS[E.id].forEach(function(c){out.push(c.id);});});return out;}
function readCount(){var r=meta.read||{};return allCardIds().filter(function(id){return r[id]&&meta.eggs[id];}).length;}
function wireReading(){
  var ov=$('ov');if(!ov)return;meta.read=meta.read||{};wireScenes();
  ov.querySelectorAll('details[data-card]').forEach(function(d){var id=d.getAttribute('data-card');if(d.__wired)return;d.__wired=true;
    if(meta.read[id])markReadUI(d);
    d.addEventListener('toggle',function(){if(meta.read[id])return;clearTimeout(d.__rt);var old=d.querySelector('.readbar');if(old)old.remove();
      if(d.open){var bar=document.createElement('div');bar.className='readbar';bar.innerHTML='<i></i><span>Reading...</span>';d.appendChild(bar);
        d.__rt=setTimeout(function(){if(!d.open||!document.body.contains(d))return;meta.read[id]=1;saveMeta();bar.remove();markReadUI(d);sfx('chirp');
          var rc=$('readcount');if(rc)rc.textContent=readCount();checkDootUnlock();},READ_SECONDS*1000);}});});
}

}

}

   Tracks crossfade when the level changes, duck while paused, and speed up during
   MAXIMUM VOLUME. If a song cannot play, DOOT falls back to its built in riff. */

/* a streamed track (song files on the site) */
function dTrackFile(key){var a=new Audio(),t={key:key,vol:0,dead:false};a.preload='auto';a.loop=true;a.src=DMUS_DIR+DMUS_FILES[key];a.volume=0;
  try{a.playbackRate=DMUS.rate;}catch(e){}
  t.start=function(){if(!settings.music)return;try{var pr=a.play();if(pr&&pr.catch)pr.catch(function(err){if(err&&err.name==='NotAllowedError')DMUS.blocked=true;});}catch(e){DMUS.blocked=true;}};
  t.setVol=function(v){t.vol=v;a.volume=Math.max(0,Math.min(1,v));};
  t.setRate=function(r){try{a.playbackRate=r;}catch(e){}};
  t.tick=function(){if(settings.music&&a.paused&&!DMUS.blocked&&!t.dead)t.start();if(!settings.music&&!a.paused)a.pause();};
  t.stop=function(){t.dead=true;try{a.pause();a.removeAttribute('src');a.load();}catch(e){}};
  a.addEventListener('error',function(){if(!t.dead)dTrackFailed(t);});return t;}
/* a built in track, decoded into the Web Audio engine */
function dTrackBuf(key){var t={key:key,vol:0,dead:false,g:null,src:null};
  t.begin=function(buf){if(t.dead)return;t.g=AC.createGain();t.g.gain.value=t.vol*2.6;t.g.connect(musicBus);var s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.playbackRate.value=DMUS.rate;s.connect(t.g);s.start();t.src=s;};
  t.start=function(){if(t.src||t.loading||t.dead)return;if(!AC){try{audioResume();}catch(e){}}if(!AC){t.retry=true;return;}
    if(DMUS.bufs[key]){t.begin(DMUS.bufs[key]);return;}t.loading=true;
    try{var bytes=dB64(DMUS_DATA[key]);AC.decodeAudioData(bytes.buffer,function(buf){t.loading=false;DMUS.bufs={};DMUS.bufs[key]=buf;t.begin(buf);},function(){t.loading=false;if(!t.dead)dTrackFailed(t);});}
    catch(e){t.loading=false;dTrackFailed(t);}};
  t.setVol=function(v){t.vol=v;if(t.g)t.g.gain.value=Math.max(0,v)*2.6;};
  t.setRate=function(r){if(t.src)try{t.src.playbackRate.value=r;}catch(e){}};
  t.tick=function(){if(t.retry&&AC){t.retry=false;t.start();}};

  return t;}
function dTrackFailed(t){DMUS.failed[t.key]=1;if(DMUS.cur===t){DMUS.cur=null;if(G.state==='doot'){DMUS.key=null;dMusic(t.key);}}}
function dMusic(key){
  var hasData=dMusicHasData(key),hasFile=!!DMUS_FILES[key];
  if(DMUS.key===key&&DMUS.cur)return;
  if(DMUS.failed[key]||(!hasData&&!hasFile)){if(DMUS.cur)dMusicFadeOut();DMUS.key=key;playMusic('doot',key===4);return;}
  stopMusic();if(DMUS.cur)dMusicFadeOut();
  var t=hasData?dTrackBuf(key):dTrackFile(key);DMUS.cur=t;DMUS.key=key;t.start();}
function dMusicFadeOut(){var t=DMUS.cur;if(!t)return;DMUS.old.push(t);DMUS.cur=null;}
function dMusicStop(){if(DMUS.cur)dMusicFadeOut();DMUS.key=null;DMUS.rate=1;}
function dMusicRate(r){DMUS.rate=r;if(DMUS.cur)DMUS.cur.setRate(r);}
function dMusicTick(dt){var t=DMUS.cur,want=settings.music?(D.screen==='pause'||D.screen==='quit'||D.screen==='help'?0.25:D.screen==='inter'?0.45:DMUS.vol):0;

/* browsers may hold back sound until the next tap or key press */
function dMusicUnblock(){if(DMUS.blocked&&DMUS.cur&&settings.music){DMUS.blocked=false;DMUS.cur.start();}}
window.addEventListener('keydown',dMusicUnblock,true);window.addEventListener('pointerdown',dMusicUnblock,true);

  updateEnemies(dt);
  if(G.boss&&!G.boss.dead){var tl=(hasKin('timeless')&&P.ghostT>0)?0.4:1;if(G.boss.intro>0)G.boss.intro-=dt;else G.boss.update(dt*tl);if(G.boss.flash>0)G.boss.flash-=dt;}
  if(!G.cracksSeen&&!G.lvl.boss&&!meta.tipCrack){var cx0=Math.floor(G.camX/16),cx1=cx0+25;for(var ty=0;ty<14&&!G.cracksSeen;ty++)for(var tx=cx0;tx<=cx1;tx++){if(tileAt(tx,ty)===T_CRACK){G.cracksSeen=true;meta.tipCrack=1;saveMeta();toast('See the cracked wall? Dash into it or land on it to break it. Secrets hide behind.');break;}}}
  updateOrbiters(dt);
  updatePickups(dt);
  updateRopes(dt);updateBeat(dt);updateGift(dt);
  if(pressed.song||touchState.songTap){touchState.songTap=false;useSpecial();}
  updateSpecial(dt);updateFlock(dt);updateEvents(dt);updatePendingPicks();
  updateFx(dt);updateCreatureWorld(dt);updateBird(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*20);
  if(G.flash>0)G.flash-=dt;
  if(G.banner&&G.banner.t>0)G.banner.t-=dt;
  /* camera */
  var L=G.lvl,target=P.x+P.w/2-W*0.4+P.face*14;
  G.camX+=(target-G.camX)*Math.min(1,dt*5);G.camX=clamp(G.camX,0,Math.max(0,L.w*16-W));
  var ty2=P.y+P.h/2-H*0.56+(P.vy>200?30:0);G.camY+=(ty2-G.camY)*Math.min(1,dt*(Math.abs(ty2-G.camY)>80?6:3.5));G.camY=clamp(G.camY,0,Math.max(0,L.h*16-H));
  /* level colour slowly follows how many creatures are calm */
  if(!L.boss){var want=0.45+0.55*Math.min(1,L.calmed/Math.max(1,L.total));L.colour=Math.max(L.colour,lerp(L.colour,want,dt));}
  /* cameo */
  G.plaque=null;
  if(G.cameo){var c=G.cameo;if(dist(P.x+P.w/2,P.y+P.h/2,c.x+8,c.y+12)<30){G.plaque={name:c.c.name,line:c.c.line+(meta.eggs[c.c.card]?' Their story is in your nest.':' Their story is hidden in one of this era\'s eggs.')};
    if(!c.used){c.used=true;run.cameosSeen.push(c.c.name);if(!healPlayer(1)){run.seeds+=5;run.seedsTotal+=5;floatText(c.x+8,c.y-6,'+5','#ffd23f');}sfx('chirp');ringFx(c.x+8,c.y+12,30,ERAS[L.era].accent);}}}
  /* shrine */
  (G.shrines||[]).forEach(function(sh){if(!sh.used&&G.state==='play'&&dist(P.x+P.w/2,P.y+P.h/2,sh.x,sh.y-4)<16)useShrine(sh);});
  updateSigns();updateDoors();updateRoom(dt);updateMemoryQueue(dt);
  /* music layers grow with the colour you bring back */
  var mi=L.colour>=0.78?2:L.colour>=0.58?1:0;if((G.combo>=2&&G.t-(G.comboT||0)<2.2)||G.special||G.mini||G.ambush)mi++;MUS.int=Math.min(3,mi);if(G.congaT>0||G.kazooT>0)MUS.int=3;
  updateFun(dt);updateFade(dt);updateQuiet(dt);
  /* goal */
  if(L.goal&&P.x+P.w>L.goal.x)levelComplete();
  /* guardian defeated: collect the golden egg, then move on */
  if(G.boss&&G.boss.dead&&G.state==='play'){G.bossDoneT=(G.bossDoneT||0)+dt;
    var gold=pickups.some(function(k){return k.k==='gold';});
    if(!gold&&!G.goldTaken){G.goldTaken=true;}
    if((G.goldTaken&&G.bossDoneT>1.6)||G.bossDoneT>9){if(gold){pickups=pickups.filter(function(k){return k.k!=='gold';});collectEgg(true);}G.goldTaken=false;eraComplete();}}
}
/* ================= RENDER LOOP ================= */
var titleT=0;
function render(dt){
  ctx.imageSmoothingEnabled=false;
  if(G.state==='ending'){drawEnding(dt);return;}
  if(G.state==='doot'){dootRender(dt);return;}
  if(G.lvl&&P){drawWorld();}
  else{ /* title and nest backdrop: drift through the eras */
    titleT+=dt;var era=Math.floor(titleT/7)%5;var off=titleT*12;
    b.drawImage(BG[era].sky,0,0);var fx=-(off*0.3)%400,mx=-(off*0.7)%400;b.drawImage(BG[era].far,fx,0);b.drawImage(BG[era].far,fx+400,0);b.drawImage(BG[era].mid,mx,0);b.drawImage(BG[era].mid,mx+400,0);
    var t=TILES[era];for(var x=0;x<W+16;x+=16){b.drawImage(t.solid,x-(off%16),192);b.drawImage(t.inner,x-(off%16),208);}
    var pose=Math.floor(titleT/2.5)%2?'look':'idle';b.save();b.translate(96,192);b.scale(1,1);b.drawImage(BIRD[pose],-RIGX,-RIGY);b.restore();
    if(meta.bonnie){b.drawImage(BONNIE[Math.floor(titleT*2)%2],118,180);}
  }
  ctx.fillStyle='#120e22';ctx.fillRect(0,0,view.cw,view.ch);
  ctx.drawImage(buf,view.ox,view.oy,W*view.s,H*view.s);
  if((G.state==='play'||G.state==='between'||G.state==='paused')&&run){drawHUD();drawChirpHUD();drawFunHUD();drawFadeHUD();drawCreatureCardHUD();drawBigText(dt);drawTeacherBadge();}
}
var lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.033,Math.max(0,(ts-lastT)/1000));lastT=ts;G.t+=dt;
  var held=false;
  try{
    if(G.state==='play'&&!ui.open&&P){
      if(pressed.pause){pauseGame();}
      else if(G.hitstop>0){G.hitstop-=dt;held=true;}
      else{update(dt*(G.slowmo>0?0.3:1));if(G.slowmo>0)G.slowmo-=dt;}
    }else if(G.state==='between'&&P){updateFx(dt);updatePickups(dt);}
    else if(G.state==='doot'){dootUpdate(dt);}
  }catch(e){if(!frame.uerr){frame.uerr=1;console.error(e);}}
  try{render(dt);}catch(e){if(!frame.err){frame.err=1;console.error(e);}}
  if(!held)for(var k in pressed)pressed[k]=false;
}

/* ================= TOUCH CONTROLS ================= */
var isTouch=false;
function showTouch(on){var t=$('touch');if(!t)return;var want=on&&(settings.touch==='on'||(settings.touch==='auto'&&isTouch));t.hidden=!want;$('pausebtn').hidden=!on;var sg=$('tbsing');if(sg)sg.hidden=!!settings.autoSing;}
function bindTouch(){
  document.querySelectorAll('#touch [data-k]').forEach(function(el){
    var k=el.getAttribute('data-k');
    function down(e){e.preventDefault();audioResume();try{el.setPointerCapture(e.pointerId);}catch(_){}
      if(!touchState[k]){if(k==='jump')pressed.jump=true;if(k==='dash')pressed.dash=true;if(k==='down')pressed.down=true;if(k==='sing')pressed.sing=true;if(k==='song')pressed.song=true;}
      touchState[k]=true;el.classList.add('on');}
    function up(e){touchState[k]=false;el.classList.remove('on');}
    el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  });
  $('pausebtn').addEventListener('click',function(){audioResume();if(G.state==='play')pauseGame();});
  window.addEventListener('touchstart',function(){if(!isTouch){isTouch=true;if(G.state==='play')showTouch(true);}},{passive:true});
  cv.addEventListener('pointerdown',function(){audioResume();if(G.state==='ending')G.endTap=true;});
}

/* ================= BOOT ================= */
var BONNIE=[];
function boot(){
  try{isTouch=matchMedia('(pointer:coarse)').matches;}catch(e){}
  buildEnemyArt();buildEnemyArt2();buildCageArt();buildItems();buildTiles();buildBackgrounds();
  BIRD=buildBird(cwNow(),meta.hat);BONNIE=[buildBonnie(0),buildBonnie(1)];
  bindTouch();
  showTitle();
  requestAnimationFrame(function(ts){lastT=ts;frame(ts);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
}
/* hooks used by automated tests */
window.__sk={G:G,get run(){return run;},get P(){return P;},get S(){return S;},get meta(){return meta;},ents:function(){return ents;},pickups:function(){return pickups;},
  startRun:startRun,startLevel:startLevel,takePower:takePower,showNest:function(){ACTIONS.nest();},keys:keys,pressed:pressed,
  setRun:function(f){f(run);recalc();},eraComplete:eraComplete,levelComplete:levelComplete,genLevel:genLevel,endRun:endRun,closeUI:closeUI};
boot();
