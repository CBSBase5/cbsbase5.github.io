/* ---------- Sankofa gifts: something appears behind you halfway through a level ---------- */
function updateGift(dt){
  var L=G.lvl;if(!L||L.boss)return;
  if(L.giftPlan&&!L.giftDone&&P.x>L.w*16*0.5){
    L.giftDone=true;var cands=[];
    var a=Math.floor((P.x-780)/16),bnd=Math.floor((P.x-360)/16);
    var r0=P.y<14*16&&L.tall?11:L.h-3,r1=P.y<14*16&&L.tall?2:(L.tall?16:2);
    for(var tx=Math.max(2,a);tx<=bnd;tx++)for(var ty=r0;ty>=r1;ty--){
      var here=tileAt(tx,ty),below=tileAt(tx,ty+1);
      if(here===T_EMPTY&&tileAt(tx,ty-1)===T_EMPTY&&!L.wind[ty*L.w+tx]&&(isSolid(below)||below===T_PLAT)&&below!==T_DRUM){cands.push([tx,ty]);break;}}
    if(cands.length){var c=choice(cands);G.gift={x:c[0]*16+8,y:c[1]*16+8,k:L.giftPlan,t:0};
      toast('Something glints behind you. Sankofa: go back and fetch it?');sfx('chirp');}
    else if(L.giftPlan==='egg'){L.giftDone=false;}
  }
  var g=G.gift;if(!g)return;g.t+=dt;
  if(dist(P.x+P.w/2,P.y+P.h/2,g.x,g.y)<15){
    G.gift=null;ringFx(g.x,g.y,40,'#ffd23f');
    if(g.k==='egg'){collectEgg(false);toast('You went back and fetched it. That is what Sankofa means.');}
    else{run.seeds+=12;run.seedsTotal+=12;healPlayer(1);run.sankofa=(run.sankofa||0)+1;sfx('egg');
      toast('Sankofa: you went back and fetched it. Seeds, a heart and extra twigs for the nest.');saveRunSnapshot();}
  }
}

function applyMoods(B){
  var n=windOn('stern')?2:1;B.moods=shuffle(MOODS[B.era].slice()).slice(0,n);B.mt={};
  B.moods.forEach(function(m){
    if(m.id==='longplay'){B.r=28;B.vx*=0.75;B.vy*=0.75;}
    if(m.id==='frost')B.litTime=5;

    if(m.id==='fade')B.fadeEarly=true;
  });
  var up=B.update,dr=B.draw;
  B.update=function(dt){up.call(this,dt);if(this.dead)return;var sl=this.slowT>0?0.5:1;moodUpdate(this,dt*sl);};
  B.draw=function(){dr.call(this);moodDraw(this);};

function mt(B,k,every,dt){B.mt[k]=(B.mt[k]==null?every*0.6:B.mt[k])-dt;if(B.mt[k]<=0){B.mt[k]+=every;return true;}return false;}
function moodUpdate(B,dt){
  var k=0.75+0.25*meta.ad;
  B.moods.forEach(function(m){switch(m.id){
  case 'crackle':if(mt(B,'cr',7/k,dt)){warnLane(B,181,11,1.0,0.32);warnLane(B,118,26,1.7,0.38);}break;
  case 'feedback':if(mt(B,'fb',6/k,dt)){for(var i=0;i<10;i++){var a=i/10*TAU;eshots.push({x:B.x,y:B.y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,life:3.5,r:4,k:'static',through:true});}sfx('shot');}break;
  case 'hum':if(mt(B,'hm',5/k,dt)){warnCol(B,clamp(P.x-9,4,370),28,0.95,0.5);}break;
  case 'skip':if(!B.skipTo&&mt(B,'sk',7/k,dt)){B.skipTo={x:rnd(60,340),y:rnd(50,150),t:0.9};}
    if(B.skipTo){B.skipTo.t-=dt;if(B.skipTo.t<=0){B.x=B.skipTo.x;B.y=B.skipTo.y;B.skipTo=null;ringFx(B.x,B.y,30,'#c8c8d4');sfx('crack');}}break;
  case 'spiral':if(mt(B,'sp',8/k,dt))B.spinT=2;if(B.spinT>0){B.spinT-=dt;if(mt(B,'sp2',0.12,dt)){var a2=G.t*5;eshots.push({x:B.x,y:B.y,vx:Math.cos(a2)*80,vy:Math.sin(a2)*80,life:3,r:3,k:'shard',through:true});}}break;

  case 'hail':if(mt(B,'hl',0.75/k,dt)){eshots.push({x:rnd(10,390),y:-6,vx:rnd(-10,10),vy:110,life:4,r:3,k:'hail',through:false});}break;
  case 'snowdrift':if(mt(B,'sd',4.5/k,dt)&&ents.length<4){var e=addEnemy('fog',choice([10,370]),rint(2,7)*16);e.active=true;}break;
  case 'echo':eshots.forEach(function(s){if(s.k==='orb'&&!s.split){s.age=(s.age||0)+dt;if(s.age>2.2){s.split=true;s.life=0;for(var q=0;q<3;q++){var a3=Math.atan2(s.vy,s.vx)+(q-1)*0.6;eshots.push({x:s.x,y:s.y,vx:Math.cos(a3)*65,vy:Math.sin(a3)*65,life:3,r:3,k:'orb',through:true,split:true});}}}});break;
  case 'gusts':if(!B.gust&&mt(B,'gu',6.5/k,dt)){B.gust={warn:1.1,blow:1.3};}
    if(B.gust){if(B.gust.warn>0){B.gust.warn-=dt;}else{B.gust.blow-=dt;if(P&&!P.rope){P.vx-=320*dt;if(P.vx<-150)P.vx=-150;}if(B.gust.blow<=0)B.gust=null;}}break;
  }});
}

function genLevel2(era){
  var plan=run.eggPlan[era]||{};
  var nMid=11+(era>=2?1:0);
  var lowers=pickChunks(era,nMid).map(function(c){return {t:c.t,g:c.g};});
  var upPool=UPPER_CHUNKS.filter(function(c){return c.era===undefined||c.era===era;});
  upPool=upPool.concat(upPool.filter(function(c){return c.era===era;}));
  var uppers=[],last=null;
  for(var i=0;i<nMid;i++){var c,tries=0;do{c=choice(upPool);tries++;}while((c===last||(c.secret&&Math.random()<0.6))&&tries<10);uppers.push({t:c.t,g:c.g,secret:c.secret});last=c;}
  var wantEgg=!run.eraEgg[era]&&plan.where;
  var eggHigh=Math.random()<0.65;
  /* route treasures: the egg spot or secret on one route, a shrine and the cameo on the other */
  if(wantEgg&&plan.where==='spot'){
    if(eggHigh){var gu=UPPER_CHUNKS.filter(function(c){return c.g;})[0];uppers[rint(3,nMid-2)]={t:gu.t,g:1};}
    else if(!lowers.some(function(m){return m.g;})){var gs=CHUNKS.filter(function(c){return c.g&&(c.era===undefined?c.d<=(era===0?1:3):c.era===era);});lowers[rint(2,nMid-2)]={t:choice(gs).t,g:1};}
  }
  if(wantEgg&&plan.where==='secret'){
    if(eggHigh){var su=UPPER_CHUNKS.filter(function(c){return c.secret;})[0];uppers[rint(3,nMid-2)]={t:su.t,secret:1};}
    else{var sc=choice(CHUNK_SECRETS.filter(function(c){return c.d<=Math.max(1,era+1);}));lowers[rint(2,nMid-2)]={t:sc.t,secret:1};}
  }else if(Math.random()<0.6){var sc2=choice(CHUNK_SECRETS.filter(function(c){return c.d<=Math.max(1,era+1);}));lowers[rint(2,nMid-2)]={t:sc2.t,secret:1};}
  lowers[rint(1,nMid-2)]={t:CHUNK_CAMEO,cameo:1};
  /* columns: start, then pairs with a connector every third column, then the end */
  var cols=[{tall:TALL_START.t,fixed:1}];
  for(i=0;i<nMid;i++){
    if(i%3===2&&i<nMid-1)cols.push({tall:choice(CONNECTORS).t});
    else cols.push({up:uppers[i],low:lowers[i]});
  }
  cols.push({tall:TALL_END.t,fixed:1});
  var wt=cols.length*16,ht=28;
  var L={era:era,idx:0,boss:false,w:wt,h:ht,tiles:new Uint8Array(wt*ht),wind:new Uint8Array(wt*ht),crackHp:{},spawns:[],goal:null,colour:0.45,calmed:0,total:0,eggPlaced:false,tall:true,eggHigh:eggHigh};
  function place(rows,ci,r0,flag){
    var flip=!flag.fixed&&!flag.cameo&&Math.random()<0.5;if(flip)rows=rows.map(flipRow);
    for(var r=0;r<rows.length;r++){var row=rows[r];for(var col=0;col<16;col++){var ch=row[col],tx=ci*16+col,ty=r0+r,ii=ty*wt+tx;
      switch(ch){
      case '#':L.tiles[ii]=T_SOLID;break;case '=':L.tiles[ii]=T_PLAT;break;case 'C':L.tiles[ii]=T_CRACK;L.crackHp[ii]=3;break;case 'B':L.tiles[ii]=T_DRUM;break;
      case 'L':L.tiles[ii]=T_NEON;break;case 'K':L.tiles[ii]=T_SPEAKER;break;
      case '^':L.tiles[ii]=(r>0&&rows[r-1][col]==='#')?T_THORND:T_THORN;break;
      case 'w':L.wind[ii]=1;break;
      case 'M':if(col===0||row[col-1]!=='M')L.spawns.push({k:'M',x:tx*16,y:ty*16,flip:flip,layer:r0?1:0});break;
      case '.':break;
      default:L.spawns.push({k:ch,x:tx*16,y:ty*16,secret:!!flag.secret,flip:flip,layer:(ty<14)?0:1});
      }}}
  }
  cols.forEach(function(c,ci){
    if(c.tall)place(c.tall,ci,0,c);
    else{place(c.up.t,ci,0,c.up);place(c.low.t,ci,14,c.low);}
  });
  /* the egg can also be the Sankofa gift that appears behind you */
  var giftEgg=wantEgg&&plan.where==='back';
  L.giftPlan=giftEgg?'egg':(Math.random()<0.55?'gift':null);
  /* caged songbirds: three per level, mostly up high */
  var cs=L.spawns.filter(function(s){return s.k==='c';});shuffle(cs);
  var keep=cs.slice(0,2);
  var lowSeeds=L.spawns.filter(function(s){return s.k==='s'&&s.layer===1&&s.x>200;});
  if(lowSeeds.length){var ls=choice(lowSeeds);ls.k='c';keep.push(ls);}
  while(keep.length<3&&cs.length>keep.length){keep.push(cs[keep.length]);}
  L.spawns.forEach(function(s){if(s.k==='c'&&keep.indexOf(s)<0)s.k='s';});
  /* a shrine on whichever route does not hold the egg */
  var shrineLayer=eggHigh?1:0;var shrineSpots=L.spawns.filter(function(s){return s.k==='s'&&s.layer===shrineLayer&&s.x>300;});
  if(shrineSpots.length)choice(shrineSpots).k='z';
  /* level goal and surprise */
  L.goalId=choice(['birds','calm','unhurt','seeds','high','song']);
  L.event=choice(['ambush','burst','shower']);
  L.eventX=wt*16*rnd(0.22,0.4);L.miniX=wt*16*rnd(0.55,0.65);
  placeDoor(L);
  return L;
}

    if(!meta.tipSong){meta.tipSong=1;saveMeta();toast((isTouch?'Tap Song':'Press V')+' to sing your '+SPECIALS[dominantTag()].name+'. It changes with your powers.');}}

function specialPower(){var era=G.lvl?G.lvl.era:0,tc=tagCounts(),t=dominantTag();return (10+4*era)*(1+0.15*(tc[t]||0))*(0.8+0.2*meta.ad);}

  switch(e.type){
  case 'scratch':

    if(hl.d){var ahead=Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/16),below=Math.floor((e.y+e.h+4)/16),tb=tileAt(ahead,below);if(!isSolid(tb)&&tb!==T_PLAT)e.dir*=-1;}
    if(Math.abs(pcx-(e.x+e.w/2))<90&&Math.abs(pcy-e.y)<30)e.dir=pcx>e.x?1:-1;
    if(e.y>G.lvl.h*16+30)e.dead=true;return true;
  case 'feedback':

      if(e.cd<=0){e.cd=3/(0.7+0.3*meta.ad);var base=e.t;for(var k=0;k<4;k++){var a=base+k*Math.PI/2;eshots.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.cos(a)*75,vy:Math.sin(a)*75,life:3,r:4,k:'ring'});}sfx('shot');}}
    return true;
  case 'frost':
    e.x+=e.dir*e.spd*edt;if(Math.abs(e.x-e.homeX)>64)e.dir=e.x>e.homeX?-1:1;e.y=e.homeY+Math.sin(e.t*2)*6;e.cd-=edt;
    if(e.cd<=0&&Math.abs(pcx-(e.x+e.w/2))<30&&pcy>e.y){e.cd=1.4;eshots.push({x:e.x+e.w/2,y:e.y+e.h,vx:0,vy:40,g:520,life:3,r:3,k:'hail'});}

function wallCheck(p,dir){
  if(p.onGround||!dir)return 0;

  return 0;
}

/* generic map reader used by the practice flight, arenas and challenge rooms */
function parseMap(rows,era,extra){
  var wt=rows[0].length,ht=rows.length;
  var L=Object.assign({era:era,idx:0,boss:false,w:wt,h:ht,tiles:new Uint8Array(wt*ht),wind:new Uint8Array(wt*ht),crackHp:{},spawns:[],goal:null,colour:0.6,calmed:0,total:0},extra||{});
  for(var r=0;r<ht;r++)for(var c=0;c<wt;c++){var ch=rows[r][c],i=r*wt+c;
    switch(ch){
    case '#':L.tiles[i]=T_SOLID;break;case '=':L.tiles[i]=T_PLAT;break;case 'C':L.tiles[i]=T_CRACK;L.crackHp[i]=3;break;case 'B':L.tiles[i]=T_DRUM;break;
    case 'L':L.tiles[i]=T_NEON;break;case 'K':L.tiles[i]=T_SPEAKER;break;case 'w':L.wind[i]=1;break;
    case '^':L.tiles[i]=(r>0&&rows[r-1][c]==='#')?T_THORND:T_THORN;break;
    case '.':break;
    default:L.spawns.push({k:ch,x:c*16,y:r*16,layer:1});
    }}
  return L;
}

/* ---------- unlocks ---------- */
function crMet(){if(!meta.cmet||typeof meta.cmet!=='object')meta.cmet={};return meta.cmet;}
function crUnlocked(era){var m=crMet(),n=0;CR_ORDER[era].forEach(function(id){if(m[id])n++;});return Math.min(6,3+n);}
function makePools(){return CR_ORDER.map(function(list,era){return list.slice(0,crUnlocked(era));});}
var OLD_SLOT={smudge:'walk',static:'fly',hush:'sit',drip:'ceil',fog:'fly',gloom:'big',latch:'walk',scratch:'walk',feedback:'fly',frost:'fly',mist:'fly'};
var SLOT_FALL={walk:['walk','big','sit'],big:['big','walk'],sit:['sit','walk','fly'],ceil:['ceil','fly'],fly:['fly','ceil']};
function remapCreature(type){
  if(!OLD_SLOT[type]||!run||!G.lvl)return type;
  if(!run.pool)run.pool=makePools();
  var era=G.lvl.era,pool=run.pool[era]||CR_ORDER[era].slice(0,3);
  if(G.lvl.tutorial)pool=['n_buffer','n_glitch'];
  else if(G.lvl.boss||G.boss)pool=pool.filter(function(id){var r=CREATURES[id].role;return r==='Chaser'||r==='Shooter'||r==='Ambusher'||r==='Tank';});
  if(!pool.length)pool=CR_ORDER[era].slice(0,2);
  var want=OLD_SLOT[type],tries=SLOT_FALL[want];
  for(var i=0;i<tries.length;i++){var m=pool.filter(function(id){return CREATURES[id].slot===tries[i];});if(m.length)return wpick(m);}
  return wpick(pool);
}

var ROLE_W={Snatcher:0.4,Helper:0.45,'Level changer':0.5,Tank:0.6};
function wpick(ids){var tot=0;ids.forEach(function(id){tot+=ROLE_W[CREATURES[id].role]||1;});var r=Math.random()*tot;for(var i=0;i<ids.length;i++){r-=ROLE_W[CREATURES[ids[i]].role]||1;if(r<=0)return ids[i];}return ids[ids.length-1];}

function cWalk(e,edt,spd,edges){
  e.vy+=900*edt;if(e.vy>300)e.vy=300;
  var h=moveBody(e,e.dir*spd*edt,e.vy*edt);if(h.d)e.vy=0;if(h.l||h.r)e.dir*=-1;
  if(h.d&&edges!==false){var ahead=Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/16),below=Math.floor((e.y+e.h+4)/16),tb=tileAt(ahead,below);
    if(!isSolid(tb)&&tb!==T_PLAT&&tb!==T_NEON)e.dir*=-1;else if(tileAt(ahead,below-1)===T_THORN)e.dir*=-1;}

/* ---------- touching: snatchers steal, closed shells and stunned creatures are harmless ---------- */
function creatureTouch(e){
  if(e.frozenT>0||e.teaT>0||e.stunT>0||G.kazooT>0||e.sneezeT>0||e.congaWait)return true;
  var C=CREATURES[e.type];if(!C)return e.type==='gull';
  if(e.type==='n_barnacle'&&e.st!=='act')return true;
  if(C.snatch){if(!e.carry&&!(e.snatchCd>0))snatch(e,C);return true;}
  return false;
}
function snatch(e,C){
  e.snatchCd=1.5;
  if(C.snatch==='seeds'||C.snatch==='eat'){var n=Math.min(run.seeds,C.snatch==='eat'?3:5);if(!n){floatText(e.x,e.y-6,'Hee hee!','#ffffff');return;}run.seeds-=n;

      if(o.type==='n_mute'&&dist(o.x+o.w/2,o.y+o.h/2,e.x+e.w/2,e.y+e.h/2)<58){if(Math.random()<0.3)floatText(e.x+e.w/2,e.y-6,'shh','#e8e0ff');return Math.random()<0.2?1:0;}}
  }

/* ================= UPDATE ================= */

  playerSing(dt);
  updateNotes(dt);
  updateEnemies(dt);
  if(G.boss&&!G.boss.dead){var tl=(hasKin('timeless')&&P.ghostT>0)?0.4:1;if(G.boss.intro>0)G.boss.intro-=dt;else G.boss.update(dt*tl);if(G.boss.flash>0)G.boss.flash-=dt;}
  if(!G.cracksSeen&&!G.lvl.boss&&!meta.tipCrack){var cx0=Math.floor(G.camX/16),cx1=cx0+25;for(var ty=0;ty<14&&!G.cracksSeen;ty++)for(var tx=cx0;tx<=cx1;tx++){if(tileAt(tx,ty)===T_CRACK){G.cracksSeen=true;meta.tipCrack=1;saveMeta();toast('See the cracked wall? Dash into it or land on it to break it. Secrets hide behind.');break;}}}
  updateOrbiters(dt);
  updatePickups(dt);
  updateRopes(dt);updateBeat(dt);updateGift(dt);
  if(pressed.song||touchState.songTap){touchState.songTap=false;useSpecial();}
  updateSpecial(dt);updateFlock(dt);updateEvents(dt);updatePendingPicks();
  updateFx(dt);updateCreatureWorld(dt);updateBird(dt);

  /* camera */
  var L=G.lvl,target=P.x+P.w/2-W*0.4+P.face*14;
  G.camX+=(target-G.camX)*Math.min(1,dt*5);G.camX=clamp(G.camX,0,Math.max(0,L.w*16-W));
  var ty2=P.y+P.h/2-H*0.56+(P.vy>200?30:0);G.camY+=(ty2-G.camY)*Math.min(1,dt*(Math.abs(ty2-G.camY)>80?6:3.5));G.camY=clamp(G.camY,0,Math.max(0,L.h*16-H));
  /* level colour slowly follows how many creatures are calm */
  if(!L.boss){var want=0.45+0.55*Math.min(1,L.calmed/Math.max(1,L.total));L.colour=Math.max(L.colour,lerp(L.colour,want,dt));}

    if(!c.used){c.used=true;run.cameosSeen.push(c.c.name);if(!healPlayer(1)){run.seeds+=5;run.seedsTotal+=5;floatText(c.x+8,c.y-6,'+5','#ffd23f');}sfx('chirp');ringFx(c.x+8,c.y+12,30,ERAS[L.era].accent);}}}
  /* shrine */
  (G.shrines||[]).forEach(function(sh){if(!sh.used&&G.state==='play'&&dist(P.x+P.w/2,P.y+P.h/2,sh.x,sh.y-4)<16)useShrine(sh);});
  updateSigns();updateDoors();updateRoom(dt);updateMemoryQueue(dt);
  /* music layers grow with the colour you bring back */
  var mi=L.colour>=0.78?2:L.colour>=0.58?1:0;if((G.combo>=2&&G.t-(G.comboT||0)<2.2)||G.special||G.mini||G.ambush)mi++;MUS.int=Math.min(3,mi);if(G.congaT>0||G.kazooT>0)MUS.int=3;
  updateFun(dt);updateFade(dt);updateQuiet(dt);

  }
  ctx.fillStyle='#120e22';ctx.fillRect(0,0,view.cw,view.ch);
  ctx.drawImage(buf,view.ox,view.oy,W*view.s,H*view.s);
  if((G.state==='play'||G.state==='between'||G.state==='paused')&&run){drawHUD();drawChirpHUD();drawFunHUD();drawCreatureCardHUD();drawBigText(dt);}
}
var lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.033,Math.max(0,(ts-lastT)/1000));lastT=ts;G.t+=dt;
  var held=false;
  try{
    if(G.state==='play'&&!ui.open&&P){
      if(pressed.pause){pauseGame();}
      else if(G.hitstop>0){G.hitstop-=dt;held=true;}
      else update(dt);
    }else if(G.state==='between'&&P){updateFx(dt);updatePickups(dt);}
  }catch(e){if(!frame.uerr){frame.uerr=1;console.error(e);}}
  try{render(dt);}catch(e){if(!frame.err){frame.err=1;console.error(e);}}
  if(!held)for(var k in pressed)pressed[k]=false;
}

/* ================= TOUCH CONTROLS ================= */
var isTouch=false;
function showTouch(on){var t=$('touch');if(!t)return;var want=on&&(settings.touch==='on'||(settings.touch==='auto'&&isTouch));t.hidden=!want;$('pausebtn').hidden=!on;var sg=$('tbsing');if(sg)sg.hidden=!!settings.autoSing;}
function bindTouch(){
  document.querySelectorAll('#touch [data-k]').forEach(function(el){
    var k=el.getAttribute('data-k');
    function down(e){e.preventDefault();audioResume();try{el.setPointerCapture(e.pointerId);}catch(_){}
      if(!touchState[k]){if(k==='jump')pressed.jump=true;if(k==='dash')pressed.dash=true;if(k==='down')pressed.down=true;if(k==='sing')pressed.sing=true;if(k==='song')pressed.song=true;}
      touchState[k]=true;el.classList.add('on');}
    function up(e){touchState[k]=false;el.classList.remove('on');}
    el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  });
  $('pausebtn').addEventListener('click',function(){audioResume();if(G.state==='play')pauseGame();});
  window.addEventListener('touchstart',function(){if(!isTouch){isTouch=true;if(G.state==='play')showTouch(true);}},{passive:true});
  cv.addEventListener('pointerdown',function(){audioResume();if(G.state==='ending')G.endTap=true;});
}

/* ================= BOOT ================= */
var BONNIE=[];
function boot(){
  try{isTouch=matchMedia('(pointer:coarse)').matches;}catch(e){}
  buildEnemyArt();buildEnemyArt2();buildCageArt();buildItems();buildTiles();buildBackgrounds();
  BIRD=buildBird(cwNow(),meta.hat);BONNIE=[buildBonnie(0),buildBonnie(1)];
  bindTouch();
  showTitle();
  requestAnimationFrame(function(ts){lastT=ts;frame(ts);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
}
/* hooks used by automated tests */
window.__sk={G:G,get run(){return run;},get P(){return P;},get S(){return S;},get meta(){return meta;},ents:function(){return ents;},pickups:function(){return pickups;},
  startRun:startRun,startLevel:startLevel,takePower:takePower,showNest:function(){ACTIONS.nest();},keys:keys,pressed:pressed,
  setRun:function(f){f(run);recalc();},eraComplete:eraComplete,levelComplete:levelComplete,genLevel:genLevel,endRun:endRun,closeUI:closeUI};
boot();
