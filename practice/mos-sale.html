<style>
/* Mo's Sale only. Shell, cards and buttons come from style.css */
.pw{max-width:720px;margin:0 auto}
.pw .card{cursor:default}
.pw .kicker{opacity:.85}
.lead{font-size:1.08rem;line-height:1.55;margin:8px 0 10px!important;max-width:62ch}
.qprogress{height:10px;border-radius:999px;background:rgba(10,47,56,.1);overflow:hidden;margin-bottom:16px}
.qprogress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#007291,#ef7724);transition:width .25s}
.qcount{float:right;font-size:.85rem;opacity:.65;padding-top:2px}
.prompt{font-size:1.25rem;line-height:1.5;margin:8px 0 12px!important}
.qvis{margin:4px 0 14px;text-align:center}
.qvis svg{width:100%;max-width:460px;height:auto}
.learnbody p{font-size:1.08rem!important;line-height:1.55;margin:12px 0 6px!important}
.learnfig{margin:6px 0 4px;text-align:center}
.learnfig svg{width:100%;max-width:480px;height:auto}
.arow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.35rem;margin-bottom:8px}
.arow input{width:130px;font-size:1.3rem;font-family:var(--body);text-align:center;padding:10px 8px;border:2px solid rgba(10,47,56,.2);border-radius:12px 10px 14px 10px;background:#fffdfb;color:var(--ink)}
.arow input:focus-visible,.choices button:focus-visible,.tapbtn:focus-visible{outline:3px solid #ef7724;outline-offset:2px}
.hintline{font-size:.92rem;opacity:.75;margin:0 0 12px!important}
.choices{display:grid;gap:10px;margin-bottom:10px}
.choices button{text-align:left;font-size:1.05rem;font-family:inherit;padding:12px 16px;border:2px solid rgba(10,47,56,.2);border-radius:14px 10px 14px 10px;background:#fffdfb;color:var(--ink);cursor:pointer}
.choices button.picked{border-color:#007291;background:rgba(0,114,145,.1);font-weight:700}
.choices button.good{border-color:#2e7d4f;background:#e9f4ec}
.choices button.bad{border-color:#d75f10;background:#fdf0e5}
.choices button:disabled{cursor:default;opacity:1}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn.ghost{background:transparent;color:#005a73;border:2px solid rgba(0,114,145,.45);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.fb{margin:10px 0 4px;padding:12px 14px;border-radius:14px 10px 14px 10px;font-size:1rem;line-height:1.5}
.fb.ok{background:#e9f4ec;border:2px solid #bcdcc4}
.fb.nope{background:#fdf0e5;border:2px solid #f2d5b8}
.fb.tell{background:#eef4f6;border:2px solid #cfe0e6}
.fb b{font-family:var(--display)}
.topicbar{margin:12px 0 6px}
.topicbar .trow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.topicbar .name{flex:0 0 190px;font-size:.95rem}
.topicbar .track{flex:1;height:12px;background:rgba(10,47,56,.1);border-radius:999px;overflow:hidden}
.topicbar .fill{display:block;height:100%;border-radius:999px}
.topicbar .score{flex:0 0 46px;text-align:right;font-size:.9rem;opacity:.7}
.pw details.rev{margin-top:14px}
.pw details.rev summary{cursor:pointer;font-weight:700;color:#005a73}
.review-item{padding:10px 0;border-bottom:1px dashed rgba(10,47,56,.2);font-size:.98rem}
.tag{font-weight:700}
.tag.right{color:#2e7d4f}
.tag.diff{color:#b3541e}
.smallnote{font-size:.9rem;opacity:.75;margin-top:10px!important}
.hidden{display:none!important}
@media (max-width:480px){.prompt{font-size:1.12rem}.topicbar .name{flex-basis:130px}.arow input{width:110px}}
@media (prefers-reduced-motion:reduce){.qprogress span{transition:none}}

.mo-strip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.mo-strip svg{width:120px;height:auto;flex:none}

</style>

<script>

var LB = (function(){
  "use strict";
  function el(id){ return document.getElementById(id) }
  function show(id, on){ el(id).classList.toggle("hidden", !on) }
  var decoder = document.createElement("textarea");
  function plain(s){ decoder.innerHTML = String(s).replace(/<[^>]+>/g, ""); return decoder.value }
  function money(n){ return "\u00A3" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "") }

  function parseNum(raw, isMoney){
    var s = String(raw).trim().toLowerCase().replace(/,/g, "").replace(/\s+/g, "");
    if(!s) return NaN;
    var pence = false;
    if(isMoney && /p$/.test(s) && s.indexOf("\u00A3") < 0){ pence = true; s = s.slice(0, -1) }
    s = s.replace(/^\u00A3/, "").replace(/%$/, "");
    if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
    var v = parseFloat(s);
    return pence ? v / 100 : v;
  }

  function run(cfg){
    var ITEMS = cfg.items;
    var QNUM = [], TOTALQ = 0;
    ITEMS.forEach(function(q, i){ QNUM[i] = q.learn ? 0 : ++TOTALQ });
    var state = { idx:0, answers:{}, started:false, finished:false };

    function save(){ try{ localStorage.setItem(cfg.store, JSON.stringify(state)) }catch(e){} }
    function load(){ try{ var r = localStorage.getItem(cfg.store); if(r){ var s = JSON.parse(r); if(s && typeof s === "object" && s.answers) state = s } }catch(e){} }

    el("startTitle").textContent = cfg.startTitle;
    el("startText").innerHTML = cfg.startText;

    function answerText(q){
      if(q.type === "mc") return plain(q.opts[q.ans]);
      if(q.money) return money(q.ans);
      return (q.pre ? plain(q.pre) : "") + q.ans + (q.post ? plain(q.post) : "");
    }
    function givenText(q, a){
      if(!a) return "skipped";
      if(q.type === "mc") return plain(q.opts[a.v]);
      return a.v === "" ? "blank" : a.v;
    }
    function mark(q, v){
      if(q.type === "mc") return v === q.ans;
      var n = parseNum(v, q.money);
      if(isNaN(n)) return false;
      var tol = q.tol !== undefined ? q.tol : 0.005;
      return Math.abs(n - q.ans) <= tol;
    }

    function renderQ(){
      var q = ITEMS[state.idx], a = state.answers[state.idx];
      el("qTopic").textContent = q.t;
      el("progFill").style.width = Math.round(state.idx / ITEMS.length * 100) + "%";
      el("backBtn").disabled = state.idx === 0;
      el("qFb").innerHTML = "";
      el("qVis").innerHTML = q.vis || "";
      var box = el("qAnswer"); box.innerHTML = "";
      el("qHint").textContent = "";
      var last = state.idx === ITEMS.length - 1;

      if(q.learn){
        el("qCount").textContent = "";
        el("qPrompt").innerHTML = "<strong>" + q.h + "</strong>";
        el("qVis").innerHTML = "";
        box.innerHTML = "<div class='learnbody'>" + (q.vis ? "<div class='learnfig'>" + q.vis + "</div>" : "") + q.body + "</div>";
        el("skipBtn").classList.add("hidden");
        el("nextBtn").textContent = last ? "Finish" : "Got it";
        return;
      }
      el("qCount").textContent = QNUM[state.idx] + " of " + TOTALQ;
      el("qPrompt").innerHTML = q.p;
      var checked = a && a.checked;
      el("skipBtn").classList.toggle("hidden", !!checked);
      el("nextBtn").textContent = checked ? (last ? "Finish" : "Next") : "Check";

      if(q.type === "mc"){
        var grid = document.createElement("div"); grid.className = "choices";
        q.opts.forEach(function(o, oi){
          var b = document.createElement("button"); b.type = "button"; b.innerHTML = o;
          if(a && a.v === oi) b.classList.add("picked");
          if(checked){
            b.disabled = true;
            if(oi === q.ans) b.classList.add("good");
            else if(a.v === oi) b.classList.add("bad");
          } else {
            b.onclick = function(){ state.answers[state.idx] = { v:oi }; save(); renderQ() };
          }
          grid.appendChild(b);
        });
        box.appendChild(grid);
      } else {
        var row = document.createElement("div"); row.className = "arow";
        if(q.money || q.pre) row.appendChild(document.createTextNode(q.money && !q.pre ? "\u00A3" : plain(q.pre)));
        var inp = document.createElement("input");
        inp.type = "text"; inp.inputMode = "decimal"; inp.autocomplete = "off"; inp.maxLength = 10;
        inp.setAttribute("aria-label", "Your answer");
        inp.value = a ? a.v : "";
        inp.disabled = !!checked;
        inp.addEventListener("input", function(){ state.answers[state.idx] = { v:inp.value.trim() }; if(!inp.value.trim()) delete state.answers[state.idx]; save() });
        inp.addEventListener("keydown", function(e){ if(e.key === "Enter") el("nextBtn").click() });
        row.appendChild(inp);
        if(q.post) row.appendChild(document.createTextNode(plain(q.post)));
        box.appendChild(row);
        el("qHint").textContent = q.hint || (q.money ? "Pounds and pence, like 24 or 40.50. Working it out on paper first is a good idea." : "");
        if(!checked && window.matchMedia("(min-width: 700px)").matches) inp.focus();
      }
      if(checked) showFb(q, a);
    }

    function showFb(q, a){
      var ok = a.ok;
      var html = ok
        ? "<div class='fb ok'><b>" + (q.yes || "Got it.") + "</b> " + (q.why || "") + "</div>"
        : "<div class='fb nope'><b>Not this time.</b> The answer is <b>" + answerText(q) + "</b>. " + (q.why || "") + "</div>";
      el("qFb").innerHTML = html;
    }

    function next(){
      var q = ITEMS[state.idx], last = state.idx === ITEMS.length - 1;
      if(!q.learn){
        var a = state.answers[state.idx];
        if(!a || a.checked === undefined){
          if(!a || a.v === undefined || a.v === ""){ el("qFb").innerHTML = "<div class='fb tell'>Have a go first, or press <b>Skip for now</b> and come back to it.</div>"; return }
          a.ok = mark(q, a.v); a.checked = true; save(); renderQ(); return;
        }
      }
      if(last) finish(); else { state.idx++; save(); renderQ() }
    }

    function finish(){
      state.finished = true; save();
      show("qCard", false); show("resultCard", true); show("sendCard", true);
      var topics = {}, order = [], right = 0;
      ITEMS.forEach(function(q, i){
        if(q.learn) return;
        if(!topics[q.t]){ topics[q.t] = { right:0, total:0 }; order.push(q.t) }
        topics[q.t].total++;
        var a = state.answers[i];
        if(a && a.ok){ right++; topics[q.t].right++ }
      });
      el("scoreLine").textContent = right + " out of " + TOTALQ;
      var strong = [], again = [];
      order.forEach(function(t){ (topics[t].right / topics[t].total >= 0.75 ? strong : again).push(t.toLowerCase()) });
      el("scoreNote").textContent = again.length === 0 ? "All of these look solid. Nice one."
        : strong.length === 0 ? "Plenty here that would be worth a look together. No rush at all."
        : "Looking strong on " + strong.join(", ") + ". Might be worth another look at " + again.join(", ") + " sometime.";
      var bars = el("topicBars"); bars.innerHTML = "";
      order.forEach(function(t){
        var f = topics[t].right / topics[t].total;
        bars.insertAdjacentHTML("beforeend", "<div class='trow'><div class='name'>" + t + "</div><div class='track'><span class='fill' style='width:" + Math.round(f * 100) + "%;background:" +
          (f >= .75 ? "linear-gradient(90deg,#2e7d4f,#4ba36f)" : "linear-gradient(90deg,#ef7724,#d55f0f)") + "'></span></div><div class='score'>" + topics[t].right + "/" + topics[t].total + "</div></div>");
      });
      var list = el("reviewList"); list.innerHTML = "";
      ITEMS.forEach(function(q, i){
        if(q.learn) return;
        var a = state.answers[i], ok = a && a.ok;
        var tag = ok ? "<span class='tag right'>Got it</span>" : !a ? "<span class='tag diff'>Skipped</span>" : "<span class='tag diff'>Not this time</span>";
        list.insertAdjacentHTML("beforeend", "<div class='review-item'>Q" + QNUM[i] + ". " + q.p + " " + tag + (ok ? "" : ". Answer: " + answerText(q) + (a && a.checked ? " (you put " + givenText(q, a) + ")" : "")) + "</div>");
      });
      if(window.Base5Send){
        Base5Send.mount(el("sendHost"), { tool: cfg.tool, filename: cfg.filename, getText: function(){
          var L = [cfg.tool + ": " + right + " out of " + TOTALQ, ""];
          order.forEach(function(t){ L.push(t + ": " + topics[t].right + "/" + topics[t].total) });
          L.push("");
          ITEMS.forEach(function(q, i){
            if(q.learn) return;
            var a = state.answers[i];
            L.push("Q" + QNUM[i] + " [" + q.t + "] " + plain(q.p) + " -> " + (a && a.ok ? "correct" : !a ? "skipped" : "gave " + givenText(q, a) + ", answer " + answerText(q)));
          });
          return L.join("\n");
        }});
      }
      window.scrollTo({ top:0 });
    }

    el("beginBtn").onclick = function(){ state = { idx:0, answers:{}, started:true, finished:false }; save(); show("startCard", false); show("qCard", true); renderQ() };
    el("resumeBtn").onclick = function(){ show("startCard", false); if(state.finished) finish(); else { show("qCard", true); renderQ() } };
    el("backBtn").onclick = function(){ if(state.idx > 0){ state.idx--; save(); renderQ() } };
    el("skipBtn").onclick = function(){ var a = state.answers[state.idx]; if(a && !a.checked) delete state.answers[state.idx]; if(state.idx === ITEMS.length - 1) finish(); else { state.idx++; save(); renderQ() } };
    el("nextBtn").onclick = next;
    el("againBtn").onclick = function(){ state = { idx:0, answers:{}, started:false, finished:false }; save(); show("resultCard", false); show("sendCard", false); show("startCard", true); show("resumeBtn", false); window.scrollTo({ top:0 }) };

    load();
    if(state.started && (Object.keys(state.answers).length || state.idx > 0 || state.finished)) show("resumeBtn", true);
    return { state: function(){ return state } };
  }
  return { run: run, money: money };
})();

(function(){
  var INK = "#0a2f38", ORANGE = "#ef7724", TEAL = "#007291", PAPER = "#fffdf8", BROWN = "#c79a5a";
  var FF = "font-family='Atkinson Hyperlegible, Verdana, sans-serif'";
  var P = "\u00A3";

  // one luggage-label price tag at x,y
  function tag(x, y, name, price, sticker, rot, was){
    var s = "<g transform='translate(" + x + "," + y + ") rotate(" + (rot || 0) + ")'>";
    s += "<path d='M0 18 L22 0 H170 V96 H22 L0 78 Z' fill='#f6e7c8' stroke='" + INK + "' stroke-width='3' stroke-linejoin='round'/>";
    s += "<circle cx='22' cy='48' r='7' fill='" + PAPER + "' stroke='" + INK + "' stroke-width='3'/>";
    s += "<path d='M22 48 C -10 40, -20 10, -30 -6' fill='none' stroke='" + BROWN + "' stroke-width='3'/>";
    s += "<text x='98' y='36' text-anchor='middle' " + FF + " font-size='17' fill='" + INK + "'>" + name + "</text>";
    s += "<text x='98' y='74' text-anchor='middle' " + FF + " font-size='30' font-weight='bold' fill='" + INK + "'>" + price + "</text>";
    if(was) s += "<line x1='58' y1='64' x2='138' y2='64' stroke='" + ORANGE + "' stroke-width='5' stroke-linecap='round'/>";
    s += "</g>";
    if(sticker){
      s += "<g transform='translate(" + (x + 150) + "," + (y + 4) + ") rotate(12)'><circle r='30' fill='" + ORANGE + "' stroke='" + INK + "' stroke-width='3'/>";
      var parts = sticker.split("|");
      parts.forEach(function(p, i){ s += "<text y='" + (parts.length === 1 ? 6 : (i === 0 ? -2 : 15)) + "' text-anchor='middle' " + FF + " font-size='" + (parts.length === 1 ? 17 : 14) + "' font-weight='bold' fill='" + INK + "'>" + p + "</text>" });
      s += "</g>";
    }
    return s;
  }
  function one(name, price, sticker){ return "<svg viewBox='-40 -20 280 150' role='img' aria-label='" + name + ", " + price + (sticker ? ", " + sticker.replace("|", " ") : "") + "'>" + tag(20, 10, name, price, sticker, -3) + "</svg>" }
  function two(a, b){ return "<svg viewBox='-40 -20 520 150' role='img' aria-label='Two price tags'>" + tag(10, 10, a[0], a[1], a[2], -3) + tag(260, 12, b[0], b[1], b[2], 2) + "</svg>" }

  // percentage bar: total split into 10 blocks
  function bar(total, shaded, label, blockLabel){
    var s = "<svg viewBox='0 0 460 120' role='img' aria-label='" + label + "'>", w = 44;
    for(var i = 0; i < 10; i++){
      s += "<rect x='" + (10 + i * w) + "' y='14' width='" + w + "' height='46' fill='" + (i < shaded ? ORANGE : PAPER) + "' fill-opacity='" + (i < shaded ? .75 : 1) + "' stroke='" + INK + "' stroke-width='2'/>";
      s += "<text x='" + (10 + i * w + w / 2) + "' y='43' text-anchor='middle' " + FF + " font-size='14' fill='" + INK + "'>" + blockLabel + "</text>";
    }
    s += "<text x='230' y='92' text-anchor='middle' " + FF + " font-size='15' fill='" + INK + "'>" + label + "</text></svg>";
    return s;
  }
  function frac(total, parts, off, label){
    var s = "<svg viewBox='0 0 460 120' role='img' aria-label='" + label + "'>", w = 440 / parts;
    for(var i = 0; i < parts; i++){
      s += "<rect x='" + (10 + i * w) + "' y='14' width='" + w + "' height='46' fill='" + (i < off ? ORANGE : TEAL) + "' fill-opacity='" + (i < off ? .75 : .25) + "' stroke='" + INK + "' stroke-width='2'/>";
      s += "<text x='" + (10 + i * w + w / 2) + "' y='43' text-anchor='middle' " + FF + " font-size='15' fill='" + INK + "'>" + P + (total / parts) + "</text>";
    }
    s += "<text x='230' y='92' text-anchor='middle' " + FF + " font-size='15' fill='" + INK + "'>" + label + "</text></svg>";
    return s;
  }

  function learn(t, h, vis, body){ return { t:t, learn:true, h:h, vis:vis, body:body } }

  var ITEMS = [
    learn("Ten per cent", "Ten per cent is the key", bar(40, 1, "10% of \u00A340 is one block: \u00A34", P + "4"),
      "<p>Per cent means <b>out of 100</b>. Split any price into ten equal blocks and each block is <b>10%</b>, which is the same as dividing by 10.</p><p>From there you can build almost anything: <b>20%</b> is two blocks, <b>5%</b> is half a block, <b>15%</b> is one block and a half. Half price is <b>50%</b>, a quarter off is <b>25%</b>.</p>"),
    { t:"Ten per cent", type:"num", money:true, p:"A biscuit tin is &pound;40. What is 10% of &pound;40?", ans:4, why:"Divide by 10: &pound;40 &divide; 10 = &pound;4." },
    { t:"Ten per cent", type:"num", money:true, p:"What is 20% of &pound;35?", ans:7, why:"10% is &pound;3.50, so 20% is double that: &pound;7." },
    { t:"Ten per cent", type:"num", money:true, p:"What is 5% of &pound;60?", ans:3, why:"10% is &pound;6, and 5% is half of that: &pound;3." },
    { t:"Ten per cent", type:"num", money:true, p:"What is 15% of &pound;80?", ans:12, why:"10% is &pound;8, 5% is &pound;4, and together that is &pound;12." },

    learn("Taking it off", "The sale price", one("Kettle", "\u00A330", "20%|OFF"),
      "<p>A discount is the amount that comes <b>off</b>. The sale price is what is left to pay.</p><p>Two routes, same answer. Work out the discount and take it away: 20% of &pound;30 is &pound;6, so you pay &pound;24. Or go straight there: 20% off means you still pay <b>80%</b>, and 80% of &pound;30 is &pound;24.</p>"),
    { t:"Taking it off", type:"num", money:true, p:"Mo's kettle is &pound;30 with 20% off. What is the sale price?", vis:one("Kettle", "\u00A330", "20%|OFF"), ans:24, why:"20% of &pound;30 is &pound;6, and &pound;30 take away &pound;6 is &pound;24." },
    { t:"Taking it off", type:"num", money:true, p:"A valve radio is &pound;45 with 10% off. What is the sale price?", vis:one("Valve radio", "\u00A345", "10%|OFF"), ans:40.5, why:"10% of &pound;45 is &pound;4.50, so you pay &pound;40.50." },
    { t:"Taking it off", type:"num", money:true, p:"An armchair is &pound;120 with 25% off. What is the sale price?", vis:one("Armchair", "\u00A3120", "25%|OFF"), ans:90, why:"25% is a quarter. A quarter of &pound;120 is &pound;30, so you pay &pound;90." },
    { t:"Taking it off", type:"mc", p:"Mo says: \"30% off means you pay 30% of the price.\" Is he right?",
      opts:["Yes, that is what 30% off means", "No. 30% comes off, so you pay the other 70%", "No. You pay 130%", "It depends on the price"], ans:1,
      why:"The 30% is what you save. You still pay the rest: 100% take away 30% is 70%." },

    learn("Fractions off", "A third off, half price", frac(72, 3, 1, "A third off \u00A372: one part of \u00A324 comes off, you pay \u00A348"),
      "<p>Some tags use fractions instead of per cents. <b>Half price</b> means divide by 2. <b>A third off</b> means split the price into 3 equal parts and one part comes off. <b>A fifth off</b> means 5 parts, one comes off.</p><p>Handy to know: a fifth is the same as 20%, a quarter is 25% and a half is 50%.</p>"),
    { t:"Fractions off", type:"num", money:true, p:"A record player is &pound;72 with a third off. What is the sale price?", vis:one("Record player", "\u00A372", "1/3|OFF"), ans:48, why:"A third of &pound;72 is &pound;24. &pound;72 take away &pound;24 is &pound;48." },
    { t:"Fractions off", type:"num", money:true, p:"A reading lamp is &pound;18, and it is half price. What do you pay?", vis:one("Lamp", "\u00A318", "HALF|PRICE"), ans:9, why:"Half of &pound;18 is &pound;9." },
    { t:"Fractions off", type:"num", money:true, p:"A tea set is &pound;50 with a fifth off. What is the sale price?", vis:one("Tea set", "\u00A350", "1/5|OFF"), ans:40, why:"A fifth of &pound;50 is &pound;10, so you pay &pound;40. A fifth off is the same as 20% off." },

    learn("Which deal?", "Two tags, one question", two(["Toolbox", "\u00A360", "30%|OFF"], ["Toolbox", "\u00A360", "1/3|OFF"]),
      "<p>When two deals look close, do not guess. Work out what you would actually pay with each one, then compare the two prices.</p><p>A third is a little more than 30%, so a third off saves a little more. Here that is &pound;40 against &pound;42.</p>"),
    { t:"Which deal?", type:"mc", p:"A tin of biscuits is &pound;8. Deal A: 25% off. Deal B: &pound;1.50 off. Which is cheaper?",
      opts:["Deal A, you pay &pound;6", "Deal B, you pay &pound;6.50", "They cost the same", "Deal B, because &pound;1.50 is more than 25"], ans:0,
      why:"25% of &pound;8 is &pound;2, so Deal A costs &pound;6. Deal B costs &pound;6.50." },
    { t:"Which deal?", type:"mc", p:"Three jars of jam at &pound;5 each. Deal A: buy 2, get 1 free. Deal B: 30% off everything. Which is cheaper for all three jars?",
      opts:["Deal A, you pay &pound;10", "Deal B, you pay &pound;10", "Deal B, you pay &pound;10.50", "They cost the same"], ans:0,
      why:"Deal A: you pay for 2 jars, &pound;10. Deal B: 30% off &pound;15 is &pound;4.50 off, so &pound;10.50." },
    { t:"Which deal?", type:"num", money:true, p:"A bike is &pound;150. The shop takes 10% off, and then another &pound;5 off at the till. What do you pay?", ans:130, why:"10% of &pound;150 is &pound;15, leaving &pound;135. Then &pound;5 more off is &pound;130." },

    learn("Then and now", "When Mo's dad ran the shop", two(["Comic, 1975", "10p", null], ["Comic, now", "\u00A32.50", null]),
      "<p>Prices go <b>up</b> as well as down. To find a new price after a rise, add the increase on: 10% up on &pound;20 is &pound;20 + &pound;2 = &pound;22.</p><p>To compare old and new prices, you can ask <b>how many times</b> more it costs. A comic that was 10p and is now &pound;2.50 costs 25 times as much, because 10p &times; 25 = 250p.</p>"),
    { t:"Then and now", type:"num", p:"A comic was 10p in 1975 and is &pound;2.50 now. How many times more does it cost now?", post:" times", ans:25, why:"&pound;2.50 is 250p, and 250 &divide; 10 = 25." },
    { t:"Then and now", type:"num", money:true, p:"A pint of milk was 50p. The price goes up by 10%. What is the new price?", ans:0.55, hint:"Pence are fine too, like 55p.", why:"10% of 50p is 5p, so the new price is 55p." },
    { t:"Then and now", type:"num", p:"A bus fare went from &pound;2 to &pound;3. What is that as a percentage increase?", post:" %", ans:50, why:"It went up by &pound;1, and &pound;1 is half of &pound;2. Half is 50%." },
    { t:"Stretch, if you fancy it", type:"num", money:true, p:"Working backwards. After 20% off, a clock costs &pound;24. What was the price before the sale?", ans:30, why:"&pound;24 is what is left after 20% off, so &pound;24 is 80%. Then 10% is &pound;3, and 100% is &pound;30. A common slip is adding 20% of &pound;24 back on, which gives &pound;28.80." }
  ];

  LB.run({
    store: "b5.practice.mos-sale.v1", tool: "Mo's Sale", filename: "mos-sale", items: ITEMS,
    startTitle: "Everything must go (sort of)",
    startText: "<div class='mo-strip'>" + one("Everything", "SALE", null).replace("viewBox='-40 -20 280 150'", "viewBox='-40 -20 280 150' width='120'") + "<p class='lead'>Mo from the Workshop is having a clear out. Some tags say 20% off, some say a third off, and some deals are not as good as they look.</p></div>" +
      "<p class='lead'>Learn a bit, try a bit. Every idea gets a picture first, and after every answer you find out straight away how it went and why. " + ITEMS.filter(function(q){ return !q.learn }).length + " questions, nothing timed. A calculator is fine if you want one, and so is working on paper.</p>"
  });
})();
