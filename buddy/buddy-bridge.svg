<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Bridgelink Buddy favicon</title>
<desc id="desc">High-fidelity illustration of Bridgelink Buddy, the original orange curved bridge with two understated eyes, deep teal piers and small cyan bases.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffefd"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="arch" x1="0" y1="0" x2=".96" y2="1"><stop offset="0" stop-color="#ff9231"/><stop offset=".45" stop-color="#ff7e22"/><stop offset="1" stop-color="#ef6a14"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".42"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <linearGradient id="pier" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#087d99"/><stop offset=".36" stop-color="#006b87"/><stop offset="1" stop-color="#03485d"/></linearGradient>
  <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43bed3"/><stop offset="1" stop-color="#0d91ae"/></linearGradient>
  <linearGradient id="footLower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1ca9be"/><stop offset="1" stop-color="#087c9d"/></linearGradient>
  <linearGradient id="eyes" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3148"/><stop offset=".65" stop-color="#04233a"/><stop offset="1" stop-color="#061d32"/></linearGradient>
  <clipPath id="archMask"><path d="M 78 166 C 105 193 139 214 160 214 C 188 214 217 188 240 165 L 240 194 C 210 222 185 235 160 235 C 131 235 104 218 78 195 Z"/></clipPath>
</defs>
<rect x="0" y="0" width="320" height="320" rx="52" fill="url(#bg)"/>
<g id="buddy-mark" transform="translate(0 8)">
  <!-- Deep teal bridge supports: rounded, subtly dimensional -->
  <rect x="43" y="156" width="35" height="80" rx="15" fill="url(#pier)"/>
  <rect x="242" y="156" width="35" height="80" rx="15" fill="url(#pier)"/>
  <path d="M 49 168 Q 49 162 55 161" stroke="#62ccdc" stroke-width="3.5" stroke-linecap="round" opacity=".28" fill="none"/>
  <path d="M 248 168 Q 248 162 254 161" stroke="#62ccdc" stroke-width="3.5" stroke-linecap="round" opacity=".28" fill="none"/>
  <!-- Thick curved bridge with a genuine ribbon-shaped silhouette -->
  <path d="M 78 166 C 105 193 139 214 160 214 C 188 214 217 188 240 165 L 240 194 C 210 222 185 235 160 235 C 131 235 104 218 78 195 Z" fill="url(#arch)"/>
  <g clip-path="url(#archMask)">
   <path d="M76 167 C110 198 139 214 160 214 C184 214 212 190 241 166" fill="none" stroke="#ffbf75" stroke-width="4" opacity=".32"/>
   <path d="M75 192 C107 219 136 238 160 238 C183 238 210 223 243 194" fill="none" stroke="#ce530f" stroke-width="3" opacity=".16"/>
  </g>
  <!-- Underfoot: the two characteristic cyan bridge bases -->
  <rect x="32" y="233" width="58" height="10" rx="5" fill="url(#foot)"/>
  <rect x="40" y="245" width="42" height="7" rx="3.5" fill="url(#footLower)"/>
  <rect x="230" y="233" width="58" height="10" rx="5" fill="url(#foot)"/>
  <rect x="238" y="245" width="42" height="7" rx="3.5" fill="url(#footLower)"/>
  <!-- Original deadpan expression: ONLY two eyes, not a cartoon face -->
  <circle cx="118" cy="138" r="17" fill="url(#eyes)"/>
  <circle cx="202" cy="138" r="17" fill="url(#eyes)"/>
  <path d="M108 128 Q114 124 119 125" fill="none" stroke="#648b9e" stroke-width="2.6" stroke-linecap="round" opacity=".17"/>
  <path d="M192 128 Q198 124 203 125" fill="none" stroke="#648b9e" stroke-width="2.6" stroke-linecap="round" opacity=".17"/>
  <!-- Two short asymmetrical orange marks from the design profile -->
  <path d="M246 112 L251 90 M266 124 L283 107" fill="none" stroke="#ff7b25" stroke-width="12.2" stroke-linecap="round"/>
</g>
</svg>