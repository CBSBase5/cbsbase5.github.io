<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestones - Autumn 1 - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=5">
<style>
/* Teacher tool. Denser than the student pages on purpose. */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.stab{
  font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 800;
  font-size:1rem;letter-spacing:.06em;background:var(--white);color:var(--ink);
  border:var(--border) solid var(--ink);border-radius:var(--r-pill);
  padding:10px 20px;cursor:pointer;transition:transform .12s ease;
}
.stab:hover{transform:translateY(-2px)}
.stab[aria-pressed="true"]{background:var(--orange)}
.stab .pc{display:block;font-size:.6rem;letter-spacing:.12em;opacity:.7;font-variation-settings:"wght" 600}

.summary{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--white);border:var(--border) solid var(--ink);
  border-radius:var(--r);padding:16px 20px;margin:0 0 22px;
}
.bar{flex:1;min-width:180px;height:16px;background:var(--paper);
  border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--orange);width:0;transition:width .3s ease}
.count{font-family:var(--display);font-variation-settings:"wdth" 115,"wght" 800;font-size:1.1rem}

.pillar{margin:0 0 12px;border:var(--border) solid var(--ink);
  border-radius:var(--r);background:var(--white);overflow:hidden}
.pillar>summary{
  list-style:none;cursor:pointer;padding:15px 20px;background:var(--paper);
  display:flex;align-items:center;gap:14px;
}
.pillar>summary::-webkit-details-marker{display:none}
.pillar>summary h2{
  font-family:var(--display);font-variation-settings:"wdth" 118,"wght" 800;
  font-size:1.15rem;margin:0;flex:1;
}
.pillar>summary .tick{
  font-family:var(--display);font-size:.78rem;letter-spacing:.1em;
  border:2px solid var(--ink);border-radius:999px;padding:4px 11px;background:var(--white);
}
.pillar>summary .tick.full{background:var(--orange)}
.pillar .inner{padding:6px 20px 18px;border-top:var(--border) solid var(--ink)}

.target{border-top:2px dashed var(--line);padding:18px 0 6px}
.target:first-child{border-top:none}
.tlabel{
  font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 800;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:0 0 4px;
}
.tstate{margin:0 0 14px;font-size:.92rem;color:var(--body-tint);max-width:70ch}

.ms{display:flex;gap:14px;align-items:flex-start;
  background:var(--paper);border:2px solid var(--ink);
  border-radius:14px;padding:14px 16px}
.ms.done{background:#fdf0e2;border-color:var(--orange)}
.ms.going{background:#fdf7e4;border-color:var(--yellow)}
.studentsaid{
  background:var(--white);border:2px dashed var(--teal);border-radius:12px;
  padding:10px 13px;margin:0 0 12px;font-size:.92rem;
}
.ms input[type=checkbox]{
  width:26px;height:26px;flex:none;margin:2px 0 0;accent-color:var(--orange);cursor:pointer;
}
.ms .msbody{flex:1;min-width:0}
.ms .mstext{font-size:1rem;margin:0 0 8px}
.ms .stamp{
  font-family:var(--display);font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);margin:0 0 8px;
}
.ms textarea,.ms input[type=text]{
  width:100%;font-family:var(--body);font-size:.9rem;
  border:2px solid var(--line);border-radius:10px;padding:9px 11px;
  background:var(--white);color:var(--ink);margin-bottom:8px;resize:vertical;
}
.ms textarea{min-height:56px}
.ms label.fl{
  display:block;font-family:var(--display);font-size:.64rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:3px;
}

.datamsg{font-size:.85rem;color:var(--body-tint);margin:8px 0 0}
@media print{
  .top,.toolbar,footer,.backlink,.datatools{display:none}
  .pillar .inner{display:block !important}
}
</style>
</head>
<body>
<div class="grain"></div>

<div class="top">
  <div class="wrap">
    <div class="mark">
      <svg width="36" height="27" viewBox="0 0 36 27" aria-hidden="true">
        <path d="M2 21 Q18 3 34 21" fill="none" stroke="#007291" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="10" y1="13.6" x2="10" y2="24" stroke="#cfe2e7" stroke-width="1.6"/>
        <line x1="18" y1="10" x2="18" y2="24" stroke="#cfe2e7" stroke-width="1.6"/>
        <line x1="26" y1="13.6" x2="26" y2="24" stroke="#cfe2e7" stroke-width="1.6"/>
        <line x1="1" y1="24" x2="35" y2="24" stroke="#052f3a" stroke-width="2.4"/>
      </svg>
      <b>Base 5</b>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/teacher/">Teacher</a>
    </nav>
  </div>
</div>

<header class="hero hero-sm">
  <div class="wrap">
    <h1>MILESTONES</h1>
    <div class="line">
      <span class="chip">Autumn 1</span>
      <p>Tick, timestamp, note. Saved on this device only.</p>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="toolbar" id="students"></div>

  <div class="summary">
    <span class="count" id="count">0 of 15</span>
    <div class="bar"><span id="barfill"></span></div>
    <button class="btn btn-quiet" id="expandAll">Open all</button>
  </div>

  <div id="pillars"></div>

  <div class="summary datatools">
    <button class="btn" id="exportBtn">Export backup</button>
    <button class="btn btn-quiet" id="importBtn">Restore backup</button>
    <button class="btn btn-quiet" id="copyBtn">Copy this student as text</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <p class="datamsg" id="datamsg">Records live in this browser on this device. Export a backup now and again, and before changing device.</p>

  <a class="backlink" href="/teacher/">Back to teacher view</a>

</div>

<footer>
  <div class="wrap">
    <span>Base 5 &middot; Chilton Bridge School</span>
    <a href="/">Student site</a>
  </div>
</footer>

<script src="/data/targets.js?v=1"></script>
<script>
(function(){
"use strict";

var STUDENTS = BASE5_STUDENTS;
var KEY = BASE5_KEY;
var PILLARS = BASE5_PILLARS;

/* ---------- storage ---------- */
var data = {};
function load(){
  try{ data = JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e){ data = {}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ document.getElementById('datamsg').textContent =
    "Could not save. This browser may be blocking storage, so use Export backup to keep a copy."; }
}
function rec(student, tid){
  data[student] = data[student] || {};
  data[student][tid] = data[student][tid] || {state:0, at:"", snote:"", tnote:"", link:""};
  return data[student][tid];
}

function stamp(iso){
  if(!iso) return "";
  var d = new Date(iso);
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2);
  return days[d.getDay()]+" "+d.getDate()+" "+mon[d.getMonth()]+" "+d.getFullYear()+", "+hh+":"+mm;
}

var current = STUDENTS[0];
var allTargets = [];
PILLARS.forEach(function(p){ p.targets.forEach(function(t){ allTargets.push(t) }) });

/* ---------- student tabs ---------- */
function doneCount(student){
  var n=0;
  allTargets.forEach(function(t){
    if(data[student] && data[student][t.id] && data[student][t.id].done) n++;
  });
  return n;
}

function renderTabs(){
  var box = document.getElementById('students');
  box.innerHTML = "";
  STUDENTS.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'stab';
    b.setAttribute('aria-pressed', s===current ? 'true':'false');
    b.innerHTML = s + '<span class="pc">' + doneCount(s) + '/' + allTargets.length + '</span>';
    b.addEventListener('click', function(){ current = s; renderTabs(); renderPillars(); });
    box.appendChild(b);
  });
}

function renderSummary(){
  var n = doneCount(current), total = allTargets.length;
  document.getElementById('count').textContent = n + " of " + total;
  document.getElementById('barfill').style.width = (total ? (n/total*100) : 0) + "%";
}

/* ---------- main render ---------- */
function renderPillars(){
  var box = document.getElementById('pillars');
  box.innerHTML = "";

  PILLARS.forEach(function(p){
    var det = document.createElement('details');
    det.className = 'pillar';

    var done = 0;
    p.targets.forEach(function(t){ if(rec(current,t.id).state===2) done++ });

    var sum = document.createElement('summary');
    sum.innerHTML = '<h2>' + p.name + '</h2>' +
      '<span class="tick' + (done===p.targets.length ? ' full':'') + '">' +
      done + '/' + p.targets.length + '</span>';
    det.appendChild(sum);

    var inner = document.createElement('div');
    inner.className = 'inner';

    p.targets.forEach(function(t){
      var r = rec(current, t.id);

      var wrap = document.createElement('div');
      wrap.className = 'target';

      var lab = document.createElement('p');
      lab.className = 'tlabel';
      lab.textContent = 'Target: ' + t.title;
      wrap.appendChild(lab);

      var st = document.createElement('p');
      st.className = 'tstate';
      st.textContent = t.statement;
      wrap.appendChild(st);

      var ms = document.createElement('div');
      ms.className = 'ms' + (r.state===2 ? ' done' : r.state===1 ? ' going' : '');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = r.state===2;
      cb.setAttribute('aria-label', 'Mark milestone complete for ' + current);

      var body = document.createElement('div');
      body.className = 'msbody';

      var txt = document.createElement('p');
      txt.className = 'mstext';
      txt.textContent = t.ms[current] || "(no milestone set for " + current + ")";
      body.appendChild(txt);

      var stampP = document.createElement('p');
      stampP.className = 'stamp';
      stampP.textContent = r.state===2 ? ('Completed ' + stamp(r.at))
                         : r.state===1 ? ('Having a go, since ' + stamp(r.at)) : '';
      body.appendChild(stampP);

      if(r.snote){
        var slab = document.createElement('label');
        slab.className = 'fl';
        slab.textContent = current + ' wrote';
        body.appendChild(slab);
        var sq = document.createElement('p');
        sq.className = 'studentsaid';
        sq.textContent = r.snote;
        body.appendChild(sq);
      }

      var nlab = document.createElement('label');
      nlab.className = 'fl';
      nlab.textContent = 'Notes and evidence';
      body.appendChild(nlab);

      var note = document.createElement('textarea');
      note.value = r.tnote || "";
      note.placeholder = 'What was seen, when, and with whom.';
      note.addEventListener('input', function(){ r.tnote = note.value; save(); });
      body.appendChild(note);

      var llab = document.createElement('label');
      llab.className = 'fl';
      llab.textContent = 'Activity link';
      body.appendChild(llab);

      var link = document.createElement('input');
      link.type = 'text';
      link.value = r.link || "";
      link.placeholder = '/week-3/thursday.html';
      link.addEventListener('input', function(){ r.link = link.value; save(); });
      body.appendChild(link);

      cb.addEventListener('change', function(){
        r.state = cb.checked ? 2 : 0;
        r.at = cb.checked ? new Date().toISOString() : "";
        stampP.textContent = r.state===2 ? ('Completed ' + stamp(r.at))
                         : r.state===1 ? ('Having a go, since ' + stamp(r.at)) : '';
        ms.className = 'ms' + (r.state===2 ? ' done' : r.state===1 ? ' going' : '');
        save();
        renderTabs();
        renderSummary();
        var d = 0;
        p.targets.forEach(function(x){ if(rec(current,x.id).state===2) d++ });
        var pill = sum.querySelector('.tick');
        pill.textContent = d + '/' + p.targets.length;
        pill.className = 'tick' + (d===p.targets.length ? ' full':'');
      });

      ms.appendChild(cb);
      ms.appendChild(body);
      wrap.appendChild(ms);
      inner.appendChild(wrap);
    });

    det.appendChild(inner);
    box.appendChild(det);
  });

  renderSummary();
}

/* ---------- open all ---------- */
document.getElementById('expandAll').addEventListener('click', function(){
  var all = document.querySelectorAll('.pillar');
  var anyClosed = Array.prototype.some.call(all, function(d){ return !d.open });
  Array.prototype.forEach.call(all, function(d){ d.open = anyClosed });
  this.textContent = anyClosed ? 'Close all' : 'Open all';
});

/* ---------- backup ---------- */
document.getElementById('exportBtn').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'base5-milestones-autumn1-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('importBtn').addEventListener('click', function(){
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', function(e){
  var f = e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var incoming = JSON.parse(r.result);
      Object.keys(incoming).forEach(function(s){
        data[s] = data[s] || {};
        Object.keys(incoming[s]).forEach(function(t){ data[s][t] = incoming[s][t] });
      });
      save(); renderTabs(); renderPillars();
      document.getElementById('datamsg').textContent = 'Backup restored and merged with what was already here.';
    }catch(err){
      document.getElementById('datamsg').textContent = 'That file could not be read as a backup.';
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

document.getElementById('copyBtn').addEventListener('click', function(){
  var lines = [current + ' - Autumn 1 milestones', ''];
  PILLARS.forEach(function(p){
    lines.push(p.name.toUpperCase());
    p.targets.forEach(function(t){
      var r = rec(current, t.id);
      lines.push((r.state===2 ? '[x] ' : r.state===1 ? '[~] ' : '[ ] ') + (t.ms[current] || ''));
      if(r.at) lines.push('    Completed ' + stamp(r.at));
      if(r.snote) lines.push('    Student said: ' + r.snote);
      if(r.tnote) lines.push('    Notes: ' + r.tnote);
      if(r.link) lines.push('    Link: ' + r.link);
    });
    lines.push('');
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      document.getElementById('datamsg').textContent = current + ' copied to the clipboard.';
    });
  }
});

load();
renderTabs();
renderPillars();

})();
</script>

</body>
</html>
