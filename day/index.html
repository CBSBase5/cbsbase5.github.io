<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today - Base 5</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/base5.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=13">
<style>
/* Day page only. Everything else lives in style.css */

/* the boarding pass at the top */
.pass{
  position:relative;
  display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:6px 34px;
  margin:20px 0 6px;padding:16px 22px 16px 22px;
  background:var(--white);border:var(--border) solid var(--ink);border-radius:var(--r-alt);
  box-shadow:5px 6px 0 var(--ink);transform:rotate(-.6deg);max-width:640px;
}
.pass .f{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 800;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.65;display:block}
.pass .v{font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:1.2rem;line-height:1.1}

@media (max-width:600px){.pass{grid-template-columns:repeat(2,auto)}}

.daynav{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 10px}
.daynav .backlink{margin:0}

.hqchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.hqchip{
  font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 900;
  font-size:.82rem;letter-spacing:.06em;text-decoration:none;color:var(--paper);
  border:var(--border) solid var(--ink);border-radius:12px;padding:8px 13px;
  box-shadow:3px 4px 0 var(--ink);transition:transform .14s ease;
}
.hqchip:hover{transform:translate(-2px,-2px) rotate(-1.5deg)}
.hqchip.egw{background:var(--hq-egw);color:var(--hq-egw-ink)}.hqchip.lp{background:var(--hq-lp);color:var(--hq-lp-ink)}.hqchip.lw{background:var(--hq-lw);color:var(--hq-lw-ink)}
.hqchip.lc{background:var(--hq-lc);color:var(--hq-lc-ink)}.hqchip.hk{background:var(--hq-hk);color:var(--hq-hk-ink)}.hqchip.jt{background:var(--hq-jt);color:var(--hq-jt-ink)}

.linkrow{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 6px}
.acc .body .grid3{margin-top:4px}
.acc .body>p.tripwhere{
  font-family:var(--display);font-variation-settings:"wdth" 118,"wght" 900;
  font-size:clamp(1.5rem,4vw,2.3rem);line-height:1;margin:0 0 12px;
}
.nothing{max-width:60ch}
.tl-time small{white-space:normal}
</style>
<script src="/data/b5site.js?v=8"></script>
</head>
<body>
<div class="grain"></div>


<header class="hero hero-sm">
  <div class="wrap" id="head"></div>
</header>

<div class="wrap" id="main"></div>

<footer>
  <div class="wrap">
    <span>Base 5 &middot; Chilton Bridge School</span>
    <a href="/teacher/">Teacher view</a>
  </div>
</footer>

<script src="/data/term.js?v=7"></script>
<script>
(function(){
  var T = window.B5TERM;
  var head = document.getElementById('head');
  var main = document.getElementById('main');

  /* ---------- which day? ?w=1&d=tue, or today, or the next school day ---------- */
  var q = new URLSearchParams(location.search);
  var week = null, key = null;
  if(q.get('w') && q.get('d')){
    week = T.weeks.filter(function(w){return String(w.n)===q.get('w')})[0] || null;
    key = q.get('d');
    if(!week || T.dayKeys.indexOf(key)<0){ week=null; key=null; }
  }

  /* every school day in the term, in order */
  var all = [];
  T.weeks.forEach(function(w){
    T.schoolDays(w).forEach(function(k){ all.push({w:w,k:k,iso:T.iso(T.dateOf(w,k))}); });
  });
  if(!week){
    var t = T.todayIso();
    var pick = all.filter(function(x){return x.iso>=t})[0] || all[all.length-1];
    week = pick.w; key = pick.k;
  }

  var date = T.dateOf(week, key);
  var isoDate = T.iso(date);
  var dd = (week.days && week.days[key]) || {};
  var slots = T.timetable[key];
  var isToday = isoDate === T.todayIso();
  var dayName = T.dayNames[key];
  var trip = slots.some(function(s){return s[2]==='trip'});

  document.title = dayName + ' - Base 5';

  /* ---------- the top ---------- */
  head.innerHTML =
    '<div class="toprow"><h1 class="echo" data-echo="'+dayName.toUpperCase()+'">'+dayName.toUpperCase()+'</h1>'+
    '<span class="badge" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fffdf8" stroke="#0a2f38" stroke-width="6"/>'+
      '<rect x="28" y="30" width="44" height="42" rx="6" fill="#fffdf8" stroke="#0a2f38" stroke-width="4"/>'+
      '<path d="M30 42h40V36a6 6 0 0 0-6-6H36a6 6 0 0 0-6 6z" fill="#ef7724"/>'+
      '<path d="M28 42h44" stroke="#0a2f38" stroke-width="4"/><path d="M39 24v12M61 24v12" stroke="#0a2f38" stroke-width="4" stroke-linecap="round"/>'+
      '<text x="50" y="66" text-anchor="middle" font-family="Archivo,Arial Black,sans-serif" font-weight="900" font-size="22" fill="#0a2f38">'+date.getDate()+'</text></svg></span></div>'+
    '<div class="line"><span class="chip">Week '+week.n+'</span><p>'+T.niceDate(date)+'. '+(dd.line || T.dayLines[key])+'</p></div>'+
    (dd.off ? '' :
    '<div class="pass" aria-label="Your ticket for today">'+
      '<div><span class="f">Ticket for</span><span class="v">'+dayName+' '+date.getDate()+'</span></div>'+
      (T.tripPlace(dd) ? '<div><span class="f">Going to</span><span class="v">'+T.tripPlace(dd)+'</span></div>' : '')+
      '<div><span class="f">Departs</span><span class="v">9:30</span></div>'+
      '<div><span class="f">Back</span><span class="v">2:30</span></div>'+
    '</div>');

  /* weeks that have not started yet stay shut, unless ?preview=1 */
  var current = T.currentWeek();
  var preview = /[?&]preview=1/.test(location.search);
  var shut = !preview && week.n > current.n;
  if(shut){
    head.querySelector('.pass') && head.querySelector('.pass').remove();
    head.querySelector('.line p').textContent = T.niceDate(date)+'.';
    main.innerHTML = '<div class="panel panel-orange nothing"><p>This day has not happened yet. It opens when Week '+week.n+' starts, on '+T.niceDate(T.dateOf(week,'mon'))+'.</p></div>'+
      '<div class="daynav"><a class="backlink" href="/">Back to now</a></div>';
    return;
  }

  if(dd.off){
    main.innerHTML = '<div class="panel panel-orange nothing"><p>No school on this day. '+(dd.line||'')+'</p></div>'+navHTML();
    return;
  }

  /* ---------- the timeline ---------- */
  var TYPE = { breathe:'tl-breathe', break:'tl-break', key:'tl-key', work:'tl-work', make:'tl-make', plain:'' };
  var ACC  = { key:'acc-orange', work:'acc-yellow', make:'acc-plum', breathe:'acc-teal', plain:'' };
  var now = new Date();
  var nowM = now.getHours()*60 + now.getMinutes();

  var rows = slots.map(function(s){
    var ses = T.session(s[2], week);
    if(s[2]==='trip' && T.tripPlace(dd)){ ses.line = T.tripPlace(dd) + '. Out from half ten until two.'; }
    var on = isToday && nowM >= T.mins(s[0]) && nowM < T.mins(s[1]);
    var tag = ses.plain ? 'div' : 'a';
    return '<div class="tl-row'+(on?' now':'')+'">'+
      '<div class="tl-time">'+s[0]+' - '+s[1]+'<small>'+T.length(s[0],s[1])+'</small></div>'+
      '<'+tag+' class="tl-card '+(T.subjectOf(s[2]) ? 'subjfill s-'+T.subjectOf(s[2]) : (TYPE[ses.type]||''))+'"'+(ses.plain?'':' href="#'+s[2]+'" data-open="'+s[2]+'"')+'>'+
        '<h3>'+ses.title+(on?'<span class="nowtag">Now</span>':'')+'</h3>'+
        (ses.line ? '<p>'+ses.line+'</p>' : '')+
      '</'+tag+'>'+
    '</div>';
  }).join('');

  /* ---------- the blocks under it ---------- */
  var seen = {};
  var blocks = slots.filter(function(s){
    var ses = T.sessions[s[2]];
    if(!ses || ses.plain || seen[s[2]]) return false;
    seen[s[2]] = true; return true;
  }).map(function(s){
    var k = s[2];
    var ses = T.session(k, week);
    var body = '';

    if(k==='trip' && T.tripPlace(dd)){ ses.sub = T.tripPlace(dd) + '. ' + ses.sub; }
    if(k==='trip' && dd.trip){
      if(T.tripPlace(dd)) body += '<p class="tripwhere">'+T.tripPlace(dd)+'</p>';
      if(dd.trip.body) body += '<p>'+dd.trip.body+'</p>';
      if(dd.trip.prompts){
        body += '<div class="chiplabel">If you fancy it</div><div class="grid3">'+
          dd.trip.prompts.map(function(p){return '<div class="mini"><span class="n">'+p[0]+'</span>'+p[1]+'</div>'}).join('')+'</div>';
      }
      body += '<div class="chiplabel">On any trip</div><p>Lunch happens while you are out rather than back here.</p>';
    }

    if(ses.body && !(k==='trip' && dd.trip && dd.trip.where)) body += '<p>'+ses.body+'</p>';
    if(ses.options){
      body += '<div class="grid3">'+ses.options.map(function(o){return '<div class="mini"><span class="n">'+o[0]+'</span>'+o[1]+'</div>'}).join('')+'</div>';
    }
    if(ses.hq){
      body += '<div class="chiplabel">Your own HQ</div><div class="hqchips">'+
        '<a class="hqchip egw" href="/egw/">EGW</a><a class="hqchip lp" href="/lp/">LP</a><a class="hqchip lw" href="/lw/">LW</a>'+
        '<a class="hqchip lc" href="/lc/">LC</a><a class="hqchip hk" href="/hk/">HK</a><a class="hqchip jt" href="/jt-hq/">JT</a></div>';
    }
    if(ses.links && ses.links.length){
      body += '<div class="chiplabel">Go to</div><div class="linkrow">'+
        ses.links.map(function(l,i){return '<a class="btn '+(i===0?'btn-orange':'btn-quiet')+'" href="'+l[1]+'">'+l[0]+'</a>'}).join('')+'</div>';
    }
    if(ses.ways && ses.ways.length){
      body += '<div class="chiplabel">'+(ses.wayslabel||'Other ways to do it')+'</div><div class="chips">'+
        ses.ways.map(function(w){return '<span class="way">'+w+'</span>'}).join('')+'</div>';
    }

    return '<div class="forslot">'+s[0]+' &middot; '+ses.title+'</div>'+
      '<details class="acc '+(T.subjectOf(k) ? 'subjacc s-'+T.subjectOf(k) : (ACC[ses.type]||''))+'" id="'+k+'">'+
        '<summary><div class="txt"><h2>'+(ses.heading||ses.title)+'</h2><p>'+(ses.sub||'')+'</p></div>'+
        '<svg class="chev" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>'+
        '<div class="body">'+body+'</div>'+
      '</details>';
  }).join('');

  main.innerHTML =
    '<div class="tl" style="margin-top:26px">'+rows+'</div>'+
    '<p class="stripnote">The times are when things are happening, not orders. If a session is not working for you today, saying so is a reasonable thing to do.</p>'+
    blocks+
    '<div class="sendbox">'+
      '<p class="sendtitle">Want Jay to see something you did today?</p>'+
      '<p class="sendwhy">Anything at all. The writing pad and the practice activities both have a send button at the bottom of them.</p>'+
      '<div class="sendrow"><a class="btn" href="/tools/write.html">Open the writing pad</a><a class="btn btn-quiet" href="/practice/">Practice</a></div>'+
    '</div>'+
    navHTML();

  /* ---------- days either side ---------- */
  function navHTML(){
    var i = -1;
    all.forEach(function(x,n){ if(x.w===week && x.k===key) i=n; });
    var prev = i>0 ? all[i-1] : null;
    var next = (i>-1 && i<all.length-1) ? all[i+1] : (i<0 ? all.filter(function(x){return x.iso>isoDate})[0] : null);
    if(next && !preview && next.w.n > current.n) next = null;
    function link(x, label){
      return '<a class="backlink" href="/day/?w='+x.w.n+'&amp;d='+x.k+'">'+label+': '+T.dayNames[x.k]+' '+T.dateOf(x.w,x.k).getDate()+'</a>';
    }
    return '<div class="daynav">'+
      (prev ? link(prev,'Back a day') : '')+
      '<a class="backlink" href="/">Back to the week</a>'+
      (next ? link(next,'Forward a day') : '')+
    '</div>';
  }

  /* ---------- tapping a session opens its block ---------- */
  function openBlock(id, scroll){
    var d = document.getElementById(id);
    if(!d || d.tagName!=='DETAILS') return;
    d.open = true;
    if(scroll) d.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  }
  document.querySelectorAll('[data-open]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); openBlock(a.dataset.open, true); history.replaceState(null,'','#'+a.dataset.open); });
  });
  if(location.hash) openBlock(location.hash.slice(1), true);
  else {
    /* open whatever is on now, and the trip on a trip day, without jumping the page */
    var nowRow = document.querySelector('.tl-row.now [data-open]');
    if(nowRow) openBlock(nowRow.dataset.open, false);
    if(trip) openBlock('trip', false);
  }
})();
</script>
</body>
</html>
