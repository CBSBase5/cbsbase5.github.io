<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dugout - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a111f; --bg2:#0f1a2e; --panel:#13203a; --panel2:#182848; --line:#243759;
  --ink:#eaf0ff; --mute:#9db0d4; --green:#2fd27a; --green2:#1c9e58; --gold:#ffcf4a; --red:#ff6b6b;
  --blue:#5aa9ff; --plum:#b79cff; --pitch1:#1d7a45; --pitch2:#1a6f3f;
  --disp:"Archivo","Arial Black",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.05;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:900}
h3{font-size:1.05rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--mute)}
p{margin:0 0 .6em}
.mute{color:var(--mute)}
.sr{position:absolute;left:-9999px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0c1a33,#08111f);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
.club{display:flex;align-items:center;gap:10px}
.club svg{flex:none}
.club b{font-family:var(--disp);font-weight:900;font-size:1.25rem;line-height:1}
.club small{display:block;color:var(--mute);font-size:.8rem;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:11px 12px;text-align:left;font-weight:700;color:var(--mute);position:relative}
.nav button svg{width:22px;height:22px;flex:none}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green);color:#04210f}
.nav .badge{margin-left:auto;background:var(--gold);color:#241a00;border-radius:999px;font-size:.78rem;padding:1px 8px;font-weight:900}
.side .foot{margin-top:auto;font-size:.88rem;color:var(--mute)}
.side .foot a{display:block;margin-top:6px}
main{padding:20px 26px 40px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:900}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.92rem}
.pill b{color:var(--gold)}
.pill.go{background:var(--green);border-color:var(--green);color:#04210f}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin-bottom:10px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.btn:hover{border-color:var(--green)}
.btn-go,.btn-orange{background:var(--green);border-color:var(--green);color:#04210f}
.btn-go:hover,.btn-orange:hover{filter:brightness(1.08)}
.btn-big{font-size:1.15rem;padding:15px 26px}
.btn-quiet{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- next match card ---------- */
.next{background:linear-gradient(135deg,#143a2b,#13203a 55%);border-color:#235a43}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:8px 0 12px}
.vs .tm{font-family:var(--disp);font-weight:900;font-size:clamp(1.1rem,2.4vw,1.6rem);line-height:1.05}
.vs .mid{font-weight:800;color:var(--mute);font-size:.95rem}
.badge-crest{width:56px;height:56px;margin:0 auto 6px;display:block}
.cmp{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-weight:700;font-size:.92rem;margin:3px 0}
.cmp .bar{height:10px;background:#0b1424;border-radius:99px;display:flex;overflow:hidden}
.cmp .bar i{display:block;height:100%}
.cmp .a{text-align:right}
.hint{color:var(--mute);font-size:.95rem}

/* ---------- luck dial ---------- */
.dial{display:flex;flex-direction:column;align-items:center}
.dial svg{width:100%;max-width:260px}
.dial .num{font-family:var(--disp);font-weight:900;font-size:2rem;line-height:1;margin-top:-6px}
.needle{transition:transform .9s cubic-bezier(.3,1.5,.5,1);transform-origin:130px 130px}
@media (prefers-reduced-motion:reduce){.needle{transition:none}}

/* ---------- bars and lists ---------- */
.stat{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-weight:700}
.stat .track{height:12px;background:#0b1424;border-radius:99px;overflow:hidden}
.stat .track i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:99px;transition:width .6s}
.stat span:last-child{text-align:right;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.us td{background:rgba(47,210,122,.14);font-weight:800}
tr.zone1 td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
td:first-child,th:first-child{width:34px;text-align:center}
.tbl-wrap{overflow-x:auto}
.resline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;flex-wrap:wrap}
.resline:last-child{border:0}
.res{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;font-weight:900;color:#04210f}
.res.W{background:var(--green)}.res.D{background:var(--gold)}.res.L{background:var(--red)}

/* ---------- squad ---------- */
.formrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.formrow button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;text-align:left}
.formrow button small{display:block;color:var(--mute);font-weight:400;font-size:.8rem}
.formrow button[aria-pressed="true"]{border-color:var(--green);background:#143a2b}
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 12.5%,var(--pitch2) 12.5% 25%);border:3px solid #d9f2e3}
.pitch::before{content:"";position:absolute;inset:3% 4%;border:2px solid rgba(255,255,255,.55);border-radius:4px}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .half{position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(255,255,255,.55)}
.pitch .box1,.pitch .box2{position:absolute;left:30%;right:30%;height:14%;border:2px solid rgba(255,255,255,.55)}
.pitch .box1{top:3%;border-top:0}.pitch .box2{bottom:3%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);z-index:2;width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0}
.slot b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#0b1424;border:3px solid #fff;font-family:var(--disp);font-weight:900;font-size:1.05rem}
.slot.DEF b{border-color:var(--blue)}.slot.MID b{border-color:var(--gold)}.slot.FWD b{border-color:var(--red)}.slot.GK b{border-color:var(--plum)}
.slot span{font-size:.78rem;font-weight:800;background:rgba(5,12,24,.78);border-radius:6px;padding:0 5px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel b{box-shadow:0 0 0 5px rgba(255,207,74,.8);transform:scale(1.08)}
.slot.off b{color:var(--gold)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.strip div{background:#0b1424;border-radius:12px;padding:8px;text-align:center}
.strip b{display:block;font-family:var(--disp);font-size:1.5rem;font-weight:900}
.strip small{color:var(--mute);font-weight:700;font-size:.78rem;letter-spacing:.05em}
.strip em{font-style:normal;color:var(--gold);font-size:.82rem;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--green);color:#04210f;border-color:var(--green)}
.plist{display:flex;flex-direction:column;gap:6px;max-height:620px;overflow:auto;padding-right:4px}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px 10px;width:100%}
.prow:hover{border-color:var(--line)}
.prow.sel{border-color:var(--gold)}
.prow.inxi{box-shadow:inset 4px 0 0 var(--green)}
.prow .pp{font-weight:900;font-size:.78rem;text-align:center;border-radius:6px;padding:3px 0;color:#04101f}
.pp.GK{background:var(--plum)}.pp.DEF{background:var(--blue)}.pp.MID{background:var(--gold)}.pp.FWD{background:var(--red)}
.prow small{display:block;color:var(--mute)}
.prow .rt{font-family:var(--disp);font-weight:900;font-size:1.35rem;text-align:right}
.prow .rt small{font-family:var(--body);font-size:.75rem;font-weight:400}
.prow.locked{opacity:.55;cursor:default}

/* ---------- training ---------- */
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.tcard h4{margin:0;font-family:var(--disp);font-weight:900;font-size:1.15rem}
.tcard .pil{font-size:.82rem;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:9px;border-radius:5px;background:#0b1424}
.pips i.on{background:var(--green)}
.tcard .btn{margin-top:auto;text-align:center;text-decoration:none;display:block}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;flex-wrap:wrap;gap:6px}
.group-h:first-of-type{margin-top:0}
.group-h b{font-family:var(--disp);font-size:1.25rem;font-weight:900}

/* ---------- inbox ---------- */
.msg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.msg.unread{border-color:var(--gold)}
.msg h4{margin:0 0 3px;font-weight:800}
.msg small{color:var(--mute)}

/* ---------- send box (styles for the shared component) ---------- */
.sendbox{display:flex;flex-direction:column;gap:10px}
.sendtitle{font-family:var(--disp);font-weight:900;font-size:1.2rem;margin:0}
.sendwhy{color:var(--mute);margin:0}
.sendwho{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sendlab{font-weight:700}
.sendwho input{background:#0b1424;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;width:9em}
.sendrow{display:flex;gap:8px;flex-wrap:wrap}
.sendmsg{color:var(--gold);min-height:1.2em;margin:0}

/* ---------- match overlay ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,8,16,.88);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.ov.on{display:flex}
.match{width:100%;max-width:880px;background:linear-gradient(180deg,#10203d,#0a111f);border:1px solid var(--line);border-radius:18px;padding:16px 18px 20px;margin:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;background:#07101e;border-radius:14px;padding:12px}
.board .tm{font-family:var(--disp);font-weight:900;font-size:clamp(.95rem,2.6vw,1.35rem);line-height:1.05}
.board .tm.us{color:var(--green)}
.board .sc{font-family:var(--disp);font-weight:900;font-size:clamp(2.4rem,8vw,3.6rem);display:flex;gap:10px;align-items:center;justify-content:center}
.board .sc i{width:14px;height:5px;background:var(--mute);border-radius:3px;display:block}
.board .clock{display:block;font-family:var(--body);font-weight:700;font-size:1rem;color:var(--gold);margin-top:2px}
.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.strip2{position:relative;height:56px;margin:12px 0;border-radius:10px;background:repeating-linear-gradient(90deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);border:2px solid #d9f2e3;overflow:hidden}
.strip2::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.strip2 .gl{position:absolute;top:30%;bottom:30%;width:8px;background:rgba(255,255,255,.8)}
.ball{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:2px solid #111;transition:left .5s}
@media (prefers-reduced-motion:reduce){.ball{transition:none}}
.feed{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.ev{display:grid;grid-template-columns:48px 1fr;gap:8px;background:var(--panel);border-radius:10px;padding:8px 10px;border-left:5px solid var(--line)}
.ev b{color:var(--mute)}
.ev.goal{border-left-color:var(--gold);background:#243214}
.ev.goal.us{border-left-color:var(--green)}
.ev.luck,.ev.lucky{border-left-color:var(--gold)}
.tag{display:inline-block;background:var(--gold);color:#241a00;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:900;margin-right:6px}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.final{background:#0d2a1f;border:1px solid #235a43;border-radius:14px;padding:12px 14px;margin-top:12px}
.hide{display:none!important}

/* ---------- setup wizard ---------- */
.wzdots{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.wzdots i{width:34px;height:8px;border-radius:5px;background:#243759}
.wzdots i.on{background:var(--green)}
.wzin{background:#0b1424;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1.1rem;width:100%;max-width:420px}
.swatches,.crests,.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.swatch{width:54px;height:40px;border-radius:10px;border:3px solid transparent;padding:0;position:relative;overflow:hidden}
.swatch i{position:absolute;right:0;top:0;bottom:0;width:40%}
.swatch[aria-pressed="true"]{border-color:var(--gold)}
.crests button{background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:6px 10px}
.crests button[aria-pressed="true"],.opts button[aria-pressed="true"]{border-color:var(--gold);background:#243214}
.opts button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700}
.wzprev{display:flex;align-items:center;gap:14px;background:#07101e;border-radius:14px;padding:12px 16px;margin:8px 0 14px}
.wzprev .nm{font-family:var(--disp);font-weight:900;font-size:1.5rem;line-height:1.05}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 14px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how b.n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--green);color:#04210f;font-family:var(--disp);margin-right:8px}
.demo{background:#07101e;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:center}
.drow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;margin:6px 0;padding:6px 8px;border-radius:10px;border:2px solid transparent}
.drow.on{border-color:var(--gold)}
.drow .track{height:14px;background:#0b1424;border-radius:99px;overflow:hidden;margin-top:4px}
.drow .track i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green))}
.drow b{text-align:right;color:var(--gold)}
.wzfoot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.moments{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem}
.moments li{padding:4px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.how{grid-template-columns:1fr}.demo{grid-template-columns:1fr}}

/* ---------- phone ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);background:#08111f}
  .side .club,.side .foot{display:none}
  .nav{flex-direction:row;width:100%;margin:0;gap:2px;justify-content:space-between}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;flex:1;text-align:center;align-items:center;min-width:0}
  .nav .badge{position:absolute;top:0;right:6px;margin:0;padding:0 6px;font-size:.7rem}
  main{padding:14px 14px 96px}
  .s8,.s7,.s6,.s5,.s4{grid-column:span 12}
  .stat{grid-template-columns:100px 1fr 46px}
  .lineup{grid-template-columns:1fr}
  .slot{width:62px}.slot b{width:40px;height:40px;font-size:.95rem}.slot span{font-size:.7rem;max-width:62px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="club" id="clubbox"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot"><button class="btn" data-act="help" style="width:100%">How to play</button>Bonnie the mascot says hello.<a href="/">Back to the Base 5 home page</a></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">The Dugout</h1>
      <div class="pills" id="pills"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="wiz" role="dialog" aria-modal="true" aria-label="Set up your club"><div class="match" id="wizbox"></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Match day"><div class="match" id="match"></div></div>

<script src="/jt/sim.js"></script>
<script src="/data/send.js"></script>
<script>
(function(){
"use strict";
var S = window.B5Sim;
var KEY = "b5.jt.hq.v1", ENG = "b5.engage.v1";
var ROUNDS = 15;
var reduce = false;
try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches }catch(e){}

/* ---------- small helpers ---------- */
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }
function surname(n){ var p = String(n).split(" "); return p[p.length - 1] }
function r1(x){ return Math.round(x) }
function plus(x){ return x > 0.04 ? "+" + (Math.round(x * 10) / 10) : "" }
var ICON = {
  home: '<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" fill="currentColor"/>',
  squad: '<circle cx="8" cy="8" r="3.4" fill="currentColor"/><circle cx="17" cy="9" r="2.8" fill="currentColor"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6zM14 20c0-3 2-5 4-5s4 2 4 5z" fill="currentColor"/>',
  train: '<path d="M3 9h3v6H3zM18 9h3v6h-3zM6 11h12v2H6zM1 11h2v2H1zM21 11h2v2h-2z" fill="currentColor"/>',
  league: '<path d="M5 3h14v4a5 5 0 0 1-4 4.9V15h3v3H6v-3h3v-3.1A5 5 0 0 1 5 7zM3 4h2v3H3zM19 4h2v3h-2zM6 19h12v2H6z" fill="currentColor"/>',
  inbox: '<path d="M3 5h18v14H3zm2 2v.5l7 5 7-5V7zm14 3l-7 5-7-5V17h14z" fill="currentColor" fill-rule="evenodd"/>',

/* ---------- derived numbers ---------- */
function ctx(){
  var tr = S.training(beats());
  var avail = S.PLAYERS.filter(function(p){ return !p.fp || tr.fp >= p.fp });
  return { tr: tr, avail: avail };
}
function autoPick(form, avail, prefer){
  var F = S.FORMATIONS[form], pairs = [], i, j, xi = [], used = {}, slotDone = {};
  var pool = avail.slice();
  if(prefer && prefer.length){
    var pref = pool.filter(function(p){ return prefer.indexOf(p.id) >= 0 });
    var rest = pool.filter(function(p){ return prefer.indexOf(p.id) < 0 });
    /* a small bonus keeps the players already picked */
    pool = pref.concat(rest);
  }
  for(i = 0; i < 11; i++) for(j = 0; j < pool.length; j++){
    var bonus = (prefer && prefer.indexOf(pool[j].id) >= 0) ? 6 : 0;
    pairs.push({ s: i, p: pool[j].id, v: pool[j].r * S.fit(pool[j].pos, F.slots[i]) + bonus });
  }
  pairs.sort(function(a, b){ return b.v - a.v });
  for(i = 0; i < pairs.length; i++){
    var q = pairs[i];
    if(used[q.p] || slotDone[q.s]) continue;
    used[q.p] = 1; slotDone[q.s] = 1; xi[q.s] = q.p;
  }
  for(i = 0; i < 11; i++) if(!xi[i]) xi[i] = "";
  return xi;
}
function pendingList(){
  var b = beats(), out = [];
  S.ACTS.forEach(function(a){
    var e = b[a.slug];
    if(e && e.n >= 1 && st.used.indexOf(a.slug) < 0) out.push({ slug: a.slug, last: e.last || 0, act: a });
  });
  out.sort(function(x, y){ return x.last - y.last });
  return out;
}
function actBy(slug){ for(var i = 0; i < S.ACTS.length; i++) if(S.ACTS[i].slug === slug) return S.ACTS[i]; return null }
function ourSide(m){ return m.home ? "h" : "a" }
function ourGoals(m){ return m.home ? m.hs : m.as }
function theirGoals(m){ return m.home ? m.as : m.hs }
function resultOf(m){ var a = ourGoals(m), b = theirGoals(m); return a > b ? "W" : (a < b ? "L" : "D") }
function goalTally(){
  var t = {};
  st.played.forEach(function(m){
    (m.events || []).forEach(function(e){ if(e.k === "goal" && e.side === ourSide(m) && e.who) t[e.who] = (t[e.who] || 0) + 1 });
  });
  return t;
}
function teamNow(c){

}

/* keep the side tidy and note what is new */
function sync(){
  var c = ctx(), ids = {}, i, changed = false;
  c.avail.forEach(function(p){ ids[p.id] = 1 });
  var seen = {}, gap = st.xi.length !== 11;
  for(i = 0; i < 11; i++){
    var id = st.xi[i];
    if(!id || !ids[id] || seen[id]){ st.xi[i] = ""; gap = true } else seen[id] = 1;
  }
  if(gap){ st.xi = autoPick(st.formation, c.avail, st.xi.filter(Boolean)); changed = true }
  S.PLAYERS.forEach(function(p){
    if(p.fp && c.tr.fp >= p.fp && !st.unlocked[p.id]){
      st.unlocked[p.id] = 1;
      post("New signing: " + p.name, "Transfer news", p.name + " (" + p.pos + ", rated " + p.r + ") has joined " + clubName() + ". " + p.note + ". Pop into Squad if you fancy putting them in your side.");
      changed = true;
    }
  });
  S.ACTS.forEach(function(a){
    var lv = c.tr.levels[a.slug] || 0, was = st.trained[a.slug] || 0;
    if(lv > was){
      st.trained[a.slug] = lv;
      var per = {atk:0.7,mid:0.55,def:0.7,gk:1.2}[a.stat] * 0.55;
      post("Training report: " + a.title, "Coaching staff",
        (was === 0 ? "A match is waiting in the dugout. " : "") + S.STATS[a.stat].label + " is now at level " + lv + " of " + S.CAP + " from this session (about " + (Math.round(per * lv * 10) / 10) + " points of boost). Every bit of doing also turns the luck dial.");
      changed = true;

}

document.addEventListener("input", function(e){
  if(e.target.id === "wzname"){ st.club.name = e.target.value; applyClub(); var sh = $("wzshow"); if(sh) sh.textContent = clubName(); save(); renderClub() }
  if(e.target.id === "wzpl"){ st.me.name = e.target.value; var ps = $("wzpshow"); if(ps) ps.textContent = st.me.name.trim() || "Your player"; save() }
});

/* ---------- clicks ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b) return;
  var a = b.getAttribute("data-act"), c;
  if(a === "help"){ wizOpen(3, "help"); return }
  if(a === "wzedit"){ wizOpen(0, "edit"); return }
  if(a === "wzclose"){ wizClose(); return }
  if(a === "wzback"){ wiz.step = Math.max(0, wiz.step - 1); wizDraw(); return }
  if(a === "wznext"){
    if(wiz.step === 1){ applyMe(); var cc = ctx(); st.xi = autoPick(st.formation, cc.avail, st.xi.filter(function(id){ return id && id !== "me" }).concat(st.me.name.trim() ? ["me"] : [])); save() }
    wiz.step = Math.min(3, wiz.step + 1); wizDraw(); return;
  }
  if(a === "wzcol"){ var sw = SWATCH[+b.getAttribute("data-i")]; st.club.c1 = sw[0]; st.club.c2 = sw[1]; save(); renderClub(); wizDraw(); return }
  if(a === "wzcrest"){ st.club.crest = b.getAttribute("data-k"); save(); renderClub(); wizDraw(); return }
  if(a === "wzpos"){ st.me.pos = b.getAttribute("data-k"); save(); wizDraw(); return }
  if(a === "wztrait"){ st.me.note = TRAITS[+b.getAttribute("data-i")]; save(); wizDraw(); return }
  if(a === "view"){ view = b.getAttribute("data-v"); sel = null; try{ history.replaceState(null, "", "#" + view) }catch(er){} render(); window.scrollTo(0, 0); return }
  if(a === "kick"){ openMatch(); return }
  if(a === "start"){ startMatch(b.getAttribute("data-w") === "1"); return }
  if(a === "skip"){ var f = $("match")._finish; if(f) f(); return }
  if(a === "closem"){ closeMatch(); return }
  if(a === "closeleague"){ closeMatch(); view = "league"; render(); return }
  if(a === "replay"){ replay(+b.getAttribute("data-i")); return }
  if(a === "pf"){ posFilter = b.getAttribute("data-k"); render(); return }
  if(a === "form"){
    st.formation = b.getAttribute("data-f"); c = ctx();
    st.xi = autoPick(st.formation, c.avail, st.xi.filter(Boolean)); sel = null; save(); render(); return;
  }
  if(a === "auto"){ c = ctx(); st.xi = autoPick(st.formation, c.avail); sel = null; save(); render(); return }
  if(a === "slot"){
    var i = +b.getAttribute("data-i");
    if(sel && sel.player){ place(sel.player, i); sel = null; render(); return }
    sel = (sel && sel.slot === i) ? null : { slot: i }; render(); return;
  }
  if(a === "player"){
    var id = b.getAttribute("data-id");
    if(sel && sel.slot !== undefined){ place(id, sel.slot); sel = null; render(); return }
    sel = (sel && sel.player === id) ? null : { player: id }; render(); return;
  }
});
function place(pid, slot){
  var j = st.xi.indexOf(pid), old = st.xi[slot];
  if(j >= 0 && j !== slot) st.xi[j] = old || "";
  st.xi[slot] = pid; save();
}
document.addEventListener("keydown", function(e){ if(e.key !== "Escape") return; if(wiz.on) wizClose(); else if($("ov").classList.contains("on")) closeMatch() });

/* when the student comes back from a training page, refresh */
function refresh(){ if(!$("ov").classList.contains("on") && !wiz.on) render() }
window.addEventListener("pageshow", refresh);
window.addEventListener("focus", refresh);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh() });
window.addEventListener("storage", function(e){ if(e.key === ENG) refresh() });

var h0 = (location.hash || "").replace("#", "");
VIEWS.forEach(function(v){ if(v.id === h0) view = h0 });
window.__dugout = { st: function(){ return st }, ctx: ctx, render: render };
render();
if(!st.setup) wizOpen(0, "setup");
})();
</script>
</body>
</html>
