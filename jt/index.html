<!DOCTYPE html>
<html lang="en-GB" data-motion="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dugout - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* A calm look on purpose: soft dark blue, one gentle accent, plenty of space,
   no flashing, nothing moves unless the student asks for lively motion. */
:root{
  --bg:#141b29; --panel:#1b2538; --panel2:#222e45; --line:#33425f;
  --ink:#e8edf6; --mute:#a9b6cf; --accent:#74c9a0; --accent-ink:#0c2218; --gold:#dcc17f; --red:#e39a9a; --blue:#97b9e6; --plum:#bcaee6;
  --k1:#0c3b27; --k2:#74c9a0; --kt:#ffffff;
  --disp:"Archivo",system-ui,Arial,sans-serif; --body:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.2;font-weight:700}
h2{font-size:1.45rem}
h3{font-size:1rem;font-weight:700;color:var(--mute);margin-bottom:10px}
p{margin:0 0 .7em}
.mute,.hint{color:var(--mute)}
.hint{font-size:.95rem}
html[data-motion="calm"] *,html[data-motion="calm"] *::before,html[data-motion="calm"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:#10172a;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px}
.club{display:flex;align-items:center;gap:10px}
.club b{font-family:var(--disp);font-weight:700;font-size:1.1rem;line-height:1.1}
.club small{display:block;color:var(--mute);font-size:.82rem;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:11px 12px;text-align:left;font-weight:700;color:var(--mute);position:relative}
.nav button svg{width:21px;height:21px;flex:none}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.side .foot{margin-top:auto;font-size:.88rem;color:var(--mute);display:flex;flex-direction:column;gap:8px}
main{padding:24px 28px 56px;min-width:0;max-width:1040px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h1{font-size:clamp(1.6rem,3.6vw,2.1rem)}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.92rem}
.pill b{color:var(--gold);font-weight:700}
button.pill:hover{border-color:var(--accent)}
.pill.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.stack{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-weight:700;background:var(--panel2);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn-go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-go:hover{filter:brightness(1.06)}
.btn-big{font-size:1.1rem;padding:14px 26px}
.btn-quiet{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hide{display:none!important}

/* folds keep the screen quiet */
details.fold{background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 20px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Show";color:var(--mute);font-weight:400;font-size:.9rem}
details.fold[open]>summary::after{content:"Hide"}
details.fold>.in{padding:0 20px 18px}

/* next match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:6px 0 16px}
.vs .tm{font-family:var(--disp);font-weight:700;font-size:clamp(1.05rem,2.4vw,1.4rem);line-height:1.15}
.vs .mid{color:var(--mute);font-size:.95rem}
.badge-crest{width:52px;height:59px;margin:0 auto 8px;display:block}
.cmp{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;font-size:.95rem;margin:5px 0}
.cmp .bar{height:8px;background:#0f1626;border-radius:99px;display:flex;overflow:hidden}
.cmp .bar i{display:block;height:100%}
.cmp .a{text-align:right}
.cmp .lab{text-align:center;color:var(--mute);font-size:.8rem;margin-top:2px}

/* luck */
.luckrow{display:flex;gap:16px;align-items:center}
.dial{display:flex;flex-direction:column;align-items:center;flex:none;width:130px}
.dial svg{width:100%}
.dial .num{font-family:var(--disp);font-weight:700;font-size:1.5rem;line-height:1;margin-top:-4px}
.needle{transform-origin:130px 130px}
html[data-motion="lively"] .needle{transition:transform .8s ease}

/* lists */
.stat{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.stat .track{height:10px;background:#0f1626;border-radius:99px;overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat span:last-child{text-align:right;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:.82rem;font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.us td{background:rgba(116,201,160,.12);font-weight:700}
td:first-child,th:first-child{width:34px;text-align:center}
.tbl-wrap{overflow-x:auto}
td.form,th.form{text-align:left;white-space:nowrap}
.f{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;font-size:.72rem;font-weight:700;border-radius:5px;margin-right:3px;color:#10172a;font-style:normal}
.f.W{background:var(--accent)}.f.D{background:var(--gold)}.f.L{background:var(--red)}
.resline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.resline:last-child{border:0}
.res{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;font-weight:700;color:#10172a}
.res.W{background:var(--accent)}.res.D{background:var(--gold)}.res.L{background:var(--red)}

/* squad */
.formrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.formrow button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;text-align:left}
.formrow button small{display:block;color:var(--mute);font-weight:400;font-size:.8rem}
.formrow button[aria-pressed="true"]{border-color:var(--accent)}
.pitch{position:relative;width:100%;max-width:500px;margin:0 auto;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#2f6a4f;border:2px solid #9bc5ae}
.pitch::before{content:"";position:absolute;inset:3% 4%;border:2px solid rgba(255,255,255,.4);border-radius:4px}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .half{position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(255,255,255,.4)}
.pitch .box1,.pitch .box2{position:absolute;left:30%;right:30%;height:14%;border:2px solid rgba(255,255,255,.4)}
.pitch .box1{top:3%;border-top:0}.pitch .box2{bottom:3%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);z-index:2;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0}
.slot b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--k1);color:var(--kt);border:3px solid var(--k2);font-family:var(--disp);font-weight:700;font-size:1rem}
.slot span{font-size:.76rem;font-weight:700;background:rgba(10,16,28,.78);border-radius:6px;padding:0 6px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel b{outline:3px solid var(--gold);outline-offset:2px}
.slot.off b{border-style:dashed}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.strip div{background:#0f1626;border-radius:12px;padding:8px;text-align:center}
.strip b{display:block;font-family:var(--disp);font-size:1.35rem;font-weight:700}
.strip small{color:var(--mute);font-size:.78rem}
.strip em{font-style:normal;color:var(--gold);font-size:.8rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:6px;max-height:600px;overflow:auto;padding-right:4px}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px 10px;width:100%}
.prow:hover{border-color:var(--line)}
.prow.sel{border-color:var(--gold)}
.prow.inxi{box-shadow:inset 3px 0 0 var(--accent)}
.prow .pp{font-weight:700;font-size:.76rem;text-align:center;border-radius:6px;padding:3px 0;color:#10172a}
.pp.GK{background:var(--plum)}.pp.DEF{background:var(--blue)}.pp.MID{background:var(--gold)}.pp.FWD{background:var(--red)}
.prow small{display:block;color:var(--mute)}
.prow .rt{font-family:var(--disp);font-weight:700;font-size:1.25rem;text-align:right}
.prow .rt small{font-family:var(--body);font-size:.75rem;font-weight:400;color:var(--accent)}
.prow.locked{opacity:.55;cursor:default}

/* training */
.tgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}
.tcard h4{font-size:1.08rem}
.tcard .pil{font-size:.82rem;color:var(--mute)}
.pips{display:flex;gap:5px;margin:2px 0}
.pips i{width:22px;height:8px;border-radius:5px;background:#0f1626}
.pips i.on{background:var(--accent)}
.tcard .btn{margin-top:auto;text-align:center;text-decoration:none;display:block}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;flex-wrap:wrap;gap:6px}
.group-h:first-of-type{margin-top:10px}
.group-h b{font-family:var(--disp);font-size:1.2rem}

/* inbox, settings, send */
.msg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.msg.unread{border-color:var(--gold)}
.msg h4{margin:0 0 2px;font-size:1rem}
.msg small{color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.opts button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:700}
.opts button[aria-pressed="true"]{border-color:var(--accent)}
.sendbox{display:flex;flex-direction:column;gap:10px}
.sendtitle{font-family:var(--disp);font-weight:700;font-size:1.1rem;margin:0}
.sendwhy{color:var(--mute);margin:0}
.sendwho{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sendlab{font-weight:700}
.sendwho input,.wzin{background:#0f1626;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.sendwho input{width:9em}
.sendrow{display:flex;gap:8px;flex-wrap:wrap}
.sendmsg{color:var(--gold);min-height:1.2em;margin:0}

/* match overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.9);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.ov.on{display:flex}
.match{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 22px 22px;margin:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;background:#0f1626;border-radius:14px;padding:14px}
.board .tm{font-family:var(--disp);font-weight:700;font-size:clamp(.95rem,2.4vw,1.25rem);line-height:1.15}
.board .tm.us{color:var(--accent)}
.board .sc{font-family:var(--disp);font-weight:700;font-size:clamp(2.2rem,7vw,3.2rem);display:flex;gap:10px;align-items:center;justify-content:center}
.board .sc i{width:12px;height:4px;background:var(--mute);border-radius:3px;display:block}
.clk{text-align:center;color:var(--mute);margin:8px 0}
.feed{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;margin-top:8px}
.ev{display:grid;grid-template-columns:48px 1fr;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 12px;border-left:4px solid var(--line)}
.ev b{color:var(--mute);font-weight:700}
.ev.goal{border-left-color:var(--gold)}
.ev.goal.us{border-left-color:var(--accent)}
.ev.luck,.ev.lucky{border-left-color:var(--gold)}
.ev.talk,.ev.pens,.ev.pen{border-left-color:var(--blue)}
.tag{display:inline-block;background:var(--gold);color:#2a2008;border-radius:6px;padding:0 6px;font-size:.74rem;font-weight:700;margin-right:6px}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{background:#0f2a22;border:1px solid #2a5c49;border-radius:14px;padding:16px 18px;margin-top:12px}
.choice h3{color:var(--ink);font-size:1.15rem;margin-bottom:4px}
.choice .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px}
.choice .opt:hover{border-color:var(--accent)}
.choice .opt small{display:block;color:var(--mute)}
.final{background:#16283a;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}

/* setup wizard */
.wzdots{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.wzdots i{width:32px;height:7px;border-radius:5px;background:var(--line)}
.wzdots i.on{background:var(--accent)}
.wzin{width:100%;max-width:420px;font-size:1.1rem}
.swatches,.crests{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.swatch{width:54px;height:40px;border-radius:10px;border:3px solid transparent;padding:0;position:relative;overflow:hidden}
.swatch i{position:absolute;right:0;top:0;bottom:0;width:40%}
.swatch[aria-pressed="true"]{border-color:var(--gold)}
.crests button{background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:6px 10px}
.crests button[aria-pressed="true"]{border-color:var(--gold)}
.wzprev{display:flex;align-items:center;gap:14px;background:#0f1626;border-radius:14px;padding:12px 16px;margin:8px 0 14px}
.wzprev .nm{font-family:var(--disp);font-weight:700;font-size:1.4rem;line-height:1.1}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 14px}
.how div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how b.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--disp);margin-right:8px}
.demo{background:#0f1626;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.drow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;margin:6px 0;padding:8px 10px;border-radius:10px;border:2px solid transparent;width:100%;background:none;text-align:left}
.drow.on{border-color:var(--gold)}
.drow .track{height:12px;background:var(--panel);border-radius:99px;overflow:hidden;margin-top:5px}
.drow .track i{display:block;height:100%;background:var(--accent)}
.drow b.w{text-align:right;color:var(--gold)}
.wzfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.moments{margin:10px 0 0;padding:0;list-style:none;font-size:.95rem}
.moments li{padding:5px 0;border-bottom:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .side .club,.side .foot{display:none}
  .nav{flex-direction:row;width:100%;gap:2px;justify-content:space-between}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;flex:1;text-align:center;align-items:center;min-width:0}
  .nav button[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent)}
  .nav .dot{position:absolute;top:4px;right:10px;margin:0}
  main{padding:16px 14px 100px}
  .row2,.lineup,.how,.demo{grid-template-columns:1fr}
  .s7,.s5{grid-column:span 12}
  .stat{grid-template-columns:110px 1fr 44px}
  .slot{width:64px}.slot b{width:38px;height:38px;font-size:.92rem}.slot span{font-size:.68rem;max-width:64px}
  .card{padding:16px}
  table.lg th:nth-child(4),table.lg td:nth-child(4),table.lg th:nth-child(5),table.lg td:nth-child(5),table.lg th:nth-child(6),table.lg td:nth-child(6){display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="club" id="clubbox"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot"><button class="btn" data-act="help">How to play</button><a href="/">Back to the Base 5 home page</a></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">The Dugout</h1>
      <div class="pills" id="pills"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="wiz" role="dialog" aria-modal="true" aria-label="Set up your club"><div class="match" id="wizbox"></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Match day"><div class="match" id="match"></div></div>

<script src="/jt/sim.js"></script>
<script src="/data/send.js"></script>
<script>
(function(){
"use strict";
var S = window.B5Sim;
var KEY = "b5.jt.hq.v1", ENG = "b5.engage.v1";
var ROUNDS = 15;
var CUP_AT = [6, 14, 24, 36], CUP_NAMES = ["Round of 16", "Quarter final", "Semi final", "Final"];
var sysReduce = false;
try{ sysReduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches }catch(e){}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }
function surname(n){ var p = String(n).split(" "); return p[p.length - 1] }
function r1(x){ return Math.round(x) }
function plus(x){ return x > 0.04 ? "+" + (Math.round(x * 10) / 10) : "" }
function ord(n){ var s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]) }
var ICON = {
  home: '<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" fill="currentColor"/>',
  squad: '<circle cx="8" cy="8" r="3.4" fill="currentColor"/><circle cx="17" cy="9" r="2.8" fill="currentColor"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6zM14 20c0-3 2-5 4-5s4 2 4 5z" fill="currentColor"/>',

function autoPick(form, avail, prefer){
  var F = S.FORMATIONS[form], pairs = [], i, j, xi = [], used = {}, slotDone = {};
  for(i = 0; i < 11; i++) for(j = 0; j < avail.length; j++){
    var bonus = (prefer && prefer.indexOf(avail[j].id) >= 0) ? 6 : 0;
    pairs.push({ s: i, p: avail[j].id, v: rate(avail[j]) * S.fit(avail[j].pos, F.slots[i]) + bonus });
  }
  pairs.sort(function(a, b){ return b.v - a.v });
  for(i = 0; i < pairs.length; i++){
    var q = pairs[i];
    if(used[q.p] || slotDone[q.s]) continue;
    used[q.p] = 1; slotDone[q.s] = 1; xi[q.s] = q.p;
  }
  for(i = 0; i < 11; i++) if(!xi[i]) xi[i] = "";
  return xi;
}
function pendingList(){
  var b = beats(), out = [];
  S.ACTS.forEach(function(a){
    var e = b[a.slug];

}

}

function ourGoals(m){ return m.home ? m.hs : m.as }
function theirGoals(m){ return m.home ? m.as : m.hs }

}
function teamNow(c){

function sync(){
  var c = ctx(), ids = {}, i, changed = false;

  var seen = {}, gap = st.xi.length !== 11;
  for(i = 0; i < 11; i++){

  }
  if(gap){ st.xi = autoPick(st.formation, c.avail, st.xi.filter(Boolean)); changed = true }
  S.PLAYERS.forEach(function(p){
    if(p.fp && c.tr.fp >= p.fp && !st.unlocked[p.id]){
      st.unlocked[p.id] = 1;
      post("New signing: " + p.name, "Transfer news", p.name + " (" + p.pos + ", rated " + p.r + ") has joined " + clubName() + ". " + p.note + ". Pop into Squad if you fancy putting them in your side.");

  }catch(e){}
}

      var pos = 0; S.table(st.seed, st.played).forEach(function(r, i){ if(r.id === 0) pos = i + 1 });
      var imp0 = improved();
      post(pos === 1 ? "League champions!" : "Season finished: " + ord(pos), "The Chairman (Jay)", (pos === 1 ? "Top of the league after fifteen matches. Outrageous. Well played, manager." : "Fifteen matches played and you finished " + ord(pos) + ".") + (imp0 ? " Most improved player: " + imp0.name + "." : ""));
    }
  }
  var our = ours === "h" ? p.home : p.away, grew = [], byName = {}, gain = {};
  our.players.forEach(function(q){ if(q.id){ byName[q.name] = q.id; gain[q.id] = (gain[q.id] || 0) + 1 } });
  M.events.forEach(function(e){ if(e.k === "goal" && e.side === ours && byName[e.who]) gain[byName[e.who]] += 2 });
  Object.keys(gain).forEach(function(id){
    var xp = (st.dev.xp[id] || 0) + gain[id]; st.dev.xp[id] = xp;
    var nb = Math.min(6, Math.floor(xp / 4)), old = bonusOf(id);
    if(nb > old){ st.dev.bonus[id] = nb; var pl = S.playerById(id); if(pl) grew.push(pl.name + " (now " + (pl.r + nb) + ")") }
  });
  if(grew.length) post("Players improving", "Coaching staff", "Match time is making players better: " + grew.join(", ") + ".");
  p.growth = grew; p.entry = entry; save();
}
function replay(kind, i){
  var m = kind === "cup" ? st.cup.ties[i] : st.played[i]; if(!m) return;
  var ours = ourSide(m), opp = S.CLUBS[m.opp - 1].name;
  var rep = { hname: m.home ? clubName() : opp, aname: m.home ? opp : clubName(), k: m.k };
  var win = m.pens ? (m.won ? ours : (ours === "h" ? "a" : "h")) : (m.hs > m.as ? "h" : (m.as > m.hs ? "a" : ""));
  playing = { replay: true, kind: kind === "cup" ? "cup" : "league", round: -1, ourS: ours, rep: rep, M: { events: m.events, hs: m.hs, as: m.as, pens: m.pens, winner: win }, shown: 0, sh: 0, sa: 0, finalised: true, growth: [] };
  $("ov").classList.add("on");
  $("match").innerHTML = '<div class="mhead"><h2>Match report</h2><button class="btn" id="skipb" data-act="skiphl">Skip</button></div>' + boardHtml(null, rep) + '<div class="clk" id="clk"></div><div class="mbtns" style="margin:0 0 8px"><button class="btn" data-act="rp" data-m="full">Full report</button><button class="btn" data-act="rp" data-m="hl">Highlights</button></div><div class="feed" id="feed"></div><div id="fin"></div>';
  showAllReplay(false);
}
function showAllReplay(hl){
  var p = playing; stopTimer();
  $("feed").innerHTML = ""; p.sh = 0; p.sa = 0; $("sh").textContent = 0; $("sa").textContent = 0; $("fin").innerHTML = "";
  var sk = $("skipb"); if(sk) sk.classList.remove("hide");
  showAll(p.M.events, hl);
}

/* ---------- set up your club, then how to play ---------- */
var wiz = { on: false, step: 0, mode: "setup", timer: null, demo: null };
var SWATCH = [["#0c3b27","#74c9a0"],["#1f3b7a","#e6c86a"],["#7a1f2b","#ffffff"],["#4a1f7a","#e6c86a"],["#151b26","#e39a9a"],["#0b5a73","#ffffff"],["#6a4410","#ffe3b0"],["#1b1b6b","#79e0c9"]];
var CRESTS = ["bird","star","bolt","ball"];
var TRAITS = ["Never gives up","Fast and fearless","Calm under pressure","Scores when it matters","Reads the game","Keeps the ball"];
var POSN = { GK: "Goalkeeper", DEF: "Defender", MID: "Midfielder", FWD: "Forward" };
function wizOpen(step, mode){
  wiz.on = true; wiz.step = step; wiz.mode = mode;
  $("wiz").classList.add("on"); wizDraw();
  var f = $("wizbox").querySelector("input,button"); if(f) try{ f.focus() }catch(e){}
}
function wizStop(){ if(wiz.timer){ clearInterval(wiz.timer); wiz.timer = null } }
function wizClose(){
  wizStop(); wiz.on = false; $("wiz").classList.remove("on");
  applyMe(); applyClub(); st.setup = true; save(); render();
}
function demoNumbers(){
  var opp = S.clubTeam(0), pool = S.PLAYERS.filter(function(p){ return !p.fp });
  var xi = autoPick(st.formation, pool), N = 30, out = [], i;
  var levels = [["No sessions yet", 0], ["One go at every session", 1], ["Lots of doing in every session", 4]], sample = null;
  levels.forEach(function(L){
    var b = {}; S.ACTS.forEach(function(a){ b[a.slug] = { n: L[1] } });
    var tr = S.training(b), team = S.buildTeam(st.formation, xi, tr.boost, tr.luck), w = 0;
    for(i = 0; i < N; i++){
      var r = S.simulate(team, opp, 5000 + i * 17, { our: "h", interactive: true });
      if(r.hs > r.as) w++;
      var ln = r.events.filter(function(e){ return e.k === "luck" || e.lucky }).length;
      if(L[1] === 4 && !sample && ln >= 2 && r.hs > r.as) sample = r.events.filter(function(e){ return e.k === "goal" || e.k === "luck" }).slice(0, 6);
    }
    out.push({ label: L[0], luck: tr.luck, w: w, N: N });
  });
  return { rows: out, sample: sample || [] };
}
function wizDemoSet(i){
  var D = wiz.demo; if(!D) return;
  var box = $("wizbox"), r = D.rows[i], nd = box.querySelector(".needle"), nm = $("wznum");
  if(nd) nd.style.transform = "rotate(" + (-90 + 180 * r.luck) + "deg)";
  if(nm) nm.textContent = Math.round(r.luck * 100) + "%";
  var rows = box.querySelectorAll(".drow"); for(var k = 0; k < rows.length; k++) rows[k].classList.toggle("on", k === i);
}
function wizDraw(){
  if(!wiz.on) return;
  wizStop();
  var box = $("wizbox"), step = wiz.step, h = "", last = step === 3, full = wiz.mode !== "help";
  var titles = ["Name your club", "Build your player", "Pick your side", "How to play"];
  if(full) h += '<div class="wzdots" aria-label="Step ' + (step + 1) + ' of 4">' + [0,1,2,3].map(function(i){ return '<i class="' + (i <= step ? "on" : "") + '"></i>' }).join("") + '</div>';
  h += '<div class="mhead"><h2>' + titles[step] + '</h2>' + (full ? '<button class="btn btn-quiet" data-act="wzclose">' + (last ? "Close" : "Skip for now") + '</button>' : '') + '</div>';
  if(step === 0){
    h += '<p class="hint">You are the manager. Make the club yours. You can change any of this later.</p>' +
      '<label class="sendlab" for="wzname">Club name</label><br><input class="wzin" id="wzname" maxlength="24" value="' + esc(st.club.name) + '" placeholder="Base 5 United">' +
      '<h3 style="margin-top:16px">Kit colours</h3><div class="swatches">' + SWATCH.map(function(sw, i){
        return '<button class="swatch" data-act="wzcol" data-i="' + i + '" aria-pressed="' + (st.club.c1 === sw[0] && st.club.c2 === sw[1]) + '" aria-label="Colour set ' + (i + 1) + '" style="background:' + sw[0] + '"><i style="background:' + sw[1] + '"></i></button>';
      }).join("") + '</div><h3>Badge</h3><div class="crests">' + CRESTS.map(function(k){
        var keep = st.club.crest; st.club.crest = k; var svg = crestSvg(40, true); st.club.crest = keep;
        return '<button data-act="wzcrest" data-k="' + k + '" aria-pressed="' + (keep === k) + '" aria-label="Badge ' + k + '">' + svg + '</button>';
      }).join("") + '</div><div class="wzprev">' + crestSvg(54, true) + '<div><div class="nm" id="wzshow">' + esc(clubName()) + '</div><span class="hint">Your club</span></div></div>';
  } else if(step === 1){
    h += '<p class="hint">Make a player of your own. They join the squad rated 70, a touch better than the rest to start with. Made up names work well. You can skip this too.</p>' +
      '<label class="sendlab" for="wzpl">Player name</label><br><input class="wzin" id="wzpl" maxlength="22" value="' + esc(st.me.name) + '" placeholder="e.g. Rocket Rory">' +
      '<h3 style="margin-top:16px">Position</h3><div class="opts">' + ["GK","DEF","MID","FWD"].map(function(k){ return '<button data-act="wzpos" data-k="' + k + '" aria-pressed="' + (st.me.pos === k) + '">' + POSN[k] + '</button>' }).join("") + '</div>' +
      '<h3>Their style</h3><div class="opts">' + TRAITS.map(function(k, i){ return '<button data-act="wztrait" data-i="' + i + '" aria-pressed="' + (st.me.note === k) + '">' + k + '</button>' }).join("") + '</div>' +
      '<div class="wzprev"><span class="pp ' + st.me.pos + '" style="padding:6px 10px;border-radius:8px;font-weight:700;color:#10172a">' + st.me.pos + '</span><div><div class="nm" id="wzpshow">' + esc(st.me.name || "Your player") + '</div><span class="hint">' + esc(st.me.note) + '. Rated 70.</span></div></div>';
  } else if(step === 2){
    var c = ctx();
    h += '<p class="hint">Choose a formation, then tap a spot and a player to build your side. Or let the computer pick, then change what you like. There is no wrong answer.</p><div class="grid" style="gap:14px">' + pitchCard(c, "s12") + listCard(c, "s12") + '</div>';
  } else {
    var D = demoNumbers(); wiz.demo = D;
    h += '<div class="how"><div><b class="n">1</b><b>Build your side.</b><br>You can change it any time in Squad.</div>' +
      '<div><b class="n">2</b><b>Try a training session.</b><br>Any one, in any order. Each opens in this tab with a button to bring you back.</div>' +
      '<div><b class="n">3</b><b>Each session earns a match.</b><br>Kick off when you fancy. Watch it, see the highlights, or just the score.</div>' +
      '<div><b class="n">4</b><b>More doing, more luck.</b><br>Every bit of doing turns the luck dial up and sharpens your players.</div>' +
      '<div><b class="n">5</b><b>Make a few choices.</b><br>At half time, and for a free kick, you can decide. Or let the coach decide.</div>' +
      '<div><b class="n">6</b><b>Players grow, and a cup awaits.</b><br>Players who play get better. More focus points bring cup ties.</div></div>' +
      '<h3>See it for yourself</h3><p class="hint">The same side plays the same strong club 30 times. The only thing that changes is how much training has been done. Tap a row to see the dial.</p>' +
      '<div class="demo"><div class="dial">' + dialSvg(D.rows[2].luck) + '<div class="num" id="wznum">' + Math.round(D.rows[2].luck * 100) + '%</div></div><div>' +
      D.rows.map(function(r, i){ return '<button class="drow' + (i === 2 ? " on" : "") + '" data-act="wzdemo" data-i="' + i + '"><span><b>' + r.label + '</b><span class="track" style="display:block"><i style="width:' + (100 * r.w / r.N) + '%"></i></span></span><b class="w">' + r.w + ' wins of ' + r.N + '</b></button>' }).join("") + '</div></div>' +
      (D.sample.length ? '<h3 style="margin-top:16px">A game with lots of training</h3><ul class="moments">' + D.sample.map(function(e){ return '<li><b>' + e.m + "'</b> " + (e.k === "luck" || e.lucky ? '<span class="tag">LUCK</span>' : "") + esc(e.text) + '</li>' }).join("") + '</ul>' : "") +
      '<p class="hint" style="margin-top:10px">Real matches are shuffled by luck, so any single game can go either way. Over a whole season, doing more helps.</p>';
  }
  h += '<div class="wzfoot">' + (full && step > 0 ? '<button class="btn" data-act="wzback">Back</button>' : '<span></span>') +
    (last ? '<button class="btn btn-go btn-big" data-act="wzclose">' + (full ? "Start managing" : "Got it") + '</button>' : '<button class="btn btn-go btn-big" data-act="wznext">Next</button>') + '</div>';
  box.innerHTML = h;
  if(step === 3 && !calm()){
    var k = 0;
    wiz.timer = setInterval(function(){ wizDemoSet(k); k = (k + 1) % 3 }, 2400);
  }
}
document.addEventListener("input", function(e){
  if(e.target.id === "wzname"){ st.club.name = e.target.value; applyClub(); var sh = $("wzshow"); if(sh) sh.textContent = clubName(); save(); renderClub() }
  if(e.target.id === "wzpl"){ st.me.name = e.target.value; var ps = $("wzpshow"); if(ps) ps.textContent = st.me.name.trim() || "Your player"; save() }
});

/* ---------- clicks ---------- */
function place(pid, slot){
  var j = st.xi.indexOf(pid), old = st.xi[slot];
  if(j >= 0 && j !== slot) st.xi[j] = old || "";
  st.xi[slot] = pid; save();
}
document.addEventListener("toggle", function(e){
  var d = e.target; if(d && d.getAttribute && d.getAttribute("data-f")) folds[d.getAttribute("data-f")] = d.open;
}, true);
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b) return;
  var a = b.getAttribute("data-act"), c;
  if(a === "help"){ wizOpen(3, "help"); return }
  if(a === "wzedit"){ wizOpen(0, "edit"); return }
  if(a === "wzclose"){ wizClose(); return }
  if(a === "wzback"){ wiz.step = Math.max(0, wiz.step - 1); wizDraw(); return }
  if(a === "wznext"){
    if(wiz.step === 1){ applyMe(); var cc = ctx(); st.xi = autoPick(st.formation, cc.avail, st.xi.filter(function(id){ return id && id !== "me" }).concat(st.me.name.trim() ? ["me"] : [])); save() }
    wiz.step = Math.min(3, wiz.step + 1); wizDraw(); return;
  }
  if(a === "wzcol"){ var sw = SWATCH[+b.getAttribute("data-i")]; st.club.c1 = sw[0]; st.club.c2 = sw[1]; save(); renderClub(); applyKit(); wizDraw(); return }
  if(a === "wzcrest"){ st.club.crest = b.getAttribute("data-k"); save(); renderClub(); wizDraw(); return }
  if(a === "wzpos"){ st.me.pos = b.getAttribute("data-k"); save(); wizDraw(); return }
  if(a === "wztrait"){ st.me.note = TRAITS[+b.getAttribute("data-i")]; save(); wizDraw(); return }
  if(a === "wzdemo"){ wizDemoSet(+b.getAttribute("data-i")); return }
  if(a === "view"){ view = b.getAttribute("data-v"); sel = null; try{ history.replaceState(null, "", "#" + view) }catch(er){} render(); window.scrollTo(0, 0); return }
  if(a === "set"){
    var k = b.getAttribute("data-k"), v = b.getAttribute("data-v");
    st.set[k] = (k === "sound") ? (v === "true") : v; save(); if(k === "sound" && st.set.sound) sfx("luck"); render(); return;
  }
  if(a === "kick"){ openMatch("league"); return }
  if(a === "kickcup"){ openMatch("cup"); return }
  if(a === "start"){ startMatch(b.getAttribute("data-w")); return }
  if(a === "pick"){
    var iv = b.getAttribute("data-i"), M = playing && playing.M; if(!M || !M.pause) return;
    S.resolve(M, iv === "auto" ? (M.pause.def || 0) : +iv);
    $("choice").innerHTML = ""; drain(M); tickLoop(); return;
  }
  if(a === "skip"){
    var p = playing; if(!p || !p.M) return; stopTimer(); $("choice").innerHTML = "";
    S.runAll(p.M); finalise(); drain(p.M); endPanel(); return;
  }
  if(a === "skiphl"){ if(playing && playing.finishNow) playing.finishNow(); return }
  if(a === "closem"){ closeMatch(); return }
  if(a === "closeleague"){ closeMatch(); view = "league"; render(); return }
  if(a === "replay"){ replay(b.getAttribute("data-k"), +b.getAttribute("data-i")); return }
  if(a === "rp"){ showAllReplay(b.getAttribute("data-m") === "hl"); return }
  if(a === "pf"){ posFilter = b.getAttribute("data-k"); render(); return }
  if(a === "form"){
    st.formation = b.getAttribute("data-f"); c = ctx();
    st.xi = autoPick(st.formation, c.avail, st.xi.filter(Boolean)); sel = null; save(); render(); return;
  }
  if(a === "auto"){ c = ctx(); st.xi = autoPick(st.formation, c.avail); sel = null; save(); render(); return }
  if(a === "slot"){
    var i = +b.getAttribute("data-i");
    if(sel && sel.player){ place(sel.player, i); sel = null; render(); return }
    sel = (sel && sel.slot === i) ? null : { slot: i }; render(); return;
  }
  if(a === "player"){
    var id = b.getAttribute("data-id");
    if(sel && sel.slot !== undefined){ place(id, sel.slot); sel = null; render(); return }
    sel = (sel && sel.player === id) ? null : { player: id }; render(); return;
  }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(wiz.on) wizClose(); else if($("ov").classList.contains("on")) closeMatch();
});
function refresh(){ if(!$("ov").classList.contains("on") && !wiz.on) render() }
window.addEventListener("pageshow", refresh);
window.addEventListener("focus", refresh);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh() });
window.addEventListener("storage", function(e){ if(e.key === ENG) refresh() });

var h0 = (location.hash || "").replace("#", "");
VIEWS.forEach(function(v){ if(v.id === h0) view = h0 });
window.__dugout = { st: function(){ return st }, ctx: ctx, render: render };
render();
if(!st.setup) wizOpen(0, "setup");
})();
</script>
