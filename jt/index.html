<!DOCTYPE html>
<html lang="en-GB" data-motion="lively">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dugout - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=Alfa+Slab+One&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jt/dugout.css?v=12">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="club" id="clubbox"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot"><button class="btn" data-act="help">How to play</button><a href="/">Back to the Base 5 home page</a></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">The Dugout</h1>
      <div class="pills" id="pills"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="wiz" role="dialog" aria-modal="true" aria-label="Set up your club"><div class="match" id="wizbox"></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Match day"><div class="match" id="match"></div></div>
<div class="ov" id="ed" role="dialog" aria-modal="true" aria-label="Player editor"><div class="match" id="edbox"></div></div>
<div class="ov" id="rv" role="dialog" aria-modal="true" aria-label="New signing"><div class="rvbox" id="rvbox"></div></div>
<div class="ov" id="lo" role="dialog" aria-modal="true" aria-label="Short activity"><div class="lobox" id="lobox"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/jt/sim.js?v=12"></script>
<script src="/data/send.js"></script>
<script src="/jt/learn.js?v=12"></script>
<script src="/jt/dugout.js?v=12"></script>
</body>
</html>
