<!DOCTYPE html>
<html lang="en-GB" data-motion="lively">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dugout - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The Dugout v3. A proper manager game: club colours run through everything,
   matches are played out on a live pitch, and there are cards, badges and trophies.
   Lively by default. The Calm switch (top right, always there) turns every
   animation off, and nothing ever flashes. */
:root{
  --bg:#080d1d; --bg2:#0d1430; --panel:#111a35; --panel2:#18244a; --line:#26365e;
  --ink:#eef2fb; --mute:#9fb0d0; --gold:#f0cf6a; --blue:#86b0f0; --plum:#c0aef0;
  --win:#5fd49a; --draw:#e8c35a; --loss:#ef7b7b;
  --k1:#0c3b27; --k2:#74c9a0; --kt:#ffffff;
  --accent:var(--k2); --accent-ink:#0a1020;
  --disp:"Archivo",system-ui,Arial,sans-serif; --body:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--k1) 55%,transparent),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.15;font-weight:800}
h2{font-size:1.4rem}
h3{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
h4{font-size:1.05rem}
p{margin:0 0 .7em}
.mute,.hint{color:var(--mute)}
.hint{font-size:.95rem}
b,strong{font-weight:700}
html[data-motion="calm"] *,html[data-motion="calm"] *::before,html[data-motion="calm"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* frame */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,color-mix(in srgb,var(--k1) 70%,#05081a),#070b19 70%);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;overflow:auto}
.club{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 6px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.club b{font-family:var(--disp);font-weight:900;font-size:1.25rem;line-height:1.05}
.club small{display:block;color:var(--mute);font-size:.84rem;margin-top:2px}
.kitbar{display:flex;height:6px;border-radius:4px;overflow:hidden;width:100%}
.kitbar i{flex:1}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:11px 12px;text-align:left;font-weight:700;color:var(--mute);position:relative}
.nav button svg{width:21px;height:21px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.nav button[aria-current="page"] .dot{background:var(--accent-ink)}
.side .foot{margin-top:auto;font-size:.88rem;color:var(--mute);display:flex;flex-direction:column;gap:8px}
main{padding:22px 28px 60px;min-width:0;max-width:1100px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:900;letter-spacing:-.01em}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.9rem;color:var(--ink)}
.pill b{color:var(--gold)}
button.pill:hover{border-color:var(--accent)}
button.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
#view{animation:viewin .28s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.stack{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-weight:700;background:var(--panel2);color:var(--ink);transition:transform .15s,border-color .15s,filter .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn-go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn-go:hover{filter:brightness(1.07)}
.btn-big{font-size:1.15rem;padding:15px 30px;border-radius:14px;font-family:var(--disp);font-weight:800;letter-spacing:.02em}
.btn-quiet{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hide{display:none!important}
.eyebrow{font-family:var(--disp);font-weight:800;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.ch{background:rgba(8,13,29,.7);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:var(--disp)}

details.fold{background:var(--panel);border:1px solid var(--line);border-radius:16px}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 20px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Show";color:var(--mute);font-weight:400;font-size:.9rem}
details.fold[open]>summary::after{content:"Hide"}
details.fold>.in{padding:0 20px 18px}

/* hero: the matchday poster */
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid color-mix(in srgb,var(--k2) 50%,var(--line));min-height:350px;background:#070b19;isolation:isolate}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .fg{padding:20px 24px 24px;background:linear-gradient(180deg,rgba(7,11,25,.15) 0%,rgba(7,11,25,.55) 45%,rgba(7,11,25,.92) 100%);min-height:350px;display:flex;flex-direction:column;gap:14px}
.vs3{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:auto 0 0}
.vs3 .tm{display:flex;flex-direction:column;align-items:center;gap:6px}
.vs3 .tm h2{font-size:clamp(1.15rem,3vw,1.9rem);font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.vs3 .tm span.sub{font-size:.86rem;color:#c9d6f0}
.vs3 .vsm{font-family:var(--disp);font-weight:900;font-size:clamp(1.4rem,4vw,2.3rem);color:var(--gold);letter-spacing:.06em}
.vs3 svg.cr{width:clamp(64px,12vw,104px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.duels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.duel{background:rgba(8,13,29,.72);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;font-size:.88rem;display:flex;gap:8px;align-items:center}
.duel b{font-family:var(--disp);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.duel.ok b{color:var(--win)}.duel.mid b{color:var(--draw)}.duel.hard b{color:var(--loss)}
.cta{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.cta p{margin:0;color:#d4def3;max-width:46ch;text-align:center}
.ribbon{background:var(--gold);color:#2a2008;font-family:var(--disp);font-weight:900;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;border-radius:6px;padding:3px 10px}
html[data-motion="lively"] .ready .btn-go{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000),0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}50%{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000),0 0 0 12px color-mix(in srgb,var(--accent) 0%,transparent)}}
html[data-motion="lively"] .fl{animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.4}to{opacity:.62}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.tile .big{font-family:var(--disp);font-weight:900;font-size:2.1rem;line-height:1.05;margin:2px 0}
.tile small{color:var(--mute);display:block}
.tile .dial{width:100%;max-width:130px}
.tile .btn{padding:6px 12px;margin-top:6px}

/* bars, comparisons */
.cmp{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;font-size:.95rem;margin:5px 0}
.cmp .bar{height:10px;background:#0a1226;border-radius:99px;display:flex;overflow:hidden}
.cmp .bar i{display:block;height:100%}
.cmp .a{text-align:right;font-weight:700}
.cmp .lab{text-align:center;color:var(--mute);font-size:.78rem;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.needle{transform-origin:130px 130px}
html[data-motion="lively"] .needle{transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.dial{display:flex;flex-direction:column;align-items:center;flex:none;width:130px}
.dial svg{width:100%}
.dial .num{font-family:var(--disp);font-weight:900;font-size:1.5rem;line-height:1;margin-top:-4px}
.prog{height:12px;background:#0a1226;border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
html[data-motion="lively"] .prog i{transition:width .8s ease}

/* lists */
.stat{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.stat .track{height:10px;background:#0a1226;border-radius:99px;overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat span:last-child{text-align:right;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-family:var(--disp)}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.us td{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:700}
td:first-child,th:first-child{width:34px;text-align:center}
td.tm2{display:flex;align-items:center;gap:8px}
td.tm2 svg{width:18px;height:20px;flex:none}
.tbl-wrap{overflow-x:auto}
td.form,th.form{text-align:left;white-space:nowrap}
.f{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;font-size:.72rem;font-weight:800;border-radius:5px;margin-right:3px;color:#0a1020;font-style:normal;font-family:var(--disp)}
.f.W{background:var(--win)}.f.D{background:var(--draw)}.f.L{background:var(--loss)}
.resline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.resline:last-child{border:0}
.res{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;font-weight:800;color:#0a1020;font-family:var(--disp)}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}

/* squad: pitch */
.formrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.formrow button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;text-align:left;font-family:var(--disp)}
.formrow button small{display:block;color:var(--mute);font-weight:400;font-size:.78rem;font-family:var(--body)}
.formrow button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:2px solid #b8dcc6;
  background:repeating-linear-gradient(180deg,#2d7a54 0 12.5%,#276c4a 12.5% 25%)}
.pitch::before{content:"";position:absolute;inset:3% 4%;border:2px solid rgba(255,255,255,.45);border-radius:4px}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .half{position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(255,255,255,.45)}
.pitch .box1,.pitch .box2{position:absolute;left:30%;right:30%;height:14%;border:2px solid rgba(255,255,255,.45)}
.pitch .box1{top:3%;border-top:0}.pitch .box2{bottom:3%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);z-index:2;width:90px;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0}
.slot svg{width:50px;height:47px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));transition:transform .15s}
.slot:hover svg{transform:translateY(-3px) scale(1.06)}
.slot span{font-size:.74rem;font-weight:800;background:rgba(7,11,25,.82);border-radius:6px;padding:0 6px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.slot.sel svg{filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 7px var(--gold))}
.slot.sel span{background:var(--gold);color:#2a2008}
.slot.off svg{opacity:.78}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.strip div{background:#0a1226;border-radius:12px;padding:8px;text-align:center;border-bottom:3px solid var(--accent)}
.strip b{display:block;font-family:var(--disp);font-size:1.45rem;font-weight:900}
.strip small{color:var(--mute);font-size:.74rem;letter-spacing:.1em;font-family:var(--disp);font-weight:800}
.strip em{font-style:normal;color:var(--gold);font-size:.78rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* player cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;max-height:640px;overflow:auto;padding:4px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid transparent;border-radius:16px 16px 22px 22px;padding:8px 8px 10px;color:#14120a;min-height:190px;transition:transform .18s,box-shadow .18s;width:100%}
.pcard.t-bronze{background:linear-gradient(160deg,#e3b08a,#a9683b)}
.pcard.t-silver{background:linear-gradient(160deg,#eef2f8,#aab6c8)}
.pcard.t-gold{background:linear-gradient(160deg,#fbe9a0,#d4a93a)}
.pcard.t-icon{background:linear-gradient(150deg,#b9f0ff,#c5a6ff 50%,#ffd7a8);}
.pcard:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 12px 24px rgba(0,0,0,.4)}
.pcard.sel{border-color:#fff;box-shadow:0 0 0 3px var(--gold),0 12px 24px rgba(0,0,0,.4)}
.pcard .rt{position:absolute;left:10px;top:6px;display:flex;flex-direction:column;align-items:center;font-family:var(--disp);font-weight:900;font-size:1.55rem;line-height:1}
.pcard .rt small{font-size:.66rem;letter-spacing:.1em;font-weight:800}
.pcard .av{margin-top:6px}
.pcard .nm{font-family:var(--disp);font-weight:900;font-size:.95rem;line-height:1.1;margin-top:2px}
.pcard .nt{font-size:.72rem;line-height:1.2;margin-top:3px;opacity:.82}
.pcard .gr{font-size:.7rem;font-weight:800;margin-top:auto;padding-top:5px;font-family:var(--disp);letter-spacing:.04em}
.pcard .inx{position:absolute;right:8px;top:8px;background:#0a1226;color:var(--accent);font-size:.6rem;font-weight:800;letter-spacing:.1em;border-radius:5px;padding:1px 6px;font-family:var(--disp)}
.pcard.locked{background:repeating-linear-gradient(135deg,#17213f 0 8px,#141c38 8px 16px);color:var(--mute);border:2px dashed var(--line);justify-content:center;gap:6px}
.pcard.locked:hover{transform:none;box-shadow:none}
.pcard.locked b{color:var(--ink)}
.pcard.mini{min-height:0;width:170px;padding-bottom:12px}

/* training */
.tgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-top:5px solid var(--sc,var(--accent));border-radius:16px;padding:14px 16px 16px;transition:transform .18s}
.tcard:hover{transform:translateY(-3px)}
.tcard h4{font-size:1.1rem;font-weight:800}
.tcard .pil{font-size:.74rem;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-family:var(--disp);font-weight:800}
.pips{display:flex;gap:5px;margin:2px 0}
.pips i{width:100%;max-width:30px;height:9px;border-radius:5px;background:#0a1226}
.pips i.on{background:var(--sc,var(--accent))}
.tcard .btn{margin-top:auto;text-align:center;text-decoration:none;display:block}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;flex-wrap:wrap;gap:6px;border-left:6px solid var(--sc);padding-left:12px}
.group-h:first-of-type{margin-top:10px}
.group-h b{font-family:var(--disp);font-size:1.25rem;font-weight:900}
.try{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* league extras */
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;position:relative}
.bn.won{border-color:var(--win)}.bn.lost{border-color:var(--loss)}.bn.next{border-color:var(--gold)}
.bn svg{width:34px;height:38px}
.bn b{display:block;font-family:var(--disp);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bn span{display:block;font-weight:700;font-size:.92rem;line-height:1.2}
.bn em{font-style:normal;font-size:.82rem;color:var(--mute)}
.scorer{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.scorer:last-child{border:0}
.scorer .n{font-family:var(--disp);font-weight:900;font-size:1.3rem;color:var(--gold)}

/* badges and trophies */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.bd{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.bd svg{width:46px;height:46px;flex:none}
.bd b{display:block;font-family:var(--disp);font-weight:800;line-height:1.1}
.bd small{color:var(--mute);line-height:1.2;display:block;margin-top:2px}
.bd.off{opacity:.55}
.bd.off svg{filter:grayscale(1)}
.bd.new{border-color:var(--gold)}
.cabinet{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cab{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px}
.cab svg{width:70px;height:80px}
.cab.off svg{opacity:.35}
.sumgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sumgrid div{background:#0a1226;border-radius:12px;padding:10px 6px;text-align:center}
.sumgrid b{display:block;font-family:var(--disp);font-size:1.5rem;font-weight:900}
.sumgrid small{color:var(--mute);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-family:var(--disp);font-weight:800}

/* inbox, settings, send */
.msg{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px}
.msg.unread{border-color:var(--gold)}

/* overlays */

/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:linear-gradient(180deg,#0a1226,#0d1733);border:1px solid var(--line);border-radius:16px;padding:10px 14px}

@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}

/* the live pitch */
.lp{position:relative;margin:12px 0 4px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:2px solid #b8dcc6;
  background:repeating-linear-gradient(90deg,#2d7a54 0 10%,#276c4a 10% 20%)}
.lp .ln{position:absolute;border:2px solid rgba(255,255,255,.5)}
.lp .ln.out{inset:3% 2%;border-radius:4px}
.lp .ln.mid{left:50%;top:3%;bottom:3%;width:0;border-width:0 0 0 2px}
.lp .ln.cc{left:50%;top:50%;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.lp .ln.bl{left:2%;top:22%;bottom:22%;width:14%;border-left:0}
.lp .ln.br{right:2%;top:22%;bottom:22%;width:14%;border-right:0}
.lp .gl,.lp .gr{position:absolute;top:40%;bottom:40%;width:1.6%;background:rgba(255,255,255,.85)}
.lp .gl{left:.4%}.lp .gr{right:.4%}

html[data-motion="lively"] .ball{transition:left .38s ease-in,top .38s ease-in}
.gb{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:6;text-align:center;background:rgba(7,11,25,.88);border:2px solid var(--gold);border-radius:16px;padding:8px 22px;min-width:200px}
.gb b{display:block;font-family:var(--disp);font-weight:900;font-size:clamp(1.4rem,4vw,2.2rem);color:var(--gold);letter-spacing:.06em}
.gb.op b{color:var(--mute)}.gb.op{border-color:var(--line)}

.gb em{display:block;font-style:normal;font-size:.85rem;color:var(--gold)}
html[data-motion="lively"] .gb{animation:gbin .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes gbin{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.cf{position:absolute;top:-10px;width:8px;height:12px;z-index:7;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(520deg);opacity:0}}
.pres{height:8px;border-radius:99px;overflow:hidden;margin:6px 0 4px}

.plab{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:var(--disp);font-weight:800}

.feed{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;margin-top:10px}
.ev{display:grid;grid-template-columns:48px 1fr;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 12px;border-left:4px solid var(--line)}

.ev.goal{border-left-color:var(--gold)}
.ev.goal.us{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}

.tag{display:inline-block;background:var(--gold);color:#2a2008;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:800;margin-right:6px;font-family:var(--disp);letter-spacing:.06em}

.motm{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px 14px;margin:10px 0}
.motm b{font-family:var(--disp);font-size:1.15rem}
.rts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}

/* reveal */
.rvbox{margin:auto;text-align:center;max-width:420px;padding:10px}

.wzdots{display:flex;gap:8px;align-items:center;margin:0 0 8px}

.swatches,.crests{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}

.wzprev{display:flex;align-items:center;gap:14px;background:#0a1226;border-radius:14px;padding:12px 16px;margin:8px 0 14px;flex-wrap:wrap}
.wzprev .nm{font-family:var(--disp);font-weight:900;font-size:1.4rem;line-height:1.1}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 14px}
.how div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how b.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--disp);margin-right:8px}

.drow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;margin:6px 0;padding:8px 10px;border-radius:10px;border:2px solid transparent;width:100%;background:none;text-align:left}

.drow .track{height:12px;background:var(--panel);border-radius:99px;overflow:hidden;margin-top:5px}
.drow .track i{display:block;height:100%;background:var(--accent)}
.drow b.w{text-align:right;color:var(--gold)}
.wzfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.moments{margin:10px 0 0;padding:0;list-style:none;font-size:.95rem}
.moments li{padding:5px 0;border-bottom:1px solid var(--line)}
.pp{font-weight:800;font-size:.76rem;text-align:center;border-radius:6px;padding:3px 8px;color:#0a1020;font-family:var(--disp)}
.pp.GK{background:var(--plum)}.pp.DEF{background:var(--blue)}.pp.MID{background:var(--gold)}.pp.FWD{background:var(--loss)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);overflow:visible}
  .side .club,.side .foot{display:none}
  .nav{flex-direction:row;width:100%;gap:2px;justify-content:space-between}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.7rem;flex:1;text-align:center;align-items:center;min-width:0}
  .nav .dot{position:absolute;top:4px;right:8px;margin:0}
  main{padding:16px 14px 100px}
  .row2,.lineup,.how,.demo,.cabinet{grid-template-columns:1fr}
  .s7,.s5{grid-column:span 12}
  .tiles{grid-template-columns:1fr 1fr}
  .bracket{grid-template-columns:1fr 1fr}
  .sumgrid{grid-template-columns:repeat(3,1fr)}
  .stat{grid-template-columns:110px 1fr 44px}
  .slot{width:64px}.slot svg{width:40px;height:38px}.slot span{font-size:.66rem;max-width:64px}
  .card{padding:16px}
  .hero .fg{padding:16px}
  table.lg th:nth-child(4),table.lg td:nth-child(4),table.lg th:nth-child(5),table.lg td:nth-child(5),table.lg th:nth-child(6),table.lg td:nth-child(6){display:none}
  .match{padding:14px}
  .sb{padding:8px 10px;gap:6px}
  .sb .t svg{display:none}
  .sb .t{font-size:.86rem}
  .sb .mid{min-width:84px}
  .plab span:first-child,.plab span:last-child{display:none}
  .plab{justify-content:center}
  .gb{min-width:0;padding:4px 14px;top:5%}
  .gb b{font-size:1.15rem}
  .gb span{font-size:.85rem}
  .feed{max-height:220px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="club" id="clubbox"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot"><button class="btn" data-act="help">How to play</button><a href="/">Back to the Base 5 home page</a></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">The Dugout</h1>
      <div class="pills" id="pills"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="wiz" role="dialog" aria-modal="true" aria-label="Set up your club"><div class="match" id="wizbox"></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Match day"><div class="match" id="match"></div></div>
<div class="ov" id="rv" role="dialog" aria-modal="true" aria-label="New signing"><div class="rvbox" id="rvbox"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/jt/sim.js"></script>
<script src="/data/send.js"></script>
<script>
(function(){

  home: '<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" fill="currentColor"/>',

  train: '<path d="M3 9h3v6H3zM18 9h3v6h-3zM6 11h12v2H6zM1 11h2v2H1zM21 11h2v2h-2z" fill="currentColor"/>',
  league: '<path d="M5 3h14v4a5 5 0 0 1-4 4.9V15h3v3H6v-3h3v-3.1A5 5 0 0 1 5 7zM3 4h2v3H3zM19 4h2v3h-2zM6 19h12v2H6z" fill="currentColor"/>',
  club: '<path d="M4 3h16v9c0 5-4 8-8 10-4-2-8-5-8-10z" fill="currentColor"/>',

  send: '<path d="M2 12L22 3l-5 18-5-6-4 4v-6z" fill="currentColor"/>'
};
var VIEWS = [
  { id: "dugout", label: "Dugout", icon: "home", title: "The Dugout" },
  { id: "squad", label: "Squad", icon: "squad", title: "Squad and tactics" },
  { id: "train", label: "Training", icon: "train", title: "Training ground" },
  { id: "league", label: "League", icon: "league", title: "League and cup" },
  { id: "club", label: "Club", icon: "club", title: "Club, badges and trophies" },
  { id: "inbox", label: "Inbox", icon: "inbox", title: "Inbox" },
  { id: "send", label: "Report", icon: "send", title: "Send a report to Jay", hidden: true },
  { id: "settings", label: "Settings", icon: "send", title: "Settings", hidden: true }
];

/* ---------- saved state ---------- */
var mem = null;
function rawLoad(){ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(e){ return mem } }
function save(){ mem = st; try{ localStorage.setItem(KEY, JSON.stringify(st)) }catch(e){} }
function beats(){
  try{ var o = JSON.parse(localStorage.getItem(ENG) || "{}"); return (o && typeof o === "object") ? o : {} }catch(e){ return {} }
}
var st = rawLoad(), firstRun = false, upgraded = false;
if(!st || st.v !== 1 || !st.played){
  firstRun = true;
  st = { v: 1, setup: false, club: null, me: null, seed: 1 + Math.floor(Math.random() * 2000000000), formation: "4-3-3", xi: [], used: [], played: [], inbox: [], trained: {}, unlocked: {}, nid: 1 };
}
if(!st.club) st.club = { name: "Base 5 United", c1: "#0c3b27", c2: "#74c9a0", crest: "bird" };
if(!st.me) st.me = { name: "", pos: "MID", note: "Never gives up" };
if(!st.cup) st.cup = { ties: [], out: false };
if(!st.dev) st.dev = { xp: {}, bonus: {} };
if(!st.set) st.set = { motion: "lively", sound: false, pace: "gentle" };
if(!st.bd) st.bd = {};
if(!st.reveal) st.reveal = [];
if(st.set.ui !== 3){ st.set.ui = 3; if(!firstRun){ st.set.motion = "lively"; upgraded = true } else st.set.motion = "lively" }
function post(title, from, body){
  st.inbox.unshift({ id: st.nid++, title: title, from: from, body: body, read: false });
  if(st.inbox.length > 80) st.inbox.length = 80;
}
if(firstRun) post("Welcome to the dugout", "The Chairman (Jay)", "Your squad is ready and the league is waiting. Pick your team in Squad if you fancy, then have a go at any training session. Each session you try earns a match, and the more you do in it, the better your luck and your players get. There is no rush and no wrong order.");
if(upgraded) post("The dugout has a new look", "The Chairman (Jay)", "Matches now play out on a live pitch, there are player cards, badges and a trophy cabinet. If it ever feels like too much, the Motion button at the top right switches everything to Calm, and it can come back any time.");

function clubName(){ return (st.club.name || "").trim() || "Base 5 United" }
function applyMe(){
  var i, ix = -1;
  for(i = 0; i < S.PLAYERS.length; i++) if(S.PLAYERS[i].id === "me") ix = i;
  var nm = (st.me.name || "").trim();
  if(!nm){ if(ix >= 0) S.PLAYERS.splice(ix, 1); return }
  var pl = { id: "me", name: nm, pos: st.me.pos, r: 70, note: st.me.note + " (your player)" };
  if(ix >= 0) S.PLAYERS[ix] = pl; else S.PLAYERS.push(pl);
}
function applyClub(){ S.setHomeName(clubName()) }
function calm(){ return sysReduce || st.set.motion !== "lively" }
function applyMotion(){ document.documentElement.setAttribute("data-motion", calm() ? "calm" : "lively") }
function lum(hex){ var n = parseInt(hex.replace("#", ""), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 }
function applyKit(){
  var rs = document.documentElement.style;
  rs.setProperty("--k1", st.club.c1); rs.setProperty("--k2", st.club.c2); rs.setProperty("--kt", lum(st.club.c1) > 0.55 ? "#10172a" : "#ffffff");
}
applyMe(); applyClub(); applyMotion(); applyKit();
var view = "dugout", sel = null, posFilter = "ALL", folds = {}, newB = [];

/* ---------- derived numbers ---------- */
function bonusOf(id){ return (st.dev.bonus && st.dev.bonus[id]) || 0 }
function rate(p){ return p.r + bonusOf(p.id) }
function ctx(){
  var tr = S.training(beats());
  var avail = S.PLAYERS.filter(function(p){ return !p.fp || tr.fp >= p.fp });
  return { tr: tr, avail: avail };
}
function autoPick(form, avail, prefer){
  var F = S.FORMATIONS[form], pairs = [], i, j, xi = [], used = {}, slotDone = {};

    var keeper = null; for(i = 0; i < p.tk.length; i++) if(p.tk[i].s !== e.side && p.tk[i].i === 0) keeper = p.tk[i];
    var saved = e.k === "chance" && /save|keeper|gloves|palm|stop|tip|grab|claw|block|beat|denied/i.test(e.text);
    var fx, fy;
    if(e.k === "goal"){ fx = gx; fy = 46 + (hash(e.who + e.m) % 9) }
    else if(saved && keeper){ fx = keeper.x; fy = keeper.y }

    '<div class="mbtns"><button class="btn btn-go" data-act="closem">Back to the dugout</button><button class="btn" data-act="closeleague">See the table</button></div></div>';
  if(won && !p.replay) confetti($("finbox"));
  var b = $("fin").querySelector("button"); if(b) b.focus();
  try{ $("fin").scrollIntoView({ block: "center" }) }catch(e){}
}
function ratingsFor(ev, ours, our, win, ga, salt){
  var out = {}, list = [];
  our.players.forEach(function(q){ if(q.id) out[q.name] = { n: q.name, id: q.id, pos: q.pos, v: 6 + (hash(q.name + salt) % 7) / 10 - 0.3 + (win ? 0.3 : 0) } });
  ev.forEach(function(e){ if(e.side !== ours) return; var r = out[e.who]; if(!r) return; if(e.k === "goal") r.v += 1.3; else if(e.k === "chance") r.v += 0.2 });
  if(ga === 0) our.players.forEach(function(q){ var r = out[q.name]; if(!r) return; if(q.pos === "GK") r.v += 0.8; else if(q.pos === "DEF") r.v += 0.4 });
  Object.keys(out).forEach(function(k){ out[k].v = Math.round(clamp(out[k].v, 5, 9.9) * 10) / 10; list.push(out[k]) });
  list.sort(function(a, b){ return b.v - a.v });
  return list.slice(0, 3);
}
function finalise(){
  var p = playing, M = p.M; if(p.finalised) return; p.finalised = true;
  var ours = p.ourS, entry, our = ours === "h" ? p.home : p.away;
  var wonM = M.winner === ours, gAgainst = ours === "h" ? M.as : M.hs;
  var rt = ratingsFor(M.events, ours, our, wonM, gAgainst, p.opp + ":" + p.round);
  if(p.kind === "cup"){
    entry = { k: p.round, opp: p.opp, home: p.hm, hs: M.hs, as: M.as, events: M.events, pens: M.pens, won: wonM, rt: rt };
    st.cup.ties.push(entry); if(!wonM) st.cup.out = true;
    post((wonM ? "Cup win: " : "Cup exit: ") + CUP_NAMES[p.round], "Match report", (wonM ? "Through after " : "Out after ") + ourGoals(entry) + " to " + theirGoals(entry) + (M.pens ? " and penalties" : "") + " against " + S.CLUBS[p.opp - 1].name + ".");
    if(wonM && p.round === 3) post("Cup winners!", "The Chairman (Jay)", "You have won the cup. A brilliant run, manager.");
  } else {
    var before = posOf(S.table(st.seed, st.played));
    entry = { round: p.round, opp: p.opp, home: p.hm, hs: M.hs, as: M.as, events: M.events, slug: p.tok.slug, luck: Math.round(p.c.tr.luck * 100), rt: rt };
    st.played.push(entry); st.used.push(p.tok.slug);
    p.mv = { before: before, after: posOf(S.table(st.seed, st.played)) };
    var o = S.CLUBS[p.opp - 1].name, g = ourGoals(entry), a = theirGoals(entry), x = resultOf(entry);
    var luckN = M.events.filter(function(e){ return e.k === "luck" || e.lucky }).length;
    post((x === "W" ? "Win" : (x === "D" ? "Draw" : "Defeat")) + ": " + g + " to " + a + " against " + o, "Match report",
      (x === "W" ? "A good day. " : (x === "D" ? "A point to take away. " : "Not our day, and that is football. ")) +
      (rt.length ? "Player of the match: " + rt[0].n + ". " : "") +
      (luckN ? "The luck dial helped " + luckN + (luckN === 1 ? " time" : " times") + ". " : "The luck dial did not need to step in. ") +
      "Earned by your " + (actBy(p.tok.slug) ? actBy(p.tok.slug).title : "training") + " session.");
    if(st.played.length === ROUNDS){
      var pos = posOf(S.table(st.seed, st.played));
      var imp0 = improved();
      post(pos === 1 ? "League champions!" : "Season finished: " + ord(pos), "The Chairman (Jay)", (pos === 1 ? "Top of the league after fifteen matches. Outrageous. Well played, manager." : "Fifteen matches played and you finished " + ord(pos) + ".") + (imp0 ? " Most improved player: " + imp0.name + "." : ""));
    }
  }
  var grew = [], byName = {}, gain = {};
  our.players.forEach(function(q){ if(q.id){ byName[q.name] = q.id; gain[q.id] = (gain[q.id] || 0) + 1 } });
  M.events.forEach(function(e){ if(e.k === "goal" && e.side === ours && byName[e.who]) gain[byName[e.who]] += 2 });
  Object.keys(gain).forEach(function(id){
    var xp = (st.dev.xp[id] || 0) + gain[id]; st.dev.xp[id] = xp;
    var nb = Math.min(6, Math.floor(xp / 4)), old = bonusOf(id);
    if(nb > old){ st.dev.bonus[id] = nb; var pl = S.playerById(id); if(pl) grew.push(pl.name + " (now " + (pl.r + nb) + ")") }
  });
  if(grew.length) post("Players improving", "Coaching staff", "Match time is making players better: " + grew.join(", ") + ".");
  p.growth = grew; p.entry = entry; save();
}
function replay(kind, i){
  var m = kind === "cup" ? st.cup.ties[i] : st.played[i]; if(!m) return;
  var ours = ourSide(m), opp = S.CLUBS[m.opp - 1].name;
  var rep = { hname: m.home ? clubName() : opp, aname: m.home ? opp : clubName(), k: m.k };
  var win = m.pens ? (m.won ? ours : (ours === "h" ? "a" : "h")) : (m.hs > m.as ? "h" : (m.as > m.hs ? "a" : ""));
  playing = { replay: true, kind: kind === "cup" ? "cup" : "league", round: -1, ourS: ours, rep: rep, entry: m, M: { events: m.events, hs: m.hs, as: m.as, pens: m.pens, winner: win }, shown: 0, sh: 0, sa: 0, finalised: true, growth: [] };
  $("ov").classList.add("on");
  $("match").innerHTML = '<div class="mhead"><h2>Match report</h2><button class="btn" id="skipb" data-act="skiphl">Skip</button></div>' + sbHtml({ hn: rep.hname, an: rep.aname, ourS: ours, oppId: m.opp, clk: "" }) + '<div class="mbtns" style="margin:12px 0 8px"><button class="btn" data-act="rp" data-m="full">Full report</button><button class="btn" data-act="rp" data-m="hl">Highlights</button></div><div class="feed" id="feed"></div><div id="fin"></div>';
  showAllReplay(false);
}
function showAllReplay(hl){
  var p = playing; stopTimer();
  $("feed").innerHTML = ""; p.sh = 0; p.sa = 0; $("sh").textContent = 0; $("sa").textContent = 0; $("fin").innerHTML = "";
  var sk = $("skipb"); if(sk) sk.classList.remove("hide");
  showAll(p.M.events, hl);
}

/* ---------- set up your club, then how to play ---------- */
var wiz = { on: false, step: 0, mode: "setup", timer: null, demo: null };
var SWATCH = [["#0c3b27","#74c9a0"],["#1f3b7a","#e6c86a"],["#7a1f2b","#ffffff"],["#4a1f7a","#e6c86a"],["#151b26","#e39a9a"],["#0b5a73","#ffffff"],["#6a4410","#ffe3b0"],["#1b1b6b","#79e0c9"]];
var CRESTS = ["bird","star","bolt","ball"];
var TRAITS = ["Never gives up","Fast and fearless","Calm under pressure","Scores when it matters","Reads the game","Keeps the ball"];
var POSN = { GK: "Goalkeeper", DEF: "Defender", MID: "Midfielder", FWD: "Forward" };
function wizOpen(step, mode){
  wiz.on = true; wiz.step = step; wiz.mode = mode;
  $("wiz").classList.add("on"); wizDraw();
  var f = $("wizbox").querySelector("input,button"); if(f) try{ f.focus() }catch(e){}
}
function wizStop(){ if(wiz.timer){ clearInterval(wiz.timer); wiz.timer = null } }
function wizClose(){
  wizStop(); wiz.on = false; $("wiz").classList.remove("on");
  applyMe(); applyClub(); st.setup = true; save(); render();
}
function demoNumbers(){
  var opp = S.clubTeam(0), pool = S.PLAYERS.filter(function(p){ return !p.fp });
  var xi = autoPick(st.formation, pool), N = 30, out = [], i;
  var levels = [["No sessions yet", 0], ["One go at every session", 1], ["Lots of doing in every session", 4]], sample = null;
  levels.forEach(function(L){
    var b = {}; S.ACTS.forEach(function(a){ b[a.slug] = { n: L[1] } });
    var tr = S.training(b), team = S.buildTeam(st.formation, xi, tr.boost, tr.luck), w = 0;
    for(i = 0; i < N; i++){
      var r = S.simulate(team, opp, 5000 + i * 17, { our: "h", interactive: true });
      if(r.hs > r.as) w++;
      var ln = r.events.filter(function(e){ return e.k === "luck" || e.lucky }).length;
      if(L[1] === 4 && !sample && ln >= 2 && r.hs > r.as) sample = r.events.filter(function(e){ return e.k === "goal" || e.k === "luck" }).slice(0, 6);
    }
    out.push({ label: L[0], luck: tr.luck, w: w, N: N });
  });
  return { rows: out, sample: sample || [] };
}
function wizDemoSet(i){
  var D = wiz.demo; if(!D) return;
  var box = $("wizbox"), r = D.rows[i], nd = box.querySelector(".needle"), nm = $("wznum");
  if(nd) nd.style.transform = "rotate(" + (-90 + 180 * r.luck) + "deg)";
  if(nm) nm.textContent = Math.round(r.luck * 100) + "%";
  var rows = box.querySelectorAll(".drow"); for(var k = 0; k < rows.length; k++) rows[k].classList.toggle("on", k === i);
}
function wizDraw(){
  if(!wiz.on) return;
  wizStop();
  var box = $("wizbox"), step = wiz.step, h = "", last = step === 3, full = wiz.mode !== "help";
  var titles = ["Name your club", "Build your player", "Pick your side", "How to play"];
  if(full) h += '<div class="wzdots" aria-label="Step ' + (step + 1) + ' of 4">' + [0,1,2,3].map(function(i){ return '<i class="' + (i <= step ? "on" : "") + '"></i>' }).join("") + '</div>';
  h += '<div class="mhead"><h2>' + titles[step] + '</h2>' + (full ? '<button class="btn btn-quiet" data-act="wzclose">' + (last ? "Close" : "Skip for now") + '</button>' : '') + '</div>';
  if(step === 0){
    h += '<p class="hint">You are the manager. Make the club yours. The whole game takes on your colours. You can change any of this later.</p>' +
      '<label class="sendlab" for="wzname">Club name</label><br><input class="wzin" id="wzname" maxlength="24" value="' + esc(st.club.name) + '" placeholder="Base 5 United">' +
      '<h3 style="margin-top:16px">Kit colours</h3><div class="swatches">' + SWATCH.map(function(sw, i){
        return '<button class="swatch" data-act="wzcol" data-i="' + i + '" aria-pressed="' + (st.club.c1 === sw[0] && st.club.c2 === sw[1]) + '" aria-label="Colour set ' + (i + 1) + '" style="background:' + sw[0] + '"><i style="background:' + sw[1] + '"></i></button>';
      }).join("") + '</div><h3>Badge</h3><div class="crests">' + CRESTS.map(function(k){
        var keep = st.club.crest; st.club.crest = k; var svg = crestSvg(40, true); st.club.crest = keep;
        return '<button data-act="wzcrest" data-k="' + k + '" aria-pressed="' + (keep === k) + '" aria-label="Badge ' + k + '">' + svg + '</button>';
      }).join("") + '</div><div class="wzprev">' + crestSvg(54, true) + '<div style="width:62px">' + shirt(st.club.c1, st.club.c2, "10") + '</div><div><div class="nm" id="wzshow">' + esc(clubName()) + '</div><span class="hint">Your club</span></div></div>';
  } else if(step === 1){
    var prev = { id: "me", name: (st.me.name || "").trim() || "Your player", pos: st.me.pos, r: 70, note: st.me.note };
    h += '<p class="hint">Make a player of your own. They join the squad rated 70, a touch better than the rest to start with. Made up names work well. You can skip this too.</p>' +
      '<label class="sendlab" for="wzpl">Player name</label><br><input class="wzin" id="wzpl" maxlength="22" value="' + esc(st.me.name) + '" placeholder="e.g. Rocket Rory">' +
      '<h3 style="margin-top:16px">Position</h3><div class="opts">' + ["GK","DEF","MID","FWD"].map(function(k){ return '<button data-act="wzpos" data-k="' + k + '" aria-pressed="' + (st.me.pos === k) + '">' + POSN[k] + '</button>' }).join("") + '</div>' +
      '<h3>Their style</h3><div class="opts">' + TRAITS.map(function(k, i){ return '<button data-act="wztrait" data-i="' + i + '" aria-pressed="' + (st.me.note === k) + '">' + k + '</button>' }).join("") + '</div>' +
      '<div class="wzprev" id="wzcard">' + pcard(prev, { tag: "div", mini: 1 }) + '<div><span class="hint">Your player card. Rated 70.</span></div></div>';
  } else if(step === 2){
    var c = ctx();
    h += '<p class="hint">Choose a formation, then tap a spot and a player card to build your side. Or let the computer pick, then change what you like. There is no wrong answer.</p><div class="grid" style="gap:14px">' + pitchCard(c, "s12") + listCard(c, "s12") + '</div>';
  } else {
    var D = demoNumbers(); wiz.demo = D;
    h += '<div class="how"><div><b class="n">1</b><b>Build your side.</b><br>You can change it any time in Squad.</div>' +
      '<div><b class="n">2</b><b>Try a training session.</b><br>Any one, in any order. Each opens in this tab with a button to bring you back.</div>' +
      '<div><b class="n">3</b><b>Each session earns a match.</b><br>Kick off when you fancy. Watch it live on the pitch, see the highlights, or just the score.</div>' +
      '<div><b class="n">4</b><b>More doing, more luck.</b><br>Every bit of doing turns the luck dial up and sharpens your players.</div>' +
      '<div><b class="n">5</b><b>Make a few choices.</b><br>At half time, and for a free kick, you can decide. Or let the coach decide.</div>' +
      '<div><b class="n">6</b><b>Cards, badges and a cup.</b><br>Players grow, new signings arrive, badges collect in Club, and cup ties unlock.</div></div>' +
      '<h3>See it for yourself</h3><p class="hint">The same side plays the same strong club 30 times. The only thing that changes is how much training has been done. Tap a row to see the dial.</p>' +
      '<div class="demo"><div class="dial">' + dialSvg(D.rows[2].luck) + '<div class="num" id="wznum">' + Math.round(D.rows[2].luck * 100) + '%</div></div><div>' +
      D.rows.map(function(r, i){ return '<button class="drow' + (i === 2 ? " on" : "") + '" data-act="wzdemo" data-i="' + i + '"><span><b>' + r.label + '</b><span class="track" style="display:block"><i style="width:' + (100 * r.w / r.N) + '%"></i></span></span><b class="w">' + r.w + ' wins of ' + r.N + '</b></button>' }).join("") + '</div></div>' +
      (D.sample.length ? '<h3 style="margin-top:16px">A game with lots of training</h3><ul class="moments">' + D.sample.map(function(e){ return '<li><b>' + e.m + "'</b> " + (e.k === "luck" || e.lucky ? '<span class="tag">LUCK</span>' : "") + esc(e.text) + '</li>' }).join("") + '</ul>' : "") +
      '<p class="hint" style="margin-top:10px">Real matches are shuffled by luck, so any single game can go either way. Over a whole season, doing more helps.</p>';
  }

    (last ? '<button class="btn btn-go btn-big" data-act="wzclose">' + (full ? "Start managing" : "Got it") + '</button>' : '<button class="btn btn-go btn-big" data-act="wznext">Next</button>') + '</div>';
  box.innerHTML = h;
  if(step === 3 && !calm()){

document.addEventListener("input", function(e){
  if(e.target.id === "wzname"){ st.club.name = e.target.value; applyClub(); var sh = $("wzshow"); if(sh) sh.textContent = clubName(); save(); renderClub() }
  if(e.target.id === "wzpl"){
    st.me.name = e.target.value; save();
    var wc = $("wzcard"); if(wc) wc.firstChild.outerHTML = pcard({ id: "me", name: st.me.name.trim() || "Your player", pos: st.me.pos, r: 70, note: st.me.note }, { tag: "div", mini: 1 });
  }
});

/* ---------- clicks ---------- */
function place(pid, slot){
  var j = st.xi.indexOf(pid), old = st.xi[slot];
  if(j >= 0 && j !== slot) st.xi[j] = old || "";
  st.xi[slot] = pid; save();
}
function rvNext(then){
  st.reveal.shift(); save();
  $("rv").classList.remove("on");
  if(then) view = then;
  render();
}
document.addEventListener("toggle", function(e){
  var d = e.target; if(d && d.getAttribute && d.getAttribute("data-f")) folds[d.getAttribute("data-f")] = d.open;
}, true);
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(!b) return;
  var a = b.getAttribute("data-act"), c;
  if(a === "help"){ wizOpen(3, "help"); return }
  if(a === "wzedit"){ wizOpen(0, "edit"); return }
  if(a === "wzclose"){ wizClose(); return }
  if(a === "wzback"){ wiz.step = Math.max(0, wiz.step - 1); wizDraw(); return }
  if(a === "wznext"){
    if(wiz.step === 1){ applyMe(); var cc = ctx(); st.xi = autoPick(st.formation, cc.avail, st.xi.filter(function(id){ return id && id !== "me" }).concat(st.me.name.trim() ? ["me"] : [])); save() }
    wiz.step = Math.min(3, wiz.step + 1); wizDraw(); return;
  }
  if(a === "wzcol"){ var sw = SWATCH[+b.getAttribute("data-i")]; st.club.c1 = sw[0]; st.club.c2 = sw[1]; save(); renderClub(); applyKit(); wizDraw(); return }
  if(a === "wzcrest"){ st.club.crest = b.getAttribute("data-k"); save(); renderClub(); wizDraw(); return }
  if(a === "wzpos"){ st.me.pos = b.getAttribute("data-k"); save(); wizDraw(); return }
  if(a === "wztrait"){ st.me.note = TRAITS[+b.getAttribute("data-i")]; save(); wizDraw(); return }
  if(a === "wzdemo"){ wizDemoSet(+b.getAttribute("data-i")); return }
  if(a === "rvclose"){ rvNext(); return }
  if(a === "rvsquad"){ rvNext("squad"); return }
  if(a === "motion"){ if(sysReduce) return; st.set.motion = calm() ? "lively" : "calm"; save(); render(); return }
  if(a === "view"){ view = b.getAttribute("data-v"); sel = null; try{ history.replaceState(null, "", "#" + view) }catch(er){} render(); window.scrollTo(0, 0); return }
  if(a === "set"){
    var k = b.getAttribute("data-k"), v = b.getAttribute("data-v");
    st.set[k] = (k === "sound") ? (v === "true") : v; save(); if(k === "sound" && st.set.sound) sfx("luck"); render(); return;
  }
  if(a === "kick"){ openMatch("league"); return }
  if(a === "kickcup"){ openMatch("cup"); return }
  if(a === "start"){ startMatch(b.getAttribute("data-w")); return }
  if(a === "pick"){
    var iv = b.getAttribute("data-i"), M = playing && playing.M; if(!M || !M.pause) return;
    S.resolve(M, iv === "auto" ? (M.pause.def || 0) : +iv);
    $("choice").innerHTML = ""; drain(M, true); tickLoop(); return;
  }
  if(a === "skip"){
    var p = playing; if(!p || !p.M) return; stopTimer(); clearTmo(); $("choice").innerHTML = "";
    S.runAll(p.M); finalise(); drain(p.M, false); endPanel(); return;
  }
  if(a === "skiphl"){ if(playing && playing.finishNow) playing.finishNow(); return }
  if(a === "closem"){ closeMatch(); return }
  if(a === "closeleague"){ closeMatch(); view = "league"; render(); return }
  if(a === "replay"){ replay(b.getAttribute("data-k"), +b.getAttribute("data-i")); return }
  if(a === "rp"){ showAllReplay(b.getAttribute("data-m") === "hl"); return }
  if(a === "pf"){ posFilter = b.getAttribute("data-k"); render(); return }
  if(a === "form"){
    st.formation = b.getAttribute("data-f"); c = ctx();
    st.xi = autoPick(st.formation, c.avail, st.xi.filter(Boolean)); sel = null; save(); render(); return;
  }
  if(a === "auto"){ c = ctx(); st.xi = autoPick(st.formation, c.avail); sel = null; save(); render(); return }
  if(a === "slot"){
    var i = +b.getAttribute("data-i");
    if(sel && sel.player){ place(sel.player, i); sel = null; render(); return }
    sel = (sel && sel.slot === i) ? null : { slot: i }; render(); return;
  }
  if(a === "player"){
    var id = b.getAttribute("data-id");
    if(sel && sel.slot !== undefined){ place(id, sel.slot); sel = null; render(); return }
    sel = (sel && sel.player === id) ? null : { player: id }; render(); return;
  }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if($("rv").classList.contains("on")) rvNext();
  else if(wiz.on) wizClose(); else if($("ov").classList.contains("on")) closeMatch();
});
function refresh(){ if(!$("ov").classList.contains("on") && !wiz.on && !$("rv").classList.contains("on")) render() }
window.addEventListener("pageshow", refresh);
window.addEventListener("focus", refresh);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh() });
window.addEventListener("storage", function(e){ if(e.key === ENG) refresh() });

var h0 = (location.hash || "").replace("#", "");
VIEWS.forEach(function(v){ if(v.id === h0) view = h0 });
window.__dugout = { st: function(){ return st }, ctx: ctx, render: render };
if(!st.setup) wizOpen(0, "setup");
render();
})();
