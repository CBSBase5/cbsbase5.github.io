<!DOCTYPE html>
<html lang="en-GB" data-no-home>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board - Base 5</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=12">
<script src="/data/b5site.js?v=8"></script>
<style>
/* Board mode: for the classroom screen. Big, readable from the back, updates itself. */
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 0% 0%,rgba(0,166,201,.22),transparent 60%),radial-gradient(1000px 700px at 100% 100%,rgba(239,119,36,.2),transparent 60%),#0a2f38;color:#fffdf8;overflow:hidden}
body.idle{cursor:none}
.bd{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);grid-template-rows:auto 1fr;gap:2.2vw;height:100vh;box-sizing:border-box;padding:2.4vw 2.8vw}
.bd-top{grid-column:1/-1;display:flex;align-items:center;gap:2vw;flex-wrap:wrap}
.bd-top .mark{display:flex;align-items:center;gap:.7vw;font-family:var(--display);font-variation-settings:"wdth" 118,"wght" 900;font-size:clamp(1rem,1.6vw,1.6rem);letter-spacing:.12em;text-transform:uppercase;color:#7fd3e6}
.bd-date{font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 800;font-size:clamp(1.2rem,2.4vw,2.4rem)}
.bd-clock{margin-left:auto;font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 900;font-size:clamp(2rem,4.6vw,4.6rem);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.bd-full{font:inherit;font-family:var(--display);font-variation-settings:"wght" 800;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:#fffdf8;border:2px solid rgba(255,253,248,.5);border-radius:999px;padding:8px 16px;cursor:pointer}
.bd-full:hover{background:rgba(255,253,248,.12)}
body.idle .bd-full,body.idle .bd-back{opacity:0}
.bd-back{color:#7fd3e6;font-size:.95rem;transition:opacity .3s}
.bd-main{display:flex;flex-direction:column;gap:2vw;min-height:0}
.bd-now{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4vw;border-radius:28px 22px 26px 20px;padding:3vw 3.4vw;border:4px solid #fffdf8;box-shadow:10px 12px 0 rgba(0,0,0,.35);min-height:0}
.bd-now.idlecard{background:rgba(255,253,248,.06);border-style:dashed}
.bd-k{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 800;font-size:clamp(.9rem,1.5vw,1.5rem);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.bd-title{font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:clamp(2.6rem,7.4vw,8rem);line-height:.92;letter-spacing:-.01em}
.bd-line{font-size:clamp(1.1rem,2.1vw,2.1rem);line-height:1.3;max-width:34ch;opacity:.95}
.bd-bar{height:clamp(18px,2.6vw,34px);border-radius:999px;background:rgba(0,0,0,.25);border:3px solid currentColor;overflow:hidden}
.bd-bar i{display:block;height:100%;background:currentColor;border-radius:999px;transition:width 1s linear}
.bd-left{font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 800;font-size:clamp(1.2rem,2.6vw,2.6rem)}
.bd-next{display:flex;align-items:center;gap:1.6vw;border-radius:22px 18px 20px 16px;padding:1.4vw 2vw;background:rgba(255,253,248,.08);border:3px solid rgba(255,253,248,.35)}
.bd-next .bd-k{flex:none}
.bd-next b{font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 900;font-size:clamp(1.4rem,3vw,3rem);line-height:1}
.bd-next span{margin-left:auto;font-family:var(--display);font-variation-settings:"wght" 800;font-size:clamp(1.1rem,2.2vw,2.2rem);font-variant-numeric:tabular-nums}
.bd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55vw;overflow:hidden;min-height:0}
.bd-list li{display:grid;grid-template-columns:5.6em 1fr;gap:.9vw;align-items:center;padding:.6vw 1vw;border-radius:14px;font-size:clamp(.95rem,1.45vw,1.5rem);background:rgba(255,253,248,.05);border-left:8px solid var(--subj,rgba(255,253,248,.25))}
.bd-list li .t{font-family:var(--display);font-variation-settings:"wght" 800;font-variant-numeric:tabular-nums;opacity:.8}
.bd-list li b{font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 800}
.bd-list li.past{opacity:.38}
.bd-list li.on{background:#fffdf8;color:#0a2f38;transform:scale(1.03);box-shadow:4px 5px 0 rgba(0,0,0,.35)}
.bd-cc{margin-top:auto;padding:1vw 1.2vw;border-radius:14px;background:#e0a01f;color:#0a2f38;font-family:var(--display);font-variation-settings:"wght" 800;font-size:clamp(.95rem,1.4vw,1.4rem)}
.bd-side{display:flex;flex-direction:column;gap:1vw;min-height:0}
.bd-side h2{font-size:clamp(1rem,1.6vw,1.6rem);letter-spacing:.14em;text-transform:uppercase;color:#7fd3e6;margin:0}
.bd-shared{margin-top:auto;display:flex;flex-direction:column;gap:.9vw;padding:1.1vw 1.3vw;border-radius:16px;background:rgba(255,253,248,.07);border:2px solid rgba(255,253,248,.25)}
.bd-shared .bd-k{font-size:clamp(.75rem,1.1vw,1.1rem)}
.bd-sh-row{display:flex;align-items:center;gap:1vw;font-family:var(--display);font-variation-settings:"wght" 800;font-size:clamp(.95rem,1.4vw,1.45rem)}
.bd-sh-bar{flex:1;height:clamp(12px,1.4vw,20px);border-radius:999px;background:rgba(0,0,0,.3);border:2px solid rgba(255,253,248,.6);overflow:hidden;display:flex}
.bd-sh-bar i{display:block;height:100%}
.bd-sh-key{display:flex;gap:1.2vw;font-size:clamp(.8rem,1.1vw,1.15rem);opacity:.85}
.bd-cc+.bd-shared{margin-top:0}
@media (max-width:820px){body{overflow:auto}.bd{grid-template-columns:1fr;height:auto}.bd-now{min-height:50vh}}
@media (prefers-reduced-motion:reduce){.bd-bar i{transition:none}}
</style>
</head>
<body>
<div class="bd">
  <div class="bd-top">
    <span class="mark"><svg width="44" height="33" viewBox="0 0 36 27" aria-hidden="true"><path d="M2 21 Q18 3 34 21" fill="none" stroke="#7fd3e6" stroke-width="2.8" stroke-linecap="round"/><line x1="1" y1="24" x2="35" y2="24" stroke="#fffdf8" stroke-width="2.6" stroke-linecap="round"/></svg>Base 5</span>
    <span class="bd-date" id="bdDate"></span>
    <a class="bd-back" href="/">Back to the site</a>
    <button class="bd-full" type="button" id="bdFull">Full screen</button>
    <span class="bd-clock" id="bdClock" aria-live="off"></span>
  </div>
  <div class="bd-main">
    <section class="bd-now" id="bdNow" aria-live="polite"></section>
    <div class="bd-next" id="bdNext" hidden></div>
  </div>
  <aside class="bd-side">
    <h2 id="bdListH">Today</h2>
    <ol class="bd-list" id="bdList"></ol>
    <div class="bd-cc" id="bdCC" hidden></div>
    <div class="bd-shared" id="bdShared" hidden></div>
  </aside>
</div>

<script src="/data/term.js?v=6"></script>
<script>
/* the shared bits, from Jay's sheet: fuel, the big question, check-ins. Hidden if the sheet cannot be reached. */
(function(){
var S = window.B5Site, box = document.getElementById("bdShared");
if(!S || !S.call || !S.syncUrl) return;
var CH = [["yes", "Yes", "#9fd356"], ["no", "No", "#ef7724"], ["depends", "It depends", "#00a6c9"]];
function get(){
  if(S.bridgeDown()) return;
  S.call("board").then(function(o){
    if(!o || !o.ok){ box.hidden = true; return; }
    var f = o.fuel, pct = Math.min(100, Math.round(100 * f.sparks / Math.max(1, f.target))), q = o.bigq.counts, n = 0;
    CH.forEach(function(c){ n += q[c[0]] || 0; });
    box.innerHTML =
      '<span class="bd-k">Time machine fuel</span><div class="bd-sh-row"><div class="bd-sh-bar"><i style="width:' + pct + '%;background:linear-gradient(90deg,#00a6c9,#9fd356,#ffd23f)"></i></div><span>' + (pct >= 100 ? "Full!" : pct + "%") + '</span></div>' +
      (n ? '<span class="bd-k">If we could time travel, should we?</span><div class="bd-sh-row"><div class="bd-sh-bar">' + CH.map(function(c){ var k = q[c[0]] || 0; return k ? '<i style="flex:' + k + ';background:' + c[2] + '"></i>' : ""; }).join("") + '</div></div>' +
        '<div class="bd-sh-key">' + CH.map(function(c){ return '<span style="color:' + c[2] + '">' + c[1] + " " + (q[c[0]] || 0) + '</span>'; }).join("") + '</div>' : "") +
      '<div class="bd-sh-row"><span>Checked in today: ' + o.checkedIn + ' of ' + o.of + '</span></div>';
    box.hidden = false;
  }).catch(function(){ box.hidden = true; });
}
get(); setInterval(get, 180000);
})();
</script>
<script>
(function(){
"use strict";
var T = window.B5TERM;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ?d=2026-11-03&t=10:40 shows any day and time, for planning */
var qd = (location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/) || [])[1];
var qt = (location.search.match(/[?&]t=(\d{1,2}):(\d{2})/) || []);
var started = Date.now();
function now(){
  var d = new Date();
  if(qd){ var p = qd.split("-"); d = new Date(+p[0], +p[1] - 1, +p[2], d.getHours(), d.getMinutes(), d.getSeconds()); }
  if(qt.length){ d.setHours(+qt[1], +qt[2], 0, 0); d = new Date(d.getTime() + (Date.now() - started)); }
  return d;
}
function clock(m){ var h = Math.floor(m / 60), mm = m % 60; return (h > 12 ? h - 12 : h) + ":" + ("0" + mm).slice(-2); }
function leftWords(m){
  if(m <= 1) return "About a minute left";
  if(m < 5) return "A few minutes left";
  if(m < 58) return "About " + (Math.round(m / 5) * 5) + " minutes left";
  var h = Math.floor(m / 60), r = Math.round((m % 60) / 15) * 15;
  if(r === 60){ h++; r = 0; }
  return "About " + (h === 1 ? "an hour" : h + " hours") + (r === 15 ? " and a quarter" : r === 30 ? " and a half" : r === 45 ? " and three quarters" : "") + " left";
}

/* every school day this term */
var all = [];
T.weeks.forEach(function(w){ T.schoolDays(w).forEach(function(k){ all.push({ w: w, k: k, iso: T.iso(T.dateOf(w, k)) }); }); });

function draw(){
  var d = now(), iso = T.iso(d), mins = d.getHours() * 60 + d.getMinutes(), secs = mins * 60 + d.getSeconds();
  $("bdClock").textContent = (d.getHours() % 12 || 12) + ":" + ("0" + d.getMinutes()).slice(-2);
  $("bdDate").textContent = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

  var today = all.filter(function(x){ return x.iso === iso; })[0];
  var nowBox = $("bdNow"), next = $("bdNext"), list = $("bdList");
  if(!today){
    var nd = all.filter(function(x){ return x.iso > iso; })[0];
    nowBox.className = "bd-now idlecard";
    var days = nd ? Math.round((new Date(nd.iso + "T00:00:00") - new Date(iso + "T00:00:00")) / 86400000) : 0;
    nowBox.innerHTML = '<span class="bd-k">Today</span><div class="bd-title">No school today</div>' +
      (nd ? '<p class="bd-line">Next school day: ' + esc(((nd.w.days || {})[nd.k] || {}).title || T.dayNames[nd.k]) + ', ' + esc(T.niceDate(T.dateOf(nd.w, nd.k))) + (days > 1 ? ' (' + days + ' sleeps)' : ' (tomorrow)') + '.</p>' : '<p class="bd-line">That is the half term done.</p>');
    next.hidden = true; list.innerHTML = ""; $("bdListH").textContent = ""; $("bdCC").hidden = true;
    return;
  }
  var w = today.w, dd = (w.days || {})[today.k] || {}, slots = T.timetable[today.k];
  $("bdListH").textContent = dd.title || T.dayNames[today.k];
  list.innerHTML = slots.map(function(s){
    var ses = T.session(s[2], w), a = T.mins(s[0]), b = T.mins(s[1]), sub = T.subjectOf(s[2]);
    var title = s[2] === "trip" && T.tripPlace(dd) ? "Trip: " + T.tripPlace(dd) : ses.title;
    var cls = mins >= b ? "past" : (mins >= a ? "on" : "");
    return '<li class="' + cls + (sub ? ' s-' + sub : '') + '"><span class="t">' + s[0] + '</span><b>' + esc(title) + '</b></li>';
  }).join("");
  if(w.cc){ $("bdCC").hidden = false; $("bdCC").textContent = "CC this week: " + w.cc; } else $("bdCC").hidden = true;

  var cur = slots.filter(function(s){ return mins >= T.mins(s[0]) && mins < T.mins(s[1]); })[0];
  var nxt = slots.filter(function(s){ return T.mins(s[0]) > mins; })[0];
  if(cur){
    var ses = T.session(cur[2], w), sub = T.subjectOf(cur[2]);
    var a = T.mins(cur[0]) * 60, b = T.mins(cur[1]) * 60, pct = Math.max(0, Math.min(100, 100 * (b - secs) / (b - a)));
    var title = cur[2] === "trip" && T.tripPlace(dd) ? T.tripPlace(dd) : ses.title;
    nowBox.className = "bd-now " + (sub ? "subjfill s-" + sub : "idlecard");
    nowBox.innerHTML = '<span class="bd-k">Now, until ' + cur[1] + '</span><div class="bd-title">' + esc(title) + '</div>' +
      (ses.line ? '<p class="bd-line">' + esc(cur[2] === "trip" ? "Out from half ten until two." : ses.line) + '</p>' : '') +
      '<div class="bd-bar" role="img" aria-label="' + leftWords(Math.ceil((b - secs) / 60)) + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="bd-left">' + leftWords(Math.ceil((b - secs) / 60)) + '</div>';
  } else if(nxt){
    nowBox.className = "bd-now idlecard";
    var mLeft = T.mins(nxt[0]) - mins;
    nowBox.innerHTML = '<span class="bd-k">Good morning</span><div class="bd-title">Starting soon</div><p class="bd-line">' +
      esc(T.session(nxt[2], w).title) + ' at ' + nxt[0] + (mLeft < 90 ? '. ' + leftWords(mLeft).replace(" left", " to go") + '.' : '.') + '</p>';
  } else {
    nowBox.className = "bd-now idlecard";
    nowBox.innerHTML = '<span class="bd-k">' + esc(T.dayNames[today.k]) + '</span><div class="bd-title">That is today done</div><p class="bd-line">See you next time.</p>';
  }
  if(nxt && cur){
    var ns = T.session(nxt[2], w), nsub = T.subjectOf(nxt[2]);
    next.hidden = false;
    next.className = "bd-next" + (nsub ? " s-" + nsub : "");
    next.style.borderColor = nsub ? "var(--subj)" : "";
    next.innerHTML = '<span class="bd-k">Next</span><b>' + esc(nxt[2] === "trip" && T.tripPlace(dd) ? T.tripPlace(dd) : ns.title) + '</b><span>' + nxt[0] + '</span>';
  } else next.hidden = true;
}
draw(); setInterval(draw, 5000);

/* full screen, and the pointer hides itself when nobody is moving it */
$("bdFull").addEventListener("click", function(){
  var el = document.documentElement;
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
});
document.addEventListener("fullscreenchange", function(){ $("bdFull").textContent = document.fullscreenElement ? "Leave full screen" : "Full screen"; });
var idleT = null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add("idle"); }, 4000); }
["mousemove", "keydown", "touchstart"].forEach(function(e){ document.addEventListener(e, wake, { passive: true }); });
wake();
})();
</script>
</body>
</html>
