<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13235b">
<title>Time Travel TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/data/b5site.js?v=7"></script>
<!--
  Time Travel TV: Base vs Base
  A game show hook for the Autumn 2 question "If we could time travel, should we?".
  Jay hosts on the board: watch an advert, guess when it was made, spot the
  persuasion tricks, then rate it and put it in the tier list.

  The adverts are NOT on the website. They load from Jay's own copies:
    - on the live site, Host > Load the adverts, once per device (kept on that device)
    - or, opened from a folder, from assets/adverts/ad01.mp4 ... ad12.mp4 next to this page
  Each advert has its own volume setting (measured), so none of them jumps out louder.

  Saves on this device under b5.ttv.v1. Leaderboard: showscore / showboard in the
  Base 5 shared memory (teacher/sync/base5-sheet.gs.txt). Everything works without it.
  ASCII only.
-->
<style>
:root{
  --paper:#fef8f4;--sand:#f3e6d6;--ink:#1f2a37;--soft:#5b6472;--teal:#007291;--teal2:#00586f;
  --orange:#ef7724;--orange2:#b9560f;--yellow:#ffc93c;--plum:#7b3f8c;--leaf:#4f9a6a;
  --night:#0e1740;--night2:#1a2a6c;--bulb:#ffe08a;--glow:0 0 18px rgba(255,214,110,.75);
  --r:22px 12px 24px 14px;
  font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;color:var(--ink)
}
*{box-sizing:border-box}
html{font-size:clamp(15px,1vw + 7px,24px)}
body{margin:0;min-height:100vh;color:#fff;overflow-x:hidden;
  background:
    radial-gradient(ellipse 40% 60% at 18% -8%,rgba(255,214,110,.28),transparent 70%),
    radial-gradient(ellipse 40% 60% at 82% -8%,rgba(124,201,221,.28),transparent 70%),
    radial-gradient(ellipse 80% 30% at 50% 108%,rgba(239,119,36,.35),transparent 70%),
    linear-gradient(#0b1336,#14205a 60%,#0b1336)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(100deg,transparent 0 140px,rgba(255,231,155,.04) 140px 200px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
h1,h2,h3{font-family:Archivo,'Arial Black',Arial,sans-serif;font-weight:900;margin:0;line-height:1}
p{margin:0 0 .6em;line-height:1.45}
.hidden{display:none!important}
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:10px 16px 100px}
.disp{font-family:Archivo,'Arial Black',sans-serif;font-weight:900}

/* top: marquee sign and icon nav */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 0 12px}
.back{justify-self:start;display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:.8rem;border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px}
.sign{position:relative;display:flex;align-items:center;gap:12px;padding:10px 22px;border-radius:18px;background:linear-gradient(#2a1f14,#1a120b);border:4px solid #6b4a2a;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sign:before{content:"";position:absolute;inset:5px;border-radius:12px;background:radial-gradient(circle,var(--bulb) 0 2.6px,transparent 3.2px) 0 0/16px 16px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;animation:chase 1.2s steps(2) infinite;opacity:.9}
@keyframes chase{50%{background-position:8px 0}}
.sign .tv{width:2.8rem;height:2.8rem;cursor:pointer;transform:rotate(-8deg);flex:0 0 auto}
.sign b{font-family:Archivo,sans-serif;font-weight:900;font-size:1.65rem;letter-spacing:.02em;color:var(--bulb);text-shadow:var(--glow);white-space:nowrap}
.sign small{display:block;font-size:.55rem;letter-spacing:.35em;color:#ffd0a0;font-weight:700}
.nav{justify-self:end;display:flex;gap:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;width:3.6rem;padding:6px 2px;border-radius:14px;color:#dfe6ff;font-size:.6rem;font-weight:700;letter-spacing:.04em;border:2px solid transparent}
.nav button svg{width:1.6rem;height:1.6rem}
.nav button[aria-current=true]{background:rgba(255,255,255,.12);border-color:rgba(255,224,138,.6);color:var(--bulb)}

/* scoreboard */
.board-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(#202c63,#141e4c);border:3px solid #33459a;border-radius:18px;padding:8px 14px;margin-bottom:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.plate{font-family:Archivo,sans-serif;font-weight:900;font-size:.85rem;letter-spacing:.14em;background:var(--orange);color:#fff;border-radius:10px;padding:6px 12px;box-shadow:0 3px 0 var(--orange2);cursor:pointer}
.bulbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bulbs i{width:.95rem;height:.95rem;border-radius:50%;background:#2e3a74;box-shadow:inset 0 0 0 2px #3f4f96}
.bulbs i.done{background:var(--bulb);box-shadow:0 0 10px rgba(255,214,110,.9)}
.bulbs i.now{background:#fff;animation:blink 1s infinite}
.bulbs i.off{opacity:.2}
@keyframes blink{50%{opacity:.3}}
.flaps{display:flex;gap:3px;align-items:center}
.flaps span{font-family:Archivo,sans-serif;font-weight:900;font-size:1.35rem;width:1.35em;text-align:center;line-height:1.5;background:linear-gradient(#1b1b1b 50%,#2b2b2b 50%);color:var(--bulb);border-radius:6px;box-shadow:0 2px 0 #000}
.flaps em{font-style:normal;font-size:.65rem;font-weight:700;letter-spacing:.14em;color:#c9d4ff;margin-left:6px}

/* stage */
.stage{position:relative;min-height:60vh}
.cue{display:inline-block;font-family:Archivo,sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.24em;color:var(--night);background:var(--bulb);border-radius:999px;padding:5px 14px;box-shadow:var(--glow)}
.title{font-size:clamp(2.2rem,4.6vw,4.2rem);margin:.25em 0 .35em;text-shadow:4px 5px 0 rgba(0,0,0,.35);letter-spacing:-.02em}
.center{text-align:center}
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px 18px;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.paper + .paper{margin-top:12px}
.label{font-family:Archivo,sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.mid{justify-content:center}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}

/* buttons */
.go{background:var(--orange);color:#fff;font-family:Archivo,sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:.02em;padding:14px 26px;border-radius:999px;box-shadow:0 6px 0 var(--orange2),0 10px 24px rgba(239,119,36,.35);min-height:3.2rem;display:inline-flex;align-items:center;gap:10px}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--orange2)}
.go svg{width:1.3em;height:1.3em}
.alt{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.45);padding:11px 20px;border-radius:999px;font-weight:700;min-height:3rem;display:inline-flex;align-items:center;gap:8px}
.paper .alt{background:#fff;color:var(--ink);border-color:#c9b293}
.quiet{color:#c9d4ff;font-weight:700;padding:10px 14px;min-height:2.8rem;text-decoration:underline;text-underline-offset:4px}
.paper .quiet{color:var(--soft)}
button:disabled{opacity:.5;cursor:default}

/* the TV */
.tv-cab{position:relative;max-width:900px;margin:0 auto;background:linear-gradient(135deg,#8a5a34,#5e3a1f 60%,#4a2c16);border-radius:34px 28px 38px 30px;padding:18px 18px 14px;box-shadow:0 14px 0 #2c1a0c,0 30px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2)}
.tv-cab:before{content:"";position:absolute;left:12%;right:12%;bottom:-34px;height:20px;background:repeating-linear-gradient(90deg,#2c1a0c 0 18px,transparent 18px calc(100% - 18px),#2c1a0c calc(100% - 18px));z-index:-1}
.ant{position:absolute;top:-58px;left:50%;width:150px;height:62px;transform:translateX(-50%);pointer-events:none}
.screen{position:relative;border-radius:28px/22px;overflow:hidden;background:#0a0f1c;aspect-ratio:16/9;display:grid;place-items:center;box-shadow:inset 0 0 0 6px #1d1208,inset 0 0 40px rgba(0,0,0,.8)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.1),transparent 50%);border-radius:inherit}
.screen video{width:100%;height:100%;object-fit:contain;display:block;background:#0a0f1c}
.chan{position:absolute;right:16px;top:12px;font-family:Archivo,sans-serif;font-weight:900;color:#7dff9a;text-shadow:0 0 8px #3dff6a;font-size:1.2rem;letter-spacing:.08em;z-index:2;pointer-events:none}
.playbig{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,15,28,.35);z-index:3}
.playbig span{display:flex;align-items:center;gap:12px;background:var(--bulb);color:var(--night);font-family:Archivo,sans-serif;font-weight:900;font-size:1.4rem;padding:16px 28px;border-radius:999px;box-shadow:var(--glow),0 6px 0 rgba(0,0,0,.35)}
.knobs{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6px 0}
.knob{width:2.4rem;height:2.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9d3b0,#8f6b45);box-shadow:0 3px 0 #2c1a0c;position:relative}
.knob:after{content:"";position:absolute;left:50%;top:4px;width:3px;height:40%;background:#2c1a0c;transform:translateX(-50%)}
.knobs label{display:flex;gap:8px;align-items:center;color:#f5e1c4;font-weight:700;font-size:.75rem;letter-spacing:.1em}
.knobs input[type=range]{accent-color:var(--yellow);width:9rem}
.grille{flex:1;height:2rem;border-radius:8px;background:repeating-linear-gradient(90deg,#3a2414 0 4px,#6b4527 4px 8px)}
.testcard{width:100%;height:100%;display:grid;place-items:center;position:relative;background:linear-gradient(90deg,#c0c0c0 0 14.28%,#c0c000 0 28.57%,#00c0c0 0 42.85%,#00c000 0 57.14%,#c000c0 0 71.42%,#ef7724 0 85.71%,#0000c0 0)}
.testcard .disc{width:46%;aspect-ratio:1;border-radius:50%;background:var(--paper);border:6px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--ink);box-shadow:0 0 0 10px rgba(0,0,0,.25)}
.testcard .disc svg{width:45%;height:auto}
.testcard .disc b{font-family:Archivo,sans-serif;font-size:clamp(1rem,2.4vw,2rem);line-height:1}
.startcab .tv-cab{max-width:min(640px,calc((100vh - 360px) * 1.6))}
.static{width:100%;height:100%;display:grid;place-items:center;text-align:center;color:#fff;padding:20px;background:radial-gradient(circle,#2c3d63,#0a0f1c)}
.static b{font-family:Archivo,sans-serif;font-size:1.6rem;display:block}
.snow{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,#000 1px 3px),repeating-linear-gradient(0deg,#aaa 0 1px,#111 1px 3px);mix-blend-mode:screen}
.snow.on{animation:snow .45s steps(6)}
@keyframes snow{0%,90%{opacity:.85}100%{opacity:0}}
.loadbox{background:var(--paper);color:var(--ink);border:3px dashed var(--orange);border-radius:var(--r);padding:14px 16px;margin:18px auto 0;max-width:900px}
.loadbox input[type=file]{display:none}
.loadbox .go,.loadbox .alt{cursor:pointer}

/* steps on the start screen */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:900px;margin:42px auto 0}
.steps div{text-align:center;font-weight:700;font-size:.85rem;color:#dfe6ff}
.steps svg{width:3rem;height:3rem;display:block;margin:0 auto 6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.nameplate{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:44px}
.nameplate input{font-family:Archivo,sans-serif;font-weight:900;font-size:1.3rem;text-align:center;width:13rem;background:var(--paper);color:var(--ink);border:4px solid var(--bulb);border-radius:14px;padding:10px 12px;box-shadow:var(--glow)}

/* guess */
.chillies{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chillies button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:6.5rem;padding:8px 12px;border-radius:16px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-weight:700}
.chillies button span{display:flex;gap:1px;height:1.8rem;align-items:center}
.chillies button svg{width:1.3rem;height:1.8rem}
.chillies button small{font-size:.65rem;color:#c9d4ff;font-weight:700}
.chillies button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--bulb);box-shadow:var(--glow)}
.chillies button[aria-pressed=true] small{color:var(--soft)}
.dial{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;margin:18px auto 0}
.dial button{position:relative;min-height:6rem;border-radius:20px 14px 22px 14px;color:var(--ink);font-family:Archivo,sans-serif;font-weight:900;font-size:1.5rem;border:4px solid transparent;box-shadow:0 6px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.dial button svg{width:2.2rem;height:2.2rem}
.dial button[aria-pressed=true]{border-color:#fff;transform:translateY(-4px);box-shadow:0 0 0 4px var(--bulb),0 10px 0 rgba(0,0,0,.3)}
.led{display:inline-block;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(4rem,10vw,8rem);letter-spacing:.06em;line-height:1;color:#7dff9a;text-shadow:0 0 14px #3dff6a,0 0 2px #fff;background:#071008;border:6px solid #263a2a;border-radius:20px;padding:10px 26px;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
input.led{width:5.3em;max-width:100%;text-align:center}
input.led::placeholder{color:#1e5a2c;text-shadow:none}
.tunnel{max-width:820px;margin:16px auto 0}
.tunnel input[type=range]{width:100%;height:2.2rem;accent-color:var(--bulb)}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;color:#c9d4ff}
.nudge{display:flex;gap:8px;justify-content:center;margin-top:12px}
.nudge button{min-width:3.6rem;min-height:3rem;border-radius:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);font-weight:900;color:#fff}
.sure{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sure button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.35);font-weight:700;font-size:.85rem;color:#fff}
.sure button b{font-family:Archivo,sans-serif;font-size:1rem;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15)}
.sure button[aria-pressed=true]{background:var(--teal);border-color:#7cc9dd}
.sticky{max-width:520px;margin:14px auto 0;background:#fff3a8;color:var(--ink);padding:14px 16px;transform:rotate(-1.2deg);box-shadow:0 6px 12px rgba(0,0,0,.3);font-weight:700}
.bulbbtn svg{width:1.4em;height:1.4em}

/* reveal: dressed in the advert's own decade */
.era{position:relative;overflow:hidden;border-radius:28px 18px 30px 20px;padding:28px 22px 24px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3);min-height:22rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.era .yr{font-size:clamp(5rem,15vw,11rem);line-height:.9;letter-spacing:-.03em;position:relative}
.era .nm{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;margin-top:8px;position:relative}
.era .fact{max-width:38em;margin:16px auto 0;font-size:1rem;position:relative;padding:12px 16px;border-radius:14px;background:rgba(10,14,30,.82);color:#fff;font-family:'Atkinson Hyperlegible',Arial,sans-serif}
.era .pts{position:relative;display:inline-flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
.era .pts b{background:var(--bulb);color:var(--night);font-family:Archivo,sans-serif;font-size:1.3rem;border-radius:999px;padding:8px 18px;box-shadow:var(--glow)}
.era .pts span{background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.era .tell{position:relative;margin-top:10px;font-size:.88rem;opacity:.95;max-width:34em}
.e1950{background:#2a2a2a;color:#f1ede4;font-family:Georgia,serif}
.e1950:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);filter:contrast(1.2)}
.e1950 .yr{font-family:Georgia,serif;font-style:italic}
.e1960{background:radial-gradient(circle at 15% 25%,#ff8c42 0 70px,transparent 71px),radial-gradient(circle at 85% 70%,#e85d75 0 110px,transparent 111px),radial-gradient(circle at 70% 15%,#7cc9dd 0 50px,transparent 51px),#f4d35e;color:#3a1f5c}
.e1960 .yr{font-family:'Arial Black',Archivo,sans-serif}
.e1970{background:linear-gradient(transparent 62%,#c8571c 62% 70%,#e38a2c 70% 78%,#f3c46b 78% 86%,#7a3b16 86%),#5a2f17;color:#ffcf6b}
.e1970 .yr{font-family:Archivo,sans-serif;font-weight:900;text-shadow:6px 6px 0 #c8571c}
.e1980{background:linear-gradient(#1a0f3d 55%,#3b0f4d),#1a0f3d;color:#fff}
.e1980:before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:45%;background:repeating-linear-gradient(90deg,rgba(44,230,209,.5) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(44,230,209,.5) 0 2px,transparent 2px 40px);transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
.e1980 .yr{font-family:Archivo,sans-serif;font-weight:900;background:linear-gradient(#ffd34f,#ff4fb3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,79,179,.7))}
.e1990{background:#6b2fbf;color:#fff35c;font-family:'Comic Sans MS','Trebuchet MS',sans-serif}
.e1990:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#2ce6d1 25%,transparent 25%) 0 0/60px 60px,linear-gradient(225deg,#ff4fb3 25%,transparent 25%) 0 0/60px 60px;opacity:.25}
.e1990 .yr{font-family:'Comic Sans MS','Trebuchet MS',sans-serif;font-weight:900;text-shadow:5px 5px 0 #ff4fb3;transform:rotate(-3deg)}
.e2000{background:linear-gradient(#5fc3ff,#0a6fd6 60%,#064a9a);color:#fff}
.e2000:before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05))}
.e2000 .yr{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:700;text-shadow:0 4px 10px rgba(0,0,0,.35)}
.e2010{background:linear-gradient(135deg,#fef8f4,#cfe6e3);color:var(--ink)}
.e2010 .yr{font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-weight:400;letter-spacing:.02em}
.e2010 .fact{background:rgba(31,42,55,.85)}
.e2020{background:radial-gradient(circle at 20% 20%,#ff4fb3,transparent 45%),radial-gradient(circle at 80% 80%,#2ce6d1,transparent 45%),#140b2e;color:#fff}
.e2020 .yr{font-family:Archivo,sans-serif;font-weight:900}
.cameo{position:relative;display:inline-block;margin-top:12px;background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:700;font-size:.9rem}

/* tricks */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:900px;margin:18px auto 0}
.trick{background:var(--paper);color:var(--ink);border-radius:18px 12px 20px 12px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.3);border:4px solid transparent;font-weight:700}
.trick:nth-child(odd){transform:rotate(-1deg)}.trick:nth-child(even){transform:rotate(1deg)}
.trick svg{width:3.6rem;height:3.6rem}
.trick[aria-pressed=true]{border-color:var(--bulb);box-shadow:0 0 0 3px var(--orange),var(--glow);transform:translateY(-4px)}
.results{display:grid;gap:10px;max-width:760px;margin:16px auto 0}
.res{display:flex;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.res svg{width:2.6rem;height:2.6rem;flex:0 0 auto}
.res small{display:block;color:var(--soft);font-size:.8rem}
.res .badge{margin-left:auto;font-weight:700;font-size:.78rem;border-radius:999px;padding:5px 11px;white-space:nowrap}
.b-spot{background:var(--yellow);color:var(--ink)}
.b-fair{background:#bfe6da;color:#0b3d33}
.b-not{background:#d7dcea;color:#2a3350}
.res.ghost{background:rgba(255,255,255,.1);color:#fff}
.res.ghost small{color:#c9d4ff}

/* verdict */
.stars{display:flex;gap:10px;justify-content:center}
.stars button{width:4rem;height:4rem;font-size:2.6rem;line-height:1;color:rgba(255,255,255,.35);transition:transform .15s}
.stars button.on{color:var(--bulb);text-shadow:var(--glow);transform:scale(1.08)}
.buzzers{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.buzzers button{width:4.8rem;height:4.8rem;border-radius:50%;font-family:Archivo,sans-serif;font-weight:900;font-size:2rem;color:var(--ink);box-shadow:0 7px 0 rgba(0,0,0,.4),inset 0 -6px 0 rgba(0,0,0,.15),inset 0 6px 0 rgba(255,255,255,.5);border:4px solid #1d1208}
.buzzers button[aria-pressed=true]{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.4),0 0 0 5px var(--bulb),var(--glow)}
.t-S{background:#ffc93c}.t-A{background:#ffdf8f}.t-B{background:#bfe6da}.t-C{background:#c9e2f2}.t-D{background:#ddd5ef}.t-F{background:#e2ddd6}
.cuecard{max-width:620px;margin:26px auto 0;background:#fff;color:var(--ink);border-radius:6px;padding:16px 18px 14px;transform:rotate(1.5deg);box-shadow:0 8px 16px rgba(0,0,0,.35);background-image:repeating-linear-gradient(transparent 0 27px,#cfe2f3 27px 28px);font-size:1.1rem;font-weight:700;line-height:28px}
.cuecard b{display:block;color:var(--orange);font-family:Archivo,sans-serif;letter-spacing:.2em;font-size:.7rem;line-height:1.4;margin-bottom:4px}
textarea.why,.field{width:100%;border:2px solid #c9b293;border-radius:12px;padding:10px 12px;background:#fffdf8;color:var(--ink);font-size:1rem}
textarea.why{min-height:4rem;resize:vertical}
.whybox{max-width:620px;margin:14px auto 0}

/* tier board */
.tierboard{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:3rem 1fr;gap:6px}
.trow>b{display:grid;place-items:center;border-radius:12px 8px 12px 8px;font-family:Archivo,sans-serif;font-weight:900;font-size:1.4rem;color:var(--ink)}
.trow>div{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.1);border-radius:12px;padding:6px;min-height:2.6rem}
.paper .trow>div{background:var(--sand)}
.mini{background:#fff;color:var(--ink);border-radius:10px;padding:4px 9px;font-size:.78rem;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.2)}

/* filed */
.stamp{display:inline-block;margin-top:24px;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(3rem,8vw,6rem);color:var(--bulb);border:8px solid var(--bulb);border-radius:18px;padding:4px 26px;transform:rotate(-8deg);text-shadow:var(--glow);box-shadow:var(--glow)}

/* finale */
.big-score{font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(4.5rem,13vw,9rem);color:var(--bulb);text-shadow:var(--glow),6px 8px 0 rgba(0,0,0,.4);line-height:1}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--paper);color:var(--ink);border-radius:18px 12px 20px 12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.85rem;box-shadow:0 6px 0 rgba(0,0,0,.3);text-align:center}
.tile svg{width:2.6rem;height:2.6rem}
.tile.on{outline:4px solid var(--bulb)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.85rem}

/* archive */
.archive{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.vhs{border-radius:10px;padding:10px;min-height:8.5rem;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.vhs:after{content:"";position:absolute;left:18%;right:18%;bottom:10px;height:1.2rem;border-radius:8px;background:rgba(0,0,0,.18)}
.vhs b{font-family:Archivo,sans-serif;font-size:1.7rem}
.vhs small{font-weight:700;font-size:.78rem;position:relative;z-index:1;margin-bottom:1.6rem}
.vhs.mystery{background:repeating-linear-gradient(45deg,#26305f 0 10px,#1d2650 10px 20px);color:#fff}

/* leaderboard */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;max-width:860px;margin:20px auto 0}
.pod{border-radius:18px 18px 4px 4px;text-align:center;padding:14px 8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:9rem;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.pod .n{font-family:Archivo,sans-serif;font-weight:900;font-size:2.8rem;color:var(--bulb);text-shadow:var(--glow);line-height:1}
.pod b{display:block;margin-top:6px}
.pod small{opacity:.85}
.p1{min-height:14rem;background:linear-gradient(#d9a53a,#9c6d14)}.p2{min-height:11rem;background:#3051ad}.p3{min-height:8.5rem;background:#284494}
.pod.empty{background:rgba(255,255,255,.06);border:3px dashed rgba(255,255,255,.3);box-shadow:none}

/* host */
.lineup{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1rem 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid #eadbc6;border-radius:14px;padding:8px 12px}
.lrow .ok{width:1rem;height:1rem;border-radius:50%;background:#d7dcea}
.lrow .ok.yes{background:var(--leaf)}
.lrow small{display:block;color:var(--soft);font-size:.75rem}
.switch{position:relative;width:3.2rem;height:1.8rem;border-radius:999px;background:#cfd5e2;border:2px solid #9aa4b8}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked=true]{background:var(--teal);border-color:var(--teal2)}
.switch[aria-checked=true]:after{left:1.5rem}
.note{font-size:.82rem;color:var(--soft)}
.preview video{width:100%;aspect-ratio:16/9;background:#0a0f1c;border-radius:12px;display:block}
.paper input[type=range]{accent-color:var(--teal)}
.paper .go{font-size:1rem;padding:11px 20px}

/* maker */
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.maker canvas{width:100%;height:auto;border-radius:16px;box-shadow:0 10px 0 rgba(0,0,0,.3);display:block}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:2px solid #d8c3a5;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.82rem;color:var(--ink)}
.opts button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* send box from /data/send.js */
.sendbox{background:var(--paper);border-radius:var(--r);padding:14px 16px;margin-top:14px;color:var(--ink)}
.sendtitle{font-family:Archivo,sans-serif;font-weight:900;margin:0 0 4px}
.sendwhy{font-size:.82rem;color:var(--soft)}
.sendwho{display:flex;gap:8px;align-items:center;margin:8px 0}
.sendwho input{border:2px solid #c9b293;border-radius:10px;padding:6px 10px;width:7rem}
.sendrow{display:flex;gap:8px;flex-wrap:wrap}
.sendbox .btn{border-radius:12px;padding:9px 14px;font-weight:700;border:2px solid #c9b293;background:#fff;color:var(--ink)}
.sendbox .btn-orange{background:var(--orange);border-color:#c45d14;color:#fff}
.sendmsg{font-size:.85rem;margin:8px 0 0}

/* toast, critters, confetti */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);border-radius:16px 16px 16px 4px;padding:12px 18px;font-weight:700;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 20px rgba(0,0,0,.4)}
.critter{position:fixed;z-index:40;pointer-events:none;width:7rem}
.walk{bottom:8px;left:-8rem;animation:walk 7s linear forwards}
.fly{top:22%;left:-8rem;animation:fly 5s ease-in-out forwards}
@keyframes walk{to{left:calc(100vw + 8rem)}}
@keyframes fly{30%{top:12%}60%{top:28%}to{left:calc(100vw + 8rem);top:10%}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-24px;width:12px;height:20px;border-radius:3px;opacity:.9;animation:fall 2.6s ease-out forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(400deg);opacity:0}}
.reduced *,.reduced *:before,.reduced *:after{animation:none!important;transition:none!important}
.reduced .confetti,.reduced .critter,.reduced .snow{display:none}
.under{text-align:center;margin-top:30px;font-size:.75rem;color:#9fb0e6}

@media (max-width:900px){
  .two,.maker{grid-template-columns:1fr}
  .archive,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{grid-template-columns:1fr;justify-items:center}
  .back,.nav{justify-self:center}
}
@media (max-width:560px){
  .app{padding:8px 10px 100px}
  .sign b{font-size:1.2rem}
  .dial{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .buzzers button{width:3.8rem;height:3.8rem;font-size:1.6rem}
  .stars button{width:3rem;height:3rem;font-size:2rem}
  .tv-cab{padding:10px 10px 8px;border-radius:22px}
  .knobs .knob{display:none}
  .pick{grid-template-columns:1fr}
  .ant{width:100px;top:-40px;height:44px}
}
.print{display:none}
@media print{
  body{background:#fff;color:#111}body:before{display:none}.app,.toast,.critter,.confetti{display:none!important}
  .print{display:block;font:11pt/1.4 Arial,sans-serif;color:#111;padding:10mm}
  .print h1{font-size:24pt}.print h2{font-size:14pt;border-bottom:2px solid #007291;margin-top:14pt}
  .print table{border-collapse:collapse;width:100%;font-size:9pt}.print td,.print th{border:1px solid #999;padding:4px;text-align:left}
  .print .keep{break-inside:avoid}
}

/* ---------- storage (b5site.js swaps this to a tab-only store in guest mode) ---------- */
var KEY = "b5.ttv.v1", mem = null;
function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ return mem; } }
function fresh(){
  return { v:1, base:"Base 5", started:false, step:"start", results:{}, off:{}, cur:blankCur("medium"),
    effects:(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "reduced" : "full",
    vol:0.8, visit:null, skip:null, posted:null, poster:null };
}
function blankCur(level){ return { level:level || "medium", year:1985, decade:null, typed:"", sure:"", clue:false, tech:[], stars:0, tier:"", why:"" }; }
var st = fresh(), saved = load();
if(saved && saved.v === 1){ for(var k in saved) st[k] = saved[k]; if(!st.results || typeof st.results !== "object") st.results = {}; if(!st.off) st.off = {}; if(!st.cur) st.cur = blankCur(); }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(st)); say("savemsg", ""); }
  catch(e){ mem = JSON.parse(JSON.stringify(st)); say("savemsg", "Saving is not working in this browser, so keep this tab open."); }
}
function say(id, t){ var e = document.getElementById(id); if(e) e.textContent = t; }

/* ---------- small helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function adBy(id){ for(var i = 0; i < ADS.length; i++) if(ADS[i].id === id) return ADS[i]; return null; }
function lineup(){ return ORDER.filter(function(id){ return !st.off[id]; }); }
function doneIds(){ return lineup().filter(function(id){ return st.results[id]; }); }
function judged(){ return doneIds().filter(function(id){ return !st.results[id].skipped; }); }
function current(){ var l = lineup(); for(var i = 0; i < l.length; i++) if(!st.results[l[i]]) return adBy(l[i]); return null; }
function roundNo(){ return doneIds().length + 1; }
function total(){ var t = 0; doneIds().forEach(function(id){ t += st.results[id].points || 0; }); return t; }
function isB5(){ return /^base\s*5$/i.test(String(st.base).trim()); }
function yearText(a){ return a.prec === "decade" ? Math.floor(a.year / 10) * 10 + "s" : String(a.year); }
function fmt(n){ return Number(n).toLocaleString("en-GB"); }
function guest(){ return !!(window.B5Site && window.B5Site.guest); }
function canCall(){ return !!(window.B5Site && B5Site.call && B5Site.syncUrl) && !guest(); }

var toastT = null;
function toast(t){
  var e = $(".toast"); if(!e){ e = document.createElement("div"); e.className = "toast"; e.setAttribute("role", "status"); document.body.appendChild(e); }
  e.textContent = t; e.classList.remove("hidden"); clearTimeout(toastT);
  toastT = setTimeout(function(){ e.classList.add("hidden"); }, 4200);
}
function confetti(){
  if(st.effects === "reduced") return "";
  var c = ["#ffc93c", "#fef8f4", "#7cc9dd", "#ef7724", "#bfe6da"], s = '<div class="confetti" aria-hidden="true">';
  for(var i = 0; i < 22; i++) s += '<i style="left:' + (2 + i * 4.4) + '%;background:' + c[i % 5] + ';animation-delay:' + ((i % 7) * .08) + 's"></i>';
  return s + '</div>';
}

/* ---------- scoring ---------- */
function guessValue(c){ return c.level === "mild" ? c.decade : c.year; }
function yearPoints(a, c){
  var L = c.level, g = guessValue(c);
  if(g == null || g === "") return 0;
  if(L === "mild"){ var d = Math.abs(Math.floor(a.year / 10) - Math.floor(g / 10)); return d === 0 ? 60 : d === 1 ? 25 : 0; }
  if(a.prec === "decade"){ var dd = Math.abs(Math.floor(a.year / 10) - Math.floor(g / 10)); return dd === 0 ? LEVELS[L].max : dd === 1 ? (L === "spicy" ? 40 : 35) : 0; }
  var x = Math.abs(a.year - g);
  if(L === "spicy") return x === 0 ? 150 : x <= 1 ? 110 : x <= 3 ? 70 : x <= 6 ? 30 : 0;
  return x === 0 ? 100 : x <= 2 ? 80 : x <= 5 ? 60 : x <= 10 ? 40 : x <= 20 ? 20 : 0;
}
function techPoints(a, picked){
  var p = 0; picked.forEach(function(t){ if(a.focus.indexOf(t) >= 0) p += 30; else if(a.fair.indexOf(t) >= 0) p += 10; });
  return Math.min(60, p);
}
function guessLabel(c){ var g = guessValue(c); return g == null || g === "" ? "No guess" : c.level === "mild" ? g + "s" : String(g); }

/* ---------- the adverts themselves (never on the website) ---------- */
var VID = {}, CACHE = "b5-ttv-adverts-v1";
function cacheKey(id){ return "/__ttv/ad" + pad(id) + ".mp4"; }
function fromCache(id){
  if(VID[id]) return Promise.resolve(VID[id]);
  if(!("caches" in window)) return Promise.resolve(null);
  return caches.open(CACHE).then(function(c){ return c.match(cacheKey(id)); })
    .then(function(r){ return r ? r.blob() : null; })
    .then(function(b){ if(b && b.size){ VID[id] = URL.createObjectURL(b); return VID[id]; } return null; })
    .catch(function(){ return null; });
}
var HAVE = {};
function haveAll(){
  if(!("caches" in window)) return Promise.resolve(HAVE);
  return caches.open(CACHE).then(function(c){ return c.keys(); }).then(function(keys){
    HAVE = {}; keys.forEach(function(r){ var m = /\/__ttv\/ad(\d\d)\.mp4$/.exec(r.url); if(m) HAVE[+m[1]] = 1; }); return HAVE;
  }).catch(function(){ return HAVE; });
}
function loaded(id){ return !!(VID[id] || HAVE[id]); }
function loadedCount(){ var n = 0; ADS.forEach(function(a){ if(loaded(a.id)) n++; }); return n; }
function idFromName(n){ var m = /ad\s*_?0?(\d{1,2})\b[^\/]*\.(mp4|m4v|webm|mov)$/i.exec(n); var id = m ? +m[1] : 0; return id >= 1 && id <= 12 ? id : 0; }
function loadFiles(list, done){
  var files = Array.prototype.slice.call(list || []), got = 0, chain = Promise.resolve(), box = null;
  files.forEach(function(f){
    var id = idFromName(f.name); if(!id) return;
    got++;
    if(VID[id]) try{ URL.revokeObjectURL(VID[id]); }catch(e){}
    VID[id] = URL.createObjectURL(f);
    if("caches" in window) chain = chain.then(function(){
      return caches.open(CACHE).then(function(c){ return c.put(cacheKey(id), new Response(f, { headers:{ "Content-Type": f.type || "video/mp4" } })); }).then(function(){ HAVE[id] = 1; }).catch(function(){ box = "nocache"; });
    });
  });
  if(!got){ toast("Those files did not look like the adverts. They are called ad01.mp4 to ad12.mp4."); return; }
  toast(got + " advert" + (got === 1 ? "" : "s") + " loaded. Saving them on this device...");
  if(done) done(got);
  chain.then(function(){ toast(box ? "Loaded for now. This browser will not keep them, so load them again next time." : "Saved. This device will remember the adverts."); });
}
function forget(){
  HAVE = {};
  if("caches" in window) caches.delete(CACHE).catch(function(){});
  Object.keys(VID).forEach(function(k){ try{ URL.revokeObjectURL(VID[k]); }catch(e){} });
  VID = {};
}
function loaderHtml(why){
  return '<div class="loadbox"><div class="label">The adverts live on the host device</div>' +
    '<p>' + (why || "The adverts are not on the website, so they need loading once on this device. Pick the adverts folder, or select all twelve files (ad01.mp4 to ad12.mp4).") + '</p>' +
    '<div class="row" style="margin-top:6px"><label class="go" style="display:inline-flex;align-items:center;cursor:pointer">Pick the folder<input type="file" data-load webkitdirectory multiple></label>' +
    '<label class="alt" style="display:inline-flex;align-items:center;cursor:pointer">Pick the files<input type="file" data-load accept="video/*" multiple></label></div></div>';
}
function bindLoaders(after){
  $$("input[data-load]").forEach(function(inp){ inp.addEventListener("change", function(){ loadFiles(inp.files, function(){ render(); if(after) after(); }); }); });
}

/* gentle sound: each advert matched in volume, peaks softened, a short fade in */
var AC = null;
function wireSound(v, a){
  var plain = function(){ v.volume = Math.max(0, Math.min(1, a.gain * st.vol)); };
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var isBlob = v.currentSrc ? v.currentSrc.indexOf("blob:") === 0 : String(v.src).indexOf("blob:") === 0;
  if(!Ctx || (location.protocol === "file:" && !isBlob)){ plain(); return; }
  try{
    AC = AC || new Ctx();
    var src = AC.createMediaElementSource(v), g = AC.createGain(), comp = AC.createDynamicsCompressor(), fade = AC.createGain();
    g.gain.value = a.gain; comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; fade.gain.value = 0.0001;
    src.connect(g); g.connect(comp); comp.connect(fade); fade.connect(AC.destination);
    v._fade = fade;
    v.addEventListener("play", function(){
      if(AC.state === "suspended") AC.resume();
      var t = AC.currentTime; fade.gain.cancelScheduledValues(t); fade.gain.setValueAtTime(0.0001, t); fade.gain.linearRampToValueAtTime(Math.max(0.0001, st.vol), t + 0.8);
    });
  }catch(e){ plain(); }
}
function setVol(v){
  st.vol = v; save();
  var el = $("#advert"); if(!el) return;
  if(el._fade && AC) el._fade.gain.setTargetAtTime(Math.max(0.0001, v), AC.currentTime, 0.1);
  else { var a = current(); if(a) el.volume = Math.max(0, Math.min(1, a.gain * v)); }
}
function mountVideo(a){
  var box = $("#screen"); if(!box) return;
  fromCache(a.id).then(function(url){
    var src = url || ("assets/adverts/ad" + pad(a.id) + ".mp4");
    if(!$("#screen")) return;
    box.innerHTML = '<video id="advert" playsinline preload="auto" controls controlslist="nodownload noplaybackrate" disablepictureinpicture aria-label="Mystery advert ' + roundNo() + '"></video>' +
      '<span class="chan">CH ' + pad(roundNo()) + '</span><button type="button" class="playbig" id="playbig" aria-label="Play the advert"><span>&#9654; Play</span></button>';
    snow();
    var v = $("#advert"), big = $("#playbig");
    v.addEventListener("error", function(){
      var mine = src.indexOf("blob:") === 0;
      box.innerHTML = '<div class="static"><div><b>No signal</b>' +
        (mine ? "This browser will not play that video file. Chrome or Edge will." : "This advert is not loaded on this device yet.") + '</div></div>';
      var hold = $("#loadspot"); if(hold && !mine){ hold.innerHTML = loaderHtml(); bindLoaders(); }
    });
    v.addEventListener("loadedmetadata", function(){ if(a.start) v.currentTime = a.start; });
    v.addEventListener("timeupdate", function(){ if(a.end && v.currentTime >= a.end){ v.pause(); v.currentTime = a.start || 0; ended(); } });
    v.addEventListener("ended", ended);
    v.addEventListener("play", function(){ big.classList.add("hidden"); });
    big.addEventListener("click", function(){ v.play().catch(function(){}); });
    v.src = src;
    wireSound(v, a);
    function ended(){ big.querySelector("span").innerHTML = "&#8635; Watch again"; big.classList.remove("hidden"); }
  });
}

  });

      var v = box.querySelector("video");
      v.addEventListener("error", function(){ box.innerHTML = '<p class="note">Not loaded on this device yet.</p>'; });
      v.addEventListener("loadedmetadata", function(){ if(a.start) v.currentTime = a.start; });
      v.volume = Math.max(0, Math.min(1, a.gain * st.vol));
      v.src = url || ("assets/adverts/ad" + pad(a.id) + ".mp4");
      card.scrollIntoView({ behavior:"smooth", block:"center" });
    });
  }); });
  on("unskip", function(){ doneIds().forEach(function(id){ if(st.results[id].skipped) delete st.results[id]; }); if(st.step === "finale") st.step = "start"; save(); render(); toast("Skipped adverts are back in the show."); });
  on("forget", function(){ forget(); render(); toast("The adverts are gone from this device."); });
  var hv = $("#hvol"); if(hv) hv.addEventListener("input", function(){ setVol(+hv.value); });
  on("fx", function(){ st.effects = st.effects === "reduced" ? "full" : "reduced"; save(); render(); });
  on("reset", function(){ $("#resetrow").innerHTML = '<span>Sure? Scores and the tier list on this device go.</span><button type="button" class="alt" id="reset2">Yes, start fresh</button><button type="button" class="quiet" id="reset3">Keep it</button>'; on("reset2", function(){ resetShow(); toast("Fresh show ready."); }); on("reset3", render); });
  /* maker */
  if(display === "make"){
    var p = mk();
    $$("[data-era]").forEach(function(b){ b.addEventListener("click", function(){ p.era = b.dataset.era; save(); render(); }); });
    $$("[data-prod]").forEach(function(b){ b.addEventListener("click", function(){ p.prod = +b.dataset.prod; save(); render(); }); });
    $$("[data-ptrick]").forEach(function(b){ b.addEventListener("click", function(){ var t = b.dataset.ptrick, i = p.tricks.indexOf(t); if(i >= 0) p.tricks.splice(i, 1); else if(p.tricks.length < 2) p.tricks.push(t); else { toast("Two tricks at most. Tap one to swap it."); return; } save(); render(); }); });
    var pn = $("#pname"); pn.addEventListener("input", function(){ p.name = pn.value; save(); drawPoster(); });
    var ps = $("#pslogan"); ps.addEventListener("input", function(){ p.slogan = ps.value; save(); drawPoster(); });
    on("slogan", function(){ var s = SLOGANS[Math.floor(Math.random() * SLOGANS.length)].replace("{p}", PRODUCTS[p.prod].n.toLowerCase()); p.slogan = s; ps.value = s; save(); drawPoster(); });
    on("dlposter", function(){ savePng($("#pc"), "my-advert-" + p.era + ".png"); });
    drawPoster();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawPoster);
    if(window.Base5Send && Base5Send.mountImage) Base5Send.mountImage($("#psend"), { tool:"Time Travel TV advert poster", filename:"advert-poster", getImage:function(){ return $("#pc").toDataURL("image/png"); } });
  }
}
function on(id, fn){ var e = document.getElementById(id); if(e) e.addEventListener("click", fn); }
function finish(skipped){
  var a = current(); if(!a) return;
  var c = st.cur, yp = skipped ? 0 : yearPoints(a, c), tp = skipped ? 0 : techPoints(a, c.tech), max = LEVELS[c.level].max;
  st.results[a.id] = { id:a.id, level:c.level, guess:skipped ? "-" : guessLabel(c), sure:c.sure, tech:skipped ? [] : c.tech.slice(),
    yearPoints:yp, techPoints:tp, points:yp + tp, stars:skipped ? 0 : c.stars, tier:skipped ? "" : c.tier, why:skipped ? "" : c.why,
    skipped:!!skipped, fooled:!skipped && c.sure === "Very sure" && yp < max * 0.4, at:new Date().toISOString() };
  st.lastId = a.id; st.cur = blankCur(c.level);
  step(skipped ? (current() ? "watch" : "finale") : "filed");
}
function resetShow(){ var keep = { off:st.off, vol:st.vol, effects:st.effects, base:st.base, poster:st.poster }; st = fresh(); for(var k in keep) st[k] = keep[k]; save(); display = "game"; render(); }

/* nav */
$$(".nav button").forEach(function(b){ b.addEventListener("click", function(){ if(b.dataset.go === "board") boardMsg = ""; boardData = b.dataset.go === "board" ? null : boardData; go(b.dataset.go); }); });

/* ---------- hidden surprises (never scored) ---------- */
var tvTaps = 0, airTaps = 0;
$("#tvlogo").addEventListener("click", function(){ if(++tvTaps === 4){ tvTaps = 0; critter("bird"); toast(isB5() ? "A bird has got into the studio. Jay is delighted." : "A bird has got into the studio. Nobody knows how."); } });
$("#chip-base").addEventListener("click", function(){ if(++airTaps === 3){ airTaps = 0; critter("dog"); toast(isB5() ? "Executive producer Bonnie has approved this broadcast." : "The studio dog has approved this broadcast."); } });
function critter(kind){
  if(st.effects === "reduced") return;
  var d = document.createElement("div"); d.className = "critter " + (kind === "dog" ? "walk" : "fly"); d.setAttribute("aria-hidden", "true");
  d.innerHTML = kind === "dog"
    ? '<svg viewBox="0 0 120 80"><path d="M20 50q-6-22 14-24h40l10-14q8-4 14 2l6 10q4 8-4 10l-6 2v20h-8l-2-14H44l-4 14h-8l-2-16q-8 0-10 10z" fill="#8a5a3b" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/><circle cx="98" cy="18" r="2.5" fill="#1f2a37"/><path d="M20 50q-10-4-12-14" fill="none" stroke="#1f2a37" stroke-width="4" stroke-linecap="round"/><rect x="40" y="2" width="44" height="18" rx="4" fill="#ffc93c" stroke="#1f2a37" stroke-width="2"/><text x="62" y="15" font-size="10" text-anchor="middle" font-weight="700" fill="#1f2a37">EXEC</text></svg>'
    : '<svg viewBox="0 0 120 80"><path d="M20 44q20-30 40 0 20-30 40 0" fill="none" stroke="#1f2a37" stroke-width="6" stroke-linecap="round"/><ellipse cx="60" cy="46" rx="10" ry="6" fill="#007291"/></svg>';
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 7500);
}

render();
haveAll();
})();
</script>
</body>
