<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#170f3d">
<title>Time Travel TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/data/b5site.js?v=7"></script>
<!--
  Time Travel TV: Base vs Base
  A game show hook for the Autumn 2 question "If we could time travel, should we?".
  Jay hosts on the board: watch an advert, guess when it was made, spot the
  persuasion tricks, then rate it and put it in the tier list.

  The adverts live in /projects/ttv/ad01.mp4 ... ad12.mp4 (shrunk to 720p, sound left as it was).
  The Host desk can load local copies instead, kept on that device (useful with no internet).
  Each advert has its own volume setting (measured), so none of them jumps out louder.

  Saves on this device under b5.ttv.v1. Leaderboard: showscore / showboard in the
  Base 5 shared memory (teacher/sync/base5-sheet.gs.txt). Everything works without it.
  ASCII only.
-->
<style>
:root{
  --studio:#170f3d;--studio2:#241657;--wallc:#110a2c;--gold:#ffcf5a;--gold2:#c9921c;--orange:#ef7724;--orange2:#a8480b;
  --teal:#00a3b8;--teal2:#007291;--paper:#fff4e6;--ink:#1c1530;--mist:#c8c0ef;--k:1;
  font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;color:#fff
}
*{box-sizing:border-box}
html,body{margin:0;background:#0a0620;min-height:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
p{margin:0;line-height:1.45}
h1,h2,h3{margin:0;font-weight:400}
.disp{font-family:Bungee,'Arial Black',Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* outside the set */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;height:52px;position:relative;z-index:20}
.bar a,.bar button{display:inline-flex;align-items:center;gap:8px;color:var(--mist);text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid rgba(200,192,239,.3)}
.bar a:hover,.bar button:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.bar svg{width:20px;height:20px}
.bar .right{display:flex;gap:8px;position:relative}
.menu{position:absolute;right:0;top:46px;background:var(--paper);color:var(--ink);border-radius:18px;padding:8px;min-width:230px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:30}
.menu button{display:flex;width:100%;gap:12px;align-items:center;color:var(--ink);border:0;border-radius:12px;padding:10px 12px;font-size:16px}
.menu button:hover,.menu button[aria-current=true]{background:#ffe2b8}
.menu svg{width:26px;height:26px}

/* the set: drawn at 1600 x 900 and scaled to fit the board */
.fit{position:relative;margin:0 auto}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:26px;
  display:grid;grid-template-rows:92px 548px 1fr;
  background:radial-gradient(ellipse 60% 40% at 50% 0,#3a2385 0,transparent 70%),linear-gradient(#1d1250,#140c38 62%,#0c0724)}
.stage:before,.stage:after{content:"";position:absolute;top:92px;width:520px;height:900px;pointer-events:none;z-index:3;filter:blur(26px);opacity:.22;mix-blend-mode:screen;
  background:linear-gradient(rgba(255,226,150,.9),rgba(255,226,150,0) 85%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.stage:before{left:40px;transform:rotate(-18deg);transform-origin:50% 0}
.stage:after{right:40px;transform:rotate(18deg);transform-origin:50% 0;background:linear-gradient(rgba(140,225,240,.9),rgba(140,225,240,0) 85%)}
.stage.sweep:before{animation:sweepL 2.4s ease-in-out}
.stage.sweep:after{animation:sweepR 2.4s ease-in-out}
@keyframes sweepL{0%{transform:rotate(-18deg)}40%{transform:rotate(14deg);opacity:.75}100%{transform:rotate(-18deg)}}
@keyframes sweepR{0%{transform:rotate(18deg)}40%{transform:rotate(-14deg);opacity:.75}100%{transform:rotate(18deg)}}

/* truss with the team plate, show logo and score */
.truss{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 34px;
  background:linear-gradient(#2a2445,#14102a);border-bottom:4px solid #070414;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.truss:before{content:"";position:absolute;left:0;right:0;bottom:6px;height:10px;background:repeating-linear-gradient(60deg,transparent 0 14px,rgba(255,255,255,.07) 14px 18px)}
.plate{justify-self:start;display:flex;align-items:center;gap:14px}
.plate b{white-space:nowrap;font-family:Bungee,sans-serif;font-weight:400;font-size:26px;background:linear-gradient(#ff9a4d,var(--orange));color:#fff;padding:8px 20px 6px;border-radius:12px;box-shadow:0 5px 0 var(--orange2),inset 0 2px 0 rgba(255,255,255,.4);cursor:default;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:58px;height:58px;transform:rotate(-8deg);cursor:pointer}
.logo span{font-family:Bungee,sans-serif;font-size:34px;color:var(--gold);text-shadow:0 0 18px rgba(255,207,90,.6),0 3px 0 #7a4f00;white-space:nowrap}
.flaps{justify-self:end;display:flex;gap:5px;align-items:center}
.flaps i{font-style:normal;font-family:Bungee,sans-serif;font-size:36px;width:42px;height:56px;display:grid;place-items:center;color:var(--gold);border-radius:8px;
  background:linear-gradient(#262038 49%,#0d0a18 49% 51%,#1c172c 51%);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.12)}
.flaps i.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.flaps small{font-weight:700;color:var(--mist);font-size:14px;margin-left:8px}

/* the LED wall in its bulb frame */
.wallrow{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:14px}
.frame{position:relative;width:1252px;height:500px;padding:16px;border-radius:30px;
  background:radial-gradient(circle,#fff6d6 0 3px,var(--gold) 3.5px 5px,rgba(255,207,90,.25) 6px,transparent 9px) 0 0/28px 28px,linear-gradient(#3b2a12,#24180a);
  box-shadow:0 0 0 4px #120b02,0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(255,207,90,.18)}
.frame.chase{animation:chase .5s steps(2) infinite}
@keyframes chase{50%{background-position:14px 0,0 0}}
.wall{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;color:#fff;
  background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px) 0 0/6px 6px,radial-gradient(ellipse at 50% 30%,#2b1a66,var(--wallc) 75%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
.wall .pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--k)*14px);padding:calc(var(--k)*26px) calc(var(--k)*40px);text-align:center}
.lamps{display:flex;gap:16px;margin-top:12px}
.lamps i{width:18px;height:18px;border-radius:50%;background:#2c2160;box-shadow:inset 0 0 0 3px #3a2d7a}
.lamps i.done{background:var(--gold);box-shadow:0 0 14px rgba(255,207,90,.9),inset 0 -3px 0 rgba(0,0,0,.2)}
.lamps i.now{background:#fff;box-shadow:0 0 14px #fff;animation:pulse 1.2s infinite}
.lamps i.off{opacity:.15}
@keyframes pulse{50%{opacity:.35}}

/* the studio floor, where the controls live */
.floor{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:6px 40px 22px;
  background:radial-gradient(ellipse 50% 60% at 50% 0,rgba(255,207,90,.12),transparent 70%)}
.floor:before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 120px),linear-gradient(#1a1046,#0a0620);transform:perspective(500px) rotateX(38deg);transform-origin:top;opacity:.9}
.controls{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}

/* buttons */
.press{font-family:Bungee,sans-serif;font-size:calc(var(--k)*28px);color:#fff;padding:calc(var(--k)*18px) calc(var(--k)*38px) calc(var(--k)*14px);border-radius:999px;
  background:radial-gradient(ellipse at 50% 20%,#ffb27a,var(--orange) 55%,#c4580f);box-shadow:0 calc(var(--k)*9px) 0 var(--orange2),0 calc(var(--k)*16px) 34px rgba(239,119,36,.35),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.press:active{transform:translateY(calc(var(--k)*6px));box-shadow:0 calc(var(--k)*3px) 0 var(--orange2)}
.press.gold{background:radial-gradient(ellipse at 50% 20%,#fff0b8,var(--gold) 55%,#d9a12a);color:var(--ink);text-shadow:none;box-shadow:0 calc(var(--k)*9px) 0 #8a6110,0 16px 34px rgba(255,207,90,.3),inset 0 2px 0 rgba(255,255,255,.6)}
.ghost{color:#fff;font-weight:700;font-size:calc(var(--k)*20px);padding:calc(var(--k)*12px) calc(var(--k)*22px);border-radius:999px;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:inline-flex;align-items:center;gap:10px}
.ghost:hover{border-color:#fff}
.ghost svg{width:1.3em;height:1.3em}
.link{color:var(--mist);font-weight:700;font-size:calc(var(--k)*18px);text-decoration:underline;text-underline-offset:5px;padding:10px}
.link:hover{color:#fff}

/* wall type */
.big{font-family:Bungee,sans-serif;font-size:calc(var(--k)*64px);line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.huge{font-family:Bungee,sans-serif;font-size:calc(var(--k)*150px);line-height:.9;color:var(--gold);text-shadow:0 0 30px rgba(255,207,90,.45),0 8px 0 #6b4300}
.sub{font-size:calc(var(--k)*22px);color:var(--mist);font-weight:700}
.chip{display:inline-block;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 16px;font-weight:700;font-size:calc(var(--k)*18px);color:#fff}

/* attract screen */
.attract{background:radial-gradient(circle at 50% 120%,rgba(239,119,36,.45),transparent 60%),repeating-conic-gradient(from 0deg at 50% 115%,rgba(255,207,90,.10) 0 6deg,transparent 6deg 12deg)}
.attract .logo-big{display:flex;flex-direction:column;align-items:center;gap:6px}
.attract .logo-big svg{width:calc(var(--k)*150px);height:calc(var(--k)*150px);filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.attract .logo-big h1{font-family:Bungee,sans-serif;font-size:calc(var(--k)*110px);line-height:.95;color:var(--gold);text-shadow:0 0 34px rgba(255,207,90,.5),0 8px 0 #6b4300}
.attract .logo-big p{font-size:calc(var(--k)*24px);color:#fff;font-weight:700}
.intro .logo-big{animation:drop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{0%{transform:translateY(-120%) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.nameplate{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 8px 8px 22px}
.nameplate label{font-weight:700;color:var(--mist);font-size:calc(var(--k)*18px)}
.nameplate input{font-family:Bungee,sans-serif;font-size:calc(var(--k)*26px);text-align:center;width:calc(var(--k)*300px);max-width:60vw;background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:calc(var(--k)*10px) 16px calc(var(--k)*6px)}

/* round title card */
.card-title{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:repeating-linear-gradient(115deg,#ef7724 0 80px,#f28a3c 80px 160px);animation:cardout .5s ease-in 1.5s forwards}
.card-title .big{font-size:calc(var(--k)*140px);color:#fff;text-shadow:0 10px 0 var(--orange2)}
.card-title .sub{color:#fff3e0;font-size:calc(var(--k)*28px)}
.card-title > *{animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{transform:scale(2.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes cardout{to{transform:translateY(-100%)}}

/* the advert */
.wall video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.wall .scan{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px)}
.playbtn{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(10,6,32,.35)}
.playbtn span{width:calc(var(--k)*140px);height:calc(var(--k)*140px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#fff0b8,var(--gold) 60%,#d9a12a);box-shadow:0 10px 0 #8a6110,0 0 40px rgba(255,207,90,.6)}
.playbtn svg{width:46%;height:46%;margin-left:8%}
.vol{display:flex;align-items:center;gap:10px;color:var(--mist);font-weight:700;font-size:calc(var(--k)*16px)}
.vol input{accent-color:var(--gold);width:calc(var(--k)*200px)}
.nosignal{background:repeating-radial-gradient(circle at 30% 30%,#2a2a3a 0 1px,#111 1px 3px)}
.loader{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 22px;max-width:760px;text-align:left}
.loader p{margin-bottom:12px}
.loader input{display:none}
.loader label{cursor:pointer}
.loader .press{font-size:20px;padding:12px 24px 9px}

/* guess */
.answer{font-family:Bungee,sans-serif;font-size:calc(var(--k)*170px);line-height:1;color:#7dffa6;text-shadow:0 0 22px rgba(61,255,120,.7),0 0 2px #fff;letter-spacing:.04em;min-height:1em}
.answer.empty{color:rgba(125,255,166,.25);text-shadow:none}
.cluenote{background:#fff59d;color:var(--ink);font-weight:700;font-size:calc(var(--k)*22px);padding:14px 20px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 10px 18px rgba(0,0,0,.4);max-width:720px}
.heat{display:flex;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px}
.heat button{display:flex;align-items:center;gap:4px;border-radius:999px;padding:8px 14px;font-weight:700;font-size:calc(var(--k)*17px);color:var(--mist)}
.heat button svg{width:calc(var(--k)*16px);height:calc(var(--k)*24px)}
.heat button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.keys{display:flex;gap:12px}
.key{width:calc(var(--k)*132px);height:calc(var(--k)*104px);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-family:Bungee,sans-serif;font-size:calc(var(--k)*24px);
  box-shadow:0 calc(var(--k)*8px) 0 rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.6),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .08s}
.key svg{width:calc(var(--k)*40px);height:calc(var(--k)*40px)}
.key[aria-pressed=true]{transform:translateY(calc(var(--k)*6px));box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 0 5px var(--gold),0 0 30px rgba(255,207,90,.6)}
.slider{width:min(1100px,100%);display:flex;align-items:center;gap:14px}
.slider input{flex:1;height:44px;accent-color:var(--gold)}
.nud{min-width:calc(var(--k)*70px);height:calc(var(--k)*56px);border-radius:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);font-family:Bungee,sans-serif;font-size:calc(var(--k)*20px);color:#fff}
.pad{display:grid;grid-template-columns:repeat(6,calc(var(--k)*92px));gap:10px}
.pad button{height:calc(var(--k)*66px);border-radius:14px;background:linear-gradient(#3a2d7a,#261c58);font-family:Bungee,sans-serif;font-size:calc(var(--k)*30px);color:#fff;box-shadow:0 6px 0 #120b33,inset 0 2px 0 rgba(255,255,255,.15)}
.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 #120b33}
.pad .wide{grid-column:span 1;font-size:calc(var(--k)*18px)}
.sure{display:flex;gap:8px}
.sure button{border-radius:999px;padding:8px 16px;font-weight:700;font-size:calc(var(--k)*17px);color:var(--mist);border:2px solid rgba(200,192,239,.3)}
.sure button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}

/* reveal */
.reels{display:flex;gap:calc(var(--k)*10px)}
.reel{width:calc(var(--k)*130px);height:calc(var(--k)*170px);overflow:hidden;border-radius:16px;background:linear-gradient(#0d0820,#231a4d 50%,#0d0820);box-shadow:inset 0 0 0 4px rgba(255,255,255,.08),0 8px 0 rgba(0,0,0,.4)}
.reel span{display:block;font-family:Bungee,sans-serif;font-size:calc(var(--k)*130px);line-height:calc(var(--k)*170px);text-align:center;color:var(--gold);text-shadow:0 0 20px rgba(255,207,90,.6)}
.reel .strip{transition:transform 1.4s cubic-bezier(.15,.85,.3,1.02)}
.reel.s{width:calc(var(--k)*80px)}
.reel.s span,.lc{font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-weight:700;text-transform:none}
.revealed .lead-in{display:none}
.lead-in{font-family:Bungee,sans-serif;font-size:calc(var(--k)*34px);color:#fff}
.after{display:none}
.revealed .after{display:block;animation:rise .5s both}
.revealed .row.after{display:flex}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.ptsbig{font-family:Bungee,sans-serif;font-size:calc(var(--k)*40px);background:var(--gold);color:var(--ink);border-radius:999px;padding:8px 26px 4px;box-shadow:0 0 30px rgba(255,207,90,.6)}
.factbox{background:rgba(8,5,24,.82);color:#fff;border-radius:16px;padding:12px 20px;font-size:calc(var(--k)*21px);max-width:980px;line-height:1.4}
.factbox b{color:var(--gold)}
.ad-name{font-family:Bungee,sans-serif;font-size:calc(var(--k)*26px)}
.applause{display:none;font-family:Bungee,sans-serif;font-size:calc(var(--k)*24px);color:#3a0a0a;background:#ffb08a;padding:6px 18px 2px;border-radius:8px;box-shadow:0 0 0 4px #5a2a12,0 0 30px rgba(255,140,90,.8)}
.applause.on{display:inline-block;animation:pulse .5s 4}

/* decade dress for the reveal */
.e1950{background:#262626;color:#f1ede4}
.e1950:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.e1950 .reel span,.e1950 .ad-name{font-family:Georgia,serif;font-style:italic;color:#f1ede4;text-shadow:none}
.e1960{background:radial-gradient(circle at 12% 22%,#ff8c42 0 90px,transparent 91px),radial-gradient(circle at 88% 74%,#e85d75 0 140px,transparent 141px),radial-gradient(circle at 74% 14%,#7cc9dd 0 60px,transparent 61px),#f4d35e;color:#3a1f5c}
.e1960 .reel span{color:#3a1f5c;text-shadow:none}
.e1970{background:linear-gradient(transparent 70%,#c8571c 70% 76%,#e38a2c 76% 82%,#f3c46b 82% 88%,#7a3b16 88%),#5a2f17}
.e1970 .reel span{color:#ffcf6b;text-shadow:6px 6px 0 #c8571c}
.e1980{background:linear-gradient(#1a0f3d 52%,#3b0f4d)}
.e1980:before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:46%;background:repeating-linear-gradient(90deg,rgba(44,230,209,.55) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(44,230,209,.55) 0 2px,transparent 2px 40px);transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
.e1980 .reel span{color:#ff6fc4;text-shadow:0 0 20px #ff4fb3}
.e1990{background:linear-gradient(135deg,rgba(44,230,209,.3) 25%,transparent 25%) 0 0/70px 70px,linear-gradient(225deg,rgba(255,79,179,.3) 25%,transparent 25%) 0 0/70px 70px,#6b2fbf}
.e1990 .reel span{color:#fff35c;text-shadow:5px 5px 0 #ff4fb3;font-family:'Comic Sans MS','Trebuchet MS',sans-serif;font-weight:900}
.e2000{background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 45%),linear-gradient(#5fc3ff,#0a6fd6 60%,#064a9a)}
.e2000 .reel span{color:#fff;font-family:'Trebuchet MS',Arial,sans-serif;font-weight:700;text-shadow:0 4px 10px rgba(0,0,0,.35)}
.e2010{background:linear-gradient(135deg,#fff4e6,#cfe6e3);color:var(--ink)}
.e2010 .reel span{color:var(--ink);font-family:'Atkinson Hyperlegible',Arial,sans-serif;text-shadow:none}
.e2010 .sub{color:#4a4660}
.e2020{background:radial-gradient(circle at 20% 20%,#ff4fb3,transparent 45%),radial-gradient(circle at 80% 80%,#2ce6d1,transparent 45%),#140b2e}
.wall[class*=" e"] .reel{background:rgba(0,0,0,.18);box-shadow:none}
.wall[class*=" e"] .chip{background:rgba(10,6,32,.82);color:#fff}
.wall{transition:background .6s}

/* tricks */
.cards{display:grid;grid-template-columns:repeat(6,calc(var(--k)*172px));gap:14px}
.trick{height:calc(var(--k)*196px);perspective:900px}
.trick .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.trick .f,.trick .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center;font-weight:700;font-size:calc(var(--k)*19px);line-height:1.2}
.trick .f{background:var(--paper);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.4)}
.trick .f svg{width:calc(var(--k)*72px);height:calc(var(--k)*72px)}
.trick .b svg{width:calc(var(--k)*40px);height:calc(var(--k)*40px)}
.trick .b{transform:rotateY(180deg);box-shadow:0 8px 0 rgba(0,0,0,.4)}
.trick .b small{font-weight:400;font-size:calc(var(--k)*14px);line-height:1.25}
.trick .b b{font-family:Bungee,sans-serif;font-weight:400;font-size:calc(var(--k)*20px)}
.trick[aria-pressed=true] .f{box-shadow:0 0 0 6px var(--gold),0 0 30px rgba(255,207,90,.6);transform:translateY(-8px)}
.trick.flipped .in{transform:rotateY(180deg)}
.v-spot .b{background:var(--gold);color:var(--ink)}
.v-fair .b{background:#9fe0cf;color:#0b3d33}
.v-not .b{background:#d7d3ea;color:#2a2550}
.v-main .b{background:var(--paper);color:var(--ink);box-shadow:0 0 0 5px var(--gold)}
.trickhint{font-size:calc(var(--k)*20px);color:var(--mist);font-weight:700}

/* verdict */
.stars{display:flex;gap:calc(var(--k)*10px)}
.stars button{font-size:calc(var(--k)*96px);line-height:1;color:rgba(255,255,255,.18);transition:transform .15s,color .15s}
.stars button.on{color:var(--gold);text-shadow:0 0 26px rgba(255,207,90,.8);transform:scale(1.06)}
.cuecard{background:#fff;color:var(--ink);border-radius:6px;padding:14px 22px 12px;transform:rotate(1.4deg);box-shadow:0 10px 20px rgba(0,0,0,.4);font-size:calc(var(--k)*24px);font-weight:700;max-width:820px;line-height:32px;
  background-image:linear-gradient(90deg,transparent 40px,#f3b3b3 40px 42px,transparent 42px),repeating-linear-gradient(transparent 0 31px,#cfe2f3 31px 32px);padding-left:58px}
.whyline{width:min(820px,100%)}
.whyline textarea{width:100%;height:calc(var(--k)*70px);border:0;border-radius:14px;padding:12px 16px;background:rgba(255,255,255,.92);color:var(--ink);font-size:calc(var(--k)*18px);resize:none}
.buzzers{display:flex;gap:calc(var(--k)*20px)}
.buzz{width:calc(var(--k)*108px);height:calc(var(--k)*108px);border-radius:50%;font-family:Bungee,sans-serif;font-size:calc(var(--k)*46px);color:var(--ink);position:relative;
  box-shadow:0 calc(var(--k)*12px) 0 #1a1230,0 0 0 calc(var(--k)*8px) #2b2350,inset 0 -8px 0 rgba(0,0,0,.18),inset 0 8px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s}
.buzz[aria-pressed=true]{transform:translateY(calc(var(--k)*9px));box-shadow:0 3px 0 #1a1230,0 0 0 calc(var(--k)*8px) var(--gold),0 0 40px rgba(255,207,90,.8),inset 0 -4px 0 rgba(0,0,0,.18)}
.t-S{background:#ffcf3c}.t-A{background:#ffe08f}.t-B{background:#9fe0cf}.t-C{background:#a9d4f0}.t-D{background:#cdc3f0}.t-F{background:#e0dbd4}
.tiername{font-weight:700;color:var(--mist);min-height:1.4em;font-size:calc(var(--k)*18px)}

/* tier board on the wall */
.tierboard{width:min(1080px,100%);display:grid;gap:7px}
.trow{display:grid;grid-template-columns:calc(var(--k)*64px) 1fr;gap:8px}
.trow b{display:grid;place-items:center;border-radius:10px;font-family:Bungee,sans-serif;font-weight:400;font-size:calc(var(--k)*28px);color:var(--ink);height:calc(var(--k)*58px)}
.trow div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 8px;min-height:calc(var(--k)*58px)}
.tape{background:#1d1d24;color:#fff;border-radius:6px;padding:7px 12px;font-weight:700;font-size:calc(var(--k)*16px);border-left:8px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.tape.new{animation:slidein .7s cubic-bezier(.2,1.3,.4,1) .2s both;border-left-color:var(--orange)}
@keyframes slidein{0%{transform:translateX(400px);opacity:0}100%{transform:none;opacity:1}}

/* finale */
.wrap2{display:grid;grid-template-columns:400px 1fr;gap:30px;align-items:center;width:100%}
.console{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cbtn{width:calc(var(--k)*150px);height:calc(var(--k)*118px);border-radius:18px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:calc(var(--k)*15px);line-height:1.15;
  box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.08);text-align:center;padding:8px}
.cbtn svg{width:calc(var(--k)*46px);height:calc(var(--k)*46px)}
.cbtn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.cbtn.on{box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 0 5px var(--gold)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(900px,100%)}
.pickers label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:calc(var(--k)*20px);color:#fff;text-align:left}
.pickers select{font-size:calc(var(--k)*20px);border-radius:14px;border:0;padding:12px 14px;background:var(--paper);color:var(--ink)}
.teach{width:min(900px,100%);text-align:left}
.teach textarea{width:100%;height:110px;border-radius:14px;border:0;padding:12px 16px;font-size:20px;background:var(--paper);color:var(--ink)}
.scroll{overflow:auto;justify-content:flex-start!important}

/* tapes on the shelf */
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;width:100%}
.vhs{height:calc(var(--k)*170px);border-radius:8px;padding:12px 10px;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.45)}
.vhs:after{content:"";position:absolute;left:14%;right:14%;bottom:12px;height:24px;border-radius:12px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 3px rgba(0,0,0,.1)}
.vhs b{font-family:Bungee,sans-serif;font-weight:400;font-size:calc(var(--k)*28px);line-height:1}
.vhs small{font-weight:700;font-size:calc(var(--k)*14px);line-height:1.2;margin-bottom:34px;position:relative;z-index:1}
.vhs.mystery{background:repeating-linear-gradient(45deg,#2c2160 0 12px,#221a4c 12px 24px);color:#fff}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,300px);gap:16px;align-items:end}
.pod{border-radius:18px 18px 4px 4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:14px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.pod .n{font-family:Bungee,sans-serif;font-size:calc(var(--k)*56px);color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(255,207,90,.6)}
.pod b{font-family:Bungee,sans-serif;font-weight:400;font-size:calc(var(--k)*22px);margin-top:6px}
.pod small{font-weight:700;opacity:.85}
.p1{height:calc(var(--k)*270px);background:linear-gradient(#d9a53a,#8f630f)}.p2{height:calc(var(--k)*210px);background:#3d4fb0}.p3{height:calc(var(--k)*160px);background:#30408f}
.pod.empty{background:rgba(255,255,255,.05);border:3px dashed rgba(255,255,255,.25);box-shadow:none}

/* backstage pages: the host desk and the maker */
.backstage{max-width:1240px;margin:0 auto;padding:10px 16px 90px}
.backstage h1{font-family:Bungee,sans-serif;font-size:44px;color:var(--gold);margin:6px 0 16px;text-shadow:0 0 20px rgba(255,207,90,.4)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.panel + .panel{margin-top:14px}
.panel h2{font-weight:700;font-size:19px;margin-bottom:8px}
.note{font-size:14px;color:#5b5675}
.panel .press{font-size:18px;padding:12px 22px 9px}
.panel .ghost{color:var(--ink);border-color:#cfc6e8;background:#fff;font-size:16px}
.panel .link{color:#5b5675;font-size:15px}
.lineup{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto 14px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:9px 12px;border:2px solid #efe2cf}
.lrow small{display:block;color:#5b5675;font-size:13px}
.ok{width:14px;height:14px;border-radius:50%;background:#d7d3ea}.ok.yes{background:#3fa66a}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:#cfd0e2;border:2px solid #9a9ab8}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked=true]{background:var(--teal2);border-color:var(--teal2)}.switch[aria-checked=true]:after{left:24px}
.preview video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.panel input[type=range]{accent-color:var(--teal2)}
.panel input[type=file]{display:none}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.maker canvas{width:100%;height:auto;border-radius:16px;box-shadow:0 10px 0 rgba(0,0,0,.4);display:block}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:2px solid #e2d3bd;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.opts button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{width:100%;border:2px solid #e2d3bd;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font-size:16px}

/* send box from /data/send.js */
.sendbox{background:var(--paper);border-radius:18px;padding:14px 16px;margin-top:12px;color:var(--ink);text-align:left}
.sendtitle{font-weight:700;margin:0 0 4px}
.sendwhy{font-size:14px;color:#5b5675}
.sendwho{display:flex;gap:8px;align-items:center;margin:8px 0}
.sendwho input{border:2px solid #e2d3bd;border-radius:10px;padding:6px 10px;width:7rem}
.sendrow{display:flex;gap:8px;flex-wrap:wrap}
.sendbox .btn{border-radius:12px;padding:8px 14px;font-weight:700;border:2px solid #e2d3bd;background:#fff;color:var(--ink)}
.sendbox .btn-orange{background:var(--orange);border-color:var(--orange2);color:#fff}
.sendmsg{font-size:14px;margin:8px 0 0}

/* bits and bobs */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 20px;font-weight:700;max-width:min(560px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.5)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-24px;width:12px;height:22px;border-radius:3px;animation:fall 2.8s ease-out forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.2}}
.critter{position:fixed;z-index:55;pointer-events:none;width:120px}
.walk{bottom:8px;left:-140px;animation:walk 7s linear forwards}
.fly{top:22%;left:-140px;animation:fly 5s ease-in-out forwards}
@keyframes walk{to{left:calc(100vw + 140px)}}
@keyframes fly{30%{top:12%}60%{top:28%}to{left:calc(100vw + 140px);top:10%}}
.reduced *,.reduced *:before,.reduced *:after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
.reduced .confetti,.reduced .critter{display:none}
.reduced .card-title{display:none}

/* small screens: the set stacks instead of scaling */
html.flow .fit{width:auto!important;height:auto!important}
html.flow .stage{position:relative;width:100%;height:auto;transform:none!important;grid-template-rows:auto auto auto;border-radius:18px;--k:.5}
html.flow .truss{grid-template-columns:auto 1fr auto;padding:10px 12px;gap:8px}
html.flow .logo svg{width:34px;height:34px}html.flow .logo span{display:none}html.flow .wallrow{padding:10px 8px 0}
html.flow .plate b{font-size:14px;padding:6px 10px 4px}
html.flow .flaps i{width:22px;height:32px;font-size:18px}html.flow .flaps small{display:none}
html.flow .frame{width:100%;height:auto;padding:9px;border-radius:18px;background-size:16px 16px,auto}
html.flow .wall{height:auto;min-height:56vw}
html.flow .wall .pane{position:relative;min-height:56vw}
html.flow .wall video{position:relative;height:56vw}
html.flow .lamps{gap:6px}html.flow .lamps i{width:10px;height:10px}
html.flow .floor{padding:12px 10px 20px}
html.flow .cards{grid-template-columns:repeat(3,1fr)}
html.flow .trick{height:auto;aspect-ratio:1}
html.flow .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
html.flow .key{width:auto;height:64px}
html.flow .pad{grid-template-columns:repeat(4,1fr);width:100%}
html.flow .shelf{grid-template-columns:repeat(3,1fr)}
html.flow .wrap2,html.flow .pickers{grid-template-columns:1fr}
html.flow .podium{grid-template-columns:repeat(3,1fr)}
html.flow .buzzers{gap:12px;flex-wrap:wrap;justify-content:center}
html.flow .huge{font-size:72px}
html.flow .answer{font-size:80px}
html.flow .stage:before,html.flow .stage:after{display:none}
@media (max-width:900px){.cols,.maker{grid-template-columns:1fr}}
@media (max-width:560px){.bar span,.bar #menubtn{font-size:0;gap:0}.bar #menubtn svg,.bar #soundbtn svg{width:22px;height:22px}}
.print{display:none}
@media print{
  body{background:#fff;color:#111}.bar,.fit,.backstage,.toast,.critter,.confetti{display:none!important}
  .print{display:block;font:11pt/1.4 Arial,sans-serif;color:#111;padding:10mm}
  .print h1{font-size:24pt}.print h2{font-size:14pt;border-bottom:2px solid #007291;margin-top:14pt}
  .print table{border-collapse:collapse;width:100%;font-size:9pt}.print td,.print th{border:1px solid #999;padding:4px;text-align:left}
}
</style>

<script>
(function(){
"use strict";

/* ---------- the adverts ----------
   year: the year scored against. prec "decade": only the decade is known.
   focus: the two tricks the show scores. fair: also a fair shout.
   gain: volume match (measured, so no advert is louder than the rest).
   start/end: seconds, to skip a channel ident at either end.
   tell: what gives the era away, shown when a guess is a long way off.
   host: what to preview before showing it. */
var ADS = [
  {id:1, year:1989, title:"Toys 'R' Us: Magical Place", short:"The toy shop song",
   fact:"Toys 'R' Us opened its first UK shops in 1985, and this Magical Place campaign started in November 1989. Lots of people can still sing the jingle.",
   clue:"Hand drawn cartoon, and a shop that had only been in the UK for a few years.",
   tell:"The fuzzy cartoon and the giant shop give it away: the late 1980s, when toy superstores were brand new here.",
   focus:["Catchy music","Childhood fantasy"], fair:["Animation","Storytelling"],
   question:"Is it selling toys, or selling the feeling of walking into the shop?",
   host:"Bright cartoon, upbeat song. Christmas shopping pressure.", gain:0.82},
  {id:2, year:1955, title:"Gibbs SR: Toothpaste in Ice", short:"The icy toothpaste",
   fact:"This was the very first advert ever shown on British TV, on 22 September 1955, the night ITV started.",
   clue:"Black and white, and it is very, very early. There was no TV advert before this one.",
   tell:"Black and white film is the giveaway. Colour TV did not reach the UK until 1967.",
   focus:["Expert voice","Big promises"], fair:["Comparison"],
   question:"Toothpaste frozen in a block of ice: genius demonstration or total nonsense?",
   host:"Black and white, a little crackly. Mentions gum infection.", gain:0.83},
  {id:3, year:1965, prec:"decade", title:"The Milkybar Kid", short:"The tiny cowboy",
   fact:"The Milkybar Kid first appeared in 1961. Nobody knows the exact year of this clip, only that it is from the 1960s, so this round is scored by decade.",
   clue:"Black and white again. The Milkybar Kid first rode into town in the early 1960s.",
   tell:"Black and white plus a cowboy craze points to the 1960s. Westerns were everywhere on TV then.",
   focus:["Catchy music","Memorable mascot"], fair:["Childhood fantasy","Storytelling"],
   question:"Would a tiny cowboy convince you to buy chocolate today?",
   host:"Toy guns and a Western saloon. Quiet audio (the show boosts it).", gain:3.2},
  {id:4, year:1974, title:"Smash: The Martians", short:"Aliens versus potatoes",
   fact:"The Smash Martians first landed on British TV in 1974. They laugh at humans for peeling real potatoes, and they were later voted one of the best adverts ever made.",

  }).catch(function(){ say("postmsg", "That did not go through. The leaderboard may not be switched on yet."); });
}

/* ---------- the advert on the wall ---------- */
function mountVideo(a){
  var box = $("#screen"); if(!box) return;
  fromCache(a.id).then(function(url){
    var src = url || ("/projects/ttv/ad" + pad(a.id) + ".mp4");
    if(!$("#screen")) return;
    box.innerHTML = '<video id="advert" playsinline preload="auto" controls controlslist="nodownload noplaybackrate" disablepictureinpicture aria-label="Mystery advert, round ' + roundNo() + '"></video>' +
      '<button type="button" class="playbtn" id="playbig" aria-label="Play the advert"><span>' + PLAY + '</span></button>';
    var v = $("#advert"), big = $("#playbig");
    v.addEventListener("error", function(){
      var mine = src.indexOf("blob:") === 0;
      box.innerHTML = mine ? '<div class="big">No signal</div><div class="sub">This browser cannot play that file. Chrome or Edge can.</div>' : loaderHtml();
      if(!mine) bindLoaders();
    });
    v.addEventListener("loadedmetadata", function(){ if(a.start) v.currentTime = a.start; });
    v.addEventListener("timeupdate", function(){ if(a.end && v.currentTime >= a.end){ v.pause(); v.currentTime = a.start || 0; ended(); } });
    v.addEventListener("ended", ended);
    v.addEventListener("play", function(){ big.classList.add("hidden"); });
    big.addEventListener("click", function(){ v.play().catch(function(){}); });
    v.src = src; wireSound(v, a);
    function ended(){ big.querySelector("span").innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2-5" fill="none" stroke="#1c1530" stroke-width="3" stroke-linecap="round"/><path d="M18 3v5h-5" fill="none" stroke="#1c1530" stroke-width="3" stroke-linecap="round"/></svg>'; big.setAttribute("aria-label", "Watch again"); big.classList.remove("hidden"); }
  });
}
function loaderHtml(){
  return '<div class="loader"><p><b>This advert would not load.</b> Check the internet connection, or load your own copies of the adverts on this device.</p>' +
    '<div class="row" style="justify-content:flex-start"><label class="press">Pick the folder<input type="file" data-load webkitdirectory multiple></label><label class="ghost" style="color:var(--ink);border-color:#cfc6e8">Pick the files<input type="file" data-load accept="video/*" multiple></label></div></div>';
}
function bindLoaders(){
  $$("input[data-load]").forEach(function(inp){ inp.addEventListener("change", function(){ loadFiles(inp.files, function(){ cardNext = false; render(); }); }); });
}

/* ---------- backstage: host desk and advert maker ---------- */
function vHost(){
  return '<h1>Host desk</h1><div class="cols"><div class="panel"><h2>Tonight\'s running order</h2><p class="note" style="margin-bottom:10px">Switch off anything you would rather not show. </p>' +
    '<div class="lineup">' + ORDER.map(function(id){ var a = adBy(id);
      return '<div class="lrow"><button type="button" class="switch" role="switch" data-off="' + id + '" aria-checked="' + !st.off[id] + '" aria-label="Show ' + esc(a.title) + '"></button><span class="ok' + (loaded(id) ? " yes" : "") + '"></span>' +
        '<div><b>' + esc(a.title) + '</b> (' + yearText(a) + ')<small>' + esc(a.host) + '</small></div><button type="button" class="ghost" data-prev="' + id + '" style="padding:6px 12px">Preview</button></div>'; }).join("") + '</div></div>' +
    '<div><div class="panel preview hidden" id="prevcard"><h2 id="prevlabel">Preview</h2><div id="prevbox"></div></div>' +
    '<div class="panel"><h2>The adverts</h2><p id="loadcount">All 12 play from the Base 5 site.</p><p class="note" style="margin:6px 0 12px">To use your own copies on this device instead (for example with no internet), pick them here.</p>' +
      '<div class="row" style="justify-content:flex-start"><label class="press" style="cursor:pointer">Pick the folder<input type="file" data-load webkitdirectory multiple></label><label class="ghost" style="cursor:pointer">Pick the files<input type="file" data-load accept="video/*" multiple></label></div>' +
      '<button type="button" class="link" id="forget" style="margin-top:8px">Forget them on this device</button></div>' +
    '<div class="panel"><h2>Sound and screen</h2><label style="display:flex;gap:10px;align-items:center">Advert volume <input type="range" id="hvol" min="0" max="1" step="0.05" value="' + st.vol + '"></label>' +
      '<p class="note" style="margin:6px 0 12px">Every advert is matched in volume, with loud peaks softened.</p>' +
      '<div class="row" style="justify-content:flex-start"><button type="button" class="ghost" id="fx">Calmer effects: ' + (st.effects === "reduced" ? "on" : "off") + '</button><button type="button" class="ghost" id="snd">Show sounds: ' + (st.sound === false ? "off" : "on") + '</button></div></div>' +
    (doneIds().length > judged().length ? '<div class="panel"><h2>Skipped adverts</h2><p class="note" style="margin-bottom:10px">' + (doneIds().length - judged().length) + ' skipped so far.</p><button type="button" class="ghost" id="unskip">Bring them back</button></div>' : '') +
    '<div class="panel"><h2>Start again</h2><p class="note" style="margin-bottom:10px">Clears this device\'s scores and tier list. The running order and adverts stay.</p><div class="row" id="resetrow" style="justify-content:flex-start"><button type="button" class="link" id="reset">Start a fresh show</button></div></div>' +
    '<div class="row" style="justify-content:flex-start;margin-top:14px"><button type="button" class="press gold" data-go="game">Back to the show</button></div></div></div>';
}
function vMake(){
  var p = mk();
  return '<h1>Make an advert</h1><div class="maker"><div>' +
    '<div class="panel"><h2>Which era?</h2><div class="opts">' + Object.keys(ERAS).map(function(e){ return '<button type="button" data-era="' + e + '" aria-pressed="' + (p.era === e) + '">' + e + '</button>'; }).join("") + '</div></div>' +
    '<div class="panel"><h2>What are you selling?</h2><div class="opts">' + PRODUCTS.map(function(x, i){ return '<button type="button" data-prod="' + i + '" aria-pressed="' + (p.prod === i) + '">' + esc(x.n) + '</button>'; }).join("") + '</div>' +
      '<label class="note" for="pname" style="display:block;margin:12px 0 6px">Brand name, if you like</label><input id="pname" class="field" maxlength="22" value="' + esc(p.name) + '" placeholder="Zoomo"></div>' +
    '<div class="panel"><h2>Up to two tricks</h2><div class="opts">' + Object.keys(TECH).map(function(t){ return '<button type="button" data-ptrick="' + esc(t) + '" aria-pressed="' + (p.tricks.indexOf(t) >= 0) + '">' + esc(t) + '</button>'; }).join("") + '</div></div>' +
    '<div class="panel"><h2>Slogan</h2><input id="pslogan" class="field" maxlength="70" value="' + esc(p.slogan) + '" placeholder="Leave it blank, or tap for one"><div class="row" style="justify-content:flex-start;margin-top:10px"><button type="button" class="ghost" id="slogan">Give me one</button></div></div>' +
    '</div><div><canvas id="pc" width="1080" height="1350" aria-label="Your advert poster"></canvas>' +
    '<div class="row" style="justify-content:flex-start;margin-top:16px"><button type="button" class="press" id="dlposter">Save the poster</button><button type="button" class="ghost" data-go="game">Back to the show</button></div><div id="psend"></div></div></div>';
}

/* ---------- render ---------- */
function render(){
  header();
  var backstage = display === "host" || display === "make";
  $("#fit").classList.toggle("hidden", backstage); $("#back").classList.toggle("hidden", !backstage);
  if(backstage){ $("#back").innerHTML = display === "host" ? vHost() : vMake(); wire(); return; }
  var a = current(), v;
  if(display === "archive") v = vArchive();
  else if(display === "board") v = vBoard();
  else {
    if(st.step !== "start" && st.step !== "filed" && !a) st.step = "finale";
    var s = st.step;
    v = s === "start" ? vStart() : s === "watch" ? vWatch(a) : s === "guess" ? vGuess(a) : s === "reveal" ? vReveal(a) :
      s === "detect" ? vDetect(a) : s === "checked" ? vChecked(a) : s === "verdict" ? vVerdict(a) : s === "filed" ? vFiled() : vFinale();
  }
  var wall = $("#wall"), stage = $("#stage");
  wall.className = "wall"; stage.classList.remove("revealed", "sweep");
  wall.innerHTML = v.raw ? v.wall : '<div class="pane ' + (v.pane || "") + '">' + v.wall + '</div>';
  if(v.raw && v.pane) wall.classList.add(v.pane);
  $("#floor").innerHTML = v.floor;
  wire();
  if(v.after) v.after();
  if(display === "game" && st.step === "watch" && a){
    mountVideo(a);
    if(cardNext && fx()){ SFX.sting(); setTimeout(function(){ var ct = $("#cardtitle"); if(ct) ct.remove(); }, 2100); }
    cardNext = false;
  }
  firstLoad = false;
}
function wire(){
  var a = current(), c = st.cur;
  $$("[data-go]", $("#fit")).concat($$("[data-go]", $("#back"))).forEach(function(b){ b.addEventListener("click", function(){ SFX.click(); go(b.dataset.go); }); });
  on("start", function(){ var n = ($("#basename").value || "").replace(/[^A-Za-z0-9 '&\-]/g, "").replace(/\s+/g, " ").trim().slice(0, 26); st.base = n || "Base 5"; st.started = true; cardNext = true; step(current() ? "watch" : "finale"); });
  var bn = $("#basename"); if(bn) bn.addEventListener("keydown", function(e){ if(e.key === "Enter") $("#start").click(); });
  on("toguess", function(){ SFX.whoosh(); var v = $("#advert"); if(v) v.pause(); step("guess"); });
  on("skip", function(){ finish(true); toast("Skipped. That tape stays a mystery."); });
  var vol = $("#vol"); if(vol) vol.addEventListener("input", function(){ setVol(+vol.value); });
  /* guess */
  $$("[data-level]").forEach(function(b){ b.addEventListener("click", function(){ SFX.click(); c.level = b.dataset.level; save(); render(); }); });
  function showAnswer(){ var el = $("#answer"); if(!el) return; var t = answerText(c); el.innerHTML = t ? answerHtml(c) : (c.level === "mild" ? "19?0" + '<span class="lc">s</span>' : "????"); el.classList.toggle("empty", !t); }
  $$("[data-dec]").forEach(function(b){ b.addEventListener("click", function(){ SFX.pick(); c.decade = +b.dataset.dec; save(); $$("[data-dec]").forEach(function(x){ x.setAttribute("aria-pressed", String(+x.dataset.dec === c.decade)); }); showAnswer(); }); });
  var yr = $("#yr");
  function setYear(n){ c.year = Math.max(1950, Math.min(2026, n)); if(yr) yr.value = c.year; showAnswer(); save(); }
  if(yr){ yr.addEventListener("input", function(){ setYear(+yr.value); SFX.tick(); }); $$("[data-n]").forEach(function(b){ b.addEventListener("click", function(){ SFX.click(); setYear(c.year + +b.dataset.n); }); }); }
  $$("[data-key]").forEach(function(b){ b.addEventListener("click", function(){
    var k = b.dataset.key; SFX.click();
    if(k === "back") c.typed = c.typed.slice(0, -1); else if(k === "clear") c.typed = ""; else if(c.typed.length < 4) c.typed += k;
    if(c.typed === "1066") toast("Adverts in 1066 were mostly tapestries.");
    save(); showAnswer();
  }); });
  $$("[data-sure]").forEach(function(b){ b.addEventListener("click", function(){ SFX.click(); c.sure = c.sure === b.dataset.sure ? "" : b.dataset.sure; save(); $$("[data-sure]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.sure === c.sure)); }); }); });
  on("clue", function(){ SFX.pick(); c.clue = !c.clue; save(); render(); });
  on("rewatch", function(){ step("watch"); });
  on("lock", function(){
    if(c.level === "spicy"){ var n = +c.typed; c.year = c.typed.length === 4 && n >= 1950 && n <= 2026 ? n : null; }
    if(c.level === "mild" && c.decade == null){ toast("Tap a decade first."); return; }
    if(c.level === "spicy" && c.year == null){ toast("Type a year from 1950 to 2026."); return; }
    step("reveal");
  });
  on("todetect", function(){ SFX.whoosh(); step("detect"); });
  /* tricks */
  if(st.step === "detect" && display === "game") $$("[data-tech]").forEach(function(b){ b.addEventListener("click", function(){
    var t = b.dataset.tech, i = c.tech.indexOf(t);
    if(i >= 0) c.tech.splice(i, 1); else if(c.tech.length < 2) c.tech.push(t); else { toast("Two at most. Tap one again to swap it."); return; }
    SFX.pick(); save(); $$("[data-tech]").forEach(function(x){ x.setAttribute("aria-pressed", String(c.tech.indexOf(x.dataset.tech) >= 0)); });
  }); });
  on("check", function(){ step("checked"); });
  on("nocheck", function(){ c.tech = []; step("checked"); });
  on("toverdict", function(){ SFX.whoosh(); step("verdict"); });
  /* verdict */
  $$("[data-star]").forEach(function(b){ b.addEventListener("click", function(){ var n = +b.dataset.star; c.stars = c.stars === n ? 0 : n; save(); SFX.pick();
    $$("[data-star]").forEach(function(x){ x.classList.toggle("on", +x.dataset.star <= c.stars); x.setAttribute("aria-pressed", String(+x.dataset.star === c.stars)); }); }); });
  $$("[data-tier]").forEach(function(b){ b.addEventListener("click", function(){ c.tier = c.tier === b.dataset.tier ? "" : b.dataset.tier; save(); SFX.pick();
    $$("[data-tier]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.tier === c.tier)); }); var tn = $(".tiername"); if(tn) tn.textContent = c.tier ? c.tier + ": " + TIERNOTE[c.tier] : ""; }); });
  var why = $("#why"); if(why) why.addEventListener("input", function(){ c.why = why.value; save(); });
  on("file", function(){ finish(false); });
  on("next", function(){ cardNext = true; step(current() ? "watch" : "finale"); });
  on("pause", function(){ st.step = "start"; save(); render(); toast("Saved. Carry on whenever you like."); });
  /* finale */
  on("toq", function(){ SFX.click(); finPage = "question"; render(); });
  on("toteach", function(){ SFX.click(); finPage = "teach"; render(); });
  on("finback", function(){ finPage = null; render(); });
  var vs = $("#visit"); if(vs) vs.addEventListener("change", function(){ st.visit = vs.value || null; save(); });
  var sk = $("#skipto"); if(sk) sk.addEventListener("change", function(){ st.skip = sk.value || null; save(); });
  on("poster", tierPicture);
  on("printit", function(){ report(); window.print(); });
  on("again", function(){ var r = $("#floor"); r.innerHTML = '<div class="sub">Start from round one? This clears the scores on this device.</div><div class="row"><button type="button" class="press" id="again2">Yes, a fresh show</button><button type="button" class="ghost" id="again3">Keep it</button></div>'; on("again2", resetShow); on("again3", render); });
  var tb = $("#tb"); if(tb){ tb.addEventListener("input", function(){ st.teach = tb.value; save(); }); if(window.Base5Send) Base5Send.mount($("#tbsend"), { tool:"Time Travel TV", getText:textSummary, filename:"time-travel-tv" }); }
  /* board */
  if(display === "board" && !boardData && boardMsg === "") fetchBoard();
  on("refresh", function(){ boardData = null; boardMsg = ""; fetchBoard(); });
  on("post", post);
  /* host */
  $$("[data-off]").forEach(function(b){ b.addEventListener("click", function(){ var id = +b.dataset.off; if(st.off[id]) delete st.off[id]; else { if(lineup().length <= 1){ toast("The show needs at least one advert."); return; } st.off[id] = 1; } save(); render(); }); });
  if(display === "host"){ bindLoaders(); haveAll().then(function(){ $$(".lrow").forEach(function(r){ var id = +r.querySelector("[data-off]").dataset.off; r.querySelector(".ok").classList.toggle("yes", loaded(id)); }); }); }
  $$("[data-prev]").forEach(function(b){ b.addEventListener("click", function(){
    var a2 = adBy(+b.dataset.prev), card = $("#prevcard"); card.classList.remove("hidden"); say("prevlabel", "Preview: " + a2.title);
    fromCache(a2.id).then(function(url){
      var box = $("#prevbox"); if(!box) return;
      box.innerHTML = '<video controls playsinline preload="auto"></video>';
      var v = box.querySelector("video");
      v.addEventListener("error", function(){ box.innerHTML = '<p class="note">That advert would not load. Check the internet connection.</p>'; });
      v.addEventListener("loadedmetadata", function(){ if(a2.start) v.currentTime = a2.start; });
      v.volume = Math.max(0, Math.min(1, a2.gain * st.vol)); v.src = url || ("/projects/ttv/ad" + pad(a2.id) + ".mp4");
      card.scrollIntoView({ behavior:"smooth", block:"center" });
    });
  }); });
  on("unskip", function(){ doneIds().forEach(function(id){ if(st.results[id].skipped) delete st.results[id]; }); if(st.step === "finale") st.step = "start"; save(); render(); toast("Skipped adverts are back in the show."); });
  on("forget", function(){ forget(); render(); toast("The adverts are gone from this device."); });
  var hv = $("#hvol"); if(hv) hv.addEventListener("input", function(){ setVol(+hv.value); });
  on("fx", function(){ st.effects = st.effects === "reduced" ? "full" : "reduced"; save(); render(); });
  on("snd", function(){ st.sound = st.sound === false; save(); render(); });
  on("reset", function(){ $("#resetrow").innerHTML = '<span>Sure? Scores and the tier list on this device go.</span><button type="button" class="ghost" id="reset2">Yes, start fresh</button><button type="button" class="link" id="reset3">Keep it</button>'; on("reset2", function(){ resetShow(); toast("Fresh show ready."); }); on("reset3", render); });
  /* maker */
  if(display === "make"){
    var p = mk();
    $$("[data-era]").forEach(function(b){ b.addEventListener("click", function(){ p.era = b.dataset.era; save(); render(); }); });
    $$("[data-prod]").forEach(function(b){ b.addEventListener("click", function(){ p.prod = +b.dataset.prod; save(); render(); }); });
    $$("[data-ptrick]").forEach(function(b){ b.addEventListener("click", function(){ var t = b.dataset.ptrick, i = p.tricks.indexOf(t); if(i >= 0) p.tricks.splice(i, 1); else if(p.tricks.length < 2) p.tricks.push(t); else { toast("Two tricks at most. Tap one to swap it."); return; } save(); render(); }); });
    var pn = $("#pname"); pn.addEventListener("input", function(){ p.name = pn.value; save(); drawPoster(); });
    var ps = $("#pslogan"); ps.addEventListener("input", function(){ p.slogan = ps.value; save(); drawPoster(); });
    on("slogan", function(){ var s2 = SLOGANS[Math.floor(Math.random() * SLOGANS.length)].replace("{p}", PRODUCTS[p.prod].n.toLowerCase()); p.slogan = s2; ps.value = s2; save(); drawPoster(); });
    on("dlposter", function(){ savePng($("#pc"), "my-advert-" + p.era + ".png"); });
    drawPoster(); if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawPoster);
    if(window.Base5Send && Base5Send.mountImage) Base5Send.mountImage($("#psend"), { tool:"Time Travel TV advert poster", filename:"advert-poster", getImage:function(){ return $("#pc").toDataURL("image/png"); } });
  }
}
function on(id, fn){ var e = document.getElementById(id); if(e) e.addEventListener("click", fn); }
function finish(skipped){
  var a = current(); if(!a) return;
  var c = st.cur, yp = skipped ? 0 : yearPoints(a, c), tp = skipped ? 0 : techPoints(a, c.tech), max = LEVELS[c.level].max;
  st.results[a.id] = { id:a.id, level:c.level, guess:skipped ? "-" : guessLabel(c), sure:c.sure, tech:skipped ? [] : c.tech.slice(),
    yearPoints:yp, techPoints:tp, points:yp + tp, stars:skipped ? 0 : c.stars, tier:skipped ? "" : c.tier, why:skipped ? "" : c.why,
    skipped:!!skipped, fooled:!skipped && c.sure === "Very sure" && yp < max * 0.4, at:new Date().toISOString() };
  st.lastId = a.id; st.cur = blankCur(c.level);
  if(skipped) cardNext = true;
  step(skipped ? (current() ? "watch" : "finale") : "filed");
}
function resetShow(){ var keep = { off:st.off, vol:st.vol, effects:st.effects, base:st.base, poster:st.poster, sound:st.sound }; st = fresh(); for(var k in keep) st[k] = keep[k]; save(); display = "game"; finPage = null; lastDigits = ""; render(); }

/* ---------- top bar ---------- */
on("menubtn", function(){ var m = $("#menu"), open = m.classList.toggle("hidden") === false; $("#menubtn").setAttribute("aria-expanded", String(open)); });
$$("#menu [data-go]").forEach(function(b){ b.addEventListener("click", function(){ if(b.dataset.go === "board"){ boardData = null; boardMsg = ""; } go(b.dataset.go); }); });
document.addEventListener("click", function(e){ var m = $("#menu"); if(!m.classList.contains("hidden") && !e.target.closest(".right")){ m.classList.add("hidden"); $("#menubtn").setAttribute("aria-expanded", "false"); } });
on("soundbtn", function(){ st.sound = st.sound === false; save(); header(); if(st.sound) SFX.pick(); });

/* ---------- hidden surprises (never scored) ---------- */
var tvTaps = 0, plateTaps = 0;
$("#tvlogo").addEventListener("click", function(){ if(++tvTaps === 4){ tvTaps = 0; critter("bird"); toast(isB5() ? "A bird has got into the studio. Jay is delighted." : "A bird has got into the studio. Nobody knows how."); } });
$("#plate").addEventListener("click", function(){ if(++plateTaps === 3){ plateTaps = 0; critter("dog"); toast(isB5() ? "Executive producer Bonnie has approved this broadcast." : "The studio dog has approved this broadcast."); } });
function critter(kind){
  if(!fx()) return;
  var d = document.createElement("div"); d.className = "critter " + (kind === "dog" ? "walk" : "fly"); d.setAttribute("aria-hidden", "true");
  d.innerHTML = kind === "dog"
    ? '<svg viewBox="0 0 120 80"><path d="M20 50q-6-22 14-24h40l10-14q8-4 14 2l6 10q4 8-4 10l-6 2v20h-8l-2-14H44l-4 14h-8l-2-16q-8 0-10 10z" fill="#8a5a3b" stroke="#1c1530" stroke-width="3" stroke-linejoin="round"/><circle cx="98" cy="18" r="2.5" fill="#1c1530"/><path d="M20 50q-10-4-12-14" fill="none" stroke="#1c1530" stroke-width="4" stroke-linecap="round"/><rect x="40" y="2" width="44" height="18" rx="4" fill="#ffcf5a" stroke="#1c1530" stroke-width="2"/><text x="62" y="15" font-size="10" text-anchor="middle" font-weight="700" fill="#1c1530">EXEC</text></svg>'
    : '<svg viewBox="0 0 120 80"><path d="M20 44q20-30 40 0 20-30 40 0" fill="none" stroke="#ffcf5a" stroke-width="6" stroke-linecap="round"/><ellipse cx="60" cy="46" rx="10" ry="6" fill="#00a3b8"/></svg>';
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 7500);
}

fit();
render();
haveAll();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
