<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Lab - Base 5</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/idea-lab.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=13">
<!--
  Idea Lab (projects/ideas.html)
  A time machine that prints project ideas. Pull the lever, three picture
  dials spin (when, what you do there, what you make), and a postcard ticket
  prints out. Keep the good ones in the idea jar, pick one, shape it up and
  send it to Jay. Four extra ways in: Should we? (swipe), Mash up, Ask
  someone, My own. Also: this week's era (from data/term.js) turns up more,
  jackpot era and action pairs, a blast off, "depends on what?" chips, an
  anonymous Base 5 tally (vote kind lab:<id>), a blueprint with a real job
  card and a printable idea licence, and a BridgeLink Buddy note on picking.

  Saving: when a student is signed in to their school account the jar lives
  under that student's project prefix
  (<prefix>lab.v1, e.g. b5.project.lc.lab.v1), is pushed to the Base 5 sheet
  and pulled back on any device. Their project page (data/project.js) reads
  the picked idea from the same key. "Just looking" stays on this device.
  Everything is drawn in code. ASCII only.
-->
<style>
:root{--dh:96px}
body.ovopen{overflow:hidden}
.wrap{padding-bottom:90px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:18px 0 12px}
.wordmark{font-family:var(--display);font-variation-settings:"wdth" 125,"wght" 900;font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.wordmark span{color:var(--orange)}
.wordmark svg{width:46px;height:46px;flex:none}
.topbar .sp{flex:1}
.pillbtn{font:inherit;font-weight:700;font-size:.95rem;border:3px solid var(--ink);border-radius:999px;background:var(--white);color:var(--ink);padding:6px 14px 6px 8px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;text-decoration:none;box-shadow:3px 4px 0 rgba(10,47,56,.2)}
.pillbtn svg{width:26px;height:26px;flex:none}
.pillbtn:hover{transform:translateY(-2px)}
.pillbtn.plain{padding:6px 10px}
.pillbtn[disabled]{cursor:default;transform:none}

/* ---------- the lab stage ---------- */
.lab{
  position:relative;overflow:hidden;
  border:3px solid var(--ink);border-radius:30px 22px 28px 20px;box-shadow:var(--lift-hi);
  background:
    radial-gradient(560px 340px at 50% 14%, rgba(255,194,71,.38), transparent 70%),
    radial-gradient(circle at 2px 2px, rgba(255,255,255,.13) 1.7px, transparent 2.2px) 0 0/24px 24px,
    linear-gradient(172deg,#17586a,#0a2f38 72%);
  padding:64px 16px 0;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:8px;align-items:end;
  min-height:520px;
}
.floor{position:absolute;left:0;right:0;bottom:0;height:48px;border-top:3px solid var(--ink);
  background:repeating-linear-gradient(90deg,#6a4529 0 88px,#5a3a22 88px 91px),#5a3a22}
.lab > *:not(.floor):not(.flash):not(.pigeon):not(.bonnie-run){position:relative;z-index:2}
.flash{position:absolute;inset:0;z-index:6;background:#fffdf8;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}

/* Pixel Jay and his bubble */
.jaybox{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:34px;min-width:0}
.bubble{font-weight:800;position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px 16px 18px 14px;padding:8px 12px;
  font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 800;font-size:1rem;line-height:1.2;max-width:200px;text-align:center;min-height:2.4em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;width:18px;height:18px;background:var(--white);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .3s ease-out}
.jaypic svg{width:120px;height:auto;display:block}
.jaypic svg.wide{width:192px}
.jaypic.hop{animation:hop .45s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.04)}100%{transform:scale(1)}}

/* the jar */
.jarbtn{justify-self:center;background:none;border:0;padding:0;cursor:pointer;margin-bottom:30px;position:relative;font:inherit;color:var(--paper)}
.jarbtn svg{width:150px;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.jarbtn .count{position:absolute;top:2px;right:-6px;min-width:42px;height:42px;border-radius:999px;background:var(--orange);color:var(--ink);border:3px solid var(--ink);
  font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 900;font-size:1.25rem;display:grid;place-items:center;padding:0 8px}
.jarbtn .jl{display:block;text-align:center;font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 900;letter-spacing:.14em;font-size:.78rem;margin-top:6px;text-transform:uppercase}
.jarbtn.bump{animation:bump .5s ease-out}
.jarbtn .pickflag{position:absolute;left:-14px;top:30px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:700;transform:rotate(-8deg)}
@keyframes bump{0%,100%{transform:scale(1)}35%{transform:scale(1.12) rotate(-3deg)}65%{transform:scale(.96) rotate(2deg)}}

/* ---------- the machine ---------- */
.mach{position:relative;width:100%;max-width:480px;margin:0 auto 34px;padding-right:62px}
.mach.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,1px) rotate(-.6deg)}40%{transform:translate(4px,-1px) rotate(.6deg)}60%{transform:translate(-3px,0)}80%{transform:translate(3px,1px)}}
.dome{position:relative;width:64%;margin:0 auto;height:96px;border:3px solid var(--ink);border-bottom:0;border-radius:140px 140px 0 0;
  background:radial-gradient(120px 60px at 40% 30%,#ffe7a3,transparent 70%),linear-gradient(#ffd56b,#f0a80f);display:flex;justify-content:center}
.ant{position:absolute;top:-34px;left:50%;width:6px;height:34px;margin-left:-3px;background:var(--ink);border-radius:3px}
.bulb{position:absolute;top:-52px;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:3px solid var(--ink);background:#ffe28a;box-shadow:0 0 0 rgba(255,226,138,0);animation:glow 2.6s ease-in-out infinite}
.mach.busy .bulb{background:#ffb27a;animation-duration:.8s}
@keyframes glow{0%,100%{box-shadow:0 0 6px 2px rgba(255,226,138,.35)}50%{box-shadow:0 0 22px 8px rgba(255,226,138,.75)}}
.port{position:absolute;top:22px;left:50%;width:124px;height:124px;margin-left:-62px;border-radius:50%;z-index:3;cursor:pointer;padding:0;
  border:7px solid #f0a80f;outline:3px solid var(--ink);background:#0a2f38;overflow:hidden;box-shadow:inset 0 0 0 3px var(--ink)}
.port .vortex{position:absolute;inset:-35%;border-radius:50%;background:conic-gradient(from 0deg,#00a6c9,#7b4b8f,#ef7724,#ffc247,#00a6c9,#7b4b8f,#00a6c9);animation:spin 7s linear infinite;opacity:.9}
.port .rings{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fffdf8 0 7%,transparent 8%),repeating-radial-gradient(circle,rgba(10,47,56,0) 0 9px,rgba(10,47,56,.42) 10px 13px)}
.port .glare{position:absolute;left:18px;top:14px;width:34px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.mach.busy .port .vortex{animation-duration:.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.port .pig{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.port.pigeon .pig{transform:scale(1) rotate(-8deg)}
.body{position:relative;border:3px solid var(--ink);border-radius:26px 22px 18px 24px;padding:62px 14px 16px;
  background:linear-gradient(160deg,#00a6c9,#007291 58%,#005a73);box-shadow:inset 0 -9px 0 rgba(0,0,0,.18)}
.body::before,.body::after{content:"";position:absolute;bottom:-17px;width:44px;height:16px;background:var(--ink);border-radius:0 0 10px 10px}
.body::before{left:14%}.body::after{right:14%}
.rivet{position:absolute;width:10px;height:10px;border-radius:50%;background:#c9d2d4;border:2px solid var(--ink)}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dial{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.dk{font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 900;font-size:.72rem;letter-spacing:.2em;color:#e6fbff;text-transform:uppercase}
.win{position:relative;width:100%;height:var(--dh);background:var(--white);border:3px solid var(--ink);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;font:inherit;color:var(--ink);
  box-shadow:inset 0 12px 10px -8px rgba(0,0,0,.38),inset 0 -12px 10px -8px rgba(0,0,0,.38)}
.win:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.win.locked{border-color:var(--ink);box-shadow:0 0 0 4px var(--yellow),inset 0 12px 10px -8px rgba(0,0,0,.38),inset 0 -12px 10px -8px rgba(0,0,0,.38)}
.win .lk{position:absolute;top:3px;right:3px;width:24px;height:24px;display:none;z-index:2}
.win.locked .lk{display:block}
.strip{will-change:transform}
.cell{height:var(--dh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 3px}
.cell svg{width:calc(var(--dh) * .6);height:calc(var(--dh) * .6);flex:none}
.cell b{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 96,"wght" 800;font-size:.74rem;line-height:1.05;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell.q{font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:2.8rem;color:#c9bba5}
.win.landed .cell{animation:land .32s ease-out}
@keyframes land{0%{transform:translateY(-8px)}60%{transform:translateY(3px)}100%{transform:translateY(0)}}
.plate{display:block;width:max-content;margin:14px auto 0;background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:2px 12px;
  font-family:var(--display);font-variation-settings:"wdth" 125,"wght" 900;font-size:.7rem;letter-spacing:.22em;transform:rotate(-1.2deg)}
.slot{margin:10px auto 0;width:78%;height:14px;background:#06222a;border-radius:8px;border:3px solid var(--ink);box-shadow:inset 0 4px 0 rgba(0,0,0,.55)}
.mach.busy .slot{animation:slotglow .3s linear infinite alternate}
@keyframes slotglow{to{background:#123c47}}

/* the lever */
.lever{position:absolute;right:0;top:118px;bottom:2px;width:60px;background:none;border:0;padding:0;cursor:grab;touch-action:none;font:inherit;color:var(--paper)}
.lever:focus-visible{outline:4px solid var(--yellow);outline-offset:4px;border-radius:12px}
.lever .track{position:absolute;left:23px;top:8px;bottom:24px;width:14px;border-radius:8px;background:#06222a;border:3px solid var(--ink)}
.lever .base{position:absolute;left:6px;bottom:0;width:48px;height:34px;border-radius:12px 12px 8px 8px;background:#9aa7ab;border:3px solid var(--ink)}
.lever .knob{position:absolute;left:8px;top:0;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 34% 30%,#ffc59b,#ef7724 52%,#d75f10);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:top .18s cubic-bezier(.3,1.5,.5,1)}
.lever.hint .knob{animation:nudge 1.7s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.lever .pull{position:absolute;left:44px;top:58px;writing-mode:vertical-rl;font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 110,"wght" 900;font-size:.78rem;letter-spacing:.2em;color:var(--yellow);white-space:nowrap}
.lever:not(.hint) .pull{opacity:0;transition:opacity .4s}

/* pigeon and Bonnie surprises */
.pigeon{position:absolute;z-index:7;top:60px;left:-90px;width:80px;pointer-events:none}
.pigeon.fly{animation:fly 3.2s linear forwards}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30vw,-20px)}50%{transform:translate(60vw,10px)}75%{transform:translate(90vw,-14px)}100%{transform:translate(130vw,0)}}
.bonnie-run{position:absolute;z-index:7;bottom:40px;left:-120px;width:96px;pointer-events:none}
.bonnie-run.go{animation:run 2.6s linear forwards}
@keyframes run{to{transform:translateX(140vw)}}

/* ---------- the ticket tray ---------- */
.tray{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center}
.trayslot{width:72%;height:14px;margin-top:-3px;background:var(--ink);border-radius:0 0 12px 12px}
.tkwrap{width:100%;overflow:hidden;padding:0 10px 16px}
.waiting{margin:14px auto 0;width:88%;border:3px dashed rgba(10,47,56,.35);border-radius:12px;padding:16px;text-align:center;color:var(--body-tint);font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center}
.waiting svg{width:34px;height:34px;opacity:.6}
.itk{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:6px;box-shadow:6px 7px 0 rgba(10,47,56,.25);overflow:hidden;transform-origin:50% 0}
.itk.print{animation:print .95s steps(9,end)}
@keyframes print{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.itk.crumple{animation:crumple .5s ease-in forwards}
@keyframes crumple{40%{transform:scale(.7) rotate(10deg);border-radius:40%}100%{transform:scale(0) rotate(-40deg);opacity:0}}
.tk-scene{position:relative;height:150px;background:linear-gradient(180deg,var(--s1,#ffe7a8),var(--s2,#f0a80f));border-bottom:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.tk-scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:rgba(10,47,56,.22)}
.tk-scene .bigpic{position:relative;z-index:1;margin-bottom:6px}
.tk-scene .bigpic svg{width:122px;height:122px;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.tk-scene .sun{position:absolute;top:-30px;left:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18)}
.yrstamp{position:absolute;z-index:2;top:10px;right:10px;background:var(--white);border:2px dashed var(--ink);padding:4px 9px;font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 900;font-size:.85rem;transform:rotate(4deg)}
.postmark{position:absolute;z-index:2;top:12px;left:12px;width:62px;height:62px;border:2px solid rgba(10,47,56,.55);border-radius:50%;display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 900;font-size:.5rem;letter-spacing:.12em;line-height:1.25;color:rgba(10,47,56,.7);transform:rotate(-12deg);background:rgba(255,255,255,.25)}
.tk-body{padding:12px 14px 14px}
.tk-icons{display:flex;align-items:center;justify-content:center;gap:4px}
.tk-icons svg{width:46px;height:46px}
.tk-icons i{font-style:normal;font-family:var(--display);font-weight:900;font-size:1.3rem;opacity:.45}
.tk-text{font-weight:800;font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 800;font-size:1.12rem;line-height:1.25;text-align:center;margin:8px 4px 12px}
.should{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.should > span{font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 900;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-right:2px}
.sbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--white);cursor:pointer;padding:6px;display:grid;place-items:center}
.sbtn svg{width:34px;height:34px}
.sbtn:hover{transform:translateY(-2px)}
.sbtn[aria-pressed="true"]{background:var(--yellow);transform:scale(1.08) rotate(-4deg)}
.tk-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.itk.gold{background:linear-gradient(120deg,#fff3c4,#ffd56b 40%,#fff3c4 60%,#ffd56b);background-size:250% 100%;animation:shimmer 3s linear infinite}
.itk.gold.print{animation:print .95s steps(9,end),shimmer 3s linear infinite}
.itk.gold .yrstamp{background:#ffc247}
@keyframes shimmer{to{background-position:250% 0}}
.goldtag{position:absolute;z-index:3;left:50%;top:8px;transform:translateX(-50%) rotate(-3deg);background:var(--ink);color:var(--yellow);border-radius:8px;padding:2px 10px;font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:.8rem;letter-spacing:.16em}
.flyer{position:fixed;z-index:6000;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s ease-in}

/* big buttons */
.big{font:inherit;font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 900;font-size:1.05rem;border:3px solid var(--ink);border-radius:16px 14px 16px 12px;
  padding:11px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:4px 5px 0 var(--ink);background:var(--orange);color:var(--ink);text-decoration:none}
.big svg{width:30px;height:30px;flex:none}
.big:hover{transform:translateY(-2px)}
.big:active{transform:translate(2px,3px);box-shadow:1px 2px 0 var(--ink)}
.big.quiet{background:var(--white)}
.big.teal{background:var(--bright)}
.big.yel{background:var(--yellow)}
.big[disabled]{opacity:.5;cursor:default;transform:none}

/* ---------- more ways in ---------- */
.moreh{font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 900;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.moreh::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.18;border-radius:3px}
.fuel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ftile{font:inherit;cursor:pointer;color:var(--ink);text-align:center;border:3px solid var(--ink);border-radius:var(--r-alt);padding:14px 10px 12px;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;gap:6px;transform:rotate(var(--rot,0deg));transition:transform .15s ease,box-shadow .15s ease}
.ftile:nth-child(odd){--rot:-.8deg}.ftile:nth-child(even){--rot:.8deg}
.ftile:hover{transform:rotate(0) translateY(-4px);box-shadow:var(--lift-hi)}
.ftile svg{width:64px;height:64px;filter:drop-shadow(0 3px 0 rgba(10,47,56,.2))}
.ftile b{font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 900;font-size:1.15rem;line-height:1.05}
.ftile small{font-size:.8rem;opacity:.8}
.ftile .tick{font-size:.72rem;font-weight:700;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.ftile.f1{background:linear-gradient(150deg,#7fd9ec,var(--bright))}
.ftile.f2{background:linear-gradient(150deg,#c9a5d8,#a77bbb)}
.ftile.f3{background:linear-gradient(150deg,#ffe28a,var(--yellow))}
.ftile.f4{background:linear-gradient(150deg,#ffb98a,var(--orange))}
.syncline{display:flex;align-items:center;gap:8px;justify-content:center;margin:18px 0 0;font-size:.9rem;color:var(--body-tint);text-align:center;flex-wrap:wrap}
.syncline svg{width:22px;height:22px}
.syncline a{color:var(--teal);font-weight:700}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:5000;background:rgba(6,30,36,.74);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:26px 12px 40px}
.ov[hidden]{display:none}
.ovc{position:relative;width:min(760px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:26px 20px 24px 18px;padding:22px 18px 20px;box-shadow:var(--lift-hi);animation:pop .25s ease-out}
.ovc h2{font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:1.75rem;line-height:1.05;margin:0 50px 6px 0;display:flex;align-items:center;gap:10px}
.ovc h2 svg{width:48px;height:48px;flex:none}
.ovc .sub{margin:0 0 14px;color:var(--body-tint)}
.x{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--white);cursor:pointer;display:grid;place-items:center;padding:0}
.x svg{width:22px;height:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px}


/* should we swipe deck */
.deck{position:relative;height:330px;max-width:380px;margin:6px auto 0}
.swc{position:absolute;inset:0;background:var(--white);border:3px solid var(--ink);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 18px;
  box-shadow:6px 7px 0 rgba(10,47,56,.3);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.swc svg.ic{width:132px;height:132px}
.swc p{font-weight:800;font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 800;font-size:1.3rem;text-align:center;margin:0;line-height:1.2}
.swc.under{transform:translateY(12px) scale(.94) rotate(-2deg);box-shadow:none;z-index:0}
.swc.top{z-index:1}
.swc.gone{transition:transform .42s ease-in,opacity .42s ease-in;opacity:0}
.swc .tag{position:absolute;top:16px;padding:3px 12px;border:4px solid var(--ink);border-radius:10px;font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:1.4rem;opacity:0;background:var(--white)}
.swc .tag.y{left:16px;transform:rotate(-12deg);background:var(--bright)}
.swc .tag.n{right:16px;transform:rotate(12deg);background:#c9d2d4}
.swc .tag.d{left:50%;top:auto;bottom:16px;transform:translateX(-50%) rotate(-4deg);background:var(--yellow)}
.swnum{text-align:center;font-weight:700;color:var(--body-tint);margin:18px 0 0}
.swbtns{display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.swb{font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:20px;background:var(--white);padding:8px 10px 6px;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;box-shadow:3px 4px 0 rgba(10,47,56,.25)}
.swb svg{width:46px;height:46px}
.swb.y{background:#a6e6f2}.swb.d{background:#ffe28a}.swb.n{background:#e1e6e7}
.swb:active{transform:translateY(2px)}
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.pile{border:3px solid var(--ink);border-radius:18px;padding:12px 8px;text-align:center;background:var(--white)}
.pile svg{width:52px;height:52px}
.pile b{display:block;font-family:var(--display);font-variation-settings:"wdth" 120,"wght" 900;font-size:2.2rem;line-height:1}
.pile.d{background:var(--yellow)}

/* mash up */
.likes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.like{font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:var(--white);padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:.84rem;color:var(--ink)}
.like svg{width:44px;height:44px}
.like[aria-pressed="true"]{background:var(--yellow);transform:rotate(-2deg) scale(1.03);box-shadow:3px 4px 0 var(--ink)}
.blender{display:flex;justify-content:center;margin:12px 0 0}
.blender svg{width:96px;height:96px}
.blender.go svg{animation:shake .25s linear 4}
.minis{display:grid;gap:10px;margin-top:14px}
.mtk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;animation:pop .3s ease-out}
.mtk .mi{display:flex;gap:2px}
.mtk .mi svg{width:36px;height:36px}
.mtk p{flex:1 1 220px;margin:0;font-weight:700;line-height:1.3}

/* ask someone */
.askcard{max-width:520px;margin:0 auto;background:var(--white);border:3px solid var(--ink);border-radius:24px;padding:20px;text-align:center;box-shadow:6px 7px 0 rgba(10,47,56,.25)}
.askcard svg{width:84px;height:84px}
.askcard p{font-weight:800;font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 800;font-size:1.4rem;line-height:1.2;margin:8px 0 12px}
.askwho{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.askwho span{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.85rem;background:var(--paper)}
textarea.box{width:100%;min-height:90px;resize:vertical;font:inherit;font-size:1.05rem;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--white);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 10px}
.chip2{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:999px;background:var(--white);padding:6px 13px;font-weight:700;font-size:.92rem;color:var(--ink)}
.chip2:hover{background:var(--yellow)}
.chip2[aria-pressed="true"]{background:var(--orange)}
.owntk{max-width:540px;margin:0 auto;background:var(--white);border:3px solid var(--ink);border-radius:8px;padding:14px;box-shadow:6px 7px 0 rgba(10,47,56,.25);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(0,114,145,.18) 31px 33px)}

/* the jar, opened */
.jarlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:6px}
.jt{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:8px;overflow:hidden;transform:rotate(var(--r,0deg));box-shadow:4px 5px 0 rgba(10,47,56,.2);display:flex;flex-direction:column}
.jt .band{height:54px;background:linear-gradient(180deg,var(--s1,#ffe7a8),var(--s2,#f0a80f));border-bottom:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:2px}
.jt .band svg{width:44px;height:44px}
.jt p{margin:8px 10px;font-weight:700;line-height:1.3;font-size:.95rem;flex:1}
.jt .jacts{display:flex;gap:6px;padding:0 8px 8px;align-items:center}
.jt .jacts .sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--white);cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:28px;height:28px}
.ib[aria-pressed="true"]{background:var(--yellow)}
.thisone{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);border-radius:12px;background:var(--orange);padding:6px 12px;color:var(--ink)}
.jt.star{box-shadow:0 0 0 4px var(--yellow),4px 5px 0 rgba(10,47,56,.2)}
.jt.picked{box-shadow:0 0 0 5px var(--orange),4px 5px 0 rgba(10,47,56,.2)}
.jt .gtag{position:absolute;top:4px;left:6px;background:var(--ink);color:var(--yellow);border-radius:6px;font-size:.62rem;font-weight:900;letter-spacing:.14em;padding:1px 6px}
.jt .ptag{position:absolute;top:4px;right:6px;background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-size:.66rem;font-weight:900;padding:0 6px}
.empty{text-align:center;padding:20px}
.empty svg{width:110px;height:auto;opacity:.75}

/* blueprint */
.bp{border:3px solid var(--ink);border-radius:20px;padding:16px;color:#eaf6ff;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 24px),linear-gradient(160deg,#1c6ea8,#0f4d7a)}
.bp h3{font-family:var(--display);font-variation-settings:"wdth" 116,"wght" 900;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.bp h3:first-child{margin-top:0}
.bp h3 svg{width:28px;height:28px}
.bpidea{background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.bpidea .mi{display:flex;gap:2px;flex:none}
.bpidea .mi svg{width:38px;height:38px}
.bpidea p{margin:0;font-weight:700;line-height:1.3}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.opt{font:inherit;cursor:pointer;border:2px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(255,255,255,.1);color:#fff;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.8rem}
.opt svg{width:40px;height:40px}
.opt[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--ink);transform:rotate(-2deg)}
.opt.name{font-size:.95rem;padding:10px 4px}
.bpout{margin-top:16px}
.bpout .send-wrap,.bpout > div{color:var(--ink)}
.bplink{display:flex;justify-content:center;margin-top:14px}

/* this week's era */
.cell{position:relative}
.cell.wk::after{content:"THIS WEEK";position:absolute;top:3px;left:4px;background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:6px;
  font-family:var(--display);font-weight:900;font-size:.5rem;letter-spacing:.1em;padding:0 4px;white-space:nowrap;line-height:1.5}
.yrstamp.wk{background:var(--orange)}

/* blast off */
.flame{position:absolute;left:50%;bottom:-78px;width:70px;height:80px;margin-left:-35px;border-radius:50% 50% 50% 50%/28% 28% 72% 72%;opacity:0;pointer-events:none;transform-origin:50% 0;
  background:radial-gradient(ellipse at 50% 12%,#fffbe0 0 18%,#ffc247 38%,#ef7724 62%,rgba(239,119,36,0) 72%)}
.mach.launch .flame{opacity:1;animation:flick .09s linear infinite alternate}
@keyframes flick{to{transform:scaleY(1.25) scaleX(.88)}}
.mach.launch{animation:launch 1.9s cubic-bezier(.45,0,.55,1) forwards}
@keyframes launch{0%{transform:translateY(0)}12%{transform:translateY(10px) scaleY(.96)}38%{transform:translateY(-780px)}62%{transform:translateY(-780px)}86%{transform:translateY(12px)}93%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.puff{position:absolute;z-index:5;width:48px;height:48px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 35%,#ffffff,#d6dde0 58%,rgba(214,221,224,0) 72%);animation:puff 1.4s ease-out forwards}
@keyframes puff{0%{transform:translate(0,0) scale(.3);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(1.9);opacity:0}}

/* jackpot and confetti */
.jp{position:absolute;z-index:8;left:50%;top:36%;transform:translate(-50%,-50%) rotate(-4deg);text-align:center;pointer-events:none;width:90%;animation:jpin .5s cubic-bezier(.3,1.6,.5,1)}
.jp b{display:block;font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125,"wght" 900;font-size:clamp(2.4rem,8vw,4.6rem);color:var(--yellow);-webkit-text-stroke:3px var(--ink);text-shadow:5px 6px 0 var(--ink);line-height:1}
.jp span{display:inline-block;margin-top:10px;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:800;font-family:var(--display);font-size:1.05rem}
.jp.out{transition:opacity .5s;opacity:0}
@keyframes jpin{from{transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}}
.cf{position:absolute;z-index:9;width:10px;height:15px;border:2px solid var(--ink);border-radius:2px;pointer-events:none;animation:cf 1.7s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
.itk.jackpot{border-color:var(--plum);border-width:5px}
.itk.jackpot .goldtag{background:var(--plum);color:var(--white)}

/* depends on what? */
.deps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.deps[hidden]{display:none}
.deph{width:100%;text-align:center;font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 110,"wght" 900;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.dep{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:4px 9px 4px 4px;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.82rem;color:var(--ink)}
.dep svg{width:28px;height:28px}
.dep[aria-pressed="true"]{background:var(--yellow);transform:rotate(-2deg)}
.dpanel{max-width:460px;margin:0 auto;text-align:center;animation:pop .25s ease-out}
.dpanel > svg{width:84px;height:84px}
.dpanel p{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:6px 0 4px}
.dpanel .dep{font-size:.98rem;padding:8px 12px 8px 6px}
.dpanel .dep svg{width:36px;height:36px}
.jt .dline{margin:-4px 10px 8px;font-size:.8rem;color:var(--body-tint)}

/* Base 5 so far */
.tally{margin:12px auto 0;max-width:330px;font-size:.8rem;text-align:center;animation:pop .3s ease-out}
.tally .tl{font-family:var(--display);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.68rem}
.tally .tb{display:flex;height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:4px 0;background:var(--white)}
.tally .tb i{display:block;transition:flex .5s}
.tb .y{background:var(--bright)}.tb .d{background:var(--yellow)}.tb .n{background:#c9d2d4}
.tally .tn{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.tally .tn span{display:inline-flex;align-items:center;gap:2px}
.tally .tn svg{width:20px;height:20px}
.swtally{min-height:62px}

/* blueprint extras */
.maker{display:flex;gap:12px;align-items:center;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:10px;transform:rotate(-.6deg);animation:pop .3s ease-out}
.maker svg{width:54px;height:54px;flex:none}
.maker small{display:block;font-family:var(--display);font-weight:900;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.maker b{font-family:var(--display);font-weight:900;font-size:1.1rem}
.maker p{margin:2px 0 0;font-size:.9rem;line-height:1.3}
.cheer{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:0 0 14px}
.cheer svg{height:72px;width:auto}
.cheer b{color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.5rem;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;transform:rotate(-3deg);margin-bottom:14px}
/* blueprint: the extras fold away */
.bpmore{margin-top:16px;border:2px dashed rgba(255,255,255,.55);border-radius:14px;padding:4px 12px 10px}
.bpmore summary{cursor:pointer;list-style:none;font-family:var(--display);font-weight:900;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;padding:8px 0;display:flex;align-items:center;gap:8px}
.bpmore summary::-webkit-details-marker{display:none}
.bpmore summary::before{content:"+";display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--white);color:var(--ink);font-size:1rem}
.bpmore[open] summary::before{content:"-"}
.liclink{display:flex;justify-content:center;margin-top:16px}

/* the picked idea, growing with the project */
.proj{position:relative;margin:14px auto 0;background:var(--white);border:3px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:6px 7px 0 rgba(10,47,56,.25);animation:pop .35s ease-out}
.proj .pband{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,var(--s1,#ffe7a8),var(--s2,#f0a80f));border-bottom:3px solid var(--ink)}
.proj .pband .mi{display:flex;gap:2px;flex:none}
.proj .pband .mi svg{width:40px;height:40px}
.proj .pband small{display:block;font-family:var(--display);font-weight:900;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--yellow);border-radius:6px;padding:1px 8px;width:max-content}
.proj .pt{margin:0;padding:10px 14px 4px;font-weight:700;line-height:1.3;font-size:1.02rem}
.stick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 12px 4px}
.sk{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:.72rem;font-weight:700;color:var(--body-tint);line-height:1.1}
.sk i{width:52px;height:52px;border-radius:50%;border:3px dashed rgba(10,47,56,.3);display:grid;place-items:center;background:var(--paper)}
.sk i svg{width:32px;height:32px;opacity:.25;filter:grayscale(1)}
.sk.got{color:var(--ink)}
.sk.got i{border:3px solid var(--ink);background:var(--yellow);transform:rotate(var(--r,-6deg));box-shadow:2px 3px 0 var(--ink)}
.sk.got i svg{opacity:1;filter:none}
.sk.here i{background:var(--orange);animation:pop .4s ease-out}
.proj .pline{margin:6px 14px 0;font-size:.9rem;color:var(--body-tint);text-align:center}
.proj .pacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 12px 14px}
.proj.done{background:linear-gradient(120deg,#fff3c4,#ffd56b 40%,#fff3c4 60%,#ffd56b);background-size:250% 100%;animation:shimmer 3s linear infinite}
@media (max-width:520px){.sk i{width:42px;height:42px}.sk i svg{width:26px;height:26px}.sk{font-size:.62rem}}

/* overheating */
.mach.hot .body{background:linear-gradient(160deg,#ff9a5c,#d75f10 58%,#a8430a)}
.mach.hot .bulb{background:#ff6b3d;animation-duration:.5s}
.heat{position:absolute;z-index:4;left:6px;right:68px;top:60px;bottom:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:rgba(10,47,56,.88);color:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px;animation:pop .3s ease-out}
.heat[hidden]{display:none}
.heat b{font-family:var(--display);font-weight:900;font-size:1.4rem;color:var(--yellow);letter-spacing:.06em}
.heat .therm{width:min(220px,90%);height:16px;border:3px solid var(--paper);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12)}
.heat .therm i{display:block;height:100%;background:linear-gradient(90deg,#00a6c9,#ffc247,#ef7724);transition:width 1s linear}
.heat .hb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.heat .hb .big{font-size:.9rem;padding:7px 12px;box-shadow:3px 4px 0 #000}
.heat .hb .big svg{width:24px;height:24px}
.steam{position:absolute;z-index:5;width:30px;height:30px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:steam 1.6s ease-out forwards}
@keyframes steam{0%{transform:translateY(0) scale(.4);opacity:.9}100%{transform:translateY(-90px) scale(2.2);opacity:0}}
.lever.cool{cursor:not-allowed}
.lever.cool .knob{background:radial-gradient(circle at 34% 30%,#d6dde0,#9aa7ab 52%,#6e7b80)}
@media (max-width:520px){.heat{right:56px;top:52px}.heat b{font-size:1.1rem}}

.licence{position:relative;margin:18px auto 0;max-width:520px;background:#fff8e6;color:var(--ink);border:5px double var(--ink);border-radius:14px;padding:16px 18px 18px;box-shadow:6px 7px 0 rgba(10,47,56,.25)}
.licence .lh{display:flex;align-items:center;gap:10px;border-bottom:2px dashed var(--ink);padding-bottom:8px;margin-bottom:10px}
.licence .lh svg{width:46px;height:46px}
.licence .lh b{font-family:var(--display);font-weight:900;font-size:1.25rem;letter-spacing:.14em}
.licence dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0 90px 0 0;font-size:.95rem}
.licence dt{font-weight:700}
.licence dd{margin:0}
.licence .seal{position:absolute;right:14px;bottom:14px;width:80px;height:80px;border-radius:50%;border:3px solid var(--orange);color:var(--orange-deep);display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-weight:900;font-size:.5rem;letter-spacing:.1em;transform:rotate(12deg);line-height:1.25;background:rgba(255,194,71,.18)}
.licacts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pillbtn.label{cursor:default;box-shadow:none}
.pillbtn.label:hover{transform:none}
@media print{
  body *{visibility:hidden !important}
  #licence,#licence *{visibility:visible !important}
  #licence{position:fixed;left:0;right:0;top:0;margin:24px auto;box-shadow:none}
}

@media (max-width:900px){
  .lab{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"m m" "j r";padding-top:64px}
  .mach{grid-area:m}
  .jaybox{grid-area:j}
  .jarbtn{grid-area:r}
}
@media (max-width:820px){.fuel{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){
  :root{--dh:80px}
  .mach{padding-right:54px}
  .lever{width:52px}
  .lever .knob{width:38px;height:38px;left:7px}
  .lever .track{left:19px}
  .lever .base{width:42px;left:5px}
  .dome{height:84px}
  .port{width:106px;height:106px;margin-left:-53px;top:18px}
  .body{padding:54px 10px 14px}
  .dials{gap:6px}
  .dk{font-size:.62rem;letter-spacing:.14em}
  .cell b{font-size:.62rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cell svg{width:calc(var(--dh) * .5);height:calc(var(--dh) * .5)}
  .wordmark{font-size:1.5rem;gap:6px}.wordmark svg{width:34px;height:34px}
  .pillbtn{padding:5px 10px 5px 6px;font-size:.88rem}
  .lab{padding-top:60px}
  .jaypic svg{width:96px}.jaypic svg.wide{width:150px}
  .jarbtn svg{width:120px}
  .bubble{font-size:.9rem;max-width:160px}
  .tk-text{font-size:1.02rem}
}
@media (prefers-reduced-motion: reduce){
  .port .vortex,.bulb,.lever.hint .knob,.itk.gold{animation:none !important}
  .itk.print,.mach.shake,.jarbtn.bump,.jaypic.hop,.bubble.pop,.flash.go,.mach.launch,.jp,.tally,.maker,.dpanel,.proj,.proj.done,.sk.here i,.heat{animation:none !important}
  .puff,.cf,.steam{display:none !important}

</head>
<body>
<div class="grain"></div>

<div class="wrap">

  <div class="topbar">
    <h1 class="wordmark"><span id="wmIcon"></span>IDEA <span>LAB</span></h1>
    <div class="sp"></div>
    <span class="pillbtn label" id="whoBtn" hidden></span>
    <button class="pillbtn plain" id="soundBtn" type="button" aria-pressed="true"></button>
  </div>

  <!-- ============ THE LAB ============ -->
  <section class="lab" id="lab" aria-label="The time machine">
    <div class="floor"></div>

    <div class="jaybox">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="jaypic" id="jaypic"></div>
    </div>

    <div class="mach" id="mach">
      <div class="dome">
        <div class="ant"></div><div class="bulb"></div>
        <button class="port" id="port" type="button" aria-label="The time window">
          <span class="vortex"></span><span class="rings"></span><span class="glare"></span><span class="pig" id="pig"></span>
        </button>
      </div>
      <div class="body">
        <i class="rivet" style="left:10px;top:10px"></i><i class="rivet" style="right:10px;top:10px"></i>
        <i class="rivet" style="left:10px;bottom:10px"></i><i class="rivet" style="right:10px;bottom:10px"></i>
        <span class="flame" aria-hidden="true"></span>
        <div class="dials" id="dials"></div>
        <span class="plate">CLUNKER 3000</span>
        <div class="slot"></div>
      </div>
      <div class="heat" id="heat" hidden role="status">
        <b>OVERHEATED!</b>
        <span id="heatLine">The Clunker needs a minute.</span>
        <span class="therm" aria-hidden="true"><i id="heatBar" style="width:100%"></i></span>
        <span class="hb"><button class="big yel" type="button" id="heatJar"><span data-ic="jaricon"></span>Peek in the jar</button><button class="big quiet" type="button" id="heatSwipe"><span data-ic="scales"></span>Swipe a few</button></span>
      </div>
      <button class="lever hint" id="lever" type="button" aria-label="Pull the lever">
        <span class="pull">PULL ME</span>
        <span class="track"></span><span class="base"></span><span class="knob" id="knob"></span>
      </button>
    </div>

    <button class="jarbtn" id="jarBtn" type="button" aria-label="Open your idea jar">
      <span id="jarArt"></span>
      <span class="count" id="jarCount">0</span>
      <span class="jl">Idea jar</span>
    </button>

    <div class="flash" id="flash"></div>
    <div class="pigeon" id="pigeon"></div>
    <div class="bonnie-run" id="bonnieRun"></div>
  </section>

  <!-- ============ THE TICKET TRAY ============ -->
  <div class="tray">
    <div class="trayslot"></div>
    <div class="tkwrap" id="tkwrap"></div>
  </div>

  <!-- ============ MORE WAYS IN ============ -->
  <div class="moreh">More ways to find one</div>
  <div class="fuel">
    <button class="ftile f1" type="button" data-open="ovShould"><span data-ic="scales"></span><b>Should we?</b><small>Swipe it</small><span class="tick" id="tickShould" hidden></span></button>
    <button class="ftile f2" type="button" data-open="ovMash"><span data-ic="blender"></span><b>Mash up</b><small>Your stuff + time</small></button>
    <button class="ftile f3" type="button" data-open="ovAsk"><span data-ic="speech"></span><b>Ask someone</b><small>Away from the screen</small></button>
    <button class="ftile f4" type="button" data-open="ovOwn"><span data-ic="pencil"></span><b>My own</b><small>Write a ticket</small></button>
  </div>
  <p class="syncline" id="syncline"></p>

</div>

<!-- ============ OVERLAYS ============ -->
<div class="ov" id="ovShould" hidden role="dialog" aria-modal="true" aria-labelledby="swH">
  <div class="ovc" style="max-width:560px">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="swH"><span data-ic="scales"></span>Should we?</h2>
    <div id="swArea"></div>
  </div>
</div>

<div class="ov" id="ovMash" hidden role="dialog" aria-modal="true" aria-labelledby="mashH">
  <div class="ovc">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="mashH"><span data-ic="blender"></span>Mash up</h2>
    <p class="sub">Tap up to three things you are into.</p>
    <div class="likes" id="likes"></div>
    <div class="blender" id="blender"></div>
    <div class="row"><button class="big" id="mashBtn" type="button"><span data-ic="blender"></span>Blend it</button></div>
    <div class="minis" id="minis"></div>
  </div>
</div>

<div class="ov" id="ovAsk" hidden role="dialog" aria-modal="true" aria-labelledby="askH">
  <div class="ovc" style="max-width:620px">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="askH"><span data-ic="speech"></span>Ask someone</h2>
    <div class="askcard" id="askCard"></div>
    <div class="row">
      <button class="big quiet" id="askNext" type="button"><span data-ic="swap"></span>Another one</button>
      <button class="big yel" id="askJot" type="button"><span data-ic="pencil"></span>They said something good</button>
    </div>
    <div id="askJotBox" hidden style="max-width:520px;margin:14px auto 0">
      <textarea class="box" id="askText" placeholder="What did they say? A few words is plenty."></textarea>
      <div class="row"><button class="big" id="askKeep" type="button"><span data-ic="jaricon"></span>Into the jar</button></div>
    </div>
  </div>
</div>

<div class="ov" id="ovOwn" hidden role="dialog" aria-modal="true" aria-labelledby="ownH">
  <div class="ovc" style="max-width:620px">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="ownH"><span data-ic="pencil"></span>My own ticket</h2>
    <div class="chips" id="ownStarts"></div>
    <div class="owntk"><textarea class="box" id="ownText" placeholder="Anything at all. Half an idea counts." style="background:transparent;border:0;min-height:120px"></textarea></div>
    <div class="row"><button class="big" id="ownKeep" type="button"><span data-ic="jaricon"></span>Into the jar</button></div>
  </div>
</div>

<div class="ov" id="ovJar" hidden role="dialog" aria-modal="true" aria-labelledby="jarH">
  <div class="ovc" style="width:min(900px,100%)">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="jarH"><span data-ic="jaricon"></span><span id="jarTitle">Your idea jar</span></h2>
    <p class="sub" id="jarSub"></p>
    <div id="jarList"></div>
  </div>
</div>

<div class="ov" id="ovBp" hidden role="dialog" aria-modal="true" aria-labelledby="bpH">
  <div class="ovc" style="max-width:720px">
    <button class="x" type="button" data-close aria-label="Close"></button>
    <h2 id="bpH"><span data-ic="blueprint"></span>Blueprint</h2>
    <p class="sub">Tap what fits. All of it can change later.</p>
    <div class="bp" id="bp"></div>
    <div class="bpout" id="sendHost"></div>
    <div class="bplink" id="bpLink"></div>
  </div>
</div>

<script src="/data/send.js"></script>
<script src="/data/jaypix.js?v=1"></script>

    s.innerHTML = svg("jaricon") + "<span>Your jar stays on this device. Signed in to your school account, it follows you.</span>";
  }
}
function drawAll(){ drawWho(); drawDials(); drawJar(); drawSyncLine(); }

/* ================================================================
   START
   ================================================================ */
migrateOld();
el("wmIcon").innerHTML = svg("invention");
fillIcons();
drawSound();
drawAll();
waiting();
if(st.pick && st.jar.some(function(j){ return j.id === st.pick; })) say("proj");
else if(st.jar.length) say("back", { n: st.jar.length + (st.jar.length === 1 ? " idea" : " ideas") }); else say("hello");
el("tickShould").hidden = true;
(function(){ var done = SW.length - swLeft(); if(done){ var t = el("tickShould"); t.hidden = false; t.textContent = done + " of " + SW.length; } })();

/* who is this? school sign in first */
if(S.call && S.syncUrl && !S.guest){
  S.call("whoami").then(function(o){
    if(!o || !o.ok) return;
    if(o.staff){ staffHere = true; if(!who) drawWho(); return; }
    var w = String(o.who || "").toUpperCase();
    if(PREFIX[w]){ signedAs = w; if(w !== who) setWho(w); else { drawWho(); pullJar(); } }
  }, function(){}).catch(function(e){ try{ console.warn("Idea Lab:", e); }catch(x){} });
}

window.IdeaLab = { state: function(){ return st; }, who: function(){ return who; }, pull: pullJar };
})();
