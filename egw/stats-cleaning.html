<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleaning and preparing data - EGW GCSE HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<style>
/* Data detective (widget on this page only) */
.dd-status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.dd-status .wbig{font-size:1.35rem}
.dd-tab{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.95rem;background:#fff}
.dd-tab th{font-family:var(--display);font-size:.74rem;line-height:1.15;padding:6px 2px;background:var(--accent-soft);border:2px solid var(--ink);font-weight:700}
.dd-tab td{border:1px solid var(--line);padding:0;text-align:center}
.dd-tab col.dd-name{width:19%}
.dd-c{display:block;width:100%;min-height:38px;border:0;background:#fff;font:inherit;color:var(--ink);cursor:pointer;padding:6px 1px;font-variant-numeric:tabular-nums}
.dd-c:hover{background:var(--accent-soft)}
.dd-c.sel{outline:3px solid var(--blue);outline-offset:-3px;background:#eef1ff}
.dd-c.fixed{background:rgba(25,195,154,.2);font-weight:700}
.dd-c.out{color:#8a8fa8;text-decoration:line-through;background:#f1f1f6}
.dd-c.kept{background:rgba(255,210,63,.35);font-weight:700}
.dd-c:disabled{cursor:default}
.dd-c.nm{font-family:var(--display);font-weight:700;text-align:left;padding-left:6px}
tr.dd-del .dd-c{text-decoration:line-through;color:#a0a4b8;background:#f1f1f6}
tr.dd-act td{background:var(--paper);padding:10px 10px 12px;border:2px solid var(--ink);text-align:left}
.dd-act p{margin:0 0 8px;font-size:.95rem}
.dd-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.dd-acts .btn{justify-content:center;padding:9px 6px;font-size:.92rem}
.dd-chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.dd-chips .btn{padding:8px 16px}
.dd-say{border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:.95rem}
.dd-say.good{background:rgba(31,157,99,.14);border-left:5px solid var(--good)}
.dd-say.hmm{background:rgba(255,93,93,.12);border-left:5px solid var(--coral)}
.dd-say.info{background:#fff;border-left:5px solid var(--blue)}
.dd-foot td{font-family:var(--display);font-weight:700;padding:6px 1px;font-size:.88rem;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dd-foot td.lab{text-align:left;font-size:.72rem;padding-left:6px;letter-spacing:.02em}
.dd-foot.now td{background:var(--accent-soft);border-top:2px solid var(--ink)}
.dd-foot.start td{color:#6b7090;font-weight:500}
.dd-flash{animation:ddflash .9s ease}
@keyframes ddflash{0%{background:var(--sun)}100%{background:var(--accent-soft)}}
.dd-key{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;margin:8px 0 0;color:var(--body-tint)}
.dd-key span{display:inline-flex;align-items:center;gap:5px}
.dd-key i{display:inline-block;width:14px;height:14px;border:1px solid var(--ink);border-radius:3px}
.dd-sum{margin:6px 0 0;padding-left:20px}
.dd-sum li{margin-bottom:6px;font-size:.95rem}
.linkbtn{font:inherit;font-size:.92rem;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:4px 0}
@media (max-width:420px){
  .dd-tab{font-size:.9rem}
  .dd-tab th{font-size:.68rem}
  .dd-foot td{font-size:.8rem}
  .dd-foot td.lab{font-size:.66rem;padding-left:3px}
  .dd-c.nm{padding-left:3px}
  .wpanel.dd-panel{padding:10px 6px}
}
</style>
</head>

<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/egw/"><span class="hqlogo">EGW</span><span class="hqname">GCSE HQ<small>revision and planning</small></span></a>

</div>

<footer>
  <div class="wrap">

  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=8"></script>
<script>
(function(){
"use strict";

var INK = "#141a33", TEAL = "#3a5cff", BRIGHT = "#22b8e6", ORANGE = "#ff5d5d",
    YELLOW = "#ffd23f", MINT = "#19c39a", PLUM = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

/* ---------- figures ---------- */

/* The enquiry cycle with the cleaning step picked out */
var CYCLE = (function(){
  var s = '<svg viewBox="0 0 360 178" role="img" aria-label="The enquiry cycle: plan, collect, then clean the data, then process and represent, interpret, evaluate, and back to plan. Cleaning sits between collecting and processing." style="max-width:460px">';
  s += '<defs><marker id="scArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="' + INK + '"/></marker></defs>';
  function box(x, y, top, sub, fill, bold){
    var t = '<rect x="' + x + '" y="' + y + '" width="104" height="52" rx="12" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (bold ? 4 : 2.5) + '"/>';
    t += '<text x="' + (x + 52) + '" y="' + (y + 22) + '" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="16" fill="' + INK + '">' + top + '</text>';
    t += '<text x="' + (x + 52) + '" y="' + (y + 41) + '" text-anchor="middle" ' + BODY + ' font-size="14" fill="' + INK + '">' + sub + '</text>';
    return t;
  }
  function arr(x1, y1, x2, y2, dash){
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="2.5" marker-end="url(#scArr)"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/>';
  }
  s += box(6, 10, "Plan", "hypothesis", WHITE);
  s += box(128, 10, "Collect", "the data", WHITE);
  s += box(250, 10, "Clean", "find and fix", YELLOW, true);
  s += box(250, 116, "Process", "and represent", WHITE);
  s += box(128, 116, "Interpret", "the results", WHITE);
  s += box(6, 116, "Evaluate", "and refine", WHITE);
  s += arr(111, 36, 125, 36) + arr(233, 36, 247, 36);
  s += arr(302, 63, 302, 113);
  s += arr(249, 142, 235, 142) + arr(127, 142, 113, 142);
  s += arr(58, 115, 58, 65, true);
  s += '<text x="180" y="94" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="15" fill="' + PLUM + '">clean first, then calculate</text>';
  return s + '</svg>';
})();

/* ---------- tables ---------- */
var GROUP_Q =
'<table class="datatable"><tr><th>Time, t (minutes)</th><th>Frequency</th></tr>' +
'<tr><td>0 &lt; t &le; 10</td><td>?</td></tr><tr><td>10 &lt; t &le; 20</td><td>?</td></tr>' +
'<tr><td>20 &lt; t &le; 30</td><td>?</td></tr><tr><td>30 &lt; t &le; 40</td><td>?</td></tr></table>';

var RAW_PETS =
'<table class="datatable"><tr><th>Year</th><th>Answers to &quot;Do you have a pet?&quot;</th></tr>' +
'<tr><th>Year 10</th><td style="text-align:left">Yes, Y, no, yes, No, Yes</td></tr>' +
'<tr><th>Year 11</th><td style="text-align:left">y, No, NO, Yes, n, Yes, YES, yes</td></tr></table>';

var TWOWAY_BLANK =
'<table class="datatable" style="margin-top:10px"><tr><th></th><th>Pet</th><th>No pet</th></tr>' +
'<tr><th>Year 10</th><td>a</td><td>b</td></tr><tr><th>Year 11</th><td>c</td><td>d</td></tr></table>';

/* ---------- the data detective widget ---------- */
var COLS = ["Height", "Shoe size", "Travel time", "Pets"];
var UNITS = [" cm", "", " minutes", ""];
var DD = [
  ["Ali", 162, 6, 12, 1],
  ["Bea", 155, 5, 20, 0],
  ["Cal", 1.58, 5, 8, 2],
  ["Dev", 171, 8, 15, 1],
  ["Dev", 171, 8, 15, 1],
  ["Eli", 149, 4, 25, 3],
  ["Fin", 17, 7, 5, 2],
  ["Gus", 166, 7, 75, 1],
  ["Hal", 158, 6, 18, null],
  ["Ivy", 175, 9, "1O", 0],
  ["Jo", 152, 5, 10, 1],
  ["Kai", 160, 6, 22, 4],
  ["Lia", 164, 7, 14, 0],
  ["Mo", 157, 5, 9, 2]
];
/* cases: where they are, the best move, and what the original form says */
var CASES = {
  unit:  { r: 2, c: 0, best: "fix", fixTo: 158, chips: ["158", "15.8", "1580"],
           form: "Cal wrote <b>1.58 m</b>. Everyone else wrote their height in centimetres.",
           sum: "<b>Cal, 1.58</b>: a unit mix up (metres, not cm). Fixed to 158 cm so every height is in the same unit." },
  dup:   { r: 3, c: -1, best: "row",
           form: "There is only one form from Dev. It was typed into the spreadsheet twice.",
           sum: "<b>Dev, twice</b>: a duplicate row. One copy deleted, otherwise Dev counts double in every mean." },
  imp:   { r: 6, c: 0, best: "out", okRow: true,
           form: "Fin's form says 17 as well, so the slip happened on the form. The real height is unknown.",
           sum: "<b>Fin, 17 cm</b>: an impossible value that cannot be fixed (the form says 17 too). Left out of the height mean." },
  outl:  { r: 7, c: 2, best: "fine",
           form: "Gus wrote <b>75</b> and added: &quot;two buses from the next town&quot;. It is real.",
           sum: "<b>Gus, 75 minutes</b>: an outlier, but a genuine one. It stays." },
  blank: { r: 8, c: 3, best: "out", okRow: true,
           form: "Hal left the pets question blank.",
           sum: "<b>Hal, blank</b>: missing data. A blank is not a zero, so it is left out of the pets mean only." },
  typo:  { r: 9, c: 2, best: "fix", fixTo: 10, chips: ["10", "1", "100"],
           form: "Ivy's form says <b>10</b>. The O in the sheet is a letter, typed by mistake.",
           sum: "<b>Ivy, 1O</b>: a typing error (a letter O, not a zero). A spreadsheet would skip it as text. Fixed to 10." }
};
var CASE_IDS = ["unit", "dup", "imp", "outl", "blank", "typo"];

function caseAt(r, c){
  for(var k = 0; k < CASE_IDS.length; k++){
    var id = CASE_IDS[k], cs = CASES[id];
    if(id === "dup"){ if(r === 3 || r === 4) return id; continue; }
    if(cs.r === r && cs.c === c) return id;
  }
  return null;
}
function rawShow(v){ return v === null ? "" : String(v); }
function fmt(x, dp){ return x === null ? "&ndash;" : x.toFixed(dp); }
function meanOf(vals){
  if(!vals.length) return null;
  var t = 0; vals.forEach(function(v){ t += v; });
  return t / vals.length;
}
var DPS = [1, 2, 1, 2];
var START = COLS.map(function(n, c){
  var v = DD.map(function(row){ return row[c + 1]; }).filter(function(x){ return typeof x === "number"; });
  return { mean: meanOf(v), n: v.length };
});

function mountDetective(el, api){
  var d = api.data;
  d.del = d.del || {}; d.fix = d.fix || {}; d.out = d.out || {}; d.kept = d.kept || {}; d.closed = d.closed || {};
  d.misses = d.misses || 0;
  var sel = null, say = "", sayCls = "", chips = false, formShown = false;
  var prevMeans = null;

  el.innerHTML =
    '<div class="wpanel dd-panel">' +
      '<div class="dd-status">' +
        '<div><div class="tiny" style="margin:0">Cases closed</div><div class="wbig"><span id="ddClosed">0</span> of 6</div></div>' +
        '<div style="text-align:right"><div class="tiny" style="margin:0">Second looks</div><div class="wbig" id="ddMiss">0</div></div>' +
      '</div>' +
      '<div id="ddTable"></div>' +
      '<div class="dd-key"><span><i style="background:rgba(25,195,154,.35)"></i>fixed</span><span><i style="background:#f1f1f6"></i>left out</span><span><i style="background:rgba(255,210,63,.5)"></i>checked, kept</span></div>' +
    '</div>' +
    '<div class="wpanel" id="ddEnd">' +
      '<div class="wrow" style="margin:0"><button class="btn btn-quiet hidden" type="button" id="ddShow">Show me the rest</button></div>' +
      '<div class="wnote" id="ddMsg" aria-live="polite">Tap any cell you are suspicious of. Tap a name to look at the whole row.</div>' +
    '</div>';

  var tabHost = el.querySelector("#ddTable");
  var showBtn = el.querySelector("#ddShow");
  var msg = el.querySelector("#ddMsg");

  function val(r, c){
    var k = r + "," + c;
    if(d.del[r] || d.out[k]) return null;
    if(d.fix[k] !== undefined) return d.fix[k];
    return DD[r][c + 1];
  }
  function means(){
    return COLS.map(function(n, c){
      var v = [];
      for(var r = 0; r < DD.length; r++){ var x = val(r, c); if(typeof x === "number") v.push(x); }
      return { mean: meanOf(v), n: v.length };
    });
  }
  function rowCase(r){
    for(var c = 0; c < 4; c++){ var id = caseAt(r, c); if(id && id !== "dup" && !d.closed[id]) return id; }
    return null;
  }
  function closedCount(){ return CASE_IDS.filter(function(id){ return d.closed[id]; }).length; }

  function draw(){
    var m = means();
    var s = '<table class="dd-tab"><colgroup><col class="dd-name"><col><col><col><col></colgroup>' +
      '<thead><tr><th>Name</th><th>Height<br>(cm)</th><th>Shoe<br>size</th><th>Travel<br>(min)</th><th>Pets</th></tr></thead><tbody>';
    DD.forEach(function(row, r){
      var dead = !!d.del[r];
      s += '<tr' + (dead ? ' class="dd-del"' : '') + '>';
      s += '<td><button type="button" class="dd-c nm' + (sel && sel.r === r && sel.c === -1 ? " sel" : "") + '" data-r="' + r + '" data-c="-1"' + (dead || d.result ? " disabled" : "") + ' aria-label="Row for ' + row[0] + '">' + row[0] + '</button></td>';
      for(var c = 0; c < 4; c++){
        var k = r + "," + c, cls = "dd-c", txt = rawShow(row[c + 1]);
        if(d.fix[k] !== undefined){ cls += " fixed"; txt = String(d.fix[k]); }
        else if(d.out[k]) cls += " out";
        else if(d.kept[k]) cls += " kept";
        if(sel && sel.r === r && sel.c === c) cls += " sel";
        var lock = dead || d.result || d.fix[k] !== undefined || d.out[k] || d.kept[k];
        s += '<td><button type="button" class="' + cls + '" data-r="' + r + '" data-c="' + c + '"' + (lock ? " disabled" : "") +
             ' aria-label="' + row[0] + ', ' + COLS[c] + ': ' + (txt === "" ? "blank" : txt) + '">' + (txt === "" ? "&nbsp;" : txt) + '</button></td>';
      }
      s += '</tr>';
      if(sel && sel.r === r) s += '<tr class="dd-act"><td colspan="5">' + actHtml() + '</td></tr>';
    });
    s += '</tbody><tfoot>';
    s += '<tr class="dd-foot now"><td class="lab">Mean now</td>';
    m.forEach(function(x, c){
      var changed = prevMeans && (prevMeans[c].mean !== x.mean);
      s += '<td' + (changed ? ' class="dd-flash"' : '') + '>' + fmt(x.mean, DPS[c]) + '</td>';
    });
    s += '</tr><tr class="dd-foot"><td class="lab">Values</td>';
    m.forEach(function(x){ s += '<td>' + x.n + '</td>'; });
    s += '</tr><tr class="dd-foot start"><td class="lab">Mean at start</td>';
    START.forEach(function(x, c){ s += '<td>' + fmt(x.mean, DPS[c]) + '</td>'; });
    s += '</tr></tfoot></table>';
    tabHost.innerHTML = s;
    prevMeans = m;
    el.querySelector("#ddClosed").textContent = closedCount();
    el.querySelector("#ddMiss").textContent = d.misses;
    showBtn.classList.toggle("hidden", !!d.result || d.misses < 2);
    [].forEach.call(tabHost.querySelectorAll("button.dd-c"), function(b){
      b.onclick = function(){
        var r = +b.dataset.r, c = +b.dataset.c;
        if(sel && sel.r === r && sel.c === c){ sel = null; }
        else { sel = { r: r, c: c }; }
        say = ""; sayCls = ""; chips = false; formShown = false;
        draw();
      };
    });
    var act = tabHost.querySelector(".dd-act");
    if(act){
      [].forEach.call(act.querySelectorAll("[data-a]"), function(b){
        b.onclick = function(){ decide(b.dataset.a, b.dataset.v); };
      });
      act.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function actHtml(){
    var r = sel.r, c = sel.c, row = DD[r];
    var head = c === -1 ? '<b>' + row[0] + '</b>, the whole row' : '<b>' + row[0] + '</b>, ' + COLS[c].toLowerCase() + ': <b>' + (rawShow(row[c + 1]) || "blank") + '</b>';
    var s = '<p>' + head + '. What would you like to do?</p>';
    if(chips){
      var cs = CASES[caseAt(r, c)];
      s += '<p>Change it to:</p><div class="dd-chips">';
      cs.chips.forEach(function(v){ s += '<button type="button" class="btn btn-quiet" data-a="chip" data-v="' + v + '">' + v + '</button>'; });
      s += '<button type="button" class="linkbtn" data-a="unchip">back</button></div>';
    }else if(c === -1){
      s += '<div class="dd-acts"><button type="button" class="btn btn-quiet" data-a="row">Delete the row</button>' +
           '<button type="button" class="btn btn-quiet" data-a="fine">Row is fine</button></div>';
    }else{
      s += '<div class="dd-acts">' +
        '<button type="button" class="btn btn-quiet" data-a="fix">Fix it</button>' +
        '<button type="button" class="btn btn-quiet" data-a="out">Leave it out</button>' +
        '<button type="button" class="btn btn-quiet" data-a="row">Delete the row</button>' +
        '<button type="button" class="btn btn-quiet" data-a="fine">It is fine</button></div>';
    }
    s += '<button type="button" class="linkbtn" data-a="form">' + (formShown ? "Original form:" : "Check the original form") + '</button>';
    if(formShown){
      var id = c === -1 ? (r === 3 || r === 4 ? "dup" : null) : caseAt(r, c);
      if(id && d.closed[id] && id !== "outl") id = null;
      if(id === "dup" && c === -1) s += '<div class="dd-say info">' + CASES.dup.form + '</div>';
      else if(id && id !== "dup") s += '<div class="dd-say info">' + CASES[id].form + '</div>';
      else s += '<div class="dd-say info">The form matches the spreadsheet' + (id === "dup" ? ' for this value' : '') + '.</div>';
    }
    if(say) s += '<div class="dd-say ' + sayCls + '">' + say + '</div>';
    return s;
  }

  function miss(t){ d.misses++; api.save(); say = t; sayCls = "hmm"; draw(); }
  function nudge(t){ say = t; sayCls = "info"; draw(); }
  function close(id, t){
    d.closed[id] = true; api.save();
    sel = null; chips = false;
    msg.innerHTML = '<div class="dd-say good">' + t + '</div>';
    draw();
    if(closedCount() === CASE_IDS.length) finish(false);
  }

  function decide(a, v){
    var r = sel.r, c = sel.c, row = DD[r];
    if(a === "form"){ formShown = !formShown; draw(); return; }
    if(a === "unchip"){ chips = false; draw(); return; }
    var id = c === -1 ? (r === 3 || r === 4 ? "dup" : null) : caseAt(r, c);
    if(id && d.closed[id]) id = null;
    var shown, k;

    if(!id && c === -1 && rowCase(r)){
      var rc = rowCase(r);
      if(a === "row" && (rc === "imp" || rc === "blank")){ id = rc; c = CASES[rc].c; }
    }
    if(!id && c === -1 && rowCase(r)){
      if(a === "fine"){ nudge("Are you sure? Have a slow look along " + row[0] + "'s row."); return; }
      miss("Something in " + row[0] + "'s row does need a look, but deleting the whole row throws the good answers away too. You could tap the cell itself.");
      return;
    }
    k = r + "," + c; shown = rawShow(row[c + 1]);
    if(!id){
      /* an ordinary value */
      if(a === "fine"){ nudge(c === -1 ? "Agreed. Nothing odd about " + row[0] + "'s row." : "Agreed, nothing wrong with that one."); return; }
      if(c === -1 || a === "row"){ miss("Hmm, " + row[0] + "'s answers all look believable. Deleting real data can bias your results, so only remove what you have a reason to doubt."); return; }
      if(a === "fix"){ miss("Fix it to what? " + shown + UNITS[c] + " looks believable for a " + COLS[c].toLowerCase() + ". Only change values you have a reason to doubt."); return; }
      miss("Hmm, " + shown + UNITS[c] + " looks believable. Leaving out real values can bias your results."); return;
    }

    if(id === "dup"){
      if(a === "row"){
        d.del[r] = true;
        close("dup", "Case closed. Same name, same everything: Dev was typed in twice. Now Dev counts once, and every mean shifts a little.");
        return;
      }
      if(a === "fine"){ nudge(c === -1 ? "Look at the row next to this one. Notice anything?" : "That value is believable on its own."); return; }
      miss("The value itself looks fine. Is something odd about this whole row? Compare it with its neighbour."); return;
    }

    var cs = CASES[id];
    if(id === "unit" || id === "typo"){
      if(a === "fix"){ chips = true; say = ""; draw(); return; }
      if(a === "chip"){
        if(+v === cs.fixTo){
          d.fix[k] = cs.fixTo;
          close(id, id === "unit"
            ? "Case closed. 1.58 m &times; 100 = 158 cm. Watch the height mean jump."
            : "Case closed. 1O had a letter O in it, so a spreadsheet would treat it as text and skip it. Now it counts as 10.");
          return;
        }
        chips = false;
        miss(id === "unit" ? "Not quite. There are 100 cm in a metre, so what is 1.58 m in cm?" : "Not quite. You could check the original form, if you like.");
        return;
      }
      if(a === "out"){ miss("You could, but this one can be saved, which keeps more data. " + (id === "unit" ? "What unit do you think Cal used?" : "Try checking the original form.")); return; }
      if(a === "row"){ miss(row[0] + "'s other answers are fine, so deleting the row throws good data away. Can you rescue this value?"); return; }
      miss(id === "unit" ? "Look again at 1.58 next to 162 and 155. Same unit?" : "Look closely: is that a zero, or a letter O? A spreadsheet would skip it."); return;
    }
    if(id === "imp"){
      if(a === "out"){ d.out[k] = true; close(id, "Case closed. Nobody is 17 cm tall, and the form says 17 too, so the real height is unknown. Leaving it out is the honest move."); return; }
      if(a === "row"){ d.del[r] = true; close(id, "Case closed. That works, though Fin's other answers were fine. Leaving out just the height would keep more data."); return; }
      if(a === "fix"){ miss("Fix it to what? 170? 175? Unless the form tells you, you cannot know. What else could you do?"); return; }
      miss("A height of 17 cm? That is about the length of a pencil."); return;
    }
    if(id === "outl"){
      if(a === "fine"){ d.kept[k] = true; close(id, "Case closed. Good detective work: 75 minutes is an outlier, but the form shows it is genuine, so it stays."); return; }
      if(a === "fix"){ miss("Fix it to what? It is a long way from the rest, but is it actually wrong? Try checking the original form."); return; }
      miss("It is an outlier, but is it an error? Only errors get removed. Try checking the original form."); return;
    }
    if(id === "blank"){
      if(a === "out"){ d.out[k] = true; close(id, "Case closed. A blank does not mean zero. Hal is left out of the pets mean only; his other answers still count."); return; }
      if(a === "row"){ d.del[r] = true; close(id, "Case closed. That works, but Hal's height, shoe size and travel time were fine. Leaving out just the blank would keep them."); return; }
      if(a === "fix"){ miss("Fix it to what? A 0 would say Hal has no pets, and you do not know that. A blank is not a zero."); return; }
      miss("Something is missing here, so it needs a decision too."); return;
    }
  }

  function finish(viaShow){
    if(!d.result){
      d.result = viaShow ? "shown" : (d.misses === 0 ? "right1" : "right2");
      api.save();
      api.done(d.result);
    }
    sel = null;
    var m = means();
    var lead = d.result === "shown" ? "<b>Here is the whole case file.</b>"
      : d.result === "right1" ? "<b>All six cases closed, with no second looks. Proper detective work.</b>"
      : "<b>All six cases closed.</b> A few second looks along the way, which is exactly what checking data is like.";
    msg.innerHTML = lead +
      '<ul class="dd-sum">' + CASE_IDS.map(function(id){
        var t = CASES[id].sum;
        if(id === "imp" && d.del[6]) t = t.replace("Left out of the height mean.", "You deleted the whole row; leaving out just the height would keep Fin's other answers.");
        if(id === "blank" && d.del[8]) t = t.replace("left out of the pets mean only.", "left out. You deleted the whole row; leaving out just the blank would keep Hal's other answers.");
        return '<li>' + t + '</li>'; }).join("") + '</ul>' +
      '<p class="wnote">Look at the height mean: <b>' + fmt(START[0].mean, 1) + ' cm</b> at the start, <b>' + fmt(m[0].mean, 1) + ' cm</b> now. A unit slip, an impossible value and a duplicate did all that. The travel mean barely moved, because the 75 was real and stayed in.</p>';
    showBtn.classList.add("hidden");
    draw();
  }

  showBtn.onclick = function(){
    CASE_IDS.forEach(function(id){
      if(d.closed[id]) return;
      var cs = CASES[id];
      if(id === "dup") d.del[4] = true;
      else if(cs.best === "fix") d.fix[cs.r + "," + cs.c] = cs.fixTo;
      else if(cs.best === "out") d.out[cs.r + "," + cs.c] = true;
      else if(cs.best === "fine") d.kept[cs.r + "," + cs.c] = true;
      d.closed[id] = true;
    });
    api.save();
    finish(true);
  };

  draw();
  if(d.result) finish(false);
}
