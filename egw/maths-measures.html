<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';
var MINUS = "&minus;";

/* ---------- small SVG helpers ---------- */
function r1(v){ return Math.round(v * 10) / 10; }
function rad(d){ return d * Math.PI / 180; }
function t(x, y, s, size, fill, extra){
  return '<text x="' + r1(x) + '" y="' + r1(y) + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function bold(x, y, s, size, fill, anchor){ return t(x, y, s, size, fill, LAB + ' font-weight="700" text-anchor="' + (anchor || "middle") + '"'); }
function ln(a, b, col, w, extra){
  return '<path d="M' + r1(a[0]) + ' ' + r1(a[1]) + ' L' + r1(b[0]) + ' ' + r1(b[1]) + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" fill="none" ' + (extra || "") + '/>';
}
function poly(pts, fill, stroke, w, extra){
  return '<path d="M' + pts.map(function(p){ return r1(p[0]) + ' ' + r1(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + (stroke || INK) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round" ' + (extra || "") + '/>';
}
/* right angle box at corner c, with sx and sy giving which way the two sides run (+1 or -1) */
function sq(c, sx, sy, n){
  n = n || 12;
  return '<path d="M' + (c[0] + sx * n) + ' ' + c[1] + ' V' + (c[1] + sy * n) + ' H' + c[0] + '" fill="none" stroke="' + INK + '" stroke-width="2"/>';
}
function arcAt(c, r, a1, a2, col){
  /* screen angles in degrees, measured anticlockwise from the positive x direction */
  var p = [c[0] + r * Math.cos(rad(a1)), c[1] - r * Math.sin(rad(a1))], q = [c[0] + r * Math.cos(rad(a2)), c[1] - r * Math.sin(rad(a2))];
  return '<path d="M' + r1(p[0]) + ' ' + r1(p[1]) + ' A' + r + ' ' + r + ' 0 0 0 ' + r1(q[0]) + ' ' + r1(q[1]) + '" fill="none" stroke="' + (col || INK) + '" stroke-width="2.5"/>';
}
function nda(x, y, anchor){ return t(x, y, "Not drawn accurately", 14, INK, BODY + ' font-style="italic" opacity=".7" text-anchor="' + (anchor || "end") + '"'); }
function svg(w, h, label, inner){ return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + label + '">' + inner + '</svg>'; }
function lab(x, y, s, col, anchor){ return t(x, y, s, 15, col || INK, BODY + ' font-weight="700" text-anchor="' + (anchor || "middle") + '"'); }

/* ---------- figures ---------- */

/* four area formulas */
var AREAS = (function(){
  var s = "";
  s += poly([[14, 30], [124, 30], [124, 92], [14, 92]], "rgba(58,92,255,.12)", INK);
  s += lab(69, 112, "length") + lab(132, 66, "width", INK, "start");
  s += bold(90, 140, "length &times; width", 15);

  s += poly([[230, 92], [360, 92], [270, 28]], "rgba(255,93,93,.12)", INK);
  s += ln([270, 28], [270, 92], CORAL, 2, 'stroke-dasharray="5 4"') + sq([270, 92], 1, -1, 10);
  s += lab(295, 112, "base") + lab(276, 66, "h", "#d13b3b", "start");
  s += bold(290, 140, "&frac12; &times; base &times; height", 15);

  s += poly([[14, 238], [124, 238], [160, 176], [50, 176]], "rgba(25,195,154,.14)", INK);
  s += ln([50, 176], [50, 238], "#0f8a6c", 2, 'stroke-dasharray="5 4"') + sq([50, 238], 1, -1, 10);
  s += lab(69, 258, "base") + lab(56, 214, "h", "#0f8a6c", "start");
  s += bold(90, 286, "base &times; height", 15);

  s += poly([[220, 238], [360, 238], [320, 176], [256, 176]], "rgba(255,210,63,.35)", INK);
  s += ln([256, 176], [256, 238], INK, 2, 'stroke-dasharray="5 4"') + sq([256, 238], 1, -1, 10);
  s += lab(288, 170, "a") + lab(290, 258, "b") + lab(262, 214, "h", INK, "start");
  s += bold(290, 286, "&frac12;(a + b) &times; h", 15);
  return svg(380, 296, "Area formulas. Rectangle: length times width. Triangle: half times base times perpendicular height. Parallelogram: base times perpendicular height. Trapezium: half of a plus b, times the height, where a and b are the parallel sides.", s);
})();

/* Q: trapezium and triangle with distracting slant lengths */
var TRAPTRI = (function(){
  var s = "";
  s += poly([[14, 140], [174, 140], [142, 60], [46, 60]], "rgba(255,210,63,.35)", INK);
  s += ln([46, 60], [46, 140], INK, 2, 'stroke-dasharray="5 4"') + sq([46, 140], 1, -1, 10);
  s += lab(94, 52, "6 cm") + lab(94, 162, "10 cm") + lab(52, 106, "5 cm", INK, "start");
  s += t(170, 96, "5.4 cm", 14, INK, BODY + ' text-anchor="start"');
  s += bold(94, 24, "A", 17);

  s += poly([[206, 140], [356, 140], [256, 40]], "rgba(58,92,255,.12)", INK);
  s += ln([256, 40], [256, 140], BLUE, 2, 'stroke-dasharray="5 4"') + sq([256, 140], 1, -1, 10);
  s += lab(281, 162, "9 cm") + lab(262, 100, "6 cm", BLUE, "start");
  s += t(222, 84, "6.7 cm", 14, INK, BODY + ' text-anchor="end"') + t(310, 84, "8.5 cm", 14, INK, BODY + ' text-anchor="start"');
  s += bold(281, 24, "B", 17);
  s += nda(372, 190);
  return svg(380, 196, "Shape A is a trapezium with parallel sides 6 centimetres and 10 centimetres, perpendicular height 5 centimetres and sloping sides of 5.4 centimetres. Shape B is a triangle with base 9 centimetres, perpendicular height 6 centimetres and sloping sides 6.7 and 8.5 centimetres.", s);
})();

/* Q: L shape */
var LSHAPE = (function(){
  var k = 19, x0 = 90, y0 = 20;
  function P(x, y){ return [x0 + x * k, y0 + (8 - y) * k]; }
  var s = poly([P(0, 0), P(10, 0), P(10, 5), P(6, 5), P(6, 8), P(0, 8)], "rgba(25,195,154,.16)", INK);
  s += lab(x0 + 5 * k, y0 + 8 * k + 20, "10 cm") + lab(x0 - 8, y0 + 4 * k + 5, "8 cm", INK, "end");
  s += lab(x0 + 3 * k, y0 - 6, "6 cm") + lab(x0 + 10 * k + 8, y0 + 5.5 * k + 5, "5 cm", INK, "start");
  s += nda(372, 214);
  return svg(380, 220, "An L shape. The bottom is 10 centimetres, the left side is 8 centimetres, the top is 6 centimetres and the right side is 5 centimetres. A rectangle has been cut out of the top right corner.", s);
})();

/* circle parts */
var CIRC = (function(){
  var c = [92, 104], R = 74, s = "";
  s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + R + '" fill="rgba(34,184,230,.15)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += ln([c[0] - R, c[1]], [c[0] + R, c[1]], BLUE, 3) + ln(c, [c[0] + R * Math.cos(rad(55)), c[1] - R * Math.sin(rad(55))], CORAL, 3);
  s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="4" fill="' + INK + '"/>';
  s += lab(c[0], c[1] + 22, "diameter d", BLUE) + t(c[0] + 34, c[1] - 30, "radius r", 15, "#d13b3b", BODY + ' font-weight="700"');
  var x = 196;
  s += bold(x, 34, "Circumference", 16, INK, "start") + t(x, 56, "C = &pi;d = 2&pi;r", 16, INK, BODY + ' font-weight="700"');
  s += bold(x, 98, "Area", 16, INK, "start") + t(x, 120, "A = &pi;r&sup2;", 16, INK, BODY + ' font-weight="700"');
  s += bold(x, 162, "d = 2r", 16, INK, "start") + t(x, 184, "r = d &divide; 2", 16, INK, BODY + ' font-weight="700"');
  return svg(380, 196, "A circle with a diameter across the middle and a radius from the centre. Circumference C equals pi d, or 2 pi r. Area A equals pi r squared. The diameter is twice the radius.", s);
})();

/* Q: semicircle */
var SEMI = (function(){
  var c = [190, 150], R = 120, s = "";
  s += '<path d="M' + (c[0] - R) + ' ' + c[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + (c[0] + R) + ' ' + c[1] + ' Z" fill="rgba(255,210,63,.35)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += lab(c[0], c[1] + 24, "12 cm");
  s += nda(372, 196);
  return svg(380, 202, "A semicircle with a straight edge, the diameter, of 12 centimetres.", s);
})();

/* Q: quarter circle */
var QUART = (function(){
  var c = [110, 170], R = 140, s = "";
  s += '<path d="M' + c[0] + ' ' + c[1] + ' H' + (c[0] + R) + ' A' + R + ' ' + R + ' 0 0 0 ' + c[0] + ' ' + (c[1] - R) + ' Z" fill="rgba(138,92,246,.14)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += sq(c, 1, -1, 14);
  s += lab(c[0] + R / 2, c[1] + 22, "6 cm") + lab(c[0] - 8, c[1] - R / 2, "6 cm", INK, "end");
  s += nda(372, 196);
  return svg(380, 202, "A quarter circle with two straight edges, each a radius of 6 centimetres.", s);
})();

/* cuboid drawn in 3D */
function box3(x, y, w, h, dx, dy, fill){
  var s = "";
  s += poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, INK);
  s += poly([[x, y], [x + dx, y - dy], [x + w + dx, y - dy], [x + w, y]], "rgba(255,255,255,.55)", INK);
  s += poly([[x + w, y], [x + w + dx, y - dy], [x + w + dx, y + h - dy], [x + w, y + h]], "rgba(20,26,51,.12)", INK);
  return s;
}
var CUBOID = (function(){
  var s = box3(60, 70, 170, 100, 70, 46, "rgba(58,92,255,.22)");
  s += lab(145, 192, "5 cm") + lab(310, 140, "4 cm", INK, "start") + lab(262, 40, "3 cm", INK, "start");
  s += nda(372, 214);
  return svg(380, 220, "A cuboid 5 centimetres long, 3 centimetres deep and 4 centimetres tall.", s);
})();

/* prisms: volume rule */
var PRISMS = (function(){
  var s = "";
  /* triangular prism */
  var A = [20, 150], B = [110, 150], C = [44, 82], dx = 60, dy = 44;
  s += poly([B, [B[0] + dx, B[1] - dy], [C[0] + dx, C[1] - dy], C], "rgba(20,26,51,.08)", INK);
  s += poly([A, B, C], "rgba(255,93,93,.45)", INK);
  s += ln(A, [A[0] + dx, A[1] - dy], INK, 2, 'stroke-dasharray="5 4"') + ln([A[0] + dx, A[1] - dy], [B[0] + dx, B[1] - dy], INK, 2, 'stroke-dasharray="5 4"') + ln([A[0] + dx, A[1] - dy], [C[0] + dx, C[1] - dy], INK, 2, 'stroke-dasharray="5 4"');
  s += bold(95, 186, "Prism", 16) + t(95, 206, "area of the end &times; length", 14, INK, BODY + ' text-anchor="middle"');
  /* cylinder */
  var cx = 290, top = 50, bot = 140, rx = 52, ry = 16;
  s += '<path d="M' + (cx - rx) + ' ' + top + ' V' + bot + ' A' + rx + ' ' + ry + ' 0 0 0 ' + (cx + rx) + ' ' + bot + ' V' + top + '" fill="rgba(34,184,230,.2)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<ellipse cx="' + cx + '" cy="' + top + '" rx="' + rx + '" ry="' + ry + '" fill="rgba(34,184,230,.45)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += ln([cx, top], [cx + rx, top], CORAL, 2.5) + t(cx + 22, top - 4, "r", 15, "#d13b3b", LAB + ' font-weight="700" text-anchor="middle"');
  s += ln([cx + rx + 12, top], [cx + rx + 12, bot], INK, 1.5) + t(cx + rx + 18, (top + bot) / 2 + 5, "h", 15, INK, LAB + ' font-weight="700"');
  s += bold(290, 186, "Cylinder", 16) + t(290, 206, "&pi;r&sup2; &times; h", 14, INK, BODY + ' text-anchor="middle"');
  return svg(380, 214, "A triangular prism: volume is the area of the triangular end times the length. A cylinder with radius r and height h: volume is pi r squared times h.", s);
})();

/* Q: triangular prism and cylinder */
var PRISMQ = (function(){
  var s = "";
  var A = [52, 160], B = [148, 160], C = [52, 96], dx = 50, dy = 40;
  s += poly([B, [B[0] + dx, B[1] - dy], [C[0] + dx, C[1] - dy], C], "rgba(20,26,51,.08)", INK);
  s += poly([A, B, C], "rgba(255,93,93,.45)", INK) + sq(A, 1, -1, 10);
  s += ln(A, [A[0] + dx, A[1] - dy], INK, 2, 'stroke-dasharray="5 4"') + ln([A[0] + dx, A[1] - dy], [B[0] + dx, B[1] - dy], INK, 2, 'stroke-dasharray="5 4"') + ln([A[0] + dx, A[1] - dy], [C[0] + dx, C[1] - dy], INK, 2, 'stroke-dasharray="5 4"');
  s += lab(100, 182, "6 cm") + lab(46, 134, "4 cm", INK, "end") + lab(172, 156, "10 cm", INK, "start");
  s += bold(40, 40, "A", 17, INK, "start");
  var cx = 300, top = 66, bot = 160, rx = 40, ry = 12;
  s += '<path d="M' + (cx - rx) + ' ' + top + ' V' + bot + ' A' + rx + ' ' + ry + ' 0 0 0 ' + (cx + rx) + ' ' + bot + ' V' + top + '" fill="rgba(34,184,230,.2)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<ellipse cx="' + cx + '" cy="' + top + '" rx="' + rx + '" ry="' + ry + '" fill="rgba(34,184,230,.45)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += ln([cx, top], [cx + rx, top], CORAL, 2.5) + t(cx + 20, top - 18, "3 cm", 14, "#d13b3b", LAB + ' font-weight="700" text-anchor="middle"');
  s += ln([cx + rx + 10, top], [cx + rx + 10, bot], INK, 1.5) + lab(cx + rx + 8, bot + 30, "10 cm", INK, "end");
  s += bold(244, 40, "B", 17, INK, "start");
  s += nda(372, 214);
  return svg(380, 220, "Shape A: a triangular prism. The end is a right angled triangle with base 6 centimetres and height 4 centimetres, and the prism is 10 centimetres long. Shape B: a cylinder with radius 3 centimetres and height 10 centimetres.", s);
})();

/* formula triangles */
function tri(x, top, bottomL, bottomR, col){
  var s = poly([[x, 18], [x - 56, 108], [x + 56, 108]], col, INK);
  s += ln([x - 30, 66], [x + 30, 66], INK, 2) + ln([x, 66], [x, 108], INK, 2);
  s += bold(x, 54, top, 17) + bold(x - 18, 96, bottomL, 17) + bold(x + 18, 96, bottomR, 17);
  return s;
}
var RATES = (function(){
  var s = tri(64, "D", "S", "T", "rgba(58,92,255,.18)") + tri(190, "M", "D", "V", "rgba(255,93,93,.2)") + tri(316, "F", "P", "A", "rgba(25,195,154,.2)");
  s += bold(64, 132, "Speed", 15) + t(64, 152, "distance &divide; time", 14, INK, BODY + ' text-anchor="middle"');
  s += bold(190, 132, "Density", 15) + t(190, 152, "mass &divide; volume", 14, INK, BODY + ' text-anchor="middle"');
  s += bold(316, 132, "Pressure", 15) + t(316, 152, "force &divide; area", 14, INK, BODY + ' text-anchor="middle"');
  return svg(380, 162, "Three formula triangles. Distance over speed times time. Mass over density times volume. Force over pressure times area. Cover the one you want: speed is distance divided by time, density is mass divided by volume, pressure is force divided by area.", s);
})();

/* Pythagoras with squares on the sides */
var PYTH = (function(){
  var k = 20, A = [90, 150], B = [90 + 4 * k, 150], C = [90, 150 - 3 * k], s = "";
  s += poly([A, B, [B[0], B[1] + 4 * k], [A[0], A[1] + 4 * k]], "rgba(58,92,255,.2)", INK, 2);
  s += poly([A, C, [C[0] - 3 * k, C[1]], [A[0] - 3 * k, A[1]]], "rgba(255,93,93,.22)", INK, 2);
  var dx = B[0] - C[0], dy = B[1] - C[1];
  s += poly([C, B, [B[0] - dy, B[1] + dx], [C[0] - dy, C[1] + dx]].map(function(p, i){ return i < 2 ? p : [p[0] + 2 * dy, p[1] - 2 * dx]; }), "rgba(25,195,154,.25)", INK, 2);
  s += poly([A, B, C], WHITE, INK, 2.5) + sq(A, 1, -1, 10);
  s += bold(A[0] + 2 * k, A[1] + 2 * k + 6, "16", 17, BLUE) + bold(A[0] - 1.5 * k, A[1] - 1.5 * k + 6, "9", 17, "#d13b3b");
  s += bold(176, 64, "25", 17, "#0f8a6c");
  s += lab(A[0] + 2 * k, A[1] - 6, "4") + lab(A[0] + 8, A[1] - 1.5 * k + 5, "3", INK, "start") + lab(140, 108, "5", INK, "start");
  s += t(262, 120, "9 + 16 = 25", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(262, 146, "a&sup2; + b&sup2; = c&sup2;", 16, INK, BODY + ' font-weight="700" text-anchor="middle"');
  return svg(380, 236, "A right angled triangle with sides 3, 4 and 5. Squares drawn on the sides have areas 9, 16 and 25. The two smaller squares add up to the biggest: a squared plus b squared equals c squared.", s);
})();

/* Q: two right triangles for Pythagoras */
var PYQ = (function(){
  var s = "";
  var A = [50, 160], B = [180, 160], C = [50, 70];
  s += poly([A, B, C], "rgba(58,92,255,.14)", INK) + sq(A, 1, -1, 12);
  s += lab(115, 182, "10 cm") + lab(44, 120, "7 cm", INK, "end") + bold(128, 104, "x", 18, "#d13b3b");
  s += bold(40, 40, "A", 17, INK, "start");
  var D = [210, 160], E = [326, 160], F = [326, 60];
  s += poly([D, E, F], "rgba(255,93,93,.16)", INK) + sq(E, -1, -1, 12);
  s += bold(268, 184, "y", 18, "#d13b3b") + lab(332, 115, "8 cm", INK, "start") + t(262, 100, "13 cm", 15, INK, BODY + ' font-weight="700" text-anchor="end"');
  s += bold(206, 40, "B", 17, INK, "start");
  s += nda(372, 214);

function mountLadder(el, api){

    '<div class="lr">' +

          '<span class="val" data-r="val"></span>' +

    '<div class="fb lr-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

      var wy = G - S * winH;
      s += '<rect x="' + (WX + 14) + '" y="' + (wy - 40) + '" width="44" height="40" fill="' + CYAN + '" stroke="' + INK + '" stroke-width="2"/>';
      s += ln([WX + 36, wy - 40], [WX + 36, wy], INK, 1.5) + ln([WX + 14, wy - 20], [WX + 58, wy - 20], INK, 1.5);
      s += '<rect x="' + (WX - 4) + '" y="' + (wy - 3) + '" width="68" height="6" fill="' + INK + '"/>';
      if(view < 3 && !landed) s += ln([6, wy], [WX - 4, wy], VIOLET, 2, 'stroke-dasharray="6 5" opacity=".7"');
      if(view < 3 && lv.win) s += t(12, wy - 6, "ledge " + lv.win.toFixed(1) + " m", 14, VIOLET, LAB + ' font-weight="700"');

    }
    /* labels */
    var showD = !(lv.mode === "a" && view < 3 && !landed);
    var showH = lv.hide.indexOf("h") < 0 || landed;
    var showA = lv.hide.indexOf("a") < 0 || landed;
    s += ln([foot[0], G + 12], [WX, G + 12], INK, 1.5);
    s += t((foot[0] + WX) / 2, G + 28, showD ? f1(g.d) + " m" : "? m", 14, INK, LAB + ' font-weight="700" text-anchor="middle"');
    s += arcAt(foot, 26, 0, g.a, CORAL);
    s += t(foot[0] + 30, foot[1] - 8, showA ? (lv.mode === "a" ? Math.round(g.a) : g.a.toFixed(1)) + "&deg;" : "?&deg;", 14, "#d13b3b", LAB + ' font-weight="700"');
    var mx = (foot[0] + top[0]) / 2 - 14, my = (foot[1] + top[1]) / 2;
    s += t(mx, my, g.L + " m", 15, INK, LAB + ' font-weight="800" text-anchor="end"');
    s += t(WX - 6, top[1] - 8, showH ? "top " + f1(g.h) + " m" : "top ? m", 14, INK, LAB + ' font-weight="700" text-anchor="end"');
    /* climber */
    if(climbF >= 0){
      var cx = foot[0] + (top[0] - foot[0]) * climbF, cy = foot[1] + (top[1] - foot[1]) * climbF;
      s += '<circle cx="' + r1(cx - 4) + '" cy="' + r1(cy - 26) + '" r="7" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/>';
      s += '<rect x="' + r1(cx - 10) + '" y="' + r1(cy - 19) + '" width="12" height="17" rx="4" fill="' + VIOLET + '" stroke="' + INK + '" stroke-width="2"/>';

  function kitten(x, y){

  function stars(){ var s = ""; for(var k = 0; k < 3; k++) s += k < Math.min(d.lv, 3) ? "&#9733;" : "&#9734;"; return s; }

    q("val").innerHTML = lv.mode === "a" ? d.v + "&deg;" : (d.v / 10).toFixed(1) + " m";
