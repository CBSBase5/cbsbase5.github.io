<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index numbers and rates - EGW GCSE HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/egw/egw.css?v=3">
<style>
/* Price tracker widget */
.pt-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.pt-round{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:99px;padding:4px 12px}
.pt-stars{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.08em}
.pt-stars .on{color:#e0a800}
.pt-stars .off{color:#c9c8d6}
.pt-years{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.pt-years span{font-family:var(--display);font-weight:700;font-size:.9rem;margin-right:2px}
.pt-years button{font-family:var(--display);font-weight:700;font-size:.95rem;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:7px 9px;cursor:pointer;min-width:52px}
.pt-years button.on{background:var(--sun)}
.pt-svg{width:100%;max-width:540px;height:auto;display:block;margin:0 auto}
.pt-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.pt-chips button{display:flex;align-items:center;gap:8px;font-family:inherit;font-size:.95rem;text-align:left;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.pt-chips button i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.pt-chips button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.pt-tag{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:.98rem;min-height:2.2em}
.pt-prices{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
.pt-prices th,.pt-prices td{border:1.5px solid var(--ink);padding:4px 3px;text-align:center;background:#fff}
.pt-prices th{background:var(--accent-soft)}
.pt-prices td.base,.pt-prices th.base{background:#fff3c2}
.pt-ask{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0 6px}
.pt-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pt-opts button{font-family:inherit;font-size:.95rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 8px;cursor:pointer}
.pt-in{width:110px;text-align:center;padding:9px 8px;font-family:inherit;font-size:1.1rem;border:3px solid rgba(20,26,51,.22);border-radius:12px 10px 14px 10px;background:#fff;color:var(--ink)}
</style>
</head>
<body class="subj-stats">
<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/egw/"><span class="hqlogo">EGW</span><span class="hqname">GCSE HQ<small>revision and planning</small></span></a>
    <nav class="hqnav"><a href="/egw/">HQ home</a><a href="/">Base 5</a></nav>
  </div>
</header>

<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Index numbers and rates</h2>
    <span>GCSE Statistics. Index numbers, CPI and RPI, rates of change, and stretch chunks on standardised rates, the normal distribution and control charts.</span>
  </div>
  <div id="egwApp"></div>
</div>

<footer>
  <div class="wrap">
    <span>EGW's GCSE HQ &middot; part of Base 5, Chilton Bridge School</span>
    <a href="/egw/">Back to HQ</a>
  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=5"></script>
<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d",
    SUN = "#ffd23f", MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, txt, o){
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || "middle") + '" ' + (o.lab ? LAB : BODY) +
    ' font-weight="' + (o.w || 400) + '" font-size="' + (o.s || 15) + '" fill="' + (o.c || INK) + '">' + txt + '</text>';
}
function money(v){ return "&pound;" + v.toFixed(2); }

/* ---------- figures ---------- */
var INDEX_FIG = (function(){
  var s = '<svg viewBox="0 0 360 178" role="img" aria-label="A bus fare of 1 pound 50 in the base year has index 100. Two years later it costs 1 pound 80, index 120." style="max-width:440px">';
  function col(x, h, top, price, year, idx, fill){
    var base = 138;
    return '<rect x="' + x + '" y="' + (base - h) + '" width="84" height="' + h + '" rx="8" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.5"/>' +
      t(x + 42, base - h + 30, idx, { lab: 1, w: 800, s: 26 }) +
      t(x + 42, base - h - 10, price, { w: 700, s: 16 }) +
      t(x + 42, base + 22, year, { lab: 1, w: 700, s: 15 });
  }
  s += col(40, 80, 0, "&pound;1.50", "2021 (base)", "100", SUN);
  s += col(236, 96, 0, "&pound;1.80", "2023", "120", CYAN);
  s += '<path d="M138 92 C170 70 200 70 228 82" fill="none" stroke="' + INK + '" stroke-width="2.5"/><path d="M220 74 L230 83 L218 88" fill="none" stroke="' + INK + '" stroke-width="2.5"/>';
  s += t(183, 64, "&divide; 1.50 &times; 100", { s: 14, w: 700, c: VIOLET });
  s += '<line x1="20" y1="138" x2="340" y2="138" stroke="' + INK + '" stroke-width="2"/>';
  return s + '</svg>';
})();

var NORMAL_FIG = (function(){
  var L = 18, R = 342, B = 150, T = 18;
  function X(z){ return L + (z + 3.5) / 7 * (R - L); }
  function Y(z){ return B - Math.exp(-z * z / 2) * (B - T); }
  function area(a, b, fill, op){
    var p = "M" + X(a) + " " + B;
    for(var z = a; z <= b + 1e-9; z += 0.05) p += " L" + X(z).toFixed(1) + " " + Y(z).toFixed(1);
    return '<path d="' + p + ' L' + X(b) + ' ' + B + ' Z" fill="' + fill + '" fill-opacity="' + op + '"/>';
  }
  var s = '<svg viewBox="0 0 360 262" role="img" aria-label="A symmetrical bell shaped normal curve. About 68% of the data lie within 1 standard deviation of the mean, about 95% within 2, and about 99.7% within 3." style="max-width:460px">';
  s += area(-3, 3, VIOLET, 0.18) + area(-2, 2, VIOLET, 0.25) + area(-1, 1, VIOLET, 0.4);
  var p = "";
  for(var z = -3.5; z <= 3.5 + 1e-9; z += 0.05) p += (p ? " L" : "M") + X(z).toFixed(1) + " " + Y(z).toFixed(1);
  s += '<path d="' + p + '" fill="none" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<line x1="' + L + '" y1="' + B + '" x2="' + R + '" y2="' + B + '" stroke="' + INK + '" stroke-width="2"/>';
  s += '<line x1="' + X(0) + '" y1="' + T + '" x2="' + X(0) + '" y2="' + B + '" stroke="' + INK + '" stroke-width="2" stroke-dasharray="5 4"/>';
  var labs = ["&minus;3", "&minus;2", "&minus;1", "mean", "+1", "+2", "+3"];
  for(var k = -3; k <= 3; k++){
    s += '<line x1="' + X(k) + '" y1="' + B + '" x2="' + X(k) + '" y2="' + (B + 6) + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t(X(k), B + 22, labs[k + 3], { s: 14, w: k === 0 ? 700 : 400 });
  }
  function brace(a, y, txt){
    return '<path d="M' + X(-a) + ' ' + (y - 6) + ' V' + y + ' H' + X(a) + ' V' + (y - 6) + '" fill="none" stroke="' + INK + '" stroke-width="1.8"/>' +
      t(X(0), y + 17, txt, { lab: 1, w: 800, s: 14 });
  }
  s += brace(1, 186, "about 68% within 1 sd");
  s += brace(2, 214, "about 95% within 2 sd");
  s += brace(3, 242, "about 99.7% within 3 sd");
  return s + '</svg>';
})();

var QC_MEANS = [250.6, 249.2, 251.1, 248.4, 250.2, 253.6, 252.1, 251.0, 249.7, 255.0];
var QC_FIG = (function(){
  var L = 50, R = 284, T = 12, B = 222, LO = 244, HI = 256;
  function X(i){ return L + (i - 0.5) * (R - L) / 10; }
  function Y(v){ return B - (v - LO) / (HI - LO) * (B - T); }
  var s = '<svg viewBox="0 0 360 268" role="img" aria-label="Control chart of 10 sample means. Target 250 g. Warning lines at 247 and 253. Action lines at 245.5 and 254.5. Sample 6 is 253.6, between the upper warning and action lines. Sample 10 is 255.0, above the upper action line." style="max-width:460px">';
  s += '<rect x="' + L + '" y="' + T + '" width="' + (R - L) + '" height="' + (B - T) + '" fill="' + WHITE + '"/>';
  for(var v = LO; v <= HI; v += 2){
    s += '<line x1="' + L + '" y1="' + Y(v) + '" x2="' + R + '" y2="' + Y(v) + '" stroke="' + LINE + '" stroke-width="1"/>';
    s += t(L - 6, Y(v) + 5, v, { a: "end", s: 14 });
  }
  [[254.5, CORAL, "action"], [253, "#e0a800", "warning"], [250, MINT, "target"], [247, "#e0a800", "warning"], [245.5, CORAL, "action"]].forEach(function(l){
    s += '<line x1="' + L + '" y1="' + Y(l[0]) + '" x2="' + R + '" y2="' + Y(l[0]) + '" stroke="' + l[1] + '" stroke-width="2.5"' + (l[2] === "warning" ? ' stroke-dasharray="7 5"' : '') + '/>';
  });
  s += '<polyline points="' + QC_MEANS.map(function(m, i){ return X(i + 1) + "," + Y(m); }).join(" ") + '" fill="none" stroke="' + BLUE + '" stroke-width="2"/>';
  QC_MEANS.forEach(function(m, i){
    s += '<circle cx="' + X(i + 1) + '" cy="' + Y(m) + '" r="5" fill="' + (m > 254.5 ? CORAL : m > 253 ? SUN : BLUE) + '" stroke="' + INK + '" stroke-width="1.5"/>';
    s += t(X(i + 1), B + 19, i + 1, { s: 14 });
  });
  s += t((L + R) / 2, B + 40, "Sample number", { lab: 1, w: 700, s: 14 });
  s += '<text x="14" y="' + ((T + B) / 2) + '" transform="rotate(-90 14 ' + ((T + B) / 2) + ')" text-anchor="middle" ' + LAB + ' font-weight="700" font-size="14" fill="' + INK + '">Sample mean (g)</text>';
  s += t(R + 5, Y(254.5) + 5, "action", { a: "start", s: 14, w: 700, c: "#d43c3c" });
  s += t(R + 5, Y(253) + 5, "warning", { a: "start", s: 14, w: 700, c: "#a07800" });
  s += t(R + 5, Y(250) + 5, "target", { a: "start", s: 14, w: 700, c: "#0f7a5f" });
  s += t(R + 5, Y(247) + 5, "warning", { a: "start", s: 14, w: 700, c: "#a07800" });
  s += t(R + 5, Y(245.5) + 5, "action", { a: "start", s: 14, w: 700, c: "#d43c3c" });
  return s + '</svg>';
})();

var DEATHS_TABLE =
'<table class="datatable" style="font-size:.92rem"><tr><th>Age group</th><th>Town B population</th><th>Town B deaths per 1000</th><th>Standard population</th></tr>' +
'<tr><td>Under 20</td><td>4000</td><td>2</td><td>30%</td></tr>' +
'<tr><td>20 to 59</td><td>4500</td><td>8</td><td>50%</td></tr>' +
'<tr><td>60 and over</td><td>1500</td><td>50</td><td>20%</td></tr></table>';

/* ---------- widget: Price tracker ---------- */
var YEARS = [2021, 2022, 2023, 2024, 2025];
var ITEMS = [
  { name: "Bus fare", short: "Bus", col: BLUE, p: [1.50, 1.60, 1.80, 2.00, 2.10] },
  { name: "Cinema ticket", short: "Cinema", col: VIOLET, p: [7.50, 8.00, 8.40, 9.00, 9.60] },
  { name: "Phone data (month)", short: "Data", col: CYAN, p: [12.00, 11.00, 10.00, 10.00, 9.00] },
  { name: "Chocolate bar", short: "Choc", col: CORAL, p: [0.60, 0.65, 0.75, 0.85, 0.90] }
];
var PT_ROUNDS = [
  { kind: "pick", ask: "Which item's price rose <b>fastest</b> from 2021 to 2025? Set the base to 2021 and look at the lines, if you like.", ans: 3,
    win: "Chocolate: index 150, so up 50%. The cinema ticket went up the most in <b>pounds</b> (&pound;2.10), but only 28% in proportion. Index numbers compare like with like.",
    nudge: "Not that one. With 2021 as the base, every line starts at 100. Which one finishes highest in 2025?" },
  { kind: "num", ask: "Change the base year to <b>2022</b>. What is the index number for the <b>cinema ticket</b> in 2025?", ans: 120, tol: 0.5, base: 1,
    win: "9.60 &divide; 8.00 &times; 100 = 120. With 2022 as the base, the cinema line passes through 100 in 2022 and reaches 120 in 2025: 20% dearer than in 2022.",
    nudge: "Not quite yet. Index = price that year &divide; price in the base year &times; 100. The base year is now 2022." },
  { kind: "num", ask: "Phone data got <b>cheaper</b>. Using <b>2021</b> as the base year, what is its index number in 2025?", ans: 75, tol: 0.5, base: 0,
    win: "9 &divide; 12 &times; 100 = 75. Below 100 means cheaper than the base year: 25% less.",
    nudge: "Not quite yet. Price in 2025 &divide; price in 2021 &times; 100. A price that falls gives an index below 100." }
];

function mountTracker(el, api){
  var d = api.data;
  if(typeof d.base !== "number") d.base = 0;
  if(typeof d.sel !== "number") d.sel = -1;
  d.round = d.round || 0;
  d.stars = d.stars || [];
  d.miss = d.miss || 0;
  d.rt = d.rt || 0;

  el.innerHTML =
    '<div class="wpanel">' +
      '<div class="pt-top"><span class="pt-round" id="ptRound"></span><span class="pt-stars" id="ptStars"></span></div>' +
      '<div class="pt-years" id="ptYears"><span>Base year</span></div>' +
      '<svg class="pt-svg" id="ptSvg" viewBox="0 0 360 236" role="img" aria-label="Line chart of index numbers for four items from 2021 to 2025. Every line passes through 100 in the chosen base year."></svg>' +
      '<div class="pt-chips" id="ptChips"></div>' +
      '<div class="pt-tag" id="ptTag" aria-live="polite"></div>' +
      '<details><summary class="tiny" style="cursor:pointer">Price list</summary><div id="ptPrices"></div></details>' +
      '<div class="pt-ask" id="ptAsk"></div>' +
      '<div class="wnote" id="ptMsg" aria-live="polite"></div>' +
    '</div>';

  var svg = el.querySelector("#ptSvg"), msg = el.querySelector("#ptMsg"), ask = el.querySelector("#ptAsk");
  var L = 44, R = 344, T = 12, B = 196, LO = 60, HI = 160;
  function X(i){ return L + 14 + i * (R - L - 28) / 4; }
  function Y(v){ return B - (v - LO) / (HI - LO) * (B - T); }
  function idx(it, i){ return it.p[i] / it.p[d.base] * 100; }

  var yb = el.querySelector("#ptYears");
  YEARS.forEach(function(y, i){
    var b = document.createElement("button"); b.type = "button"; b.textContent = y; b.setAttribute("data-y", i);
    b.onclick = function(){ d.base = i; api.save(); draw(); };
    yb.appendChild(b);
  });
  var cb = el.querySelector("#ptChips");
  ITEMS.forEach(function(it, k){
    var b = document.createElement("button"); b.type = "button";
    b.innerHTML = '<i style="background:' + it.col + '"></i>' + it.name;
    b.onclick = function(){ d.sel = d.sel === k ? -1 : k; api.save(); draw(); };
    cb.appendChild(b);
  });

  function draw(){
    [].forEach.call(yb.querySelectorAll("button"), function(b, i){ b.classList.toggle("on", i === d.base); });
    [].forEach.call(cb.querySelectorAll("button"), function(b, i){ b.classList.toggle("on", i === d.sel); });
    var s = '<rect x="' + L + '" y="' + T + '" width="' + (R - L) + '" height="' + (B - T) + '" fill="' + WHITE + '"/>';
    s += '<rect x="' + (X(d.base) - 14) + '" y="' + T + '" width="28" height="' + (B - T) + '" fill="' + SUN + '" fill-opacity="0.45"/>';
    for(var v = LO; v <= HI; v += 20){
      s += '<line x1="' + L + '" y1="' + Y(v) + '" x2="' + R + '" y2="' + Y(v) + '" stroke="' + (v === 100 ? INK : LINE) + '" stroke-width="' + (v === 100 ? 1.6 : 1) + '"' + (v === 100 ? ' stroke-dasharray="5 4"' : '') + '/>';
      s += t(L - 6, Y(v) + 5, v, { a: "end", s: 14, w: v === 100 ? 800 : 400 });
    }
    s += '<line x1="' + L + '" y1="' + B + '" x2="' + R + '" y2="' + B + '" stroke="' + INK + '" stroke-width="2"/>';
    s += '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + B + '" stroke="' + INK + '" stroke-width="2"/>';
    YEARS.forEach(function(y, i){ s += t(X(i), B + 20, y, { s: 14, w: i === d.base ? 800 : 400 }); });
    s += t(X(d.base), B + 37, "base = 100", { s: 14, w: 700, c: "#8a6a00" });
    s += '<text x="12" y="' + ((T + B) / 2) + '" transform="rotate(-90 12 ' + ((T + B) / 2) + ')" text-anchor="middle" ' + LAB + ' font-weight="700" font-size="14" fill="' + INK + '">Index</text>';
    var order = [0, 1, 2, 3].filter(function(k){ return k !== d.sel; });
    if(d.sel >= 0) order.push(d.sel);
    order.forEach(function(k){
      var it = ITEMS[k], dim = d.sel >= 0 && k !== d.sel;
      var pts = YEARS.map(function(_, i){ return X(i) + "," + Y(idx(it, i)).toFixed(1); }).join(" ");
      s += '<polyline points="' + pts + '" fill="none" stroke="' + it.col + '" stroke-width="' + (k === d.sel ? 4.5 : 2.5) + '"' + (dim ? ' stroke-opacity="0.3"' : '') + '/>';
      YEARS.forEach(function(_, i){
        s += '<circle cx="' + X(i) + '" cy="' + Y(idx(it, i)).toFixed(1) + '" r="' + (k === d.sel ? 5 : 3.5) + '" fill="' + it.col + '" stroke="' + WHITE + '" stroke-width="1.2"' + (dim ? ' fill-opacity="0.3"' : '') + '/>';
      });
    });
    s += '<circle cx="' + X(d.base) + '" cy="' + Y(100) + '" r="7" fill="none" stroke="' + INK + '" stroke-width="2.5"/>';
    svg.innerHTML = s;

    var tag = el.querySelector("#ptTag");
    if(d.sel < 0){
      tag.innerHTML = "Tap an item to follow its line. Every line goes through 100 in the base year, because the base year is compared with itself.";
    }else{
      var it = ITEMS[d.sel], last = 4;
      var change = idx(it, last) - 100;
      tag.innerHTML = '<b>' + it.name + '</b>: ' + money(it.p[d.base]) + ' in ' + YEARS[d.base] + ' (the base). In 2025 it is ' + money(it.p[last]) + ', ' +
        (Math.abs(change) < 0.05 ? 'the same price.' : (change > 0 ? 'dearer' : 'cheaper') + ' than the base year.');
    }
    var pr = '<table class="pt-prices"><tr><th></th>' + YEARS.map(function(y, i){ return '<th' + (i === d.base ? ' class="base"' : '') + '>' + y + '</th>'; }).join("") + '</tr>' +
      ITEMS.map(function(it){ return '<tr><th>' + it.short + '</th>' + it.p.map(function(p, i){ return '<td' + (i === d.base ? ' class="base"' : '') + '>' + p.toFixed(2) + '</td>'; }).join("") + '</tr>'; }).join("") + '</table>';
    el.querySelector("#ptPrices").innerHTML = pr + '<p class="tiny" style="margin:0">Prices in &pound;.</p>';
    stars();
  }

  function stars(){
    var s = "";
    for(var k = 0; k < PT_ROUNDS.length; k++){
      var n = d.stars[k] || 0;
      for(var j = 0; j < 3; j++) s += '<span class="' + (j < n ? "on" : "off") + '">&#9733;</span>';
      if(k < PT_ROUNDS.length - 1) s += " ";
    }
    el.querySelector("#ptStars").innerHTML = s;
  }

  function challenge(){
    var rd = el.querySelector("#ptRound");
    if(d.round >= PT_ROUNDS.length){
      rd.textContent = "All rounds done";
      var tot = d.stars.reduce(function(a, b){ return a + b; }, 0);
      ask.innerHTML = '<b>' + tot + ' stars out of 9.</b> Have a play with the base year: the lines move up and down, but how much each item grew between 2021 and 2025 stays the same, so chocolate still rose fastest over those years. Changing the base changes what you compare with, not which item rose fastest.';
      return;
    }
    var r = PT_ROUNDS[d.round];
    rd.textContent = "Round " + (d.round + 1) + " of 3";
    if(r.kind === "pick"){
      ask.innerHTML = '<p class="wnote" style="margin:0">' + r.ask + '</p><div class="pt-opts">' +
        ITEMS.map(function(it, k){ return '<button type="button" data-k="' + k + '">' + it.name + '</button>'; }).join("") + '</div>' +
        (d.rt >= 1 ? '<div class="wrow"><button class="btn btn-quiet" type="button" id="ptShow">Show me</button></div>' : '');
      [].forEach.call(ask.querySelectorAll("[data-k]"), function(b){
        b.onclick = function(){ answer(parseInt(b.getAttribute("data-k"), 10)); };
      });
    }else{
      ask.innerHTML = '<p class="wnote" style="margin:0">' + r.ask + '</p>' +
        '<div class="wrow"><input class="pt-in" id="ptAns" type="text" inputmode="decimal" autocomplete="off" aria-label="Index number">' +
        '<button class="btn" type="button" id="ptGo">Check</button>' +
        (d.rt >= 1 ? '<button class="btn btn-quiet" type="button" id="ptShow">Show me</button>' : '') + '</div>';
      var inp = ask.querySelector("#ptAns");
      ask.querySelector("#ptGo").onclick = function(){
        var v = EGW.parseNum(inp.value);
        if(isNaN(v)){ msg.innerHTML = "Pop a number in first."; return; }
        answer(v);
      };
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") ask.querySelector("#ptGo").click(); });
    }
    var sh = ask.querySelector("#ptShow");
    if(sh) sh.onclick = function(){ d.used = true; finishRound(1, '<b>Here it is.</b> ' + r.win); };
  }

  function answer(v){
    var r = PT_ROUNDS[d.round];
    var ok = r.kind === "pick" ? v === r.ans : Math.abs(v - r.ans) <= r.tol;
    if(ok){
      finishRound(Math.max(1, 3 - d.rt), '<b>' + ["Spot on.", "Sharp shopping.", "Yes!"][d.round] + '</b> ' + r.win);
      return;
    }
    d.rt++; d.miss++; api.save();
    var extra = "";
    if(r.kind === "pick" && v === 1) extra = " Cinema went up the most in pounds, but is that the most <b>in proportion</b>?";
    if(r.kind === "num" && r.base === 1 && Math.abs(v - 128) < 0.6) extra = " That is the index with 2021 as the base. Switch the base year to 2022.";
    if(r.kind === "num" && r.base === 0 && Math.abs(v - 133.3) < 0.6) extra = " Careful which way round: the base year price goes on the bottom.";
    if(r.kind === "num" && r.base === 0 && Math.abs(v - 25) < 0.6) extra = " That is how much it fell, as a percentage. The index itself is 100 minus that.";
    msg.innerHTML = '<b>' + r.nudge.split(". ")[0] + '.</b> ' + r.nudge.split(". ").slice(1).join(". ") + extra + (d.rt >= 1 ? " Show me is there if you want it." : "");
    challenge();
  }

  function finishRound(n, text){
    d.stars[d.round] = n;
    if(PT_ROUNDS[d.round].base !== undefined){ d.base = PT_ROUNDS[d.round].base; }
    d.round++; d.rt = 0;
    if(d.round >= PT_ROUNDS.length && !d.result){
      d.result = d.used ? "shown" : (d.miss ? "right2" : "right1");
      api.save(); api.done(d.result);
    }
    api.save();
    draw(); challenge();
    msg.innerHTML = text;
  }

  draw(); challenge();
}
