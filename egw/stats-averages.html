<script>
(function(){
"use strict";

var INK = "#141a33", TEAL = "#3a5cff", BRIGHT = "#22b8e6", ORANGE = "#ff5d5d",
    YELLOW = "#ffd23f", PLUM = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

/* ---------- figure builders ---------- */

/* Box plots on a shared scale. rows: [{name, v:[min,lq,med,uq,max], col}] */
function BOX(rows, lo, hi, step, axisLabel, aria, VW){
  VW = VW || 380;
  var named = rows.some(function(r){ return r.name; });
  var L = named ? 86 : 16, R = VW - 20, rowH = 58, top = 12;
  var H = top + rows.length * rowH + (axisLabel ? 58 : 38);
  function X(v){ return L + (v - lo) / (hi - lo) * (R - L); }
  var s = '<svg viewBox="0 0 ' + VW + ' ' + H + '" role="img" aria-label="' + aria + '">';
  rows.forEach(function(r, i){
    var cy = top + i * rowH + 26, v = r.v, c = r.col || BRIGHT;
    if(r.name) s += '<text x="8" y="' + (cy + 5) + '" ' + LAB + ' font-weight="800" font-size="19" fill="' + INK + '">' + r.name + '</text>';
    s += '<line x1="' + X(v[0]) + '" y1="' + cy + '" x2="' + X(v[1]) + '" y2="' + cy + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<line x1="' + X(v[3]) + '" y1="' + cy + '" x2="' + X(v[4]) + '" y2="' + cy + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<line x1="' + X(v[0]) + '" y1="' + (cy - 11) + '" x2="' + X(v[0]) + '" y2="' + (cy + 11) + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<line x1="' + X(v[4]) + '" y1="' + (cy - 11) + '" x2="' + X(v[4]) + '" y2="' + (cy + 11) + '" stroke="' + INK + '" stroke-width="3"/>';
    s += '<rect x="' + X(v[1]) + '" y="' + (cy - 18) + '" width="' + (X(v[3]) - X(v[1])) + '" height="36" fill="' + c + '" fill-opacity="0.35" stroke="' + INK + '" stroke-width="3"/>';
    s += '<line x1="' + X(v[2]) + '" y1="' + (cy - 18) + '" x2="' + X(v[2]) + '" y2="' + (cy + 18) + '" stroke="' + INK + '" stroke-width="4"/>';
  });
  var ay = top + rows.length * rowH + 4;
  s += '<line x1="' + L + '" y1="' + ay + '" x2="' + R + '" y2="' + ay + '" stroke="' + INK + '" stroke-width="2"/>';
  for(var t = lo; t <= hi + 1e-9; t += step){
    s += '<line x1="' + X(t) + '" y1="' + ay + '" x2="' + X(t) + '" y2="' + (ay + (Math.round((t - lo) / step) % ((hi - lo) / step > 8 ? 2 : 1) === 0 ? 9 : 5)) + '" stroke="' + INK + '" stroke-width="2"/>';
    var every = (hi - lo) / step > 8 ? 2 : 1;
    if(Math.round((t - lo) / step) % every === 0) s += '<text x="' + X(t) + '" y="' + (ay + 26) + '" text-anchor="middle" ' + BODY + ' font-size="18" fill="' + INK + '">' + t + '</text>';
  }
  if(axisLabel) s += '<text x="' + ((L + R) / 2) + '" y="' + (ay + 52) + '" text-anchor="middle" ' + BODY + ' font-size="18" fill="' + INK + '">' + axisLabel + '</text>';
  return s + '</svg>';
}

/* A labelled box plot for the learn card */
var BOX_LABELLED = (function(){
  var v = [4, 9, 12, 16, 22], L = 16, R = 344, lo = 0, hi = 25;
  function X(t){ return L + (t - lo) / (hi - lo) * (R - L); }
  var cy = 96;
  var s = '<svg viewBox="0 0 360 200" role="img" aria-label="A box plot with the minimum, lower quartile, median, upper quartile and maximum labelled" style="max-width:460px">';
  var names = ["Min", "LQ", "Median", "UQ", "Max"];
  var cols = [INK, TEAL, ORANGE, TEAL, INK];
  var ys = [44, 44, 20, 44, 44];
  v.forEach(function(t, k){
    s += '<text x="' + X(t) + '" y="' + ys[k] + '" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="17" fill="' + cols[k] + '">' + names[k] + '</text>';
    s += '<line x1="' + X(t) + '" y1="' + (ys[k] + 6) + '" x2="' + X(t) + '" y2="' + (cy - 20) + '" stroke="' + cols[k] + '" stroke-width="2" stroke-dasharray="4 3"/>';
  });
  s += '<line x1="' + X(v[0]) + '" y1="' + cy + '" x2="' + X(v[1]) + '" y2="' + cy + '" stroke="' + INK + '" stroke-width="3"/>';
  s += '<line x1="' + X(v[3]) + '" y1="' + cy + '" x2="' + X(v[4]) + '" y2="' + cy + '" stroke="' + INK + '" stroke-width="3"/>';
  s += '<line x1="' + X(v[0]) + '" y1="' + (cy - 11) + '" x2="' + X(v[0]) + '" y2="' + (cy + 11) + '" stroke="' + INK + '" stroke-width="3"/>';
  s += '<line x1="' + X(v[4]) + '" y1="' + (cy - 11) + '" x2="' + X(v[4]) + '" y2="' + (cy + 11) + '" stroke="' + INK + '" stroke-width="3"/>';
  s += '<rect x="' + X(v[1]) + '" y="' + (cy - 18) + '" width="' + (X(v[3]) - X(v[1])) + '" height="36" fill="' + BRIGHT + '" fill-opacity="0.35" stroke="' + INK + '" stroke-width="3"/>';
  s += '<line x1="' + X(v[2]) + '" y1="' + (cy - 18) + '" x2="' + X(v[2]) + '" y2="' + (cy + 18) + '" stroke="' + ORANGE + '" stroke-width="4"/>';
  s += '<path d="M' + X(v[1]) + ' 122 V130 H' + X(v[3]) + ' V122" fill="none" stroke="' + PLUM + '" stroke-width="2.5"/>';
  s += '<text x="' + ((X(v[1]) + X(v[3])) / 2) + '" y="150" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="16" fill="' + PLUM + '">IQR = 16 &#8722; 9 = 7</text>';
  s += '<line x1="' + L + '" y1="166" x2="' + R + '" y2="166" stroke="' + INK + '" stroke-width="2"/>';
  for(var t = 0; t <= 25; t += 5){
    s += '<line x1="' + X(t) + '" y1="166" x2="' + X(t) + '" y2="172" stroke="' + INK + '" stroke-width="2"/>';
    s += '<text x="' + X(t) + '" y="192" text-anchor="middle" ' + BODY + ' font-size="16" fill="' + INK + '">' + t + '</text>';
  }
  return s + '</svg>';
})();

/* Dot plot of 3, 4, 4, 6, 8 for the first learn card */
var DOTS = (function(){
  var vals = [3, 4, 4, 6, 8], L = 16, R = 344;
  function X(t){ return L + t / 10 * (R - L); }
  var s = '<svg viewBox="0 0 360 166" role="img" aria-label="Dot plot of 3, 4, 4, 6, 8 with the mean at 5 and the median at 4" style="max-width:460px">';
  var seen = {};
  vals.forEach(function(v){
    seen[v] = (seen[v] || 0) + 1;
    s += '<circle cx="' + X(v) + '" cy="' + (92 - (seen[v] - 1) * 22) + '" r="9" fill="' + BRIGHT + '" stroke="' + INK + '" stroke-width="2.5"/>';
  });
  s += '<path d="M' + X(3) + ' 34 V26 H' + X(8) + ' V34" fill="none" stroke="' + PLUM + '" stroke-width="2.5"/>';
  s += '<text x="' + X(5.5) + '" y="18" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="16" fill="' + PLUM + '">range = 8 &#8722; 3 = 5</text>';
  s += '<line x1="' + L + '" y1="106" x2="' + R + '" y2="106" stroke="' + INK + '" stroke-width="2"/>';
  for(var t = 0; t <= 10; t++){
    s += '<line x1="' + X(t) + '" y1="106" x2="' + X(t) + '" y2="112" stroke="' + INK + '" stroke-width="2"/>';
    s += '<text x="' + X(t) + '" y="130" text-anchor="middle" ' + BODY + ' font-size="15" fill="' + INK + '">' + t + '</text>';
  }
  s += '<path d="M' + X(5) + ' 140 l-7 13 h14 z" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="1.5"/>';
  s += '<text x="' + (X(5) + 12) + '" y="155" ' + LAB + ' font-weight="800" font-size="16" fill="' + ORANGE + '">mean 5</text>';
  s += '<path d="M' + X(4) + ' 139 l-7 7 l7 7 l7 -7 z" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="1.5"/>';
  s += '<text x="' + (X(4) - 12) + '" y="155" text-anchor="end" ' + LAB + ' font-weight="800" font-size="16" fill="' + TEAL + '">median, mode 4</text>';
  return s + '</svg>';
})();

/* ---------- tables ---------- */
var FREQ =
'<table class="datatable"><tr><th>Goals scored</th><th>Frequency</th></tr>' +
'<tr><td>0</td><td>3</td></tr><tr><td>1</td><td>6</td></tr><tr><td>2</td><td>5</td></tr>' +
'<tr><td>3</td><td>4</td></tr><tr><td>4</td><td>2</td></tr></table>';

var FREQ_LEARN =
'<table class="datatable"><tr><th>Pets (x)</th><th>Frequency (f)</th><th>f &times; x</th></tr>' +
'<tr><td>0</td><td>4</td><td>0</td></tr><tr><td>1</td><td>7</td><td>7</td></tr>' +
'<tr><td>2</td><td>3</td><td>6</td></tr><tr><td>3</td><td>1</td><td>3</td></tr>' +
'<tr><th>Total</th><th>15</th><th>16</th></tr></table>';

var GROUPED_LEARN =
'<table class="datatable"><tr><th>Mass, m (kg)</th><th>Frequency</th><th>Midpoint</th><th>f &times; mid</th></tr>' +
'<tr><td>0 &lt; m &le; 4</td><td>2</td><td>2</td><td>4</td></tr>' +
'<tr><td>4 &lt; m &le; 8</td><td>5</td><td>6</td><td>30</td></tr>' +
'<tr><td>8 &lt; m &le; 12</td><td>3</td><td>10</td><td>30</td></tr>' +
'<tr><th>Total</th><th>10</th><th></th><th>64</th></tr></table>';

var GROUPED =
'<table class="datatable"><tr><th>Time, t (minutes)</th><th>Frequency</th></tr>' +
'<tr><td>0 &lt; t &le; 10</td><td>4</td></tr><tr><td>10 &lt; t &le; 20</td><td>9</td></tr>' +
'<tr><td>20 &lt; t &le; 30</td><td>5</td></tr><tr><td>30 &lt; t &le; 40</td><td>2</td></tr></table>';

/* ---------- the outlier widget ---------- */
var FIX = [4, 6, 8, 10, 10, 12, 14, 16];
var MAXV = 40;

function mountTug(el, api){
  var d = api.data;
  if(typeof d.x !== "number") d.x = 11;
  d.tries = d.tries || 0;

  el.innerHTML =
    '<div class="wpanel">' +
      '<svg id="twSvg" viewBox="0 0 300 176" role="img" aria-label="Dot plot of nine values. The orange dot can be dragged along the number line." style="width:100%;max-width:520px;margin:0 auto;height:auto;display:block;touch-action:none;cursor:pointer;user-select:none"></svg>' +
      '<div class="wrow" style="justify-content:center">' +
        '<button class="btn btn-quiet" type="button" id="twL" aria-label="Move the orange dot left" style="min-width:56px">&larr;</button>' +
        '<span class="wnote" style="min-width:120px;text-align:center">orange dot: <b id="twX"></b></span>' +
        '<button class="btn btn-quiet" type="button" id="twR" aria-label="Move the orange dot right" style="min-width:56px">&rarr;</button>' +
      '</div>' +
      '<div class="wrow" style="justify-content:space-around;text-align:center">' +
        '<div><div class="tiny" style="margin:0">Mean</div><div class="wbig" id="twMean" style="color:' + ORANGE + '"></div></div>' +
        '<div><div class="tiny" style="margin:0">Median</div><div class="wbig" id="twMed" style="color:' + TEAL + '"></div></div>' +
        '<div><div class="tiny" style="margin:0">Range</div><div class="wbig" id="twRange" style="color:' + PLUM + '"></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="wpanel" id="twTask">' +
      '<p class="wnote"><b>Have a play first.</b> Drag the orange dot (or tap the line, or use the arrows) all the way to the right. Which marker chases it, and which one barely moves?</p>' +
      '<p class="wnote"><b>Challenge:</b> put the orange dot where the <b>mean is exactly 12</b>, then press Check my spot.</p>' +
      '<div class="wrow"><button class="btn" type="button" id="twCheck">Check my spot</button>' +
      '<button class="btn btn-quiet hidden" type="button" id="twShow">Show me</button></div>' +
      '<div class="wnote" id="twMsg" aria-live="polite"></div>' +
    '</div>';

  var svg = el.querySelector("#twSvg");
  var L = 14, R = 286;
  function X(v){ return L + v / MAXV * (R - L); }

  function stats(){
    var all = FIX.concat([d.x]).sort(function(a, b){ return a - b; });
    var sum = all.reduce(function(a, b){ return a + b; }, 0);
    return { all: all, sum: sum, mean: sum / all.length, med: all[4], range: all[all.length - 1] - all[0] };
  }
  function fmt(n){ return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(1); }

  function draw(){
    var st = stats();
    var s = "";
    /* range bracket */
    var mn = st.all[0], mx = st.all[8];
    s += '<path d="M' + X(mn) + ' 38 V30 H' + X(mx) + ' V38" fill="none" stroke="' + PLUM + '" stroke-width="2.5"/>';
    var rx = Math.max(40, Math.min(260, (X(mn) + X(mx)) / 2));
    s += '<text x="' + rx + '" y="22" text-anchor="middle" ' + LAB + ' font-weight="800" font-size="15" fill="' + PLUM + '">range ' + st.range + '</text>';
    /* axis */
    s += '<line x1="' + L + '" y1="110" x2="' + R + '" y2="110" stroke="' + INK + '" stroke-width="2"/>';
    for(var t = 0; t <= MAXV; t += 5){
      s += '<line x1="' + X(t) + '" y1="110" x2="' + X(t) + '" y2="' + (t % 10 === 0 ? 118 : 115) + '" stroke="' + INK + '" stroke-width="2"/>';
      if(t % 10 === 0) s += '<text x="' + X(t) + '" y="133" text-anchor="middle" ' + BODY + ' font-size="14" fill="' + INK + '">' + t + '</text>';
    }
    /* fixed dots, stacked */
    var count = {};
    FIX.forEach(function(v){
      count[v] = (count[v] || 0) + 1;
      s += '<circle cx="' + X(v) + '" cy="' + (100 - (count[v] - 1) * 14) + '" r="6" fill="' + BRIGHT + '" stroke="' + INK + '" stroke-width="2"/>';
    });
    count[d.x] = (count[d.x] || 0) + 1;
    var oy = 100 - (count[d.x] - 1) * 14;
    s += '<circle cx="' + X(d.x) + '" cy="' + oy + '" r="8" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="2.5"/>';
    /* markers: median diamond, mean triangle, on separate rows; labels flip side near the right edge */
    function mark(x, y, shape, col, word){
      var right = x > 210;
      s += shape;
      s += '<text x="' + (right ? x - 11 : x + 11) + '" y="' + y + '" text-anchor="' + (right ? "end" : "start") + '" ' + LAB + ' font-weight="800" font-size="14" fill="' + col + '">' + word + '</text>';
    }
    var mx2 = X(st.med), me = X(st.mean);
    mark(mx2, 153, '<path d="M' + mx2 + ' 140 l-7 7 l7 7 l7 -7 z" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="1.5"/>', TEAL, "median");
    mark(me, 172, '<path d="M' + me + ' 158 l-7 14 h14 z" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="1.5"/>', ORANGE, "mean");
    svg.innerHTML = s;
    el.querySelector("#twX").textContent = d.x;
    el.querySelector("#twMean").textContent = fmt(st.mean);
    el.querySelector("#twMed").textContent = fmt(st.med);
    el.querySelector("#twRange").textContent = st.range;
    bonusCheck(st);
  }

  function setX(v){
    v = Math.max(0, Math.min(MAXV, Math.round(v)));
    if(v === d.x) return;
    d.x = v; api.save(); draw();
  }

  function toValue(e){
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return (p.x - L) / (R - L) * MAXV;
  }
  var dragging = false;
  svg.addEventListener("pointerdown", function(e){
    dragging = true;
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    setX(toValue(e)); e.preventDefault();
  });
  svg.addEventListener("pointermove", function(e){ if(dragging) setX(toValue(e)); });
  svg.addEventListener("pointerup", function(){ dragging = false; });
  svg.addEventListener("pointercancel", function(){ dragging = false; });
  el.querySelector("#twL").onclick = function(){ setX(d.x - 1); };
  el.querySelector("#twR").onclick = function(){ setX(d.x + 1); };

  var msg = el.querySelector("#twMsg");
  var showBtn = el.querySelector("#twShow");
  var checkBtn = el.querySelector("#twCheck");

  var WIN = '<b>Yes, mean 12.</b> Nine values with a mean of 12 add up to 9 &times; 12 = 108. The eight blue dots add up to 80, so the orange one is 108 &minus; 80 = 28. ' +
            'Now look at the median: still 10. One big value dragged the mean up, but the median did not budge. That is exactly why the median is safer when there is an outlier.';

  function finished(){
    checkBtn.classList.add("hidden"); showBtn.classList.add("hidden");
    msg.innerHTML = (d.result === "shown" ? '<b>Here it is.</b> ' + WIN.replace('<b>Yes, mean 12.</b> ', '') : WIN) +
      '<p class="wnote" style="margin-top:10px"><b>One more, only if you fancy it:</b> can you find a spot where the mean is <b>smaller</b> than the median? <span id="twBonus"></span></p>';
    bonusCheck(stats());
  }
  function bonusCheck(st){
    var b = el.querySelector("#twBonus");
    if(!b) return;
    if(st.mean < st.med - 1e-9){
      b.innerHTML = '<b style="color:#2e7d4f">Done: mean ' + fmt(st.mean) + ', median ' + fmt(st.med) + '. A low value pulls the mean down in the same way.</b>';
      if(!d.bonus){ d.bonus = true; api.save(); }
    }else{
      b.textContent = "";
    }
  }

  checkBtn.onclick = function(){
    var st = stats();
    if(Math.abs(st.mean - 12) < 1e-9){
      d.result = d.tries ? "right2" : "right1"; api.save();
      api.done(d.result); finished(); return;
    }
    d.tries++; api.save();
    if(d.tries === 1){
      msg.innerHTML = '<b>Not quite yet: the mean is ' + fmt(st.mean) + '.</b> A thought: for a mean of 12, the nine values need to add up to 9 &times; 12. What do the eight blue dots add up to already?';
    }else{
      msg.innerHTML = '<b>Still not 12 (it is ' + fmt(st.mean) + ').</b> Have another go, or tap Show me.';
      showBtn.classList.remove("hidden");
    }
  };
  showBtn.onclick = function(){
    d.x = 28; d.result = "shown"; api.save(); draw();
    api.done("shown"); finished();
  };

  draw();
  if(d.result) finished();
  else if(d.tries >= 2) showBtn.classList.remove("hidden");
}

/* ---------- option plots for the box plot question ---------- */
function OPT(v, aria){ return BOX([{ v: v }], 0, 20, 1, "", aria, 380); }

EGW.run({
  id: "stats-averages",
  title: "Averages, spread and box plots",
  subject: "GCSE Statistics",
  mins: 50,
  blurb: "Mean, median, mode and range, then frequency tables, quartiles and box plots, and finally how to compare two sets of data the way the mark scheme likes.",
  steps: [

  /* ---------- BASICS ---------- */
  { type: "learn", topic: "Three averages",
    title: "Three averages and a spread",
    fig: DOTS,
    html: '<p>An <b>average</b> is one number that sums up a typical value. There are three.</p>' +
          '<ul>' +
          '<li><b>Mean</b>: add them all up, divide by how many there are. 3 + 4 + 4 + 6 + 8 = 25, and 25 &divide; 5 = <b>5</b>.</li>' +
          '<li><b>Median</b>: put them in order, take the middle one. 3, 4, <b>4</b>, 6, 8. With an even number of values, it is halfway between the middle two.</li>' +
          '<li><b>Mode</b>: the most common value. Here <b>4</b>. There can be more than one mode, or none.</li>' +
          '</ul>' +
          '<p>The <b>range</b> is not an average. It measures <b>spread</b>: largest minus smallest, 8 &minus; 3 = 5.</p>' +
          '<div class="keep"><b>Keep this</b>Order the list before you do anything else. It makes the median, mode and range almost free.</div>' },

  { type: "num", topic: "Three averages",
    q: "Here are the number of minutes nine students spent on a quiz:<br><b>12, 7, 9, 15, 7, 11, 8, 7, 14</b><br>Find the mean, median, mode and range.",
    boxes: [
      { label: "Mean", a: 10, post: "minutes" },
      { label: "Median", a: 9, post: "minutes" },
      { label: "Mode", a: 7, post: "minutes" },
      { label: "Range", a: 8, post: "minutes" }
    ],
    hint: "Order them first: 7, 7, 7, 8, ... The total is 90. The middle of nine values is the 5th one.",
    why: "In order: 7, 7, 7, 8, <b>9</b>, 11, 12, 14, 15.<br>Mean: 90 &divide; 9 = 10. Median: the 5th value, 9. Mode: 7 (three times). Range: 15 &minus; 7 = 8.<br>A common slip is to take the middle of the <i>unordered</i> list, which gives 7 here." },

  /* ---------- WHICH AVERAGE ---------- */
  { type: "learn", topic: "Which average?",
    title: "Which average, and why",
    html: '<p>Five friends get this much pocket money a week: &pound;8, &pound;10, &pound;12, &pound;15, &pound;80.</p>' +
          '<ul>' +
          '<li>Mean = 125 &divide; 5 = <b>&pound;25</b>. Four of the five get less than that.</li>' +
          '<li>Median = <b>&pound;12</b>. Much more typical.</li>' +
          '</ul>' +
          '<p>The &pound;80 is an <b>outlier</b>: a value far from the rest. The mean uses every value, so one outlier drags it. The median only cares about the middle, so it hardly moves.</p>' +
          '<table class="datatable"><tr><th></th><th>Good for</th><th>Watch out</th></tr>' +
          '<tr><td><b>Mean</b></td><td>Uses all the data</td><td>Dragged by outliers</td></tr>' +
          '<tr><td><b>Median</b></td><td>Hardly affected by outliers</td><td>Ignores most values</td></tr>' +
          '<tr><td><b>Mode</b></td><td>Works for words too (qualitative data)</td><td>May not exist, or be several</td></tr></table>' +
          '<div class="keep"><b>Keep this</b>Outlier in the data? Reach for the median. Data in words, like colours? Only the mode works.</div>' },

  { type: "mc", topic: "Which average?",
    q: "For the pocket money (&pound;8, &pound;10, &pound;12, &pound;15, &pound;80), which average best describes a typical amount, and why?",
    options: [
      "The mean, &pound;25, because it uses all the values",
      "The median, &pound;12, because the &pound;80 outlier drags the mean up",
      "The mode, because it is the most common amount",
      "The range, &pound;72, because it includes the biggest amount"
    ],
    answer: 1,
    hint: "Look at how many friends actually get close to each number.",
    why: "The median. Using all the values sounds fair, but here that is the problem: the &pound;80 pulls the mean above four of the five people. There is no mode (every amount appears once), and the range measures spread, not a typical value." },

  { type: "sort", topic: "Which average?",
    q: "Which average would you choose for each one?",
    buckets: ["Mean", "Median", "Mode"],
    cards: [
      ["Times of six runners who all finished close together, and you want every time to count", 0],
      ["Test marks with no extreme values, when you want to use every mark", 0],
      ["House prices on a street where one house is a huge mansion", 1],
      ["Salaries at a small firm where the owner earns far more than everyone else", 1],
      ["The most popular crisp flavour in a class", 2],
      ["The shoe size a shop should order the most of", 2]
    ],
    hint: "Ask two things: is there an outlier, and is the data words or numbers?",
    why: "Mansion and the owner's salary are outliers, so the median. Crisp flavours are words, so only the mode works, and the shop wants the size that sells most often, which is the mode. With no outliers, the mean is a good choice because it uses every value." },

  { type: "widget", topic: "Which average?",
    title: "Outlier tug of war",
    html: "Nine values on a number line. Eight are fixed. The orange one is yours to move. Watch the mean (orange triangle) and the median (teal diamond).",
    mount: mountTug,
    report: function(d){
      var r = { right1: "mean of 12 found first go", right2: "mean of 12 found second go", shown: "used Show me for the mean of 12" }[d.result] || "challenge not finished";
      return "Outlier widget: " + r + (d.bonus ? "; also made the mean smaller than the median" : "") + ".";
    } },

  /* ---------- FREQUENCY TABLES ---------- */
  { type: "learn", topic: "Frequency tables",
    title: "Mean from a frequency table",
    fig: FREQ_LEARN,
    html: '<p>This table shows how many pets 15 students have. "Frequency 7" next to "1" means seven students have 1 pet each.</p>' +
          '<ul>' +
          '<li>Add a column for <b>f &times; x</b>: frequency times value. That is the total for each row.</li>' +
          '<li>Add up that column for the <b>total of all the values</b>: 16 pets.</li>' +
          '<li>Add up the frequencies for <b>how many</b>: 15 students.</li>' +
          '<li>Mean = 16 &divide; 15 = <b>1.07</b> pets (to 2 decimal places).</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Mean = total of f &times; x &divide; total frequency. Never divide by the number of rows.</div>' },

  { type: "num", topic: "Frequency tables",
    q: "The table shows the goals scored by a team in 20 matches.",
    fig: FREQ,
    boxes: [
      { label: "Total frequency", a: 20, post: "matches" },
      { label: "Total goals (f &times; x)", a: 36, post: "goals" },
      { label: "Mean", a: 1.8, post: "goals per match" }
    ],
    hint: "Multiply each number of goals by its frequency: 0 &times; 3, 1 &times; 6, 2 &times; 5 ... then add those up.",
    why: "f &times; x: 0 + 6 + 10 + 12 + 8 = 36 goals. Frequencies: 3 + 6 + 5 + 4 + 2 = 20 matches. Mean = 36 &divide; 20 = 1.8.<br>Two common slips: dividing by 5 (the number of rows), or adding up 0 + 1 + 2 + 3 + 4 and forgetting the frequencies." },

  /* ---------- GROUPED DATA ---------- */
  { type: "learn", topic: "Grouped data",
    title: "Grouped data: estimate with midpoints",
    fig: GROUPED_LEARN,
    html: '<p>In a grouped table you do not know the exact values. "4 &lt; m &le; 8" just says five parcels weighed somewhere between 4 and 8 kg.</p>' +
          '<p>So you <b>assume</b> every value in a group sits at the <b>midpoint</b> of that group, then carry on as before.</p>' +
          '<ul>' +
          '<li>Midpoint of 4 &lt; m &le; 8 is (4 + 8) &divide; 2 = 6.</li>' +
          '<li>Estimated mean = 64 &divide; 10 = <b>6.4 kg</b>.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>It is only an <b>estimate</b>, because the midpoints are a guess at the real values. Say "estimate" in your answer.</div>' },

  { type: "order", topic: "Grouped data",
    q: "Put the steps for an estimated mean from a grouped frequency table in order.",
    items: [
      "Find the midpoint of each group",
      "Multiply each midpoint by its frequency",
      "Add up all those products",
      "Divide by the total frequency"
    ],
    hint: "You need the midpoints before you can multiply anything.",
    why: "Midpoint, multiply, add, divide. The answer is an estimate because you are pretending everyone in a group is at its midpoint." },

  { type: "num", topic: "Grouped data", stretch: true,
    q: "The table shows how long 20 students take to get to school. Work out an estimate of the mean time.",
    fig: GROUPED,
    boxes: [
      { label: "Total of midpoint &times; frequency", a: 350 },
      { label: "Estimated mean", a: 17.5, post: "minutes" }
    ],
    hint: "The midpoints are 5, 15, 25 and 35. Multiply each by its frequency.",
    why: "5 &times; 4 = 20, 15 &times; 9 = 135, 25 &times; 5 = 125, 35 &times; 2 = 70. Total 350. 350 &divide; 20 = <b>17.5 minutes</b>.<br>Using the end of each group (10, 20, 30, 40) instead of the midpoint is the most common slip, and gives 22.5." },

  /* ---------- QUARTILES ---------- */
  { type: "learn", topic: "Quartiles and IQR",
    title: "Quartiles and the interquartile range",
    html: '<p>The median cuts ordered data in half. <b>Quartiles</b> cut it into quarters.</p>' +
          '<ul>' +
          '<li><b>Lower quartile (LQ)</b>: a quarter of the way through.</li>' +
          '<li><b>Upper quartile (UQ)</b>: three quarters of the way through.</li>' +
          '<li><b>Interquartile range (IQR)</b> = UQ &minus; LQ. The spread of the middle half.</li>' +
          '</ul>' +
          '<p>One common method for n values in order: the LQ is the <b>(n + 1) &divide; 4</b> th value, the median the <b>(n + 1) &divide; 2</b> th, and the UQ the <b>3(n + 1) &divide; 4</b> th. Textbooks vary a little, but with lists like the ones here the usual methods give the same answers.</p>' +
          '<p>Example, 7 values: 2, <b>4</b>, 5, <b>6</b>, 9, <b>10</b>, 13. LQ is the 2nd value (4), median the 4th (6), UQ the 6th (10). IQR = 10 &minus; 4 = 6.</p>' +
          '<div class="keep"><b>Keep this</b>The IQR ignores the top and bottom quarters, so unlike the range, an outlier cannot wreck it.</div>' },

  { type: "num", topic: "Quartiles and IQR",
    q: "Eleven scores, already in order:<br><b>3, 5, 6, 8, 9, 11, 12, 14, 15, 17, 20</b><br>Find the median, the quartiles and the interquartile range.",
    boxes: [
      { label: "Median", a: 11 },
      { label: "Lower quartile", a: 6 },
      { label: "Upper quartile", a: 15 },
      { label: "IQR", a: 9 }
    ],
    hint: "n = 11, so (n + 1) &divide; 4 = 3. The LQ is the 3rd value. Where do the median and UQ sit?",
    why: "(11 + 1) &divide; 4 = 3, so the LQ is the 3rd value, <b>6</b>. The median is the 6th, <b>11</b>. The UQ is the 9th, <b>15</b>. IQR = 15 &minus; 6 = <b>9</b>.<br>Another way to see it: the median splits off 5 values each side, and the quartiles are the middles of those halves." },

  { type: "match", topic: "Quartiles and IQR",
    q: "Match each measure to how you find it.",
    pairs: [
      ["Mean", "Total divided by how many"],
      ["Median", "The middle value in order"],
      ["Mode", "The most common value"],
      ["Range", "Largest minus smallest"],
      ["Lower quartile", "A quarter of the way through the ordered data"],
      ["Interquartile range", "Upper quartile minus lower quartile"]
    ],
    hint: "Three of these are averages and two are measures of spread. The odd one is a position in the data.",
    why: "Mean, median and mode are averages. Range and IQR measure spread. The lower quartile is neither, it is a position, but you need it to get the IQR." },

  /* ---------- BOX PLOTS ---------- */
  { type: "learn", topic: "Box plots",
    title: "Box plots: five numbers in one picture",
    fig: BOX_LABELLED,
    html: '<p>A box plot shows five values: <b>minimum, lower quartile, median, upper quartile, maximum</b>.</p>' +
          '<ul>' +
          '<li>The <b>box</b> runs from LQ to UQ. Its width is the IQR.</li>' +
          '<li>The line inside the box is the <b>median</b>. It does not have to be in the middle of the box.</li>' +
          '<li>The <b>whiskers</b> reach out to the smallest and largest values.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Always read the values off the scale, not by counting squares. Check what each step on the axis is worth.</div>' },

  { type: "num", topic: "Box plots",
    q: "The box plot shows the time, in minutes, that a group of students spent on homework one evening.",
    fig: BOX([{ v: [15, 20, 30, 35, 45] }], 10, 50, 5, "Time (minutes)", "Box plot: minimum 15, lower quartile 20, median 30, upper quartile 35, maximum 45"),
    boxes: [
      { label: "Median", a: 30, post: "minutes" },
      { label: "Interquartile range", a: 15, post: "minutes" },
      { label: "Range", a: 30, post: "minutes" }
    ],
    hint: "Each step on the axis is 5 minutes. Read off the five values first, then do the subtractions.",
    why: "Reading off: min 15, LQ 20, median 30, UQ 35, max 45.<br>IQR = 35 &minus; 20 = 15. Range = 45 &minus; 15 = 30. Notice the IQR and the range are different things: the IQR only uses the middle half." },

  { type: "mc", topic: "Box plots",
    q: "Some data has minimum 4, lower quartile 8, median 11, upper quartile 13 and maximum 18. Which box plot shows it?",
    options: [
      OPT([4, 8, 9, 13, 18], "Box from 8 to 13 with median at 9, whiskers 4 to 18"),
      OPT([4, 8, 11, 13, 18], "Box from 8 to 13 with median at 11, whiskers 4 to 18"),
      OPT([4, 4, 11, 13, 18], "Box from 4 to 13 with median at 11, whisker only to 18"),
      OPT([0, 8, 11, 13, 20], "Box from 8 to 13 with median at 11, whiskers 0 to 20")
    ],
    answer: 1,
    hint: "Check all five values against the scale, especially where the line inside the box sits.",
    why: "The one with the box from 8 to 13, the median at 11 and whiskers from 4 to 18. One of the others puts the median at 9, but the data says 11, nearer the UQ: always check the line inside the box against the scale. Another starts the box at 4, the minimum, instead of the LQ. And one stretches the whiskers out to 0 and 20, the ends of the axis, instead of the smallest and largest values." },

  /* ---------- OUTLIERS ---------- */
  { type: "learn", topic: "Outliers",
    title: "Outliers: a rule, not a feeling",
    html: '<p class="tiny"><b>The 1.5 &times; IQR rule is Higher only.</b> Spotting an outlier by eye is on both tiers.</p>' +
          '<p>You can often spot an outlier by eye. But there is also a rule you can calculate, and exams like it.</p>' +
          '<ul>' +
          '<li>A value is an outlier if it is <b>below LQ &minus; 1.5 &times; IQR</b></li>' +
          '<li>or <b>above UQ + 1.5 &times; IQR</b>.</li>' +
          '</ul>' +
          '<p>Example: LQ 10, UQ 14, so IQR = 4 and 1.5 &times; 4 = 6. Outliers are below 10 &minus; 6 = <b>4</b> or above 14 + 6 = <b>20</b>.</p>' +
          '<p>On a box plot, an outlier is often drawn as a cross, and the whisker stops at the biggest value that is not an outlier.</p>' +
          '<div class="keep"><b>Keep this</b>Is an outlier a mistake? Not always. Check whether it could be real before you remove it, and say so.</div>' },

  { type: "num", topic: "Outliers", stretch: true,
    q: "A data set has lower quartile 18 and upper quartile 26. Use the 1.5 &times; IQR rule to find the limits for outliers.",
    boxes: [
      { label: "Values below this are outliers", a: 6 },
      { label: "Values above this are outliers", a: 38 }
    ],
    hint: "IQR first. Then 1.5 &times; IQR. Take that off the LQ, and add it to the UQ.",
    why: "IQR = 26 &minus; 18 = 8. 1.5 &times; 8 = 12.<br>Lower limit: 18 &minus; 12 = <b>6</b>. Upper limit: 26 + 12 = <b>38</b>." },

  { type: "multi", topic: "Outliers", stretch: true, fixed: true,
    q: "Same data: outliers are below 6 or above 38. Which <b>two</b> of these values would be outliers?",
    options: ["4", "7", "35", "38", "41"],
    answers: [0, 4],
    hint: "Outliers are strictly below 6 or strictly above 38.",
    why: "4 is below 6 and 41 is above 38, so both are outliers. 38 sits exactly on the limit, so it is not above it: not an outlier." },

  /* ---------- COMPARING ---------- */
  { type: "learn", topic: "Comparing data",
    title: "Comparing two sets of data",
    fig: BOX([{ name: "Year 9", v: [4, 8, 11, 13, 18], col: BRIGHT }, { name: "Year 11", v: [2, 5, 8, 14, 20], col: YELLOW }], 0, 20, 1, "Time spent reading each day (minutes)", "Two box plots: Year 9 median 11, IQR 5; Year 11 median 8, IQR 9"),
    html: '<p>A full comparison has <b>two parts</b>, and both should be <b>in context</b> (talk about reading time, not just numbers).</p>' +
          '<ul>' +
          '<li><b>An average</b>: "On average, Year 9 read for longer, because their median (11 minutes) is higher than Year 11\'s (8 minutes)."</li>' +
          '<li><b>A spread</b>: "Year 9\'s reading times are more consistent, because their IQR (5 minutes) is smaller than Year 11\'s (9 minutes)."</li>' +
          '</ul>' +
          '<p><b>Skew</b> is about shape. If the median is closer to the LQ and the right whisker is long, the data has <b>positive skew</b> (a tail of high values). Median closer to the UQ, long left whisker: <b>negative skew</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Smaller spread means more consistent. Bigger spread means more varied. Compare median with median, and IQR with IQR.</div>' },

  { type: "mc", topic: "Comparing data",
    q: "Using the reading box plots above (Year 9: median 11, IQR 5. Year 11: median 8, IQR 9), which is the best comparison?",
    fig: BOX([{ name: "Year 9", v: [4, 8, 11, 13, 18], col: BRIGHT }, { name: "Year 11", v: [2, 5, 8, 14, 20], col: YELLOW }], 0, 20, 1, "Time spent reading each day (minutes)", "Two box plots: Year 9 median 11, IQR 5; Year 11 median 8, IQR 9"),
    options: [
      "Year 11 read for longer, because their longest time (20 minutes) is higher.",
      "Year 9 read for longer on average, as their median is higher.",
      "On average Year 9 read for longer, as their median is higher (11 vs 8). Year 9's times are also more consistent, as their IQR is smaller (5 vs 9).",
      "Year 11's times are more consistent, because their IQR is bigger."
    ],
    answer: 2,
    hint: "The best answer compares an average and a spread, and gets the meaning of spread the right way round.",
    why: "\"On average Year 9 read for longer ... also more consistent\" compares an average and a spread, with numbers and context. The one about the longest time (20 minutes) uses the maximum, which is just one person. \"Year 9 read for longer on average\" is true but only half a comparison. \"Year 11's times are more consistent\" has spread backwards: a bigger IQR means <b>less</b> consistent." },

  { type: "mc", topic: "Comparing data", stretch: true,
    q: "What is the skew of the data in this box plot?",
    fig: BOX([{ v: [10, 12, 14, 22, 35] }], 10, 36, 2, "", "Box plot: minimum 10, lower quartile 12, median 14, upper quartile 22, maximum 35"),
    options: ["Positive skew", "Negative skew", "Symmetrical, no skew", "You cannot tell skew from a box plot"],
    answer: 0,
    hint: "Is the median nearer the LQ or the UQ? Which whisker is longer?",
    why: "Median to LQ is 2, median to UQ is 8, so the median is much nearer the LQ. The right whisker is also long. The data is bunched at the low end with a tail of high values: <b>positive skew</b>. It is easy to mix up the names; remember the skew is named after the direction of the long tail." },

  /* ---------- YOUR TURN ---------- */
  { type: "write", topic: "Your comparison", stretch: true,
    q: '<p><b>A survey recorded how many hours students slept on a school night.</b></p>' +
       '<p>Compare the sleep of Year 7 and Year 11. Aim for two sentences, one about an average and one about spread. Not marked here; it goes to Jay if you choose to send it.</p>',
    fig: BOX([{ name: "Year 7", v: [7, 8.5, 9, 9.5, 11], col: BRIGHT }, { name: "Year 11", v: [5, 6.5, 7.5, 8.5, 10], col: ORANGE }], 4, 12, 1, "Hours of sleep", "Two box plots: Year 7 min 7, LQ 8.5, median 9, UQ 9.5, max 11; Year 11 min 5, LQ 6.5, median 7.5, UQ 8.5, max 10"),
    starters: [
      "On average, Year 7",
      "because their median",
      "is higher than",
      "Year 7's sleep times are more consistent",
      "because their IQR",
      "is smaller than",
      "This suggests"
    ],
    checklist: [
      "I compared an average (the medians), with both numbers",
      "I compared a spread (the IQRs), with both numbers",
      "I said what it means in context: sleep, hours, Year 7 and Year 11",
      "I got consistency the right way round: smaller IQR means more consistent",

    ],
    minWords: 40 }
  ]
});
