<style>
/* Rebuttal rally widget */
.rally{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin:6px 0}
.rally .score{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;margin-bottom:12px}
.rally .score span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.9rem}
.rally .court{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.rally .ball{width:18px;height:18px;border-radius:50%;background:var(--sun);flex:none;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.rally .net{flex:1;height:2px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px);opacity:.5}
.rally .them{background:#fff;color:var(--ink);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:1.02rem;margin-bottom:12px}
.rally .them b{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
.rally .opts{display:grid;gap:8px}
.rally .opts button{font-family:inherit;font-size:.98rem;line-height:1.4;text-align:left;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.rally .opts button:hover{border-color:var(--coral)}
.rally .opts button.ok{border-color:var(--mint);background:#e3f8f1}
.rally .opts button.no{border-color:var(--coral);background:#ffe9e9}
.rally .verdict{margin-top:12px;font-size:.98rem;line-height:1.5;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.rally .verdict b{color:var(--sun)}
.rally .go{margin-top:12px}
.rally .end{text-align:center;padding:8px 0}
.rally .end .big{font-family:var(--display);font-weight:700;font-size:2.4rem;color:var(--sun)}
</style>
</head>
<body class="subj-eng">
<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/egw/"><span class="hqlogo">EGW</span><span class="hqname">GCSE HQ<small>revision and planning</small></span></a>
    <nav class="hqnav"><a href="/egw/">HQ home</a><a href="/">Base 5</a></nav>
  </div>

<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Make your case</h2>
    <span>English Language. Viewpoint writing: arguing your side so a reader is won over.</span>
  </div>
  <div id="egwApp"></div>
</div>

<footer>
  <div class="wrap">
    <span>EGW's GCSE HQ &middot; part of Base 5, Chilton Bridge School</span>
    <a href="/egw/">Back to HQ</a>
  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=4"></script>
<script>
(function(){
"use strict";

var STATEMENT = '<div class="keep"><b>The statement</b>"Homework should be scrapped. Teenagers learn more when their evenings are their own."<br>Write an article for a website read by parents and teachers, giving your views on this statement.</div>';

var ARC =
'<svg viewBox="0 0 520 150" role="img" aria-label="The shape of an argument: hook, three points, the other side, a strong ending">' +
'<path d="M20 120 Q140 10 260 40 T500 30" fill="none" stroke="#ff5d5d" stroke-width="5" stroke-linecap="round"/>' +
'<g font-family="Space Grotesk,Arial" font-weight="700" font-size="14" fill="#141a33" text-anchor="middle">' +
'<circle cx="30" cy="112" r="11" fill="#ffd23f" stroke="#141a33" stroke-width="3"/><text x="30" y="142">Hook</text>' +
'<circle cx="140" cy="58" r="11" fill="#ffffff" stroke="#141a33" stroke-width="3"/><text x="140" y="92">Point 1</text>' +
'<circle cx="250" cy="40" r="11" fill="#ffffff" stroke="#141a33" stroke-width="3"/><text x="250" y="74">Point 2</text>' +
'<circle cx="345" cy="48" r="11" fill="#8a5cf6" stroke="#141a33" stroke-width="3"/><text x="345" y="82">The other side</text>' +
'<circle cx="490" cy="31" r="13" fill="#ff5d5d" stroke="#141a33" stroke-width="3"/><text x="472" y="70">Big finish</text>' +
'</g></svg>';

var FAP =
'<svg viewBox="0 0 520 110" role="img" aria-label="Form, audience, purpose">' +
'<g font-family="Space Grotesk,Arial" font-weight="700" text-anchor="middle">' +
'<rect x="6" y="10" width="160" height="90" rx="16" fill="#ffd23f" stroke="#141a33" stroke-width="3"/>' +
'<rect x="180" y="10" width="160" height="90" rx="16" fill="#ff5d5d" stroke="#141a33" stroke-width="3"/>' +
'<rect x="354" y="10" width="160" height="90" rx="16" fill="#22b8e6" stroke="#141a33" stroke-width="3"/>' +
'<text x="86" y="50" font-size="22" fill="#141a33">FORM</text><text x="86" y="76" font-size="13" fill="#141a33" font-weight="400">article, letter, speech</text>' +
'<text x="260" y="50" font-size="22" fill="#141a33">AUDIENCE</text><text x="260" y="76" font-size="13" fill="#141a33" font-weight="400">who is reading?</text>' +
'<text x="434" y="50" font-size="22" fill="#141a33">PURPOSE</text><text x="434" y="76" font-size="13" fill="#141a33" font-weight="400">argue, persuade</text>' +
'</g></svg>';

/* ---------- Rebuttal rally: a quick game about counter arguments ---------- */
var ROUNDS = [
  { them: "Homework teaches you to work on your own. You will need that at college and at work.",
    opts: [
      "That is just wrong and everyone knows it.",
      "It is true that independence matters. However, a teenager can learn independence through a part time job, a club or a hobby, without three more hours of worksheets.",
      "Homework is boring so it should be scrapped."
    ], right: 1,
    why: "Strong rebuttals <b>agree with part of it first</b>, then turn it around with a reason. Calling the other side wrong just makes the reader stop trusting you." },
  { them: "Without homework, teenagers will just spend every evening on their phones.",
    opts: [
      "Some might, at first. Yet the evenings we gave back could be filled with sport, family dinners and sleep, all of which a tired brain needs more than another worksheet.",
      "Phones are fine actually.",
      "My friend does not use her phone much, so this is not true."
    ], right: 0,
    why: "\"Some might, at first\" admits the worry is real, so the reader keeps listening. Then the rebuttal offers a better picture. One friend is not enough evidence to prove a point about all teenagers." },
  { them: "Parents like homework because it shows them what their child is learning.",
    opts: [
      "Parents do not know anything about school.",
      "Homework helps parents, so we should keep it.",
      "Parents deserve to know what is happening in class. Surely a short weekly update from teachers would show them far more than a crumpled worksheet at ten at night?"
    ], right: 2,
    why: "Notice the audience: this article is read by <b>parents</b>. Insulting them loses the argument. The strong answer respects them, then offers something better, and ends with a rhetorical question." },
  { them: "Students who do homework get better results. That is just a fact.",
    opts: [
      "Research on homework and results is mixed, especially for younger students. Even where there is a link, it may be quality, not quantity, that counts: twenty focused minutes can beat two hours of copying.",
      "Results do not matter.",
      "That is a fact, so I give up on my argument."
    ], right: 0,
    why: "When the other side claims a fact, you can question how strong the evidence is, then narrow the claim. That is the most sophisticated move in the whole game, and examiners love it." }
];

function rally(el, api){
  var d = api.data;
  if(!d.round) d.round = 0;
  if(!d.score) d.score = 0;
  if(!d.firstGo) d.firstGo = 0;
  function draw(){
    if(d.round >= ROUNDS.length){
      el.innerHTML = '<div class="rally"><div class="end"><div class="big">' + d.firstGo + ' / ' + ROUNDS.length + '</div>' +
        '<p>rallies won on the first hit.</p><p class="wnote" style="color:#fff">The move every time: <b style="color:#ffd23f">agree a little, then turn it around</b>. "It is true that... However..."</p>' +
        '<button class="btn btn-quiet" type="button" id="rallyAgain">Play again</button></div></div>';
      el.querySelector("#rallyAgain").onclick = function(){ d.round = 0; d.score = 0; d.firstGo = 0; d.missed = false; api.save(); draw(); };
      api.done(d.firstGo >= 3 ? "right1" : d.firstGo >= 2 ? "right2" : "shown");
      return;
    }
    var r = ROUNDS[d.round];
    el.innerHTML = '<div class="rally">' +
      '<div class="score"><span>Rally ' + (d.round + 1) + ' of ' + ROUNDS.length + '</span><span>First hit: ' + d.firstGo + '</span></div>' +
      '<div class="court"><span>You</span><span class="net"></span><span class="ball" id="ball"></span><span class="net"></span><span>Them</span></div>' +
      '<div class="them"><b>The other side says</b>' + r.them + '</div>' +
      '<p class="wnote" style="color:#c9cdf0">Pick the strongest reply to hit it back.</p>' +
      '<div class="opts"></div><div id="rallyOut"></div></div>';
    var ball = el.querySelector("#ball");
    ball.style.transform = "translateX(40px)";
    var opts = el.querySelector(".opts");
    var missed = false;
    r.opts.forEach(function(t, k){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = t;
      b.onclick = function(){
        if(b.disabled) return;
        if(k === r.right){
          b.classList.add("ok");
          if(!missed) d.firstGo++;
          ball.style.transform = "translateX(-40px)";
          [].forEach.call(opts.children, function(c){ c.disabled = true; });
          el.querySelector("#rallyOut").innerHTML = '<div class="verdict"><b>' + (missed ? "Back over the net." : "Winner.") + '</b> ' + r.why + '</div>' +
            '<button class="btn go" type="button">' + (d.round === ROUNDS.length - 1 ? "See the score" : "Next rally") + '</button>';
          el.querySelector(".go").onclick = function(){ d.round++; api.save(); draw(); };
          api.save();
        }else{
          b.classList.add("no"); b.disabled = true; missed = true;
          el.querySelector("#rallyOut").innerHTML = '<div class="verdict"><b>Into the net.</b> That reply does not deal with what they actually said. Try another.</div>';
        }
      };
      opts.appendChild(b);
    });
  }
  draw();
}

EGW.run({
  id: "english-viewpoint",
  title: "Make your case",
  subject: "English Language",
  mins: 50,
  blurb: "Most English Language exams finish with a piece of writing where you give your view on a statement. On AQA it is worth 40 marks, half of Paper 2. This works through it in small pieces and ends with you planning and starting your own.",
  steps: [

  /* ---------- KNOW THE TASK ---------- */
  { type: "learn", topic: "Know the task",
    title: "Form, audience, purpose",
    fig: FAP,
    html: '<p>Every writing task hides three instructions. Spot them first and half the decisions make themselves.</p>' +
          STATEMENT +
          '<p>Here the form is an <b>article</b>, the audience is <b>parents and teachers</b>, and the purpose is to <b>argue your view</b>.</p>' +
          '<div class="keep"><b>Keep this</b>You can argue either side, or a balanced middle. The marks are for how well you argue, not which side you pick.</div>' },

  { type: "mc", topic: "Know the task",
    q: "\"Write a speech for your year group, persuading them to try a new hobby this year.\" Who is the audience?",
    options: ["Your teachers", "Students in your year group", "The headteacher", "Anyone on the internet"],
    answer: 1,
    hint: "Who will be sitting in front of you listening?",
    why: "Your year group. That changes everything: you can be warmer and more direct, use \"we\" and \"us\", and pick examples a teenager would care about." },

  { type: "sort", topic: "Know the task",
    q: "Your article is for parents and teachers. Sort these phrases: which fit that audience, and which would put them off?",
    buckets: ["Fits the audience", "Would put them off"],
    cards: [
      ["As any parent knows, evenings are precious.", 0],
      ["Homework is literally the worst thing ever, no cap.", 1],
      ["Teachers work incredibly hard, and so do their students.", 0],
      ["Honestly who even cares what teachers think lol", 1],
      ["Imagine a household where dinner is not a battle over worksheets.", 0],
      ["Parents are clueless about this stuff.", 1]
    ],
    hint: "Would a parent nod along, or roll their eyes?",
    why: "For adults, aim for confident and respectful. Slang and insults cost marks in two ways: they do not suit the audience, and they make your argument easy to dismiss." },

  /* ---------- TOOLKIT ---------- */
  { type: "learn", topic: "The persuasion toolkit",
    title: "Your toolkit",
    html: '<ul>' +
          '<li><b>Direct address</b>: talking to the reader as "you".</li>' +
          '<li><b>Rhetorical question</b>: a question that makes the reader think, with no answer expected.</li>' +
          '<li><b>Facts and statistics</b>: numbers make claims sound solid. In the exam you can invent believable ones.</li>' +
          '<li><b>Anecdote</b>: a short true sounding story.</li>' +
          '<li><b>Expert opinion</b>: someone with authority agreeing with you.</li>' +
          '<li><b>Rule of three</b>: three ideas in a row; it sounds complete.</li>' +
          '<li><b>Emotive language</b>: words chosen to stir feelings.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>A few techniques used well beat a checklist crammed in. Examiners reward writing that sounds natural.</div>' },

  { type: "match", topic: "The persuasion toolkit",
    q: "Match each line to the technique it uses.",
    pairs: [
      ["Surely our children deserve a childhood, not a second shift?", "Rhetorical question"],
      ["You know that feeling at nine at night, when the worksheet is still blank.", "Direct address"],
      ["Last winter, my younger brother cried over a fractions sheet until midnight.", "Anecdote"],
      ["A survey of 2,000 families found that 7 in 10 argue about homework every week.", "Statistic"],
      ["Rest, play and family time: these are what growing minds need.", "Rule of three"],
      ["Dr Shah, a sleep researcher, warns that tired teenagers learn less.", "Expert opinion"]
    ],
    hint: "Look for a question mark, the word you, a little story, a number, three things, and a named expert.",
    why: "Several of these could carry a second label too. \"Cried over a fractions sheet\" is also emotive language. Spotting overlaps like that shows you understand the techniques rather than just naming them." },

  { type: "multi", topic: "The persuasion toolkit",
    q: "Which <b>two</b> sentences use emotive language most powerfully?",
    options: [
      "Homework is set on most weekdays.",
      "Exhausted children are being crushed under a mountain of pointless worksheets.",
      "Some students do homework in the library.",
      "Families are losing precious evenings they will never get back.",
      "Homework can be in maths or English."
    ],
    answers: [1, 3],
    hint: "Find the words that make you feel something: tired, sad, worried.",
    why: "\"Exhausted\", \"crushed\", \"precious\" and \"never get back\" are all loaded words. The other sentences are neutral facts: useful sometimes, but they do not move the reader." },

  /* ---------- THE OTHER SIDE ---------- */
  { type: "learn", topic: "The other side",
    title: "Agree a little, then turn it around",
    html: '<p>The best arguments do not pretend the other side does not exist. They <b>mention it</b>, then <b>knock it down</b>. This is called a counter argument and rebuttal.</p>' +
          '<p><i>Some people argue that homework builds discipline. <b>However</b>, discipline can be built in a hundred better ways: a sport, an instrument, a job.</i></p>' +
          '<div class="keep"><b>Keep this</b>Useful openers: "Some people argue that...", "It is true that...", "Of course,..." then "However,", "Yet", "But surely...".</div>' },

  { type: "widget", topic: "The other side",
    title: "Rebuttal rally",
    html: "The other side serves four arguments. Hit each one back with the strongest reply. Win three on the first hit for full sparks.",
    mount: rally,
    report: function(d){ return d.round >= ROUNDS.length ? "Rebuttal rally: " + d.firstGo + " of 4 won on the first hit" : "Rebuttal rally: reached rally " + ((d.round || 0) + 1); } },

  { type: "mc", topic: "The other side", stretch: true,
    q: "Which is usually the strongest place for your counter argument?",
    options: [
      "As your very first sentence",
      "Near the end, just before your conclusion, so you knock it down and finish strong",
      "Spread across every paragraph",
      "Leave it out, it helps the other side"
    ],
    answer: 1,
    hint: "If the last thing the reader hears is the other side, who wins?",
    why: "Placing it late means your rebuttal is fresh in the reader's mind when you hit your conclusion. Starting with it hands the other side your opening, and leaving it out makes your argument look like it has not thought things through. Confident writers sometimes weave small rebuttals through every paragraph too; that works, it is just harder to pull off." },

  /* ---------- OPENINGS AND ENDINGS ---------- */
  { type: "learn", topic: "Openings and endings",
    title: "Hook them, then finish strong",
    fig: ARC,
    html: '<p><b>Openings</b> that work: a bold statement, a short scene, a surprising fact, a question. Openings that do not: "In this article I am going to talk about homework."</p>' +
          '<p><b>Endings</b> that work: come back to your opening image, or give a call to action, telling the reader what to do next.</p>' },

  { type: "mc", topic: "Openings and endings",
    q: "Which opening line would hook a reader best?",
    options: [
      "In this article I will be writing about whether homework should be scrapped.",
      "Homework is a thing that lots of people have opinions about.",
      "It is ten o'clock on a school night, and in kitchens across the country, the same argument is starting again.",
      "Firstly, homework."
    ],
    answer: 2,
    hint: "Which one makes you want to read the next sentence?",
    why: "It drops the reader straight into a scene they recognise. The first two announce the topic, which wastes your strongest position: the first line." },

  { type: "order", topic: "Openings and endings",
    q: "Put this plan into a strong order.",
    items: [
      "Hook: the ten o'clock kitchen argument",
      "Point 1: tired teenagers learn less (sleep, expert opinion)",
      "Point 2: evenings build other skills (sport, jobs, family)",
      "The other side: \"homework builds discipline\" and why that does not hold up",
      "Ending: back to the kitchen, now calm, plus a call to action for schools"
    ],
    hint: "Hook first, the other side near the end, and an ending that echoes the start.",
    why: "This is the arc from the learn card. Going back to the kitchen at the end is called a cyclical structure; it makes the piece feel crafted, which is exactly what the top band describes." },

  /* ---------- ACCURACY ---------- */
  { type: "learn", topic: "Sentences and punctuation",
    title: "Accuracy is 16 of the 40 marks",
    html: '<p>Technical accuracy (spelling, punctuation, sentences) is 16 of the 40 marks on AQA, nearly half. Two quick wins:</p>' +
          '<ul><li><b>Vary sentence starts and lengths.</b> A short sentence after a long one hits hard.</li>' +
          '<li><b>Use a semicolon or colon correctly, once or twice.</b> A semicolon joins two full sentences that are closely linked. A colon introduces an explanation or a list.</li></ul>' +
          '<div class="keep"><b>Keep this</b>Semicolon test: could both halves stand alone as sentences? If yes, a semicolon can join them.</div>' },

  { type: "mc", topic: "Sentences and punctuation",
    q: "Which sentence uses a semicolon correctly?",
    options: [
      "Homework takes time; and energy.",
      "Students are tired; they need their evenings back.",
      "I have three reasons; sleep, family and fun.",
      "Because homework is hard; students give up."
    ],
    answer: 1,
    hint: "Use the test: can both halves stand alone?",
    why: "\"Students are tired\" and \"they need their evenings back\" are both full sentences, closely linked. Option C needs a colon, because it introduces a list." },

  { type: "multi", topic: "Sentences and punctuation",
    q: "Which <b>two</b> sentences have their apostrophes right?",
    options: [
      "The student's bag was full of worksheets.",
      "Its' time for change.",
      "Teachers' evenings are spent marking.",
      "The schools homework policy is strict."
    ],
    answers: [0, 2],
    hint: "One student owns a bag. Lots of teachers own their evenings. And its never has an apostrophe after the s.",
    why: "student's = belonging to one student. teachers' = belonging to more than one teacher. \"Its'\" is never correct (it's means it is), and \"schools\" in D needs an apostrophe: school's policy." },

  { type: "mc", topic: "Sentences and punctuation", stretch: true,
    q: "Which version has the most impact?",
    options: [
      "Homework is tiring and it takes ages and students do not like it and parents do not like it either.",
      "Homework is tiring. It takes ages. Students do not like it. Parents do not like it.",
      "Night after night, families sit at the kitchen table, arguing over sums nobody will remember by Friday. Enough.",
      "Homework is tiring, it takes ages, nobody likes it."
    ],
    answer: 2,
    hint: "Look for variety: one long, detailed sentence followed by something very short.",
    why: "A long sentence builds a picture, then a one word sentence lands like a door slamming. Option A runs on with \"and\", B is all the same length, and D is a comma splice: three sentences glued with commas." },

  /* ---------- YOUR TURN ---------- */
  { type: "write", topic: "Your turn",
    q: STATEMENT + '<p><b>Step 1: plan.</b> Pick your side and jot your hook, two or three points, the other side, and your ending. Bullet points are perfect.</p>',
    starters: ["Side:", "Hook:", "Point 1:", "Point 2:", "The other side says:", "Ending:"],
    checklist: [
      "I have picked a side (or a clear middle view)",
      "I have a hook that is not \"In this article I will...\"",
      "I have at least two points with an idea for evidence",
      "I know where my counter argument goes",
      "I know how I will end"
    ],
    minWords: 40 },

  { type: "write", topic: "Your turn",
    q: '<p><b>Step 2: write your opening and one main paragraph.</b> If you are on a roll, keep going to the end. It goes to Jay only if you choose to send it.</p>',
    starters: [
      "Imagine",
      "It is ten o'clock",
      "Surely",
      "Some people argue that",
      "However,",
      "Not only",
      "Consider this:",
      "It is time"
    ],
    checklist: [
      "My first line hooks the reader",
      "I used direct address or a rhetorical question",
      "I backed up a point with a fact, anecdote or expert",
      "I varied my sentence lengths, including one short one",
      "I used a semicolon or colon correctly",
      "Stretch: I dealt with the other side and turned it around"
    ],
    minWords: 150 }
  ]
});
})();
</script>
</body>
</html>
