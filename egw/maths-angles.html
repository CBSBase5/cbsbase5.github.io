<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';
var MINUS = "&minus;";

/* ---------- small SVG helpers ---------- */
function r1(v){ return Math.round(v * 10) / 10; }
function rad(d){ return d * Math.PI / 180; }
function pt(cx, cy, r, deg){ return [cx + r * Math.cos(rad(deg)), cy - r * Math.sin(rad(deg))]; }
function t(x, y, s, size, fill, extra){
  return '<text x="' + r1(x) + '" y="' + r1(y) + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function bold(x, y, s, size, fill, anchor){ return t(x, y, s, size, fill, LAB + ' font-weight="700" text-anchor="' + (anchor || "middle") + '"'); }
function ln(a, b, col, w, extra){
  return '<path d="M' + r1(a[0]) + ' ' + r1(a[1]) + ' L' + r1(b[0]) + ' ' + r1(b[1]) + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" fill="none" ' + (extra || "") + '/>';
}
function arc(cx, cy, r, a1, a2, col, w){
  var p = pt(cx, cy, r, a1), q = pt(cx, cy, r, a2);
  return '<path d="M' + r1(p[0]) + ' ' + r1(p[1]) + ' A' + r + ' ' + r + ' 0 ' + ((a2 - a1) > 180 ? 1 : 0) + ' 0 ' + r1(q[0]) + ' ' + r1(q[1]) + '" fill="none" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '"/>';
}
function wedge(cx, cy, r, a1, a2, fill, op){
  var p = pt(cx, cy, r, a1), q = pt(cx, cy, r, a2);
  return '<path d="M' + r1(cx) + ' ' + r1(cy) + ' L' + r1(p[0]) + ' ' + r1(p[1]) + ' A' + r + ' ' + r + ' 0 ' + ((a2 - a1) > 180 ? 1 : 0) + ' 0 ' + r1(q[0]) + ' ' + r1(q[1]) + ' Z" fill="' + fill + '" opacity="' + (op || 0.85) + '"/>';
}
function alab(cx, cy, r, a1, a2, s, size, col){
  var m = pt(cx, cy, r, (a1 + a2) / 2);
  return bold(m[0], m[1] + (size || 16) * 0.35, s, size || 16, col || INK);
}
function poly(pts, fill, stroke, w, extra){
  return '<path d="M' + pts.map(function(p){ return r1(p[0]) + ' ' + r1(p[1]); }).join(" L") + ' Z" fill="' + fill + '" stroke="' + (stroke || INK) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round" ' + (extra || "") + '/>';
}
function rightMark(v, a, s, col){
  var p1 = pt(v[0], v[1], s, a), p3 = pt(v[0], v[1], s, a + 90);
  var p2 = [p1[0] + p3[0] - v[0], p1[1] + p3[1] - v[1]];
  return '<path d="M' + r1(p1[0]) + ' ' + r1(p1[1]) + ' L' + r1(p2[0]) + ' ' + r1(p2[1]) + ' L' + r1(p3[0]) + ' ' + r1(p3[1]) + '" fill="none" stroke="' + (col || INK) + '" stroke-width="2"/>';
}
function tick(a, b, n){
  var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy);
  var ux = dx / L, uy = dy / L, nx = -uy, ny = ux, s = "";
  for(var k = 0; k < (n || 1); k++){
    var off = (k - ((n || 1) - 1) / 2) * 6;
    var cx = mx + ux * off, cy = my + uy * off;
    s += ln([cx - nx * 7, cy - ny * 7], [cx + nx * 7, cy + ny * 7], INK, 2);
  }
  return s;
}
function chevron(x, y, n){
  var s = "";
  for(var k = 0; k < (n || 1); k++) s += '<path d="M' + (x - 4 + k * 7) + ' ' + (y - 6) + ' l6 6 l-6 6" fill="none" stroke="' + INK + '" stroke-width="2.2"/>';
  return s;
}
function nda(x, y, anchor){ return t(x, y, "Not drawn accurately", 14, INK, BODY + ' font-style="italic" opacity=".7" text-anchor="' + (anchor || "end") + '"'); }
function svg(w, h, label, inner){ return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + label + '">' + inner + '</svg>'; }
function num(n){ return n < 0 ? MINUS + Math.abs(n) : String(n); }

/* square grid with numbers along the bottom and left edges */
function grid(o){
  var X = function(x){ return o.L + (x - o.x0) * o.c; };
  var Y = function(y){ return o.T + (o.y1 - y) * o.c; };
  var s = '<rect x="' + X(o.x0) + '" y="' + Y(o.y1) + '" width="' + (o.x1 - o.x0) * o.c + '" height="' + (o.y1 - o.y0) * o.c + '" fill="' + WHITE + '"/>';
  var x, y;
  for(x = o.x0; x <= o.x1; x++) s += ln([X(x), Y(o.y1)], [X(x), Y(o.y0)], x === 0 ? INK : LINE, x === 0 ? 2 : 1.2);
  for(y = o.y0; y <= o.y1; y++) s += ln([X(o.x0), Y(y)], [X(o.x1), Y(y)], y === 0 ? INK : LINE, y === 0 ? 2 : 1.2);
  var ev = o.every || 1;
  for(x = o.x0; x <= o.x1; x++) if(x % ev === 0) s += t(X(x), Y(o.y0) + 17, num(x), 14, INK, BODY + ' text-anchor="middle"');
  for(y = o.y0; y <= o.y1; y++) if(y % ev === 0) s += t(X(o.x0) - 6, Y(y) + 5, num(y), 14, INK, BODY + ' text-anchor="end"');
  return { s: s, X: X, Y: Y };
}
function gpoly(g, pts, fill, stroke, extra){ return poly(pts.map(function(p){ return [g.X(p[0]), g.Y(p[1])]; }), fill, stroke, 2.5, extra); }
function cv(a, b){ return '<span class="cv"><span>' + num(a) + '</span><span>' + num(b) + '</span></span>'; }

/* ---------- figures ---------- */

/* four basic angle facts */
var FACTS = (function(){
  var s = "";
  s += bold(95, 22, "On a straight line", 15, INK);
  s += ln([12, 100], [178, 100]) + ln([95, 100], pt(95, 100, 72, 62));
  s += arc(95, 100, 30, 0, 62, BLUE, 2.5) + arc(95, 100, 24, 62, 180, CORAL, 2.5);
  s += alab(95, 100, 46, 0, 62, "a", 17, BLUE) + alab(95, 100, 40, 62, 180, "b", 17, CORAL);
  s += bold(95, 135, "a + b = 180&deg;", 16, INK);

  s += bold(285, 22, "Around a point", 15, INK);
  s += ln([285, 85], pt(285, 85, 58, 20)) + ln([285, 85], pt(285, 85, 58, 140)) + ln([285, 85], pt(285, 85, 58, 250));
  s += arc(285, 85, 22, 20, 140, BLUE, 2.5) + arc(285, 85, 26, 140, 250, CORAL, 2.5) + arc(285, 85, 18, 250, 380, MINT, 2.5);
  s += alab(285, 85, 38, 20, 140, "a", 16, BLUE) + alab(285, 85, 42, 140, 250, "b", 16, CORAL) + alab(285, 85, 34, 250, 380, "c", 16, "#0f8a6c");
  s += bold(285, 165, "a + b + c = 360&deg;", 16, INK);

  s += bold(95, 196, "Vertically opposite", 15, INK);
  s += ln(pt(95, 250, 62, 25), pt(95, 250, 62, 205)) + ln(pt(95, 250, 62, 155), pt(95, 250, 62, 335));
  s += arc(95, 250, 24, 155, 205, BLUE, 2.5) + arc(95, 250, 24, -25, 25, BLUE, 2.5);
  s += alab(95, 250, 40, 155, 205, "a", 16, BLUE) + alab(95, 250, 40, -25, 25, "b", 16, BLUE);
  s += bold(95, 300, "a = b", 16, INK);

  s += bold(285, 196, "In a triangle", 15, INK);
  s += poly([[215, 272], [365, 272], [300, 212]], "rgba(58,92,255,.08)", INK, 2.5);
  s += bold(234, 266, "a", 16, BLUE) + bold(346, 266, "b", 16, CORAL) + bold(300, 234, "c", 16, "#0f8a6c");
  s += bold(285, 300, "a + b + c = 180&deg;", 16, INK);
  return svg(380, 310, "Four angle facts. Angles on a straight line add to 180 degrees. Angles around a point add to 360 degrees. Vertically opposite angles are equal. Angles in a triangle add to 180 degrees.", s);
})();

/* Q: straight line and around a point */
var LINEPOINT = (function(){
  var s = "";
  var c = [100, 130];
  s += '<circle cx="18" cy="22" r="13" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/>' + bold(18, 28, "1", 15);
  s += ln([10, 130], [190, 130]) + ln(c, pt(c[0], c[1], 88, 38)) + ln(c, pt(c[0], c[1], 88, 105));
  s += arc(c[0], c[1], 40, 0, 38, INK, 2) + arc(c[0], c[1], 28, 38, 105, CORAL, 2.5) + arc(c[0], c[1], 30, 105, 180, INK, 2);
  s += alab(c[0], c[1], 60, 0, 38, "38&deg;", 15) + alab(c[0], c[1], 46, 38, 105, "x", 18, CORAL) + alab(c[0], c[1], 52, 105, 180, "75&deg;", 15);
  var p = [288, 100];
  s += '<circle cx="212" cy="22" r="13" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/>' + bold(212, 28, "2", 15);
  [0, 120, 215, 270].forEach(function(a){ s += ln(p, pt(p[0], p[1], 72, a)); });
  s += rightMark(p, 270, 14);
  s += arc(p[0], p[1], 24, 0, 120, INK, 2) + arc(p[0], p[1], 22, 120, 215, INK, 2) + arc(p[0], p[1], 26, 215, 270, CORAL, 2.5);
  s += alab(p[0], p[1], 44, 0, 120, "120&deg;", 15) + alab(p[0], p[1], 44, 120, 215, "95&deg;", 15) + alab(p[0], p[1], 44, 215, 270, "y", 18, CORAL);
  s += nda(372, 196);
  return svg(380, 202, "Diagram 1: a straight line with angles 38 degrees, x and 75 degrees. Diagram 2: angles around a point of 120 degrees, 95 degrees, y and a right angle.", s);
})();

/* Q: crossing lines */
var CROSS = (function(){
  var c = [190, 95], s = "";
  s += ln(pt(c[0], c[1], 150, 20), pt(c[0], c[1], 150, 200)) + ln(pt(c[0], c[1], 110, 128), pt(c[0], c[1], 110, 308));
  s += arc(c[0], c[1], 28, 128, 200, INK, 2) + arc(c[0], c[1], 24, 20, 128, CORAL, 2.5);
  s += alab(c[0], c[1], 50, 128, 200, "72&deg;", 15) + alab(c[0], c[1], 42, 20, 128, "b", 18, CORAL);
  s += nda(372, 186);
  return svg(380, 192, "Two straight lines cross. One angle is 72 degrees. Angle b is next to it on the same straight line.", s);
})();

/* Q: isosceles triangle */
var ISO = (function(){
  var A = [190, 22], B = [105, 170], C = [275, 170], s = "";
  s += poly([A, B, C], "rgba(58,92,255,.08)", INK, 2.5);
  s += tick(A, B, 1) + tick(A, C, 1);
  s += bold(136, 162, "52&deg;", 15) + bold(246, 162, "x", 18, CORAL) + bold(190, 62, "y", 18, CORAL);
  s += nda(372, 196);
  return svg(380, 202, "An isosceles triangle. The two sloping sides are marked equal. One base angle is 52 degrees, the other base angle is x, the top angle is y.", s);
})();

/* parallel lines: three angle pairs */
function transversal(x0, thetaDeg, yA, yB){
  /* line through (x0, yB) at angle theta to the horizontal */
  var k = 1 / Math.tan(rad(thetaDeg));
  return {
    at: function(y){ return [x0 + (yB - y) * k, y]; },
    k: k
  };
}
var PARA = (function(){
  var s = "";
  var names = ["Alternate", "Corresponding", "Co interior"];
  var caps = ["equal", "equal", "add to 180&deg;"];
  var cols = [BLUE, CORAL, MINT];
  for(var p = 0; p < 3; p++){
    var x0 = p * 127;
    var yA = 52, yB = 122, th = 64;
    s += ln([x0 + 8, yA], [x0 + 120, yA]) + ln([x0 + 8, yB], [x0 + 120, yB]);
    s += chevron(x0 + 22, yA) + chevron(x0 + 22, yB);
    var tr = transversal(x0 + 48, th, yA, yB);
    s += ln(tr.at(172), tr.at(6));
    var U = tr.at(yA), D = tr.at(yB);
    var pairs = [ [[U, 180 + th, 360], [D, 0, th]].slice(0),
                  [[U, 0, th], [D, 0, th]],
                  [[U, 180 + th, 360], [D, 0, th]] ];
    if(p === 0) pairs[0] = [[U, 180, 180 + th], [D, 0, th]];
    pairs[p].forEach(function(w){ s += wedge(w[0][0], w[0][1], 22, w[1], w[2], cols[p], 0.9); });
    s += bold(x0 + 63, 196, names[p], 15, INK);
    s += t(x0 + 63, 216, caps[p], 15, INK, BODY + ' text-anchor="middle"');
  }
  return svg(380, 224, "Three diagrams of parallel lines cut by a transversal. Alternate angles, in a Z shape, are equal. Corresponding angles, in an F shape, are equal. Co interior angles, in a C shape, add up to 180 degrees.", s);
})();

/* Q: alternate angle */
var PARAQ = (function(){
  var s = "", yA = 60, yB = 140, th = 64;
  s += ln([20, yA], [360, yA]) + ln([20, yB], [360, yB]);
  s += chevron(50, yA) + chevron(50, yB);
  var tr = transversal(170, th, yA, yB);
  s += ln(tr.at(195), tr.at(8));
  var U = tr.at(yA), D = tr.at(yB);
  s += arc(U[0], U[1], 26, 180, 180 + th, INK, 2) + alab(U[0], U[1], 46, 180, 180 + th, "64&deg;", 15);
  s += arc(D[0], D[1], 26, 0, th, CORAL, 2.5) + alab(D[0], D[1], 44, 0, th, "x", 18, CORAL);
  s += nda(372, 214);
  return svg(380, 220, "Two parallel lines cut by a transversal. Between the parallel lines, a 64 degree angle sits on the left of the transversal at the top line, and angle x sits on the right of the transversal at the bottom line.", s);
})();

/* Q: co interior with algebra */
var PARAALG = (function(){
  var s = "", yA = 60, yB = 140, th = 95;
  s += ln([20, yA], [360, yA]) + ln([20, yB], [360, yB]);
  s += chevron(50, yA, 2) + chevron(50, yB, 2);
  var tr = transversal(190, th, yA, yB);
  s += ln(tr.at(195), tr.at(8));
  var U = tr.at(yA), D = tr.at(yB);
  s += arc(U[0], U[1], 22, 180 + th, 360, INK, 2) + t(U[0] + 14, U[1] + 34, "(2x + 15)&deg;", 16, BLUE, LAB + ' font-weight="700"');
  s += arc(D[0], D[1], 22, 0, th, INK, 2) + t(D[0] + 16, D[1] - 14, "(3x " + MINUS + " 10)&deg;", 16, CORAL, LAB + ' font-weight="700"');
  s += nda(372, 214);
  return svg(380, 220, "Two parallel lines cut by a transversal. Between the parallel lines on the right of the transversal are the angles 2x plus 15 degrees and 3x minus 10 degrees.", s);
})();

/* triangle types */
var TRIS = (function(){
  var s = "";
  var e = [[12, 92], [92, 92], [52, 23]];
  s += poly(e, "rgba(58,92,255,.1)", INK, 2.5) + tick(e[0], e[1]) + tick(e[1], e[2]) + tick(e[2], e[0]);
  var i = [[107, 92], [177, 92], [142, 18]];
  s += poly(i, "rgba(255,93,93,.1)", INK, 2.5) + tick(i[0], i[2]) + tick(i[1], i[2]);
  var sc = [[195, 92], [285, 92], [222, 38]];
  s += poly(sc, "rgba(25,195,154,.12)", INK, 2.5);
  var r = [[300, 92], [370, 92], [300, 30]];
  s += poly(r, "rgba(255,210,63,.3)", INK, 2.5) + rightMark([300, 92], 0, 12);
  s += bold(52, 116, "Equilateral", 14) + bold(142, 116, "Isosceles", 14) + bold(240, 116, "Scalene", 14) + bold(335, 116, "Right angled", 14);
  s += t(52, 134, "3 equal sides", 14, INK, BODY + ' text-anchor="middle"') + t(142, 134, "2 equal sides", 14, INK, BODY + ' text-anchor="middle"');
  s += t(240, 134, "none equal", 14, INK, BODY + ' text-anchor="middle"') + t(335, 134, "one 90&deg;", 14, INK, BODY + ' text-anchor="middle"');
  return svg(380, 142, "Four kinds of triangle: equilateral with three equal sides, isosceles with two equal sides, scalene with no equal sides, and right angled with one 90 degree angle.", s);
})();

/* Q: rectangle and parallelogram */
var RECPAR = (function(){
  var s = "";
  s += poly([[20, 30], [170, 30], [170, 115], [20, 115]], "rgba(58,92,255,.1)", INK, 2.5);
  s += poly([[225, 115], [335, 115], [370, 30], [260, 30]], "rgba(255,93,93,.1)", INK, 2.5);
  s += bold(95, 145, "Rectangle", 15) + bold(297, 145, "Parallelogram", 15);
  return svg(380, 154, "A rectangle that is not a square, and a parallelogram with no right angles.", s);
})();

/* polygons: triangles inside and an exterior angle */
var POLYS = (function(){
  var s = "";
  var c = [95, 98], R = 72, V = [];
  for(var k = 0; k < 5; k++) V.push(pt(c[0], c[1], R, 90 + 72 * k));
  s += poly(V, "rgba(58,92,255,.08)", INK, 2.5);
  s += ln(V[0], V[2], BLUE, 2, 'stroke-dasharray="6 5"') + ln(V[0], V[3], BLUE, 2, 'stroke-dasharray="6 5"');
  s += bold(95, 196, "3 triangles", 15) + t(95, 216, "3 &times; 180&deg; = 540&deg;", 15, INK, BODY + ' text-anchor="middle"');
  var h = [288, 108], r = 62, H = [];
  for(var j = 0; j < 6; j++) H.push(pt(h[0], h[1], r, 60 * j));

/* exam: two regular pentagons and a rhombus */
var PENT = (function(){
  var P = [205, 150], sd = 80, s = "";
  function walk(start, n, ext){
    var v = [[0, 0]], x = 0, y = 0;
    for(var k = 0; k < n - 1; k++){
      var a = rad(start + ext * k);
      x += sd * Math.cos(a); y += sd * Math.sin(a);
      v.push([x, y]);
    }
    return v;
  }
  function scr(v){ return v.map(function(p){ return [P[0] + p[0], P[1] - p[1]]; }); }
  var p1 = scr(walk(0, 5, 72)), p2 = scr(walk(108, 5, 72));
  var R1 = [sd * Math.cos(rad(216)), sd * Math.sin(rad(216))];
  var rh = scr([[0, 0], R1, [R1[0] + sd, R1[1]], [sd, 0]]);
  s += poly(p1, "rgba(58,92,255,.14)", INK, 2.5) + poly(p2, "rgba(58,92,255,.14)", INK, 2.5) + poly(rh, "rgba(255,210,63,.45)", INK, 2.5);
  s += arc(P[0], P[1], 20, 216, 360, CORAL, 2.5) + alab(P[0], P[1], 34, 216, 360, "x", 17, "#d13b3b");
  var Q = rh[3];
  s += arc(Q[0], Q[1], 26, 180, 216, CORAL, 2.5) + alab(Q[0], Q[1], 44, 180, 216, "y", 17, "#d13b3b");
  s += '<circle cx="' + P[0] + '" cy="' + P[1] + '" r="4" fill="' + INK + '"/>';
  s += nda(372, 214);
  return svg(380, 220, "Two regular pentagons and a rhombus meet at one point with no gaps. Angle x is the angle of the rhombus at that point. Angle y is the next angle of the rhombus along the shared side.", s);
})();

/* ---------- the transformation arcade widget ---------- */
var LEVELS = [
  { kind: "T", shape: shift(L_SHAPE, -6, 0), ans: { kind: "T", a: 6, b: -4 },
    intro: "<b>Level 1: slide it.</b> Set the column vector so shape A lands exactly on the dashed target, then tap Fire." },
  { kind: "R", shape: L_SHAPE, ans: { kind: "R", line: "x", k: -1 },
    intro: "<b>Level 2: flip it.</b> Pick a mirror line that drops A exactly onto the target. The line shows up dashed as you choose." },
  { kind: "O", shape: L_SHAPE, ans: { kind: "O", ang: 90, dir: "acw", cx: -1, cy: 0 },
    intro: "<b>Level 3: spin it.</b> Choose the angle, the direction and the centre. You can tap a grid point to move the centre." }
];
var SHAPES = [L_SHAPE.map(function(p){ return [p[0] - 1, p[1] - 1]; }),
              [[0, 0], [3, 0], [3, 1], [1, 1], [1, 2], [0, 2]],
              [[0, 0], [3, 0], [0, 2]],
              [[0, 0], [1, 0], [1, 1], [2, 1], [2, 2], [0, 2]]];
var KINDS = { T: "Translate", R: "Reflect", O: "Rotate" };

function applyT(pts, m){
  return pts.map(function(p){
    var x = p[0], y = p[1];
    if(m.kind === "T") return [x + m.a, y + m.b];
    if(m.kind === "R"){
      if(m.line === "x") return [2 * m.k - x, y];
      if(m.line === "y") return [x, 2 * m.k - y];
      if(m.line === "yx") return [y, x];
      return [-y, -x];
    }
    var dx = x - m.cx, dy = y - m.cy, r;
    if(m.ang === 180) r = [-dx, -dy];
    else if(m.dir === "cw") r = [dy, -dx];
    else r = [-dy, dx];
    return [m.cx + r[0], m.cy + r[1]];
  });
}
function keyOf(pts){ return pts.map(function(p){ return Math.round(p[0]) + "," + Math.round(p[1]); }).sort().join(" "); }
function inGrid(pts){ return pts.every(function(p){ return Math.abs(p[0]) <= 6 && Math.abs(p[1]) <= 6; }); }
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

function lineName(m){
  if(m.line === "x") return "x = " + num(m.k) + (m.k === 0 ? " (the y axis)" : "");
  if(m.line === "y") return "y = " + num(m.k) + (m.k === 0 ? " (the x axis)" : "");
  if(m.line === "yx") return "y = x";
  return "y = " + MINUS + "x";
}
function describe(m){
  if(m.kind === "T") return "Translation by the vector " + cv(m.a, m.b);
  if(m.kind === "R") return "Reflection in the line " + lineName(m);
  return "Rotation " + m.ang + "&deg; " + (m.ang === 180 ? "" : (m.dir === "cw" ? "clockwise " : "anticlockwise ")) + "about (" + num(m.cx) + ", " + num(m.cy) + ")";
}

function mystery(){
  for(var tries = 0; tries < 400; tries++){
    var base = SHAPES[rnd(0, SHAPES.length - 1)];
    var sh = shift(base, rnd(-5, 3), rnd(-5, 3));
    var kind = ["T", "R", "O"][rnd(0, 2)], m;
    if(kind === "T") m = { kind: "T", a: rnd(-7, 7), b: rnd(-7, 7) };
    else if(kind === "R"){
      var ln2 = ["x", "y", "x", "y", "yx", "ymx"][rnd(0, 5)];
      m = { kind: "R", line: ln2, k: rnd(-3, 3) };
    }else{
      var ang = Math.random() < 0.7 ? 90 : 180;
      m = { kind: "O", ang: ang, dir: Math.random() < 0.5 ? "cw" : "acw", cx: rnd(-3, 3), cy: rnd(-3, 3) };
    }
    var img = applyT(sh, m);
    if(!inGrid(sh) || !inGrid(img) || keyOf(img) === keyOf(sh)) continue;
    /* keep the target apart from A so it is readable */
    var overlap = img.filter(function(p){ return sh.some(function(q){ return q[0] === p[0] && q[1] === p[1]; }); }).length;
    if(overlap > 2) continue;
    return { shape: sh, ans: m };
  }
  return { shape: shift(SHAPES[0], -4, 1), ans: { kind: "T", a: 5, b: -3 } };
}

function mountArcade(el, api){
  var d = api.data;
  if(typeof d.lv !== "number") d.lv = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  if(typeof d.score !== "number") d.score = 0;
  if(typeof d.mysN !== "number") d.mysN = 0;
  if(typeof d.mysMiss !== "number") d.mysMiss = 0;
  function freshCtl(kind){ return { kind: kind || "T", a: 0, b: 0, line: "x", k: 0, ang: 90, dir: "cw", cx: 0, cy: 0 }; }
  if(!d.ctl || d.ctlLv !== d.lv){ d.ctl = freshCtl(d.lv < 3 ? LEVELS[d.lv].kind : "T"); d.ctlLv = d.lv; }
  if(d.lv >= 3 && !d.mys) d.mys = mystery();
  var view = d.lv;          /* level on screen; lags d.lv while the win message shows */
  var busy = false, ghost = null, landed = null, anim = null;
  var reduce = false;
  try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  el.innerHTML =
    '<div class="ta">' +
      '<div class="ta-top"><span data-r="lvl"></span><span class="sc" data-r="score"></span></div>' +
      '<p class="ta-msg" data-r="msg"></p>' +
      '<div class="ta-svg" data-r="svg"></div>' +
      '<div class="ta-ctl" data-r="ctl"></div>' +
      '<p class="ta-desc" data-r="desc"></p>' +
      '<div class="ta-go">' +
        '<button class="btn btn-orange" type="button" data-act="fire">Fire</button>' +
        '<button class="btn btn-quiet hidden" type="button" data-act="show">Show me</button>' +
      '</div>' +
    '</div>' +
    '<div class="fb ta-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

  function task(){ return view < 3 ? LEVELS[view] : d.mys; }
  function kindNow(){ return view < 3 ? LEVELS[view].kind : d.ctl.kind; }
  function move(){
    var c = d.ctl, k = kindNow();
    if(k === "T") return { kind: "T", a: c.a, b: c.b };
    if(k === "R") return { kind: "R", line: c.line, k: c.k };
    return { kind: "O", ang: c.ang, dir: c.dir, cx: c.cx, cy: c.cy };
  }

  /* grid geometry: -6..6 each way, 24 units a square */
  var C = 24, OX = 182, OY = 166;
  function X(x){ return OX + C * x; }
  function Y(y){ return OY - C * y; }
  function P(pts){ return pts.map(function(p){ return [X(p[0]), Y(p[1])]; }); }

  function mirrorPath(m){
    var a, b;
    if(m.line === "x"){ a = [m.k, -6.4]; b = [m.k, 6.4]; }
    else if(m.line === "y"){ a = [-6.4, m.k]; b = [6.4, m.k]; }
    else if(m.line === "yx"){ a = [-6.4, -6.4]; b = [6.4, 6.4]; }
    else { a = [-6.4, 6.4]; b = [6.4, -6.4]; }
    return ln([X(a[0]), Y(a[1])], [X(b[0]), Y(b[1])], VIOLET, 3, 'stroke-dasharray="8 6"');
  }

  function drawSvg(cur){
    var tk = task();
    var target = applyT(tk.shape, tk.ans);
    var s = '<rect x="' + X(-6) + '" y="' + Y(6) + '" width="' + 12 * C + '" height="' + 12 * C + '" fill="' + WHITE + '"/>';
    for(var i = -6; i <= 6; i++){
      s += ln([X(i), Y(6)], [X(i), Y(-6)], i === 0 ? INK : LINE, i === 0 ? 2 : 1.1);
      s += ln([X(-6), Y(i)], [X(6), Y(i)], i === 0 ? INK : LINE, i === 0 ? 2 : 1.1);
      if(i % 2 === 0){
        s += t(X(i), Y(-6) + 18, num(i), 14, INK, BODY + ' text-anchor="middle"');
        s += t(X(-6) - 7, Y(i) + 5, num(i), 14, INK, BODY + ' text-anchor="end"');
      }
    }
    s += t(X(6) + 4, Y(0) - 5, "x", 14, INK, LAB + ' font-weight="700"') + t(X(0) + 5, Y(6) + 13, "y", 14, INK, LAB + ' font-weight="700"');
    /* target */
    s += poly(P(target), landed ? "rgba(25,195,154,.35)" : "rgba(255,210,63,.35)", landed ? MINT : "#c79a00", 2.5, 'stroke-dasharray="7 5"');
    /* preview of the line or centre */
    var m = move();
    if(m.kind === "R") s += mirrorPath(m);
    if(ghost) s += poly(P(ghost), "rgba(255,93,93,.25)", CORAL, 2.5, 'stroke-dasharray="4 4"');
    if(landed) s += poly(P(tk.shape), "none", BLUE, 2, 'stroke-dasharray="3 4" opacity=".7"');
    var pts = cur || (landed ? landed : tk.shape);
    s += poly(P(pts), landed ? "rgba(25,195,154,.9)" : "rgba(58,92,255,.85)", INK, 2.5);
    if(!cur && !landed) s += bold(X(pts[0][0] + 0.5), Y(pts[0][1] + 0.5) + 5, "A", 15, WHITE);
    if(m.kind === "O"){
      s += '<circle cx="' + X(m.cx) + '" cy="' + Y(m.cy) + '" r="7" fill="' + VIOLET + '" stroke="' + WHITE + '" stroke-width="2"/>';
    }
    q("svg").innerHTML = '<svg viewBox="0 0 340 342" role="img" aria-label="Grid from minus 6 to 6. Shape A is solid blue and the target is a dashed outline.">' + s + '</svg>';
  }

  function stepper(lab, field, lo, hi){
    return '<div class="ta-step"><span class="lab">' + lab + '</span>' +
      '<button type="button" data-act="dec" data-f="' + field + '" data-lo="' + lo + '" aria-label="Decrease">' + MINUS + '</button>' +
      '<span class="val">' + num(d.ctl[field]) + '</span>' +
      '<button type="button" data-act="inc" data-f="' + field + '" data-hi="' + hi + '" aria-label="Increase">+</button></div>';
  }
  function pick(field, opts){
    return '<div class="ta-pick">' + opts.map(function(o){
      return '<button type="button" data-act="pick" data-f="' + field + '" data-v="' + o[0] + '" class="' + (String(d.ctl[field]) === String(o[0]) ? "on" : "") + '">' + o[1] + '</button>';
    }).join("") + '</div>';
  }

  function drawCtl(){
    var k = kindNow(), h = "";
    if(view >= 3){
      h += '<p class="k">Which transformation?</p>' + pick("kind", [["T", "Translate"], ["R", "Reflect"], ["O", "Rotate"]]);
    }
    if(k === "T"){
      h += '<p class="k">Column vector</p>' +
        stepper("Top: across (right +, left " + MINUS + ")", "a", -10, 10) +
        stepper("Bottom: up + or down " + MINUS, "b", -10, 10);
    }else if(k === "R"){
      h += '<p class="k">Mirror line</p>' + pick("line", [["x", "x = ..."], ["y", "y = ..."], ["yx", "y = x"], ["ymx", "y = " + MINUS + "x"]]);
      if(d.ctl.line === "x" || d.ctl.line === "y") h += stepper("The number: " + d.ctl.line + " = ?", "k", -5, 5);
    }else{
      h += '<p class="k">Angle and direction</p>' + pick("ang", [[90, "90&deg;"], [180, "180&deg;"]]);
      if(d.ctl.ang === 90) h += pick("dir", [["cw", "clockwise"], ["acw", "anticlockwise"]]);
      h += '<p class="k" style="margin-top:8px">Centre of rotation</p>' + stepper("Centre x", "cx", -6, 6) + stepper("Centre y", "cy", -6, 6) +
        '<p class="ta-tip">Or tap a grid point.</p>';
    }
    q("ctl").innerHTML = h;
  }

  function stars(){
    var s = "";
    for(var k = 0; k < 3; k++) s += k < Math.min(d.lv, 3) ? "&#9733;" : "&#9734;";
    return s;
  }
  function drawTop(){
    q("lvl").innerHTML = view < 3 ? "Level " + (view + 1) + " of 3 &middot; " + KINDS[LEVELS[view].kind] + " " + stars() : "Mystery mode &middot; " + d.mysN + " landed";
    q("score").innerHTML = "Score " + d.score;
    q("msg").innerHTML = view < 3 ? LEVELS[view].intro :
      "<b>Mystery mode.</b> Bonus round, no pressure: a new target every time. Work out which transformation it is, set it up, fire. +50 a landing.";
  }
  function drawButtons(){
    var waiting = busy || !!landed;
    el.querySelector('[data-act="fire"]').disabled = waiting;
    var canShow = !waiting && ((view < 3 && view === d.lv && d.miss[view] > 0) || (view >= 3 && d.lastMiss));
    el.querySelector('[data-act="show"]').classList.toggle("hidden", !canShow);
  }
  function render(){
    drawTop(); drawCtl(); drawSvg();
    q("desc").innerHTML = "You are setting up: " + describe(move());
    drawButtons();
  }

  function fb(cls, html){
    var f = q("fb");
    if(!cls){ f.className = "fb ta-fb hidden"; f.innerHTML = ""; return; }
    f.className = "fb ta-fb " + cls; f.innerHTML = html;
  }

  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }

  /* animation from the start shape to where this move sends it */
  function frame(pts, m, f){
    if(m.kind === "T") return pts.map(function(p){ return [p[0] + m.a * f, p[1] + m.b * f]; });
    if(m.kind === "R"){
      var img = applyT(pts, m);
      return pts.map(function(p, k){ return [p[0] + (img[k][0] - p[0]) * f, p[1] + (img[k][1] - p[1]) * f]; });
    }
    var a = rad(m.ang === 180 ? 180 : (m.dir === "cw" ? -90 : 90)) * f;
    return pts.map(function(p){
      var dx = p[0] - m.cx, dy = p[1] - m.cy;
      return [m.cx + dx * Math.cos(a) - dy * Math.sin(a), m.cy + dx * Math.sin(a) + dy * Math.cos(a)];
    });
  }
  function play(m, done){
    var pts = task().shape;
    if(reduce){ done(); return; }
    busy = true; drawButtons();
    var t0 = null;
    function f(ts){
      if(t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / 650), e = 1 - Math.pow(1 - k, 3);
      drawSvg(frame(pts, m, e));
      if(k < 1) anim = requestAnimationFrame(f);
      else { busy = false; done(); }
    }
    anim = requestAnimationFrame(f);
  }

  var CHEER = ["Bullseye!", "Perfect landing!", "Spot on, right on the outline.", "Clean hit!"];
  function win(how){
    var tk = task(), m = move();
    landed = applyT(tk.shape, m);
    ghost = null;
    var pts, head;
    if(view < 3){
      pts = how === "shown" ? 20 : d.miss[view] ? 60 : 100;
      d.score += pts;
      d.lv = view + 1;
      if(d.lv >= 3) d.result = result();
    }else{
      pts = how === "shown" ? 0 : 50;
      d.score += pts;
      if(pts) d.mysN++;
      d.lastMiss = false;
    }
    if((d.best || 0) < d.score) d.best = d.score;
    api.save();
    head = how === "shown" ? "<b>Here is how this one works.</b> " : "<b>" + CHEER[Math.floor(Math.random() * CHEER.length)] + "</b> " + (pts ? "+" + pts + ". " : "");
    var body = "Described fully: <b>" + describe(m) + "</b>.";
    if(tk === LEVELS[2] || (view >= 3 && m.kind === "O")) body += " For a rotation that is three things: angle, direction and centre.";
    if(view === 0) body += " Top number across, bottom number up or down.";
    if(view === 1) body += " Every corner of the target is the same distance from the mirror line as its matching corner on A.";
    var btn;
    if(view < 2) btn = '<button class="btn" type="button" data-act="next">Next level</button>';
    else if(view === 2) btn = '<p style="margin:8px 0 0">All three levels cleared. <b>Mystery mode</b> is unlocked if you fancy a bonus round: you pick the transformation too.</p><button class="btn" type="button" data-act="next">Play mystery mode</button>';
    else btn = '<button class="btn" type="button" data-act="next">Next mystery target</button>';
    fb(how === "shown" ? "show" : "good", head + body + "<br>" + btn);
    render();
    if(view === 2) api.done(d.result);
  }

  function nudge(m, img){
    var tk = task(), target = applyT(tk.shape, tk.ans);
    var k = m.kind;
    function same(a, b){ return a.every(function(p, i){ return p[0] - a[0][0] === b[i][0] - b[0][0] && p[1] - a[0][1] === b[i][1] - b[0][1]; }); }
    if(view >= 3 && k !== tk.ans.kind && tk.ans.kind === "T" && same(tk.shape, target)) return "The target faces exactly the same way as A. No flip or turn needed: that is a slide.";
    if(k === "T"){
      var dx = target[0][0] - img[0][0], dy = target[0][1] - img[0][1];
      if(tk.ans.kind !== "T") return "A slide keeps the shape facing the same way, but the target faces a different way. Try a different transformation.";
      var parts = [];
      if(dx) parts.push(Math.abs(dx) + " more square" + (Math.abs(dx) === 1 ? "" : "s") + (dx > 0 ? " right" : " left"));
      if(dy) parts.push(Math.abs(dy) + " more square" + (Math.abs(dy) === 1 ? "" : "s") + (dy > 0 ? " up" : " down"));
      return "Close. It needs to go " + parts.join(" and ") + ". Count from one corner of A to the same corner of the target.";
    }
    if(k === "R"){
      if(tk.ans.kind === "R" && tk.ans.line !== m.line && view < 3){
        return "Different kind of line needed. The target sits to the side of A, so the mirror runs straight up and down: that is a line x = a number.";
      }
      return "The mirror line sits exactly halfway between each corner of A and the matching corner of the target. Find one halfway point and read off the line.";
    }
    var sameTurn = same(img, target);
    if(tk.ans.kind !== "O" && !sameTurn) return "That turn does not match the way the target faces. Have another think about which transformation it is.";
    if(sameTurn) return "The turn is right; the centre is not. Picture tracing paper pinned at the centre: turn the paper and see where A ends up.";
    return "The turn is not right yet. Compare the long arm of A with the long arm of the target: which way has it swung?";
  }

  function fire(viaShow){
    if(busy || landed) return;
    var m = move(), tk = task();
    ghost = null;
    play(m, function(){
      var img = applyT(tk.shape, m);
      if(keyOf(img) === keyOf(applyT(tk.shape, tk.ans))){ win(viaShow ? "shown" : "right"); return; }
      ghost = img;
      if(view < 3) d.miss[view]++; else { d.mysMiss++; d.lastMiss = true; }
      api.save();
      fb("nudge", "<b>" + ["Clang. Not quite.", "Ooh, near miss.", "Not on the target yet."][Math.floor(Math.random() * 3)] + "</b> " + nudge(m, img) +
        '<br><span class="tiny">The pink dashed shape shows where that move sent A. Change the settings and fire again, or tap Show me.</span>');
      render();
    });
  }

  function setCtlTo(ans){
    d.ctl.kind = ans.kind;
    if(ans.kind === "T"){ d.ctl.a = ans.a; d.ctl.b = ans.b; }
    else if(ans.kind === "R"){ d.ctl.line = ans.line; d.ctl.k = ans.k || 0; }
    else { d.ctl.ang = ans.ang; d.ctl.dir = ans.dir; d.ctl.cx = ans.cx; d.ctl.cy = ans.cy; }
  }

  el.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b || !el.contains(b)) return;
    var act = b.getAttribute("data-act"), f = b.getAttribute("data-f");
    if(act === "fire"){ fire(false); return; }
    if(act === "show"){
      if(busy || landed) return;
      if(view < 3) d.shown[view] = true;
      setCtlTo(task().ans); api.save(); ghost = null; render();
      fire(true);
      return;
    }
    if(act === "next"){
      if(busy) return;
      landed = null; ghost = null; fb(null);
      view = d.lv;
      if(view >= 3){ d.mys = mystery(); d.ctl = freshCtl("T"); }
      else d.ctl = freshCtl(LEVELS[view].kind);
      d.ctlLv = d.lv;
      api.save(); render();
      return;
    }
    if(busy || landed) return;
    if(act === "inc" || act === "dec"){
      var v = d.ctl[f] + (act === "inc" ? 1 : -1);
      var lo = f === "k" ? -5 : f === "cx" || f === "cy" ? -6 : -10, hi = -lo;
      d.ctl[f] = Math.max(lo, Math.min(hi, v));
    }else if(act === "pick"){
      var val = b.getAttribute("data-v");
      d.ctl[f] = f === "ang" ? parseInt(val, 10) : val;
    }
    ghost = null;
    api.save(); render();
  });

  /* tap the grid to place the centre of rotation */
  q("svg").addEventListener("click", function(e){
    if(busy || landed || kindNow() !== "O") return;
    var sv = q("svg").querySelector("svg");
    if(!sv) return;
    var r = sv.getBoundingClientRect();
    var ux = (e.clientX - r.left) * 340 / r.width, uy = (e.clientY - r.top) * 342 / r.height;
    var gx = Math.round((ux - OX) / C), gy = Math.round((OY - uy) / C);
    if(Math.abs(gx) > 6 || Math.abs(gy) > 6) return;
    d.ctl.cx = gx; d.ctl.cy = gy; ghost = null;
    api.save(); render();
  });

  render();
  if(d.lv >= 3 && d.result){
    if(view === 3 && d.mysN === 0) fb("good", "<b>All three levels cleared.</b> Mystery mode is here whenever you want it.");
    api.done(d.result);
  }
}

    why: "Q: going clockwise from North all the way round to PQ is 360 &minus; 35 = <b>325&deg;</b>.<br>R: South is 180&deg; clockwise from North, and PR is 50&deg; before South, so 180 &minus; 50 = <b>130&deg;</b>.<br>Writing 035&deg; for Q is the classic slip: that would be clockwise, on the other side of North." },

  { type: "num", topic: "Bearings", stretch: true,

  /* ---------- TRANSFORMATIONS ---------- */
  { type: "learn", topic: "Transformations",

  /* ---------- ENLARGEMENT ---------- */
  { type: "learn", topic: "Enlargement",
    title: "Enlargement: scale factor and centre",
    fig: ENL,
    html: "<p>An enlargement multiplies every length by the <b>scale factor</b>. Angles do not change, so the shape stays the same shape.</p>" +
          "<p>The <b>centre of enlargement</b> is where everything is measured from. Each corner of the image is scale factor times as far from the centre as the matching corner of the original.</p>" +
          "<ul><li><b>Finding the scale factor</b>: new length &divide; old length.</li>" +
          "<li><b>Finding the centre</b>: draw lines through matching corners and extend them back. They all meet at the centre.</li></ul>" +
          "<p><b>Stretch: fractional scale factors.</b> A scale factor between 0 and 1 makes the shape <b>smaller</b>. Scale factor &frac12; halves every length, and the image is pulled in towards the centre.</p>" +
          "<div class='keep'><b>Keep this</b>Describe an enlargement with two things: the scale factor and the centre. &ldquo;Made twice as big&rdquo; on its own is not enough.</div>" },

    why: "The bottom side of A is 1 square, of B is 2 squares, so the scale factor is <b>2</b>.<br>Join (4, 3) to (3, 2) and keep going: you reach (2, 1). Do the same with (4, 7) and (3, 4): that line also reaches (2, 1). So the centre is <b>(2, 1)</b>.<br>Check: from (2, 1) to (3, 2) is 1 right, 1 up; doubled is 2 right, 2 up, which lands on (4, 3)." },
