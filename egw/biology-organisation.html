<style>
/* Page only: small tables, practical boxes, the blood route widget */
.tablewrap{overflow-x:auto;margin:0 0 12px}
.tablewrap .datatable{font-size:.92rem}
.tablewrap .datatable td,.tablewrap .datatable th{padding:6px 8px;text-align:left;vertical-align:top}
.prac{border:2px dashed var(--ink);border-radius:14px;padding:10px 14px;margin:0 0 12px;background:var(--paper)}
.prac h4{font-size:.95rem;margin:0 0 6px;letter-spacing:.02em}
.prac ol,.prac ul{margin:0 0 6px;padding-left:22px}
.prac li{margin-bottom:4px}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 12px}
.vars div{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:.92rem;line-height:1.4;background:#fff}
.vars b{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.route svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.route .part{cursor:pointer}
.route .part:focus{outline:none}
.route .part:focus-visible .hl{stroke:var(--blue);stroke-width:5}
.route .part.beat{animation:thump .4s ease}
.route .part.oops{animation:wob .35s ease}
.route .part.hint .hl{stroke:#ffd23f;stroke-width:7;animation:glow .9s ease-in-out infinite}
.route .part .hl{transition:stroke .2s}
.route .part.done .hl{stroke:#19c39a;stroke-width:5}
.route .part.done path.hl{stroke-width:30}
.route .part.hint path.hl{stroke-width:34}
.route.expert .lab{visibility:hidden}
@keyframes thump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
.route .part.beat,.route .part.oops{transform-box:fill-box;transform-origin:center}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.rchip{font-family:var(--display);font-weight:700;font-size:.82rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.rchip.sun{background:var(--sun)}
.rfb{min-height:3.2em;font-size:.98rem;line-height:1.45;margin:8px 0 4px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.rfb.good{border-color:var(--good);background:rgba(31,157,99,.09)}
.rfb.nudge{border-color:#f2b705;background:rgba(255,210,63,.2)}
.rfb.show{border-color:var(--violet);background:rgba(138,92,246,.08)}
.stars{font-size:1.7rem;letter-spacing:4px;color:#f2b705;line-height:1}
.stars .off{color:var(--line)}
</style>
</head>

<script>
(function(){

function rateAt(t){
  if(t <= 40) return 20 * Math.pow(t / 40, Math.log(0.4) / Math.log(0.5));

  return 0;
}
var FIG_TEMP = (function(){
  var X0 = 58, X1 = 362, Y0 = 206, Y1 = 16;
  function gx(t){ return X0 + t * (X1 - X0) / 60; }
  function gy(r){ return Y0 - r * (Y0 - Y1) / 24; }
  var s = '<rect x="' + X0 + '" y="' + Y1 + '" width="' + (X1 - X0) + '" height="' + (Y0 - Y1) + '" fill="' + WHITE + '"/>';
  for(var t = 0; t <= 60; t += 5) s += L(gx(t), Y1, gx(t), Y0, t % 10 ? "#eceaf3" : LINE, 1);
  for(var r = 0; r <= 24; r += 2) s += L(X0, gy(r), X1, gy(r), r % 4 ? "#eceaf3" : LINE, 1);
  for(t = 0; t <= 60; t += 10) s += T(gx(t), Y0 + 20, String(t), { s: 14, body: true, w: 400 });
  for(r = 0; r <= 24; r += 4) s += T(X0 - 8, gy(r) + 5, String(r), { s: 14, body: true, w: 400, a: "end" });
  var d = "";
  for(var k = 0; k <= 600; k++){ var tt = k / 10; d += (k ? " L" : "M") + gx(tt).toFixed(1) + " " + gy(rateAt(tt)).toFixed(1); }

  return svg("0 0 380 256", "Graph of rate of reaction against temperature for an enzyme. The rate rises to a peak then falls steeply to zero.", s);

var FIG_TUBES = (function(){

      (top ? '<rect x="' + (x + 1.5) + '" y="62" width="19" height="10" fill="' + top + '"/>' : "") +
      L(x - 3, 40, x + 25, 40, INK, 2.2);
  }
  groups.forEach(function(g, k){
    var x = 4 + k * 100;

var FIG_ALV = svg("0 0 380 150", "An alveolus wrapped in a capillary. Oxygen diffuses from the air into the blood, and carbon dioxide diffuses from the blood into the air.",
  '<path d="M150 6 V30" stroke="' + INK + '" stroke-width="14" stroke-linecap="round"/>' +

  T(40, 146, "capillary", { s: 14, body: true, w: 400, a: "start" }));

var FIG_CHD = (function(){
  function art(x, inner){

  steps: [

  /* ---------- LEVELS AND DIGESTION ---------- */
  { type: "learn", topic: "Levels and digestion",
    title: "Cells to systems, and the digestive system",
    fig: FIG_LEVELS,
    html: '<p><b>Cells</b> are the building blocks. A <b>tissue</b> is a group of cells with a similar structure and job, like muscle tissue. An <b>organ</b> is a group of tissues working together, like the stomach. An <b>organ system</b> is a group of organs working together, like the digestive system. Organ systems together make an <b>organism</b>.</p>' +
          '<p>The <b>digestive system</b> breaks big, insoluble food molecules into small, soluble ones that can be absorbed into the blood. <b>Enzymes</b> do the breaking down.</p>' +
          '<div class="fig">' + FIG_GUT + '</div>' +
          '<div class="tablewrap"><table class="datatable"><tr><th>Enzyme</th><th>Breaks down</th><th>Into</th></tr>' +
          '<tr><td>Carbohydrase, such as <b>amylase</b></td><td>starch</td><td>sugars</td></tr>' +
          '<tr><td><b>Protease</b></td><td>proteins</td><td>amino acids</td></tr>' +
          '<tr><td><b>Lipase</b></td><td>lipids (fats and oils)</td><td>fatty acids and glycerol</td></tr></table></div>' +
          '<p><b>Bile</b> is made in the liver and stored in the gall bladder. It is <b>not an enzyme</b>. It is alkaline, so it <b>neutralises stomach acid</b>, and it <b>emulsifies fats</b>: breaks them into tiny droplets with a bigger surface area, so lipase works faster.</p>' +
          '<div class="keep"><b>Keep this</b>Amylase: starch to sugars. Protease: proteins to amino acids. Lipase: lipids to fatty acids and glycerol.</div>' },

  { type: "order", topic: "Levels and digestion",
    q: "Put these in order, from smallest to biggest.",
    items: ["Cell", "Tissue", "Organ", "Organ system", "Organism"],
    hint: "Muscle tissue is part of the stomach, and the stomach is part of the digestive system.",
    why: "Cells make tissues, tissues make organs, organs make organ systems, and systems make the whole organism. A common slip is swapping tissue and organ: an organ is made of several tissues, so it comes after." },

  { type: "match", topic: "Levels and digestion",
    q: "Match each one to what it does.",
    pairs: [
      ["Amylase", "Breaks down starch into sugars"],
      ["Protease", "Breaks down proteins into amino acids"],
      ["Lipase", "Breaks down lipids into fatty acids and glycerol"],
      ["Bile", "Neutralises stomach acid and emulsifies fats"]
    ],
    hint: "Three of these are enzymes. The odd one out is made in the liver.",
    why: "Each enzyme has its own job, because each one only fits its own substrate. Bile is the one that is not an enzyme: it does not break any bonds, it just makes conditions better for lipase by neutralising acid and turning fat into tiny droplets." },

  /* ---------- ENZYMES ---------- */
  { type: "learn", topic: "Enzymes",
    title: "How enzymes work",
    fig: FIG_LOCK,
    html: '<p><b>Enzymes</b> are biological catalysts: proteins that speed up reactions without being used up. Each one has an <b>active site</b> with a particular shape.</p>' +
          '<p><b>Lock and key:</b> only the right <b>substrate</b> fits the active site, like a key in a lock. The enzyme breaks it down (or joins molecules together), the products leave, and the enzyme is ready again.</p>' +
          '<div class="fig">' + FIG_TEMP + '</div>' +
          '<ul><li>As temperature goes up, the rate goes up: particles move faster and collide more often.</li>' +
          '<li>The peak is the <b>optimum</b> temperature. Human enzymes work best at around body temperature, 37 &deg;C.</li>' +
          '<li>Above the optimum, the shape of the active site changes. The substrate no longer fits, and the rate drops fast. The enzyme is <b>denatured</b>, and this is permanent.</li>' +
          '<li><b>pH</b> works the same way. Each enzyme has an optimum pH; too far either side and it denatures. Stomach protease works best in acid; most other enzymes prefer around neutral.</li></ul>' +
          '<div class="keep"><b>Keep this</b>Enzymes are not alive, so they are never &quot;killed&quot;. Say the active site changes shape, so the substrate no longer fits: denatured.</div>' },

  { type: "multi", topic: "Enzymes",
    q: "Which <b>two</b> of these can denature an enzyme?",
    options: [
      "Heating it well above its optimum temperature",
      "Putting it in a pH far from its optimum",
      "Cooling it down in a fridge",
      "Adding more substrate",
      "Adding more of the enzyme"
    ],
    answers: [0, 1],
    hint: "Denaturing means the shape of the active site has been changed for good.",
    why: "High temperature and the wrong pH both change the shape of the active site. Cold is the classic trap: it slows an enzyme down because particles move more slowly, but the shape is not changed, so it speeds up again when it warms. More substrate or more enzyme just changes how fast things go." },

  { type: "num", topic: "Enzymes",
    q: "This graph is for one particular enzyme. Use it to answer these.",
    fig: FIG_TEMP,
    boxes: [
      { label: "(a) Optimum temperature", a: 40, tol: 1, post: "&deg;C" },
      { label: "(b) Rate at 20 &deg;C", a: 8, tol: 0.5, post: "units" },
      { label: "(c) How many times faster at the optimum than at 20 &deg;C?", a: 2.5, tol: 0.05, post: "times" }
    ],
    hint: "The optimum is the temperature at the very top of the curve. For (b), go up from 20 to the line, then across. For (c), divide the top rate by the rate at 20.",
    why: "The peak is at 40 &deg;C with a rate of 20. At 20 &deg;C the rate is 8. Then 20 &divide; 8 = 2.5, so it is 2.5 times faster at the optimum. A common mix up is reading the rate (20) as the optimum temperature: the optimum is always a temperature, on the x axis." },

  /* ---------- FOOD TESTS (REQUIRED PRACTICAL) ---------- */
  { type: "learn", topic: "Food tests practical",
    title: "Required practical: food tests",
    fig: FIG_TUBES,
    html: '<div class="prac"><h4>Method</h4><ol>' +
          '<li>Grind the food with a pestle and mortar, then mix it with a little distilled water.</li>' +
          '<li>Filter it, and put some of the liquid into each test tube.</li>' +
          '<li>Add the test reagent and look for a colour change, using the table below.</li></ol></div>' +
          '<div class="tablewrap"><table class="datatable"><tr><th>Testing for</th><th>Add</th><th>Positive result</th></tr>' +
          '<tr><td>Starch</td><td>Iodine solution</td><td>orange brown to <b>blue black</b></td></tr>' +
          '<tr><td>Sugars</td><td>Benedict&#39;s solution, then heat in a water bath (about 75 &deg;C) for a few minutes</td><td>blue to green, yellow or <b>brick red</b> (more sugar, further along)</td></tr>' +
          '<tr><td>Protein</td><td>Biuret reagent</td><td>blue to <b>purple</b></td></tr>' +
          '<tr><td>Lipids</td><td>Sudan III stain</td><td>a <b>red layer</b> on top</td></tr>' +
          '<tr><td>Lipids (other way)</td><td>Shake with ethanol, then pour into water</td><td>a <b>cloudy white</b> emulsion</td></tr></table></div>' +
          '<div class="vars"><div><b>What it shows</b>Which nutrients a food contains. It is a qualitative test: a colour, not a measurement.</div>' +
          '<div><b>Control</b>A tube of distilled water with the reagent, to compare colours against.</div>' +
          '<div><b>Safety</b>Eye protection. Biuret reagent is an irritant. Ethanol is flammable, so keep it away from flames.</div></div>' +
          '<div class="keep"><b>Keep this</b>Iodine: starch, blue black. Benedict&#39;s plus heat: sugar, brick red. Biuret: protein, purple.</div>' },

  { type: "match", topic: "Food tests practical",
    q: "Match each reagent to its positive result.",
    pairs: [
      ["Iodine solution", "Orange brown to blue black"],
      ["Benedict&#39;s solution, heated", "Blue to brick red"],
      ["Biuret reagent", "Blue to purple"],
      ["Sudan III", "A red layer on top"]
    ],
    hint: "Two of these start off blue. Only one is ever heated.",
    why: "Iodine goes blue black with starch. Benedict&#39;s goes from blue towards brick red with sugars, but only after heating. Biuret goes from blue to purple with protein. Sudan III stains lipids red. Mixing up Benedict&#39;s and biuret is very common: Benedict&#39;s for sugars, biuret for protein." },

  { type: "text", topic: "Food tests practical",
    q: "Which food test needs heating in a hot water bath, and what does it test for?",
    need: [["benedict"], ["sugar", "glucose", "reducing"]],
    model: "The Benedict&#39;s test, which tests for sugars (such as glucose). Blue turns to green, yellow or brick red if sugar is there.",
    hint: "It is the one that can go brick red.",
    why: "Benedict&#39;s solution only changes colour when it is heated, so the tube goes into a hot water bath for a few minutes. It tests for sugars. The further the colour goes from blue towards brick red, the more sugar there is." },

  /* ---------- AMYLASE AND PH (REQUIRED PRACTICAL) ---------- */
  { type: "learn", topic: "Amylase practical",
    title: "Required practical: pH and amylase",
    fig: FIG_TILE,
    html: '<p>Amylase breaks down starch. Iodine shows whether starch is still there. So you time how long it takes for the starch to disappear at different pH values.</p>' +
          '<div class="prac"><h4>Method</h4><ol>' +
          '<li>Put a drop of iodine solution into each well of a spotting tile.</li>' +
          '<li>Put amylase solution and a pH buffer in one test tube, and starch solution in another. Warm both in a water bath (for example 35 &deg;C).</li>' +
          '<li>Mix the starch into the amylase and buffer, and start the stopwatch.</li>' +
          '<li>Every 10 seconds, put a drop of the mixture onto a fresh drop of iodine.</li>' +
          '<li>When the iodine stays orange brown, the starch has all been broken down. Record the time.</li>' +
          '<li>Repeat with buffers of other pH values.</li></ol></div>' +
          '<div class="vars"><div><b>Independent</b>pH of the buffer (what you change)</div>' +
          '<div><b>Dependent</b>Time for the starch to be broken down (what you measure)</div>' +
          '<div><b>Control</b>Temperature, volume and concentration of amylase and starch, time between drops</div></div>' +
          '<p><b>What the results show:</b> the shortest time is at the optimum pH, where amylase works fastest. You can turn a time into a rate with <b>rate = 1000 &divide; time</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Iodine stays orange brown = no starch left = timer stops.</div>' },

  { type: "order", topic: "Amylase practical",
    q: "Put the method in order.",
    items: [
      "Put a drop of iodine into each well of a spotting tile",
      "Warm the amylase with a pH buffer, and the starch, in a water bath",
      "Mix the starch with the amylase and start the stopwatch",
      "Every 10 seconds, add a drop of the mixture to fresh iodine",
      "Stop the clock when the iodine stays orange brown",
      "Repeat at a different pH"
    ],
    hint: "The tile is set up before anything is mixed, so you are ready to test straight away.",
    why: "Everything is set up and warmed first, so the reaction starts at the right temperature the moment the stopwatch starts. You then sample regularly until there is no starch left. Repeating at other pH values is what lets you compare." },

  { type: "sort", topic: "Amylase practical",
    q: "Sort these variables for the amylase practical.",
    buckets: ["Independent", "Dependent", "Control"],
    cards: [
      ["The pH of the buffer", 0],
      ["Time until the iodine stays orange brown", 1],
      ["Temperature of the water bath", 2],
      ["Volume of amylase solution", 2],
      ["Concentration of the starch solution", 2],
      ["How often a drop is tested", 2]
    ],
    hint: "Independent is the one you choose to change. Dependent is the one you measure. Everything else is kept the same.",
    why: "You change the pH, you measure the time, and you keep everything else the same so pH is the only thing that could explain any difference. Temperature matters a lot here, because temperature changes enzyme activity too." },

  { type: "num", topic: "Amylase practical", stretch: true,
    q: '<p>Here are some results. Use <b>rate = 1000 &divide; time</b>.</p>' +
       '<table class="datatable"><tr><th>pH</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>' +
       '<tr><th>Time (s)</th><td>over 300</td><td>120</td><td>40</td><td>60</td><td>150</td></tr></table>',
    boxes: [
      { label: "(a) Optimum pH in these results", a: 6, tol: 0.01, post: "" },
      { label: "(b) Rate at pH 6", a: 25, tol: 0.01, post: "" },
      { label: "(c) Rate at pH 8, to 1 decimal place", a: 1000 / 150, tol: 0.06, post: "", show: "6.7" }
    ],
    hint: "The optimum has the shortest time, not the longest. Then divide 1000 by each time.",
    why: "The shortest time is 40 s at pH 6, so that is the optimum. Rate at pH 6 = 1000 &divide; 40 = 25. Rate at pH 8 = 1000 &divide; 150 = 6.7. A big rate means a fast reaction, so the rate is highest where the time is lowest. Picking pH 8 (the longest time) is the common trap." },

  /* ---------- THE HEART ---------- */
  { type: "learn", topic: "The heart",
    title: "The heart and double circulation",
    fig: FIG_HEART,
    html: '<p>The heart is an organ made mostly of muscle. It pumps blood round the body in a <b>double circulation</b>: blood goes through the heart <b>twice</b> on every full lap.</p>' +
          '<ul><li>The <b>right</b> side pumps deoxygenated blood to the <b>lungs</b>, where it picks up oxygen.</li>' +
          '<li>The <b>left</b> side pumps oxygenated blood to the <b>rest of the body</b>.</li>' +
          '<li><b>Atria</b> (top) collect blood coming in. <b>Ventricles</b> (bottom) pump it out. <b>Valves</b> stop it flowing backwards.</li>' +
          '<li>The <b>left ventricle</b> has the thickest muscle wall, because it pumps blood all round the body.</li>' +
          '<li>The heart muscle gets its own oxygen from the <b>coronary arteries</b>.</li>' +
          '<li>The natural resting heart rate is controlled by a group of <b>pacemaker</b> cells in the right atrium. An <b>artificial pacemaker</b> is an electrical device that can correct an irregular heartbeat.</li></ul>' +
          '<div class="keep"><b>Keep this</b>Vena cava, right atrium, right ventricle, pulmonary artery, lungs, pulmonary vein, left atrium, left ventricle, aorta, body.</div>' },

  BLOODROUTE,

  { type: "mc", topic: "The heart", stretch: true,
    q: "Why does the <b>left</b> ventricle have a much thicker muscle wall than the right ventricle?",
    options: [
      "It pumps blood all round the body, so it needs to pump at a higher pressure",
      "It holds a much bigger volume of blood",
      "It pumps deoxygenated blood, which is thicker",
      "It contains the pacemaker cells"
    ],
    answer: 0,
    hint: "Where does each ventricle send its blood, and how far does it have to go?",
    why: "The right ventricle only pumps blood to the lungs, which are close by. The left ventricle pumps blood out through the aorta to the whole body, so it needs more muscle to make a higher pressure. Both ventricles pump the same volume each beat, and the pacemaker is in the right atrium." },

  /* ---------- BLOOD AND LUNGS ---------- */
  { type: "learn", topic: "Blood and lungs",
    title: "Vessels, blood and the lungs",
    fig: FIG_VESSELS,
    html: '<ul><li><b>Arteries</b> carry blood <b>away</b> from the heart at high pressure. Thick, muscular, elastic walls.</li>' +
          '<li><b>Veins</b> carry blood <b>back</b> to the heart at low pressure. Thinner walls, a wide lumen, and <b>valves</b> to stop blood flowing backwards.</li>' +
          '<li><b>Capillaries</b> are tiny, with walls <b>one cell thick</b>, so substances can diffuse quickly between the blood and the cells.</li></ul>' +
          '<p><b>Blood</b> is a tissue made of: <b>plasma</b> (the liquid, carrying dissolved glucose, carbon dioxide, urea, hormones and the cells); <b>red blood cells</b> (carry oxygen using haemoglobin; no nucleus, so more room); <b>white blood cells</b> (defend against pathogens); and <b>platelets</b> (bits of cells that help blood clot).</p>' +
          '<div class="fig">' + FIG_ALV + '</div>' +
          '<p><b>The lungs:</b> air goes down the trachea, into the bronchi, then bronchioles, and ends in millions of tiny air sacs called <b>alveoli</b>. Oxygen diffuses from the alveoli into the blood; carbon dioxide diffuses out. Alveoli have a <b>huge surface area</b>, <b>very thin walls</b> and a <b>good blood supply</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Arteries: Away. Veins: back, with valves. Capillaries: exchange.</div>' },

  { type: "sort", topic: "Blood and lungs",
    q: "Artery, vein or capillary?",
    buckets: ["Artery", "Vein", "Capillary"],
    cards: [
      ["Thick, muscular, elastic walls", 0],
      ["Carries blood away from the heart", 0],
      ["Has valves to stop backflow", 1],
      ["Carries blood back to the heart at low pressure", 1],
      ["Walls only one cell thick", 2],
      ["Where substances are exchanged with body cells", 2]
    ],
    hint: "A for arteries, A for away. Exchange needs the thinnest possible wall.",
    why: "Arteries take the high pressure blood away from the heart, so they need thick, elastic walls. Veins carry low pressure blood back, so they need valves. Capillaries have the thinnest walls, which makes the diffusion distance short. Remember: the pulmonary artery carries deoxygenated blood, so arteries are about direction, not oxygen." },

  { type: "match", topic: "Blood and lungs",
    q: "Match each part to its job.",
    pairs: [
      ["Red blood cells", "Carry oxygen using haemoglobin"],
      ["White blood cells", "Defend the body against pathogens"],
      ["Platelets", "Help the blood to clot"],
      ["Plasma", "Liquid that carries glucose, carbon dioxide and urea"],
      ["Alveoli", "Air sacs where oxygen diffuses into the blood"]
    ],
    hint: "Only one of these is a liquid, and only one is in the lungs rather than the blood.",
    why: "Red cells carry oxygen, white cells fight pathogens, platelets help clotting, and plasma carries everything that is dissolved. Alveoli are where gas exchange happens: their big surface area, thin walls and rich blood supply make diffusion fast." },

  /* ---------- HEART DISEASE AND HEALTH ---------- */
  { type: "learn", topic: "Health and disease",
    title: "Heart disease, health and cancer",
    fig: FIG_CHD,
    html: '<p><b>Coronary heart disease</b>: layers of fatty material build up inside the coronary arteries and narrow them. Less blood flows to the heart muscle, so it gets less oxygen.</p>' +
          '<ul><li><b>Stents</b> are small mesh tubes put inside a narrowed artery to hold it open. Quick to help, but it is an operation, with some risk.</li>' +
          '<li><b>Statins</b> are drugs that lower cholesterol in the blood, which slows the build up of fatty material. They are taken long term and can have side effects.</li>' +
          '<li>Faulty <b>valves</b> can be replaced with biological or mechanical valves. If the heart fails, a <b>transplant</b> is possible, and an artificial heart can help while someone waits.</li></ul>' +
          '<p><b>Health</b> is physical and mental wellbeing. <b>Non communicable</b> diseases are not caught from others, but <b>risk factors</b> make them more likely: smoking (lung disease, lung cancer, heart disease), poor diet and little exercise (cardiovascular disease), obesity (type 2 diabetes), alcohol (liver and brain damage), and <b>carcinogens</b>, including ionising radiation (cancer).</p>' +
          '<p><b>Cancer</b> is caused by changes in cells that make them grow and divide out of control, forming a tumour. <b>Benign</b> tumours stay in one place, usually inside a membrane. <b>Malignant</b> tumours are cancers: they invade nearby tissue and can spread in the blood to form <b>secondary tumours</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Stent: holds the artery open. Statin: lowers cholesterol.</div>' },

  { type: "sort", topic: "Health and disease",
    q: "Stent or statin?",
    buckets: ["Stent", "Statin"],
    cards: [
      ["A small mesh tube put inside a coronary artery", 0],
      ["Holds a narrowed artery open", 0],
      ["Fitted during an operation", 0],
      ["A drug taken every day, long term", 1],
      ["Lowers cholesterol in the blood", 1],
      ["Slows down the build up of fatty material", 1]
    ],
    hint: "One is a tube, one is a tablet.",
    why: "A stent is a physical fix: it props the artery open straight away. A statin is a drug that works slowly, lowering cholesterol so less fatty material builds up. In an exam you might weigh them up: stents work quickly but need an operation; statins avoid surgery but must be taken for a long time and can have side effects." },

  { type: "match", topic: "Health and disease",
    q: "Match each risk factor to a disease it is linked to.",
    pairs: [
      ["Smoking", "Lung disease and lung cancer"],
      ["Obesity", "Type 2 diabetes"],
      ["Drinking a lot of alcohol", "Liver damage"],
      ["Little exercise and a high fat diet", "Cardiovascular disease"]
    ],
    hint: "Think about which organ each one does the most harm to.",
    why: "These are the links on the specification. A risk factor makes a disease more likely; it does not mean someone will definitely get it. Some, like smoking and lung cancer, have a proven cause and effect." },

  { type: "mc", topic: "Health and disease", stretch: true,
    q: "Which describes a <b>malignant</b> tumour?",
    options: [
      "Cells that invade nearby tissue and can spread in the blood to form secondary tumours",
      "A growth of abnormal cells that stays in one place, usually inside a membrane",
      "A tumour caused by a pathogen, which can be caught from someone else",
      "A tumour that is always harmless"
    ],
    answer: 0,
    hint: "Malignant tumours are the ones that are called cancers. What makes them so dangerous?",
    why: "Malignant tumours invade neighbouring tissues and spread through the blood, starting secondary tumours elsewhere. The option about a growth that &quot;stays in one place&quot; describes a benign tumour. Benign does not always mean harmless, though: a benign tumour can still press on an organ and cause problems." },

  /* ---------- PLANTS ---------- */
  { type: "learn", topic: "Plant transport",
    title: "Plant tissues, xylem, phloem and transpiration",
    fig: FIG_LEAF,
    html: '<p>A leaf is a plant organ. Its tissues: <b>epidermis</b> (covers it), <b>palisade mesophyll</b> (packed with chloroplasts for photosynthesis), <b>spongy mesophyll</b> (air spaces for gases to diffuse), <b>xylem</b> and <b>phloem</b> (transport), and <b>meristem</b> at the growing tips of shoots and roots.</p>' +
          '<ul><li><b>Xylem</b>: hollow tubes of dead cells, strengthened with lignin. Carry <b>water and mineral ions</b> from the roots <b>up</b> to the leaves.</li>' +
          '<li><b>Phloem</b>: living cells with pores in the end walls. Carry <b>dissolved sugars</b> from the leaves to the rest of the plant, <b>up or down</b>. This is <b>translocation</b>.</li></ul>' +
          '<p><b>Transpiration</b>: water evaporates from the leaves and diffuses out through the <b>stomata</b>. This pulls more water up the xylem from the roots: the transpiration stream. <b>Guard cells</b> open and close the stomata, controlling gas exchange and water loss. Most stomata are on the underside of the leaf.</p>' +
          '<p>Transpiration is <b>faster</b> when it is <b>warmer</b>, <b>drier</b> (low humidity), <b>windier</b>, and <b>brighter</b> (more stomata open). It can be measured with a <b>potometer</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Xylem: water, up only, dead cells. Phloem: sugar, both ways, living cells.</div>' },

  { type: "sort", topic: "Plant transport",
    q: "Xylem or phloem?",
    buckets: ["Xylem", "Phloem"],
    cards: [
      ["Carries water and mineral ions", 0],
      ["Made of dead cells strengthened with lignin", 0],
      ["Flow only goes upwards, from roots to leaves", 0],
      ["Carries dissolved sugars", 1],
      ["Living cells with pores in the end walls", 1],
      ["Moves substances up and down the plant", 1]
    ],
    hint: "Phloem carries food. Xylem carries water.",
    why: "Xylem is the water pipe: dead, hollow, strengthened with lignin, one way only. Phloem moves sugars made in the leaves to wherever they are needed, for use or storage, so it has to go both ways. That movement is translocation." },

  { type: "num", topic: "Plant transport", stretch: true,
    q: '<p>A student measures transpiration with a potometer. In 4 minutes, the air bubble moves <b>36 mm</b>. Then they switch on a fan, and in the next 4 minutes it moves <b>60 mm</b>.</p>',
    fig: FIG_POT,
    boxes: [
      { label: "(a) Rate without the fan", a: 9, tol: 0.01, post: "mm per minute" },
      { label: "(b) Rate with the fan", a: 15, tol: 0.01, post: "mm per minute" },
      { label: "(c) Percentage increase, to 1 decimal place", a: 600 / 9, tol: 0.06, post: "%", show: "66.7" }
    ],
    hint: "Rate = distance &divide; time. For the percentage increase: (new &minus; old) &divide; old &times; 100.",
    why: "(a) 36 &divide; 4 = 9 mm per minute. (b) 60 &divide; 4 = 15 mm per minute. (c) The increase is 15 &minus; 9 = 6, and 6 &divide; 9 &times; 100 = 66.7%. Dividing by the new value (giving 40%) is the usual slip: percentage change always divides by the original. The fan blows away water vapour near the leaf, which keeps the concentration gradient steep, so water diffuses out of the stomata faster. Strictly, a potometer measures water uptake, which is close to the rate of transpiration." }
  ]
});
})();
</script>
