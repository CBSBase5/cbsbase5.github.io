<!DOCTYPE html>

<style>
/* Page only: method list and the kidney sorting machine widget */
.steps{margin:0 0 10px;padding-left:1.4em}
.steps li{margin-bottom:4px}
.ks-scene svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.ks-card{display:flex;gap:12px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0}
.ks-card svg{flex:0 0 52px;width:52px;height:52px}
.ks-card b{display:block;font-family:var(--display);font-size:1.15rem}
.ks-card span{font-size:.95rem;line-height:1.4}
.ks-stats{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.ks-stats span{background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-size:.88rem}
.ks-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:8px 0}
.ks-btns button{font-family:inherit;font-size:.98rem;line-height:1.3;text-align:left;color:var(--ink);background:var(--white);border:2px solid var(--ink);
  border-radius:12px;padding:10px 12px 10px 38px;cursor:pointer;position:relative;touch-action:manipulation;min-height:48px}
.ks-btns button i{position:absolute;left:11px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2px solid var(--ink)}
.ks-btns button:disabled{opacity:.45;cursor:default}
.ks-btns button.no{animation:nudge .35s;border-color:var(--coral);background:#ffe9e9}
.ks-btns button.ok{border-color:var(--good);background:rgba(31,157,99,.13)}
.ks-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0}
.ks-sum div{background:var(--white);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:.93rem;line-height:1.4}
.ks-sum b{display:block;font-family:var(--display);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}

<script>
(function(){
"use strict";

/* ---------- palette and tiny SVG helpers ---------- */
var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";

function T(x, y, s, o){
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || "middle") + '" font-family="' +
    (o.body ? "Atkinson Hyperlegible,Verdana,sans-serif" : "Space Grotesk,Arial,sans-serif") + '" font-weight="' + (o.w || 700) +
    '" font-size="' + (o.s || 16) + '" fill="' + (o.c || INK) + '">' + s + '</text>';
}
function L(x1, y1, x2, y2, c, w, dash){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (c || INK) +
    '" stroke-width="' + (w || 1.5) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' stroke-linecap="round"/>';
}
function svg(vb, label, inner){
  return '<svg viewBox="' + vb + '" role="img" aria-label="' + label + '">' + inner + '</svg>';
}
function box(x, y, w, h, fill){
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="12" fill="' + (fill || WHITE) + '" stroke="' + INK + '" stroke-width="2.5"/>';
}
function head(x, y, dx, dy, c){
  var a = Math.atan2(dy, dx), s = 9;
  var p1 = [x - s * Math.cos(a) + s * 0.6 * Math.sin(a), y - s * Math.sin(a) - s * 0.6 * Math.cos(a)];
  var p2 = [x - s * Math.cos(a) - s * 0.6 * Math.sin(a), y - s * Math.sin(a) + s * 0.6 * Math.cos(a)];
  return '<path d="M' + x + ' ' + y + ' L' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' Z" fill="' + (c || INK) + '"/>';
}
function arrow(x1, y1, x2, y2, c){ return L(x1, y1, x2, y2, c || INK, 3) + head(x2, y2, x2 - x1, y2 - y1, c); }
function lines(x, y, arr, o){
  var s = "";
  arr.forEach(function(t, k){ s += T(x, y + k * ((o && o.gap) || 20), t, o); });
  return s;
}
function tube(d, fill){
  return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>' +
         '<path d="' + d + '" fill="none" stroke="' + fill + '" stroke-width="25" stroke-linejoin="round" stroke-linecap="round"/>';
}

/* ---------- the kidney machine scene (used by the learn card and the widget) ---------- */
var ROUTES = {
  A: [[40, 50], [350, 50]],
  B: [[40, 50], [115, 50], [115, 150], [235, 150], [235, 50], [350, 50]],
  C: [[40, 50], [115, 50], [115, 150], [330, 150], [330, 214]]
};
var RCOL = { A: CORAL, B: MINT, C: SUN };
function routeD(k){ return "M" + ROUTES[k].map(function(p){ return p[0] + " " + p[1]; }).join(" L"); }
function sceneInner(){
  var s = "";
  s += tube("M235 150 V72", "#e3f8f1");
  s += tube("M115 72 V150 H330 V198", "#e6ecff");
  s += '<rect x="10" y="28" width="360" height="44" rx="22" fill="#ffe3e3" stroke="' + INK + '" stroke-width="2.5"/>';
  /* the filter: a sieve across the bottom of the blood vessel */
  s += '<rect x="96" y="66" width="38" height="12" rx="3" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>';
  s += L(103, 66, 103, 78, INK, 1.5) + L(110, 66, 110, 78, INK, 1.5) + L(117, 66, 117, 78, INK, 1.5) + L(124, 66, 124, 78, INK, 1.5) + L(131, 66, 131, 78, INK, 1.5);
  s += '<rect x="288" y="196" width="84" height="48" rx="12" fill="#fff6d1" stroke="' + INK + '" stroke-width="2.5"/>';
  s += T(330, 226, "Urine", { s: 17 });
  s += T(12, 18, "Blood in", { s: 15, a: "start" }) + T(368, 18, "Blood out", { s: 15, a: "end" });
  s += head(366, 50, 1, 0, CORAL);
  s += T(136, 104, "Filtration", { s: 15, a: "start" });
  s += T(250, 104, "Reabsorption", { s: 15, a: "start" });
  s += T(160, 186, "kidney tubule", { s: 14, body: true, w: 400 });
  return s;
}
var FIG_KIDNEY = svg("0 0 380 250", "A simple kidney model. Blood flows along a blood vessel. Small molecules are filtered out into a kidney tubule. Useful substances are reabsorbed back into the blood. What is left flows on to become urine.", sceneInner());

/* ADH negative feedback loop */
var FIG_ADH = svg("0 0 380 262", "Negative feedback with ADH. Blood too concentrated, so the pituitary releases more ADH, so the kidney tubules reabsorb more water, so the blood water level goes back to normal. Then less ADH is released.",
  box(6, 8, 172, 66, "#fff6d1") + lines(92, 36, ["Blood too", "concentrated"], { s: 17 }) +
  box(202, 8, 172, 66) + lines(288, 36, ["Pituitary releases", "more ADH"], { s: 16 }) +
  box(202, 112, 172, 86) + lines(288, 138, ["Kidney tubules", "reabsorb more", "water"], { s: 16 }) +
  box(6, 112, 172, 86, "#e3f8f1") + lines(92, 146, ["Water level", "back to normal"], { s: 17 }) +
  arrow(178, 41, 198, 41) + arrow(288, 74, 288, 108) + arrow(202, 155, 182, 155) +
  T(190, 228, "Less urine, and more concentrated.", { s: 15, body: true, w: 400 }) +
  T(190, 252, "Back to normal: less ADH is released.", { s: 15, body: true, w: 400 }));

/* dialysis: blood and fluid flow opposite ways past a membrane */
var FIG_DIAL = (function(){
  var s = "";
  s += '<rect x="8" y="24" width="364" height="66" rx="14" fill="#ffe3e3" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<rect x="8" y="112" width="364" height="66" rx="14" fill="#e6ecff" stroke="' + INK + '" stroke-width="2.5"/>';
  s += L(14, 101, 366, 101, VIOLET, 5, "10 7");
  s += T(20, 50, "Blood from the patient", { s: 16, a: "start" }) + arrow(250, 45, 350, 45, CORAL);
  s += T(20, 166, "Dialysis fluid: no urea", { s: 16, a: "start" }) + arrow(350, 160, 260, 160, BLUE);
  [70, 160, 250].forEach(function(x){
    s += '<circle cx="' + x + '" cy="72" r="6" fill="' + SUN + '" stroke="' + INK + '" stroke-width="1.5"/>';
    s += arrow(x + 16, 70, x + 16, 128, INK);
    s += '<circle cx="' + (x + 34) + '" cy="132" r="6" fill="' + SUN + '" stroke="' + INK + '" stroke-width="1.5"/>';
  });
  s += T(8, 202, "Yellow dots: urea diffusing out of the blood.", { s: 14, a: "start", body: true, w: 400 });
  s += T(8, 222, "Dashed line: partially permeable membrane.", { s: 14, a: "start", body: true, w: 400 });
  return svg("0 0 380 230", "Dialysis. Blood flows one way and dialysis fluid flows the other way, separated by a partially permeable membrane. Urea diffuses from the blood into the fluid.", s);
})();

/* speciation in three panels */
var FIG_SPEC = (function(){
  var s = "";
  function dots(cx, cy, col, seed){
    var r = "", pts = [[-22, -10], [0, -18], [20, -8], [-12, 10], [12, 12], [-28, 14], [26, 16]];
    pts.forEach(function(p, k){ r += '<circle cx="' + (cx + p[0] + (seed ? (k % 2 ? 3 : -3) : 0)) + '" cy="' + (cy + p[1]) + '" r="7" fill="' + (typeof col === "function" ? col(k) : col) + '" stroke="' + INK + '" stroke-width="1.5"/>'; });
    return r;
  }
  s += box(4, 26, 112, 112, "#f6f5f0") + box(134, 26, 112, 112, "#f6f5f0") + box(264, 26, 112, 112, "#f6f5f0");
  s += dots(60, 82, BLUE, 0);
  s += '<path d="M168 138 L190 52 L212 138 Z" fill="#c9c4b5" stroke="' + INK + '" stroke-width="2"/>';
  s += '<g transform="translate(158 68) scale(.48)">' + dots(0, 0, BLUE, 0) + '</g>';
  s += '<g transform="translate(222 104) scale(.48)">' + dots(0, 0, function(k){ return k % 3 ? BLUE : CYAN; }, 1) + '</g>';
  s += '<g transform="translate(296 82) scale(.6)">' + dots(0, 0, BLUE, 0) + '</g>';
  s += '<g transform="translate(346 82) scale(.6)">' + dots(0, 0, CORAL, 1) + '</g>';
  s += L(320, 34, 320, 130, INK, 2, "4 5");
  s += arrow(116, 82, 130, 82) + arrow(246, 82, 260, 82);
  s += T(60, 18, "One species", { s: 15 }) + T(190, 18, "Isolated", { s: 15 }) + T(320, 18, "Two species", { s: 15 });
  s += T(60, 160, "mix and breed", { s: 14, body: true, w: 400 }) + T(190, 160, "split by a", { s: 14, body: true, w: 400 }) + T(190, 178, "mountain range", { s: 14, body: true, w: 400 }) +
       T(320, 160, "cannot make", { s: 14, body: true, w: 400 }) + T(320, 178, "fertile offspring", { s: 14, body: true, w: 400 });
  return svg("0 0 380 188", "Speciation in three steps. One species lives together and breeds. A mountain range splits it into two isolated groups. Over a long time the groups change so much that they cannot interbreed to make fertile offspring: two species.", s);
})();

/* milk practical: tube goes from pink to colourless */
var FIG_MILK = (function(){
  var s = "";
  function tb(x, fill, lab1, lab2){
    return '<path d="M' + x + ' 20 V120 Q' + x + ' 140 ' + (x + 20) + ' 140 Q' + (x + 40) + ' 140 ' + (x + 40) + ' 120 V20" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
           '<path d="M' + (x + 2) + ' 50 V120 Q' + (x + 2) + ' 138 ' + (x + 20) + ' 138 Q' + (x + 38) + ' 138 ' + (x + 38) + ' 120 V50 Z" fill="' + fill + '"/>' +
           T(x + 20, 164, lab1, { s: 15 }) + T(x + 20, 182, lab2, { s: 14, body: true, w: 400 });
  }
  s += '<rect x="4" y="60" width="372" height="64" rx="10" fill="#e6ecff" opacity=".7"/>';
  s += tb(56, "#ffb3d1", "Start", "pink, alkaline");
  s += arrow(126, 92, 236, 92) + T(181, 80, "lipase added,", { s: 14, body: true, w: 400 }) + T(181, 114, "timer running", { s: 14, body: true, w: 400 });
  s += tb(264, "#fbf8ee", "End", "colourless");
  s += T(190, 12, "Water bath at the test temperature", { s: 14, body: true, w: 400 });
  return svg("0 0 380 190", "Milk practical. A tube of milk with sodium carbonate and phenolphthalein starts pink. Lipase is added in a water bath and a timer runs until the tube goes colourless, showing the pH has fallen.", s);
})();

var TABLE_K = '<table class="datatable"><tr><th>Substance</th><th>Plasma</th><th>Filtered</th><th>Urine</th></tr>' +
  '<tr><td>Protein</td><td>80</td><td>0</td><td>0</td></tr>' +
  '<tr><td>Glucose</td><td>1.0</td><td>1.0</td><td>?</td></tr>' +
  '<tr><td>Urea</td><td>0.3</td><td>0.3</td><td>20</td></tr>' +
  '<tr><td>Ions</td><td>7.2</td><td>7.2</td><td>15</td></tr></table>' +
  '<p class="tiny">Concentrations in g per dm&sup3;: in blood plasma going into the kidney, in the liquid just after filtration, and in urine. Typical values for a healthy person.</p>';

var TABLE_MILK = '<table class="datatable"><tr><th>Temperature (&deg;C)</th><th>Time (s)</th></tr>' +
  '<tr><td>10</td><td>500</td></tr><tr><td>20</td><td>250</td></tr><tr><td>30</td><td>125</td></tr>' +
  '<tr><td>40</td><td>80</td></tr><tr><td>60</td><td>400</td></tr></table>';

/* ---------- the kidney sorting machine ---------- */
var KINDS = {
  glucose: { name: "Glucose", ctx: "A small sugar molecule. Your cells use it for respiration.", ans: "B", col: MINT, shape: "hex",
    why: "Glucose is small, so it is <b>filtered</b> out of the blood. The body needs it, so <b>all of it is reabsorbed</b>. A healthy person has no glucose in their urine." },
  urea: { name: "Urea", ctx: "A small waste molecule made in the liver.", ans: "C", col: SUN, shape: "dot",
    why: "Urea is small, so it is <b>filtered</b>. It is waste, so it is <b>not reabsorbed</b>: it leaves in the <b>urine</b>." },
  waterKeep: { name: "Water", ctx: "Your body is running a bit low on water today.", ans: "B", col: CYAN, shape: "drop",
    why: "Water is filtered, then <b>as much as the body needs is reabsorbed</b>. Low on water? Keep it." },
  waterExtra: { name: "Water", ctx: "Extra water: you have just finished a big bottle of squash.", ans: "C", col: CYAN, shape: "drop",
    why: "Water is filtered, and <b>water the body does not need</b> is not reabsorbed. It leaves in the urine, which is why you wee more after lots of drinks." },
  ionKeep: { name: "Salt ions", ctx: "Ions your body needs to keep at the right level.", ans: "B", col: VIOLET, shape: "ion",
    why: "Ions are filtered, then <b>some are reabsorbed</b>: the ones the body needs." },
  ionExtra: { name: "Salt ions", ctx: "Extra ions from a very salty bag of crisps.", ans: "C", col: VIOLET, shape: "ion",
    why: "Ions are filtered, and <b>excess ions</b> are not reabsorbed. Out they go in the urine." },
  protein: { name: "Protein", ctx: "A big molecule floating in the blood plasma.", ans: "A", col: CORAL, shape: "blob",
    why: "Proteins are <b>too big to pass through the filter</b>, so they stay in the blood. Protein in urine can be a sign the kidneys are not working properly." },
  rbc: { name: "Red blood cell", ctx: "A whole cell, carrying oxygen around the body.", ans: "A", col: CORAL, shape: "disc",
    why: "A whole cell is <b>far too big to be filtered</b>. Red blood cells stay in the blood." }
};
var DECK = ["glucose", "glucose", "urea", "urea", "urea", "waterKeep", "waterKeep", "waterExtra", "ionKeep", "ionExtra", "protein", "rbc"];
var CHOICE = {
  A: "Too big: stays in the blood",
  B: "Filtered, then reabsorbed",
  C: "Filtered, out in the urine"
};
var CHEER = ["Sorted.", "Kidney approved.", "Smooth filtering.", "Your kidney salutes you.", "Clean work.", "Right on the money."];

function token(kind, x, y){
  var k = KINDS[kind], c = k.col, st = ' stroke="' + INK + '" stroke-width="2"';
  if(k.shape === "hex") return '<path d="M' + (x - 14) + ' ' + y + ' L' + (x - 7) + ' ' + (y - 12) + ' H' + (x + 7) + ' L' + (x + 14) + ' ' + y + ' L' + (x + 7) + ' ' + (y + 12) + ' H' + (x - 7) + ' Z" fill="' + c + '"' + st + '/>';
  if(k.shape === "dot") return '<circle cx="' + x + '" cy="' + y + '" r="10" fill="' + c + '"' + st + '/>';
  if(k.shape === "drop") return '<path d="M' + x + ' ' + (y - 15) + ' Q' + (x + 12) + ' ' + (y + 1) + ' ' + x + ' ' + (y + 12) + ' Q' + (x - 12) + ' ' + (y + 1) + ' ' + x + ' ' + (y - 15) + ' Z" fill="' + c + '"' + st + '/>';
  if(k.shape === "ion") return '<circle cx="' + x + '" cy="' + y + '" r="11" fill="' + c + '"' + st + '/>' + L(x - 5, y, x + 5, y, WHITE, 2.5) + L(x, y - 5, x, y + 5, WHITE, 2.5);
  if(k.shape === "blob") return '<path d="M' + (x - 20) + ' ' + y + ' q5 -14 13 -8 q6 -12 14 -2 q12 0 6 10 q8 10 -6 12 q-6 10 -14 2 q-12 4 -13 -14 Z" fill="' + c + '"' + st + '/>';
  return '<ellipse cx="' + x + '" cy="' + y + '" rx="20" ry="15" fill="' + c + '"' + st + '/><ellipse cx="' + x + '" cy="' + y + '" rx="8" ry="5" fill="#ff8f8f"/>';
}

var SORTER = {
  type: "widget", topic: "Water balance",
  title: "The kidney sorting machine",
  html: '<p>Molecules arrive in the blood one at a time. You decide where each one goes: does it stay in the blood, get filtered and reabsorbed, or leave in the urine? Read the little card: water and ions depend on what the body needs right now.</p>',
  report: function(d){
    return "Kidney sorter: " + (d.rounds || 0) + " round" + (d.rounds === 1 ? "" : "s") + " finished, best score " + (d.best || 0) + " of 120" +
      (d.deck ? ", current round " + Math.min(d.pos || 0, 12) + " of 12 sorted, " + (d.first || 0) + " first go, " + (d.shown || 0) + " shown" : "") + ".";
  },
  mount: function(el, api){
    var d = api.data;
    function newRound(){
      var deck = DECK.slice();
      for(var i = deck.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
      d.deck = deck; d.pos = 0; d.score = 0; d.first = 0; d.shown = 0; d.streak = 0; d.tries = 0; d.phase = "ask"; d.last = null; d.out = [];
      api.save();
    }
    if(!d.deck) newRound();
    el.innerHTML =
      '<div class="wpanel">' +
        '<div class="ks-stats" id="ksStats"></div>' +
        '<div class="ks-scene" id="ksScene"></div>' +
        '<div id="ksMain"></div>' +
      '</div>';
    var statsEl = el.querySelector("#ksStats"), sceneEl = el.querySelector("#ksScene"), main = el.querySelector("#ksMain");
    sceneEl.innerHTML = svg("0 0 380 250", "The kidney sorting machine: a blood vessel with a filter, a tubule, a reabsorption tube back to the blood, and a urine collector",
      sceneInner() + '<path id="ksPrev" d="" fill="none" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 6" opacity="0"/><g id="ksTok"></g>');
    var tokG = sceneEl.querySelector("#ksTok"), prev = sceneEl.querySelector("#ksPrev");
    var busy = false;
    var reduce = false;
    try{ reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

    function place(kind, x, y){ tokG.innerHTML = kind ? token(kind, x, y) : ""; }
    function drawStats(){
      statsEl.innerHTML = '<span>Molecule <b>' + Math.min(d.pos + 1, 12) + '</b> of 12</span><span>Score <b>' + d.score + '</b></span>' +
        (d.streak >= 2 ? '<span>Streak <b>' + d.streak + '</b></span>' : "") + (d.best ? '<span>Best <b>' + d.best + '</b></span>' : "");
    }
    function animate(kind, k, cb){
      var pts = ROUTES[k], segs = [], tot = 0;
      for(var i = 1; i < pts.length; i++){ var len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(len); tot += len; }
      if(reduce){ var e = pts[pts.length - 1]; place(kind, e[0], e[1]); cb(); return; }
      var dur = 1100, t0 = null;
      busy = true;
      function frame(ts){
        if(t0 === null) t0 = ts;
        var f = Math.min(1, (ts - t0) / dur), ease = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2, dist = ease * tot, n = 0;
        while(n < segs.length - 1 && dist > segs[n]){ dist -= segs[n]; n++; }
        var a = pts[n], b = pts[n + 1], g = segs[n] ? Math.min(1, dist / segs[n]) : 1;
        place(kind, a[0] + (b[0] - a[0]) * g, a[1] + (b[1] - a[1]) * g);
        if(f < 1) requestAnimationFrame(frame); else { busy = false; cb(); }
