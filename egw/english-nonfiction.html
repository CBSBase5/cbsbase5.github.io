<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two sources - EGW GCSE HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/egw/egw.css?v=5">
<style>
/* source headers inside extracts */
.extract .srchead{font-size:.9rem;color:var(--body-tint);margin-bottom:12px}
.extract .srchead b{font-family:var(--display);color:var(--ink);font-size:1rem;margin-right:4px}
.extract .sign{text-align:right;font-style:italic}
.gloss{width:100%}
.gloss td{text-align:left;font-size:.95rem}
.gloss td:first-child{font-weight:700;white-space:nowrap}
.hl-a{background:#fff3c4;border-radius:4px;padding:0 2px}
.hl-b{background:#d9f5ec;border-radius:4px;padding:0 2px}
.hl-c{background:#e6ebff;border-radius:4px;padding:0 2px}

/* Spot the difference detective */
.sdw{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin:6px 0}
.sdbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;margin-bottom:10px}
.sdbar span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.88rem}
.sdtip{font-size:.95rem;color:#c9cdf0;margin:0 0 10px}
.sdgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sdcol{background:#fff;color:var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sdh{font-family:var(--display);font-weight:700;font-size:.95rem;padding:2px 2px 4px;border-bottom:2px solid var(--line)}
.sdh small{display:block;font-weight:500;font-size:.75rem;color:var(--body-tint)}
.sdcol button{font-family:inherit;font-size:.9rem;line-height:1.3;text-align:left;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:10px;padding:7px 8px;cursor:pointer;position:relative;min-height:44px}
.sdcol button:hover{border-color:var(--line)}
.sdcol button.sel{border-color:var(--blue);background:#e6ebff;box-shadow:0 0 0 2px var(--blue)}
.sdcol button.got{border-color:var(--ink);cursor:default}
.sdcol button.shake{animation:nudge .35s;border-color:var(--coral)}
.sdcol button .bdg{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:.75rem;margin-right:5px}
.sdmsg{min-height:1.4em;margin:10px 0 0;font-size:.96rem;line-height:1.45;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px}
.sdmsg b{color:var(--sun)}
.sdrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sdnotes{margin-top:12px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px}
.sdnotes h4{font-family:var(--display);margin:0 0 6px;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.sdnotes p{margin:0 0 7px;font-size:.93rem;line-height:1.45;padding-left:10px;border-left:5px solid var(--line)}
.sdatt{background:#fff;color:var(--ink);border-radius:12px;padding:12px}
.sdatt .who{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-bottom:4px}
.sdatt .ev{font-size:.93rem;color:var(--body-tint);margin:0 0 10px}
.sdopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sdopts button{font-family:var(--display);font-weight:700;font-size:1rem;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:12px;padding:10px 8px;cursor:pointer;min-height:44px}
.sdopts button:hover{border-color:var(--violet)}
.sdopts button.ok{border-color:var(--mint);background:#e3f8f1}
.sdopts button.no{border-color:var(--coral);background:#ffe9e9}
.sdend{text-align:center;padding:6px 0}
.sdend .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--sun);line-height:1.1;margin:6px 0}
@media (max-width:420px){
  .sdw{padding:10px}
  .sdcol{padding:6px}
  .sdcol button{font-size:.86rem;padding:6px}
}
</style>
</head>
<body class="subj-eng">
<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/egw/"><span class="hqlogo">EGW</span><span class="hqname">GCSE HQ<small>revision and planning</small></span></a>

<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Two sources</h2>
    <span>English Language. Reading two non fiction texts from different centuries, and comparing them.</span>
  </div>
  <div id="egwApp"></div>
</div>

<footer>
  <div class="wrap">
    <span>EGW's GCSE HQ &middot; part of Base 5, Chilton Bridge School</span>

  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=7"></script>
<script>
(function(){
"use strict";

/* Both sources are original, written for this page, so they can be printed in full. */
var SRC_A =
'<div class="extract">' +
'<p class="srchead"><b>Source A</b> A letter written in 1872 by a young woman, Eliza, to her sister Clara at home.</p>' +
'<p class="sign" style="text-align:left">Saltham, 14th August 1872</p>' +
'<p>My dearest Clara,</p>' +
'<p><span class="ln">&para; 1</span>You will scarcely credit it, but I have this morning been in the sea, and I am not yet perished. Mamma was persuaded by Dr Ashby that the salt air would restore my constitution, and so we came down by the railway on Tuesday, a journey of above four hours, in a carriage so crowded with excursionists, their baskets and their squalling infants, that I thought I should faint before ever we reached the coast.</p>' +
'<p><span class="ln">&para; 2</span>The town itself is a perfect riot. The sands are thronged from morning until dusk with persons of every description: donkey boys bawling their prices, a German band playing very ill, and a gentleman upon a barrel who preaches to anyone who will stand still long enough to be preached at. I confess I find it all rather vulgar, and Mamma declares that the place was a good deal more genteel before the railway came.</p>' +
'<p><span class="ln">&para; 3</span>And yet, dear Clara, the sea! I was conveyed into it this morning in a bathing machine, a sort of hut upon wheels, which a patient horse drew down into the waves, and from its little door I descended, trembling, into water so cold that it quite stole my breath. The dipper, a stout woman with arms like a sailor\'s, plunged me under three times without ceremony. I shrieked, I own it; but when I came up the whole bay was glittering, and I felt more alive than I have in a twelvemonth.</p>' +
'<p><span class="ln">&para; 4</span>We take tea at five. Pray write soon, and tell me everything of home.</p>' +
'<p class="sign">Your affectionate sister,<br>Eliza</p>' +
'</div>';

var SRC_B =
'<div class="extract">' +
'<p class="srchead"><b>Source B</b> A post from a family travel blog, written this year by a parent of three.</p>' +
'<p><b>Sand in everything, and I would do it again</b></p>' +
'<p><span class="ln">&para; 1</span>Let me be honest: I did not want to go. Two hours in a traffic jam, a car park that charged twelve pounds before I had even seen the sea, and three children asking "are we nearly there?" roughly every ninety seconds. By the time we reached the beach I had used up my entire supply of patience, plus some I had borrowed from tomorrow.</p>' +
'<p><span class="ln">&para; 2</span>The beach was rammed. Windbreaks stretched to the horizon like a multicoloured fence, someone\'s speaker was blasting music, and a seagull the size of a small dog stole my chips straight out of my hand. Classic.</p>' +
'<p><span class="ln">&para; 3</span>But then something odd happened. My eldest, who usually communicates only in grunts and screen time negotiations, put down her phone. She ran into the sea fully clothed. She screamed at the cold. She laughed. Within ten minutes, all four of us were in the waves, soaked, shrieking and grinning like fools.</p>' +
'<p><span class="ln">&para; 4</span>Nobody checked a notification for three hours. We built a sandcastle that collapsed. We ate sandy sandwiches. Nobody cared.</p>' +
'<p><span class="ln">&para; 5</span>Was it expensive? Yes. Was it crowded? Absolutely. Would I go back tomorrow? In a heartbeat. The sea does not care about your inbox. That, I think, is the whole point.</p>' +
'</div>';

function fold(label, src){ return '<details class="working"><summary>' + label + ' (tap to open)</summary>' + src + '</details>'; }
var FOLD_A = fold("Source A, the 1872 letter", SRC_A);
var FOLD_B = fold("Source B, the blog", SRC_B);
var FOLD_AB = FOLD_A + FOLD_B;

var GLOSS =
'<table class="datatable gloss">' +
'<tr><th>Word</th><th>Means</th></tr>' +
'<tr><td>constitution</td><td>general health and strength</td></tr>' +
'<tr><td>excursionists</td><td>day trippers, often arriving by cheap train</td></tr>' +
'<tr><td>conveyed</td><td>carried</td></tr>' +
'<tr><td>bathing machine</td><td>a hut on wheels pulled into the sea, so bathers could get changed and step in privately</td></tr>' +
'<tr><td>dipper</td><td>a worker who helped (or pushed) bathers into the water</td></tr>' +
'<tr><td>twelvemonth</td><td>a year</td></tr>' +
'</table>';

/* ---------- figures (380 wide so the text stays readable on a phone) ---------- */
var ICEBERG =
'<svg viewBox="0 0 380 230" role="img" aria-label="An iceberg: the small tip above the water is explicit information, the large part below is implicit information">' +
'<rect x="0" y="92" width="380" height="138" fill="#22b8e6" opacity=".25"/>' +
'<path d="M0 92 Q30 86 60 92 T120 92 T180 92 T240 92 T300 92 T380 92" fill="none" stroke="#3a5cff" stroke-width="3"/>' +
'<path d="M80 92 L112 40 L132 56 L150 22 L178 92 Z" fill="#ffffff" stroke="#141a33" stroke-width="3" stroke-linejoin="round"/>' +
'<path d="M80 92 L178 92 L214 150 L176 214 L96 220 L44 168 Z" fill="#ffffff" opacity=".75" stroke="#141a33" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round"/>' +
'<g font-family="Space Grotesk,Arial" font-weight="700" fill="#141a33">' +
'<text x="196" y="40" font-size="17">EXPLICIT</text>' +
'<text x="196" y="60" font-size="14" font-weight="400">stated: you can point</text>' +
'<text x="196" y="77" font-size="14" font-weight="400">at the words</text>' +
'<text x="226" y="150" font-size="17">IMPLICIT</text>' +
'<text x="226" y="170" font-size="14" font-weight="400">suggested: you work</text>' +
'<text x="226" y="187" font-size="14" font-weight="400">it out from clues</text>' +
'</g></svg>';

var BRIDGE =
'<svg viewBox="0 0 380 190" role="img" aria-label="A bridge between Source A and Source B: a detail and inference from each, joined by a comparing word such as whereas">' +
'<path d="M70 120 Q190 20 310 120" fill="none" stroke="#ff5d5d" stroke-width="7" stroke-linecap="round"/>' +
'<rect x="134" y="44" width="112" height="32" rx="16" fill="#ffd23f" stroke="#141a33" stroke-width="3"/>' +
'<text x="190" y="66" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="700" font-size="15" fill="#141a33">whereas</text>' +
'<rect x="6" y="112" width="150" height="72" rx="14" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<rect x="224" y="112" width="150" height="72" rx="14" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<g font-family="Space Grotesk,Arial" text-anchor="middle" fill="#141a33">' +
'<text x="81" y="138" font-size="16" font-weight="700">Source A</text>' +
'<text x="81" y="160" font-size="14">detail + what</text><text x="81" y="176" font-size="14">it suggests</text>' +
'<text x="299" y="138" font-size="16" font-weight="700">Source B</text>' +
'<text x="299" y="160" font-size="14">detail + what</text><text x="299" y="176" font-size="14">it suggests</text>' +
'</g></svg>';

var LENS =
'<svg viewBox="0 0 380 200" role="img" aria-label="Three things shape a writer\'s perspective: when they wrote, who they are, and who they are writing for and why">' +
'<g font-family="Space Grotesk,Arial" font-weight="700" fill="#141a33">' +
'<rect x="6" y="10" width="190" height="50" rx="25" fill="#ffd23f" stroke="#141a33" stroke-width="3"/><text x="101" y="41" text-anchor="middle" font-size="15">When they wrote</text>' +
'<rect x="6" y="75" width="190" height="50" rx="25" fill="#22b8e6" stroke="#141a33" stroke-width="3"/><text x="101" y="106" text-anchor="middle" font-size="15">Who they are</text>' +
'<rect x="6" y="140" width="190" height="50" rx="25" fill="#ff5d5d" stroke="#141a33" stroke-width="3"/><text x="101" y="171" text-anchor="middle" font-size="15">Who for, and why</text>' +
'<path d="M200 35 L270 92 M200 100 L262 100 M200 165 L270 108" stroke="#141a33" stroke-width="3"/>' +
'<circle cx="318" cy="100" r="54" fill="#8a5cf6" stroke="#141a33" stroke-width="3"/>' +
'<text x="318" y="96" text-anchor="middle" font-size="15" fill="#ffffff">their</text><text x="318" y="115" text-anchor="middle" font-size="15" fill="#ffffff">perspective</text>' +
'</g></svg>';

/* ---------- Spot the difference detective ---------- */
var PAIRS = [
  { name: "The journey", col: "#ffd23f",
    note: "<b>The journey.</b> Eliza endures \"above four hours\" in a packed railway carriage, whereas the blogger sits through \"two hours in a traffic jam\". A different century, the same ordeal." },
  { name: "The crowds", col: "#22b8e6",
    note: "<b>The crowds.</b> \"Thronged\" and \"rammed\" both mean packed, but Eliza looks down on the crowd, whereas the blogger just shrugs and laughs." },
  { name: "The noise", col: "#ff8f8f",
    note: "<b>The noise.</b> A German band \"playing very ill\" then, a speaker \"blasting music\" now. Both writers notice the racket of other people having fun." },
  { name: "The cold sea", col: "#9fe6d0",
    note: "<b>The cold sea.</b> The water \"stole\" Eliza's breath, and the blogger's daughter \"screamed at the cold\". The shock of the sea has not changed in over 150 years." },
  { name: "The joy", col: "#c7b2ff",
    note: "<b>The joy.</b> Both are transformed by the end: Eliza feels \"more alive\", and the family are \"grinning like fools\". The sea wins both writers over." }
];
var DET_A = [
  ["a journey of above four hours", 0],
  ["a sort of hut upon wheels", -1],
  ["The sands are thronged", 1],
  ["water so cold that it quite stole my breath", 3],
  ["a German band playing very ill", 2],
  ["We take tea at five.", -1],
  ["more alive than I have in a twelvemonth", 4]
];
var DET_B = [
  ["She screamed at the cold.", 3],
  ["The beach was rammed.", 1],
  ["Nobody checked a notification for three hours.", -1],
  ["grinning like fools", 4],
  ["Two hours in a traffic jam", 0],
  ["We built a sandcastle that collapsed.", -1],
  ["someone's speaker was blasting music", 2]
];
var ATT = [
  { who: "Eliza, on the crowds", ev: "\"persons of every description\" ... \"I confess I find it all rather vulgar\"",
    opts: ["Disdainful", "Delighted", "Terrified", "Indifferent"], right: 0,
    why: "Disdainful means looking down on something. \"Vulgar\" is a snobbish word: Eliza feels above the day trippers." },
  { who: "The blogger, on the crowds", ev: "\"The beach was rammed\" ... a seagull \"stole my chips ... Classic.\"",
    opts: ["Furious", "Snobbish", "Good humoured", "Frightened"], right: 2,
    why: "The one word sentence \"Classic.\" is a shrug and a grin. The blogger is annoyed, but jokes about it." },
  { who: "Both writers, on the sea itself", ev: "\"the whole bay was glittering\" ... \"Would I go back tomorrow? In a heartbeat.\"",
    opts: ["Bored", "Exhilarated", "Disappointed", "Unimpressed"], right: 1,
    why: "Exhilarated means thrilled and full of energy. Here is your big similarity: both writers start out grumbling and end up won over by the water." }
];
var MISS_MSG = [
  "Those two are not talking about the same thing. Have another look.",
  "No shared idea there. Try a different pairing.",
  "Close, but they do not match. What is each detail actually about?"
];
var RANKS = [[0, "Chief Inspector"], [2, "Detective Sergeant"], [5, "Detective Constable"], [99, "Trainee detective, with promise"]];

function detective(el, api){
  var d = api.data;
  if(!d.found) d.found = [];
  if(d.miss === undefined) d.miss = 0;
  if(d.att === undefined) d.att = 0;
  var sel = null, msg = "";

  function rank(){ for(var k = 0; k < RANKS.length; k++) if(d.miss <= RANKS[k][0]) return RANKS[k][1]; return RANKS[RANKS.length - 1][1]; }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }
  function notes(){
    if(!d.found.length) return "";
    return '<div class="sdnotes"><h4>Case notes</h4>' + d.found.map(function(p){
      return '<p style="border-left-color:' + PAIRS[p].col + '">' + PAIRS[p].note + '</p>';
    }).join("") + '</div>';
  }
  function bar(){
    return '<div class="sdbar"><span>Pairs ' + d.found.length + ' / ' + PAIRS.length + '</span><span>Misses ' + d.miss + '</span></div>';
  }

  function draw(){
    if(d.att >= ATT.length){ drawEnd(); return; }
    if(d.found.length >= PAIRS.length && d.toAtt){ drawAtt(); return; }
    var full = d.found.length >= PAIRS.length;
    el.innerHTML = '<div class="sdw">' + bar() +
      '<p class="sdtip">Tap a detail in one source, then the detail in the other source that is about the same thing. Watch out: some clues are red herrings.</p>' +
      '<div class="sdgrid"><div class="sdcol" id="colA"><div class="sdh">Source A<small>the 1872 letter</small></div></div>' +
      '<div class="sdcol" id="colB"><div class="sdh">Source B<small>the blog</small></div></div></div>' +
      '<div class="sdmsg" aria-live="polite">' + (msg || "Five pairs are hiding in here.") + '</div>' +
      '<div class="sdrow">' + (full ? '<button class="btn" type="button" id="sdToAtt">On to the attitudes</button>' :
        d.miss > 0 ? '<button class="btn btn-quiet" type="button" id="sdShow">Show me a pair</button>' : '') + '</div>' +
      notes() + '</div>';
    [["A", DET_A, "colA"], ["B", DET_B, "colB"]].forEach(function(side){
      var col = el.querySelector("#" + side[2]);
      side[1].forEach(function(c, k){
        var b = document.createElement("button");
        b.type = "button";
        var got = c[1] >= 0 && d.found.indexOf(c[1]) >= 0;
        b.innerHTML = (got ? '<span class="bdg">' + (d.found.indexOf(c[1]) + 1) + '</span>' : '') + c[0];
        b.dataset.side = side[0]; b.dataset.k = k;
        if(got){ b.className = "got"; b.style.background = PAIRS[c[1]].col; b.setAttribute("aria-label", c[0] + ", matched: " + PAIRS[c[1]].name); }
        else if(sel && sel.side === side[0] && sel.k === k) b.className = "sel";
        b.onclick = function(){ if(!got) tap(side[0], k, b); };
        col.appendChild(b);
      });
    });
    var sh = el.querySelector("#sdShow");
    if(sh) sh.onclick = showPair;
    var ta = el.querySelector("#sdToAtt");
    if(ta) ta.onclick = function(){ d.toAtt = true; msg = ""; api.save(); draw(); };
    if(full && !msg) el.querySelector(".sdmsg").innerHTML = "<b>All five pairs found.</b> Your case notes are below.";
  }

  function tap(side, k, btn){
    if(!sel || sel.side === side){
      sel = (sel && sel.side === side && sel.k === k) ? null : { side: side, k: k };
      msg = sel ? "Now tap its partner in the other source." : "";
      draw(); return;
    }
    var a = side === "A" ? DET_A[k] : DET_A[sel.k];
    var b = side === "B" ? DET_B[k] : DET_B[sel.k];
    sel = null;
    if(a[1] >= 0 && a[1] === b[1]){
      d.found.push(a[1]);
      msg = '<b>Match: ' + PAIRS[a[1]].name.toLowerCase() + '.</b> ' + (d.found.length < PAIRS.length ? "Added to your case notes." : "All five found.");
      api.save();
      draw();
    }else{
      d.miss++;
      msg = (a[1] < 0 || b[1] < 0) ? "<b>Red herring.</b> One of those details has no partner in the other source. Try again." : "<b>Hmm.</b> " + MISS_MSG[d.miss % MISS_MSG.length];
      api.save();
      draw();
      var bs = el.querySelectorAll(".sdcol button");
      [].forEach.call(bs, function(x){
        if((x.dataset.side === "A" && DET_A[+x.dataset.k] === a) || (x.dataset.side === "B" && DET_B[+x.dataset.k] === b)) x.classList.add("shake");
      });
    }
  }

  function showPair(){
    for(var p = 0; p < PAIRS.length; p++){
      if(d.found.indexOf(p) < 0){
        d.found.push(p); d.shown = true; sel = null;
        msg = '<b>Here is one.</b> Look at how the two details in colour say the same thing in different words.';
        api.save(); draw(); return;
      }
    }
  }

  function drawAtt(){
    var q = ATT[d.att];
    el.innerHTML = '<div class="sdw">' + bar() +
      '<p class="sdtip">Case closed on the details. Now the detective\'s real job: <b style="color:#ffd23f">what do the details tell you about attitude?</b> Pick one word. (' + (d.att + 1) + ' of ' + ATT.length + ')</p>' +
      '<div class="sdatt"><div class="who">' + q.who + '</div><p class="ev">' + q.ev + '</p><div class="sdopts"></div></div>' +
      '<div class="sdmsg" aria-live="polite">Pick the word that fits the evidence best.</div><div class="sdrow" id="sdAttRow"></div>' +
      notes() + '</div>';
    var box = el.querySelector(".sdopts"), out = el.querySelector(".sdmsg"), row = el.querySelector("#sdAttRow");
    var missedHere = false;
    function win(b, shown){
      b.classList.add("ok");
      [].forEach.call(box.children, function(c){ c.disabled = true; });
      out.innerHTML = '<b>' + (shown ? "Here it is." : missedHere ? "Got there." : "Sharp.") + '</b> ' + q.why;
      row.innerHTML = '<button class="btn" type="button" id="sdNext">' + (d.att === ATT.length - 1 ? "Close the case" : "Next") + '</button>';
      row.querySelector("#sdNext").onclick = function(){ d.att++; api.save(); draw(); };
    }
    q.opts.forEach(function(t, k){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = t;
      b.onclick = function(){
        if(b.disabled) return;
        if(k === q.right){ win(b, false); }
        else{
          b.classList.add("no"); b.disabled = true; d.miss++; missedHere = true; api.save();
          out.innerHTML = '<b>Not that one.</b> Read the evidence again: which word would the writer recognise?';
          row.innerHTML = '<button class="btn btn-quiet" type="button" id="sdShowAtt">Show me</button>';
          row.querySelector("#sdShowAtt").onclick = function(){ d.shown = true; api.save(); win(box.children[q.right], true); };
        }
      };
      box.appendChild(b);
    });
  }

  function drawEnd(){
    el.innerHTML = '<div class="sdw"><div class="sdend"><p class="sdtip" style="margin:0">Case closed. Your rank:</p>' +
      '<div class="big">' + rank() + '</div>' +
