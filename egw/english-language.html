<div class="wrap qwrap">

    <h2>Language detective</h2>
    <span>English Language. Reading fiction closely: language, structure, and writing about both.</span>
  </div>
  <div id="egwApp"></div>

<footer>
  <div class="wrap">

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=2"></script>
<script>
(function(){
"use strict";

/* The extract is original, written for this page, so it can be printed in full. */
var EXTRACT =
'<div class="extract">' +
'<p><span class="ln">&para; 1</span>The bus left Mara at the end of the coast road and growled away into the dark, its two red lights shrinking until the night swallowed them whole.</p>' +
'<p><span class="ln">&para; 2</span>She was alone.</p>' +
'<p><span class="ln">&para; 3</span>Ahead, the cottage crouched on the edge of the cliff like an animal waiting to be fed. Beyond it the lighthouse stood tall and silent, its great eye shut.</p>' +
'<p><span class="ln">&para; 4</span>The wind arrived all at once. It clawed at her coat, snatched her breath and hurled grit into her face. Rain followed, cold and sharp as needles, rattling against the gorse. Somewhere below, the sea boomed and boomed and boomed against the rocks, as if it were trying to break down a door.</p>' +
'<p><span class="ln">&para; 5</span>Mara pulled her hood tighter and walked. Each step was an argument with the gale. Twice it shoved her sideways; once it almost won.</p>' +
'<p><span class="ln">&para; 6</span>Then she saw it: a single square of yellow light in the cottage window. Small. Steady. Warm.</p>' +
'<p><span class="ln">&para; 7</span>She ran.</p>' +
'<p><span class="ln">&para; 8</span>At the door she stopped, her hand raised to knock, suddenly unsure. Inside, someone was singing.</p>' +
'</div>';

var FOLD = '<details class="working" open><summary>The extract (tap to fold away)</summary>' + EXTRACT + '</details>';

var WHW =
'<svg viewBox="0 0 520 120" role="img" aria-label="What, How, Why: three steps in a paragraph">' +
'<rect x="6" y="20" width="150" height="80" rx="16" fill="#ffd23f" stroke="#141a33" stroke-width="3"/>' +
'<rect x="185" y="20" width="150" height="80" rx="16" fill="#22b8e6" stroke="#141a33" stroke-width="3"/>' +
'<rect x="364" y="20" width="150" height="80" rx="16" fill="#ff5d5d" stroke="#141a33" stroke-width="3"/>' +
'<text x="81" y="55" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="22" fill="#141a33">WHAT</text>' +
'<text x="81" y="80" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="13" fill="#141a33">your point</text>' +
'<text x="260" y="55" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="22" fill="#141a33">HOW</text>' +
'<text x="260" y="80" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="13" fill="#141a33">quote + method</text>' +
'<text x="439" y="55" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="22" fill="#141a33">WHY</text>' +
'<text x="439" y="80" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="13" fill="#141a33">effect on the reader</text>' +
'<path d="M160 60 L180 60" stroke="#141a33" stroke-width="3"/><path d="M174 54 L181 60 L174 66" fill="none" stroke="#141a33" stroke-width="3"/>' +
'<path d="M339 60 L359 60" stroke="#141a33" stroke-width="3"/><path d="M353 54 L360 60 L353 66" fill="none" stroke="#141a33" stroke-width="3"/>' +
'</svg>';

var CAMERA =
'<svg viewBox="0 0 520 130" role="img" aria-label="Structure as a camera: wide shot, close up, focus shift">' +
'<rect x="6" y="14" width="150" height="100" rx="14" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<rect x="185" y="14" width="150" height="100" rx="14" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<rect x="364" y="14" width="150" height="100" rx="14" fill="#ffffff" stroke="#141a33" stroke-width="3"/>' +
'<path d="M20 88 Q60 52 100 70 T145 60" fill="none" stroke="#3a5cff" stroke-width="3"/><circle cx="120" cy="40" r="8" fill="#ffd23f" stroke="#141a33" stroke-width="2"/>' +
'<circle cx="260" cy="60" r="26" fill="#ffd23f" stroke="#141a33" stroke-width="3"/><circle cx="260" cy="60" r="8" fill="#141a33"/>' +
'<rect x="410" y="40" width="58" height="40" rx="4" fill="#ffd23f" stroke="#141a33" stroke-width="3"/><path d="M439 40 V80 M410 60 H468" stroke="#141a33" stroke-width="2"/>' +
'<text x="81" y="128" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="13" fill="#141a33">WIDE SHOT</text>' +
'<text x="260" y="128" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="13" fill="#141a33">CLOSE UP</text>' +
'<text x="439" y="128" text-anchor="middle" font-family="Space Grotesk,Arial" font-weight="800" font-size="13" fill="#141a33">NEW FOCUS</text>' +
'</svg>';

EGW.run({
  id: "english-language",
  title: "Language detective",
  subject: "English Language",
  mins: 45,
  blurb: "Every English Language exam gives you a piece of fiction and asks how the writer uses language and structure. This takes one short extract and works through it the way the exam does, ending with a paragraph of your own.",
  steps: [

  /* ---------- READING ---------- */
  { type: "learn", topic: "First read",
    title: "Read it twice, for two different jobs",
    html: '<p><b>Read one is for the story.</b> Who is there, where are they, what happens? Do not hunt for techniques yet.</p>' +
          '<p><b>Read two is for the writer.</b> Now ask: what is the writer trying to make me feel, and which words are doing that?</p>' +
          '<div class="keep"><b>Keep this</b>The exam is never asking what happens. It is asking how the writer made it feel that way.</div>' +
          EXTRACT },

  { type: "mc", topic: "First read",
    q: "In one sentence, what happens in the extract?",
    options: [
      "Mara gets lost on a bus and phones for help.",
      "Mara is dropped off alone at night and battles a storm to reach a lit cottage.",
      "Mara works at the lighthouse and switches the light on.",
      "Mara walks along the beach on a calm summer evening."
    ],
    answer: 1,
    hint: "Look at what she does in paragraphs 5 to 8, and what the weather is like.",
    why: "Keeping it this simple is useful. Once you know the story, every technique you find will be about one thing: how the writer makes that walk feel." },

  { type: "mc", topic: "First read",
    q: "Which word best sums up the mood of paragraphs 1 to 5?",
    fig: FOLD,
    options: ["Peaceful", "Threatening", "Comic", "Romantic"],
    answer: 1,
    hint: "Think about the night, the cottage and the wind. Are they friendly?",
    why: "Threatening. The night swallows, the cottage crouches, the wind claws. Naming the mood first gives your paragraphs a direction." },

  /* ---------- METHODS ---------- */
  { type: "learn", topic: "Spotting methods",
    title: "The method toolkit",
    html: '<p>These are the methods that come up again and again. You do not need fancy names for everything, but these are worth knowing.</p>' +
          '<ul>' +
          '<li><b>Simile</b>: comparing using <i>like</i> or <i>as</i>. "cold and sharp as needles"</li>' +
          '<li><b>Metaphor</b>: saying something <i>is</i> something else. "Each step was an argument with the gale"</li>' +
          '<li><b>Personification</b>: giving something that is not human human actions or feelings. "The wind ... snatched her breath"</li>\n          <li><b>Animal imagery</b>: making something seem like an animal. "It clawed at her coat"</li>' +
          '<li><b>Verb choice</b>: the action words. Strong verbs carry a lot of feeling.</li>' +
          '<li><b>Repetition</b>: saying the same thing again for effect.</li>' +
          '<li><b>Sentence length</b>: a very short sentence after long ones makes a moment stand out.</li>' +
          '<li><b>Sensory language</b>: sounds, sights, touch, smells.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Naming the method earns very little on its own. The marks are for explaining what it does.</div>' },

  { type: "match", topic: "Spotting methods",
    q: "Match each quotation to the main method being used.",
    pairs: [
      ["the cottage crouched on the edge of the cliff like an animal waiting to be fed", "Simile"],
      ["Each step was an argument with the gale", "Metaphor"],
      ["once it almost won", "Personification"],
      ["the sea boomed and boomed and boomed", "Repetition"],
      ["She was alone.", "Short sentence"],
      ["Small. Steady. Warm.", "List of three adjectives"]
    ],
    hint: "Look for the word 'like', for the wind acting like a person who can win, and for anything repeated.",
    why: "Some of these overlap. The cottage simile is also personification, because crouching and waiting to be fed are things a living thing does. In the exam, spotting an overlap like that is a sign of a confident reader." },

  { type: "multi", topic: "Spotting methods",
    q: "The writer makes the storm seem alive and dangerous. Which <b>two</b> quotations show this best?",
    fig: FOLD,
    options: [
      "\"The bus left Mara at the end of the coast road\"",
      "\"It clawed at her coat, snatched her breath and hurled grit into her face\"",
      "\"Mara pulled her hood tighter and walked\"",
      "\"Twice it shoved her sideways; once it almost won\"",
      "\"a single square of yellow light\""
    ],
    answers: [1, 3],
    hint: "Find the lines where the wind does things to her, as if it had hands.",
    why: "Clawed, snatched, hurled and shoved are all deliberate, physical actions. \"Almost won\" makes the gale sound like an opponent in a fight. Together they make the storm feel like an attacker, not just weather." },

  /* ---------- ZOOMING IN ---------- */
  { type: "learn", topic: "Zooming in",
    title: "Zoom in on one word",
    html: '<p>The best answers pick out <b>one word</b> from a quotation and unpack it. Ask: what does this word make me think of? These ideas are called <b>connotations</b>.</p>' +
          '<p>Take <b>"swallowed"</b> in "the night swallowed them whole". Swallowing is what a mouth does. It suggests the night is a huge creature, and that the lights are gone completely, eaten, with no way back.</p>' +
          '<div class="keep"><b>Keep this</b>Word, then what it makes you think of, then why that matters for the reader. Three small steps, a lot of marks.</div>' },

  { type: "mc", topic: "Zooming in",
    q: "\"It <b>clawed</b> at her coat.\" What does the word clawed suggest about the wind?",
    options: [
      "That the wind is gentle and playful",
      "That the wind is like a wild animal with sharp claws, attacking her on purpose",
      "That the wind is cold",
      "That her coat is old and torn"
    ],
    answer: 1,
    hint: "What has claws, and how does it use them?",
    why: "Claws belong to predators. The word makes the wind feel savage and deliberate, as if it is hunting Mara. Notice that \"cold\" is true of the weather but is not what this word is doing." },

  { type: "mc", topic: "Zooming in", stretch: true,
    q: "Look again at \"the cottage crouched ... like an animal waiting to be fed\". The obvious reading is that the cottage looks threatening. Which is the most sensible <b>second</b> reading?",
    options: [
      "The cottage is made of animal skins.",
      "The cottage is waiting for someone, so Mara may be expected, which hints that this is a place that wants her.",
      "The writer is telling us there is a pet inside.",
      "The cottage is about to fall off the cliff because it is crouching."
    ],
    answer: 1,
    hint: "An animal waiting to be fed is waiting for someone to arrive. Who arrives?",
    why: "Higher grade answers offer more than one interpretation, often with \"perhaps\" or \"alternatively\". The cottage could be a threat, or it could be hungry for company, which fits the warm ending with the singing. Both are supported by the words." },

  /* ---------- WHAT HOW WHY ---------- */
  { type: "learn", topic: "Building a paragraph",
    title: "What, How, Why",
    fig: WHW,
    html: '<p><b>What</b> is your point, in your own words. <i>The writer presents the storm as a violent attacker.</i></p>' +
          '<p><b>How</b> is the evidence: a short quotation and the method. <i>The violent verbs "clawed", "snatched" and "hurled" make the wind seem alive.</i></p>' +
          '<p><b>Why</b> is the effect: zoom on a word and say what it does to the reader. <i>"Clawed" suggests a wild animal, so the wind feels deliberate and dangerous, and we worry for Mara.</i></p>' +
          '<div class="keep"><b>Keep this</b>Short quotations are better than long ones. Three or four words you can actually talk about beat a whole sentence copied out.</div>' },

  { type: "sort", topic: "Building a paragraph",
    q: "These six sentences come from two strong paragraphs. Sort each one into What, How or Why.",
    buckets: ["What (the point)", "How (quote + method)", "Why (the effect)"],
    cards: [
      ["The writer presents the storm as a violent attacker.", 0],
      ["The writer makes the light at the end feel like safety.", 0],
      ["The violent verbs \"clawed\", \"snatched\" and \"hurled\" make the wind seem alive.", 1],
      ["The three short adjectives \"Small. Steady. Warm.\" are each a sentence on their own.", 1],
      ["\"Clawed\" suggests an animal hunting her, so the reader feels anxious for Mara.", 2],
      ["The full stops slow us down, as if Mara is calming her breathing, so we feel her relief.", 2]
    ],
    hint: "A What sentence has no quotation. A How sentence names the quotation and the method. A Why sentence talks about the reader or what a word suggests.",
    why: "If you can tell these apart in someone else's writing, you can check for all three in your own. A paragraph missing its Why is the most common way to lose marks." },

  { type: "mc", topic: "Building a paragraph",
    q: "Which sentence would get the <b>most</b> credit in the exam?",
    options: [
      "The writer uses a simile, which is effective.",
      "There is a simile in paragraph 3 and some personification in paragraph 4.",
      "The simile \"like an animal waiting to be fed\" makes the cottage seem hungry and alive, so Mara looks like she is walking straight towards danger.",
      "The cottage is on a cliff and there is a lighthouse."
    ],
    answer: 2,
    hint: "Which one explains an effect, not just names a technique?",
    why: "\"Effective\" on its own tells the examiner nothing. The strong sentence names the method, uses a short quotation, unpacks a word (hungry) and links it to how we see Mara." },

  { type: "order", topic: "Building a paragraph",
    q: "Put this paragraph in a sensible What, How, Why order.",
    items: [
      "The writer presents the moment Mara sees the light as a turning point.",
      "After long sentences full of violent verbs, the writer suddenly uses three single word sentences: \"Small. Steady. Warm.\"",
      "The word \"steady\" is important, because it is the opposite of the wind, which keeps shoving her around.",
      "This makes the reader relax with her, and the short sentences feel like breaths of relief."
    ],
    hint: "Start with the point that has no quotation. End with the reader.",
    why: "Point, evidence, zoom on a word, effect on the reader. Notice how the third sentence compares \"steady\" with earlier in the extract. Linking across a text like that is a sign of a top answer." },

  /* ---------- STRUCTURE ---------- */
  { type: "learn", topic: "Structure",
    title: "Structure is the camera",
    fig: CAMERA,
    html: '<p>Language is about words. <b>Structure</b> is about how the whole text is built: where the writer points the camera, and when it moves.</p>' +
          '<ul>' +
          '<li><b>Openings</b>: wide shot to set the scene, or straight into the action?</li>' +
          '<li><b>Shifts in focus</b>: from the setting to a person, from outside to inside.</li>' +
          '<li><b>Shifts in mood</b>: where does the feeling change?</li>' +
          '<li><b>Endings</b>: does it resolve, or leave a question hanging?</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Good structure words: the writer <i>shifts the focus</i>, <i>narrows</i>, <i>zooms in</i>, <i>contrasts</i>, <i>builds tension</i>, <i>ends on</i>.</div>' },

  { type: "order", topic: "Structure",
    q: "Put the focus of the extract in the order it happens.",
    fig: FOLD,
    items: [
      "The bus leaving, as the outside world disappears",
      "The setting: the cottage and the dark lighthouse",
      "The storm attacking Mara",
      "Mara struggling forward against the gale",
      "The small light in the window",
      "The door, and the singing inside"
    ],
    hint: "Follow the paragraph numbers down the extract.",
    why: "Notice the pattern: it starts wide and empty, narrows onto Mara's struggle, then focuses right down to one small light and one door. The camera closes in as she gets closer." },

  { type: "mc", topic: "Structure",
    q: "Where does the mood shift most clearly from threatening to hopeful?",
    options: [
      "Paragraph 2, \"She was alone.\"",
      "Paragraph 4, when the wind arrives",
      "Paragraph 6, when she sees the yellow light",
      "There is no shift in mood"
    ],
    answer: 2,
    hint: "Find the first warm colour and the first warm word.",
    why: "Paragraph 6 is the turning point. Yellow and warm are the first comforting words in the whole extract, and the word \"Then\" signals the change." },

  { type: "mc", topic: "Structure", stretch: true,
    q: "Why might the writer end on \"Inside, someone was singing\"?",
    options: [
      "To tell us exactly who lives in the cottage",
      "To create a new question, who is singing and why, so the reader wants to read on",
      "Because the storm has stopped",
      "To show that Mara likes music"
    ],
    answer: 1,
    hint: "Does the ending answer things, or open something up?",
    why: "The ending swaps one kind of tension for another. The danger of the storm is over, but a mystery begins. Also notice her hesitation, \"suddenly unsure\": the writer delays the moment the door opens." },

  /* ---------- YOUR TURN ---------- */
  { type: "write", topic: "Your paragraph",
    q: '<p><b>How does the writer use language to make the storm seem frightening?</b></p><p>Write one What, How, Why paragraph. Two if you are on a roll. This one is not marked here; it goes to Jay if you choose to send it.</p>' + FOLD,
    starters: [
      "The writer presents the storm as",
      "This is shown when",
      "The verb",
      "The word \"",
      "suggests",
      "This makes the reader feel",
      "Perhaps",
      "Alternatively,"
    ],
    checklist: [
      "I made a point in my own words (What)",
      "I used a short quotation and named a method (How)",
      "I zoomed in on one word and said what it suggests (Why)",
      "I said how it makes the reader feel",
      "Stretch: I offered a second reading with perhaps or alternatively"
    ],
    minWords: 80 }
  ]
});
})();
</script>
</body>
</html>
