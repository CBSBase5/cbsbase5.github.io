<html lang="en-GB">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Page only: equations, practical boxes, the greenhouse widget */
.eqn{font-family:var(--display);font-weight:700;font-size:1.08rem;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 10px;text-align:center;line-height:1.5}
.eqn small{display:block;font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--body-tint)}
.tablewrap{overflow-x:auto;margin:0 0 12px}
.tablewrap .datatable{font-size:.92rem}
.tablewrap .datatable td,.tablewrap .datatable th{padding:6px 8px;text-align:left;vertical-align:top}
.prac{border:2px dashed var(--ink);border-radius:14px;padding:10px 14px;margin:0 0 12px;background:var(--paper)}
.prac h4{font-size:.95rem;margin:0 0 6px;letter-spacing:.02em}
.prac ol{margin:0 0 6px;padding-left:22px}
.prac li{margin-bottom:4px}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 12px}
.vars div{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:.92rem;line-height:1.4;background:#fff}
.vars b{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.ghouse svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.gtabs span{font-family:var(--display);font-weight:700;font-size:.8rem;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff}
.gtabs span.on{background:var(--mint)}
.gtabs span.won{background:var(--sun)}
.slrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:6px 0 10px}
.slrow label{font-family:var(--display);font-weight:700;font-size:.95rem}
.slrow .sv{font-family:var(--display);font-weight:700;font-size:.95rem;text-align:right}
.slrow input{grid-column:1 / -1}
.slrow .bar{grid-column:1 / -1;height:10px;border-radius:99px;background:#fff;border:2px solid var(--ink);overflow:hidden;position:relative}
.slrow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.slrow .bar b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.slrow.lim label::after{content:"limiting";margin-left:8px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;background:var(--coral);color:#fff;border-radius:6px;padding:2px 6px;vertical-align:2px}
.slrow.lim .bar i{background:var(--coral)}
.slrow .cost{grid-column:1 / -1;font-size:.82rem;color:var(--body-tint)}
.slrow .cost.waste{color:#c0303a;font-weight:700}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.readout div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:center}
.readout small{display:block;font-family:var(--display);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
.readout .wbig{font-size:1.35rem}
.readout .bad{color:#c0303a}
.gfb{font-size:.98rem;line-height:1.45;margin:8px 0 4px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.gfb.good{border-color:var(--good);background:rgba(31,157,99,.09)}
.gfb.nudge{border-color:#f2b705;background:rgba(255,210,63,.2)}
.gfb.show{border-color:var(--violet);background:rgba(138,92,246,.08)}
.stars{font-size:1.5rem;letter-spacing:4px;color:#f2b705;line-height:1}
.stars .off{color:var(--line)}
@media (max-width:400px){.readout .wbig{font-size:1.1rem}}
</style>

<script>
(function(){
"use strict";

/* ---------- palette and tiny SVG helpers ---------- */
var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6",
    GREEN = "#2e7d4f", LEAF = "#9fd89f";

function T(x, y, s, o){
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || "middle") + '" font-family="' +
    (o.body ? "Atkinson Hyperlegible,Verdana,sans-serif" : "Space Grotesk,Arial,sans-serif") + '" font-weight="' + (o.w || 700) +
    '" font-size="' + (o.s || 15) + '" fill="' + (o.c || INK) + '"' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + x + ' ' + y + ')"' : "") +
    (o.id ? ' id="' + o.id + '"' : "") + '>' + s + '</text>';
}
function L(x1, y1, x2, y2, c, w, dash){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (c || INK) +
    '" stroke-width="' + (w || 1.5) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' stroke-linecap="round"/>';
}
function svg(vb, label, inner){
  return '<svg viewBox="' + vb + '" role="img" aria-label="' + label + '">' + inner + '</svg>';
}
function arrowR(x, y, c){ return '<path d="M' + x + ' ' + y + ' l-9 -6 v12 Z" fill="' + (c || INK) + '"/>'; }
function arrowL(x, y, c){ return '<path d="M' + x + ' ' + y + ' l9 -6 v12 Z" fill="' + (c || INK) + '"/>'; }
function arrowD(x, y, c){ return '<path d="M' + x + ' ' + y + ' l-6 -9 h12 Z" fill="' + (c || INK) + '"/>'; }
function arrowU(x, y, c){ return '<path d="M' + x + ' ' + y + ' l-6 9 h12 Z" fill="' + (c || INK) + '"/>'; }
function box(x, y, w, h, fill, rx){
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 12) + '" fill="' + (fill || WHITE) + '" stroke="' + INK + '" stroke-width="2.5"/>';
}

/* ---------- figures ---------- */
var FIG_PS = svg("0 0 400 230", "A leaf. Light energy from the Sun, carbon dioxide from the air and water from the roots go in. Glucose is made and oxygen goes out.",
  '<circle cx="44" cy="40" r="22" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<path d="M44 6 v-4 M44 78 v4 M10 40 h-4 M78 40 h4 M20 16 l-3 -3 M68 64 l3 3 M20 64 l-3 3 M68 16 l3 -3" stroke="' + INK + '" stroke-width="2.5" stroke-linecap="round"/>' +
  '<path d="M110 132 Q160 52 270 84 Q300 132 250 170 Q170 204 110 132 Z" fill="' + LEAF + '" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<path d="M110 132 Q190 132 270 84 M160 132 l20 -24 M200 128 l22 -28 M190 132 l24 20" fill="none" stroke="' + GREEN + '" stroke-width="2"/>' +
  '<path d="M110 132 Q100 150 92 172" fill="none" stroke="' + GREEN + '" stroke-width="5" stroke-linecap="round"/>' +
  '<rect x="128" y="180" width="124" height="44" rx="10" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>' +
  T(190, 199, "glucose made", { s: 15 }) + T(190, 217, "in chloroplasts", { s: 14, body: true, w: 400 }) +
  L(70, 58, 128, 92, SUN, 4) + '<path d="M136 97 l-11 -1 l6 -10 Z" fill="' + SUN + '"/>' + T(92, 104, "light", { s: 14, body: true, w: 400, a: "end" }) +
  L(380, 40, 300, 72, INK, 3) + '<path d="M292 76 l10 -9 l4 10 Z" fill="' + INK + '"/>' + T(396, 26, "carbon dioxide in", { s: 14, a: "end" }) +
  L(296, 140, 362, 168, CORAL, 3) + '<path d="M370 172 l-12 1 l4 -11 Z" fill="' + CORAL + '"/>' + T(396, 196, "oxygen out", { s: 14, a: "end", c: INK }) +
  L(62, 186, 76, 158, CYAN, 3) + '<path d="M80 149 l-11 8 l10 5 Z" fill="' + CYAN + '"/>' + T(4, 204, "water from", { s: 14, a: "start" }) + T(4, 222, "the roots", { s: 14, a: "start" }));

var X0 = 58, X1 = 374, Y0 = 200, Y1 = 14;
function graphFrame(xmax, xstep, ymax, ystep, xlab, ylab){
  function gx(v){ return X0 + v * (X1 - X0) / xmax; }
  function gy(v){ return Y0 - v * (Y0 - Y1) / ymax; }
  var s = '<rect x="' + X0 + '" y="' + Y1 + '" width="' + (X1 - X0) + '" height="' + (Y0 - Y1) + '" fill="' + WHITE + '"/>';
  for(var x = 0; x <= xmax; x += xstep / 2) s += L(gx(x), Y1, gx(x), Y0, (x / xstep) % 1 ? "#eceaf3" : LINE, 1);
  for(var y = 0; y <= ymax; y += ystep / 2) s += L(X0, gy(y), X1, gy(y), (y / ystep) % 1 ? "#eceaf3" : LINE, 1);
  for(x = 0; x <= xmax; x += xstep) s += T(gx(x), Y0 + 20, String(x), { s: 14, body: true, w: 400 });
  for(y = 0; y <= ymax; y += ystep) s += T(X0 - 8, gy(y) + 5, String(y), { s: 14, body: true, w: 400, a: "end" });
  return { s: s, gx: gx, gy: gy, close: L(X0, Y0, X1, Y0, INK, 2.5) + L(X0, Y0, X0, Y1, INK, 2.5) +
    T((X0 + X1) / 2, Y0 + 42, xlab, { s: 15 }) + T(18, (Y0 + Y1) / 2, ylab, { s: 15, rot: -90 }) };
}
var FIG_LIM = (function(){
  var g = graphFrame(50, 10, 70, 10, "Light intensity (arbitrary units)", "Rate of photosynthesis");
  function line(cap, col){
    return '<path d="M' + g.gx(0) + ' ' + g.gy(0) + ' L' + g.gx(cap / 2) + ' ' + g.gy(cap) + ' L' + g.gx(50) + ' ' + g.gy(cap) + '" fill="none" stroke="' + col + '" stroke-width="3.5" stroke-linejoin="round"/>';
  }
  var s = g.s + line(60, BLUE) + line(30, CORAL) + g.close +
    T(g.gx(49), g.gy(60) - 10, "high CO&#8322;", { s: 14, a: "end", c: BLUE }) +
    T(g.gx(49), g.gy(30) - 10, "low CO&#8322;", { s: 14, a: "end", c: "#c0303a" });
  return svg("0 0 384 250", "Graph of rate of photosynthesis against light intensity. Both lines rise together with a gradient of 2. The low carbon dioxide line levels off at a rate of 30, from a light intensity of 15. The high carbon dioxide line levels off at 60, from a light intensity of 30.", s);
})();

var FIG_ISL = svg("0 0 400 150", "Inverse square law: at twice the distance from the lamp the light is spread over four times the area, so the intensity is one quarter",
  '<rect x="10" y="56" width="26" height="38" rx="6" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<path d="M36 64 L330 14 M36 86 L330 136" stroke="' + SUN + '" stroke-width="2" stroke-dasharray="5 5"/>' +
  '<rect x="160" y="47" width="10" height="56" fill="' + CYAN + '" stroke="' + INK + '" stroke-width="2"/>' +
  '<rect x="320" y="14" width="10" height="122" fill="' + CYAN + '" stroke="' + INK + '" stroke-width="2"/>' +
  T(165, 36, "d", { s: 16 }) + T(165, 124, "intensity 1", { s: 14, body: true, w: 400 }) +
  T(290, 70, "2d", { s: 16, a: "end" }) + T(290, 90, "intensity", { s: 14, body: true, w: 400, a: "end" }) + T(290, 108, "&frac14;", { s: 18, a: "end" }));

var FIG_POND = svg("0 0 400 190", "Pondweed practical: a lamp, a metre ruler to set the distance, a beaker of water as a heat shield, and pondweed in a boiling tube giving off bubbles of oxygen",
  /* ruler */
  '<rect x="10" y="160" width="380" height="18" rx="3" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2"/>' +
  (function(){ var s = ""; for(var k = 0; k <= 36; k++) s += L(20 + k * 10, 160, 20 + k * 10, k % 5 ? 166 : 172, INK, 1.2); return s; })() +
  /* lamp */
  '<path d="M30 156 V70" stroke="' + INK + '" stroke-width="4"/><path d="M14 62 h40 l-8 26 h-24 Z" fill="' + INK + '"/>' +
  '<circle cx="34" cy="92" r="9" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/>' +
  '<path d="M50 92 L250 92" stroke="' + SUN + '" stroke-width="3" stroke-dasharray="6 6"/>' +
  /* heat shield beaker */
  '<path d="M120 54 V150 Q120 156 126 156 H166 Q172 156 172 150 V54" fill="#e3f4fb" stroke="' + INK + '" stroke-width="2.5"/>' +
  T(146, 44, "water", { s: 14, body: true, w: 400 }) +
  /* boiling tube */
  '<path d="M252 30 V140 a14 14 0 0 0 28 0 V30" fill="#e3f4fb" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<path d="M266 150 q-8 -20 0 -40 q8 -20 0 -40 M266 120 l-9 -8 M266 100 l9 -8 M266 80 l-9 -8" fill="none" stroke="' + GREEN + '" stroke-width="3" stroke-linecap="round"/>' +
  '<circle cx="268" cy="58" r="3.5" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="1.4"/><circle cx="263" cy="46" r="3" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="1.4"/><circle cx="270" cy="38" r="2.6" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="1.4"/>' +
  L(290, 50, 316, 50, INK, 1.5) + T(320, 55, "count the", { s: 14, body: true, w: 400, a: "start" }) + T(320, 73, "bubbles", { s: 14, body: true, w: 400, a: "start" }) +
  L(290, 120, 316, 120, INK, 1.5) + T(320, 116, "pondweed", { s: 14, body: true, w: 400, a: "start" }) + T(320, 134, "in solution", { s: 14, body: true, w: 400, a: "start" }) +
  L(34, 150, 266, 150, CORAL, 2.5) + arrowL(28, 150, CORAL) + arrowR(272, 150, CORAL) + T(200, 144, "distance", { s: 14, c: "#c0303a" }));

var FIG_HR = (function(){
  var g = graphFrame(12, 2, 180, 20, "Time (minutes)", "Heart rate (beats per minute)");
  var pts = [[0, 70], [2, 70], [5, 140], [7, 140], [11, 70], [12, 70]];
  var d = pts.map(function(p, k){ return (k ? "L" : "M") + g.gx(p[0]) + " " + g.gy(p[1]); }).join(" ");
  var s = '<rect x="' + g.gx(2) + '" y="' + Y1 + '" width="' + (g.gx(7) - g.gx(2)) + '" height="' + (Y0 - Y1) + '" fill="rgba(255,210,63,.25)"/>';
  return svg("0 0 384 250", "Graph of heart rate against time. Resting at 70 beats per minute, exercise from 2 to 7 minutes, rising to 140 beats per minute by 5 minutes, then falling back to 70 by 11 minutes.",
    g.s + s + '<path d="' + d + '" fill="none" stroke="' + CORAL + '" stroke-width="3.5" stroke-linejoin="round"/>' + g.close +
    T(g.gx(4.5), Y1 + 18, "exercise", { s: 14 }));
})();

/* ---------- the greenhouse manager ---------- */
var TEMPS = [10, 15, 20, 25, 30, 35, 40], TCAP = [25, 45, 65, 85, 100, 80, 30];
var PRICE = { l: 3, c: 2, t: 4 };
var LEVELS = [
  { name: "Winter", target: 60, free: 0, best: { l: 6, c: 5, t: 2 },
    intro: "<b>Winter.</b> Dull days, so all your light comes from lamps. Reach a rate of <b>60 or more</b>, spending as little as you can." },
  { name: "Summer", target: 80, free: 8, best: { l: 8, c: 8, t: 3 },
    intro: "<b>Summer.</b> Sunshine gives you light level 8 for free. Reach a rate of <b>80 or more</b>, as cheaply as you can." }
];
function caps(s){ return { l: 10 * s.l, c: 30 + 7 * s.c, t: TCAP[s.t] }; }
function rateOf(s){ var k = caps(s); return Math.min(k.l, k.c, k.t); }
function costOf(s, lv){ return PRICE.l * Math.max(0, s.l - lv.free) + PRICE.c * s.c + PRICE.t * s.t; }
function minCost(lv){ return costOf(lv.best, lv); }
/* cheapest step of each factor that still reaches rate r: anything above it is wasted */
function needFor(r){
  var l = Math.ceil(r / 10 - 1e-9), c = Math.max(0, Math.ceil((r - 30) / 7 - 1e-9)), t = 0;
  while(t < 6 && TCAP[t] < r) t++;
  return { l: l, c: c, t: t };
}
function wasteOf(s, lv){
  var n = needFor(rateOf(s)), w = {};
  w.l = PRICE.l * Math.max(0, Math.max(s.l, lv.free) - Math.max(n.l, lv.free));
  w.c = PRICE.c * Math.max(0, s.c - n.c);
  w.t = PRICE.t * Math.max(0, s.t - n.t);
  w.all = w.l + w.c + w.t;
  return w;
}

function houseSVG(){
  return '<svg id="gSvg" viewBox="0 0 400 230" role="img" aria-label="A greenhouse with a lamp, a carbon dioxide burner, a heater and a plant whose size shows the rate of photosynthesis">' +
    '<rect width="400" height="230" rx="14" fill="#e9f3ff"/>' +
    '<g id="gSun"><circle cx="350" cy="36" r="20" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/></g>' +
    '<rect x="0" y="196" width="400" height="34" fill="#cfe8c4"/>' +
    '<path d="M40 200 V96 L200 30 L360 96 V200 Z" fill="rgba(255,255,255,.55)" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
    L(120, 63, 120, 200, INK, 1.2) + L(200, 30, 200, 200, INK, 1.2) + L(280, 63, 280, 200, INK, 1.2) + L(40, 140, 360, 140, INK, 1.2) +
    '<g id="gLampGlow"></g>' +
    '<path d="M180 48 h40 l-6 14 h-28 Z" fill="' + INK + '"/>' +
    '<circle id="gBulb" cx="200" cy="66" r="7" stroke="' + INK + '" stroke-width="1.5"/>' +
    /* heater */
    '<rect x="300" y="168" width="44" height="30" rx="5" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>' +
    '<path id="gHeat" d="M308 176 h28 M308 183 h28 M308 190 h28" stroke-width="3" stroke-linecap="round"/>' +
    T(322, 160, "", { s: 14, id: "gTemp" }) +
    /* CO2 burner */
    '<rect x="58" y="160" width="26" height="38" rx="6" fill="' + VIOLET + '" stroke="' + INK + '" stroke-width="2"/>' +
    '<g id="gPuffs"></g>' +
    /* pot and plant */
    '<path d="M176 176 h48 l-6 24 h-36 Z" fill="#c8762a" stroke="' + INK + '" stroke-width="2"/>' +
    '<g id="gPlant"></g>' +
    /* gauge */
    '<rect x="10" y="10" width="112" height="44" rx="10" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>' +
    T(66, 28, "RATE", { s: 12 }) + T(66, 48, "0", { s: 18, id: "gRate" }) +
    '</svg>';
}
function plantSVG(r){
  var h = 14 + r * 1.05, s = "", n = Math.max(1, Math.round(r / 12));
  s += '<path d="M200 178 V' + (178 - h) + '" stroke="' + GREEN + '" stroke-width="4" stroke-linecap="round"/>';
  for(var k = 0; k < n; k++){
    var y = 172 - (k + 1) * h / (n + 1), side = k % 2 ? 1 : -1, sz = 9 + r / 14;
    s += '<ellipse cx="' + (200 + side * sz) + '" cy="' + y + '" rx="' + sz + '" ry="' + (sz * 0.45) + '" fill="' + (r ? LEAF : "#d9cf9a") + '" stroke="' + INK + '" stroke-width="1.5" transform="rotate(' + (side * -20) + ' ' + (200 + side * sz) + ' ' + y + ')"/>';
  }
  if(r >= 60){
    var fy = 178 - h;
    s += '<circle cx="200" cy="' + fy + '" r="' + (5 + r / 25) + '" fill="' + (r >= 80 ? CORAL : SUN) + '" stroke="' + INK + '" stroke-width="1.5"/>';
  }
  return s;
}

var GREENHOUSE = {
  type: "widget", topic: "Greenhouses",
  title: "Greenhouse manager",
  html: '<p>You run a greenhouse. Lamps, a carbon dioxide burner and a heater all cost money. Set the sliders, watch the plant, and sell the crop when you think you have hit the target for the lowest cost.</p><p>The red label shows which factor is limiting right now. Money spent on a factor that is not limiting is wasted.</p>',
  report: function(d){
    var lab = { right1: "first go", right2: "second go", shown: "Show me" }, r = d.res || [];
    return "Greenhouse: winter " + (lab[r[0]] || "not done") + ", summer " + (lab[r[1]] || "not done") +
      (d.sales ? "; " + d.sales + " crops sold" : "") + ".";
  },
  mount: function(el, api){
    var d = api.data;
    if(!d.res) d.res = [];
    if(d.lv === undefined) d.lv = 0;
    if(!d.tries) d.tries = [0, 0];
    if(!d.s) d.s = { l: 2, c: 0, t: 1 };
    el.innerHTML =
      '<div class="wpanel">' +
        '<div class="gtabs" id="gTabs"></div>' +
        '<p class="wnote" id="gIntro"></p>' +
        '<div class="ghouse">' + houseSVG() + '</div>' +
        '<div class="readout"><div><small>Rate</small><span class="wbig" id="oRate"></span></div><div><small>Spent</small><span class="wbig" id="oCost"></span></div><div><small>Wasted</small><span class="wbig" id="oWaste"></span></div></div>' +
        '<div class="slrow" id="rowl"><label for="sl">Light</label><span class="sv" id="vl"></span><input type="range" id="sl" min="0" max="10" step="1"><div class="bar"><i></i><b></b></div><span class="cost" id="cl"></span></div>' +
        '<div class="slrow" id="rowc"><label for="sc">Carbon dioxide</label><span class="sv" id="vc"></span><input type="range" id="sc" min="0" max="10" step="1"><div class="bar"><i></i><b></b></div><span class="cost" id="cc"></span></div>' +
        '<div class="slrow" id="rowt"><label for="st">Temperature</label><span class="sv" id="vt"></span><input type="range" id="st" min="0" max="6" step="1"><div class="bar"><i></i><b></b></div><span class="cost" id="ct"></span></div>' +
        '<p class="tiny">Each bar shows the most that factor would allow; the black line is the actual rate. A simple model: the rate is set by whichever factor is in shortest supply.</p>' +
        '<div class="wrow"><button type="button" class="btn btn-orange" id="gSell">Sell the crop</button>' +
        '<button type="button" class="btn btn-quiet hidden" id="gShow">Show me</button>' +
        '<button type="button" class="btn hidden" id="gNext">On to summer</button>' +
        '<button type="button" class="btn btn-quiet hidden" id="gReplay">Play winter again</button></div>' +
        '<div class="gfb" id="gFb" aria-live="polite"></div>' +
      '</div>';
    var q = function(id){ return el.querySelector("#" + id); };
    var sl = { l: q("sl"), c: q("sc"), t: q("st") };
    var fb = q("gFb"), sell = q("gSell"), showB = q("gShow"), nextB = q("gNext"), replayB = q("gReplay");
    var NAME = { l: "light", c: "carbon dioxide", t: "temperature" };

    function lv(){ return LEVELS[d.lv]; }
    function stars(n){
      var s = '<span class="stars" aria-label="' + n + ' of 3 stars">';
      for(var k = 0; k < 3; k++) s += k < n ? "&#9733;" : '<span class="off">&#9733;</span>';
      return s + "</span><br>";
    }
    function draw(){
      var s = d.s, L0 = lv(), k = caps(s), r = rateOf(s), cost = costOf(s, L0), w = wasteOf(s, L0);
      var tabs = "";
      LEVELS.forEach(function(x, n){ tabs += '<span class="' + (n === d.lv ? "on" : d.res[n] ? "won" : "") + '">' + x.name + (d.res[n] ? " &#10003;" : "") + '</span>'; });
      tabs += '<span>Target ' + L0.target + '</span>';
      q("gTabs").innerHTML = tabs;
      q("gIntro").innerHTML = L0.intro;
      sl.l.min = L0.free;
      ["l", "c", "t"].forEach(function(f){ sl[f].value = s[f]; });
      q("vl").textContent = "level " + s.l + (s.l <= L0.free && L0.free ? " (sun)" : "");
      q("vc").textContent = (400 + 100 * s.c) + " ppm";
      q("vt").innerHTML = TEMPS[s.t] + " &deg;C";
      var lowest = Math.min(k.l, k.c, k.t);
      ["l", "c", "t"].forEach(function(f){
        var row = q("row" + f);
        row.classList.toggle("lim", k[f] === lowest);
        row.querySelector(".bar i").style.width = k[f] + "%";
        row.querySelector(".bar b").style.left = "calc(" + r + "% - 1px)";
      });
      var paidL = Math.max(0, s.l - L0.free);
      q("cl").innerHTML = "&pound;" + PRICE.l + " a level" + (L0.free ? " above level " + L0.free : "") + ": &pound;" + PRICE.l * paidL + (w.l ? " (&pound;" + w.l + " wasted)" : "");
      q("cc").innerHTML = "&pound;" + PRICE.c + " per 100 ppm extra: &pound;" + PRICE.c * s.c + (w.c ? " (&pound;" + w.c + " wasted)" : "");
      q("ct").innerHTML = "&pound;" + PRICE.t + " per 5 &deg;C of heating: &pound;" + PRICE.t * s.t + (w.t ? " (&pound;" + w.t + " wasted)" : "") + (s.t >= 5 ? ". Too hot: enzymes start to denature." : "");
      q("cl").classList.toggle("waste", !!w.l); q("cc").classList.toggle("waste", !!w.c); q("ct").classList.toggle("waste", !!w.t);
      q("oRate").textContent = r;
      q("oRate").className = "wbig" + (r < L0.target ? " bad" : "");
      q("oCost").innerHTML = "&pound;" + cost;
      q("oWaste").innerHTML = "&pound;" + w.all;
      q("oWaste").className = "wbig" + (w.all ? " bad" : "");
      /* picture */
      var sunOn = L0.free > 0;
      q("gSun").setAttribute("opacity", sunOn ? 1 : 0.15);
      q("gBulb").setAttribute("fill", paidL > 0 ? SUN : "#8a8a8a");
      var glow = "";
      if(paidL > 0) glow = '<path d="M186 66 L' + (186 - 8 * paidL) + ' 176 H' + (214 + 8 * paidL) + ' L214 66 Z" fill="' + SUN + '" opacity="' + (0.08 + 0.04 * paidL) + '"/>';
      q("gLampGlow").innerHTML = glow;
      q("gHeat").setAttribute("stroke", s.t === 0 ? LINE : s.t >= 5 ? "#c0303a" : CORAL);
      q("gTemp").innerHTML = TEMPS[s.t] + " &deg;C";
      var puffs = "";
      for(var p = 0; p < Math.ceil(s.c / 2); p++) puffs += '<circle cx="' + (71 + (p % 2 ? 8 : -6)) + '" cy="' + (148 - p * 13) + '" r="' + (5 + p) + '" fill="' + VIOLET + '" opacity=".35"/>';
      q("gPuffs").innerHTML = puffs;
      q("gPlant").innerHTML = plantSVG(r);
      q("gRate").textContent = r;
      /* buttons */
      var done = !!d.res[d.lv];
      sell.classList.toggle("hidden", done && !d.replay);
      showB.classList.toggle("hidden", done || !!d.replay || !d.tries[d.lv]);
      nextB.classList.toggle("hidden", !(done && d.lv === 0));
      replayB.classList.toggle("hidden", !(d.res[0] && d.res[1]));
      replayB.textContent = d.lv === 0 ? "Try summer again" : "Play winter again";
    }
    function setRes(r){
      d.res[d.lv] = r;
      api.save();
      if(d.res[0] && d.res[1]){
        var o = "right1";
        d.res.forEach(function(x){ if(x === "shown") o = "shown"; else if(x === "right2" && o === "right1") o = "right2"; });
        api.done(o);
      }
    }
    ["l", "c", "t"].forEach(function(f){
      sl[f].addEventListener("input", function(){
        if(d.res[d.lv] && !d.replay) return draw();
        d.s[f] = +sl[f].value; api.save(); draw();
        if(!d.res[d.lv] || d.replay){
          var r = rateOf(d.s), L0 = lv();
          fb.className = "gfb";
          fb.innerHTML = r >= L0.target ? "Rate " + r + ": target reached. Is anything costing more than it needs to? Sell when you are happy." :
            "Rate " + r + ", target " + L0.target + ". Look for the red <b>limiting</b> label.";
        }
      });
    });
    sell.onclick = function(){
      var s = d.s, L0 = lv(), r = rateOf(s), cost = costOf(s, L0), best = minCost(L0), k = caps(s), w = wasteOf(s, L0);
      d.sales = (d.sales || 0) + 1;
      if(r >= L0.target && cost === best){
        var res = d.tries[d.lv] ? "right2" : "right1";
        fb.className = "gfb good";
        fb.innerHTML = stars(d.tries[d.lv] ? 2 : 3) + "<b>Sold! Rate " + r + " for &pound;" + cost + ", the cheapest way there is.</b> Every factor was raised just far enough and no further, so not a penny was wasted." +
          (d.lv === 1 ? " Notice the heater: 25 &deg;C was enough. Going hotter costs more and, past about 30 &deg;C, actually slows things down." : "");
        d.replay = false;
        setRes(res);
        draw();
        return;
      }
      d.tries[d.lv]++;
      var msg;
      if(r < L0.target){
        var limf = ["l", "c", "t"].filter(function(f){ return k[f] === r; });
        var lim = limf.map(function(f){ return NAME[f]; }).join(" and ");
        msg = "<b>The crop only managed a rate of " + r + "; the target is " + L0.target + ".</b> Right now " + lim + (limf.length > 1 ? " are both" : " is") + " limiting it. Raising anything else would not help.";
        if(s.t >= 5) msg += " It is also too hot: above about 30 &deg;C the enzymes start to denature.";
      }else{
        var wf = ["l", "c", "t"].filter(function(f){ return w[f]; }).map(function(f){ return NAME[f]; });
        msg = "<b>Target hit, but you spent &pound;" + cost + ".</b> " + (wf.length ? "Some of the " + wf.join(" and ") + " is more than the rate needs, which is &pound;" + w.all + " wasted. " : "") +
          "It can be done for less. Try lowering one factor at a time until it becomes limiting at the target.";
        if(!w.all) msg = "<b>Target hit for &pound;" + cost + ", but there is a cheaper mix.</b> You are above the target. Could any factor come down a notch and still reach " + L0.target + "?";
      }
      if(d.tries[d.lv] >= 2){
        d.s = { l: L0.best.l, c: L0.best.c, t: L0.best.t };
        fb.className = "gfb show";
        fb.innerHTML = "<b>Here is the cheapest way.</b> Light level " + L0.best.l + ", " + (400 + 100 * L0.best.c) + " ppm carbon dioxide and " + TEMPS[L0.best.t] + " &deg;C gives a rate of " + rateOf(d.s) + " for &pound;" + minCost(L0) + ". " +
          "The trick: raise each factor only until it stops being the limiting one at the target. Anything more is money for nothing.";
        d.replay = false;
        setRes("shown");
        draw();
        return;
      }
      fb.className = "gfb nudge";
      fb.innerHTML = msg + '<br><span class="tiny">Change the sliders and sell again, or tap Show me.</span>';
      api.save();
      draw();
    };
    showB.onclick = function(){
      var L0 = lv();
      d.tries[d.lv] = 2;
      d.s = { l: L0.best.l, c: L0.best.c, t: L0.best.t };
      fb.className = "gfb show";
      fb.innerHTML = "<b>Here is the cheapest way.</b> Light level " + L0.best.l + ", " + (400 + 100 * L0.best.c) + " ppm carbon dioxide and " + TEMPS[L0.best.t] + " &deg;C gives a rate of " + rateOf(d.s) + " for &pound;" + minCost(L0) + ". " +
        "Raise each factor only until it stops being the limiting one at the target. Anything more is money for nothing.";
      d.replay = false;
      setRes("shown");
      draw();
    };
    nextB.onclick = function(){
      d.lv = 1; d.s = { l: 8, c: 0, t: 1 }; api.save();
      fb.className = "gfb"; fb.innerHTML = "Summer. The sun is doing some of the work now. What is limiting first?";
      draw();
    };
    replayB.onclick = function(){
      d.lv = d.lv === 0 ? 1 : 0; d.replay = true;
      d.s = d.lv ? { l: 8, c: 0, t: 1 } : { l: 2, c: 0, t: 1 };
      api.save();
      fb.className = "gfb"; fb.innerHTML = "Just for fun this time: your score is already saved. Can you find the cheapest mix again?";
      draw();
      sell.classList.remove("hidden");
    };
    /* replay mode: selling just gives feedback */
    var realSell = sell.onclick;
    sell.onclick = function(){
      if(!d.replay) return realSell();
      var s = d.s, L0 = lv(), r = rateOf(s), cost = costOf(s, L0), best = minCost(L0);
      fb.className = "gfb " + (r >= L0.target && cost === best ? "good" : "nudge");
      fb.innerHTML = r < L0.target ? "Rate " + r + ", short of " + L0.target + ". What is limiting?" :
        cost === best ? stars(3) + "<b>Cheapest way found again: &pound;" + cost + ".</b>" : "Target hit for &pound;" + cost + ". The cheapest is &pound;" + best + ". Keep trimming?";
    };
    draw();
    if(d.res[0] && d.res[1]){ fb.className = "gfb good"; fb.innerHTML = "<b>Both seasons done.</b> Replay either one if you like."; }
    else if(d.res[d.lv]){ fb.className = "gfb good"; fb.innerHTML = "<b>Winter done.</b> Summer is next when you are ready."; }
    else fb.innerHTML = d.lv ? "Summer. The sun is doing some of the work now. What is limiting first?" : "Start by spotting the red <b>limiting</b> label. Raising that factor makes the plant grow; raising anything else does nothing.";
  }
};

  /* ---------- RESPIRATION ---------- */
  { type: "learn", topic: "Respiration",
    title: "Releasing energy: with and without oxygen",
    html: '<p><b>Respiration</b> happens in every living cell, all the time. It is <b>exothermic</b>: it transfers energy to the surroundings, and the cell uses that energy. It is not the same as breathing.</p>' +
          '<p><b>Aerobic</b> respiration uses oxygen. It happens mostly in the <b>mitochondria</b>.</p>' +
          '<div class="eqn">glucose + oxygen &rarr; carbon dioxide + water</div>' +
          '<div class="eqn">C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub> &rarr; 6CO<sub>2</sub> + 6H<sub>2</sub>O</div>' +
          '<p><b>Anaerobic</b> respiration happens without enough oxygen. Glucose is only partly broken down, so it transfers <b>much less energy</b>.</p>' +
          '<div class="eqn">In muscles: glucose &rarr; lactic acid</div>' +
          '<div class="eqn">In plants and yeast: glucose &rarr; ethanol + carbon dioxide</div>' +
          '<p>In yeast this is called <b>fermentation</b>. It is used to make <b>bread</b> (the carbon dioxide makes it rise) and <b>alcoholic drinks</b> such as beer and wine (the ethanol).</p>' +
          '<p>Organisms use the energy for: chemical reactions that build bigger molecules, <b>movement</b> (muscle contraction), and <b>keeping warm</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Aerobic: lots of energy, makes CO<sub>2</sub> and water. Anaerobic: less energy, makes lactic acid (muscles) or ethanol and CO<sub>2</sub> (yeast).</div>' },

  { type: "sort", topic: "Respiration",

    cards: [
      ["Needs oxygen", 0],

    why: "Aerobic uses oxygen and releases the most energy. In muscles, anaerobic respiration makes lactic acid, which builds up in tired muscles. Yeast and plant cells make ethanol and carbon dioxide instead; the carbon dioxide is what makes bread dough rise. Note that both aerobic respiration and fermentation make carbon dioxide." },

  { type: "multi", topic: "Respiration",
    q: "Which <b>two</b> statements about respiration are true?",

  /* ---------- EXERCISE ---------- */
  { type: "learn", topic: "Exercise",
    title: "What exercise does to your body",
    fig: FIG_HR,
    html: '<p>During exercise, muscles need more energy, so they respire faster. To get more oxygen to them and take away the extra carbon dioxide:</p>' +
          '<ul><li><b>Heart rate</b> goes up, so blood flows faster.</li>' +
          '<li><b>Breathing rate</b> and <b>breath volume</b> go up, so more oxygen gets into the blood.</li></ul>' +
          '<p>If there is still not enough oxygen, muscles respire <b>anaerobically</b> and lactic acid builds up. During long periods of activity, muscles become <b>fatigued</b> and stop contracting efficiently.</p>' +
          '<p><b>Higher only:</b> the <b>oxygen debt</b> is the extra oxygen the body needs after exercise to react with the lactic acid and remove it from the cells. Blood carries the lactic acid to the <b>liver</b>, where it is converted back into glucose. That is why you keep breathing hard after you stop.</p>' +
          '<div class="keep"><b>Keep this</b>Heart rate, breathing rate and breath volume all go up, to deliver oxygen and remove carbon dioxide.</div>' },

  /* ---------- METABOLISM ---------- */
  { type: "learn", topic: "Metabolism",
    title: "Metabolism and the uses of glucose",
    html: '<p><b>Metabolism</b> is the sum of all the reactions in a cell or the body. The energy from respiration is used to drive many of them. Examples:</p>' +
          '<ul><li>Glucose joined into <b>starch</b> (stored in plants), <b>glycogen</b> (stored in animals) and <b>cellulose</b> (plant cell walls).</li>' +
          '<li>One glycerol and three fatty acids joined to make a <b>lipid</b> molecule.</li>' +
          '<li>Plants combine glucose with <b>nitrate ions</b> to make <b>amino acids</b>, which are joined to make <b>proteins</b>.</li>' +
          '<li><b>Respiration</b> itself.</li>' +
          '<li>Excess protein is broken down to make <b>urea</b>, which is excreted.</li></ul>' +
          '<p>So the glucose a plant makes is used for: <b>respiration</b>; making <b>cellulose</b> for cell walls; making <b>amino acids</b> for proteins (with nitrate from the soil); and storage as <b>starch</b> or as <b>fats and oils</b> (often in seeds). Starch is good for storage because it is <b>insoluble</b>, so it does not affect water moving in and out by osmosis.</p>' +
          '<div class="keep"><b>Keep this</b>Glucose in plants: respiration, cellulose, amino acids, starch, fats and oils.</div>' },
