<script>
(function(){
"use strict";

var INK = "#141a33", TEAL = "#3a5cff", BRIGHT = "#22b8e6", ORANGE = "#ff5d5d",
    YELLOW = "#ffd23f", PLUM = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}

/* ---------- figures ---------- */

/* Ten blocks of 4.50 */
var BLOCKS = (function(){
  var s = '<svg viewBox="0 0 520 160" role="img" aria-label="45 pounds split into ten equal blocks of 4 pounds 50. One block is 10 percent, half a block is 5 percent.">';
  s += t(10, 22, "&pound;45 split into ten equal parts", 20, INK, LAB + ' font-weight="800"');
  for(var k = 0; k < 10; k++){
    var x = 10 + k * 50;
    var fill = k === 0 ? TEAL : WHITE;
    s += '<rect x="' + x + '" y="34" width="50" height="50" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.5"/>';
    if(k === 1) s += '<rect x="' + x + '" y="34" width="25" height="50" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="2.5"/>';
    if(k !== 1) s += t(x + 25, 65, "4.50", 16, k === 0 ? WHITE : INK, BODY + ' text-anchor="middle"');
  }
  s += t(35, 108, "10%", 20, TEAL, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(76, 108, "5%", 20, ORANGE, LAB + ' font-weight="800" text-anchor="middle"');
  s += t(510, 108, "100% = &pound;45", 19, INK, BODY + ' text-anchor="end"');
  s += t(10, 145, "10% = 4.50    5% = 2.25    1% = 0.45", 20, INK, BODY + ' xml:space="preserve"');
  s += '</svg>';
  return s;
})();

/* Multiplier bars */
var MULT =
'<svg viewBox="0 0 520 150" role="img" aria-label="Bars showing 100 percent is times 1, up 15 percent is times 1.15, down 20 percent is times 0.8">' +
t(6, 40, "Original", 19, INK, LAB + ' font-weight="800"') +
'<rect x="120" y="18" width="300" height="30" rx="4" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(270, 40, "100% = &times; 1", 18, WHITE, BODY + ' text-anchor="middle" font-weight="700"') +
t(6, 86, "Up 15%", 19, INK, LAB + ' font-weight="800"') +
'<rect x="120" y="64" width="300" height="30" rx="4" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="420" y="64" width="45" height="30" rx="4" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(270, 86, "115% = &times; 1.15", 18, WHITE, BODY + ' text-anchor="middle" font-weight="700"') +
t(6, 132, "Down 20%", 19, INK, LAB + ' font-weight="800"') +
'<rect x="120" y="110" width="240" height="30" rx="4" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="360" y="110" width="60" height="30" rx="4" fill="none" stroke="' + ORANGE + '" stroke-width="2.5" stroke-dasharray="6 5"/>' +
t(240, 132, "80% = &times; 0.8", 18, WHITE, BODY + ' text-anchor="middle" font-weight="700"') +
'</svg>';

/* Percentage change */
var CHANGE =
'<svg viewBox="0 0 520 130" role="img" aria-label="Bought for 40 pounds, sold for 30 pounds, a change of minus 10. 10 divided by 40 is 0.25, a 25 percent decrease.">' +
'<rect x="10" y="14" width="150" height="58" rx="14" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="3"/>' +
t(85, 37, "OLD (original)", 15, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(85, 62, "&pound;40", 20, INK, LAB + ' font-weight="800" text-anchor="middle"') +
'<rect x="360" y="14" width="150" height="58" rx="14" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>' +
t(435, 37, "NEW", 15, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(435, 62, "&pound;30", 20, INK, LAB + ' font-weight="800" text-anchor="middle"') +
'<path d="M168 43 H350" stroke="' + INK + '" stroke-width="3"/><path d="M340 35 L351 43 L340 51" fill="none" stroke="' + INK + '" stroke-width="3"/>' +
t(260, 33, "change: &minus;&pound;10", 18, ORANGE, BODY + ' font-weight="700" text-anchor="middle"') +
t(260, 110, "10 &divide; 40 = 0.25, so a 25% decrease", 21, INK, BODY + ' font-weight="700" text-anchor="middle"') +
'</svg>';

/* Ratio bar model */
var RATIO = (function(){
  var s = '<svg viewBox="0 0 520 140" role="img" aria-label="Bar model: 40 pounds shared in the ratio 3 to 2. Five parts of 8 pounds: three parts make 24 pounds, two parts make 16 pounds.">';
  s += t(260, 22, "&pound;40 shared in the ratio 3 : 2", 20, INK, LAB + ' font-weight="800" text-anchor="middle"');
  for(var k = 0; k < 5; k++){
    var x = 35 + k * 90;
    s += '<rect x="' + x + '" y="34" width="90" height="46" fill="' + (k < 3 ? TEAL : ORANGE) + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(x + 45, 64, "&pound;8", 20, WHITE, LAB + ' font-weight="800" text-anchor="middle"');
  }
  s += '<path d="M37 90 V98 H303 V90" fill="none" stroke="' + TEAL + '" stroke-width="2.5"/>';
  s += '<path d="M307 90 V98 H483 V90" fill="none" stroke="' + ORANGE + '" stroke-width="2.5"/>';
  s += t(170, 126, "3 parts = &pound;24", 20, TEAL, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(395, 126, "2 parts = &pound;16", 20, ORANGE, BODY + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Best buy bottles */
function bottle(x, h, col){
  var top = 130 - h;
  return '<path d="M' + (x + 12) + ' ' + top + ' h16 v12 q14 8 14 24 V130 h-44 V' + (top + 36) + ' q0 -16 14 -24 Z" fill="' + col + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
}
var BOTTLES =
'<svg viewBox="0 0 520 200" role="img" aria-label="A 500 millilitre bottle for 1 pound 20 costs 24p per 100 millilitres. A 1.5 litre bottle for 3 pounds 15 costs 21p per 100 millilitres, which is better value.">' +
bottle(110, 70, BRIGHT) + bottle(370, 115, BRIGHT) +
t(130, 156, "500 ml for &pound;1.20", 19, INK, BODY + ' text-anchor="middle" font-weight="700"') +
t(390, 156, "1.5 litres for &pound;3.15", 19, INK, BODY + ' text-anchor="middle" font-weight="700"') +
t(130, 186, "1.20 &divide; 5 = 24p per 100 ml", 17, INK, BODY + ' text-anchor="middle"') +
t(390, 186, "3.15 &divide; 15 = 21p per 100 ml", 17, TEAL, BODY + ' text-anchor="middle" font-weight="700"') +
t(470, 60, "better", 18, TEAL, LAB + ' font-weight="800" text-anchor="middle"') +
t(470, 80, "value", 18, TEAL, LAB + ' font-weight="800" text-anchor="middle"') +
'</svg>';

/* Compound chain */
var CHAIN = (function(){
  var vals = ["&pound;1000", "&pound;1020", "&pound;1040.40", "&pound;1061.21"];
  var s = '<svg viewBox="0 0 520 120" role="img" aria-label="1000 pounds times 1.02 is 1020, times 1.02 is 1040.40, times 1.02 is 1061.21 after three years.">';
  for(var k = 0; k < 4; k++){
    var x = 4 + k * 130;
    s += '<rect x="' + x + '" y="34" width="104" height="44" rx="10" fill="' + (k === 3 ? YELLOW : WHITE) + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(x + 52, 62, vals[k], 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
    s += t(x + 52, 102, "year " + k, 17, INK, BODY + ' text-anchor="middle"');
    if(k < 3){
      s += '<path d="M' + (x + 106) + ' 56 H' + (x + 128) + '" stroke="' + TEAL + '" stroke-width="3"/>';
      s += '<path d="M' + (x + 121) + ' 50 L' + (x + 128) + ' 56 L' + (x + 121) + ' 62" fill="none" stroke="' + TEAL + '" stroke-width="3"/>';
      s += t(x + 117, 24, "&times;1.02", 16, TEAL, LAB + ' font-weight="800" text-anchor="middle"');
    }
  }
  s += '</svg>';
  return s;
})();

/* ---------- the multiplier machine widget ---------- */
var CH = [
  { from: 80, to: 92, p: 15,
    ctx: "Last year a gig ticket cost &pound;80. This year the same ticket costs &pound;92.",
    hint: "The price went up by &pound;12. What percentage of &pound;80 is &pound;12? 10% of 80 is 8, and 5% is 4.",
    why: "Change: 92 &minus; 80 = 12. As a fraction of the original: 12 &divide; 80 = 0.15, which is 15%. So the multiplier is 1 + 0.15 = <b>1.15</b>. Shortcut: new &divide; old = 92 &divide; 80 = 1.15." },
  { from: 60, to: 45, p: -25,
    ctx: "A pair of trainers cost &pound;60. In the sale they cost &pound;45.",
    hint: "The price went down by &pound;15. What fraction of &pound;60 is &pound;15?",
    why: "Change: 45 &minus; 60 = &minus;15. Then 15 &divide; 60 = 0.25, a 25% decrease. Multiplier 1 &minus; 0.25 = <b>0.75</b>. Shortcut: 45 &divide; 60 = 0.75." },
  { from: 150, to: 162, p: 8,
    ctx: "You put &pound;150 into a savings account. A year later it has grown to &pound;162.",
    hint: "It grew by &pound;12. 10% of 150 is 15, so it is a bit less than 10%. 1% of 150 is 1.50.",
    why: "Change: 162 &minus; 150 = 12. Then 12 &divide; 150 = 0.08, which is 8%. Multiplier <b>1.08</b>. Shortcut: 162 &divide; 150 = 1.08." }
];

function dec(x){ return String(parseFloat(x.toFixed(2))); }
function gbp(v){ return "&pound;" + (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2)); }
function gbp2(v){ return "&pound;" + v.toFixed(2); }

function mountMachine(el, api){
  var d = api.data;
  if(typeof d.p !== "number") d.p = 0;
  if(typeof d.c !== "number") d.c = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  var view = d.c;           // which challenge is on screen (lags d.c while feedback shows)

  el.innerHTML =
    '<div class="wpanel mm-task" data-r="task"></div>' +
    '<div class="mm-svg" data-r="svg"></div>' +
    '<div class="wpanel">' +
      '<div class="wrow mm-read"><span>Percentage change</span><span class="wbig" data-r="pct"></span></div>' +
      '<input type="range" id="mmRange" min="-50" max="50" step="1" aria-label="Percentage change">' +
      '<div class="mm-ticks"><span>&minus;50%</span><span>0</span><span>+50%</span></div>' +
      '<p class="wnote" data-r="mult"></p>' +
      '<div class="wrow mm-btns">' +
        '<button class="btn btn-quiet" type="button" data-r="down" aria-label="Down 1 percent">&minus;1</button>' +
        '<button class="btn btn-quiet" type="button" data-r="up" aria-label="Up 1 percent">+1</button>' +
        '<button class="btn" type="button" data-r="lock">Lock it in</button>' +
        '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
      '</div>' +
    '</div>' +
    '<div class="fb mm-fb hidden" data-r="fb" aria-live="polite"></div>';

  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  var range = el.querySelector("#mmRange");
  range.value = d.p;

  function base(){ return view < 3 ? CH[view].from : 100; }

  function svg(){
    var m = 1 + d.p / 100, b = base(), nv = b * m;
    var W = 150, x0 = 70;
    var aw = W * m;
    var col = d.p > 0 ? TEAL : d.p < 0 ? ORANGE : INK;
    var s = '<svg viewBox="0 0 360 186" role="img" aria-label="Multiplier machine: ' + b + ' pounds times ' + dec(m) + ' makes ' + nv.toFixed(2) + ' pounds">';
    // input tag
    s += '<rect x="4" y="18" width="84" height="44" rx="10" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(46, 47, gbp(b), 18, INK, LAB + ' font-weight="800" text-anchor="middle"');
    s += '<path d="M90 40 H116" stroke="' + INK + '" stroke-width="3"/><path d="M109 33 L117 40 L109 47" fill="none" stroke="' + INK + '" stroke-width="3"/>';
    // machine
    s += '<rect x="120" y="6" width="120" height="68" rx="14" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="3"/>';
    s += t(180, 24, "MULTIPLIER", 11, WHITE, LAB + ' font-weight="800" text-anchor="middle" letter-spacing="1.5"');
    s += t(180, 58, "&times; " + dec(m), 26, WHITE, LAB + ' font-weight="900" text-anchor="middle"');
    s += '<path d="M242 40 H268" stroke="' + INK + '" stroke-width="3"/><path d="M261 33 L269 40 L261 47" fill="none" stroke="' + INK + '" stroke-width="3"/>';
    // output tag
    s += '<rect x="272" y="18" width="84" height="44" rx="10" fill="' + WHITE + '" stroke="' + col + '" stroke-width="3"/>';
    s += t(314, 47, gbp2(nv), 17, INK, LAB + ' font-weight="800" text-anchor="middle"');
    // bars
    s += t(4, 116, "Before", 14, INK, LAB + ' font-weight="800"');
    s += '<rect x="' + x0 + '" y="96" width="' + W + '" height="28" rx="4" fill="' + INK + '" opacity=".82"/>';
    s += t(x0 + W - 8, 115, gbp(b), 14, WHITE, BODY + ' text-anchor="end" font-weight="700"');
    s += t(4, 160, "After", 14, INK, LAB + ' font-weight="800"');
    var showTarget = view < 3 && (d.miss[view] > 0 || d.shown[view]);
    if(showTarget){
      var tw = W * CH[view].to / CH[view].from;
      s += '<rect x="' + x0 + '" y="136" width="' + tw.toFixed(1) + '" height="34" rx="5" fill="none" stroke="' + PLUM + '" stroke-width="2.5" stroke-dasharray="6 4"/>';
      s += t(x0 + tw + 6, 182, "target", 12, PLUM, LAB + ' font-weight="800"');
    }
    s += '<rect x="' + x0 + '" y="139" width="' + aw.toFixed(1) + '" height="28" rx="4" fill="' + col + '"/>';
    s += t(x0 + aw - 8, 158, gbp2(nv), 14, WHITE, BODY + ' text-anchor="end" font-weight="700"');
    s += '</svg>';
    return s;
  }

  function task(){
    var dots = '<div class="mm-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 3){
      return dots + '<p><b>Free play.</b> All three challenges done. Slide it around if you like and watch how the multiplier and the bar move together.</p>';
    }
    var c = CH[view];
    return dots + '<p class="tiny" style="margin:0 0 4px">Challenge ' + (view + 1) + ' of 3</p><p>' + c.ctx + '</p>' +
      '<p><b>Set the machine so ' + gbp(c.from) + ' becomes ' + gbp(c.to) + '</b>, then tap Lock it in.</p>';
  }

  function draw(){
    var m = 1 + d.p / 100;
    q("task").innerHTML = task();
    q("svg").innerHTML = svg();
    q("pct").innerHTML = (d.p > 0 ? "+" : d.p < 0 ? "&minus;" : "") + Math.abs(d.p) + "%";
    var sign = d.p < 0 ? " &minus; " : " + ";
    q("mult").innerHTML = (d.p === 0 ? "No change: multiplier <b>1</b>" :
      "Multiplier: 1" + sign + dec(Math.abs(d.p) / 100) + " = <b>" + dec(m) + "</b>") +
      "<br>" + gbp(base()) + " &times; " + dec(m) + " = <b>" + gbp2(base() * m) + "</b>";
    range.value = d.p;
    var waiting = view !== d.c || d.c >= 3;
    q("lock").disabled = waiting;
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }

  function set(p){
    d.p = Math.max(-50, Math.min(50, p));
    draw(); api.save();
  }

  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }

  function fb(cls, html){
    var f = q("fb");
    f.className = "fb mm-fb " + cls;
    f.innerHTML = html;
  }

  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last){ d.result = result(); }
    api.save();
    var head = how === "shown" ? "<b>Here is how this one works.</b> " : "<b>Yes, that is it.</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All three done. Spot the shortcut in every one: <b>new &divide; old</b> gives the multiplier straight away.</p>' +
      '<button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next challenge</button>';
    fb(how === "shown" ? "show" : "good", head + CH[k].why + more);
    q("next").onclick = function(){
      view = d.c; d.p = 0; api.save();
      q("fb").className = "fb mm-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }

  range.addEventListener("input", function(){ set(parseInt(range.value, 10)); });
  q("down").onclick = function(){ set(d.p - 1); };
  q("up").onclick = function(){ set(d.p + 1); };
  q("lock").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    var c = CH[view];
    if(d.p === c.p){ solved(view, "right"); return; }
    d.miss[view]++;
    api.save();
    var now = c.from * (1 + d.p / 100);
    var dir = now > c.to ? "Too high, so the multiplier needs to be smaller." : "Too low, so the multiplier needs to be bigger.";
    fb("nudge", "<b>Not quite yet.</b> That makes " + gbp2(now) + ". " + dir + " " + c.hint +
      '<br><span class="tiny">The dashed outline shows where the After bar needs to reach.</span>');
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    d.shown[view] = true;
    d.p = CH[view].p;
    solved(view, "shown");
  };

  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three challenges done.</b> The shortcut to remember: new &divide; old gives the multiplier.");
    api.done(d.result);
  }
}

EGW.run({
  id: "maths-money",
  title: "Percentages and money",
  subject: "Maths",
  mins: 50,
  blurb: "Percentages turn up all over both Foundation papers, usually wrapped in money. This builds them up from 10% with no calculator, then multipliers, percentage change, ratio and best buys, with stretch questions on reverse percentages and compound interest.",
  steps: [

  /* ---------- NO CALCULATOR ---------- */
  { type: "learn", topic: "No calculator",
    title: "Build any percentage from 10%",
    fig: BLOCKS,
    html: '<p>No calculator? Every percentage can be built from a few easy pieces.</p>' +
          '<ul>' +
          '<li><b>10%</b>: divide by 10. 10% of &pound;45 is &pound;4.50.</li>' +
          '<li><b>5%</b>: half of 10%. That is &pound;2.25.</li>' +
          '<li><b>1%</b>: divide by 100. That is &pound;0.45.</li>' +
          '<li><b>50%</b> is a half, <b>25%</b> is a quarter.</li>' +
          '</ul>' +
          '<p>Then add up the pieces you need. 35% = 10% + 10% + 10% + 5%, so 35% of &pound;45 = 4.50 + 4.50 + 4.50 + 2.25 = <b>&pound;15.75</b>.</p>' +
          '<div class="keep"><b>Keep this</b>10% is divide by 10. 1% is divide by 100. Build everything else from those, and write each piece down so the examiner can see your method.</div>' },

  { type: "num", topic: "No calculator",
    q: "A hoodie costs &pound;38. Without a calculator, find 15% of &pound;38. Fill in each building block.",
    boxes: [
      { label: "10% of &pound;38", a: 3.8, pre: "&pound;", show: "3.80" },
      { label: "5% of &pound;38", a: 1.9, pre: "&pound;", show: "1.90" },
      { label: "15% of &pound;38", a: 5.7, pre: "&pound;", show: "5.70" }
    ],
    hint: "10% means divide by 10. 5% is half of whatever you got for 10%. Then add them.",
    why: "10% is 38 &divide; 10 = &pound;3.80. 5% is half of that, &pound;1.90. 15% = 10% + 5% = 3.80 + 1.90 = <b>&pound;5.70</b>." },

  { type: "sort", topic: "No calculator",
    q: "Each of these works out to &pound;6, &pound;3 or 60p. Sort them by their answer.",
    buckets: ["&pound;6", "&pound;3", "60p"],
    cards: [
      ["10% of &pound;60", 0],
      ["50% of &pound;12", 0],
      ["20% of &pound;30", 0],
      ["5% of &pound;60", 1],
      ["1% of &pound;300", 1],
      ["25% of &pound;12", 1],
      ["1% of &pound;60", 2],
      ["50% of &pound;1.20", 2],
      ["2% of &pound;30", 2]
    ],
    hint: "Find 10% or 1% first each time. For 20%, double the 10%. For 25%, find a quarter.",
    why: "&pound;6: 10% of 60 = 6, half of 12 = 6, 20% of 30 = 2 &times; 3 = 6.<br>&pound;3: 5% of 60 is half of 6 = 3, 1% of 300 = 3, a quarter of 12 = 3.<br>60p: 1% of 60 = 0.60, half of 1.20 = 0.60, and 1% of 30 is 0.30 so 2% is 0.60." },

  { type: "num", topic: "No calculator",
    q: "A games console costs &pound;300. In a sale it has 17% off. Without a calculator, work out:",
    boxes: [
      { label: "a) the discount", a: 51, pre: "&pound;" },
      { label: "b) the sale price", a: 249, pre: "&pound;" }
    ],
    hint: "17% = 10% + 5% + 1% + 1%. Find each piece of &pound;300, then add them. The sale price is what is left after the discount.",
    why: "10% of 300 = 30. 5% = 15. 1% = 3, so 2% = 6. 17% = 30 + 15 + 6 = <b>&pound;51</b>.<br>Sale price: 300 &minus; 51 = <b>&pound;249</b>. A common slip is to stop at the discount: read the question again to see which one it wants." },

  /* ---------- MULTIPLIERS ---------- */
  { type: "learn", topic: "Multipliers",
    title: "Multipliers: one calculation does the lot",
    fig: MULT,
    html: '<p>With a calculator, turn the percentage into a decimal and multiply. 100% is the whole thing, which is <b>1</b>.</p>' +
          '<ul>' +
          '<li><b>Find 23% of &pound;64</b>: 0.23 &times; 64 = &pound;14.72.</li>' +
          '<li><b>Increase by 15%</b>: you end up with 115%, so &times; 1.15.</li>' +
          '<li><b>Decrease by 20%</b>: you end up with 80%, so &times; 0.8.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Increase: 1 + the percentage as a decimal. Decrease: 1 &minus; the percentage as a decimal. Careful: 5% is 0.05, so up 5% is &times; 1.05, not 1.5.</div>' },

  { type: "match", topic: "Multipliers",
    q: "Match each change to its multiplier.",
    pairs: [
      ["Increase by 15%", "1.15"],
      ["Decrease by 20%", "0.8"],
      ["Increase by 5%", "1.05"],
      ["Decrease by 5%", "0.95"],
      ["Increase by 50%", "1.5"],
      ["Decrease by 3%", "0.97"]
    ],
    hint: "Write the percentage as a decimal first (5% is 0.05, 3% is 0.03). Increases are bigger than 1, decreases are smaller than 1.",
    why: "15% = 0.15, so up is 1.15. 20% = 0.2, so down is 0.8. 5% = 0.05: up 1.05, down 0.95. 50% = 0.5, up 1.5. 3% = 0.03, down 0.97.<br>The classic mix up is 1.5 for a 5% increase. 1.5 is a 50% increase." },

  { type: "widget", topic: "Multipliers",
    title: "The multiplier machine",
    html: "Slide the percentage change and watch the multiplier and the price change together. Then have a go at the three challenges.",
    mount: mountMachine,
    report: function(d){
      if(!d || !d.result) return "Multiplier machine: " + (d && d.c ? d.c : 0) + " of 3 challenges done.";
      var lab = { right1: "all three first go", right2: "all three, with some second goes", shown: "finished, used Show me on at least one" }[d.result];
      return "Multiplier machine: " + lab + " (misses " + (d.miss || []).join("/") + ").";
    } },

  { type: "multi", topic: "Multipliers",
    q: "A jacket costs &pound;85. In a sale it has 30% off. Which <b>two</b> calculations give the sale price?",
    options: [
      "85 &times; 0.7",
      "85 &times; 0.3",
      "85 &minus; 85 &times; 0.3",
      "85 &minus; 30",
      "85 &times; 1.3"
    ],
    answers: [0, 2],
    hint: "After 30% off, what percentage of the price is left to pay?",
    why: "30% off leaves 70%, so 85 &times; 0.7 = &pound;59.50. Or find the discount, 85 &times; 0.3 = &pound;25.50, and take it away: 85 &minus; 25.50 = &pound;59.50.<br>85 &times; 0.3 is just the discount, 85 &minus; 30 takes away &pound;30 not 30%, and 85 &times; 1.3 is a 30% increase." },

  { type: "num", topic: "Multipliers",
    q: "You earn &pound;7.50 an hour at a part time job. Use a calculator if you like.<br>a) Your pay goes up by 4%. What is your new hourly pay?<br>b) At the new rate you work 14 hours a week and put 12% of your pay into savings. How much do you save each week? Give your answer to the nearest penny.",
    boxes: [
      { label: "a) new hourly pay", a: 7.8, pre: "&pound;", show: "7.80" },
      { label: "b) saved each week", a: 13.10, tol: 0.006, pre: "&pound;", show: "13.10" }
    ],
    hint: "a) Up 4% is &times; 1.04. b) First find a week's pay at the new rate, then 12% of that is &times; 0.12.",
    why: "a) 7.50 &times; 1.04 = <b>&pound;7.80</b>.<br>b) A week's pay: 7.80 &times; 14 = &pound;109.20. Savings: 109.20 &times; 0.12 = 13.104, which is <b>&pound;13.10</b> to the nearest penny." },

  /* ---------- PERCENTAGE CHANGE ---------- */
  { type: "learn", topic: "Percentage change",
    title: "Percentage change: the change over the original",
    fig: CHANGE,
    html: '<p>To say how much something went up or down <b>as a percentage</b>:</p>' +
          '<p style="text-align:center;font-size:1.1rem"><b>percentage change = (new &minus; old) &divide; old &times; 100</b></p>' +
          '<p>You bought a game for &pound;40 and sold it for &pound;30. Change: 30 &minus; 40 = &minus;10. Then 10 &divide; 40 = 0.25, so it lost <b>25%</b>.</p>' +
          '<div class="keep"><b>Keep this</b>Always divide by the <b>original</b> amount, the one you started with. Profit and loss work the same way.</div>' },

  { type: "order", topic: "Percentage change",
    q: "Put the steps for finding a percentage change in order.",
    items: [
      "Find the difference: new amount minus original amount",
      "Divide the difference by the original amount",
      "Multiply by 100 to turn it into a percentage",
      "Say whether it is an increase or a decrease"
    ],
    hint: "You cannot divide the difference until you have found it. The percentage comes near the end.",
    why: "Difference, divide by the original, times 100, then say which way it went. Saying increase or decrease matters: the examiner wants to know which." },

  { type: "num", topic: "Percentage change",
    q: "Your savings went from &pound;250 to &pound;290. What is the percentage increase?",
    boxes: [ { label: "Percentage increase", a: 16, post: "%" } ],
    hint: "Find how much it went up by first. Then divide that by the amount you started with.",
    why: "Change: 290 &minus; 250 = 40. Then 40 &divide; 250 = 0.16, and 0.16 &times; 100 = <b>16%</b>.<br>Check with a multiplier: 250 &times; 1.16 = 290. Dividing by 290 instead of 250 gives about 13.8%, which is the most common slip." },

  { type: "mc", topic: "Percentage change",
    q: "A ticket price falls from &pound;50 to &pound;40. Later it goes back up from &pound;40 to &pound;50. Which is true?",
    options: [
      "Both changes are 20%",
      "Both changes are 25%",
      "It fell by 20% and rose by 25%",
      "It fell by 25% and rose by 20%"
    ],
    answer: 2,
    hint: "Both changes are &pound;10. But what is the original amount each time?",
    why: "Fall: 10 &divide; 50 = 0.2, so 20%. Rise: 10 &divide; 40 = 0.25, so 25%. Same &pound;10, different original, different percentage. This is why it matters which number you divide by." },

  /* ---------- RATIO ---------- */
  { type: "learn", topic: "Ratio",
    title: "Ratio: simplify, then share",
    fig: RATIO,
    html: '<p><b>Simplify</b> a ratio like a fraction: divide every part by the highest common factor. 12 : 18 &rarr; divide by 6 &rarr; <b>2 : 3</b>.</p>' +
          '<p><b>Share</b> an amount in a ratio in three moves:</p>' +
          '<ul>' +
          '<li>Add the parts: 3 + 2 = 5 parts.</li>' +
          '<li>Find one part: &pound;40 &divide; 5 = &pound;8.</li>' +
          '<li>Multiply: 3 &times; 8 = &pound;24 and 2 &times; 8 = &pound;16.</li>' +
          '</ul>' +
          '<div class="keep"><b>Keep this</b>Add the parts, find one part, multiply. Then check: 24 + 16 = 40, so the shares add back to the total.</div>' },

  { type: "num", topic: "Ratio",
    q: "Write the ratio 24 : 36 in its simplest form.",
    boxes: [
      { label: "First number", a: 2 },
      { label: "Second number", a: 3, pre: ":" }
    ],
    hint: "What is the biggest number that divides into both 24 and 36? If you halve first, you may need to keep going.",
    why: "The highest common factor of 24 and 36 is 12. 24 &divide; 12 = 2 and 36 &divide; 12 = 3, so <b>2 : 3</b>.<br>12 : 18 or 4 : 6 are on the way there, but not the simplest form yet." },

  { type: "num", topic: "Ratio",
    q: "Two friends win &pound;72 in a gaming tournament. They share it in the ratio 5 : 3.",
    boxes: [
      { label: "One part is worth", a: 9, pre: "&pound;" },
      { label: "Larger share", a: 45, pre: "&pound;" },
      { label: "Smaller share", a: 27, pre: "&pound;" }
    ],
    hint: "How many parts are there altogether? Share the &pound;72 between that many parts first.",
    why: "5 + 3 = 8 parts. One part: 72 &divide; 8 = <b>&pound;9</b>. Shares: 5 &times; 9 = <b>&pound;45</b> and 3 &times; 9 = <b>&pound;27</b>. Check: 45 + 27 = 72." },

  /* ---------- BEST BUY ---------- */
  { type: "learn", topic: "Best buy",
    title: "Best buy: compare the price of one unit",
    fig: BOTTLES,
    html: '<p>Bigger packs are not always better value. To compare fairly, work out the <b>price for the same amount</b> of each one: per gram, per 100 ml, per GB.</p>' +
          '<p>500 ml for &pound;1.20 is 24p per 100 ml. 1.5 litres (1500 ml) for &pound;3.15 is 21p per 100 ml. So the big bottle is better value.</p>' +
          '<div class="keep"><b>Keep this</b>Same units first (litres into ml, kg into g). Then lowest price per unit wins. Always write the per unit values down and say which is the best buy.</div>' },

  { type: "mc", topic: "Best buy",
    q: "Three phone data add ons: <b>10 GB for &pound;8</b>, <b>30 GB for &pound;21</b> and <b>50 GB for &pound;37.50</b>. Which is the best value?",
    options: [
      "10 GB for &pound;8",
      "30 GB for &pound;21",
      "50 GB for &pound;37.50",
      "They are all the same value"
    ],
    answer: 1,
    hint: "Work out the price of 1 GB in each deal: divide the price by the number of GB.",
    why: "Price per GB: 8 &divide; 10 = 80p, 21 &divide; 30 = 70p, 37.50 &divide; 50 = 75p. The <b>30 GB</b> deal is the cheapest per GB, even though the 50 GB deal is the biggest." },

  /* ---------- STRETCH ---------- */
  { type: "learn", topic: "Working backwards", stretch: true,
    title: "Stretch: working backwards, and repeated change",
    fig: CHAIN,
    html: '<p><b>Reverse percentages.</b> Trainers cost &pound;68 after 20% off. What was the price before? The sale price is 80% of the original, so original &times; 0.8 = 68. Undo it: 68 &divide; 0.8 = <b>&pound;85</b>.</p>' +
          '<p>The trap: 20% of 68 is 13.60, and 68 + 13.60 = &pound;81.60. Wrong, because the 20% was taken off &pound;85, not off &pound;68.</p>' +
          '<p><b>Compound interest</b> adds interest on top of interest. &pound;1000 at 2% a year for 3 years: 1000 &times; 1.02&sup3; = &pound;1061.21. <b>Depreciation</b> is the same idea going down: losing 10% a year is &times; 0.9 every year.</p>' +
          '<div class="keep"><b>Keep this</b>Reverse: divide by the multiplier. Repeated change: amount &times; multiplier<sup>number of years</sup>.</div>' },

  { type: "num", topic: "Working backwards", stretch: true,
    q: "In a 25% off sale, a pair of headphones costs &pound;54. What was the price before the sale?",
    boxes: [ { label: "Original price", a: 72, pre: "&pound;" } ],
    hint: "After 25% off, what percentage of the original is &pound;54? Write that as a multiplier, then undo it.",
    why: "25% off leaves 75%, so original &times; 0.75 = 54. Undo: 54 &divide; 0.75 = <b>&pound;72</b>. Check: 72 &times; 0.75 = 54.<br>Adding 25% of 54 back on gives &pound;67.50, which is the trap." },

  { type: "num", topic: "Working backwards", stretch: true,
    q: "You put &pound;500 in a savings account paying 3% compound interest per year. You leave it for 4 years.",
    boxes: [
      { label: "a) Amount after 4 years", a: 562.75, tol: 0.006, pre: "&pound;", show: "562.75" },
      { label: "b) Interest earned", a: 62.75, tol: 0.006, pre: "&pound;", show: "62.75" }
    ],
    hint: "Up 3% is &times; 1.03. You do that once for every year, so 4 times. The power button on a calculator does it in one go.",
    why: "a) 500 &times; 1.03<sup>4</sup> = 562.754..., which is <b>&pound;562.75</b>.<br>b) 562.75 &minus; 500 = <b>&pound;62.75</b>.<br>Simple interest would give 4 &times; &pound;15 = &pound;60. Compound gives a bit more because each year's interest earns interest too." },

  { type: "num", topic: "Working backwards", stretch: true,
    q: "An electric scooter costs &pound;400. It loses 15% of its value every year. What is it worth after 3 years?",
    boxes: [ { label: "Value after 3 years", a: 245.65, tol: 0.006, pre: "&pound;", show: "245.65" } ],
    hint: "Losing 15% leaves 85% each year. What is the multiplier, and how many times do you use it?",
    why: "Multiplier: 1 &minus; 0.15 = 0.85. Three years: 400 &times; 0.85&sup3; = 400 &times; 0.614125 = <b>&pound;245.65</b>.<br>Taking 45% off in one go gives &pound;220, which is too low: each year's 15% is taken from a smaller amount." },

  { type: "num", topic: "Working backwards", stretch: true,
    q: "Two friends run a stall and share the profit in the ratio 7 : 4. One of them gets &pound;27 more than the other. How much profit did they make altogether?",
    boxes: [
      { label: "One part is worth", a: 9, pre: "&pound;" },
      { label: "Total profit", a: 99, pre: "&pound;" }
    ],
    hint: "The difference between the shares is 7 parts minus 4 parts. How many parts is that, and what is it worth?",
    why: "The difference is 7 &minus; 4 = 3 parts, and that is &pound;27. So one part = 27 &divide; 3 = <b>&pound;9</b>. Altogether there are 7 + 4 = 11 parts: 11 &times; 9 = <b>&pound;99</b>.<br>Check: 63 and 36, and 63 &minus; 36 = 27." },

  /* ---------- EXAM STYLE ---------- */
  { type: "num", topic: "Exam style",
    q: "<p>You want the same phone on a 24 month contract. There are two deals.</p>" +
       "<p><b>Deal A:</b> pay &pound;180 up front, then &pound;12 a month.<br><b>Deal B:</b> nothing up front, &pound;22 a month, with 10% off the monthly price for the first 12 months.</p>" +
       "<p>Work through it in parts.</p>",
    boxes: [
      { label: "a) Total cost of Deal A", a: 468, pre: "&pound;" },
      { label: "b) Deal B monthly price for the first 12 months", a: 19.8, pre: "&pound;", show: "19.80" },
      { label: "c) Total cost of Deal B", a: 501.6, pre: "&pound;", show: "501.60" },
      { label: "d) How much cheaper is the cheaper deal?", a: 33.6, pre: "&pound;", show: "33.60" }
    ],
    hint: "Deal A: up front plus 24 monthly payments. Deal B: 12 months at the discounted price plus 12 months at the full price.",
    why: "a) 180 + 24 &times; 12 = 180 + 288 = <b>&pound;468</b>.<br>b) 22 &times; 0.9 = <b>&pound;19.80</b>.<br>c) 12 &times; 19.80 + 12 &times; 22 = 237.60 + 264 = <b>&pound;501.60</b>.<br>d) 501.60 &minus; 468 = <b>&pound;33.60</b>, so Deal A is cheaper overall, even though it costs more on day one. In the exam, finish with a sentence that says which deal and by how much." }
  ]
});
