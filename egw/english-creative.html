<style>
.statement{background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:10px 14px;margin:10px 0;font-size:1.02rem}
.statement b{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:3px}

/* Show, don't tell machine */
.sm{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin:6px 0}
.smtop{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.smtop .stage{font-family:var(--display);font-weight:700;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:.88rem}
.tellslip{background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tellslip .stampt{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.14em;color:var(--coral);border:3px solid var(--coral);border-radius:6px;padding:2px 7px;transform:rotate(-8deg);flex:none}
.tellslip .said{font-size:1.15rem;font-weight:700}
.gaugewrap{display:flex;align-items:center;gap:12px}
.gaugewrap svg{width:110px;height:auto;flex:none}
.gaugewrap .glab{font-size:.88rem;color:#c9cdf0;line-height:1.35}
.needle{transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-origin:60px 62px}
.trays{display:grid;gap:10px;margin-top:10px}
.tray{background:rgba(255,255,255,.07);border-radius:12px;padding:8px}
.tray .tn{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin:0 0 6px 2px}
.tray .tn .tick{color:var(--mint);margin-left:4px}
.chipsrow{display:grid;gap:6px}
.chipsrow button{font-family:inherit;font-size:.95rem;line-height:1.35;text-align:left;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.chipsrow button:hover{border-color:var(--cyan)}
.chipsrow button.in{border-color:var(--mint);background:#e3f8f1;box-shadow:0 0 0 2px var(--mint)}
.chipsrow button.spat{background:#ffe9e9;border-color:var(--coral);text-decoration:line-through;opacity:.7;cursor:default}
.chipsrow button.shake{animation:nudge .35s}
.printout{background:#fffdf4;color:var(--ink);border-radius:4px 4px 12px 12px;padding:12px 14px;margin-top:12px;font-size:1.04rem;line-height:1.6;border-top:6px dashed var(--line);min-height:60px}
.printout .ph{color:var(--body-tint);font-style:italic;font-size:.95rem}
.printout span.new{animation:rise .5s}
.smmsg{margin-top:10px;font-size:.96rem;line-height:1.45;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;min-height:1.4em}
.smmsg b{color:var(--sun)}
.smrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.judge{display:grid;gap:8px}
.judge button{font-family:inherit;font-size:.98rem;line-height:1.45;text-align:left;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.judge button:hover{border-color:var(--cyan)}
.judge button.ok{border-color:var(--mint);background:#e3f8f1}
.judge button.no{border-color:var(--coral);background:#ffe9e9}
.smend{text-align:center;padding:6px 0}
.smend .big{font-family:var(--display);font-weight:700;font-size:2.2rem;color:var(--sun);line-height:1.1}
.smend .rank{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:4px 0 8px}
@media (max-width:420px){ .sm{padding:10px} .gaugewrap svg{width:90px} }

/* the picture prompt: a busy market at dusk, drawn for this page */
function awning(x, w, col){
  var s = '<path d="M' + x + ' 128 L' + (x + 8) + ' 108 L' + (x + w - 8) + ' 108 L' + (x + w) + ' 128 Z" fill="#ffffff" stroke="#141a33" stroke-width="2"/>';

  for(var k = 0; k < n; k += 2){
    var a = x + k * sw, b = a + sw;

  }
  for(var j = 0; j < n; j++){
    var cx = x + sw * (j + 0.5);
    s += '<path d="M' + (cx - sw / 2).toFixed(1) + ' 128 Q' + cx.toFixed(1) + ' 138 ' + (cx + sw / 2).toFixed(1) + ' 128" fill="' + (j % 2 ? "#ffffff" : col) + '" stroke="#141a33" stroke-width="1.5"/>';

var MARKET = (function(){

  '<path d="M0 120 L0 92 L30 92 L30 80 L58 80 L58 98 L84 98 L84 70 L92 58 L100 70 L100 98 L140 98 L140 84 L176 84 L176 104 L214 104 L214 88 L246 88 L246 108 L276 108 L276 96 L320 96 L320 86 L352 86 L352 102 L380 102 L380 120 Z" fill="#141a33" opacity=".88"/>' +

  '<g fill="#ffd23f" opacity=".9"><rect x="38" y="88" width="5" height="6"/><rect x="150" y="90" width="5" height="6"/><rect x="226" y="96" width="5" height="6"/><rect x="330" y="92" width="5" height="6"/></g>' +
  /* ground */
  '<rect x="0" y="190" width="380" height="70" fill="#141a33"/><rect x="0" y="190" width="380" height="70" fill="#8a5cf6" opacity=".45"/>' +
  '<g fill="#3a5cff" opacity=".35"><ellipse cx="60" cy="214" rx="18" ry="4"/><ellipse cx="150" cy="232" rx="22" ry="4"/><ellipse cx="250" cy="218" rx="16" ry="4"/><ellipse cx="330" cy="240" rx="20" ry="4"/><ellipse cx="100" cy="250" rx="14" ry="3"/></g>' +
  '<ellipse cx="200" cy="244" rx="46" ry="7" fill="#ffd23f" opacity=".25"/>' +

  '<rect x="10" y="160" width="104" height="36" fill="#f2f1ec" stroke="#141a33" stroke-width="2"/>' +
  '<rect x="138" y="160" width="104" height="36" fill="#f2f1ec" stroke="#141a33" stroke-width="2"/>' +
  '<rect x="266" y="160" width="104" height="36" fill="#f2f1ec" stroke="#141a33" stroke-width="2"/>' +
  awning(6, 112, "#ff5d5d") + awning(134, 112, "#3a5cff") + awning(262, 112, "#19c39a") +
  /* fruit */
  '<g stroke="#141a33" stroke-width="1">' +
  '<circle cx="24" cy="156" r="6" fill="#ff5d5d"/><circle cx="36" cy="156" r="6" fill="#ff5d5d"/><circle cx="30" cy="148" r="6" fill="#ff5d5d"/>' +

  '<circle cx="84" cy="156" r="6" fill="#19c39a"/><circle cx="96" cy="156" r="6" fill="#19c39a"/><circle cx="90" cy="148" r="6" fill="#19c39a"/></g>' +
  /* food stall with steam */
  '<rect x="160" y="146" width="60" height="14" rx="4" fill="#141a33"/>' +
  '<g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M172 142 Q166 132 172 122 T172 104"/><path d="M190 142 Q184 130 190 118 T190 98"/><path d="M208 142 Q202 132 208 122 T208 106"/></g>' +
  /* fabric stall */
  '<g stroke="#141a33" stroke-width="1.5"><path d="M280 140 L290 160 L270 160 Z" fill="#8a5cf6"/><path d="M304 136 L316 160 L292 160 Z" fill="#ffd23f"/><path d="M330 140 L340 160 L320 160 Z" fill="#22b8e6"/><path d="M352 138 L362 160 L342 160 Z" fill="#ff5d5d"/></g>' +

       '<circle cx="134.5" cy="186" r="1.3" fill="#ffd23f"/>';
  return s + '</svg>';

/* ---------- Show, don't tell machine ---------- */
var TRAYS = [
  { name: "Setting detail", chips: [
    ["The corridor lights flickered, then died.", 1],
    ["It was a really scary place.", 0],
    ["Somewhere above her, a floorboard creaked.", 1] ] },
  { name: "A sense", chips: [
    ["She felt very frightened.", 0],
    ["The air tasted of dust and old metal.", 1],
    ["Her own heartbeat thudded in her ears.", 1] ] },
  { name: "Body language", chips: [
    ["Her fingers tightened around the torch until her knuckles whitened.", 1],
    ["She pressed her back flat against the cold wall.", 1],
    ["She was scared out of her wits.", 0] ] },
  { name: "Short sentence", chips: [
    ["Then the door moved.", 1],
    ["It was all very scary.", 0],
    ["Silence.", 1] ] }
];
var SPIT = [
  "That one names the feeling (or the place) instead of showing it. That is telling.",
  "\"Scary\" and \"frightened\" are labels. The machine wants clues the reader can feel.",
  "Telling in disguise. Swap it for something the reader could see, hear or touch."
];
var JUDGE = [
  { tell: "He was angry.",
    opts: ["He was really, really angry, and he felt very furious inside.",
           "His jaw tightened. He set the mug down so carefully that it made no sound at all, then walked out without a word.",
           "His face went as red as a tomato, his eyes burned like fire, his blood boiled like a kettle and steam came out of his ears like a train."],
    right: 1,
    nope: ["That is telling, just louder. \"Angry\" and \"furious\" are labels, not clues.", "", "Four similes in one sentence, and all of them clich&eacute;s. Overloading buries the feeling."],
    why: "Quiet anger is scarier than shouting. The careful mug and the silent exit let the reader feel the danger without one feeling word." },
  { tell: "The house was old.",
    opts: ["Ivy had swallowed the porch. Inside, the wallpaper hung in curls, and every stair groaned its own different note.",
           "The house was very ancient and had been standing there for a long, long time.",
           "The house was as old as the hills, as old as time itself, an ancient, aged, elderly old house."],
    right: 0,
    nope: ["", "Still telling: \"ancient\" is just a fancier word for old.", "A pile of words that all mean old, plus a clich&eacute;. Nothing for the reader to picture."],
    why: "Ivy, curling wallpaper and groaning stairs are evidence. The reader works out \"old\" for themselves, and that is far more satisfying." },
  { tell: "She was excited.",
    opts: ["She was so excited that she felt really happy and thrilled.",
           "She was on cloud nine, over the moon and grinning like a Cheshire cat.",
           "She read the letter twice, then a third time, and suddenly she was laughing, spinning round the kitchen with it pressed to her chest."],
    right: 2,
    nope: ["Three feeling labels in a row. That is telling.", "Every phrase is a clich&eacute;. Readers skim straight past them.", ""],
    why: "Reading it three times, laughing, spinning: actions do the work. We do not even know what the letter says, and we are already excited with her." },
  { tell: "It was cold.",
    opts: ["Frost had furred the inside of the window. Her breath hung in front of her, and her fingers had stopped doing as they were told.",

           "The cold was a bitter, icy, freezing, frosty, glacial, wintry blanket of total coldness."],
    right: 0,
    nope: ["", "Telling three times over. Nothing to see or feel.", "Seven adjectives stacked up. One precise detail beats a pile of synonyms."],
    why: "\"Furred\" is a fresh, surprising verb, and fingers that will not obey are something every reader has felt. That is showing." }
];

function gaugeSvg(){
  return '<svg viewBox="0 0 120 74" role="img" aria-label="Show meter">' +
    '<path d="M12 62 A48 48 0 0 1 108 62" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="12"/>' +
    '<path d="M12 62 A48 48 0 0 1 44 17" fill="none" stroke="#ff5d5d" stroke-width="12"/>' +
    '<path d="M44 17 A48 48 0 0 1 84 20" fill="none" stroke="#ffd23f" stroke-width="12"/>' +
    '<path d="M84 20 A48 48 0 0 1 108 62" fill="none" stroke="#19c39a" stroke-width="12"/>' +
    '<g class="needle"><path d="M60 62 L60 20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></g>' +
    '<circle cx="60" cy="62" r="6" fill="#ffffff"/></svg>';
}

function machine(el, api){
  var d = api.data;
  if(!d.stage) d.stage = 1;
  if(!d.pick) d.pick = {};
  if(!d.spat) d.spat = {};
  if(d.round === undefined) d.round = 0;
  if(d.firstGo === undefined) d.firstGo = 0;
  if(d.traps === undefined) d.traps = 0;
  var msg = "";

  function setNeedle(frac){
    var n = el.querySelector(".needle");
    if(n) setTimeout(function(){ n.style.transform = "rotate(" + Math.round(-80 + 160 * frac) + "deg)"; }, 30);
  }
  function result(){ return d.shown ? "shown" : d.firstGo >= 3 ? "right1" : "right2"; }

  function draw(){
    if(d.stage === 1) drawBuild();
    else if(d.stage === 2) drawJudge();
    else drawEnd();
  }

  function drawBuild(){
    var count = Object.keys(d.pick).length;
    el.innerHTML = '<div class="sm">' +
      '<div class="smtop"><span class="stage">Part 1: build it</span><div class="gaugewrap">' + gaugeSvg() + '<span class="glab">Show meter<br>' + count + ' of 4 ingredients</span></div></div>' +
      '<div class="tellslip"><span class="stampt">TELL</span><span class="said">She was scared.</span></div>' +
      '<p class="wnote" style="color:#c9cdf0;margin:0">Feed the machine one ingredient from each tray. It turns them into a \"show\" version. It spits out anything that is still telling.</p>' +
      '<div class="trays"></div>' +
      '<div class="printout" aria-live="polite"></div>' +
      '<div class="smmsg" aria-live="polite">' + (msg || "Tap any ingredient to drop it in. Tap another in the same tray to swap.") + '</div>' +
      '<div class="smrow" id="smRow"></div></div>';
    var trays = el.querySelector(".trays");
    TRAYS.forEach(function(t, ti){
      var box = document.createElement("div");
      box.className = "tray";
      box.innerHTML = '<p class="tn">' + t.name + (d.pick[ti] !== undefined ? '<span class="tick">&#10003;</span>' : '') + '</p><div class="chipsrow"></div>';
      var row = box.querySelector(".chipsrow");
      t.chips.forEach(function(c, ci){
        var b = document.createElement("button");
        b.type = "button"; b.textContent = c[0];
        if(d.pick[ti] === ci) b.className = "in";
        if(d.spat[ti + "_" + ci]) b.className = "spat";
        b.onclick = function(){ feed(ti, ci, b); };
        row.appendChild(b);
      });
      trays.appendChild(box);
    });
    var out = el.querySelector(".printout");
    if(!count) out.innerHTML = '<span class="ph">Your show version prints here...</span>';
    else out.innerHTML = TRAYS.map(function(t, ti){ return d.pick[ti] !== undefined ? '<span>' + t.chips[d.pick[ti]][0] + '</span>' : ''; }).filter(Boolean).join(" ");
    setNeedle(count / 4);
    var row2 = el.querySelector("#smRow");
    if(count === 4){
      row2.innerHTML = '<button class="btn" type="button" id="smOn">That is showing. On to part 2</button>';
      row2.querySelector("#smOn").onclick = function(){ d.stage = 2; msg = ""; api.save(); draw(); };
    }else if(d.traps > 0){
      row2.innerHTML = '<button class="btn btn-quiet" type="button" id="smFill">Show me</button>';
      row2.querySelector("#smFill").onclick = function(){
        TRAYS.forEach(function(t, ti){ if(d.pick[ti] === undefined){ for(var ci = 0; ci < t.chips.length; ci++){ if(t.chips[ci][1]){ d.pick[ti] = ci; break; } } } });
        d.shown = true;
        msg = "<b>Filled in.</b> Notice that none of these sentences uses the word scared, yet the whole paragraph is full of fear.";
        api.save(); draw();
      };
    }
  }

  function feed(ti, ci, btn){
    if(d.spat[ti + "_" + ci]) return;
    var c = TRAYS[ti].chips[ci];
    if(c[1]){
      d.pick[ti] = ci;
      var n = Object.keys(d.pick).length;
      msg = n === 4 ? "<b>Ding.</b> Read your paragraph. Not one word says she is scared, and yet you can feel it." : "<b>Whirr.</b> In it goes.";
      api.save(); draw();
    }else{
      d.spat[ti + "_" + ci] = true; d.traps++;
      msg = "<b>Clunk.</b> " + SPIT[d.traps % SPIT.length];
      api.save(); draw();
      var b2 = el.querySelectorAll(".tray")[ti].querySelectorAll("button")[ci];
      if(b2) b2.classList.add("shake");
    }
  }

  function drawJudge(){
    var r = JUDGE[d.round];
    el.innerHTML = '<div class="sm">' +
      '<div class="smtop"><span class="stage">Part 2: you be the judge &middot; ' + (d.round + 1) + ' of ' + JUDGE.length + '</span><div class="gaugewrap">' + gaugeSvg() + '<span class="glab">First go<br>' + d.firstGo + ' of ' + JUDGE.length + '</span></div></div>' +
      '<div class="tellslip"><span class="stampt">TELL</span><span class="said">' + r.tell + '</span></div>' +
      '<p class="wnote" style="color:#c9cdf0;margin:0 0 8px">Three writers had a go at showing this. Which version is strongest?</p>' +
      '<div class="judge"></div><div class="smmsg" aria-live="polite">Two of these are traps.</div><div class="smrow" id="smRow"></div></div>';
    setNeedle(d.firstGo / JUDGE.length);
    var box = el.querySelector(".judge"), out = el.querySelector(".smmsg"), row = el.querySelector("#smRow");
    var missed = false;
    function win(b, shown){
      b.classList.add("ok");
      [].forEach.call(box.children, function(c){ c.disabled = true; });
      if(!missed && !shown){ d.firstGo++; setNeedle(d.firstGo / JUDGE.length); el.querySelector(".glab").innerHTML = "First go<br>" + d.firstGo + " of " + JUDGE.length; }
      if(shown) d.shown = true;
      api.save();
      out.innerHTML = '<b>' + (shown ? "This one." : missed ? "Got there." : "Ding.") + '</b> ' + r.why;
      row.innerHTML = '<button class="btn" type="button" id="smNext">' + (d.round === JUDGE.length - 1 ? "See your score" : "Next") + '</button>';
      row.querySelector("#smNext").onclick = function(){ d.round++; if(d.round >= JUDGE.length) d.stage = 3; api.save(); draw(); };
    }
    r.opts.forEach(function(t, k){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = t;
      b.onclick = function(){
        if(b.disabled) return;
        if(k === r.right) win(b, false);
        else{
          b.classList.add("no"); b.disabled = true; missed = true;
          out.innerHTML = '<b>Clunk.</b> ' + r.nope[k];
          row.innerHTML = '<button class="btn btn-quiet" type="button" id="smShow">Show me</button>';
          row.querySelector("#smShow").onclick = function(){ win(box.children[r.right], true); };
        }
      };
      box.appendChild(b);
    });
  }

  function drawEnd(){
    var rank = d.firstGo === JUDGE.length ? "Master of show" : d.firstGo >= 3 ? "Sharp eyed editor" : d.firstGo >= 2 ? "Showing promise" : "Getting the hang of it";
    var built = TRAYS.map(function(t, ti){ return d.pick[ti] !== undefined ? t.chips[d.pick[ti]][0] : ""; }).join(" ");
    el.innerHTML = '<div class="sm"><div class="smend">' +
      '<div class="gaugewrap" style="justify-content:center">' + gaugeSvg() + '</div>' +
      '<div class="big">' + d.firstGo + ' / ' + JUDGE.length + '</div><div class="rank">' + rank + '</div>' +
      '<p class="wnote" style="color:#c9cdf0">The traps were always the same two: <b style="color:#ffd23f">telling louder</b> (piling on feeling words) and <b style="color:#ffd23f">clich&eacute; overload</b>. The winner was always a few precise, fresh details.</p>' +
      '</div><div class="printout"><span class="tiny">Your paragraph from part 1:</span><br>' + built + '</div>' +
      '<div class="smrow" style="justify-content:center"><button class="btn btn-quiet" type="button" id="smAgain">Play again</button></div></div>';
    setNeedle(d.firstGo / JUDGE.length);
    el.querySelector("#smAgain").onclick = function(){ d.stage = 1; d.pick = {}; d.spat = {}; d.round = 0; d.firstGo = 0; d.traps = 0; d.shown = false; msg = ""; api.save(); draw(); };
    api.done(result());
  }

  draw();
}
