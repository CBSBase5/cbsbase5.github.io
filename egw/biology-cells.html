/* ---------- small in-widget quiz (shared shape with the infection page) ---------- */
function wquiz(host, qs, api){
  var d = api.data;
  if(!d.q) d.q = [];
  function parse(s){
    s = String(s).replace(/,/g, "").replace(/\u2212/g, "-");
    var m = s.match(/-?\d*\.?\d+/);
    return m ? parseFloat(m[0]) : NaN;
  }
  function overall(){
    var r = "right1";
    for(var k = 0; k < qs.length; k++){
      var st = d.q[k];
      if(!st || !st.done) return null;
      if(st.done === "shown") r = "shown";
      else if(st.done === "right2" && r === "right1") r = "right2";
    }
    return r;
  }
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
  function render(){
    host.innerHTML = '<span class="kicker" style="margin-bottom:4px">Your challenge</span>';
    for(var k = 0; k < qs.length; k++){
      if(!d.q[k]) d.q[k] = { tries: 0 };
      host.appendChild(one(k));
      if(!d.q[k].done) break;
    }
  }
  function one(k){
    var q = qs[k], st = d.q[k];
    var box = el("div", "wq", '<p class="wnote"><b>' + (k + 1) + ' of ' + qs.length + '.</b> ' + q.q + '</p>');
    var picked = st.pick === undefined ? -1 : st.pick, input = null, btns = [];
    if(q.options){
      var ch = el("div", "choices");
      q.options.forEach(function(o, n){
        var b = el("button", n === picked ? "picked" : "", o); b.type = "button";
        b.onclick = function(){
          if(st.done) return;
          picked = n;
          btns.forEach(function(x, m){ x.classList.toggle("picked", m === n); x.classList.remove("no"); });
        };
        btns.push(b); ch.appendChild(b);
      });
      box.appendChild(ch);
    }else{
      var row = el("label", "numrow", q.pre ? '<span class="aff">' + q.pre + '</span>' : "");
      input = el("input"); input.type = "text"; input.inputMode = "decimal"; input.autocomplete = "off";
      input.setAttribute("aria-label", "Your answer");
      if(st.val !== undefined) input.value = st.val;
      input.addEventListener("input", function(){ input.classList.remove("no"); });
      input.addEventListener("keydown", function(e){ if(e.key === "Enter") cb.click(); });
      row.appendChild(input);
      if(q.post) row.appendChild(el("span", "aff", q.post));
      box.appendChild(row);
    }
    var nav = el("div", "wrow");
    var cb = el("button", "btn", "Check"); cb.type = "button";
    var sb = el("button", "btn btn-quiet", "Show me"); sb.type = "button";
    nav.appendChild(cb); nav.appendChild(sb); box.appendChild(nav);
    var fb = el("div", "fb hidden"); fb.setAttribute("aria-live", "polite");
    box.appendChild(fb);
    function right(){
      if(q.options) return picked === q.answer;
      return Math.abs(parse(input.value) - q.a) <= (q.tol || 1e-9);
    }
    function paint(){
      cb.classList.toggle("hidden", !!st.done);
      sb.classList.toggle("hidden", !!st.done || !st.tries);
      if(!st.done) return;
      if(q.options){
        btns.forEach(function(x, m){
          x.classList.remove("no", "ok");
          if(m === q.answer) x.classList.add("ok");
        });
      }else{
        if(st.done === "shown"){ input.value = q.show || String(q.a); input.classList.add("given"); }
        else input.classList.add("ok");
        input.readOnly = true;
      }
      fb.className = "fb " + (st.done === "shown" ? "show" : "good");
      fb.innerHTML = "<b>" + (st.done === "shown" ? "Here is how this one works." : st.done === "right1" ? "Spot on." : "Got there. Second go counts.") +
        '</b><div class="why">' + q.why + "</div>";
    }
    function finish(r){
      st.done = r; api.save();
      var o = overall();
      if(o) api.done(o);
      render();
    }
    cb.onclick = function(){
      if(q.options ? picked < 0 : !input.value.trim()){
        fb.className = "fb nudge"; fb.innerHTML = "Pop an answer in first, if you like.";
        return;
      }
      st.pick = picked; if(input) st.val = input.value;
      if(right()){ finish(st.tries ? "right2" : "right1"); return; }
      st.tries++;
      if(st.tries >= 2){ finish("shown"); return; }
      api.save();
      var msg = q.hint;
      if(input && q.near){
        var v = parse(input.value);
        q.near.forEach(function(nr){ if(Math.abs(v - nr.v) < 1e-9) msg = nr.msg; });
      }
      if(q.options && q.nearOpt && q.nearOpt[picked]) msg = q.nearOpt[picked];
      if(input) input.classList.add("no"); else btns[picked].classList.add("no");
      fb.className = "fb nudge";
      fb.innerHTML = "<b>Not quite yet.</b> " + msg + '<br><span class="tiny">Change your answer and Check again, or tap Show me.</span>';
      paint();
    };
    sb.onclick = function(){ finish("shown"); };
    paint();
    return box;
  }
  render();
}

  plant: { name: "Plant cell", w: 50, h: 30 },

};

function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* cheek cells: fixed scatter so the slide looks the same every time */
var CHEEK = (function(){
  var rnd = mulberry(42), out = [];
  for(var j = -5; j <= 5; j++){
    for(var i = -5; i <= 5; i++){
      if(i === 0 && j === 0){ out.push({ x: 0, y: 0, r: 30, f: [1, .95, .92, .96, 1, .93, .9, .95], nx: 9, ny: -9 }); continue; }
      if(rnd() < 0.22) continue;
      var f = [];
      for(var n = 0; n < 8; n++) f.push(0.84 + rnd() * 0.22);
      out.push({ x: i * 86 + (rnd() - 0.5) * 22, y: j * 86 + (rnd() - 0.5) * 22, r: 24 + rnd() * 8, f: f,
                 nx: (rnd() - 0.5) * 14, ny: (rnd() - 0.5) * 14 });
    }
  }
  return out;
})();

function blobPath(cx, cy, r, f, k){
  /* smooth closed blob through 8 points, in screen units */
  var pts = [];
  for(var n = 0; n < 8; n++){
    var a = n / 8 * Math.PI * 2;
    pts.push([150 + (cx + Math.cos(a) * r * f[n]) * k, 150 + (cy + Math.sin(a) * r * f[n]) * k]);
  }
  var s = "";
  for(n = 0; n < 8; n++){
    var p = pts[n], q = pts[(n + 1) % 8];
    var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    if(n === 0){
      var z = pts[7];
      s += "M" + ((z[0] + p[0]) / 2).toFixed(1) + " " + ((z[1] + p[1]) / 2).toFixed(1);
    }
    s += " Q" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " " + mx.toFixed(1) + " " + my.toFixed(1);
  }
  return s + " Z";
}

function scopeView(spec, obj, labels){
  var k = obj / 10;              /* screen units per micrometre: x10 eyepiece, 0.01 units per um per x1 */
  var view = 142 / k;            /* radius of the field in micrometres */
  var X = function(u){ return (150 + u * k).toFixed(1); };
  var Y = X;
  var g = [];
  if(spec === "plant"){
    var rows = Math.ceil(view / 30) + 1, cols = Math.ceil(view / 50) + 1;
    var sw = Math.max(0.8, Math.min(5, 1.3 * k));
    for(var r = -rows; r <= rows; r++){
      for(var c = -cols; c <= cols; c++){
        var cx = c * 50 + (Math.abs(r) % 2 ? 25 : 0), cy = r * 30;
        if(Math.sqrt(cx * cx + cy * cy) > view + 40) continue;
        g.push('<rect x="' + X(cx - 25) + '" y="' + Y(cy - 15) + '" width="' + (50 * k).toFixed(1) + '" height="' + (30 * k).toFixed(1) +
          '" fill="#f3f7e4" stroke="' + TEAL + '" stroke-width="' + sw.toFixed(1) + '"/>');
        if(k >= 1){
          g.push('<rect x="' + X(cx - 24) + '" y="' + Y(cy - 14) + '" width="' + (48 * k).toFixed(1) + '" height="' + (28 * k).toFixed(1) +
            '" fill="none" stroke="' + INK + '" stroke-opacity=".45" stroke-width=".8"/>');
          g.push('<rect x="' + X(cx - 14) + '" y="' + Y(cy - 9) + '" width="' + (33 * k).toFixed(1) + '" height="' + (18 * k).toFixed(1) +
            '" rx="' + (6 * k).toFixed(1) + '" fill="#d9f1f7" stroke="' + BRIGHT + '" stroke-width="1"/>');
          g.push('<circle cx="' + X(cx - 19.5) + '" cy="' + Y(cy) + '" r="' + (3.6 * k).toFixed(1) + '" fill="' + PLUM + '"/>');
          [[-11, -12, 0], [1, -12, 0], [13, -12, 0], [-3, 12, 0], [10, 12, 0], [22, -3, 1], [22, 7, 1]].forEach(function(p){
            g.push('<ellipse cx="' + X(cx + p[0]) + '" cy="' + Y(cy + p[1]) + '" rx="' + ((p[2] ? 1.6 : 3.2) * k).toFixed(1) +
              '" ry="' + ((p[2] ? 3.2 : 1.6) * k).toFixed(1) + '" fill="' + GREEN + '"/>');
          });
        }else{
          g.push('<circle cx="' + X(cx - 19) + '" cy="' + Y(cy) + '" r="' + Math.max(1.2, 3.6 * k).toFixed(1) + '" fill="' + PLUM + '"/>');
        }
      }
    }
  }else{
    CHEEK.forEach(function(cl){
      if(Math.sqrt(cl.x * cl.x + cl.y * cl.y) - cl.r > view + 10) return;
      g.push('<path d="' + blobPath(cl.x, cl.y, cl.r, cl.f, k) + '" fill="#fde6d2" fill-opacity=".92" stroke="' + INK +
        '" stroke-opacity=".7" stroke-width="' + Math.max(0.8, Math.min(2, 0.5 * k)).toFixed(1) + '"/>');
      g.push('<circle cx="' + X(cl.x + cl.nx) + '" cy="' + Y(cl.y + cl.ny) + '" r="' + Math.max(1.3, 4.5 * k).toFixed(1) + '" fill="' + PLUM + '"/>');
    });
  }
  /* measuring arrow across the middle cell */
  var w = SPEC[spec].w, ay = spec === "plant" ? 15 : 6;
  var x1 = 150 - w / 2 * k, x2 = 150 + w / 2 * k, yy = 150 + ay * k;
  var head = Math.min(7, w * k / 5);
  var arrow =
    '<line x1="' + x1 + '" y1="' + yy + '" x2="' + x2 + '" y2="' + yy + '" stroke="' + WHITE + '" stroke-width="6"/>' +
    '<line x1="' + x1 + '" y1="' + yy + '" x2="' + x2 + '" y2="' + yy + '" stroke="' + ORANGE + '" stroke-width="2.5"/>' +
    '<path d="M' + x1 + ' ' + yy + ' l' + head + ' ' + (-head * 0.7) + ' v' + (head * 1.4) + ' Z M' + x2 + ' ' + yy + ' l' + (-head) + ' ' + (-head * 0.7) + ' v' + (head * 1.4) + ' Z" fill="' + ORANGE + '"/>';
  /* labels at x400 */
  var lab = "";
  if(labels && obj === 40){
    var list = spec === "plant" ?
      [["Cell wall", 62, 30, 51, 105], ["Chloroplast", 160, 20, 154, 102], ["Vacuole", 250, 46, 190, 132],
       ["Nucleus", 52, 268, 72, 156], ["Cytoplasm", 150, 288, 164, 198], ["Cell membrane", 252, 268, 245, 190]] :
      [["Cell membrane", 70, 26, 59, 87], ["Nucleus", 232, 30, 186, 116], ["Cytoplasm", 80, 278, 112, 196]];
    list.forEach(function(p){
      var wd = p[0].length * 7.4 + 14;
      lab += L(p[1], p[2], p[3], p[4], INK, 1.8) + '<circle cx="' + p[3] + '" cy="' + p[4] + '" r="2.5" fill="' + INK + '"/>' +
        '<rect x="' + (p[1] - wd / 2).toFixed(1) + '" y="' + (p[2] - 11) + '" width="' + wd.toFixed(1) + '" height="21" rx="10" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="1.5"/>' +
        T(p[1], p[2] + 4.5, p[0], { s: 12.5 });
    });
  }
  return '<rect width="300" height="300" fill="' + INK + '"/>' +
    '<defs><clipPath id="fovClip"><circle cx="150" cy="150" r="142"/></clipPath></defs>' +
    '<g clip-path="url(#fovClip)"><rect width="300" height="300" fill="' + PAPER + '"/>' + g.join("") + arrow + '</g>' +
    '<circle cx="150" cy="150" r="143" fill="none" stroke="#123c47" stroke-width="4"/>' + lab;
}

var MICRO = {
  type: "widget", topic: "Microscopes",
  title: "Virtual microscope",
  html: '<p>The eyepiece is always x10. Tap an objective lens to change the magnification, and switch slides if you like. Two small challenges sit underneath, whenever you are ready.</p>',

    var seen = Object.keys(d.seen || {}).map(function(o){ return "x" + (o * 10); }).join(", ");
    var q = d.q || [];
    var lab = { right1: "first go", right2: "second go", shown: "Show me" };

  },
  mount: function(el, api){
    var d = api.data;
    if(!d.obj) d.obj = 4;
    if(!d.spec) d.spec = "plant";
    if(!d.seen) d.seen = {};
    el.innerHTML =
      '<div class="wpanel">' +
        '<div class="mtabs" id="mSpec" role="group" aria-label="Slide"><span class="wnote"><b>Slide</b></span></div>' +
        '<div class="mview"><svg id="mSvg" viewBox="0 0 300 300" role="img" aria-label="The view down the microscope"></svg></div>' +
        '<div class="mtabs" id="mObj" role="group" aria-label="Objective lens"><span class="wnote"><b>Objective lens</b></span></div>' +
        '<p class="wnote" id="mRead" aria-live="polite"></p>' +
        '<p class="wnote" id="mMeas"></p>' +
        '<label class="wnote mlab" id="mLabRow"><input type="checkbox" id="mLab"> Show labels</label>' +
        '<p class="tiny" id="mNote"></p>' +
      '</div>' +
      '<div class="wpanel" id="mQuiz"></div>';
    var specBox = el.querySelector("#mSpec"), objBox = el.querySelector("#mObj");
    var specBtns = {}, objBtns = {};
    ["plant", "animal"].forEach(function(s){
      var b = document.createElement("button"); b.type = "button"; b.textContent = s === "plant" ? "Plant cell" : "Animal cell";
      b.onclick = function(){ d.spec = s; api.save(); draw(); };
      specBtns[s] = b; specBox.appendChild(b);
    });
    [4, 10, 40].forEach(function(o){
      var b = document.createElement("button"); b.type = "button"; b.textContent = "x" + o;
      b.setAttribute("aria-label", "Objective lens x" + o);
      b.onclick = function(){ d.obj = o; api.save(); draw(); };
      objBtns[o] = b; objBox.appendChild(b);
    });
    var lab = el.querySelector("#mLab");
    lab.checked = !!d.labels;
    lab.onchange = function(){ d.labels = lab.checked; api.save(); draw(); };

    function draw(){
      d.seen[d.obj] = 1;
      Object.keys(specBtns).forEach(function(s){ specBtns[s].className = "btn" + (s === d.spec ? "" : " btn-quiet"); specBtns[s].setAttribute("aria-pressed", s === d.spec); });
      Object.keys(objBtns).forEach(function(o){ objBtns[o].className = "btn" + (+o === d.obj ? "" : " btn-quiet"); objBtns[o].setAttribute("aria-pressed", +o === d.obj); });
      el.querySelector("#mSvg").innerHTML = scopeView(d.spec, d.obj, d.labels);
      var total = 10 * d.obj;
      var mm = SPEC[d.spec].w * total / 1000;
      el.querySelector("#mRead").innerHTML = 'Total magnification <span class="wbig">x' + total + '</span><br>eyepiece x10 &times; objective x' + d.obj + ' = x' + total;
      el.querySelector("#mMeas").innerHTML = 'Imagine this view printed as a photo. The middle cell (red arrow) would measure <b>' + mm + ' mm</b> across.';
      el.querySelector("#mLabRow").classList.toggle("hidden", d.obj !== 40);
      var note;
      if(d.obj === 4) note = "Low power: lots of cells, not much detail. This is where you start, to find the bit you want.";
      else if(d.obj === 10) note = "Medium power: the parts inside each cell start to show.";
      else note = "High power: one cell fills most of the view. Mitochondria and ribosomes are in there too, but they are too small for a light microscope to show clearly. That needs an electron microscope.";
      if(d.spec === "animal") note += " Cheek cells have no cell wall, no permanent vacuole and no chloroplasts.";
      el.querySelector("#mNote").innerHTML = note;
      api.save();
    }
    draw();

    wquiz(el.querySelector("#mQuiz"), [
      { q: "A different microscope has a <b>x15</b> eyepiece and a <b>x40</b> objective lens. What is its total magnification?",
        a: 600, pre: "x",
        hint: "Total magnification is the two lenses multiplied together.",
        why: "15 &times; 40 = 600, so the total magnification is x600." },
      { q: "Set the <b>plant cell</b> slide to <b>x400</b> and read how wide the middle cell is on the image. Then work out the <b>real</b> width of that cell in &micro;m.",
        a: 50, post: "&micro;m",
        near: [{ v: 0.05, msg: "0.05 is the real size in millimetres, so the hard part is done. Now change it to micrometres." },
               { v: 8000, msg: "That one multiplied by 400. Real size is smaller than the image, so this time you divide." }],
        hint: "Real size = image size &divide; magnification. That gives mm, then &times; 1000 turns it into &micro;m.",
        why: "At x400 the middle cell is 20 mm wide on the image. 20 &divide; 400 = 0.05 mm. Then 0.05 &times; 1000 = 50 &micro;m. Plant cells are usually somewhere around 10 to 100 &micro;m, so 50 is a sensible size." }
    ], api);
  }
};
