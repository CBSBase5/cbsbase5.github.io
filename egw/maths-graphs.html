.lt-ctl .lab b{display:inline-block;min-width:38px;text-align:center;background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:1px 6px;margin-left:4px}
.lt-ctl .pm{display:flex;gap:6px}

.lt-ctl input[type=range]{height:34px}
.lt-fb .btn{margin-top:10px}

  .lt-ctl input[type=range]{grid-column:1 / -1;grid-row:2}
}

<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';
var NC = '<span class="nocalc">No calculator</span> ';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function neg(v){ return v < 0 ? "&minus;" + (-v) : String(v); }
var clipN = 0;

/* A general grid. o: {x0,x1,y0,y1,ux,uy,step,stepY,left,top,w,h,xlab,ylab,aria,body(X,Y)} */
function grid(o){
  var left = o.left || 30, top = o.top || 14;
  var ux = o.ux, uy = o.uy, sx = o.step || 1, sy = o.stepY || sx;
  function X(x){ return +(left + (x - o.x0) * ux).toFixed(1); }
  function Y(y){ return +(top + (o.y1 - y) * uy).toFixed(1); }
  var W = o.w || Math.ceil(X(o.x1) + 16), H = o.h || Math.ceil(Y(o.y0) + (o.xlab ? 44 : 28));
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + o.aria + '">';
  var gx = o.gridX || sx, gy = o.gridY || sy, x, y;
  for(x = o.x0; x <= o.x1 + 1e-9; x += gx) s += '<path d="M' + X(x) + ' ' + Y(o.y1) + ' V' + Y(o.y0) + '" stroke="' + LINE + '" stroke-width="1"/>';
  for(y = o.y0; y <= o.y1 + 1e-9; y += gy) s += '<path d="M' + X(o.x0) + ' ' + Y(y) + ' H' + X(o.x1) + '" stroke="' + LINE + '" stroke-width="1"/>';
  var ax = o.x0 <= 0 && o.x1 >= 0 ? 0 : o.x0, ay = o.y0 <= 0 && o.y1 >= 0 ? 0 : o.y0;
  s += '<path d="M' + X(o.x0) + ' ' + Y(ay) + ' H' + X(o.x1) + '" stroke="' + INK + '" stroke-width="2.2"/>';
  s += '<path d="M' + X(ax) + ' ' + Y(o.y0) + ' V' + Y(o.y1) + '" stroke="' + INK + '" stroke-width="2.2"/>';
  for(x = o.x0; x <= o.x1 + 1e-9; x += sx){ if(Math.abs(x - ax) < 1e-9 && o.x0 < 0) continue; s += t(X(x), Y(ay) + 17, neg(+x.toFixed(2)), 14, INK, BODY + ' text-anchor="middle"'); }
  for(y = o.y0; y <= o.y1 + 1e-9; y += sy){ if(Math.abs(y - ay) < 1e-9) continue; s += t(X(ax) - 6, Y(y) + 5, neg(+y.toFixed(2)), 14, INK, BODY + ' text-anchor="end"'); }
  if(o.x0 < 0 || o.y0 < 0) s += t(X(ax) - 6, Y(ay) + 17, "0", 14, INK, BODY + ' text-anchor="end"');
  else s += t(X(ax), Y(ay) + 17, "0", 14, INK, BODY + ' text-anchor="middle"');
  if(o.xlab) s += t((X(o.x0) + X(o.x1)) / 2, Y(o.y0) + 38, o.xlab, 15, INK, LAB + ' font-weight="700" text-anchor="middle"');
  if(o.ylab) s += t(X(o.x0) + 4, Y(o.y1) - 2, o.ylab, 15, INK, LAB + ' font-weight="700"');
  var id = "gclip" + (++clipN);
  s += '<clipPath id="' + id + '"><rect x="' + X(o.x0) + '" y="' + Y(o.y1) + '" width="' + (X(o.x1) - X(o.x0)) + '" height="' + (Y(o.y0) - Y(o.y1)) + '"/></clipPath>';
  s += '<g clip-path="url(#' + id + ')">' + (o.clipped ? o.clipped(X, Y) : "") + '</g>';
  s += (o.body ? o.body(X, Y) : "") + '</svg>';
  return s;
}
function dot(X, Y, x, y, col, lab, dx, dy){
  return '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="6" fill="' + (col || BLUE) + '" stroke="' + INK + '" stroke-width="2"/>' +
    (lab ? t(X(x) + (dx === undefined ? 9 : dx), Y(y) + (dy === undefined ? -8 : dy), lab, 17, INK, LAB + ' font-weight="700"') : "");
}
function seg(X, Y, x1, y1, x2, y2, col, w, dash){
  return '<path d="M' + X(x1) + ' ' + Y(y1) + ' L' + X(x2) + ' ' + Y(y2) + '" stroke="' + (col || BLUE) + '" stroke-width="' + (w || 3) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' fill="none" stroke-linecap="round"/>';
}

/* ---------- figures ---------- */

/* Sequence hops */
var HOPS = (function(){
  var v = [5, 8, 11, 14, 17];
  var s = '<svg viewBox="0 0 400 150" role="img" aria-label="The sequence 5, 8, 11, 14, 17 goes up by 3 each time. The term before 5 would be 2, so the nth term is 3n plus 2.">';
  v.forEach(function(n, k){
    var x = 60 + k * 72;
    s += '<rect x="' + (x - 24) + '" y="60" width="48" height="42" rx="9" fill="' + (k ? WHITE : SUN) + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(x, 89, n, 21, INK, LAB + ' font-weight="700" text-anchor="middle"');
    s += t(x, 124, "n = " + (k + 1), 14, "#4b5275", BODY + ' text-anchor="middle"');
    if(k < 4){
      s += '<path d="M' + (x + 4) + ' 56 Q' + (x + 36) + ' 24 ' + (x + 68) + ' 56" fill="none" stroke="' + CORAL + '" stroke-width="2.5"/>';
      s += t(x + 36, 30, "+3", 16, CORAL, LAB + ' font-weight="700" text-anchor="middle"');
    }
  });
  s += t(200, 146, "nth term = 3n + 2", 18, BLUE, LAB + ' font-weight="700" text-anchor="middle"');
  s += '</svg>';
  return s;
})();

/* Triangular dots */
var TRI = (function(){
  var s = '<svg viewBox="0 0 400 150" role="img" aria-label="Triangular numbers as dot patterns: 1, 3, 6 and 10 dots.">';
  var x0 = [30, 90, 175, 285];
  for(var n = 1; n <= 4; n++){
    for(var r = 0; r < n; r++) for(var c = 0; c <= r; c++){
      s += '<circle cx="' + (x0[n - 1] + (n - 1 - r) * 11 + c * 22) + '" cy="' + (22 + r * 22) + '" r="8" fill="' + [SUN, CYAN, MINT, VIOLET][n - 1] + '" stroke="' + INK + '" stroke-width="1.5"/>';
    }
    s += t(x0[n - 1] + (n - 1) * 11, 136, String(n * (n + 1) / 2), 19, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  s += '</svg>';
  return s;
})();

/* Coordinates in four quadrants */
var QUAD = grid({ x0: -5, x1: 5, y0: -5, y1: 5, ux: 34, uy: 26, left: 24, top: 12,
  aria: "Grid from minus 5 to 5 on both axes. Point A at 3, 2. Point B at minus 4, 1. Point C at minus 2, minus 3. Point D at 4, minus 4.",
  body: function(X, Y){
    return dot(X, Y, 3, 2, BLUE, "A") + dot(X, Y, -4, 1, CORAL, "B") + dot(X, Y, -2, -3, VIOLET, "C") + dot(X, Y, 4, -4, MINT, "D", -24, -8);
  } });

/* Plotting y = 2x - 1 */
var PLOT = grid({ x0: -2, x1: 4, y0: -4, y1: 7, ux: 44, uy: 22, left: 28, top: 12,
  aria: "The points from the table for y equals 2x minus 1 plotted and joined with a straight line.",
  clipped: function(X, Y){ return seg(X, Y, -2, -5, 4, 7, BLUE, 3); },
  body: function(X, Y){
    var o = "";
    [-1, 0, 1, 2, 3].forEach(function(x){ o += dot(X, Y, x, 2 * x - 1, SUN); });
    return o + t(X(2.6) - 70, Y(6) + 2, "y = 2x &minus; 1", 17, BLUE, LAB + ' font-weight="700"');
  } });

/* Gradient triangle on y = 2x + 1 */
var GRAD = grid({ x0: -2, x1: 4, y0: -2, y1: 8, ux: 44, uy: 24, left: 28, top: 12,
  aria: "The line y equals 2x plus 1. It crosses the y axis at 1. A triangle shows that for 1 across, the line goes up 2, so the gradient is 2.",
  clipped: function(X, Y){ return seg(X, Y, -2, -3, 4, 9, BLUE, 3); },
  body: function(X, Y){
    return seg(X, Y, 1, 3, 2, 3, CORAL, 3) + seg(X, Y, 2, 3, 2, 5, CORAL, 3) +
      t(X(1.5), Y(3) + 20, "1 across", 15, CORAL, LAB + ' font-weight="700" text-anchor="middle"') +
      t(X(2) + 8, Y(4) + 5, "2 up", 15, CORAL, LAB + ' font-weight="700"') +
      dot(X, Y, 0, 1, SUN) + t(X(0) + 12, Y(1) + 20, "c = 1", 15, INK, LAB + ' font-weight="700"') +
      t(X(2.4), Y(1.6), "y = 2x + 1", 17, BLUE, LAB + ' font-weight="700"');
  } });

/* Distance time graph of a walk */
var DT = grid({ x0: 0, x1: 3, y0: 0, y1: 8, ux: 100, uy: 24, step: 0.5, stepY: 2, gridY: 1, left: 34, top: 18, xlab: "Time (hours)", ylab: "Distance from home (km)",
  aria: "Distance time graph. From 0 to 1 hour the distance rises from 0 to 6 km. From 1 hour to 1.5 hours it stays at 6 km. From 1.5 hours to 3 hours it falls back to 0.",
  body: function(X, Y){
    return '<path d="M' + X(0) + ' ' + Y(0) + ' L' + X(1) + ' ' + Y(6) + ' L' + X(1.5) + ' ' + Y(6) + ' L' + X(3) + ' ' + Y(0) + '" fill="none" stroke="' + BLUE + '" stroke-width="3.5" stroke-linejoin="round"/>';
  } });

/* Conversion graph: miles to km */
var CONV = grid({ x0: 0, x1: 50, y0: 0, y1: 80, ux: 6, uy: 3, step: 10, stepY: 20, gridX: 5, gridY: 10, left: 34, top: 22, xlab: "Miles", ylab: "Kilometres",
  aria: "Conversion graph. A straight line from 0 miles, 0 kilometres to 50 miles, 80 kilometres. 5 miles is 8 kilometres.",
  body: function(X, Y){
    return seg(X, Y, 0, 0, 50, 80, BLUE, 3.5) + seg(X, Y, 25, 0, 25, 40, CORAL, 2, "5 4") + seg(X, Y, 0, 40, 25, 40, CORAL, 2, "5 4") +
      dot(X, Y, 25, 40, CORAL, "25 miles = 40 km", 10, 22);
  } });

/* Quadratic y = x^2 - 2x - 3 */
function curve(X, Y, f, a, b, col){
  var p = "", n = 60;
  for(var k = 0; k <= n; k++){ var x = a + (b - a) * k / n; p += (k ? " L" : "M") + X(x) + " " + Y(f(x)); }
  return '<path d="' + p + '" fill="none" stroke="' + (col || BLUE) + '" stroke-width="3.5"/>';
}
var QUADG = grid({ x0: -2, x1: 4, y0: -5, y1: 5, ux: 44, uy: 22, left: 28, top: 12,
  aria: "Graph of y equals x squared minus 2x minus 3. A U shaped curve crossing the x axis at minus 1 and 3, with its lowest point, the turning point, at 1, minus 4.",
  clipped: function(X, Y){ return curve(X, Y, function(x){ return x * x - 2 * x - 3; }, -2.2, 4.2); },
  body: function(X, Y){
    return seg(X, Y, 1, -5, 1, 5, VIOLET, 2, "6 5") + dot(X, Y, -1, 0, SUN) + dot(X, Y, 3, 0, SUN) + dot(X, Y, 1, -4, CORAL) +
      t(X(1) + 10, Y(-4) + 6, "turning point", 15, CORAL, LAB + ' font-weight="700"') +
      '<rect x="' + (X(-1.3) - 4) + '" y="' + (Y(4.1) - 16) + '" width="196" height="22" rx="5" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="1.5"/>' + t(X(-1.3), Y(4.1), "roots: x = &minus;1 and x = 3", 15, INK, LAB + ' font-weight="700"');
  } });

/* Quadratic for the question: y = x^2 - 4x + 3 */
var QUADQ = grid({ x0: -1, x1: 5, y0: -2, y1: 8, ux: 44, uy: 22, left: 28, top: 12,
  aria: "Graph of a U shaped curve, y equals x squared minus 4x plus 3, drawn for x from minus 1 to 5.",
  clipped: function(X, Y){ return curve(X, Y, function(x){ return x * x - 4 * x + 3; }, -1.2, 5.2); } });

/* ---------- the line tamer ---------- */
var CHAL = [
  { txt: "Make the line go through both stars, (1, 5) and (3, 9).", pts: [[1, 5], [3, 9]], m: 2, c: 3,
    hint: "From (1, 5) to (3, 9) the line goes up 4 for 2 across. How much up for each 1 across? Then slide c until the line hits the stars.",
    show: "Up 4 for 2 across is a gradient of 2. Going back 1 from (1, 5) to x = 0 takes you down 2, to (0, 3). So y = 2x + 3." },
  { txt: "Make a line parallel to the dashed line y = 2x + 1 that goes through the star at (0, &minus;3).", pts: [[0, -3]], guide: { m: 2, c: 1 }, m: 2, c: -3,
    hint: "Parallel lines have the same gradient. And a line through (0, &minus;3) crosses the y axis at &minus;3.",
    show: "Parallel means the same m, so m = 2. The star is on the y axis, so c = &minus;3. y = 2x &minus; 3." },
  { txt: "Make a line through (0, 4) and (2, 0).", pts: [[0, 4], [2, 0]], m: -2, c: 4,
    hint: "This line goes down from left to right, so the gradient is negative. Down 4 for 2 across is how much per 1 across?",
    show: "Down 4 for 2 across is a gradient of &minus;2. It crosses the y axis at 4. y = &minus;2x + 4." },
  { txt: "Last one. Make the horizontal line that goes through (&minus;3, &minus;2).", pts: [[-3, -2]], m: 0, c: -2,
    hint: "A horizontal line is flat, so how steep is it? Every point on it has the same y coordinate.",
    show: "Flat means gradient 0. Every point has y = &minus;2, so the line is y = &minus;2." }
];
function fmtNum(v){ var a = Math.abs(v); return (v < 0 ? "&minus;" : "") + (a % 1 ? a.toFixed(1) : String(a)); }
function fmtEq(m, c){
  var ms = m === 0 ? "" : m === 1 ? "x" : m === -1 ? "&minus;x" : fmtNum(m) + "x";
  if(!ms) return "y = " + fmtNum(c);
  return "y = " + ms + (c > 0 ? " + " + c : c < 0 ? " &minus; " + (-c) : "");
}

function mountTamer(el, api){
  var d = api.data;
  if(typeof d.i !== "number") d.i = 0;
  if(typeof d.m !== "number") d.m = 1;
  if(typeof d.k !== "number") d.k = 0;
  if(!d.miss) d.miss = [0, 0, 0, 0];
  if(!d.shown) d.shown = [false, false, false, false];
  var view = d.i;

  el.innerHTML =
    '<div class="wpanel lt-task" data-r="task"></div>' +
    '<div class="lt-svg" data-r="svg"></div>' +
    '<div class="lt-eq wbig alg" data-r="eq"></div>' +
    '<div class="wpanel">' +
      '<div class="lt-ctl"><span class="lab">Gradient m <b data-r="mv"></b></span><input type="range" id="ltM" min="-4" max="4" step="0.5" aria-label="Gradient m"><span class="pm"><button type="button" data-r="m-" aria-label="Gradient down">&minus;</button><button type="button" data-r="m+" aria-label="Gradient up">+</button></span></div>' +
      '<div class="lt-ctl"><span class="lab">Intercept c <b data-r="cv"></b></span><input type="range" id="ltC" min="-6" max="10" step="1" aria-label="Intercept c"><span class="pm"><button type="button" data-r="c-" aria-label="Intercept down">&minus;</button><button type="button" data-r="c+" aria-label="Intercept up">+</button></span></div>' +
      '<div class="wrow"><button class="btn" type="button" data-r="lock">Lock it in</button><button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button></div>' +
    '</div>' +
    '<div class="fb lt-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  var rm = el.querySelector("#ltM"), rc = el.querySelector("#ltC");

  function fb(cls, html){
    var f = q("fb");
    if(!cls){ f.className = "fb lt-fb hidden"; f.innerHTML = ""; return; }
    f.className = "fb lt-fb " + cls; f.innerHTML = html;
  }
  function on(p){ return Math.abs(d.m * p[0] + d.k - p[1]) < 1e-9; }

  function star(X, Y, p, hit){
    var cx = X(p[0]), cy = Y(p[1]), r1 = 11, r2 = 5, pts = [];
    for(var k = 0; k < 10; k++){
      var a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? r2 : r1;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
    }
    return '<polygon points="' + pts.join(" ") + '" fill="' + (hit ? MINT : SUN) + '" stroke="' + INK + '" stroke-width="2"/>' +
      (hit ? '<circle cx="' + cx + '" cy="' + cy + '" r="16" fill="none" stroke="' + MINT + '" stroke-width="2.5"/>' : "");
  }

  function svg(){
    var ch = view < 4 ? CHAL[view] : null;
    var hits = ch ? ch.pts.filter(on).length : 0;
    return grid({ x0: -5, x1: 5, y0: -6, y1: 10, ux: 32, uy: 20, step: 1, stepY: 2, gridY: 1, left: 24, top: 12,
      aria: "Grid with the line " + fmtEq(d.m, d.k).replace(/&minus;/g, "minus ") + (ch ? ". Targets: " + ch.pts.map(function(p){ return "(" + p[0] + ", " + p[1] + ")"; }).join(" and ") + ". " + hits + " hit." : "."),
      clipped: function(X, Y){
        var o = "";
        if(ch && ch.guide) o += seg(X, Y, -5, ch.guide.m * -5 + ch.guide.c, 5, ch.guide.m * 5 + ch.guide.c, VIOLET, 2.5, "8 6");
        o += seg(X, Y, -5, d.m * -5 + d.k, 5, d.m * 5 + d.k, BLUE, 4);
        return o;
      },
      body: function(X, Y){
        var o = '<circle cx="' + X(0) + '" cy="' + Y(d.k) + '" r="5" fill="' + WHITE + '" stroke="' + BLUE + '" stroke-width="2.5"/>';
        if(ch) ch.pts.forEach(function(p){ o += star(X, Y, p, on(p)); });
        if(ch && ch.guide) o += t(X(-4.8), Y(8.4), "dashed: y = 2x + 1", 14, VIOLET, LAB + ' font-weight="700"');
        return o;
      } });
  }

  function task(){
    var dots = '<div class="lt-dots" aria-hidden="true">';
    for(var k = 0; k < 4; k++) dots += '<span class="' + (k < d.i ? "on" : (k === view && view < 4 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 4) return dots + '<p><b>Line tamed, all four.</b> Free play now: slide things about and watch what m and c each do.</p>';
    return dots + '<p class="tiny" style="margin:0 0 4px">Challenge ' + (view + 1) + ' of 4</p><p>' + CHAL[view].txt + '</p>' +
      '<p class="tiny" style="margin:0">Stars light up green when your line goes through them.</p>';
  }

  function draw(){
    q("task").innerHTML = task();
    q("svg").innerHTML = svg();
    q("eq").innerHTML = fmtEq(d.m, d.k);
    q("mv").innerHTML = fmtNum(d.m); q("cv").innerHTML = fmtNum(d.k);
    rm.value = d.m; rc.value = d.k;
    var live = view < 4 && d.i === view;
    q("lock").classList.toggle("hidden", !live);
    q("show").classList.toggle("hidden", !(live && d.miss[view] > 0));
  }

  function setM(v){ d.m = Math.max(-4, Math.min(4, Math.round(v * 2) / 2)); api.save(); draw(); }
  function setC(v){ d.k = Math.max(-6, Math.min(10, Math.round(v))); api.save(); draw(); }
  rm.addEventListener("input", function(){ setM(parseFloat(rm.value)); });
  rc.addEventListener("input", function(){ setC(parseFloat(rc.value)); });
  q("m-").onclick = function(){ setM(d.m - 0.5); };
  q("m+").onclick = function(){ setM(d.m + 0.5); };
  q("c-").onclick = function(){ setC(d.k - 1); };
  q("c+").onclick = function(){ setC(d.k + 1); };

  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(x){ return x > 0; })) return "right2";
    return "right1";
  }

  function solved(viaShow){
    var ch = CHAL[view];
    d.i = view + 1;
    var last = d.i >= 4;
    if(last) d.result = result();
    api.save();
    var html = (viaShow ? "<b>Here it is.</b> " + ch.show : "<b>" + ["Tamed.", "Got it.", "Lovely line.", "Bang on."][view] + "</b> " + fmtEq(ch.m, ch.c) + " does it.");
    if(!last) html += '<br><button class="btn" type="button" data-r="next">Next challenge</button>';
    else html += '<p style="margin:8px 0 0">m sets the steepness and direction; c slides the line up and down without turning it. That is all y = mx + c is.</p>';
    fb(viaShow ? "show" : "good", html);
    draw();
    if(!last){
      q("next").onclick = function(){ view = d.i; fb(null); draw(); };
    }else{
      view = 4; draw();
      api.done(d.result);
    }
  }

  q("lock").onclick = function(){
    if(view >= 4) return;
    var ch = CHAL[view];
    if(d.m === ch.m && d.k === ch.c){ solved(false); return; }
    d.miss[view]++; api.save();
    var msg;
    if(d.m === ch.m) msg = "The gradient is spot on, so the steepness is right. Now slide c to move the line up or down.";
    else if(d.k === ch.c) msg = "It crosses the y axis in the right place. Now the steepness needs work. " + ch.hint;
    else msg = ch.hint;
    fb("nudge", "<b>" + ["Nearly.", "Not tamed yet.", "Close."][d.miss[view] % 3] + "</b> " + msg);
    draw();
  };
  q("show").onclick = function(){
    if(view >= 4) return;
    var ch = CHAL[view];
    d.shown[view] = true; d.m = ch.m; d.k = ch.c; api.save();
    solved(true);
  };

  if(d.i >= 4) view = 4;
  draw();
  if(d.i >= 4 && d.result){
    fb("good", "<b>All four lines tamed.</b> Free play is open if you fancy it.");
    api.done(d.result);
  }
}
