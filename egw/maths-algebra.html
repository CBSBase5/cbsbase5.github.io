<script>
(function(){
"use strict";

var INK = "#141a33", TEAL = "#3a5cff", BRIGHT = "#22b8e6", ORANGE = "#ff5d5d",
    YELLOW = "#ffd23f", PLUM = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function fr(top, bot){ return '<span class="fr"><span>' + top + '</span><span>' + bot + '</span></span>'; }

/* ---------- figures ---------- */

/* Anatomy of an expression */
var TERMS =
'<svg viewBox="0 0 520 150" role="img" aria-label="The expression 4x plus 3y minus 7 has three terms: 4x, plus 3y and minus 7. In 4x, 4 is the coefficient and x is the variable.">' +
'<rect x="40" y="30" width="110" height="56" rx="12" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="3"/>' +
'<rect x="200" y="30" width="130" height="56" rx="12" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>' +
'<rect x="380" y="30" width="100" height="56" rx="12" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>' +
t(95, 68, "4x", 28, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(265, 68, "+ 3y", 28, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(430, 68, "&minus; 7", 28, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(260, 20, "three terms", 17, TEAL, LAB + ' font-weight="800" text-anchor="middle" letter-spacing="1"') +
'<path d="M78 92 V110" stroke="' + ORANGE + '" stroke-width="2.5"/><path d="M110 92 V110" stroke="' + PLUM + '" stroke-width="2.5"/>' +
t(60, 132, "coefficient", 18, ORANGE, BODY + ' font-weight="700" text-anchor="middle"') +
t(140, 132, "variable", 18, PLUM, BODY + ' font-weight="700" text-anchor="middle"') +
t(430, 120, "constant", 18, INK, BODY + ' font-weight="700" text-anchor="middle"') +
t(430, 142, "(just a number)", 16, INK, BODY + ' text-anchor="middle"') +
'</svg>';

/* Expand and factorise arrows */
var EXPAND =
'<svg viewBox="0 0 520 150" role="img" aria-label="3 times (x plus 4) expands to 3x plus 12. Going back the other way is factorising.">' +
t(110, 78, "3(x + 4)", 30, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(410, 78, "3x + 12", 30, INK, LAB + ' font-weight="800" text-anchor="middle"') +
'<path d="M200 50 Q260 18 320 50" fill="none" stroke="' + TEAL + '" stroke-width="3"/><path d="M309 40 L321 51 L306 54" fill="none" stroke="' + TEAL + '" stroke-width="3"/>' +
t(260, 22, "EXPAND", 17, TEAL, LAB + ' font-weight="800" text-anchor="middle" letter-spacing="1.5"') +
'<path d="M320 98 Q260 130 200 98" fill="none" stroke="' + ORANGE + '" stroke-width="3"/><path d="M211 108 L199 97 L214 94" fill="none" stroke="' + ORANGE + '" stroke-width="3"/>' +
t(260, 145, "FACTORISE", 17, ORANGE, LAB + ' font-weight="800" text-anchor="middle" letter-spacing="1.5"') +
'<path d="M62 50 Q75 30 92 50" fill="none" stroke="' + PLUM + '" stroke-width="2" stroke-dasharray="4 3"/>' +
'<path d="M62 50 Q100 14 145 50" fill="none" stroke="' + PLUM + '" stroke-width="2" stroke-dasharray="4 3"/>' +
'</svg>';

/* Balance picture for the solving card */
var BAL_SMALL =
'<svg viewBox="0 0 520 150" role="img" aria-label="A level balance with 2x plus 3 on the left and 11 on the right.">' +
'<path d="M260 50 L240 140 H280 Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
'<rect x="60" y="44" width="400" height="10" rx="5" fill="' + INK + '"/>' +
'<circle cx="260" cy="49" r="7" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="70" y="10" width="34" height="34" rx="5" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2"/>' +
'<rect x="108" y="10" width="34" height="34" rx="5" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2"/>' +
t(87, 33, "x", 18, WHITE, LAB + ' font-weight="800" text-anchor="middle"') +
t(125, 33, "x", 18, WHITE, LAB + ' font-weight="800" text-anchor="middle"') +
(function(){ var s = ""; for(var k = 0; k < 3; k++) s += '<rect x="' + (150 + k * 18) + '" y="28" width="15" height="15" rx="2" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="1.5"/>'; return s; })() +
(function(){ var s = ""; for(var k = 0; k < 11; k++){ var c = k % 6, r = Math.floor(k / 6); s += '<rect x="' + (340 + c * 18) + '" y="' + (28 - r * 18) + '" width="15" height="15" rx="2" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="1.5"/>'; } return s; })() +
t(120, 84, "2x + 3", 24, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(390, 84, "11", 24, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(260, 82, "=", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
'</svg>';

/* Triangle for forming an equation */
var TRI =
'<svg viewBox="0 0 520 220" role="img" aria-label="A triangle with angles x, 2x and x plus 40 degrees. Not drawn accurately.">' +
'<path d="M60 190 L460 190 L190 30 Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
'<path d="M110 190 A50 50 0 0 0 87 149" fill="none" stroke="' + TEAL + '" stroke-width="2.5"/>' +
'<path d="M415 190 A45 45 0 0 1 422 168" fill="none" stroke="' + ORANGE + '" stroke-width="2.5"/>' +
'<path d="M171 59 A34 34 0 0 0 219 47" fill="none" stroke="' + PLUM + '" stroke-width="2.5"/>' +
t(122, 180, "2x", 28, TEAL, LAB + ' font-weight="800"') +
t(360, 182, "x", 28, ORANGE, LAB + ' font-weight="800"') +
t(160, 96, "x + 40", 24, PLUM, LAB + ' font-weight="800"') +
t(510, 214, "Not drawn accurately", 16, INK, BODY + ' text-anchor="end"') +
'</svg>';

/* Rectangle for the exam question */
var RECT =
'<svg viewBox="0 0 520 190" role="img" aria-label="A rectangle with length 2x plus 3 centimetres and width x plus 1 centimetres. Not drawn accurately.">' +
'<rect x="50" y="34" width="330" height="120" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="3"/>' +
t(215, 24, "(2x + 3) cm", 24, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(390, 102, "(x + 1) cm", 24, INK, LAB + ' font-weight="800"') +
'<path d="M50 34 h14 v14 h-14" fill="none" stroke="' + INK + '" stroke-width="2"/>' +
t(510, 182, "Not drawn accurately", 16, INK, BODY + ' text-anchor="end"') +
'</svg>';

/* Number lines */
function numberLine(lo, hi, marks, aria, w){
  // marks: [{v, filled}], plus optional {from, to} shading via arrow
  w = w || 520;
  var pad = 30, step = (w - 2 * pad) / (hi - lo);
  function X(v){ return pad + (v - lo) * step; }
  var s = '<svg viewBox="0 0 ' + w + ' 80" role="img" aria-label="' + aria + '">';
  s += '<path d="M' + (pad - 18) + ' 40 H' + (w - pad + 18) + '" stroke="' + INK + '" stroke-width="2.5"/>';
  for(var v = lo; v <= hi; v++){
    s += '<path d="M' + X(v) + ' 33 V47" stroke="' + INK + '" stroke-width="2"/>';
    s += t(X(v), 72, v < 0 ? "&minus;" + (-v) : String(v), 19, INK, BODY + ' text-anchor="middle"');
  }
  marks.forEach(function(m){
    if(m.line){
      var a = X(m.line[0]), b = m.line[1] === "L" ? pad - 14 : m.line[1] === "R" ? w - pad + 14 : X(m.line[1]);
      s += '<path d="M' + a + ' 20 H' + b + '" stroke="' + TEAL + '" stroke-width="4"/>';
      if(m.line[1] === "L") s += '<path d="M' + (b + 9) + ' 13 L' + b + ' 20 L' + (b + 9) + ' 27" fill="none" stroke="' + TEAL + '" stroke-width="4"/>';
      if(m.line[1] === "R") s += '<path d="M' + (b - 9) + ' 13 L' + b + ' 20 L' + (b - 9) + ' 27" fill="none" stroke="' + TEAL + '" stroke-width="4"/>';
    }
  });
  marks.forEach(function(m){
    if(m.v !== undefined) s += '<circle cx="' + X(m.v) + '" cy="20" r="7" fill="' + (m.filled ? TEAL : WHITE) + '" stroke="' + TEAL + '" stroke-width="3"/>';
  });
  s += '</svg>';
  return s;
}

var NL_LEARN = numberLine(-3, 5, [{ line: [-1, 3] }, { v: -1, filled: false }, { v: 3, filled: true }],
  "Number line showing minus 1 less than x, less than or equal to 3: open circle at minus 1, filled circle at 3, joined by a line.");

/* Grid for double brackets */
var GRID =
'<svg viewBox="0 0 520 190" role="img" aria-label="Grid method for (x plus 3)(x plus 5): x squared, 5x, 3x and 15.">' +
t(170, 28, "x", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(290, 28, "+5", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(84, 82, "x", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(84, 147, "+3", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
'<rect x="110" y="40" width="120" height="65" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="230" y="40" width="120" height="65" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="110" y="105" width="120" height="65" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.5"/>' +
'<rect x="230" y="105" width="120" height="65" fill="' + BRIGHT + '" stroke="' + INK + '" stroke-width="2.5"/>' +
t(170, 81, "x&sup2;", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(290, 81, "5x", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(170, 146, "3x", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(290, 146, "15", 22, INK, LAB + ' font-weight="800" text-anchor="middle"') +
t(440, 100, "x&sup2; + 8x + 15", 21, TEAL, LAB + ' font-weight="800" text-anchor="middle"') +
t(440, 126, "5x + 3x = 8x", 17, INK, BODY + ' text-anchor="middle"') +
'</svg>';

/* ---------- the balance scale widget ---------- */
var PUZ = [
  { s: { a: 3, b: 5, c: 0, d: 20 }, X: 5,
    ops: [
      { k: "subU", n: 5, label: "Take 5 from both sides" },
      { k: "div", n: 3, label: "Divide both sides by 3" },
      { k: "addU", n: 5, label: "Add 5 to both sides" },
      { k: "subUL", n: 5, label: "Take 5 from the left side only" },
      { k: "subU", n: 3, label: "Take 3 from both sides" }
    ],
    check: "Check: 3 &times; 5 + 5 = 15 + 5 = 20. It works." },
  { s: { a: 5, b: 2, c: 2, d: 14 }, X: 4,
    ops: [
      { k: "subX", n: 2, label: "Take 2x from both sides" },
      { k: "subU", n: 2, label: "Take 2 from both sides" },
      { k: "div", n: 3, label: "Divide both sides by 3" },
      { k: "subXL", n: 2, label: "Take 2x from the left side only" },
      { k: "addX", n: 2, label: "Add 2x to both sides" },
      { k: "subU", n: 14, label: "Take 14 from both sides" }
    ],
    check: "Check: left 5 &times; 4 + 2 = 22, right 2 &times; 4 + 14 = 22. Balanced." }
];

function side(a, b){
  var x = a === 0 ? "" : (a === 1 ? "x" : a + "x");
  if(!x) return String(b);
  return b ? x + " + " + b : x;
}
function eqStr(s){ return side(s.a, s.b) + " = " + side(s.c, s.d); }
function score(s){ return (s.b ? 1 : 0) + (s.c ? 1 : 0) + (s.a !== 1 ? 1 : 0); }
function solvedSt(s){ return s.a === 1 && !s.b && !s.c; }
function cp(s){ return { a: s.a, b: s.b, c: s.c, d: s.d }; }

function tryOp(s, op){
  var n = op.n, r = cp(s);
  if(op.k === "addU" || op.k === "addX"){
    return { kind: "meh", msg: "That would keep it balanced, because it does the same to both sides. But it puts <b>more</b> on each side, not less, so x would be further from being on its own." };
  }
  if(op.k === "subUL" || op.k === "subXL"){
    if(op.k === "subUL") r.b = Math.max(0, r.b - n); else r.a = Math.max(0, r.a - n);
    return { kind: "tip", st: r, msg: "The scale tips. Taking weight off <b>one side only</b> means the two sides are no longer equal, so it is not an equation any more. Whatever you do to one side, do to the other." };
  }
  if(op.k === "subU"){
    if(s.b < n) return { kind: "cant", msg: s.b === 0 ? "There are no loose units on the left any more, so there is nothing to take away there." :
      "There are only " + s.b + " units on the left, so taking " + n + " from both sides would leave a negative, which this scale cannot show. Look for a move that clears something away exactly." };
    r.b -= n; r.d -= n;
  }else if(op.k === "subX"){
    if(s.c < n) return { kind: "cant", msg: s.c === 0 ? "There are no x blocks on the right now, so you cannot take 2x from both sides." : "There are not enough x blocks on the right for that." };
    r.a -= n; r.c -= n;
  }else if(op.k === "div"){
    if(s.a % n || s.b % n || s.c % n || s.d % n) return { kind: "cant", msg: "Not yet. Dividing now would split some of the weights into fractions (try sharing " + (s.b % n ? s.b : s.a) + " between " + n + "). Clear away the loose units and the extra x blocks first, then divide." };
    r.a /= n; r.b /= n; r.c /= n; r.d /= n;
  }
  if(score(r) < score(s)) return { kind: "good", st: r };
  return { kind: "meh", st: r, msg: "That would keep the scale balanced, but x would be no closer to being on its own. Look for a move that clears one kind of weight away completely." };
}

function mountScale(el, api){
  var d = api.data;
  if(typeof d.p !== "number") d.p = 0;
  if(!d.st) d.st = cp(PUZ[0].s);
  if(!d.log) d.log = [{ eq: eqStr(PUZ[0].s) }];
  if(!d.miss) d.miss = [0, 0];
  if(!d.shown) d.shown = [false, false];
  var busy = false;
  var angle = 0;
  var reduce = false;
  try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  el.innerHTML =
    '<div class="wpanel" data-r="task"></div>' +
    '<div class="sc-svg" data-r="svg"></div>' +
    '<div class="sc-eq wbig" data-r="eq"></div>' +
    '<div class="sc-ops" data-r="ops"></div>' +
    '<div class="wrow"><button class="btn btn-quiet hidden" type="button" data-r="show">Show me the next move</button></div>' +
    '<div class="fb sc-fb hidden" data-r="fb" aria-live="polite"></div>' +
    '<div class="wpanel"><p class="wnote" style="margin-top:0"><b>Your working</b>, written the way the exam likes it:</p><ul class="sc-log" data-r="log"></ul></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }

  function scaleSvg(s, ang){
    var cx = 180, by = 40, R = 108;
    var rad = ang * Math.PI / 180;
    var L = { x: cx - R * Math.cos(rad), y: by - R * Math.sin(rad) };
    var Rt = { x: cx + R * Math.cos(rad), y: by + R * Math.sin(rad) };
    var drop = 100;
    var out = '<svg viewBox="0 0 360 196" role="img" aria-label="Balance scale showing ' + eqStr(s).replace(/x/g, " x") + '">';
    out += '<path d="M' + cx + ' ' + by + ' L' + (cx - 26) + ' 186 H' + (cx + 26) + ' Z" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
    out += '<path d="M20 188 H340" stroke="' + INK + '" stroke-width="2" opacity=".35"/>';
    function pan(p, a, b){
      var py = p.y + drop, hw = 66;
      var g = '<path d="M' + p.x + ' ' + p.y + ' L' + (p.x - hw) + ' ' + py + ' M' + p.x + ' ' + p.y + ' L' + (p.x + hw) + ' ' + py + '" stroke="' + INK + '" stroke-width="1.5" opacity=".55"/>';
      // contents
      var bw = 20, bp = 23, us = 12, up = 14;
      var blocksW = a ? a * bp - 3 : 0;
      var avail = 2 * hw - 8 - blocksW - (a && b ? 6 : 0);
      var cols = b ? Math.max(1, Math.min(b, Math.floor((avail + 2) / up))) : 0;
      var unitsW = cols ? cols * up - 2 : 0;
      var total = blocksW + (a && b ? 6 : 0) + unitsW;
      var x0 = p.x - total / 2;
      for(var k = 0; k < a; k++){
        var bx = x0 + k * bp;
        g += '<rect x="' + bx.toFixed(1) + '" y="' + (py - 34) + '" width="' + bw + '" height="32" rx="4" fill="' + TEAL + '" stroke="' + INK + '" stroke-width="2"/>';
        g += t((bx + bw / 2).toFixed(1), py - 13, "x", 15, WHITE, LAB + ' font-weight="800" text-anchor="middle"');
      }
      var ux = x0 + blocksW + (a && b ? 6 : 0);
      for(var u = 0; u < b; u++){
        var c = u % cols, r = Math.floor(u / cols);
        g += '<rect x="' + (ux + c * up).toFixed(1) + '" y="' + (py - 2 - us - r * up) + '" width="' + us + '" height="' + us + '" rx="2" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="1.5"/>';
      }
      g += '<path d="M' + (p.x - hw - 4) + ' ' + py + ' H' + (p.x + hw + 4) + ' l-8 8 H' + (p.x - hw + 4) + ' Z" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>';
      return g;
    }
    out += pan(L, s.a, s.b) + pan(Rt, s.c, s.d);
    out += '<path d="M' + L.x.toFixed(1) + ' ' + L.y.toFixed(1) + ' L' + Rt.x.toFixed(1) + ' ' + Rt.y.toFixed(1) + '" stroke="' + INK + '" stroke-width="9" stroke-linecap="round"/>';
    out += '<circle cx="' + cx + '" cy="' + by + '" r="7" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2.5"/>';
    out += '</svg>';
    return out;
  }

  function weight(s, X){ return [s.a * X + s.b, s.c * X + s.d]; }
  function targetAngle(s){
    var w = weight(s, PUZ[Math.min(d.p, 1)].X), diff = w[1] - w[0];
    if(!diff) return 0;
    var a = diff * 1.2;
    if(Math.abs(a) < 7) a = a < 0 ? -7 : 7;
    return Math.max(-12, Math.min(12, a));
  }

  function paint(s, ang){
    q("svg").innerHTML = scaleSvg(s, ang);
    q("eq").innerHTML = eqStr(s);
  }

  function animate(s, to, cb){
    if(reduce){ angle = to; paint(s, angle); if(cb) cb(); return; }
    var from = angle, t0 = null;
    function f(ts){
      if(t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / 380);
      var e = 1 - Math.pow(1 - k, 3);
      angle = from + (to - from) * e;
      paint(s, angle);
      if(k < 1) requestAnimationFrame(f); else if(cb) cb();
    }
    requestAnimationFrame(f);
  }

  function task(){
    if(d.p >= 2){
      return '<p style="margin:0"><b>Both equations solved.</b> The scale is a picture of the rule: do the same to both sides and it stays balanced.</p>';
    }
    return '<p class="tiny" style="margin:0 0 4px">Equation ' + (d.p + 1) + ' of 2</p>' +
      '<p style="margin:0">Each <b style="color:' + TEAL + '">teal block</b> weighs x. Each <b style="color:#e04848">orange square</b> weighs 1. Pick moves that keep the scale balanced until a single x is alone on one side.</p>';
  }

  function drawLog(){
    q("log").innerHTML = d.log.map(function(l){
      return '<li><span class="alg">' + l.eq + '</span>' + (l.op ? '<span>' + l.op + '</span>' : "") + '</li>';
    }).join("");
  }

  function drawOps(){
    var box = q("ops");
    box.innerHTML = "";
    if(d.p >= 2) return;
    PUZ[d.p].ops.forEach(function(op, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "sc-op"; b.innerHTML = op.label;
      b.disabled = busy || solvedSt(d.st);
      b.onclick = function(){ choose(i, false); };
      box.appendChild(b);
    });
    q("show").classList.toggle("hidden", !(d.p < 2 && d.miss[d.p] > 0 && !solvedSt(d.st)));
  }

  function fb(cls, html){
    var f = q("fb");
    if(!cls){ f.className = "fb sc-fb hidden"; f.innerHTML = ""; return; }
    f.className = "fb sc-fb " + cls; f.innerHTML = html;
  }

  function result(){
    if(d.shown[0] || d.shown[1]) return "shown";
    if(d.miss[0] || d.miss[1]) return "right2";
    return "right1";
  }

  function finishPuzzle(){
    var P = PUZ[d.p];
    var last = d.p === 1;
    var html = "<b>x = " + d.st.d + ".</b> " + P.check;
    if(last){
      d.result = result();
      html += '<p style="margin:8px 0 0">With x on both sides, the trick is to clear the <b>smaller</b> number of x blocks first, so you never end up with negative x.</p>';
    }else{
      html += '<br><button class="btn" type="button" data-r="next">Next equation, x on both sides</button>';
    }
    api.save();
    fb("good", html);
    if(!last){
      q("next").onclick = function(){
        d.p = 1; d.st = cp(PUZ[1].s); d.log = [{ eq: eqStr(PUZ[1].s) }];
        api.save(); fb(null); angle = 0; render();
      };
    }else{
      d.p = 2; api.save();
      drawOps(); q("task").innerHTML = task();
      api.done(d.result);
    }
  }

  function choose(i, viaShow){
    if(busy || d.p >= 2 || solvedSt(d.st)) return;
    var op = PUZ[d.p].ops[i];
    var r = tryOp(d.st, op);
    if(r.kind === "good"){
      d.st = r.st;
      d.log.push({ eq: eqStr(r.st), op: op.label.toLowerCase() });
      api.save();
      fb(viaShow ? "show" : null, viaShow ? "<b>Here is the next move:</b> " + op.label.toLowerCase() + ". " +
        (op.k === "div" ? "Once the x blocks are alone, share both sides equally." : op.k === "subX" ? "Clear the smaller pile of x blocks so x is only on one side." : "Clear the loose units away from the x side.") : "");
      paint(d.st, 0); drawLog(); drawOps();
      if(solvedSt(d.st)) finishPuzzle();
      return;
    }
    d.miss[d.p]++;
    api.save();
    if(r.kind === "tip"){
      busy = true; drawOps();
      fb("nudge", "<b>Whoa.</b> " + r.msg);
      animate(r.st, targetAngle(r.st), function(){
        setTimeout(function(){
          animate(d.st, 0, function(){ busy = false; drawOps(); });
        }, 1100);
      });
      return;
    }
    fb("nudge", "<b>Not that one yet.</b> " + r.msg);
    drawOps();
  }

  q("show").onclick = function(){
    if(d.p >= 2) return;
    var ops = PUZ[d.p].ops;
    for(var i = 0; i < ops.length; i++){
      if(tryOp(d.st, ops[i]).kind === "good"){ d.shown[d.p] = true; choose(i, true); return; }
    }
  };

  function render(){
    q("task").innerHTML = task();
    paint(d.st, 0);
    drawLog(); drawOps();
  }

  render();
  if(d.p >= 2 && d.result){
    fb("good", "<b>Both equations solved.</b> x = 5 and then x = 4. Do the same to both sides, every time.");
    api.done(d.result);
  }else if(solvedSt(d.st) && d.p < 2){
    finishPuzzle();
  }
}
