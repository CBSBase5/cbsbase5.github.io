/* Risk dial widget */

.rd-card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:1rem;line-height:1.45}
.rd-svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;touch-action:manipulation;user-select:none;cursor:pointer}
.rd-dial{width:100%;max-width:300px;height:auto;display:block;margin:4px auto 0}

.rd-in{width:110px;text-align:center;padding:9px 8px;font-family:inherit;font-size:1.1rem;border:3px solid rgba(20,26,51,.22);border-radius:12px 10px 14px 10px;background:#fff;color:var(--ink)}

<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CYAN = "#22b8e6", CORAL = "#ff5d5d",
    SUN = "#ffd23f", MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, txt, o){
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || "middle") + '" ' + (o.lab ? LAB : BODY) +
    ' font-weight="' + (o.w || 400) + '" font-size="' + (o.s || 15) + '" fill="' + (o.c || INK) + '">' + txt + '</text>';
}

/* ---------- figures ---------- */
var SCALE = (function(){
  var L = 22, R = 338, y = 64;
  function X(p){ return L + p * (R - L); }
  var s = '<svg viewBox="0 0 360 150" role="img" aria-label="Probability scale from 0, impossible, through 0.5, even chance, to 1, certain. Unlikely sits between 0 and 0.5, likely between 0.5 and 1." style="max-width:460px">';
  s += '<defs><linearGradient id="psg" x1="0" x2="1"><stop offset="0" stop-color="' + CORAL + '"/><stop offset="0.5" stop-color="' + SUN + '"/><stop offset="1" stop-color="' + MINT + '"/></linearGradient></defs>';
  s += '<rect x="' + L + '" y="' + (y - 9) + '" width="' + (R - L) + '" height="18" rx="9" fill="url(#psg)" stroke="' + INK + '" stroke-width="2"/>';
  [[0, "0"], [0.5, "0.5"], [1, "1"]].forEach(function(p){
    s += '<line x1="' + X(p[0]) + '" y1="' + (y - 16) + '" x2="' + X(p[0]) + '" y2="' + (y + 16) + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(X(p[0]), y - 24, p[1], { lab: 1, w: 800, s: 17 });
  });
  s += t(X(0) + 4, y + 38, "impossible", { a: "start", s: 14 });
  s += t(X(0.5), y + 38, "even chance", { s: 14 });
  s += t(X(1) - 4, y + 38, "certain", { a: "end", s: 14 });
  s += t(X(0.25), y + 62, "unlikely", { s: 14, w: 700 });
  s += t(X(0.75), y + 62, "likely", { s: 14, w: 700 });
  return s + '</svg>';
})();

var DICE = (function(){
  var s = '<svg viewBox="0 0 330 296" role="img" aria-label="Sample space for the total of two dice: a 6 by 6 grid. The four cells with a total of 9 are highlighted: 3 and 6, 4 and 5, 5 and 4, 6 and 3." style="max-width:400px">';
  var x0 = 64, y0 = 52, c = 42;
  s += t(x0 + 3 * c, 18, "Dice 1", { lab: 1, w: 800 });
  s += t(16, y0 + 3 * c, "Dice 2", { lab: 1, w: 800 });
  for(var a = 1; a <= 6; a++){
    s += t(x0 + (a - 0.5) * c, y0 - 10, a, { w: 700 });
    s += t(x0 - 12, y0 + (a - 0.5) * c + 5, a, { w: 700 });
  }
  for(var i = 1; i <= 6; i++) for(var j = 1; j <= 6; j++){
    var on = i + j === 9;
    s += '<rect x="' + (x0 + (i - 1) * c) + '" y="' + (y0 + (j - 1) * c) + '" width="' + c + '" height="' + c + '" fill="' + (on ? SUN : WHITE) + '" stroke="' + INK + '" stroke-width="1.5"/>';
    s += t(x0 + (i - 0.5) * c, y0 + (j - 0.5) * c + 6, i + j, { s: 16, w: on ? 800 : 400 });
  }
  return s + '</svg>';
})();

var VENN = (function(){
  var s = '<svg viewBox="0 0 360 220" role="img" aria-label="Venn diagram. 50 students. Rap only 15, both rap and pop 8, pop only 11, neither 16." style="max-width:440px">';
  s += '<rect x="4" y="4" width="352" height="212" rx="12" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2"/>';
  s += t(20, 28, "&xi; = 50 students", { a: "start", lab: 1, w: 700, s: 14 });
  s += '<circle cx="140" cy="116" r="78" fill="' + CORAL + '" fill-opacity="0.35" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<circle cx="222" cy="116" r="78" fill="' + CYAN + '" fill-opacity="0.35" stroke="' + INK + '" stroke-width="2.5"/>';
  s += t(100, 60, "Rap", { lab: 1, w: 800, s: 16 });
  s += t(262, 60, "Pop", { lab: 1, w: 800, s: 16 });
  s += t(104, 124, "15", { lab: 1, w: 800, s: 22 });
  s += t(181, 124, "8", { lab: 1, w: 800, s: 22 });
  s += t(258, 124, "11", { lab: 1, w: 800, s: 22 });
  s += t(330, 200, "16", { lab: 1, w: 800, s: 22 });
  return s + '</svg>';
})();

var TWOWAY =
'<table class="datatable"><tr><th></th><th>Football</th><th>Netball</th><th>Swimming</th><th>Total</th></tr>' +
'<tr><th>Year 10</th><td>12</td><td>10</td><td>18</td><td>40</td></tr>' +
'<tr><th>Year 11</th><td>14</td><td>16</td><td>10</td><td>40</td></tr>' +
'<tr><th>Total</th><td>26</td><td>26</td><td>28</td><td>80</td></tr></table>';

/* two stage tree: first [[label, p]], second rows of [[label, p]] for each first branch */
function TREE(o){
  var H = o.h || 236, x0 = 8, x1 = 96, x2 = 162, x3 = 250;
  var s = '<svg viewBox="0 0 360 ' + H + '" role="img" aria-label="' + o.aria + '" style="max-width:460px">';
  var n1 = o.first.length;
  var ys1 = o.first.map(function(_, k){ return (k + 0.5) * H / n1; });
  var y0 = H / 2;
  o.first.forEach(function(f, k){
    s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1 + '" y2="' + ys1[k] + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t((x0 + x1) / 2 - 2, (y0 + ys1[k]) / 2 + (k ? 22 : -10), f[1], { w: 700, s: 15, c: BLUE });
    s += t(x1 + 5, ys1[k] + 5, f[0], { a: "start", lab: 1, w: 800, s: 15 });
    var sec = o.second[k], band = H / n1;
    sec.forEach(function(g, j){
      var y2 = ys1[k] - band / 2 + (j + 0.5) * band / sec.length;
      s += '<line x1="' + x2 + '" y1="' + ys1[k] + '" x2="' + x3 + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="2"/>';
      s += t((x2 + x3) / 2, (ys1[k] + y2) / 2 + (j ? 20 : -8), g[1], { w: 700, s: 15, c: BLUE });
      s += t(x3 + 5, y2 + 5, g[0], { a: "start", lab: 1, w: 800, s: 15 });
      if(o.out) s += t(356, y2 + 5, o.out[k][j], { a: "end", s: 15, w: 700, c: VIOLET });
    });
  });
  return s + '</svg>';
}

var TREE_RW = TREE({
  first: [["R", "0.3"], ["G", "0.7"]],
  second: [[["R", "0.3"], ["G", "0.7"]], [["R", "0.3"], ["G", "0.7"]]],
  out: [["0.09", "0.21"], ["0.21", "0.49"]],
  aria: "Tree diagram for two picks with replacement. First pick red 0.3 or green 0.7. Second pick the same each time: red 0.3, green 0.7. Outcomes: red red 0.09, red green 0.21, green red 0.21, green green 0.49."
});

var TREE_WO = TREE({
  first: [["R", "4/10"], ["B", "6/10"]],
  second: [[["R", "3/9"], ["B", "6/9"]], [["R", "4/9"], ["B", "5/9"]]],
  aria: "Tree diagram for two picks without replacement from 4 red and 6 blue sweets. First pick red 4/10 or blue 6/10. After red: red 3/9, blue 6/9. After blue: red 4/9, blue 5/9."
});

var TREE_LATE = TREE({
  first: [["Rain", "0.3"], ["Dry", "0.7"]],
  second: [[["Late", "0.6"], ["On time", "0.4"]], [["Late", "0.2"], ["On time", "0.8"]]],
  aria: "Tree diagram. Rain 0.3, dry 0.7. If rain: late 0.6, on time 0.4. If dry: late 0.2, on time 0.8."
});

var SCREEN = TREE({
  h: 236,
  first: [["Has it", "20"], ["Not", "980"]],
  second: [[["Pos", "18"], ["Neg", "2"]], [["Pos", "49"], ["Neg", "931"]]],
  aria: "Frequency tree for 1000 people. 20 have the condition: 18 test positive, 2 negative. 980 do not: 49 test positive, 931 negative."
});

/* ---------- widget: Risk dial ---------- */
var ROUNDS = [
  { title: "Skate park", a: "Skateboarders", b: "Non skateboarders", ta: 6, tb: 2,
    text: "Out of every 100 teens who skateboard each week, <b>6</b> sprain a wrist in a year. Out of every 100 who do not, <b>2</b> do.",
    ask: "How many times as likely is a skateboarder to sprain a wrist?", rr: 3,
    quip: "Three times the risk, but it is still only 6 in 100. Both facts matter." },
  { title: "Beach day", a: "No sun cream", b: "Sun cream", ta: 40, tb: 10,
    text: "On a hot beach day, <b>40</b> in every 100 people without sun cream burn. With sun cream, <b>10</b> in 100 do.",
    ask: "How many times as likely is someone <b>without</b> sun cream to burn?", rr: 4,
    quip: "Four times the risk, and this time the absolute risk is big too: 40 in 100. Slap it on." },
  { title: "Cracked screen", a: "No case", b: "Case", ta: 5, tb: 3,
    text: "Phones in a year: <b>10 out of 200</b> without a case got a cracked screen, and <b>9 out of 300</b> with a case did. Shade each as <b>per 100</b>.",
    ask: "How many times as likely is a phone <b>without</b> a case to crack? (2 decimal places)", rr: 5 / 3, tol: 0.02, show: "1.67",
    quip: "About 1.67 times as likely. Different group sizes, so scaling to per 100 made it a fair comparison." }
];

function mountRisk(el, api){
  var d = api.data;
  d.r = d.r || 0;
  d.na = d.na || 0; d.nb = d.nb || 0;
  d.stage = d.stage || "shade";
  d.stars = d.stars || [];
  d.miss = d.miss || 0;
  d.tries = d.tries || 0;

  el.innerHTML =
    '<div class="wpanel">' +
      '<div class="rd-top"><span class="rd-round" id="rdRound"></span><span class="rd-stars" id="rdStars" aria-label="Stars"></span></div>' +
      '<div class="rd-card" id="rdText"></div>' +
      '<svg class="rd-svg" id="rdGrid" viewBox="0 0 360 230" role="img" aria-label="Two groups of 100 people. Tap a person to shade everyone up to that person."></svg>' +
      '<div class="rd-adj" id="rdAdj">' +
        '<span><button class="btn btn-quiet" type="button" data-g="a" data-d="-1" aria-label="One fewer in the left group">&minus;</button><button class="btn btn-quiet" type="button" data-g="a" data-d="1" aria-label="One more in the left group">+</button></span>' +
        '<span><button class="btn btn-quiet" type="button" data-g="b" data-d="-1" aria-label="One fewer in the right group">&minus;</button><button class="btn btn-quiet" type="button" data-g="b" data-d="1" aria-label="One more in the right group">+</button></span>' +
      '</div>' +
      '<div id="rdCtl"></div>' +
      '<svg class="rd-dial" id="rdDial" viewBox="0 0 300 172" role="img" aria-label="Relative risk dial from 0 to 5. 1 means the same risk."></svg>' +
      '<div class="wnote" id="rdMsg" aria-live="polite"></div>' +
    '</div>';

  var grid = el.querySelector("#rdGrid"), dial = el.querySelector("#rdDial"), ctl = el.querySelector("#rdCtl"), msg = el.querySelector("#rdMsg");
  var C = 15.6, GX = [14, 190], GY = 34;

  function R(){ return ROUNDS[Math.min(d.r, ROUNDS.length - 1)]; }

  function person(x, y, on, col){
    var f = on ? col : WHITE, sk = on ? INK : "#b9b8c9";
    return '<circle cx="' + x + '" cy="' + (y - 3.4) + '" r="2.6" fill="' + f + '" stroke="' + sk + '" stroke-width="1"/>' +
      '<path d="M' + (x - 4) + ' ' + (y + 5.5) + ' Q' + x + ' ' + (y - 3.5) + ' ' + (x + 4) + ' ' + (y + 5.5) + ' Z" fill="' + f + '" stroke="' + sk + '" stroke-width="1"/>';
  }

  function drawGrid(){
    var r = R(), s = "";
    [["a", r.a, CORAL], ["b", r.b, CYAN]].forEach(function(g, k){
      var n = k ? d.nb : d.na, gx = GX[k];
      s += '<rect x="' + (gx - 6) + '" y="' + (GY - 6) + '" width="' + (10 * C + 12) + '" height="' + (10 * C + 12) + '" rx="8" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2"/>';
      s += t(gx + 5 * C, 20, g[1], { lab: 1, w: 800, s: 15 });
      for(var i = 0; i < 100; i++){
        var cx = gx + (i % 10 + 0.5) * C, cy = GY + (Math.floor(i / 10) + 0.5) * C;
        s += person(cx, cy, i < n, g[2]);
      }
      s += t(gx + 5 * C, GY + 10 * C + 32, n + " in 100", { lab: 1, w: 800, s: 17, c: k ? BLUE : CORAL });
    });
    grid.innerHTML = s;
  }

  function drawDial(val){
    var cx = 150, cy = 142, r = 110, MAX = 5;
    function ang(v){ return Math.PI * (1 - Math.min(v, MAX) / MAX); }
    function P(v, rr){ return [cx + rr * Math.cos(ang(v)), cy - rr * Math.sin(ang(v))]; }
    var s = "";
    var segs = [[0, 1, MINT], [1, 2.5, SUN], [2.5, 5, CORAL]];
    segs.forEach(function(g){
      var a = P(g[0], r), b = P(g[1], r);
      s += '<path d="M' + a[0] + ' ' + a[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + b[0] + ' ' + b[1] + '" fill="none" stroke="' + g[2] + '" stroke-width="22"/>';
    });
    for(var v = 0; v <= 5; v++){
      var p = P(v, r + 22);
      s += t(p[0], p[1] + 5, v, { lab: 1, w: 800, s: 15 });
    }
    var one = P(1, r - 22);
    s += t(one[0] + 14, one[1] + 6, "same", { s: 14 });
    if(typeof val === "number"){
      var tip = P(val, r - 8);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + tip[0] + '" y2="' + tip[1] + '" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
      s += t(cx, cy - 26, "RR " + (Math.round(val * 100) / 100), { lab: 1, w: 800, s: 18 });
    }else{
      s += t(cx, cy - 26, "RR ?", { lab: 1, w: 800, s: 18 });
    }
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="8" fill="' + INK + '"/>';
    s += t(cx, 168, "relative risk", { s: 14 });
    dial.innerHTML = s;
  }

  function stars(){
    var s = "";
    for(var k = 0; k < ROUNDS.length; k++){
      var n = d.stars[k] || 0;
      for(var j = 0; j < 3; j++) s += '<span class="' + (j < n ? "on" : "off") + '">&#9733;</span>';
      if(k < ROUNDS.length - 1) s += " ";
    }
    el.querySelector("#rdStars").innerHTML = s;
  }

  function render(){
    d.between = false;
    stars();
    var adj = el.querySelector("#rdAdj");
    if(d.r >= ROUNDS.length){
      el.querySelector("#rdRound").textContent = "All rounds done";
      var tot = d.stars.reduce(function(a, b){ return a + b; }, 0);
      el.querySelector("#rdText").innerHTML = '<b>' + tot + ' stars out of 9.</b> ' +
        'Absolute risk tells you how likely something is in a group (6 in 100). Relative risk tells you how many times as likely one group is compared with another (3 times). A headline that only gives one of them is only telling half the story.';
      grid.style.display = "none"; adj.style.display = "none";
      ctl.innerHTML = '<div class="wrow"><button class="btn btn-quiet" type="button" id="rdAgain">Play again for fun</button></div>';
      el.querySelector("#rdAgain").onclick = function(){ d.r = 0; d.na = 0; d.nb = 0; d.stage = "shade"; d.replay = true; api.save(); msg.innerHTML = ""; render(); };
      drawDial(ROUNDS[ROUNDS.length - 1].rr);
      return;
    }
    grid.style.display = ""; adj.style.display = "";
    var r = R();
    el.querySelector("#rdRound").textContent = "Round " + (d.r + 1) + " of 3: " + r.title;
    el.querySelector("#rdText").innerHTML = r.text;
    drawGrid();
    if(d.stage === "shade"){
      drawDial(null);
      ctl.innerHTML = '<p class="wnote" style="margin:4px 0">Tap a person to shade everyone up to them, or use the &minus; and + buttons. Shade the people it happens to in each group.</p>' +
        '<div class="wrow"><button class="btn" type="button" id="rdLock">Lock in</button>' +
        (d.rt >= 1 ? '<button class="btn btn-quiet" type="button" id="rdShow">Show me</button>' : '') + '</div>';
      el.querySelector("#rdLock").onclick = function(){
        if(d.na === r.ta && d.nb === r.tb){
          d.stage = "rr"; d.rs = d.rt ? 1 : 0; d.rt = 0; api.save();
          msg.innerHTML = '<b>Locked.</b> Absolute risks: ' + r.ta + ' in 100 (' + r.ta + '%) and ' + r.tb + ' in 100 (' + r.tb + '%).';
          render(); return;
        }
        d.rt = (d.rt || 0) + 1; d.miss++; api.save();
        msg.innerHTML = d.r === 2 ?
          '<b>Not quite yet.</b> 10 out of 200 is how many out of 100? Halve both. And 9 out of 300: divide both by 3.' :
          '<b>Not quite yet.</b> Have another look at the numbers in the story: the left grid is ' + r.a.toLowerCase() + ', the right grid is ' + r.b.toLowerCase() + '.';
        render();
      };
      var sh = el.querySelector("#rdShow");
      if(sh) sh.onclick = function(){ d.na = r.ta; d.nb = r.tb; d.stage = "rr"; d.rs = 2; d.rt = 0; d.used = true; api.save(); msg.innerHTML = '<b>Here they are.</b> ' + r.ta + ' in 100 and ' + r.tb + ' in 100.'; render(); };
    }else{
      drawDial(null);
      ctl.innerHTML = '<p class="wnote" style="margin:4px 0"><b>Relative risk.</b> ' + r.ask + '</p>' +
        '<div class="wrow"><input class="rd-in" id="rdAns" type="text" inputmode="decimal" autocomplete="off" aria-label="Relative risk">' +
        '<button class="btn" type="button" id="rdGo">Spin the dial</button>' +
        (d.rt >= 1 ? '<button class="btn btn-quiet" type="button" id="rdShow">Show me</button>' : '') + '</div>';
      var inp = el.querySelector("#rdAns");
      el.querySelector("#rdGo").onclick = function(){
        var v = EGW.parseNum(inp.value);
        if(isNaN(v)){ msg.innerHTML = "Pop a number in first."; return; }
        if(Math.abs(v - r.rr) <= (r.tol || 0.001)){
          var lost = (d.rs || 0) + (d.rt ? 1 : 0);
          finishRound(Math.max(1, 3 - lost), '<b>' + pick(["Bang on.", "Needle nailed it.", "Yes!"]) + '</b> ' + r.ta + ' &divide; ' + r.tb + ' = ' + (r.show || r.rr) + '. ' + r.quip);
          return;
        }
        d.rt = (d.rt || 0) + 1; d.miss++; api.save();
        drawDial(Math.max(0, Math.min(5, v)));
        msg.innerHTML = (v < 1 ? '<b>That says less likely.</b> ' : '<b>Not quite yet.</b> ') + 'Relative risk = risk in the first group &divide; risk in the second group. Which group is the question asking about first?';
        if(d.rt === 1) ctl.querySelector(".wrow").insertAdjacentHTML("beforeend", '<button class="btn btn-quiet" type="button" id="rdShow">Show me</button>');
        wireShowRR();
      };
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") el.querySelector("#rdGo").click(); });
      wireShowRR();
    }
  }

  function wireShowRR(){
    var sh = el.querySelector("#rdShow");
    var r = R();
    if(sh && d.stage === "rr") sh.onclick = function(){
      d.used = true;
      finishRound(1, '<b>Here it is.</b> ' + r.ta + ' &divide; ' + r.tb + ' = ' + (r.show || r.rr) + '. ' + r.quip);
    };
  }

  function finishRound(n, text){
    var r = R();
    if(!d.replay) d.stars[d.r] = n;
    drawDial(r.rr);
    d.r++; d.na = 0; d.nb = 0; d.stage = "shade"; d.rt = 0; d.rs = 0;
    if(d.r >= ROUNDS.length && !d.result){
      d.result = d.used ? "shown" : (d.miss ? "right2" : "right1");
      api.save(); api.done(d.result);
    }
    api.save();
    var keep = text;
    if(d.r < ROUNDS.length){
      d.between = true;
      ctl.innerHTML = '<div class="wrow"><button class="btn btn-orange" type="button" id="rdNext">Next round</button></div>';
      stars();
      el.querySelector("#rdNext").onclick = function(){ msg.innerHTML = ""; render(); };
      msg.innerHTML = keep;
    }else{
      render();
      msg.innerHTML = keep;
    }
  }

  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  function setN(g, n){
    if(d.between || d.stage !== "shade" || d.r >= ROUNDS.length) return;
    n = Math.max(0, Math.min(100, n));
    if(g === "a") d.na = n; else d.nb = n;
    api.save(); drawGrid();
  }

  grid.addEventListener("click", function(e){
    var p = grid.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    var q = p.matrixTransform(grid.getScreenCTM().inverse());
    for(var k = 0; k < 2; k++){
      var col = Math.floor((q.x - GX[k]) / C), row = Math.floor((q.y - GY) / C);
      if(col >= 0 && col < 10 && row >= 0 && row < 10){
        var idx = row * 10 + col + 1, g = k ? "b" : "a", cur = k ? d.nb : d.na;
        setN(g, idx === cur ? idx - 1 : idx);
        return;
      }
    }
  });
  [].forEach.call(el.querySelectorAll("[data-g]"), function(b){
    b.onclick = function(){ var g = b.getAttribute("data-g"); setN(g, (g === "a" ? d.na : d.nb) + parseInt(b.getAttribute("data-d"), 10)); };
  });

  render();
}
