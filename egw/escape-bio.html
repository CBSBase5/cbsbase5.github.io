var FIG_GREEN = svg("A greenhouse at night with the grow lamps off. Tomato plants, a warm paraffin heater and a beaker of potato cylinders on a bench.",

  '<path d="M167 84 Q160 74 167 64 Q174 74 167 84 Z" fill="' + SUN + '"/><circle cx="167" cy="76" r="16" fill="' + SUN + '" opacity=".18"/>' +
  /* bench, beaker, potato cylinders */
  '<rect x="236" y="96" width="120" height="8" rx="2" fill="' + PAPER + '" opacity=".85"/>' +
  '<path d="M262 52 L262 94 Q262 96 264 96 L306 96 Q308 96 308 94 L308 52" stroke="' + WHITE + '" stroke-width="3" fill="' + VIOLET + '" fill-opacity=".25"/>' +
  '<rect x="272" y="66" width="8" height="26" rx="2" fill="' + SUN + '" opacity=".85"/>' +
  '<rect x="290" y="70" width="8" height="22" rx="2" fill="' + SUN + '" opacity=".85"/>' +
  '<rect x="0" y="112" width="380" height="18" fill="' + BLUE + '" opacity=".28"/>');

/* Room 3: the medical bay */
var FIG_MED = svg("A quiet medical bay. A heart monitor with a flat, dark screen, a first aid cupboard standing open, and a revision sheet on the desk.",
  '<rect x="34" y="22" width="96" height="62" rx="8" fill="#20284a" stroke="' + LINE + '" stroke-width="3"/>' +
  '<line x1="46" y1="54" x2="118" y2="54" stroke="' + MINT + '" stroke-width="3" stroke-dasharray="6 6" opacity=".7"/>' +
  '<line x1="82" y1="84" x2="82" y2="110" stroke="' + LINE + '" stroke-width="4"/>' +
  /* cross */
  '<rect x="170" y="22" width="12" height="36" rx="2" fill="' + CORAL + '"/><rect x="158" y="34" width="36" height="12" rx="2" fill="' + CORAL + '"/>' +

  '<rect x="222" y="22" width="56" height="70" rx="4" fill="none" stroke="' + LINE + '" stroke-width="3"/>' +
  '<path d="M278 22 L304 30 L304 84 L278 92 Z" fill="' + PAPER + '" opacity=".2" stroke="' + LINE + '" stroke-width="2"/>' +

  '<rect x="160" y="104" width="196" height="8" rx="2" fill="' + PAPER + '" opacity=".85"/>' +

  '<line x1="250" y1="12" x2="244" y2="26"/><line x1="330" y1="8" x2="324" y2="22"/><line x1="200" y1="30" x2="194" y2="44"/></g>' +
  /* hide */
  '<path d="M30 50 L100 30 L170 50 Z" fill="' + BROWN + '"/>' +
  '<rect x="40" y="50" width="120" height="62" fill="' + BROWN + '" opacity=".75"/>' +
  '<rect x="58" y="64" width="84" height="18" rx="3" fill="' + INK + '"/>' +
  '<circle cx="92" cy="73" r="6" fill="' + SUN + '"/><circle cx="108" cy="73" r="6" fill="' + SUN + '"/>' +
  '<circle cx="92" cy="73" r="2.5" fill="' + INK + '"/><circle cx="108" cy="73" r="2.5" fill="' + INK + '"/>' +
  /* grass */
  '<rect x="0" y="112" width="380" height="18" fill="' + MINT + '" opacity=".45"/>' +
  /* quadrat */
  '<path d="M300 100 L356 100 L346 120 L290 120 Z" fill="none" stroke="' + WHITE + '" stroke-width="3"/>' +
  '<line x1="328" y1="100" x2="318" y2="120" stroke="' + WHITE + '" stroke-width="1.5"/><line x1="295" y1="110" x2="351" y2="110" stroke="' + WHITE + '" stroke-width="1.5"/>' +
  /* Bonnie: curly brown poodle, nose down, no tail */
  '<g fill="' + BROWN + '">' +
  '<circle cx="222" cy="90" r="11"/><circle cx="238" cy="88" r="12"/><circle cx="254" cy="90" r="11"/>' +
  '<rect x="216" y="94" width="7" height="20" rx="3"/><rect x="230" y="96" width="7" height="18" rx="3"/>' +
  '<rect x="246" y="96" width="7" height="18" rx="3"/><rect x="258" y="94" width="7" height="20" rx="3"/>' +
  '<circle cx="272" cy="86" r="10"/><ellipse cx="284" cy="96" rx="9" ry="6" transform="rotate(30 284 96)"/>' +
  '<circle cx="266" cy="94" r="6"/></g>' +
  '<circle cx="290" cy="101" r="3" fill="' + INK + '"/><circle cx="275" cy="84" r="2" fill="' + INK + '"/>');

function keep(t){ return '<div class="keep"><b>Keep this</b>' + t + '</div>'; }

EGW.run({
  id: "escape-bio",
  title: "Escape the research station",
  subject: "Biology",
  mins: 35,
  blurb: "A biology escape room: four locked rooms in a research station, with questions from both papers, then one final door.",
  escape: {
    digits: ["4", "7", "2", "9"],
    intro: "<p>Jay has sent you to help out at a remote research station on a windy island. Five minutes after you arrive, a storm knocks the power out and every door goes into lockdown.</p>" +
      "<p>Each room holds three biology problems. Solve them and the room gives up one digit. Collect all four, then have a go at the final door. No rush: the station is warm, and the kettle runs on gas.</p>",
    outro: "<p>The door hisses open, the lights flicker back on, and somewhere a kettle starts to boil. You escaped the research station.</p>"
  },
  steps: [

  /* ---------- ROOM 1: THE MICROSCOPE LAB ---------- */
  { type: "learn", topic: "The microscope lab", title: "The microscope lab",
    fig: FIG_LAB,
    html: "<p>The power cut has left the station on emergency lighting. In the microscope lab, a light microscope still glows on its own battery. A slide of root tip cells sits under the lens, and the sample freezer has gone quiet.</p>" +
          "<p>On the inner door, a padlock waits for its first digit.</p>" +
          keep("Magnification = image size &divide; real size. 1 mm = 1000 &micro;m.") },

  { type: "num", topic: "The microscope lab",
    q: "On the microscope screen, the image of one root tip cell is <b>24 mm</b> wide. The slide label says the real cell is <b>60 &micro;m</b> wide. What is the magnification?",
    boxes: [{ label: "Magnification", pre: "&times;", a: 400, tol: 0 }],
    hint: "Get both sizes into micrometres first. How many &micro;m is 24 mm?",
    why: "24 mm = 24 &times; 1000 = 24 000 &micro;m. Magnification = image size &divide; real size = 24 000 &divide; 60 = 400, so the image is &times;400. The usual slip is dividing 24 by 60 straight away: the units have to match before you divide. Magnification has no units." },

  { type: "mc", topic: "The microscope lab",
    q: "The root tip cells on the slide are dividing so that the root can grow. Which type of cell division is this, and what does it make?",
    options: [
      "Mitosis, making two cells that are genetically identical",
      "Meiosis, making two cells that are genetically identical",
      "Meiosis, making four gametes that are genetically different",
      "Mitosis, making four gametes that are genetically different"
    ],
    answer: 0,
    hint: "Growth and repair, or making sex cells?",
    why: "Growth and repair use <b>mitosis</b>: one division, two daughter cells, genetically identical to the parent cell, each with the full number of chromosomes. Meiosis happens in the reproductive organs and makes four genetically different gametes with half the chromosomes, which is true of meiosis but is not what a growing root needs." },

  { type: "mc", topic: "The microscope lab",
    q: "With the freezer off, a tube of amylase was left in a warm water bath at 60 &deg;C for an hour. Now it no longer breaks down starch. What is the best explanation?",
    options: [
      "The heat changed the shape of the active site, so starch no longer fits",
      "The heat killed the enzyme",
      "The starch molecules moved too fast for the enzyme to catch them",
      "The amylase was all used up breaking down starch"
    ],
    answer: 0,
    hint: "Think about the part of the enzyme that the substrate has to fit into.",
    why: "Enzymes are proteins with an active site of a particular shape. Above the optimum temperature, the shape changes and the substrate no longer fits: the enzyme is <b>denatured</b>, and that cannot be undone. Enzymes are not alive, so they are not killed, and as catalysts they are not used up. Faster particles actually mean more collisions, which is why the rate rises up to the optimum." },

  /* ---------- ROOM 2: THE GREENHOUSE ---------- */
  { type: "learn", topic: "The greenhouse", title: "The greenhouse",
    fig: FIG_GREEN,
    html: "<p>Along a dark corridor you find the greenhouse. The grow lamps are off and the tomato plants sit in winter gloom, but the paraffin heater still ticks away, warm and smoky.</p>" +
          "<p>Someone left an osmosis practical half finished on the bench, and a tray of pea plants waits by the door.</p>" +
          keep("Percentage change = change &divide; starting value &times; 100.") },

  { type: "mc", topic: "The greenhouse",
    q: "Outside it is a dull winter afternoon and the grow lamps are off. The paraffin heater keeps the greenhouse warm, and the carbon dioxide it gives off keeps that level high. What is most likely limiting the rate of photosynthesis right now?",
    options: [ "Light intensity", "Carbon dioxide concentration", "Temperature", "Oxygen concentration" ],
    answer: 0,
    hint: "Which thing that photosynthesis needs is in shortest supply?",
    why: "A <b>limiting factor</b> is whichever one is in shortest supply, holding the rate back. The heater supplies both warmth and carbon dioxide, so with dim light and the lamps off, <b>light intensity</b> is the limit. Oxygen is a product of photosynthesis, not something it uses. Switching the lamps back on would speed things up." },

  { type: "num", topic: "The greenhouse",
    q: "<b>Required practical: osmosis.</b> One potato cylinder had a mass of <b>2.40 g</b> at the start. After 30 minutes in the sugar solution, its mass is <b>2.10 g</b>.",
    boxes: [
      { label: "Mass lost", a: 0.3, tol: 0.001, post: "g" },
      { label: "Percentage decrease in mass", a: 12.5, tol: 0.05, post: "%" }
    ],
    hint: "Find the change first. Then divide it by the mass at the START, and times by 100.",
    why: "Mass lost = 2.40 &minus; 2.10 = 0.30 g. Percentage change = 0.30 &divide; 2.40 &times; 100 = 12.5%, a decrease, so written as a change it is &minus;12.5%. Divide by the starting mass, not the final mass. Working in percentages lets you compare cylinders that started at different masses. The cylinder lost mass because the sugar solution was more concentrated than the potato cells, so water moved out of the cells by osmosis." },

  { type: "num", topic: "The greenhouse",
    q: "The pea plants: the allele for tall (<b>T</b>) is dominant to the allele for short (<b>t</b>). Two tall pea plants, both <b>Tt</b>, are crossed. What percentage of their offspring would you expect to be short?",
    boxes: [{ label: "Expected short offspring", a: 25, tol: 0, post: "%" }],
    hint: "Draw a Punnett square with T and t along the top and down the side. Which boxes have no T at all?",
    why: "Each parent can pass on T or t. The four boxes are TT, Tt, Tt and tt. Only <b>tt</b> has no dominant allele, so only that one is short: 1 out of 4 = 25%. That is a ratio of 3 tall : 1 short. It is a probability, so a real batch of seeds may not come out at exactly 25%." },

  /* ---------- ROOM 3: THE MEDICAL BAY ---------- */
  { type: "learn", topic: "The medical bay", title: "The medical bay",
    fig: FIG_MED,
    html: "<p>The medical bay is calm and quiet. The heart monitor screen is dark, so the station doctor has left a note: <i>count pulses by hand until the power is back</i>.</p>" +
          "<p>The first aid cupboard stands open, and on the desk is a revision sheet in Jay's handwriting.</p>" +
          keep("Beats per minute = beats counted &divide; seconds &times; 60.") },

  { type: "num", topic: "The medical bay",
    q: "You count the pulse at a researcher's wrist while they sit resting: <b>18 beats in 15 seconds</b>. Then they jog up two flights of stairs, and you count <b>30 beats in 15 seconds</b>. Work out each heart rate in beats per minute.",
    boxes: [
      { label: "Resting", a: 72, tol: 0, post: "beats per minute" },
      { label: "After the stairs", a: 120, tol: 0, post: "beats per minute" }
    ],
    hint: "How many lots of 15 seconds are there in one minute?",
    why: "15 seconds is a quarter of a minute, so times by 4: 18 &times; 4 = <b>72</b> and 30 &times; 4 = <b>120</b> beats per minute. During exercise the muscles respire faster, so the heart beats faster to deliver more oxygen and glucose to them and to carry away the extra carbon dioxide." },

  { type: "mc", topic: "The medical bay",
    q: "A researcher with a cold asks for some antibiotics from the cupboard. Why would antibiotics not help with a cold?",
    options: [
      "Colds are caused by viruses, and antibiotics only kill bacteria",
      "Colds are caused by bacteria that resist every antibiotic",
      "Antibiotics only work if you take them before you catch a cold",
      "Antibiotics only ease symptoms, like painkillers do"
    ],
    answer: 0,
    hint: "What kind of pathogen causes a cold, and what do antibiotics work on?",
    why: "A cold is caused by a <b>virus</b>. Antibiotics kill bacteria inside the body, but they do not affect viruses, which live and reproduce inside your own cells. Painkillers can ease symptoms, but they do not kill any pathogen. Using antibiotics when they are not needed also speeds up the development of resistant strains of bacteria, so they are saved for bacterial infections." },

  { type: "mark", topic: "The medical bay",
    q: "Explain how the concentration of glucose in the blood is brought back to normal after a meal. <b>(3 marks)</b>",
    note: "Found on the desk in the medical bay.",
    jay: [
      "After a meal, the concentration of glucose in the blood goes up.",
      "The pancreas detects this and releases insulin into the blood.",
      "Insulin makes glucose move out of the blood and into cells.",
      "In the liver, the extra glucose is turned into glucagon and stored."
    ],
    wrong: 3, max: 3, award: 2,
    hint: "Read the last line slowly. Is that the right word for the stored form of glucose?",
    why: "A mark scheme gives 1 mark for the pancreas releasing insulin, 1 mark for glucose moving from the blood into cells, and 1 mark for extra glucose being turned into <b>glycogen</b> in the liver and muscles for storage. The first line sets the scene, which is fine but scores nothing on its own. Jay wrote <b>glucagon</b>, which is a hormone (you meet it on Higher), not the store, so the last mark goes: <b>2 out of 3</b>. Glycogen is the store, glucagon is the hormone. Jay's verdict on his own slip: Outrageous." },

  /* ---------- ROOM 4: THE FIELD SURVEY HUT ---------- */
  { type: "learn", topic: "The field survey hut", title: "The field survey hut",
    fig: FIG_HUT,
    html: "<p>The last room is the field survey hut, next to the bird watching hide. Rain drums on the roof.</p>" +
          "<p>Bonnie, a small brown poodle with no tail and a very good nose, has her nose down beside a quadrat in the grass, and she has sniffed out a clipboard of survey results. From the hide, a barn owl watches you both.</p>" +
          keep("Mean = total &divide; how many values. Keep any zeros in.") },

  { type: "num", topic: "The field survey hut",
    q: "<b>Required practical: sampling.</b> The clipboard shows daisies counted in 5 quadrats, each <b>1 m&sup2;</b>, placed at random in a meadow with an area of <b>200 m&sup2;</b>." +
       '<div class="tablewrap"><table class="datatable"><tr><th>Quadrat</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>' +
       '<tr><th>Daisies</th><td>4</td><td>7</td><td>3</td><td>0</td><td>6</td></tr></table></div>',
    boxes: [
      { label: "Mean number of daisies per quadrat", a: 4, tol: 0 },
      { label: "Estimated number of daisies in the meadow", a: 800, tol: 0 }
    ],
    hint: "Add the five counts, then divide by 5. Each quadrat is 1 m&sup2;, so how many quadrats would fit in the meadow?",
    why: "Mean = (4 + 7 + 3 + 0 + 6) &divide; 5 = 20 &divide; 5 = <b>4</b> daisies per quadrat. Each quadrat is 1 m&sup2;, so that is 4 per m&sup2;, and the estimate is 4 &times; 200 = <b>800</b> daisies. The zero is a real result, so it stays in. Placing the quadrats at random avoids bias, and using more quadrats gives a more reliable estimate." },

  { type: "mc", topic: "The field survey hut",
    q: "From the hide you watch the barn owl catch a vole. Voles feed on grass. In the food chain <b>grass &rarr; vole &rarr; barn owl</b>, which is the <b>secondary consumer</b>?",
    options: [ "The barn owl", "The vole", "The grass", "The Sun" ],
    answer: 0,
    hint: "The producer comes first. Count the consumers along from there.",
    why: "Grass is the <b>producer</b>: it makes glucose by photosynthesis. The vole eats it, so it is the <b>primary consumer</b>. The barn owl eats the vole, so it is the <b>secondary consumer</b>, and also a predator, with the vole as its prey. The Sun is the energy source for the chain, but it is not an organism, so it is not a consumer." },

  { type: "mc", topic: "The field survey hut",
    q: "You sprint through the rain to the hide and your legs start to ache. Your muscles are not getting enough oxygen, so some of their respiration is anaerobic. Which word equation shows anaerobic respiration in muscles?",
    options: [
      "glucose &rarr; lactic acid",
      "glucose + oxygen &rarr; carbon dioxide + water",
      "glucose &rarr; ethanol + carbon dioxide",
      "carbon dioxide + water &rarr; glucose + oxygen"
    ],
