<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
.bwrap{max-width:760px;margin:0 auto}
body.subj-home .bwrap .btn:not(.btn-quiet){background:var(--sun);color:var(--ink)}
.bhero{padding:18px 0 4px}
.bhero h1{font-size:clamp(2.1rem,7vw,3.2rem);color:var(--moon);line-height:1}
.bhero p{color:var(--mist);margin:8px 0 0;max-width:56ch}

/* the room */
.room{position:relative;margin:14px 0 12px;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3);background:#262c52}
.room svg{display:block;width:100%;height:auto}
.room .sticky{position:absolute;left:31%;top:8%;max-width:27%;background:#ffe98a;color:#3b3214;font-family:var(--display);font-weight:600;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.25;padding:8px 10px 10px;border-radius:3px;transform:rotate(-3deg);box-shadow:0 4px 10px rgba(0,0,0,.25);word-wrap:break-word}
.room .sticky small{display:block;font-weight:400;font-size:.8em;opacity:.75}
.room .sticky:empty{display:none}
.room .say{min-height:2.7em;padding:8px 14px;background:rgba(10,12,30,.45);color:#eef0ff;font-size:.95rem;text-align:center;transition:opacity .4s}
.room .say.gone{opacity:0;pointer-events:none}
#bonnieHit{cursor:pointer}
#bonnieHit:focus-visible{outline:none}
#bonnieHit:focus-visible .body{stroke:#ffd23f;stroke-width:3}

.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.04)}}
.zz{animation:zz 3.6s ease-in-out infinite;opacity:0}
.zz.z2{animation-delay:1.2s}.zz.z3{animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}25%{opacity:.9}100%{opacity:0;transform:translate(10px,-18px)}}
.rain line{animation:rain .9s linear infinite}
.rain line:nth-child(3n){animation-duration:1.15s;animation-delay:-.4s}
.rain line:nth-child(3n+1){animation-duration:.8s;animation-delay:-.7s}
@keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-8px,130px)}}
.glow{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:.95}}
.awake .zz{display:none}
.awake .breathe{animation:stretch 1.6s ease-in-out 2}
@keyframes stretch{0%,100%{transform:scale(1,1)}40%{transform:scale(1.08,.94)}70%{transform:scale(.97,1.06)}}
.eyes-open{display:none}
.awake .eyes-open{display:inline}
.awake .eyes-shut{display:none}
.blink .eyes-open{display:inline}.blink .eyes-shut{display:none}
@media (prefers-reduced-motion:reduce){
  .breathe,.zz,.rain line,.glow,.awake .breathe{animation:none}
  .zz{opacity:.8}
}

/* timer */
.clock{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--ink)}
.ring .num small{display:block;font-size:.7rem;font-weight:500;color:var(--body-tint);text-align:center;line-height:1.1}
.clockside p{margin:0 0 8px}
.clockside .btn{margin:0 6px 6px 0}

.panel h3{font-size:1.25rem;margin:0 0 8px}
.lab{display:block;font-family:var(--display);font-weight:600;font-size:.95rem;margin:14px 0 6px}
.lab:first-child{margin-top:0}
.lab small{font-family:var(--body);font-weight:400;color:var(--body-tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-family:var(--display);font-weight:600;font-size:.95rem;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-width:58px}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.chips button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.panel input[type=text]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line)}
.panel input[type=text]:focus{outline:none;border-color:var(--blue)}
.volrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.volrow input{flex:1;accent-color:var(--blue)}
.tog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.95rem;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--blue)}
.go{margin-top:18px}
.quietlink{font:inherit;font-size:.92rem;background:none;border:0;color:var(--body-tint);text-decoration:underline;cursor:pointer;padding:6px 0}
.breaks{margin:8px 0 12px;padding:0;list-style:none}
.breaks li{background:var(--paper);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.stats{color:var(--mist);font-size:.92rem;margin:10px 0 30px}

/* just Bonnie: everything else steps back */
body.justb header.hq,body.justb .bhero,body.justb .panel,body.justb footer,body.justb .stats{display:none}
body.justb .room{margin-top:18px}
.backbtn{display:none}
body.justb .backbtn{display:block;margin:0 auto 30px}
body.justb .clockcard{background:rgba(255,255,255,.08);color:var(--moon);border-top-color:transparent;box-shadow:none}
body.justb .clockcard .ring .num,body.justb .clockcard p{color:var(--moon)}
body.justb .clockcard .ring .num small{color:var(--mist)}
body.justb .clockside .btn:not(#pauseBtn){display:none}
</style>

<script>
(function(){
"use strict";
var KEY = "b5.egw.bonnie.v1";
var CIRC = 326.73;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function load(){ try{ var d = JSON.parse(localStorage.getItem(KEY) || "null"); if(d && typeof d === "object") return d; }catch(e){} return {}; }
var st = load();
st.log = st.log || [];
st.pref = st.pref || { mins: 15, sound: "off", vol: 40, chime: false, hide: false };
function save(){ st.updated = new Date().toISOString(); try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function dayStr(d){ var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
function today(){ var d = new Date(); d.setHours(12, 0, 0, 0); return dayStr(d); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

/* ---------- the window: day or night ---------- */
(function(){
  var h = new Date().getHours(), night = h < 7 || h >= 17;
  $("g0").setAttribute("stop-color", night ? "#1b2350" : "#8fbfe6");
  $("g1").setAttribute("stop-color", night ? "#36437f" : "#d2e9f7");
  $("moon").setAttribute("fill", night ? "#f4f0d8" : "#fff6c8");
  if(!night) $("moon").setAttribute("opacity", ".7");
})();

/* ---------- Bonnie ---------- */
var sayT = null;
function say(t, ms){
  $("say").textContent = t; $("say").classList.remove("gone");
  clearTimeout(sayT); sayT = setTimeout(function(){ $("say").classList.add("gone"); }, ms || 4200);
}
var TAPS = [
  "Bonnie opens one eye, checks you are still there, and closes it again.",
  "A tiny snore.",
  "Her ear twitches. Dreaming about something, probably.",
  "She shuffles round once and settles back down.",
  "Bonnie sighs the sigh of a dog with nowhere to be.",
  "One paw stretches out, then tucks back in."
];
var tapI = Math.floor(Math.random() * TAPS.length);
function poke(){
  if(phase === "done"){ say("Bonnie is awake and ready for a break too."); return; }
  tapI = (tapI + 1) % TAPS.length;
  say(TAPS[tapI]);
  if(tapI === 0){ $("room").classList.add("blink"); setTimeout(function(){ $("room").classList.remove("blink"); }, 1300); }
}
$("bonnieHit").addEventListener("click", poke);
$("bonnieHit").addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); poke(); } });

/* ---------- sound (made in the browser, nothing to download) ---------- */
var AC = null, srcNode = null, gainNode = null, crackleT = null;
function ctx(){
  if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function vol(){ var v = st.pref.vol / 100; return v * v * 0.7; }
function noise(kind){
  var a = AC, len = a.sampleRate * 6, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0), i, w;
  if(kind === "brown"){
    var last = 0;
    for(i = 0; i < len; i++){ w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  }else{
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for(i = 0; i < len; i++){
      w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
    }
  }
  /* soften the loop point */
  var f = Math.floor(a.sampleRate * 0.05);
  for(i = 0; i < f; i++){ var t = i / f; d[i] *= t; d[len - 1 - i] *= t; }
  return b;
}
function soundOff(){
  clearTimeout(crackleT);
  if(srcNode && AC){
    var s = srcNode, g = gainNode;
    try{ g.gain.cancelScheduledValues(AC.currentTime); g.gain.setValueAtTime(g.gain.value, AC.currentTime); g.gain.linearRampToValueAtTime(0, AC.currentTime + 0.6); }catch(e){}
    setTimeout(function(){ try{ s.stop(); }catch(e){} }, 700);
  }
  srcNode = null;
}
function soundOn(kind){
  soundOff();
  if(kind === "off") return;
  var a = ctx(); if(!a) return;
  gainNode = a.createGain(); gainNode.gain.value = 0; gainNode.connect(a.destination);
  var s = a.createBufferSource(); s.buffer = noise(kind === "rain" ? "pink" : "brown"); s.loop = true;
  var f = a.createBiquadFilter(); f.type = "lowpass";
  f.frequency.value = kind === "rain" ? 2600 : kind === "brown" ? 900 : 420;
  s.connect(f); f.connect(gainNode); s.start();
  gainNode.gain.linearRampToValueAtTime(vol(), a.currentTime + 1.5);
  srcNode = s;
  if(kind === "fire") crackle();
}
function crackle(){
  crackleT = setTimeout(function(){
    if(!srcNode || !AC) return;
    var a = AC, len = Math.floor(a.sampleRate * 0.025), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var s = a.createBufferSource(); s.buffer = b;
    var hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1400 + Math.random() * 2400;
    var g = a.createGain(); g.gain.value = 0.6 + Math.random() * 1.2;
    s.connect(hp); hp.connect(g); g.connect(gainNode); s.start();
    crackle();
  }, 90 + Math.random() * 650);
}
function setVol(){ if(gainNode && AC){ gainNode.gain.cancelScheduledValues(AC.currentTime); gainNode.gain.setTargetAtTime(vol(), AC.currentTime, 0.1); } }
function chime(){
  var a = ctx(); if(!a) return;
  [[523.25, 0], [659.25, 0.35], [783.99, 0.7]].forEach(function(n){
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + n[1];
    o.type = "sine"; o.frequency.value = n[0];
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.9);
  });
}

/* ---------- keep the screen awake while she works ---------- */
var lock = null;
function wake(on){
  if(on && "wakeLock" in navigator && !lock){
    navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener("release", function(){ lock = null; }); }, function(){});
  }else if(!on && lock){ try{ lock.release(); }catch(e){} lock = null; }
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible" && phase === "run" && !st.run.paused) wake(true); });

/* ---------- the session ---------- */
var phase = "setup", tickT = null, soundNow = "off";
function elapsed(){
  var r = st.run; if(!r) return 0;
  var now = r.paused ? r.paused : Date.now();
  return Math.max(0, now - r.start - (r.pauseTotal || 0));
}
function fmt(ms){ var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60); s = s % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
function drawClock(){
  var r = st.run, num = $("num"), arc = $("arc");
  if(phase === "setup"){
    var m = st.pref.mins;
    arc.setAttribute("stroke-dashoffset", "0");
    num.innerHTML = m ? m + "<small>minutes</small>" : "&infin;<small>no timer</small>";
    return;
  }
  if(phase === "done"){ arc.setAttribute("stroke-dashoffset", String(CIRC)); num.innerHTML = "Done<small>nice one</small>"; return; }
  var e = elapsed();
  if(r.mins){
    var total = r.mins * 60000, left = total - e;
    arc.setAttribute("stroke-dashoffset", String(CIRC * Math.min(1, e / total)));
    num.innerHTML = st.pref.hide ? (r.paused ? "Paused" : "&#8987;") + "<small>" + (r.paused ? "" : "keeping time") + "</small>"
                                 : fmt(left) + "<small>" + (r.paused ? "paused" : "left") + "</small>";
    if(left <= 0 && !r.paused) finish(true);
  }else{
    arc.setAttribute("stroke-dashoffset", "0");
    num.innerHTML = st.pref.hide ? "&infin;<small>no timer</small>" : fmt(e) + "<small>so far</small>";
  }
}
function drawSide(){
  var side = $("clockSide"), r = st.run;
  if(phase === "setup"){
    side.innerHTML = "<p>Set things up below, then settle in whenever you like.</p>";
  }else if(phase === "run"){
    side.innerHTML = "<p>" + (r.paused ? "Paused. Bonnie does not mind." : r.mins ? "Bonnie is keeping time. No need to watch it." : "No timer. Stop whenever it feels right.") + "</p>" +
      '<button class="btn" type="button" id="pauseBtn">' + (r.paused ? "Carry on" : "Pause") + "</button>" +
      '<button class="btn btn-quiet" type="button" id="stopBtn">' + (r.mins ? "Stop here" : "That is me done") + "</button>" +
      '<button class="btn btn-quiet keep" type="button" id="justBtn">' + (document.body.classList.contains("justb") ? "Show the controls" : "Just Bonnie") + "</button>";
    $("pauseBtn").onclick = function(){
      if(r.paused){ r.pauseTotal = (r.pauseTotal || 0) + (Date.now() - r.paused); r.paused = 0; wake(true); }
      else { r.paused = Date.now(); wake(false); }
      save(); drawSide(); drawClock();
    };
    $("stopBtn").onclick = function(){ finish(false); };
    $("justBtn").onclick = function(){ just(!document.body.classList.contains("justb")); };
  }else{
    side.innerHTML = "";
  }
}
function just(on){
  document.body.classList.toggle("justb", !!on);
  if(phase === "run") drawSide();
  if(on) window.scrollTo(0, 0);
}
$("showCtl").onclick = function(){ just(false); };

function chips(name, items, cur){
  return '<div class="chips" data-name="' + name + '">' + items.map(function(x){
    return '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (String(x[0]) === String(cur) ? "true" : "false") + '">' + x[1] + "</button>";
  }).join("") + "</div>";
}
function wireChips(root, fn){
  [].forEach.call(root.querySelectorAll(".chips button"), function(b){
    b.onclick = function(){
      [].forEach.call(b.parentNode.querySelectorAll("button"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      fn(b.parentNode.dataset.name, b.dataset.v);
    };
  });
}
var SOUNDS = [["off", "Quiet"], ["rain", "Rain"], ["brown", "Low hum"], ["fire", "Fire"]];
function soundBlock(){
  return '<span class="lab">Sound <small>(optional)</small></span>' + chips("sound", SOUNDS, soundNow) +
    '<div class="volrow"><span aria-hidden="true">&#128264;</span><input type="range" min="5" max="100" id="vol" value="' + st.pref.vol + '" aria-label="Volume"><span aria-hidden="true">&#128266;</span></div>';
}
function wireSound(root){
  wireChips(root, function(n, v){
    if(n === "sound"){ soundNow = v; st.pref.sound = v; save(); soundOn(v); }
    if(n === "mins"){ st.pref.mins = +v; save(); drawClock(); }
  });
  var vr = root.querySelector("#vol");
  if(vr) vr.oninput = function(){ st.pref.vol = +vr.value; setVol(); save(); };
}
function drawPanel(){
  var p = $("panel");
  if(phase === "setup"){
    p.innerHTML = '<h3>Get comfy</h3>' +
      '<span class="lab">How long? <small>(or no timer at all)</small></span>' +
      chips("mins", [[10, "10"], [15, "15"], [20, "20"], [25, "25"], [30, "30"], [0, "No timer"]], st.pref.mins) +
      '<label class="lab" for="note">What is on your desk? <small>(optional, goes on a sticky note)</small></label>' +
      '<input type="text" id="note" maxlength="60" placeholder="Maths paper 1, flashcards, nothing yet..." value="' + esc(st.note || "") + '">' +
      soundBlock() +
      '<label class="tog"><input type="checkbox" id="chime"' + (st.pref.chime ? " checked" : "") + '> A soft chime when the time is up</label>' +
      '<label class="tog"><input type="checkbox" id="hide"' + (st.pref.hide ? " checked" : "") + '> Hide the numbers, just show the ring</label>' +
      '<div class="go"><button class="btn" type="button" id="goBtn">Settle in</button></div>';
    wireSound(p);
    $("note").oninput = function(){ st.note = $("note").value; save(); drawNote(); };
    $("chime").onchange = function(){ st.pref.chime = $("chime").checked; save(); };
    $("hide").onchange = function(){ st.pref.hide = $("hide").checked; save(); drawClock(); };
    $("goBtn").onclick = start;
  }else if(phase === "run"){
    p.innerHTML = '<h3>While you work</h3>' + soundBlock() +
      '<label class="tog"><input type="checkbox" id="hide"' + (st.pref.hide ? " checked" : "") + '> Hide the numbers</label>';
    wireSound(p);
    $("hide").onchange = function(){ st.pref.hide = $("hide").checked; save(); drawClock(); };
  }else{
    var r = lastDone;
    p.innerHTML = '<h3>' + (r.full ? pick(["That is a session.", "Time is up. Nicely done.", "There it is."]) : "Stopping there is fine.") + '</h3>' +
      '<p>' + (r.m ? "You sat with Bonnie for " + r.m + " minute" + (r.m === 1 ? "" : "s") + ". " : "") + "Bonnie is stretching. Maybe something small for you too:</p>" +
      '<ul class="breaks">' + breaks().map(function(b){ return "<li>" + b + "</li>"; }).join("") + "</ul>" +
      '<button class="btn" type="button" id="againBtn">Another one</button> ' +
      '<button class="btn btn-quiet" type="button" id="changeBtn">Change things</button> ' +
      '<a class="btn btn-quiet" href="/egw/">Back to HQ</a>';
    $("againBtn").onclick = function(){ start(); };
    $("changeBtn").onclick = function(){ phase = "setup"; $("room").classList.remove("awake"); drawAll(); };
  }
}
var BREAKS = [
  "Stand up and stretch, Bonnie style: front paws first.",
  "Get a glass of water.",
  "Look out of a window at something far away for a minute.",
  "Shake out your hands and roll your shoulders.",
  "Step outside for a bit of air.",
  "Put on one song you like, all the way through.",
  "Have a snack.",
  "Walk to another room and back."
];
function breaks(){ var a = BREAKS.slice(), out = []; while(out.length < 3) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]); return out; }
function drawNote(){
  var n = (st.note || "").trim();
  $("sticky").innerHTML = n ? "<small>On the desk</small>" + esc(n) : "";
}
function drawStats(){
  var n = st.log.length, m = 0, wk = 0, base = new Date(); base.setHours(12, 0, 0, 0); base.setDate(base.getDate() - 6);
  var from = dayStr(base);
  st.log.forEach(function(x){ m += x.m || 0; if(x.d >= from) wk++; });
  $("stats").textContent = n ? "Sessions with Bonnie so far: " + n + ", " + m + " minutes in all" + (wk ? " (" + wk + " in the last 7 days)." : ".") : "";
}
function drawAll(){ drawNote(); drawClock(); drawSide(); drawPanel(); drawStats(); }

function start(){
  ctx(); /* sound needs a tap to start; this is the tap */
  st.run = { start: Date.now(), mins: st.pref.mins, pauseTotal: 0, paused: 0 };
  save();
  phase = "run";
  $("room").classList.remove("awake");
  /* bring back the sound she picked last time (browsers only allow it after a tap) */
  if(soundNow === "off" && st.pref.sound && st.pref.sound !== "off"){ soundNow = st.pref.sound; soundOn(soundNow); }
  wake(true);
  clearInterval(tickT); tickT = setInterval(drawClock, 1000);
  drawAll();
  say(pick(["Bonnie settles in.", "Bonnie curls up a little tighter.", "Bonnie approves."]), 2800);
}
var lastDone = null;
function finish(full){
  var r = st.run; if(!r) return;
  var e = elapsed(), m = Math.round(e / 60000);
  if(full && r.mins) m = r.mins;
  if(e >= 60000){ st.log.push({ d: today(), m: m, full: !!full }); if(st.log.length > 400) st.log = st.log.slice(-400); }
  lastDone = { m: e >= 60000 ? m : 0, full: full };
  st.run = null; save();
  clearInterval(tickT); wake(false);
  phase = "done";
  just(false);
  $("room").classList.add("awake");
  if(full && st.pref.chime) chime();
  drawAll();
  say(full ? "Bonnie wakes up and does a big stretch." : "Bonnie lifts her head. Break time?", 4500);
}

/* ---------- start up: carry on a session after a reload ---------- */
if(st.run){
  var e0 = elapsed();
  if(st.run.mins && e0 >= st.run.mins * 60000){ phase = "run"; finish(true); }
  else { phase = "run"; clearInterval(tickT); tickT = setInterval(drawClock, 1000); drawAll(); if(!st.run.paused) wake(true); }
}else drawAll();
})();
</script>
</body>
</html>
