<style>
/* Notes found in the lighthouse */
.note{border-radius:6px;padding:12px 16px;margin:0 0 12px;text-align:left;font-size:1rem;line-height:1.65;border:2px solid var(--line);box-shadow:0 3px 0 rgba(20,26,51,.12)}
.note p{margin:0 0 8px}
.note .who{display:block;font-family:var(--display);font-style:normal;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#6b6450;margin-bottom:6px}
.note .sig{text-align:right;margin:4px 0 0}
.note.old{background:#f3e6c4;color:#3d2f18;font-family:Georgia,"Times New Roman",serif;font-style:italic;transform:rotate(-.6deg)}
.note.typed{background:#ffffff;color:var(--ink);font-family:"Courier New",Courier,monospace;font-size:.95rem;transform:rotate(.5deg)}
.note.typed .who{color:var(--body-tint)}
.scene{font-size:1.06rem;line-height:1.75}
</style>
</head>
<body class="subj-eng">
<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/egw/"><span class="hqlogo">EGW</span><span class="hqname">GCSE HQ<small>revision and planning</small></span></a>
    <nav class="hqnav"><a href="/egw/">HQ home</a><a href="/">Base 5</a></nav>
  </div>

<div class="wrap qwrap">
  <div class="weektheme">
    <h2>Escape the lighthouse</h2>
    <span>English Language. An escape room: read, zoom in, compare and write your way out of a stormy lighthouse.</span>
  </div>
  <div id="egwApp"></div>
</div>

<footer>
  <div class="wrap">
    <span>EGW's GCSE HQ &middot; part of Base 5, Chilton Bridge School</span>
    <a href="/egw/">Back to HQ</a>
  </div>
</footer>

<script src="/data/send.js"></script>
<script src="/egw/engine.js?v=7"></script>
<script>
(function(){
"use strict";

/* Every scene and note on this page is original, written for it. */

var LOG =
'<div class="note old">' +
'<span class="who">The logbook, left open</span>' +
'<p>Kittiwake Point Light. 14th November 1898.</p>' +
'<p>Wind south west, a full gale by four o\'clock. The glass is falling fast. Lit the lamp at dusk and trimmed the wick twice before midnight. The relief boat has not come for nine days, and the last of the bread is green. Mended the lamp room window with tin and tar; the gulls will not leave it be. Saw a light to the south about ten. It was gone within the hour. I pray she made harbour. Wrote again to Martha. I do not post them.</p>' +
'<p class="sig">Amos</p>' +
'</div>';

var STAIR =
'<div class="extract scene" style="max-height:none">' +
'<p>The stair coils up into the dark like the inside of a shell. Each iron step clangs under your boots. The wind moans through a crack in the wall. Round and round you go, counting steps, losing count. Then, at a small square window, something moves: a herring gull, soaked and furious, hammering the glass with its yellow beak. Tap. Tap. Tap. It stares at you as if you are late.</p>' +
'</div>';

var NOTE_A =
'<div class="note old">' +
'<span class="who">Note 1: handwritten, 1898</span>' +
'<p>To the keeper who comes after me. Keep the brass bright and the wick trimmed, for a dirty lamp is a lie told to sailors. The work is hard and the nights are long, and some weeks no soul speaks to you but the gulls. Yet I would not change it. Every ship that passes safe is a letter I have written to a stranger.</p>' +
'<p class="sig">Amos, November 1898</p>' +
'</div>';

var NOTE_B =
'<div class="note typed">' +
'<span class="who">Note 2: typed, 1998</span>' +
'<p>To whoever reads this. Tomorrow the light goes automatic and I go ashore, the last keeper on Kittiwake Point. Honestly? I\'m glad and gutted at the same time. Glad: no more 3am watches, no more frozen fingers. Gutted: this place has been my whole world for twenty years. The light will keep turning without me. It just won\'t know who it\'s turning for. Look after the gulls.</p>' +
'<p class="sig">Lou, 1998 :)</p>' +
'</div>';

var TASK =
'<div class="keep"><b>The speech on the desk</b>Write a speech for a town meeting arguing that the old lighthouse should become a museum, not holiday flats.</div>';

EGW.run({
  id: "escape-english",
  title: "Escape the lighthouse",
  subject: "English Language",
  mins: 35,
  blurb: "An escape room in an old lighthouse on a stormy night, using reading and writing skills from both English Language papers.",
  escape: {
    digits: ["3", "8", "1", "6"],
    intro: '<p>Rain like thrown gravel. You run the last stretch of the cliff path to the old lighthouse on Kittiwake Point and duck in through its door. A gust slams it shut behind you. <b>Click.</b></p>' +
           '<p>The door has a brass padlock with four dials. Somewhere far above, a gull is tapping on glass. Each room on the way up hides one digit of the code, if you read it closely enough.</p>',
    outro: '<p>The last dial turns and the door swings open. The storm has blown itself out. The sea lies flat and silver, and a thin pink light is rising behind the headland.</p>' +
           '<p>On the rail outside, the gull shakes out its feathers, gives you one long look, and lifts into the morning as if to say: about time.</p>' +
           '<p>You read a logbook closely, zoomed in on words, tracked a shift in focus, compared two keepers a century apart and fixed a speech. That is a big slice of both English papers, done in one stormy night.</p>'
  },
  steps: [

  /* ---------- ROOM 1: THE BOOT ROOM ---------- */
  { type: "learn", topic: "The boot room",
    title: "Oilskins and a logbook",
    html: '<div class="extract scene" style="max-height:none"><p>Water drips from a row of oilskin coats, still shaped like the shoulders that once filled them. Rubber boots slump against the wall. The air tastes of salt and old paraffin, and far above you the storm thuds against the tower. On a shelf, under a skin of dust, lies a fat leather logbook. Someone has left it open.</p></div>' +
          '<div class="keep"><b>Keep this</b><b>Explicit</b> means stated in the words. <b>Implicit</b> means suggested, so you work it out from clues. With older writing, let the sentences around an odd word help you.</div>' },

  { type: "multi", topic: "The boot room",
    q: "Read the keeper's log. Choose the <b>four</b> things that are true.",
    fig: LOG,
    options: [
      "The wind was blowing from the south west.",
      "Amos lit the lamp at midnight.",
      "The relief boat had not come for nine days.",
      "There was still plenty of fresh bread.",
      "Amos mended a window with tin and tar.",
      "Amos watched a ship sink.",
      "Amos trimmed the wick twice before midnight.",
      "Amos posted a letter to Martha."
    ],
    answers: [0, 2, 4, 6],
    hint: "Put your finger on the exact words for each one. If you cannot find them, leave it out.",
    why: "This is the skill in AQA Paper 2 Question 1: check each statement against the actual line. He lit the lamp at dusk, not midnight. He saw a light that vanished, which is not the same as watching a ship sink. And he writes to Martha but says \"I do not post them\"." },

  { type: "sort", topic: "The boot room",
    q: "Is each idea <b>stated</b> in the log, or only <b>suggested</b>, so you have to work it out?",
    fig: LOG,
    buckets: ["Stated (explicit)", "Suggested (implicit)"],
    cards: [
      ["The relief boat has not come for nine days.", 0],
      ["Amos lit the lamp at dusk.", 0],
      ["Amos mended a window.", 0],
      ["Amos is running short of food.", 1],
      ["Amos is worried about the ship he saw.", 1],
      ["Amos is lonely and misses Martha.", 1]
    ],
    hint: "Ask: does Amos actually say this, or do I know it because of a clue? Green bread is a clue.",
    why: "Amos never writes \"I am hungry\", but \"the last of the bread is green\" tells you. He never says \"I am worried\", but \"I pray she made harbour\" shows it. Letters he writes and never posts suggest loneliness. Turning clues like these into a point is called inference." },

  { type: "mc", topic: "The boot room", stretch: true,
    q: "\"The glass is falling fast.\" In 1898, what does Amos most likely mean?",
    fig: LOG,
    options: [
      "The pressure on his barometer is dropping, so the storm is getting worse",
      "A window is breaking and glass is falling out of it",
      "He keeps knocking his drinking glass off the table",
      "The glass around the lamp is slipping down"
    ],
    answer: 0,
    hint: "Look at the sentence just before it. What would a keeper check to see what the weather will do next?",
    why: "A barometer was often called \"the glass\" or a weatherglass. Falling pressure means worse weather on the way, which fits the gale in the sentence before. The window repair is a trap: it is a different line, much later. With older texts, the context around a word is your best clue." },

  /* ---------- ROOM 2: THE SPIRAL STAIR ---------- */
  { type: "learn", topic: "The spiral stair",
    title: "Something at the window",
    html: STAIR +
          '<div class="keep"><b>Keep this</b>Name the method, then zoom in on <b>one word</b> and say what it suggests. Structure is the camera: notice where it points, and when it moves.</div>' },

  { type: "match", topic: "The spiral stair",
    q: "Match each bit of the stair scene to the method it uses.",
    fig: STAIR,
    pairs: [
      ["\"like the inside of a shell\"", "Simile"],
      ["\"The wind moans\"", "Personification"],
      ["\"Each iron step clangs\"", "Onomatopoeia"],
      ["\"soaked and furious\"", "Pair of adjectives"],
      ["\"Tap. Tap. Tap.\"", "Repetition"]
    ],
    hint: "Look for the word like, for a sound word, and for something that is not human doing a human thing.",
    why: "Moaning is something people do when they are in pain or fed up, so the wind is personified. \"Tap. Tap. Tap.\" is repetition, and it is onomatopoeia too: spotting that a quotation does two jobs at once is a sign of a confident reader. Remember the name alone earns little; the marks come from the effect." },

  { type: "mc", topic: "The spiral stair",
    q: "\"a herring gull, soaked and furious, <b>hammering</b> the glass\". What does the verb hammering suggest?",
    options: [
      "The gull is hitting the glass hard, again and again, as if it is desperate to be noticed",
      "The gull is building a nest on the window ledge",
      "The gull is gently pecking at crumbs",
      "The window is made of metal"
    ],
    answer: 0,
    hint: "Think about what a hammer does, and how many times you usually swing one.",
    why: "A hammer hits hard and repeatedly. The word makes the gull sound forceful and urgent, as if it has something to tell you, which adds a little mystery. That is a full zoom: the word, what it suggests, and the effect on the reader." },

  { type: "mc", topic: "The spiral stair",
    q: "Think about the structure of the stair scene. Where does the writer shift the focus to something new?",
    fig: STAIR,
    options: [
      "\"Each iron step clangs under your boots\"",
      "\"The wind moans through a crack in the wall\"",
      "\"Then, at a small square window, something moves\"",
      "\"It stares at you as if you are late\""
    ],
    answer: 2,
    hint: "Look for a signal word that often starts a change.",
    why: "\"Then\" signals the shift. Up to that point the camera stays on you and the sounds of the climb. Then it swings to the window and a new character, the gull, and the scene ends on its stare, leaving a question: why is it waiting for you? This is the kind of thing AQA Paper 1 Question 3 rewards." },

  /* ---------- ROOM 3: THE WATCH ROOM ---------- */
  { type: "learn", topic: "The watch room",
    title: "Two notes, a century apart",
    html: '<div class="extract scene" style="max-height:none"><p>The watch room smells of cold tea and candle wax. A chair is pushed back from the desk, as if its keeper has only just stepped out. Above the desk, two notes are pinned side by side. One is brown and curling, its ink faded to the colour of rust. The other is typed and crisp, signed with a smiley face. A hundred years sit between them, and both are about the same thing: the light.</p></div>' +
          '<div class="keep"><b>Keep this</b>To compare, find what each writer thinks and feels, then link them with a word like <i>whereas</i>, <i>similarly</i> or <i>in contrast</i>.</div>' },

  { type: "sort", topic: "The watch room",
    q: "Read both notes. Which keeper says or shows each thing: Amos, Lou, or both?",
    fig: NOTE_A + NOTE_B,
    buckets: ["Amos, 1898", "Lou, 1998", "Both"],
    cards: [
      ["Says the job is hard or tiring", 2],
      ["Mentions the gulls", 2],
      ["Gives the next keeper advice about the lamp", 0],
      ["Feels the job matters because it keeps ships safe", 0],
      ["Has mixed feelings about leaving", 1],
      ["Worries the light will lose its human side", 1]
    ],
    hint: "Read the notes one at a time and tick off what each keeper mentions. Anything in both goes in the middle.",
    why: "Both find the work tough (\"the nights are long\", \"frozen fingers\") and both mention the gulls. Amos gives practical advice and sees each safe ship as a gift to a stranger. Lou is \"glad and gutted\" at once. Finding similarities and differences like this is the start of AQA Paper 2 Questions 2 and 4." },

  { type: "mc", topic: "The watch room",
    q: "Lou writes: \"The light will keep turning without me. It just won't know who it's turning for.\" What does Lou suggest?",
    fig: NOTE_B,
    options: [
      "The machine will keep working, but the human care behind the light will be lost",
      "The new automatic light is already broken",
      "No ships will sail past Kittiwake Point any more",
      "Lou is pleased that nobody will have to work there again"
    ],
    answer: 0,
    hint: "A light cannot know anything. So why does Lou write as if it could?",
    why: "Lou personifies the light. A keeper knew the ships and the sailors and cared about them; a machine just turns. It is an implicit point: Lou never says \"something precious is being lost\", but the line makes you feel it." },

  { type: "mc", topic: "The watch room", stretch: true,
    q: "Which sentence <b>compares</b> the two keepers best?",
    options: [
      "Amos says the work is hard. Lou also says the work is hard.",
      "Both keepers find the work hard, but whereas Amos \"would not change it\", Lou is \"glad and gutted\", torn between relief and loss.",
      "Amos's note is handwritten and Lou's note is typed, so they are very different.",
      "Amos was the better keeper because the job was harder in 1898."
    ],
    answer: 1,
    hint: "Look for one that finds a similarity, then a difference in how they feel, with a short quotation from each.",
    why: "The strong sentence does three things at once: a similarity (both find it hard), a difference in attitude, and a comparing word (whereas) joining short quotations from both. The others list facts, compare the paper instead of the views, or make a judgement with no evidence." },

  /* ---------- ROOM 4: THE LAMP ROOM ---------- */
  { type: "learn", topic: "The lamp room",
    title: "All glass and weather",
    html: '<div class="extract scene" style="max-height:none"><p>At the top, the lamp room is all glass and weather. The great lens stands in the middle, dark now, a cold glass beehive taller than you. Rain hurls itself at the windows, and there is the gull again, out on the rail, tapping. On the desk sits a poster for a town meeting, PLANS TO TURN LIGHTHOUSE INTO HOLIDAY FLATS, and beside it a half written speech. Some of it needs fixing. Maybe you could help.</p></div>' +
          TASK +
          '<div class="keep"><b>Keep this</b>A hook grabs the reader in one line. A <b>semicolon</b> joins two full sentences that are closely linked. An <b>apostrophe</b> shows belonging (the keeper\'s coat) or missing letters (it\'s = it is).</div>' },

  { type: "mc", topic: "The lamp room",
    q: "Which opening line for the speech hooks the audience best?",
    fig: TASK,
    options: [
      "In this speech I am going to talk about the lighthouse and why I think it should not be turned into flats.",
      "Hello, my name is Sam and today I am here to give a speech.",
      "For a hundred and fifty years, this light brought our fishermen home. Now someone wants to put a hot tub in it.",
      "A lighthouse is a tall tower with a light at the top that warns ships about rocks."
    ],
    answer: 2,
    hint: "Which one would make a tired room full of people sit up?",
    why: "It opens with a proud, specific fact, uses \"our\" to bring the audience in, and then lands a surprising, slightly funny image. Announcing what you are about to do, introducing yourself, or giving a dictionary definition all waste your best line." },

  { type: "order", topic: "The lamp room",
    q: "Put the speech in an order that works.",
    items: [
      "For a hundred and fifty years, this light brought our fishermen home. Now someone wants to put a hot tub in it.",
      "Upstairs are a hundred years of logbooks and letters. As a museum, this lighthouse could share them with everyone.",
      "Of course, some people say holiday flats would bring money into the town.",
      "However, the museum would bring visitors all year round, not just in summer.",
      "So on Thursday, vote for the museum. Keep the light ours."
    ],
    hint: "Hook first, call to action last. Where does \"However\" need to sit?",
    why: "Hook, point, the other side, turn it round, call to action. \"However\" only works straight after the other side, and \"the museum\" needs the museum idea to have come first. Ending with something the audience can actually do on Thursday makes the finish strong." },

  { type: "multi", topic: "The lamp room",
    q: "Some lines of the draft need fixing. Which <b>two</b> are punctuated correctly?",
    options: [
      "This light has kept sailors safe for over a century; it deserves better than a hot tub.",
      "This light has kept sailors safe; for over a century.",
      "Lou's notes are still pinned up in the watch room.",
      "The lighthouse need's our help.",
      "Its' time to stand up for it.",
      "The gulls nest is on the cliff."
    ],
    answers: [0, 2],
    hint: "Semicolon test: could both halves stand alone as sentences? Apostrophe test: does something belong to someone, or are letters missing?",
    why: "\"For over a century\" cannot stand alone, so that semicolon is wrong. Lou's notes belong to Lou, so Lou's is right. \"Needs\" is just a verb, so no apostrophe. \"Its'\" is never correct (outrageous, as Jay would say): it should be it's, meaning it is. And the nest belongs to the gull, so it needs gull's (or gulls' if it belongs to more than one gull)." },

  /* ---------- THE FINAL DOOR ---------- */
  { type: "unlock", topic: "The final door",
    q: "<p>You run back down to the padlocked door. Scratched into the paint above it, in an old, careful hand:</p>" +
       "<p><i>Begin where the light lives, and walk down to the door.</i></p>" +
       "<p>Here are the rooms in the order you climbed them, with their digits.</p>",
    code: "6183",
    hint: "Which room holds the light itself? Start with its digit, then take the rooms in the order you pass them on the way down.",
    why: "The light lives in the lamp room, at the top: 6. Walking down you pass the watch room (1), the spiral stair (8) and the boot room (3), where the door is. So the code is 6183, your climbing order read backwards. A neat bit of structure: the ending takes you back to where you began." }
  ]
});
})();
</script>
</body>
</html>
