<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chilton Tube</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/chiltontube.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
/* Short, stable link to Chilton Tube (cbsbase5.github.io/tube/).
   Chilton Tube itself is an Apps Script web app that only opens for
   Chilton Bridge accounts; this page just sends people on to it, so
   if its address ever changes only TUBE_URL below needs editing.
   Designed by JT, made by Jay. ASCII only. */
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#fef8f4;color:#0a2f38;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
svg{width:120px;height:120px}
h1{font:900 28px/1.1 Archivo,system-ui,sans-serif;margin:14px 0 6px}
p{margin:0 0 18px;color:#55707a}
a{display:inline-block;background:#007291;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:16px 13px 17px 12px}
.eyes{transform-origin:32px 32px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.eyes{animation:none}}
</style>
</head>
<body>
<div>
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 19 L19.5 9.5 M38 19 L44.5 9.5" stroke="#ef7724" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="19.5" cy="9.5" r="3.4" fill="#ef7724"/><circle cx="44.5" cy="9.5" r="3.4" fill="#ef7724"/>
    <rect x="8" y="18" width="48" height="36" rx="10" fill="#007291"/>
    <g class="eyes"><circle cx="25" cy="32" r="3.4" fill="#0a2f38"/><circle cx="39" cy="32" r="3.4" fill="#0a2f38"/></g>
    <path d="M25.5 41.5 q6.5 4.5 13 0" stroke="#0a2f38" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>
  <h1>Chilton Tube</h1>
  <p id="msg">Warming up the telly...</p>
  <a id="go" href="#">Open Chilton Tube</a>
</div>
<script>
var TUBE_URL = "https://script.google.com/a/macros/chiltonbridgeschool.co.uk/s/AKfycbzU8W7WS05_RXCMiXrWRRLm3ZdrgSFZllKKh5TuGcE82uj38ecjt4CJS499H2Q9rLXlFg/exec";
document.getElementById("go").href = TUBE_URL;
try { location.replace(TUBE_URL); } catch (e) {}
setTimeout(function () { document.getElementById("msg").textContent = "Sign in with your Chilton Bridge account if it asks."; }, 2500);
</script>
</body>
</html>
