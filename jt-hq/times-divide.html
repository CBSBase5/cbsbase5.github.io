<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function gap(){ return '<span class="gap">what</span>'; }
function big(s){ return '<span class="sumbig">' + s + '</span>'; }
function f1(n){ return (+n).toFixed(1); }

/* ---------- a cupcake, drawn at (x, y) with size s ---------- */
function cake(x, y, s){
  return '<path d="M' + f1(x + .16 * s) + ' ' + f1(y + .5 * s) + ' L' + f1(x + .84 * s) + ' ' + f1(y + .5 * s) + ' L' + f1(x + .74 * s) + ' ' + f1(y + s) + ' L' + f1(x + .26 * s) + ' ' + f1(y + s) + ' Z" fill="' + VIOLET + '" stroke="' + INK + '" stroke-width="1.5"/>' +
    '<path d="M' + f1(x + .08 * s) + ' ' + f1(y + .54 * s) + ' Q' + f1(x + .08 * s) + ' ' + f1(y + .14 * s) + ' ' + f1(x + .5 * s) + ' ' + f1(y + .14 * s) + ' Q' + f1(x + .92 * s) + ' ' + f1(y + .14 * s) + ' ' + f1(x + .92 * s) + ' ' + f1(y + .54 * s) + ' Z" fill="#ffd1e3" stroke="' + INK + '" stroke-width="1.5"/>' +
    '<circle cx="' + f1(x + .5 * s) + '" cy="' + f1(y + .12 * s) + '" r="' + f1(.1 * s) + '" fill="' + CORAL + '" stroke="' + INK + '" stroke-width="1.2"/>';
}
var CAKE_ICON = '<svg class="sm-cake" viewBox="0 0 24 24" aria-hidden="true">' + cake(1, 1, 22) + '</svg>';

/* 3 plates of 4 cupcakes */
var GROUPS = (function(){
  var s = '<svg viewBox="0 0 400 160" role="img" aria-label="3 plates. Each plate has 4 cupcakes. 3 groups of 4 is 12.">';
  [70, 200, 330].forEach(function(cx){
    s += '<ellipse cx="' + cx + '" cy="96" rx="60" ry="15" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.5"/>';
    for(var k = 0; k < 4; k++) s += cake(cx - 54 + k * 27, 60, 27);
  });
  s += t(200, 146, "3 groups of 4 = 12", 22, INK, LAB + ' font-weight="800" text-anchor="middle"');
  return s + '</svg>';
})();

/* 5 pairs of glowing eyes */
var EYES = (function(){
  var s = '<svg viewBox="0 0 400 150" role="img" aria-label="A dark night with 5 pairs of glowing eyes. Each pair is 2 eyes.">';
  s += '<rect x="4" y="4" width="392" height="142" rx="14" fill="#1b1c16"/>';
  [[70, 50], [190, 40], [320, 56], [120, 108], [260, 104]].forEach(function(p){
    [-13, 13].forEach(function(dx){
      s += '<ellipse cx="' + (p[0] + dx) + '" cy="' + p[1] + '" rx="9" ry="12" fill="' + SUN + '"/>';
      s += '<ellipse cx="' + (p[0] + dx) + '" cy="' + p[1] + '" rx="2.5" ry="9" fill="#1b1c16"/>';
    });
  });
  return s + '</svg>';
})();

/* an office block at night with an array of lit windows */
function windows(r, c, label, caption){
  var ww = 32, wh = 24, g = 10, bw = c * ww + (c - 1) * g + 40, bh = r * wh + (r - 1) * g + 44;
  var bx = 200 - bw / 2, by = 30, H = by + bh + (caption ? 44 : 12);
  var s = '<svg viewBox="0 0 400 ' + H + '" role="img" aria-label="' + label + '">';
  s += '<circle cx="356" cy="30" r="16" fill="#fbf8e4" stroke="' + INK + '" stroke-width="2"/>';
  s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="#2b2f4a" stroke="' + INK + '" stroke-width="3"/>';
  s += '<rect x="' + (bx - 8) + '" y="' + (by - 10) + '" width="' + (bw + 16) + '" height="12" fill="#2b2f4a" stroke="' + INK + '" stroke-width="3"/>';
  for(var i = 0; i < r; i++) for(var j = 0; j < c; j++){
    s += '<rect x="' + (bx + 20 + j * (ww + g)) + '" y="' + (by + 22 + i * (wh + g)) + '" width="' + ww + '" height="' + wh + '" fill="' + SUN + '" stroke="' + INK + '" stroke-width="2"/>';
  }
  if(caption) s += t(200, by + bh + 32, caption, 20, INK, LAB + ' font-weight="800" text-anchor="middle"');
  return s + '</svg>';
}
var WIN35 = windows(3, 5, "An office block at night. The lit windows make 3 rows of 5. 3 times 5 is 15.", "3 rows of 5 = 15");
var WIN46 = windows(4, 6, "An office block at night. The lit windows are in rows and columns: 4 rows with 6 windows in each row.");

/* sharing and grouping */
function boxOf(x, y, w, h, n, fill){
  var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + fill + '" stroke="' + INK + '" stroke-width="2.5"/>';
  var cs = 22, gx = (w - n * cs) / (n + 1);
  for(var k = 0; k < n; k++) s += cake(x + gx + k * (cs + gx), y + (h - cs) / 2, cs);
  return s;
}
var SHAREFIG = (function(){
  var s = '<svg viewBox="0 0 400 260" role="img" aria-label="Sharing: 12 cupcakes in 3 boxes, 4 in each box. Grouping: 12 cupcakes in bags of 3 make 4 bags.">';
  s += t(10, 22, "Sharing: 3 boxes", 17, INK, LAB + ' font-weight="800"');
  for(var k = 0; k < 3; k++) s += boxOf(10 + k * 130, 32, 118, 48, 4, "#fff5d6");
  s += t(390, 102, "4 in each box", 16, BLUE, BODY + ' font-weight="700" text-anchor="end"');
  s += t(10, 146, "Grouping: bags of 3", 17, INK, LAB + ' font-weight="800"');
  for(k = 0; k < 4; k++) s += boxOf(10 + k * 97, 156, 88, 48, 3, "#e9f9f2");
  s += t(390, 226, "4 bags", 16, BLUE, BODY + ' font-weight="700" text-anchor="end"');
  s += t(200, 252, "12 &divide; 3 = 4", 20, INK, LAB + ' font-weight="800" text-anchor="middle"');
  return s + '</svg>';
})();
var LEFTFIG = (function(){
  var s = '<svg viewBox="0 0 400 190" role="img" aria-label="14 cupcakes shared into 4 boxes. Each box has 3. 2 cupcakes are left over.">';
  for(var k = 0; k < 4; k++) s += boxOf(8 + k * 98, 12, 90, 48, 3, "#fff5d6");
  s += cake(160, 92, 30) + cake(206, 92, 30);
  s += '<rect x="146" y="84" width="104" height="46" rx="10" fill="none" stroke="' + CORAL + '" stroke-width="2.5" stroke-dasharray="6 5"/>';
  s += t(200, 152, "2 left over", 17, CORAL, BODY + ' font-weight="700" text-anchor="middle"');
  s += t(200, 182, "14 &divide; 4 = 3 remainder 2", 19, INK, LAB + ' font-weight="800" text-anchor="middle"');
  return s + '</svg>';
})();

/* ---------- Sharing machine widget ---------- */
var SHARE = [ { n: 12, b: 3 }, { n: 17, b: 5 }, { n: 22, b: 4 } ];
function mountShare(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(typeof d.r !== "number") d.r = 0;
  if(typeof d.each !== "number") d.each = 0;
  if(typeof d.left !== "number") d.left = 0;
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  if(typeof d.fn !== "number") d.fn = 20;
  if(typeof d.fb !== "number") d.fb = 3;
  var view = d.c, fresh = 0;
  el.innerHTML =
    '<div class="wpanel sm-task" data-r="task"></div>' +
    '<div class="wpanel hidden" data-r="free"></div>' +
    '<div class="sm-machine">' +
      '<p class="sm-head" data-r="head"></p>' +
      '<div class="sm-pile" data-r="pile"></div>' +
      '<div class="wrow">' +
        '<button class="btn" type="button" data-r="deal">Deal a round</button>' +
        '<button class="btn btn-quiet" type="button" data-r="rest">Deal the rest</button>' +
        '<button class="btn btn-quiet" type="button" data-r="again">Start again</button>' +
      '</div>' +
      '<div class="sm-boxes" data-r="boxes"></div>' +
    '</div>' +
    '<div class="wpanel sm-ans" data-r="ans"></div>' +
    '<div class="fb sm-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  function cur(){ return d.c >= 3 && view >= 3 ? { n: d.fn, b: d.fb } : SHARE[view]; }
  function free(){ return view >= 3; }
  function pileLeft(){ var p = cur(); return p.n - d.r * p.b; }
  function finished(){ return pileLeft() < cur().b; }
  function locked(){ return !free() && view !== d.c; }
  function stepper(key, v, min, max, lab){
    return '<span class="sm-step"><button class="sm-b" type="button" data-k="' + key + '" data-d="-1" aria-label="' + lab + ' down"' + (v <= min || locked() ? " disabled" : "") + '>&minus;</button>' +
      '<b class="sm-v">' + v + '</b><button class="sm-b" type="button" data-k="' + key + '" data-d="1" aria-label="' + lab + ' up"' + (v >= max || locked() ? " disabled" : "") + '>+</button></span>';
  }
  function task(){
    var dots = '<div class="sm-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(free()) return dots + "<p><b>Free play.</b> The night bakery is all yours. Pick how many cakes and how many boxes, then deal.</p>";
    var p = SHARE[view];
    return dots + '<p class="tiny" style="margin:0 0 4px">Order ' + (view + 1) + ' of 3. Nothing is timed.</p>' +
      "<p>Share <b>" + p.n + " cupcakes</b> into <b>" + p.b + " boxes</b>. Deal them out, then fill in the sum.</p>";
  }
  function draw(){
    var p = cur(), left = pileLeft(), done = finished(), k, j;
    q("task").innerHTML = task();
    var fr = q("free");
    fr.classList.toggle("hidden", !free());
    if(free()) fr.innerHTML = '<div class="sm-sent"><span class="sm-word">Cakes</span>' + stepper("fn", d.fn, 1, 30, "Cakes") +
      '<span class="sm-word">Boxes</span>' + stepper("fb", d.fb, 2, 6, "Boxes") + "</div>";
    q("head").textContent = left > 0 ? "Cakes still to share: " + left : "Cakes still to share: none";
    var pile = "";
    for(k = 0; k < left; k++) pile += CAKE_ICON;
    q("pile").innerHTML = pile || '<span class="sm-none">The pile is empty.</span>';
    var bx = "";
    for(k = 0; k < p.b; k++){
      bx += '<div class="sm-box"><span class="sm-blab">Box ' + (k + 1) + '</span><div class="sm-in">';
      for(j = 0; j < d.r; j++) bx += j >= d.r - fresh ? CAKE_ICON.replace('class="sm-cake"', 'class="sm-cake sm-new"') : CAKE_ICON;
      bx += "</div></div>";
    }
    q("boxes").innerHTML = bx;
    fresh = 0;
    var lk = locked();
    q("deal").disabled = done || lk;
    q("rest").disabled = done || lk;
    q("again").disabled = d.r === 0 || lk;
    q("deal").textContent = done ? "Not enough for every box" : "Deal a round";
    var a = q("ans");
    if(!done){
      a.innerHTML = '<p class="wnote" style="margin:0">Keep dealing until there are not enough cakes for every box.</p>';
    }else if(free()){
      var e = Math.floor(p.n / p.b), r = p.n % p.b;
      a.innerHTML = '<div class="sm-sent">' + p.n + " &divide; " + p.b + " = " + e + (r ? ' <span class="sm-word">remainder</span> ' + r : "") + "</div>" +
        '<p class="wnote" style="margin:6px 0 0">Each box gets ' + e + ". " + (r ? r + " left over." : "Nothing left over.") + "</p>";
    }else{
      a.innerHTML = '<div class="sm-sent">' + p.n + " &divide; " + p.b + " = " + stepper("each", d.each, 0, 20, "Each box") +
        '<span class="sm-word">remainder</span>' + stepper("left", d.left, 0, 20, "Left over") + "</div>" +
        '<div class="wrow" style="justify-content:center">' +
          '<button class="btn" type="button" data-r="go"' + (lk ? " disabled" : "") + ">Check</button>" +
          '<button class="btn btn-quiet' + (lk || !d.miss[view] ? " hidden" : "") + '" type="button" data-r="show">Show me</button>' +
        "</div>";
      q("go").onclick = check;
      q("show").onclick = showMe;
    }
  }
  function fbk(cls, html){ var f = q("fb"); f.className = "fb sm-fb " + cls; f.innerHTML = html; }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function why(p){
    var e = Math.floor(p.n / p.b), r = p.n % p.b;
    return p.n + " &divide; " + p.b + " = " + e + (r ? " remainder " + r : "") + ". Each box gets " + e + ". " +
      (r ? r + " " + (r === 1 ? "is" : "are") + " left over, not enough for every box." : "Nothing is left over.");
  }
  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here it is.</b> " : "<b>Boxed up. Lovely.</b> ";
    var more = last ? '<p style="margin:8px 0 0">All three orders packed.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next order</button>';
    fbk(how === "shown" ? "show" : "good", head + why(SHARE[k]) + more);
    q("next").onclick = function(){
      view = d.c; d.r = 0; d.each = 0; d.left = 0; api.save();
      q("fb").className = "fb sm-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }
  function check(){
    if(locked() || free() || !finished()) return;
    var p = SHARE[view], e = Math.floor(p.n / p.b), r = p.n % p.b;
    if(d.each === e && d.left === r){ solved(view, "right"); return; }
    d.miss[view]++; api.save();
    var msg = d.each !== e ? "Count the cakes in one box. Every box has the same." : "Now count the cakes still in the pile. They are the remainder.";
    fbk("nudge", "<b>Not quite yet.</b> " + msg + (d.miss[view] > 1 ? " Show me is there if you want it." : ""));
    draw();
  }
  function showMe(){
    if(locked() || free()) return;
    var p = SHARE[view];
    d.shown[view] = true;
    d.r = Math.floor(p.n / p.b); d.each = d.r; d.left = p.n % p.b;
    solved(view, "shown");
  }
  q("deal").onclick = function(){ if(locked() || finished()) return; d.r++; fresh = 1; api.save(); draw(); };
  q("rest").onclick = function(){
    if(locked() || finished()) return;
    var p = cur(), want = Math.floor(p.n / p.b);
    fresh = want - d.r; d.r = want; api.save(); draw();
  };
  q("again").onclick = function(){ if(locked()) return; d.r = 0; api.save(); draw(); };
  el.addEventListener("click", function(e){
    var b = e.target.closest(".sm-b");
    if(!b || b.disabled || locked()) return;
    var k = b.getAttribute("data-k"), dd = +b.getAttribute("data-d");
    if(k === "fn"){ d.fn = Math.max(1, Math.min(30, d.fn + dd)); d.r = 0; }
    else if(k === "fb"){ d.fb = Math.max(2, Math.min(6, d.fb + dd)); d.r = 0; }
    else if(k === "each") d.each = Math.max(0, Math.min(20, d.each + dd));
    else if(k === "left") d.left = Math.max(0, Math.min(20, d.left + dd));
    api.save(); draw();
  });
  draw();
  if(d.c >= 3 && d.result){
    fbk("good", "<b>All three orders packed.</b> Share it out, then count one box and the pile.");
    api.done(d.result);
  }
}

EGW.run({
  id: "times-divide",
  title: "Times and share",
  subject: "Maths",
  mins: 35,
  blurb: "Equal groups and arrays, the 2, 5, 10, 3 and 4 times tables, multiples, doubling and halving, sharing, grouping, remainders and word problems.",
  steps: [

  /* ---------- 1 GROUPS AND ARRAYS ---------- */
  { type: "learn", topic: "Groups and arrays",
    title: "Equal groups",
    fig: GROUPS,
    html: "<p>Here are 3 plates. Each plate has 4 cupcakes.</p>" +
          "<p>That is 3 groups of 4. 4 + 4 + 4 = 12.</p>" +
          "<p>We can write it as 3 &times; 4 = 12.</p>" +
          "<p>The &times; sign means groups of, or lots of.</p>" +
          '<div class="keep"><b>Keep this</b>Equal groups all have the same number in them.</div>' },

  { type: "mc", topic: "Groups and arrays",
    fig: EYES,
    q: "Glowing eyes in the dark! Each pair is 2 eyes. Which sum matches?",
    options: [ "5 &times; 2 = 10", "5 + 2 = 7", "2 &times; 2 = 4", "5 &times; 5 = 25" ],
    answer: 0,
    hint: "How many pairs are there? How many eyes in each pair?",
    why: "5 pairs, with 2 eyes in each: <b>5 &times; 2 = 10</b>. Do not worry. It is just five cats on a wall." },

  { type: "learn", topic: "Groups and arrays",
    title: "Arrays",
    fig: WIN35,
    html: "<p>An <b>array</b> is things in rows and columns.</p>" +
          "<p>This office block has 3 rows of windows. Each row has 5.</p>" +
          "<p>3 &times; 5 = 15. Count the columns too: 5 &times; 3 = 15.</p>" +
          '<div class="keep"><b>Keep this</b>You can times in any order. 3 &times; 5 is the same as 5 &times; 3.</div>' },

  { type: "num", topic: "Groups and arrays",
    fig: WIN46,
    q: "How many windows are lit?",
