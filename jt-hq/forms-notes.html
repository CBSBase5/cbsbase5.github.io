/* ---------- notes ---------- */
var NOTE1 = '<div class="note"><p>Hi Sam,</p><p>Do you want to come to film club? It is on Friday at 7pm in the school hall.</p><p>From Kit</p></div>';
var NOTE2 = '<div class="note"><p>Hi Ash,</p><p>Do you want to come to the cake shop with me?</p><p>From Kit</p></div>';

/* ---------- Fill in the form widget ---------- */
var SIG = '<span class="sig">A Moon</span>';
var TICK = '<span class="tk">&#10003;</span>';
var FF_ROUNDS = [
  { head: "Fright Night Film Club",
    task: "<b>Form 1.</b> Alex Moon wants to join the film club. Alex was born on 14 March 2011. Today is 31 October 2026.",
    rows: [
      ["first", "First name", "BLOCK CAPITALS"],
      ["sur", "Surname", "BLOCK CAPITALS"],
      ["dob", "Date of birth", ""],
      ["tel", "Telephone", ""],
      ["sign", "Signature", ""],
      ["date", "Date", ""]
    ],
    chips: [
      { id: "date", t: "31/10/2026" },
      { id: "first", t: "ALEX" },
      { id: null, t: "alex", why: "<b>Not quite.</b> The form asks for BLOCK CAPITALS. Every letter needs to be a capital." },
      { id: "tel", t: "07700 900123" },
      { id: "sign", t: SIG },
      { id: null, t: "03/14/2011", why: "<b>Month first?</b> That is how they do it in America. In the UK, the day goes first: 14/03/2011." },
      { id: "dob", t: "14/03/2011" },
      { id: "sur", t: "MOON" }
    ] },
  { head: "Midnight Puddings: delivery form",
    task: "<b>Form 2.</b> Alex wants a sticky toffee pudding delivered to 12 Elm Road, Chilton, CB4 2RT.",
    rows: [
      ["name", "Name", ""],
      ["addr", "Address", ""],
      ["post", "Postcode", ""],
      ["tel", "Telephone", ""]
    ],
    ticks: [["stp", "Sticky toffee pudding"], ["tri", "Trifle"]],
    need: ["name", "addr", "post", "tel", "stp"],
    chips: [
      { id: "post", t: "CB4 2RT" },
      { id: null, t: "CB4", why: "<b>Only half.</b> A postcode has two parts. You need all of it." },
      { id: "name", t: "Alex Moon" },
      { id: "stp", t: TICK },
      { id: "addr", t: "12 Elm Road, Chilton" },
      { id: null, t: "14/03/2011", why: "<b>Not needed.</b> This form does not ask for a date of birth." },
      { id: "tel", t: "07700 900123" }
    ] }
];
var FF_WHERE = {
  first: "That is a first name. Find the First name box.",
  sur: "That is a family name. It goes in the Surname box.",
  dob: "Alex was born on 14 March 2011. Which box is for that?",
  tel: "That is a phone number. Find the Telephone box.",
  sign: "That is Alex writing their name in their own way. That is a signature.",
  date: "That is today's date. It goes next to the signature.",
  name: "That is a full name. Find the Name box.",
  addr: "That is where Alex lives. Find the Address box.",
  post: "That is a postcode. It has its own box.",
  stp: "Alex wants sticky toffee pudding. Tick that box."
};
var FF_GOOD = ["Yes.", "Spot on.", "That is the one.", "Sorted.", "Nice."];

function fillForm(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.placed) d.placed = [[], []];
  if(!d.binned) d.binned = [[], []];
  if(d.miss === undefined) d.miss = 0;
  var sel = null, msg = "", shakeSlot = null, drag = null;

  function R(){ return FF_ROUNDS[d.r]; }
  function needs(){ return R().need || R().rows.map(function(r){ return r[0]; }); }
  function chipFor(slot){
    var r = R();
    for(var k = 0; k < d.placed[d.r].length; k++){
      var c = r.chips[d.placed[d.r][k]];
      if(c.id === slot) return c;
    }
    return null;
  }
  function roundDone(){ return needs().every(function(s){ return chipFor(s); }); }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }

  function slotHtml(id, label, box){
    var c = chipFor(id), cls = "ffslot" + (box ? " box" : "");
    if(c) return '<div class="' + cls + ' done" data-slot="' + id + '">' + c.t + '</div>';
    if(roundDone()) return '<div class="' + cls + '" data-slot="' + id + '"></div>';
    return '<button type="button" class="' + cls + (sel !== null ? ' hot' : '') + '" data-slot="' + id + '" aria-label="Empty box: ' + label + '">' + (box ? '' : '?') + '</button>';
  }

  function paper(){
    var r = R(), h = '<div class="ffhead">' + r.head + '</div>';
    r.rows.forEach(function(row){
      h += '<div class="ffrow"><span>' + row[1] + (row[2] ? '<small>' + row[2] + '</small>' : '') + '</span>' + slotHtml(row[0], row[1]) + '</div>';
    });
    if(r.ticks){
      h += '<div class="ffrow"><span>Pudding<small>Tick one</small></span></div>';
      r.ticks.forEach(function(t){
        h += '<div class="fftick">' + slotHtml(t[0], t[1], true) + '<span>' + t[1] + '</span></div>';
      });
    }
    return '<div class="ffpaper">' + h + '</div>';
  }

  function draw(){
    if(d.finished){ drawEnd(); return; }
    var r = R(), done = roundDone(), tray = "";
    if(!done) r.chips.forEach(function(c, k){
      if(d.placed[d.r].indexOf(k) >= 0) return;
      var binned = d.binned[d.r].indexOf(k) >= 0;
      tray += '<button type="button" class="ffchip' + (binned ? ' binned' : '') + (sel === k ? ' sel' : '') + '" data-k="' + k + '"' + (binned ? ' disabled' : '') + '>' + c.t + '</button>';
    });
    var btns = "";
    if(done) btns = '<button class="btn" type="button" id="ffNext">' + (d.r === 0 ? "On to form 2" : "See how you did") + '</button>';
    else if(d.miss > 0) btns = '<button class="btn btn-quiet" type="button" id="ffShow">Show me one</button>';
    el.innerHTML = '<div class="ff">' +
      '<div class="ffbar"><span>Form ' + (d.r + 1) + ' of 2</span><span>Misses ' + d.miss + '</span></div>' +
      '<p class="fftask">' + r.task + '</p>' +
      (done ? '' : '<p class="fftask">Drag each detail into its box. Or tap a detail, then tap its box. Some details do not belong.</p>') +
      '<div class="fftray">' + tray + '</div>' +
      paper() +
      '<div class="ffmsg" aria-live="polite">' + (msg || (done ? "" : "Pick a detail to start.")) + '</div>' +
      '<div class="ffbtns">' + btns + '</div></div>';
    wire();
    if(shakeSlot){
      var sl = el.querySelector('.ffslot[data-slot="' + shakeSlot + '"]');
      if(sl) sl.classList.add("shake");
      shakeSlot = null;
    }
  }

  function wire(){
    [].forEach.call(el.querySelectorAll(".ffchip"), function(b){
      if(b.disabled) return;
      var k = +b.dataset.k;
      b.addEventListener("pointerdown", function(e){
        if(e.button !== undefined && e.button > 0) return;
        drag = { k: k, x: e.clientX, y: e.clientY, ghost: null };
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
      });
      b.addEventListener("pointermove", function(e){
        if(!drag || drag.k !== k) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if(!drag.ghost && dx * dx + dy * dy > 64){
          drag.ghost = b.cloneNode(true);
          drag.ghost.classList.add("ffghost");
          drag.ghost.classList.remove("sel");
          drag.ghost.style.width = b.offsetWidth + "px";
          document.body.appendChild(drag.ghost);
          b.classList.add("lift");
          sel = null;
          [].forEach.call(el.querySelectorAll("button.ffslot"), function(s){ s.classList.add("hot"); });
        }
        if(drag.ghost){
          drag.ghost.style.left = e.clientX + "px";
          drag.ghost.style.top = e.clientY + "px";
          e.preventDefault();
        }
      });
      function end(e, cancelled){
        if(!drag || drag.k !== k) return;
        var g = drag.ghost;
        drag = null;
        if(g){
          if(g.parentNode) g.parentNode.removeChild(g);
          var under = cancelled ? null : document.elementFromPoint(e.clientX, e.clientY);
          var slot = under && under.closest ? under.closest("button.ffslot") : null;
          if(slot && el.contains(slot)) place(k, slot.dataset.slot);
          else { msg = "Drop it on a dashed box. Or tap it, then tap a box."; draw(); }
        }else if(!cancelled){
          sel = sel === k ? null : k;
          msg = sel !== null ? "Now tap the box it goes in." : "";
          draw();
        }
      }
      b.addEventListener("pointerup", function(e){ end(e, false); });
      b.addEventListener("pointercancel", function(e){ end(e, true); });
      b.addEventListener("click", function(e){
        if(e.detail === 0){ sel = sel === k ? null : k; msg = sel !== null ? "Now choose the box it goes in." : ""; draw(); }
      });
    });
    [].forEach.call(el.querySelectorAll("button.ffslot"), function(s){
      s.onclick = function(){
        if(sel === null){ msg = "Pick a detail first. Then tap here."; draw(); return; }
        var k = sel; sel = null;
        place(k, s.dataset.slot);
      };
    });
    var nx = el.querySelector("#ffNext");
    if(nx) nx.onclick = function(){
      msg = "";
      if(d.r === 0) d.r = 1; else d.finished = true;
      api.save(); draw();
    };
    var sh = el.querySelector("#ffShow");
    if(sh) sh.onclick = showOne;
  }

  function place(k, slot){
    var c = R().chips[k];
    if(c.id === slot){
      d.placed[d.r].push(k);
      msg = "<b>" + FF_GOOD[d.placed[d.r].length % FF_GOOD.length] + "</b>";
      if(roundDone()) msg = d.r === 0 ?
        "<b>Form 1 done.</b> BLOCK CAPITALS, the day first in dates, and a signature with today's date." :
        "<b>Form 2 done.</b> The whole postcode, and one tick in the right box.";
    }else{
      d.miss++;
      if(c.id === null){ d.binned[d.r].push(k); msg = c.why; }
      else msg = "<b>Not that box.</b> " + FF_WHERE[c.id];
      shakeSlot = slot;
    }
    api.save();
    draw();
  }

  function showOne(){
    var r = R(), n = needs();
    for(var s = 0; s < n.length; s++){
      if(chipFor(n[s])) continue;
      for(var k = 0; k < r.chips.length; k++){
        if(r.chips[k].id === n[s]){
          d.placed[d.r].push(k); d.shown = true; sel = null;
          msg = "<b>Here is one.</b> " + FF_WHERE[n[s]];
          if(roundDone()) msg += " That finishes this form.";
          api.save(); draw(); return;
        }
      }
    }
  }

  function drawEnd(){
    var rank = d.miss === 0 ? "Form filling pro" : d.miss <= 2 ? "Sharp and tidy" : "Getting the hang of it";
    el.innerHTML = '<div class="ff"><div class="ffend">' +
      '<p class="fftask" style="margin:0">Both forms done. Your title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>' + d.miss + ' miss' + (d.miss === 1 ? '' : 'es') + (d.shown ? ', with a little help' : '') + '.</p>' +
      '<p class="fftask">Read each label. Then put the right detail in the right box.</p>' +
      '<button class="btn btn-quiet" type="button" id="ffAgain">Play again</button></div></div>';
    el.querySelector("#ffAgain").onclick = function(){
      d.r = 0; d.placed = [[], []]; d.binned = [[], []]; d.miss = 0; d.shown = false; d.finished = false;
      sel = null; msg = ""; api.save(); draw();
    };
    api.done(result());
  }

  draw();
}

  steps: [

  /* ---------- 1. READING A FORM ---------- */
  { type: "learn", topic: "Reading a form",
    title: "What a form asks for",
    fig: FORM,
