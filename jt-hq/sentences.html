<script>
(function(){
"use strict";

/* ---------- figure: the alphabet in two rows ---------- */
var ALPHA = (function(){
  var s = '<svg viewBox="0 0 380 112" role="img" aria-label="The alphabet from a to z in two rows.">';
  for(var k = 0; k < 26; k++){
    var row = k < 13 ? 0 : 1, col = k % 13;
    var x = 6 + col * 28.4, y = 6 + row * 54;
    s += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="26" height="46" rx="5" fill="#ffffff" stroke="#141a33" stroke-width="2"/>' +
         '<text x="' + (x + 13).toFixed(1) + '" y="' + (y + 31) + '" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="21" font-weight="700" fill="#141a33">' + String.fromCharCode(97 + k) + '</text>';
  }
  return s + '</svg>';
})();

/* ---------- figure: capital and small letters ---------- */
var PAIRS = (function(){
  var p = ["Aa", "Bb", "Dd", "Gg", "Qq", "Rr"];
  var s = '<svg viewBox="0 0 380 92" role="img" aria-label="Capital and small letters side by side: A and a, B and b, D and d, G and g, Q and q, R and r.">';
  p.forEach(function(t, k){
    var x = 2 + k * 63;
    s += '<rect x="' + x + '" y="4" width="58" height="60" rx="6" fill="#ffffff" stroke="#141a33" stroke-width="2"/>' +
         '<text x="' + (x + 18) + '" y="46" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="30" font-weight="700" fill="#1f7a4f">' + t[0] + '</text>' +
         '<text x="' + (x + 42) + '" y="46" text-anchor="middle" font-family="Atkinson Hyperlegible,Verdana" font-size="30" fill="#141a33">' + t[1] + '</text>';
  });
  s += '<text x="40" y="86" font-family="Space Grotesk,Arial" font-size="15" font-weight="700" fill="#1f7a4f">capital</text>' +
       '<text x="112" y="86" font-family="Space Grotesk,Arial" font-size="15" fill="#141a33">small</text>';
  return s + '</svg>';
})();

/* ---------- Capital hunt widget ----------
   A word starting with ^ needs a capital letter. */
var CH_ROUNDS = [
  { name: "A note on the lift door",
    text: "^the lights in the car park keep flickering. ^on ^monday, ^i saw a shadow by the lift. ^it was only ^sam, the cleaner. ^he was singing!" },
  { name: "A note in the cake shop",
    text: "^the cake shop in ^york shuts at night. ^in ^october, ^mo and ^i will have a spooky party here. ^will you come?" }
];
var CH_WHY = {
  monday: "Days of the week need a capital.",
  october: "Months need a capital.",
  york: "Places need a capital.",
  sam: "Names of people need a capital.",
  mo: "Names of people need a capital."
};
var CH_FINE = [
  "That one stays small. It is not a name, and it does not start a sentence.",
  "No capital there. Look for the start of a sentence, or a name.",
  "That word is fine as it is. Try another."
];
var CH_GOOD = ["Yes.", "Got it.", "Spot on.", "Nice."];

function chParse(r){
  var toks = r.text.split(" ").map(function(t){
    var need = t.charAt(0) === "^";
    var w = need ? t.slice(1) : t;
    return { w: w, need: need, fix: w.charAt(0).toUpperCase() + w.slice(1) };
  });
  toks.forEach(function(t, k){
    if(!t.need) return;
    var bare = t.w.replace(/[^a-z]/g, "");
    var starts = k === 0 || /[.!?]$/.test(toks[k - 1].w);
    t.why = starts ? "It starts a sentence." : bare === "i" ? "I on its own is always a capital." : (CH_WHY[bare] || "It is a name.");
  });
  return toks;
}
var CH_TOKS = CH_ROUNDS.map(chParse);
function chCount(r){ return CH_TOKS[r].filter(function(t){ return t.need; }).length; }

function capitalHunt(el, api){
  var d = api.data;
  if(d.r === undefined) d.r = 0;
  if(!d.found) d.found = [[], []];
  if(d.miss === undefined) d.miss = 0;
  var msg = "", shake = -1;

  function roundDone(){ return d.found[d.r].length >= chCount(d.r); }
  function result(){ return d.shown ? "shown" : d.miss <= 2 ? "right1" : "right2"; }

  function draw(){
    if(d.finished){ drawEnd(); return; }
    var toks = CH_TOKS[d.r], fin = roundDone(), n = chCount(d.r);
    var note = toks.map(function(t, k){
      if(t.need && d.found[d.r].indexOf(k) >= 0) return '<span class="chw ok">' + t.fix + '</span>';
      if(fin) return '<span>' + t.w + '</span>';
      return '<button type="button" class="chw" data-k="' + k + '">' + t.w + '</button>';
    }).join(" ");
    var btns = fin ? '<button class="btn" type="button" id="chNext">' + (d.r === 0 ? "On to note 2" : "See how you did") + '</button>' :
      (d.miss > 0 ? '<button class="btn btn-quiet" type="button" id="chShow">Show me one</button>' : '');
    el.innerHTML = '<div class="ch">' +
      '<div class="chbar"><span>Note ' + (d.r + 1) + ' of 2</span><span>Found ' + d.found[d.r].length + ' of ' + n + '</span></div>' +
      '<p class="chtip"><b>' + CH_ROUNDS[d.r].name + '.</b> ' + (fin ? "All found." : n + " words need a capital letter. Tap them.") + '</p>' +
      '<div class="chnote">' + note + '</div>' +
      '<div class="chmsg" aria-live="polite">' + (msg || "Look for sentence starts, names, days, months and I.") + '</div>' +
      '<div class="chrow">' + btns + '</div></div>';
    [].forEach.call(el.querySelectorAll("button.chw"), function(b){
      b.onclick = function(){ tap(+b.dataset.k); };
    });
    var nx = el.querySelector("#chNext");
    if(nx) nx.onclick = function(){
      msg = "";
      if(d.r === 0) d.r = 1; else d.finished = true;
      api.save(); draw();
    };
    var sh = el.querySelector("#chShow");
    if(sh) sh.onclick = showOne;
    if(shake >= 0){
      var s = el.querySelector('button.chw[data-k="' + shake + '"]');
      if(s) s.classList.add("shake");
      shake = -1;
    }
  }

  function tap(k){
    var t = CH_TOKS[d.r][k];
    if(t.need){
      d.found[d.r].push(k);
      msg = "<b>" + CH_GOOD[d.found[d.r].length % CH_GOOD.length] + " " + t.fix.replace(/[.,!?]$/, "") + ".</b> " + t.why;
      if(roundDone()) msg += " That is all of them.";
    }else{
      d.miss++;
      msg = "<b>Hmm.</b> " + CH_FINE[d.miss % CH_FINE.length];
      shake = k;
    }
    api.save(); draw();
  }

  function showOne(){
    var toks = CH_TOKS[d.r];
    for(var k = 0; k < toks.length; k++){
      if(toks[k].need && d.found[d.r].indexOf(k) < 0){
        d.found[d.r].push(k); d.shown = true;
        msg = "<b>Here is one: " + toks[k].fix.replace(/[.,!?]$/, "") + ".</b> " + toks[k].why;
        api.save(); draw(); return;
      }
    }
  }

  function drawEnd(){
    var rank = d.miss === 0 ? "Capital detective" : d.miss <= 2 ? "Sharp eyes" : "Night shift spotter";
    el.innerHTML = '<div class="ch"><div class="chend">' +
      '<p class="chtip" style="margin:0">Both notes fixed. Your title:</p>' +
      '<div class="big">' + rank + '</div>' +
      '<p>14 capitals found. ' + d.miss + ' miss' + (d.miss === 1 ? '' : 'es') + (d.shown ? ', with a little help' : '') + '.</p>' +
      '<p class="chtip">Sentence starts, names, places, days, months and I. They all get a capital.</p>' +
      '<button class="btn btn-quiet" type="button" id="chAgain">Play again</button></div></div>';
    el.querySelector("#chAgain").onclick = function(){
      d.r = 0; d.found = [[], []]; d.miss = 0; d.shown = false; d.finished = false; msg = "";
      api.save(); draw();
    };
    api.done(result());
  }

  draw();
}

EGW.run({
  id: "sentences",
  title: "Capitals and full stops",
  subject: "English",
  blurb: "Letters in order, capital letters, full stops and question marks, and joining ideas with and, but and because.",
  mins: 35,
  steps: [

  /* ---------- 1. THE ALPHABET ---------- */
  { type: "learn", topic: "The alphabet",
    title: "26 letters in order",
    fig: ALPHA,
    html: "<p>There are 26 letters in the alphabet.</p>" +
          "<p>They always go in the same order, from a to z.</p>" +
          "<p>Singing the alphabet in your head can help.</p>" +
          '<div class="keep"><b>Keep this</b>Stuck? Say the alphabet from a until you reach the letter.</div>' },

  { type: "mc", topic: "The alphabet",
    q: "Which letter comes just after <b>m</b>?",
    options: ["n", "l", "o", "p"],
    answer: 0,
    hint: "Say it from k: k, l, m, and then?",
    why: "k, l, m, <b>n</b>, o, p. The letter after m is n." },

  { type: "mc", topic: "The alphabet",
    q: "Which letter comes just before <b>k</b>?",
    options: ["j", "l", "i", "h"],
    answer: 0,
    hint: "Say it from h: h, i, and then?",
    why: "h, i, <b>j</b>, k. The letter just before k is j." },

  { type: "mc", topic: "The alphabet",
    q: "Which letter goes in the gap? <b>r, ___, t</b>",
    options: ["s", "u", "q", "p"],
    answer: 0,
    hint: "Say it from p: p, q, r, and then?",
    why: "p, q, r, <b>s</b>, t, u. The letter between r and t is s." },

  { type: "order", topic: "The alphabet",
    q: "Put these letters in alphabetical order.",
    items: ["c", "f", "h", "m", "s"],
    hint: "Say the alphabet slowly. Which of these do you meet first?",
    why: "From a to z, you meet c first. Then f, h, m and s." },

  /* ---------- 2. ALPHABETICAL ORDER ---------- */
  { type: "learn", topic: "Alphabetical order",
    title: "First letter, then second letter",
    html: "<p>To put words in order, look at the first letter.</p>" +
          '<p class="eg"><b>c</b>ake, <b>j</b>elly, <b>t</b>rifle</p>' +
          "<p>Do two words start with the same letter? Then look at the second letter.</p>" +
          '<p class="eg">b<b>i</b>scuit, b<b>r</b>ownie, b<b>u</b>n</p>' +
          '<div class="keep"><b>Keep this</b>Phone contacts and dictionaries use this order.</div>' },

  { type: "order", topic: "Alphabetical order",
    q: "Put these puddings in alphabetical order.",
    items: ["apple pie", "cupcake", "jelly", "muffin", "trifle"],
    hint: "Look at the first letter of each one: a, c, j, m, t.",
    why: "<b>a</b>pple pie, <b>c</b>upcake, <b>j</b>elly, <b>m</b>uffin, <b>t</b>rifle. The first letters go a, c, j, m, t." },

  { type: "mc", topic: "Alphabetical order",
    q: "Which word comes first in alphabetical order?",
    options: ["gate", "ghost", "glow"],
    answer: 0,
    hint: "They all start with g. Look at the second letter.",
    why: "The second letters are a, h and l. The letter a comes first, so <b>gate</b> comes first." },

  { type: "order", topic: "Alphabetical order",
    q: "These all start with c. Put them in alphabetical order.",
    items: ["cake", "chips", "cookie", "crumble", "custard"],
    hint: "Look at the second letter of each word.",
    why: "The second letters are a, h, o, r and u. So: c<b>a</b>ke, c<b>h</b>ips, c<b>o</b>okie, c<b>r</b>umble, c<b>u</b>stard." },

  { type: "order", topic: "Alphabetical order", stretch: true,
    q: "Put these names in alphabetical order.",
    items: ["Sam", "Sara", "Sid", "Sky"],
    hint: "Sam and Sara start the same way. Look at their third letter.",
    why: "The second letters are a, a, i and k. Sam and Sara both start with Sa. So look at the third letter. The m comes before r. So: Sam, Sara, Sid, Sky." },

  /* ---------- 3. CAPITAL LETTERS ---------- */
  { type: "learn", topic: "Capital letters",
    title: "Big letters and small letters",
    fig: PAIRS,
    html: "<p>Every letter has two shapes.</p>" +
          "<p>A capital letter is the big one. A small letter is the everyday one.</p>" +
          "<p>Most writing uses small letters. Capitals have special jobs.</p>" +
          "<p><b>Job 1.</b> Start every sentence with a capital.</p>" +
          "<p><b>Job 2.</b> The word I on its own is always a capital.</p>" +
          '<div class="keep"><b>Keep this</b>New sentence? Capital letter.</div>' },

  { type: "match", topic: "Capital letters",
    q: "Match each capital letter to its small letter.",
    pairs: [["A", "a"], ["B", "b"], ["D", "d"], ["E", "e"], ["G", "g"], ["Q", "q"]],
    hint: "Some small letters look very different. Say the letter name out loud.",
    why: "Each capital goes with its own small letter. Watch out for b and d. They face different ways." },

  { type: "mc", topic: "Capital letters",
    q: "Which sentence starts with a capital letter?",
    options: ["The lights went out.", "the lights went out.", "the Lights went out."],
    answer: 0,
    hint: "Look at the very first letter.",
    why: "<b>The</b> starts the sentence, so it needs a capital T. Lights is an everyday word, so it stays small." },

  { type: "mc", topic: "Capital letters",
    q: "Which one is right?",
    options: ["Then I heard a noise.", "Then i heard a noise.", "then I heard a noise."],
    answer: 0,
    hint: "Check two things. The first letter, and the word I.",
    why: "<b>Then</b> starts the sentence, so it has a capital. <b>I</b> on its own is always a capital too." },

  { type: "multi", topic: "Capital letters",
    q: "<i>after school i ate a cupcake.</i><br>Which words need a capital letter?",
    options: ["after", "school", "i", "ate", "cupcake"],
    answers: [0, 2],
    fixed: true,
    hint: "There are two. One starts the sentence.",
    why: "<i><b>A</b>fter school <b>I</b> ate a cupcake.</i> After starts the sentence. I on its own is always a capital." },

  /* ---------- 4. NAMES AND DAYS ---------- */
  { type: "learn", topic: "Names and days",
    title: "Capitals for names",
    html: "<p>Names always start with a capital letter.</p>" +
          "<ul><li>People: Sam, Mia</li>" +
          "<li>Places: Leeds, Wales</li>" +
          "<li>Days: Monday, Friday</li>" +
          "<li>Months: March, October</li></ul>" +
          "<p>Everyday things stay small: cake, torch, door.</p>" +
          '<div class="keep"><b>Keep this</b>Is it a name? Then it needs a capital letter.</div>' },

  { type: "sort", topic: "Names and days",
    q: "Does it need a capital letter?",
    buckets: ["Capital letter", "Small letter"],
    cards: [
      ["friday", 0], ["london", 0], ["october", 0], ["mia", 0],
      ["cake", 1], ["torch", 1], ["corridor", 1], ["night", 1]
    ],
    hint: "Is it the name of a person, a place, a day or a month?",
    why: "Friday is a day. London is a place. October is a month. Mia is a name. Cake, torch, corridor and night are everyday words." },

  { type: "mc", topic: "Names and days",
    q: "Which sentence is right?",
    options: ["On Friday, Mo went to York.", "On friday, Mo went to york.", "On Friday, mo went to York."],
    answer: 0,
    hint: "Find the day, the person and the place. Do they all have capitals?",
    why: "<b>Friday</b> is a day, <b>Mo</b> is a person and <b>York</b> is a place. All three need a capital." },

  { type: "widget", topic: "Names and days",
    title: "Capital hunt",
    html: "<p>Someone left notes around an empty building. The capitals have gone missing. Can you find them?</p>",
    mount: capitalHunt,
    report: function(d){ return d && d.finished ? "Capital hunt: both notes fixed, " + (d.miss || 0) + " misses" + (d.shown ? ", used Show me" : "") : "Capital hunt: not finished"; } },

  /* ---------- 5. FULL STOPS AND QUESTIONS ---------- */
  { type: "learn", topic: "Full stops and questions",
    title: "How a sentence ends",
    html: "<p>A full stop ends a sentence that tells you something.</p>" +
          '<p class="eg">The car park is empty.</p>' +
          "<p>A question mark ends a sentence that asks something.</p>" +
          '<p class="eg">Who left the light on?</p>' +
          '<div class="keep"><b>Keep this</b>Questions often start with who, what, where, when, why or how.</div>' },

  { type: "mc", topic: "Full stops and questions",
    q: "<i>Where is the cleaner</i><br>What goes at the end?",
    options: ["A question mark", "A full stop", "A comma"],
    answer: 0,
    hint: "Is it telling you something, or asking something?",
    why: "It asks something, so it ends with a question mark. It starts with where, which is a clue." },

  { type: "sort", topic: "Full stops and questions",
    q: "Full stop or question mark?",
    buckets: ["Full stop", "Question mark"],
    cards: [
      ["The lights are flickering", 0], ["I can hear footsteps", 0], ["It was only the cleaner", 0],
      ["Is anyone there", 1], ["What was that noise", 1], ["Can I have a cupcake", 1]
    ],
    hint: "Read each one out loud. Does your voice go up at the end, like a question?",
    why: "The first three tell you something. They take a full stop. The other three ask something. They take a question mark." },

  { type: "mc", topic: "Full stops and questions",
    q: "Which one is right?",
    options: ["The door is open.", "The door is open", "the door is open."],
    answer: 0,
    hint: "Does it tell or ask? And check the first letter.",
    why: "It tells you something, so it ends with a full stop. It also needs a capital T at the start." },

  { type: "mc", topic: "Full stops and questions",
    q: "<i>The lift stopped It was dark.</i><br>Where should the missing full stop go?",
    options: ["After stopped", "After lift", "After The"],
    answer: 0,
    hint: "There are two sentences. Where does the first one finish?",
    why: "<i>The lift stopped. It was dark.</i> The first sentence ends after stopped. That is why It has a capital letter." },

  /* ---------- 6. MAKING SENSE ---------- */
  { type: "learn", topic: "Making sense",
    title: "A sentence makes sense",
    html: "<p>A sentence makes sense on its own.</p>" +
          '<p class="eg">The torch is on the shelf.</p>' +
          "<p>This is not a sentence. It leaves you waiting.</p>" +
          '<p class="eg">On the shelf.</p>' +
          "<p>A sentence says who or what. Then it says what they do or are.</p>" +
          '<div class="keep"><b>Keep this</b>Read it on its own. Does it make sense? Then it is a sentence.</div>' },

  { type: "mc", topic: "Making sense",
    q: "Which one is a full sentence?",
    options: ["The cleaner was singing.", "The cleaner.", "Singing in the corridor."],
    answer: 0,
    hint: "Which one tells you who, and what they did?",
    why: "<b>The cleaner was singing.</b> It says who and what they did. The other two leave you waiting for more." },

  { type: "sort", topic: "Making sense",
    q: "Is it a sentence?",
    buckets: ["Sentence", "Not a sentence"],
    cards: [
      ["I ate a cupcake.", 0], ["The lights went out.", 0], ["We heard a noise.", 0],
      ["A cupcake.", 1], ["In the dark.", 1], ["Went out.", 1]
    ],
    hint: "Read each one on its own. Does it make sense, or are you waiting for more?",
    why: "The sentences say who or what, and what happened. The others leave you waiting for more." },
