<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panic button - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=6">
<style>

.panicwrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 40px}
#panicBtn{
  width:min(74vw,290px);height:min(74vw,290px);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ff9243,var(--orange) 45%,var(--orange-deep));
  border:6px solid var(--ink);cursor:pointer;
  box-shadow:0 12px 0 var(--ink);
  font-family:var(--display);font-variation-settings:"wdth" 118,"wght" 900;
  font-size:clamp(1.5rem,6vw,2.3rem);letter-spacing:.06em;color:var(--ink);
  transition:transform .1s ease,box-shadow .1s ease;
}
#panicBtn:hover{transform:translateY(-3px);box-shadow:0 15px 0 var(--ink)}
#panicBtn:active{transform:translateY(10px);box-shadow:0 2px 0 var(--ink)}
.dogcard{
  background:var(--white);border:var(--border) solid var(--ink);
  border-radius:var(--r-alt);padding:18px;margin:26px 0 0;max-width:560px;
  box-shadow:var(--lift);transform:rotate(-.7deg);text-align:center;
}
.dogcard img,.dogcard svg{width:100%;height:auto;border-radius:14px;display:block}
.dogcard p{margin:14px 0 0;font-size:1.02rem}
.hid{display:none}

</style>
</head>
<body>
<div class="grain"></div>

<div class="top">
  <div class="wrap">
    <div class="mark">
      <svg width="36" height="27" viewBox="0 0 36 27" aria-hidden="true">
        <path d="M2 21 Q18 3 34 21" fill="none" stroke="#007291" stroke-width="2.8" stroke-linecap="round"/>
        <line x1="10" y1="13.6" x2="10" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="18" y1="10" x2="18" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="26" y1="13.6" x2="26" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="1" y1="24" x2="35" y2="24" stroke="#0a2f38" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <b>Base 5</b>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/tools/">Tools</a>
      <a href="/my-targets.html">My targets</a>
    </nav>
  </div>
</div>

<header class="hero hero-sm">
  <div class="wrap">
    <h1>PANIC <span class="accent">BUTTON</span></h1>
    <div class="line">
      <span class="chip">Press it</span>
      <p>There is no catch. <span class="hl">It is a dog.</span></p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="panicwrap">
    <button id="panicBtn">PRESS</button>
    <div class="dogcard hid" id="dogcard">
      <img id="dogimg" alt="A dog" class="hid">
      <svg id="dogfallback" viewBox="0 0 300 220" role="img" aria-label="A drawing of a dog">
        <rect width="300" height="220" rx="14" fill="#ffe9cf"/>
        <ellipse cx="150" cy="196" rx="78" ry="9" fill="#0a2f38" opacity=".12"/>
        <path d="M74 96c-14-6-20-30-14-52 4-14 16-12 24 0l12 20z" fill="#9a6134" stroke="#0a2f38" stroke-width="5" stroke-linejoin="round"/>
        <path d="M226 96c14-6 20-30 14-52-4-14-16-12-24 0l-12 20z" fill="#9a6134" stroke="#0a2f38" stroke-width="5" stroke-linejoin="round"/>
        <ellipse cx="150" cy="118" rx="72" ry="64" fill="#c98b4b" stroke="#0a2f38" stroke-width="5"/>
        <ellipse cx="150" cy="150" rx="40" ry="32" fill="#f2d7b3" stroke="#0a2f38" stroke-width="4"/>
        <circle cx="124" cy="106" r="8.5" fill="#0a2f38"/>
        <circle cx="176" cy="106" r="8.5" fill="#0a2f38"/>
        <circle cx="127" cy="103" r="3" fill="#fff"/>
        <circle cx="179" cy="103" r="3" fill="#fff"/>
        <ellipse cx="150" cy="140" rx="13" ry="10" fill="#0a2f38"/>
        <path d="M150 150v10M150 160c-8 0-14 6-14 6M150 160c8 0 14 6 14 6" stroke="#0a2f38" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M138 172c6 6 18 6 24 0" stroke="#0a2f38" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
      <p id="dogline"></p>
    </div>
  </div>

  <a class="backlink" href="/tools/">Back to tools</a>
</div>

<footer>
  <div class="wrap">
    <span>Base 5 &middot; Chilton Bridge School</span>
    <a href="/">Home</a>
  </div>
</footer>

<script>
(function(){
  /* Drop photos into /tools/ with these names and they will be used
     instead of the drawing. Missing ones are skipped silently. */
  var PHOTOS = ["dog.jpg","dog-2.jpg","dog-3.jpg","dog.png"];
  var LINES = [
    "That is the dog.",
    "Still a dog.",
    "The dog does not want anything from you.",
    "Dog. No further questions.",
    "This dog has no idea what a Tuesday is.",
    "Look at it. Just look at it.",
    "The dog has never once been asked to show its working."
  ];
  var found = [];
  PHOTOS.forEach(function(src){
    var t = new Image();
    t.onload = function(){ found.push(src) };
    t.src = src;
  });

  var btn = document.getElementById('panicBtn');
  var card = document.getElementById('dogcard');
  var img = document.getElementById('dogimg');
  var fb = document.getElementById('dogfallback');
  var line = document.getElementById('dogline');
  var last = -1;

  btn.addEventListener('click', function(){
    card.classList.remove('hid');
    if(found.length){
      img.src = found[Math.floor(Math.random()*found.length)];
      img.classList.remove('hid');
      fb.classList.add('hid');
    }
    var i = last;
    while(i === last && LINES.length > 1){ i = Math.floor(Math.random()*LINES.length) }
    last = i;
    line.textContent = LINES[i];
    btn.textContent = "AGAIN";
  });
})();
</script>

</body>
</html>
