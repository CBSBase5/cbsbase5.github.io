<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle pad - Base 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=6">
<style>

.pad{background:var(--white);border:var(--border) solid var(--ink);
  border-radius:var(--r-alt);padding:14px;box-shadow:var(--lift);margin:0 0 16px}
canvas{width:100%;height:auto;display:block;border-radius:14px;
  background:#fffdf8;touch-action:none;cursor:crosshair}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.sw{width:40px;height:40px;border:var(--border) solid var(--ink);border-radius:12px;
  cursor:pointer;padding:0;box-shadow:2px 3px 0 var(--ink)}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.sz{width:44px;height:40px;border:var(--border) solid var(--ink);border-radius:12px;
  background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:2px 3px 0 var(--ink)}
.sz[aria-pressed="true"]{background:var(--yellow)}
.sz i{display:block;background:var(--ink);border-radius:50%}

</style>
</head>
<body>
<div class="grain"></div>

<div class="top">
  <div class="wrap">
    <div class="mark">
      <svg width="36" height="27" viewBox="0 0 36 27" aria-hidden="true">
        <path d="M2 21 Q18 3 34 21" fill="none" stroke="#007291" stroke-width="2.8" stroke-linecap="round"/>
        <line x1="10" y1="13.6" x2="10" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="18" y1="10" x2="18" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="26" y1="13.6" x2="26" y2="24" stroke="#007291" stroke-width="1.6" opacity=".5"/>
        <line x1="1" y1="24" x2="35" y2="24" stroke="#0a2f38" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <b>Base 5</b>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/tools/">Tools</a>
      <a href="/my-targets.html">My targets</a>
    </nav>
  </div>
</div>

<header class="hero hero-sm">
  <div class="wrap">
    <h1>DOODLE <span class="accent">PAD</span></h1>
    <div class="line">
      <span class="chip">No brief</span>
      <p>Nobody marks this. <span class="hl">Nobody even sees it</span> unless you show them.</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bar" id="colours"></div>
  <div class="bar">
    <div class="bar" id="sizes" style="margin:0"></div>
    <button class="btn btn-quiet" id="undoBtn">Undo</button>
    <button class="btn btn-quiet" id="clearBtn">Clear</button>
    <button class="btn" id="saveBtn">Save picture</button>
  </div>
  <div class="pad"><canvas id="cv" width="1100" height="700"></canvas></div>

  <a class="backlink" href="/tools/">Back to tools</a>
</div>

<footer>
  <div class="wrap">
    <span>Base 5 &middot; Chilton Bridge School</span>
    <a href="/">Home</a>
  </div>
</footer>

<script>
(function(){
  var COLOURS=["#0a2f38","#ef7724","#ffc247","#007291","#00a6c9","#7b4b8f","#c94b4b","#3f8a4b","#fffdf8"];
  var SIZES=[3,7,14,26];
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var colour=COLOURS[0], size=SIZES[1], drawing=false, history=[];

  function snapshot(){
    history.push(ctx.getImageData(0,0,cv.width,cv.height));
    if(history.length>25) history.shift();
  }

  var cbox=document.getElementById('colours');
  COLOURS.forEach(function(c){
    var b=document.createElement('button');
    b.className='sw'; b.style.background=c;
    b.setAttribute('aria-label','Colour '+c);
    b.setAttribute('aria-pressed', c===colour?'true':'false');
    b.addEventListener('click',function(){
      colour=c;
      Array.prototype.forEach.call(cbox.children,function(o){
        o.setAttribute('aria-pressed', o===b?'true':'false');
      });
    });
    cbox.appendChild(b);
  });

  var sbox=document.getElementById('sizes');
  SIZES.forEach(function(s){
    var b=document.createElement('div');
    b.className='sz'; b.setAttribute('role','button'); b.tabIndex=0;
    b.setAttribute('aria-pressed', s===size?'true':'false');
    b.innerHTML='<i style="width:'+Math.min(s,22)+'px;height:'+Math.min(s,22)+'px"></i>';
    function pick(){
      size=s;
      Array.prototype.forEach.call(sbox.children,function(o){
        o.setAttribute('aria-pressed', o===b?'true':'false');
      });
    }
    b.addEventListener('click',pick);
    b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()} });
    sbox.appendChild(b);
  });

  function pos(e){
    var r=cv.getBoundingClientRect();
    var p=e.touches?e.touches[0]:e;
    return {x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height)};
  }
  function start(e){
    e.preventDefault(); snapshot(); drawing=true;
    var p=pos(e);
    ctx.strokeStyle=colour; ctx.lineWidth=size;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y); ctx.stroke();
  }
  function move(e){
    if(!drawing) return; e.preventDefault();
    var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  function end(){ drawing=false }

  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',end);

  document.getElementById('undoBtn').addEventListener('click',function(){
    if(history.length) ctx.putImageData(history.pop(),0,0);
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    snapshot(); ctx.clearRect(0,0,cv.width,cv.height);
  });
  document.getElementById('saveBtn').addEventListener('click',function(){
    var out=document.createElement('canvas');
    out.width=cv.width; out.height=cv.height;
    var o=out.getContext('2d');
    o.fillStyle='#fffdf8'; o.fillRect(0,0,out.width,out.height);
    o.drawImage(cv,0,0);
    var a=document.createElement('a');
    a.href=out.toDataURL('image/png'); a.download='doodle.png'; a.click();
  });
})();
</script>

</body>
</html>
