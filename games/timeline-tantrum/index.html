<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Tantrum</title>
<script src="/data/b5site.js?v=8"></script>
<script src="/data/send.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;0,900;1,800;1,900&family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Theme: the Snags' stolen time machine. Machine parts (HUD, console, menus) are dark plum metal
   with pixel stepped edges and glowing readouts. Things from history (finds, labels, postcards)
   are warm Base 5 paper. Colours match the vault box art. */
:root{
  --night:#221d45;--night2:#1b1739;--deep:#151230;--edge:#0e0b22;--screen:#110e29;
  --plate:#2e2860;--plate2:#3a3278;--line:#433a85;
  --violet:#7b5cff;--cyan:#5fe0f0;--cyanD:#1f7f8f;--orange:#ef7724;--green:#7ec850;
  --paper:#fef8f4;--muted:#c3bce8;--amber:#ffc24a;--gold:#e0b040;
  --ink:#1f2a30;--teal:#007291;
  --bd:var(--edge)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1739;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--paper)}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--cyan);outline-offset:5px}
input,textarea{-webkit-user-select:text;user-select:text}

/* pixel stepped edge: four hard shadows leave the corners notched */
.rig,.squad,#mini,.iconbtn,#info,#banner,#jay,.card,.btn,#touch button{
  box-shadow:0 -3px 0 0 var(--bd),0 3px 0 0 var(--bd),-3px 0 0 0 var(--bd),3px 0 0 0 var(--bd),
    inset 0 3px 0 0 rgba(255,255,255,.07),inset 0 -3px 0 0 rgba(0,0,0,.24),0 10px 0 0 rgba(8,6,24,.38)}

/* ---------------- HUD ---------------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;pointer-events:none}
#teams{display:flex;flex-direction:column;gap:12px}
.squad{--c:var(--cyan);position:relative;display:block;min-width:230px;max-width:290px;padding:7px 12px 9px 20px;background:rgba(27,23,57,.93)}
.squad.now{--bd:var(--c)}
.squad .lamp{position:absolute;left:5px;top:6px;bottom:6px;width:6px;background:var(--c);opacity:.35}
.squad.now .lamp{opacity:1;box-shadow:0 0 10px var(--c)}
.sqtop{display:flex;align-items:baseline;gap:8px}
.tn{font:900 italic 16px/1.1 Archivo,sans-serif;color:var(--c);white-space:nowrap}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.th{margin-left:auto;font:400 15px/1 Silkscreen,monospace;color:var(--paper)}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{position:relative;flex:1;min-width:16px;max-width:40px;height:8px;background:var(--screen)}
.pips i u{position:absolute;left:0;top:0;bottom:0;background:var(--c);transition:width .4s}
.pips i.dead{background:repeating-linear-gradient(135deg,#2e2860 0 2px,var(--screen) 2px 4px)}
.pips i.cur{outline:2px solid var(--paper);outline-offset:2px}
#scope{display:flex;flex-direction:column;align-items:center;gap:4px}
#mini{--bd:var(--edge);pointer-events:auto;background:var(--screen);image-rendering:pixelated;width:192px;height:80px;display:block}
#topbtns{pointer-events:auto;display:flex;gap:10px}
.iconbtn{--bd:var(--edge);width:48px;height:48px;border:0;background:var(--plate2);display:grid;place-items:center}
.iconbtn .bars{display:flex;gap:6px}.iconbtn .bars i{width:6px;height:18px;background:var(--paper)}
.iconbtn:active{transform:translateY(2px)}

/* the console: one instrument strip with screens for each reading */
#info{--bd:var(--edge);position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:stretch;background:rgba(27,23,57,.95);padding:6px;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px)}
.cell{display:flex;align-items:center;gap:8px;padding:2px 12px;border-left:2px solid var(--line);min-height:40px}
.cell:first-child{border-left:0}
.k{font:700 13px/1 'Atkinson Hyperlegible',sans-serif;color:var(--muted)}
.read{font:400 18px/1 Silkscreen,monospace;color:var(--cyan);min-width:2ch}
.chev{display:flex;gap:2px}
.chev.left{transform:scaleX(-1)}
.chev i{width:8px;height:14px;background:var(--line);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
.chev i.on{background:var(--cyan)}
#wicon{width:36px;height:36px;image-rendering:pixelated;background:var(--screen);flex:none}
.wn{display:flex;flex-direction:column;gap:3px}
#wname{font:800 16px/1 Archivo,sans-serif;color:var(--paper)}
#wammo{font:400 12px/1 Silkscreen,monospace;color:var(--amber)}
.seg{display:flex;gap:2px;padding:3px;background:var(--screen)}
.seg i{width:6px;height:16px;background:#2a2452}
.seg i.on{background:var(--cyan)}.seg i.on.hot{background:var(--amber)}.seg i.on.max{background:var(--orange)}
.seg.dim i.on{opacity:.45}
#cHint{font-size:14px;color:var(--muted);white-space:normal;max-width:260px}
.ring{--p:100;--rc:var(--cyan);position:relative;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),#2a2452 0);display:grid;place-items:center}
.ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--night2)}
.ring b{position:relative;font:400 13px/1 Silkscreen,monospace;color:var(--paper)}
.ring.low{--rc:var(--amber)}

/* turn banner: a plate that slides in with the squad's lamp colour */
#banner{--c:var(--violet);--bd:var(--edge);position:fixed;left:50%;top:104px;transform:translate(-50%,-8px);background:var(--night);padding:11px 26px 12px 30px;font:900 italic 27px/1.05 Archivo,sans-serif;color:var(--paper);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:left;white-space:nowrap;max-width:calc(100vw - 24px)}
#banner::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:8px;background:var(--c);box-shadow:0 0 12px var(--c)}
#banner small{display:block;margin-top:4px;font:400 15px/1.2 'Atkinson Hyperlegible',sans-serif;color:var(--muted);white-space:normal}
#banner.show{opacity:1;transform:translate(-50%,0)}

/* Jay on the comms screen */
#jay{--bd:var(--edge);position:fixed;right:14px;top:84px;display:flex;align-items:center;gap:10px;max-width:300px;background:var(--night);padding:7px 12px 7px 7px;font-size:15px;line-height:1.25;pointer-events:none}
#jayFace{width:46px;height:46px;flex:none;image-rendering:pixelated;background:linear-gradient(180deg,#24506a,#163348);box-shadow:inset 0 0 0 2px var(--cyanD)}
#jay b{display:block;font:400 12px/1 Silkscreen,monospace;color:var(--cyan);margin-bottom:3px}

/* touch controls: chunky console keys */
#touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px;pointer-events:none}
#touch .cl,#touch .cr{display:grid;gap:10px;pointer-events:auto}
#touch .cl{grid-template-columns:repeat(2,58px)}
#touch .cr{grid-template-columns:repeat(2,76px)}
#touch button{--bd:var(--edge);height:58px;border:0;background:rgba(46,40,96,.92);color:var(--paper);font-weight:700;font-size:15px;touch-action:none}
#touch button.fire{grid-column:span 2;height:74px;background:var(--orange);font:900 italic 24px Archivo,sans-serif}
#touch button.on{background:var(--cyan);color:var(--deep)}

#hud,#info,#touch,#jay{z-index:20}
#banner{z-index:30}

/* ---------------- overlays ---------------- */
.ov{z-index:60;position:fixed;inset:0;display:flex;padding:20px;overflow:auto;background:rgba(10,8,28,.55)}
.ov>*{margin:auto}
.card{--bd:var(--edge);--fg:var(--paper);--mut:var(--muted);--pl:var(--plate);--plb:var(--line);--sel:var(--cyan);--selfg:var(--deep);--lnk:var(--cyan);
  position:relative;background:linear-gradient(180deg,#2a2457,#1e1a42);color:var(--fg);padding:24px 26px;max-width:540px;width:100%;scrollbar-color:var(--line) transparent}
.card.wide{max-width:680px}
.card h2{font:900 italic 30px/1.05 Archivo,sans-serif;margin:0 0 6px;color:var(--paper)}
.lead{margin:0 0 14px;font-size:16px;line-height:1.4;color:var(--mut)}
.stamp{margin:0 0 6px;font:800 italic 15px/1 Archivo,sans-serif;color:var(--orange)}
/* paper cards: things from history */
.card.paper{--bd:var(--ink);--fg:var(--ink);--mut:#5d4f43;--pl:#fff;--plb:#cbbcae;--sel:var(--teal);--selfg:#fff;--lnk:var(--teal);
  background:#fef8f4;background-image:radial-gradient(circle at 90% 0%,rgba(239,119,36,.14),transparent 50%),radial-gradient(circle at 0% 100%,rgba(0,114,145,.12),transparent 55%);transform:rotate(-.6deg)}
.card.paper h2{color:var(--ink)}
.card.paper.glitch{background-color:#eaf8fb}

.opt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:2px solid var(--plb)}
.opt:first-of-type{border-top:0}
.opt>span,.optlab{font:800 15px/1 Archivo,sans-serif;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{--b:var(--plb);border:0;background:var(--pl);color:var(--fg);padding:9px 13px;font-size:15px;font-weight:700;
  box-shadow:0 -2px 0 0 var(--b),0 2px 0 0 var(--b),-2px 0 0 0 var(--b),2px 0 0 0 var(--b)}
.chips button.on{--b:var(--fg);background:var(--sel);color:var(--selfg)}
.chips button.on::before{content:'';display:inline-block;width:7px;height:7px;margin-right:7px;background:currentColor;vertical-align:1px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:44px;height:44px;border:0;background:var(--pl);color:var(--fg);font:900 22px/1 Archivo,sans-serif;box-shadow:0 -2px 0 0 var(--plb),0 2px 0 0 var(--plb),-2px 0 0 0 var(--plb),2px 0 0 0 var(--plb)}
.step b{font:400 22px/1 Silkscreen,monospace;min-width:24px;text-align:center;color:var(--sel)}

.btn{--bd:var(--edge);display:block;width:100%;margin-top:18px;padding:15px 18px;border:0;background:var(--plate2);color:var(--paper);font:900 italic 21px/1 Archivo,sans-serif;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--orange);color:#fff}
.btn.alt{background:var(--violet)}
.card.paper .btn{--bd:var(--ink)}
.card.paper .btn:not(.go):not(.alt){background:var(--teal)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row .btn{flex:1;min-width:170px}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-size:15px}
.foot a,.link{color:var(--lnk);font-weight:700;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* the menu: the logo is the loud thing, the setup panel is calm */
#menu{background:linear-gradient(100deg,rgba(14,11,34,.9) 0%,rgba(14,11,34,.72) 42%,rgba(14,11,34,.35) 100%)}
.menu{display:grid;grid-template-columns:minmax(0,460px) minmax(0,520px);gap:40px 56px;align-items:center;width:100%;max-width:1060px}
.hero{position:relative}
.build{margin:0 0 18px;font-size:14px;color:var(--muted)}
.logo{position:relative;margin:0 0 24px;font:900 italic clamp(46px,6.3vw,84px)/.86 Archivo,sans-serif;text-transform:uppercase;letter-spacing:-.01em;transform:rotate(-4deg);transform-origin:left bottom}
.logo span{display:block;-webkit-text-stroke:5px var(--deep);paint-order:stroke fill}
.logo .l1{color:#7ec850;text-shadow:1px 1px 0 #2f6a24,2px 2px 0 #2f6a24,3px 3px 0 #2f6a24,4px 4px 0 #2f6a24,5px 5px 0 #2f6a24,6px 6px 0 #2f6a24,7px 7px 0 #2f6a24,10px 11px 0 rgba(0,0,0,.4)}
.logo .l2{color:#5fe0f0;margin-left:.28em;text-shadow:1px 1px 0 #ef7724,2px 2px 0 #ef7724,3px 3px 0 #ef7724,4px 4px 0 #ef7724,5px 5px 0 #ef7724,6px 6px 0 #ef7724,7px 7px 0 #ef7724,10px 11px 0 rgba(0,0,0,.4)}
.portal{position:absolute;left:46%;top:46%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(123,92,255,.0) 38%,rgba(123,92,255,.55) 41%,rgba(95,224,240,.5) 45%,rgba(123,92,255,0) 52%);opacity:0}
.tagline{margin:0 0 6px;font-size:19px;line-height:1.35;max-width:30ch}
.hero .btn{max-width:400px}
.hero .btn.go{font-size:30px;padding:20px}
.sum{margin:14px 0 0;font-size:15px;line-height:1.4;color:var(--muted);max-width:44ch}
#turnhint{margin:0 0 12px;font-size:15px;color:var(--amber)}
.setup{max-width:520px}
.setup h2{font-size:24px}
.tournote{margin:0 0 4px;padding:10px 12px;font-size:15px;line-height:1.4;background:var(--screen);color:var(--muted);box-shadow:inset 3px 0 0 var(--violet)}
#tl{width:100%;max-width:470px;aspect-ratio:230/64;image-rendering:pixelated;cursor:pointer;background:var(--screen);box-shadow:inset 0 0 0 2px var(--line)}
#tlText{margin:0;font-size:15px;line-height:1.4;color:var(--muted)}
.more{border-top:2px solid var(--plb);margin-top:4px}
.more summary{list-style:none;cursor:pointer;padding:14px 0 6px;font:800 16px/1 Archivo,sans-serif;color:var(--lnk);display:flex;align-items:center;gap:10px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:'+';display:grid;place-items:center;width:24px;height:24px;background:var(--pl);color:var(--fg);font:900 18px/1 Archivo,sans-serif;box-shadow:0 0 0 2px var(--plb)}
.more[open] summary::before{content:'-'}
.namebtn{align-self:flex-start;border:0;background:var(--pl);color:var(--fg);padding:9px 13px;font-size:15px;font-weight:700;box-shadow:0 -2px 0 0 var(--plb),0 2px 0 0 var(--plb),-2px 0 0 0 var(--plb),2px 0 0 0 var(--plb)}

/* kit: one cartridge per item */
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;margin-top:12px}
.kit button{--b:var(--line);display:grid;grid-template-columns:42px 1fr;gap:6px 11px;align-content:start;text-align:left;border:0;background:var(--plate);color:var(--paper);padding:11px;
  box-shadow:0 -2px 0 0 var(--b),0 2px 0 0 var(--b),-2px 0 0 0 var(--b),2px 0 0 0 var(--b)}
.kit button canvas{width:42px;height:42px;image-rendering:pixelated;background:var(--screen)}
.kit .kn b{display:block;font:800 16px/1.15 Archivo,sans-serif;margin-bottom:3px}
.kit .kn span{font-size:14px;line-height:1.3;color:var(--muted)}
.kit em{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--cyan);display:flex;align-items:center;gap:8px}
.kit em kbd{font:400 11px/1 Silkscreen,monospace;padding:3px 5px;background:var(--screen);color:var(--paper);border:0}
.kit button.on{--b:var(--cyan);background:var(--plate2)}
.kit button.gold{--b:var(--gold)}
.kit button.gold em{color:var(--amber)}
.kit button.off{opacity:.5}

.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line);font-weight:700;font-size:16px}
.tog:first-of-type{border-top:0}
.tog button{min-width:84px;padding:9px 12px;border:0;background:var(--screen);color:var(--muted);font:400 13px/1 Silkscreen,monospace;box-shadow:0 0 0 2px var(--line)}
.tog button.on{background:var(--cyan);color:var(--deep);box-shadow:0 0 0 2px var(--paper)}
.help dl{margin:0}
.help dt{font:800 16px/1.2 Archivo,sans-serif;margin-top:14px;color:var(--cyan)}
.help dd{margin:4px 0 0;font-size:16px;line-height:1.45}
kbd{font:700 14px/1 'Atkinson Hyperlegible',sans-serif;display:inline-block;padding:4px 7px 5px;background:var(--plate2);color:var(--paper);box-shadow:0 3px 0 0 var(--edge)}
.stats{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.stats li{padding:8px 12px;background:var(--screen);font-size:16px;box-shadow:inset 4px 0 0 var(--cyan)}
#overArt{display:block;width:100%;max-width:420px;height:auto;aspect-ratio:210/58;margin:4px auto 6px;image-rendering:pixelated;background:linear-gradient(180deg,var(--screen),#1f1a48)}
.real,.now{margin:12px 0 0;font-size:15px;line-height:1.4;padding:10px 12px;background:var(--screen);color:var(--muted);box-shadow:inset 4px 0 0 var(--violet)}
.card.paper .now,.detail .now{background:#e3f1f5;color:#0c4a5c;box-shadow:inset 4px 0 0 var(--teal)}
.findrow{display:flex;gap:18px;align-items:center;margin:6px 0 10px}
#findArt{width:104px;height:104px;flex:none;image-rendering:pixelated;background:#efe4d6;padding:8px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.meta{margin:4px 0 0;font-size:15px;color:var(--mut);line-height:1.35}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin:12px 0}
.case{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:#1a1640;color:var(--muted);padding:10px 6px;font-size:13px;font-weight:700;line-height:1.15;text-align:center;min-height:104px;box-shadow:inset 0 0 0 2px #2c2660}
.case.got{background:radial-gradient(circle at 50% 30%,rgba(255,236,190,.22),rgba(255,236,190,0) 62%),var(--plate);color:var(--paper);box-shadow:inset 0 0 0 2px var(--line),inset 0 3px 0 0 rgba(255,255,255,.08)}
.case.on{box-shadow:inset 0 0 0 3px var(--cyan)}
.case canvas{width:52px;height:52px;image-rendering:pixelated}
.shelf{display:flex;align-items:baseline;gap:10px;font:900 italic 20px/1.1 Archivo,sans-serif;margin:20px 0 2px;color:var(--paper)}
.shelfn{font:400 13px/1 Silkscreen,monospace;color:var(--cyan)}
.glitchlab{margin:4px 0 0;font:800 14px/1 Archivo,sans-serif;color:var(--violet)}
.small{font-size:15px;line-height:1.4;margin:0;color:var(--muted)}
.detail{--fg:var(--ink);margin-top:14px;background:#fef8f4;color:var(--ink);padding:12px 14px;font-size:15px;line-height:1.4;transform:rotate(-.4deg);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.detail b{display:block;font:900 italic 19px/1.1 Archivo,sans-serif}
.detail p{margin:6px 0 0}
.detail .meta{color:#5d4f43}
.mylabel{font-style:italic;color:#0c4a5c}
#overFinds{margin-top:12px;font-size:15px}
#overFinds b{font:800 15px/1 Archivo,sans-serif;color:var(--muted)}
.finds{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fd{display:inline-flex;align-items:center;gap:6px;background:var(--plate);padding:5px 9px;font-size:14px;box-shadow:inset 0 0 0 2px var(--line)}
.fd canvas{width:24px;height:24px;image-rendering:pixelated}
.starters{margin-top:10px}
.starters button{font-size:14px;padding:7px 10px}
#pcText,#lblText{display:block;width:100%;margin-top:12px;font:inherit;font-size:17px;padding:10px 12px;border:0;background:#fff;color:var(--ink);resize:vertical;box-shadow:0 0 0 2px #cbbcae}
#nameCols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:8px}
#nameCols h3{font:900 italic 18px/1 Archivo,sans-serif;margin:0 0 10px;color:var(--cyan)}
.nrow{display:flex;gap:8px;margin-bottom:8px}
.nrow input{flex:1;min-width:0;font:400 15px/1 Silkscreen,monospace;padding:10px;border:0;background:var(--screen);color:var(--paper);text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--line)}
.nrow button{border:0;background:var(--plate2);color:var(--paper);padding:0 12px;font-weight:700;font-size:14px}
#jumpTl{display:block;width:100%;max-width:470px;margin:10px auto;image-rendering:pixelated;background:var(--screen);box-shadow:inset 0 0 0 2px var(--line)}
.ripple{padding:12px 14px;background:var(--screen);box-shadow:inset 4px 0 0 var(--amber)}
.ripple b{display:block;font:900 italic 18px/1.15 Archivo,sans-serif;color:var(--amber)}
.ripple p{margin:6px 0 0;font-size:16px;line-height:1.4}
#pcCard,#lblCard{display:block;width:100%;max-width:480px;margin:14px auto 0}
.saved{min-height:20px;margin:8px 0 0;font-size:15px;color:#0c4a5c;text-align:center}
/* shared send component, on paper cards */
.sendbox{margin-top:14px;border-top:2px dashed #d9cbbf;padding-top:12px}
.sendtitle{font:900 italic 19px/1.1 Archivo,sans-serif;margin:0 0 4px}

      <button class="btn go" id="bPostcard" hidden><canvas data-g="postcard" class="g"></canvas>Postcard</button>
      <button class="btn go" id="bRematch"><canvas data-g="again" class="g"></canvas>Again</button>
      <button class="btn" id="bSettings" aria-label="Menu"><canvas data-g="gear" class="g"></canvas><span id="setLab">Menu</span></button>
    </div>
  </div>
</div>

<div class="ov" id="find" hidden>
  <div class="card paper findcard">
    <p class="stamp" id="findKick">New</p>
    <div class="findrow">
      <canvas id="findArt" width="12" height="12"></canvas>
      <div><h2 id="findName"></h2><p class="meta" id="findMeta"></p></div>
    </div>
    <p class="fact" id="findFact"></p>
    <p class="now" id="findNow" hidden></p>
    <button class="btn" id="bFindClose"><canvas data-g="play" class="g"></canvas>Back</button>
  </div>
</div>

<div class="ov" id="museum" hidden>
  <div class="card wide">
    <h2><canvas data-g="museum" class="g big"></canvas> Time Museum</h2>
    <p class="counts" id="musSub"></p>
    <div class="detail" id="musDetail" hidden></div>
    <div id="musShelves"></div>
    <button class="btn" id="bMusClose"><canvas data-g="play" class="g"></canvas>Back</button>
  </div>
</div>

<div class="ov" id="label" hidden>
  <div class="card paper wide">
    <h2><canvas data-g="tag" class="g big"></canvas> Your label</h2>
    <div class="chips" id="lblFinds"></div>
    <div class="chips starters" id="lblStarters"></div>
    <textarea id="lblText" maxlength="160" rows="2" placeholder="..." aria-label="Your words"></textarea>
    <canvas id="lblCard" width="480" height="270" aria-label="Your museum label"></canvas>
    <div class="row">
      <button class="btn" id="bLblSave"><canvas data-g="museum" class="g"></canvas>Save</button>
      <button class="btn go" id="bLblPic"><canvas data-g="camera" class="g"></canvas>Picture</button>
    </div>
    <p class="saved" id="lblSaved" aria-live="polite"></p>
    <div id="lblSend"></div>
    <div class="iconrow center"><button class="ib" id="bLblBack" aria-label="Back" title="Back"><canvas data-g="play" class="g flipx"></canvas></button></div>
  </div>
</div>

<div class="ov" id="jump" hidden>
  <div class="card wide jumpcard">
    <h2 id="jumpTitle"></h2>
    <canvas id="jumpTl" width="230" height="40" aria-hidden="true"></canvas>
    <p class="sr" id="jumpYears"></p>
    <div class="ripple" id="ripVis"></div>
    <p class="sr"><b id="jumpRipTitle"></b> <span id="jumpRipText"></span></p>
    <button class="btn go" id="bJumpGo"><canvas data-g="play" class="g"></canvas>Go</button>
  </div>
</div>

<div class="ov" id="postcard" hidden>
  <div class="card paper wide">
    <h2><canvas data-g="postcard" class="g big"></canvas> Postcard home</h2>
    <div class="chips starters" id="pcStarters"></div>
    <textarea id="pcText" maxlength="200" rows="2" placeholder="If we could time travel, should we?" aria-label="Your message"></textarea>
    <canvas id="pcCard" width="480" height="300" aria-label="Your postcard"></canvas>
    <div class="row">
      <button class="btn go" id="bPcPic"><canvas data-g="camera" class="g"></canvas>Picture</button>
      <button class="btn" id="bPcDone"><canvas data-g="check" class="g"></canvas>Finish</button>
    </div>
    <p class="saved" id="pcSaved" aria-live="polite"></p>
    <div id="pcSend"></div>
  </div>
</div>

<div class="ov" id="names" hidden>
  <div class="card wide">
    <h2><canvas data-g="pencil" class="g big"></canvas> Names</h2>
    <div id="nameCols"></div>
    <div class="row">
      <button class="btn alt" id="bRollAll" aria-label="Roll them all"><canvas data-g="dice" class="g"></canvas>All</button>
      <button class="btn go" id="bNamesDone"><canvas data-g="check" class="g"></canvas>Done</button>
    </div>
  </div>
</div>

<div id="jay" hidden><canvas id="jayFace" width="20" height="20"></canvas><div><b>Jay</b><span id="jayLine"></span></div></div>
