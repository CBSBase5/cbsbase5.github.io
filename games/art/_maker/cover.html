<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Silk;src:url(../fonts/node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2)}
@font-face{font-family:Silk;font-weight:700;src:url(../fonts/node_modules/@fontsource/silkscreen/files/silkscreen-latin-700-normal.woff2)}
@font-face{font-family:Archivo;font-weight:800;src:url(../fonts/node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2)}
@font-face{font-family:Archivo;font-weight:900;src:url(../fonts/node_modules/@fontsource/archivo/files/archivo-latin-900-normal.woff2)}
@font-face{font-family:Archivo;font-weight:900;font-style:italic;src:url(../fonts/node_modules/@fontsource/archivo/files/archivo-latin-900-italic.woff2)}
@font-face{font-family:Slab;src:url(../fonts/node_modules/@fontsource/alfa-slab-one/files/alfa-slab-one-latin-400-normal.woff2)}
@font-face{font-family:Atk;src:url(../fonts/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2)}
@font-face{font-family:Atk;font-weight:700;src:url(../fonts/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
:root{--base:#10232c;--base2:#0c1b22;--rule:#f6c945;--accent:#5fd8de;--ink:#0a1a20;--ribbon:#5fd8de;--ribbonInk:#0a1a20;--burst:#f6c945;--burstInk:#c8322f;--sub:#9fe7ec}
#front{position:relative;width:760px;height:1060px;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.07), transparent 60%), linear-gradient(170deg,var(--base),var(--base2));color:#fff}
.hdr{position:absolute;left:35px;top:28px;right:35px;height:36px;display:flex;align-items:center;gap:14px}
.hdr svg{width:46px;height:30px}
.hdr b{font:400 27px/1 Silk;letter-spacing:.2em;color:#f2f2ee}
.chip{margin-left:auto;background:var(--rule);color:var(--ink);font:400 18px/1 Silk;letter-spacing:.06em;padding:6px 10px 5px;border-radius:5px}
.rule{position:absolute;left:35px;right:35px;height:3px;background:var(--rule)}
.title{position:absolute;left:20px;right:20px;top:84px;height:126px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}
.sub{position:absolute;left:30px;right:30px;top:222px;text-align:center;color:var(--sub);font:400 40px/1 Silk;letter-spacing:.06em;white-space:nowrap}
.shot{position:absolute;left:35px;top:298px;width:690px;height:520px;border:3px solid var(--rule);overflow:hidden;background:#000}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.burst{position:absolute;width:236px;height:236px;right:18px;top:536px;transform:rotate(-12deg)}
.burst svg{position:absolute;inset:0}
.burst .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--burstInk);text-align:center;padding-top:4px}
.burst .n i{font:700 86px/0.85 Silk;font-style:normal}
.burst .n u{text-decoration:none;font:400 20px/1.05 Silk;color:var(--ink);margin-top:4px;max-width:150px}
.ribbon{position:absolute;left:92px;top:784px;padding:14px 26px 12px;background:var(--ribbon);color:var(--ribbonInk);font:400 30px/1 Silk;letter-spacing:.1em;transform:rotate(-3deg);box-shadow:5px 5px 0 rgba(0,0,0,.35);white-space:nowrap}
.tag{position:absolute;left:35px;top:902px;font:400 31px/1 Silk;letter-spacing:.12em;color:#f2f2ee;white-space:nowrap}
.small{position:absolute;left:35px;top:952px;font:400 21px/1.2 Atk;color:#b7c3c7;max-width:540px}
.players{position:absolute;right:35px;top:902px;width:128px;height:76px;border:2px solid #e9ece8;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 21px/1.15 Silk;color:#f2f2ee;text-align:center}

#spine{position:relative;width:110px;height:1060px;background:linear-gradient(90deg,#000 -40%,var(--base2));overflow:hidden}
#spine::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
#spine .logo{position:absolute;left:30px;top:24px;width:46px;height:30px}
#spine .vt{position:absolute;left:55px;top:84px;transform-origin:0 0;transform:rotate(90deg) translateY(-50%);white-space:nowrap;display:flex;align-items:center;gap:26px}
#spine .vsub{font:400 30px/1 Silk;letter-spacing:.12em;color:var(--sub)}
#spine .stripe{position:absolute;right:0;top:0;bottom:0;width:9px;
  background:repeating-linear-gradient(180deg,var(--s1) 0 46px,var(--s2) 46px 92px,var(--s3) 92px 138px)}
#spine .foot{position:absolute;left:0;right:9px;bottom:26px;text-align:center;font:400 17px/1.3 Silk;color:#e9ece8;letter-spacing:.08em}
</style></head>
<body>
<div id="root"></div>
<script src="covers.js"></script>
<script>
var q=new URLSearchParams(location.search), id=q.get('id'), mode=q.get('mode')||'front';
var c=COVERS[id]; if(q.get('shot')) c.shot=q.get('shot'); var r=document.documentElement.style;
Object.keys(c.vars||{}).forEach(function(k){r.setProperty('--'+k,c.vars[k])});
function bridge(col){return '<svg viewBox="0 0 46 30"><path d="M3 24 Q23 2 43 24 Z" fill="none" stroke="'+col+'" stroke-width="3.4" stroke-linejoin="round"/><path d="M13 14.5V24 M23 10V24 M33 14.5V24" stroke="'+col+'" stroke-width="3"/><path d="M1 25.5H45" stroke="'+col+'" stroke-width="3.4" stroke-linecap="round"/></svg>'}
var acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
var burst='<svg viewBox="-20 -20 250 250"><polygon points="'+(function(){var p=[],n=14;for(var i=0;i<n*2;i++){var a=Math.PI*i/n-Math.PI/2,rr=i%2?72:118;p.push((105+rr*Math.cos(a)).toFixed(1)+','+(105+rr*Math.sin(a)).toFixed(1))}return p.join(' ')})()+'" fill="var(--burst)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/></svg>';
var root=document.getElementById('root');
if(mode==='front'){
  root.innerHTML='<div id="front">'+
   '<div class="hdr">'+bridge(acc)+'<b>BASE 5 GAMES</b><span class="chip">'+c.chip+'</span></div>'+
   '<div class="rule" style="top:74px"></div>'+
   '<div class="title">'+c.title+'</div>'+
   '<div class="sub" style="'+(c.subStyle||'')+'">'+c.sub+'</div>'+
   '<div class="shot"><img src="../shots/'+(c.shot||id)+'.png?'+Date.now()+'" style="'+(c.shotStyle||'')+'"></div>'+
   '<div class="ribbon" style="'+(c.ribbonStyle||'')+'">'+c.ribbon+'</div>'+
   '<div class="burst">'+burst+'<div class="n"><i>'+c.burst[0]+'</i><u>'+c.burst[1]+'</u></div></div>'+
   '<div class="rule" style="top:842px"></div>'+
   '<div class="tag" style="'+(c.tagStyle||'')+'">'+c.tag+'</div>'+
   '<div class="small">'+c.small+'</div>'+
   '<div class="players">'+c.players+'</div>'+
  '</div>';
} else {
  root.innerHTML='<div id="spine">'+bridge(acc).replace('<svg','<svg class="logo"')+
   '<div class="vt">'+c.spine+'<span class="vsub">'+c.sub.replace(/<[^>]+>/g,'')+'</span></div>'+
   '<div class="stripe"></div></div>';
}
document.fonts.ready.then(function(){
  // shrink title / subtitle / tag to fit their boxes
  [['.title',690],['.sub',700],['.tag',530],['.ribbon',520]].forEach(function(p){
    var el=document.querySelector(p[0]); if(!el) return;
    var inner=el.firstElementChild&&p[0]==='.title'?el.firstElementChild:el;
    var w=inner.scrollWidth, s=1; if(w>p[1]) s=p[1]/w;
    if(s<1){ if(p[0]==='.ribbon'){el.style.transform='rotate(-3deg) scale('+s+')';el.style.transformOrigin='0 50%'} else {inner.style.transform+=' scale('+s+')'; inner.style.transformOrigin= p[0]==='.tag'?'0 0':'50% 50%'} }
  });
  var vt=document.querySelector('.vt'); if(vt){var h=vt.scrollWidth; if(h>930){vt.style.transform='rotate(90deg) translateY(-50%) scale('+(930/h)+')'}}
  document.body.setAttribute('data-ready','1');
});
</script>
</body></html>
