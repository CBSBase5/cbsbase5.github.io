<!DOCTYPE html>
<!-- LC's folder: Absurd City. A one-off page (not built by build_lc.py), linked
     from /data/folders/lc.js. Photos and video live in /lc/media/ with their
     location data stripped. ASCII only. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absurd City - LC Night Shift HQ</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/lc/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="/lc/conf.js?v=2"></script>
<link rel="stylesheet" href="/egw/egw.css?v=9">
<link rel="stylesheet" href="/lc/lc.css?v=4">
<script src="/egw/skin.js?v=6"></script>
<script src="/data/b5site.js?v=8"></script>
<style>
.ac{max-width:900px;margin:0 auto;padding:22px 0 40px}
.ac h1{font-family:var(--lcmono,monospace);color:var(--moon);font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;margin:0 0 6px;letter-spacing:.02em}
.ac .sub{color:var(--mist);margin:0 0 20px;font-size:1.1rem}
.ac .vid{display:block;width:100%;max-width:420px;margin:0 auto 22px;border-radius:14px;border:3px solid var(--sun);background:#000;aspect-ratio:478/850}
.ac .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.ac .pics{grid-template-columns:1fr}}
.ac .pics button{all:unset;cursor:zoom-in;display:block;border-radius:12px;overflow:hidden;border:3px solid var(--night-3,#323428);transition:transform .2s,border-color .2s}
.ac .pics button:hover,.ac .pics button:focus-visible{transform:translateY(-4px) rotate(-1deg);border-color:var(--sun)}
.ac .pics img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.lb{position:fixed;inset:0;background:rgba(10,10,8,.94);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;box-sizing:border-box}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.lb button{position:absolute;top:12px;right:12px;font:inherit;font-weight:700;font-size:1.4rem;width:48px;height:48px;border-radius:50%;border:2px solid var(--moon);background:var(--night,#1b1c16);color:var(--moon);cursor:pointer}
.lb .nx,.lb .pv{top:50%;transform:translateY(-50%)}
.lb .pv{left:12px;right:auto}
</style>
</head>
<body class="subj-home">
<div class="grain"></div>

<header class="hq">
  <div class="hqwrap">
    <a class="hqmark" href="/lc/"><span class="hqlogo">LC</span><span class="hqname">Night Shift HQ<small>English and Maths</small></span></a>
    <nav class="hqnav"><a href="/lc/folder.html">Your folder</a><a href="/lc/">HQ home</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="ac">
    <h1>Absurd City</h1>
    <p class="sub">Thought of you.</p>
    <video class="vid" src="/lc/media/strange-video.mp4" poster="/lc/media/strange-video-poster.jpg" controls playsinline preload="metadata"></video>
    <div class="pics">
      <button type="button" data-i="0" aria-label="Photo 1, bigger"><img src="/lc/media/strange-1.jpg" alt="A street of tilted neon shop signs under a dark ceiling" loading="lazy"></button>
      <button type="button" data-i="1" aria-label="Photo 2, bigger"><img src="/lc/media/strange-2.jpg" alt="A cow farmer figure in a glass case with a bucket of pills" loading="lazy"></button>
      <button type="button" data-i="2" aria-label="Photo 3, bigger"><img src="/lc/media/strange-3.jpg" alt="A horned creature in a pink cloak in a glowing window" loading="lazy"></button>
    </div>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-label="Photo">
  <img id="lbImg" alt="">
  <button type="button" class="pv" aria-label="Previous">&lsaquo;</button>
  <button type="button" class="nx" aria-label="Next">&rsaquo;</button>
  <button type="button" class="x" aria-label="Close">&times;</button>
</div>

<footer>
  <div class="wrap">
    <span>LC's Night Shift HQ &middot; part of Base 5, Chilton Bridge School</span>
    <a href="/lc/folder.html">Back to your folder</a>
  </div>
</footer>

<script>
(function(){
  var imgs = [].slice.call(document.querySelectorAll(".pics img")), lb = document.getElementById("lb"), big = document.getElementById("lbImg"), at = 0;
  function show(i){ at = (i + imgs.length) % imgs.length; big.src = imgs[at].src; big.alt = imgs[at].alt; lb.classList.add("on"); }
  function hide(){ lb.classList.remove("on"); }
  document.querySelectorAll(".pics button").forEach(function(b){ b.addEventListener("click", function(){ show(+b.getAttribute("data-i")); }); });
  lb.querySelector(".x").addEventListener("click", hide);
  lb.querySelector(".nx").addEventListener("click", function(e){ e.stopPropagation(); show(at + 1); });
  lb.querySelector(".pv").addEventListener("click", function(e){ e.stopPropagation(); show(at - 1); });
  lb.addEventListener("click", function(e){ if(e.target === lb) hide(); });
  document.addEventListener("keydown", function(e){
    if(!lb.classList.contains("on")) return;
    if(e.key === "Escape") hide(); else if(e.key === "ArrowRight") show(at + 1); else if(e.key === "ArrowLeft") show(at - 1);
  });
})();
</script>
</body>
</html>
