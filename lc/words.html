.ppcard span{display:block;font-size:.95rem;line-height:1.25;font-weight:700;margin-top:4px;min-height:2.5em;pointer-events:none}
.ppcard:focus-visible{outline:3px solid #22b8e6;outline-offset:2px}
.ppcard.sel{border-color:#22b8e6;box-shadow:0 0 0 3px rgba(34,184,230,.45)}
.ppcard.lift{z-index:5;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.5);opacity:.95}
.ppcard.ok{border-color:#19c39a}
.ppcard.no{border-color:#ff5d5d}
.ppcard.showd{border-color:#e6d84a}
.pptip{font-size:.85rem;color:#c9c6a8;margin:8px 2px 0;text-align:center}
.ppend{text-align:center}
.ppend .big{font-family:var(--display);font-weight:700;font-size:1.6rem;color:#e6d84a;margin:4px 0}

@media (prefers-reduced-motion:no-preference){.ppcard{transition:border-color .2s}}

var CHERRY = '<path d="M60 24 Q62 12 72 8" fill="none" stroke="#19c39a" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="27" r="8" fill="#ff5d5d" ' + K + '/>';
var BOTTLE = '<g transform="rotate(-140 96 20)"><rect x="88" y="6" width="16" height="28" rx="4" fill="#6b3a1e" ' + K + '/><rect x="92" y="0" width="8" height="8" fill="#141a33"/></g>';

var DOOR_SHUT = '<rect x="40" y="8" width="44" height="76" fill="#8a5cf6" ' + K + '/><circle cx="76" cy="48" r="3" fill="#ffd23f"/>';
var PERSON = function(x){ return '<g ' + K + ' fill="none"><circle cx="' + x + '" cy="26" r="7" fill="#fbf8e4"/><path d="M' + x + ' 33 L' + x + ' 58 M' + x + ' 58 L' + (x - 8) + ' 78 M' + x + ' 58 L' + (x + 8) + ' 78 M' + x + ' 42 L' + (x - 10) + ' 52 M' + x + ' 42 L' + (x + 10) + ' 50"/></g>'; };

var POT = '<path d="M36 52 L84 52 L78 86 L42 86 Z" fill="#d9774a" ' + K + '/><rect x="32" y="46" width="56" height="10" rx="2" fill="#d9774a" ' + K + '/>';
var SOIL = '<rect x="36" y="42" width="48" height="6" rx="3" fill="#6b3a1e"/>';
var SOIL_FULL = '<path d="M36 46 Q60 34 84 46 Z" fill="#6b3a1e" stroke="#141a33" stroke-width="2"/>';

var PLANS = [
  { name: "Make an ice cream sundae", steps: [
    { t: "Get a bowl", p: pic("An empty bowl", BOWL) },

    { t: "Put a cherry on top", p: pic("A cherry on top of the sauce", SCOOPS + SAUCE + BOWL + CHERRY) }
  ] },
  { name: "Lock up at night", steps: [
    { t: "Switch off the lights", p: pic("A hand switching off a light. The bulb is dark.",
        '<path d="M34 10 Q16 10 16 30 Q16 42 26 48 L26 56 L42 56 L42 48 Q52 42 52 30 Q52 10 34 10 Z" fill="#4b5275" ' + K + '/><rect x="26" y="58" width="16" height="8" fill="#d9d8e6" ' + K + '/>' +
        '<rect x="74" y="26" width="28" height="40" rx="4" fill="#fbf8e4" ' + K + '/><rect x="82" y="46" width="12" height="14" rx="2" fill="#141a33"/><text x="88" y="84" text-anchor="middle" font-size="14" font-weight="700" font-family="Space Grotesk,Arial" fill="#141a33">OFF</text>') },
    { t: "Go out of the door", p: pic("A person walking out of an open door",
        '<rect x="16" y="8" width="44" height="76" fill="#141a33" ' + K + '/><path d="M16 8 L34 16 L34 92 L16 84 Z" fill="#8a5cf6" ' + K + '/>' + PERSON(82) + '<path d="M96 50 L108 50 M102 44 L108 50 L102 56" fill="none" ' + K + '/>') },
    { t: "Lock the door", p: pic("A key turning in the lock of a shut door",
        DOOR_SHUT + '<g transform="translate(72 44)"><circle cx="14" cy="4" r="8" fill="#ffd23f" ' + K + '/><path d="M6 4 L-6 4" ' + K + '/></g><path d="M92 26 Q104 32 100 44" fill="none" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round"/><path d="M96 42 L100 46 L104 40" fill="none" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>') },
    { t: "Push the door to check it is locked", p: pic("A hand pushing the shut door, and a green tick",
        DOOR_SHUT + '<path d="M104 50 L88 50" ' + K + ' fill="none"/><rect x="96" y="40" width="18" height="20" rx="6" fill="#f3c9a4" ' + K + '/><path d="M14 30 L22 38 L34 20" fill="none" stroke="#19c39a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>') }
  ] },
  { name: "Plant a seed", steps: [
    { t: "Fill a pot with soil", p: pic("Soil pouring from a bag into an empty pot",
        POT + '<g transform="rotate(30 76 18)"><rect x="62" y="2" width="30" height="26" rx="3" fill="#19c39a" ' + K + '/></g><g fill="#6b3a1e"><circle cx="60" cy="34" r="3"/><circle cx="54" cy="40" r="3"/><circle cx="62" cy="44" r="3"/></g>') },
    { t: "Make a small hole", p: pic("A finger making a hole in the soil",
        POT + SOIL_FULL + '<ellipse cx="60" cy="41" rx="5" ry="2.5" fill="#141a33"/><rect x="55" y="6" width="10" height="30" rx="5" fill="#f3c9a4" ' + K + '/>') },
    { t: "Drop in the seed", p: pic("A seed dropping into the hole",
        POT + SOIL_FULL + '<ellipse cx="60" cy="41" rx="5" ry="2.5" fill="#141a33"/><ellipse cx="60" cy="22" rx="4" ry="6" fill="#ffd23f" ' + K + '/><path d="M52 12 L52 4 M68 12 L68 4" stroke="#4b5275" stroke-width="2" stroke-linecap="round"/>') },
    { t: "Cover it with soil", p: pic("Fingers sprinkling soil over the hole",
        POT + SOIL_FULL + '<path d="M44 14 Q60 4 76 14 L72 22 L48 22 Z" fill="#f3c9a4" ' + K + '/><g fill="#6b3a1e"><circle cx="54" cy="30" r="2.5"/><circle cx="62" cy="34" r="2.5"/><circle cx="68" cy="28" r="2.5"/></g>') },
    { t: "Water it", p: pic("A watering can pouring water on the pot",
        POT + SOIL_FULL + '<path d="M70 8 L100 8 L96 30 L74 30 Z" fill="#22b8e6" ' + K + '/><path d="M74 14 L52 26" ' + K + ' fill="none"/><g fill="#22b8e6"><circle cx="50" cy="34" r="2.5"/><circle cx="44" cy="30" r="2.5"/><circle cx="54" cy="38" r="2"/></g>') }
  ] }
];

function shuffled(n){
  var a, tries = 0;
  do{
    a = [];
    for(var i = 0; i < n; i++) a.push(i);
    for(var j = n - 1; j > 0; j--){ var r = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[r]; a[r] = t; }
    var fixed = a.filter(function(v, k){ return v === k; }).length;
    tries++;
  }while(fixed > 1 && tries < 50);
  return a;
}

function picturePlan(el, api){
  var d = api.data;
  if(d.p === undefined) d.p = 0;
  if(!d.res) d.res = [];
  if(!d.ord) d.ord = [];
  if(d.t === undefined) d.t = 0;
  if(d.miss === undefined) d.miss = 0;
  var msg = "", sel = -1, marks = null, drag = null;

  function result(){ return d.shown ? "shown" : d.miss <= 1 ? "right1" : "right2"; }
  function firstGo(){ return d.res.filter(function(x){ return x === "1"; }).length; }
  function solved(){ return d.res.length > d.p; }
  function ord(){
    if(!d.ord[d.p]){ d.ord[d.p] = shuffled(PLANS[d.p].steps.length); api.save(); }
    return d.ord[d.p];
  }

  function draw(){
    var done = d.p >= PLANS.length;
    if(done){ drawEnd(); return; }
    var P = PLANS[d.p], o = ord();
    var row = "";
    if(solved()) row = '<button class="btn" type="button" id="ppNext">' + (d.p === PLANS.length - 1 ? "See how you did" : "Next plan") + '</button>';
    else{
      row = '<button class="btn" type="button" id="ppCheck">Check my order</button>';
      if(d.t >= 2) row += '<button class="btn btn-quiet" type="button" id="ppShow">Show me</button>';
    }
    if(!msg){
      if(solved()) msg = d.res[d.p] === "s" ? "<b>Here is the order.</b> Each picture leads to the next one." : "<b>Spot on.</b> Each picture leads to the next one.";
      else if(d.p === 0 && d.t === 0) msg = "Put the pictures in order, 1 to " + P.steps.length + ". Drag a picture onto another to swap them. Or tap one, then tap another.";
      else msg = "Put the pictures in order. Drag or tap to swap.";
    }
    var cards = "";
    o.forEach(function(k, pos){
      var S = P.steps[k], cls = "ppcard";
      if(solved()) cls += d.res[d.p] === "s" ? " showd" : " ok";
      else if(marks) cls += marks[pos] ? " ok" : " no";
      if(sel === pos) cls += " sel";
      cards += '<li class="ppslot"><span class="num">' + (pos + 1) + '</span>' +
        '<button type="button" class="' + cls + '" data-pos="' + pos + '" aria-label="Step ' + (pos + 1) + ': ' + S.t + '">' + S.p + '<span>' + S.t + '</span></button></li>';
    });
    el.innerHTML = '<div class="pp"><div class="ppbar"><span>Plan ' + (d.p + 1) + ' of ' + PLANS.length + '</span><span>First go: ' + firstGo() + '</span></div>' +
      '<div class="pptop"><small>Picture plan</small><p class="ppname">' + P.name + '</p>' +
      '<div class="ppmsg" aria-live="polite">' + msg + '</div></div>' +
      '<ol class="ppgrid">' + cards + '</ol>' +
      '<div class="pprow">' + row + '</div>' +
      (solved() ? '' : '<p class="pptip">Keyboard: pick a picture, then use the arrow keys to move it.</p>') + '</div>';
    var ck = el.querySelector("#ppCheck"); if(ck) ck.onclick = check;
    var sh = el.querySelector("#ppShow"); if(sh) sh.onclick = showMe;
    var nx = el.querySelector("#ppNext");
    if(nx) nx.onclick = function(){ d.p++; d.t = 0; msg = ""; marks = null; sel = -1; api.save(); draw(); if(d.p >= PLANS.length) finish(); };
    if(!solved()){
      [].forEach.call(el.querySelectorAll(".ppcard"), function(b){
        b.addEventListener("pointerdown", down);
        b.addEventListener("keydown", key);
        b.addEventListener("click", function(e){ e.preventDefault(); });
      });
    }
  }

  function swap(a, b){
    if(a === b) return;
    var o = ord(), t = o[a]; o[a] = o[b]; o[b] = t;
    marks = null; msg = "Put the pictures in order. Drag or tap to swap.";
    api.save();
  }

  function down(e){
    if(e.button !== undefined && e.button !== 0) return;
    var b = e.currentTarget, pos = +b.getAttribute("data-pos");
    drag = { b: b, pos: pos, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
    try{ b.setPointerCapture(e.pointerId); }catch(err){}
    b.addEventListener("pointermove", move);
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", cancel);
  }
  function move(e){
    if(!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    drag.moved = true;
    drag.b.classList.add("lift");
    drag.b.style.transform = "translate(" + dx + "px," + dy + "px)";
  }
  function cancel(){
    if(!drag) return;
    drag.b.style.transform = ""; drag.b.classList.remove("lift");
    drag = null;
  }
  function up(e){
    if(!drag) return;
    var g = drag; drag = null;
    g.b.style.transform = ""; g.b.classList.remove("lift");
    if(g.moved){
      var target = -1;
      [].forEach.call(el.querySelectorAll(".ppcard"), function(c){
        if(c === g.b) return;
        var r = c.getBoundingClientRect();
        if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) target = +c.getAttribute("data-pos");
      });
      sel = -1;
      if(target >= 0) swap(g.pos, target);
      draw();
      return;
    }
    /* a tap: pick one, then tap another to swap */
    if(sel < 0){ sel = g.pos; msg = "Now tap the picture to swap it with."; }
    else if(sel === g.pos){ sel = -1; msg = "Put the pictures in order. Drag or tap to swap."; }
    else { swap(sel, g.pos); sel = -1; }
    draw();
    var again = el.querySelector('.ppcard[data-pos="' + g.pos + '"]');
    if(again){ try{ again.focus({ preventScroll: true }); }catch(err){} }
  }
  function key(e){
    var pos = +e.currentTarget.getAttribute("data-pos"), n = ord().length, to = -1;
    if(e.key === "ArrowLeft" || e.key === "ArrowUp") to = pos - 1;
    else if(e.key === "ArrowRight" || e.key === "ArrowDown") to = pos + 1;
    else if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      if(sel < 0){ sel = pos; msg = "Now pick the picture to swap it with."; }
      else if(sel === pos) sel = -1;
      else { swap(sel, pos); sel = -1; }
      draw();
      var b0 = el.querySelector('.ppcard[data-pos="' + pos + '"]'); if(b0) b0.focus();
      return;
    }
    else return;
    e.preventDefault();
    if(to < 0 || to >= n) return;
    sel = -1;
    swap(pos, to); draw();
    var b = el.querySelector('.ppcard[data-pos="' + to + '"]'); if(b) b.focus();
  }

  function check(){
    var o = ord();
    marks = o.map(function(k, pos){ return k === pos; });
    var right = marks.filter(function(x){ return x; }).length;
    sel = -1;
    if(right === o.length){
      d.res.push(d.t ? "2" : "1");
      msg = "<b>" + (d.t ? "Got it." : "Spot on, first go!") + "</b> Each picture leads to the next one.";
      marks = null;
      api.save(); draw();
      return;
    }
    d.t++; d.miss++;
    var how = right === 0 ? "None are in the right place yet." : right === 1 ? "1 is in the right place. It is green." : right + " are in the right place. They are green.";
    msg = d.t === 1 ? "<b>Not yet.</b> " + how + " Ask: what has to happen first?" :
      "<b>Still not quite.</b> Look at what changes from one picture to the next. Or tap Show me.";
    api.save(); draw();
  }
  function showMe(){
    var o = ord();
    for(var k = 0; k < o.length; k++) o[k] = k;
    d.res.push("s"); d.shown = true; marks = null; sel = -1;
    msg = "";
    api.save(); draw();
  }
  function drawEnd(){
    var dots = d.res.map(function(x){
      var col = x === "1" ? "#19c39a" : x === "2" ? "#22b8e6" : "#ffd23f";
      return '<i style="background:' + col + '">' + (x === "s" ? "S" : x) + '</i>';
    }).join("");
    el.innerHTML = '<div class="pp"><div class="pptop ppend"><small>All done</small><div class="big">3 plans sorted</div>' +
      '<p class="ppmsg">' + firstGo() + ' of 3 right first go' + (d.shown ? ', with a bit of help from Show me' : '') + '. You read the pictures like a set of steps.</p>' +
      '<div class="ppdots" aria-label="How each plan went">' + dots + '</div>' +
      '<div class="pprow" style="justify-content:center"><button class="btn btn-quiet" type="button" id="ppAgain">Play again</button></div></div></div>';
    el.querySelector("#ppAgain").onclick = function(){
      d.p = 0; d.res = []; d.ord = []; d.t = 0; d.miss = 0; d.shown = false; d.finished = false; msg = ""; marks = null; api.save(); draw();
    };
  }
  function finish(){ d.finished = true; api.save(); api.done(result()); }

  draw();
  if(d.finished) api.done(result());
}
