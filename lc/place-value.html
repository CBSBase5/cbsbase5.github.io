<style>
/* page only styles here */
.gap{position:relative;border:2px dashed var(--ink);border-radius:6px;padding:0 .4em;margin:0 3px;color:transparent}
.gap::after{content:"?";color:var(--ink);position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.sumbig{display:block;font-family:var(--display);font-weight:700;font-size:1.45rem;margin:8px 0 4px}
.pvchart{border-collapse:collapse;margin:6px auto;font-size:1rem}
.pvchart th,.pvchart td{border:2px solid var(--ink);padding:6px 10px;text-align:center}
.pvchart th{background:var(--accent-soft);font-size:.9rem}
.pvchart td{font-family:var(--display);font-weight:700;font-size:1.5rem}
/* Lift code widget */
.pv-task p{margin:0 0 6px}
.pv-dots{display:flex;gap:6px;margin-bottom:6px}
.pv-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.pv-dots span.on{background:var(--good)}
.pv-dots span.now{background:var(--sun)}
.pv-stage{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px;margin:8px 0}
.pv-stage svg{display:block;width:100%;max-width:460px;margin:0 auto;height:auto}
.pv-ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.pv-col{text-align:center;background:#fff;border:2px solid var(--ink);border-top-width:7px;border-radius:12px;padding:6px 2px 8px}
.pv-col.h{border-top-color:#3a5cff}.pv-col.t{border-top-color:#19c39a}.pv-col.o{border-top-color:#ff5d5d}
.pv-name{display:block;font-weight:700;font-size:.88rem;margin-bottom:4px}
.pv-step{display:flex;align-items:center;justify-content:center;gap:2px}
.pv-b{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-size:1.3rem;font-weight:800;line-height:1;cursor:pointer;touch-action:manipulation;padding:0}
.pv-b:disabled{opacity:.35;cursor:default}
.pv-dig{font-family:var(--display);font-size:1.6rem;min-width:1em;display:inline-block}
.pv-read{min-height:2.6em;font-size:1rem}
.pv-num{font-family:var(--display);font-weight:700;font-size:1.3rem}
.pv-fb .btn{margin-top:10px}
</style>

<script>
(function(){
"use strict";

var INK = "#141a33", BLUE = "#3a5cff", CORAL = "#ff5d5d", SUN = "#ffd23f",
    MINT = "#19c39a", VIOLET = "#8a5cf6", PAPER = "#f2f1ec", WHITE = "#ffffff", LINE = "#d9d8e6";
var LAB = 'font-family="Space Grotesk,Arial"', BODY = 'font-family="Atkinson Hyperlegible,Verdana"';

function t(x, y, s, size, fill, extra){
  return '<text x="' + x + '" y="' + y + '" ' + (extra || "") + ' font-size="' + size + '" fill="' + (fill || INK) + '">' + s + '</text>';
}
function ln(x1, y1, x2, y2, col, w, extra){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
}
function gap(){ return '<span class="gap">what</span>'; }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

/* ---------- base ten blocks: a hundred is a 10 by 10 square ---------- */
var C = 9, F = 90;
function flat(x, y){
  var s = '<rect x="' + x + '" y="' + y + '" width="' + F + '" height="' + F + '" fill="#d6ddff"/>';
  for(var k = 1; k < 10; k++){
    s += ln(x + k * C, y, x + k * C, y + F, BLUE, 0.8, ' opacity=".75"');
    s += ln(x, y + k * C, x + F, y + k * C, BLUE, 0.8, ' opacity=".75"');
  }
  return s + '<rect x="' + x + '" y="' + y + '" width="' + F + '" height="' + F + '" fill="none" stroke="' + INK + '" stroke-width="2"/>';
}
function stick(x, y){
  var s = '<rect x="' + x + '" y="' + y + '" width="' + C + '" height="' + F + '" fill="#c4f0e2"/>';
  for(var k = 1; k < 10; k++) s += ln(x, y + k * C, x + C, y + k * C, "#0e8a6a", 0.9);
  return s + '<rect x="' + x + '" y="' + y + '" width="' + C + '" height="' + F + '" fill="none" stroke="' + INK + '" stroke-width="1.6"/>';
}
function cube(x, y){
  return '<rect x="' + x + '" y="' + y + '" width="' + C + '" height="' + C + '" fill="#ffc4c4" stroke="' + INK + '" stroke-width="1.6"/>';
}
/* a row of blocks: hundreds, then tens, then ones (in columns of 5) */
function blocks(h, tn, o, opt){
  opt = opt || {};
  var lab = !!opt.labels, top = 10, x = 10, s = "", labs = [], k, gw;
  var minW = lab ? 64 : 12, gapW = lab ? 22 : 26;
  gw = Math.max(h * (F + 8) - 8, minW);
  for(k = 0; k < h; k++) s += flat(x + k * (F + 8), top);
  labs.push([x + gw / 2, plural(h, "hundred", "hundreds")]); x += gw + gapW;
  gw = Math.max(tn * (C + 6) - 6, minW);
  for(k = 0; k < tn; k++) s += stick(x + k * (C + 6), top);
  labs.push([x + gw / 2, plural(tn, "ten", "tens")]); x += gw + gapW;
  var cols = Math.ceil(o / 5);
  gw = Math.max(cols * (C + 6) - 6, minW);
  var cx0 = x + (gw - (cols * (C + 6) - 6)) / 2;
  for(k = 0; k < o; k++) s += cube(cx0 + Math.floor(k / 5) * (C + 6), top + F - C - (k % 5) * (C + 6));
  labs.push([x + gw / 2, plural(o, "one", "ones")]); x += gw;
  var W = Math.max(x + 10, 300), H = top + F + 10;
  if(lab){
    labs.forEach(function(l){ s += t(l[0].toFixed(1), H + 14, l[1], 16, INK, LAB + ' font-weight="700" text-anchor="middle"'); });
    H += 26;
  }
  if(opt.total){ s += t(W / 2, H + 26, opt.total, 26, INK, LAB + ' font-weight="800" text-anchor="middle"'); H += 36; }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + opt.label + '">' + s + '</svg>';
}

var B243 = blocks(2, 4, 3, { labels: true, total: "243", label: "Base ten blocks: 2 hundred squares, 4 ten sticks and 3 one cubes. Together they make 243." });
var B315 = blocks(3, 1, 5, { label: "Base ten blocks: 3 hundred squares, 1 ten stick and 5 one cubes." });
var B205 = blocks(2, 0, 5, { label: "Base ten blocks: 2 hundred squares, no ten sticks and 5 one cubes." });

/* ---------- part whole model ---------- */
function pw(whole, parts, label){
  var W = 400, H = 196, wy = 52, py = 150, s = "";
  var n = parts.length, sp = n === 2 ? 180 : 120, x0 = 200 - sp * (n - 1) / 2;
  parts.forEach(function(p, k){ s += ln(200, wy, x0 + k * sp, py, INK, 3); });
  function circ(x, y, r, v, fill){
    var q = v === "?";
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="3"/>' +
      t(x, y + 8, String(v), 23, q ? CORAL : INK, LAB + ' font-weight="800" text-anchor="middle"');
  }
  s += circ(200, wy, 42, whole, "#fff3c2");
  parts.forEach(function(p, k){ s += circ(x0 + k * sp, py, 38, p, WHITE); });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + label + '">' + s + '</svg>';
}
var PW346 = pw(346, [300, 40, 6], "A part whole model. The whole is 346. The parts are 300, 40 and 6.");
var PW527 = pw(527, [500, "?", 7], "A part whole model. The whole is 527. The parts are 500, a missing part, and 7.");
var PW481 = pw("?", [400, 80, 1], "A part whole model. The whole is missing. The parts are 400, 80 and 1.");
var PW75 = pw(75, [40, "?"], "A part whole model. The whole is 75. One part is 40. The other part is missing.");

/* ---------- digit cards ---------- */
function cards(ds, label, extra){
  var w = 62, g = 14, n = ds.length, x0 = 200 - (n * w + (n - 1) * g) / 2, s = "";
  ds.forEach(function(d, k){
    var x = x0 + k * (w + g);
    s += '<rect x="' + x + '" y="10" width="' + w + '" height="78" rx="9" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>';
    s += t(x + w / 2, 64, d, 40, INK, LAB + ' font-weight="800" text-anchor="middle"');
  });
  var H = 100;
  (extra || []).forEach(function(e){ H += 30; s += t(200, H - 6, e[0], 20, e[1], LAB + ' font-weight="800" text-anchor="middle"'); });
  return '<svg viewBox="0 0 400 ' + (H + 4) + '" role="img" aria-label="' + label + '">' + s + '</svg>';
}
var CARDS472 = cards(["4", "7", "2"], "Three digit cards: 4, 7 and 2. The biggest number is 742. The smallest is 247.",
  [["Biggest: 742", BLUE], ["Smallest: 247", CORAL]]);
var CARDS518 = cards(["5", "1", "8"], "Three digit cards: 5, 1 and 8.");
var CARDS369 = cards(["3", "6", "9"], "Three digit cards: 3, 6 and 9.");

/* ---------- counters on a place value chart ---------- */
function counters(h, tn, o, label){
  var s = "", names = ["Hundreds", "Tens", "Ones"], cols = [BLUE, MINT, CORAL], v = [h, tn, o];
  for(var c = 0; c < 3; c++){
    var x = 10 + c * 127;
    s += '<rect x="' + x + '" y="8" width="127" height="118" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += '<rect x="' + x + '" y="8" width="127" height="34" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.5"/>';
    s += t(x + 63.5, 32, names[c], 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
    for(var k = 0; k < v[c]; k++){
      var cx = x + 33 + (k % 3) * 30, cy = 66 + Math.floor(k / 3) * 30;
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="' + cols[c] + '" stroke="' + INK + '" stroke-width="2"/>';
    }
  }
  return '<svg viewBox="0 0 400 134" role="img" aria-label="' + label + '">' + s + '</svg>';
}
var CNT304 = counters(3, 0, 4, "A place value chart. 3 counters in the hundreds. No counters in the tens. 4 counters in the ones.");

/* ---------- comparing ---------- */
var CMP = '<svg viewBox="0 0 400 150" role="img" aria-label="548 is greater than 524. 524 is less than 548.">' +
  t(200, 42, "548 &gt; 524", 34, INK, LAB + ' font-weight="800" text-anchor="middle"') +
  t(200, 68, "548 is greater than 524", 17, BLUE, BODY + ' font-weight="700" text-anchor="middle"') +
  t(200, 114, "524 &lt; 548", 34, INK, LAB + ' font-weight="800" text-anchor="middle"') +
  t(200, 140, "524 is less than 548", 17, CORAL, BODY + ' font-weight="700" text-anchor="middle"') +
  '</svg>';

/* ---------- number lines ---------- */
function nline(a, b, n, opt){
  opt = opt || {};
  var x0 = 34, x1 = 366, y = 84, s = "";
  function X(v){ return x0 + (v - a) / (b - a) * (x1 - x0); }
  s += ln(x0 - 14, y, x1 + 14, y, INK, 3);
  for(var k = 0; k <= n; k++){
    var v = a + (b - a) * k / n, xx = X(v).toFixed(1), end = k === 0 || k === n;
    s += ln(xx, y - (end ? 13 : 9), xx, y + (end ? 13 : 9), INK, end ? 3 : 2);
    if(opt.all || end || (opt.show && opt.show.indexOf(v) >= 0)) s += t(xx, y + 34, String(v), 17, INK, LAB + ' font-weight="700" text-anchor="middle"');
  }
  if(opt.arrow !== undefined){
    var ax = X(opt.arrow);
    s += '<path d="M' + (ax - 9).toFixed(1) + ' ' + (y - 30) + ' L' + (ax + 9).toFixed(1) + ' ' + (y - 30) + ' L' + ax.toFixed(1) + ' ' + (y - 14) + ' Z" fill="' + CORAL + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t(ax.toFixed(1), y - 40, opt.atext || "?", 22, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
  }
  if(opt.round !== undefined){
    var rx = X(opt.round), tx = X(opt.to);
    s += '<circle cx="' + rx.toFixed(1) + '" cy="' + y + '" r="7" fill="' + CORAL + '" stroke="' + INK + '" stroke-width="2"/>';
    s += t(rx.toFixed(1), y + 36, String(opt.round), 20, CORAL, LAB + ' font-weight="800" text-anchor="middle"');
    var mx = (rx + tx) / 2;
    s += '<path d="M' + rx.toFixed(1) + ' ' + (y - 9) + ' Q' + mx.toFixed(1) + ' ' + (y - 60) + ' ' + tx.toFixed(1) + ' ' + (y - 16) + '" fill="none" stroke="' + BLUE + '" stroke-width="3"/>';
    s += '<path d="M' + (tx - 12).toFixed(1) + ' ' + (y - 24) + ' L' + tx.toFixed(1) + ' ' + (y - 16) + ' L' + (tx + 2).toFixed(1) + ' ' + (y - 30) + '" fill="none" stroke="' + BLUE + '" stroke-width="3"/>';
    s += t(mx.toFixed(1), y - 46, "nearer", 16, BLUE, BODY + ' font-weight="700" text-anchor="middle"');
  }
  return '<svg viewBox="0 0 400 ' + (opt.round !== undefined ? 150 : 130) + '" role="img" aria-label="' + opt.label + '">' + s + '</svg>';
}
var NL70 = nline(0, 100, 10, { all: true, arrow: 70, atext: "70", label: "A number line from 0 to 100 going up in tens. The arrow points to 70." });
var NL600 = nline(0, 1000, 10, { arrow: 600, label: "A number line from 0 to 1000 with 10 equal steps. Only 0 and 1000 are labelled. The arrow is 6 steps along." });
var NL260 = nline(200, 300, 10, { arrow: 260, label: "A number line from 200 to 300 with 10 equal steps. The arrow is 6 steps along." });
var NL350 = nline(300, 400, 2, { arrow: 350, label: "A number line from 300 to 400. The arrow is exactly halfway." });
var NL35 = nline(0, 50, 10, { arrow: 35, label: "A number line from 0 to 50 with 10 equal steps. The arrow is 7 steps along." });
var NL67 = nline(60, 70, 10, { show: [65], round: 67, to: 70, label: "A number line from 60 to 70. 67 is marked. An arrow shows 67 is nearer to 70." });

/* ---------- Lift code widget ---------- */
var ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve",
  "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
var TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
function words(n){
  if(n < 20) return ONES[n];
  if(n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "");
  var r = n % 100;
  return ONES[Math.floor(n / 100)] + " hundred" + (r ? " and " + words(r) : "");
}
var LIFT = [
  { n: 243, task: "The lift code is <b>243</b>. Build it with the blocks.",
    why: "243 is 2 hundreds, 4 tens and 3 ones." },
  { n: 406, task: "The next code is <b>four hundred and six</b>. Build it.",
    why: "Four hundred and six is 4 hundreds, 0 tens and 6 ones. We write 406. The 0 keeps the tens place empty." },
  { n: 318, task: "The last code is <b>1 ten, 8 ones and 3 hundreds</b>. They are mixed up, so take care.",
    why: "3 hundreds, 1 ten and 8 ones make 318. Hundreds always go first." }
];
function liftStage(v){
  var H = Math.max(34 + Math.max(1, Math.ceil(v[0] / 3)) * 96, 236) + 4;
  var s = '<svg viewBox="0 0 400 ' + H + '" role="img" aria-label="Your blocks: ' + plural(v[0], "hundred", "hundreds") + ", " + plural(v[1], "ten", "tens") + " and " + plural(v[2], "one", "ones") + '.">';
  s += t(8, 22, "Hundreds", 16, BLUE, LAB + ' font-weight="800"');
  s += t(300, 22, "Tens", 16, "#0e8a6a", LAB + ' font-weight="800"');
  s += t(300, 166, "Ones", 16, CORAL, LAB + ' font-weight="800"');
  for(var k = 0; k < v[0]; k++) s += flat(8 + (k % 3) * 96, 34 + Math.floor(k / 3) * 96);
  for(k = 0; k < v[1]; k++) s += stick(300 + k * 11, 34);
  for(k = 0; k < v[2]; k++) s += cube(304 + (k % 3) * 17, 182 + Math.floor(k / 3) * 17);
  if(!v[0]) s += t(98, 90, "none yet", 16, "#7a7f99", BODY + ' text-anchor="middle"');
  if(!v[1]) s += t(300, 84, "none yet", 16, "#7a7f99", BODY);
  if(!v[2]) s += t(300, 200, "none yet", 16, "#7a7f99", BODY);
  return s + '</svg>';
}
function mountLift(el, api){
  var d = api.data;
  if(typeof d.c !== "number") d.c = 0;
  if(!d.v) d.v = [0, 0, 0];
  if(!d.miss) d.miss = [0, 0, 0];
  if(!d.shown) d.shown = [false, false, false];
  var view = d.c;
  var cls = ["h", "t", "o"], names = ["Hundreds", "Tens", "Ones"], small = ["hundred", "ten", "one"];
  var ctrl = "";
  for(var k = 0; k < 3; k++){
    ctrl += '<div class="pv-col ' + cls[k] + '"><span class="pv-name">' + names[k] + '</span><div class="pv-step">' +
      '<button class="pv-b" type="button" data-k="' + k + '" data-d="-1" aria-label="One less ' + small[k] + '">&minus;</button>' +
      '<b class="pv-dig" data-r="d' + k + '">0</b>' +
      '<button class="pv-b" type="button" data-k="' + k + '" data-d="1" aria-label="One more ' + small[k] + '">+</button></div></div>';
  }
  el.innerHTML =
    '<div class="wpanel pv-task" data-r="task"></div>' +
    '<div class="pv-stage" data-r="stage"></div>' +
    '<div class="pv-ctrl">' + ctrl + '</div>' +
    '<div class="wpanel">' +
      '<p class="wnote pv-read" data-r="read" aria-live="polite"></p>' +
      '<div class="wrow">' +
        '<button class="btn" type="button" data-r="go">Try the code</button>' +
        '<button class="btn btn-quiet hidden" type="button" data-r="show">Show me</button>' +
      '</div>' +
    '</div>' +
    '<div class="fb pv-fb hidden" data-r="fb" aria-live="polite"></div>';
  function q(r){ return el.querySelector('[data-r="' + r + '"]'); }
  function val(){ return d.v[0] * 100 + d.v[1] * 10 + d.v[2]; }
  function digits(n){ return [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10]; }

  function task(){
    var dots = '<div class="pv-dots" aria-hidden="true">';
    for(var k = 0; k < 3; k++) dots += '<span class="' + (k < d.c ? "on" : (k === view && view < 3 ? "now" : "")) + '"></span>';
    dots += '</div>';
    if(view >= 3) return dots + "<p><b>Free play.</b> All three codes worked. The lift doors open, and out steps the night cleaner. Build any number you like and see it in words.</p>";
    return dots + '<p class="tiny" style="margin:0 0 4px">Code ' + (view + 1) + ' of 3. Nothing is timed.</p><p>' + LIFT[view].task + "</p>";
  }
  function reading(){
    var n = val();
    var s = "You have " + plural(d.v[0], "hundred", "hundreds") + ", " + plural(d.v[1], "ten", "tens") + " and " + plural(d.v[2], "one", "ones") + ". ";
    s += 'That makes <span class="pv-num">' + n + "</span>.";
    if(d.c >= 3) s += " In words: <b>" + words(n) + "</b>.";
    return s;
  }
  function draw(){
    q("task").innerHTML = task();
    q("stage").innerHTML = liftStage(d.v);
    q("read").innerHTML = reading();
    for(var k = 0; k < 3; k++){
      q("d" + k).textContent = d.v[k];
      el.querySelector('.pv-b[data-k="' + k + '"][data-d="-1"]').disabled = d.v[k] <= 0;
      el.querySelector('.pv-b[data-k="' + k + '"][data-d="1"]').disabled = d.v[k] >= 9;
    }
    var waiting = view !== d.c || d.c >= 3;
    q("go").classList.toggle("hidden", d.c >= 3);
    q("go").disabled = waiting;
    q("show").classList.toggle("hidden", waiting || !d.miss[view]);
  }
  function fb(c, html){ var f = q("fb"); f.className = "fb pv-fb " + c; f.innerHTML = html; }
  function result(){
    if(d.shown.some(Boolean)) return "shown";
    if(d.miss.some(function(n){ return n > 0; })) return "right2";
    return "right1";
  }
  function nudge(){
    var want = digits(LIFT[view].n), n = val();
    if(view === 1 && n === 460) return "You made 460. Four hundred and six has no tens. The six is ones.";
    if(view === 2 && n === 183) return "You made 183. That follows the words in order. Find the hundreds first.";
    var wrong = [];
    for(var k = 0; k < 3; k++) if(d.v[k] !== want[k]) wrong.push(names[k].toLowerCase());
    var list = wrong.length === 1 ? wrong[0] : wrong.slice(0, -1).join(", ") + " and " + wrong[wrong.length - 1];
    return "You made " + n + ". Have another look at the " + list + ".";
  }
  function solved(k, how){
    d.c = k + 1;
    var last = d.c >= 3;
    if(last) d.result = result();
    api.save();
    var head = how === "shown" ? "<b>Here it is.</b> " : "<b>Beep. The lift likes that.</b> ";
    var more = last ?
      '<p style="margin:8px 0 0">All three codes done. Hundreds, then tens, then ones.</p><button class="btn" type="button" data-r="next">Free play</button>' :
      '<button class="btn" type="button" data-r="next">Next code</button>';
    fb(how === "shown" ? "show" : "good", head + LIFT[k].why + more);
    q("next").onclick = function(){
      view = d.c; d.v = [0, 0, 0]; api.save();
      q("fb").className = "fb pv-fb hidden";
      draw();
    };
    draw();
    if(last) api.done(d.result);
  }
  el.querySelector(".pv-ctrl").addEventListener("click", function(e){
    var b = e.target.closest(".pv-b");
    if(!b || b.disabled) return;
    if(view !== d.c && d.c < 3) return;
    var k = +b.getAttribute("data-k"), dd = +b.getAttribute("data-d");
    d.v[k] = Math.max(0, Math.min(9, d.v[k] + dd));
    api.save(); draw();
  });
  q("go").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    if(val() === LIFT[view].n){ solved(view, "right"); return; }
    d.miss[view]++; api.save();
    fb("nudge", "<b>Not quite yet.</b> " + nudge() + (d.miss[view] > 1 ? " Show me is there if you want it." : ""));
    draw();
  };
  q("show").onclick = function(){
    if(view !== d.c || d.c >= 3) return;
    d.shown[view] = true;
    d.v = digits(LIFT[view].n);
    solved(view, "shown");
  };
  draw();
  if(d.c >= 3 && d.result){
    fb("good", "<b>All three codes done.</b> Hundreds, then tens, then ones. Play with the blocks as long as you like.");
    api.done(d.result);
  }
}
